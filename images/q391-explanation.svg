<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="t391 d391"><title id="t391">Sperm adaptations work together</title><desc id="d391">A schematic sperm has an acrosome at the head for penetration, a mitochondria-rich region supplying energy, and a flagellum providing movement.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#286346"/></marker></defs><rect width="960" height="440" rx="24" fill="#f7f5e9"/><style>text{font-family:Arial,sans-serif;fill:#183b2b;font-size:22px}.title{font-size:29px;font-weight:700}.small{font-size:19px}.strong{font-weight:700}.box{fill:#e0eddc;stroke:#60876b;stroke-width:2}.arrow{fill:none;stroke:#286346;stroke-width:4;marker-end:url(#arrow)}</style><text class="title" x="38" y="50">Sperm adaptations work together</text><ellipse cx="178" cy="219" rx="64" ry="47" fill="#d8e3c7" stroke="#286346" stroke-width="4"/><path d="M146 176 C99 189 99 248 146 261 L146 176" fill="#deb66f" stroke="#936d30" stroke-width="2"/><ellipse cx="182" cy="219" rx="30" ry="32" fill="#83ac75"/><rect x="242" y="205" width="115" height="28" rx="14" fill="#a9bd80" stroke="#286346" stroke-width="3"/><path d="M357 219 C466 145 552 291 663 218 S808 179 868 222" fill="none" stroke="#286346" stroke-width="8"/><path d="M121 179 L85 111" stroke="#60876b" stroke-width="2"/><text class="strong" x="40" y="96">Acrosome</text><text class="small" x="40" y="314">Enzymes help penetration</text><path d="M297 204 V121" stroke="#60876b" stroke-width="2"/><text class="strong" x="239" y="99">Mitochondria</text><text class="small" x="288" y="350">Respiration supplies energy</text><path d="M673 216 L719 125" stroke="#60876b" stroke-width="2"/><text class="strong" x="696" y="104">Flagellum</text><text class="small" x="650" y="314">Movement: sperm is motile</text><text class="small" x="282" y="404">Schematic, not to scale. The egg is non-motile and has no acrosome.</text></svg>