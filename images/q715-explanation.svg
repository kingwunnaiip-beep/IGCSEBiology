<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">The pollen image is 120 times its actual length</title><desc id="desc">A sculptured pollen grain has an image-length dimension of 60 mm. Its given actual length is 500 micrometres; the equivalent image length is 60000 micrometres.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">The pollen image is 120 times its actual length</text><ellipse cx="330" cy="305" rx="145" ry="175" fill="#e6d2a9" stroke="#c5824b" stroke-width="5"/><ellipse cx="303" cy="170" rx="10" ry="14" fill="#b99867" stroke="#c5824b" stroke-width="2"/><ellipse cx="342" cy="170" rx="10" ry="14" fill="#b99867" stroke="#c5824b" stroke-width="2"/><ellipse cx="381" cy="170" rx="10" ry="14" fill="#b99867" stroke="#c5824b" stroke-width="2"/><ellipse cx="235" cy="213" rx="10" ry="14" fill="#b99867" stroke="#c5824b" stroke-width="2"/><ellipse cx="274" cy="213" rx="10" ry="14" fill="#b99867" stroke="#c5824b" stroke-width="2"/><ellipse cx="313" cy="213" rx="10" ry="14" fill="#b99867" stroke="#c5824b" stroke-width="2"/><ellipse cx="352" cy="213" rx="10" ry="14" fill="#b99867" stroke="#c5824b" stroke-width="2"/><ellipse cx="391" cy="213" rx="10" ry="14" fill="#b99867" stroke="#c5824b" stroke-width="2"/><ellipse cx="225" cy="256" rx="10" ry="14" fill="#b99867" stroke="#c5824b" stroke-width="2"/><ellipse cx="264" cy="256" rx="10" ry="14" fill="#b99867" stroke="#c5824b" stroke-width="2"/><ellipse cx="303" cy="256" rx="10" ry="14" fill="#b99867" stroke="#c5824b" stroke-width="2"/><ellipse cx="342" cy="256" rx="10" ry="14" fill="#b99867" stroke="#c5824b" stro