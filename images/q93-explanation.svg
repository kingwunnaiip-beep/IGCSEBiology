<title id="q93-title">93 · Blood travelling to and from the placenta</title>
<desc id="q93-desc">Answer D: the umbilical artery has a low oxygen concentration and the umbilical vein has a low urea concentration. The umbilical artery carries fetal blood from the fetus to the placenta: it is lower in oxygen and nutrients and higher in carbon dioxide and urea than blood returning to the fetus. The umbilical vein carries blood from the placenta to the fetus: it is higher in oxygen and nutrients and lower in carbon dioxide and urea. Maternal and fetal blood normally remain in separate circulations. Across the placental exchange barrier, oxygen and glucose move towards fetal blood and carbon dioxide and urea move towards maternal blood. Red blood cells are confined to their own channels. All concentrations are relative and qualitative, not measured percentages.</desc>
