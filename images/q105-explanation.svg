<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1280" viewBox="0 0 1000 1280" role="img" aria-labelledby="q105-title q105-desc">
<title id="q105-title">105 · Glucose is reabsorbed from nephron filtrate</title>
<desc id="q105-desc">Answer D: reabsorption of glucose occurs as filtrate passes along the nephron. First, ultrafiltration in the glomerulus allows glucose and other small molecules to enter Bowman’s capsule. Blood cells and most plasma proteins remain in the blood. Second, useful glucose is selectively reabsorbed from the tubule into surrounding blood capillaries, mainly in the proximal convoluted tubule. In a healthy person with a normal blood glucose concentration, essentially all filtered glucose is reabsorbed. Urea is produced in the liver rather than the nephron. This is a simplified qualitative pathway, not anatomical scale or measured glucose concentrations. The red and blue arrows distinguish filtration from reabsorption and both their compartments are explicitly named.</desc>
