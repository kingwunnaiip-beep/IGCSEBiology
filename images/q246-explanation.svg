ght="142" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="825.0" y="363" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Bacteria</text><text x="825.0" y="403" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >respire</text><line x1="825" y1="308" x2="825" y2="235" stroke="#25614b" stroke-width="4"/><polygon points="825,235 831.9266876331222,248.30492384168926 818.0733123668778,248.30492384168926" fill="#25614b"/><text x="850" y="281" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >respiration</text><rect x="65" y="509" width="870" height="104" rx="12" fill="white" stroke="#526c62" stroke-width="2"/><text x="500" y="549" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Fossil fuels: not a living group</text><text x="500" y="585" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Combustion releases CO₂, but does not add a fourth group.</text><rect x="24" y="654" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="688" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C — plants + animals + bacteria = 3 living groups</text>
