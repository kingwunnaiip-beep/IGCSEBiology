m="translate(570 415) scale(1.1)"><circle cx="0" cy="0" r="13" fill="#cfe5ec" stroke="#537c9a" stroke-width="3"/><circle cx="-15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/><circle cx="15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/></g><g transform="translate(670 415) scale(1.1)"><circle cx="0" cy="0" r="13" fill="#cfe5ec" stroke="#537c9a" stroke-width="3"/><circle cx="-15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/><circle cx="15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/></g><g transform="translate(770 415) scale(1.1)"><circle cx="0" cy="0" r="13" fill="#cfe5ec" stroke="#537c9a" stroke-width="3"/><circle cx="-15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/><circle cx="15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/></g><g transform="translate(870 415) scale(1.1)"><circle cx="0" cy="0" r="13" fill="#cfe5ec" stroke="#537c9a" stroke-width="3"/><circle cx="-15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/><circle cx="15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/></g><path d="M365 300 H465" fill="none" stroke="#24644b" stroke-width="5" marker-end="url(#arrow)"/><text x="200" y="440" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">Each glucose gives 6 H₂O.</text><text x="720" y="500" font-size="30" fill="#173f32" text-anchor="middle" font-weight="700">2 × 6 = 12</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">2C₆H₁₂O₆ + 12O₂ → 12CO₂ + 12H₂O  • D</text></g></svg>