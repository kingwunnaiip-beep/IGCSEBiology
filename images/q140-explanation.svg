<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1390" viewBox="0 0 1000 1390" role="img" aria-labelledby="q140-title q140-desc">
<title id="q140-title">140 · An ecosystem links organisms and environment</title>
<desc id="q140-desc">Answer B: ecosystem. The source coral-reef description includes organisms such as stony corals, sponges, seahorses and whale sharks, and abiotic conditions such as temperature, salt concentration and dissolved oxygen. An ecosystem includes the community of organisms, their physical environment, and their interactions. A community includes all the populations of different species in the area, without the abiotic environment in its definition. A population is one species in an area at a given time. A food web describes feeding relationships. The named organisms are examples from the source description, not counts of species or individual animals.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
