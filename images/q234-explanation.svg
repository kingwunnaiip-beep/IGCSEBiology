<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="q234-title q234-desc">
<title id="q234-title">Read the enzyme optimum from the pH axis</title>
<desc id="q234-desc">Qualitative interpretation of the source graph, without inventing another measured curve. The source maximum lies below pH 7, so it is acidic. Neutral pH is 7 and alkaline values are above 7. Temperature cannot be inferred from a pH graph.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="690" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Read the enzyme optimum from the pH axis</text><text x="500" y="102" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >The highest point of the source curve lies below pH 7.</text><rect x="70" y="165" width="400" height="100" rx="0" fill="#f8ead2" stroke="#daa958" stroke-width="2"/><rect x="470" y="165" width="80" height="100" rx="0" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><rect x="550" y="165" width="380" height="100" rx="0" fill="#e8f2f8" stroke="#357ca2" stroke-width="2"/><text x="270" y="205" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >ACIDIC</text><text x="270" y="243" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >pH below 7</text><text x="510" y="225" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >7</text><text x="740" y="205" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >ALKALINE</text><text x="740" y="243" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >pH above 7</text><text x="510" y="309" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >neutral</text><line x1="270" y1="365" x2="270" y2="277" stroke="#25614b" stroke-width="4"/><polygon points="270,277 276.92668763312224,290.3049238416893 263.07331236687776,290.3049238416893" fill="#25614b"/><text x="270" y="402" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Source peak is here</text><text x="500" y="464" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >This strip identifies pH regions; it is not a new activity curve.</text><rect x="105" y="502" width="790" height="76" rx="12" fill="white" stroke="#526c62" stroke-width="2"/><text x="500" y="533" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >No temperature axis → no conclusion about heat damage.</text><text x="500" y="565" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Changing activity → the enzyme is affected by pH.</text><rect x="24" y="614" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="648" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B — most active in acidic conditions</text>
</g></svg>