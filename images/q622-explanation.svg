<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Unnecessary use selects resistant bacteria</title><desc id="desc">Three petri dishes show a mixed population, susceptible bacteria killed by antibiotic exposure, and resistant survivors reproducing. The selected practices are 1 and 4, unnecessary preventive use in the question and antibiotic use for a viral infection.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="53" font-size="31" text-anchor="start" font-weight="bold" fill="#173f32">Unnecessary use selects resistant bacteria</text><circle cx="170" cy="320" r="135" fill="#f2f5e7" stroke="#537c9a" stroke-width="3"/><circle cx="500" cy="320" r="135" fill="#f2f5e7" stroke="#537c9a" stroke-width="3"/><circle cx="830" cy="320" r="135" fill="#f2f5e7" stroke="#537c9a" stroke-width="3"/><g transform="translate(110 260) rotate(0)"><rect x="-20" y="-9" width="40" height="18" rx="9" fill="#24644b" stroke="#173f32" stroke-width="1.5"/><path d="M-11 -2 Q0 7 11 -2" fill="none" stroke="#fff" stroke-width="2"/></g><g transform="translate(190 250) rotate(20)"><rect x="-20" y="-9" width="40" height="18" rx="9" fill="#24644b" stroke="#173f32" stroke-width="1.5"/><path d="M-11 -2 Q0 7 11 -2" fill="none" stroke="#fff" stroke-width="2"/></g><g transform="translate(235 315) rotate(40)"><rect x="-20" y="-9" width="40" height="18" rx="9" fill="#bb6066" stroke="#173f32" stroke-width="1.5"/><path d="M-1