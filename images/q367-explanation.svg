<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Vitamin C decolourises DCPIP</title><desc id="desc">Blue DCPIP becomes colourless when vitamin C is added. Heating is not required. A sample without vitamin C does not remove the blue colour.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L8 3 Z" fill="#245c43"/></marker></defs>
<rect width="1000" height="600" rx="24" fill="#fbf8ec"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="42" y="58" font-size="32" text-anchor="start" fill="#173f31" font-weight="bold">Vitamin C decolourises DCPIP</text><text x="245" y="135" font-size="28" text-anchor="middle" fill="#173f31" font-weight="bold">Before</text><text x="755" y="135" font-size="28" text-anchor="middle" fill="#173f31" font-weight="bold">Positive result</text><path d="M180 170 V365 Q180 420 245 420 Q310 420 310 365 V170" fill="#358ec2" stroke="#245c43" stroke-width="4"/><path d="M690 170 V365 Q690 420 755 420 Q820 420 820 365 V170" fill="#ffffff" stroke="#245c43" stroke-width="4"/><text x="245" y="463" font-size="26" text-anchor="middle" fill="#173f31" font-weight="normal">Blue DCPIP</text><text x="755" y="463" font-size="26" text-anchor="middle" fill="#173f31" font-weight="normal">Colourless</text><path d="M370 285 L630 285" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><text x="500" y="248" font-size="26" text-anchor="middle" fill="#173f31" font-weight="bold">Add vitamin C</text><rect x="70" y="510" width="400" height="60" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="270" y="550" font-size="27" text-anchor="middle" fill="#173f31" font-weight="bold">No heating required</text><rect x="510" y="510" width="420" height="60" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="720" y="550" font-size="25" text-anchor="middle" fill="#173f31" font-weight="normal">No vitamin C: stays blue</text></g></svg>