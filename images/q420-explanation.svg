<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">FSH supports follicle growth and maturation</title><desc id="desc">The pituitary gland releases FSH. Three progressively larger ovarian follicles, each containing an egg cell, show follicle growth and maturation. A separate note identifies LH surge as the later trigger for ovulation.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#327153"/></marker></defs><rect width="960" height="540" rx="24" fill="#faf9ef"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="49" text-anchor="start" fill="#163d31" font-size="30" font-weight="bold">FSH supports follicle growth and maturation</text><text x="36" y="87" text-anchor="start" fill="#163d31" font-size="23" font-weight="normal">The target of FSH is the developing ovarian follicle.</text><rect x="36" y="121" width="218" height="102" rx="18" fill="#e1eddf" stroke="#327153" stroke-width="2"/><text x="145" y="162" text-anchor="middle" fill="#163d31" font-size="25" font-weight="bold">Pituitary gland</text><text x="145" y="199" text-anchor="middle" fill="#163d31" font-size="23" font-weight="normal">releases FSH</text><path d="M270 172 L390 172" fill="none" stroke="#327153" stroke-width="4"/><path d="M380 165 L390 172 L380 179" fill="none" stroke="#327153" stroke-width="4"/><text x="329" y="145" text-anchor="middle" fill="#163d31" font-size="24" font-weight="bold">FSH</text><circle cx="454" cy="262" r="36" fill="#e1eddf" stroke="#327153" stroke-width="3"/><circle cx="454" cy="262" r="14" fill="#fff9e4" stroke="#327153" stroke-width="3"/><text x="454" y="366" text-anchor="middle" fill="#163d31" font-size="22" font-weight="normal">small follicle</text><circle cx="636" cy="262" r="54" fill="#e1eddf" stroke="#327153" stroke-width="3"/><circle cx="636" cy="262" r="14" fill="#fff9e4" stroke="#327153" stroke-width="3"/><text x="636" y="366" text-anchor="middle" fill="#163d31" font-size="22" font-weight="normal">growing follicle</text><circle cx="828" cy="262" r="72" fill="#e1eddf" stroke="#327153" stroke-width="3"/><circle cx="828" cy="262" r="14" fill="#fff9e4" stroke="#327153" stroke-width="3"/><text x="828" y="366" text-anchor="middle" fill="#163d31" font-size="22" font-weight="normal">mature follicle</text><path d="M502 262 L567 262" fill="none" stroke="#327153" stroke-width="4"/><path d="M557 255 L567 262 L557 269" fill="none" stroke="#327153" stroke-width="4"/><path d="M701 262 L740 262" fill="none" stroke="#327153" stroke-width="4"/><path d="M730 255 L740 262 L730 269" fill="none" stroke="#327153" stroke-width="4"/><path d="M414 172 L828 172" fill="none" stroke="#327153" stroke-width="3"/><path d="M828 172 L828 181" fill="none" stroke="#327153" stroke-width="3"/><rect x="95" y="412" width="770" height="58" rx="18" fill="#e1eddf" stroke="#327153" stroke-width="2"/><text x="480" y="450" text-anchor="middle" fill="#163d31" font-size="26" font-weight="bold">Later: an LH surge triggers ovulation.</text><text x="36" y="517" text-anchor="start" fill="#587064" font-size="17" font-weight="normal">Original teaching schematic • not to scale</text></g></svg>