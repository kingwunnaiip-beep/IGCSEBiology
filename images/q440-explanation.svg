<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Vesicles release; receptors receive</title><desc id="desc">At a sensory-to-relay synapse, vesicles in the sensory neurone release neurotransmitter. It diffuses across the synaptic gap and binds to receptor proteins on the relay neurone membrane. Receptor proteins are not released.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#397857"/></marker></defs><rect width="900" height="520" rx="22" fill="#fbfaee"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="28" text-anchor="start" fill="#183e31" font-weight="bold">Vesicles release; receptors receive</text><rect x="70" y="100" width="760" height="120" rx="18" fill="#dcebbf" stroke="#4c7957" stroke-width="2"/><rect x="70" y="320" width="760" height="110" rx="18" fill="#dcebbf" stroke="#4c7957" stroke-width="2"/><text x="450" y="133" font-size="24" text-anchor="middle" fill="#183e31" font-weight="bold">Sensory neurone ending</text><text x="450" y="400" font-size="24" text-anchor="middle" fill="#183e31" font-weight="bold">Relay neurone membrane</text><circle cx="240" cy="181" r="23" fill="#fbfaee" stroke="#4c7957" stroke-width="3"/><circle cx="233" cy="181" r="4" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="247" cy="181" r="4" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="350" cy="181" r="23" fill="#fbfaee" stroke="#4c7957" stroke-width="3"/><circle cx="343" cy="181" r="4" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="357" cy="181" r="4" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="460" cy="181" r="23" fill="#fbfaee" stroke="#4c7957" stroke-width="3"/><circle cx="453" cy="181" r="4" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="467" cy="181" r="4" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="470" cy="270" r="7" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="520" cy="270" r="7" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="570" cy="270" r="7" fill="#5b9664" stroke="none" stroke-width="3"/><path d="M460 220 L460 252" fill="none" stroke="#397857" stroke-width="4" marker-end="url(#arrow)"/><path d="M570 282 L570 313" fill="none" stroke="#397857" stroke-width="4" marker-end="url(#arrow)"/><path d="M458 320 L458 345 L482 345 L482 320" fill="none" stroke="#397857" stroke-width="5"/><path d="M508 320 L508 345 L532 345 L532 320" fill="none" stroke="#397857" stroke-width="5"/><path d="M558 320 L558 345 L582 345 L582 320" fill="none" stroke="#397857" stroke-width="5"/><text x="115" y="266" font-size="20" text-anchor="start" fill="#183e31" font-weight="normal">Vesicles release</text><text x="115" y="294" font-size="20" text-anchor="start" fill="#183e31" font-weight="normal">neurotransmitter</text><text x="660" y="265" font-size="19" text-anchor="start" fill="#183e31" font-weight="normal">Synaptic gap</text><text x="640" y="352" font-size="19" text-anchor="start" fill="#183e31" font-weight="normal">Receptors bind</text><text x="450" y="480" font-size="23" text-anchor="middle" fill="#183e31" font-weight="bold">Electrical impulse → chemical signal → electrical impulse</text></g></svg>