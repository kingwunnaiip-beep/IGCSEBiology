<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Cut, match sticky ends, then join the DNA</title><desc id="desc">An opened plasmid and a cut gene have matching sticky ends. DNA ligase joins the gene into the plasmid, creating a recombinant plasmid with a visibly different-coloured inserted segment.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="53" font-size="31" text-anchor="start" font-weight="bold" fill="#173f32">Cut, match sticky ends, then join the DNA</text><path d="M260 215 A105 105 0 1 0 295 270" fill="none" stroke="#24644b" stroke-width="10"/><path d="M260 215 l25 8 l-6 20" fill="none" stroke="#24644b" stroke-width="5"/><path d="M295 270 l-24 -10 l6 -18" fill="none" stroke="#24644b" stroke-width="5"/><circle cx="288" cy="155" r="15" fill="none" stroke="#24644b" stroke-width="3"/><circle cx="325" cy="155" r="15" fill="none" stroke="#24644b" stroke-width="3"/><path d="M293 168 L338 207" fill="none" stroke="#24644b" stroke-width="4"/><path d="M321 168 L280 206" fill="none" stroke="#24644b" stroke-width="4"/><text x="215" y="120" font-size="25" text-anchor="middle" font-weight="bold" fill="#173f32">Restriction enzyme</text><text x="210" y="445" font-size="25" text-anchor="middle" font-weight="normal" fill="#173f32">Opened plasmid</text><path d="M405 270 H520 V250 H570" fill="none" stroke="#537c9a" stroke-width="8"/><path d="M405 300 H450 V320 H570" fill="none" stroke="#537c9a" stroke-width="8"/><path d="M425 273 L425 297" fill="none" stroke="#537c9a" stroke-width="3"/><path d="M450 273 L450 297" fill="none" stroke="#537c9a" stroke-width="3"/><path d="M475 273 L475 297" fill="none" stroke="#537c9a" stroke-width="3"/><path d="M500 273 L500 297" fill="none" stroke="#537c9a" stroke-width="3"/><path d="M525 273 L525 297" fill="none" stroke="#537c9a" stroke-width="3"/><path d="M550 273 L550 297" fill="none" stroke="#537c9a" stroke-width="3"/><text x="490" y="210" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">Gene</text><text x="485" y="375" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">Matching sticky ends</text><path d="M590 290 L645 290" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><circle cx="805" cy="300" r="115" fill="none" stroke="#24644b" stroke-width="10"/><path d="M805 185 A115 115 0 0 1 920 300" fill="none" stroke="#537c9a" stroke-width="12"/><text x="805" y="295" font-size="24" text-anchor="middle" font-weight="normal" fill="#173f32">new</text><text x="805" y="328" font-size="24" text-anchor="middle" font-weight="normal" fill="#173f32">gene</text><text x="805" y="465" font-size="25" text-anchor="middle" font-weight="bold" fill="#173f32">Recombinant plasmid</text><text x="620" y="155" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">Ligase seals the backbone</text><text x="500" y="553" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">D: restriction → sticky ends → ligase → recombinant</text></g></svg>