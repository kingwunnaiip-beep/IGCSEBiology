"80" ry="30" fill="#d2dfc9" stroke="#24644b" stroke-width="4"/><text x="710" y="445" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">3: ribosome</text><circle cx="745" cy="280" r="9" fill="#e4ae74" stroke="#c5824b" stroke-width="2"/><circle cx="762" cy="263" r="9" fill="#e4ae74" stroke="#c5824b" stroke-width="2"/><circle cx="779" cy="246" r="9" fill="#e4ae74" stroke="#c5824b" stroke-width="2"/><circle cx="796" cy="229" r="9" fill="#e4ae74" stroke="#c5824b" stroke-width="2"/><circle cx="813" cy="212" r="9" fill="#e4ae74" stroke="#c5824b" stroke-width="2"/><circle cx="830" cy="195" r="9" fill="#e4ae74" stroke="#c5824b" stroke-width="2"/><circle cx="847" cy="178" r="9" fill="#e4ae74" stroke="#c5824b" stroke-width="2"/><circle cx="864" cy="161" r="9" fill="#e4ae74" stroke="#c5824b" stroke-width="2"/><text x="720" y="495" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">Amino acids are assembled</text><text x="720" y="526" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">into a protein.</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">B: statements 1 and 3 only; mRNA does not remain in the nucleus</text></g></svg>