<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="t393 d393"><title id="t393">Red × roan: follow the gametes</title><desc id="d393">The red parent gives only HR gametes. The roan parent gives HR or HW with equal probability. Their offspring are 50 percent HRHR red and 50 percent HRHW roan.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#286346"/></marker></defs><rect width="960" height="440" rx="24" fill="#f7f5e9"/><style>text{font-family:Arial,sans-serif;fill:#183b2b;font-size:22px}.title{font-size:29px;font-weight:700}.small{font-size:19px}.strong{font-weight:700}.box{fill:#e0eddc;stroke:#60876b;stroke-width:2}.arrow{fill:none;stroke:#286346;stroke-width:4;marker-end:url(#arrow)}</style><text class="title" x="38" y="50">Red × roan: follow the gametes</text><text class="strong" x="58" y="103">Red parent: HᴿHᴿ</text><text x="58" y="144">Gametes: Hᴿ only</text><text class="strong" x="529" y="103">Roan parent: HᴿHᵂ</text><text x="529" y="144">Gametes: ½ Hᴿ and ½ Hᵂ</text><path class="arrow" d="M227 169 L241 216"/><path class="arrow" d="M665 169 L709 216"/><rect class="box" x="58" y="232" width="371" height="131" rx="15"/><text class="strong" x="82" y="273">Hᴿ + Hᴿ → HᴿHᴿ</text><text x="82" y="319">50% RED</text><rect class="box" x="529" y="232" width="371" height="131" rx="15"/><text class="strong" x="553" y="273">Hᴿ + Hᵂ → HᴿHᵂ</text><text x="553" y="319">50% ROAN</text><text class="small" x="166" y="412">No HᵂHᵂ: the red parent cannot supply a white-hair allele.</text></svg>