<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1550" viewBox="0 0 1000 1550" role="img" aria-labelledby="q88-title q88-desc">
<title id="q88-title">88 · Produce waste, then excrete it</title>
<desc id="q88-desc">Answer C. V is aerobic respiration: cells, including liver cells, produce carbon dioxide. Carbon dioxide is carried in blood to X, the lungs, and exhaled. The liver receives excess amino acids. W is deamination, removal of the nitrogen-containing amino group, which produces ammonia. The liver then converts toxic ammonia into Y, urea. Urea is carried in the blood to Z, the kidneys. The kidneys excrete urea, excess mineral ions and water in urine. The liver produces urea; the kidneys excrete it. Organ drawings are schematic. The aerobic respiration word equation is glucose plus oxygen gives carbon dioxide plus water, with energy released.</desc>
