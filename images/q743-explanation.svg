<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">DNA doubles before mitosis, then returns per daughter cell</title><desc id="desc">A graph rises from the starting DNA mass to twice that mass before division and falls to the starting mass per daughter cell. Drawn nuclei show single chromosomes, copied chromosomes and two daughter nuclei.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">DNA doubles before mitosis, then returns per daughter cell</text><path d="M130 370 V150" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M130 370 H870" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="60" y="130" font-size="23" fill="#173f32" text-anchor="start" font-weight="400">DNA mass per cell</text><text x="910" y="410" font-size="23" fill="#173f32" text-anchor="end" font-weight="400">Time</text><path d="M150 320 H340 L430 180 H650 V320 H850" fill="none" stroke="#24644b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="326" font-size="24" fill="#173f32" text-anchor="end" font-weight="700">4</text><text x="100" y="187" font-size="24" fill="#173f32" text-anchor="end" font-weight="700">8</text><path d="M120 320 H860 M120 180 H860" fill="none" stroke="#bdcaba" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"/><circle cx="220" cy="460" r="48" fill="#f6f8ed" stroke="#24644b" stroke-width="3"/><path d="M202 438 V482" fill="none" stroke="#24644b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M236 438 V482" fill="none" stroke="#537c9a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="500" cy="460" r="48" fill="#f6f8ed" stroke="#24644b" stroke-width="3"/><path d="M475 440 L489 480 M489 440 L475 480" fill="none" stroke="#24644b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M509 440 L523 480 M523 440 L509 480" fill="none" stroke="#537c9a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="795" cy="436" r="32" fill="#f6f8ed" stroke="#24644b" stroke-width="3"/><path d="M777 414 V458" fill="none" stroke="#24644b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M811 414 V458" fill="none" stroke="#537c9a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="865" cy="478" r="32" fill="#f6f8ed" stroke="#24644b" stroke-width="3"/><path d="M847 456 V500" fill="none" stroke="#24644b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M881 456 V500" fill="none" stroke="#537c9a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="530" font-size="22" fill="#173f32" text-anchor="middle" font-weight="400">Before copying</text><text x="500" y="530" font-size="22" fill="#173f32" text-anchor="middle" font-weight="400">DNA copied</text><text x="820" y="530" font-size="22" fill="#173f32" text-anchor="middle" font-weight="400">Two daughter cells</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">B: DNA mass per cell follows 4 → 8 → 4</text></g></svg>