<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">What is a structural feature of xylem vessels?</title><desc id="desc">Cells join end to end: Vessel elements are dead at maturity; End walls are lost: A continuous hollow tube allows water flow; Lignified side walls: Strengthen vessels and prevent collapse</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">What is a structural feature of xylem vessels?</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="50" y="190" font-size="23" font-weight="700">Cells join end to end</text><text x="50" y="276" font-size="21" font-weight="400">Vessel elements are dead at</text><text x="50" y="303" font-size="21" font-weight="400">maturity</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="405" y="190" font-size="23" font-weight="700">End walls are lost</text><text x="405" y="276" font-size="21" font-weight="400">A continuous hollow tube</text><text x="405" y="303" font-size="21" font-weight="400">allows water flow</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="760" y="190" font-size="23" font-weight="700">Lignified side walls</text><text x="760" y="276" font-size="21" font-weight="400">Strengthen vessels and</text><text x="760" y="303" font-size="21" font-weight="400">prevent collapse</text><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>