<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="q309-title q309-desc">
<title id="q309-title">Identify the vessels, then follow the blood</title>
<desc id="q309-desc">Source vessel 1 has a thick muscular wall and is an artery. Vessel 3 has a wall one cell thick and is a capillary. Vessel 2 has a thinner wall and larger lumen and is a vein. Blood travels artery to capillary to vein.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="790" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Identify the vessels, then follow the blood</text><text x="210" y="120" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >1 — Artery</text><circle cx="210" cy="245" r="86" fill="#cce1d2" stroke="#25614b" stroke-width="3"/><circle cx="210" cy="245" r="39" fill="#fffdf7" stroke="#25614b" stroke-width="3"/><text x="560" y="120" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >3 — Capillary</text><circle cx="560" cy="245" r="76" fill="#fffdf7" stroke="#25614b" stroke-width="10"/><text x="560" y="253" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >lumen</text><text x="910" y="120" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >2 — Vein</text><circle cx="910" cy="245" r="86" fill="#dbe4ee" stroke="#357ca2" stroke-width="3"/><circle cx="910" cy="245" r="69" fill="#fffdf7" stroke="#357ca2" stroke-width="3"/><line x1="315" y1="245" x2="455" y2="245" stroke="#25614b" stroke-width="4"/><polygon points="455,245 441.6950761583107,251.92668763312224 441.6950761583107,238.07331236687776" fill="#25614b"/><line x1="665" y1="245" x2="805" y2="245" stroke="#25614b" stroke-width="4"/><polygon points="805,245 791.6950761583107,251.92668763312224 791.6950761583107,238.07331236687776" fill="#25614b"/><text x="210" y="375" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Thick wall</text><text x="210" y="415" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Withstands high pressure</text><text x="560" y="375" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Wall one cell thick</text><text x="560" y="415" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Short diffusion distance</text><text x="910" y="375" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Thinner wall</text><text x="910" y="415" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Relatively large lumen</text><text x="560" y="480" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative sections: sizes are not comparable between vessels.</text><rect x="60" y="530" width="270" height="110" rx="12" fill="#edf3fa" stroke="#25614b" stroke-width="2"/><text x="195.0" y="573" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >From aorta</text><rect x="790" y="530" width="270" height="110" rx="12" fill="#edf3fa" stroke="#25614b" stroke-width="2"/><text x="925.0" y="573" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >To right atrium</text><line x1="345" y1="585" x2="420" y2="585" stroke="#25614b" stroke-width="4"/><polygon points="420,585 406.6950761583107,591.9266876331222 406.6950761583107,578.0733123668778" fill="#25614b"/><line x1="690" y1="585" x2="775" y2="585" stroke="#25614b" stroke-width="4"/><polygon points="775,585 761.6950761583107,591.9266876331222 761.6950761583107,578.0733123668778" fill="#25614b"/><text x="560" y="597" font-size="35" fill="#173d31" font-weight="700" text-anchor="middle" >1 → 3 → 2</text><rect x="24" y="714" width="1072" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="560.0" y="748" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Artery → capillary → vein: option B</text>
</g></svg>