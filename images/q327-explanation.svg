<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="q327-title q327-desc">
<title id="q327-title">Chemical digestion breaks molecules apart</title>
<desc id="q327-desc">A large insoluble molecule is split by enzymes into smaller soluble molecules. This chemical change differs from absorption, which moves soluble products across the intestinal wall.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="700" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Chemical digestion breaks molecules apart</text><text x="280" y="145" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Large insoluble molecule</text><circle cx="115" cy="240" r="29" fill="#e6cc8c" stroke="#97712b" stroke-width="3"/><line x1="144" y1="240" x2="151" y2="240" stroke="#97712b" stroke-width="5"/><circle cx="180" cy="240" r="29" fill="#e6cc8c" stroke="#97712b" stroke-width="3"/><line x1="209" y1="240" x2="216" y2="240" stroke="#97712b" stroke-width="5"/><circle cx="245" cy="240" r="29" fill="#e6cc8c" stroke="#97712b" stroke-width="3"/><line x1="274" y1="240" x2="281" y2="240" stroke="#97712b" stroke-width="5"/><circle cx="310" cy="240" r="29" fill="#e6cc8c" stroke="#97712b" stroke-width="3"/><line x1="339" y1="240" x2="346" y2="240" stroke="#97712b" stroke-width="5"/><circle cx="375" cy="240" r="29" fill="#e6cc8c" stroke="#97712b" stroke-width="3"/><line x1="404" y1="240" x2="411" y2="240" stroke="#97712b" stroke-width="5"/><circle cx="440" cy="240" r="29" fill="#e6cc8c" stroke="#97712b" stroke-width="3"/><line x1="500" y1="240" x2="650" y2="240" stroke="#25614b" stroke-width="5"/><polygon points="650,240 636.6950761583107,246.92668763312224 636.6950761583107,233.07331236687776" fill="#25614b"/><text x="575" y="310" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >enzymes break</text><text x="575" y="350" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >chemical bonds</text><circle cx="735" cy="190" r="27" fill="#d0e6bf" stroke="#25614b" stroke-width="3"/><circle cx="830" cy="270" r="27" fill="#d0e6bf" stroke="#25614b" stroke-width="3"/><circle cx="925" cy="185" r="27" fill="#d0e6bf" stroke="#25614b" stroke-width="3"/><circle cx="990" cy="295" r="27" fill="#d0e6bf" stroke="#25614b" stroke-width="3"/><text x="850" y="410" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Smaller soluble molecules</text><rect x="100" y="450" width="900" height="105" rx="12" fill="#e4eef2" stroke="#357ca2" stroke-width="2"/><text x="550" y="490" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >After digestion, absorption moves the products</text><text x="550" y="530" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >through the wall of the small intestine.</text><rect x="24" y="624" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="658" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >A: large insoluble → smaller soluble molecules</text>
</g></svg>