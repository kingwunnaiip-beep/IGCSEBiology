<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Hormone pollution can alter sexual development</title><desc id="desc">A pathway connects excreted hormones in wastewater to active residues in aquatic water, followed by disrupted reproductive signalling in aquatic organisms. A schematic fish is exposed to hormone symbols; no measured concentration is implied.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#185c44"/></marker></defs><rect width="1000" height="640" rx="24" fill="#faf8ec"/><g font-family="Arial, sans-serif"><text x="40" y="54" font-size="31" text-anchor="start" fill="#193e33" font-weight="bold">Hormone pollution can alter sexual development</text><rect x="45" y="135" width="260" height="115" rx="18" fill="#dcefdc" stroke="#185c44" stroke-width="3"/><text x="175" y="179" font-size="24" text-anchor="middle" fill="#193e33" font-weight="normal">Hormones excreted</text><text x="175" y="213" font-size="24" text-anchor="middle" fill="#193e33" font-weight="normal">into wastewater</text><path d="M312 193 L365 193" stroke="#185c44" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="375" y="135" width="250" height="115" rx="18" fill="#dcefdc" stroke="#185c44" stroke-width="3"/><text x="500" y="179" font-size="24" text-anchor="middle" fill="#193e33" font-weight="normal">Active residues</text><text x="500" y="213" font-size="24" text-anchor="middle" fill="#193e33" font-weight="normal">reach aquatic water</text><path d="M632 193 L685 193" stroke="#185c44" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="695" y="135" width="260" height="115" rx="18" fill="#dcefdc" stroke="#185c44" stroke-width="3"/><text x="825" y="179" font-size="24" text-anchor="middle" fill="#193e33" font-weight="normal">Reproductive</text><text x="825" y="213" font-size="24" text-anchor="middle" fill="#193e33" font-weight="normal">signalling disrupted</text><path d="M70 340 Q280 285 500 340 T930 340 L930 475 Q700 530 500 475 T70 475 Z" fill="#c7e1dd" stroke="#619c97" stroke-width="3"/><circle cx="210" cy="363" r="9" fill="#bd8d35"/><circle cx="335" cy="422" r="9" fill="#bd8d35"/><circle cx="600" cy="356" r="9" fill="#bd8d35"/><circle cx="720" cy="430" r="9" fill="#bd8d35"/><path d="M490 405 Q580 325 680 405 Q580 485 490 405 L445 365 L445 445 Z" fill="#7aa68b" stroke="#185c44" stroke-width="4"/><circle cx="647" cy="395" r="5" fill="#193e33"/><text x="500" y="556" font-size="27" text-anchor="middle" fill="#193e33" font-weight="bold">Female hormones are the most direct explanation</text><text x="500" y="597" font-size="26" text-anchor="middle" fill="#193e33" font-weight="normal">for feminisation among the four suggested pollutants.</text></g></svg>