<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which pair has the most recent common ancestor in this classification?</title><desc id="desc">The animal classification splits into arthropods and vertebrates. Lizard and parrot, pair C, share the vertebrate branch; the other answer pairs cross the main split and have a more distant common grouping.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e" /></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8" /><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Which pair has the most recent common ancestor in this</text><text x="38" y="73" font-size="24" font-weight="700">classification?</text><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text><rect x="410" y="110" width="260" height="65" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="540" y="152" font-size="25" font-weight="700" text-anchor="middle">Animals</text><path d="M540 175 V195 H255 V220" fill="none" stroke="#35735e" stroke-width="3" /><path d="M540 195 H825 V220" fill="none" stroke="#35735e" stroke-width="3" /><rect x="40" y="220" width="430" height="115" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="255" y="255" font-size="24" font-weight="700" text-anchor="middle">Arthropods</text><text x="255" y="290" font-size="21" font-weight="400" text-anchor="middle">Centipede • flea • spider</text><text x="255" y="317" font-size="21" font-weight="400" text-anchor="middle">No backbone</text><rect x="610" y="220" width="430" height="115" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="825" y="255" font-size="24" font-weight="700" text-anchor="middle">Vertebrates</text><text x="825" y="290" font-size="21" font-weight="400" text-anchor="middle">Lizard + parrot (pair C)</text><text x="825" y="317" font-size="21" font-weight="400" text-anchor="middle">Both have backbones</text><text x="540" y="371" font-size="23" font-weight="700" text-anchor="middle">A, B and D cross the main split; C joins within vertebrates.</text></g></svg>