<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">X carries blood from the right ventricle to lungs</title><desc id="desc">A heart with a blue right ventricle connects via the blue pulmonary artery X to a pair of lungs. Flow arrows leave the heart and point towards the lungs.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="53" font-size="31" text-anchor="start" font-weight="bold" fill="#173f32">X carries blood from the right ventricle to lungs</text><g transform="translate(260 350) scale(1.0)"><path d="M0 140 C-160 65 -190 -85 -100 -130 C-35 -160 -5 -100 0 -65 C10 -110 65 -165 125 -105 C190 -40 125 100 0 140" fill="#e8c5bb" stroke="#8c685c" stroke-width="5"/><path d="M-15 100 C-115 30 -140 -55 -92 -86 C-47 -115 -18 -45 -15 100" fill="#dcecf4" stroke="#537c9a" stroke-width="3"/><path d="M18 100 C115 38 135 -40 95 -78 C58 -112 25 -75 18 100" fill="#efd2cc" stroke="#bb6066" stroke-width="3"/><path d="M0 -65 L0 140" fill="none" stroke="#f9f3df" stroke-width="18"/></g><path d="M235 390 V185 Q235 145 285 145 H680 V225" fill="none" stroke="#537c9a" stroke-width="18"/><path d="M680 185 H825 V225" fill="none" stroke="#537c9a" stroke-width="14"/><path d="M360 145 L520 145" fill="none" stroke="#537c9a" stroke-width="5" marker-end="url(#blueArrow)"/><path d="M730 155 V230 L680 280 M730 230 L790 280" fill="none" stroke="#9a9e86" stroke-width="14"/><path d="M680 220 C620 230 580 330 625 420 Q670 450 713 410 V250 Z" fill="#ead5cd" stroke="#a67d76" stroke-width="4"/><path d="M790 220 C850 230 890 330 845 420 Q800 450 747 410 V250 Z" fill="#ead5cd" stroke="#a67d76" stroke-width="4"/><path d="M685 255 v75 l-45 45 M685 295 l-30 25 M685 330 v65" fill="none" stroke="#9a9e86" stroke-width="5"/><path d="M780 255 v75 l45 45 M780 295 l30 25 M780 330 v65" fill="none" stroke="#9a9e86" stroke-width="5"/><text x="500" y="110" font-size="28" text-anchor="middle" font-weight="bold" fill="#173f32">X: pulmonary artery</text><text x="740" y="490" font-size="28" text-anchor="middle" font-weight="bold" fill="#173f32">Lungs</text><text x="150" y="510" font-size="25" text-anchor="start" font-weight="normal" fill="#173f32">Right ventricle</text><path d="M230 490 L220 410" fill="none" stroke="#537c9a" stroke-width="2" marker-end="url(#blueArrow)"/><text x="500" y="553" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">B: pulmonary artery; towards the lungs</text><text x="500" y="586" font-size="20" text-anchor="middle" font-weight="normal" fill="#173f32">Blue indicates deoxygenated blood in this diagram.</text></g></svg>