<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1300" viewBox="0 0 1000 1300" role="img" aria-labelledby="q137-title q137-desc">
<title id="q137-title">137 · Each parent passes on one sex chromosome</title>
<desc id="q137-desc">Answer B. In the source Punnett-square model, the XX parent makes gametes containing X only, and the XY parent makes gametes containing X or Y. The table has X and X across the top and X and Y down the left. Combining the gametes gives XX and XX in the first row, and XY and XY in the second row. The four cells are equally likely, producing an expected one-to-one ratio of XX to XY offspring. This shows sex chromosome inheritance, not an allele for a sex-linked disease. The ratio is a probability model rather than a guarantee for a family.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1300" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >137 · Each parent passes on one sex chromosome</text><text x="500" y="111" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >XX parent → gametes contain X only.</text><text x="500" y="155" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >XY parent → gametes contain X or Y.</text><text x="600" y="251" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >XX parent’s gametes</text><rect x="200" y="300" width="600" height="480" rx="0" fill="#fffdf7" stroke="#25614b" stroke-width="2"/><rect x="200" y="300" width="600" height="160" rx="0" fill="#eff5e8" stroke="none" stroke-width="2"/><rect x="200" y="460" width="200" height="320" rx="0" fill="#eff5e8" stroke="none" stroke-width="2"/><rect x="400" y="460" width="400" height="160" rx="0" fill="#edf5f8" stroke="none" stroke-width="2"/><rect x="400" y="620" width="400" height="160" rx="0" fill="#eef4e7" stroke="none" stroke-width="2"/><line x1="400" y1="300" x2="400" y2="780" stroke="#25614b" stroke-width="2"/><line x1="600" y1="300" x2="600" y2="780" stroke="#25614b" stroke-width="2"/><line x1="200" y1="460" x2="800" y2="460" stroke="#25614b" stroke-width="2"/><line x1="200" y1="620" x2="800" y2="620" stroke="#25614b" stroke-width="2"/><text x="300" y="367" font-size="24" fill="#173d31" font-weight="700" text-anchor="middle" >XY parent’s</text><text x="300" y="403" font-size="24" fill="#173d31" font-weight="700" text-anchor="middle" >gametes</text><text x="500" y="396" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >X</text><text x="700" y="396" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >X</text><text x="300" y="556" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >X</text><text x="300" y="716" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Y</text><text x="500" y="556" font-size="28" fill="#357ca2" font-weight="700" text-anchor="middle" >XX</text><text x="700" y="556" font-size="28" fill="#357ca2" font-weight="700" text-anchor="middle" >XX</text><text x="500" y="716" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >XY</text><text x="700" y="716" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >XY</text><text x="500" y="850" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Two XX outcomes and two XY outcomes</text><rect x="48" y="912" width="904" height="147" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500" y="968" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Expected ratio: 1 XX : 1 XY</text><text x="500" y="1012" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >50% XX and 50% XY in this inheritance model</text><text x="500" y="1130" font-size="26" fill="#526c62" font-weight="400" text-anchor="middle" >Each fertilisation is a new event.</text><text x="500" y="1170" font-size="26" fill="#526c62" font-weight="400" text-anchor="middle" >The expected ratio is not a guarantee for a small family.</text><rect x="24" y="1224" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1258" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer B · X/X across; X/Y down; XX, XX, XY, XY</text>
</g></svg>