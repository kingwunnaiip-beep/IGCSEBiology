<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Pollen tube pathway: 1 → 3 → 2 → 4</title><desc id="desc">A longitudinal pistil shows pollen germinating on the stigma, a pollen tube growing down the style into the ovary and then into an ovule. A male nucleus reaches the egg nucleus inside the ovule and they fuse. Labels use original events 1, 3, 2 and 4.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="1.8"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#b85c50" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="38" y="54" font-size="30" fill="#173f32" font-weight="bold">Pollen tube pathway: 1 → 3 → 2 → 4</text><path d="M343 166 Q393 117 440 167 L426 352 C494 365 538 444 492 487 Q387 535 295 487 C247 435 296 373 358 352 Z" fill="#e4f0df" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M354 166 H426 L414 360 Q512 419 470 473 Q393 509 317 473 Q278 427 370 360 Z" fill="#f7f4dd" stroke="#82b36b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="411" cy="449" rx="45" ry="32" fill="#f0c6b7" stroke="#b85c50" stroke-width="3" /><circle cx="424" cy="449" r="14" fill="#dcebf2" stroke="#537c9a" stroke-width="2" /><circle cx="397" cy="446" r="7" fill="#d1a350" stroke="#b85c50" stroke-width="2" /><circle cx="382" cy="139" r="21" fill="#d1a350" stroke="#b85c50" stroke-width="3" /><line x1="402.0" y1="139.0" x2="409.0" 