<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="q296-title q296-desc">
<title id="q296-title">Magnification: use the same length unit</title>
<desc id="q296-desc">The given image length is 90 millimetres and the actual cell length is 30 micrometres. Convert 90 millimetres to 90000 micrometres and divide by 30 to obtain magnification 3000.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1200" height="790" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="600.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Magnification: use the same length unit</text><rect x="55" y="105" width="510" height="165" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="310.0" y="145" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Image length</text><text x="310.0" y="187" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >90 mm</text><text x="310.0" y="223" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >90 × 1000 = 90 000 µm</text><rect x="635" y="105" width="510" height="165" rx="12" fill="#eaf4f7" stroke="#357ca2" stroke-width="2"/><text x="890.0" y="145" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Actual cell length</text><text x="890.0" y="187" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >30 µm</text><text x="890.0" y="223" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Already in micrometres</text><line x1="310" y1="290" x2="310" y2="340" stroke="#25614b" stroke-width="4"/><polygon points="310,340 303.07331236687776,326.6950761583107 316.92668763312224,326.6950761583107" fill="#25614b"/><line x1="890" y1="290" x2="890" y2="340" stroke="#357ca2" stroke-width="4"/><polygon points="890,340 883.0733123668778,326.6950761583107 896.9266876331222,326.6950761583107" fill="#357ca2"/><rect x="95" y="360" width="1010" height="140" rx="12" fill="#f4eedb" stroke="#daa958" stroke-width="2"/><text x="600" y="409" font-size="31" fill="#173d31" font-weight="700" text-anchor="middle" >magnification = image length ÷ actual length</text><text x="600" y="463" font-size="38" fill="#173d31" font-weight="700" text-anchor="middle" >90 000 µm ÷ 30 µm = 3000</text><text x="600" y="560" font-size="29" fill="#173d31" font-weight="400" text-anchor="middle" >The length units cancel: magnification has no unit.</text><text x="600" y="609" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Use the stated 90 mm, even if a screen resizes the photograph.</text><text x="600" y="652" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >1 mm = 1000 µm</text><rect x="24" y="714" width="1152" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="600.0" y="748" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B — ×3000</text>
</g></svg>