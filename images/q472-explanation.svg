<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Cartilage supports the trachea during ventilation</title><desc id="desc">A schematic tracheal cross-section shows a C-shaped cartilage support around an open lumen. Inward pressure arrows are resisted by the wall. Cartilage supports, mucus traps particles, and cilia move mucus.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#397653"/></marker></defs><rect width="960" height="560" rx="20" fill="#faf8ed"/><g font-family="Arial, sans-serif"><text x="36" y="48" font-size="28" text-anchor="start" fill="#173f31" font-weight="bold">Cartilage supports the trachea during ventilation</text><rect x="35" y="90" width="505" height="385" rx="14" fill="#e0eedc" stroke="#397653" stroke-width="2"/><rect x="569" y="90" width="355" height="385" rx="14" fill="#e0eedc" stroke="#397653" stroke-width="2"/><text x="287" y="133" font-size="25" text-anchor="middle" fill="#173f31" font-weight="bold">Trachea cross-section</text><path d="M358 192A119 119 0 1 0 358 360" fill="none" stroke="#77a17c" stroke-width="33" stroke-linecap="round"/><circle cx="275" cy="276" r="85" fill="#ffffff" stroke="#a7b79a" stroke-width="6"/><path d="M358 192L358 360" stroke="#b9b091" stroke-width="16"/><text x="275" y="266" font-size="23" text-anchor="middle" fill="#173f31" font-weight="normal">Open</text><text x="275" y="296" font-size="23" text-anchor="middle" fill="#173f31" font-weight="normal">airway</text><text x="277" y="442" font-size="21" text-anchor="middle" fill="#173f31" font-weight="normal">Cartilage resists inward collapse</text><path d="M88 274L143 274" fill="none" stroke="#397653" stroke-width="3"/><polygon points="143,274 131.0,269.0 131.0,279.0" fill="#397653"/><path d="M464 274L410 274" fill="none" stroke="#397653" stroke-width="3"/><polygon points="410,274 422.0,279.0 422.0,269.0" fill="#397653"/><text x="746" y="139" font-size="23" text-anchor="middle" fill="#173f31" font-weight="bold">Different structures,</text><text x="746" y="170" font-size="23" text-anchor="middle" fill="#173f31" font-weight="bold">different functions</text><text x="746" y="228" font-size="23" text-anchor="middle" fill="#173f31" font-weight="bold">Cartilage</text><text x="746" y="259" font-size="21" text-anchor="middle" fill="#173f31" font-weight="normal">supports the wall</text><text x="746" y="308" font-size="23" text-anchor="middle" fill="#173f31" font-weight="bold">Mucus</text><text x="746" y="339" font-size="21" text-anchor="middle" fill="#173f31" font-weight="normal">traps particles</text><text x="746" y="388" font-size="23" text-anchor="middle" fill="#173f31" font-weight="bold">Cilia</text><text x="746" y="419" font-size="21" text-anchor="middle" fill="#173f31" font-weight="normal">move mucus</text><text x="480" y="525" font-size="23" text-anchor="middle" fill="#173f31" font-weight="normal">Gas exchange occurs mainly in alveoli, beyond the trachea.</text></g></svg>