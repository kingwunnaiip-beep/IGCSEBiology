<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" role="img" aria-labelledby="title496 desc496"><title id="title496">Cooling slows decomposer reactions</title><desc id="desc496">Short molecular-motion arrows in cold conditions and longer arrows in warm conditions explain why cooling slows enzyme-controlled decomposition. Proteins are not depicted as denatured.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#185744"/></marker></defs><rect width="800" height="530" rx="20" fill="#fbf8ed"/><g font-family="Arial, sans-serif"><text x="400" y="55" font-size="28" text-anchor="middle" fill="#185744" font-weight="bold">Cooling slows decomposer reactions</text><rect x="40" y="100" width="330" height="270" rx="12" fill="#e1eee2" stroke="#185744" stroke-width="2"/><rect x="430" y="100" width="330" height="270" rx="12" fill="#e1eee2" stroke="#185744" stroke-width="2"/><text x="205" y="140" font-size="25" text-anchor="middle" fill="#185744" font-weight="bold">Cold fish on ice</text><text x="595" y="140" font-size="25" text-anchor="middle" fill="#185744" font-weight="bold">Warmer conditions</text><circle cx="90" cy="190" r="9" fill="#397a61" stroke="#185744" stroke-width="2"/><path d="M104 190 L118 190" stroke="#185744" stroke-width="3" marker-end="url(#arrow)" fill="none"/><circle cx="155" cy="235" r="9" fill="#397a61" stroke="#185744" stroke-width="2"/><path d="M169 235 L183 235" stroke="#185744" stroke-width="3" marker-end="url(#arrow)" fill="none"/><circle cx="240" cy="190" r="9" fill="#397a61" stroke="#185744" stroke-width="2"/><path d="M254 190 L268 190" stroke="#185744" stroke-width="3" marker-end="url(#arrow)" fill="none"/><circle cx="310" cy="250" r="9" fill="#397a61" stroke="#185744" stroke-width="2"/><path d="M324 250 L338 250" stroke="#185744" stroke-width="3" marker-end="url(#arrow)" fill="none"/><circle cx="110" cy="295" r="9" fill="#397a61" stroke="#185744" stroke-width="2"/><path d="M124 295 L138 295" stroke="#185744" stroke-width="3" marker-end="url(#arrow)" fill="none"/><circle cx="260" cy="310" r="9" fill="#397a61" stroke="#185744" stroke-width="2"/><path d="M274 310 L288 310" stroke="#185744" stroke-width="3" marker-end="url(#arrow)" fill="none"/><circle cx="475" cy="190" r="9" fill="#c87939" stroke="#185744" stroke-width="2"/><path d="M489 190 L519 190" stroke="#c87939" stroke-width="3" marker-end="url(#arrow)" fill="none"/><circle cx="540" cy="235" r="9" fill="#c87939" stroke="#185744" stroke-width="2"/><path d="M554 235 L584 235" stroke="#c87939" stroke-width="3" marker-end="url(#arrow)" fill="none"/><circle cx="625" cy="190" r="9" fill="#c87939" stroke="#185744" stroke-width="2"/><path d="M639 190 L669 190" stroke="#c87939" stroke-width="3" marker-end="url(#arrow)" fill="none"/><circle cx="695" cy="250" r="9" fill="#c87939" stroke="#185744" stroke-width="2"/><path d="M709 250 L739 250" stroke="#c87939" stroke-width="3" marker-end="url(#arrow)" fill="none"/><circle cx="495" cy="295" r="9" fill="#c87939" stroke="#185744" stroke-width="2"/><path d="M509 295 L539 295" stroke="#c87939" stroke-width="3" marker-end="url(#arrow)" fill="none"/><circle cx="650" cy="310" r="9" fill="#c87939" stroke="#185744" stroke-width="2"/><path d="M664 310 L694 310" stroke="#c87939" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="205" y="345" font-size="21" text-anchor="middle" fill="#185744" font-weight="normal">Slower molecular motion</text><text x="595" y="345" font-size="21" text-anchor="middle" fill="#185744" font-weight="normal">Faster molecular motion</text><rect x="150" y="400" width="500" height="55" rx="12" fill="#e1eee2" stroke="#185744" stroke-width="2"/><text x="400.0" y="435.5" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">Fewer successful enzyme–substrate collisions</text><text x="400" y="487" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">Cold → lower decomposer activity → slower spoilage</text></g></svg>