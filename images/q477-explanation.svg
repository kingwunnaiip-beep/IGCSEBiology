<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img" aria-labelledby="q477-title q477-desc">
<title id="q477-title">Recognising the leaf epidermis</title>
<desc id="q477-desc">A simplified leaf section shows an upper epidermis as a tightly packed transparent row without chloroplasts, elongated palisade cells with chloroplasts below it, and irregular spongy mesophyll with air spaces. Most epidermal cells lack chloroplasts; guard cells are an exception.</desc>
