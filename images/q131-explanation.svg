<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1240" viewBox="0 0 1000 1240" role="img" aria-labelledby="q131-title q131-desc">
<title id="q131-title">131 · A photosynthetic, single-celled protoctist</title>
<desc id="q131-desc">Answer D: in the IGCSE classification scheme, a single-celled organism with a nucleus, chloroplasts and a cell wall is classified as a protoctist. The teaching schematic combines these features in one illustrative cell and does not identify a particular species. A nucleus distinguishes the cell from a prokaryote. Chloroplasts distinguish it from a fungus. Although these features resemble plant cells, organisms in the plant kingdom are multicellular in this classification scheme. The cell shapes and organelle numbers are illustrative and not measured.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
