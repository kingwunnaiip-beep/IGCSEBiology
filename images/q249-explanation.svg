<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="q249-title q249-desc">
<title id="q249-title">P and S are partially permeable membranes</title>
<desc id="q249-desc">Qualitative plant-cell model linked to the original labels. P identifies the tonoplast around the vacuole; S identifies the cell surface membrane just inside the cell wall. Both membranes are partially permeable. The cell wall is freely permeable. Other source labels Q and R are not assigned uncertain anatomical names.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="760" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >P and S are partially permeable membranes</text><text x="500" y="102" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative model linked to the original P and S labels</text><rect x="75" y="175" width="435" height="340" rx="45" fill="#e6edd6" stroke="#25614b" stroke-width="9"/><rect x="92" y="192" width="401" height="306" rx="32" fill="#f3f6e9" stroke="#173d31" stroke-width="4"/><rect x="151" y="255" width="277" height="171" rx="43" fill="#e4f1f7" stroke="#357ca2" stroke-width="4"/><text x="289" y="351" font-size="28" fill="#357ca2" font-weight="400" text-anchor="middle" >vacuole</text><circle cx="150" cy="223" r="13" fill="#25614b" stroke="#25614b" stroke-width="3"/><line x1="409" y1="268" x2="588" y2="224" stroke="#357ca2" stroke-width="2"/><text x="615" y="220" font-size="28" fill="#357ca2" font-weight="700" text-anchor="start" >P: tonoplast</text><text x="615" y="262" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >around the vacuole</text><text x="615" y="298" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >partially permeable</text><line x1="493" y1="425" x2="588" y2="422" stroke="#173d31" stroke-width="2"/><text x="615" y="410" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >S: cell surface</text><text x="615" y="446" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >membrane</text><text x="615" y="492" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >partially permeable</text><line x1="81" y1="480" x2="171" y2="566" stroke="#25614b" stroke-width="2"/><text x="190" y="580" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >Cell wall: freely permeable</text><text x="500" y="636" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Both membranes allow some substances across and restrict others.</text><rect x="24" y="684" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="718" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >D — P (tonoplast) and S (cell surface membrane)</text>
</g></svg>