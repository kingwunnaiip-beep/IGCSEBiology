<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">The placenta is the main late-pregnancy source</title><desc id="desc">A cross-section of a pregnant uterus shows a fetus attached to the placenta. A progesterone arrow connects placental secretion with maintenance of the uterine lining.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">The placenta is the main late-pregnancy source</text><path d="M420 180 C330 130 250 200 340 270 C360 280 360 470 500 490 C640 470 640 280 660 270 C750 200 670 130 580 180 Q500 230 420 180 Z" fill="#f1d9cd" stroke="#ac655c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M390 260 Q500 200 610 260 Q645 430 500 455 Q355 430 390 260" fill="#f7e7d8" stroke="#ac655c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M585 265 Q625 340 590 395 L560 380 L555 285 Z" fill="#b47b80" stroke="#ac655c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="470" cy="320" r="32" fill="#e3c3a5" stroke="#24644b" stroke-width="3"/><path d="M470 350 Q420 375 465 410 Q510 425 520 380" fill="none" stroke="#24644b" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M505 365 Q560 335 572 340" fill="none" stroke="#b28298" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M650 330 L820 330" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="815" y="285" font-size="25" text-anchor="middle" fill="#173f32" font-weight="bold">Progesterone</text><text x="815" y="380" font-size="24" text-anchor="middle" fill="#173f32">Maintains the</text><text x="815" y="412" font-size="24" text-anchor="middle" fill="#173f32">uterine lining</text><text x="500" y="120" font-size="28" text-anchor="middle" fill="#173f32" font-weight="bold">Late pregnancy</text><text x="80" y="245" font-size="24" text-anchor="start" fill="#173f32">Placenta</text><path d="M80 251 L580 300" fill="none" stroke="#537c9a" stroke-width="2"/><text x="120" y="460" font-size="22" text-anchor="start" fill="#173f32">Early pregnancy:</text><text x="120" y="490" font-size="22" text-anchor="start" fill="#173f32">corpus luteum in ovary</text><text x="500" y="565" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">B: placenta</text></g></svg>