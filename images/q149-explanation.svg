<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050" role="img" aria-labelledby="q149-title q149-desc">
<title id="q149-title">149 · Monoculture can increase crop yield</title>
<desc id="q149-desc">Answer D. A qualitative field model shows repeated plants of one crop species across a large area. This enables planting, crop care and harvesting to be organised around the same crop, supporting efficient production and increased crop yield. Monoculture does not increase biodiversity or inherently increase genetic variation. More water use is a resource cost rather than the stated advantage. Plant counts do not represent measured field density or yield.</desc>
