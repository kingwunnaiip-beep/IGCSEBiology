<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Trace nitrate upstream through the river branches</title><desc id="desc">Schematic evidence map of the source river: flow is left to right. The upper branch has about 56 ppm nitrate after farm A and before farm C, while the lower branch has about 3 ppm. The joined river is about 32 ppm and farther downstream about 24 ppm. Farm A is the likely source.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#397857"/></marker></defs><rect width="900" height="520" rx="22" fill="#fbfaee"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="28" text-anchor="start" fill="#183e31" font-weight="bold">Trace nitrate upstream through the river branches</text><path d="M85 170 H425 L540 275 H815 M85 375 H425 L540 275" fill="none" stroke="#85b5a2" stroke-width="22" stroke-linejoin="round"/><path d="M160 170 L220 170" fill="none" stroke="#397857" stroke-width="4" marker-end="url(#arrow)"/><path d="M160 375 L220 375" fill="none" stroke="#397857" stroke-width="4" marker-end="url(#arrow)"/><path d="M685 275 L755 275" fill="none" stroke="#397857" stroke-width="4" marker-end="url(#arrow)"/><rect x="80" y="80" width="140" height="60" rx="18" fill="#e5f0dd" stroke="#4c7957" stroke-width="2"/><text x="150" y="118" font-size="22" text-anchor="middle" fill="#183e31" font-weight="bold">Farm A</text><path d="M150 140 L150 154" fill="none" stroke="#397857" stroke-width="4"/><rect x="260" y="205" width="165" height="57" rx="18" fill="#e5f0dd" stroke="#4c7957" stroke-width="2"/><text x="342" y="241" font-size="23" text-anchor="middle" fill="#183e31" font-weight="bold">≈56 ppm</text><path d="M342 202 L342 182" fill="none" stroke="#397857" stroke-width="4"/><text x="408" y="129" font-size="21" text-anchor="start" fill="#183e31" font-weight="normal">Farm C</text><text x="255" y="439" font-size="23" text-anchor="start" fill="#183e31" font-weight="bold">≈3 ppm</text><path d="M308 411 L308 389" fill="none" stroke="#397857" stroke-width="4"/><text x="382" y="350" font-size="21" text-anchor="start" fill="#183e31" font-weight="normal">Farm B</text><text x="555" y="235" font-size="23" text-anchor="start" fill="#183e31" font-weight="bold">≈32 ppm</text><text x="700" y="352" font-size="23" text-anchor="start" fill="#183e31" font-weight="bold">≈24 ppm</text><text x="690" y="395" font-size="21" text-anchor="start" fill="#183e31" font-weight="normal">Farm D</text><text x="450" y="488" font-size="22" text-anchor="middle" fill="#183e31" font-weight="bold">The high upper-branch reading is already present after farm A.</text></g></svg>