<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Two genotypes can produce the same blood group</title><desc id="desc">Punnett-style grid for IAIA by IAIo. The homozygous A parent supplies only IA. The other parent supplies IA or Io. The resulting IAIA and IAIo offspring both have blood group A.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2e7656"/></marker></defs><rect width="1000" height="620" rx="24" fill="#fbf9ec"/><g font-family="sans-serif" fill="#173e32"><text x="42" y="55" font-size="31" text-anchor="start" fill="#173e32">Two genotypes can produce the same blood group</text><text x="500" y="111" font-size="30" text-anchor="middle" fill="#173e32">Parents: IᴬIᴬ × IᴬIᵒ</text><text x="500" y="153" font-size="24" text-anchor="middle" fill="#173e32">One parent always contributes Iᴬ</text><rect x="220" y="200" width="230" height="88" rx="0" fill="#e4efdf" stroke="#548269" stroke-width="2"/><rect x="450" y="200" width="280" height="88" rx="0" fill="#e4efdf" stroke="#548269" stroke-width="2"/><rect x="220" y="288" width="230" height="105" rx="0" fill="#e4efdf" stroke="#548269" stroke-width="2"/><rect x="450" y="288" width="280" height="105" rx="0" fill="#e4efdf" stroke="#548269" stroke-width="2"/><rect x="220" y="393" width="230" height="105" rx="0" fill="#e4efdf" stroke="#548269" stroke-width="2"/><rect x="450" y="393" width="280" height="105" rx="0" fill="#e4efdf" stroke="#548269" stroke-width="2"/><text x="335" y="255" font-size="24" text-anchor="middle" fill="#173e32">Gametes</text><text x="590" y="255" font-size="30" text-anchor="middle" fill="#173e32">Iᴬ</text><text x="335" y="353" font-size="30" text-anchor="middle" fill="#173e32">Iᴬ</text><text x="590" y="337" font-size="30" text-anchor="middle" fill="#173e32">IᴬIᴬ</text><text x="590" y="373" font-size="23" text-anchor="middle" fill="#173e32">group A</text><text x="335" y="459" font-size="30" text-anchor="middle" fill="#173e32">Iᵒ</text><text x="590" y="443" font-size="30" text-anchor="middle" fill="#173e32">IᴬIᵒ</text><text x="590" y="480" font-size="23" text-anchor="middle" fill="#173e32">group A</text><text x="500" y="557" font-size="26" text-anchor="middle" fill="#173e32">Two possible genotypes → one possible blood group</text><text x="500" y="595" font-size="22" text-anchor="middle" fill="#173e32">Iᴬ is dominant to Iᵒ; no parent supplies an Iᴮ allele.</text></g></svg>