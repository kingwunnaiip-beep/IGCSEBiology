<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="q280-title q280-desc">
<title id="q280-title">Removing an oxygen debt after exercise</title>
<desc id="q280-desc">Lactic acid produced in muscles is carried in blood to the liver. Heart rate stays high to transport lactic acid and oxygen. Continued rapid breathing supplies oxygen for aerobic respiration of lactic acid in the liver. All three source statements are correct.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="760" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Removing an oxygen debt after exercise</text><rect x="50" y="130" width="295" height="210" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="197.5" y="170" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Muscles</text><text x="197.5" y="212" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Lactic acid builds up</text><text x="197.5" y="246" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >during vigorous</text><text x="197.5" y="280" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >exercise.</text><rect x="402" y="130" width="295" height="210" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="549.5" y="170" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Blood</text><text x="549.5" y="212" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Heart rate stays high.</text><text x="549.5" y="246" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Lactic acid travels</text><text x="549.5" y="280" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >to the liver.</text><rect x="755" y="130" width="295" height="210" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="902.5" y="170" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Liver</text><text x="902.5" y="212" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Lactic acid is</text><text x="902.5" y="246" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >respired aerobically.</text><line x1="350" y1="235" x2="394" y2="235" stroke="#357ca2" stroke-width="4"/><polygon points="394,235 380.6950761583107,241.92668763312224 380.6950761583107,228.07331236687776" fill="#357ca2"/><line x1="703" y1="235" x2="748" y2="235" stroke="#357ca2" stroke-width="4"/><polygon points="748,235 734.6950761583107,241.92668763312224 734.6950761583107,228.07331236687776" fill="#357ca2"/><rect x="100" y="430" width="340" height="125" rx="12" fill="#e4f0f8" stroke="#357ca2" stroke-width="2"/><text x="270.0" y="470" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >High breathing rate</text><text x="270.0" y="512" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >More oxygen is absorbed.</text><line x1="448" y1="490" x2="647" y2="490" stroke="#357ca2" stroke-width="4"/><polygon points="647,490 633.6950761583107,496.92668763312224 633.6950761583107,483.07331236687776" fill="#357ca2"/><rect x="660" y="430" width="340" height="125" rx="12" fill="#e4f0f8" stroke="#357ca2" stroke-width="2"/><text x="830.0" y="470" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Oxygen to the liver</text><text x="830.0" y="512" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Supports aerobic</text><text x="830.0" y="546" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >respiration.</text><text x="550" y="605" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Some lactate can also be converted back to glucose in the liver.</text><text x="550" y="641" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >That does not make any of statements 1, 2 and 3 false.</text><rect x="24" y="684" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="718" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Statements 1, 2 and 3 all help explain removal of oxygen debt.</text>
</g></svg>