<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Three useful destinations for photosynthetic sugar</title><desc id="desc">Photosynthesis produces sugar. Three outgoing arrows lead to starch storage, respiration releasing energy, and cellulose for cell walls. A separate incoming arrow shows carbon dioxide, water and light providing the conditions and materials for making sugar.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#32745a" stroke-width="1.5"/></marker></defs><rect width="1000" height="620" rx="22" fill="#faf8e9"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="54" font-size="30" text-anchor="start" fill="#183f35" font-weight="bold">Three useful destinations for photosynthetic sugar</text><rect x="285" y="90" width="430" height="90" rx="18" fill="#e4f0dc" stroke="#32745a" stroke-width="2"/><text x="500.0" y="126" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">CO₂ + water</text><text x="500.0" y="158" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">light energy</text><path d="M500 180 L500 240" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><rect x="325" y="240" width="350" height="85" rx="18" fill="#e4f0dc" stroke="#32745a" stroke-width="2"/><text x="500.0" y="276" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">Sugar produced</text><path d="M370 325 L180 415" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><path d="M500 325 L500 415" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><path d="M630 325 L820 415" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><rect x="40" y="415" width="280" height="115" rx="18" fill="#e4f0dc" stroke="#32745a" stroke-width="2"/><text x="180.0" y="451" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">Starch</text><text x="180.0" y="483" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">energy storage</text><rect x="360" y="415" width="280" height="115" rx="18" fill="#e4f0dc" stroke="#32745a" stroke-width="2"/><text x="500.0" y="451" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">Respiration</text><text x="500.0" y="483" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">energy released</text><rect x="680" y="415" width="280" height="115" rx="18" fill="#e4f0dc" stroke="#32745a" stroke-width="2"/><text x="820.0" y="451" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">Cellulose</text><text x="820.0" y="483" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">cell-wall material</text><text x="500" y="585" font-size="25" text-anchor="middle" fill="#183f35" font-weight="normal">Photosynthesis makes sugar; these processes use it.</text></g></svg>