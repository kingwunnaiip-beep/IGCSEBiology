<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">Thorax volume, pressure and airflow</title><desc id="desc">Inspiration increases thorax volume, lowers pressure and draws air in. Expiration decreases thorax volume, raises pressure and moves air out.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#245744"/></marker></defs><rect width="1000" height="540" rx="22" fill="#fbf8ed"/><text x="42" y="49" font-family="Arial, sans-serif" font-size="30" text-anchor="start" fill="#183e32" font-weight="bold">Thorax volume, pressure and airflow</text><rect x="50" y="90" width="425" height="355" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><rect x="525" y="90" width="425" height="355" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><text x="262" y="132" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#183e32" font-weight="bold">Inspiration</text><text x="737" y="132" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#183e32" font-weight="bold">Expiration</text><rect x="110" y="157" width="305" height="72" rx="18" fill="#cde1cd" stroke="#548c69" stroke-width="2"/><text x="262" y="202" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183e32" font-weight="normal">Thorax volume increases</text><path d="M262,236 L262,266" fill="none" stroke="#245744" stroke-width="4" marker-end="url(#arrow)"/><text x="262" y="300" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#183e32" font-weight="normal">Pressure decreases</text><path d="M262,317 L262,347" fill="none" stroke="#245744" stroke-width="4" marker-end="url(#arrow)"/><text x="262" y="387" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" fill="#183e32" font-weight="bold">Air moves IN</text><rect x="585" y="157" width="305" height="72" rx="18" fill="#cde1cd" stroke="#548c69" stroke-width="2"/><text x="737" y="202" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183e32" font-weight="normal">Thorax volume decreases</text><path d="M737,236 L737,266" fill="none" stroke="#245744" stroke-width="4" marker-end="url(#arrow)"/><text x="737" y="300" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#183e32" font-weight="normal">Pressure increases</text><path d="M737,317 L737,347" fill="none" stroke="#245744" stroke-width="4" marker-end="url(#arrow)"/><text x="737" y="387" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" fill="#183e32" font-weight="bold">Air moves OUT</text><text x="500" y="485" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#183e32" font-weight="bold">Air moves from higher pressure to lower pressure.</text><text x="42" y="518" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#52675b" font-weight="normal">Original teaching schematic • Biology quiz • not to scale</text></svg>