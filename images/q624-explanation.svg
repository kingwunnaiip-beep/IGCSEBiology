<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Deamination removes the amino group</title><desc id="desc">An amino acid is drawn with its amino group NH₂ highlighted. An arrow leads to a liver, where deamination removes amino nitrogen and nitrogen is converted into urea for excretion in humans.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="53" font-size="31" text-anchor="start" font-weight="bold" fill="#173f32">Deamination removes the amino group</text><text x="245" y="283" font-size="44" text-anchor="middle" font-weight="bold" fill="#173f32">C</text><text x="245" y="170" font-size="34" text-anchor="middle" font-weight="normal" fill="#173f32">R</text><text x="245" y="408" font-size="34" text-anchor="middle" font-weight="normal" fill="#173f32">H</text><text x="105" y="283" font-size="36" text-anchor="middle" font-weight="bold" fill="#537c9a">NH₂</text><text x="395" y="283" font-size="34" text-anchor="middle" font-weight="normal" fill="#173f32">COOH</text><path d="M135 270 L216 270" fill="none" stroke="#24644b" stroke-width="4"/><path d="M272 270 L335 270" fill="none" stroke="#24644b" stroke-width="4"/><path d="M245 191 L245 240" fill="none" stroke="#24644b" stroke-width="4"/><path d="M245 302 L245 367" fill="none" stroke="#24644b" stroke-width="4"/><ellipse cx="104" cy="270" rx="65" ry="45" fill="none" stroke="#537c9a" stroke-width="3" transform="rotate(0 104 270)"/><text x="245" y="465" font-size="28" text-anchor="middle" font-weight="bold" fill="#173f32">Amino acid</text><text x="110" y="220" font-size="22" text-anchor="middle" font-weight="normal" fill="#173f32">amino group</text><path d="M475 270 L565 270" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><path d="M585 245 C635 175 810 170 920 245 Q900 315 825 330 Q750 325 720 375 L600 350 Q560 310 585 245" fill="#be8270" stroke="#805746" stroke-width="4"/><path d="M755 195 Q770 270 720 375" fill="none" stroke="#805746" stroke-width="3"/><text x="745" y="270" font-size="29" text-anchor="middle" font-weight="bold" fill="#fff">Liver</text><text x="745" y="312" font-size="25" text-anchor="middle" font-weight="normal" fill="#fff">deamination</text><path d="M740 380 L740 420" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="740" y="455" font-size="30" text-anchor="middle" font-weight="bold" fill="#537c9a">NH₂—CO—NH₂</text><text x="740" y="490" font-size="24" text-anchor="middle" font-weight="normal" fill="#173f32">urea</text><text x="500" y="553" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">A: deamination</text><text x="500" y="586" font-size="20" text-anchor="middle" font-weight="normal" fill="#173f32">Human example: excess amino acids are processed in the liver.</text></g></svg>