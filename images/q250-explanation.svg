<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="810" viewBox="0 0 1100 810" role="img" aria-labelledby="q250-title q250-desc">
<title id="q250-title">Warming to the optimum increases successful collisions</title>
<desc id="q250-desc">Qualitative sequence for an enzyme warmed from below its optimum to its optimum temperature: particles gain kinetic energy, successful enzyme-substrate collisions become more frequent, more enzyme-substrate complexes form per second, and reaction rate increases. No temperature or rate measurements are supplied. Heating above the optimum can denature the enzyme, a different condition.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="810" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Warming to the optimum increases successful collisions</text><text x="550" y="104" font-size="27" fill="#526c62" font-weight="400" text-anchor="middle" >From below the optimum → to the optimum</text><rect x="85" y="140" width="930" height="110" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="550.0" y="178" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Temperature rises</text><text x="550.0" y="216" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Enzyme and substrate particles gain kinetic energy.</text><rect x="85" y="285" width="930" height="110" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="550.0" y="323" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Successful collisions become more frequent</text><text x="550.0" y="361" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >More substrate molecules reach complementary active sites.</text><rect x="85" y="430" width="930" height="110" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="550.0" y="468" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >More enzyme–substrate complexes form per second</text><text x="550.0" y="506" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >The reaction rate increases towards its maximum.</text><line x1="550" y1="258" x2="550" y2="275" stroke="#25614b" stroke-width="4"/><polygon points="550,275 543.0733123668778,261.6950761583107 556.9266876331222,261.6950761583107" fill="#25614b"/><line x1="550" y1="403" x2="550" y2="420" stroke="#25614b" stroke-width="4"/><polygon points="550,420 543.0733123668778,406.6950761583107 556.9266876331222,406.6950761583107" fill="#25614b"/><rect x="85" y="587" width="930" height="100" rx="12" fill="white" stroke="#daa958" stroke-width="2"/><text x="550" y="626" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Above the optimum is a different condition:</text><text x="550" y="663" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >denaturation can change the active-site shape.</text><rect x="24" y="734" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="768" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >A — more frequent successful collisions</text>
</g></svg>