<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="q31-title q31-desc">
<title id="q31-title">Glucose units build polysaccharides</title>
<desc id="q31-desc">Glucose is a monosaccharide. Many beta-glucose units form unbranched cellulose, which supports plant cell walls. Many alpha-glucose units form branched glycogen for carbohydrate storage in animals. The circles represent glucose units; this is a simplified structural model.</desc>
