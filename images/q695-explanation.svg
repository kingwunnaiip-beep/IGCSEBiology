<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Subtract the wall thickness on both sides</title><desc id="desc">A circular aorta cross-section is drawn to scale: outer diameter 36 mm, two 9 mm walls, and lumen diameter 18 mm. Dimension lines and conversion give 18000 micrometres.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">Subtract the wall thickness on both sides</text><circle cx="390" cy="310" r="180" fill="#d4aaa1" stroke="#ac655c" stroke-width="4"/><circle cx="390" cy="310" r="90" fill="#e2eff3" stroke="#537c9a" stroke-width="4"/><path d="M210 100 L570 100" fill="none" stroke="#24644b" stroke-width="3"/><path d="M210 90 L210 110" fill="none" stroke="#24644b" stroke-width="3"/><path d="M570 90 L570 110" fill="none" stroke="#24644b" stroke-width="3"/><text x="390" y="85" font-size="25" text-anchor="middle" fill="#173f32" font-weight="bold">Outer diameter 36 mm</text><path d="M300 310 L480 310" fill="none" stroke="#537c9a" stroke-width="3"/><path d="M300 300 L300 320" fill="none" stroke="#537c9a" stroke-width="3"/><path d="M480 300 L480 320" fill="none" stroke="#537c9a" stroke-width="3"/><text x="390" y="285" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">18 mm lumen</text><path d="M480 430 L570 430" fill="none" stroke="#24644b" stroke-width="3"/><text x="575" y="470" font-size="24" text-anchor="start" fill="#173f32">9 mm wall</text><path d="M590 450 L525 430" fill="none" stroke="#537c9a" stroke-width="2"/><text x="775" y="200" font-size="28" text-anchor="middle" fill="#173f32" font-weight="bold">36 − 9 − 9</text><text x="775" y="245" font-size="28" text-anchor="middle" fill="#173f32" font-weight="bold">= 18 mm</text><text x="775" y="345" font-size="27" text-anchor="middle" fill="#173f32">18 × 1000</text><text x="775" y="390" font-size="27" text-anchor="middle" fill="#173f32" font-weight="bold">= 18 000 µm</text><text x="500" y="565" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">C: 18 000 µm</text></g></svg>