<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="q36-title q36-desc">
<title id="q36-title">Keep plant size and time constant</title>
<desc id="q36-desc">Illustrative comparison of photosynthesis at two lamp distances. Both trials use equally sized aquatic plants under inverted funnels in water, with inverted cylinders collecting oxygen. Matching stopwatch faces show the same exposure and collection duration. No gas readings or exposure times are invented.</desc>
