<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f4f6ef">
	<title>Characteristics of living organisms | Biology quiz</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #193b34;
			--muted: #61766c;
			--green: #1e654f;
			--green-dark: #174a3b;
			--paper: #f4f6ef;
			--line: #dce4d8;
			--white: #fffefa;
			--red-pale: #fff0ed;
			--green-pale: #eaf4e8;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			padding-bottom: 88px;
			color: var(--ink);
			background:
				radial-gradient(ellipse at 93% 8%, rgba(216, 233, 120, .28), transparent 26rem),
				linear-gradient(135deg, #f4f6ef 0%, #edf2e8 100%);
			font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
		}

		.page {
			width: min(100% - 24px, 1600px);
			margin: 0 auto;
			padding: 30px 0 48px;
		}

		.topbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 20px;
			padding-bottom: 22px;
			border-bottom: 1px solid rgba(25, 59, 52, .15);
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 11px;
			min-height: 96px;
			padding-left: 107px;
			font-size: 14px;
			font-weight: 750;
		}

		.brand-logo {
			position: fixed;
			top: 30px;
			left: max(12px, calc((100% - 1600px) / 2));
			z-index: 30;
			pointer-events: none;
			display: block;
			width: 96px;
			height: 96px;
			flex: 0 0 96px;
			border-radius: 50%;
			background: white;
			object-fit: contain;
		}

		.teacher-badge {
			position: fixed;
			right: max(14px, env(safe-area-inset-right));
			bottom: max(14px, env(safe-area-inset-bottom));
			z-index: 20;
			display: flex;
			align-items: center;
			gap: 11px;
			padding: 10px 18px;
			border: 2px solid #078b9a;
			border-radius: 999px;
			color: #164f56;
			background: #effcff;
			box-shadow: 0 8px 24px rgba(7, 139, 154, .15);
			font-size: 20px;
			font-weight: 750;
			transform: scale(.7);
			transform-origin: bottom right;
		}

		.teacher-badge-dot {
			width: 20px;
			height: 20px;
			flex: 0 0 20px;
			border-radius: 50%;
			background: #4edcf0;
			box-shadow: 0 0 0 0 rgba(78, 220, 240, .55);
			animation: badge-pulse 1.2s ease-in-out infinite;
		}

		@keyframes badge-pulse {
			0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(78, 220, 240, .45); }
			50% { opacity: .55; transform: scale(.88); box-shadow: 0 0 0 8px rgba(78, 220, 240, 0); }
		}

		.topic {
			color: var(--muted);
			font-size: 12px;
			font-weight: 700;
			letter-spacing: .08em;
			text-transform: uppercase;
		}

		main {
			padding: clamp(36px, 7vh, 68px) 0 0;
		}

		.quiz-layout {
			display: grid;
			grid-template-columns: minmax(0, 1fr) 136px;
			grid-template-areas: "quiz navigator";
			gap: clamp(18px, 2.5vw, 32px);
			align-items: start;
		}

		.question-navigator {
			grid-area: navigator;
			position: sticky;
			top: 24px;
			padding-left: 10px;
			border-left: 1px solid var(--line);
		}

		.question-nav-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

		.question-nav-item {
			display: grid;
			width: 100%;
			min-height: 54px;
			place-items: center;
			padding: 7px;
			border: 1px solid transparent;
			border-radius: 6px;
			color: var(--ink);
			background: transparent;
			text-align: center;
			font-size: 13px;
		}

		.question-nav-item:not(:disabled):hover { border-color: var(--line); color: var(--ink); background: rgba(255, 254, 250, .7); transform: none; }
		.question-nav-item[aria-current="step"] { border-color: #bdd0be; background: #eaf2e7; }
		.question-nav-item.is-correct { border-color: #c6dfc9; background: #eaf4e8; }
		.question-nav-item.is-wrong { border-color: #e8c4be; background: #fff0ed; }
		.question-nav-number { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 6px; color: var(--green-dark); background: #e9eee1; font-weight: 800; }
		.question-nav-item[aria-current="step"] .question-nav-number { color: white; background: var(--green); }
		.question-nav-item.is-correct .question-nav-number { color: white; background: #24563c; }
		.question-nav-item.is-wrong .question-nav-number { color: white; background: #a63d38; }
		.quiz-layout.navigator-hidden { grid-template-columns: minmax(0, 1fr); grid-template-areas: "quiz"; }
		.quiz-layout.navigator-hidden .question-navigator { display: none; }

		.quiz {
			grid-area: quiz;
			width: 100%;
			font-size: calc(16px * var(--quiz-scale, 1));
		}

		.question-meta {
			display: flex;
			align-items: center;
			flex-wrap: wrap;
			gap: 16px;
			margin-bottom: 14px;
			color: var(--muted);
			font-size: .8125em;
			font-weight: 700;
		}

		.question-paper {
			display: flex;
			align-items: baseline;
			flex-wrap: wrap;
			gap: 6px 12px;
			width: fit-content;
			max-width: min(100%, calc(100vw - 24px));
			min-width: 0;
			margin: 0 0 16px;
			padding: 8px 12px;
			border: 1px solid var(--line);
			border-radius: 8px;
			color: var(--green-dark);
			background: rgba(255, 254, 250, .82);
			font-size: .8125em;
			line-height: 1.5;
		}

		.question-paper[hidden] { display: none; }
		.paper-label { color: var(--muted); font-weight: 700; }
		.paper-code { min-width: 0; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 1em; font-weight: 750; overflow-wrap: anywhere; }
		.paper-session { min-width: 0; color: var(--muted); overflow-wrap: anywhere; }
		.paper-session:empty { display: none; }

		.panel-toggle {
			display: grid;
			width: 36px;
			min-width: 36px;
			min-height: 34px;
			margin-left: auto;
			place-items: center;
			padding: 0;
			border: 1px solid var(--line);
			color: var(--green-dark);
			background: var(--white);
		}

		.panel-toggle svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-width: 2; }

		.panel-toggle:not(:disabled):hover { color: white; background: var(--green-dark); }

		.question-context:empty { display: none; }

		.comparison-table {
			width: 100%;
			margin: 0 0 24px;
			border-collapse: collapse;
			background: rgba(255, 254, 250, .72);
			font-size: .9em;
			text-align: center;
			table-layout: auto;
		}

		.comparison-table caption {
			padding: 0 0 9px;
			color: var(--muted);
			text-align: left;
		}

		.comparison-table th,
		.comparison-table td {
			padding: 9px 7px;
			border: 1px solid var(--line);
			overflow-wrap: break-word;
		}

		.comparison-table thead th { color: var(--ink); font-weight: 700; }
		.comparison-table tbody th { color: var(--green-dark); }
		.comparison-table.leg-count-table th:first-child { width: 34%; }
		.comparison-table.statement-table th:first-child { width: 30%; }
		.comparison-table.answer-selection-table.statement-table th:first-child { width: 70px; }
		.comparison-table.villus-choice-table th:first-child { width: 70px; }
		.answer-selection-table tbody tr { cursor: pointer; transition: background-color 120ms ease; }
		.answer-selection-table tbody tr:hover { background: #f0f4eb; }
		.answer-selection-table tbody tr.is-selected { background: #eaf2e7; box-shadow: inset 3px 0 var(--green); }
		.answer-table-choice { min-width: 34px; min-height: 34px; padding: 3px 8px; border: 1px solid var(--line); color: var(--green-dark); background: var(--white); }
		.answer-table-choice[aria-pressed="true"] { border-color: var(--green); color: white; background: var(--green); }
		.comparison-table.light-intensity-table th:first-child { width: 70px; }
		.comparison-table.light-intensity-table th,
		.comparison-table.light-intensity-table td { overflow-wrap: break-word; }
		.key-table { text-align: left; }
		.key-table th:first-child { width: 54px; }
		.key-table td:last-child { text-align: right; white-space: nowrap; }
		.table-key { margin: -14px 0 22px; color: var(--muted); font-size: .85em; }
		.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
		.statement-list { display: grid; gap: 8px; margin: 0 0 20px; padding-left: 1.5em; }
		.explanation-photo { margin: 16px 0; }
		.explanation-photo img { display: block; width: min(100%, 700px); height: auto; border-radius: 6px; }
		.quiz img { mix-blend-mode: multiply; }
		.explanation-photo figcaption { margin-top: 6px; color: var(--muted); font-size: .8em; }
		.explanation-photo a { color: inherit; }
		.plant-diagram { max-width: 700px; margin: 0 auto 18px; }
		.plant-diagram svg { display: block; width: 100%; height: auto; }
		.plant-diagram figcaption { margin-top: 5px; color: var(--muted); font-size: .8em; }
		.translocation-flow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.2fr) auto minmax(0, 1fr); gap: 10px; align-items: center; margin: 18px 0; }
		.flow-step { display: grid; gap: 4px; min-width: 0; padding: 12px; border-top: 2px solid var(--green); background: rgba(255, 254, 250, .75); }
		.flow-step span { color: var(--muted); font-size: .8em; }
		.flow-arrow { color: var(--green); font-size: 1.5em; font-weight: 700; }
		.interactive-graph { margin: 16px 0 20px; padding: 14px; border: 1px solid var(--line); border-radius: 7px; background: rgba(255, 254, 250, .82); }
		.rate-chart { display: block; width: 100%; height: auto; }
		.rate-chart text { fill: var(--muted); font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif; font-size: 13px; }
		.rate-chart .axis-label { fill: var(--ink); font-size: 14px; font-weight: 700; }
		.rate-chart .gridline { stroke: #dce4d8; stroke-width: 1; }
		.rate-chart .axis { stroke: #61766c; stroke-width: 1.5; }
		.rate-chart .curve { fill: none; stroke: #1e654f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
		.rate-chart .data-point { fill: #fffefa; stroke: #1e654f; stroke-width: 3; }
		.rate-chart .plateau-zone { fill: #eaf4e8; }
		.rate-chart .plateau-label { fill: #24563c; font-weight: 700; }
		.rate-chart .active-line { stroke: #a63d38; stroke-width: 2; stroke-dasharray: 5 5; }
		.rate-chart .active-point { fill: #a63d38; stroke: white; stroke-width: 3; }
		.enzyme-chart { max-width: 680px; margin: 10px auto 20px; }
		.enzyme-chart svg { display: block; width: 100%; height: auto; }
		.enzyme-chart text { fill: var(--ink); font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif; font-size: 15px; }
		.enzyme-chart .axis { stroke: #193b34; stroke-width: 2; }
		.enzyme-chart .tick { stroke: #61766c; stroke-width: 1.5; }
		.enzyme-chart .curve { fill: none; stroke: #1e654f; stroke-width: 4; stroke-linecap: round; }
		.enzyme-chart .point-label { fill: #1e654f; font-weight: 800; }
		.enzyme-stage-flow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center; margin: 16px 0 22px; }
		.enzyme-stage { min-width: 0; margin: 0; padding: 10px; border-top: 2px solid var(--green); background: rgba(255, 254, 250, .72); text-align: center; }
		.enzyme-stage svg { display: block; width: 100%; height: 125px; }
		.enzyme-stage figcaption { color: var(--ink); font-size: .82em; font-weight: 700; }
		.enzyme-shape { fill: #a5a7a8; stroke: #4f5557; stroke-width: 3; stroke-linejoin: round; }
		.substrate-shape { fill: #d9dcde; stroke: #4f5557; stroke-width: 2.5; }
		.enzyme-stage-arrow { align-self: center; color: var(--green); font-size: 1.4em; font-weight: 800; }
		.blood-components-figure,
		.phagocytosis-figure { max-width: 760px; margin: 16px auto 20px; }
		.blood-components-figure svg,
		.phagocytosis-figure svg { display: block; width: 100%; height: auto; }
		.blood-components-figure figcaption,
		.phagocytosis-figure figcaption { margin-top: 5px; color: var(--muted); font-size: .8em; }
		.blood-components-figure text,
		.phagocytosis-figure text { fill: var(--ink); font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif; }
		.blood-cell-outline { stroke: #66736d; stroke-width: 2; }
		.digestive-diagram { max-width: 700px; margin: 8px auto 20px; }
		.digestive-diagram img { display: block; width: min(100%, 560px); height: auto; margin: 0 auto; }
		.circulation-diagram { max-width: 860px; margin: 8px auto 20px; }
		.circulation-diagram img { display: block; width: 100%; height: auto; }
		.root-hair-diagram { max-width: 700px; margin: 12px auto 20px; }
		.root-hair-diagram svg { display: block; width: 100%; height: auto; }
		.root-hair-diagram figcaption { margin-top: 5px; color: var(--muted); font-size: .8em; }
		.root-hair-diagram text { fill: var(--ink); font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif; font-size: 16px; }
		.root-hair-diagram .cell { fill: #eaf2e7; stroke: #1e654f; stroke-width: 3; }
		.root-hair-diagram .wall { stroke: #1e654f; stroke-width: 3; }
		.root-hair-diagram .water { stroke: #4389ad; stroke-width: 4; }
		.root-hair-diagram .ions { stroke: #b86b39; stroke-width: 4; }
		.root-hair-diagram .leader { stroke: #61766c; stroke-width: 1.5; }
		.comparison-table.root-uptake-table th:first-child { width: 30%; }
		.comparison-table.transpiration-table th:first-child { width: 30%; }
		.water-potential-diagram { max-width: 720px; margin: 14px auto 20px; }
		.water-potential-diagram svg { display: block; width: 100%; height: auto; }
		.water-potential-diagram figcaption { margin-top: 5px; color: var(--muted); font-size: .8em; }
		.water-potential-diagram text { fill: var(--ink); font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif; }
		.water-potential-diagram .cell-box { fill: var(--white); stroke: #526c62; stroke-width: 2.5; }
		.water-potential-diagram .cell-name { font-size: 20px; font-weight: 800; }
		.water-potential-diagram .cell-value { font-size: 18px; }
		.water-potential-diagram .water-flow-arrow { fill: none; stroke: #4389ad; stroke-width: 4; stroke-dasharray: 9 10; marker-end: url(#water-potential-arrow); animation: water-flow 1.2s linear infinite; }
		@keyframes water-flow { to { stroke-dashoffset: -38; } }
		.graph-controls { display: grid; gap: 8px; margin-top: 8px; }
		.graph-controls label { color: var(--ink); font-size: .88em; font-weight: 700; }
		.graph-controls input { width: 100%; accent-color: var(--green); }
		.graph-output { display: block; min-height: 1.5em; color: var(--green-dark); font-size: .88em; font-weight: 750; }
		.species-photo-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 16px 0; }
		.species-photo { min-width: 0; margin: 0; }
		.species-photo img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; border-radius: 5px; background: var(--white); }
		.species-photo figcaption { margin-top: 5px; color: var(--muted); font-size: .72em; line-height: 1.4; }
		.species-photo a { color: inherit; }

		.text-size-controls {
			display: flex;
			align-items: center;
			justify-content: flex-end;
			gap: 8px;
			margin: 14px 0 0;
			color: var(--muted);
			font-size: 13px;
		}

		.text-size-controls button {
			min-width: 36px;
			min-height: 34px;
			padding: 0 9px;
			border: 1px solid var(--line);
			color: var(--green-dark);
			background: var(--white);
			font-size: 13px;
		}

		.text-size-controls button:not(:disabled):hover { color: white; background: var(--green-dark); }
		.text-size-controls output { min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
		.question-navigator .text-size-controls {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			grid-template-areas: "label label label" "decrease value increase" "reset reset reset";
			gap: 6px;
			justify-content: stretch;
			margin-top: 12px;
			padding-top: 12px;
			border-top: 1px solid var(--line);
			font-size: 11px;
		}
		.question-navigator .text-size-controls > span { grid-area: label; }
		.question-navigator #decrease-text { grid-area: decrease; min-width: 0; padding: 0; }
		.question-navigator #text-size-value { grid-area: value; min-width: 0; }
		.question-navigator #increase-text { grid-area: increase; min-width: 0; padding: 0; }
		.question-navigator #reset-text { grid-area: reset; width: 100%; min-width: 0; min-height: 32px; padding: 0 6px; }

		.progress-track {
			height: 4px;
			overflow: hidden;
			border-radius: 5px;
			background: #dfe7da;
		}

		.progress-value {
			width: 100%;
			height: 100%;
			border-radius: inherit;
			background: var(--green);
		}

		h2 {
			margin: 30px 0 25px;
			font-size: 1.65em;
			font-weight: 650;
			line-height: 1.4;
		}

		fieldset { margin: 0; padding: 0; border: 0; }
		.answer-options { display: grid; gap: 10px; }
		.answer-options[hidden] { display: none; }
		legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }

		.answer {
			position: relative;
			display: flex;
			align-items: center;
			gap: 15px;
			min-height: 62px;
			padding: 11px 16px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: rgba(255, 254, 250, .82);
			cursor: pointer;
			transition: border-color 150ms ease, background-color 150ms ease, transform 150ms ease;
		}

		.answer:hover { border-color: #8da99a; transform: translateY(-1px); }

		.answer:has(input:checked) {
			border-color: var(--green);
			background: #edf4e9;
			box-shadow: 0 0 0 1px var(--green);
		}

		.answer input {
			position: absolute;
			width: 1px;
			height: 1px;
			opacity: 0;
		}

		.answer:has(input:focus-visible) { outline: 3px solid #91a944; outline-offset: 3px; }

		.letter {
			display: grid;
			flex: 0 0 32px;
			width: 32px;
			height: 32px;
			place-items: center;
			border-radius: 7px;
			color: var(--green-dark);
			background: #e9eee1;
			font-size: .8125em;
			font-weight: 800;
		}

		.answer-text { font-size: .9375em; font-weight: 600; }

		.actions {
			display: flex;
			align-items: center;
			flex-wrap: wrap;
			gap: 16px;
			margin-top: 20px;
		}

		button {
			min-height: 46px;
			padding: 0 21px;
			border: 0;
			border-radius: 7px;
			color: white;
			background: var(--green);
			font: inherit;
			font-size: .875em;
			font-weight: 750;
			cursor: pointer;
			transition: background-color 150ms ease, transform 150ms ease;
		}

		button:not(:disabled):hover { background: var(--green-dark); transform: translateY(-1px); }
		button:focus-visible { outline: 3px solid #91a944; outline-offset: 3px; }
		button:disabled { color: #8c9a90; background: #e0e6dd; cursor: not-allowed; }

		.hint { color: var(--muted); font-size: .75em; }

		.feedback {
			display: none;
			margin-top: 18px;
			padding: 18px;
			border-radius: 7px;
			font-size: .875em;
			line-height: 1.55;
		}

		.feedback.visible { display: block; animation: appear 180ms ease-out; }
		.feedback.correct { color: #24563c; background: var(--green-pale); }
		.feedback.incorrect { color: #873a34; background: var(--red-pale); }
		.feedback-title { display: block; margin-bottom: 8px; font-size: 1.14em; }
		.feedback p { margin: 0 0 12px; }
		.feedback .definition { color: var(--ink); }
		.feedback h3 { margin: 17px 0 8px; color: var(--ink); font-size: .93em; }
		.option-explanations { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
		.option-explanations li { padding: 7px 0; border-top: 1px solid rgba(25, 59, 52, .12); color: var(--ink); }
		.option-explanations strong { display: inline; }
		.exam-tip { margin: 15px 0 0 !important; padding-top: 12px; border-top: 1px solid rgba(25, 59, 52, .18); color: var(--ink); }
		.relationship { margin-top: 8px !important; font-weight: 800; }

		@keyframes appear {
			from { opacity: 0; transform: translateY(5px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (max-width: 680px) {

    const lab = feedback.querySelector("#catalase-infographic");
    if (!lab || !Number.isInteger(index) || !catalaseMeasurements[index]) return;
    const measurement = catalaseMeasurements[index];
    const percent = measurement.bubbles / 98 * 100;
    const rateText = `${measurement.bubbles} oxygen ${measurement.bubbles === 1 ? "bubble" : "bubbles"} per minute`;
    lab.querySelectorAll("button[data-catalase-index]").forEach((button) => {
        button.setAttribute("aria-pressed", String(Number(button.dataset.catalaseIndex) === index));
    });
    const slider = lab.querySelector("#catalase-temperature-slider");
    slider.value = String(index);
    slider.setAttribute("aria-valuetext", `${measurement.temperature}°C; ${rateText}`);
    lab.querySelector("#catalase-selected-temperature").textContent = `${measurement.temperature}°C`;
    lab.querySelector("#catalase-selected-rate").textContent = rateText;
    lab.querySelector("#catalase-rate-fill").style.width = `${percent}%`;
    lab.querySelector("#catalase-rate-percent").textContent = `${percent.toFixed(1)}%`;
    const meter = lab.querySelector("#catalase-rate-meter");
    meter.setAttribute("aria-valuenow", String(measurement.bubbles));
    meter.setAttribute("aria-valuetext", `${rateText}; ${percent.toFixed(1)}% of the highest measured rate`);
    lab.querySelector("#catalase-stage").textContent = measurement.note;
}

feedback.addEventListener("input", (event) => {
    if (event.target.id !== "catalase-temperature-slider") return;
    updateCatalaseInfographic(Number(event.target.value));
});

feedback.addEventListener("click", (event) => {
    const button = event.target.closest("button[data-catalase-index]");
    if (!button || !feedback.contains(button)) return;
    updateCatalaseInfographic(Number(button.dataset.catalaseIndex));
});

	</script>
</body>
</html>
