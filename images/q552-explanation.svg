<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Directional growth reveals two tropisms</title><desc id="desc">Two shoot-growth schematics contrast negative gravitropism and positive phototropism. In darkness, a shoot curves upward away from downward gravity. With light from one side, the shoot curves toward the light. Both are directional growth responses.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#32745a" stroke-width="1.5"/></marker></defs><rect width="1000" height="620" rx="22" fill="#faf8e9"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="54" font-size="30" text-anchor="start" fill="#183f35" font-weight="bold">Directional growth reveals two tropisms</text><rect x="45" y="110" width="440" height="390" rx="18" fill="#e4f0dc" stroke="#32745a" stroke-width="2"/><rect x="515" y="110" width="440" height="390" rx="18" fill="#e4f0dc" stroke="#32745a" stroke-width="2"/><text x="265" y="155" font-size="27" text-anchor="middle" fill="#183f35" font-weight="normal">Darkness</text><text x="735" y="155" font-size="27" text-anchor="middle" fill="#183f35" font-weight="normal">Light from one side</text><path d="M140 400 Q260 420 280 370 Q300 330 300 240" stroke="#377853" stroke-width="12" fill="none" /><path d="M610 400 Q700 425 725 360 Q745 305 825 265" stroke="#377853" stroke-width="12" fill="none" /><path d="M100 215 L100 330" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><text x="130" y="265" font-size="23" text-anchor="start" fill="#183f35" font-weight="normal">Gravity</text><path d="M880 230 L800 270" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><text x="850" y="210" font-size="23" text-anchor="start" fill="#183f35" font-weight="normal">Light</text><text x="265" y="440" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">Shoot grows upwards</text><text x="265" y="472" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">Negative gravitropism</text><text x="735" y="440" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">Shoot grows towards light</text><text x="735" y="472" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">Positive phototropism</text><text x="500" y="560" font-size="24" text-anchor="middle" fill="#183f35" font-weight="normal">“Negative” describes direction away from a stimulus.</text><text x="500" y="594" font-size="24" text-anchor="middle" fill="#183f35" font-weight="normal">Both plants still show a tropic response.</text></g></svg>