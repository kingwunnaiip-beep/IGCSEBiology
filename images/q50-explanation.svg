<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="q50-title q50-desc"><title id="q50-title">W = LH · Y = oestrogen</title><desc id="q50-desc">Four qualitative menstrual-cycle hormone curves show W, the sharp LH surge around day 14, and dashed Y, oestrogen with a pre-ovulation peak and a later rise. Progesterone rises after ovulation and FSH has a smaller mid-cycle peak. The horizontal axis is cycle day; no concentration numbers are invented.</desc><defs><marker id="q50-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#244d3d"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;font-size:28px;fill:#244d3d}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}.heading{font-size:32px;font-weight:700}.small{font-size:28px}.bold{font-weight:700}.red{fill:#b65350}.blue{fill:#447c9a}.muted{fill:#698476}.arrow{stroke:#244d3d;stroke-width:4;fill:none;marker-end:url(#q50-arrow)}</style><rect x="1" y="1" width="638" height="418" rx="24" fill="#f5f8f2" stroke="#dbe9d7" stroke-width="2"/><text x="30" y="45" class="heading">W = LH · Y = oestrogen</text><g transform="translate(0 72) scale(1 .8)"><path d="M60 25 V280 H620" fill="none" stroke="#698476" stroke-width="3"/><line x1="340" y1="40" x2="340" y2="280" stroke="#dbe9d7" stroke-width="3" stroke-dasharray="5 6"/><path d="M60 215 C140 210 215 205 280 180 C310 165 326 120 335 75 C339 25 343 20 347 75 C353 165 375 205 420 218 C470 227 555 230 620 230" fill="none" stroke="#659b78" stroke-width="5" /><path d="M60 244 C150 244 205 230 255 190 C280 165 295 140 310 132 C322 128 332 148 344 168 C365 200 390 201 420 191 C460 176 490 153 520 145 C570 127 592 162 608 205 C614 220 617 229 620 232" fill="none" stroke="#447c9a" stroke-width="5" stroke-dasharray="12 8"/><path d="M60 250 C160 250 230 250 280 250 C320 250 342 238 360 215 C385 175 410 149 445 135 C480 