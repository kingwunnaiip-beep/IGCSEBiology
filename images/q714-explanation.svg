<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">A group-O child reveals the parents’ recessive alleles</title><desc id="desc">A Punnett grid crosses heterozygous group A and B parents. One cell contains group O, I-o I-o, requiring each parent to supply I-o.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">A group-O child reveals the parents’ recessive alleles</text><text x="525" y="132" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">Group-A parent: IᴬIᵒ</text><text x="175" y="300" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">Group-B</text><text x="175" y="335" font-size="25" fill="#173f32" text-anchor="middle" font-weight="400">parent: IᴮIᵒ</text><rect x="330" y="205" width="190" height="125" rx="0" fill="#f8f9ef" stroke="#24644b" stroke-width="2"/><rect x="520" y="205" width="190" height="125" rx="0" fill="#f8f9ef" stroke="#24644b" stroke-width="2"/><rect x="330" y="330" width="190" height="125" rx="0" fill="#f8f9ef" stroke="#24644b" stroke-width="2"/><rect x="520" y="330" width="190" height="125" rx="0" fill="#e2eddc" stroke="#24644b" stroke-width="2"/><text x="425" y="182" font-size="30" fill="#173f32" text-anchor="middle" font-weight="700">Iᴬ</text><text x="615" y="182" font-size="30" fill="#173f32" text-anchor="middle" font-weight="700">Iᵒ</text><text x="298" y="282" font-size="30" fill="#173f32" text-anchor="middle" font-weight="700">Iᴮ</text><text x="298" y="407" font-size="30" fill="#173f32" text-anchor="middle" font-weight="700">Iᵒ</text><text x="425" y="281" font-size="31" fill="#173f32" text-anchor="middle" font-weight="700">IᴬIᴮ</text><text x="615" y="281" font-size="31" fill="#173f32" text-anchor="middle" font-weight="700">IᴮIᵒ</text><text x="425" y="406" font-size="31" fill="#173f32" text-anchor="middle" font-weight="700">IᴬIᵒ</text><text x="615" y="406" font-size="31" fill="#173f32" text-anchor="middle" font-weight="700">IᵒIᵒ</text><text x="760" y="285" font-size="24" fill="#173f32" text-anchor="start" font-weight="400">An O child must</text><text x="760" y="316" font-size="24" fill="#173f32" text-anchor="start" font-weight="400">receive Iᵒ from</text><text x="760" y="347" font-size="24" fill="#173f32" text-anchor="start" font-weight="400">each parent.</text><text x="520" y="500" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">Both A and B parents must carry the O allele.</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">C: IᴬIᵒ and IᴮIᵒ</text></g></svg>