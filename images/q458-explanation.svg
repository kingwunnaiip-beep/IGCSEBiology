<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="q458-t q458-d"><title id="q458-t">Malnutrition includes deficiency and excess</title><desc id="q458-d">Three cause and consequence pathways connect low fibre to constipation, excess energy to obesity, and high saturated fat to coronary heart disease risk. COPD is linked to inhaled irritants.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#1d513d"/></marker></defs><rect width="1000" height="620" rx="24" fill="#fffdf3"/><g font-family="Arial, sans-serif"><text x="45" y="58" font-size="30" text-anchor="start" fill="#173e32" font-weight="bold">Malnutrition includes deficiency and excess</text><text x="55" y="112" font-size="24" text-anchor="start" fill="#173e32" font-weight="bold">Diet imbalance</text><text x="765" y="112" font-size="24" text-anchor="start" fill="#173e32" font-weight="bold">Possible outcome</text><rect x="50" y="142" width="490" height="100" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="295.0" y="184" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">Too little fibre</text><text x="295.0" y="219" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">less bulk in gut contents</text><path d="M560 192 L650 192" stroke="#1d513d" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="680" y="142" width="270" height="100" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="815.0" y="184" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">Constipation</text><rect x="50" y="267" width="490" height="100" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="295.0" y="309" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">Energy intake exceeds use</text><text x="295.0" y="344" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">excess stored as fat</text><path d="M560 317 L650 317" stroke="#1d513d" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="680" y="267" width="270" height="100" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="815.0" y="309" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">Obesity</text><rect x="50" y="392" width="490" height="100" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="295.0" y="434" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">High saturated fat intake</text><text x="295.0" y="469" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">increased arterial risk</text><path d="M560 442 L650 442" stroke="#1d513d" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="680" y="392" width="270" height="100" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="815.0" y="434" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">Coronary heart disease</text><text x="55" y="542" font-size="23" text-anchor="start" fill="#173e32" font-weight="normal">COPD: primarily linked to smoking and other inhaled irritants.</text><text x="45" y="589" font-size="18" text-anchor="start" fill="#546d5e" font-weight="normal">Original teaching schematic • qualitative unless values are stated</text></g></svg>