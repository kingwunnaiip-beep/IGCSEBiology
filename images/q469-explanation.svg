<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Vitamin D helps mineralise bones and teeth</title><desc id="desc">A causal chain links vitamin D to calcium absorption in the intestine and calcium deposition in bones and teeth. Deficiency reduces mineralisation, producing weak or deformed bones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#397653"/></marker></defs><rect width="960" height="560" rx="20" fill="#faf8ed"/><g font-family="Arial, sans-serif"><text x="36" y="48" font-size="28" text-anchor="start" fill="#173f31" font-weight="bold">Vitamin D helps mineralise bones and teeth</text><rect x="35" y="98" width="260" height="280" rx="14" fill="#e0eedc" stroke="#397653" stroke-width="2"/><rect x="350" y="98" width="260" height="280" rx="14" fill="#e0eedc" stroke="#397653" stroke-width="2"/><rect x="665" y="98" width="260" height="280" rx="14" fill="#e0eedc" stroke="#397653" stroke-width="2"/><text x="165" y="141" font-size="26" text-anchor="middle" fill="#173f31" font-weight="bold">Vitamin D</text><circle cx="165" cy="237" r="60" fill="#e4d797" stroke="#a59445" stroke-width="3"/><text x="165" y="245" font-size="46" text-anchor="middle" fill="#173f31" font-weight="bold">D</text><text x="165" y="340" font-size="20" text-anchor="middle" fill="#173f31" font-weight="normal">Supports absorption</text><text x="480" y="141" font-size="26" text-anchor="middle" fill="#173f31" font-weight="bold">Intestine</text><path d="M398 184Q440 175 433 213Q425 243 477 230Q540 215 552 248Q562 279 509 286L412 287" fill="none" stroke="#85986d" stroke-width="17" stroke-linecap="round"/><text x="480" y="340" font-size="20" text-anchor="middle" fill="#173f31" font-weight="normal">Calcium enters blood</text><text x="795" y="141" font-size="25" text-anchor="middle" fill="#173f31" font-weight="bold">Bones and teeth</text><path d="M764 203C726 162 702 214 746 228L797 282C815 332 865 302 826 271L776 216C811 180 771 161 764 203Z" fill="#e3dfc9" stroke="#677d5c" stroke-width="3"/><circle cx="771" cy="226" r="4" fill="#65845d" stroke="#397653" stroke-width="1"/><circle cx="783" cy="240" r="4" fill="#65845d" stroke="#397653" stroke-width="1"/><circle cx="796" cy="254" r="4" fill="#65845d" stroke="#397653" stroke-width="1"/><circle cx="808" cy="269" r="4" fill="#65845d" stroke="#397653" stroke-width="1"/><text x="795" y="340" font-size="20" text-anchor="middle" fill="#173f31" font-weight="normal">Normal mineralisation</text><path d="M303 236L340 236" fill="none" stroke="#397653" stroke-width="3"/><polygon points="340,236 328.0,231.0 328.0,241.0" fill="#397653"/><path d="M618 236L655 236" fill="none" stroke="#397653" stroke-width="3"/><polygon points="655,236 643.0,231.0 643.0,241.0" fill="#397653"/><text x="480" y="448" font-size="24" text-anchor="middle" fill="#173f31" font-weight="bold">Too little vitamin D → less calcium absorbed</text><text x="480" y="494" font-size="24" text-anchor="middle" fill="#173f31" font-weight="normal">Poor mineralisation → fragile or deformed bones</text></g></svg>