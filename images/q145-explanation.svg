<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080" role="img" aria-labelledby="q145-title q145-desc">
<title id="q145-title">145 · Neurotransmitters diffuse across the cleft</title>
<desc id="q145-desc">Answer B. A qualitative chemical synapse model shows a presynaptic terminal releasing neurotransmitters into a synaptic cleft. An arrow crosses the gap toward receptors on the postsynaptic membrane, showing net diffusion down a concentration gradient. Vesicle release is a separate step from diffusion across the gap. Dot counts, distances and membrane shapes are illustrative. Osmosis refers to water and does not describe neurotransmitter movement.</desc>
