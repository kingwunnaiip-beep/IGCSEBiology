<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1100" viewBox="0 0 960 1100" role="img" aria-labelledby="q79-title q79-desc">
<title id="q79-title">Pollen transfer: self or cross?</title>
<desc id="q79-desc">Answer A. Two plants of the same species each carry two flowers. Arrow P transfers pollen from an anther on plant 1 to a stigma on plant 2: cross-pollination. Arrow Q transfers pollen between flowers of plant 1: self-pollination. Cross-pollination usually produces more genetic variation than self-pollination. Both are part of sexual reproduction. Pollination is pollen transfer and occurs before fertilisation; self-pollination is not asexual reproduction.</desc>
