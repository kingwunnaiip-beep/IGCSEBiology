<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Compare carbon dioxide uptake and release</title><desc id="desc">In light a longer arrow represents faster photosynthesis taking in carbon dioxide, and a shorter arrow represents respiration releasing it. Net carbon dioxide falls and indicator is red according to this paper. In darkness photosynthesis stops but respiration continues, increasing carbon dioxide and turning indicator yellow. Arrow lengths are qualitative.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#327153"/></marker></defs><rect width="960" height="540" rx="24" fill="#faf9ef"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="49" text-anchor="start" fill="#163d31" font-size="30" font-weight="bold">Compare carbon dioxide uptake and release</text><text x="36" y="87" text-anchor="start" fill="#163d31" font-size="23" font-weight="normal">Carbon dioxide balance determines the indicator colour.</text><rect x="36" y="112" width="432" height="328" rx="18" fill="#e1eddf" stroke="#327153" stroke-width="2"/><text x="252" y="152" text-anchor="middle" fill="#163d31" font-size="27" font-weight="bold">LIGHT</text><rect x="492" y="112" width="432" height="328" rx="18" fill="#e1eddf" stroke="#327153" stroke-width="2"/><text x="708" y="152" text-anchor="middle" fill="#163d31" font-size="27" font-weight="bold">DARK</text><text x="65" y="198" text-anchor="start" fill="#163d31" font-size="24" font-weight="normal">Photosynthesis uses CO₂</text><path d="M70 226 L424 226" fill="none" stroke="#327153" stroke-width="10"/><path d="M414 219 L424 226 L414 233" fill="none" stroke="#327153" stroke-width="10"/><text x="65" y="278" text-anchor="start" fill="#163d31" font-size="24" font-weight="normal">Respiration releases CO₂</text><path d="M70 308 L230 308" fill="none" stroke="#327153" stroke-width="5"/><path d="M220 301 L230 308 L220 315" fill="none" stroke="#327153" stroke-width="5"/><text x="252" y="308" text-anchor="start" fill="#163d31" font-size="22" font-weight="normal">slower</text><text x="252" y="382" text-anchor="middle" fill="#163d31" font-size="28" font-weight="bold">CO₂ falls → red</text><text x="522" y="198" text-anchor="start" fill="#163d31" font-size="24" font-weight="normal">No photosynthesis</text><path d="M524 224 L876 224" fill="none" stroke="#a3aca1" stroke-width="3"/><text x="522" y="278" text-anchor="start" fill="#163d31" font-size="24" font-weight="normal">Respiration releases CO₂</text><path d="M526 308 L743 308" fill="none" stroke="#327153" stroke-width="5"/><path d="M733 301 L743 308 L733 315" fill="none" stroke="#327153" stroke-width="5"/><text x="708" y="382" text-anchor="middle" fill="#163d31" font-size="28" font-weight="bold">CO₂ rises → yellow</text><text x="480" y="478" text-anchor="middle" fill="#163d31" font-size="26" font-weight="bold">Respiration continues in both tubes.</text><text x="36" y="517" text-anchor="start" fill="#587064" font-size="17" font-weight="normal">Original teaching schematic • not to scale</text></g></svg>