<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Haploid gametes restore a diploid zygote</title><desc id="desc">An illustrative diploid parent cell has two pairs of chromosomes. Meiosis produces a haploid gamete with one chromosome of each type. It fuses with another haploid gamete, restoring two matching sets in the zygote. Here n equals 2 only as a teaching example.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="1.8"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#b85c50" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="38" y="54" font-size="30" fill="#173f32" font-weight="bold">Haploid gametes restore a diploid zygote</text><circle cx="162" cy="294" r="103" fill="#e4f0df" stroke="#24644b" stroke-width="4" /><line x1="122" y1="248.5" x2="122" y2="341.5" stroke="#24644b" stroke-width="10" stroke-linecap="round" /><line x1="144" y1="248.5" x2="144" y2="341.5" stroke="#537c9a" stroke-width="10" stroke-linecap="round" /><line x1="184" y1="263.5" x2="184" y2="326.5" stroke="#24644b" stroke-width="10" stroke-linecap="round" /><line x1="206" y1="263.5" x2="206" y2="326.5" stroke="#537c9a" stroke-width="10" stroke-linecap="round" /><circle cx="477" cy="208" r="66" fill="#e4f0df" stroke="#24644b" stroke-width="3" /><line x1="455" y1="176.5" x2="455" y2="241.5" stroke="#24644b" stroke-width="10" stroke-linecap="round" /><line x1="497" y1="187.5" x2="497" y2="230.5" stroke="#24644b" stroke-width="10" stroke-linecap="round" /><circle cx="477" cy="417" r="66" fill="#dcebf2" stroke="#537c9a" stroke-width="3" /><line x1="455" y1="385.5" x2="455" y2="450.5" stroke="#537c9a" stroke-width="10" stroke-linecap="round" /><line x1="497" y1="396.5" x2="497" y2="439.5" stroke="#537c9a" stroke-width="10" stroke-linecap="round" /><circle cx="808" cy="307" r="114" fill="#e4f0df" stroke="#24644b" stroke-width="4" /><line x1="763" y1="256.0" x2="763" y2="358.0" stroke="#24644b" stroke-width="10" stroke-linecap="round" /><line x1="787" y1="256.0" x2="787" y2="358.0" stroke="#537c9a" stroke-width="10" stroke-linecap="round" /><line x1="835" y1="273.5" x2="835" y2="340.5" stroke="#24644b" stroke-width="10" stroke-linecap="round" /><line x1="859" y1="273.5" x2="859" y2="340.5" stroke="#537c9a" stroke-width="10" stroke-linecap="round" /><line x1="275" y1="273" x2="397" y2="225" stroke="#24644b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="550" y1="218" x2="688" y2="268" stroke="#24644b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="549" y1="408" x2="688" y2="352" stroke="#24644b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="166" y="139" font-size="25" text-anchor="middle" fill="#173f32" font-weight="bold">Parent cell</text><text x="166" y="170" font-size="25" text-anchor="middle" fill="#173f32" font-weight="bold">2n = 4</text><text x="334" y="217" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">Meiosis</text><text x="477" y="121" font-size="25" text-anchor="middle" fill="#173f32" font-weight="bold">Gamete: n = 2</text><text x="478" y="515" font-size="23" text-anchor="middle" fill="#173f32" font-weight="normal">Other gamete: n = 2</text><text x="808" y="463" font-size="27" text-anchor="middle" fill="#173f32" font-weight="bold">Zygote: 2n = 4</text><text x="632" y="154" font-size="25" text-anchor="middle" fill="#173f32" font-weight="bold">Fertilisation</text><text x="808" y="508" font-size="28" text-anchor="middle" fill="#173f32" font-weight="bold">n + n = 2n</text><text x="500" y="558" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">D · Meiosis makes haploid gametes. Example shown: n = 2.</text></g></svg>
