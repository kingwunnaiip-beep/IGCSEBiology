<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="q263-title q263-desc">
<title id="q263-title">How seaweed-like appearance can be selected</title>
<desc id="q263-desc">Heritable variation means leafy sea-dragons differ in appearance. In a seaweed habitat, better camouflage can improve survival. Survivors reproduce and pass appearance alleles to offspring. Over generations the advantageous alleles can become more common. This is natural selection; humans do not choose the parents.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="790" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >How seaweed-like appearance can be selected</text><rect x="50" y="120" width="470" height="200" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="285.0" y="160" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >1. Heritable variation</text><text x="285.0" y="202" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Individuals differ in</text><text x="285.0" y="235" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >seaweed-like appearance.</text><rect x="600" y="120" width="470" height="200" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="835.0" y="160" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >2. Survival advantage</text><text x="835.0" y="202" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Camouflage in seaweed can</text><text x="835.0" y="235" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >reduce detection by predators.</text><rect x="600" y="400" width="470" height="200" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="835.0" y="440" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >3. Reproduction</text><text x="835.0" y="482" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Survivors pass appearance</text><text x="835.0" y="515" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >alleles to their offspring.</text><rect x="50" y="400" width="470" height="200" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="285.0" y="440" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >4. Across generations</text><text x="285.0" y="482" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Advantageous alleles can</text><text x="285.0" y="515" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >become more common.</text><line x1="530" y1="220" x2="590" y2="220" stroke="#25614b" stroke-width="4"/><polygon points="590,220 576.6950761583107,226.92668763312224 576.6950761583107,213.07331236687776" fill="#25614b"/><line x1="835" y1="335" x2="835" y2="385" stroke="#25614b" stroke-width="4"/><polygon points="835,385 828.0733123668778,371.6950761583107 841.9266876331222,371.6950761583107" fill="#25614b"/><line x1="590" y1="500" x2="530" y2="500" stroke="#25614b" stroke-width="4"/><polygon points="530,500 543.3049238416893,493.07331236687776 543.3049238416893,506.92668763312224" fill="#25614b"/><text x="560" y="675" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Statements 1 and 2 describe adaptation and inheritance.</text><text x="560" y="713" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Statement 3 describes human choice, which is artificial selection.</text>
</g></svg>