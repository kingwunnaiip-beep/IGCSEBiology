<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="q59-title q59-desc"><title id="q59-title">Adrenal glands release adrenaline, which widens pupils</title><desc id="q59-desc">The yellow adrenal glands sit above the two kidneys. They release adrenaline into the blood. Compared with the normal eye, the lower eye has a larger black pupil, while the outer iris stays the same size: pupil diameter increases.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#537b61"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#b85b4f"/></marker><marker id="ay" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#e4bd55"/></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#668d9c"/></marker></defs><rect width="640" height="420" rx="20" fill="#f3f6ed"/><g font-family="Arial, Helvetica, sans-serif"><text x="153" y="46" fill="#243d32" text-anchor="middle" font-size="30" font-weight="700">Adrenal glands</text><text x="512" y="46" fill="#243d32" text-anchor="middle" font-size="30" font-weight="700">Pupil response</text><g transform="translate(93 227) scale(1 1)"><path d="M-13 -62 C-68 -68 -78 8 -50 51 C-24 84 27 54 13 25 C-12 16 -15 2 10 -19 C32 -43 10 -62 -13 -62Z" fill="#c58d78" stroke="#8a5b4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M9 -16 Q-6 -3 9 22" fill="none" stroke="#b85b4f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M7 24 L14 83" fill="none" stroke="#cc8d4d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M-57 -76 Q-32 -111 -4 -78 Q-24 -67 -57 -76Z" fill="#e4bd55" stroke="#cc8d4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(205 227) scale(-1 1)"><path d="M-13 -62 C-68 -68 -78 8 -50 51 C-24 84 27 54 13 25 C-12 16 -15 2 10 -19 C32 -43 10 -62 -13 -62Z" fill="#c58d78" stroke="#8a5b4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M9 -16 Q-6 -3 9 22" fill="none" stroke="#b85b4f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M7 24 L14 83" fill="none" stroke="#cc8d4d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M-57 -76 Q-32 -111 -4 -78 Q-24 -67 -57 -76Z" fill="#e4bd55" stroke="#cc8d4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M112 64 L61 130 M198 64 L237 130" fill="none" stroke="#cc8d4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="152" y="366" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">Kidneys</text><line x1="277" y1="220" x2="402" y2="220" stroke="#537b61" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><text x="339" y="190" fill="#243d32" text-anchor="middle" font-size="28" font-weight="700">Adrenaline</text><path d="M429 132 Q468 83 513 85 Q558 83 597 132 Q558 181 513 179 Q468 181 429 132Z" fill="#fffef9" stroke="#243d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="513" cy="132" r="40" fill="#b4ceb1" stroke="#537b61" stroke-width="3"/><circle cx="513" cy="132" r="15" fill="#243d32" stroke="none" stroke-width="3"/><path d="M429 292 Q468 243 513 245 Q558 243 597 292 Q558 341 513 339 Q468 341 429 292Z" fill="#fffef9" stroke="#243d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="513" cy="292" r="40" fill="#b4ceb1" stroke="#537b61" stroke-width="3"/><circle cx="513" cy="292" r="29" fill="#243d32" stroke="none" stroke-width="3"/><text x="512" y="207" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">Normal</text><line x1="602" y1="171" x2="602" y2="252" stroke="#537b61" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><text x="512" y="382" fill="#243d32" text-anchor="middle" font-size="30" font-weight="700">Larger pupil</text></g></svg>