<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which features protect against pathogens in food?</title><desc id="desc">Three parallel checks: red blood cells do not provide immune defence; stomach acid kills many swallowed pathogens; white blood cells defend against pathogens. No, yes, yes is row C.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700" text-anchor="start" fill="#193e34">Which features protect against pathogens in food?</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="185" y="176" font-size="23" font-weight="700" text-anchor="middle" fill="#193e34">Red blood cells</text><text x="185" y="226" font-size="29" font-weight="700" text-anchor="middle" fill="#193e34">No</text><text x="50" y="278" font-size="20" font-weight="400" text-anchor="start" fill="#193e34">Transport respiratory gases.</text><text x="50" y="307" font-size="20" font-weight="400" text-anchor="start" fill="#193e34">Do not provide</text><text x="50" y="336" font-size="20" font-weight="400" text-anchor="start" fill="#193e34">immune defence.</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="540" y="176" font-size="23" font-weight="700" text-anchor="middle" fill="#193e34">Stomach acid</text><text x="540" y="226" font-size="29" font-weight="700" text-anchor="middle" fill="#193e34">Yes</text><text x="405" y="278" font-size="20" font-weight="400" text-anchor="start" fill="#193e34">Kills many swallowed</text><text x="405" y="307" font-size="20" font-weight="400" text-anchor="start" fill="#193e34">pathogens in the stomach.</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="895" y="176" font-size="23" font-weight="700" text-anchor="middle" fill="#193e34">White blood cells</text><text x="895" y="226" font-size="29" font-weight="700" text-anchor="middle" fill="#193e34">Yes</text><text x="760" y="278" font-size="20" font-weight="400" text-anchor="start" fill="#193e34">Destroy pathogens and</text><text x="760" y="307" font-size="20" font-weight="400" text-anchor="start" fill="#193e34">produce antibodies.</text><text x="38" y="406" font-size="17" font-weight="400" text-anchor="start" fill="#193e34">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>