<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-labelledby="q285-title q285-desc">
<title id="q285-title">Protein similarity is evidence of shared ancestry</title>
<desc id="q285-desc">A branching ancestry diagram shows one ancestral gene inherited by two animal lineages. Both animals have the same amino acid sequence in the protein compared. This supports common ancestry but does not by itself assign the animals to the same genus.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
