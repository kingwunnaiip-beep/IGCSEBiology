<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1310" viewBox="0 0 1000 1310" role="img" aria-labelledby="q110-title q110-desc">
<title id="q110-title">110 · Biodiversity counts the different species</title>
<desc id="q110-desc">Answer D: the number of different species that live in an area. The two illustrative sites each contain twelve individual organisms. Site one has twelve individuals of species A: one species. Site two has three individuals of each of species A, B, C and D: four species. Different shapes identify explicitly defined species in this model, not measured organisms from a field survey. Counting individuals alone does not measure species richness. A population consists of organisms of one species in an area, a community includes all its populations, and an ecosystem includes the community interacting with its environment.</desc>
