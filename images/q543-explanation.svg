<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">A snake decline affects both prey and predators</title><desc id="desc">Food chain grass to locusts to snakes to eagles. After snake numbers halve, locusts increase because of reduced predation, grass decreases because more locusts feed on it, and eagles decrease because less snake prey is available.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2e7656"/></marker></defs><rect width="1000" height="620" rx="24" fill="#fbf9ec"/><g font-family="sans-serif" fill="#173e32"><text x="42" y="55" font-size="31" text-anchor="start" fill="#173e32">A snake decline affects both prey and predators</text><rect x="30" y="160" width="205" height="255" rx="18" fill="#d5dfc7" stroke="#548269" stroke-width="2"/><text x="132" y="207" font-size="28" text-anchor="middle" fill="#173e32">Grass</text><text x="132" y="383" font-size="25" text-anchor="middle" fill="#173e32">decrease</text><path d="M240 270 L270 270" fill="none" stroke="#2e7656" stroke-width="5" marker-end="url(#arrow)"/><path d="M132 240 L132 330" fill="none" stroke="#2e7656" stroke-width="5" marker-end="url(#arrow)"/><rect x="275" y="160" width="205" height="255" rx="18" fill="#d5dfc7" stroke="#548269" stroke-width="2"/><text x="377" y="207" font-size="28" text-anchor="middle" fill="#173e32">Locusts</text><text x="377" y="383" font-size="25" text-anchor="middle" fill="#173e32">increase</text><path d="M485 270 L515 270" fill="none" stroke="#2e7656" stroke-width="5" marker-end="url(#arrow)"/><path d="M103 95"/><path d="M377 330 L377 240" fill="none" stroke="#2e7656" stroke-width="5" marker-end="url(#arrow)"/><rect x="520" y="160" width="205" height="255" rx="18" fill="#f0d9c5" stroke="#548269" stroke-width="2"/><text x="622" y="207" font-size="28" text-anchor="middle" fill="#173e32">Snakes</text><text x="622" y="383" font-size="25" text-anchor="middle" fill="#173e32">halved</text><path d="M730 270 L760 270" fill="none" stroke="#2e7656" stroke-width="5" marker-end="url(#arrow)"/><path d="M622 240 L622 330" fill="none" stroke="#2e7656" stroke-width="5" marker-end="url(#arrow)"/><rect x="765" y="160" width="205" height="255" rx="18" fill="#d5dfc7" stroke="#548269" stroke-width="2"/><text x="867" y="207" font-size="28" text-anchor="middle" fill="#173e32">Eagles</text><text x="867" y="383" font-size="25" text-anchor="middle" fill="#173e32">decrease</text><path d="M867 240 L867 330" fill="none" stroke="#2e7656" stroke-width="5" marker-end="url(#arrow)"/><text x="500" y="114" font-size="23" text-anchor="middle" fill="#173e32">Arrows in the chain show food → consumer</text><text x="500" y="468" font-size="24" text-anchor="middle" fill="#173e32">Fewer snakes → less predation on locusts → more locusts</text><text x="500" y="513" font-size="23" text-anchor="middle" fill="#173e32">More locusts eat more grass; fewer snakes provide less eagle food.</text><text x="500" y="582" font-size="21" text-anchor="middle" fill="#173e32">Predictions assume other influences remain comparable.</text></g></svg>