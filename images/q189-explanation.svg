roke="#b94a43" stroke-width="2"/><text x="730.0" y="817" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Maternal urea ↑</text><text x="730.0" y="861" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Received from fetal blood</text><text x="500" y="1015" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >The mother’s kidneys remove the received urea.</text><text x="500" y="1073" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative solute exchange; the arrows do not show blood mixing.</text><rect x="24" y="1134" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1168" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer B · Dissolved oxygen decreases · Urea increases</text>
