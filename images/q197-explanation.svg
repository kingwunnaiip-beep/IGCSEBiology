chor="middle" >Internal partition between right and left</text><text x="500.0" y="773" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Prevents the two blood supplies from mixing.</text><rect x="80" y="875" width="840" height="110" rx="12" fill="#f7efdf" stroke="#daa958" stroke-width="2"/><text x="500.0" y="915" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Atrioventricular valves prevent backflow</text><text x="500.0" y="958" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >They lie between an atrium and ventricle on each side.</text><rect x="24" y="994" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1028" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · Septum</text>
