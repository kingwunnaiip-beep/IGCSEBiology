<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1290" viewBox="0 0 1000 1290" role="img" aria-labelledby="q209-title q209-desc">
<title id="q209-title">209 · Lightning and bacteria can fix nitrogen</title>
<desc id="q209-desc">Answer D, nitrogen fixation. Both routes begin with atmospheric nitrogen gas, N2, and convert it into nitrogen compounds. In the left conceptual branch lightning provides energy for nitrogen to react with oxygen; products enter rain and can contribute nitrate to soil. In the right branch nitrogen-fixing bacteria convert nitrogen into ammonia or ammonium compounds. The diagram distinguishes these routes rather than making their end products identical. Separate cards distinguish nitrification, ammonium to nitrate, and denitrification, nitrate to nitrogen gas. Deamination removes the nitrogen-containing group from amino acids. All arrows show qualitative process direction without measured rates.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1290" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >209 · Lightning and bacteria can fix nitrogen</text><text x="500" y="112" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Fixation starts with nitrogen gas from the atmosphere.</text><rect x="195" y="160" width="610" height="124" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="200" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Atmospheric nitrogen gas · N₂</text><text x="500.0" y="243" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Converted into nitrogen compounds</text><line x1="500" y1="302" x2="500" y2="331" stroke="#25614b" stroke-width="4"/><line x1="267" y1="331" x2="733" y2="331" stroke="#25614b" stroke-width="4"/><line x1="267" y1="331" x2="267" y2="380" stroke="#25614b" stroke-width="4"/><polygon points="267,380 260.07331236687776,366.6950761583107 273.92668763312224,366.6950761583107" fill="#25614b"/><line x1="733" y1="331" x2="733" y2="380" stroke="#25614b" stroke-width="4"/><polygon points="733,380 726.0733123668778,366.6950761583107 739.9266876331222,366.6950761583107" fill="#25614b"/><rect x="55" y="398" width="425" height="187" rx="12" fill="#f4efdf" stroke="#daa958" stroke-width="2"/><text x="267.5" y="438" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Lightning route</text><text x="267.5" y="481" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Energy allows reaction</text><text x="267.5" y="517" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >with oxygen in the air.</text><text x="267.5" y="553" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Products enter rain.</text><rect x="520" y="398" width="425" height="187" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="732.5" y="438" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Bacterial route</text><text x="732.5" y="481" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Nitrogen-fixing bacteria</text><text x="732.5" y="517" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >convert nitrogen into</text><text x="732.5" y="553" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >ammonia / ammonium.</text><line x1="267" y1="604" x2="267" y2="649" stroke="#25614b" stroke-width="5"/><polygon points="267,649 260.07331236687776,635.6950761583107 273.92668763312224,635.6950761583107" fill="#25614b"/><line x1="733" y1="604" x2="733" y2="649" stroke="#25614b" stroke-width="5"/><polygon points="733,649 726.0733123668778,635.6950761583107 739.9266876331222,635.6950761583107" fill="#25614b"/><rect x="55" y="668" width="425" height="125" rx="12" fill="#f4efdf" stroke="#daa958" stroke-width="2"/><text x="267.5" y="708" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Can contribute nitrate</text><text x="267.5" y="751" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Nitrogen enters soil.</text><rect x="520" y="668" width="425" height="125" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="732.5" y="708" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Ammonia / ammonium</text><text x="732.5" y="751" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Nitrogen enters living systems.</text><text x="500" y="845" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Both routes are nitrogen fixation.</text><rect x="65" y="884" width="870" height="120" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="924" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Nitrification · ammonium → nitrite → nitrate</text><text x="500.0" y="967" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >A different bacterial pathway; it does not start with N₂.</text><rect x="65" y="1034" width="870" height="120" rx="12" fill="#f8e9df" stroke="#b94a43" stroke-width="2"/><text x="500.0" y="1074" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Denitrification · nitrate → nitrogen gas</text><text x="500.0" y="1117" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Returns nitrogen to the atmosphere.</text><text x="500" y="1197" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative pathways; deamination removes nitrogen from amino acids.</text><rect x="24" y="1214" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1248" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · Nitrogen fixation</text>
</g></svg>