<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Measure the small intestine: 7 m − 1 m = 6 m</title><desc id="desc">An illustrative uncoiled alimentary canal is aligned to a metre-marked string. The highlighted small intestine begins at 1 m and ends at 7 m. A dimension arrow spans exactly the same six metre intervals.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="1.8"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#b85c50" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="38" y="54" font-size="30" fill="#173f32" font-weight="bold">Measure the small intestine: 7 m − 1 m = 6 m</text><path d="M330 105 V120 C360 115 400 125 391 151 C381 180 333 167 345 150" fill="#f0c6b7" stroke="#b85c50" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><path d="M345 150 V390" fill="none" stroke="#d1a350" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" /><path d="M345 390 Q310 415 346 435 Q365 457 347 470" fill="none" stroke="#24644b" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" /><line x1="505" y1="110" x2="505" y2="470" stroke="#8b948b" stroke-width="3" stroke-linecap="round" /><line x1="493" y1="110" x2="518" y2="110" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><text x="538" y="118" font-size="23" text-anchor="start" fill="#173f32" font-weight="normal">0</text><line x1="493" y1="150" x2="518" y2="150" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><text x="538" y="158" font-size="23" text-anchor="start" fill="#173f32" font-weight="normal">1</text><line x1="493" y1="190" x2="518" y2="190" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><text x="538" y="198" font-size="23" text-anchor="start" fill="#173f32" font-weight="normal">2</text><line x1="493" y1="230" x2="518" y2="230" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><text x="538" y="238" font-size="23" text-anchor="start" fill="#173f32" font-weight="normal">3</text><line x1="493" y1="270" x2="518" y2="270" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><text x="538" y="278" font-size="23" text-anchor="start" fill="#173f32" font-weight="normal">4</text><line x1="493" y1="310" x2="518" y2="310" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><text x="538" y="318" font-size="23" text-anchor="start" fill="#173f32" font-weight="normal">5</text><line x1="493" y1="350" x2="518" y2="350" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><text x="538" y="358" font-size="23" text-anchor="start" fill="#173f32" font-weight="normal">6</text><line x1="493" y1="390" x2="518" y2="390" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><text x="538" y="398" font-size="23" text-anchor="start" fill="#173f32" font-weight="normal">7</text><line x1="493" y1="430" x2="518" y2="430" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><text x="538" y="438" font-size="23" text-anchor="start" fill="#173f32" font-weight="normal">8</text><line x1="493" y1="470" x2="518" y2="470" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><text x="538" y="478" font-size="23" text-anchor="start" fill="#173f32" font-weight="normal">9</text><text x="504" y="89" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">m</text><line x1="352" y1="150" x2="487" y2="150" stroke="#8b948b" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 6"/><line x1="353" y1="390" x2="487" y2="390" stroke="#8b948b" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 6"/><line x1="650" y1="150" x2="650" y2="390" stroke="#24644b" stroke-width="4" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line x1="630" y1="150" x2="674" y2="150" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><line x1="630" y1="390" x2="674" y2="390" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><text x="720" y="251" font-size="29" text-anchor="start" fill="#173f32" font-weight="bold">7 − 1 = 6 m</text><text x="720" y="286" font-size="29" text-anchor="start" fill="#173f32" font-weight="bold">small intestine</text><text x="65" y="168" font-size="25" text-anchor="start" fill="#173f32" font-weight="bold">Start at 1 m</text><line x1="220" y1="161" x2="319" y2="151" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><text x="65" y="406" font-size="25" text-anchor="start" fill="#173f32" font-weight="bold">End at 7 m</text><line x1="220" y1="400" x2="319" y2="390" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><text x="500" y="558" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">B · Six marked metre intervals; do not use the end reading alone.</text></g></svg>
