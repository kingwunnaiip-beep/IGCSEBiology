<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1330" viewBox="0 0 1000 1330" role="img" aria-labelledby="q210-title q210-desc">
<title id="q210-title">210 · Useful bacterial features are statements 3 and 4</title>
<desc id="q210-desc">Answer D, statements 3 and 4. The four statements are checked in their printed order. Statement 1, unaffected by antibiotics, is false: antibiotics can affect susceptible bacteria, although resistant strains exist. Statement 2, do not contain plasmids, is false: many bacteria contain plasmids useful in genetic engineering. Statement 3, make complex molecules, is true: bacteria can produce useful proteins such as enzymes. Statement 4, reproduce rapidly, is true under suitable conditions. The bottom qualitative illustrations show a protein chain and one bacterial cell giving rise to more cells. Molecule counts, cell counts, cell sizes and growth rates are illustrative, not measured source data.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1330" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >210 · Useful bacterial features are statements 3 and 4</text><text x="500" y="112" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Check every statement, keeping its original number.</text><rect x="65" y="160" width="870" height="125" rx="12" fill="#f8e9df" stroke="#b94a43" stroke-width="2"/><text x="500.0" y="200" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >1 · Unaffected by antibiotics</text><text x="500.0" y="243" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >FALSE · Susceptible bacteria can be affected.</text><rect x="65" y="318" width="870" height="125" rx="12" fill="#f8e9df" stroke="#b94a43" stroke-width="2"/><text x="500.0" y="358" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >2 · Do not contain plasmids</text><text x="500.0" y="401" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >FALSE · Many bacteria do contain plasmids.</text><rect x="65" y="476" width="870" height="125" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="516" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >3 · Make complex molecules</text><text x="500.0" y="559" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >TRUE · They can produce useful proteins.</text><rect x="65" y="634" width="870" height="125" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="674" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >4 · Reproduce rapidly</text><text x="500.0" y="717" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >TRUE · Large populations can grow quickly.</text><rect x="55" y="830" width="425" height="275" rx="12" fill="#edf5f8" stroke="none" stroke-width="2"/