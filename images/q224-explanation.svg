<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1110" viewBox="0 0 1000 1110" role="img" aria-labelledby="q224-title q224-desc">
<title id="q224-title">224 · Progesterone maintains the uterine lining</title>
<desc id="q224-desc">Progesterone maintains the uterine lining, or endometrium, during pregnancy. A simplified cross-section shows uterine muscle outside, the highlighted endometrium inside it, and the uterine cavity centrally. The lining leader lands on the highlighted band. This qualitative section shows tissue relationships only; it is not a measured anatomy drawing or pregnancy image. FSH develops follicles, LH triggers ovulation and oestrogen repairs and thickens the lining earlier in the cycle. Answer D.</desc>
