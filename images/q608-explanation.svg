<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Magnification is image length ÷ actual length</title><desc id="desc">Two leaf specimens are drawn with length bars in a 1.8 to 1 ratio. The actual length is 25 mm and the photographic image is 45 mm, so magnification is 45 divided by 25, or 1.8.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="53" font-size="31" text-anchor="start" font-weight="bold" fill="#173f32">Magnification is image length ÷ actual length</text><text x="210" y="140" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">Actual specimen</text><text x="680" y="140" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">Photographic image</text><g transform="translate(110 300) rotate(0)"><path d="M0 0 Q90.0 -65 200 0 Q90.0 65 0 0" fill="#91b68b" stroke="#24644b" stroke-width="3"/><path d="M0 0 H200" stroke="#24644b" stroke-width="2"/></g><g transform="translate(500 300) rotate(0)"><path d="M0 0 Q162.0 -117 360 0 Q162.0 117 0 0" fill="#91b68b" stroke="#24644b" stroke-width="3"/><path d="M0 0 H360" stroke="#24644b" stroke-width="2"/></g><path d="M110 435 L310 435" fill="none" stroke="#24644b" stroke-width="3"/><path d="M110 420 L110 450" fill="none" stroke="#24644b" stroke-width="3"/><path d="M310 420 L310 450" fill="none" stroke="#24644b" stroke-width="3"/><path d="M150 430 L150 440" fill="none" stroke="#24644b" stroke-width="2"/><path d="M190 430 L190 440" fill="none" stroke="#24644b" stroke-width="2"/><path d="M230 430 L230 440" fill="none" stroke="#24644b" stroke-width="2"/><path d="M270 430 L270 440" fill="none" stroke="#24644b" stroke-width="2"/><text x="210.0" y="485" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">25 mm</text><path d="M500 435 L860 435" fill="none" stroke="#24644b" stroke-width="3"/><path d="M500 420 L500 450" fill="none" stroke="#24644b" stroke-width="3"/><path d="M860 420 L860 450" fill="none" stroke="#24644b" stroke-width="3"/><path d="M540 430 L540 440" fill="none" stroke="#24644b" stroke-width="2"/><path d="M580 430 L580 440" fill="none" stroke="#24644b" stroke-width="2"/><path d="M620 430 L620 440" fill="none" stroke="#24644b" stroke-width="2"/><path d="M660 430 L660 440" fill="none" stroke="#24644b" stroke-width="2"/><path d="M700 430 L700 440" fill="none" stroke="#24644b" stroke-width="2"/><path d="M740 430 L740 440" fill="none" stroke="#24644b" stroke-width="2"/><path d="M780 430 L780 440" fill="none" stroke="#24644b" stroke-width="2"/><path d="M820 430 L820 440" fill="none" stroke="#24644b" stroke-width="2"/><text x="680.0" y="485" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">45 mm</text><text x="500" y="553" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">45 mm ÷ 25 mm = ×1.8 (C)</text><text x="500" y="586" font-size="20" text-anchor="middle" font-weight="normal" fill="#173f32">The two drawn length bars have the same scale.</text></g></svg>