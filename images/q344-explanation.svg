<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790" role="img" aria-labelledby="q344-title q344-desc">
<title id="q344-title">Align the sequences and find the changed base</title>
<desc id="q344-desc">The normal DNA sequence TGA GGA CTC CTC changes to TGA GGA CAC CTC. Both have twelve bases. The eighth base changes from T to A, so this is a one-base substitution rather than an insertion or deletion.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
