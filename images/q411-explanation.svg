<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Retained protein becomes more concentrated</title><desc id="desc">Two schematic blood volumes contain the same six protein symbols. Filtration removes water and small solutes, leaving a smaller blood volume and therefore a higher protein concentration. Volumes are qualitative, not measured.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#185c44"/></marker></defs><rect width="1000" height="640" rx="24" fill="#faf8ec"/><g font-family="Arial, sans-serif"><text x="40" y="54" font-size="31" text-anchor="start" fill="#193e33" font-weight="bold">Retained protein becomes more concentrated</text><text x="235" y="115" font-size="27" text-anchor="middle" fill="#193e33" font-weight="bold">Before filtration</text><text x="765" y="115" font-size="27" text-anchor="middle" fill="#193e33" font-weight="bold">After filtration</text><rect x="85" y="150" width="300" height="210" rx="18" fill="#d9ece9" stroke="#185c44" stroke-width="3"/><rect x="665" y="150" width="200" height="210" rx="18" fill="#d9ece9" stroke="#185c44" stroke-width="3"/><circle cx="180" cy="205" r="13" fill="#185c44"/><circle cx="235" cy="205" r="13" fill="#185c44"/><circle cx="290" cy="205" r="13" fill="#185c44"/><circle cx="180" cy="280" r="13" fill="#185c44"/><circle cx="235" cy="280" r="13" fill="#185c44"/><circle cx="290" cy="280" r="13" fill="#185c44"/><circle cx="710" cy="205" r="13" fill="#185c44"/><circle cx="765" cy="205" r="13" fill="#185c44"/><circle cx="820" cy="205" r="13" fill="#185c44"/><circle cx="710" cy="280" r="13" fill="#185c44"/><circle cx="765" cy="280" r="13" fill="#185c44"/><circle cx="820" cy="280" r="13" fill="#185c44"/><text x="235" y="395" font-size="23" text-anchor="middle" fill="#193e33" font-weight="normal">Protein remains in blood</text><text x="765" y="395" font-size="23" text-anchor="middle" fill="#193e33" font-weight="normal">Same protein; less water</text><path d="M398 255 L647 255" stroke="#185c44" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="523" y="222" font-size="25" text-anchor="middle" fill="#193e33" font-weight="normal">filter</text><path d="M515 275 L515 420" stroke="#185c44" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M470 423 Q450 453 470 459 Q490 453 470 423" fill="#71abb5"/><path d="M515 448 Q495 478 515 484 Q535 478 515 448" fill="#71abb5"/><path d="M560 423 Q540 453 560 459 Q580 453 560 423" fill="#71abb5"/><text x="515" y="525" font-size="25" text-anchor="middle" fill="#193e33" font-weight="normal">Water and small solutes enter filtrate</text><text x="500" y="594" font-size="27" text-anchor="middle" fill="#193e33" font-weight="bold">Protein concentration = amount of protein ÷ liquid volume</text></g></svg>