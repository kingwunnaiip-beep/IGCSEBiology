<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img" aria-labelledby="q237-title q237-desc">
<title id="q237-title">Human anaerobic respiration produces lactic acid</title>
<desc id="q237-desc">Human muscle anaerobic pathway: glucose to lactic acid, releasing less energy per glucose than aerobic respiration. Oxygen is not required and carbon dioxide is not a product of this pathway. The original answer combination is no, no, low.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="670" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Human anaerobic respiration produces lactic acid</text><text x="500" y="105" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Human muscle pathway: qualitative model</text><rect x="65" y="150" width="300" height="110" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="215.0" y="188" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Glucose</text><rect x="635" y="150" width="300" height="110" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="785.0" y="188" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Lactic acid</text><line x1="390" y1="203" x2="610" y2="203" stroke="#25614b" stroke-width="4"/><polygon points="610,203 596.6950761583107,209.92668763312224 596.6950761583107,196.07331236687776" fill="#25614b"/><text x="500" y="299" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >A small energy yield is released.</text><rect x="45" y="345" width="260" height="190" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="175.0" y="383" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >CO₂ produced?</text><text x="175.0" y="422" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >NO</text><text x="175.0" y="456" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >not a product</text><text x="175.0" y="490" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >of this pathway</text><rect x="370" y="345" width="260" height="190" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="383" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Oxygen needed?</text><text x="500.0" y="422" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >NO</text><text x="500.0" y="456" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >anaerobic means</text><text x="500.0" y="490" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >without oxygen</text><rect x="695" y="345" width="260" height="190" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="825.0" y="383" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Energy yield?</text><text x="825.0" y="422" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >LOW</text><text x="825.0" y="456" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >per glucose,</text><text x="825.0" y="490" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >versus aerobic</text><text x="500" y="575" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Do not substitute yeast products: ethanol + carbon dioxide.</text><rect x="24" y="594" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="628" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >D — no carbon dioxide, no oxygen, low energy release</text>
</g></svg>