" stroke-width="7"/><line x1="666" y1="391" x2="642" y2="363" stroke="#357ca2" stroke-width="7"/><line x1="666" y1="391" x2="690" y2="363" stroke="#357ca2" stroke-width="7"/><line x1="764" y1="472" x2="764" y2="436" stroke="#357ca2" stroke-width="7"/><line x1="764" y1="436" x2="740" y2="408" stroke="#357ca2" stroke-width="7"/><line x1="764" y1="436" x2="788" y2="408" stroke="#357ca2" stroke-width="7"/><line x1="853" y1="411" x2="853" y2="375" stroke="#357ca2" stroke-width="7"/><line x1="853" y1="375" x2="829" y2="347" stroke="#357ca2" stroke-width="7"/><line x1="853" y1="375" x2="877" y2="347" stroke="#357ca2" stroke-width="7"/><text x="500" y="495" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Antibody symbols show the transfer principle.</text><rect x="65" y="545" width="870" height="168" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="586" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Passive immunity</text><text x="500.0" y="629" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Immediate but temporary protection.</text><text x="500.0" y="666" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >No recipient memory cells are formed by this transfer.</text><rect x="65" y="755" width="870" height="168" rx="12" fill="#f4efdf" stroke="#daa958" stroke-width="2"/><text x="500.0" y="796" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Examples of antibody transfer</text><text x="500.0" y="839" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Across the placenta · In breast milk</text><text x="500.0" y="876" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >By injection of an antibody preparation</text><rect x="65" y="965" width="870" height="152" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500" y="1007" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Active immunity follows a different pathway</text><text x="500" y="1050" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Antigen stimulates the recipient’s immune system</text><text x="500" y="1089" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >→ own antibodies + memory cells.</text><rect x="24" y="1174" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1208" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer A · Antibodies acquired from another individual</text>
</g></svg>