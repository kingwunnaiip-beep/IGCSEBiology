<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">What osmosis and diffusion have in common</title><desc id="desc">Diffusion is illustrated by particles spreading without a membrane. Osmosis is illustrated by water moving through a partially permeable membrane towards the more concentrated solution. Both are passive movements down a gradient.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#397653"/></marker></defs><rect width="960" height="560" rx="20" fill="#faf8ed"/><g font-family="Arial, sans-serif"><text x="36" y="48" font-size="28" text-anchor="start" fill="#173f31" font-weight="bold">What osmosis and diffusion have in common</text><rect x="36" y="90" width="430" height="320" rx="14" fill="#e0eedc" stroke="#397653" stroke-width="2"/><rect x="494" y="90" width="430" height="320" rx="14" fill="#e0eedc" stroke="#397653" stroke-width="2"/><text x="251" y="129" font-size="23" text-anchor="middle" fill="#173f31" font-weight="bold">Diffusion: no membrane needed</text><text x="709" y="129" font-size="23" text-anchor="middle" fill="#173f31" font-weight="bold">Osmosis: membrane required</text><circle cx="72" cy="188" r="7" fill="#759b70" stroke="#397653" stroke-width="1"/><circle cx="101" cy="213" r="7" fill="#759b70" stroke="#397653" stroke-width="1"/><circle cx="130" cy="188" r="7" fill="#759b70" stroke="#397653" stroke-width="1"/><circle cx="159" cy="213" r="7" fill="#759b70" stroke="#397653" stroke-width="1"/><circle cx="72" cy="255" r="7" fill="#759b70" stroke="#397653" stroke-width="1"/><circle cx="101" cy="280" r="7" fill="#759b70" stroke="#397653" stroke-width="1"/><circle cx="130" cy="255" r="7" fill="#759b70" stroke="#397653" stroke-width="1"/><circle cx="159" cy="280" r="7" fill="#759b70" stroke="#397653" stroke-width="1"/><circle cx="371" cy="207" r="7" fill="#759b70" stroke="#397653" stroke-width="1"/><circle cx="399" cy="266" r="7" fill="#759b70" stroke="#397653" stroke-width="1"/><path d="M191 235L335 235" fill="none" stroke="#397653" stroke-width="3"/><polygon points="335,235 323.0,230.0 323.0,240.0" fill="#397653"/><text x="251" y="357" font-size="20" text-anchor="middle" fill="#173f31" font-weight="normal">Net movement down a gradient</text><path d="M711 162L711 307" fill="none" stroke="#816f90" stroke-width="7"/><circle cx="534" cy="181" r="6" fill="#69a5b2" stroke="#397653" stroke-width="1"/><circle cx="575" cy="207" r="6" fill="#69a5b2" stroke="#397653" stroke-width="1"/><circle cx="617" cy="181" r="6" fill="#69a5b2" stroke="#397653" stroke-width="1"/><circle cx="656" cy="207" r="6" fill="#69a5b2" stroke="#397653" stroke-width="1"/><circle cx="534" cy="267" r="6" fill="#69a5b2" stroke="#397653" stroke-width="1"/><circle cx="575" cy="293" r="6" fill="#69a5b2" stroke="#397653" stroke-width="1"/><circle cx="617" cy="267" r="6" fill="#69a5b2" stroke="#397653" stroke-width="1"/><circle cx="656" cy="293" r="6" fill="#69a5b2" stroke="#397653" stroke-width="1"/><circle cx="761" cy="192" r="6" fill="#69a5b2" stroke="#397653" stroke-width="1"/><circle cx="811" cy="285" r="6" fill="#69a5b2" stroke="#397653" stroke-width="1"/><circle cx="773" cy="248" r="13" fill="#a8967a" stroke="#6b6652" stroke-width="1"/><circle cx="818" cy="201" r="13" fill="#a8967a" stroke="#6b6652" stroke-width="1"/><circle cx="854" cy="256" r="13" fill="#a8967a" stroke="#6b6652" stroke-width="1"/><path d="M646 236L766 236" fill="none" stroke="#397653" stroke-width="3"/><polygon points="766,236 754.0,231.0 754.0,241.0" fill="#397653"/><text x="709" y="343" font-size="20" text-anchor="middle" fill="#173f31" font-weight="normal">Water crosses a partially</text><text x="709" y="373" font-size="20" text-anchor="middle" fill="#173f31" font-weight="normal">permeable membrane</text><text x="480" y="466" font-size="25" text-anchor="middle" fill="#173f31" font-weight="bold">Both: net movement down a gradient</text><text x="480" y="508" font-size="24" text-anchor="middle" fill="#173f31" font-weight="normal">Both: passive — no metabolic energy input</text></g></svg>