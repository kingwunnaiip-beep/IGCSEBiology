<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="t d"><title id="t">Magnification compares image size with actual size</title><desc id="d">Two proportional bars represent image length26mm and actual length4mm. Image divided by actual equals magnification6.5, with matching units cancelling.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#286c50" stroke-width="1.5"/></marker></defs><rect width="960" height="560" rx="20" fill="#fbf9ed"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="28" text-anchor="start" fill="#173f32">Magnification compares image size with actual size</text><text x="70" y="130" font-size="26" text-anchor="start" fill="#173f32">Image wing length</text><rect x="70" y="160" width="650" height="48" rx="14" fill="#e0ecda" stroke="#286c50" stroke-width="3"/><text x="750" y="194" font-size="26" text-anchor="start" fill="#173f32">26 mm</text><text x="70" y="290" font-size="26" text-anchor="start" fill="#173f32">Actual wing length</text><rect x="70" y="320" width="100" height="48" rx="14" fill="#b6d5a3" stroke="#286c50" stroke-width="3"/><text x="200" y="354" font-size="26" text-anchor="start" fill="#173f32">4 mm</text><text x="480" y="450" font-size="36" text-anchor="middle" fill="#173f32">26 mm ÷ 4 mm = ×6.5</text><text x="480" y="510" font-size="23" text-anchor="middle" fill="#173f32">Compare lengths in matching units. The units cancel.</text></g></svg>