<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Fibrinogen becomes a fibrin mesh at the wound</title><desc id="desc">A cut blood vessel contains soluble fibrinogen proteins on one side and a fibrin network at the wound on the other. The network traps red blood cells and blocks entry of pathogens, identifying X as fibrinogen.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="53" font-size="31" text-anchor="start" font-weight="bold" fill="#173f32">Fibrinogen becomes a fibrin mesh at the wound</text><path d="M75 235 H580 M840 235 H935 M75 455 H935" fill="none" stroke="#b78279" stroke-width="16"/><path d="M75 250 H580 M840 250 H935 M75 440 H935" fill="none" stroke="#bb6066" stroke-width="3"/><rect x="75" y="260" width="860" height="165" rx="0" fill="#f1e0d0" stroke="none" stroke-width="0"/><path d="M130 315 q20 -20 35 0 t35 0" fill="none" stroke="#537c9a" stroke-width="5"/><path d="M230 380 q20 -20 35 0 t35 0" fill="none" stroke="#537c9a" stroke-width="5"/><path d="M335 300 q20 -20 35 0 t35 0" fill="none" stroke="#537c9a" stroke-width="5"/><path d="M425 390 q20 -20 35 0 t35 0" fill="none" stroke="#537c9a" stroke-width="5"/><ellipse cx="150" cy="395" rx="26" ry="17" fill="#cc8585" stroke="#bb6066" stroke-width="3" transform="rotate(-20 150 395)"/><ellipse cx="360" cy="375" rx="26" ry="17" fill="#cc8585" stroke="#bb6066" stroke-width="3" transform="rotate(-20 360 375)"/><ellipse cx="525" cy="320" rx="26" ry="17" fill="#cc8585" stroke="#bb6066" stroke-width="3" transform="rotate(-20 525 320)"/><ellipse cx="725" cy="330" rx="26" ry="17" fill="#cc8585" stroke="#bb6066" stroke-width="3" transform="rotate(-20 725 330)"/><ellipse cx="680" cy="390" rx="26" ry="17" fill="#cc8585" stroke="#bb6066" stroke-width="3" transform="rotate(-20 680 390)"/><path d="M600 215 L550 430" fill="none" stroke="#24644b" stroke-width="3"/><path d="M635 215 L585 430" fill="none" stroke="#24644b" stroke-width="3"/><path d="M670 215 L620 430" fill="none" stroke="#24644b" stroke-width="3"/><path d="M705 215 L655 430" fill="none" stroke="#24644b" stroke-width="3"/><path d="M740 215 L690 430" fill="none" stroke="#24644b" stroke-width="3"/><path d="M775 215 L725 430" fill="none" stroke="#24644b" stroke-width="3"/><path d="M810 215 L760 430" fill="none" stroke="#24644b" stroke-width="3"/><path d="M845 215 L795 430" fill="none" stroke="#24644b" stroke-width="3"/><path d="M570 230 L870 245" fill="none" stroke="#24644b" stroke-width="3"/><path d="M570 265 L870 280" fill="none" stroke="#24644b" stroke-width="3"/><path d="M570 300 L870 315" fill="none" stroke="#24644b" stroke-width="3"/><path d="M570 335 L870 350" fill="none" stroke="#24644b" stroke-width="3"/><path d="M570 370 L870 385" fill="none" stroke="#24644b" stroke-width="3"/><path d="M570 405 L870 420" fill="none" stroke="#24644b" stroke-width="3"/><g transform="translate(640 155) rotate(15)"><rect x="-20" y="-9" width="40" height="18" rx="9" fill="#bb6066" stroke="#173f32" stroke-width="1.5"/><path d="M-11 -2 Q0 7 11 -2" fill="none" stroke="#fff" stroke-width="2"/></g><g transform="translate(770 165) rotate(15)"><rect x="-20" y="-9" width="40" height="18" rx="9" fill="#bb6066" stroke="#173f32" stroke-width="1.5"/><path d="M-11 -2 Q0 7 11 -2" fill="none" stroke="#fff" stroke-width="2"/></g><g transform="translate(855 150) rotate(15)"><rect x="-20" y="-9" width="40" height="18" rx="9" fill="#bb6066" stroke="#173f32" stroke-width="1.5"/><path d="M-11 -2 Q0 7 11 -2" fill="none" stroke="#fff" stroke-width="2"/></g><path d="M750 175 L750 205" fill="none" stroke="#bb6066" stroke-width="3"/><path d="M735 205 L765 205" fill="none" stroke="#bb6066" stroke-width="4"/><text x="260" y="135" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">X: soluble fibrinogen</text><text x="725" y="110" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">Y: insoluble fibrin mesh</text><path d="M425 335 L550 335" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="260" y="495" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">Protein circulates in plasma</text><text x="735" y="495" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">Mesh traps cells in the clot</text><text x="500" y="553" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">B: X is fibrinogen</text><text x="500" y="586" font-size="20" text-anchor="middle" font-weight="normal" fill="#173f32">The clot limits blood loss and pathogen entry.</text></g></svg>