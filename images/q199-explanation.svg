<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1190" viewBox="0 0 1000 1190" role="img" aria-labelledby="q199-title q199-desc">
<title id="q199-title">199 · The liver makes urea; the kidneys excrete it</title>
<desc id="q199-desc">Answer C. A qualitative pathway begins with excess amino acids arriving at the liver. Deamination removes their nitrogen-containing amino groups, and this nitrogen is converted into urea. Blood carries urea to the kidneys, which remove it from blood into urine. The bladder stores urine. The pathway concerns the nitrogen-containing part of amino acids; it does not imply that each entire amino acid becomes urea. No quantities or rates are shown.</desc>
