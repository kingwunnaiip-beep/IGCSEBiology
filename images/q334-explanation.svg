<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img" aria-labelledby="q334-title q334-desc">
<title id="q334-title">Add the biomass of both primary consumers</title>
<desc id="q334-desc">The hazelnuts feed 150 squirrels and 3500 shrews. Their biomass is number times mean mass: 150 times 400 grams equals 60000 grams and 3500 times 20 grams equals 70000 grams. Total 130000 grams equals 130 kilograms. Foxes and owls are not primary consumers.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="800" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Add the biomass of both primary consumers</text><rect x="410" y="120" width="280" height="100" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="550.0" y="158" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Hazelnuts</text><text x="550.0" y="196" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Producer food source</text><line x1="450" y1="230" x2="285" y2="300" stroke="#25614b" stroke-width="4"/><polygon points="285,300 294.5430537035605,288.4271815874023 299.9534872922333,301.18034647498826" fill="#25614b"/><line x1="650" y1="230" x2="815" y2="300" stroke="#25614b" stroke-width="4"/><polygon points="815,300 800.0465127077667,301.18034647498826 805.4569462964396,288.4271815874023" fill="#25614b"/><rect x="80" y="305" width="430" height="150" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="295.0" y="343" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >150 squirrels</text><text x="295.0" y="381" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >150 × 400 g = 60 000 g</text><text x="295.0" y="412" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Primary consumers</text><rect x="590" y="305" width="430" height="150" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="805.0" y="343" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >3500 shrews</text><text x="805.0" y="381" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >3500 × 20 g = 70 000 g</text><text x="805.0" y="412" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Primary consumers</text><line x1="295" y1="465" x2="460" y2="535" stroke="#25614b" stroke-width="4"/><polygon points="460,535 445.0465127077667,536.1803464749883 450.4569462964395,523.4271815874023" fill="#25614b"/><line x1="805" y1="465" x2="640" y2="535" stroke="#25614b" stroke-width="4"/><polygon points="640,535 649.5430537035604,523.4271815874023 654.9534872922333,536.1803464749883" fill="#25614b"/><rect x="190" y="540" width="720" height="110" rx="12" fill="#e4f0df" stroke="#25614b" stroke-width="2"/><text x="550" y="581" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >60 000 g + 70 000 g = 130 000 g</text><text x="550" y="623" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >130 000 ÷ 1000 = 130 kg</text><text x="550" y="695" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Exclude foxes, owls and the hazelnuts from this total.</text><rect x="24" y="724" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="758" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >A: total primary-consumer biomass = 130 kg</text>
</g></svg>