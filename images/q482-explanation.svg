<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="q482-title q482-desc">
<title id="q482-title">Largest change means largest vertical difference</title>
<desc id="q482-desc">The largest absolute change occurs where the endpoints of equal one-year intervals differ most vertically. The 2005 to 2006 fall exceeds the changes during the other three listed intervals. Diagram illustrates comparison without supplying exact measured case counts.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="690" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Largest change means largest vertical difference</text><text x="500" y="105" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >All four options cover one year</text><text x="45" y="180" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >A · 2002–2003</text><line x1="315" y1="170" x2="420" y2="170" stroke="#357ca2" stroke-width="14"/><text x="650" y="180" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >rise</text><text x="45" y="268" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >B · 2003–2004</text><line x1="315" y1="258" x2="490" y2="258" stroke="#357ca2" stroke-width="14"/><text x="650" y="268" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >fall</text><text x="45" y="356" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >C · 2004–2005</text><line x1="315" y1="346" x2="360" y2="346" stroke="#357ca2" stroke-width="14"/><text x="650" y="356" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >small fall</text><text x="45" y="444" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >D · 2005–2006</text><line x1="315" y1="434" x2="600" y2="434" stroke="#25614b" stroke-width="14"/><text x="650" y="444" font-size="24" fill="#173d31" font-weight="700" text-anchor="start" >largest fall</text><text x="500" y="530" font-size="21" fill="#526c62" font-weight="400" text-anchor="middle" >Compare magnitude, whether rising or falling.</text><text x="500" y="558" font-size="21" fill="#526c62" font-weight="400" text-anchor="middle" >Lengths are schematic; use the original graph for data.</text><rect x="24" y="614" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="648" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >The 2005–2006 fall has the largest magnitude: D.</text>
</g></svg>