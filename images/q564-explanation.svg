<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Nutrient enrichment can deplete river oxygen</title><desc id="desc">Nitrate runoff enters a river with an algal bloom; dead algal material sinks and decomposer bacteria use oxygen, leaving fish at risk.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="bluearrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="45" font-size="28" fill="#173f32" text-anchor="start" font-weight="bold">Nutrient enrichment can deplete river oxygen</text><text x="500" y="555" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">This full nutrient-enrichment and oxygen-depletion sequence is eutrophication.</text><path d="M50 250 Q220 220 430 250 T950 250 L950 480 Q700 500 500 480 T50 480 Z" fill="#d9eaf1" stroke="#537c9a" stroke-width="3" /><path d="M50 245 Q220 220 430 245" fill="none" stroke="#bc824b" stroke-width="12" /><text x="55" y="140" font-size="24" fill="#173f32" text-anchor="start" font-weight="bold">Nitrate runoff</text><path d="M190 165 L220 270" fill="none" stroke="#537c9a" stroke-width="4" marker-end="url(#bluearrow)" /><ellipse cx="180" cy="260" rx="13" ry="8" fill="#e4f0df" stroke="#24644b" stroke-width="2" /><ellipse cx="205" cy="260" rx="13" ry="8" fill="#e4f0df" stroke="#24644b" stroke-width="2" /><ellipse cx="230" cy="260" rx="13" ry="8" fill="#e4f0df" stroke="#24644b" stroke-width="2" /><ellipse cx="255" cy="260" rx="13" ry="8" fill="#e4f0df" stroke="#24644b" stroke-width="2" /><ellipse cx="280" cy="260" rx="13" ry="8" fill="#e4f0df" stroke="#24644b" stroke-width="2" /><ellipse cx="305" cy="260" rx="13" ry="8" fill="#e4f0df" stroke="#24644b" stroke-width="2" /><ellipse cx="330" cy="260" rx="13" ry="8" fill="#e4f0df" stroke="#24644b" stroke-width="2" /><text x="320" y="205" font-size="24" fill="#173f32" text-anchor="middle" font-weight="normal">Algal bloom</text><path d="M295 285 L405 375" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)" /><path d="M410 405 l8 -8 l10 12 l-8 8 Z" fill="#e4f0df" stroke="#24644b" stroke-width="2" /><path d="M440 430 l8 -8 l10 12 l-8 8 Z" fill="#e4f0df" stroke="#24644b" stroke-width="2" /><path d="M465 400 l8 -8 l10 12 l-8 8 Z" fill="#e4f0df" stroke="#24644b" stroke-width="2" /><path d="M490 440 l8 -8 l10 12 l-8 8 Z" fill="#e4f0df" stroke="#24644b" stroke-width="2" /><text x="370" y="504" font-size="22" fill="#173f32" text-anchor="start" font-weight="normal">Dead algae</text><rect x="620" y="395" width="29" height="11" rx="7" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><rect x="650" y="420" width="29" height="11" rx="7" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><rect x="680" y="385" width="29" height="11" rx="7" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><rect x="705" y="430" width="29" height="11" rx="7" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><path d="M515 418 L595 418" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)" /><text x="650" y="310" font-size="23" fill="#173f32" text-anchor="middle" font-weight="normal">Decomposers use O₂</text><path d="M650 325 L665 380" fill="none" stroke="#24644b" stroke-width="2" /><path d="M790 390 Q835 350 885 390 Q835 430 790 390 L765 365 L765 415 Z" fill="#f2ddbc" stroke="#bc824b" stroke-width="3" /><path d="M869 383 L879 393" fill="none" stroke="#ab665b" stroke-width="3" /><path d="M879 383 L869 393" fill="none" stroke="#ab665b" stroke-width="3" /><text x="835" y="180" font-size="24" fill="#173f32" text-anchor="middle" font-weight="bold">Low dissolved O₂</text><path d="M835 200 L835 343" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)" /></g></svg>