<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="750" viewBox="0 0 1120 750" role="img" aria-labelledby="q259-title q259-desc">
<title id="q259-title">Follow carbohydrate digestion from chains to single units</title>
<desc id="q259-desc">In the source diagram, long chains represent starch, linked pairs represent maltose, and single units represent glucose. Amylase begins starch digestion in the mouth. In the small intestine amylase continues starch digestion, and maltase converts maltose to glucose.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="750" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Follow carbohydrate digestion from chains to single units</text><rect x="40" y="120" width="310" height="380" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="195.0" y="160" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Before the mouth</text><rect x="405" y="120" width="310" height="380" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="560.0" y="160" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >In the mouth</text><rect x="770" y="120" width="310" height="380" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="925.0" y="160" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Small intestine</text><line x1="90" y1="290" x2="125" y2="325" stroke="#357ca2" stroke-width="4"/><line x1="125" y1="325" x2="165" y2="335" stroke="#357ca2" stroke-width="4"/><line x1="165" y1="335" x2="205" y2="320" stroke="#357ca2" stroke-width="4"/><line x1="205" y1="320" x2="243" y2="285" stroke="#357ca2" stroke-width="4"/><line x1="243" y1="285" x2="282" y2="280" stroke="#357ca2" stroke-width="4"/><circle cx="90" cy="290" r="12" fill="#dcecf5" stroke="#357ca2" stroke-width="3"/><circle cx="125" cy="325" r="12" fill="#dcecf5" stroke="#357ca2" stroke-width="3"/><circle cx="165" cy="335" r="12" fill="#dcecf5" stroke="#357ca2" stroke-width="3"/><circle cx="205" cy="320" r="12" fill="#dcecf5" stroke="#357ca2" stroke-width="3"/><circle cx="243" cy="285" r="12" fill="#dcecf5" stroke="#357ca2" stroke-width="3"/><circle cx="282" cy="280" r="12" fill="#dcecf5" stroke="#357ca2" stroke-width="3"/><line x1="450" y1="285" x2="485" y2="308" stroke="#357ca2" stroke-width="4"/><circle cx="450" cy="285" r="12" fill="#dcecf5" stroke="#357ca2" stroke-width="3"/><circle cx="485" cy="308" r="12" fill="#dcecf5" stroke="#357ca2" stroke-width="3"/><line x1="560" y1="335" x2="595" y2="358" stroke="#357ca2" stroke-width="4"/><circle cx="560" cy="335" r="12" fill="#dcecf5" stroke="#357ca2" stroke-width="3"/><circle cx="595" cy="358" r="12" fill="#dcecf5" stroke="#357ca2" stroke-width="3"/><line x1="650" y1="285" x2="685" y2="308" stroke="#357ca2" stroke-width="4"/><circle cx="650" cy="285" r="12" fill="#dcecf5" stroke="#357ca2" stroke-width="3"/><circle cx="685" cy="308" r="12" fill="#dcecf5" stroke="#357ca2" stroke-width="3"/><circle cx="825" cy="275" r="12" fill="#dcecf5" stroke="#357ca2" stroke-width="3"/><circle cx="900" cy="290" r="12" fill="#dcecf5" stroke="#357ca2" stroke-width="3"/><circle cx="1000" cy="280" r="12" fill="#dcecf5" stroke="#357ca2" stroke-width="3"/><circle cx="850" cy="350" r="12" fill="#dcecf5" stroke="#357ca2" stroke-width="3"/><circle cx="940" cy="350" r="12" fill="#dcecf5" stroke="#357ca2" stroke-width="3"/><circle cx="1035" cy="350" r="12" fill="#dcecf5" stroke="#357ca2" stroke-width="3"/><text x="195" y="420" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Starch</text><text x="195" y="455" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >long chains</text><text x="560" y="420" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Maltose</text><text x="560" y="455" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >linked pairs</text><text x="925" y="420" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Glucose</text><text x="925" y="455" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >single units</text><line x1="355" y1="300" x2="397" y2="300" stroke="#25614b" stroke-width="4"/><polygon points="397,300 383.6950761583107,306.92668763312224 383.6950761583107,293.07331236687776" fill="#25614b"/><line x1="720" y1="300" x2="762" y2="300" stroke="#25614b" stroke-width="4"/><polygon points="762,300 748.6950761583107,306.92668763312224 748.6950761583107,293.07331236687776" fill="#25614b"/><text x="560" y="555" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Amylase breaks starch into maltose; maltase breaks maltose into glucose.</text><text x="560" y="593" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Small molecules can then be absorbed through the intestinal wall.</text><text x="560" y="650" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Molecule symbols are schematic; they are not chemical structural formulae.</text><rect x="24" y="674" width="1072" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="560.0" y="708" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Row B shows chain → pairs → single units.</text>
</g></svg>