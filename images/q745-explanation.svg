<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">This cell’s features are consistent with a root</title><desc id="desc">A plant cell contains a cellulose wall, membrane, nucleus and large vacuole, with no chloroplasts drawn. A rooted plant identifies the compatible source location.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">This cell’s features are consistent with a root</text><rect x="120" y="195" width="460" height="275" rx="22" fill="#d8e6c7" stroke="#24644b" stroke-width="10"/><rect x="135" y="210" width="430" height="245" rx="17" fill="#f7f3da" stroke="#537c9a" stroke-width="3"/><rect x="170" y="245" width="340" height="180" rx="35" fill="#d8e8ed" stroke="#537c9a" stroke-width="3"/><ellipse cx="525" cy="260" rx="22" ry="31" fill="#24644b" stroke="#24644b" stroke-width="2"/><g transform="translate(790 380) scale(0.85)"><path d="M0 0 V-195" fill="none" stroke="#24644b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(0 -65) scale(0.8)"><path d="M0 0 Q-65 -20 -5 -105 Q55 -45 0 0" fill="#e4f0df" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 0 L-5 -95 M-3 -30 L-27 -53 M-4 -53 L19 -75" fill="none" stroke="#24644b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(0 -100) scale(-.8 .8)"><g transform="translate(0 0) scale(1)"><path d="M0 0 Q-65 -20 -5 -105 Q55 -45 0 0" fill="#e4f0df" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 0 L-5 -95 M-3 -30 L-27 -53 M-4 -53 L19 -75" fill="none" stroke="#24644b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M0 0 L-45 75 M0 0 L25 80 M-20 30 L-65 55 M10 30 L55 65" fill="none" stroke="#c5824b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M600 345 L735 405" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="350" y="150" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">Plant cell with no chloroplasts shown</text><text x="350" y="520" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">Large vacuole + wall; compatible with a root cell.</text><text x="830" y="490" font-size="28" fill="#173f32" text-anchor="middle" font-weight="700">Root</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">A: root</text></g></svg>