<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="q254-title q254-desc">
<title id="q254-title">Find the second-largest biomass</title>
<desc id="q254-desc">The four measured biomasses in descending order are D 17.9, C 1.2, B 0.6 and A 0.1 grams per cubic metre. For the ecosystem represented in the question, D is the producer level and C is the herbivore level, followed by higher consumer levels B and A. The coloured cards show the order, not a numerical scale. Therefore the answer is C.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="760" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Find the second-largest biomass</text><text x="500" y="95" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Order the measured levels from greatest to least biomass.</text><rect x="60" y="135" width="880" height="86" rx="12" fill="#f0f5ea" stroke="#526c62" stroke-width="2"/><text x="90" y="172" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >D   17.9 g m⁻³</text><text x="380" y="172" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >producers</text><text x="90" y="201" font-size="23" fill="#526c62" font-weight="400" text-anchor="start" >largest biomass</text><line x1="500" y1="223" x2="500" y2="236" stroke="#25614b" stroke-width="3"/><polygon points="500,236 493.07331236687776,222.69507615831074 506.92668763312224,222.69507615831074" fill="#25614b"/><rect x="60" y="240" width="880" height="86" rx="12" fill="#dfedcf" stroke="#25614b" stroke-width="4"/><text x="90" y="277" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >C   1.2 g m⁻³</text><text x="380" y="277" font-size="26" fill="#173d31" font-weight="700" text-anchor="start" >herbivores (primary consumers)</text><text x="90" y="306" font-size="23" fill="#526c62" font-weight="400" text-anchor="start" >second-largest biomass</text><line x1="500" y1="328" x2="500" y2="341" stroke="#25614b" stroke-width="3"/><polygon points="500,341 493.07331236687776,327.6950761583107 506.92668763312224,327.6950761583107" fill="#25614b"/><rect x="60" y="345" width="880" height="86" rx="12" fill="#f0f5ea" stroke="#526c62" stroke-width="2"/><text x="90" y="382" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >B   0.6 g m⁻³</text><text x="380" y="382" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >higher consumer level</text><text x="90" y="411" font-size="23" fill="#526c62" font-weight="400" text-anchor="start" >less biomass than the level above</text><line x1="500" y1="433" x2="500" y2="446" stroke="#25614b" stroke-width="3"/><polygon points="500,446 493.07331236687776,432.6950761583107 506.92668763312224,432.6950761583107" fill="#25614b"/><rect x="60" y="450" width="880" height="86" rx="12" fill="#f0f5ea" stroke="#526c62" stroke-width="2"/><text x="90" y="487" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >A   0.1 g m⁻³</text><text x="380" y="487" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >highest consumer level shown</text><text x="90" y="516" font-size="23" fill="#526c62" font-weight="400" text-anchor="start" >less biomass than the level above</text><text x="500" y="609" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Herbivores feed on producers, so they occupy the next level.</text><text x="500" y="643" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >The cards show rank order; their widths are not a scale.</text><rect x="24" y="684" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="718" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C — 1.2 g m⁻³ is the herbivore level.</text>
</g></svg>