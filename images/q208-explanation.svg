y="599" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Read bottom to top · Width represents a different quantity.</text><rect x="55" y="675" width="425" height="218" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="267.5" y="715" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Energy decreases</text><text x="267.5" y="758" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Each level has less energy</text><text x="267.5" y="794" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >available than the level below.</text><text x="267.5" y="830" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >The pyramid stays upright.</text><rect x="520" y="675" width="425" height="218" rx="12" fill="#f4efdf" stroke="#daa958" stroke-width="2"/><text x="732.5" y="715" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Insects outnumber hosts</text><text x="732.5" y="758" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Few large zebras can support</text><text x="732.5" y="794" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >many blood-sucking insects.</text><text x="732.5" y="830" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >The numbers level widens.</text><rect x="65" y="938" width="870" height="144" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="978" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Do not use organism size to draw an energy pyramid</text><text x="500.0" y="1021" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Counting parasites is different from measuring energy.</text><text x="500.0" y="1057" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The correct pair is energy 3 and numbers 1.</text><text x="500" y="1127" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative models; no numerical counts, energies or efficiencies.</text><text x="500" y="1164" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >The original four source shapes remain in the question image.</text><rect x="24" y="1184" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1218" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · Pyramid of energy 3 · Pyramid of numbers 1</text>
