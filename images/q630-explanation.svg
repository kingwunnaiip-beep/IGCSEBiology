le" font-size="18" fill="white">3</text><text x="760" y="207" font-size="23" font-weight="700">Percentage = 14 ÷ 141 ×</text><text x="760" y="236" font-size="23" font-weight="700">100</text><text x="760" y="285" font-size="21" font-weight="400">9.9%</text><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>