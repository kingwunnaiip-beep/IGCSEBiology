<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="q297-title q297-desc">
<title id="q297-title">Check both claims about all enzymes</title>
<desc id="q297-desc">IGCSE enzymes are proteins, formed from amino acids, rather than sugars. Different enzymes have different optimum pH conditions; not all work best at pH 7. Examples are acidic conditions for stomach protease, near-neutral conditions for amylase, and alkaline conditions for intestinal protease.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1200" height="830" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="600.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Check both claims about all enzymes</text><text x="70" y="122" font-size="31" fill="#173d31" font-weight="700" text-anchor="start" >Claim 1: “they are sugars”</text><circle cx="140" cy="198" r="29" fill="#eaf4f7" stroke="#357ca2" stroke-width="3"/><line x1="140" y1="198" x2="240" y2="198" stroke="#357ca2" stroke-width="7"/><circle cx="240" cy="198" r="29" fill="#eaf4f7" stroke="#357ca2" stroke-width="3"/><line x1="240" y1="198" x2="340" y2="198" stroke="#357ca2" stroke-width="7"/><circle cx="340" cy="198" r="29" fill="#eaf4f7" stroke="#357ca2" stroke-width="3"/><line x1="340" y1="198" x2="440" y2="198" stroke="#357ca2" stroke-width="7"/><circle cx="440" cy="198" r="29" fill="#eaf4f7" stroke="#357ca2" stroke-width="3"/><line x1="440" y1="198" x2="540" y2="198" stroke="#357ca2" stroke-width="7"/><circle cx="540" cy="198" r="29" fill="#eaf4f7" stroke="#357ca2" stroke-width="3"/><line x1="540" y1="198" x2="640" y2="198" stroke="#357ca2" stroke-width="7"/><circle cx="640" cy="198" r="29" fill="#eaf4f7" stroke="#357ca2" stroke-width="3"/><text x="875" y="188" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Amino-acid chain</text><text x="875" y="228" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >→ protein, not sugar</text><text x="70" y="298" font-size="31" fill="#173d31" font-weight="700" text-anchor="start" >Claim 2: “they are most effective at pH 7”</text><rect x="55" y="350" width="340" height="185" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="225.0" y="390" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Stomach protease</text><text x="225.0" y="432" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Acidic conditions</text><text x="225.0" y="468" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >support its activity</text><rect x="430" y="350" width="340" height="185" rx="12" fill="#eaf4f7" stroke="#357ca2" stroke-width="2"/><text x="600.0" y="390" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Amylase</text><text x="600.0" y="432" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Near-neutral conditions</text><text x="600.0" y="468" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >support its activity</text><rect x="805" y="350" width="340" height="185" rx="12" fill="#fbf3e2" stroke="#daa958" stroke-width="2"/><text x="975.0" y="390" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Intestinal protease</text><text x="975.0" y="432" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Alkaline conditions</text><text x="975.0" y="468" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >support its activity</text><text x="600" y="595" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >The optimum pH depends on the enzyme.</text><text x="600" y="642" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >A statement about ALL enzymes must apply to every example.</text><text x="600" y="692" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >The two source-table entries are therefore “no” and “no”.</text><rect x="24" y="754" width="1152" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="600.0" y="788" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >D — not sugars; not all most effective at pH 7.</text>
</g></svg>