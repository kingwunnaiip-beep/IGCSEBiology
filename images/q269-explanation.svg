<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="q269-title q269-desc">
<title id="q269-title">Which processes are universal in living organisms?</title>
<desc id="q269-desc">Respiration releases energy in cells, and excretion removes metabolic waste and substances in excess. Both are characteristics of all living organisms. Digestion of food is not required by every organism.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="740" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Which processes are universal in living organisms?</text><rect x="45" y="115" width="320" height="285" rx="12" fill="#fff0e8" stroke="#daa958" stroke-width="2"/><text x="205.0" y="157" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >1  Digestion</text><text x="205.0" y="198" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Large food molecules</text><text x="205.0" y="233" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >are broken down.</text><text x="205.0" y="268" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Not needed by every</text><text x="205.0" y="303" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >living organism.</text><rect x="400" y="115" width="320" height="285" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="560.0" y="157" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >2  Respiration</text><text x="560.0" y="198" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Chemical reactions</text><text x="560.0" y="233" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >in cells release energy.</text><text x="560.0" y="268" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >A characteristic of</text><text x="560.0" y="303" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >all living organisms.</text><rect x="755" y="115" width="320" height="285" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="915.0" y="157" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >3  Excretion</text><text x="915.0" y="198" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Metabolic waste and</text><text x="915.0" y="233" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >excess substances</text><text x="915.0" y="268" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >are removed.</text><text x="915.0" y="303" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Universal in</text><text x="915.0" y="338" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >living organisms.</text><line x1="560" y1="415" x2="560" y2="475" stroke="#25614b" stroke-width="5"/><polygon points="560,475 553.0733123668778,461.6950761583107 566.9266876331222,461.6950761583107" fill="#25614b"/><line x1="915" y1="415" x2="650" y2="475" stroke="#25614b" stroke-width="5"/><polygon points="650,475 661.4468788477051,465.30624094347496 664.5060594815557,478.81762207631505" fill="#25614b"/><rect x="180" y="500" width="760" height="105" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="560.0" y="542" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Respiration and excretion: both are universal.</text><text x="560" y="639" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Nutrition can involve making food or obtaining it from other organisms.</text><rect x="24" y="664" width="1072" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="560.0" y="698" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C — 2 and 3 only</text>
</g></svg>