<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="q51-title q51-desc"><title id="q51-title">Synthetic auxin kills susceptible broadleaf weeds</title><desc id="q51-desc">2,4-D acts as a synthetic auxin: a broadleaf weed develops abnormal growth and dies. Many grasses are less sensitive when the herbicide is used appropriately.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#537b61"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#b85b4f"/></marker><marker id="ay" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#e4bd55"/></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#668d9c"/></marker></defs><rect width="640" height="420" rx="20" fill="#f3f6ed"/><g font-family="Arial, Helvetica, sans-serif"><text x="320" y="43" fill="#243d32" text-anchor="middle" font-size="32" font-weight="700">2,4-D: selective weedkiller</text><text x="320" y="88" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">Synthetic auxin disrupts growth</text><path d="M105 237 V133" fill="none" stroke="#537b61" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M105 205 Q91.0 159 63.0 182 Q63.0 205 105 205Z" fill="#537b61" stroke="#537b61" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M105 180 Q119.0 134 147.0 157 Q147.0 180 105 180Z" fill="#537b61" stroke="#537b61" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="105" y="281" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">Weed</text><path d="M320 237 C275 207 372 189 330 139" fill="none" stroke="#537b61" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M338 203 Q320.0 175 284.0 189 Q284.0 203 338 203Z" fill="#537b61" stroke="#537b61" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M310 163 Q329.0 147 367.0 155 Q367.0 163 310 163Z" fill="#537b61" stroke="#537b61" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="320" y="281" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">Abnormal</text><path d="M535 237 Q525 167 580 179" fill="none" stroke="#998774" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M547 160 Q552.0 210 562.0 185 Q562.0 160 547 160Z" fill="#998774" stroke="#998774" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M552 187 Q542.0 227 522.0 207 Q522.0 187 552 187Z" fill="#998774" stroke="#998774" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="535" y="281" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">Dies</text><line x1="164" y1="184" x2="244" y2="184" stroke="#537b61" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><line x1="382" y1="184" x2="462" y2="184" stroke="#537b61" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><line x1="35" y1="299" x2="605" y2="299" stroke="#b4ceb1" stroke-width="2" stroke-linecap="round" /><path d="M75 383 Q63 340 55 332 M75 383 Q78 340 89 323 M75 383 V337" fill="none" stroke="#537b61" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M95 383 Q83 340 75 332 M95 383 Q98 340 109 323 M95 383 V337" fill="none" stroke="#537b61" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M115 383 Q103 340 95 332 M115 383 Q118 340 129 323 M115 383 V337" fill="none" stroke="#537b61" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="365" y="353" fill="#243d32" text-anchor="middle" font-size="30" font-weight="700">Many grasses:</t