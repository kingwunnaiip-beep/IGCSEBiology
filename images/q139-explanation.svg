<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1320" viewBox="0 0 1000 1320" role="img" aria-labelledby="q139-title q139-desc">
<title id="q139-title">139 · A fish can feed at more than one trophic level</title>
<desc id="q139-desc">Answer B: cod are both secondary and tertiary consumers in the source food web. In the first complete path, phytoplankton are producers, zooplankton are primary consumers, and cod that eat zooplankton are secondary consumers. In the second complete path, phytoplankton are producers, zooplankton are primary consumers, shrimp are secondary consumers, and cod that eat shrimp are tertiary consumers. The arrows point from food to consumer, showing the direction of energy transfer. These are two selected complete paths from the original web; the drawing does not add a mackerel-to-cod arrow or imply that every cod always occupies only one trophic level.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1320" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >139 · A fish can feed at more than one trophic level</text><text x="500" y="111" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Follow each complete feeding path from its producer.</text><text x="500" y="151" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Food → consumer arrows show the direction of energy transfer.</text><text x="500" y="225" font-size="28" fill="#357ca2" font-weight="700" text-anchor="middle" >Path 1 · Cod eats a primary consumer</text><rect x="90" y="284" width="200" height="104" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="190.0" y="343" font-size="24" fill="#25614b" font-weight="400" text-anchor="middle" >Phytoplankton</text><text x="190.0" y="442" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Producer</text><rect x="400" y="284" width="200" height="104" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="343" font-size="24" fill="#357ca2" font-weight="400" text-anchor="middle" >Zooplankton</text><text x="500.0" y="442" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Primary</text><text x="500.0" y="477" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >consumer</text><rect x="710" y="284" width="200" height="104" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="810.0" y="343" font-size="24" fill="#357ca2" font-weight="400" text-anchor="middle" >Cod</text><text x="810.0" y="442" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Secondary</text><text x="810.0" y="477" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >consumer</text><line x1="306" y1="337" x2="384" y2="337" stroke="#357ca2" stroke-width="4"/><polygon points="384,337 370.6950761583107,343.92668763312224 370.6950761583107,330.07331236687776" fill="#357ca2"/><line x1="616" y1="337" x2="694" y2="337" stroke="#357ca2" stroke-width="4"/><polygon points="694,337 680.6950761583107,343.92668763312224 680.6950761583107,330.07331236687776" fill="#357ca2"/><rect x="48" y="539" width="904" height="71" rx="12" fill="#edf5f8" stroke="none" stroke-width="2"/><text x="500" y="583" font-size="26" fill="#357ca2" font-weight="700" text-anchor="middle" >Producer → primary consumer → secondary consumer</text><text x="500" y="705" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >Path 2 · Cod eats a secondary consumer</text><rect x="48" y="767" width="193" height="104" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="144.5" y="826" font-size="24" fill="#25614b" font-weight="400" text-anchor="middle" >Phytoplankton</text><text x="144.5" y="925" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Producer</text><rect x="285" y="767" width="193" height="104" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="381.5" y="826" font-size="24" fill="#357ca2" font-weight="400" text-anchor="middle" >Zooplankton</text><text x="381.5" y="925" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Primary</text><text x="381.5" y="960" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >consumer</text><rect x="522" y="767" width="193" height="104" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="618.5" y="826" font-size="24" fill="#357ca2" font-weight="400" text-anchor="middle" >Shrimp</text><text x="618.5" y="925" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Secondary</text><text x="618.5" y="960" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >consumer</text><rect x="759" y="767" width="193" height="104" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="855.5" y="826" font-size="24" fill="#25614b" font-weight="400" text-anchor="middle" >Cod</text><text x="855.5" y="925" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Tertiary</text><text x="855.5" y="960" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >consumer</text><line x1="251" y1="820" x2="275" y2="820" stroke="#25614b" stroke-width="3"/><polygon points="275,820 261.6950761583107,826.9266876331222 261.6950761583107,813.0733123668778" fill="#25614b"/><line x1="488" y1="820" x2="512" y2="820" stroke="#25614b" stroke-width="3"/><polygon points="512,820 498.6950761583107,826.9266876331222 498.6950761583107,813.0733123668778" fill="#25614b"/><line x1="725" y1="820" x2="749" y2="820" stroke="#25614b" stroke-width="3"/><polygon points="749,820 735.6950761583107,826.9266876331222 735.6950761583107,813.0733123668778" fill="#25614b"/><rect x="48" y="1011" width="904" height="126" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500" y="1059" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Cod eats prey at two different consumer levels.</text><text x="500" y="1101" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Its trophic level depends on the feeding path being followed.</text><text x="500" y="1210" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >These are selected paths from the source food web, not the whole web.</text><rect x="24" y="1244" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1278" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer B · Cod is both a secondary and a tertiary consumer</text>
</g></svg>