<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Plant cells share a wall, but not chloroplasts</title><desc id="desc">A leaf cell and a root cell each have a cellulose wall. Only the photosynthetic leaf cell contains chloroplasts. Simplified cell schematics.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#185c44"/></marker></defs><rect width="1000" height="640" rx="24" fill="#faf8ec"/><g font-family="Arial, sans-serif"><text x="40" y="54" font-size="31" text-anchor="start" fill="#193e33" font-weight="bold">Plant cells share a wall, but not chloroplasts</text><text x="260" y="110" font-size="26" text-anchor="middle" fill="#193e33" font-weight="normal">Photosynthetic leaf cell</text><text x="740" y="110" font-size="26" text-anchor="middle" fill="#193e33" font-weight="normal">Non-photosynthetic root cell</text><rect x="90" y="145" width="340" height="255" rx="30" fill="#e8f3e1" stroke="#185c44" stroke-width="3"/><rect x="109" y="163" width="302" height="218" rx="25" fill="#f5f9ef" stroke="#185c44" stroke-width="3"/><circle cx="342" cy="335" r="28" fill="#b7cfb4"/><path d="M90 423 L150 398" stroke="#185c44" stroke-width="4" fill="none"/><text x="90" y="458" font-size="23" text-anchor="start" fill="#193e33" font-weight="normal">cellulose cell wall</text><rect x="570" y="145" width="340" height="255" rx="30" fill="#e8f3e1" stroke="#185c44" stroke-width="3"/><rect x="589" y="163" width="302" height="218" rx="25" fill="#f5f9ef" stroke="#185c44" stroke-width="3"/><circle cx="822" cy="335" r="28" fill="#b7cfb4"/><path d="M570 423 L630 398" stroke="#185c44" stroke-width="4" fill="none"/><text x="570" y="458" font-size="23" text-anchor="start" fill="#193e33" font-weight="normal">cellulose cell wall</text><ellipse cx="150" cy="205" rx="25" ry="15" fill="#419751"/><ellipse cx="240" cy="210" rx="25" ry="15" fill="#419751"/><ellipse cx="330" cy="210" rx="25" ry="15" fill="#419751"/><ellipse cx="160" cy="300" rx="25" ry="15" fill="#419751"/><ellipse cx="250" cy="310" rx="25" ry="15" fill="#419751"/><text x="260" y="505" font-size="25" text-anchor="middle" fill="#193e33" font-weight="normal">Chloroplasts present</text><text x="740" y="505" font-size="25" text-anchor="middle" fill="#193e33" font-weight="normal">No chloroplasts needed</text><rect x="155" y="545" width="690" height="57" rx="18" fill="#dcefdc" stroke="#185c44" stroke-width="3"/><text x="500" y="583" font-size="25" text-anchor="middle" fill="#193e33" font-weight="bold">All plant cells: wall. Only some: chloroplasts.</text></g></svg>