<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Protein production: 4 → 2 → 1 → 3</title><desc id="desc">A cell contains a nucleus with DNA and a newly copied mRNA strand. The mRNA leaves the nucleus, attaches to a ribosome in the cytoplasm, and the ribosome assembles an amino-acid chain. Original event numbers 4, 2, 1 and 3 are placed next to those structures.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="1.8"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#b85c50" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="38" y="54" font-size="30" fill="#173f32" font-weight="bold">Protein production: 4 → 2 → 1 → 3</text><ellipse cx="500" cy="315" rx="440" ry="196" fill="#f1f4e5" stroke="#24644b" stroke-width="4" /><circle cx="270" cy="310" r="131" fill="#dcebf2" stroke="#537c9a" stroke-width="4" /><path d="M245.0 220.0 L251.8 224.1 L257.9 228.2 L262.8 232.3 L265.9 236.4 L267.0 240.5 L265.9 244.6 L262.8 248.7 L257.9 252.8 L251.8 256.9 L245.0 261.0 L238.2 265.1 L232.1 269.2 L227.2 273.3 L224.1 277.4 L223.0 281.5 L224.1 285.6 L227.2 289.7 L232.1 293.8 L238.2 297.9 L245.0 302.0 L251.8 306.1 L257.9 310.2 L262.8 314.3 L265.9 318.4 L267.0 322.5 L265.9 326.6 L262.8 330.7 L257.9 334.8 L251.8 338.9 L245.0 343.0 L238.2 347.1 L232.1 351.2 L227.2 355.3 L224.1 359.4 L223.0 363.5 L224.1 367.6 L227.2 371.7 L232.1 375.8 L238.2 379.9 L245.0 384.0" fill="none" stroke="#24644b" stroke-width="5" stro