<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="q9-title q9-desc">
<title id="q9-title">High temperature increases collisions but can denature an enzyme</title><desc id="q9-desc">At optimum point R, substrate fits the enzyme active site. At the hottest point S, molecules collide most frequently, but the active site is denatured, preventing successful catalysis.</desc>
<defs><marker id="q9-25614b" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L16 8 L0 16 Z" fill="#25614b"/></marker><marker id="q9-357ca2" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L16 8 L0 16 Z" fill="#357ca2"/></marker><marker id="q9-b94a43" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L16 8 L0 16 Z" fill="#b94a43"/></marker><marker id="q9-daa958" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L16 8 L0 16 Z" fill="#daa958"/></marker></defs><rect width="640" height="420" rx="20" fill="#fffdf7"/>
