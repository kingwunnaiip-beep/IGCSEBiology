<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1450" viewBox="0 0 1000 1450" role="img" aria-labelledby="q100-title q100-desc">
<title id="q100-title">100 · Harvesting prawns changes the food web</title>
<desc id="q100-desc">Answer A: in the order fish, mussels, phytoplankton, the changes are decrease, increase, decrease. The exact source food web is redrawn with food-to-consumer arrows: phytoplankton to zooplankton, phytoplankton to mussels, zooplankton to prawns, zooplankton to mussels, prawns to fish and mussels to crabs. Heavy prawn harvesting reduces prawns. Fish have less food and decrease. Zooplankton experience less predation and increase, giving mussels more food so mussels increase. Increased feeding by zooplankton and mussels reduces phytoplankton. These qualitative predictions follow the simplified web; no numerical population measurements are implied. The separate results table uses up and down symbols for population changes rather than food-web arrows.</desc>
