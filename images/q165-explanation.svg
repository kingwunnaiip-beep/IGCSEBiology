bsent at its centre.</text><rect x="75" y="836" width="850" height="150" rx="12" fill="#f5efdf" stroke="#daa958" stroke-width="2"/><text x="500.0" y="878" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Blind spot = no photoreceptors</text><text x="500.0" y="920" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Both curves reach zero where the optic nerve exits.</text><text x="500" y="1044" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Read the line key, then distinguish a peak from an absence.</text><text x="500" y="1085" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Receptor symbols are qualitative; no density values are invented.</text><rect x="24" y="1094" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1128" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · X rods · Y cones · Z fovea</text>
