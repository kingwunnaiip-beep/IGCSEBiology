<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Gills oxygenate blood in a fish’s single circulation</title><desc id="desc">A fish drawing identifies its gills. A circuit runs from the two-chambered heart to wavy gill capillaries, where an oxygen arrow from water enters the blood. The blood changes from blue deoxygenated to warm oxygenated and travels to body tissues before returning to the heart.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">Gills oxygenate blood in a fish’s single circulation</text><path d="M70 300 Q140 185 310 220 Q385 240 430 300 Q385 360 310 380 Q140 415 70 300 L35 250 L35 350 Z" fill="#e4f0df" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="125" cy="280" r="7" fill="#173f32" stroke="#173f32" stroke-width="1"/><path d="M160 265 Q195 300 160 338" fill="none" stroke="#537c9a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 265 Q215 300 180 338" fill="none" stroke="#537c9a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 265 Q235 300 200 338" fill="none" stroke="#537c9a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="230" y="160" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">Fish</text><path d="M300 280 L620 235" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><ellipse cx="535" cy="410" rx="63" ry="57" fill="#d8c5b5" stroke="#c5824b" stroke-width="4"/><path d="M535 355 V465" fill="none" stroke="#c5824b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="535" y="505" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">Heart</text><path d="M535 345 V245 H635" fill="none" stroke="#537c9a" stroke-width="5" marker-end="url(#arrow)"/><path d="M640 220 Q665 200 690 220 T740 220" fill="none" stroke="#537c9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M740 220 Q765 200 790 220 T840 220" fill="none" stroke="#c5824b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M640 245 Q665 225 690 245 T740 245" fill="none" stroke="#537c9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M740 245 Q765 225 790 245 T840 245" fill="none" stroke="#c5824b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M640 270 Q665 250 690 270 T740 270" fill="none" stroke="#537c9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M740 270 Q765 250 790 270 T840 270" fill="none" stroke="#c5824b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M855 245 H925 V405 H860" fill="none" stroke="#c5824b" stroke-width="5" marker-end="url(#arrow)"/><text x="750" y="150" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">O₂ from water</text><path d="M750 165 V214" fill="none" stroke="#537c9a" stroke-width="5" marker-end="url(#arrow)"/><text x="750" y="320" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">X: gill capillaries</text><ellipse cx="750" cy="415" rx="102" ry="55" fill="#edf0e3" stroke="#24644b" stroke-width="2"/><circle cx="710" cy="400" r="13" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><circle cx="750" cy="385" r="13" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><circle cx="785" cy="408" r="13" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><circle cx="735" cy="440" r="13" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><circle cx="795" cy="440" r="13" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><path d="M850 395 Q880 470 740 470" fill="none" stroke="#c5824b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M740 470 Q635 470 650 415" fill="none" stroke="#537c9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M640 415 H606" fill="none" stroke="#537c9a" stroke-width="5" marker-end="url(#arrow)"/><text x="750" y="505" font-size="23" fill="#173f32" text-anchor="middle" font-weight="700">Body tissues receive O₂</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">B: gills  •  heart → gills → body → heart</text></g></svg>