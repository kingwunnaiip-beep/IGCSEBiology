<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="770" viewBox="0 0 1000 770" role="img" aria-labelledby="q240-title q240-desc">
<title id="q240-title">Long filaments expose anthers to the wind</title>
<desc id="q240-desc">Qualitative wind-pollination model, not a measured flower. A long filament supports an exposed anther so wind can carry pollen away. Better pollen transfer can increase the chance of reproduction in the relevant environment; it is not an advantage in all environments or an insect-attraction mechanism.</desc>
