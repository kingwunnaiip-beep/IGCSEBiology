<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Urea travels from liver to kidney through the circulation</title><desc id="desc">Drawn liver, divided heart, lungs and kidney are connected: hepatic vein to right heart, pulmonary circuit to left heart, renal artery to kidney.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">Urea travels from liver to kidney through the circulation</text><g transform="translate(200 320) scale(0.75)"><path d="M-120 -35 Q-80 -100 30 -70 Q120 -65 130 -25 Q55 50 -100 35 Z" fill="#b97f73" stroke="#ac655c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 -65 L5 25" fill="none" stroke="#ac655c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(500 310) scale(1)"><path d="M0 70 C-120 -10 -65 -110 0 -65 C65 -110 120 -10 0 70" fill="#d4a2a0" stroke="#ac655c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -55 L0 50" fill="none" stroke="#ac655c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(815 370) scale(0.7)"><path d="M0 -80 C-100 -130 -120 55 -35 85 C25 105 35 40 -5 25 C-35 12 -35 -10 -5 -25 C30 -42 40 -73 0 -80" fill="#d6a4a1" stroke="#ac655c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M-10 0 Q55 10 45 115" fill="none" stroke="#24644b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><ellipse cx="435" cy="170" rx="42" ry="70" fill="#d4e5ea" stroke="#537c9a" stroke-width="3"/><ellipse cx="565" cy="170" rx="42" ry="70" fill="#d4e5ea" stroke="#537c9a" stroke-width="3"/><path d="M500 105 L500 170 M500 155 L455 185 M500 155 L545 185" fill="none" stroke="#24644b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 305 L440 305" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><path d="M465 250 Q385 215 430 185" fill="none" stroke="#537c9a" stroke-width="4" marker-end="url(#arrow)"/><path d="M575 185 Q620 230 535 255" fill="none" stroke="#ac655c" stroke-width="4" marker-end="url(#arrow)"/><path d="M560 330 L740 355" fill="none" stroke="#ac655c" stroke-width="4" marker-end="url(#arrow)"/><text x="200" y="450" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">Liver makes urea</text><text x="360" y="275" font-size="22" text-anchor="middle" fill="#173f32">Hepatic vein</text><text x="500" y="100" font-size="25" text-anchor="middle" fill="#173f32" font-weight="bold">Lungs</text><text x="500" y="435" font-size="25" text-anchor="middle" fill="#173f32" font-weight="bold">Heart</text><text x="700" y="315" font-size="22" text-anchor="middle" fill="#173f32">Renal artery</text><text x="815" y="510" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">Kidney → urine</text><text x="470" y="330" font-size="21" text-anchor="middle" fill="#173f32">R</text><text x="530" y="330" font-size="21" text-anchor="middle" fill="#173f32">L</text><text x="500" y="565" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">D: liver → heart → lungs → heart → kidney</text></g></svg>