<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" role="img" aria-labelledby="title desc"><title id="title">Antibody specificity comes from protein structure</title><desc id="desc">A schematic amino-acid chain leads to folding of an antibody and a particular binding-site shape. A complementary antigen fits, while a different circular shape does not. The symbols are a simplified shape model.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#276b46"/></marker></defs><rect width="1000" height="570" rx="20" fill="#fbfaf0"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="53" fill="#203e33" font-size="30" font-weight="bold" text-anchor="start">Antibody specificity comes from protein structure</text><text x="40" y="95" fill="#203e33" font-size="22" font-weight="normal" text-anchor="start">A protein’s amino-acid sequence determines its folded binding site.</text><rect x="40" y="130" width="275" height="315" rx="14" fill="#f2f5e8" stroke="#276b46" stroke-width="2"/><rect x="365" y="130" width="275" height="315" rx="14" fill="#f2f5e8" stroke="#276b46" stroke-width="2"/><rect x="690" y="130" width="270" height="315" rx="14" fill="#f2f5e8" stroke="#276b46" stroke-width="2"/><text x="177" y="170" fill="#203e33" font-size="25" font-weight="bold" text-anchor="middle">Sequence</text><circle cx="75" cy="245" r="15" fill="#d7a542" stroke="#276b46" stroke-width="2"/><text x="75" y="250" fill="#111" font-size="15" font-weight="normal" text-anchor="middle">1</text><circle cx="112" cy="270" r="15" fill="#dcebd8" stroke="#276b46" stroke-width="2"/><text x="112" y="275" fill="#111" font-size="15" font-weight="normal" text-anchor="middle">2</text><circle cx="149" cy="245" r="15" fill="#ae604c" stroke="#276b46" stroke-width="2"/><text x="149" y="250" fill="#111" font-size="15" font-weight="normal" text-anchor="middle">3</text><circle cx="186" cy="270" r="15" fill="#276b46" stroke="#276b46" stroke-width="2"/><text x="186" y="275" fill="#111" font-size="15" font-weight="normal" text-anchor="middle">4</text><circle cx="223" cy="245" r="15" fill="#d7a542" stroke="#276b46" stroke-width="2"/><text x="223" y="250" fill="#111" font-size="15" font-weight="normal" text-anchor="middle">5</text><circle cx="260" cy="270" r="15" fill="#dcebd8" stroke="#276b46" stroke-width="2"/><text x="260" y="275" fill="#111" font-size="15" font-weight="normal" text-anchor="middle">6</text><text x="65" y="350" fill="#203e33" font-size="20" font-weight="normal" text-anchor="start">Order of amino acids</text><text x="65" y="379" fill="#203e33" font-size="20" font-weight="normal" text-anchor="start">in the antibody protein</text><path d="M323 285 L355 285" fill="none" stroke="#276b46" stroke-width="3" marker-end="url(#arrow)"/><text x="502" y="170" fill="#203e33" font-size="25" font-weight="bold" text-anchor="middle">Folding</text><path d="M500 365 L500 280 M500 280 L438 220 M500 280 L562 220" fill="none" stroke="#276b46" stroke-width="17"/><path d="M427 200 L438 220 L458 208 M545 209 L562 220 L575 200" fill="none" stroke="#276b46" stroke-width="8"/><text x="502" y="407" fill="#203e33" font-size="20" font-weight="normal" text-anchor="middle">Specific binding sites</text><path d="M648 285 L680 285" fill="none" stroke="#276b46" stroke-width="3" marker-end="url(#arrow)"/><text x="825" y="170" fill="#203e33" font-size="25" font-weight="bold" text-anchor="middle">Recognition</text><path d="M815 365 L815 280 L760 225 M815 280 L870 225" fill="none" stroke="#276b46" stroke-width="15"/><path d="M750 207 L760 225 L779 215" fill="none" stroke="#276b46" stroke-width="8"/><path d="M749 189 L760 207 L779 197 Z" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="907" cy="241" r="18" fill="#d7a542" stroke="#276b46" stroke-width="2"/><text x="905" y="281" fill="#203e33" font-size="17" font-weight="normal" text-anchor="middle">no fit</text><text x="710" y="397" fill="#203e33" font-size="20" font-weight="normal" text-anchor="start">Complementary antigen</text><text x="710" y="424" fill="#203e33" font-size="20" font-weight="normal" text-anchor="start">binds to the site.</text><text x="40" y="500" fill="#203e33" font-size="23" font-weight="bold" text-anchor="start">Specific shape → specific binding, rather than universal protection.</text><text x="40" y="548" fill="#65776d" font-size="16" font-weight="normal" text-anchor="start">Original teaching schematic • diagrams are not to scale</text></g></svg>