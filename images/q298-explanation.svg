<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="q298-title q298-desc">
<title id="q298-title">Population change = reproduction − deaths</title>
<desc id="q298-desc">In the source yeast growth curve population increases slowly in phase 1 and rapidly in phase 2, remains approximately constant in phase 3 and decreases in phase 4. Reproduction rate is greater than death rate only in phases 1 and 2. The arrows here show qualitative directions, not measured rates.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1200" height="860" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="600.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Population change = reproduction − deaths</text><text x="600" y="126" font-size="29" fill="#173d31" font-weight="400" text-anchor="middle" >Read the direction of population change in each phase.</text><rect x="60" y="185" width="500" height="205" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="105" y="233" font-size="38" fill="#25614b" font-weight="700" text-anchor="start" >1</text><text x="345" y="233" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Slow increase</text><text x="310" y="296" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Reproduction &gt; deaths</text><text x="310" y="335" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Even a small rise counts</text><rect x="640" y="185" width="500" height="205" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="685" y="233" font-size="38" fill="#25614b" font-weight="700" text-anchor="start" >2</text><text x="925" y="233" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Rapid increase</text><text x="890" y="296" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Reproduction &gt; deaths</text><text x="890" y="335" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Population rises steeply</text><rect x="60" y="435" width="500" height="205" rx="12" fill="#edf2f3" stroke="#357ca2" stroke-width="2"/><text x="105" y="483" font-size="38" fill="#357ca2" font-weight="700" text-anchor="start" >3</text><text x="345" y="483" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Approximately constant</text><text x="310" y="546" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Reproduction ≈ deaths</text><text x="310" y="585" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >No sustained net increase</text><rect x="640" y="435" width="500" height="205" rx="12" fill="#edf2f3" stroke="#b94a43" stroke-width="2"/><text x="685" y="483" font-size="38" fill="#b94a43" font-weight="700" text-anchor="start" >4</text><text x="925" y="483" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Decrease</text><text x="890" y="546" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Reproduction &lt; deaths</text><text x="890" y="585" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Population falls</text><text x="600" y="712" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Phase 1 is a slow rise, not a perfectly horizontal line.</text><text x="600" y="758" font-size="29" fill="#173d31" font-weight="400" text-anchor="middle" >Source answer row: yes · yes · no · no</text><rect x="24" y="784" width="1152" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="600.0" y="818" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B — reproduction exceeds deaths in phases 1 and 2.</text>
</g></svg>