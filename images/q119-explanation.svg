<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1270" viewBox="0 0 1000 1270" role="img" aria-labelledby="q119-title q119-desc">
<title id="q119-title">119 · Sustainable resources are replaced as fast as used</title>
<desc id="q119-desc">Answer A: lignin can be produced as rapidly as it is removed from the environment. Lignin is a material in plant cell walls that can be used to make bioplastic. New plant growth can replace the biomass from which lignin is obtained. A continuing supply is sustainable only when replacement keeps pace with removal. Being found in xylem, being strong or being waterproof does not show that a resource can be replenished. This is a qualitative resource-flow schematic without invented growth or harvest rates; no claim about biodegradability is made.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1270" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >119 · Sustainable resources are replaced as fast as used</text><text x="500" y="110" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Lignin comes from plant biomass and can be used in bioplastic.</text><text x="500" y="150" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >A sustainable supply depends on replacement of the resource.</text><rect x="48" y="195" width="430" height="401" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="263" y="245" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Plant growth</text><rect x="522" y="195" width="430" height="401" rx="12" fill="#edf5f8" stroke="none" stroke-width="2"/><text x="737" y="245" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Material use</text><rect x="252" y="375" width="22" height="95" rx="0" fill="#9a7545" stroke="none" stroke-width="2"/><circle cx="263" cy="346" r="52" fill="#a8ca8e" stroke="#25614b" stroke-width="3"/><circle cx="233" cy="377" r="37" fill="#a8ca8e" stroke="#25614b" stroke-width="3"/><circle cx="293" cy="377" r="37" fill="#a8ca8e" stroke="#25614b" stroke-width="3"/><text x="263" y="545" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >New biomass contains lignin.</text><rect x="622" y="329" width="230" height="120" rx="12" fill="#b6d8e5" stroke="#357ca2" stroke-width="2"/><text x="737" y="379" font-size="27" fill="#357ca2" font-weight="700" text-anchor="middle" >Lignin-based</text><text x="737" y="421" font-size="27" fill="#357ca2" font-weight="700" text-anchor="middle" >bioplastic</text><text x="737" y="545" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Plant material is harvested.</text><line x1="484" y1="387" x2="514" y2="387" stroke="#25614b" stroke-width="4"/><polygon points="514,387 500.6950761583107,393.92668763312224 500.6950761583107,380.07331236687776" fill="#25614b"/><rect x="48" y="654" width="904" height="165" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500" y="709" font-size="31" fill="#25614b" font-weight="700" text-anchor="middle" >Rate of replacement ≥ rate of removal</text><text x="500" y="768" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >The supply can continue without depleting the resource.</text><rect x="48" y="878" width="904" height="220" rx="12" fill="#f7ead9" stroke="none" stroke-width="2"/><text x="500" y="928" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Which facts do not establish sustainability?</text><text x="500" y="988" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >“Found in xylem” describes location.</text><text x="500" y="1031" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >“Strong” and “waterproof” describe material properties.</text><text x="500" y="1150" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Ask whether new production can keep up with the amount used.</text><rect x="24" y="1194" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1228" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer A · Lignin can be produced as rapidly as it is removed</text>
</g></svg>