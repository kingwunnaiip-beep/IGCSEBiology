<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850" role="img" aria-labelledby="q311-title q311-desc">
<title id="q311-title">A test cross uses a homozygous recessive parent</title>
<desc id="q311-desc">The source correct square C crosses heterozygous Tt with homozygous recessive tt. The first parent produces T and t gametes, while the recessive parent produces only t. The offspring possibilities are Tt, tt, Tt and tt.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="850" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >A test cross uses a homozygous recessive parent</text><text x="560" y="105" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Heterozygous Tt × homozygous recessive tt</text><text x="320.0" y="190" font-size="34" fill="#173d31" font-weight="700" text-anchor="middle" >T</text><text x="460.0" y="190" font-size="34" fill="#173d31" font-weight="700" text-anchor="middle" >t</text><text x="205" y="307.0" font-size="34" fill="#173d31" font-weight="700" text-anchor="middle" >t</text><text x="205" y="447.0" font-size="34" fill="#173d31" font-weight="700" text-anchor="middle" >t</text><rect x="250" y="225" width="140" height="140" rx="0" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="320.0" y="307.0" font-size="38" fill="#173d31" font-weight="700" text-anchor="middle" >Tt</text><rect x="390" y="225" width="140" height="140" rx="0" fill="#edf3fa" stroke="#25614b" stroke-width="2"/><text x="460.0" y="307.0" font-size="38" fill="#173d31" font-weight="700" text-anchor="middle" >tt</text><rect x="250" y="365" width="140" height="140" rx="0" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="320.0" y="447.0" font-size="38" fill="#173d31" font-weight="700" text-anchor="middle" >Tt</text><rect x="390" y="365" width="140" height="140" rx="0" fill="#edf3fa" stroke="#25614b" stroke-width="2"/><text x="460.0" y="447.0" font-size="38" fill="#173d31" font-weight="700" text-anchor="middle" >tt</text><text x="390" y="560" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Gametes combine one allele from each parent.</text><rect x="650" y="235" width="400" height="235" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="850.0" y="278" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Expected offspring</text><text x="850.0" y="326" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >½ Tt: dominant phenotype</text><text x="850.0" y="368" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >½ tt: recessive phenotype</text><text x="850.0" y="410" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Ratio = 1 : 1</text><text x="560" y="635" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Recessive offspring reveal a t allele in the unknown parent.</text><text x="560" y="683" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Expected ratios describe probabilities, not a fixed family count.</text><rect x="24" y="774" width="1072" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="560.0" y="808" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Tt × tt is the heterozygous test cross → option C</text>
</g></svg>