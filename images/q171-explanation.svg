"500" y2="738" stroke="#357ca2" stroke-width="4"/><polygon points="500,738 493.07331236687776,724.6950761583107 506.92668763312224,724.6950761583107" fill="#357ca2"/><rect x="95" y="755" width="810" height="148" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="795" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Mean daily upper-surface loss</text><text x="500.0" y="837" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >3.3 g ÷ 7 days = 0.4714… g/day</text><text x="500.0" y="873" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Rounded to two decimal places: 0.47 g/day</text><text x="500" y="943" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Keep the full seven-day interval in the denominator.</text><rect x="24" y="974" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1008" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer A · 0.47 g/day</text>
