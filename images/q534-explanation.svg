<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="q534-title q534-desc"><title id="q534-title">Breaking into pieces does not remove plastic</title><desc id="q534-desc">A plastic item physically fragments into small pieces, which can be ingested by an aquatic organism. Fragmentation preserves the material as plastic. Non-biodegradable plastic persists because decomposers do not readily break it down; this creates continued exposure. Diagram is illustrative, not a claim about a particular species.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#36785e"/></marker></defs><rect x="0" y="0" width="900" height="500" rx="22" fill="#fbf7e9"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="46" font-size="27" text-anchor="start" fill="#183e35"><tspan x="35" dy="0">Breaking into pieces does not remove plastic</tspan></text><rect x="45" y="128" width="205" height="215" rx="15" fill="#edf1dd" stroke="#36785e" stroke-width="2"/><text x="147" y="165" font-size="23" text-anchor="middle" fill="#183e35"><tspan x="147" dy="0">Plastic item</tspan></text><path d="M110 210 L188 197 L201 291 L97 291 Z" stroke="#36785e" stroke-width="4" fill="#8fb9c4" stroke-linejoin="round" stroke-linecap="round"/><path d="M270 242 L370 242" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="319" y="196" font-size="20" text-anchor="middle" fill="#183e35"><tspan x="319" dy="0">physical</tspan><tspan x="319" dy="29">fragmentation</tspan></text><rect x="390" y="128" width="205" height="215" rx="15" fill="#edf1dd" stroke="#36785e" stroke-width="2"/><text x="492" y="165" font-size="23" text-anchor="middle" fill="#183e35"><tspan x="492" dy="0">Small pieces</tspan></text><path d="M428 220 l16 -6 l6 16 l-19 4 Z" stroke="#36785e" stroke-width="2" fill="#8fb9c4" stroke-linejoin="round" stroke-linecap="round"/><path d="M472 241 l16 -6 l6 16 l-19 4 Z" stroke="#36785e" stroke-width="2" fill="#8fb9c4" stroke-linejoin="round" stroke-linecap="round"/><path d="M522 205 l16 -6 l6 16 l-19 4 Z" stroke="#36785e" stroke-width="2" fill="#8fb9c4" stroke-linejoin="round" stroke-linecap="round"/><path d="M553 277 l16 -6 l6 16 l-19 4 Z" stroke="#36785e" stroke-width="2" fill="#8fb9c4" stroke-linejoin="round" stroke-linecap="round"/><path d="M425 290 l16 -6 l6 16 l-19 4 Z" stroke="#36785e" stroke-width="2" fill="#8fb9c4" stroke-linejoin="round" stroke-linecap="round"/><path d="M510 302 l16 -6 l6 16 l-19 4 Z" stroke="#36785e" stroke-width="2" fill="#8fb9c4" stroke-linejoin="round" stroke-linecap="round"/><path d="M615 242 L699 242" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="657" y="196" font-size="20" text-anchor="middle" fill="#183e35"><tspan x="657" dy="0">ingestion</tspan></text><path d="M706 261 Q756 196 818 244 L852 215 L842 280 L816 266 Q760 310 706 261 Z" stroke="#36785e" stroke-width="3" fill="#d7e7cd" stroke-linejoin="round" stroke-linecap="round"/><circle cx="729" cy="251" r="4" fill="#183e35" stroke="#36785e" stroke-width="2"/><circle cx="769" cy="260" r="4" fill="#8fb9c4" stroke="#36785e" stroke-width="2"/><circle cx="787" cy="256" r="4" fill="#8fb9c4" stroke="#36785e" stroke-width="2"/><circle cx="776" cy="273" r="4" fill="#8fb9c4" stroke="#36785e" stroke-width="2"/><text x="774" y="336" font-size="20" text-anchor="middle" fill="#183e35"><tspan x="774" dy="0">Particles may enter</tspan><tspan x="774" dy="29">feeding relationships</tspan></text><rect x="70" y="393" width="760" height="75" rx="15" fill="#d7e9d8" stroke="#36785e" stroke-width="2"/><text x="450" y="424" font-size="21" text-anchor="middle" fill="#183e35"><tspan x="450" dy="0">Non-biodegradable: decomposers do not readily break the plastic down.</tspan><tspan x="450" dy="29">Smaller pieces can still persist as plastic.</tspan></text></g></svg>