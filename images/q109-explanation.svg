<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1260" viewBox="0 0 1000 1260" role="img" aria-labelledby="q109-title q109-desc">
<title id="q109-title">109 · Calculate the increase from the original value</title>
<desc id="q109-desc">Answer C: 326 percent. The source gives 27 Amur leopards in 2007 and 115 in 2023. The increase is 115 minus 27, or 88. Percentage increase equals the increase divided by the original population, multiplied by 100: 88 divided by 27 times 100 is approximately 325.9 percent, rounded to 326 percent. The zero-based bars are drawn from those two source values. 115 divided by 27 times 100 is 426 percent of the original population, not a 426 percent increase.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1260" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >109 · Calculate the increase from the original value</text><text x="500" y="110" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Source values: 27 in 2007 and 115 in 2023.</text><rect x="48" y="149" width="904" height="499" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><line x1="168" y1="565" x2="865" y2="565" stroke="#cfd9c7" stroke-width="2"/><text x="148" y="573" font-size="24" fill="#173d31" font-weight="400" text-anchor="end" >0</text><line x1="168" y1="445" x2="865" y2="445" stroke="#cfd9c7" stroke-width="2"/><text x="148" y="453" font-size="24" fill="#173d31" font-weight="400" text-anchor="end" >40</text><line x1="168" y1="325" x2="865" y2="325" stroke="#cfd9c7" stroke-width="2"/><text x="148" y="333" font-size="24" fill="#173d31" font-weight="400" text-anchor="end" >80</text><line x1="168" y1="205" x2="865" y2="205" stroke="#cfd9c7" stroke-width="2"/><text x="148" y="213" font-size="24" fill="#173d31" font-weight="400" text-anchor="end" >120</text><line x1="168" y1="196" x2="168" y2="565" stroke="#173d31" stroke-width="3"/><line x1="168" y1="565" x2="868" y2="565" stroke="#173d31" stroke-width="3"/><text x="92" y="383" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" transform="rotate(-90 92 383)">Number of leopards</text><rect x="290" y="484" width="140" height="81" rx="0" fill="#357ca2" stroke="none" stroke-width="2"/><text x="360" y="464" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >27</text><text x="360" y="609" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >2007</text><rect x="590" y="220" width="140" height="345" rx="0" fill="#25614b" stroke="none" stroke-width="2"/><text x="660" y="200" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >115</text><text x="660" y="609" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >2023</text><text x="500" y="697" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >1. Find the increase</text><text x="500" y="746" font-size="34" fill="#25614b" font-weight="700" text-anchor="middle" >115 − 27 = 88</text><text x="500" y="810" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >2. Divide by the original value, then × 100</text><text x="500" y="868" font-size="32" fill="#25614b" font-weight="700" text-anchor="middle" >(88 ÷ 27) × 100 ≈ 325.9% → 326%</text><rect x="75" y="921" width="850" height="159" rx="12" fill="#f7ead9" stroke="none" stroke-width="2"/><text x="500" y="966" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >426% is the final population as a percentage of the original.</text><text x="500" y="1011" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Percentage increase counts only the extra 88 leopards.</text><text x="500" y="1140" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Use the starting value as the denominator.</text><rect x="24" y="1184" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1218" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · The population increased by approximately 326%</text>
</g></svg>