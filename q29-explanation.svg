<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="q29-title q29-desc"><title id="q29-title">Fish: one complete circuit</title><desc id="q29-desc">A single fish circuit goes from the heart through the gills, through body tissues, and back to the heart. The heart is drawn with one atrium and one ventricle. Blood becomes oxygenated at the gills and loses oxygen in the body. It passes through the heart once per complete circuit.</desc><defs><marker id="q29-green-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#397359"/></marker><marker id="q29-blue-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3d79a0"/></marker><marker id="q29-red-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85c5e"/></marker><marker id="q29-gold-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b88838"/></marker></defs><rect width="640" height="420" rx="20" fill="#f8faf6"/><g font-family="Arial, Helvetica, sans-serif"><text x="320" y="42" font-size="32" text-anchor="middle" fill="#223c35" font-weight="bold">Fish: one complete circuit</text><ellipse cx="330" cy="168" rx="224" ry="78" fill="#edf2e8" stroke="none" stroke-width="3" /><path d="M 535 163 L 603 116 V 220 Z" stroke="none" stroke-width="0" fill="#edf2e8" stroke-linecap="round" stroke-linejoin="round" /><text x="185" y="110" font-size="30" text-anchor="middle" fill="#223c35" font-weight="bold">Gills</text><text x="515" y="110" font-size="30" text-anchor="middle" fill="#223c35" font-weight="bold">Body</text><path d="M 136 145 C 162 132 209 158 236 145" stroke="#b85c5e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 471 145 C 492 157 536 133 561 145" stroke="#b85c5e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 136 161 C 162 148 209 174 236 161" stroke="#b85c5e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 471 161 C 492 173 536 149 561 161" stroke="#b85c5e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 136 177 C 162 164 209 190 236 177" stroke="#3d79a0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 471 177 C 492 189 536 165 561 177" stroke="#3d79a0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 136 193 C 162 180 209 206 236 193" stroke="#3d79a0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 471 193 C 492 205 536 181 561 193" stroke="#3d79a0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 244 168 H 460" stroke="#b85c5e" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#q29-red-arrow)"/><rect x="108" y="276" width="164" height="72" rx="20" fill="#dcecf4" stroke="#3d79a0" stroke-width="3"/><rect x="295" y="276" width="167" height="72" rx="20" fill="#dcecf4" stroke="#3d79a0" stroke-width="3"/><text x="190" y="321" font-size="28" text-anchor="middle" fill="#223c35" font-weight="bold">Atrium</text><text x="379" y="321" font-size="28" text-anchor="middle" fill="#223c35" font-weight="bold">Ventricle</text><path d="M 273 312 H 293" stroke="#3d79a0" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#q29-blue-arrow)"/><path d="M 379 275 V 234 H 186 V 208" stroke="#3d79a0" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#q29-blue-arrow)"/><path d="M 515 208 V 374 H 190 V 350" stroke="#3d79a0" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#q29-blue-arrow)"/><text x="320" y="408" font-size="28" text-anchor="middle" fill="#223c35" font-weight="normal">Through the heart once per circuit</text></g></svg>