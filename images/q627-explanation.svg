<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Warm, dry air increases transpiration</title><desc id="desc">A leafy plant in a polythene-covered pot stands on a balance. Water-vapour arrows leave the leaves into low-humidity air; a warm thermometer indicates faster evaporation. Mass decreases as the plant loses water.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="53" font-size="31" text-anchor="start" font-weight="bold" fill="#173f32">Warm, dry air increases transpiration</text><rect x="330" y="450" width="350" height="72" rx="15" fill="#c9d4c4" stroke="#24644b" stroke-width="4"/><rect x="425" y="470" width="160" height="38" rx="5" fill="#f4f7e9" stroke="#24644b" stroke-width="2"/><text x="505" y="499" font-size="25" text-anchor="middle" font-weight="bold" fill="#173f32">mass ↓</text><path d="M385 345 H625 L590 445 H420 Z" fill="#c2a278" stroke="#8f805d" stroke-width="3"/><path d="M370 335 Q505 320 640 335 L625 450 H390 Z" fill="none" stroke="#537c9a" stroke-width="2" stroke-dasharray="8 6"/><path d="M505 345 Q495 242.5 505 140" fill="none" stroke="#24644b" stroke-width="7"/><g transform="translate(505.0 273.25) rotate(20)"><path d="M0 0 Q-33.75 -30 -75 0 Q-33.75 30 0 0" fill="#91b68b" stroke="#24644b" stroke-width="3"/><path d="M0 0 H-75" stroke="#24644b" stroke-width="2"/></g><g transform="translate(505.0 232.25) rotate(-20)"><path d="M0 0 Q33.75 -30 75 0 Q33.75 30 0 0" fill="#91b68b" stroke="#24644b" stroke-width="3"/><path d="M0 0 H75" stroke="#24644b" stroke-width="2"/></g><g transform="translate(505.0 191.25) rotate(20)"><path d="M0 0 Q-33.75 -30 -75 0 Q-33.75 30 0 0" fill="#91b68b" stroke="#24644b" stroke-width="3"/><path d="M0 0 H-75" stroke="#24644b" stroke-width="2"/></g><path d="M420 225 q-15 -30 4 -52 q18 -22 0 -50" fill="none" stroke="#537c9a" stroke-width="4" marker-end="url(#blueArrow)"/><path d="M565 195 q-15 -30 4 -52 q18 -22 0 -50" fill="none" stroke="#537c9a" stroke-width="4" marker-end="url(#blueArrow)"/><path d="M555 280 q-15 -30 4 -52 q18 -22 0 -50" fill="none" stroke="#537c9a" stroke-width="4" marker-end="url(#blueArrow)"/><text x="740" y="165" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">Low humidity</text><circle cx="750" cy="210" r="9" fill="#dcecf4" stroke="#537c9a" stroke-width="2"/><circle cx="875" cy="275" r="9" fill="#dcecf4" stroke="#537c9a" stroke-width="2"/><text x="780" y="320" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">Steep water-vapour</text><text x="780" y="350" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">gradient</text><rect x="140" y="190" width="38" height="225" rx="19" fill="#f5f6e9" stroke="#bb6066" stroke-width="3"/><circle cx="159" cy="426" r="31" fill="#e4a193" stroke="#bb6066" stroke-width="3"/><rect x="151" y="230" width="16" height="185" rx="8" fill="#bb6066" stroke="none" stroke-width="0"/><text x="160" y="155" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">Warm</text><text x="780" y="420" font-size="22" text-anchor="middle" font-weight="normal" fill="#173f32">Polythene limits</text><text x="780" y="450" font-size="22" text-anchor="middle" font-weight="normal" fill="#173f32">soil evaporation</text><path d="M680 432 L625 390" fill="none" stroke="#24644b" stroke-width="2"/><text x="500" y="553" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">D: warm + low humidity → greatest mass loss</text></g></svg>