<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Match one complementary DNA base at each position</title><desc id="desc">Two sugar-phosphate rails are joined by six complementary base pairs: A-T, A-T, T-A, C-G, T-A and G-C.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="bluearrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="45" font-size="28" fill="#173f32" text-anchor="start" font-weight="bold">Match one complementary DNA base at each position</text><text x="500" y="555" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">A pairs with T; C pairs with G. The complementary sequence is T-T-A-G-A-C.</text><path d="M340 135 Q320 280 340 465" fill="none" stroke="#24644b" stroke-width="12" /><path d="M660 135 Q680 280 660 465" fill="none" stroke="#537c9a" stroke-width="12" /><rect x="340" y="144" width="135" height="42" rx="8" fill="#d9e5aa" stroke="#24644b" stroke-width="2"/><rect x="525" y="144" width="135" height="42" rx="8" fill="#d1e7ef" stroke="#537c9a" stroke-width="2"/><text x="405" y="174" font-size="27" fill="#173f32" text-anchor="middle" font-weight="bold">A</text><text x="590" y="174" font-size="27" fill="#173f32" text-anchor="middle" font-weight="bold">T</text><path d="M477 160 L523 160" fill="none" stroke="#173f32" stroke-width="2" stroke-dasharray="5 4" /><path d="M477 171 L523 171" fill="none" stroke="#173f32" stroke-width="2" stroke-dasharray="5 4" /><rect x="340" y="201" width="135" height="42" rx="8" fill="#d9e5aa" stroke="#24644b" stroke-width="2"/><rect x="525" y="201" width="135" height="42" rx="8" fill="#d1e7ef" stroke="#537c9a" stroke-width="2"/><text x="405" y="231" font-size="27" fill="#173f32" text-anchor="middle" font-weight="bold">A</text><text x="590" y="231" font-size="27" fill="#173f32" text-anchor="middle" font-weight="bold">T</text><path d="M477 217 L523 217" fill="none" stroke="#173f32" stroke-width="2" stroke-dasharray="5 4" /><path d="M477 228 L523 228" fill="none" stroke="#173f32" stroke-width="2" stroke-dasharray="5 4" /><rect x="340" y="258" width="135" height="42" rx="8" fill="#d1e7ef" stroke="#24644b" stroke-width="2"/><rect x="525" y="258" width="135" height="42" rx="8" fill="#d9e5aa" stroke="#537c9a" stroke-width="2"/><text x="405" y="288" font-size="27" fill="#173f32" text-anchor="middle" font-weight="bold">T</text><text x="590" y="288" font-size="27" fill="#173f32" text-anchor="middle" font-weight="bold">A</text><path d="M477 274 L523 274" fill="none" stroke="#173f32" stroke-width="2" stroke-dasharray="5 4" /><path d="M477 285 L523 285" fill="none" stroke="#173f32" stroke-width="2" stroke-dasharray="5 4" /><rect x="340" y="315" width="135" height="42" rx="8" fill="#efd8b8" stroke="#24644b" stroke-width="2"/><rect x="525" y="315" width="135" height="42" rx="8" fill="#dfd3e9" stroke="#537c9a" stroke-width="2"/><text x="405" y="345" font-size="27" fill="#173f32" text-anchor="middle" font-weight="bold">C</text><text x="590" y="345" font-size="27" fill="#173f32" text-anchor="middle" font-weight="bold">G</text><path d="M477 326 L523 326" fill="none" stroke="#173f32" stroke-width="2" stroke-dasharray="5 4" /><path d="M477 336 L523 336" fill="none" stroke="#173f32" stroke-width="2" stroke-dasharray="5 4" /><path d="M477 346 L523 346" fill="none" stroke="#173f32" stroke-width="2" stroke-dasharray="5 4" /><rect x="340" y="372" width="135" height="42" rx="8" fill="#d1e7ef" stroke="#24644b" stroke-width="2"/><rect x="525" y="372" width="135" height="42" rx="8" fill="#d9e5aa" stroke="#537c9a" stroke-width="2"/><text x="405" y="402" font-size="27" fill="#173f32" text-anchor="middle" font-weight="bold">T</text><text x="590" y="402" font-size="27" fill="#173f32" text-anchor="middle" font-weight="bold">A</text><path d="M477 388 L523 388" fill="none" stroke="#173f32" stroke-width="2" stroke-dasharray="5 4" /><path d="M477 399 L523 399" fill="none" stroke="#173f32" stroke-width="2" stroke-dasharray="5 4" /><rect x="340" y="429" width="135" height="42" rx="8" fill="#dfd3e9" stroke="#24644b" stroke-width="2"/><rect x="525" y="429" width="135" height="42" rx="8" fill="#efd8b8" stroke="#537c9a" stroke-width="2"/><text x="405" y="459" font-size="27" fill="#173f32" text-anchor="middle" font-weight="bold">G</text><text x="590" y="459" font-size="27" fill="#173f32" text-anchor="middle" font-weight="bold">C</text><path d="M477 440 L523 440" fill="none" stroke="#173f32" stroke-width="2" stroke-dasharray="5 4" /><path d="M477 450 L523 450" fill="none" stroke="#173f32" stroke-width="2" stroke-dasharray="5 4" /><path d="M477 460 L523 460" fill="none" stroke="#173f32" stroke-width="2" stroke-dasharray="5 4" /><text x="250" y="125" font-size="24" fill="#173f32" text-anchor="middle" font-weight="bold">Given strand</text><text x="750" y="125" font-size="24" fill="#173f32" text-anchor="middle" font-weight="bold">Complement</text><text x="500" y="505" font-size="23" fill="#173f32" text-anchor="middle" font-weight="normal">Bases align across the two strands</text></g></svg>