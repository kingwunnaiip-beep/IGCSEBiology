<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" role="img" aria-labelledby="title desc"><title id="title">Selection acts through reproduction and inheritance</title><desc id="desc">Two branches show natural selection affected by environmental conditions and artificial selection controlled by human choice. Both lead to selected parents reproducing and passing alleles into the next generation, which can change trait frequencies.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#276b46"/></marker></defs><rect width="1000" height="610" rx="20" fill="#fbfaf0"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="53" fill="#203e33" font-size="30" font-weight="bold" text-anchor="start">Selection acts through reproduction and inheritance</text><text x="40" y="94" fill="#203e33" font-size="22" font-weight="normal" text-anchor="start">Shared mechanism: selected parents pass their alleles to offspring.</text><rect x="40" y="130" width="430" height="160" rx="14" fill="#e4eedc" stroke="#276b46" stroke-width="2"/><rect x="530" y="130" width="430" height="160" rx="14" fill="#e4eedc" stroke="#276b46" stroke-width="2"/><text x="255" y="167" fill="#203e33" font-size="26" font-weight="bold" text-anchor="middle">Natural selection</text><text x="65" y="210" fill="#203e33" font-size="22" font-weight="normal" text-anchor="start">Environmental conditions affect</text><text x="65" y="241" fill="#203e33" font-size="22" font-weight="normal" text-anchor="start">survival and reproductive success.</text><text x="745" y="167" fill="#203e33" font-size="26" font-weight="bold" text-anchor="middle">Artificial selection</text><text x="555" y="210" fill="#203e33" font-size="22" font-weight="normal" text-anchor="start">Humans choose parents with</text><text x="555" y="241" fill="#203e33" font-size="22" font-weight="normal" text-anchor="start">desired inherited characteristics.</text><path d="M255 297 L370 340" fill="none" stroke="#276b46" stroke-width="3" marker-end="url(#arrow)"/><path d="M745 297 L630 340" fill="none" stroke="#276b46" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="350" width="480" height="125" rx="14" fill="#f4edc8" stroke="#276b46" stroke-width="2"/><text x="500" y="391" fill="#203e33" font-size="25" font-weight="bold" text-anchor="middle">Some individuals reproduce</text><text x="500" y="432" fill="#203e33" font-size="22" font-weight="normal" text-anchor="middle">Their alleles enter the next generation.</text><path d="M500 478 L500 515" fill="none" stroke="#276b46" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="549" fill="#203e33" font-size="23" font-weight="bold" text-anchor="middle">Inherited traits can become more common over generations.</text><text x="40" y="588" fill="#65776d" font-size="16" font-weight="normal" text-anchor="start">Original teaching schematic • diagrams are not to scale</text></g></svg>