<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="q399-title q399-desc"><title id="q399-title">Use the valve direction to identify the incoming blood supply</title><desc id="q399-desc">A simplified directed-flow diagram marks X left of Y, normal flow towards X, and pressure at C beyond Y blocking blood that would enter the emptied section. Refer to the original figure for branches and valves.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#245943"/></marker></defs><rect width="1000" height="600" rx="24" fill="#fbf9ee"/><g font-family="Arial, sans-serif"><text x="40" y="55" font-size="27" fill="#173e31" text-anchor="start" font-weight="bold">Use the valve direction to identify the incoming blood supply</text><text x="500" y="110" font-size="25" fill="#173e31" text-anchor="middle" font-weight="normal">Normal permitted flow through X–Y is towards the left</text><rect x="100" y="220" width="800" height="110" rx="8" fill="#ffffff" stroke="#245943" stroke-width="2"/><rect x="355" y="223" width="310" height="104" rx="0" fill="#e5f0df" stroke="#e5f0df" stroke-width="2"/><text x="355" y="365" font-size="26" fill="#173e31" text-anchor="middle" font-weight="bold">X</text><text x="665" y="365" font-size="26" fill="#173e31" text-anchor="middle" font-weight="bold">Y</text><text x="810" y="395" font-size="26" fill="#173e31" text-anchor="middle" font-weight="bold">C</text><path d="M660 275 L380 275" fill="none" stroke="#245943" stroke-width="4" marker-end="url(#arrow)"/><text x="510" y="255" font-size="21" fill="#173e31" text-anchor="middle" font-weight="normal">emptied section</text><path d="M880 275 L835 275" fill="none" stroke="#245943" stroke-width="4" marker-end="url(#arrow)"/><rect x="797" y="195" width="25" height="160" rx="5" fill="#a54f48" stroke="#a54f48" stroke-width="2"/><text x="810" y="177" font-size="22" fill="#173e31" text-anchor="middle" font-weight="bold">pressure</text><rect x="100" y="418" width="800" height="105" rx="16" fill="#e5f0df" stroke="#245943" stroke-width="2"/><text x="500" y="458" font-size="25" fill="#173e31" text-anchor="middle" font-weight="bold">C blocks the incoming supply from beyond Y.</text><text x="500" y="497" font-size="23" fill="#173e31" text-anchor="middle" font-weight="normal">Valves prevent blood from refilling the section in reverse.</text></g></svg>