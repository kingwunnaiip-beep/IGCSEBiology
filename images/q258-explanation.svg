<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="q258-title q258-desc">
<title id="q258-title">Photosynthesis occurs in the mesophyll</title>
<desc id="q258-desc">In the question, label 1 is palisade mesophyll and label 4 is spongy mesophyll. Both contain chloroplasts and photosynthesise. Label 2 is xylem and label 3 is phloem in the vascular bundle, which transport substances.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="760" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Photosynthesis occurs in the mesophyll</text><rect x="45" y="110" width="460" height="240" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="275.0" y="150" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >1 — palisade mesophyll</text><text x="275.0" y="192" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Closely packed, elongated cells</text><text x="275.0" y="225" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >with many chloroplasts.</text><rect x="95" y="235" width="42" height="80" rx="14" fill="#e0efca" stroke="#25614b" stroke-width="2"/><circle cx="106" cy="252" r="5" fill="#25614b" stroke="none" stroke-width="3"/><circle cx="106" cy="276" r="5" fill="#25614b" stroke="none" stroke-width="3"/><circle cx="106" cy="299" r="5" fill="#25614b" stroke="none" stroke-width="3"/><rect x="180" y="235" width="42" height="80" rx="14" fill="#e0efca" stroke="#25614b" stroke-width="2"/><circle cx="191" cy="252" r="5" fill="#25614b" stroke="none" stroke-width="3"/><circle cx="191" cy="276" r="5" fill="#25614b" stroke="none" stroke-width="3"/><circle cx="191" cy="299" r="5" fill="#25614b" stroke="none" stroke-width="3"/><rect x="265" y="235" width="42" height="80" rx="14" fill="#e0efca" stroke="#25614b" stroke-width="2"/><circle cx="276" cy="252" r="5" fill="#25614b" stroke="none" stroke-width="3"/><circle cx="276" cy="276" r="5" fill="#25614b" stroke="none" stroke-width="3"/><circle cx="276" cy="299" r="5" fill="#25614b" stroke="none" stroke-width="3"/><rect x="350" y="235" width="42" height="80" rx="14" fill="#e0efca" stroke="#25614b" stroke-width="2"/><circle cx="361" cy="252" r="5" fill="#25614b" stroke="none" stroke-width="3"/><circle cx="361" cy="276" r="5" fill="#25614b" stroke="none" stroke-width="3"/><circle cx="361" cy="299" r="5" fill="#25614b" stroke="none" stroke-width="3"/><rect x="435" y="235" width="42" height="80" rx="14" fill="#e0efca" stroke="#25614b" stroke-width="2"/><circle cx="446" cy="252" r="5" fill="#25614b" stroke="none" stroke-width="3"/><circle cx="446" cy="276" r="5" fill="#25614b" stroke="none" stroke-width="3"/><circle cx="446" cy="299" r="5" fill="#25614b" stroke="none" stroke-width="3"/><rect x="615" y="110" width="460" height="240" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="845.0" y="150" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >4 — spongy mesophyll</text><text x="845.0" y="192" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Loosely arranged cells also</text><text x="845.0" y="225" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >contain chloroplasts.</text><ellipse cx="670" cy="290" rx="39" ry="25" fill="#e0efca" stroke="#25614b" stroke-width="3"/><circle cx="658" cy="282" r="6" fill="#25614b" stroke="none" stroke-width="3"/><circle cx="683" cy="298" r="6" fill="#25614b" stroke="none" stroke-width="3"/><ellipse cx="765" cy="280" rx="39" ry="25" fill="#e0efca" stroke="#25614b" stroke-width="3"/><circle cx="753" cy="272" r="6" fill="#25614b" stroke="none" stroke-width="3"/><circle cx="778" cy="288" r="6" fill="#25614b" stroke="none" stroke-width="3"/><ellipse cx="870" cy="305" rx="39" ry="25" fill="#e0efca" stroke="#25614b" stroke-width="3"/><circle cx="858" cy="297" r="6" fill="#25614b" stroke="none" stroke-width="3"/><circle cx="883" cy="313" r="6" fill="#25614b" stroke="none" stroke-width="3"/><ellipse cx="970" cy="280" rx="39" ry="25" fill="#e0efca" stroke="#25614b" stroke-width="3"/><circle cx="958" cy="272" r="6" fill="#25614b" stroke="none" stroke-width="3"/><circle cx="983" cy="288" r="6" fill="#25614b" stroke="none" stroke-width="3"/><rect x="45" y="405" width="460" height="155" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="275.0" y="445" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >2 — xylem</text><text x="275.0" y="487" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Transports water and mineral ions.</text><rect x="615" y="405" width="460" height="155" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="845.0" y="445" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >3 — phloem</text><text x="845.0" y="487" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Transports sucrose and amino acids.</text><text x="560" y="625" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Chloroplasts absorb light and contain chlorophyll.</text><text x="560" y="661" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Use the labels on the original figure: 1 and 4 are the photosynthetic tissues.</text><rect x="24" y="684" width="1072" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="560.0" y="718" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >1 and 4 contain the chloroplasts used in photosynthesis.</text>
</g></svg>