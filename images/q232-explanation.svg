<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="q232-title q232-desc">
<title id="q232-title">Divide image length by magnification</title>
<desc id="q232-desc">Calculations from the original data: A 60 mm divided by 2 equals 30 mm; B 100 mm divided by 200 equals 0.5 mm; C 28 mm divided by 1 equals 28 mm; D 75 mm divided by 1.5 equals 50 mm. D has the longest actual body.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="700" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Divide image length by magnification</text><rect x="100" y="90" width="800" height="66" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500" y="132" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Actual length = image length ÷ magnification</text><text x="85" y="210" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Choice</text><text x="290" y="210" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Image length</text><text x="545" y="210" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Magnification</text><text x="815" y="210" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Actual length</text><rect x="32" y="240" width="936" height="67" rx="12" fill="white" stroke="#c8d4cc" stroke-width="2"/><text x="85" y="284" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >A</text><text x="290" y="284" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >60 mm</text><text x="545" y="284" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >×2</text><text x="815" y="284" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >30 mm</text><rect x="32" y="316" width="936" height="67" rx="12" fill="white" stroke="#c8d4cc" stroke-width="2"/><text x="85" y="360" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >B</text><text x="290" y="360" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >100 mm</text><text x="545" y="360" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >×200</text><text x="815" y="360" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >0.5 mm</text><rect x="32" y="392" width="936" height="67" rx="12" fill="white" stroke="#c8d4cc" stroke-width="2"/><text x="85" y="436" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >C</text><text x="290" y="436" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >28 mm</text><text x="545" y="436" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >×1</text><text x="815" y="436" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >28 mm</text><rect x="32" y="468" width="936" height="67" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="85" y="512" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >D</text><text x="290" y="512" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >75 mm</text><text x="545" y="512" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >×1.5</text><text x="815" y="512" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >50 mm</text><text x="500" y="590" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >50 mm &gt; 30 mm &gt; 28 mm &gt; 0.5 mm</text><rect x="24" y="624" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="658" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >D — the longest actual body is 50 mm</text>
</g></svg>