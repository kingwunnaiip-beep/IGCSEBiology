<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Two stain components need two matching enzymes</title><desc id="desc">A linked protein chain is broken by protease into smaller peptides or amino acids. A lipid model containing a glycerol backbone and three fatty-acid chains is broken by lipase into glycerol and fatty acids. All molecules are schematic.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2e7656"/></marker></defs><rect width="1000" height="620" rx="24" fill="#fbf9ec"/><g font-family="sans-serif" fill="#173e32"><text x="42" y="55" font-size="31" text-anchor="start" fill="#173e32">Two stain components need two matching enzymes</text><rect x="35" y="100" width="930" height="205" rx="18" fill="#e4efdf" stroke="#548269" stroke-width="2"/><rect x="35" y="340" width="930" height="205" rx="18" fill="#e4efdf" stroke="#548269" stroke-width="2"/><text x="65" y="139" font-size="26" text-anchor="start" fill="#173e32">Meat protein</text><text x="65" y="380" font-size="26" text-anchor="start" fill="#173e32">Cooking oil (lipid)</text><circle cx="85" cy="210" r="16" fill="#79a26c" stroke="#2e7656" stroke-width="3"/><path d="M101 210h14" stroke="#2e7656" stroke-width="4"/><circle cx="131" cy="210" r="16" fill="#79a26c" stroke="#2e7656" stroke-width="3"/><path d="M147 210h14" stroke="#2e7656" stroke-width="4"/><circle cx="177" cy="210" r="16" fill="#79a26c" stroke="#2e7656" stroke-width="3"/><path d="M193 210h14" stroke="#2e7656" stroke-width="4"/><circle cx="223" cy="210" r="16" fill="#79a26c" stroke="#2e7656" stroke-width="3"/><path d="M239 210h14" stroke="#2e7656" stroke-width="4"/><circle cx="269" cy="210" r="16" fill="#79a26c" stroke="#2e7656" stroke-width="3"/><text x="480" y="185" font-size="24" text-anchor="middle" fill="#173e32">protease</text><path d="M360 218 L600 218" fill="none" stroke="#2e7656" stroke-width="5" marker-end="url(#arrow)"/><circle cx="650" cy="210" r="16" fill="#79a26c" stroke="#2e7656" stroke-width="3"/><circle cx="708" cy="210" r="16" fill="#79a26c" stroke="#2e7656" stroke-width="3"/><circle cx="766" cy="210" r="16" fill="#79a26c" stroke="#2e7656" stroke-width="3"/><circle cx="824" cy="210" r="16" fill="#79a26c" stroke="#2e7656" stroke-width="3"/><circle cx="882" cy="210" r="16" fill="#79a26c" stroke="#2e7656" stroke-width="3"/><text x="780" y="274" font-size="21" text-anchor="middle" fill="#173e32">Smaller peptides / amino acids</text><path d="M110 410V500 M110 425H285 M110 455H285 M110 485H285" stroke="#a78a3c" stroke-width="12" fill="none"/><text x="480" y="423" font-size="24" text-anchor="middle" fill="#173e32">lipase</text><path d="M360 460 L600 460" fill="none" stroke="#2e7656" stroke-width="5" marker-end="url(#arrow)"/><path d="M650 410V500 M710 425H900 M710 455H900 M710 485H900" stroke="#a78a3c" stroke-width="10" fill="none"/><text x="780" y="520" font-size="21" text-anchor="middle" fill="#173e32">Glycerol + fatty acids</text><text x="500" y="590" font-size="22" text-anchor="middle" fill="#173e32">Different substrates require enzymes with different specific active sites.</text></g></svg>