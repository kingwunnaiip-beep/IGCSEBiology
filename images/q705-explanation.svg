<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Magnification compares image length with actual length</title><desc id="desc">An onion epidermal cell drawing has X and Y at its ends and a measured-image ruler spanning 60 mm. The actual X–Y length is given as 150 micrometres. Converting the image to 60000 micrometres gives 400 times.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">Magnification compares image length with actual length</text><path d="M90 220 Q90 170 150 170 H610 Q700 175 710 255 Q710 330 630 335 H160 Q90 330 90 280 Z" fill="#e4f0df" stroke="#24644b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M115 224 Q115 198 160 196 H602 Q670 202 679 255 Q679 305 625 307 H165 Q115 305 115 280 Z" fill="#f9faee" stroke="#537c9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="620" cy="245" rx="30" ry="19" fill="#24644b" stroke="#24644b" stroke-width="3"/><path d="M90 145 V365 M710 145 V365" fill="none" stroke="#24644b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="138" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">X</text><text x="710" y="138" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">Y</text><path d="M99 365 H700" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="400" y="405" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">Image X–Y = 60 mm</text><path d="M90 435 H710" fill="none" stroke="#537c9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M90.0 435 V452" fill="none" stroke="#537c9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M141.66666666666666 435 V445" fill="none" stroke="#537c9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M193.33333333333331 435 V452" fill="none" stroke="#537c9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M245.0 435 V445" fill="none" stroke="#537c9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M296.66666666666663 435 V452" fill="none" stroke="#537c9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M348.3333333333333 435 V445" fill="none" stroke="#537c9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M400.0 435 V452" fill="none" stroke="#537c9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M451.6666666666667 435 V445" fill="none" stroke="#537c9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M503.3333333333333 435 V452" fill="none" stroke="#537c9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M555.0 435 V445" fill="none" stroke="#537c9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M606.6666666666666 435 V452" fill="none" stroke="#537c9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M658.3333333333334 435 V445" fill="none" stroke="#537c9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M710.0 435 V452" fill="none" stroke="#537c9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="480" font-size="20" fill="#173f32" text-anchor="middle" font-weight="400">0</text><text x="710" y="480" font-size="20" fill="#173f32" text-anchor="middle" font-weight="400">60 mm</text><text x="755" y="215" font-size="24" fill="#173f32" text-anchor="start" font-weight="400">Actual cell</text><text x="755" y="260" font-size="24" fill="#173f32" text-anchor="start" font-weight="400">X–Y = 150 µm</text><text x="755" y="305" font-size="24" fill="#173f32" text-anchor="start" font-weight="400">60 mm =</text><text x="755" y="350" font-size="24" fill="#173f32" text-anchor="start" font-weight="400">60 000 µm</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">60 000 µm ÷ 150 µm = ×400  • C</text></g></svg>