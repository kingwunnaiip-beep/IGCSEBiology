<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">A white offspring of a dark parent must be Ww</title><desc id="desc">A white parent A and dark parent B produce white offspring C; B can only contribute w and C needs a W to be white.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="bluearrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="45" font-size="28" fill="#173f32" text-anchor="start" font-weight="bold">A white offspring of a dark parent must be Ww</text><text x="500" y="555" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">C inherits w from dark parent B and needs W for white fur: C must be Ww.</text><g transform="translate(255 225) scale(1.15)"><path d="M45 20 Q95 60 130 15" fill="none" stroke="#ab665b" stroke-width="4" /><ellipse cx="0" cy="0" rx="57" ry="32" fill="#fff" stroke="#173f32" stroke-width="2" /><ellipse cx="-48" cy="-8" rx="27" ry="23" fill="#fff" stroke="#173f32" stroke-width="2" /><ellipse cx="-50" cy="-29" rx="13" ry="13" fill="#fff" stroke="#173f32" stroke-width="2" /><ellipse cx="-60" cy="-10" rx="3" ry="3" fill="#173f32" stroke="#173f32" stroke-width="1" /><path d="M-63 4 L-90 7" fill="none" stroke="#173f32" stroke-width="1" /><path d="M-63 0 L-90 -4" fill="none" stroke="#173f32" stroke-width="1" /></g><g transform="translate(700 225) scale(1.15)"><path d="M45 20 Q95 60 130 15" fill="none" stroke="#ab665b" stroke-width="4" /><ellipse cx="0" cy="0" rx="57" ry="32" fill="#173f32" stroke="#173f32" stroke-width="2" /><ellipse cx="-48" cy="-8" rx="27" ry="23" fill="#173f32" stroke="#173f32" stroke-width="2" /><ellipse cx="-50" cy="-29" rx="13" ry="13" fill="#173f32" stroke="#173f32" stroke-width="2" /><ellipse cx="-60" cy="-10" rx="3" ry="3" fill="#173f32" stroke="#173f32" stroke-width="1" /><path d="M-63 4 L-90 7" fill="none" stroke="#173f32" stroke-width="1" /><path d="M-63 0 L-90 -4" fill="none" stroke="#173f32" stroke-width="1" /></g><g transform="translate(500 438) scale(1.2)"><path d="M45 20 Q95 60 130 15" fill="none" stroke="#ab665b" stroke-width="4" /><ellipse cx="0" cy="0" rx="57" ry="32" fill="#fff" stroke="#173f32" stroke-width="2" /><ellipse cx="-48" cy="-8" rx="27" ry="23" fill="#fff" stroke="#173f32" stroke-width="2" /><ellipse cx="-50" cy="-29" rx="13" ry="13" fill="#fff" stroke="#173f32" stroke-width="2" /><ellipse cx="-60" cy="-10" rx="3" ry="3" fill="#173f32" stroke="#173f32" stroke-width="1" /><path d="M-63 4 L-90 7" fill="none" stroke="#173f32" stroke-width="1" /><path d="M-63 0 L-90 -4" fill="none" stroke="#173f32" stroke-width="1" /></g><text x="255" y="130" font-size="25" fill="#173f32" text-anchor="middle" font-weight="bold">A: white</text><text x="255" y="165" font-size="23" fill="#173f32" text-anchor="middle" font-weight="normal">WW or Ww</text><text x="700" y="130" font-size="25" fill="#173f32" text-anchor="middle" font-weight="bold">B: dark</text><text x="700" y="165" font-size="27" fill="#173f32" text-anchor="middle" font-weight="normal">ww</text><path d="M300 280 L455 380" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)" /><path d="M655 280 L545 380" fill="none" stroke="#537c9a" stroke-width="4" marker-end="url(#bluearrow)" /><text x="340" y="340" font-size="31" fill="#24644b" text-anchor="start" font-weight="bold">W</text><text x="610" y="340" font-size="31" fill="#537c9a" text-anchor="start" font-weight="bold">w</text><text x="500" y="510" font-size="28" fill="#173f32" text-anchor="middle" font-weight="bold">C: white = Ww</text></g></svg>