<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="810" viewBox="0 0 1000 810" role="img" aria-labelledby="q241-title q241-desc">
<title id="q241-title">Wood can be replaced through tree regrowth</title>
<desc id="q241-desc">Qualitative resource comparison, not measured growth data. Trees can regrow and be replanted. Harvesting wood can be sustainable when replacement keeps pace with removal and the woodland is maintained. Coal, gas and oil are finite fossil fuels, not replaced on a human timescale. This is conditional management, not a claim about the pictured forest.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="810" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Wood can be replaced through tree regrowth</text><text x="500" y="102" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative resource model; no growth rates are measured</text><rect x="40" y="138" width="440" height="410" rx="12" fill="white" stroke="#25614b" stroke-width="2"/><text x="260" y="182" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >WOOD: renewable</text><rect x="132" y="337" width="16" height="70" rx="0" fill="#a87d54" stroke="none" stroke-width="2"/><path d="M140 232 L88 347 L192 347 Z" fill="#dbeacb" stroke="#25614b" stroke-width="3"/><rect x="252" y="328.75" width="16" height="87.5" rx="0" fill="#a87d54" stroke="none" stroke-width="2"/><path d="M260 197.5 L195.0 341.25 L325.0 341.25 Z" fill="#dbeacb" stroke="#25614b" stroke-width="3"/><rect x="372" y="341.75" width="16" height="59.5" rx="0" fill="#a87d54" stroke="none" stroke-width="2"/><path d="M380 252.5 L335.8 350.25 L424.2 350.25 Z" fill="#dbeacb" stroke="#25614b" stroke-width="3"/><text x="260" y="456" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Replant and allow regrowth.</text><text x="260" y="491" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Replace wood that is removed.</text><rect x="520" y="138" width="440" height="410" rx="12" fill="white" stroke="#526c62" stroke-width="2"/><text x="740" y="182" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >FOSSIL FUELS: finite</text><text x="740" y="261" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >coal</text><text x="740" y="313" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >gas</text><text x="740" y="365" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >oil</text><text x="740" y="456" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Removal depletes reserves.</text><text x="740" y="491" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Not replaced on a</text><text x="740" y="526" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >human timescale.</text><rect x="60" y="584" width="880" height="120" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500" y="617" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Sustainable wood harvesting is conditional:</text><text x="500" y="651" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >replacement must keep pace with removal,</text><text x="500" y="685" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >and the woodland must be maintained.</text><rect x="24" y="734" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="768" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >D — taking wood from a woodland</text>
</g></svg>