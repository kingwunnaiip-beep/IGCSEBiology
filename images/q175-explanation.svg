<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1030" viewBox="0 0 1000 1030" role="img" aria-labelledby="q175-title q175-desc">
<title id="q175-title">175 · Energy pyramids need energy, area and time</title>
<desc id="q175-desc">A measured pyramid of energy compares energy per unit area per unit time at successive trophic levels. Kilojoules measure energy, square metres provide the common area, and years provide the common interval. The unit is kJ per square metre per year, answerC. The small trophic pyramid is qualitative; its bar widths are not measured values or a claimed fixed transfer efficiency.</desc>
