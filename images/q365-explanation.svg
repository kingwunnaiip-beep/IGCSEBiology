<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Light response and photosynthetic nutrition</title><desc id="desc">Six green microorganism symbols are dispersed without light. The same six symbols gather towards a side light in the lit tube; outlined white circles show oxygen bubbles rather than additional organisms. Movement and sensitivity are inferred from redistribution; oxygen production supports photosynthetic nutrition.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L8 3 Z" fill="#245c43"/></marker></defs>
<rect width="1000" height="600" rx="24" fill="#fbf8ec"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="42" y="58" font-size="32" text-anchor="start" fill="#173f31" font-weight="bold">Light response and photosynthetic nutrition</text><text x="162" y="125" font-size="27" text-anchor="middle" fill="#173f31" font-weight="bold">Light off</text><path d="M100 155 V395 Q100 460 162 460 Q224 460 224 395 V155" fill="#eaf3e2" stroke="#245c43" stroke-width="4"/><text x="417" y="125" font-size="27" text-anchor="middle" fill="#173f31" font-weight="bold">Light on</text><path d="M355 155 V395 Q355 460 417 460 Q479 460 479 395 V155" fill="#eaf3e2" stroke="#245c43" stroke-width="4"/><circle cx="124" cy="200" r="8" fill="#245c43"/><circle cx="188" cy="230" r="8" fill="#245c43"/><circle cx="145" cy="280" r="8" fill="#245c43"/><circle cx="195" cy="320" r="8" fill="#245c43"/><circle cx="130" cy="380" r="8" fill="#245c43"/><circle cx="175" cy="413" r="8" fill="#245c43"/><circle cx="375" cy="300" r="8" fill="#245c43"/><circle cx="402" cy="325" r="8" fill="#245c43"/><circle cx="440" cy="303" r="8" fill="#245c43"/><circle cx="460" cy="320" r="8" fill="#245c43"/><circle cx="390" cy="345" r="8" fill="#245c43"/><circle cx="430" cy="335" r="8" fill="#245c43"/><circle cx="423" cy="215" r="10" fill="#ffffff" stroke="#245c43" stroke-width="2"/><circle cx="420" cy="255" r="7" fill="#ffffff" stroke="#245c43" stroke-width="2"/><text x="423" y="493" font-size="23" text-anchor="middle" fill="#173f31" font-weight="normal">Oxygen released</text><path d="M265 295 L330 325" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><path d="M520 295 L486 312 M520 325 L486 325 M520 355 L486 338" stroke="#b88624" stroke-width="4"/><rect x="550" y="132" width="410" height="320" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="575" y="177" font-size="23" text-anchor="start" fill="#173f31" font-weight="normal">Movement: cells change position.</text><text x="575" y="220" font-size="23" text-anchor="start" fill="#173f31" font-weight="normal"></text><text x="575" y="263" font-size="23" text-anchor="start" fill="#173f31" font-weight="normal">Sensitivity: light is the stimulus.</text><text x="575" y="306" font-size="23" text-anchor="start" fill="#173f31" font-weight="normal"></text><text x="575" y="349" font-size="23" text-anchor="start" fill="#173f31" font-weight="normal">Nutrition: photosynthesis makes</text><text x="575" y="392" font-size="23" text-anchor="start" fill="#173f31" font-weight="normal">organic nutrients.</text><rect x="60" y="525" width="880" height="50" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="500" y="558" font-size="25" text-anchor="middle" fill="#173f31" font-weight="bold">Light + chloroplasts → photosynthesis → oxygen</text></g></svg>