remove urea into urine.</text><line x1="500" y1="751" x2="500" y2="783" stroke="#357ca2" stroke-width="5"/><polygon points="500,783 493.07331236687776,769.6950761583107 506.92668763312224,769.6950761583107" fill="#357ca2"/><rect x="75" y="791" width="850" height="163" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="831" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Bladder</text><text x="500.0" y="874" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Stores urine before it leaves the body.</text><rect x="75" y="1035" width="850" height="72" rx="12" fill="#f7efdf" stroke="#daa958" stroke-width="2"/><text x="500.0" y="1075" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Formation: liver · Excretion: kidneys</text><rect x="24" y="1114" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1148" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · Liver</text>
