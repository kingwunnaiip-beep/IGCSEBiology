<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1260" viewBox="0 0 1000 1260" role="img" aria-labelledby="q208-title q208-desc">
<title id="q208-title">208 · Energy and organism number give different shapes</title>
<desc id="q208-desc">Answer C: energy pyramid 3 and numbers pyramid 1. The food chain is grass to zebras to blood-sucking insects to birds. The energy pyramid narrows at every upward level, because less energy is available at each transfer. The numbers model has many grass plants, few zebras, many parasitic insects and fewer birds. Thus the insect level widens above the zebra level in the numbers model. Both conceptual pyramids are read from producers at the bottom to birds at the top. New drawing widths are qualitative and do not represent measured counts, energy values or transfer efficiencies. Original examination shapes are retained separately in a raster crop.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
