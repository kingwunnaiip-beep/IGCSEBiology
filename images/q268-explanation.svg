,311.355339586379 459.7510962845529,322.2787579299426" fill="#357ca2"/><text x="370" y="355" font-size="27" fill="#357ca2" font-weight="400" text-anchor="middle" >Air space</text><text x="825" y="190" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >Moist walls of</text><text x="825" y="227" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >spongy mesophyll</text><text x="825" y="264" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >cells: evaporation</text><line x1="807" y1="243" x2="615" y2="263" stroke="#25614b" stroke-width="3"/><text x="825" y="420" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >Guard cells</text><text x="825" y="457" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >control the pore.</text><line x1="810" y1="448" x2="674" y2="495" stroke="#25614b" stroke-width="3"/><text x="80" y="570" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >Xylem supplies liquid water.</text><text x="80" y="607" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >Stomata allow vapour to leave.</text><text x="610" y="650" font-size="25" fill="#357ca2" font-weight="400" text-anchor="middle" >Water vapour diffuses out</text><rect x="24" y="684" width="1072" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="560.0" y="718" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C — the spongy mesophyll cells</text>
