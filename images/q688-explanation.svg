<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Xylem vessel elements form a continuous hollow tube</title><desc id="desc">A longitudinal xylem vessel has thick lignified walls and an open lumen. Dashed joins show where dead vessel elements meet without blocking end walls; water arrows pass upward.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">Xylem vessel elements form a continuous hollow tube</text><rect x="300" y="120" width="190" height="370" rx="0" fill="#cfb57c" stroke="#24644b" stroke-width="4"/><rect x="335" y="120" width="120" height="370" rx="0" fill="#e5f0f3" stroke="#537c9a" stroke-width="3"/><path d="M300 240 L335 240" fill="none" stroke="#24644b" stroke-width="3" stroke-dasharray="5 5"/><path d="M455 240 L490 240" fill="none" stroke="#24644b" stroke-width="3" stroke-dasharray="5 5"/><path d="M300 365 L335 365" fill="none" stroke="#24644b" stroke-width="3" stroke-dasharray="5 5"/><path d="M455 365 L490 365" fill="none" stroke="#24644b" stroke-width="3" stroke-dasharray="5 5"/><path d="M395 240 L395 150" fill="none" stroke="#537c9a" stroke-width="4" marker-end="url(#arrow)"/><path d="M395 340 L395 250" fill="none" stroke="#537c9a" stroke-width="4" marker-end="url(#arrow)"/><path d="M395 450 L395 360" fill="none" stroke="#537c9a" stroke-width="4" marker-end="url(#arrow)"/><text x="590" y="170" font-size="24" text-anchor="start" fill="#173f32">Lignified side walls</text><path d="M590 176 L480 195" fill="none" stroke="#537c9a" stroke-width="2"/><text x="590" y="280" font-size="24" text-anchor="start" fill="#173f32">Cells joined end to end</text><path d="M590 286 L480 240" fill="none" stroke="#537c9a" stroke-width="2"/><text x="590" y="390" font-size="24" text-anchor="start" fill="#173f32">No end walls across the lumen</text><path d="M590 396 L450 365" fill="none" stroke="#537c9a" stroke-width="2"/><text x="395" y="535" font-size="26" text-anchor="middle" fill="#173f32" font-weight="bold">Continuous hollow vessel</text><text x="140" y="260" font-size="25" text-anchor="middle" fill="#173f32">Water</text><text x="140" y="295" font-size="25" text-anchor="middle" fill="#173f32">moves up</text><path d="M170 325 L170 185" fill="none" stroke="#537c9a" stroke-width="4" marker-end="url(#arrow)"/><text x="500" y="565" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">B: made of cells joined end to end</text></g></svg>