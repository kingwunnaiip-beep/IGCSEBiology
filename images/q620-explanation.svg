<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Anaerobic yeast makes ethanol and carbon dioxide</title><desc id="desc">A sealed yeast-and-glucose tube with an oil layer is connected by a delivery tube to limewater. Yeast cells remain in the first tube, while carbon dioxide bubbles into the second tube and makes it cloudy.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="53" font-size="31" text-anchor="start" font-weight="bold" fill="#173f32">Anaerobic yeast makes ethanol and carbon dioxide</text><path d="M130 175 V430 A100 70 0 0 0 330 430 V175" fill="#f6f8ed" stroke="#537c9a" stroke-width="4"/><path d="M645 175 V430 A100 70 0 0 0 845 430 V175" fill="#f6f8ed" stroke="#537c9a" stroke-width="4"/><path d="M135 285 H325 V430 A95 65 0 0 1 135 430 Z" fill="#e2d2a9" stroke="none" stroke-width="3"/><rect x="135" y="265" width="190" height="20" rx="0" fill="#d4b95c" stroke="none" stroke-width="0"/><path d="M650 330 H840 V430 A95 65 0 0 1 650 430 Z" fill="#d4dcd5" stroke="none" stroke-width="3"/><circle cx="680" cy="380" r="14" fill="#f5f6ed" stroke="none" stroke-width="0"/><circle cx="745" cy="420" r="14" fill="#f5f6ed" stroke="none" stroke-width="0"/><circle cx="805" cy="390" r="14" fill="#f5f6ed" stroke="none" stroke-width="0"/><circle cx="700" cy="450" r="14" fill="#f5f6ed" stroke="none" stroke-width="0"/><circle cx="780" cy="465" r="14" fill="#f5f6ed" stroke="none" stroke-width="0"/><circle cx="825" cy="430" r="14" fill="#f5f6ed" stroke="none" stroke-width="0"/><ellipse cx="190" cy="350" rx="10" ry="15" fill="#c5b181" stroke="#24644b" stroke-width="2" transform="rotate(-25 190 350)"/><ellipse cx="260" cy="390" rx="10" ry="15" fill="#c5b181" stroke="#24644b" stroke-width="2" transform="rotate(-25 260 390)"/><ellipse cx="210" cy="430" rx="10" ry="15" fill="#c5b181" stroke="#24644b" stroke-width="2" transform="rotate(-25 210 430)"/><ellipse cx="290" cy="450" rx="10" ry="15" fill="#c5b181" stroke="#24644b" stroke-width="2" transform="rotate(-25 290 450)"/><rect x="115" y="165" width="230" height="35" rx="0" fill="#bba783" stroke="#8f805d" stroke-width="3"/><path d="M250 220 V120 H745 V360" fill="none" stroke="#537c9a" stroke-width="12"/><circle cx="745" cy="385" r="8" fill="#f9fbf2" stroke="#537c9a" stroke-width="2"/><circle cx="720" cy="350" r="8" fill="#f9fbf2" stroke="#537c9a" stroke-width="2"/><circle cx="760" cy="320" r="8" fill="#f9fbf2" stroke="#537c9a" stroke-width="2"/><text x="230" y="535" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">Yeast + glucose → ethanol</text><text x="745" y="535" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">Limewater turns cloudy</text><text x="480" y="96" font-size="24" text-anchor="middle" font-weight="normal" fill="#173f32">CO₂ travels through delivery tube</text><text x="55" y="270" font-size="24" text-anchor="start" font-weight="normal" fill="#173f32">Oil</text><path d="M95 270 L135 275" fill="none" stroke="#24644b" stroke-width="2"/><text x="230" y="245" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">no oxygen</text><text x="500" y="582" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">B: ethanol produced; limewater goes cloudy</text></g></svg>