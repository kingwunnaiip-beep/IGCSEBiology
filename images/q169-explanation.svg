<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1160" viewBox="0 0 1000 1160" role="img" aria-labelledby="q169-title q169-desc">
<title id="q169-title">169 · Chromosome number stays; DNA is shared</title>
<desc id="q169-desc">Answer C: a cell at the start of mitosis has 26 chromosomes and 50 arbitrary units of DNA. The DNA has already replicated before mitosis. Mitosis separates copied sister chromatids so that each daughter has 26 chromosomes and 25 arbitrary units of DNA. Both daughters together contain 50 units. The original conceptual split diagram shows the supplied quantities explicitly, without inventing chromosome drawings, units or measured stages.</desc>
