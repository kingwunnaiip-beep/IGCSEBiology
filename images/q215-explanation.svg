<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-labelledby="q215-title q215-desc">
<title id="q215-title">Select one parent for each desired feature</title>
<desc id="q215-desc">Source plant 2 is the shorter type G plant and source plant 3 has the thicker type H stem. These are the parent choices in C. Qualitative drawings identify the selected traits; offspring must be selected over generations.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
