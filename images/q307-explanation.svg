<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="q307-title q307-desc">
<title id="q307-title">Read each food test separately</title>
<desc id="q307-desc">The source fruit gives positive Benedict and biuret tests and negative ethanol-emulsion and iodine tests. These results indicate reducing sugar and protein, without detected fat or starch.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="690" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Read each food test separately</text><text x="50" y="125" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >TEST</text><text x="430" y="125" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >RESULT</text><text x="680" y="125" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >TESTS FOR</text><rect x="35" y="155" width="1050" height="82" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="55" y="206" font-size="28" fill="#173d31" font-weight="400" text-anchor="start" >Benedict’s solution</text><text x="430" y="206" font-size="28" fill="#25614b" font-weight="700" text-anchor="start" >positive</text><text x="680" y="206" font-size="28" fill="#173d31" font-weight="400" text-anchor="start" >reducing sugar</text><text x="1035" y="206" font-size="34" fill="#173d31" font-weight="700" text-anchor="middle" >✓</text><rect x="35" y="250" width="1050" height="82" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="55" y="301" font-size="28" fill="#173d31" font-weight="400" text-anchor="start" >Biuret</text><text x="430" y="301" font-size="28" fill="#25614b" font-weight="700" text-anchor="start" >positive</text><text x="680" y="301" font-size="28" fill="#173d31" font-weight="400" text-anchor="start" >protein</text><text x="1035" y="301" font-size="34" fill="#173d31" font-weight="700" text-anchor="middle" >✓</text><rect x="35" y="345" width="1050" height="82" rx="12" fill="#f5f2ed" stroke="none" stroke-width="2"/><text x="55" y="396" font-size="28" fill="#173d31" font-weight="400" text-anchor="start" >Ethanol emulsion</text><text x="430" y="396" font-size="28" fill="#526c62" font-weight="700" text-anchor="start" >negative</text><text x="680" y="396" font-size="28" fill="#173d31" font-weight="400" text-anchor="start" >fat</text><text x="1035" y="396" font-size="34" fill="#173d31" font-weight="700" text-anchor="middle" >−</text><rect x="35" y="440" width="1050" height="82" rx="12" fill="#f5f2ed" stroke="none" stroke-width="2"/><text x="55" y="491" font-size="28" fill="#173d31" font-weight="400" text-anchor="start" >Iodine solution</text><text x="430" y="491" font-size="28" fill="#526c62" font-weight="700" text-anchor="start" >negative</text><text x="680" y="491" font-size="28" fill="#173d31" font-weight="400" text-anchor="start" >starch</text><text x="1035" y="491" font-size="34" fill="#173d31" font-weight="700" text-anchor="middle" >−</text><text x="560" y="590" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Positive results identify the two substances in option C.</text><rect x="24" y="614" width="1072" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="560.0" y="648" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Protein + reducing sugar → option C</text>
