d" stroke-width="4"/><line x1="506" y1="398" x2="561" y2="398" stroke="#25614b" stroke-width="5"/><line x1="561" y1="398" x2="599" y2="320" stroke="#25614b" stroke-width="5"/><polygon points="599,320 599.3998721850523,334.9946691272472 586.9458281714977,328.9273143514129" fill="#25614b"/><line x1="561" y1="398" x2="599" y2="510" stroke="#25614b" stroke-width="5"/><polygon points="599,510 588.1657509501887,499.6260399303515 601.284602254794,495.1750010948604" fill="#25614b"/><text x="500" y="618" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >More cells; chromosome number is maintained.</text><rect x="75" y="722" width="850" height="145" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="762" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Stem cells are unspecialised</text><text x="500.0" y="805" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >They can later differentiate into specialised cell types.</text><rect x="75" y="912" width="850" height="145" rx="12" fill="#f4efdf" stroke="#daa958" stroke-width="2"/><text x="500.0" y="952" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Mitosis supports embryo growth</text><text x="500.0" y="995" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Meiosis forms haploid cells for sexual reproduction.</text><text x="500" y="1119" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Cell sizes and chromosome symbols are illustrative, not counted data.</text><rect x="24" y="1164" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1198" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · Stem cells undergoing mitosis</text>
