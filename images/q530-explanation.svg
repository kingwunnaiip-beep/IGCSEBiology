<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="q530-title q530-desc"><title id="q530-title">Glucagon mobilises a liver carbohydrate store</title><desc id="q530-desc">A three-stage flow diagram links pancreas secretion of more glucagon, event 5, to liver glycogen breakdown, less glycogen event 4, then release of glucose into blood, more glucose event 1. Exercise consumes glucose, and the response restores blood glucose.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#36785e"/></marker></defs><rect x="0" y="0" width="900" height="500" rx="22" fill="#fbf7e9"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="46" font-size="27" text-anchor="start" fill="#183e35"><tspan x="35" dy="0">Glucagon mobilises a liver carbohydrate store</tspan></text><rect x="35" y="128" width="240" height="240" rx="15" fill="#d7e9d8" stroke="#36785e" stroke-width="2"/><rect x="330" y="128" width="240" height="240" rx="15" fill="#d7e9d8" stroke="#36785e" stroke-width="2"/><rect x="625" y="128" width="240" height="240" rx="15" fill="#d7e9d8" stroke="#36785e" stroke-width="2"/><text x="155" y="165" font-size="23" text-anchor="middle" fill="#183e35"><tspan x="155" dy="0">PANCREAS</tspan></text><text x="450" y="165" font-size="23" text-anchor="middle" fill="#183e35"><tspan x="450" dy="0">LIVER</tspan></text><text x="745" y="165" font-size="23" text-anchor="middle" fill="#183e35"><tspan x="745" dy="0">BLOOD</tspan></text><text x="155" y="213" font-size="22" text-anchor="middle" fill="#183e35"><tspan x="155" dy="0">More glucagon</tspan><tspan x="155" dy="29">is secreted</tspan></text><text x="155" y="328" font-size="22" text-anchor="middle" fill="#183e35"><tspan x="155" dy="0">event 5</tspan></text><text x="450" y="213" font-size="22" text-anchor="middle" fill="#183e35"><tspan x="450" dy="0">Glycogen</tspan><tspan x="450" dy="29">is broken down</tspan></text><text x="450" y="328" font-size="21" text-anchor="middle" fill="#183e35"><tspan x="450" dy="0">less glycogen: 4</tspan></text><text x="745" y="213" font-size="22" text-anchor="middle" fill="#183e35"><tspan x="745" dy="0">Glucose</tspan><tspan x="745" dy="29">is released</tspan></text><text x="745" y="328" font-size="21" text-anchor="middle" fill="#183e35"><tspan x="745" dy="0">more glucose: 1</tspan></text><path d="M278 251 L324 251" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M573 251 L619 251" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><circle cx="375" cy="276" r="8" fill="#cc9e4b" stroke="#36785e" stroke-width="2"/><circle cx="402" cy="276" r="8" fill="#cc9e4b" stroke="#36785e" stroke-width="2"/><circle cx="429" cy="276" r="8" fill="#cc9e4b" stroke="#36785e" stroke-width="2"/><circle cx="456" cy="276" r="8" fill="#cc9e4b" stroke="#36785e" stroke-width="2"/><circle cx="483" cy="276" r="8" fill="#cc9e4b" stroke="#36785e" stroke-width="2"/><circle cx="510" cy="276" r="8" fill="#cc9e4b" stroke="#36785e" stroke-width="2"/><circle cx="711" cy="276" r="8" fill="#cc9e4b" stroke="#36785e" stroke-width="2"/><circle cx="740" cy="276" r="8" fill="#cc9e4b" stroke="#36785e" stroke-width="2"/><circle cx="772" cy="276" r="8" fill="#cc9e4b" stroke="#36785e" stroke-width="2"/><text x="450" y="100" font-size="23" text-anchor="middle" fill="#183e35"><tspan x="450" dy="0">Exercise uses glucose in respiration.</tspan></text><text x="450" y="430" font-size="22" text-anchor="middle" fill="#183e35"><tspan x="450" dy="0">Falling glucose triggers a response that raises blood glucose.</tspan><tspan x="450" dy="29">Stored glycogen supplies glucose; glucagon is the signal.</tspan></text></g></svg>