t><text x="500" y="589" font-size="27" fill="#357ca2" font-weight="700" text-anchor="middle" >Energy is released; oxygen is not used.</text><rect x="55" y="695" width="430" height="210" rx="12" fill="#f8e9df" stroke="#b94a43" stroke-width="2"/><text x="270.0" y="736" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Human muscle: anaerobic</text><text x="270.0" y="779" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Glucose → lactic acid</text><text x="270.0" y="816" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Oxygen is not used.</text><rect x="515" y="695" width="430" height="210" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="730.0" y="736" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Aerobic respiration</text><text x="730.0" y="779" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Glucose + oxygen</text><text x="730.0" y="816" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >→ carbon dioxide + water</text><text x="500" y="966" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Anaerobic respiration releases less energy per glucose</text><text x="500" y="1006" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >than aerobic respiration. Yeast drawing is not to scale.</text><text x="500" y="1080" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Identify the products: ethanol + carbon dioxide → yeast.</text><rect x="24" y="1144" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1178" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · Anaerobic respiration in yeast</text>
