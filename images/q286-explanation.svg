<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710" role="img" aria-labelledby="q286-title q286-desc">
<title id="q286-title">Identify the vacuole inside a guard cell</title>
<desc id="q286-desc">A schematic guard cell has an outer cell wall, a thin inner cell membrane, shaded cytoplasm and a large clear vacuole. The vacuole is inside the cytoplasm, so original label C identifies it correctly. The schematic is not to scale.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="710" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Identify the vacuole inside a guard cell</text><path d="M 360 150 C 190 120 125 260 165 420 C 195 550 370 565 470 510 C 520 475 440 430 420 355 C 398 275 500 175 360 150 Z" fill="#ecdfc4" stroke="#25614b" stroke-width="4"/><path d="M 350 175 C 220 155 155 280 190 410 C 220 510 355 532 440 492 C 477 470 415 425 395 357 C 372 278 455 195 350 175 Z" fill="#bdd5c6" stroke="#357ca2" stroke-width="3"/><path d="M 320 217 C 242 212 210 292 232 390 C 252 452 330 473 371 447 C 390 433 360 393 353 355 C 338 298 386 230 320 217 Z" fill="#fffdf7" stroke="#25614b" stroke-width="3"/><ellipse cx="209" cy="305" rx="20" ry="12" fill="#5b9872" stroke="#25614b" stroke-width="2"/><ellipse cx="249" cy="462" rx="20" ry="12" fill="#5b9872" stroke="#25614b" stroke-width="2"/><ellipse cx="369" cy="198" rx="20" ry="12" fill="#5b9872" stroke="#25614b" stroke-width="2"/><text x="310" y="590" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Schematic guard cell; not to scale</text><line x1="720" y1="190" x2="416.441" y2="172" stroke="#daa958" stroke-width="4"/><polygon points="416.441,172 430.1326032219744,165.8730104282756 429.3125862854011,179.70209494212276" fill="#daa958"/><text x="740" y="195" font-size="25" fill="#173d31" font-weight="700" text-anchor="start" >Cell wall</text><line x1="720" y1="275" x2="404.154" y2="219" stroke="#357ca2" stroke-width="4"/><polygon points="404.154,219 418.4638557325082,214.5024418942273 416.04534993859977,228.14307369749162" fill="#357ca2"/><text x="740" y="270" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >Cell membrane</text><text x="740" y="303" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >just inside the wall</text><line x1="720" y1="380" x2="327" y2="330" stroke="#25614b" stroke-width="4"/><polygon points="327,330 341.07274425836897,324.80790321367726 339.32432200021935,338.5505021627335" fill="#25614b"/><text x="740" y="374" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >Large vacuole</text><text x="740" y="407" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >Correct source label: C</text><line x1="720" y1="485" x2="397" y2="451" stroke="#25614b" stroke-width="4"/><polygon points="397,451 410.9569381135612,445.5041944635729 409.5067005089668,459.28145170721956" fill="#25614b"/><text x="740" y="480" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >Cytoplasm</text><text x="740" y="513" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >surrounds the vacuole</text><rect x="24" y="634" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="668" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C: the line points into the large vacuole.</text>
</g></svg>