<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" role="img" aria-labelledby="title498 desc498"><title id="title498">Antibody secretion and phagocytosis</title><desc id="desc498">A lymphocyte-derived plasma cell secretes Y-shaped antibodies, while a phagocyte engulfs a pathogen. Memory-cell formation is associated with the lymphocyte response, not antibody secretion by phagocytes.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#185744"/></marker></defs><rect width="800" height="530" rx="20" fill="#fbf8ed"/><g font-family="Arial, sans-serif"><text x="400" y="55" font-size="28" text-anchor="middle" fill="#185744" font-weight="bold">Antibody secretion and phagocytosis</text><rect x="40" y="100" width="340" height="330" rx="12" fill="#e1eee2" stroke="#185744" stroke-width="2"/><rect x="420" y="100" width="340" height="330" rx="12" fill="#e1eee2" stroke="#185744" stroke-width="2"/><text x="210" y="140" font-size="25" text-anchor="middle" fill="#185744" font-weight="bold">Lymphocyte lineage</text><text x="590" y="140" font-size="25" text-anchor="middle" fill="#185744" font-weight="bold">Phagocyte</text><circle cx="135" cy="240" r="60" fill="#e1eee2" stroke="#185744" stroke-width="2"/><circle cx="125" cy="238" r="27" fill="#5f9778" stroke="#185744" stroke-width="2"/><path d="M205 240 L260 240" stroke="#185744" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M283 187 L300 205 L317 187 M300 205 L300 232" stroke="#c87939" stroke-width="5" fill="none"/><path d="M283 247 L300 265 L317 247 M300 265 L300 292" stroke="#c87939" stroke-width="5" fill="none"/><text x="210" y="350" font-size="21" text-anchor="middle" fill="#185744" font-weight="normal">Secretes specific antibodies</text><text x="210" y="385" font-size="21" text-anchor="middle" fill="#185744" font-weight="normal">Forms memory cells</text><path d="M520 190 C460 225 495 330 570 305 C640 340 710 260 655 205 C625 170 595 200 570 190 Z" stroke="#185744" stroke-width="3" fill="#e1eee2"/><circle cx="580" cy="250" r="20" fill="#5f9778" stroke="#185744" stroke-width="2"/><circle cx="625" cy="220" r="10" fill="#c87939" stroke="#185744" stroke-width="2"/><text x="590" y="350" font-size="21" text-anchor="middle" fill="#185744" font-weight="normal">Engulfs and digests</text><text x="590" y="385" font-size="21" text-anchor="middle" fill="#185744" font-weight="normal">pathogens</text><text x="400" y="477" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">Vaccination uses antigen-specific lymphocyte responses.</text></g></svg>