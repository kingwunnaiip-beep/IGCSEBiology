<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Primary consumers eat the aquatic plants</title><desc id="desc">A food web shows aquatic plants giving food energy directly to tadpoles and small shrimps. Tadpoles feed water beetles; shrimps feed frogs and fish; beetles and frogs also feed fish. Only the direct plant feeders are primary consumers.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="1.8"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#b85c50" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="38" y="54" font-size="30" fill="#173f32" font-weight="bold">Primary consumers eat the aquatic plants</text><line x1="195" y1="290" x2="340" y2="193" stroke="#24644b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="195" y1="320" x2="340" y2="399" stroke="#24644b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="483" y1="182" x2="610" y2="182" stroke="#24644b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="488" y1="410" x2="610" y2="410" stroke="#24644b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="480" y1="384" x2="810" y2="290" stroke="#24644b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="711" y1="190" x2="819" y2="245" stroke="#24644b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="716" y1="399" x2="820" 