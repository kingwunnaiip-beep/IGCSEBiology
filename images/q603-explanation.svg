<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">On which labelled days do ovulation and possible fertilisation occur?</title><desc id="desc">Q is mid-cycle ovulation, followed shortly by R when fertilisation may occur. An unfertilised egg survives about 24 hours, so S is too late for that egg. S is not a consequence of successful fertilisation at R.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e" /></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8" /><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">On which labelled days do ovulation and possible fertilisation</text><text x="38" y="73" font-size="24" font-weight="700">occur?</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="50" y="207" font-size="23" font-weight="700">Q: mid-cycle</text><text x="50" y="285" font-size="21" font-weight="400">Ovulation releases an egg</text><path d="M345 245 H376" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)" /><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="405" y="207" font-size="23" font-weight="700">R: shortly after Q</text><text x="405" y="285" font-size="21" font-weight="400">Fertilisation may occur</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text><text x="760" y="207" font-size="23" font-weight="700">S: too late for this egg</text><text x="760" y="285" font-size="21" font-weight="400">If not fertilised, the egg</text><text x="760" y="312" font-size="21" font-weight="400">survives about 24 hours</text></g></svg>
