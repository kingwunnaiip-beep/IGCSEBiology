ation</text><text x="500" y="145" font-size="25" text-anchor="middle" font-weight="bold" fill="#173f32">Antibiotic exposure</text><text x="830" y="145" font-size="25" text-anchor="middle" font-weight="bold" fill="#173f32">Survivors reproduce</text><text x="500" y="495" font-size="24" text-anchor="middle" font-weight="normal" fill="#173f32">Green: sensitive     Red: resistant</text><text x="500" y="553" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">B: practices 1 and 4 increase unnecessary selection</text><text x="500" y="586" font-size="20" text-anchor="middle" font-weight="normal" fill="#173f32">Resistance is selected in bacteria, not in the patient.</text></g></svg>