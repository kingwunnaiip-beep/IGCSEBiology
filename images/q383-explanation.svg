<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">Population versus community in one forest</title><desc id="desc">The population panel contains only red deer of one species. The community panel contains deer, a bird, a snake and a tree, representing different populations in the same forest.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#245744"/></marker></defs><rect width="1000" height="540" rx="22" fill="#fbf8ed"/><text x="42" y="49" font-family="Arial, sans-serif" font-size="30" text-anchor="start" fill="#183e32" font-weight="bold">Population versus community in one forest</text><rect x="50" y="105" width="420" height="325" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><rect x="530" y="105" width="420" height="325" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><text x="260" y="150" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#183e32" font-weight="bold">Population</text><text x="740" y="150" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#183e32" font-weight="bold">Community</text><g transform="translate(155,220) scale(1)"><ellipse cx="0" cy="0" rx="32" ry="18" fill="#9d764e"/><path d="M-20,10 v30 M18,10 v30 M23,-3 l17,-30 l14,6 l-11,31 M45,-29 l-4,-17 M45,-40 l12,-6" fill="none" stroke="#705235" stroke-width="7" stroke-linecap="round"/></g><g transform="translate(320,220) scale(1)"><ellipse cx="0" cy="0" rx="32" ry="18" fill="#9d764e"/><path d="M-20,10 v30 M18,10 v30 M23,-3 l17,-30 l14,6 l-11,31 M45,-29 l-4,-17 M45,-40 l12,-6" fill="none" stroke="#705235" stroke-width="7" stroke-linecap="round"/></g><g transform="translate(240,335) scale(1)"><ellipse cx="0" cy="0" rx="32" ry="18" fill="#9d764e"/><path d="M-20,10 v30 M18,10 v30 M23,-3 l17,-30 l14,6 l-11,31 M45,-29 l-4,-17 M45,-40 l12,-6" fill="none" stroke="#705235" stroke-width="7" stroke-linecap="round"/></g><text x="260" y="399" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183e32" font-weight="normal">One species: all red deer</text><g transform="translate(640,230) scale(1)"><ellipse cx="0" cy="0" rx="32" ry="18" fill="#9d764e"/><path d="M-20,10 v30 M18,10 v30 M23,-3 l17,-30 l14,6 l-11,31 M45,-29 l-4,-17 M45,-40 l12,-6" fill="none" stroke="#705235" stroke-width="7" stroke-linecap="round"/></g><path d="M770,230 q35,-45 70,0 q-35,-22 -70,0 M808,225 v35" fill="none" stroke="#245744" stroke-width="8" stroke-linecap="round"/><path d="M640,350 q20,-45 45,-10 t45,-15" fill="none" stroke="#548c69" stroke-width="10" stroke-linecap="round"/><path d="M835,350 v-55" stroke="#785e3e" stroke-width="9"/><circle cx="835" cy="290" r="33" fill="#548c69"/><text x="740" y="399" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183e32" font-weight="normal">Different species together</text><text x="500" y="480" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#183e32" font-weight="bold">Both groups occupy the same forest at the same time.</text><text x="42" y="518" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#52675b" font-weight="normal">Original teaching schematic • Biology quiz • not to scale</text></svg>