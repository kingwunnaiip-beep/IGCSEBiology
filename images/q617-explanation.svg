<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Water enters and the vacuole expands</title><desc id="desc">A less turgid plant cell is compared with a turgid cell of the same wall size. Water arrows enter the second cell; its larger vacuole pushes the cell contents against the wall.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="53" font-size="31" text-anchor="start" font-weight="bold" fill="#173f32">Water enters and the vacuole expands</text><rect x="95" y="185" width="300" height="295" rx="16" fill="#d5dfb2" stroke="#24644b" stroke-width="5"/><rect x="600" y="185" width="300" height="295" rx="16" fill="#d5dfb2" stroke="#24644b" stroke-width="5"/><rect x="120" y="210" width="250" height="245" rx="25" fill="#f8f4d6" stroke="#24644b" stroke-width="3"/><rect x="150" y="265" width="190" height="160" rx="25" fill="#dcecf4" stroke="#537c9a" stroke-width="3"/><circle cx="145" cy="240" r="15" fill="#537c9a" stroke="#24644b" stroke-width="2"/><rect x="608" y="193" width="284" height="279" rx="12" fill="#f8f4d6" stroke="#24644b" stroke-width="3"/><rect x="632" y="220" width="236" height="230" rx="15" fill="#dcecf4" stroke="#537c9a" stroke-width="3"/><circle cx="620" cy="260" r="11" fill="#537c9a" stroke="#24644b" stroke-width="2"/><text x="245" y="150" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">Before water gain</text><text x="750" y="150" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">After osmosis</text><path d="M430 335 L560 335" fill="none" stroke="#24644b" stroke-width="5" marker-end="url(#arrow)"/><text x="245" y="350" font-size="24" text-anchor="middle" font-weight="normal" fill="#173f32">vacuole</text><text x="750" y="345" font-size="24" text-anchor="middle" font-weight="normal" fill="#173f32">larger</text><text x="750" y="377" font-size="24" text-anchor="middle" font-weight="normal" fill="#173f32">vacuole</text><circle cx="570" cy="240" r="9" fill="#dcecf4" stroke="#537c9a" stroke-width="2"/><circle cx="925" cy="285" r="9" fill="#dcecf4" stroke="#537c9a" stroke-width="2"/><circle cx="925" cy="400" r="9" fill="#dcecf4" stroke="#537c9a" stroke-width="2"/><path d="M950 330 L895 330" fill="none" stroke="#537c9a" stroke-width="4" marker-end="url(#blueArrow)"/><text x="500" y="553" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">B: water enters; vacuole volume increases</text><text x="500" y="586" font-size="20" text-anchor="middle" font-weight="normal" fill="#173f32">The cell wall limits expansion as turgor rises.</text></g></svg>