<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">A thick muscular and elastic wall identifies an artery</title><desc id="desc">A transverse artery section shows a thick muscle layer around a relatively narrow lumen. An outer elastic and fibrous layer surrounds the muscle. These concurrent wall features withstand high pulsating blood pressure.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="1.8"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#b85c50" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="38" y="54" font-size="30" fill="#173f32" font-weight="bold">A thick muscular and elastic wall identifies an artery</text><circle cx="385" cy="308" r="183" fill="#e4f0df" stroke="#24644b" stroke-width="5" /><circle cx="385" cy="308" r="158" fill="#f0c6b7" stroke="#b85c50" stroke-width="3" /><circle cx="385" cy="308" r="76" fill="#dcebf2" stroke="#537c9a" stroke-width="4" /><ellipse cx="503.0" cy="308.0" rx="11" ry="5" fill="#d1a350" stroke="#b85c50" stroke-width="1" transform="rotate(90.0 503.0 308.0)"/><ellipse cx="500.0414936374552" cy="334.2574702068451" rx="11" ry="5" fill="#d1a350" stroke="#b85c50" stroke-width="1" transform="rotate(102.85714285714286 500.0414936374552 334.2574702068451)"/><ellipse cx="491.31432641248546" cy="359.1982812158719" rx="11" ry="5" fill="#d1a350" stroke="#b85c50" stroke-width="1" transform="rotate(115.71428571428572 491.31432641248546 359.19828121587