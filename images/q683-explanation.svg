<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which statements describe an adaptive feature?</title><desc id="desc">Helps survival and reproduction: In the organism’s environment: true; Must be inherited: Can be passed to offspring: true; Always continuous variation?: False: variation can also be discontinuous</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Which statements describe an adaptive feature?</text><text x="38" y="106" font-size="18" font-weight="400">Correct statements: 1 and 3 only.</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><circle cx="60" cy="160" r="16" fill="#285d4c"/><text x="60" y="166" text-anchor="middle" font-size="18" fill="white">1</text><text x="50" y="207" font-size="23" font-weight="700">Helps survival and</text><text x="50" y="236" font-size="23" font-weight="700">reproduction</text><text x="50" y="285" font-size="21" font-weight="400">In the organism’s</text><text x="50" y="312" font-size="21" font-weight="400">environment: true</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><circle cx="415" cy="160" r="16" fill="#285d4c"/><text x="415" y="166" text-anchor="middle" font-size="18" fill="white">3</text><text x="405" y="207" font-size="23" font-weight="700">Must be inherited</text><text x="405" y="285" font-size="21" font-weight="400">Can be passed to offspring:</text><text x="405" y="312" font-size="21" font-weight="400">true</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><circle cx="770" cy="160" r="16" fill="#285d4c"/><text x="770" y="166" text-anchor="middle" font-size="18" fill="white">2</text><text x="760" y="207" font-size="23" font-weight="700">Always continuous</text><text x="760" y="236" font-size="23" font-weight="700">variation?</text><text x="760" y="285" font-size="21" font-weight="400">False: variation can also be</text><text x="760" y="312" font-size="21" font-weight="400">discontinuous</text><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>