<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800" role="img" aria-labelledby="q61-title q61-desc">
<title id="q61-title">One substrate, two products</title>
<desc id="q61-desc">The simplified enzyme-catalysed reaction is S to T plus U. With complete conversion, no added reactants and no loss of material, starting mass of S equals the final masses of T and U together. An approximate example from graph C shows 8 grams of S giving 3.5 grams of T and 4.5 grams of U. Two mass strips have the same total length to show that the masses add up. With a fixed product ratio, T is proportional to the starting mass of S and is less than it. Answer C.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="900" height="800" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="450.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >One substrate, two products</text><text x="450" y="108" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >S → T + U</text><text x="450" y="151" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Complete conversion · fixed product ratio</text><text x="450" y="207" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Start: 8 g of substrate S</text><rect x="80" y="230" width="740" height="75" rx="0" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="450" y="278" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >S · 8 g</text><line x1="450" y1="320" x2="450" y2="405" stroke="#25614b" stroke-width="6"/><polygon points="450,405 443.07331236687776,391.6950761583107 456.92668763312224,391.6950761583107" fill="#25614b"/><text x="490" y="363" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >Enzyme acts and can be reused</text><rect x="80" y="430" width="323.75" height="75" rx="0" fill="#e8f2f7" stroke="#357ca2" stroke-width="2"/><rect x="403.75" y="430" width="416.25" height="75" rx="0" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="241.875" y="478" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >T · ≈3.5 g</text><text x="611.875" y="478" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >U · ≈4.5 g</text><text x="450" y="549" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Approximate example read from graph C</text><text x="450" y="603" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Mass of S = mass of T + mass of U</text><text x="450" y="648" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >More starting S → proportionally more T.</text><text x="450" y="682" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >T alone has less mass than S because U is also formed.</text><rect x="24" y="724" width="852" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="450.0" y="758" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C · T is proportional to, and less than, starting S</text>
</g></svg>