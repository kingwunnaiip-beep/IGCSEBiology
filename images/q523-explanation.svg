<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Meiosis produces four haploid cells</title><desc id="d">A parent with 23 pairs has 46 chromosomes. Two meiotic divisions produce four haploid cells, each with 23 single chromosomes. The drawn chromosome symbols illustrate division only; the labels give the actual question counts.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#194f3b"/></marker></defs><rect width="1000" height="620" rx="22" fill="#fffdf2"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="31" text-anchor="start" fill="#213c30" font-weight="bold">Meiosis produces four haploid cells</text><rect x="330" y="102" width="340" height="83" rx="16" fill="#d9ead7" stroke="#194f3b" stroke-width="2"/><text x="500.0" y="151.5" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">Parent: 23 pairs = 46</text><circle cx="500" cy="241" r="44" fill="#ffffff" stroke="#194f3b" stroke-width="2"/><path d="M482,223 L492,259 M492,223 L482,259" stroke="#194f3b" stroke-width="5"/><path d="M508,223 L518,259 M518,223 L508,259" stroke="#c99a43" stroke-width="5"/><path d="M462,286 L307,342" fill="none" stroke="#194f3b" stroke-width="4" marker-end="url(#arrow)"/><path d="M538,286 L693,342" fill="none" stroke="#194f3b" stroke-width="4" marker-end="url(#arrow)"/><circle cx="275" cy="375" r="44" fill="#ffffff" stroke="#194f3b" stroke-width="2"/><path d="M270,357 L280,393 M280,357 L270,393" stroke="#194f3b" stroke-width="5"/><circle cx="725" cy="375" r="44" fill="#ffffff" stroke="#194f3b" stroke-width="2"/><path d="M720,357 L730,393 M730,357 L720,393" stroke="#c99a43" stroke-width="5"/><text x="500" y="326" font-size="25" text-anchor="middle" fill="#213c30" font-weight="normal">division 1</text><path d="M275,423 L160,465" fill="none" stroke="#194f3b" stroke-width="4" marker-end="url(#arrow)"/><circle cx="160" cy="497" r="29" fill="#ffffff" stroke="#194f3b" stroke-width="2"/><path d="M160,480 L160,514" stroke="#194f3b" stroke-width="5"/><text x="160" y="546" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">23</text><path d="M275,423 L390,465" fill="none" stroke="#194f3b" stroke-width="4" marker-end="url(#arrow)"/><circle cx="390" cy="497" r="29" fill="#ffffff" stroke="#194f3b" stroke-width="2"/><path d="M390,480 L390,514" stroke="#194f3b" stroke-width="5"/><text x="390" y="546" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">23</text><path d="M725,423 L610,465" fill="none" stroke="#194f3b" stroke-width="4" marker-end="url(#arrow)"/><circle cx="610" cy="497" r="29" fill="#ffffff" stroke="#194f3b" stroke-width="2"/><path d="M610,480 L610,514" stroke="#c99a43" stroke-width="5"/><text x="610" y="546" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">23</text><path d="M725,423 L840,465" fill="none" stroke="#194f3b" stroke-width="4" marker-end="url(#arrow)"/><circle cx="840" cy="497" r="29" fill="#ffffff" stroke="#194f3b" stroke-width="2"/><path d="M840,480 L840,514" stroke="#c99a43" stroke-width="5"/><text x="840" y="546" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">23</text><text x="500" y="449" font-size="25" text-anchor="middle" fill="#213c30" font-weight="normal">division 2</text><text x="40" y="592" font-size="21" text-anchor="start" fill="#213c30" font-weight="normal">Only one pair is illustrated; counts are labels. DNA replication precedes the divisions.</text></g></svg>