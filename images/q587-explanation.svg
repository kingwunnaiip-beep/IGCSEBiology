<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Falling oxygen shows respiration is faster</title><desc id="desc">An oxygen-versus-time curve falls during interval X. A leaf inset contains a chloroplast and a mitochondrion. Respiration uses oxygen and releases carbon dioxide faster than photosynthesis replaces oxygen and removes carbon dioxide.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="1.8"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#b85c50" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="38" y="54" font-size="30" fill="#173f32" font-weight="bold">Falling oxygen shows respiration is faster</text><rect x="275" y="155" width="210" height="285" rx="0" fill="#f4e5bf" stroke="none" stroke-width="3" /><line x1="100" y1="455" x2="570" y2="455" stroke="#24644b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="100" y1="455" x2="100" y2="140" stroke="#24644b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M110 186 C210 182 225 200 286 250 C350 310 388 367 461 407 C500 426 538 431 558 433" fill="none" stroke="#24644b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><text x="95" y="115" font-size="24" text-anchor="start" fill="#173f32" font-weight="bold">O₂ in leaf air spaces</text><text x="335" y="498" font-size="24" text-anchor="middle" fill="#173f32" font-weight="normal">Time</text><text x="379" y="189" font-size="31" text-anchor="middle" fill="#173f32" font-weight="bold">X</text><path d="M645 192 Q897 121 906 328 Q766 422 645 192 Z" fill="#e4f0df" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M662 208 Q773 267 877 318" fill="none" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="728" cy="234" rx="45" ry="24" fill="#82b36b" stroke="#24644b" stroke-width="3" /><line x1="706" y1="220" x2="706" y2="245" stroke="#24644b" stroke-width="3" stroke-linecap="round" /><line x1="722" y1="220" x2="722" y2="245" stroke="#24644b" stroke-width="3" stroke-linecap="round" /><line x1="738" y1="220" x2="738" y2="245" stroke="#24644b" stroke-width="3" stroke-linecap="round" /><line x1="754" y1="220" x2="754" y2="245" stroke="#24644b" stroke-width="3" stroke-linecap="round" /><ellipse cx="811" cy="307" rx="49" ry="27" fill="#f0c6b7" stroke="#b85c50" stroke-width="3" /><path d="M775 304 q10 -20 20 0 t20 0 t20 0" fill="none" stroke="#b85c50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="664" y="401" font-size="22" text-anchor="start" fill="#173f32" font-weight="normal">Respiration uses more O₂</text><text x="664" y="429" font-size="22" text-anchor="start" fill="#173f32" font-weight="normal">than photosynthesis makes.</text><line x1="822" y1="345" x2="881" y2="377" stroke="#b85c50" stroke-width="4" stroke-linecap="round" marker-end="url(#red)"/><text x="862" y="471" font-size="25" text-anchor="middle" fill="#173f32" font-weight="bold">Net CO₂ out</text><text x="500" y="558" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">B · Respiration exceeds photosynthesis, so carbon dioxide is produced.</text></g></svg>
