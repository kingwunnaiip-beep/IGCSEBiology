<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Extra oxygen supports removal of lactic acid</title><desc id="desc">A runner’s muscles release lactic acid into blood. It reaches the liver, where extra oxygen supports aerobic breakdown to carbon dioxide and water during recovery.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">Extra oxygen supports removal of lactic acid</text><circle cx="140" cy="145" r="28" fill="#e5c9b0" stroke="#24644b" stroke-width="3"/><path d="M140 175 L160 280 L95 365 M160 280 L240 330 M150 215 L75 255 M150 210 L220 170" fill="none" stroke="#24644b" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="435" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">Working muscles</text><circle cx="180" cy="305" r="7" fill="#b28298" stroke="#b28298" stroke-width="1"/><circle cx="215" cy="325" r="7" fill="#b28298" stroke="#b28298" stroke-width="1"/><circle cx="240" cy="340" r="7" fill="#b28298" stroke="#b28298" stroke-width="1"/><path d="M280 325 L440 325" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><g transform="translate(650 300) scale(1.1)"><path d="M-120 -35 Q-80 -100 30 -70 Q120 -65 130 -25 Q55 50 -100 35 Z" fill="#b97f73" stroke="#ac655c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 -65 L5 25" fill="none" stroke="#ac655c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="640" y="175" font-size="27" text-anchor="middle" fill="#173f32" font-weight="bold">Liver</text><circle cx="525" cy="310" r="7" fill="#b28298" stroke="#b28298" stroke-width="1"/><circle cx="565" cy="300" r="7" fill="#b28298" stroke="#b28298" stroke-width="1"/><circle cx="610" cy="315" r="7" fill="#b28298" stroke="#b28298" stroke-width="1"/><text x="365" y="285" font-size="22" text-anchor="middle" fill="#173f32">Blood carries</text><text x="365" y="315" font-size="22" text-anchor="middle" fill="#173f32">lactic acid</text><path d="M680 110 L680 210" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="680" y="100" font-size="26" text-anchor="middle" fill="#173f32" font-weight="bold">Extra O₂</text><path d="M750 320 L900 320" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="865" y="260" font-size="24" text-anchor="middle" fill="#173f32">CO₂ + water</text><text x="660" y="440" font-size="26" text-anchor="middle" fill="#173f32" font-weight="bold">X: aerobic respiration</text><text x="500" y="565" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">B: aerobic respiration of lactic acid</text></g></svg>