<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">Water changes state and cycles through plants</title><desc id="desc">Condensation changes water vapour into cloud droplets. Precipitation returns liquid water to the surface. Evaporation returns water to the atmosphere; roots take up water and transpiration releases it from plants.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#245744"/></marker></defs><rect width="1000" height="540" rx="22" fill="#fbf8ed"/><text x="42" y="49" font-family="Arial, sans-serif" font-size="30" text-anchor="start" fill="#183e32" font-weight="bold">Water changes state and cycles through plants</text><rect x="55" y="110" width="365" height="115" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><text x="237" y="153" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#183e32" font-weight="bold">Water vapour</text><text x="237" y="194" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183e32" font-weight="normal">Gas in the atmosphere</text><path d="M433,169 L565,169" fill="none" stroke="#245744" stroke-width="4" marker-end="url(#arrow)"/><text x="500" y="130" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#183e32" font-weight="bold">3</text><text x="500" y="210" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#183e32" font-weight="normal">condensation</text><rect x="580" y="110" width="365" height="115" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><text x="762" y="153" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#183e32" font-weight="bold">Cloud droplets</text><text x="762" y="194" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183e32" font-weight="normal">Liquid water</text><path d="M762,237 L762,321" fill="none" stroke="#245744" stroke-width="4" marker-end="url(#arrow)"/><text x="795" y="279" font-family="Arial, sans-serif" font-size="21" text-anchor="start" fill="#183e32" font-weight="normal">1: precipitation</text><rect x="580" y="335" width="365" height="115" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><text x="762" y="381" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#183e32" font-weight="bold">Surface water</text><text x="762" y="422" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183e32" font-weight="normal">Rivers, lakes and soil</text><rect x="55" y="335" width="365" height="115" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><text x="237" y="381" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#183e32" font-weight="bold">Plants</text><text x="237" y="422" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183e32" font-weight="normal">Water enters through roots</text><path d="M237,321 L237,239" fill="none" stroke="#245744" stroke-width="4" marker-end="url(#arrow)"/><text x="260" y="279" font-family="Arial, sans-serif" font-size="21" text-anchor="start" fill="#183e32" font-weight="normal">4: transpiration</text><path d="M580,363 L490,290 L420,225" fill="none" stroke="#245744" stroke-width="4" marker-end="url(#arrow)"/><text x="590" y="282" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#183e32" font-weight="normal">2: evaporation</text><path d="M567,422 L433,422" fill="none" stroke="#245744" stroke-width="4" marker-end="url(#arrow)"/><text x="500" y="470" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#183e32" font-weight="normal">root uptake</text><text x="42" y="518" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#52675b" font-weight="normal">Original teaching schematic • Biology quiz • not to scale</text></svg>