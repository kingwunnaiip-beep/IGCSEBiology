<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img" aria-labelledby="q331-title q331-desc">
<title id="q331-title">Respiration powers muscle and nerve activity</title>
<desc id="q331-desc">Energy from respiration is transferred to ATP and supports muscle contraction and maintaining the ion gradients needed for nerve impulses. Osmosis and oxygen diffusion are passive movement down gradients.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="800" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Respiration powers muscle and nerve activity</text><rect x="50" y="135" width="270" height="115" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="185.0" y="173" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Respiration</text><text x="185.0" y="211" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Releases energy from</text><text x="185.0" y="242" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >nutrient molecules</text><line x1="330" y1="192" x2="440" y2="192" stroke="#25614b" stroke-width="5"/><polygon points="440,192 426.6950761583107,198.92668763312224 426.6950761583107,185.07331236687776" fill="#25614b"/><rect x="450" y="135" width="210" height="115" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="555.0" y="173" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >ATP</text><text x="555.0" y="211" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Transfers energy</text><line x1="670" y1="192" x2="780" y2="192" stroke="#25614b" stroke-width="5"/><polygon points="780,192 766.6950761583107,198.92668763312224 766.6950761583107,185.07331236687776" fill="#25614b"/><rect x="790" y="135" width="260" height="115" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="920.0" y="173" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Cellular work</text><text x="920.0" y="211" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Processes 2 and 3</text><rect x="60" y="325" width="470" height="170" rx="12" fill="#e3efdc" stroke="#25614b" stroke-width="2"/><text x="295.0" y="363" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Energy required</text><text x="295.0" y="401" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >2  Muscles contract</text><text x="295.0" y="432" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >3  Impulses travel along neurones</text><rect x="570" y="325" width="470" height="170" rx="12" fill="#e4eff3" stroke="#357ca2" stroke-width="2"/><text x="805.0" y="363" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Passive movement</text><text x="805.0" y="401" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >1  Water enters cells by osmosis</text><text x="805.0" y="432" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >4  Oxygen diffuses into cells</text><text x="295" y="555" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >ATP powers muscle contraction and</text><text x="295" y="595" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >restores the ion gradients used</text><text x="295" y="635" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >in repeated nerve signalling.</text><text x="805" y="555" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Particles move down their gradients.</text><text x="805" y="595" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >These movements do not directly</text><text x="805" y="635" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >require energy from respiration.</text><rect x="24" y="724" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="758" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C: 2 and 3 only</text>
</g></svg>