<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Atrioventricular valves separate atria from ventricles</title><desc id="desc">Simplified four-chamber layout viewed from the front. The anatomical right side appears on the left. Blood passes from the right atrium through the tricuspid valve to the right ventricle, and from the left atrium through the mitral valve to the left ventricle.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2e7656"/></marker></defs><rect width="1000" height="620" rx="24" fill="#fbf9ec"/><g font-family="sans-serif" fill="#173e32"><text x="42" y="55" font-size="31" text-anchor="start" fill="#173e32">Atrioventricular valves separate atria from ventricles</text><text x="260" y="109" font-size="25" text-anchor="middle" fill="#173e32">Anatomical RIGHT</text><text x="740" y="109" font-size="25" text-anchor="middle" fill="#173e32">Anatomical LEFT</text><rect x="90" y="142" width="340" height="135" rx="18" fill="#dce9ed" stroke="#548269" stroke-width="2"/><rect x="90" y="370" width="340" height="153" rx="18" fill="#dce9ed" stroke="#548269" stroke-width="2"/><text x="260" y="195" font-size="26" text-anchor="middle" fill="#173e32">Right atrium</text><text x="260" y="461" font-size="26" text-anchor="middle" fill="#173e32">Right ventricle</text><path d="M260 220 L260 413" fill="none" stroke="#2e7656" stroke-width="5" marker-end="url(#arrow)"/><path d="M165 322L230 344L260 322L290 344L355 322" fill="none" stroke="#2e7656" stroke-width="8"/><rect x="570" y="142" width="340" height="135" rx="18" fill="#f0ded6" stroke="#548269" stroke-width="2"/><rect x="570" y="370" width="340" height="153" rx="18" fill="#f0ded6" stroke="#548269" stroke-width="2"/><text x="740" y="195" font-size="26" text-anchor="middle" fill="#173e32">Left atrium</text><text x="740" y="461" font-size="26" text-anchor="middle" fill="#173e32">Left ventricle</text><path d="M740 220 L740 413" fill="none" stroke="#2e7656" stroke-width="5" marker-end="url(#arrow)"/><path d="M645 322L710 344L740 322L770 344L835 322" fill="none" stroke="#2e7656" stroke-width="8"/><text x="260" y="305" font-size="24" text-anchor="middle" fill="#173e32">Tricuspid valve</text><text x="740" y="305" font-size="24" text-anchor="middle" fill="#173e32">Bicuspid / mitral valve</text><text x="500" y="563" font-size="24" text-anchor="middle" fill="#173e32">AV = atrioventricular: between an atrium and a ventricle.</text><text x="500" y="596" font-size="20" text-anchor="middle" fill="#173e32">One-way flow is shown; arterial semilunar valves are omitted from this model.</text></g></svg>