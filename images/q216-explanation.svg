stroke-width="2"/><text x="722.5" y="451" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Support pregnancy</text><text x="722.5" y="493" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Help maintain the uterine lining</text><text x="500" y="576" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >FSH and LH come from the pituitary gland.</text><text x="500" y="612" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >High progesterone and oestrogen inhibit their release.</text><rect x="24" y="644" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="678" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >D — progesterone and oestrogen</text>
