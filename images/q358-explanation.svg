<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" role="img" aria-labelledby="title desc"><title id="title">Read different chambers at the same time</title><desc id="desc">Bars summarise readings at the instant of maximum left-ventricular pressure in the original graph: left ventricle approximately 15 kPa and right ventricle 3 kPa. These are simultaneous readings, not separate peak pressures.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#276b46"/></marker></defs><rect width="1000" height="570" rx="20" fill="#fbfaf0"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="53" fill="#203e33" font-size="30" font-weight="bold" text-anchor="start">Read different chambers at the same time</text><text x="40" y="97" fill="#203e33" font-size="22" font-weight="normal" text-anchor="start">1  Find the time of the left-ventricular peak on the source graph.</text><text x="40" y="132" fill="#203e33" font-size="22" font-weight="normal" text-anchor="start">2  At that same time, read the right-ventricular curve.</text><text x="90" y="175" fill="#203e33" font-size="21" font-weight="bold" text-anchor="start">Pressure at that one instant / kPa</text><rect x="260" y="215" width="110" height="210" rx="3" fill="#dcebd8" stroke="#276b46" stroke-width="2"/><text x="315" y="205" fill="#203e33" font-size="24" font-weight="bold" text-anchor="middle">15 kPa</text><text x="315" y="458" fill="#203e33" font-size="21" font-weight="normal" text-anchor="middle">Left ventricle</text><rect x="625" y="383" width="110" height="42" rx="3" fill="#276b46" stroke="#276b46" stroke-width="2"/><text x="680" y="373" fill="#203e33" font-size="24" font-weight="bold" text-anchor="middle">3 kPa</text><text x="680" y="458" fill="#203e33" font-size="21" font-weight="normal" text-anchor="middle">Right ventricle</text><path d="M100 425 L900 425" fill="none" stroke="#276b46" stroke-width="3"/><text x="40" y="506" fill="#203e33" font-size="24" font-weight="bold" text-anchor="start">Same time does not mean the same chamber pressure.</text><text x="40" y="548" fill="#65776d" font-size="16" font-weight="normal" text-anchor="start">Original teaching schematic • diagrams are not to scale</text></g></svg>