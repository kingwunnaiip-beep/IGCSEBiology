oke="#25614b" stroke-width="4"/><polygon points="795,460 781.6950761583107,466.92668763312224 781.6950761583107,453.07331236687776" fill="#25614b"/><text x="600" y="419" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >capillaries</text><text x="600" y="508" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >at body tissues</text><rect x="100" y="605" width="1000" height="120" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="600" y="650" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Valves ensure one-way blood flow: statement 2 ✓</text><text x="600" y="693" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Statement 3 reverses the direction of flow in veins.</text><rect x="24" y="774" width="1152" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="600.0" y="808" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B — statements 1, 2 and 4</text>
