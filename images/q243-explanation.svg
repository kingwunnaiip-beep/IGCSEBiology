y="439" width="890" height="72" rx="12" fill="white" stroke="#526c62" stroke-width="2"/><text x="86" y="485" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >fish eggs</text><text x="463" y="485" font-size="26" fill="#b94a43" font-weight="400" text-anchor="middle" >do not survive</text><text x="765" y="485" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >no offspring</text><rect x="70" y="567" width="860" height="127" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500" y="603" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Trout + perch survive as adults.</text><text x="500" y="639" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >The eggs do not survive.</text><text x="500" y="675" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Neither surviving population produces offspring.</text><rect x="24" y="734" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="768" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C — trout and perch survive, but produce no offspring</text>
