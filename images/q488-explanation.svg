<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Bile acts after food reaches the small intestine</title><desc id="desc">Before bile acts, fat can remain in a large globule in the oesophagus. Bile enters the duodenum and emulsifies fat. Smaller droplets may be found later in the ileum, providing more surface area for lipase.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#24543e"/></marker></defs><rect width="900" height="540" fill="#fbf8ed"/><g font-family="Arial, sans-serif"><text x="450" y="45" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#203e30">Bile acts after food reaches the small intestine</text><rect x="35" y="95" width="250" height="325" rx="14" fill="#e6efdc" stroke="#24543e" stroke-width="2"/><rect x="325" y="95" width="250" height="325" rx="14" fill="#e6efdc" stroke="#24543e" stroke-width="2"/><rect x="615" y="95" width="250" height="325" rx="14" fill="#e6efdc" stroke="#24543e" stroke-width="2"/><text x="160" y="137" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#203e30">Oesophagus</text><text x="450" y="137" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#203e30">Duodenum</text><text x="740" y="137" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#203e30">Ileum</text><circle cx="160" cy="245" r="52" fill="#b9d8ae" stroke="#24543e" stroke-width="2"/><text x="160" y="343" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#203e30">Large globule P</text><text x="450" y="203" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#203e30">Bile enters</text><line x1="450" y1="220" x2="450.0" y2="256.0" stroke="#24543e" stroke-width="3"/><polygon points="450,270 444.0,256.0 456.0,256.0" fill="#24543e"/><text x="450" y="310" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#203e30">Emulsification</text><line x1="290" y1="260" x2="301.0" y2="260.0" stroke="#24543e" stroke-width="3"/><polygon points="315,260 301.0,266.0 301.0,254.0" fill="#24543e"/><line x1="580" y1="260" x2="591.0" y2="260.0" stroke="#24543e" stroke-width="3"/><polygon points="605,260 591.0,266.0 591.0,254.0" fill="#24543e"/><circle cx="700" cy="220" r="15" fill="#b9d8ae" stroke="#24543e" stroke-width="2"/><circle cx="754" cy="210" r="15" fill="#b9d8ae" stroke="#24543e" stroke-width="2"/><circle cx="788" cy="248" r="15" fill="#b9d8ae" stroke="#24543e" stroke-width="2"/><circle cx="716" cy="276" r="15" fill="#b9d8ae" stroke="#24543e" stroke-width="2"/><circle cx="766" cy="282" r="15" fill="#b9d8ae" stroke="#24543e" stroke-width="2"/><text x="740" y="343" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#203e30">Small droplets Q</text><text x="450" y="466" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#203e30">More surface area exposes more fat to lipase.</text><text x="450" y="506" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#203e30">Emulsification changes droplet size, not fat molecule size.</text></g></svg>