<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">Plants and animals both release carbon dioxide</title><desc id="d">Both dark and light tubes contain a plant and a snail. Both organisms add carbon dioxide by respiration. In light, photosynthesis removes carbon dioxide; in darkness, it cannot. Dark tube A has the greatest accumulation.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#194f3b"/></marker></defs><rect width="1000" height="600" rx="22" fill="#fffdf2"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="31" text-anchor="start" fill="#213c30" font-weight="bold">Plants and animals both release carbon dioxide</text><rect x="40" y="105" width="430" height="74" rx="16" fill="#194f3b" stroke="#194f3b" stroke-width="2"/><text x="255.0" y="150.0" font-size="24" text-anchor="middle" fill="#ffffff" font-weight="normal">Dark: tube A</text><rect x="530" y="105" width="430" height="74" rx="16" fill="#194f3b" stroke="#194f3b" stroke-width="2"/><text x="745.0" y="150.0" font-size="24" text-anchor="middle" fill="#ffffff" font-weight="normal">Light: tube B</text><rect x="55" y="223" width="162" height="64" rx="16" fill="#d9ead7" stroke="#194f3b" stroke-width="2"/><text x="136.0" y="263.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">plant</text><rect x="276" y="223" width="162" height="64" rx="16" fill="#d9ead7" stroke="#194f3b" stroke-width="2"/><text x="357.0" y="263.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">snail</text><rect x="150" y="367" width="220" height="71" rx="16" fill="#ffffff" stroke="#194f3b" stroke-width="2"/><text x="260.0" y="410.5" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">carbon dioxide</text><path d="M137,295 L217,357" fill="none" stroke="#194f3b" stroke-width="4" marker-end="url(#arrow)"/><path d="M357,295 L292,357" fill="none" stroke="#194f3b" stroke-width="4" marker-end="url(#arrow)"/><text x="255" y="327" font-size="23" text-anchor="middle" fill="#213c30" font-weight="normal">respiration</text><rect x="545" y="223" width="162" height="64" rx="16" fill="#d9ead7" stroke="#194f3b" stroke-width="2"/><text x="626.0" y="263.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">plant</text><rect x="766" y="223" width="162" height="64" rx="16" fill="#d9ead7" stroke="#194f3b" stroke-width="2"/><text x="847.0" y="263.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">snail</text><rect x="640" y="367" width="220" height="71" rx="16" fill="#ffffff" stroke="#194f3b" stroke-width="2"/><text x="750.0" y="410.5" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">carbon dioxide</text><path d="M627,295 L707,357" fill="none" stroke="#194f3b" stroke-width="4" marker-end="url(#arrow)"/><path d="M847,295 L782,357" fill="none" stroke="#194f3b" stroke-width="4" marker-end="url(#arrow)"/><text x="745" y="327" font-size="23" text-anchor="middle" fill="#213c30" font-weight="normal">respiration</text><text x="255" y="478" font-size="26" text-anchor="middle" fill="#213c30" font-weight="bold">No photosynthesis:</text><text x="255" y="514" font-size="26" text-anchor="middle" fill="#213c30" font-weight="normal">CO₂ accumulates.</text><path d="M750,449 L750,484" fill="none" stroke="#194f3b" stroke-width="4" marker-end="url(#arrow)"/><rect x="596" y="494" width="307" height="48" rx="16" fill="#d9ead7" stroke="#194f3b" stroke-width="2"/><text x="749.5" y="526.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">used in photosynthesis</text><text x="40" y="566" font-size="21" text-anchor="start" fill="#213c30" font-weight="normal">Qualitative carbon dioxide balance; arrow widths do not represent measured rates.</text></g></svg>