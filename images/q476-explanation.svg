<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="q476-title q476-desc">
<title id="q476-title">Amylase, temperature and sugar production</title>
<desc id="q476-desc">Starch is broken into maltose by salivary amylase. The apparatus contains enzyme in A and D only. At 37 degrees Celsius, D gives more rapid sugar formation than A at 15 degrees. B and C lack enzyme.</desc>
