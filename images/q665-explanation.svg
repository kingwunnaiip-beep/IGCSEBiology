<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">How many listed margay processes are characteristics of all living organisms?</title><desc id="desc">Excretion and growth: Both are universal life characteristics; Respiration: Universal: releases energy in living cells; Digestion: Occurs in the margay; not universal</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">How many listed margay processes are characteristics of all living organisms?</text><text x="38" y="106" font-size="18" font-weight="400">Three listed processes qualify: excretion, growth and respiration.</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="50" y="190" font-size="23" font-weight="700">Excretion and growth</text><text x="50" y="276" font-size="21" font-weight="400">Both are universal life</text><text x="50" y="303" font-size="21" font-weight="400">characteristics</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="405" y="190" font-size="23" font-weight="700">Respiration</text><text x="405" y="276" font-size="21" font-weight="400">Universal: releases energy</text><text x="405" y="303" font-size="21" font-weight="400">in living cells</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="760" y="190" font-size="23" font-weight="700">Digestion</text><text x="760" y="276" font-size="21" font-weight="400">Occurs in the margay; not</text><text x="760" y="303" font-size="21" font-weight="400">universal</text><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>