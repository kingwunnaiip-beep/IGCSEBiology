<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1220" viewBox="0 0 960 1220" role="img" aria-labelledby="q77-title q77-desc">
<title id="q77-title">Two separate eye responses</title>
<desc id="q77-desc">Answer C. Moving from dark to bright light causes the iris radial muscles to relax and circular muscles to contract, constricting the pupil. Moving focus from a distant object to a near object causes ciliary muscles to contract, suspensory ligaments to slacken, and the lens to become thicker and more convex. The pupil drawings use equal iris diameters. The lens profiles are a separate sagittal schematic and show ligaments linking ciliary muscles to the lens.</desc>
