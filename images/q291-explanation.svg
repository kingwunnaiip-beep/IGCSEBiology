<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750" role="img" aria-labelledby="q291-title q291-desc">
<title id="q291-title">Long filaments expose the anthers to wind</title>
<desc id="q291-desc">A schematic wind-pollinated flower has small floral parts and long filaments supporting anthers outside the flower. Arrows show pollen being carried by moving air. A separate feathery stigma is labelled as the pollen-catching structure. The drawing is not to scale.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
