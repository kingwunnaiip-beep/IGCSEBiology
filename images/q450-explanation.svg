<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Identify ethanol: C₂H₅OH</title><desc id="desc">A word equation shows glucose converted to ethanol and carbon dioxide during anaerobic respiration in yeast. Ethanol is labelled as an alcohol with formula C2H5OH. A separate comparison identifies lactic acid as the product in anaerobic respiration in human muscles.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="40" y="54" font-size="31" fill="#173f32" text-anchor="start" font-weight="bold">Identify ethanol: C₂H₅OH</text><rect x="45" y="122" width="910" height="170" rx="18" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><text x="500" y="172" font-size="28" fill="#173f32" text-anchor="middle" font-weight="bold">Anaerobic respiration in yeast</text><text x="180" y="238" font-size="29" fill="#173f32" text-anchor="middle" font-weight="normal">glucose</text><path d="M277,229 L417,229" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="650" y="238" font-size="29" fill="#173f32" text-anchor="middle" font-weight="normal">ethanol + carbon dioxide</text><rect x="80" y="336" width="388" height="158" rx="18" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><rect x="532" y="336" width="388" height="158" rx="18" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><text x="274" y="382" font-size="27" fill="#173f32" text-anchor="middle" font-weight="bold">Ethanol is an alcohol</text><text x="274" y="444" font-size="43" fill="#173f32" text-anchor="middle" font-weight="normal">C₂H₅OH</text><text x="726" y="382" font-size="27" fill="#173f32" text-anchor="middle" font-weight="bold">Lactic acid is different</text><text x="726" y="426" font-size="23" fill="#173f32" text-anchor="middle" font-weight="normal">Produced in anaerobic</text><text x="726" y="461" font-size="23" fill="#173f32" text-anchor="middle" font-weight="normal">respiration in human muscles</text><text x="500" y="555" font-size="24" fill="#173f32" text-anchor="middle" font-weight="normal">Recognise the formula, then connect the product to the organism.</text></g></svg>