<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1210" viewBox="0 0 1000 1210" role="img" aria-labelledby="q166-title q166-desc">
<title id="q166-title">166 · Hydrophytes live with abundant water</title>
<desc id="q166-desc">Answer D: absence of a waxy cuticle is the hydrophytic feature among the listed choices, particularly for submerged leaves. A qualitative submerged-leaf illustration is compared with three dry-habitat adaptations: rolled leaves, leaves reduced to spines, and sunken stomata. These xerophytic features reduce water loss. Floating hydrophyte leaves can have a cuticle on the exposed upper surface, so the absence of a cuticle is not claimed for every aquatic leaf. No leaf thickness or water-loss measurement is shown.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1210" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >166 · Hydrophytes live with abundant water</text><text x="500" y="111" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Hydrophyte = plant adapted to an aquatic habitat</text><rect x="65" y="158" width="870" height="401" rx="12" fill="#edf5f8" stroke="none" stroke-width="2"/><path d="M 100 230 Q 150 212 200 230 T 300 230 T 400 230 T 500 230 T 600 230 T 700 230 T 800 230 T 900 230" fill="none" stroke="#357ca2" stroke-width="4"/><path d="M 500 498 Q 437 453 410 386 Q 389 324 455 314 Q 518 302 568 348 Q 586 394 548 431 Q 518 460 500 498 Z" fill="#b8d59b" stroke="#25614b" stroke-width="3"/><path d="M 500 507 Q 475 433 477 338" fill="none" stroke="#25614b" stroke-width="3"/><text x="746" y="362" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Submerged leaf</text><text x="746" y="398" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Thin or absent cuticle</text><text x="746" y="434" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >can allow surface exchange.</text><text x="500" y="533" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Water is readily available; limiting evaporation is less necessary.</text><text x="500" y="611" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >The other choices conserve water in dry habitats</text><rect x="55" y="653" width="280" height="156" rx="12" fill="#f5efdf" stroke="#daa958" stroke-width="2"/><text x="195.0" y="695" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >A · Rolled leaf</text><text x="195.0" y="737" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Shelters stomata</text><text x="195.0" y="773" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >in humid air</text><rect x="360" y="653" width="280" height="156" rx="12" fill="#f5efdf" stroke="#daa958" stroke-width="2"/><text x="500.0" y="695" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >B · Spines</text><text x="500.0" y="737" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Reduce exposed</text><text x="500.0" y="773" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >leaf surface area</text><rect x="665" y="653" width="280" height="156" rx="12" fill="#f5efdf" stroke="#daa958" stroke-width="2"/><text x="805.0" y="695" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >C · Sunken</text><text x="805.0" y="737" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Stomata in pits</text><text x="805.0" y="773" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >trap humid air</text><rect x="75" y="861" width="850" height="151" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="903" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Aquatic leaves vary</text><text x="500.0" y="945" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Floating leaves may have a cuticle on the upper surface.</text><text x="500.0" y="981" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The answer describes a possible hydrophytic adaptation.</text><text x="500" y="1099" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative habitat sketch; no measured anatomy is implied.</text><rect x="24" y="1134" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1168" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · No waxy cuticle on the leaves</text>
</g></svg>