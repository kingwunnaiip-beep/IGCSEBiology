ht="400" text-anchor="middle" >at the ventricular exits</text><rect x="590" y="520" width="420" height="120" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="800.0" y="558" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >In veins</text><text x="800.0" y="596" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Maintain flow towards the heart</text><text x="800.0" y="627" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >when blood pressure is low</text><rect x="24" y="684" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="718" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >D: heart and veins</text>
