<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1130" viewBox="0 0 1000 1130" role="img" aria-labelledby="q201-title q201-desc">
<title id="q201-title">201 · Feathers identify birds</title>
<desc id="q201-desc">Answer B: hard-shelled eggs and feathers. The left panel contains a qualitative feather sketch with a central shaft and barbs. Feathers are characteristic of birds. The right panel shows a qualitative bird egg outline and a shell cross-section memory aid. Birds lay hard-shelled eggs. Wings alone are not unique to birds because bats and many insects also have wings; hair is a mammal feature. Bird feet may have scales, but scales and soft-shelled eggs do not form the characteristic bird combination. The sketches are conceptual, not measured anatomy.</desc>
