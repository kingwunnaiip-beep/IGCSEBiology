" y1="564" x2="287" y2="551" stroke="#526c62" stroke-width="2"/><text x="300" y="551" font-size="26" fill="#173d31" font-weight="700" text-anchor="start" >Filament</text><text x="300" y="590" font-size="28" fill="#b94a43" font-weight="700" text-anchor="start" >NO</text><text x="263" y="707" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Anther makes pollen.</text><text x="263" y="746" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Filament supports the anther.</text><line x1="690" y1="356" x2="690" y2="544" stroke="#25614b" stroke-width="18"/><ellipse cx="690" cy="340" rx="59" ry="18" fill="#a8ca8e" stroke="#25614b" stroke-width="3"/><ellipse cx="690" cy="591" rx="68" ry="65" fill="#c7dfb1" stroke="#25614b" stroke-width="4"/><ellipse cx="690" cy="591" rx="22" ry="31" fill="#fffdf7" stroke="#25614b" stroke-width="2"/><circle cx="690" cy="600" r="8" fill="#daa958" stroke="#936f32" stroke-width="2"/><line x1="750" y1="340" x2="794" y2="321" stroke="#526c62" stroke-width="2"/><text x="808" y="317" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >Stigma</text><text x="808" y="356" font-size="28" fill="#b94a43" font-weight="700" text-anchor="start" >NO</text><line x1="759" y1="591" x2="794" y2="572" stroke="#526c62" stroke-width="2"/><text x="808" y="566" font-size="25" fill="#173d31" font-weight="700" text-anchor="start" >Ovary</text><line x1="712" y1="601" x2="794" y2="628" stroke="#526c62" stroke-width="2"/><text x="808" y="637" font-size="25" fill="#173d31" font-weight="700" text-anchor="start" >Ovule</text><text x="737" y="707" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Stigma receives pollen.</text><text x="737" y="746" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Egg gamete is inside an ovule.</text><rect x="48" y="847" width="904" height="215" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="208" y="913" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Anther</text><text x="208" y="993" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >yes</text><text x="500" y="913" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Filament</text><text x="500" y="993" font-size="28" fill="#b94a43" font-weight="700" text-anchor="middle" >no</text><text x="792" y="913" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Stigma</text><text x="792" y="993" font-size="28" fill="#b94a43" font-weight="700" text-anchor="middle" >no</text><text x="500" y="1135" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >The table lists only three structures.</text><text x="500" y="1178" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Female gametes are formed in ovules within the ovary.</text><text x="500" y="1242" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Simplified structures; not drawn to scale.</text><rect x="24" y="1264" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1298" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer B · Anther yes; filament no; stigma no</text>
