<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="q300-title q300-desc">
<title id="q300-title">Blood vessels are named by direction of flow</title>
<desc id="q300-desc">The muscular heart pumps blood away through arteries, then through capillaries, and veins return blood towards the heart. Valves prevent reverse flow. Thus statements 1, 2 and 4 are correct; statement 3 incorrectly says veins take blood away.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
