<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">A large peak before ovulation</title><desc id="desc">A schematic oestrogen curve has a large broad peak before day14 and a smaller peak after day14. Labels contrast this with the sharp LH surge around ovulation and the main progesterone rise after ovulation.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#32745a" stroke-width="1.5"/></marker></defs><rect width="1000" height="620" rx="22" fill="#faf8e9"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="54" font-size="30" text-anchor="start" fill="#183f35" font-weight="bold">A large peak before ovulation</text><path d="M100 405 L900 405" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><path d="M100 405 L100 135" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><path d="M100 350 C190 365 240 320 300 225 S395 160 445 250 S550 325 640 285 S720 300 790 335 L870 350" stroke="#32745a" stroke-width="5" fill="none" /><path d="M485 150 V405" stroke="#84a18a" stroke-width="2" fill="none" stroke-dasharray="8 8"/><text x="100" y="440" font-size="21" text-anchor="middle" fill="#183f35" font-weight="normal">0</text><text x="485" y="440" font-size="21" text-anchor="middle" fill="#183f35" font-weight="normal">14</text><text x="870" y="440" font-size="21" text-anchor="middle" fill="#183f35" font-weight="normal">28 days</text><rect x="170" y="85" width="260" height="79" rx="18" fill="#e4f0dc" stroke="#32745a" stroke-width="2"/><text x="300.0" y="121" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">Main oestrogen peak</text><path d="M330 164 L350 193" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><text x="580" y="205" font-size="23" text-anchor="start" fill="#183f35" font-weight="normal">Smaller later rise</text><path d="M710 215 L672 278" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><rect x="50" y="495" width="425" height="86" rx="18" fill="#e4f0dc" stroke="#32745a" stroke-width="2"/><text x="262.5" y="531" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">LH: sharp surge near day 14</text><rect x="510" y="495" width="440" height="86" rx="18" fill="#e4f0dc" stroke="#32745a" stroke-width="2"/><text x="730.0" y="531" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">Progesterone: main rise after 14</text></g></svg>