<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1240" viewBox="0 0 1000 1240" role="img" aria-labelledby="q96-title q96-desc">
<title id="q96-title">96 · Antibiotics act on bacteria, not viruses</title>
<desc id="q96-desc">Answer C. Antibiotics can treat susceptible bacterial infections by acting on bacterial structures or processes, such as cell-wall production or bacterial ribosomes. A bacterial cell is compared with a virus and an infected host cell. Viruses use host-cell machinery to make new virus particles and are not treated with antibiotics. The bacterial wall, ribosomes, viral genetic material and host-cell machinery are schematic. An antibiotic must be appropriate for the bacterium; resistance can prevent a response.</desc>
