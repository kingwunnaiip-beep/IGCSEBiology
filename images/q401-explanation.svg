<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="q401-title q401-desc"><title id="q401-title">Sweating and vasodilation promote heat loss</title><desc id="q401-desc">Two skin panels show sweat droplets evaporating with heat leaving and a widened blood supply near the skin surface. Both responses promote heat loss.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#245943"/></marker></defs><rect width="1000" height="600" rx="24" fill="#fbf9ee"/><g font-family="Arial, sans-serif"><text x="40" y="55" font-size="27" fill="#173e31" text-anchor="start" font-weight="bold">Sweating and vasodilation promote heat loss</text><rect x="35" y="110" width="450" height="380" rx="16" fill="#e5f0df" stroke="#245943" stroke-width="2"/><rect x="515" y="110" width="450" height="380" rx="16" fill="#e5f0df" stroke="#245943" stroke-width="2"/><text x="260" y="152" font-size="26" fill="#173e31" text-anchor="middle" font-weight="bold">Sweating increases</text><text x="740" y="152" font-size="26" fill="#173e31" text-anchor="middle" font-weight="bold">Vasodilation increases</text><rect x="65" y="295" width="390" height="80" rx="0" fill="#ecd0ab" stroke="#bf9369" stroke-width="2"/><rect x="545" y="295" width="390" height="80" rx="0" fill="#ecd0ab" stroke="#bf9369" stroke-width="2"/><path d="M160 234 Q138 268 160 275 Q182 268 160 234 Z" fill="#5c95ad"/><path d="M160 224 L160 185" fill="none" stroke="#c68f32" stroke-width="4" marker-end="url(#arrow)"/><path d="M260 234 Q238 268 260 275 Q282 268 260 234 Z" fill="#5c95ad"/><path d="M260 224 L260 185" fill="none" stroke="#c68f32" stroke-width="4" marker-end="url(#arrow)"/><path d="M360 234 Q338 268 360 275 Q382 268 360 234 Z" fill="#5c95ad"/><path d="M360 224 L360 185" fill="none" stroke="#c68f32" stroke-width="4" marker-end="url(#arrow)"/><path d="M580 342 H900" stroke="#a54f48" stroke-width="28" fill="none"/><path d="M645 290 L645 200" fill="none" stroke="#c68f32" stroke-width="4" marker-end="url(#arrow)"/><path d="M740 290 L740 200" fill="none" stroke="#c68f32" stroke-width="4" marker-end="url(#arrow)"/><path d="M835 290 L835 200" fill="none" stroke="#c68f32" stroke-width="4" marker-end="url(#arrow)"/><text x="260" y="420" font-size="22" fill="#173e31" text-anchor="middle" font-weight="normal">Evaporating sweat carries</text><text x="260" y="452" font-size="22" fill="#173e31" text-anchor="middle" font-weight="normal">thermal energy away.</text><text x="740" y="420" font-size="22" fill="#173e31" text-anchor="middle" font-weight="normal">More blood flows near the skin,</text><text x="740" y="452" font-size="22" fill="#173e31" text-anchor="middle" font-weight="normal">helping transfer heat out.</text><text x="500" y="546" font-size="24" fill="#173e31" text-anchor="middle" font-weight="normal">Coordinated responses help maintain body temperature.</text></g></svg>