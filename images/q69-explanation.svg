<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920" role="img" aria-labelledby="q69-title q69-desc">
<title id="q69-title">Orange eyes are recessive</title>
<desc id="q69-desc">Two Punnett squares explain the observations. Orange rr crossed with rr gives only rr, orange-eyed offspring. Red-eyed heterozygotes Rr crossed with Rr give RR, Rr, Rr and rr: genotype probabilities 25%, 50%, 25%; expected phenotypes 75% red and 25% orange per offspring. These probabilities do not guarantee a particular set of four offspring. The observations provide no comparison between sexes, so sex linkage cannot be concluded.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="920" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Orange eyes are recessive</text><text x="500" y="94" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >R = dominant red allele; r = recessive orange allele</text><rect x="30" y="120" width="445" height="510" rx="16" fill="#fffdf7" stroke="#25614b" stroke-width="2"/><rect x="525" y="120" width="445" height="510" rx="16" fill="#fffdf7" stroke="#25614b" stroke-width="2"/><text x="252" y="159" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Orange parents: rr × rr</text><text x="747" y="159" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Red parents: Rr × Rr</text><text x="252" y="197" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Gametes: r only</text><text x="747" y="197" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Gametes: R or r</text><rect x="87" y="220" width="110" height="110" rx="0" fill="#eff5e8" stroke="#25614b" stroke-width="1.5"/><rect x="197" y="220" width="110" height="110" rx="0" fill="#eff5e8" stroke="#25614b" stroke-width="1.5"/><text x="252.0" y="285.0" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >r</text><rect x="307" y="220" width="110" height="110" rx="0" fill="#eff5e8" stroke="#25614b" stroke-width="1.5"/><text x="362.0" y="285.0" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >r</text><rect x="87" y="330" width="110" height="110" rx="0" fill="#eff5e8" stroke="#25614b" stroke-width="1.5"/><text x="142.0" y="395.0" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >r</text><rect x="197" y="330" width="110" height="110" rx="0" fill="#fbe6cd" stroke="#25614b" stroke-width="1.5"/><text x="252.0" y="381.0" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >rr</text><text x="252.0" y="414.0" font-size="24" fill="#945b19" font-weight="400" text-anchor="middle" >orange</text><rect x="307" y="330" width="110" height="110" rx="0" fill="#fbe6cd" stroke="#25614b" stroke-width="1.5"/><text x="362.0" y="381.0" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >rr</text><text x="362.0" y="414.0" font-size="24" fill="#945b19" font-weight="400" text-anchor="middle" >orange</text><rect x="87" y="440" width="110" height="110" rx="0" fill="#eff5e8" stroke="#25614b" stroke-width="1.5"/><text x="142.0" y="505.0" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >r</text><rect x="197" y="440" width="110" height="110" rx="0" fill="#fbe6cd" stroke="#25614b" stroke-width="1.5"/><text x="252.0" y="491.0" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >rr</text><text x="252.0" y="524.0" font-size="24" fill="#945b19" font-weight="400" text-anchor="middle" >orange</text><rect x="307" y="440" width="110" height="110" rx="0" fill="#fbe6cd" stroke="#25614b" stroke-width="1.5"/><text x="362.0" y="491.0" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >rr</text><text x="362.0" y="524.0" font-size="24" fill="#945b19" font-weight="400" text-anchor="middle" >orange</text><rect x="582" y="220" width="110" height="110" rx="0" fill="#eff5e8" stroke="#25614b" stroke-width="1.5"/><rect x="692" y="220" width="110" height="110" rx="0" fill="#eff5e8" stroke="#25614b" stroke-width="1.5"/><text x="747.0" y="285.0" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >R</text><rect x="802" y="220" width="110" height="110" rx="0" fill="#eff5e8" stroke="#25614b" stroke-width="1.5"/><text x="857.0" y="285.0" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >r</text><rect x="582" y="330" width="110" height="110" rx="0" fill="#eff5e8" stroke="#25614b" stroke-width="1.5"/><text x="637.0" y="395.0" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >R</text><rect x="692" y="330" width="110" height="110" rx="0" fill="#f8e4df" stroke="#25614b" stroke-width="1.5"/><text x="747.0" y="381.0" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >RR</text><text x="747.0" y="414.0" font-size="24" fill="#b94a43" font-weight="400" text-anchor="middle" >red</text><rect x="802" y="330" width="110" height="110" rx="0" fill="#f8e4df" stroke="#25614b" stroke-width="1.5"/><text x="857.0" y="381.0" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Rr</text><text x="857.0" y="414.0" font-size="24" fill="#b94a43" font-weight="400" text-anchor="middle" >red</text><rect x="582" y="440" width="110" height="110" rx="0" fill="#eff5e8" stroke="#25614b" stroke-width="1.5"/><text x="637.0" y="505.0" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >r</text><rect x="692" y="440" width="110" height="110" rx="0" fill="#f8e4df" stroke="#25614b" stroke-width="1.5"/><text x="747.0" y="491.0" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Rr</text><text x="747.0" y="524.0" font-size="24" fill="#b94a43" font-weight="400" text-anchor="middle" >red</text><rect x="802" y="440" width="110" height="110" rx="0" fill="#fbe6cd" stroke="#25614b" stroke-width="1.5"/><text x="857.0" y="491.0" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >rr</text><text x="857.0" y="524.0" font-size="24" fill="#945b19" font-weight="400" text-anchor="middle" >orange</text><text x="252" y="597" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >100% rr → orange</text><text x="747" y="597" font-size="24" fill="#173d31" font-weight="700" text-anchor="middle" >RR, Rr → red; rr → orange</text><text x="500" y="674" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Rr × Rr: 25% RR · 50% Rr · 25% rr</text><text x="500" y="715" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Expected per offspring: 75% red and 25% orange.</text><text x="500" y="754" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Four offspring need not have exactly a 3 : 1 ratio.</text><text x="500" y="803" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Sex linkage is unsupported: no male–female comparison is given.</text><rect x="24" y="844" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="878" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B — The orange-eye allele is recessive</text>
</g></svg>