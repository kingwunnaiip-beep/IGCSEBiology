eight="700" text-anchor="middle" >Cᴿ</text><text x="300" y="784" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Cᵂ</text><text x="500" y="632" font-size="28" fill="#b94a43" font-weight="700" text-anchor="middle" >CᴿCᴿ</text><text x="500" y="675" font-size="26" fill="#b94a43" font-weight="400" text-anchor="middle" >red</text><text x="700" y="632" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >CᴿCᵂ</text><text x="700" y="675" font-size="26" fill="#25614b" font-weight="400" text-anchor="middle" >roan</text><text x="500" y="762" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >CᴿCᵂ</text><text x="500" y="805" font-size="26" fill="#25614b" font-weight="400" text-anchor="middle" >roan</text><text x="700" y="762" font-size="28" fill="#526c62" font-weight="700" text-anchor="middle" >CᵂCᵂ</text><text x="700" y="805" font-size="26" fill="#526c62" font-weight="400" text-anchor="middle" >white</text><rect x="48" y="905" width="904" height="175" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500" y="960" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Expected offspring: 1 red : 2 roan : 1 white</text><text x="500" y="1022" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >25% red  ·  50% roan  ·  25% white</text><rect x="48" y="1133" width="904" height="117" rx="12" fill="#f7ead9" stroke="none" stroke-width="2"/><text x="500" y="1179" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Both hair colours are expressed together in a roan animal.</text><text x="500" y="1219" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The ratio describes expected probabilities, not every family.</text><rect x="24" y="1314" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1348" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer B · The coat-colour alleles are codominant</text>
