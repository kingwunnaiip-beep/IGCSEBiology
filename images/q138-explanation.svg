<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1370" viewBox="0 0 1000 1370" role="img" aria-labelledby="q138-title q138-desc">
<title id="q138-title">138 · Calculate energy loss from the original amount</title>
<desc id="q138-desc">Answer D: approximately 98 percent energy loss from producers to secondary consumers. The source energy values are producers 88000, primary consumers 14000 and secondary consumers 2000 kilojoules per square metre per year. The loss across the two transfers is 88000 minus 2000, or 86000. Divide this by the original producer value and multiply by 100: 86000 divided by 88000 times 100 is approximately 97.727 percent, rounded to 98 percent. The 2000 transferred to secondary consumers is approximately 2.27 percent of the producer energy, which is not the requested loss. The primary-consumer value is not needed when calculating the overall loss between the stated endpoints. Energy not passed to the next trophic level includes energy released as heat through respiration and energy in material not eaten or not assimilated.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1370" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >138 · Calculate energy loss from the original amount</text><text x="500" y="111" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >Question asks for the overall percentage loss:</text><text x="500" y="152" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >producers → secondary consumers.</text><text x="500" y="211" font-size="26" fill="#526c62" font-weight="400" text-anchor="middle" >Source values in kJ m⁻² yr⁻¹</text><rect x="48" y="258" width="278" height="180" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="187" y="319" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Producers</text><text x="187" y="397" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >88 000</text><rect x="361" y="258" width="278" height="180" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500" y="302" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Primary</text><text x="500" y="336" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >consumers</text><text x="500" y="397" font-size="28" fill="#357ca2" font-weight="700" text-anchor="middle" >14 000</text><rect x="674" y="258" width="278" height="180" rx="12" fill="#edf5f8" stroke="#b94a43" stroke-width="2"/><text x="813" y="302" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Secondary</text><text x="813" y="336" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >consumers</text><text x="813" y="397" font-size="28" fill="#b94a43" font-weight="700" text-anchor="middle" >2000</text><line x1="332" y1="353" x2="353" y2="353" stroke="#25614b" stroke-width="3"/><polygon points="353,353 339.6950761583107,359.92668763312224 339.6950761583107,346.07331236687776" fill="#25614b"/><line x1="645" y1="353" x2="666" y2="353" stroke="#357ca2" stroke-width="3"/><polygon points="666,353 652.6950761583107,359.92668763312224 652.6950761583107,346.07331236687776" fill="#357ca2"/><rect x="48" y="506" width="904" height="152" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500" y="552" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >1 · Find the amount not passed to secondary consumers</text><text x="500" y="611" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >88 000 − 2000 = 86 000 kJ m⁻² yr⁻¹</text><rect x="48" y="708" width="904" height="164" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500" y="754" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >2 · Divide the loss by the original producer energy</text><text x="500" y="813" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >(86 000 ÷ 88 000) × 100 ≈ 97.727% → 98%</text><rect x="48" y="928" width="904" height="151" rx="12" fill="#f7ead9" stroke="none" stroke-width="2"/><text x="500" y="977" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >(2000 ÷ 88 000) × 100 ≈ 2.27% is transferred.</text><text x="500" y="1021" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >The question asks for the percentage lost: 100% − 2.27%.</text><text x="500" y="1143" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >The 14 000 value lies between the two stated endpoints.</text><text x="500" y="1183" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Use 88 000 as the original value for this overall calculation.</text><rect x="24" y="1294" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1328" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · Approximately 98% of the producer energy is lost</text>
</g></svg>