<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Species: variation and fertile offspring</title><desc id="desc">Individuals of one species can vary in appearance but can reproduce together to produce fertile offspring. The two-part name includes the genus. Statements 2, 3 and 4 are true.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#397857"/></marker></defs><rect width="900" height="520" rx="22" fill="#fbfaee"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="28" text-anchor="start" fill="#183e31" font-weight="bold">Species: variation and fertile offspring</text><rect x="55" y="90" width="350" height="315" rx="18" fill="#e5f0dd" stroke="#4c7957" stroke-width="2"/><rect x="475" y="90" width="370" height="315" rx="18" fill="#e5f0dd" stroke="#4c7957" stroke-width="2"/><text x="230" y="130" font-size="25" text-anchor="middle" fill="#183e31" font-weight="bold">Same species</text><text x="230" y="165" font-size="20" text-anchor="middle" fill="#183e31" font-weight="normal">Individuals can look different</text><circle cx="145" cy="240" r="35" fill="#82aa70" stroke="none" stroke-width="3"/><circle cx="135" cy="234" r="4" fill="#183e31" stroke="none" stroke-width="3"/><circle cx="155" cy="234" r="4" fill="#183e31" stroke="none" stroke-width="3"/><circle cx="240" cy="240" r="27" fill="#82aa70" stroke="none" stroke-width="3"/><circle cx="230" cy="234" r="4" fill="#183e31" stroke="none" stroke-width="3"/><circle cx="250" cy="234" r="4" fill="#183e31" stroke="none" stroke-width="3"/><circle cx="325" cy="240" r="41" fill="#82aa70" stroke="none" stroke-width="3"/><circle cx="315" cy="234" r="4" fill="#183e31" stroke="none" stroke-width="3"/><circle cx="335" cy="234" r="4" fill="#183e31" stroke="none" stroke-width="3"/><text x="230" y="328" font-size="22" text-anchor="middle" fill="#183e31" font-weight="normal">can reproduce together</text><text x="230" y="363" font-size="22" text-anchor="middle" fill="#183e31" font-weight="bold">→ fertile offspring</text><text x="660" y="130" font-size="23" text-anchor="middle" fill="#183e31" font-weight="bold">International binomial name</text><text x="660" y="206" font-size="28" text-anchor="middle" fill="#183e31" font-weight="normal">Prunella modularis</text><path d="M583 224 L583 265" fill="none" stroke="#397857" stroke-width="4"/><path d="M730 224 L730 265" fill="none" stroke="#397857" stroke-width="4"/><text x="583" y="296" font-size="22" text-anchor="middle" fill="#183e31" font-weight="normal">genus</text><text x="730" y="296" font-size="22" text-anchor="middle" fill="#183e31" font-weight="normal">species word</text><text x="660" y="360" font-size="21" text-anchor="middle" fill="#183e31" font-weight="normal">Same species → same genus</text><text x="450" y="465" font-size="25" text-anchor="middle" fill="#183e31" font-weight="bold">Correct statements: 2, 3 and 4</text></g></svg>