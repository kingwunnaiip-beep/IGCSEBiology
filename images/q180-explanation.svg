" fill="#f7dfad" stroke="#25614b" stroke-width="3"/><circle cx="814" cy="319" r="33" fill="#f7eccb" stroke="none" stroke-width="3"/><circle cx="655" cy="442" r="49" fill="#f7dfad" stroke="#25614b" stroke-width="3"/><circle cx="655" cy="442" r="33" fill="#f7eccb" stroke="none" stroke-width="3"/><circle cx="812" cy="451" r="49" fill="#f7dfad" stroke="#25614b" stroke-width="3"/><circle cx="812" cy="451" r="33" fill="#f7eccb" stroke="none" stroke-width="3"/><text x="271" y="582" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Pectin helps hold tissue together.</text><text x="728" y="582" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Tissue separates more easily.</text><line x1="500" y1="616" x2="500" y2="665" stroke="#357ca2" stroke-width="5"/><polygon points="500,665 493.07331236687776,651.6950761583107 506.92668763312224,651.6950761583107" fill="#357ca2"/><rect x="95" y="687" width="810" height="142" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="727" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >More juice can be extracted</text><text x="500.0" y="769" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Breakdown of pectin helps juice leave the fruit tissue.</text><text x="500" y="888" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Pectinase → pectin · Protease → protein</text><text x="500" y="924" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Amylase → starch</text><text x="500" y="960" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative cell model; no measured yield or cell counts.</text><rect x="24" y="1024" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1058" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer B · More juice can be extracted from the fruits</text>
