necap="round" stroke-linejoin="round" /><ellipse cx="205" cy="183" rx="34" ry="14" fill="#dcebdd" stroke="#397359" stroke-width="3" transform="rotate(25 205 183)"/><ellipse cx="246" cy="164" rx="28" ry="12" fill="#dcebdd" stroke="#397359" stroke-width="3" transform="rotate(-35 246 164)"/><ellipse cx="113" cy="279" rx="15" ry="8" fill="#f8faf6" stroke="#3d79a0" stroke-width="3" /><path d="M 78 309 H 209" stroke="#3d79a0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#q26-blue-arrow)"/><circle cx="122" cy="166" r="5" fill="#3d79a0" stroke="none" stroke-width="3"/><circle cx="135" cy="210" r="5" fill="#3d79a0" stroke="none" stroke-width="3"/><path d="M 185 179 L 153 157" stroke="#3d79a0" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#q26-blue-arrow)"/><text x="165" y="353" font-size="28" text-anchor="middle" fill="#223c35" font-weight="bold">30 mm in 1 h</text><text x="475" y="116" font-size="30" text-anchor="middle" fill="#223c35" font-weight="bold">Hot + humid</text><path d="M 360 279 H 540 V 217" stroke="#3d79a0" stroke-width="19" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 540 218 V 156" stroke="#397359" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="515" cy="183" rx="34" ry="14" fill="#dcebdd" stroke="#397359" stroke-width="3" transform="rotate(25 515 183)"/><ellipse cx="556" cy="164" rx="28" ry="12" fill="#dcebdd" stroke="#397359" stroke-width="3" transform="rotate(-35 556 164)"/><ellipse cx="423" cy="279" rx="15" ry="8" fill="#f8faf6" stroke="#3d79a0" stroke-width="3" /><path d="M 388 309 H 519" stroke="#3d79a0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#q26-blue-arrow)"/><circle cx="432" cy="166" r="5" fill="#3d79a0" stroke="none" stroke-width="3"/><circle cx="445" cy="210" r="5" fill="#3d79a0" stroke="none" stroke-width="3"/><circle cx="590" cy="203"