<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Glycerol is a building block of oils</title><desc id="desc">A simplified molecular model shows the three-carbon glycerol backbone joined to three fatty-acid chains in an oil molecule.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="bluearrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="45" font-size="28" fill="#173f32" text-anchor="start" font-weight="bold">Glycerol is a building block of oils</text><text x="500" y="555" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">Oils are lipids made from glycerol and fatty acids. Glycerol is the correct basic</text><text x="500" y="583" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">unit.</text><text x="210" y="145" font-size="27" fill="#173f32" text-anchor="middle" font-weight="bold">Glycerol</text><ellipse cx="210" cy="235" rx="25" ry="25" fill="#e4f0df" stroke="#24644b" stroke-width="3" /><text x="210" y="244" font-size="25" fill="#173f32" text-anchor="middle" font-weight="normal">C</text><path d="M235 235 L280 235" fill="none" stroke="#24644b" stroke-width="3" /><text x="298" y="243" font-size="23" fill="#173f32" text-anchor="start" font-weight="normal">OH</text><ellipse cx="210" cy="315" rx="25" ry="25" fill="#e4f0df" stroke="#24644b" stroke-width="3" /><text x="210" y="324" font-size="25" fill="#173f32" text-anchor="middle" font-weight="normal">C</text><path d="M235 315 L280 315" fill="none" stroke="#24644b" stroke-width="3" /><text x="298"