<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f4f6ef">
	<title>Characteristics of living organisms | Biology quiz</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #193b34;
			--muted: #61766c;
			--green: #1e654f;
			--green-dark: #174a3b;
			--paper: #f4f6ef;
			--line: #dce4d8;
			--white: #fffefa;
			--red-pale: #fff0ed;
			--green-pale: #eaf4e8;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			color: var(--ink);
			background:
				radial-gradient(ellipse at 93% 8%, rgba(216, 233, 120, .28), transparent 26rem),
				linear-gradient(135deg, #f4f6ef 0%, #edf2e8 100%);
			font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
		}

		.page {
			width: min(100% - 40px, 1320px);
			margin: 0 auto;
			padding: 30px 0 48px;
		}

		.topbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 20px;
			padding-bottom: 22px;
			border-bottom: 1px solid rgba(25, 59, 52, .15);
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 11px;
			font-size: 14px;
			font-weight: 750;
		}

		.brand-mark {
			display: grid;
			width: 34px;
			height: 34px;
			place-items: center;
			border-radius: 10px;
			color: var(--white);
			background: var(--green);
		}

		.brand-mark svg { width: 20px; height: 20px; }

		.topic {
			color: var(--muted);
			font-size: 12px;
			font-weight: 700;
			letter-spacing: .08em;
			text-transform: uppercase;
		}

		main {
			padding: clamp(36px, 7vh, 68px) 0 0;
		}

		.quiz-layout {
			display: grid;
			grid-template-columns: 136px minmax(0, 1fr);
			gap: clamp(18px, 2.5vw, 32px);
			align-items: start;
		}

		.question-navigator {
			position: sticky;
			top: 24px;
			padding-right: 10px;
			border-right: 1px solid var(--line);
		}

		.question-nav-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

		.question-nav-item {
			display: grid;
			width: 100%;
			min-height: 54px;
			place-items: center;
			padding: 7px;
			border: 1px solid transparent;
			border-radius: 6px;
			color: var(--ink);
			background: transparent;
			text-align: center;
			font-size: 13px;
		}

		.question-nav-item:not(:disabled):hover { border-color: var(--line); color: var(--ink); background: rgba(255, 254, 250, .7); transform: none; }
		.question-nav-item[aria-current="step"] { border-color: #bdd0be; background: #eaf2e7; }
		.question-nav-item.is-correct { border-color: #c6dfc9; background: #eaf4e8; }
		.question-nav-item.is-wrong { border-color: #e8c4be; background: #fff0ed; }
		.question-nav-number { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 6px; color: var(--green-dark); background: #e9eee1; font-weight: 800; }
		.question-nav-item[aria-current="step"] .question-nav-number { color: white; background: var(--green); }
		.question-nav-item.is-correct .question-nav-number { color: white; background: #24563c; }
		.question-nav-item.is-wrong .question-nav-number { color: white; background: #a63d38; }
		.quiz-layout.navigator-hidden { grid-template-columns: minmax(0, 1fr); }
		.quiz-layout.navigator-hidden .question-navigator { display: none; }

		.quiz {
			width: 100%;
			font-size: calc(16px * var(--quiz-scale, 1));
		}

		.question-meta {
			display: flex;
			align-items: center;
			flex-wrap: wrap;
			gap: 16px;
			margin-bottom: 14px;
			color: var(--muted);
			font-size: .8125em;
			font-weight: 700;
		}

		.panel-toggle {
			min-height: 34px;
			margin-left: auto;
			padding: 0 10px;
			border: 1px solid var(--line);
			color: var(--green-dark);
			background: var(--white);
			font-size: .9em;
			white-space: nowrap;
		}

		.panel-toggle:not(:disabled):hover { color: white; background: var(--green-dark); }

		.question-context:empty { display: none; }

		.comparison-table {
			width: 100%;
			margin: 0 0 24px;
			border-collapse: collapse;
			background: rgba(255, 254, 250, .72);
			font-size: .9em;
			text-align: center;
			table-layout: fixed;
		}

		.comparison-table caption {
			padding: 0 0 9px;
			color: var(--muted);
			text-align: left;
		}

		.comparison-table th,
		.comparison-table td {
			padding: 9px 7px;
			border: 1px solid var(--line);
			overflow-wrap: anywhere;
		}

		.comparison-table thead th { color: var(--ink); font-weight: 700; }
		.comparison-table th:first-child { width: 54px; }
		.comparison-table tbody th { color: var(--green-dark); }
		.comparison-table.leg-count-table th:first-child { width: 34%; }
		.comparison-table.statement-table th:first-child { width: 22%; }
		.comparison-table.light-intensity-table th:first-child { width: 50%; }
		.comparison-table.light-intensity-table th,
		.comparison-table.light-intensity-table td { overflow-wrap: break-word; }
		.key-table { text-align: left; }
		.key-table th:first-child { width: 54px; }
		.key-table td:last-child { text-align: right; white-space: nowrap; }
		.table-key { margin: -14px 0 22px; color: var(--muted); font-size: .85em; }
		.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
		.statement-list { display: grid; gap: 8px; margin: 0 0 20px; padding-left: 1.5em; }
		.explanation-photo { margin: 16px 0; }
		.explanation-photo img { display: block; width: min(100%, 700px); height: auto; border-radius: 6px; }
		.explanation-photo figcaption { margin-top: 6px; color: var(--muted); font-size: .8em; }
		.explanation-photo a { color: inherit; }
		.plant-diagram { max-width: 700px; margin: 0 auto 18px; }
		.plant-diagram svg { display: block; width: 100%; height: auto; }
		.plant-diagram figcaption { margin-top: 5px; color: var(--muted); font-size: .8em; }
		.translocation-flow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.2fr) auto minmax(0, 1fr); gap: 10px; align-items: center; margin: 18px 0; }
		.flow-step { display: grid; gap: 4px; min-width: 0; padding: 12px; border-top: 2px solid var(--green); background: rgba(255, 254, 250, .75); }
		.flow-step span { color: var(--muted); font-size: .8em; }
		.flow-arrow { color: var(--green); font-size: 1.5em; font-weight: 700; }
		.interactive-graph { margin: 16px 0 20px; padding: 14px; border: 1px solid var(--line); border-radius: 7px; background: rgba(255, 254, 250, .82); }
		.rate-chart { display: block; width: 100%; height: auto; }
		.rate-chart text { fill: var(--muted); font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif; font-size: 13px; }
		.rate-chart .axis-label { fill: var(--ink); font-size: 14px; font-weight: 700; }
		.rate-chart .gridline { stroke: #dce4d8; stroke-width: 1; }
		.rate-chart .axis { stroke: #61766c; stroke-width: 1.5; }
		.rate-chart .curve { fill: none; stroke: #1e654f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
		.rate-chart .data-point { fill: #fffefa; stroke: #1e654f; stroke-width: 3; }
		.rate-chart .plateau-zone { fill: #eaf4e8; }
		.rate-chart .plateau-label { fill: #24563c; font-weight: 700; }
		.rate-chart .active-line { stroke: #a63d38; stroke-width: 2; stroke-dasharray: 5 5; }
		.rate-chart .active-point { fill: #a63d38; stroke: white; stroke-width: 3; }
		.enzyme-chart { max-width: 680px; margin: 10px auto 20px; }
		.enzyme-chart svg { display: block; width: 100%; height: auto; }
		.enzyme-chart text { fill: var(--ink); font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif; font-size: 15px; }
		.enzyme-chart .axis { stroke: #193b34; stroke-width: 2; }
		.enzyme-chart .tick { stroke: #61766c; stroke-width: 1.5; }
		.enzyme-chart .curve { fill: none; stroke: #1e654f; stroke-width: 4; stroke-linecap: round; }
		.enzyme-chart .point-label { fill: #1e654f; font-weight: 800; }
		.graph-controls { display: grid; gap: 8px; margin-top: 8px; }
		.graph-controls label { color: var(--ink); font-size: .88em; font-weight: 700; }
		.graph-controls input { width: 100%; accent-color: var(--green); }
		.graph-output { display: block; min-height: 1.5em; color: var(--green-dark); font-size: .88em; font-weight: 750; }
		.species-photo-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 16px 0; }
		.species-photo { min-width: 0; margin: 0; }
		.species-photo img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; border-radius: 5px; background: var(--white); }
		.species-photo figcaption { margin-top: 5px; color: var(--muted); font-size: .72em; line-height: 1.4; }
		.species-photo a { color: inherit; }

		.text-size-controls {
			display: flex;
			align-items: center;
			justify-content: flex-end;
			gap: 8px;
			margin: 14px 0 0;
			color: var(--muted);
			font-size: 13px;
		}

		.text-size-controls button {
			min-width: 36px;
			min-height: 34px;
			padding: 0 9px;
			border: 1px solid var(--line);
			color: var(--green-dark);
			background: var(--white);
			font-size: 13px;
		}

		.text-size-controls button:not(:disabled):hover { color: white; background: var(--green-dark); }
		.text-size-controls output { min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }

		.progress-track {
			height: 4px;
			overflow: hidden;
			border-radius: 5px;
			background: #dfe7da;
		}

		.progress-value {
			width: 100%;
			height: 100%;
			border-radius: inherit;
			background: var(--green);
		}

		h2 {
			margin: 30px 0 25px;
			font-size: 1.65em;
			font-weight: 650;
			line-height: 1.4;
		}

		fieldset { margin: 0; padding: 0; border: 0; }
		.answer-options { display: grid; gap: 10px; }
		legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }

		.answer {
			position: relative;
			display: flex;
			align-items: center;
			gap: 15px;
			min-height: 62px;
			padding: 11px 16px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: rgba(255, 254, 250, .82);
			cursor: pointer;
			transition: border-color 150ms ease, background-color 150ms ease, transform 150ms ease;
		}

		.answer:hover { border-color: #8da99a; transform: translateY(-1px); }

		.answer:has(input:checked) {
			border-color: var(--green);
			background: #edf4e9;
			box-shadow: 0 0 0 1px var(--green);
		}

		.answer input {
			position: absolute;
			width: 1px;
			height: 1px;
			opacity: 0;
		}

		.answer:has(input:focus-visible) { outline: 3px solid #91a944; outline-offset: 3px; }

		.letter {
			display: grid;
			flex: 0 0 32px;
			width: 32px;
			height: 32px;
			place-items: center;
			border-radius: 7px;
			color: var(--green-dark);
			background: #e9eee1;
			font-size: .8125em;
			font-weight: 800;
		}

		.answer-text { font-size: .9375em; font-weight: 600; }

		.actions {
			display: flex;
			align-items: center;
			flex-wrap: wrap;
			gap: 16px;
			margin-top: 20px;
		}

		button {
			min-height: 46px;
			padding: 0 21px;
			border: 0;
			border-radius: 7px;
			color: white;
			background: var(--green);
			font: inherit;
			font-size: .875em;
			font-weight: 750;
			cursor: pointer;
			transition: background-color 150ms ease, transform 150ms ease;
		}

		button:not(:disabled):hover { background: var(--green-dark); transform: translateY(-1px); }
		button:focus-visible { outline: 3px solid #91a944; outline-offset: 3px; }
		button:disabled { color: #8c9a90; background: #e0e6dd; cursor: not-allowed; }

		.hint { color: var(--muted); font-size: .75em; }

		.feedback {
			display: none;
			margin-top: 18px;
			padding: 18px;
			border-radius: 7px;
			font-size: .875em;
			line-height: 1.55;
		}

		.feedback.visible { display: block; animation: appear 180ms ease-out; }
		.feedback.correct { color: #24563c; background: var(--green-pale); }
		.feedback.incorrect { color: #873a34; background: var(--red-pale); }
		.feedback-title { display: block; margin-bottom: 8px; font-size: 1.14em; }
		.feedback p { margin: 0 0 12px; }
		.feedback .definition { color: var(--ink); }
		.feedback h3 { margin: 17px 0 8px; color: var(--ink); font-size: .93em; }
		.option-explanations { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
		.option-explanations li { padding: 7px 0; border-top: 1px solid rgba(25, 59, 52, .12); color: var(--ink); }
		.option-explanations strong { display: inline; }
		.exam-tip { margin: 15px 0 0 !important; padding-top: 12px; border-top: 1px solid rgba(25, 59, 52, .18); color: var(--ink); }
		.relationship { margin-top: 8px !important; font-weight: 800; }

		@keyframes appear {
			from { opacity: 0; transform: translateY(5px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (max-width: 680px) {
			.page { width: min(100% - 32px, 520px); padding-top: 20px; }
			.topbar { padding-bottom: 17px; }
			.topic { max-width: 130px; text-align: right; line-height: 1.4; }
			main { padding-top: 36px; }
			.quiz-layout { grid-template-columns: 1fr; gap: 22px; }
			.species-photo-grid { grid-template-columns: 1fr; }
			.species-photo img { aspect-ratio: 16 / 9; }
			.question-navigator { position: static; padding: 0 0 14px; border-right: 0; border-bottom: 1px solid var(--line); }
			.question-nav-list { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
			.question-nav-item { min-height: 46px; padding: 4px 2px; }
			.question-nav-number { width: 24px; height: 24px; }
			.translocation-flow { grid-template-columns: 1fr; gap: 6px; }
			.flow-arrow { transform: rotate(90deg); justify-self: center; }
			h2 { margin-top: 24px; }
			.quiz h2 { font-size: 1.3125em; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
		}
	</style>
</head>
<body>
	<div class="page">
		<header class="topbar">
			<div class="brand">
				<span class="brand-mark" aria-hidden="true">
					<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M19.5 4.5C12.1 4.7 6 6.2 5 11.1c-.6 2.8 1.4 4.7 4 4.2 4.4-.9 7.4-5.8 10.5-10.8Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
						<path d="M4 20c2.5-5 5.7-7.6 10.3-9.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
					</svg>
				</span>
				<span>Fieldnotes Biology</span>
			</div>
			<span class="topic">IGCSE · Living organisms</span>
		</header>

		<main>
			<div class="quiz-layout" id="quiz-layout">
				<aside class="question-navigator" id="question-navigator" aria-label="Question navigator">
					<nav aria-label="Quiz questions">
						<div class="question-nav-list" id="question-nav-list"></div>
					</nav>
				</aside>

				<section class="quiz" aria-labelledby="question-title">
				<div class="question-meta">
					<span id="question-count">Question 1 of 9</span>
					<span>Choose one answer</span>
					<button class="panel-toggle" id="toggle-navigator" type="button" aria-controls="question-navigator" aria-expanded="true">Hide questions</button>
				</div>
				<div class="progress-track" id="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="1" aria-valuemax="9" aria-valuenow="1">
					<div class="progress-value" id="progress-value" style="width: 11.11%"></div>
				</div>
				<div class="text-size-controls" role="group" aria-label="Quiz text size">
					<span>Text size</span>
					<button id="decrease-text" type="button" aria-label="Decrease quiz text size">A−</button>
					<output id="text-size-value" aria-live="polite">100%</output>
					<button id="increase-text" type="button" aria-label="Increase quiz text size">A+</button>
					<button id="reset-text" type="button">Reset</button>
				</div>

				<h2 id="question-title" tabindex="-1"></h2>
				<div id="question-context" class="question-context"></div>

				<form id="quiz-form">
					<fieldset>
						<legend id="question-legend"></legend>
						<div id="answer-options" class="answer-options"></div>
					</fieldset>

					<div class="actions">
						<button id="check-button" type="submit" disabled>Check answer</button>
						<span class="hint" id="selection-hint">Select an option to continue</span>
						<button id="next-question-button" type="button" hidden>Next question</button>
					</div>
					<div class="feedback" id="feedback" role="status" aria-live="polite"></div>
				</form>
				</section>
			</div>
		</main>
	</div>

	<script>
		const form = document.querySelector("#quiz-form");
		const checkButton = document.querySelector("#check-button");
		const selectionHint = document.querySelector("#selection-hint");
		const feedback = document.querySelector("#feedback");
		const quiz = document.querySelector(".quiz");
		const questionCount = document.querySelector("#question-count");
		const quizLayout = document.querySelector("#quiz-layout");
		const questionNavList = document.querySelector("#question-nav-list");
		const navigatorToggle = document.querySelector("#toggle-navigator");
		const progressTrack = document.querySelector("#progress-track");
		const progressValue = document.querySelector("#progress-value");
		const questionTitle = document.querySelector("#question-title");
		const questionContext = document.querySelector("#question-context");
		const questionLegend = document.querySelector("#question-legend");
		const answerOptions = document.querySelector("#answer-options");
		const nextQuestionButton = document.querySelector("#next-question-button");
		const graphMeasurements = [
			{ intensity: 1, oxygen: 2.5, x: 135, y: 234 },
			{ intensity: 4, oxygen: 7, x: 277, y: 126 },
			{ intensity: 8, oxygen: 9, x: 466, y: 78 },
			{ intensity: 11, oxygen: 9, x: 608, y: 78 }
		];
		const decreaseTextButton = document.querySelector("#decrease-text");
		const increaseTextButton = document.querySelector("#increase-text");
		const resetTextButton = document.querySelector("#reset-text");
		const textSizeValue = document.querySelector("#text-size-value");
		const defaultTextScale = 1;
		let textScale = defaultTextScale;
		let currentQuestionIndex = 0;

		const questions = [
			{
				title: "Earthworms come to the soil surface after heavy rain. Which characteristic of living organisms does this show?",
				legend: "Choose the characteristic shown by the earthworms",
				options: ["Reproduction", "Sensitivity", "Nutrition", "Growth"],
				correct: "B",
				answer: "B. Sensitivity",
				explanation: `
					<p class="definition">Sensitivity is the ability of an organism to detect a stimulus (a change in its internal or external environment) and make an appropriate response.</p>
					<p><strong>In this example:</strong></p>
					<ul class="option-explanations">
						<li><strong>Stimulus:</strong> Heavy rainfall can waterlog the soil and reduce the oxygen available to earthworms.</li>
						<li><strong>Response:</strong> The earthworms move towards the soil surface.</li>
					</ul>
					<figure class="explanation-photo">
						<img src="earthworm.jpg" alt="An earthworm on damp soil" loading="lazy" decoding="async">
						<figcaption>Earthworm on damp soil. Photo by Jochem Kühnen via <a href="https://commons.wikimedia.org/wiki/File:Aporrectodea_rosea_(Gelderland,_Netherlands).jpg" target="_blank" rel="noreferrer">Wikimedia Commons</a>, licensed under CC BY 4.0.</figcaption>
					</figure>
					<p class="relationship">Stimulus &rarr; Detection &rarr; Response</p>
					<h3>Why the other options do not fit</h3>
					<ul class="option-explanations">
						<li><strong>A. Reproduction:</strong> Producing offspring of the same kind.</li>
						<li><strong>B. Sensitivity:</strong> Detecting and responding to a stimulus. <strong>That is what happens here.</strong></li>
						<li><strong>C. Nutrition:</strong> Taking in materials for energy, growth and development.</li>
						<li><strong>D. Growth:</strong> A permanent increase in size and dry mass.</li>
					</ul>
					<p class="exam-tip"><strong>IGCSE exam tip:</strong> When a question describes an organism responding to an environmental change, look for sensitivity rather than simply movement.</p>
				`
			},
			{
				title: "Which species can breed with <i>Prunella vulgaris</i> to produce fertile offspring?",
				legend: "Choose the option showing which species can breed with Prunella vulgaris to produce fertile offspring",
				context: `
					<table class="comparison-table">
						<caption>For each option, decide whether the named species can produce fertile offspring with <i>Prunella vulgaris</i>.</caption>
						<thead>
							<tr><th scope="col">Option</th><th scope="col"><i>Prunella modularis</i></th><th scope="col"><i>Vespula vulgaris</i></th></tr>

								<line x1="345" y1="300" x2="345" y2="312"/><line x1="505" y1="300" x2="505" y2="312"/>
							</g>
							<path class="curve" d="M105 282 C150 258 197 206 245 172 C281 133 304 66 345 66 C397 66 397 218 505 300"/>
							<g class="point-label" text-anchor="middle">
								<text x="105" y="338">P</text><text x="245" y="338">Q</text><text x="345" y="338">R</text><text x="505" y="338">S</text>
							</g>
							<g text-anchor="middle">
								<text x="375" y="372">Temperature</text>
							</g>
							<text x="35" y="175" transform="rotate(-90 35 175)" text-anchor="middle">Rate of reaction</text>
						</svg>
					</figure>
				`,
				options: [
					"The enzyme molecules are denatured at P.",
					"The greatest amount of kinetic energy is available at R.",
					"The greatest number of collisions between enzyme and substrate molecules occur at S.",
					"The optimum rate of reaction occurs at Q."
				],
				correct: "C",
				answer: "C. The greatest number of collisions occur at S",
				explanation: `
					<p class="definition">Temperature increases molecular kinetic energy, so molecules move faster and collide more frequently. At very high temperature, however, the enzyme is denatured and the reaction rate falls.</p>
					<table class="comparison-table">
						<caption>Interpreting each point on the graph</caption>
						<thead><tr><th scope="col">Point</th><th scope="col">Temperature</th><th scope="col">What happens</th></tr></thead>
						<tbody>
							<tr><th scope="row">P</th><td>Low</td><td>Low kinetic energy means fewer collisions and a low reaction rate; the enzyme is not denatured.</td></tr>
							<tr><th scope="row">Q</th><td>Increasing</td><td>Kinetic energy and successful collision frequency increase, so the rate rises.</td></tr>
							<tr><th scope="row">R</th><td>Optimum</td><td>The reaction rate and enzyme activity reach their maximum.</td></tr>
							<tr><th scope="row">S</th><td>Highest</td><td>Kinetic energy and collision frequency are greatest, but the enzyme is denatured, so collisions are not productive and the reaction stops.</td></tr>
						</tbody>
					</table>
					<h3>Why the other options are incorrect</h3>
					<ul class="option-explanations">
						<li><strong>A:</strong> Low temperature at P reduces activity but does not denature the enzyme.</li>
						<li><strong>B:</strong> Kinetic energy is greatest at S, the highest temperature.</li>
						<li><strong>C:</strong> Correct. Molecules move fastest and collide most frequently at S, even though denaturation prevents successful enzyme-substrate reactions.</li>
						<li><strong>D:</strong> The optimum rate occurs at R, where the curve reaches its peak.</li>
					</ul>
					<h3>IGCSE exam tip</h3>
					<p><strong>Collision frequency is not the same as successful collisions.</strong> Above the optimum, heat changes the enzyme’s active site. Substrates no longer fit effectively, so the rate falls rapidly even as molecular kinetic energy increases.</p>
					<p class="relationship">R = optimum activity · S = highest temperature and kinetic energy</p>
				`
			}
		];
		const questionStates = questions.map(() => ({ selected: null, checked: false }));

		function renderQuestionNavigator() {
			questionNavList.innerHTML = questions.map((question, index) => {
				const state = questionStates[index];
				const status = state.checked
					? state.selected === question.correct ? "Correct" : "Wrong"
					: state.selected ? "Selected" : "Not started";
				const resultClass = state.checked ? state.selected === question.correct ? " is-correct" : " is-wrong" : "";
				return `<button class="question-nav-item${resultClass}" type="button" data-question-index="${index}" aria-label="Question ${index + 1}: ${status}" title="Question ${index + 1}: ${status}"${index === currentQuestionIndex ? ' aria-current="step"' : ""}>
					<span class="question-nav-number" aria-hidden="true">${index + 1}</span>
				</button>`;
			}).join("");
		}

		function showQuestionFeedback(question, state) {
			const isCorrect = state.selected === question.correct;
			feedback.className = `feedback visible ${isCorrect ? "correct" : "incorrect"}`;
			feedback.innerHTML = `<strong class="feedback-title">${isCorrect ? `Correct: ${question.answer}` : `Not quite. The correct answer is ${question.answer}.`}</strong>${question.explanation}`;
		}

		function renderQuestion() {
			const question = questions[currentQuestionIndex];
			const state = questionStates[currentQuestionIndex];
			questionCount.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
			progressTrack.setAttribute("aria-valuemax", questions.length);
			progressTrack.setAttribute("aria-valuenow", currentQuestionIndex + 1);
			progressValue.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
			questionTitle.innerHTML = question.title;
			questionContext.innerHTML = question.context || "";
			questionLegend.textContent = question.legend;
			answerOptions.innerHTML = question.options.map((option, index) => {
				const letter = String.fromCharCode(65 + index);
				return `<label class="answer">
					<input type="radio" name="answer" value="${letter}"${state.selected === letter ? " checked" : ""}>
					<span class="letter" aria-hidden="true">${letter}</span>
					<span class="answer-text">${option}</span>
				</label>`;
			}).join("");
			checkButton.disabled = !state.selected || state.checked;
			selectionHint.textContent = state.checked ? "Answer checked" : state.selected ? "Ready to check" : "Select an option to continue";
			if (state.checked) {
				showQuestionFeedback(question, state);
			} else {
				feedback.className = "feedback";
				feedback.textContent = "";
			}
			nextQuestionButton.hidden = !state.checked;
			nextQuestionButton.textContent = currentQuestionIndex === questions.length - 1
				? (questionStates.every((item) => item.checked) ? "Restart quiz" : "Review unanswered")
				: "Next question";
			renderQuestionNavigator();
		}

		function updateTextSize() {
			quiz.style.setProperty("--quiz-scale", textScale);
			textSizeValue.value = `${Math.round(textScale * 100)}%`;
			decreaseTextButton.disabled = textScale <= 0.8;
			increaseTextButton.disabled = textScale >= 2;
		}

		decreaseTextButton.addEventListener("click", () => {
			textScale = Math.max(0.8, Math.round((textScale - 0.1) * 10) / 10);
			updateTextSize();
		});

		increaseTextButton.addEventListener("click", () => {
			textScale = Math.min(2, Math.round((textScale + 0.1) * 10) / 10);
			updateTextSize();
		});

		resetTextButton.addEventListener("click", () => {
			textScale = defaultTextScale;
			updateTextSize();
		});

		updateTextSize();
		renderQuestion();

		navigatorToggle.addEventListener("click", () => {
			const isExpanded = navigatorToggle.getAttribute("aria-expanded") === "true";
			quizLayout.classList.toggle("navigator-hidden", isExpanded);
			navigatorToggle.setAttribute("aria-expanded", String(!isExpanded));
			navigatorToggle.textContent = isExpanded ? "Show questions" : "Hide questions";
		});

		questionNavList.addEventListener("click", (event) => {
			const button = event.target.closest("[data-question-index]");
			if (!button) return;
			currentQuestionIndex = Number(button.dataset.questionIndex);
			renderQuestion();
			questionTitle.focus();
		});

		form.addEventListener("change", (event) => {
			if (!event.target.matches('input[name="answer"]')) return;
			questionStates[currentQuestionIndex].selected = new FormData(form).get("answer");
			questionStates[currentQuestionIndex].checked = false;
			checkButton.disabled = false;
			selectionHint.textContent = "Ready to check";
			feedback.className = "feedback";
			feedback.textContent = "";
			nextQuestionButton.hidden = true;
			renderQuestionNavigator();
		});

		form.addEventListener("submit", (event) => {
			event.preventDefault();
			const selected = new FormData(form).get("answer");
			if (!selected) return;

			const question = questions[currentQuestionIndex];
			const state = questionStates[currentQuestionIndex];
			state.selected = selected;
			state.checked = true;
			showQuestionFeedback(question, state);
			selectionHint.textContent = questionStates.every((item) => item.checked) ? "Quiz complete" : "Answer checked";
			checkButton.disabled = true;
			nextQuestionButton.hidden = false;
			nextQuestionButton.textContent = currentQuestionIndex === questions.length - 1
				? (questionStates.every((item) => item.checked) ? "Restart quiz" : "Review unanswered")
				: "Next question";
			renderQuestionNavigator();
		});

		feedback.addEventListener("input", (event) => {
			if (event.target.id !== "light-intensity-slider") return;
			const measurement = graphMeasurements[Number(event.target.value)];
			const activeLine = feedback.querySelector("#graph-active-line");
			const activePoint = feedback.querySelector("#graph-active-point");
			const graphOutput = feedback.querySelector("#graph-output");
			if (!activeLine || !activePoint || !graphOutput) return;

			activeLine.setAttribute("x1", measurement.x);
			activeLine.setAttribute("x2", measurement.x);
			activePoint.setAttribute("cx", measurement.x);
			activePoint.setAttribute("cy", measurement.y);
			graphOutput.textContent = `${measurement.intensity.toFixed(1)} units · ${measurement.oxygen.toFixed(1)} mm³/hour`;
			event.target.setAttribute("aria-valuetext", `${measurement.intensity.toFixed(1)} arbitrary units; oxygen production ${measurement.oxygen.toFixed(1)} cubic millimetres per hour`);
		});

		nextQuestionButton.addEventListener("click", () => {
			if (questionStates.every((state) => state.checked)) {
				questionStates.forEach((state) => {
					state.selected = null;
					state.checked = false;
				});
				currentQuestionIndex = 0;
			} else if (currentQuestionIndex === questions.length - 1) {
				currentQuestionIndex = questionStates.findIndex((state) => !state.checked);
			} else {
				currentQuestionIndex += 1;
			}
			renderQuestion();
			questionTitle.focus();
		});
	</script>
</body>
</html>
