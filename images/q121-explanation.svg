<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1270" viewBox="0 0 1000 1270" role="img" aria-labelledby="q121-title q121-desc">
<title id="q121-title">121 · Platelets help form blood clots</title>
<desc id="q121-desc">Answer D: only statement 3 is correct. Platelets help blood to clot. Soluble fibrinogen is converted into insoluble fibrin, which forms a mesh that traps blood cells. A clot seals a wound, reduces blood loss and helps prevent pathogen entry. Platelets trigger the clotting process; they are not the cells that make antibodies or engulf pathogens. Lymphocytes produce antibodies, whereas phagocytes engulf and digest pathogens. The mesh drawing is a qualitative schematic and does not show measured fibre spacing or blood cell numbers.</desc>
