<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">Colour changes; shared cell structures remain</title><desc id="d">Two schematic plant cells have cell walls, membranes and vacuoles. The green-area cell also contains chloroplasts; the white-area cell lacks them. Outer thick boundary is the wall and inner thin boundary the membrane.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#194f3b"/></marker></defs><rect width="1000" height="600" rx="22" fill="#fffdf2"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="31" text-anchor="start" fill="#213c30" font-weight="bold">Colour changes; shared cell structures remain</text><text x="245" y="112" font-size="27" text-anchor="middle" fill="#213c30" font-weight="bold">Green area</text><rect x="65" y="139" width="355" height="284" rx="16" fill="#ffffff" stroke="#194f3b" stroke-width="2"/><rect x="77" y="151" width="331" height="260" rx="12" fill="#d9ead7" stroke="#194f3b" stroke-width="2"/><rect x="137" y="195" width="206" height="163" rx="30" fill="#faf9ef" stroke="#194f3b" stroke-width="2"/><text x="241" y="278" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">vacuole</text><ellipse cx="105" cy="184" rx="20" ry="10" fill="#6a8c63" stroke="#194f3b"/><ellipse cx="218" cy="177" rx="20" ry="10" fill="#6a8c63" stroke="#194f3b"/><ellipse cx="345" cy="186" rx="20" ry="10" fill="#6a8c63" stroke="#194f3b"/><ellipse cx="370" cy="249" rx="20" ry="10" fill="#6a8c63" stroke="#194f3b"/><ellipse cx="108" cy="315" rx="20" ry="10" fill="#6a8c63" stroke="#194f3b"/><ellipse cx="189" cy="383" rx="20" ry="10" fill="#6a8c63" stroke="#194f3b"/><ellipse cx="350" cy="377" rx="20" ry="10" fill="#6a8c63" stroke="#194f3b"/><text x="720" y="112" font-size="27" text-anchor="middle" fill="#213c30" font-weight="bold">White area</text><rect x="540" y="139" width="355" height="284" rx="16" fill="#ffffff" stroke="#194f3b" stroke-width="2"/><rect x="552" y="151" width="331" height="260" rx="12" fill="#f1f0e5" stroke="#194f3b" stroke-width="2"/><rect x="612" y="195" width="206" height="163" rx="30" fill="#faf9ef" stroke="#194f3b" stroke-width="2"/><text x="716" y="278" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">vacuole</text><text x="242" y="463" font-size="25" text-anchor="middle" fill="#213c30" font-weight="normal">Chloroplasts contain</text><text x="242" y="496" font-size="25" text-anchor="middle" fill="#213c30" font-weight="normal">green chlorophyll.</text><text x="717" y="463" font-size="25" text-anchor="middle" fill="#213c30" font-weight="normal">No chloroplasts in this</text><text x="717" y="496" font-size="25" text-anchor="middle" fill="#213c30" font-weight="normal">examination model.</text><text x="40" y="566" font-size="21" text-anchor="start" fill="#213c30" font-weight="normal">Both cells retain a cell wall, membrane and vacuole. Simplified cell models.</text></g></svg>