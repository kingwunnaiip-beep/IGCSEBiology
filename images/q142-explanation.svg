<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="q142-title q142-desc">
<title id="q142-title">142 · Lignin strengthens xylem walls</title>
<desc id="q142-desc">Answer D. A qualitative xylem vessel schematic has a hollow lumen and thick lignified walls. A leader points directly to the wall rather than the lumen. An upward arrow represents water transport, without measured speed. Lignin helps walls resist collapse and supports the plant. Cells joined end to end, no contents and no cross-walls help form a continuous low-resistance pathway for water transport. Shape and wall thickness are illustrative, not measured.</desc>
