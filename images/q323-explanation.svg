<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750" role="img" aria-labelledby="q323-title q323-desc">
<title id="q323-title">Mitosis: repair and genetically identical cells</title>
<desc id="q323-desc">DNA is copied before division; mitosis distributes the copies into genetically identical daughter nuclei. It supports repair and asexual reproduction. Gamete formation is associated with meiosis, so source statements 1, 3 and 4 are correct and statement 2 is false.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="750" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Mitosis: repair and genetically identical cells</text><rect x="65" y="120" width="970" height="125" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="550.0" y="162" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >DNA is copied before division</text><text x="550.0" y="210" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Mitosis distributes copies into genetically identical daughter nuclei.</text><line x1="550" y1="260" x2="550" y2="305" stroke="#25614b" stroke-width="4"/><polygon points="550,305 543.0733123668778,291.6950761583107 556.9266876331222,291.6950761583107" fill="#25614b"/><rect x="40" y="325" width="320" height="165" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><rect x="390" y="325" width="320" height="165" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><rect x="740" y="325" width="320" height="165" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="200" y="367" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >1: tissue repair</text><text x="200" y="420" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Replaces damaged</text><text x="200" y="460" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >tissue</text><text x="550" y="367" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >3: identical cells</text><text x="550" y="420" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Same inherited</text><text x="550" y="460" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >DNA</text><text x="900" y="365" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >4: asexual</text><text x="900" y="403" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >reproduction</text><text x="900" y="453" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Retains the genotype.</text><rect x="65" y="525" width="970" height="110" rx="12" fill="#fbece7" stroke="#b94a43" stroke-width="2"/><text x="550" y="568" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >2: forming gametes describes meiosis</text><text x="550" y="610" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Gametes do not form by mitosis in this life-cycle context.</text><rect x="24" y="674" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="708" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B — statements 1, 3 and 4</text>
</g></svg>