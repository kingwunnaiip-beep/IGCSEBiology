<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which diagram shows the iodine-test result for the variegated leaf?</title><desc id="desc">Compare two regions of the same leaf after the starch test: the green outer region contains chlorophyll, makes starch and turns blue-black with iodine. The white central region does not form starch and stays brown. Diagram C matches these independent regional results.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e" /></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8" /><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Which diagram shows the iodine-test result for the variegated</text><text x="38" y="73" font-size="24" font-weight="700">leaf?</text><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text><rect x="40" y="135" width="480" height="200" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="280" y="182" font-size="25" font-weight="700" text-anchor="middle">Green outer region</text><text x="280" y="245" font-size="21" font-weight="400" text-anchor="middle">Chlorophyll → photosynthesis → starch</text><text x="280" y="282" font-size="21" font-weight="400" text-anchor="middle">Iodine turns blue-black</text><rect x="560" y="135" width="480" height="200" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="800" y="182" font-size="25" font-weight="700" text-anchor="middle">White central region</text><text x="800" y="245" font-size="21" font-weight="400" text-anchor="middle">No chlorophyll; no starch formed</text><text x="800" y="282" font-size="21" font-weight="400" text-anchor="middle">Iodine stays brown</text><text x="540" y="374" font-size="24" font-weight="700" text-anchor="middle">Match the original green/white pattern: diagram C.</text></g></svg>