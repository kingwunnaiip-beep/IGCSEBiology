<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Water loss reduces turgor</title><desc id="desc">A qualitative plant-cell model shows water leaving into lower-water-potential surroundings. Water symbols become fewer and the cell contents exert less pressure against the cell wall. Water symbols are qualitative, and membrane detachment is not shown.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="40" y="54" font-size="31" fill="#173f32" text-anchor="start" font-weight="bold">Water loss reduces turgor</text><rect x="45" y="107" width="430" height="320" rx="18" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><rect x="525" y="107" width="430" height="320" rx="18" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><text x="260" y="154" font-size="26" fill="#173f32" text-anchor="middle" font-weight="bold">Before net water loss</text><text x="740" y="154" font-size="26" fill="#173f32" text-anchor="middle" font-weight="bold">After net water loss</text><rect x="140" y="190" width="235" height="190" rx="12" fill="#edf4e5" stroke="#24644b" stroke-width="3"/><rect x="148" y="198" width="219" height="174" rx="12" fill="#a7d3ba" stroke="#24644b" stroke-width="3"/><rect x="620" y="190" width="235" height="190" rx="12" fill="#edf4e5" stroke="#24644b" stroke-width="3"/><rect x="628" y="198" width="219" height="174" rx="12" fill="#dce9dd" stroke="#24644b" stroke-width="3"/><circle cx="186" cy="235" r="10" fill="#91bbd1" stroke="#537c9a" stroke-width="2"/><circle cx="257" cy="235" r="10" fill="#91bbd1" stroke="#537c9a" stroke-width="2"/><circle cx="327" cy="235" r="10" fill="#91bbd1" stroke="#537c9a" stroke-width="2"/><circle cx="186" cy="320" r="10" fill="#91bbd1" stroke="#537c9a" stroke-width="2"/><circle cx="257" cy="320" r="10" fill="#91bbd1" stroke="#537c9a" stroke-width="2"/><circle cx="327" cy="320" r="10" fill="#91bbd1" stroke="#537c9a" stroke-width="2"/><circle cx="680" cy="245" r="10" fill="#91bbd1" stroke="#537c9a" stroke-width="2"/><circle cx="785" cy="245" r="10" fill="#91bbd1" stroke="#537c9a" stroke-width="2"/><circle cx="731" cy="325" r="10" fill="#91bbd1" stroke="#537c9a" stroke-width="2"/><path d="M342,262 L438,262" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="403" y="237" font-size="20" fill="#173f32" text-anchor="middle" font-weight="normal">water</text><text x="260" y="411" font-size="23" fill="#173f32" text-anchor="middle" font-weight="normal">Higher cell water potential</text><text x="740" y="411" font-size="23" fill="#173f32" text-anchor="middle" font-weight="normal">Less pressure on the wall</text><rect x="50" y="466" width="900" height="98" rx="18" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><text x="500" y="501" font-size="25" fill="#173f32" text-anchor="middle" font-weight="normal">Water moves towards the lower external water potential.</text><text x="500" y="536" font-size="25" fill="#173f32" text-anchor="middle" font-weight="normal">Loss of water reduces turgor → cells become flaccid.</text></g></svg>