<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img" aria-labelledby="q248-title q248-desc">
<title id="q248-title">Choroid pigment absorbs stray light</title>
<desc id="q248-desc">Qualitative inset of the eye wall, rather than a full anatomical section. A stray light ray from inside the eye reaches a dark choroid band, labelled C as in the source figure, and is absorbed. Absorption reduces internal reflection. No other source labels are reinterpreted.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="730" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Choroid pigment absorbs stray light</text><text x="500" y="102" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative wall-layer inset; not a full eye section</text><rect x="65" y="150" width="870" height="365" rx="12" fill="white" stroke="#c8d4cc" stroke-width="2"/><rect x="390" y="179" width="35" height="301" rx="0" fill="#edf3e7" stroke="#25614b" stroke-width="2"/><rect x="425" y="179" width="65" height="301" rx="0" fill="#293f34" stroke="#173d31" stroke-width="2"/><rect x="490" y="179" width="30" height="301" rx="0" fill="#f4eddc" stroke="#526c62" stroke-width="2"/><text x="105" y="237" font-size="26" fill="#173d31" font-weight="700" text-anchor="start" >Inside the eye</text><text x="105" y="286" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >stray light</text><line x1="105" y1="330" x2="436" y2="330" stroke="#daa958" stroke-width="6"/><polygon points="436,330 422.6950761583107,336.92668763312224 422.6950761583107,323.07331236687776" fill="#daa958"/><circle cx="447" cy="330" r="12" fill="#daa958" stroke="#daa958" stroke-width="3"/><line x1="463" y1="281" x2="572" y2="242" stroke="#173d31" stroke-width="2"/><text x="600" y="234" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >C: choroid</text><text x="600" y="284" font-size="27" fill="#173d31" font-weight="400" text-anchor="start" >dark pigment</text><text x="600" y="323" font-size="27" fill="#173d31" font-weight="400" text-anchor="start" >absorbs light</text><text x="500" y="563" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Absorbed light cannot bounce back across the eye.</text><text x="500" y="602" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Reduced internal reflection helps keep the image clear.</text><rect x="24" y="654" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="688" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C — choroid: pigment absorbs stray light</text>
</g></svg>