<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="q83-title q83-desc">
<title id="q83-title">83 · The ink drop moves towards the leaf</title>
<desc id="q83-desc">A sealed chamber on the left contains a leaf in darkness and a carbon dioxide absorber. A capillary extends to the right, with an ink drop. An arrow points left from the drop towards the leaf. Respiration consumes oxygen and the absorber removes carbon dioxide, reducing the amount of gas and the pressure in the chamber at constant temperature. Outside atmospheric pressure pushes the ink drop towards the leaf. The apparatus must be airtight.</desc>
