<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="q252-title q252-desc">
<title id="q252-title">Follow the water from the factory outlet</title>
<desc id="q252-desc">Teaching schematic based on the original river survey. Water flows from mayfly and stonefly nymphs upstream, past a factory outlet, to rat-tailed maggot, sludge worm and blood worm immediately downstream. Farther downstream are blood worm, leech, water louse and snail, then shrimp and caddis fly larva, then mayfly and stonefly nymphs again. Of the answer choices, blood worm lives in the most polluted section.</desc>
