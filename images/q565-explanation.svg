<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which organelles are present in large numbers in cells that produce insulin?</title><desc id="desc">Insulin is a protein. Insulin-producing cells have many ribosomes for protein synthesis and many mitochondria to support their energy requirements; these are complementary cell features.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e" /></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8" /><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Which organelles are present in large numbers in cells that</text><text x="38" y="73" font-size="24" font-weight="700">produce insulin?</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="50" y="207" font-size="23" font-weight="700">Insulin is a protein</text><text x="50" y="285" font-size="21" font-weight="400">Amino acids assembled</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="405" y="207" font-size="23" font-weight="700">Many ribosomes</text><text x="405" y="285" font-size="21" font-weight="400">Protein synthesis</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="760" y="207" font-size="23" font-weight="700">Many mitochondria</text><text x="760" y="285" font-size="21" font-weight="400">Energy for cell processes</text><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>
