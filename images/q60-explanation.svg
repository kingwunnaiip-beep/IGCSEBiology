<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820" role="img" aria-labelledby="q60-title q60-desc">
<title id="q60-title">X-linked recessive inheritance</title>
<desc id="q60-desc">An unaffected father X superscript N Y is crossed with a carrier mother X superscript N X superscript n. The father supplies X superscript N or Y sperm and the mother supplies X superscript N or X superscript n eggs. The two-by-two Punnett square gives an unaffected daughter, an unaffected son, a carrier unaffected daughter, and an affected son, each with probability 25 percent. Therefore 25 percent of all offspring are affected, while 50 percent of sons are affected. Answer C.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="900" height="820" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="450.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >X-linked recessive inheritance</text><text x="450" y="105" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Father: XᴺY   ×   Mother: XᴺXⁿ</text><text x="450" y="147" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >N = normal allele · n = recessive condition allele</text><text x="450" y="204" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Father’s sperm: Xᴺ or Y</text><rect x="60" y="230" width="150" height="65" rx="0" fill="#e8f2f7" stroke="#357ca2" stroke-width="2"/><rect x="210" y="230" width="315" height="65" rx="0" fill="#e8f2f7" stroke="#357ca2" stroke-width="2"/><rect x="525" y="230" width="315" height="65" rx="0" fill="#e8f2f7" stroke="#357ca2" stroke-width="2"/><rect x="60" y="295" width="150" height="170" rx="0" fill="#e8f2f7" stroke="#357ca2" stroke-width="2"/><rect x="60" y="465" width="150" height="170" rx="0" fill="#e8f2f7" stroke="#357ca2" stroke-width="2"/><rect x="210.0" y="295" width="315" height="170" rx="0" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="367.5" y="339" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >XᴺXᴺ</text><text x="367.5" y="383" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Unaffected daughter</text><text x="367.5" y="423" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >25%</text><rect x="525.0" y="295" width="315" height="170" rx="0" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="682.5" y="339" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >XᴺY</text><text x="682.5" y="383" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Unaffected son</text><text x="682.5" y="423" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >25%</text><rect x="210.0" y="465" width="315" height="170" rx="0" fill="#e8f2f7" stroke="#357ca2" stroke-width="2"/><text x="367.5" y="509" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >XᴺXⁿ</text><text x="367.5" y="553" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Carrier daughter</text><text x="367.5" y="593" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Unaffected · 25%</text><rect x="525.0" y="465" width="315" height="170" rx="0" fill="#faeae4" stroke="#b94a43" stroke-width="2"/><text x="682.5" y="509" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >XⁿY</text><text x="682.5" y="553" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Affected son</text><text x="682.5" y="593" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >25%</text><text x="135" y="254" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Mother’s</text><text x="135" y="283" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >eggs ↓</text><text x="367.5" y="274" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Xᴺ</text><text x="682.5" y="274" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Y</text><text x="135" y="395" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Xᴺ</text><text x="135" y="565" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Xⁿ</text><text x="450" y="676" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Affected: 1 of 4 outcomes = 25% of all offspring.</text><text x="450" y="714" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Among sons only: 1 of 2 = 50% affected.</text><rect x="24" y="744" width="852" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="450.0" y="778" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C · 25% of all offspring are affected</text>
</g></svg>