p growth</text><text x="811" y="900" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >may decrease.</text><text x="500" y="1037" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Other impacts include habitat loss and reduced CO₂ uptake.</text><text x="500" y="1080" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >This drawing illustrates processes, not measured erosion rates.</text><rect x="24" y="1194" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1228" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · Soil loss leaves less fertile soil for crops</text>
