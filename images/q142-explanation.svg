echanical strength.</text><rect x="75" y="778" width="850" height="125" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="818" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Transport → a hollow, continuous pathway</text><text x="500.0" y="861" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >End-to-end cells · No contents · No cross-walls</text><rect x="24" y="924" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="958" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · Lignin present</text>
