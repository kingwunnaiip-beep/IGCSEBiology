<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" role="img" aria-labelledby="q8-title q8-desc">
<title id="q8-title">Photosynthesis rate reaches a plateau at light intensity 8</title><desc id="q8-desc">A graph plots light intensities 1, 4, 8 and 11 against oxygen production 2.5, 7, 9 and 9 cubic millimetres per hour. The plateau begins at 8, so another factor limits photosynthesis.</desc>
<defs><marker id="q8-25614b" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L16 8 L0 16 Z" fill="#25614b"/></marker><marker id="q8-357ca2" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L16 8 L0 16 Z" fill="#357ca2"/></marker><marker id="q8-b94a43" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L16 8 L0 16 Z" fill="#b94a43"/></marker><marker id="q8-daa958" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L16 8 L0 16 Z" fill="#daa958"/></marker></defs><rect width="640" height="450" rx="20" fill="#fffdf7"/>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="320" y="40" font-size="30" fill="#173d31" text-anchor="middle" font-weight="600">The plateau starts at 8 units</text><text x="38" y="82" font-size="28" fill="#173d31" text-anchor="start" font-weight="600">Oxygen (mm³/hour)</text><path d="M77 274 H590" stroke="#dce5d9" stroke-width="2"/><text x="63" y="283" font-size="28" fill="#173d31" text-anchor="end" font-weight="400">2.5</text><path d="M77 148 H590" stroke="#dce5d9" stroke-width="2"/><text x="63" y="157" font-size="28" fill="#173d31" text-anchor="end" font-weight="400">7.0</text><path d="M77 92 H590" stroke="#dce5d9" stroke-width="2"/><text x="63" y="101" font-size="28" fill="#173d31" text-anchor="end" font-weight="400">9.0</text><path d="M77 92 V344 H595" stroke="#173d31" stroke-width="3" fill="none"/><path d="M122 344 V352" stroke="#173d31" stroke-width="3"/><text x="122" y="383" font-size="28" fill="#173d31" text-anchor="middle" font-weight="400">1</text><path d="M257 344 V352" stroke="#173d31" stroke-width="3"/><text x="257" y="383" font-size="28" fill="#173d31" text-anchor="middle" font-weight="400">4</text><path d="M437 344 V352" stroke="#173d31" stroke-width="3"/><text x="437" y="383" font-size="28" fill="#173d31" text-anchor="middle" font-weight="400">8</text><path d="M572 344 V352" stroke="#173d31" stroke-width="3"/><text x="572" y="383" font-size="28" fill="#173d31" text-anchor="middle" font-weight="400">11</text><path d="M122 274 L257 148 L437 92 L572 92" fill="none" stroke="#25614b" stroke-width="6"/><path d="M437 105 V342" stroke="#b94a43" stroke-width="3" stroke-dasharray="8 8"/><circle cx="122" cy="274" r="8" fill="#fffdf7" stroke="#25614b" stroke-width="4"/><circle cx="257" cy="148" r="8" fill="#fffdf7" stroke="#25614b" stroke-width="4"/><circle cx="437" cy="92" r="8" fill="#fffdf7" stroke="#25614b" stroke-width="4"/><circle cx="572" cy="92" r="8" fill="#fffdf7" stroke="#25614b" stroke-width="4"/><text x="505" y="146" font-size="28" fill="#25614b" text-anchor="middle" font-weight="600">Plateau</text><text x="344" y="423" font-size="28" fill="#173d31" text-anchor="middle" font-weight="600">Light intensity (arbitrary units)</text></g></svg>