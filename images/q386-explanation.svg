<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="t386 d386"><title id="t386">Osmosis changes turgor</title><desc id="d386">A turgid cell in a dilute external solution loses water as the external solution becomes more concentrated, reaching a flaccid state with zero turgor pressure.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#286346"/></marker></defs><rect width="960" height="440" rx="24" fill="#f7f5e9"/><style>text{font-family:Arial,sans-serif;fill:#183b2b;font-size:22px}.title{font-size:29px;font-weight:700}.small{font-size:19px}.strong{font-weight:700}.box{fill:#e0eddc;stroke:#60876b;stroke-width:2}.arrow{fill:none;stroke:#286346;stroke-width:4;marker-end:url(#arrow)}</style><text class="title" x="38" y="50">Osmosis changes turgor</text><text class="strong" x="65" y="105">Dilute external solution</text><rect x="75" y="135" width="225" height="180" rx="14" fill="none" stroke="#286346" stroke-width="7"/><rect x="84" y="144" width="207" height="162" rx="11" fill="#aed4ad" stroke="#60876b" stroke-width="3"/><text x="124" y="224">TURGID</text><text class="small" x="65" y="357">Contents press on wall</text><text class="small" x="65" y="387">Positive turgor pressure</text><path class="arrow" d="M342 219 H567"/><text x="353" y="176">Water leaves</text><text class="small" x="342" y="267">by osmosis</text><text class="strong" x="618" y="105">More concentrated outside</text><rect x="659" y="135" width="225" height="180" rx="14" fill="none" stroke="#286346" stroke-width="7"/><rect x="668" y="144" width="207" height="162" rx="11" fill="#d8e3c7" stroke="#60876b" stroke-width="3"/><text x="706" y="224">FLACCID</text><text class="small" x="631" y="357">No outward turgor pressure</text><text class="small" x="631" y="387">X: pressure has reached zero</text></svg>