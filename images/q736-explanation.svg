<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which functions match the cell membrane and cell wall?</title><desc id="desc">Cell membrane: active transport through proteins using respiratory energy. Cellulose cell wall: structural support. These separate roles match row B.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700" text-anchor="start" fill="#193e34">Which functions match the cell membrane and cell wall?</text><text x="38" y="104" font-size="20" font-weight="400" text-anchor="start" fill="#193e34">Row B compares two different cell structures.</text><rect x="30" y="125" width="495" height="245" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><rect x="555" y="125" width="495" height="245" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="277" y="169" font-size="26" font-weight="700" text-anchor="middle" fill="#193e34">Cell membrane</text><text x="60" y="222" font-size="22" font-weight="400" text-anchor="start" fill="#193e34">Transport proteins move substances</text><text x="60" y="256" font-size="22" font-weight="400" text-anchor="start" fill="#193e34">against a concentration gradient.</text><text x="60" y="290" font-size="22" font-weight="400" text-anchor="start" fill="#193e34">Energy from respiration is required.</text><text x="277" y="343" font-size="25" font-weight="700" text-anchor="middle" fill="#193e34">Active transport</text><text x="802" y="169" font-size="26" font-weight="700" text-anchor="middle" fill="#193e34">Cellulose cell wall</text><text x="585" y="222" font-size="22" font-weight="400" text-anchor="start" fill="#193e34">Strong, rigid structure around the cell.</text><text x="585" y="256" font-size="22" font-weight="400" text-anchor="start" fill="#193e34">Helps maintain shape and</text><text x="585" y="290" font-size="22" font-weight="400" text-anchor="start" fill="#193e34">resists excessive expansion.</text><text x="802" y="343" font-size="25" font-weight="700" text-anchor="middle" fill="#193e34">Support</text><text x="38" y="406" font-size="17" font-weight="400" text-anchor="start" fill="#193e34">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>