<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080" role="img" aria-labelledby="q225-title q225-desc">
<title id="q225-title">225 · A drug changes chemical reactions</title>
<desc id="q225-desc">A drug is a substance taken into the body that modifies or affects chemical reactions in the body. A qualitative flow crosses a labelled body boundary from a substance outside to reactions inside. The definition does not require a beneficial effect. The other descriptions concern a hormone made inside the body, enzyme catalysis and homeostasis. No dose, timing or measured pharmacological effect is represented. Answer C.</desc>
