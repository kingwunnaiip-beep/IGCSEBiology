<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Heroin acts at synaptic receptors</title><desc id="desc">Neurotransmitter is released from a sending neurone into a synaptic gap. Heroin is shown targeting a receptor protein on the receiving membrane. This is a simplified syllabus model of its direct action, not a molecular structure.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#185c44"/></marker></defs><rect width="1000" height="640" rx="24" fill="#faf8ec"/><g font-family="Arial, sans-serif"><text x="40" y="54" font-size="31" text-anchor="start" fill="#193e33" font-weight="bold">Heroin acts at synaptic receptors</text><path d="M140 130 Q500 100 860 130 L860 260 Q500 340 140 260 Z" fill="#dfeddf" stroke="#185c44" stroke-width="4"/><text x="500" y="182" font-size="26" text-anchor="middle" fill="#193e33" font-weight="normal">Sending neurone releases neurotransmitter</text><circle cx="250" cy="250" r="10" fill="#72a96e"/><circle cx="285" cy="307" r="8" fill="#72a96e"/><circle cx="370" cy="250" r="10" fill="#72a96e"/><circle cx="405" cy="307" r="8" fill="#72a96e"/><circle cx="490" cy="250" r="10" fill="#72a96e"/><circle cx="525" cy="307" r="8" fill="#72a96e"/><text x="105" y="382" font-size="23" text-anchor="start" fill="#193e33" font-weight="normal">synaptic gap</text><rect x="100" y="470" width="800" height="80" rx="18" fill="#dcebd9" stroke="#185c44" stroke-width="3"/><text x="500" y="521" font-size="28" text-anchor="middle" fill="#193e33" font-weight="bold">Receiving neurone</text><path d="M323 447 L323 468 L357 468 L357 447 M340 469 L340 490" fill="none" stroke="#185c44" stroke-width="6"/><path d="M483 447 L483 468 L517 468 L517 447 M500 469 L500 490" fill="none" stroke="#185c44" stroke-width="6"/><path d="M643 447 L643 468 L677 468 L677 447 M660 469 L660 490" fill="none" stroke="#185c44" stroke-width="6"/><rect x="435" y="380" width="130" height="47" rx="14" fill="#efd6ad" stroke="#185c44" stroke-width="3"/><text x="500" y="413" font-size="23" text-anchor="middle" fill="#193e33" font-weight="normal">heroin</text><path d="M500 429 L500 448" stroke="#185c44" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="760" y="394" font-size="24" text-anchor="middle" fill="#193e33" font-weight="normal">receptor proteins</text><path d="M740 405 L664 446" stroke="#185c44" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="500" y="596" font-size="27" text-anchor="middle" fill="#193e33" font-weight="normal">Direct target: receptor proteins on the receiving membrane.</text></g></svg>