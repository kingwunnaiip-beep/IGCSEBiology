<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Removing trees changes both soil protection and water flow</title><desc id="desc">Forested and cleared hillsides receive rain. Roots hold soil in the forest and an upward arrow marks transpiration. The cleared slope has stumps and a larger muddy runoff arrow.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">Removing trees changes both soil protection and water flow</text><path d="M55 420 Q270 300 465 420 M535 420 Q750 300 945 420" fill="none" stroke="#c5824b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 445 Q270 325 465 445 M535 445 Q750 325 945 445" fill="none" stroke="#c5824b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(140 370) scale(0.65)"><path d="M-10 0 V-90 H10 V0" fill="#d7ad78" stroke="#c5824b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-35" cy="-110" r="42" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><circle cx="25" cy="-120" r="49" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><circle cx="-4" cy="-157" r="44" fill="#e4f0df" stroke="#24644b" stroke-width="3"/></g><path d="M140 370 l-35 50 M140 370 l40 35" fill="none" stroke="#c5824b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(250 370) scale(0.65)"><path d="M-10 0 V-90 H10 V0" fill="#d7ad78" stroke="#c5824b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-35" cy="-110" r="42" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><circle cx="25" cy="-120" r=