<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1240" viewBox="0 0 1000 1240" role="img" aria-labelledby="q167-title q167-desc">
<title id="q167-title">167 · Natural selection: preserve the stage numbers</title>
<desc id="q167-desc">Answer C: the original numbered statements must be ordered 4, 3, 1, 2. Existing genetic variation among individuals in a population is followed by a struggle for survival, greater survival and reproduction by better-adapted individuals, and transmission of their alleles to offspring. Over generations, those alleles can become more common. The original conceptual flow chart does not imply that organisms acquire useful alleles because they need them or that every adapted individual survives.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1240" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >167 · Natural selection: preserve the stage numbers</text><rect x="75" y="145" width="850" height="155" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="187" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >4 · Genetic variation exists</text><text x="500.0" y="229" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Individuals in the population have inherited differences.</text><line x1="500" y1="306" x2="500" y2="354" stroke="#357ca2" stroke-width="5"/><polygon points="500,354 493.07331236687776,340.6950761583107 506.92668763312224,340.6950761583107" fill="#357ca2"/><rect x="75" y="373" width="850" height="155" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="415" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >3 · Struggle for survival</text><text x="500.0" y="457" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Limited resources and other selection pressures act.</text><line x1="500" y1="534" x2="500" y2="582" stroke="#357ca2" stroke-width="5"/><polygon points="500,582 493.07331236687776,568.6950761583107 506.92668763312224,568.6950761583107" fill="#357ca2"/><rect x="75" y="601" width="850" height="155" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="643" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >1 · Better-adapted individuals reproduce</text><text x="500.0" y="685" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Their inherited characteristics improve their chances.</text><line x1="500" y1="762" x2="500" y2="810" stroke="#357ca2" stroke-width="5"/><polygon points="500,810 493.07331236687776,796.6950761583107 506.92668763312224,796.6950761583107" fill="#357ca2"/><rect x="75" y="829" width="850" height="155" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="871" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >2 · Alleles pass to offspring</text><text x="500.0" y="913" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Inheritance can change allele frequencies over generations.</text><text x="500" y="1101" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Selection acts on existing variation; need does not create an allele.</text><rect x="24" y="1164" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1198" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · 4 → 3 → 1 → 2</text>
</g></svg>