<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Leaves supply growing flowers and potato tubers</title><desc id="desc">A potato plant has photosynthesising leaves above soil, growing flowers and underground tubers; phloem arrows carry assimilates from leaves to both sinks.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="bluearrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="45" font-size="28" fill="#173f32" text-anchor="start" font-weight="bold">Leaves supply growing flowers and potato tubers</text><text x="500" y="555" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">During growth: leaves are the source; flowers and developing tubers are sinks.</text><path d="M500 465 L500 210" fill="none" stroke="#24644b" stroke-width="10" /><g transform="translate(500 285) rotate(-165) scale(1.5)"><path d="M0 0 Q45 -65 110 -15 Q55 35 0 0" fill="#e4f0df" stroke="#24644b" stroke-width="3" /><path d="M0 0 L105 -15 M30 -4 L45 -35 M55 -8 L73 -37 M33 -5 L55 17 M65 -9 L86 7" fill="none" stroke="#24644b" stroke-width="2" /></g><g transform="translate(500 340) rotate(-15) scale(1.5)"><path d="M0 0 Q45 -65 110 -15 Q55 35 0 0" fill="#e4f0df" stroke="#24644b" stroke-width="3" /><path d="M0 0 L105 -15 M30 -4 L45 -35 M55 -8 L73 -37 M33 -5 L55 17 M65 -9 L86 7" fill="none" stroke="#24644b" stroke-width="2" /></g><ellipse cx="500.0" cy="147.0" rx="18.2" ry="25.2" fill="#f2ddbc" stroke="#bc824b" stroke-width="2" transform="rotate(0 500.0 147.0)" /><ellipse cx="526.6295824562643" cy="166.34