<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="t d"><title id="t">Nitrate supports protein synthesis and plant growth</title><desc id="d">Nitrate ions supply nitrogen for amino acids and proteins. A taller plant with large leaves contrasts with a stunted plant with small leaves when nitrate is deficient. Qualitative illustration.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#286c50" stroke-width="1.5"/></marker></defs><rect width="960" height="560" rx="20" fill="#fbf9ed"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="28" text-anchor="start" fill="#173f32">Nitrate supports protein synthesis and plant growth</text><rect x="45" y="105" width="210" height="75" rx="14" fill="#e0ecda" stroke="#286c50" stroke-width="3"/><text x="150.0" y="150.5" font-size="23" text-anchor="middle" fill="#173f32">Nitrate ions</text><path d="M265 143 L335 143" stroke="#286c50" stroke-width="4" fill="none" marker-end="url(#arr)"/><rect x="345" y="105" width="250" height="75" rx="14" fill="#e0ecda" stroke="#286c50" stroke-width="3"/><text x="470.0" y="150.5" font-size="23" text-anchor="middle" fill="#173f32">Amino acids</text><path d="M605 143 L675 143" stroke="#286c50" stroke-width="4" fill="none" marker-end="url(#arr)"/><rect x="685" y="105" width="230" height="75" rx="14" fill="#e0ecda" stroke="#286c50" stroke-width="3"/><text x="800.0" y="150.5" font-size="23" text-anchor="middle" fill="#173f32">Proteins</text><path d="M270 450 L270 250" stroke="#286c50" stroke-width="8" fill="none"/><ellipse cx="220" cy="285" rx="45" ry="20" fill="#92ba76" transform="rotate(25 220 285)"/><ellipse cx="320" cy="330" rx="45" ry="20" fill="#92ba76" transform="rotate(-25 320 330)"/><path d="M270 450 L230 480" stroke="#286c50" stroke-width="3" fill="none"/><path d="M270 450 L310 480" stroke="#286c50" stroke-width="3" fill="none"/><path d="M690 450 L690 340" stroke="#286c50" stroke-width="8" fill="none"/><ellipse cx="640" cy="375" rx="26" ry="12" fill="#92ba76" transform="rotate(25 640 375)"/><ellipse cx="740" cy="420" rx="26" ry="12" fill="#92ba76" transform="rotate(-25 740 420)"/><path d="M690 450 L650 480" stroke="#286c50" stroke-width="3" fill="none"/><path d="M690 450 L730 480" stroke="#286c50" stroke-width="3" fill="none"/><text x="270" y="515" font-size="22" text-anchor="middle" fill="#173f32">Adequate nitrate: more growth</text><text x="690" y="515" font-size="22" text-anchor="middle" fill="#173f32">Nitrate shortage: stunted growth</text><text x="480" y="226" font-size="25" text-anchor="middle" fill="#173f32">Less nitrogen → less protein synthesis</text></g></svg>