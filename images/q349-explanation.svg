<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="q349-title q349-desc">
<title id="q349-title">Balance the atoms in aerobic respiration</title>
<desc id="q349-desc">Carbon requires six carbon dioxide molecules, hydrogen requires six water molecules, and oxygen then requires six oxygen molecules. Both sides contain 6 carbon, 12 hydrogen and 18 oxygen atoms.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="720" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Balance the atoms in aerobic respiration</text><text x="550" y="127" font-size="34" fill="#173d31" font-weight="700" text-anchor="middle" >C₆H₁₂O₆ + 6O₂ → 6H₂O + 6CO₂ + energy</text><line x1="70" y1="190" x2="1025" y2="190" stroke="#526c62" stroke-width="2"/><line x1="70" y1="265" x2="1025" y2="265" stroke="#526c62" stroke-width="2"/><line x1="70" y1="355" x2="1025" y2="355" stroke="#526c62" stroke-width="2"/><line x1="70" y1="445" x2="1025" y2="445" stroke="#526c62" stroke-width="2"/><line x1="70" y1="535" x2="1025" y2="535" stroke="#526c62" stroke-width="2"/><line x1="70" y1="190" x2="70" y2="535" stroke="#526c62" stroke-width="2"/><line x1="280" y1="190" x2="280" y2="535" stroke="#526c62" stroke-width="2"/><line x1="650" y1="190" x2="650" y2="535" stroke="#526c62" stroke-width="2"/><line x1="1025" y1="190" x2="1025" y2="535" stroke="#526c62" stroke-width="2"/><text x="175" y="237" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Atom</text><text x="465" y="237" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Reactants</text><text x="837" y="237" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Products</text><text x="175" y="320" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >C</text><text x="465" y="320" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >6</text><text x="837" y="320" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >6 × 1 = 6</text><text x="175" y="410" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >H</text><text x="465" y="410" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >12</text><text x="837" y="410" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >6 × 2 = 12</text><text x="175" y="500" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >O</text><text x="465" y="500" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >6 + 6 × 2 = 18</text><text x="837" y="500" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >6 + 6 × 2 = 18</text><text x="550" y="585" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Balance carbon, then hydrogen, then oxygen.</text><text x="550" y="625" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Coefficients multiply whole molecules.</text><rect x="24" y="644" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="678" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >x = 6, y = 6 and z = 6 → B</text>
</g></svg>