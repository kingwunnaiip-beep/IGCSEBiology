<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="q217-title q217-desc">
<title id="q217-title">Which crosses give ½ AB and ½ B?</title>
<desc id="q217-desc">Punnett squares for source crosses 2 and 4. Cross 2 has maternal A/B gametes and paternal B/B gametes, giving two AB and two BB cells. Cross 4 has A/O and B/B gametes, giving two AB and two BO cells. Each cross gives equal AB and B probabilities. The O allele is recessive.</desc>
