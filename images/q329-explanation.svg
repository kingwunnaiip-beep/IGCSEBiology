<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="q329-title q329-desc">
<title id="q329-title">Valves maintain one-way blood flow</title>
<desc id="q329-desc">Forward pressure opens valve flaps. Backward pressure closes them to prevent backflow. Valves occur in the heart and veins; capillaries and the lungs themselves are not the required valve locations.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
