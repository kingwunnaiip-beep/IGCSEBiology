<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Convert the units before dividing</title><desc id="desc">A length conversion ladder shows 5 centimetres equals 50 millimetres equals 50000 micrometres. Dividing the image length 50000 micrometres by the actual chloroplast length 5 micrometres gives magnification10000.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#32745a" stroke-width="1.5"/></marker></defs><rect width="1000" height="620" rx="22" fill="#faf8e9"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="54" font-size="30" text-anchor="start" fill="#183f35" font-weight="bold">Convert the units before dividing</text><rect x="45" y="110" width="260" height="100" rx="18" fill="#e4f0dc" stroke="#32745a" stroke-width="2"/><text x="175.0" y="146" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">5 cm</text><text x="175.0" y="178" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">stated image length</text><path d="M305 160 L365 160" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><rect x="365" y="110" width="260" height="100" rx="18" fill="#e4f0dc" stroke="#32745a" stroke-width="2"/><text x="495.0" y="146" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">50 mm</text><text x="495.0" y="178" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">multiply by 10</text><path d="M625 160 L685 160" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><rect x="685" y="110" width="270" height="100" rx="18" fill="#e4f0dc" stroke="#32745a" stroke-width="2"/><text x="820.0" y="146" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">50 000 µm</text><text x="820.0" y="178" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">multiply by 1000</text><path d="M100 290 H900" stroke="#32745a" stroke-width="4" fill="none" /><path d="M100 280 V300" stroke="#32745a" stroke-width="2" fill="none" /><path d="M180 280 V300" stroke="#32745a" stroke-width="2" fill="none" /><path d="M260 280 V300" stroke="#32745a" stroke-width="2" fill="none" /><path d="M340 280 V300" stroke="#32745a" stroke-width="2" fill="none" /><path d="M420 280 V300" stroke="#32745a" stroke-width="2" fill="none" /><path d="M500 280 V300" stroke="#32745a" stroke-width="2" fill="none" /><path d="M580 280 V300" stroke="#32745a" stroke-width="2" fill="none" /><path d="M660 280 V300" stroke="#32745a" stroke-width="2" fill="none" /><path d="M740 280 V300" stroke="#32745a" stroke-width="2" fill="none" /><path d="M820 280 V300" stroke="#32745a" stroke-width="2" fill="none" /><path d="M900 280 V300" stroke="#32745a" stroke-width="2" fill="none" /><text x="500" y="338" font-size="27" text-anchor="middle" fill="#183f35" font-weight="normal">Image length = 50 000 µm</text><rect x="220" y="380" width="560" height="155" rx="18" fill="#e4f0dc" stroke="#32745a" stroke-width="2"/><text x="500.0" y="416" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">Magnification = image ÷ actual</text><text x="500.0" y="448" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">50 000 µm ÷ 5 µm = 10 000</text><text x="500.0" y="480" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">No length unit remains</text><text x="500" y="580" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">Use the stated 5 cm, not a screen measurement.</text></g></svg>