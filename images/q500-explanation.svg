<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" role="img" aria-labelledby="title500 desc500"><title id="title500">Fertilisation restores the diploid number</title><desc id="desc500">A sperm nucleus with 23 chromosomes fuses with an egg nucleus with 23 chromosomes, producing a diploid zygote nucleus with 46. Implantation follows later embryo development.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#185744"/></marker></defs><rect width="800" height="530" rx="20" fill="#fbf8ed"/><g font-family="Arial, sans-serif"><text x="400" y="55" font-size="28" text-anchor="middle" fill="#185744" font-weight="bold">Fertilisation restores the diploid number</text><circle cx="150" cy="205" r="60" fill="#e1eee2" stroke="#185744" stroke-width="2"/><circle cx="400" cy="205" r="60" fill="#e1eee2" stroke="#185744" stroke-width="2"/><text x="150" y="210" font-size="36" text-anchor="middle" fill="#185744" font-weight="bold">23</text><text x="400" y="210" font-size="36" text-anchor="middle" fill="#185744" font-weight="bold">23</text><text x="150" y="125" font-size="24" text-anchor="middle" fill="#185744" font-weight="normal">Sperm nucleus</text><text x="400" y="125" font-size="24" text-anchor="middle" fill="#185744" font-weight="normal">Egg nucleus</text><text x="275" y="210" font-size="38" text-anchor="middle" fill="#185744" font-weight="normal">+</text><path d="M475 205 L555 205" stroke="#185744" stroke-width="3" marker-end="url(#arrow)" fill="none"/><circle cx="650" cy="205" r="75" fill="#e1eee2" stroke="#185744" stroke-width="2"/><text x="650" y="213" font-size="40" text-anchor="middle" fill="#185744" font-weight="bold">46</text><text x="650" y="315" font-size="24" text-anchor="middle" fill="#185744" font-weight="normal">Zygote nucleus</text><text x="275" y="305" font-size="24" text-anchor="middle" fill="#185744" font-weight="normal">Two haploid sets fuse</text><text x="650" y="350" font-size="24" text-anchor="middle" fill="#185744" font-weight="normal">Diploid: two sets</text><rect x="100" y="405" width="600" height="65" rx="12" fill="#e1eee2" stroke="#185744" stroke-width="2"/><text x="400.0" y="445.5" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">Fertilisation → embryo development → implantation</text></g></svg>