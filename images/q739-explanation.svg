<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Different body structures have different defence roles</title><desc id="desc">A biconcave red blood cell is compared with an acid-containing stomach and a white blood cell containing an engulfed particle. Only the latter two provide the listed defence against food-borne pathogens.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">Different body structures have different defence roles</text><ellipse cx="170" cy="305" rx="102" ry="72" fill="#cc8175" stroke="#c5824b" stroke-width="4"/><ellipse cx="170" cy="305" rx="47" ry="26" fill="#eec2b3" stroke="#c5824b" stroke-width="2"/><text x="170" y="165" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">Red blood cell</text><text x="170" y="445" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">Gas transport</text><text x="170" y="485" font-size="29" fill="#173f32" text-anchor="middle" font-weight="700">No</text><path d="M438 190 V265 Q445 280 466 247 C490 195 580 230 600 310 C615 395 520 405 472 365 C435 335 438 305 438 265" fill="#dfb09b" stroke="#c5824b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="475" y="295" font-size="23" fill="#173f32" text-anchor="start" font-weight="700">H⁺</text><text x="530" y="330" font-size="23" fill="#173f32" text-anchor="start" font-weight="700">H⁺</text><text x="560" y="290" font-size="23" fill="#173f32" text-anchor="start" font-weight="700">H⁺</text><text x="515" y="165" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">Stomach acid</text><text x="515" y="445" font-size="23" fill="#173f32" text-anchor="middle" font-weight="400">Kills many pathogens</text><text x="515" y="485" font-size="29" fill="#173f32" text-anchor="middle" font-weight="700">Yes</text><circle cx="830" cy="315" r="89" fill="#e4f0df" stroke="#24644b" stroke-width="4"/><path d="M795 300 Q800 260 835 285 Q870 310 835 325 Q800 345 795 300 Z" fill="#a1b7c7" stroke="#537c9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="870" cy="355" r="13" fill="#c5824b" stroke="#c5824b" stroke-width="2"/><text x="830" y="165" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">White blood cell</text><text x="830" y="445" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">Immune defence</text><text x="830" y="485" font-size="29" fill="#173f32" text-anchor="middle" font-weight="700">Yes</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">C: red cells no; stomach acid yes; white cells yes</text></g></svg>