<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Cholera draws water into the intestine</title><desc id="desc">Intestinal epithelial cells secrete chloride into an open lumen under cholera toxin; water follows and flows onward as watery diarrhoea. No physical blockage is drawn.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="bluearrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="45" font-size="28" fill="#173f32" text-anchor="start" font-weight="bold">Cholera draws water into the intestine</text><text x="500" y="555" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">Cholera causes watery diarrhoea, salt loss and dehydration; intestinal blockage is</text><text x="500" y="583" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">the exception.</text><rect x="70" y="180" width="860" height="270" rx="70" fill="#d9eaf1" stroke="#537c9a" stroke-width="3"/><rect x="80" y="320" width="840" height="115" rx="0" fill="#f0dfc7" stroke="#bc824b" stroke-width="2"/><rect x="95" y="320" width="51" height="115" rx="10" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><ellipse cx="120" cy="400" rx="10" ry="10" fill="#d9eaf1" stroke="#537c9a" stroke-width="2" /><rect x="153" y="320" width="51" height="115" rx="10" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><ellipse cx="178" cy="400" rx="10" ry="10" fill="#d9eaf1" stroke="#537c9a" stroke-width="2" /><rect x="211" y="320" width="51" height="115" rx="10" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><e