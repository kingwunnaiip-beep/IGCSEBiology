<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="q480-title q480-desc">
<title id="q480-title">Conserving water after exercise</title>
<desc id="q480-desc">Water loss in sweat increases blood concentration. ADH promotes water reabsorption from kidney tubules into blood, so less water is excreted. Urine volume decreases and concentration increases.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="700" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Conserving water after exercise</text><rect x="35" y="95" width="280" height="120" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="175.0" y="133" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Sweating increases</text><text x="175.0" y="171" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >water lost from blood</text><line x1="325" y1="155" x2="370" y2="155" stroke="#25614b" stroke-width="4"/><polygon points="370,155 356.6950761583107,161.92668763312224 356.6950761583107,148.07331236687776" fill="#25614b"/><rect x="385" y="95" width="280" height="120" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="525.0" y="133" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Concentrated blood</text><text x="525.0" y="171" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >no water replacement</text><line x1="675" y1="155" x2="720" y2="155" stroke="#25614b" stroke-width="4"/><polygon points="720,155 706.6950761583107,161.92668763312224 706.6950761583107,148.07331236687776" fill="#25614b"/><rect x="735" y="95" width="230" height="120" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="850.0" y="133" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >More ADH</text><text x="850.0" y="171" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >conserves water</text><rect x="65" y="280" width="510" height="90" rx="24" fill="#f1dfae" stroke="#25614b" stroke-width="2"/><text x="320" y="333" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >kidney tubule / collecting duct</text><line x1="160" y1="380" x2="160" y2="440" stroke="#357ca2" stroke-width="6"/><polygon points="160,440 153.07331236687776,426.6950761583107 166.92668763312224,426.6950761583107" fill="#357ca2"/><line x1="300" y1="380" x2="300" y2="440" stroke="#357ca2" stroke-width="6"/><polygon points="300,440 293.07331236687776,426.6950761583107 306.92668763312224,426.6950761583107" fill="#357ca2"/><line x1="440" y1="380" x2="440" y2="440" stroke="#357ca2" stroke-width="6"/><polygon points="440,440 433.07331236687776,426.6950761583107 446.92668763312224,426.6950761583107" fill="#357ca2"/><rect x="65" y="455" width="510" height="60" rx="16" fill="#dcecf3" stroke="#357ca2" stroke-width="2"/><text x="320" y="494" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >water returned to blood</text><line x1="585" y1="325" x2="655" y2="325" stroke="#25614b" stroke-width="4"/><polygon points="655,325 641.6950761583107,331.92668763312224 641.6950761583107,318.07331236687776" fill="#25614b"/><rect x="675" y="265" width="290" height="205" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="820.0" y="303" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Less water in urine</text><text x="820.0" y="341" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >volume decreases</text><text x="820.0" y="372" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >concentration increases</text><text x="45" y="554" font-size="22" fill="#526c62" font-weight="400" text-anchor="start" >Water reabsorption means water moves from the tubule back into the blood.</text><rect x="24" y="624" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="658" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Urine concentration ↑ ; urine volume ↓ → C.</text>
</g></svg>