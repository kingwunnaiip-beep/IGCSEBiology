<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1270" viewBox="0 0 1000 1270" role="img" aria-labelledby="q170-title q170-desc">
<title id="q170-title">170 · Eutrophication: producers → decomposers</title>
<desc id="q170-desc">Answer C: the source statements are ordered 2, 1, 3. Fertiliser supplies mineral nutrients, increasing producer growth. More organic material eventually becomes available for decomposition. Increased aerobic respiration by decomposers uses dissolved oxygen, reducing its concentration in the water. The original causal flow chart preserves the printed statement numbers, and labels dead organic material as a linking event rather than a fourth numbered source statement. No measured oxygen curve or unprovided times are invented.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1270" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >170 · Eutrophication: producers → decomposers</text><rect x="130" y="139" width="740" height="117" rx="12" fill="#f5efdf" stroke="#daa958" stroke-width="2"/><text x="500.0" y="181" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Fertiliser adds mineral ions</text><text x="500.0" y="223" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >For example, nitrate ions.</text><line x1="500" y1="262" x2="500" y2="307" stroke="#357ca2" stroke-width="5"/><polygon points="500,307 493.07331236687776,293.6950761583107 506.92668763312224,293.6950761583107" fill="#357ca2"/><rect x="75" y="327" width="850" height="139" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="369" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >2 · Increased growth of producers</text><text x="500.0" y="411" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Nutrients support more algal and aquatic plant growth.</text><line x1="500" y1="472" x2="500" y2="517" stroke="#357ca2" stroke-width="5"/><polygon points="500,517 493.07331236687776,503.6950761583107 506.92668763312224,503.6950761583107" fill="#357ca2"/><rect x="130" y="537" width="740" height="117" rx="12" fill="#f5efdf" stroke="#daa958" stroke-width="2"/><text x="500.0" y="579" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >More dead organic material</text><text x="500.0" y="621" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The link between growth and decomposition.</text><line x1="500" y1="660" x2="500" y2="705" stroke="#357ca2" stroke-width="5"/><polygon points="500,705 493.07331236687776,691.6950761583107 506.92668763312224,691.6950761583107" fill="#357ca2"/><rect x="75" y="725" width="850" height="139" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="767" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >1 · More aerobic respiration by decomposers</text><text x="500.0" y="809" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Decomposers break down the organic material.</text><line x1="500" y1="870" x2="500" y2="915" stroke="#357ca2" stroke-width="5"/><polygon points="500,915 493.07331236687776,901.6950761583107 506.92668763312224,901.6950761583107" fill="#357ca2"/><rect x="75" y="935" width="850" height="139" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="977" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >3 · Dissolved oxygen concentration decreases</text><text x="500.0" y="1019" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Aerobic respiration uses oxygen from the water.</text><text x="500" y="1147" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Causal model; no measured oxygen levels or time scale.</text><rect x="24" y="1194" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1228" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · 2 → 1 → 3</text>
</g></svg>