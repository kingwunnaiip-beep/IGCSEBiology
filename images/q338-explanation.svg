<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-labelledby="q338-title q338-desc">
<title id="q338-title">A complete ring interrupts phloem transport</title>
<desc id="q338-desc">Sugars move from leaves towards roots through phloem. Removing a complete ring of bark and phloem blocks this route, so sugars accumulate above the ring. Inner xylem can still carry water upwards.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="780" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >A complete ring interrupts phloem transport</text><text x="295" y="115" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Sugar pathway: phloem</text><text x="825" y="115" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Water pathway: xylem</text><rect x="65" y="145" width="460" height="90" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="295.0" y="183" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Leaves make sugars</text><line x1="295" y1="245" x2="295" y2="290" stroke="#25614b" stroke-width="4"/><polygon points="295,290 288.07331236687776,276.6950761583107 301.92668763312224,276.6950761583107" fill="#25614b"/><rect x="65" y="305" width="460" height="115" rx="12" fill="#f8e8c7" stroke="#daa958" stroke-width="2"/><text x="295.0" y="343" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Accumulation above the ring</text><text x="295.0" y="381" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Swelling develops on this side.</text><line x1="295" y1="435" x2="295" y2="475" stroke="#b94a43" stroke-width="4"/><polygon points="295,475 288.07331236687776,461.6950761583107 301.92668763312224,461.6950761583107" fill="#b94a43"/><rect x="65" y="490" width="460" height="85" rx="12" fill="#f9e0da" stroke="#b94a43" stroke-width="2"/><text x="295" y="519" font-size="24" fill="#173d31" font-weight="700" text-anchor="middle" >Ring of phloem removed</text><text x="295" y="557" font-size="24" fill="#173d31" font-weight="700" text-anchor="middle" >Sugar route blocked</text><line x1="285" y1="465" x2="305" y2="485" stroke="#b94a43" stroke-width="5"/><line x1="305" y1="465" x2="285" y2="485" stroke="#b94a43" stroke-width="5"/><rect x="65" y="605" width="460" height="65" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="295.0" y="643" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Roots receive less sugar</text><rect x="595" y="145" width="460" height="90" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="825.0" y="183" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Leaves</text><rect x="595" y="605" width="460" height="65" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="825.0" y="643" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Roots take up water</text><line x1="825" y1="585" x2="825" y2="255" stroke="#357ca2" stroke-width="10"/><polygon points="825,255 831.9266876331222,268.3049238416893 818.0733123668778,268.3049238416893" fill="#357ca2"/><text x="865" y="365" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >Inner xylem</text><text x="865" y="404" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >remains in the</text><text x="865" y="443" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >remaining stem.</text><rect x="24" y="704" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="738" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >A: sugars are blocked; swelling occurs above the ring.</text>
</g></svg>