<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="q526-title q526-desc"><title id="q526-title">Osmosis changes the stiffness of potato tissue</title><desc id="q526-desc">Two schematic plant cells show a large vacuole pressing against the wall in a turgid cell and a smaller vacuole with lower pressure in a flaccid cell. A more concentrated external salt solution lowers water potential and promotes water loss by osmosis.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#36785e"/></marker></defs><rect x="0" y="0" width="900" height="500" rx="22" fill="#fbf7e9"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="46" font-size="27" text-anchor="start" fill="#183e35"><tspan x="35" dy="0">Osmosis changes the stiffness of potato tissue</tspan></text><text x="225" y="98" font-size="24" text-anchor="middle" fill="#183e35"><tspan x="225" dy="0">More turgid</tspan></text><text x="675" y="98" font-size="24" text-anchor="middle" fill="#183e35"><tspan x="675" dy="0">More flaccid</tspan></text><rect x="105" y="125" width="240" height="205" rx="8" fill="#eff4df" stroke="#36785e" stroke-width="2"/><rect x="555" y="125" width="240" height="205" rx="8" fill="#eff4df" stroke="#36785e" stroke-width="2"/><rect x="119" y="139" width="212" height="177" rx="35" fill="#d7e8ce" stroke="#36785e" stroke-width="2"/><rect x="137" y="156" width="176" height="141" rx="28" fill="#c5e0ed" stroke="#36785e" stroke-width="2"/><rect x="582" y="151" width="186" height="153" rx="35" fill="#d7e8ce" stroke="#36785e" stroke-width="2"/><rect x="608" y="181" width="134" height="92" rx="23" fill="#c5e0ed" stroke="#36785e" stroke-width="2"/><text x="225" y="224" font-size="20" text-anchor="middle" fill="#183e35"><tspan x="225" dy="0">large vacuole</tspan></text><text x="675" y="230" font-size="20" text-anchor="middle" fill="#183e35"><tspan x="675" dy="0">less water</tspan></text><path d="M150 152 L130 133" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M300 300 L322 320" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M300 152 L322 132" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M737 165 L813 132" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M744 279 L822 310" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="450" y="198" font-size="21" text-anchor="middle" fill="#183e35"><tspan x="450" dy="0">water leaves</tspan><tspan x="450" dy="29">by osmosis</tspan></text><path d="M365 245 L535 245" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="225" y="370" font-size="22" text-anchor="middle" fill="#183e35"><tspan x="225" dy="0">Cell contents press firmly</tspan><tspan x="225" dy="29">against the cell wall.</tspan></text><text x="675" y="370" font-size="22" text-anchor="middle" fill="#183e35"><tspan x="675" dy="0">Reduced turgor pressure;</tspan><tspan x="675" dy="29">tissue bends more easily.</tspan></text><rect x="55" y="433" width="790" height="45" rx="15" fill="#e9efd9" stroke="#36785e" stroke-width="2"/><text x="450" y="463" font-size="21" text-anchor="middle" fill="#183e35"><tspan x="450" dy="0">More external salt → lower water potential → greater water loss</tspan></text></g></svg>