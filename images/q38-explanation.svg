<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820" role="img" aria-labelledby="q38-title q38-desc">
<title id="q38-title">Oxygenated blood in double circulation</title>
<desc id="q38-desc">Vessel 1 is the pulmonary artery, carrying deoxygenated blood from the right side of the heart to the lungs. Vessel 2 is the pulmonary vein, carrying oxygenated blood from the lungs to the left side of the heart. Vessel 4 is the aorta, carrying oxygenated blood from the left side of the heart to the body. Vessel 3 is the vena cava, returning deoxygenated blood from the body to the right side of the heart. Red indicates oxygenated blood; blue indicates deoxygenated blood. Answer D: vessels 2 and 4.</desc>
