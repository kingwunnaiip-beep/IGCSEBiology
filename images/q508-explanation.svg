<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="t d"><title id="t">Respiration maintains two opposite gas gradients</title><desc id="d">Across permeable frog skin oxygen diffuses from pond water into frog cells where respiration uses it. Carbon dioxide produced in cells diffuses out into water.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#286c50" stroke-width="1.5"/></marker></defs><rect width="960" height="560" rx="20" fill="#fbf9ed"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="28" text-anchor="start" fill="#173f32">Respiration maintains two opposite gas gradients</text><rect x="50" y="120" width="260" height="300" rx="14" fill="#e0ecda" stroke="#286c50" stroke-width="3"/><text x="180.0" y="278.0" font-size="23" text-anchor="middle" fill="#173f32">Pond water</text><rect x="650" y="120" width="260" height="300" rx="14" fill="#e0ecda" stroke="#286c50" stroke-width="3"/><text x="780" y="160" font-size="24" text-anchor="middle" fill="#173f32">Frog cells</text><rect x="455" y="120" width="50" height="300" rx="14" fill="#bed3ad" stroke="#286c50" stroke-width="3"/><text x="480" y="455" font-size="23" text-anchor="middle" fill="#173f32">Skin</text><path d="M325 185 L630 185" stroke="#286c50" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="480" y="155" font-size="24" text-anchor="middle" fill="#173f32">Oxygen diffuses in</text><path d="M630 345 L325 345" stroke="#286c50" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="480" y="318" font-size="24" text-anchor="middle" fill="#173f32">CO₂ diffuses out</text><text x="780" y="222" font-size="23" text-anchor="middle" fill="#173f32">O₂ used</text><text x="780" y="255" font-size="23" text-anchor="middle" fill="#173f32">in respiration</text><text x="780" y="300" font-size="23" text-anchor="middle" fill="#173f32">CO₂ produced</text><text x="480" y="520" font-size="24" text-anchor="middle" fill="#173f32">Each gas moves down its own concentration gradient.</text></g></svg>