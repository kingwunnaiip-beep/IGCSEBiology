 stroke-width="2"/><path d="M 656 534 L 694 526" fill="none" stroke="#25614b" stroke-width="2"/><ellipse cx="789" cy="548" rx="38" ry="22" fill="#c6d5ac" stroke="#25614b" stroke-width="2"/><path d="M 768 552 L 806 544" fill="none" stroke="#25614b" stroke-width="2"/><line x1="140" y1="685" x2="855" y2="685" stroke="#357ca2" stroke-width="6"/><polygon points="855,685 841.6950761583107,691.9266876331222 841.6950761583107,678.0733123668778" fill="#357ca2"/><text x="500" y="714" font-size="25" fill="#357ca2" font-weight="700" text-anchor="middle" >Peristalsis moves the contents along.</text><rect x="75" y="779" width="850" height="145" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="820" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Bulk + retained water → easier passage of faeces</text><text x="500.0" y="863" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >This helps reduce the risk of constipation.</text><rect x="75" y="970" width="850" height="130" rx="12" fill="#f4efdf" stroke="#daa958" stroke-width="2"/><text x="500.0" y="1011" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Sources of dietary fibre</text><text x="500.0" y="1054" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Fruits · Vegetables · Wholegrain foods</text><text x="500" y="1133" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative bowel schematic; shape and contents are illustrative.</text><rect x="24" y="1144" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1178" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer B · Dietary fibre helps prevent constipation</text>
