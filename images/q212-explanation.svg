<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="q212-title q212-desc">
<title id="q212-title">In this root, xylem is central</title>
<desc id="q212-desc">Qualitative root cross-section: the central blue star is xylem and the green groups between its arms are phloem. A labels both correctly. The broad outer region is neither of these transport tissues.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="680" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >In this root, xylem is central</text><text x="500" y="99" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative model of the source root cross-section</text><circle cx="500" cy="324" r="171" fill="#f5efdb" stroke="#25614b" stroke-width="4"/><circle cx="500" cy="324" r="157" fill="#fffaf0" stroke="#526c62" stroke-width="2"/><path d="M 500 204 C 518 220 507 281 529 295 C 551 308 603 303 620 324 C 603 345 551 340 529 353 C 507 367 518 428 500 444 C 482 428 493 367 471 353 C 449 340 397 345 380 324 C 397 303 449 308 471 295 C 493 281 482 220 500 204 Z" fill="#b5d9ec" stroke="#357ca2" stroke-width="4"/><circle cx="449" cy="273" r="17" fill="#b6d7a8" stroke="#25614b" stroke-width="3"/><circle cx="551" cy="273" r="17" fill="#b6d7a8" stroke="#25614b" stroke-width="3"/><circle cx="449" cy="375" r="17" fill="#b6d7a8" stroke="#25614b" stroke-width="3"/><circle cx="551" cy="375" r="17" fill="#b6d7a8" stroke="#25614b" stroke-width="3"/><text x="86" y="223" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >Phloem</text><text x="86" y="259" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >Groups between</text><text x="86" y="293" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >the xylem arms</text><line x1="310" y1="264" x2="434" y2="272" stroke="#25614b" stroke-width="3"/><circle cx="434" cy="272" r="4" fill="#25614b" stroke="none" stroke-width="3"/><text x="756" y="298" font-size="28" fill="#357ca2" font-weight="700" text-anchor="start" >Xylem</text><text x="756" y="334" font-size="25" fill="#357ca2" font-weight="400" text-anchor="start" >Central</text><text x="756" y="368" font-size="25" fill="#357ca2" font-weight="400" text-anchor="start" >star-shaped tissue</text><line x1="737" y1="307" x2="566" y2="321" stroke="#357ca2" stroke-width="3"/><circle cx="566" cy="321" r="4" fill="#357ca2" stroke="none" stroke-width="3"/><text x="500" y="539" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Xylem: water and mineral ions</text><text x="500" y="575" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Phloem: sucrose and amino acids</text><rect x="24" y="604" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="638" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >A — both leaders identify the correct tissue</text>
</g></svg>