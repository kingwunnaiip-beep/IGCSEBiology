<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="q261-title q261-desc">
<title id="q261-title">Stem cells are unspecialised cells</title>
<desc id="q261-desc">A stem cell is unspecialised: it has not yet developed a particular specialised structure and function. It can divide by mitosis and can differentiate into specialised cells. The exact range of possible cell types depends on the stem-cell type.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="690" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Stem cells are unspecialised cells</text><circle cx="205" cy="275" r="95" fill="#e8e2f2" stroke="#71619c" stroke-width="5"/><circle cx="205" cy="275" r="29" fill="#c7b8e5" stroke="#71619c" stroke-width="3"/><text x="205" y="420" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Unspecialised stem cell</text><line x1="315" y1="275" x2="470" y2="275" stroke="#71619c" stroke-width="4"/><polygon points="470,275 456.6950761583107,281.92668763312224 456.6950761583107,268.07331236687776" fill="#71619c"/><text x="400" y="145" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Differentiation</text><rect x="535" y="110" width="500" height="120" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="785.0" y="150" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Nerve cell</text><text x="785.0" y="192" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Specialised to carry impulses.</text><rect x="535" y="280" width="500" height="120" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="785.0" y="320" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Muscle cell</text><text x="785.0" y="362" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Specialised to contract.</text><rect x="535" y="450" width="500" height="120" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="785.0" y="490" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Other specialised cell types</text><text x="785.0" y="532" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >The range depends on the stem cell.</text><line x1="470" y1="275" x2="525" y2="175" stroke="#71619c" stroke-width="4"/><polygon points="525,175 524.6573816349749,189.99608657803586 512.5188338378239,183.3198852896028" fill="#71619c"/><line x1="470" y1="275" x2="525" y2="340" stroke="#71619c" stroke-width="4"/><polygon points="525,340 511.1180493290011,334.31744374704886 521.6935260133239,325.3689634756989" fill="#71619c"/><line x1="470" y1="275" x2="525" y2="510" stroke="#71619c" stroke-width="4"/><polygon points="525,510 515.2235806502467,498.62363745752754 528.7124483834198,495.4666684135934" fill="#71619c"/><text x="560" y="625" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Unspecialised describes cell differentiation; haploid describes chromosome number.</text>
</g></svg>