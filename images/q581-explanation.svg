<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which labelling of the kidney and associated structures is correct?</title><desc id="desc">Independent kidney labels: cortex is the outer region, medulla is the inner region, the renal artery carries blood into the kidney, and the ureter carries urine to the bladder. These identify diagram A.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e" /></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8" /><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Which labelling of the kidney and associated structures is</text><text x="38" y="73" font-size="24" font-weight="700">correct?</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="50" y="207" font-size="23" font-weight="700">Outer kidney region</text><text x="50" y="285" font-size="21" font-weight="400">Cortex</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="405" y="207" font-size="23" font-weight="700">Inner kidney region</text><text x="405" y="285" font-size="21" font-weight="400">Medulla</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text><text x="760" y="207" font-size="23" font-weight="700">Renal artery + ureter</text><text x="760" y="285" font-size="21" font-weight="400">Artery: blood enters kidney</text><text x="760" y="312" font-size="21" font-weight="400">Ureter: urine to bladder</text><text x="760" y="339" font-size="21" font-weight="400">All labels match A</text></g></svg>
