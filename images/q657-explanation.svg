<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">A lacteal is the central lymph vessel</title><desc id="desc">A villus contains a central lymph vessel labelled C surrounded by a separate blood-capillary network; fat enters lymph and glucose and amino acids enter blood.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">A lacteal is the central lymph vessel</text><path d="M220 480 C280 370 225 150 350 120 C475 150 420 370 480 480 L450 480 C405 380 460 165 350 150 C240 165 295 380 250 480 Z" fill="#e4f0df" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M330 490 L330 250 Q350 210 370 250 L370 490 Z" fill="#d4dfaa" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M280 480 C290 370 290 250 320 190 M420 480 C410 370 410 250 380 190" fill="none" stroke="#ac655c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M285 220 Q350 170 415 220 Q350 270 285 220" fill="none" stroke="#ac655c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M285 275 Q350 225 415 275 Q350 325 285 275" fill="none" stroke="#ac655c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M285 330 Q350 280 415 330 Q350 380 285 330" fill="none" stroke="#ac655c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M285 385 Q350 335 415 385 Q350 435 285 385" fill="none" stroke="#ac655c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M285 440 Q350 390 415 440 Q350 490 285 440" fill="none" stroke="#ac655c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M350 350 L350 460" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="530" y="185" font-size="24" text-anchor="start" fill="#173f32">C: central lacteal</text><path d="M530 191 L365 275" fill="none" stroke="#537c9a" stroke-width="2"/><text x="540" y="310" font-size="24" text-anchor="start" fill="#173f32">Blood capillaries</text><path d="M540 316 L412 330" fill="none" stroke="#537c9a" stroke-width="2"/><text x="545" y="220" font-size="24" text-anchor="start" fill="#173f32">Fats enter lymph</text><text x="545" y="345" font-size="24" text-anchor="start" fill="#173f32">Glucose + amino acids</text><text x="545" y="375" font-size="24" text-anchor="start" fill="#173f32">enter the blood</text><text x="180" y="520" font-size="24" text-anchor="start" fill="#173f32">One villus in the small intestine</text><text x="500" y="565" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">C identifies the lacteal.</text></g></svg>