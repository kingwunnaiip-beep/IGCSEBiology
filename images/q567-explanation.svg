<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which statement about basic units of food molecules is correct?</title><desc id="desc">Glycerol and fatty acids combine to form oils. Separately, amino acids build proteins; oil does not turn into amino acids.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e" /></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8" /><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Which statement about basic units of food molecules is</text><text x="38" y="73" font-size="24" font-weight="700">correct?</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="50" y="207" font-size="23" font-weight="700">Glycerol + fatty acids</text><text x="50" y="285" font-size="21" font-weight="400">Lipid building blocks</text><path d="M345 245 H376" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)" /><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="405" y="207" font-size="23" font-weight="700">Join to form oil</text><text x="405" y="285" font-size="21" font-weight="400">Energy-rich molecules</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="760" y="207" font-size="23" font-weight="700">Amino acids are</text><text x="760" y="236" font-size="23" font-weight="700">different</text><text x="760" y="285" font-size="21" font-weight="400">They build proteins</text><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>
