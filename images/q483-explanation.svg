 font-weight="400" text-anchor="start" >Other devices have other jobs:</text><text x="585" y="416" font-size="21" fill="#173d31" font-weight="400" text-anchor="start" >air inlet → supplies oxygen</text><text x="585" y="452" font-size="21" fill="#173d31" font-weight="400" text-anchor="start" >pH probe → measures pH</text><text x="585" y="488" font-size="21" fill="#173d31" font-weight="400" text-anchor="start" >heat treatment → sterilises</text><text x="500" y="572" font-size="21" fill="#526c62" font-weight="400" text-anchor="middle" >Simplified teaching model; cooling equipment removes excess heat.</text><rect x="24" y="634" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="668" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Mixing helps maintain an even temperature: B.</text>
