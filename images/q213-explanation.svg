<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="q213-title q213-desc">
<title id="q213-title">Low glucose stimulates glucagon release</title>
<desc id="q213-desc">The source glucose graph has its lowest trough in 14:00–15:30. Low glucose stimulates pancreatic glucagon release, which stimulates liver glycogen breakdown and glucose release. This identifies C without inventing a second hormone curve.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="700" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Low glucose stimulates glucagon release</text><rect x="80" y="95" width="840" height="112" rx="12" fill="#e4eef5" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="135" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Read the lowest trough</text><text x="500.0" y="177" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Source interval: 14:00–15:30</text><line x1="500" y1="218" x2="500" y2="258" stroke="#357ca2" stroke-width="4"/><polygon points="500,258 493.07331236687776,244.69507615831074 506.92668763312224,244.69507615831074" fill="#357ca2"/><rect x="190" y="271" width="620" height="108" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="311" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Blood glucose is low</text><text x="500.0" y="353" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Pancreas releases more glucagon</text><line x1="500" y1="390" x2="500" y2="429" stroke="#25614b" stroke-width="4"/><polygon points="500,429 493.07331236687776,415.6950761583107 506.92668763312224,415.6950761583107" fill="#25614b"/><rect x="100" y="442" width="800" height="108" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="482" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Liver responds to glucagon</text><text x="500.0" y="524" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Glycogen breaks down → glucose enters blood</text><text x="500" y="600" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >This response raises blood glucose towards its normal level.</text><rect x="24" y="624" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="658" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C — 14:00–15:30</text>
</g></svg>