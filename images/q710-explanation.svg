<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Two glucose molecules produce twelve water molecules</title><desc id="desc">Two hexagonal glucose symbols are shown alongside twelve water molecule drawings, arranged in three rows of four. One glucose yields six water molecules in the balanced aerobic respiration equation.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">Two glucose molecules produce twelve water molecules</text><text x="210" y="145" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">2 glucose molecules</text><text x="720" y="145" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">12 water molecules</text><polygon points="195.0,290.0 167.5,337.6313972081441 112.50000000000001,337.6313972081441 85.0,290.0 112.49999999999997,242.3686027918559 167.5,242.3686027918559" fill="#e4f0df" stroke="#24644b" stroke-width="4"/><text x="140" y="298" font-size="20" fill="#173f32" text-anchor="middle" font-weight="700">C₆H₁₂O₆</text><polygon points="335.0,290.0 307.5,337.6313972081441 252.5,337.6313972081441 225.0,290.0 252.49999999999997,242.3686027918559 307.5,242.3686027918559" fill="#e4f0df" stroke="#24644b" stroke-width="4"/><text x="280" y="298" font-size="20" fill="#173f32" text-anchor="middle" font-weight="700">C₆H₁₂O₆</text><g transform="translate(570 225) scale(1.1)"><circle cx="0" cy="0" r="13" fill="#cfe5ec" stroke="#537c9a" stroke-width="3"/><circle cx="-15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/><circle cx="15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/></g><g tra