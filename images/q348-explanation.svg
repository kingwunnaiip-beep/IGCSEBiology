<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="q348-title q348-desc">
<title id="q348-title">From vessel damage to a fibrin clot</title>
<desc id="q348-desc">Damage activates platelets, which initiate a clotting cascade. Soluble fibrinogen is converted to insoluble fibrin. Fibrin forms a mesh that traps blood cells.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="760" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >From vessel damage to a fibrin clot</text><rect x="70" y="115" width="300" height="118" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="220.0" y="155" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Vessel damaged</text><text x="220.0" y="198" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Platelets activated</text><line x1="382" y1="174" x2="483" y2="174" stroke="#25614b" stroke-width="4"/><polygon points="483,174 469.6950761583107,180.92668763312224 469.6950761583107,167.07331236687776" fill="#25614b"/><rect x="500" y="115" width="515" height="118" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="757.5" y="155" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Clotting cascade begins</text><text x="757.5" y="198" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Platelets are L</text><line x1="757" y1="247" x2="757" y2="288" stroke="#25614b" stroke-width="4"/><polygon points="757,288 750.0733123668778,274.6950761583107 763.9266876331222,274.6950761583107" fill="#25614b"/><rect x="70" y="305" width="370" height="145" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="255.0" y="345" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Fibrinogen: M</text><text x="255.0" y="388" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Soluble protein</text><text x="255.0" y="428" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >already in plasma</text><line x1="455" y1="378" x2="605" y2="378" stroke="#25614b" stroke-width="4"/><polygon points="605,378 591.6950761583107,384.92668763312224 591.6950761583107,371.07331236687776" fill="#25614b"/><text x="530" y="347" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >converted</text><text x="530" y="426" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >to</text><rect x="620" y="305" width="395" height="145" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="817.5" y="345" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Fibrin: N</text><text x="817.5" y="388" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Insoluble protein</text><text x="817.5" y="428" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >forms a mesh</text><path d="M100 510 C300 475 540 545 740 510" fill="none" stroke="#25614b" stroke-width="4"/><path d="M100 555 C300 520 540 590 740 555" fill="none" stroke="#25614b" stroke-width="4"/><path d="M100 600 C300 565 540 635 740 600" fill="none" stroke="#25614b" stroke-width="4"/><path d="M180 495 L260 615" fill="none" stroke="#25614b" stroke-width="4"/><path d="M330 495 L410 615" fill="none" stroke="#25614b" stroke-width="4"/><path d="M480 495 L560 615" fill="none" stroke="#25614b" stroke-width="4"/><path d="M630 495 L710 615" fill="none" stroke="#25614b" stroke-width="4"/><ellipse cx="245" cy="543" rx="29" ry="17" fill="#d9a09a" stroke="#b94a43" stroke-width="3"/><ellipse cx="395" cy="578" rx="29" ry="17" fill="#d9a09a" stroke="#b94a43" stroke-width="3"/><ellipse cx="565" cy="536" rx="29" ry="17" fill="#d9a09a" stroke="#b94a43" stroke-width="3"/><text x="795" y="535" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >Fibrin mesh traps</text><text x="795" y="575" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >blood cells to</text><text x="795" y="615" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >form the clot.</text><rect x="24" y="684" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="718" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >L = platelet