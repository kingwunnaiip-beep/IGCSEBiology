t="84" rx="12" fill="#dcebd3" stroke="#25614b" stroke-width="2"/><text x="257" y="623" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" font-style="italic">Homo</text><rect x="459" y="570" width="453" height="84" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="685" y="623" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" font-style="italic">habilis</text><rect x="88" y="730" width="824" height="158" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="772" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Same first part → same genus</text><text x="500.0" y="816" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Different complete names → different species</text><rect x="24" y="934" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="968" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · Same genus; different species</text>
