<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1040" viewBox="0 0 1000 1040" role="img" aria-labelledby="q177-title q177-desc">
<title id="q177-title">177 · Testosterone regulates male characteristics</title>
<desc id="q177-desc">Qualitative endocrine pathway. Testes secrete testosterone into the blood, which carries the hormone to target tissues. Testosterone is involved in male secondary sexual characteristics such as deepening voice and facial-hair growth. Insulin and glucagon instead regulate blood glucose. Lactase is a digestive enzyme, not a hormone. Illustrative organ symbols do not represent measured anatomy, hormone concentration or timing. AnswerD.</desc>
