<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">What is the order of the insulin-production steps?</title><desc id="desc">Isolate insulin gene: Use an enzyme to cut DNA; Insert into plasmid: Make recombinant DNA; Grow modified bacteria: Bacteria reproduce and make insulin; Collect insulin: Remove insulin from the culture and purify</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">What is the order of the insulin-production steps?</text><rect x="30" y="130" width="225" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><circle cx="60" cy="160" r="16" fill="#285d4c"/><text x="60" y="166" text-anchor="middle" font-size="18" fill="white">2</text><text x="50" y="207" font-size="21" font-weight="700">Isolate insulin</text><text x="50" y="234" font-size="21" font-weight="700">gene</text><text x="50" y="285" font-size="19" font-weight="400">Use an enzyme to cut</text><text x="50" y="310" font-size="19" font-weight="400">DNA</text><rect x="295" y="130" width="225" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><circle cx="325" cy="160" r="16" fill="#285d4c"/><text x="325" y="166" text-anchor="middle" font-size="18" fill="white">3</text><text x="315" y="207" font-size="21" font-weight="700">Insert into</text><text x="315" y="234" font-size="21" font-weight="700">plasmid</text><text x="315" y="285" font-size="19" font-weight="400">Make recombinant</text><text x="315" y="310" font-size="19" font-weight="400">DNA</text><rect x="560" y="130" width="225" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><circle cx="590" cy="160" r="16" fill="#285d4c"/><text x="590" y="166" text-anchor="middle" font-size="18" fill="white">4</text><text x="580" y="207" font-size="21" font-weight="700">Grow modified</text><text x="580" y="234" font-size="21" font-weight="700">bacteria</text><text x="580" y="285" font-size="19" font-weight="400">Bacteria reproduce</text><text x="580" y="310" font-size="19" font-weight="400">and make insulin</text><rect x="825" y="130" width="225" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><circle cx="855" cy="160" r="16" fill="#285d4c"/><text x="855" y="166" text-anchor="middle" font-size="18" fill="white">1</text><text x="845" y="207" font-size="21" font-weight="700">Collect insulin</text><text x="845" y="285" font-size="19" font-weight="400">Remove insulin from</text><text x="845" y="310" font-size="19" font-weight="400">the culture and purify</text><path d="M260 245 H286" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)"/><path d="M525 245 H551" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)"/><path d="M790 245 H816" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)"/><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>