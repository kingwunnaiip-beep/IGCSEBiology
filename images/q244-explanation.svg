lygon points="678,239 664.6950761583107,245.92668763312224 664.6950761583107,232.07331236687776" fill="#25614b"/><text x="500" y="387" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Gene expression inside the bacterial cell</text><rect x="50" y="421" width="900" height="215" rx="12" fill="#e8f2f8" stroke="#357ca2" stroke-width="2"/><text x="140" y="475" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >DNA</text><line x1="205" y1="466" x2="361" y2="466" stroke="#357ca2" stroke-width="4"/><polygon points="361,466 347.6950761583107,472.92668763312224 347.6950761583107,459.07331236687776" fill="#357ca2"/><text x="282" y="513" font-size="24" fill="#357ca2" font-weight="400" text-anchor="middle" >transcription</text><text x="430" y="475" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >mRNA</text><line x1="499" y1="466" x2="655" y2="466" stroke="#357ca2" stroke-width="4"/><polygon points="655,466 641.6950761583107,472.92668763312224 641.6950761583107,459.07331236687776" fill="#357ca2"/><text x="580" y="513" font-size="24" fill="#357ca2" font-weight="400" text-anchor="middle" >translation</text><text x="790" y="475" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >4 — ribosome</text><text x="790" y="552" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >reads mRNA</text><text x="790" y="592" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >and makes insulin</text><rect x="65" y="677" width="870" height="101" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500" y="716" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >The arrows follow genetic information.</text><text x="500" y="751" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Ribosomes read mRNA; DNA does not enter them.</text><rect x="24" y="814" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500