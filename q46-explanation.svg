<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="q46-title q46-desc"><title id="q46-title">Vaccination forms memory</title><desc id="q46-desc">Vaccine antigens stimulate a lymphocyte response, producing specific antibodies and long-lived memory cells. Transferred antibodies can provide temporary passive immunity but do not create memory cells in the recipient.</desc><defs><marker id="q46-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#244d3d"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;font-size:28px;fill:#244d3d}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}.heading{font-size:32px;font-weight:700}.small{font-size:28px}.bold{font-weight:700}.red{fill:#b65350}.blue{fill:#447c9a}.muted{fill:#698476}.arrow{stroke:#244d3d;stroke-width:4;fill:none;marker-end:url(#q46-arrow)}</style><rect x="1" y="1" width="638" height="418" rx="24" fill="#f5f8f2" stroke="#dbe9d7" stroke-width="2"/><text x="30" y="45" class="heading">Vaccination forms memory</text><g transform="translate(90 150) rotate(-25)"><rect x="-47" y="-14" width="90" height="28" rx="4" fill="#dbeaf0" stroke="#447c9a" stroke-width="4"/><rect x="-66" y="-25" width="13" height="50" fill="#447c9a"/><line x1="45" y1="0" x2="100" y2="0" stroke="#447c9a" stroke-width="4"/><line x1="-31" y1="-14" x2="-31" y2="2" stroke="#447c9a" stroke-width="3"/><line x1="-8" y1="-14" x2="-8" y2="2" stroke="#447c9a" stroke-width="3"/></g><text x="24" y="230" >Vaccine</text><text x="24" y="266" >antigens</text><path d="M186 156 H255" class="arrow"/><circle cx="321" cy="153" r="55" fill="#dbe9d7" stroke="#659b78" stroke-width="5"/><circle cx="326" cy="155" r="29" fill="#659b78"/><text x="397" y="146" >Lymphocytes</text><text x="397" y="182" >respond</text><path d="M296 208 L236 269" class="arrow"/><path d="M350 205 L452 269" class="arrow"/><path d="M205 337 V298 M205 301 L171 274 M205 301 L239 274" fill="none" stroke="#659b78" stroke-width="11"/><line x1="162" y1="267" x2="180" y2="282" stroke="#b65350" stroke-width="6"/><line x1="231" y1="282" x2="249" y2="267" stroke="#b65350" stroke-width="6"/><circle cx="478" cy="308" r="43" fill="#dbe9d7" stroke="#659b78" stroke-width="4"/><circle cx="479" cy="310" r="23" fill="#659b78"/><text x="205" y="385" text-anchor="middle" class="bold">Antibodies</text><text x="478" y="385" text-anchor="middle" class="bold">Memory cells</text></svg>
