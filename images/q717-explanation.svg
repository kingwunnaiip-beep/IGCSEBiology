<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">A gene’s message travels to a protein-building ribosome</title><desc id="desc">DNA is drawn inside a nucleus. An mRNA strand exits through the nucleus edge and reaches a two-subunit ribosome, where an amino-acid chain emerges.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">A gene’s message travels to a protein-building ribosome</text><circle cx="220" cy="310" r="150" fill="#e5edde" stroke="#24644b" stroke-width="4"/><text x="220" y="149" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">Nucleus</text><path d="M160.0 210 L220.0 210" fill="none" stroke="#537c9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="160.0" cy="210" r="5" fill="#24644b" stroke="#24644b" stroke-width="1"/><circle cx="220.0" cy="210" r="5" fill="#537c9a" stroke="#537c9a" stroke-width="1"/><path d="M181.52068272698568 234 L198.47931727301432 234" fill="none" stroke="#537c9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="181.52068272698568" cy="234" r="5" fill="#24644b" stroke="#24644b" stroke-width="1"/><circle cx="198.47931727301432" cy="234" r="5" fill="#537c9a" stroke="#537c9a" stroke-width="1"/><path d="M189.98720809124515 258 L190.01279190875485 258" fill="none" stroke="#537c9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="189.98720809124515" cy="258" r="5" fill="#24644b" stroke="#24644b" stroke-width="1"/><circle cx="190.01279190875485" cy="258" r="5" fill="#537c9a" stroke="#537c9a" stroke-width="1"/><path d="M180.2638