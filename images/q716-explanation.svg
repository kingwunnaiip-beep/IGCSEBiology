<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">An amino acid has both an amino and a carboxyl group</title><desc id="desc">The displayed glycine structure H2N–CH2–C(=O)–OH includes all central-carbon hydrogen bonds and the carboxyl carbon double bond to oxygen. The amino and carboxyl groups are highlighted.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">An amino acid has both an amino and a carboxyl group</text><ellipse cx="195" cy="310" rx="120" ry="85" fill="#e6efde" stroke="#24644b" stroke-width="2"/><ellipse cx="745" cy="310" rx="170" ry="150" fill="#e7edf0" stroke="#537c9a" stroke-width="2"/><text x="195" y="320" font-size="46" fill="#173f32" text-anchor="middle" font-weight="700">H₂N</text><text x="445" y="320" font-size="46" fill="#173f32" text-anchor="middle" font-weight="700">C</text><text x="445" y="180" font-size="36" fill="#173f32" text-anchor="middle" font-weight="400">H</text><text x="445" y="455" font-size="36" fill="#173f32" text-anchor="middle" font-weight="400">H</text><text x="665" y="320" font-size="46" fill="#173f32" text-anchor="middle" font-weight="700">C</text><text x="665" y="170" font-size="42" fill="#173f32" text-anchor="middle" font-weight="400">O</text><text x="855" y="320" font-size="42" fill="#173f32" text-anchor="middle" font-weight="400">OH</text><path d="M255 306 H410 M445 272 V205 M445 335 V414 M480 306 H625 M703 306 H803 M653 270 V188 M675 270 V188" fill="none" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="195" y="442" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">Amino group</text><text x="750" y="493" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">Carboxyl group</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">B: structure B is an amino acid</text></g></svg>