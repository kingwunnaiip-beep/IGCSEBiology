<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="t d"><title id="t">Xylem adds structural support to transport</title><desc id="d">A vascular bundle has outer phloem transporting sucrose and amino acids, and inner thick-walled xylem vessels transporting water and mineral ions and giving support.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#286c50" stroke-width="1.5"/></marker></defs><rect width="960" height="560" rx="20" fill="#fbf9ed"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="28" text-anchor="start" fill="#173f32">Xylem adds structural support to transport</text><rect x="65" y="110" width="340" height="330" rx="14" fill="#e0ecda" stroke="#286c50" stroke-width="3"/><text x="235" y="150" font-size="26" text-anchor="middle" fill="#173f32">Vascular bundle</text><rect x="125" y="190" width="220" height="70" rx="14" fill="#b4d396" stroke="#286c50" stroke-width="3"/><text x="235" y="235" font-size="23" text-anchor="middle" fill="#173f32">Phloem (outer)</text><circle cx="165" cy="330" r="28" fill="#fbf9ed" stroke="#286c50" stroke-width="11"/><circle cx="235" cy="330" r="28" fill="#fbf9ed" stroke="#286c50" stroke-width="11"/><circle cx="305" cy="330" r="28" fill="#fbf9ed" stroke="#286c50" stroke-width="11"/><text x="235" y="410" font-size="23" text-anchor="middle" fill="#173f32">Xylem (inner)</text><text x="470" y="180" font-size="26" text-anchor="start" fill="#173f32">Phloem transports:</text><text x="500" y="222" font-size="23" text-anchor="start" fill="#173f32">sucrose and amino acids</text><text x="470" y="300" font-size="26" text-anchor="start" fill="#173f32">Xylem transports:</text><text x="500" y="342" font-size="23" text-anchor="start" fill="#173f32">water and mineral ions</text><text x="470" y="410" font-size="26" text-anchor="start" fill="#173f32">Lignified xylem walls</text><text x="500" y="450" font-size="23" text-anchor="start" fill="#173f32">also support the stem.</text><text x="480" y="525" font-size="22" text-anchor="middle" fill="#173f32">Illustrative tissue layout; circles show thick-walled xylem vessels.</text></g></svg>