<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">The reflex pathway is R → P → Q</title><desc id="desc">A drawn spinal-cord cross-section connects a finger receptor through sensory neurone R, relay P and motor Q to a muscle effector.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="bluearrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="45" font-size="28" fill="#173f32" text-anchor="start" font-weight="bold">The reflex pathway is R → P → Q</text><text x="500" y="555" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">R sensory → P relay → Q motor carries the impulse from receptor to muscle.</text><defs><marker id="nerve-blue" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M2 2 L17 10 L2 18" fill="none" stroke="#537c9a" stroke-width="3"/></marker><marker id="nerve-orange" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M2 2 L17 10 L2 18" fill="none" stroke="#bc824b" stroke-width="3"/></marker><marker id="nerve-green" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M2 2 L17 10 L2 18" fill="none" stroke="#24644b" stroke-width="3"/></marker></defs><path d="M495 140 C350 120 340 260 370 315 C340 450 445 480 500 435 C560 480 665 440 630 315 C665 185 605 120 495 140 Z" fill="#e4f0df" stroke="#24644b" stroke-width="4" /><path d="M495 235 C420 170 410 245 455 300 C400 340 415 420 490 360 C565 425 590 350 540 305 C595 250 565 175 495 235 Z" fill="#c7d5c4" stroke="#24644b" stroke-width="2" /><ellipse cx="500" cy="307" rx="8" ry="8" fill="#fbf8eb" stroke="#24644b" stroke-width="2" /><path d="M80 405 Q120 360 175 405 L230 405 Q240 420 225 432 L100 432 Z" fill="#f2ddbc" stroke="#bc824b" stroke-width="3" /><polygon points="140,466 133,489 147,489" fill="#a9a9a0" stroke="#173f32" stroke-width="2"/><path d="M140 466 L140 435" fill="none" stroke="#173f32" stroke-width="2" /><path d="M140 410 C220 220 300 205 380 240 S450 270 470 290" fill="none" stroke="#537c9a" stroke-width="6" marker-end="url(#nerve-blue)" /><ellipse cx="350" cy="235" rx="11" ry="11" fill="#d9eaf1" stroke="#537c9a" stroke-width="2" /><path d="M470 290 Q510 275 525 330" fill="none" stroke="#bc824b" stroke-width="6" marker-end="url(#nerve-orange)" /><path d="M525 330 C620 410 720 405 778 365" fill="none" stroke="#24644b" stroke-width="6" marker-end="url(#nerve-green)" /><path d="M780 350 Q855 280 940 350 Q865 420 780 380 Z" fill="#f2ddbc" stroke="#bc824b" stroke-width="3" /><path d="M800 350 Q860 310 920 350" fill="none" stroke="#bc824b" stroke-width="1" /><path d="M800 360 Q860 320 920 350" fill="none" stroke="#bc824b" stroke-width="1" /><path d="M800 370 Q860 330 920 350" fill="none" stroke="#bc824b" stroke-width="1" /><path d="M800 380 Q860 340 920 350" fill="none" stroke="#bc824b" stroke-width="1" /><text x="185" y="180" font-size="25" fill="#537c9a" text-anchor="start" font-weight="bold">R: sensory</text><text x="500" y="120" font-size="23" fill="#173f32" text-anchor="middle" font-weight="normal">Spinal cord</text><text x="525" y="245" font-size="23" fill="#bc824b" text-anchor="start" font-weight="normal">P: relay</text><path d="M535 255 L505 293" fill="none" stroke="#bc824b" stroke-width="2" /><text x="680" y="455" font-size="25" fill="#173f32" text-anchor="start" font-weight="bold">Q: motor</text><text x="845" y="470" font-size="23" fill="#173f32" text-anchor="start" font-weight="normal">Muscle</text><text x="75" y="510" font-size="22" fill="#173f32" text-anchor="start" font-weight="normal">Receptor in finger</text></g></svg>