<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="q260-title q260-desc">
<title id="q260-title">Coronary arteries supply the heart muscle</title>
<desc id="q260-desc">The coronary artery labelled B runs on the outside of the heart and supplies its muscle with oxygenated blood. Fatty deposits can narrow its lumen, reducing blood flow and oxygen delivery. This can limit aerobic respiration in the heart muscle.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="720" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Coronary arteries supply the heart muscle</text><text x="285" y="135" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Open artery</text><circle cx="285" cy="285" r="113" fill="#eac3b1" stroke="#b94a43" stroke-width="6"/><circle cx="285" cy="285" r="83" fill="#e9f1f7" stroke="#b94a43" stroke-width="4"/><line x1="230" y1="285" x2="343" y2="285" stroke="#357ca2" stroke-width="8"/><polygon points="343,285 329.6950761583107,291.92668763312224 329.6950761583107,278.07331236687776" fill="#357ca2"/><text x="285" y="440" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Blood passes through the lumen</text><text x="835" y="135" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Narrowed coronary artery</text><circle cx="835" cy="285" r="113" fill="#eac3b1" stroke="#b94a43" stroke-width="6"/><circle cx="835" cy="285" r="83" fill="#e9f1f7" stroke="#b94a43" stroke-width="4"/><circle cx="835" cy="285" r="83" fill="#daa958" stroke="#b94a43" stroke-width="3"/><ellipse cx="840" cy="282" rx="29" ry="20" fill="#e9f1f7" stroke="#357ca2" stroke-width="2"/><text x="835" y="440" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Fatty deposit restricts blood flow</text><line x1="835" y1="470" x2="835" y2="495" stroke="#25614b" stroke-width="4"/><polygon points="835,495 828.0733123668778,481.6950761583107 841.9266876331222,481.6950761583107" fill="#25614b"/><rect x="385" y="500" width="680" height="145" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="725.0" y="540" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Less oxygen for the heart muscle</text><text x="725.0" y="582" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Less aerobic respiration;</text><text x="725.0" y="615" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >less energy for contraction.</text><text x="165" y="555" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >B identifies the</text><text x="165" y="592" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >coronary artery.</text><text x="560" y="680" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Cross-sections are explanatory schematics, not measured artery dimensions.</text>
</g></svg>