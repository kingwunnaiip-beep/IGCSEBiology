<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Herbicide runoff can harm aquatic plants</title><desc id="desc">Herbicide applied to field weeds reduces their growth. A runoff arrow carries the same chemical toward a lake, where aquatic plants are also harmed. Cross symbols indicate growth suppression, not quantitative mortality measurements.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2e7656"/></marker></defs><rect width="1000" height="620" rx="24" fill="#fbf9ec"/><g font-family="sans-serif" fill="#173e32"><text x="42" y="55" font-size="31" text-anchor="start" fill="#173e32">Herbicide runoff can harm aquatic plants</text><rect x="35" y="125" width="410" height="365" rx="18" fill="#e4efdf" stroke="#548269" stroke-width="2"/><rect x="555" y="125" width="410" height="365" rx="18" fill="#deece7" stroke="#548269" stroke-width="2"/><text x="240" y="168" font-size="27" text-anchor="middle" fill="#173e32">FIELD</text><text x="760" y="168" font-size="27" text-anchor="middle" fill="#173e32">LAKE</text><path d="M105 380V285 M105 333Q55 290 70 278 M105 355Q155 310 140 300" stroke="#3d8057" stroke-width="8" fill="none"/><path d="M82 242L128 288 M128 242L82 288" stroke="#aa6545" stroke-width="6"/><path d="M200 380V285 M200 333Q150 290 165 278 M200 355Q250 310 235 300" stroke="#3d8057" stroke-width="8" fill="none"/><path d="M177 242L223 288 M223 242L177 288" stroke="#aa6545" stroke-width="6"/><path d="M295 380V285 M295 333Q245 290 260 278 M295 355Q345 310 330 300" stroke="#3d8057" stroke-width="8" fill="none"/><path d="M272 242L318 288 M318 242L272 288" stroke="#aa6545" stroke-width="6"/><path d="M650 380V285 M650 333Q600 290 615 278 M650 355Q700 310 685 300" stroke="#3d8057" stroke-width="8" fill="none"/><path d="M627 242L673 288 M673 242L627 288" stroke="#aa6545" stroke-width="6"/><path d="M745 380V285 M745 333Q695 290 710 278 M745 355Q795 310 780 300" stroke="#3d8057" stroke-width="8" fill="none"/><path d="M722 242L768 288 M768 242L722 288" stroke="#aa6545" stroke-width="6"/><path d="M840 380V285 M840 333Q790 290 805 278 M840 355Q890 310 875 300" stroke="#3d8057" stroke-width="8" fill="none"/><path d="M817 242L863 288 M863 242L817 288" stroke="#aa6545" stroke-width="6"/><path d="M580 225Q630 209 680 225T780 225T940 225" stroke="#628fa1" stroke-width="5" fill="none"/><text x="240" y="441" font-size="25" text-anchor="middle" fill="#173e32">Less weed growth</text><text x="760" y="441" font-size="23" text-anchor="middle" fill="#173e32">Less aquatic plant growth</text><path d="M450 235 L550 235" fill="none" stroke="#2e7656" stroke-width="5" marker-end="url(#arrow)"/><text x="500" y="204" font-size="20" text-anchor="middle" fill="#173e32">runoff</text><text x="240" y="112" font-size="23" text-anchor="middle" fill="#173e32">Herbicide applied</text><text x="500" y="547" font-size="24" text-anchor="middle" fill="#173e32">The plant-suppressing chemical can reach unintended plants.</text><text x="500" y="590" font-size="22" text-anchor="middle" fill="#173e32">Herbicide action is different from fertiliser nutrient enrichment.</text></g></svg>