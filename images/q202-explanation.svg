<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1210" viewBox="0 0 1000 1210" role="img" aria-labelledby="q202-title q202-desc">
<title id="q202-title">202 · Chewing and churning are physical digestion</title>
<desc id="q202-desc">Answer B, sites 1 and 2 only. The original source labels identify 1 mouth, 2 stomach, 3 pancreas and 4 large intestine. Physical digestion breaks food into smaller pieces without chemically changing its molecules. A qualitative particle model shows a large piece of food becoming smaller pieces of the same material; symbol counts are illustrative. Teeth chew at the mouth and muscular stomach action churns food. The pancreas secretes digestive enzymes, and the large intestine mainly absorbs water and forms faeces. The boxes interpret source labels; they do not redraw the original anatomy.</desc>
