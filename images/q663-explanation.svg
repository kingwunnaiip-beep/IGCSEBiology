<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Natural selection favours helpful inherited variation</title><desc id="desc">Two giraffes have different inherited neck lengths; the longer-necked giraffe reaches a high tree canopy and gains a feeding advantage.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">Natural selection favours helpful inherited variation</text><path d="M730 470 L750 190 L810 190 L820 470" fill="#a58d65" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="705" cy="190" r="65" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><circle cx="770" cy="155" r="65" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><circle cx="840" cy="190" r="65" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><circle cx="790" cy="230" r="65" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><g transform="translate(510 365) scale(1.3)"><ellipse cx="0" cy="0" rx="55" ry="28" fill="#d7bd7f" stroke="#24644b" stroke-width="3"/><path d="M20 -10 L30 -120 L53 -120 L50 -5" fill="#d7bd7f" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="60" cy="-128" rx="33" ry="17" fill="#d7bd7f" stroke="#24644b" stroke-width="3"/><path d="M-35 18 L-40 100" fill="none" stroke="#24644b" stroke-width="7"/><path d="M35 18 L40 100" fill="none" stroke="#24644b" stroke-width="7"/><path d="M55 -143 L55 -160" fill="none" stroke="#24644b" stroke-width="4"/><path d="M70 -143 L70 -160" fill="none" stroke="#24644b" stroke-width="4"/><circle cx="-25" cy="-4" r="5" fill="#967441" stroke="none" stroke-width="0"/><circle cx="5" cy="8" r="5" fill="#967441" stroke="none" stroke-width="0"/><circle cx="40" cy="-40" r="5" fill="#967441" stroke="none" stroke-width="0"/><circle cx="41" cy="-85" r="5" fill="#967441" stroke="none" stroke-width="0"/></g><g transform="translate(210 365) scale(1.3)"><ellipse cx="0" cy="0" rx="55" ry="28" fill="#d7bd7f" stroke="#24644b" stroke-width="3"/><path d="M20 -10 L30 -60 L53 -60 L50 -5" fill="#d7bd7f" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="60" cy="-68" rx="33" ry="17" fill="#d7bd7f" stroke="#24644b" stroke-width="3"/><path d="M-35 18 L-40 100" fill="none" stroke="#24644b" stroke-width="7"/><path d="M35 18 L40 100" fill="none" stroke="#24644b" stroke-width="7"/><path d="M55 -83 L55 -100" fill="none" stroke="#24644b" stroke-width="4"/><path d="M70 -83 L70 -100" fill="none" stroke="#24644b" stroke-width="4"/><circle cx="-25" cy="-4" r="5" fill="#967441" stroke="none" stroke-width="0"/><circle cx="40" cy="-40" r="5" fill="#967441" stroke="none" stroke-width="0"/></g><text x="190" y="145" font-size="25" text-anchor="middle" fill="#173f32" font-weight="bold">Inherited variation</text><text x="180" y="225" font-size="23" text-anchor="middle" fill="#173f32">Shorter neck</text><text x="505" y="145" font-size="23" text-anchor="middle" fill="#173f32">Longer neck</text><path d="M590 190 L675 170" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="650" y="530" font-size="24" text-anchor="middle" fill="#173f32">Better feeding → survival and reproduction</text><text x="500" y="565" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">D: natural selection; humans do not choose the parents.</text></g></svg>