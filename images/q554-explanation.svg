<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">A flat population can still contain cell turnover</title><desc id="desc">A yeast biomass curve rises, remains flat between roughly days8 and10, then falls. Day9 lies on the flat interval. A balance diagram shows formation of new cells equals death while the population remains stationary; cell turnover can continue.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#32745a" stroke-width="1.5"/></marker></defs><rect width="1000" height="620" rx="22" fill="#faf8e9"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="54" font-size="30" text-anchor="start" fill="#183f35" font-weight="bold">A flat population can still contain cell turnover</text><path d="M105 405 L900 405" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><path d="M105 405 L105 135" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><path d="M105 395 C230 395 270 375 330 260 S440 160 525 160 H680 Q725 165 840 260" stroke="#32745a" stroke-width="5" fill="none" /><path d="M605 160 V405" stroke="#84a18a" stroke-width="2" fill="none" stroke-dasharray="8 8"/><text x="605" y="440" font-size="22" text-anchor="middle" fill="#183f35" font-weight="normal">day 9</text><text x="45" y="280" font-size="22" text-anchor="middle" transform="rotate(-90 45 280)">Biomass</text><text x="875" y="440" font-size="22" text-anchor="start" fill="#183f35" font-weight="normal">Time</text><rect x="440" y="80" width="340" height="68" rx="18" fill="#e4f0dc" stroke="#32745a" stroke-width="2"/><text x="610.0" y="116" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">Stationary interval</text><rect x="80" y="495" width="350" height="78" rx="18" fill="#e4f0dc" stroke="#32745a" stroke-width="2"/><text x="255.0" y="531" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">New cells formed</text><text x="500" y="545" font-size="40" text-anchor="middle" fill="#183f35" font-weight="normal">=</text><rect x="570" y="495" width="350" height="78" rx="18" fill="#e4f0dc" stroke="#32745a" stroke-width="2"/><text x="745.0" y="531" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">Cells dying</text><text x="500" y="605" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">Zero net growth does not mean zero cell division.</text></g></svg>