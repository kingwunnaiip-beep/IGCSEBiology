<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="810" viewBox="0 0 1120 810" role="img" aria-labelledby="q313-title q313-desc">
<title id="q313-title">Rolled, hairy leaves conserve water</title>
<desc id="q313-desc">A qualitative cross-section of a rolled xerophyte leaf shows hairs projecting into a sheltered humid air space around stomata. Reduced air movement and higher humidity lower the water-vapour gradient and reduce transpiration.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="810" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Rolled, hairy leaves conserve water</text><path d="M 300 150 C 120 150 80 330 160 470 C 240 610 470 600 545 455 C 625 305 510 160 365 150 L 360 187 C 490 195 570 320 510 438 C 450 548 270 560 195 450 C 120 340 165 210 305 187 Z" fill="#cce1d2" stroke="#25614b" stroke-width="4"/><line x1="196" y1="265" x2="240" y2="290" stroke="#25614b" stroke-width="5"/><line x1="174" y1="330" x2="225" y2="335" stroke="#25614b" stroke-width="5"/><line x1="198" y1="423" x2="245" y2="397" stroke="#25614b" stroke-width="5"/><line x1="280" y1="525" x2="293" y2="475" stroke="#25614b" stroke-width="5"/><line x1="390" y1="519" x2="375" y2="470" stroke="#25614b" stroke-width="5"/><line x1="488" y1="435" x2="445" y2="404" stroke="#25614b" stroke-width="5"/><line x1="535" y1="330" x2="485" y2="332" stroke="#25614b" stroke-width="5"/><line x1="491" y1="244" x2="450" y2="272" stroke="#25614b" stroke-width="5"/><ellipse cx="300" cy="199" rx="14" ry="6" fill="#357ca2" stroke="#357ca2" stroke-width="3"/><ellipse cx="365" cy="199" rx="14" ry="6" fill="#357ca2" stroke="#357ca2" stroke-width="3"/><text x="339" y="305" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Sheltered air</text><text x="339" y="345" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >around stomata</text><text x="339" y="385" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >becomes humid</text><text x="320" y="650" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Schematic section of a rolled leaf</text><line x1="589" y1="330" x2="740" y2="330" stroke="#526c62" stroke-width="3"/><text x="760" y="340" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >hairs</text><line x1="589" y1="330" x2="485" y2="332" stroke="#526c62" stroke-width="3"/><text x="700" y="460" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Less air movement</text><text x="700" y="502" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >+ humid trapped air</text><text x="700" y="544" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >↓</text><text x="700" y="586" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Smaller water-vapour gradient</text><text x="700" y="628" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >↓</text><text x="700" y="670" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Slower transpiration</text><rect x="24" y="734" width="1072" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="560.0" y="768" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Leaves rolled up and covered with hairs → option B</text>
</g></svg>