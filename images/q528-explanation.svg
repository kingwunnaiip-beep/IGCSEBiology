<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="q528-title q528-desc"><title id="q528-title">Xylem links root uptake to the rest of the plant</title><desc id="q528-desc">A schematic dicot root cross-section shows central star-shaped xylem. An enlarged longitudinal xylem vessel is hollow with thickened walls and an upward arrow for water and dissolved mineral ions. Not to scale.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#36785e"/></marker></defs><rect x="0" y="0" width="900" height="500" rx="22" fill="#fbf7e9"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="46" font-size="27" text-anchor="start" fill="#183e35"><tspan x="35" dy="0">Xylem links root uptake to the rest of the plant</tspan></text><circle cx="230" cy="248" r="133" fill="#e6ecd6" stroke="#36785e" stroke-width="2"/><circle cx="230" cy="248" r="85" fill="#d1dfc7" stroke="#36785e" stroke-width="2"/><path d="M230 167 L251 225 L311 248 L251 270 L230 329 L208 270 L149 248 L208 225 Z" stroke="#36785e" stroke-width="3" fill="#aecfdd" stroke-linejoin="round" stroke-linecap="round"/><circle cx="230" cy="199" r="13" fill="#fbf7e9" stroke="#36785e" stroke-width="2"/><circle cx="230" cy="247" r="13" fill="#fbf7e9" stroke="#36785e" stroke-width="2"/><circle cx="230" cy="292" r="13" fill="#fbf7e9" stroke="#36785e" stroke-width="2"/><circle cx="186" cy="248" r="13" fill="#fbf7e9" stroke="#36785e" stroke-width="2"/><circle cx="275" cy="248" r="13" fill="#fbf7e9" stroke="#36785e" stroke-width="2"/><text x="230" y="414" font-size="23" text-anchor="middle" fill="#183e35"><tspan x="230" dy="0">Root cross-section</tspan></text><path d="M335 248 L485 248" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="407" y="218" font-size="23" text-anchor="middle" fill="#183e35"><tspan x="407" dy="0">xylem</tspan></text><path d="M545 130 L545 365 M650 130 L650 365" stroke="#36785e" stroke-width="14" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M545 143 L557 143 M638 143 L650 143" stroke="#36785e" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M545 176 L557 176 M638 176 L650 176" stroke="#36785e" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M545 209 L557 209 M638 209 L650 209" stroke="#36785e" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M545 242 L557 242 M638 242 L650 242" stroke="#36785e" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M545 275 L557 275 M638 275 L650 275" stroke="#36785e" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M545 308 L557 308 M638 308 L650 308" stroke="#36785e" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M545 341 L557 341 M638 341 L650 341" stroke="#36785e" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M595 325 L595 173" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="690" y="194" font-size="22" text-anchor="start" fill="#183e35"><tspan x="690" dy="0">Water and</tspan><tspan x="690" dy="29">mineral ions</tspan><tspan x="690" dy="29">move upwards</tspan></text><text x="600" y="414" font-size="23" text-anchor="middle" fill="#183e35"><tspan x="600" dy="0">Hollow conducting vessel</tspan></text><text x="450" y="473" font-size="22" text-anchor="middle" fill="#183e35"><tspan x="450" dy="0">Mature xylem vessels are dead; their walls also provide support.</tspan></text></g></svg>