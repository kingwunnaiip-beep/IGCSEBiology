<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which conclusions about pollination V and W are correct?</title><desc id="desc">V: self-pollination: Sexual reproduction; offspring are not necessarily clones; W: cross-pollination: Combines genetic information from different plants; Inherited variation: Increases the potential to adapt to environmental change</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Which conclusions about pollination V and W are correct?</text><text x="38" y="106" font-size="18" font-weight="400">Conclusions 2 and 3 are correct; conclusion 1 is false.</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="50" y="190" font-size="23" font-weight="700">V: self-pollination</text><text x="50" y="276" font-size="21" font-weight="400">Sexual reproduction;</text><text x="50" y="303" font-size="21" font-weight="400">offspring are not necessarily</text><text x="50" y="330" font-size="21" font-weight="400">clones</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="405" y="190" font-size="23" font-weight="700">W: cross-pollination</text><text x="405" y="276" font-size="21" font-weight="400">Combines genetic</text><text x="405" y="303" font-size="21" font-weight="400">information from different</text><text x="405" y="330" font-size="21" font-weight="400">plants</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="760" y="190" font-size="23" font-weight="700">Inherited variation</text><text x="760" y="276" font-size="21" font-weight="400">Increases the potential to</text><text x="760" y="303" font-size="21" font-weight="400">adapt to environmental</text><text x="760" y="330" font-size="21" font-weight="400">change</text><path d="M700 245 H731" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)"/><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>