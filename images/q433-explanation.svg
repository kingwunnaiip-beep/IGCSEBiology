<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Trophic levels are feeding positions</title><desc id="desc">Grass, rabbit and fox form a food chain. Their trophic levels are one, two and three respectively. Arrows show food and energy transfer between positions; a trophic level is the position itself.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#39725b"/></marker></defs><rect width="1100" height="560" rx="22" fill="#fbf8e9"/><g font-family="Arial, sans-serif"><text x="40" y="55" font-size="30" text-anchor="start" fill="#173d31">Trophic levels are feeding positions</text><rect x="45" y="155" width="290" height="145" rx="15" fill="#e4edcf" stroke="#39725b" stroke-width="3"/><text x="190.0" y="197" font-size="25" text-anchor="middle" fill="#173d31">Grass</text><text x="190.0" y="229" font-size="25" text-anchor="middle" fill="#173d31">Producer</text><text x="190" y="350" font-size="30" text-anchor="middle" fill="#173d31">Level 1</text><rect x="405" y="155" width="290" height="145" rx="15" fill="#e4edcf" stroke="#39725b" stroke-width="3"/><text x="550.0" y="197" font-size="25" text-anchor="middle" fill="#173d31">Rabbit</text><text x="550.0" y="229" font-size="25" text-anchor="middle" fill="#173d31">Primary consumer</text><text x="550" y="350" font-size="30" text-anchor="middle" fill="#173d31">Level 2</text><rect x="765" y="155" width="290" height="145" rx="15" fill="#e4edcf" stroke="#39725b" stroke-width="3"/><text x="910.0" y="197" font-size="25" text-anchor="middle" fill="#173d31">Fox</text><text x="910.0" y="229" font-size="25" text-anchor="middle" fill="#173d31">Secondary consumer</text><text x="910" y="350" font-size="30" text-anchor="middle" fill="#173d31">Level 3</text><path d="M345 225 L395 225" fill="none" stroke="#39725b" stroke-width="5" marker-end="url(#arrow)"/><path d="M705 225 L755 225" fill="none" stroke="#39725b" stroke-width="5" marker-end="url(#arrow)"/><text x="550" y="425" font-size="25" text-anchor="middle" fill="#173d31">Arrows: transfer of food and energy</text><text x="550" y="480" font-size="28" text-anchor="middle" fill="#173d31">Trophic level = an organism’s feeding position</text><text x="40" y="530" font-size="17" text-anchor="start" fill="#536b57">Original teaching schematic • qualitative, not to scale</text></g></svg>