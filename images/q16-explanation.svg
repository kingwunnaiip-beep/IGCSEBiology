<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-labelledby="q16-title q16-desc"><title id="q16-title">Iron and vitamins support blood and healthy tissues</title><desc id="q16-desc">Iron, a mineral ion, is needed to make haemoglobin. Vitamin C prevents scurvy. Vitamin D, with calcium, supports bone mineralisation and prevents rickets.</desc><defs><marker id="a-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#25614b"/></marker><marker id="a-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#357ca2"/></marker><marker id="a-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b94a43"/></marker><marker id="a-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d5a545"/></marker></defs><rect width="640" height="460" rx="20" fill="#fffdf7"/><g font-family="Arial, Helvetica, sans-serif"><text x="320" y="43" font-size="32" fill="#173d31" text-anchor="middle" font-weight="700">Mineral ions + vitamins</text><rect x="24" y="80" width="592" height="108" rx="16" fill="#e8f1e5"/><rect x="24" y="202" width="592" height="108" rx="16" fill="#e8f1e5"/><rect x="24" y="324" width="592" height="108" rx="16" fill="#e8f1e5"/><circle cx="80" cy="134" r="32" fill="#e0ba8c" stroke="#25614b" stroke-width="3"/><text x="80" y="145" font-size="34" fill="#173d31" text-anchor="middle" font-weight="700">Fe</text><text x="193" y="145" font-size="30" fill="#173d31" text-anchor="middle" font-weight="700">Iron</text><path d="M264 134 L321 134" fill="none" stroke="#25614b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-g)"/><ellipse cx="368" cy="133" rx="29" ry="19" fill="#b94a43"/><ellipse cx="368" cy="133" rx="14" ry="9" fill="#e6aaa4"/><text x="494" y="129" font-size="28" fill="#173d31" text-anchor="middle" font-weight="500">Makes</text><text x="494" y="164" font-size="28" fill="#173d31" text-anchor="middle" font-weight="500">haemoglobin</text><circle cx="80" cy="256" r="32" fill="#f0bf58" stroke="#25614b" stroke-width="3"/><path d="M80 256 L80 234" fill="none" stroke="#fffdf7" stroke-width="3"/><path d="M80 256 L102 256" fill="none" stroke="#fffdf7" stroke-width="3"/><path d="M80 256 L80 278" fill="none" stroke="#fffdf7" stroke-width="3"/><path d="M80 256 L58 256" fill="none" stroke="#fffdf7" stroke-width="3"/><text x="193" y="267" font-size="28" fill="#173d31" text-anchor="middle" font-weight="700">Vitamin C</text><path d="M277 256 L332 256" fill="none" stroke="#25614b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-g)"/><text x="479" y="267" font-size="28" fill="#173d31" text-anchor="middle" font-weight="500">Prevents scurvy</text><path d="M65 365 C48 348 39 368 55 380 L55 389 C39 404 57 421 69 403 H86 C99 421 117 403 100 389 V380 C117 365 98 347 86 365 Z" fill="#f6f0d7" stroke="#25614b" stroke-width="3"/><text x="208" y="385" font-size="28" fill="#173d31" text-anchor="middle" font-weight="700">Vitamin D</text><text x="208" y="418" font-size="28" fill="#173d31" text-anchor="middle" font-weight="500">+ calcium</text><path d="M295 378 L344 378" fill="none" stroke="#25614b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-g)"/><text x="483" y="389" font-size="28" fill="#173d31" text-anchor="middle" font-weight="500">Prevents rickets</text></g></svg>