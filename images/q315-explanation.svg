<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="q315-title q315-desc">
<title id="q315-title">DNA is evidence of evolutionary relationships</title>
<desc id="q315-desc">A shared ancestor passes DNA to descendant species. Comparing equivalent DNA base sequences in bonobos and chimpanzees gives direct molecular evidence; greater similarity generally supports closer relatedness.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
