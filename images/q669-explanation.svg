<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Receiving antibodies differs from making your own</title><desc id="desc">Mother and baby with transferred milk antibodies illustrate passive protection. A syringe with vaccine antigens activates a lymphocyte that forms antibodies and memory cells.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">Receiving antibodies differs from making your own</text><circle cx="150" cy="200" r="40" fill="#e8cbb5" stroke="#24644b" stroke-width="3"/><path d="M95 400 L105 265 Q150 220 195 265 L225 400 Z" fill="#e4f0df" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="245" cy="320" r="27" fill="#e8cbb5" stroke="#24644b" stroke-width="3"/><ellipse cx="215" cy="355" rx="58" ry="25" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><g transform="translate(270 240) scale(0.8)"><path d="M0 28 L0 0 M0 0 L-18 -20 M0 0 L18 -20" fill="none" stroke="#b28298" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M300 250 L265 300" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="250" y="125" font-size="27" text-anchor="middle" fill="#173f32" font-weight="bold">Passive immunity</text><text x="245" y="475" font-size="23" text-anchor="middle" fill="#173f32">Breast milk transfers antibodies</text><text x="245" y="510" font-size="23" text-anchor="middle" fill="#173f32">Temporary; no memory formed</text><path d="M500 115 L500 520" fill="none" stroke="#537c9a" stroke-width="2"/><g transform="translate(625 220) 