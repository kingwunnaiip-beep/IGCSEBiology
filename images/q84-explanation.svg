<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1130" viewBox="0 0 1000 1130" role="img" aria-labelledby="q84-title q84-desc">
<title id="q84-title">84 · Follow the nitrogen conversions</title>
<desc id="q84-desc">Answer D. Process X is nitrification: ammonia or ammonium compounds are oxidised first to nitrite and then to nitrate ions by nitrifying bacteria under aerobic conditions. Process Y is denitrification: nitrate ions are converted to nitrogen gas by denitrifying bacteria, commonly in low-oxygen waterlogged soils. Nitrification and denitrification are different from nitrogen fixation and ammonification.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
