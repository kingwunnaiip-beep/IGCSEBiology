<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1130" viewBox="0 0 1000 1130" role="img" aria-labelledby="q226-title q226-desc">
<title id="q226-title">226 · Deamination removes the amino group</title>
<desc id="q226-desc">A general amino-acid model has a central carbon bonded to hydrogen, an R side group, an amino group NH2 and a carboxyl group COOH. The nitrogen-containing amino group is highlighted. During deamination of excess amino acids in the liver, the nitrogen-containing part is removed; the nitrogen is converted to urea. The remaining carbon-containing part may be used in respiration. Arrows show the fate of parts, not a balanced chemical equation or molecular scale. Answer B.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1130" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >226 · Deamination removes the amino group</text><text x="500" y="111" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >The amino group contains the nitrogen.</text><rect x="85" y="159" width="830" height="397" rx="12" fill="#edf5f8" stroke="none" stroke-width="2"/><text x="500" y="205" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >General amino acid · qualitative structural model</text><circle cx="500" cy="350" r="37" fill="#fffdf7" stroke="#25614b" stroke-width="3"/><text x="500" y="361" font-size="32" fill="#173d31" font-weight="700" text-anchor="middle" >C</text><text x="500" y="265" font-size="29" fill="#173d31" font-weight="400" text-anchor="middle" >H</text><line x1="500" y1="279" x2="500" y2="312" stroke="#25614b" stroke-width="3"/><text x="500" y="477" font-size="29" fill="#173d31" font-weight="400" text-anchor="middle" >R</text><line x1="500" y1="389" x2="500" y2="440" stroke="#25614b" stroke-width="3"/><line x1="385" y1="350" x2="460" y2="350" stroke="#b94a43" stroke-width="4"/><line x1="540" y1="350" x2="620" y2="350" stroke="#25614b" stroke-width="3"/><rect x="220" y="307" width="165" height="85" rx="12" fill="#f8e6da" stroke="#b94a43" stroke-width="2"/><text x="302" y="362" font-size="32" fill="#b94a43" font-weight="700" text-anchor="middle" >NH₂</text><text x="705" y="361" font-size="29" fill="#173d31" font-weight="400" text-anchor="middle" >COOH</text><text x="302" y="437" font-size="25" fill="#b94a43" font-weight="700" text-anchor="middle" >Amino group</text><text x="500" y="520" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >R represents the variable side group.</text><line x1="302" y1="573" x2="302" y2="637" stroke="#b94a43" stroke-width="5"/><polygon points="302,637 295.07331236687776,623.6950761583107 308.92668763312224,623.6950761583107" fill="#b94a43"/><line x1="710" y1="573" x2="710" y2="637" stroke="#357ca2" stroke-width="5"/><polygon points="710,637 703.0733123668778,623.6950761583107 716.9266876331222,623.6950761583107" fill="#357ca2"/><rect x="65" y="660" width="445" height="174" rx="12" fill="#f8e6da" stroke="#b94a43" stroke-width="2"/><text x="287.5" y="701" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Nitrogen-containing part</text><text x="287.5" y="744" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Removed during deamination</text><text x="287.5" y="781" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Nitrogen is converted to urea</text><rect x="545" y="660" width="390" height="174" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="740.0" y="701" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Carbon-containing part</text><text x="740.0" y="744" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Remains after removal</text><text x="740.0" y="781" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Can enter respiration</text><text x="500" y="900" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Excess amino acids are deaminated in the liver.</text><text x="500" y="938" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >This pathway is separate from protein digestion in the gut.</text><text x="500" y="976" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Part-fate arrows; not a balanced reaction equation.</text><rect x="24" y="1054" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1088" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer B · The nitrogen-containing part</text>
</g></svg>