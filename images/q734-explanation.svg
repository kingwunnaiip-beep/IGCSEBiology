<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">How does deforestation affect flooding, soil loss and transpiration?</title><desc id="desc">Deforestation separately increases runoff and soil erosion through lost interception, uptake and root binding, and decreases total transpiration because fewer leaves remain. This is row D.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700" text-anchor="start" fill="#193e34">How does deforestation affect flooding, soil loss and transpiration?</text><rect x="30" y="185" width="290" height="125" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="175" y="226" font-size="25" font-weight="700" text-anchor="middle" fill="#193e34">Trees removed</text><text x="175" y="274" font-size="22" font-weight="400" text-anchor="middle" fill="#193e34">Deforestation</text><rect x="425" y="120" width="625" height="115" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="450" y="155" font-size="22" font-weight="700" text-anchor="start" fill="#193e34">Less interception, uptake and root binding</text><text x="450" y="190" font-size="22" font-weight="400" text-anchor="start" fill="#193e34">More runoff and erosion:</text><text x="450" y="219" font-size="22" font-weight="400" text-anchor="start" fill="#193e34">flooding ↑ and soil loss ↑</text><rect x="425" y="265" width="625" height="105" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="450" y="303" font-size="23" font-weight="700" text-anchor="start" fill="#193e34">Fewer leaves remain</text><text x="450" y="340" font-size="23" font-weight="400" text-anchor="start" fill="#193e34">Total transpiration ↓</text><path d="M320 247 H370 M370 177 V317" fill="none" stroke="#35735e" stroke-width="3"/><path d="M370 177 H415" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)"/><path d="M370 317 H415" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)"/><text x="38" y="406" font-size="17" font-weight="400" text-anchor="start" fill="#193e34">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>