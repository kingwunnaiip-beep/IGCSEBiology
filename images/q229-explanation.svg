<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1130" viewBox="0 0 1000 1130" role="img" aria-labelledby="q229-title q229-desc">
<title id="q229-title">229 · A small population has few total births</title>
<desc id="q229-desc">In the population model used by the source question, the lag phase is initial slow growth because the starting population is small and contains few reproducing individuals. That limits the total number of births per unit time, without requiring low fertility per individual. A qualitative pathway distinguishes later waste limitation, stationary births equal deaths, and death-phase deaths exceed births. No population values, counts, time scale or growth rates are invented. Answer B.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1130" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >229 · A small population has few total births</text><text x="500" y="111" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Use the source’s initial-population explanation.</text><rect x="95" y="166" width="810" height="138" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="207" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Small starting population</text><text x="500.0" y="250" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Few individuals are available to reproduce.</text><line x1="500" y1="316" x2="500" y2="339" stroke="#25614b" stroke-width="4"/><polygon points="500,339 493.07331236687776,325.6950761583107 506.92668763312224,325.6950761583107" fill="#25614b"/><rect x="95" y="351" width="810" height="138" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="392" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Low total birth rate</text><text x="500.0" y="435" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Few births occur per unit time at the start.</text><line x1="500" y1="501" x2="500" y2="524" stroke="#25614b" stroke-width="4"/><polygon points="500,524 493.07331236687776,510.6950761583107 506.92668763312224,510.6950761583107" fill="#25614b"/><rect x="95" y="536" width="810" height="138" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="577" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Slow initial population growth</text><text x="500.0" y="620" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >This is the lag phase in the source model.</text><text x="500" y="758" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Do not confuse the later explanations.</text><rect x="65" y="800" width="270" height="159" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="200.0" y="841" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Waste build-up</text><text x="200.0" y="884" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Later restriction</text><text x="200.0" y="921" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >of growth</text><rect x="365" y="800" width="270" height="159" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="841" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Births = deaths</text><text x="500.0" y="884" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Stationary</text><text x="500.0" y="921" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >population</text><rect x="665" y="800" width="270" height="159" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="800.0" y="841" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Deaths &gt; births</text><text x="800.0" y="884" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Population</text><text x="800.0" y="921" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >decreases</text><text x="500" y="1012" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Low total births does not imply low fertility per individual.</text><rect x="24" y="1054" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1088" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer B · Low population size limits the total birth rate</text>
</g></svg>