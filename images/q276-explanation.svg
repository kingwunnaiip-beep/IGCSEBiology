<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="q276-title q276-desc">
<title id="q276-title">Why the heart is an organ</title>
<desc id="q276-desc">The sequence is cardiac muscle cell, cardiac muscle tissue, heart organ, and circulatory organ system. Different tissues, including muscle, nervous and connective tissue, work together in the heart to pump blood.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="700" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Why the heart is an organ</text><rect x="45" y="120" width="215" height="220" rx="12" fill="#ffffff" stroke="#25614b" stroke-width="2"/><text x="152.5" y="160" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Cell</text><text x="152.5" y="202" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >One cardiac</text><text x="152.5" y="236" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >muscle cell</text><rect x="310" y="120" width="215" height="220" rx="12" fill="#ffffff" stroke="#25614b" stroke-width="2"/><text x="417.5" y="160" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Tissue</text><text x="417.5" y="202" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Many cardiac</text><text x="417.5" y="236" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >muscle cells</text><rect x="575" y="120" width="215" height="220" rx="12" fill="#ffffff" stroke="#25614b" stroke-width="2"/><text x="682.5" y="160" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Organ</text><text x="682.5" y="202" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >The heart:</text><text x="682.5" y="236" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >several tissues</text><rect x="840" y="120" width="215" height="220" rx="12" fill="#ffffff" stroke="#25614b" stroke-width="2"/><text x="947.5" y="160" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Organ system</text><text x="947.5" y="202" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Heart + blood</text><text x="947.5" y="236" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >vessels</text><line x1="266" y1="225" x2="304" y2="225" stroke="#25614b" stroke-width="4"/><polygon points="304,225 290.6950761583107,231.92668763312224 290.6950761583107,218.07331236687776" fill="#25614b"/><line x1="531" y1="225" x2="569" y2="225" stroke="#25614b" stroke-width="4"/><polygon points="569,225 555.6950761583107,231.92668763312224 555.6950761583107,218.07331236687776" fill="#25614b"/><line x1="796" y1="225" x2="834" y2="225" stroke="#25614b" stroke-width="4"/><polygon points="834,225 820.6950761583107,231.92668763312224 820.6950761583107,218.07331236687776" fill="#25614b"/><rect x="80" y="390" width="940" height="175" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550" y="433" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Several tissues cooperate in one structure</text><text x="550" y="478" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Muscle contracts; nervous tissue carries signals;</text><text x="550" y="511" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >connective tissue provides support.</text><text x="550" y="544" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Together these tissues enable the heart to pump blood.</text><rect x="24" y="624" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="658" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >The heart is an organ within the circulatory system.</text>
</g></svg>