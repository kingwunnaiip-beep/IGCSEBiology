<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Building muscle is an anabolic process</title><desc id="desc">Separate amino acid circles are joined into a chain representing a muscle protein, then arranged in muscle fibres. Anabolic steroids promote tissue-building processes. The schematic classifies the effect described and does not quantify drug effects.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#327153"/></marker></defs><rect width="960" height="540" rx="24" fill="#faf9ef"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="49" text-anchor="start" fill="#163d31" font-size="30" font-weight="bold">Building muscle is an anabolic process</text><text x="36" y="87" text-anchor="start" fill="#163d31" font-size="23" font-weight="normal">Anabolism joins small components into larger structures.</text><circle cx="62" cy="188" r="17" fill="#e1eddf" stroke="#327153" stroke-width="3"/><circle cx="117" cy="218" r="17" fill="#e1eddf" stroke="#327153" stroke-width="3"/><circle cx="176" cy="178" r="17" fill="#e1eddf" stroke="#327153" stroke-width="3"/><circle cx="224" cy="224" r="17" fill="#e1eddf" stroke="#327153" stroke-width="3"/><text x="145" y="287" text-anchor="middle" fill="#163d31" font-size="24" font-weight="normal">amino acids</text><path d="M260 207 L350 207" fill="none" stroke="#327153" stroke-width="4"/><path d="M340 200 L350 207 L340 214" fill="none" stroke="#327153" stroke-width="4"/><circle cx="391" cy="207" r="14" fill="#e1eddf" stroke="#327153" stroke-width="3"/><circle cx="425" cy="207" r="14" fill="#e1eddf" stroke="#327153" stroke-width="3"/><circle cx="459" cy="207" r="14" fill="#e1eddf" stroke="#327153" stroke-width="3"/><circle cx="493" cy="207" r="14" fill="#e1eddf" stroke="#327153" stroke-width="3"/><circle cx="527" cy="207" r="14" fill="#e1eddf" stroke="#327153" stroke-width="3"/><circle cx="561" cy="207" r="14" fill="#e1eddf" stroke="#327153" stroke-width="3"/><path d="M405 207 L411 207" fill="none" stroke="#327153" stroke-width="3"/><path d="M439 207 L445 207" fill="none" stroke="#327153" stroke-width="3"/><path d="M473 207 L479 207" fill="none" stroke="#327153" stroke-width="3"/><path d="M507 207 L513 207" fill="none" stroke="#327153" stroke-width="3"/><path d="M541 207 L547 207" fill="none" stroke="#327153" stroke-width="3"/><text x="480" y="287" text-anchor="middle" fill="#163d31" font-size="24" font-weight="normal">muscle proteins</text><path d="M602 207 L685 207" fill="none" stroke="#327153" stroke-width="4"/><path d="M675 200 L685 207 L675 214" fill="none" stroke="#327153" stroke-width="4"/><rect x="720" y="171" width="180" height="15" rx="7" fill="#c6dfc4" stroke="#327153" stroke-width="2"/><rect x="720" y="193" width="180" height="15" rx="7" fill="#c6dfc4" stroke="#327153" stroke-width="2"/><rect x="720" y="215" width="180" height="15" rx="7" fill="#c6dfc4" stroke="#327153" stroke-width="2"/><rect x="720" y="237" width="180" height="15" rx="7" fill="#c6dfc4" stroke="#327153" stroke-width="2"/><text x="806" y="287" text-anchor="middle" fill="#163d31" font-size="24" font-weight="normal">muscle fibres</text><rect x="82" y="342" width="796" height="104" rx="18" fill="#e1eddf" stroke="#327153" stroke-width="2"/><text x="480" y="383" text-anchor="middle" fill="#163d31" font-size="26" font-weight="bold">Anabolic steroids promote tissue-building processes.</text><text x="480" y="422" text-anchor="middle" fill="#163d31" font-size="23" font-weight="normal">The described muscle-building action fits this category.</text><text x="36" y="517" text-anchor="start" fill="#587064" font-size="17" font-weight="normal">Original teaching schematic • not to scale</text></g></svg>