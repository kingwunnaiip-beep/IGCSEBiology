<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-labelledby="q242-title q242-desc">
<title id="q242-title">Aeration supports aerobic decomposers</title>
<desc id="q242-desc">Qualitative sewage-treatment explanation. Air supplies oxygen to an aeration tank. Microorganisms use oxygen in aerobic respiration, releasing energy for growth and reproduction while organic matter is broken down. Settling is a separate stage. Bubbles and cells are symbolic, with no measured quantities.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="820" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Aeration supports aerobic decomposers</text><text x="500" y="100" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative process model; bubbles and cells are symbolic</text><rect x="45" y="155" width="380" height="445" rx="12" fill="white" stroke="#357ca2" stroke-width="2"/><text x="235" y="196" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Aeration tank</text><rect x="75" y="245" width="320" height="305" rx="0" fill="#e8f2f8" stroke="#357ca2" stroke-width="2"/><circle cx="120" cy="488" r="8" fill="white" stroke="#357ca2" stroke-width="2"/><circle cx="240" cy="430" r="8" fill="white" stroke="#357ca2" stroke-width="2"/><circle cx="355" cy="343" r="8" fill="white" stroke="#357ca2" stroke-width="2"/><circle cx="154" cy="309" r="8" fill="white" stroke="#357ca2" stroke-width="2"/><circle cx="330" cy="490" r="8" fill="white" stroke="#357ca2" stroke-width="2"/><ellipse cx="150" cy="392" rx="22" ry="10" fill="#eff5e8" stroke="#25614b" stroke-width="3"/><ellipse cx="272" cy="339" rx="22" ry="10" fill="#eff5e8" stroke="#25614b" stroke-width="3"/><ellipse cx="281" cy="491" rx="22" ry="10" fill="#eff5e8" stroke="#25614b" stroke-width="3"/><line x1="235" y1="640" x2="235" y2="563" stroke="#357ca2" stroke-width="4"/><polygon points="235,563 241.92668763312224,576.3049238416893 228.07331236687776,576.3049238416893" fill="#357ca2"/><text x="235" y="677" font-size="26" fill="#357ca2" font-weight="700" text-anchor="middle" >air supplies oxygen</text><rect x="480" y="155" width="475" height="128" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="717.5" y="192" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >1. Oxygen is available</text><text x="717.5" y="231" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >for aerobic respiration.</text><line x1="715" y1="294" x2="715" y2="321" stroke="#25614b" stroke-width="4"/><polygon points="715,321 708.0733123668778,307.6950761583107 721.9266876331222,307.6950761583107" fill="#25614b"/><rect x="480" y="335" width="475" height="128" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="717.5" y="372" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >2. Respiration releases energy</text><text x="717.5" y="411" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >for growth and reproduction.</text><line x1="715" y1="475" x2="715" y2="502" stroke="#25614b" stroke-width="4"/><polygon points="715,502 708.0733123668778,488.6950761583107 721.9266876331222,488.6950761583107" fill="#25614b"/><rect x="480" y="516" width="475" height="128" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="717.5" y="553" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >3. Decomposers break down</text><text x="717.5" y="592" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >organic matter in the sewage.</text><text x="500" y="713" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Sludge settling occurs in the settling tanks.</text><rect x="24" y="744" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="778" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >A — encourage microorganisms to reproduce quickly</text>
</g></svg>