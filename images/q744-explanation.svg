<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Percentage increase is measured from the original value</title><desc id="desc">A bar chart shows 60 breeding pairs in 1996 and 230 in 2002, on a common scale. The increase is 170 divided by the original 60.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">Percentage increase is measured from the original value</text><path d="M150 440 V160" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M150 440 H720" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="435.0" y="492" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">Year</text><text x="80" y="140" font-size="23" fill="#173f32" text-anchor="start" font-weight="400">Breeding pairs</text><path d="M145 440 H725" fill="none" stroke="#537c9a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><text x="130" y="447" font-size="20" fill="#173f32" text-anchor="end" font-weight="400">0</text><path d="M145 390 H725" fill="none" stroke="#537c9a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><text x="130" y="397" font-size="20" fill="#173f32" text-anchor="end" font-weight="400">50</text><path d="M145 340 H725" fill="none" stroke="#537c9a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><text x="130" y="347" font-size="20" fill="#173f32" text-anchor="end" font-weight="400">100</text><path d="M145 290 H725" fill="none" stroke="#537c9a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><text x="130" y="297" font-size="20" fill="#173f32" text-anchor="end" font-weight="400">150</text><path d="M145 240 H725" fill="none" stroke="#537c9a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><text x="130" y="247" font-size="20" fill="#173f32" text-anchor="end" font-weight="400">200</text><path d="M145 190 H725" fill="none" stroke="#537c9a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><text x="130" y="197" font-size="20" fill="#173f32" text-anchor="end" font-weight="400">250</text><rect x="250" y="380" width="110" height="60" rx="0" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><rect x="485" y="210" width="110" height="230" rx="0" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><text x="305" y="475" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">1996</text><text x="540" y="475" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">2002</text><text x="305" y="365" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">60</text><text x="540" y="195" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">230</text><text x="835" y="245" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">Increase:</text><text x="835" y="300" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">230 − 60 = 170</text><text x="835" y="355" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">170 ÷ 60 × 100</text><text x="835" y="410" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">≈ 283%</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">D: approximately 283% increase</text></g></svg>