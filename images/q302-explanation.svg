<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="q302-title q302-desc">
<title id="q302-title">Distant focus: a thinner lens bends light less</title>
<desc id="q302-desc">For distant focus ciliary muscles relax, suspensory ligaments tighten and the lens becomes thin. For comparison, near focus involves contracting ciliary muscles, slack ligaments and a fatter lens. The lens sketches are schematic profiles, not measured anatomy.</desc>
