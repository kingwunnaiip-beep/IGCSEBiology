<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Adding predators can make the population fall</title><desc id="desc">A water-flea population rises to a plateau and then declines at Y. A predator fish above Y indicates a cause of increased mortality.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">Adding predators can make the population fall</text><path d="M110 470 L900 470" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><path d="M110 470 L110 125" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><path d="M120 440 C240 440 220 440 270 250 C290 165 330 175 390 175 L590 175 C655 175 635 345 710 345 L890 345" fill="none" stroke="#537c9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(690 165) scale(0.65)"><path d="M-65 0 Q0 -55 65 0 Q0 55 -65 0 L-100 -35 L-100 35 Z" fill="#24644b" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="42" cy="-5" r="4" fill="#fbf8eb" stroke="#24644b" stroke-width="1"/></g><path d="M690 205 L655 280" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="765" y="125" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">Predator added</text><text x="715" y="290" font-size="28" text-anchor="middle" fill="#173f32" font-weight="bold">Y</text><text x="520" y="520" font-size="25" text-anchor="middle" fill="#173f32">Time</text><text x="190" y="105" font-size="24" text-anchor="start" fill="#173f32">Number of water fleas</text><text x="815" y="415" font-size="25" text-anchor="middle" fill="#173f32">Deaths &gt; births</text><text x="500" y="565" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">D: predators that eat water fleas were added.</text></g></svg>