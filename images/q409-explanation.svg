<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Find the largest increase in water flow</title><desc id="desc">A line graph reproduces rates100,120,140,250,300,260,180 at7,9,11,13,15,17,19 hours. The largest two-hour increase is110 from11 to13 hours; the peak rate occurs later at15 hours.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#185c44"/></marker></defs><rect width="1000" height="640" rx="24" fill="#faf8ec"/><g font-family="Arial, sans-serif"><text x="40" y="54" font-size="31" text-anchor="start" fill="#193e33" font-weight="bold">Find the largest increase in water flow</text><text x="70" y="105" font-size="23" text-anchor="start" fill="#193e33" font-weight="normal">Rate of water flow / cm per hour</text><path d="M105 490 L910 490" stroke="#185c44" stroke-width="4" fill="none"/><path d="M105 490 L105 145" stroke="#185c44" stroke-width="4" fill="none"/><text x="90" y="498" font-size="22" text-anchor="end" fill="#193e33" font-weight="normal">0</text><path d="M106 490 L910 490" stroke="#c9d9ca" stroke-width="4" fill="none" stroke-dasharray="5 7"/><text x="90" y="398" font-size="22" text-anchor="end" fill="#193e33" font-weight="normal">100</text><path d="M106 390 L910 390" stroke="#c9d9ca" stroke-width="4" fill="none" stroke-dasharray="5 7"/><text x="90" y="298" font-size="22" text-anchor="end" fill="#193e33" font-weight="normal">200</text><path d="M106 290 L910 290" stroke="#c9d9ca" stroke-width="4" fill="none" stroke-dasharray="5 7"/><text x="90" y="198" font-size="22" text-anchor="end" fill="#193e33" font-weight="normal">300</text><path d="M106 190 L910 190" stroke="#c9d9ca" stroke-width="4" fill="none" stroke-dasharray="5 7"/><circle cx="125" cy="390" r="7" fill="#185c44"/><text x="125" y="372" font-size="22" text-anchor="middle" fill="#193e33" font-weight="normal">100</text><text x="125" y="527" font-size="22" text-anchor="middle" fill="#193e33" font-weight="normal">7:00</text><path d="M125 390 L245 370" stroke="#185c44" stroke-width="4" fill="none"/><circle cx="245" cy="370" r="7" fill="#185c44"/><text x="245" y="352" font-size="22" text-anchor="middle" fill="#193e33" font-weight="normal">120</text><text x="245" y="527" font-size="22" text-anchor="middle" fill="#193e33" font-weight="normal">9:00</text><path d="M245 370 L365 350" stroke="#185c44" stroke-width="4" fill="none"/><circle cx="365" cy="350" r="7" fill="#185c44"/><text x="365" y="332" font-size="22" text-anchor="middle" fill="#193e33" font-weight="normal">140</text><text x="365" y="527" font-size="22" text-anchor="middle" fill="#193e33" font-weight="normal">11:00</text><path d="M365 350 L485 240" stroke="#185c44" stroke-width="4" fill="none"/><circle cx="485" cy="240" r="7" fill="#185c44"/><text x="485" y="222" font-size="22" text-anchor="middle" fill="#193e33" font-weight="normal">250</text><text x="485" y="527" font-size="22" text-anchor="middle" fill="#193e33" font-weight="normal">13:00</text><path d="M485 240 L605 190" stroke="#185c44" stroke-width="4" fill="none"/><circle cx="605" cy="190" r="7" fill="#185c44"/><text x="605" y="172" font-size="22" text-anchor="middle" fill="#193e33" font-weight="normal">300</text><text x="605" y="527" font-size="22" text-anchor="middle" fill="#193e33" font-weight="normal">15:00</text><path d="M605 190 L725 230" stroke="#185c44" stroke-width="4" fill="none"/><circle cx="725" cy="230" r="7" fill="#185c44"/><text x="725" y="212" font-size="22" text-anchor="middle" fill="#193e33" font-weight="normal">260</text><text x="725" y="527" font-size="22" text-anchor="middle" fill="#193e33" font-weight="normal">17:00</text><path d="M725 230 L845 310" stroke="#185c44" stroke-width="4" fill="none"/><circle cx="845" cy="310" r="7" fill="#185c44"/><text x="845" y="292" font-size="22" text-anchor="middle" fill="#193e33" font-weight="normal">180</text><text x="845" y="527" font-size="22" text-anchor="middle" fill="#193e33" font-weight="normal">19:00</text><path d="M382 345 L470 255" stroke="#185c44" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="440" y="98" width="445" height="48" rx="18" fill="#dcefdc" stroke="#185c44" stroke-width="3"/><text x="662" y="132" font-size="25" text-anchor="middle" fill="#193e33" font-weight="bold">Largest rise: 250 − 140 = 110</text><text x="500" y="588" font-size="26" text-anchor="middle" fill="#193e33" font-weight="normal">Largest increase: 11:00 → 13:00 (not the peak rate).</text></g></svg>