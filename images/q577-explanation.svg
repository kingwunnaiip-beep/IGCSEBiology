<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Missing back teeth make grinding difficult</title><desc id="desc">An open-mouth schematic retains front incisors and canines but uses dashed vacant positions for the missing back premolars and molars.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="bluearrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="45" font-size="28" fill="#173f32" text-anchor="start" font-weight="bold">Missing back teeth make grinding difficult</text><text x="500" y="555" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">The missing broad-surfaced back teeth normally crush and grind food.</text><ellipse cx="500" cy="315" rx="290" ry="190" fill="#f7e9dc" stroke="#bc824b" stroke-width="4" /><path d="M270 420 Q245 150 500 145 Q755 150 730 420" fill="none" stroke="#bc824b" stroke-width="7" /><path d="M305 440 Q500 510 695 440" fill="none" stroke="#bc824b" stroke-width="6" /><rect x="345" y="195" width="38" height="51" rx="10" fill="#fff" stroke="#bc824b" stroke-width="2"/><rect x="390" y="165" width="38" height="51" rx="10" fill="#fff" stroke="#bc824b" stroke-width="2"/><rect x="438" y="150" width="38" height="51" rx="10" fill="#fff" stroke="#bc824b" stroke-width="2"/><rect x="486" y="150" width="38" height="51" rx="10" fill="#fff" stroke="#bc824b" stroke-width="2"/><rect x="534" y="160" width="38" height="51" rx="10" fill="#fff" stroke="#bc824b" stroke-width="2"/><rect x="580" y="185" width="38" height="51" rx="10" fill="#fff" stroke="#bc824b" stroke-width="2"/><rect x="264" y="241" width="44" height="48" rx="10" fill="none" stroke="#ab665b" stroke-width="3" stroke-dasharray="6 5"/><rect x="248" y="306" width="44" height="48" rx="10" fill="none" stroke="#ab665b" stroke-width="3" stroke-dasharray="6 5"/><rect x="268" y="371" width="44" height="48" rx="10" fill="none" stroke="#ab665b" stroke-width="3" stroke-dasharray="6 5"/><rect x="653" y="241" width="44" height="48" rx="10" fill="none" stroke="#ab665b" stroke-width="3" stroke-dasharray="6 5"/><rect x="671" y="306" width="44" height="48" rx="10" fill="none" stroke="#ab665b" stroke-width="3" stroke-dasharray="6 5"/><rect x="653" y="371" width="44" height="48" rx="10" fill="none" stroke="#ab665b" stroke-width="3" stroke-dasharray="6 5"/><text x="95" y="158" font-size="24" fill="#173f32" text-anchor="start" font-weight="bold">Front teeth remain</text><path d="M280 167 L400 180" fill="none" stroke="#24644b" stroke-width="2" /><text x="65" y="510" font-size="24" fill="#ab665b" text-anchor="start" font-weight="bold">Missing grinding teeth</text><path d="M280 490 L289 420" fill="none" stroke="#ab665b" stroke-width="2" /><text x="830" y="205" font-size="24" fill="#173f32" text-anchor="middle" font-weight="bold">Molar</text><path d="M800 245 Q810 220 825 240 Q840 220 860 245 L855 290 L845 340 L832 302 L819 340 L806 288 Z" fill="#fff" stroke="#bc824b" stroke-width="3" /><path d="M808 253 L849 253" fill="none" stroke="#bc824b" stroke-width="3" /><text x="830" y="390" font-size="21" fill="#173f32" text-anchor="middle" font-weight="normal">Broad surface</text><text x="830" y="418" font-size="21" fill="#173f32" text-anchor="middle" font-weight="normal">for grinding</text></g></svg>