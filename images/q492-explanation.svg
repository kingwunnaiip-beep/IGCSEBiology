<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Fertilisation combines two parental sets</title><desc id="desc">The egg contributes one maternal chromosome set and the sperm one paternal set. Fertilisation forms an offspring with two sets of nuclear chromosomes. Coloured rods represent parental contributions, not actual horse chromosome counts.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#24543e"/></marker></defs><rect width="900" height="540" fill="#fbf8ed"/><g font-family="Arial, sans-serif"><text x="450" y="45" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#203e30">Fertilisation combines two parental sets</text><rect x="58" y="95" width="315" height="110" rx="14" fill="#e6efdc" stroke="#24543e" stroke-width="2"/><text x="215" y="138" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#203e30">Mother: egg</text><text x="215" y="177" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#203e30">one chromosome set</text><rect x="527" y="95" width="315" height="110" rx="14" fill="#e6efdc" stroke="#24543e" stroke-width="2"/><text x="685" y="138" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#203e30">Father: sperm</text><text x="685" y="177" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#203e30">one chromosome set</text><line x1="215" y1="225" x2="372.3325381691861" y2="299.0388414913817" stroke="#24543e" stroke-width="3"/><polygon points="385,305 369.7777559512068,304.46775370458766 374.88732038716535,293.6099292781757" fill="#24543e"/><line x1="685" y1="225" x2="527.6674618308139" y2="299.0388414913817" stroke="#24543e" stroke-width="3"/><polygon points="515,305 525.1126796128345,293.6099292781757 530.2222440487932,304.46775370458766" fill="#24543e"/><rect x="290" y="315" width="320" height="100" rx="14" fill="#b9d8ae" stroke="#24543e" stroke-width="2"/><text x="450" y="355" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#203e30">Fertilised egg</text><text x="450" y="390" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#203e30">two chromosome sets</text><line x1="420" y1="430" x2="420" y2="468" stroke="#579265" stroke-width="7"/><line x1="435" y1="430" x2="435" y2="468" stroke="#579265" stroke-width="7"/><line x1="470" y1="430" x2="470" y2="468" stroke="#3b7c94" stroke-width="7"/><line x1="485" y1="430" x2="485" y2="468" stroke="#3b7c94" stroke-width="7"/><text x="450" y="510" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#203e30">Half the nuclear chromosomes come from each parent.</text></g></svg>