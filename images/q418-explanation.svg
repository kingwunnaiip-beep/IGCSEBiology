<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Penicillin targets bacterial wall production</title><desc id="desc">A bacterium has an outer cell wall and inner cell membrane; penicillin inhibits wall formation. A virus has a protein coat surrounding genetic material and no bacterial cell wall, so penicillin lacks its target.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#327153"/></marker></defs><rect width="960" height="540" rx="24" fill="#faf9ef"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="49" text-anchor="start" fill="#163d31" font-size="30" font-weight="bold">Penicillin targets bacterial wall production</text><text x="36" y="87" text-anchor="start" fill="#163d31" font-size="23" font-weight="normal">A drug works only when its biological target is present.</text><rect x="36" y="112" width="432" height="330" rx="18" fill="#e1eddf" stroke="#327153" stroke-width="2"/><rect x="492" y="112" width="432" height="330" rx="18" fill="#e1eddf" stroke="#327153" stroke-width="2"/><text x="252" y="153" text-anchor="middle" fill="#163d31" font-size="26" font-weight="bold">BACTERIUM</text><rect x="140" y="191" width="224" height="104" rx="49" fill="#d3e6cc" stroke="#327153" stroke-width="2"/><rect x="154" y="205" width="196" height="76" rx="35" fill="#f9f6e7" stroke="#327153" stroke-width="2"/><path d="M153 259 L100 309" fill="none" stroke="#327153" stroke-width="3"/><text x="70" y="339" text-anchor="start" fill="#163d31" font-size="24" font-weight="normal">Bacterial cell wall</text><text x="70" y="385" text-anchor="start" fill="#163d31" font-size="22" font-weight="normal">Penicillin inhibits its formation.</text><text x="708" y="153" text-anchor="middle" fill="#163d31" font-size="26" font-weight="bold">VIRUS</text><circle cx="708" cy="244" r="61" fill="#f0e4d8" stroke="#327153" stroke-width="3"/><path d="M676 243 Q691 213 706 245 T740 245" stroke="#327153" stroke-width="4" fill="none"/><path d="M756 209 L828 184" fill="none" stroke="#327153" stroke-width="3"/><text x="811" y="177" text-anchor="start" fill="#163d31" font-size="22" font-weight="normal">coat</text><text x="527" y="339" text-anchor="start" fill="#163d31" font-size="24" font-weight="normal">No bacterial cell wall</text><text x="527" y="385" text-anchor="start" fill="#163d31" font-size="22" font-weight="normal">No target for penicillin.</text><text x="480" y="477" text-anchor="middle" fill="#163d31" font-size="25" font-weight="bold">Viral protein coats are different from bacterial walls.</text><text x="36" y="517" text-anchor="start" fill="#587064" font-size="17" font-weight="normal">Original teaching schematic • not to scale</text></g></svg>