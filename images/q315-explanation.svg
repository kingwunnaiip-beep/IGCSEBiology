550.0" y="492" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Compare equivalent DNA base sequences</text><text x="550.0" y="540" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >More similarity → evidence of closer relatedness</text><rect x="24" y="624" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="658" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B — compare the base sequences of their DNA</text>
