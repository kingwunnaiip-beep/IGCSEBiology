<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1100" viewBox="0 0 1000 1100" role="img" aria-labelledby="q196-title q196-desc">
<title id="q196-title">196 · Check every enzyme statement in the row</title>
<desc id="q196-desc">Answer D. Three separate cards preserve row D in the printed enzyme order: lipase acts in the small intestine, maltase acts in the small intestine, and trypsin acts in alkaline conditions. A pathway shows the stomach as acidic and the small intestine as alkaline. Trypsin is secreted by the pancreas, not the stomach. This is a qualitative location-and-condition map, not a drawing of enzyme concentrations or measured pH.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1100" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >196 · Check every enzyme statement in the row</text><text x="500" y="111" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >The correct row needs all three cells to be true.</text><rect x="50" y="170" width="280" height="245" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="190.0" y="210" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Lipase</text><text x="190.0" y="253" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Acts in the</text><text x="190.0" y="288" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >small intestine.</text><text x="190.0" y="323" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Breaks down fats.</text><rect x="360" y="170" width="280" height="245" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="210" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Maltase</text><text x="500.0" y="253" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Acts in the</text><text x="500.0" y="288" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >small intestine.</text><text x="500.0" y="323" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Maltose → glucose.</text><rect x="670" y="170" width="280" height="245" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="810.0" y="210" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Trypsin</text><text x="810.0" y="253" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Acts in alkaline</text><text x="810.0" y="288" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >conditions.</text><text x="810.0" y="323" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >A pancreatic protease.</text><rect x="80" y="495" width="350" height="185" rx="12" fill="#f7efdf" stroke="#daa958" stroke-width="2"/><text x="255.0" y="535" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Stomach</text><text x="255.0" y="578" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Acidic conditions</text><text x="255.0" y="613" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Pepsin acts here.</text><rect x="560" y="495" width="350" height="185" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="735.0" y="535" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Small intestine</text><text x="735.0" y="578" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Alkaline conditions</text><text x="735.0" y="613" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >All three enzymes act here.</text><line x1="445" y1="586" x2="544" y2="586" stroke="#25614b" stroke-width="5"/><polygon points="544,586 530.6950761583107,592.9266876331222 530.6950761583107,579.0733123668778" fill="#25614b"/><rect x="80" y="744" width="830" height="145" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="495.0" y="784" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Do not confuse secretion with action</text><text x="495.0" y="827" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Trypsin is secreted by the pancreas</text><text x="495.0" y="862" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >and acts in the small intestine.</text><text x="500" y="951" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Keep the source order: lipase → maltase → trypsin.</text><text x="500" y="995" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative location and condition map; no measured pH is given.</text><rect x="24" y="1024" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1058" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · Small intestine / small intestine / alkaline</text>
</g></svg>