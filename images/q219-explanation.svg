<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="q219-title q219-desc">
<title id="q219-title">Antibiotic exposure selects resistant variants</title>
<desc id="q219-desc">Qualitative bacterial selection model. A mixed population includes susceptible and resistant variants before exposure. Antibiotic exposure removes susceptible bacteria; resistant survivors reproduce. Less unnecessary exposure reduces selection pressure. Symbol counts are illustrative, not measured.</desc>
