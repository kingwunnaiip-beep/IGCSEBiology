<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" role="img" aria-labelledby="q181-title q181-desc">
<title id="q181-title">181 · One genus, four different species</title>
<desc id="q181-desc">Answer C. The four scientific names in the source are Homo sapiens, Homo heidelbergensis, Homo erectus and Homo habilis. All share the genus Homo, while the complete two-part names identify different species. The teaching diagram separates each name into its genus and specific epithet; it does not assert an evolutionary tree or measured evolutionary distances.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
