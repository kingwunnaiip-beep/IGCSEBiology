<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which diagram represents active transport?</title><desc id="desc">Particles move from lower to higher concentration through a membrane transport protein. Energy from respiration drives the protein. Answer B.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700" text-anchor="start" fill="#193e34">Which diagram represents active transport?</text><rect x="30" y="125" width="1020" height="245" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><rect x="500" y="145" width="80" height="180" rx="18" fill="#dceadd" stroke="#9fbaab" stroke-width="2"/><text x="250" y="164" font-size="23" font-weight="700" text-anchor="middle" fill="#193e34">Lower concentration</text><text x="805" y="164" font-size="23" font-weight="700" text-anchor="middle" fill="#193e34">Higher concentration</text><circle cx="100" cy="215" r="10" fill="#285d4c"/><circle cx="165" cy="275" r="10" fill="#285d4c"/><circle cx="240" cy="225" r="10" fill="#285d4c"/><circle cx="330" cy="290" r="10" fill="#285d4c"/><circle cx="640" cy="215" r="10" fill="#285d4c"/><circle cx="710" cy="210" r="10" fill="#285d4c"/><circle cx="780" cy="220" r="10" fill="#285d4c"/><circle cx="850" cy="210" r="10" fill="#285d4c"/><circle cx="930" cy="215" r="10" fill="#285d4c"/><circle cx="665" cy="290" r="10" fill="#285d4c"/><circle cx="740" cy="285" r="10" fill="#285d4c"/><circle cx="820" cy="290" r="10" fill="#285d4c"/><circle cx="910" cy="285" r="10" fill="#285d4c"/><path d="M350 250 H625" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)"/><text x="540" y="350" font-size="20" font-weight="400" text-anchor="middle" fill="#193e34">Cell membrane and transport protein</text><text x="540" y="102" font-size="20" font-weight="700" text-anchor="middle" fill="#193e34">Energy from respiration</text><path d="M540 110 V210" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)"/><text x="540" y="385" font-size="22" font-weight="700" text-anchor="middle" fill="#193e34">Against the concentration gradient → active transport → option B</text><text x="38" y="406" font-size="17" font-weight="400" text-anchor="start" fill="#193e34">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>