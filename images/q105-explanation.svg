"500" y="302" font-size="24" fill="#357ca2" font-weight="400" text-anchor="middle" >Small</text><text x="500" y="367" font-size="24" fill="#357ca2" font-weight="400" text-anchor="middle" >molecules</text><text x="500" y="482" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Blood cells and most plasma proteins stay in the blood.</text><text x="500" y="521" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Glucose is small enough to enter the filtrate.</text><line x1="763" y1="585" x2="763" y2="635" stroke="#357ca2" stroke-width="5"/><polygon points="763,635 756.0733123668778,621.6950761583107 769.9266876331222,621.6950761583107" fill="#357ca2"/><rect x="48" y="652" width="904" height="380" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500" y="696" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >2 · Selective reabsorption along the nephron</text><rect x="81" y="742" width="310" height="151" rx="12" fill="#fffdf7" stroke="#357ca2" stroke-width="2"/><text x="236.0" y="780" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Tubule filtrate</text><text x="236.0" y="818" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Glucose leaves</text><text x="236.0" y="849" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >the tubule.</text><rect x="609" y="742" width="310" height="151" rx="12" fill="#f8e9df" stroke="#b94a43" stroke-width="2"/><text x="764.0" y="780" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Blood capillaries</text><text x="764.0" y="818" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Glucose returns</text><text x="764.0" y="849" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >to the blood.</text><line x1="415" y1="812" x2="584" y2="812" stroke="#b94a43" stroke-width="6"/><polygon points="584,812 570.6950761583107,818.9266876331222 570.6950761583107,805.0733123668778" fill="#b94a43"/><text x="500" y="781" font-size="24" fill="#b94a43" font-weight="400" text-anchor="middle" >Glucose</text><text x="500" y="855" font-size="23" fill="#b94a43" font-weight="400" text-anchor="middle" >reabsorbed</text><text x="500" y="948" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >This happens mainly in the proximal convoluted tubule.</text><text x="500" y="987" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Useful substances are recovered, rather than lost in urine.</text><text x="500" y="1090" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Normal blood glucose: essentially all filtered glucose is recovered.</text><text x="500" y="1132" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Urea is made in the liver; it is not produced by the nephron.</text><rect x="24" y="1204" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1238" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · Reabsorption of glucose</text>
</g></svg>