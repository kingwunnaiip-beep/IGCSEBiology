<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Red blood cells carry oxygen to body tissues</title><desc id="desc">Oxygen from lungs is loaded onto haemoglobin in a red blood cell, which carries it to body tissues for release. A biconcave disc is shown in the centre to explain its large surface area for gas exchange. Arrows show the transport route, not a chemical reaction.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#327153"/></marker></defs><rect width="960" height="540" rx="24" fill="#faf9ef"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="49" text-anchor="start" fill="#163d31" font-size="30" font-weight="bold">Red blood cells carry oxygen to body tissues</text><text x="36" y="88" text-anchor="start" fill="#163d31" font-size="23" font-weight="normal">Haemoglobin binds oxygen in the lungs and releases it to tissues.</text><rect x="36" y="124" width="225" height="289" rx="18" fill="#e1eddf" stroke="#327153" stroke-width="2"/><text x="148" y="170" text-anchor="middle" fill="#163d31" font-size="27" font-weight="bold">LUNGS</text><circle cx="105" cy="229" r="23" fill="#e9f0df" stroke="#327153" stroke-width="3"/><text x="105" y="237" text-anchor="middle" fill="#163d31" font-size="24" font-weight="normal">O₂</text><circle cx="187" cy="231" r="23" fill="#e9f0df" stroke="#327153" stroke-width="3"/><text x="187" y="239" text-anchor="middle" fill="#163d31" font-size="24" font-weight="normal">O₂</text><circle cx="144" cy="313" r="23" fill="#e9f0df" stroke="#327153" stroke-width="3"/><text x="144" y="321" text-anchor="middle" fill="#163d31" font-size="24" font-weight="normal">O₂</text><path d="M278 270 L360 270" fill="none" stroke="#327153" stroke-width="4"/><path d="M350 263 L360 270 L350 277" fill="none" stroke="#327153" stroke-width="4"/><ellipse cx="485" cy="270" rx="91" ry="61" fill="#e4c7b3" stroke="#a75c48" stroke-width="4"/><ellipse cx="485" cy="270" rx="46" ry="25" fill="#faf9ef" stroke="#a75c48" stroke-width="2"/><text x="485" y="178" text-anchor="middle" fill="#163d31" font-size="25" font-weight="bold">RED BLOOD CELL</text><text x="485" y="380" text-anchor="middle" fill="#163d31" font-size="23" font-weight="normal">contains haemoglobin</text><path d="M594 270 L680 270" fill="none" stroke="#327153" stroke-width="4"/><path d="M670 263 L680 270 L670 277" fill="none" stroke="#327153" stroke-width="4"/><rect x="697" y="124" width="227" height="289" rx="18" fill="#e1eddf" stroke="#327153" stroke-width="2"/><text x="810" y="170" text-anchor="middle" fill="#163d31" font-size="25" font-weight="bold">BODY TISSUES</text><circle cx="755" cy="235" r="26" fill="#e1eddf" stroke="#327153" stroke-width="3"/><circle cx="755" cy="235" r="8" fill="#8db491" stroke="#327153" stroke-width="3"/><circle cx="849" cy="235" r="26" fill="#e1eddf" stroke="#327153" stroke-width="3"/><circle cx="849" cy="235" r="8" fill="#8db491" stroke="#327153" stroke-width="3"/><circle cx="805" cy="329" r="26" fill="#e1eddf" stroke="#327153" stroke-width="3"/><circle cx="805" cy="329" r="8" fill="#8db491" stroke="#327153" stroke-width="3"/><text x="480" y="465" text-anchor="middle" fill="#163d31" font-size="26" font-weight="bold">Biconcave disc → large surface area for gas exchange</text><text x="36" y="517" text-anchor="start" fill="#587064" font-size="17" font-weight="normal">Original teaching schematic • not to scale</text></g></svg>