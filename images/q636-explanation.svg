<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Osmosis needs a membrane, not a cell wall</title><desc id="desc">Water molecules cross a partially permeable membrane from higher to lower water potential. Larger solute particles cannot cross. This apparatus has no cell wall.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="53" font-size="30" text-anchor="start" font-weight="bold" fill="#173f32">Osmosis needs a membrane, not a cell wall</text><text x="250" y="125" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">Higher water potential</text><text x="745" y="125" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">Lower water potential</text><line x1="487" y1="155" x2="487" y2="435" stroke="#24644b" stroke-width="3"/><line x1="513" y1="155" x2="513" y2="435" stroke="#24644b" stroke-width="3"/><circle cx="487" cy="170" r="7" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><circle cx="513" cy="170" r="7" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><circle cx="487" cy="198" r="7" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><circle cx="513" cy="198" r="7" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><circle cx="487" cy="226" r="7" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><circle cx="513" cy="226" r="7" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><circle cx="487" cy="254" r="7" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><circle cx="513" cy="254" r="7" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><circle cx="487" cy="282" r="7" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><circle cx="513" cy="282" r="7" fill="#e4f0df" stroke=