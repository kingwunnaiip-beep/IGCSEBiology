0733123668778" fill="#357ca2"/><line x1="670" y1="616" x2="768" y2="616" stroke="#357ca2" stroke-width="4"/><polygon points="768,616 754.6950761583107,622.9266876331222 754.6950761583107,609.0733123668778" fill="#357ca2"/><text x="550" y="694" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Urea is removed from blood → urine</text><text x="550" y="760" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Urea production: excess amino acids → ammonia → urea</text><text x="550" y="799" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Dots show within-row changes, not measured concentrations.</text><rect x="50" y="825" width="1000" height="70" rx="12" fill="#f5f1e4" stroke="none" stroke-width="2"/><text x="550" y="853" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >These organ effects alone cannot rank all four blood samples.</text><text x="550" y="885" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >In particular, entering liver vs leaving kidneys is not established.</text><rect x="24" y="904" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="938" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Intended B — highest: entering kidneys; lowest: entering liver</text>
