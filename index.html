<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f4f6ef">
	<title>Characteristics of living organisms | Biology quiz</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #193b34;
			--muted: #61766c;
			--green: #1e654f;
			--green-dark: #174a3b;
			--paper: #f4f6ef;
			--line: #dce4d8;
			--white: #fffefa;
			--red-pale: #fff0ed;
			--green-pale: #eaf4e8;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			padding-bottom: 88px;
			color: var(--ink);
			background:
				radial-gradient(ellipse at 93% 8%, rgba(216, 233, 120, .28), transparent 26rem),
				linear-gradient(135deg, #f4f6ef 0%, #edf2e8 100%);
			font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
		}

		.page {
			width: min(100% - 24px, 1600px);
			margin: 0 auto;
			padding: 30px 0 48px;
		}

		.topbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 20px;
			padding-bottom: 22px;
			border-bottom: 1px solid rgba(25, 59, 52, .15);
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 11px;
			font-size: 14px;
			font-weight: 750;
		}

		.brand-logo {
			display: block;
			width: 96px;
			height: 96px;
			flex: 0 0 96px;
			border-radius: 50%;
			background: white;
			object-fit: contain;
		}

		.teacher-badge {
			position: fixed;
			right: max(14px, env(safe-area-inset-right));
			bottom: max(14px, env(safe-area-inset-bottom));
			z-index: 20;
			display: flex;
			align-items: center;
			gap: 11px;
			padding: 10px 18px;
			border: 2px solid #078b9a;
			border-radius: 999px;
			color: #164f56;
			background: #effcff;
			box-shadow: 0 8px 24px rgba(7, 139, 154, .15);
			font-size: 20px;
			font-weight: 750;
			transform: scale(.7);
			transform-origin: bottom right;
		}

		.teacher-badge-dot {
			width: 20px;
			height: 20px;
			flex: 0 0 20px;
			border-radius: 50%;
			background: #4edcf0;
			box-shadow: 0 0 0 0 rgba(78, 220, 240, .55);
			animation: badge-pulse 1.2s ease-in-out infinite;
		}

		@keyframes badge-pulse {
			0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(78, 220, 240, .45); }
			50% { opacity: .55; transform: scale(.88); box-shadow: 0 0 0 8px rgba(78, 220, 240, 0); }
		}

		.topic {
			color: var(--muted);
			font-size: 12px;
			font-weight: 700;
			letter-spacing: .08em;
			text-transform: uppercase;
		}

		main {
			padding: clamp(36px, 7vh, 68px) 0 0;
		}

		.quiz-layout {
			display: grid;
			grid-template-columns: minmax(0, 1fr) 136px;
			grid-template-areas: "quiz navigator";
			gap: clamp(18px, 2.5vw, 32px);
			align-items: start;
		}

		.question-navigator {
			grid-area: navigator;
			position: sticky;
			top: 24px;
			padding-left: 10px;
			border-left: 1px solid var(--line);
		}

		.question-nav-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

		.question-nav-item {
			display: grid;
			width: 100%;
			min-height: 54px;
			place-items: center;
			padding: 7px;
			border: 1px solid transparent;
			border-radius: 6px;
			color: var(--ink);
			background: transparent;
			text-align: center;
			font-size: 13px;
		}

		.question-nav-item:not(:disabled):hover { border-color: var(--line); color: var(--ink); background: rgba(255, 254, 250, .7); transform: none; }
		.question-nav-item[aria-current="step"] { border-color: #bdd0be; background: #eaf2e7; }
		.question-nav-item.is-correct { border-color: #c6dfc9; background: #eaf4e8; }
		.question-nav-item.is-wrong { border-color: #e8c4be; background: #fff0ed; }
		.question-nav-number { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 6px; color: var(--green-dark); background: #e9eee1; font-weight: 800; }
		.question-nav-item[aria-current="step"] .question-nav-number { color: white; background: var(--green); }
		.question-nav-item.is-correct .question-nav-number { color: white; background: #24563c; }
		.question-nav-item.is-wrong .question-nav-number { color: white; background: #a63d38; }
		.quiz-layout.navigator-hidden { grid-template-columns: minmax(0, 1fr); grid-template-areas: "quiz"; }
		.quiz-layout.navigator-hidden .question-navigator { display: none; }

		.quiz {
			grid-area: quiz;
			width: 100%;
			font-size: calc(16px * var(--quiz-scale, 1));
		}

		.question-meta {
			display: flex;
			align-items: center;
			flex-wrap: wrap;
			gap: 16px;
			margin-bottom: 14px;
			color: var(--muted);
			font-size: .8125em;
			font-weight: 700;
		}

		.panel-toggle {
			display: grid;
			width: 36px;
			min-width: 36px;
			min-height: 34px;
			margin-left: auto;
			place-items: center;
			padding: 0;
			border: 1px solid var(--line);
			color: var(--green-dark);
			background: var(--white);
		}

		.panel-toggle svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-width: 2; }

		.panel-toggle:not(:disabled):hover { color: white; background: var(--green-dark); }

		.question-context:empty { display: none; }

		.comparison-table {
			width: 100%;
			margin: 0 0 24px;
			border-collapse: collapse;
			background: rgba(255, 254, 250, .72);
			font-size: .9em;
			text-align: center;
			table-layout: auto;
		}

		.comparison-table caption {
			padding: 0 0 9px;
			color: var(--muted);
			text-align: left;
		}

		.comparison-table th,
		.comparison-table td {
			padding: 9px 7px;
			border: 1px solid var(--line);
			overflow-wrap: break-word;
		}

		.comparison-table thead th { color: var(--ink); font-weight: 700; }
		.comparison-table tbody th { color: var(--green-dark); }
		.comparison-table.leg-count-table th:first-child { width: 34%; }
		.comparison-table.statement-table th:first-child { width: 30%; }
		.comparison-table.answer-selection-table.statement-table th:first-child { width: 70px; }
		.comparison-table.villus-choice-table th:first-child { width: 70px; }
		.answer-selection-table tbody tr { cursor: pointer; transition: background-color 120ms ease; }
		.answer-selection-table tbody tr:hover { background: #f0f4eb; }
		.answer-selection-table tbody tr.is-selected { background: #eaf2e7; box-shadow: inset 3px 0 var(--green); }
		.answer-table-choice { min-width: 34px; min-height: 34px; padding: 3px 8px; border: 1px solid var(--line); color: var(--green-dark); background: var(--white); }
		.answer-table-choice[aria-pressed="true"] { border-color: var(--green); color: white; background: var(--green); }
		.comparison-table.light-intensity-table th:first-child { width: 70px; }
		.comparison-table.light-intensity-table th,
		.comparison-table.light-intensity-table td { overflow-wrap: break-word; }
		.key-table { text-align: left; }
		.key-table th:first-child { width: 54px; }
		.key-table td:last-child { text-align: right; white-space: nowrap; }
		.table-key { margin: -14px 0 22px; color: var(--muted); font-size: .85em; }
		.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
		.statement-list { display: grid; gap: 8px; margin: 0 0 20px; padding-left: 1.5em; }
		.explanation-photo { margin: 16px 0; }
		.explanation-photo img { display: block; width: min(100%, 700px); height: auto; border-radius: 6px; }
		.explanation-photo figcaption { margin-top: 6px; color: var(--muted); font-size: .8em; }
		.explanation-photo a { color: inherit; }
		.plant-diagram { max-width: 700px; margin: 0 auto 18px; }
		.plant-diagram svg { display: block; width: 100%; height: auto; }
		.plant-diagram figcaption { margin-top: 5px; color: var(--muted); font-size: .8em; }
		.translocation-flow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.2fr) auto minmax(0, 1fr); gap: 10px; align-items: center; margin: 18px 0; }
		.flow-step { display: grid; gap: 4px; min-width: 0; padding: 12px; border-top: 2px solid var(--green); background: rgba(255, 254, 250, .75); }
		.flow-step span { color: var(--muted); font-size: .8em; }
		.flow-arrow { color: var(--green); font-size: 1.5em; font-weight: 700; }
		.interactive-graph { margin: 16px 0 20px; padding: 14px; border: 1px solid var(--line); border-radius: 7px; background: rgba(255, 254, 250, .82); }
		.rate-chart { display: block; width: 100%; height: auto; }
		.rate-chart text { fill: var(--muted); font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif; font-size: 13px; }
		.rate-chart .axis-label { fill: var(--ink); font-size: 14px; font-weight: 700; }
		.rate-chart .gridline { stroke: #dce4d8; stroke-width: 1; }
		.rate-chart .axis { stroke: #61766c; stroke-width: 1.5; }
		.rate-chart .curve { fill: none; stroke: #1e654f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
		.rate-chart .data-point { fill: #fffefa; stroke: #1e654f; stroke-width: 3; }
		.rate-chart .plateau-zone { fill: #eaf4e8; }
		.rate-chart .plateau-label { fill: #24563c; font-weight: 700; }
		.rate-chart .active-line { stroke: #a63d38; stroke-width: 2; stroke-dasharray: 5 5; }
		.rate-chart .active-point { fill: #a63d38; stroke: white; stroke-width: 3; }
		.enzyme-chart { max-width: 680px; margin: 10px auto 20px; }
		.enzyme-chart svg { display: block; width: 100%; height: auto; }
		.enzyme-chart text { fill: var(--ink); font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif; font-size: 15px; }
		.enzyme-chart .axis { stroke: #193b34; stroke-width: 2; }
		.enzyme-chart .tick { stroke: #61766c; stroke-width: 1.5; }
		.enzyme-chart .curve { fill: none; stroke: #1e654f; stroke-width: 4; stroke-linecap: round; }
		.enzyme-chart .point-label { fill: #1e654f; font-weight: 800; }
		.enzyme-stage-flow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center; margin: 16px 0 22px; }
		.enzyme-stage { min-width: 0; margin: 0; padding: 10px; border-top: 2px solid var(--green); background: rgba(255, 254, 250, .72); text-align: center; }
		.enzyme-stage svg { display: block; width: 100%; height: 125px; }
		.enzyme-stage figcaption { color: var(--ink); font-size: .82em; font-weight: 700; }
		.enzyme-shape { fill: #a5a7a8; stroke: #4f5557; stroke-width: 3; stroke-linejoin: round; }
		.substrate-shape { fill: #d9dcde; stroke: #4f5557; stroke-width: 2.5; }
		.enzyme-stage-arrow { align-self: center; color: var(--green); font-size: 1.4em; font-weight: 800; }
		.blood-components-figure,
		.phagocytosis-figure { max-width: 760px; margin: 16px auto 20px; }
		.blood-components-figure svg,
		.phagocytosis-figure svg { display: block; width: 100%; height: auto; }
		.blood-components-figure figcaption,
		.phagocytosis-figure figcaption { margin-top: 5px; color: var(--muted); font-size: .8em; }
		.blood-components-figure text,
		.phagocytosis-figure text { fill: var(--ink); font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif; }
		.blood-cell-outline { stroke: #66736d; stroke-width: 2; }
		.digestive-diagram { max-width: 700px; margin: 8px auto 20px; }
		.digestive-diagram img { display: block; width: min(100%, 560px); height: auto; margin: 0 auto; }
		.circulation-diagram { max-width: 860px; margin: 8px auto 20px; }
		.circulation-diagram img { display: block; width: 100%; height: auto; }
		.root-hair-diagram { max-width: 700px; margin: 12px auto 20px; }
		.root-hair-diagram svg { display: block; width: 100%; height: auto; }
		.root-hair-diagram figcaption { margin-top: 5px; color: var(--muted); font-size: .8em; }
		.root-hair-diagram text { fill: var(--ink); font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif; font-size: 16px; }
		.root-hair-diagram .cell { fill: #eaf2e7; stroke: #1e654f; stroke-width: 3; }
		.root-hair-diagram .wall { stroke: #1e654f; stroke-width: 3; }
		.root-hair-diagram .water { stroke: #4389ad; stroke-width: 4; }
		.root-hair-diagram .ions { stroke: #b86b39; stroke-width: 4; }
		.root-hair-diagram .leader { stroke: #61766c; stroke-width: 1.5; }
		.comparison-table.root-uptake-table th:first-child { width: 30%; }
		.comparison-table.transpiration-table th:first-child { width: 30%; }
		.water-potential-diagram { max-width: 720px; margin: 14px auto 20px; }
		.water-potential-diagram svg { display: block; width: 100%; height: auto; }
		.water-potential-diagram figcaption { margin-top: 5px; color: var(--muted); font-size: .8em; }
		.water-potential-diagram text { fill: var(--ink); font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif; }
		.water-potential-diagram .cell-box { fill: var(--white); stroke: #526c62; stroke-width: 2.5; }
		.water-potential-diagram .cell-name { font-size: 20px; font-weight: 800; }
		.water-potential-diagram .cell-value { font-size: 18px; }
		.water-potential-diagram .water-flow-arrow { fill: none; stroke: #4389ad; stroke-width: 4; stroke-dasharray: 9 10; marker-end: url(#water-potential-arrow); animation: water-flow 1.2s linear infinite; }
		@keyframes water-flow { to { stroke-dashoffset: -38; } }
		.graph-controls { display: grid; gap: 8px; margin-top: 8px; }
		.graph-controls label { color: var(--ink); font-size: .88em; font-weight: 700; }
		.graph-controls input { width: 100%; accent-color: var(--green); }
		.graph-output { display: block; min-height: 1.5em; color: var(--green-dark); font-size: .88em; font-weight: 750; }
		.species-photo-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 16px 0; }
		.species-photo { min-width: 0; margin: 0; }
		.species-photo img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; border-radius: 5px; background: var(--white); }
		.species-photo figcaption { margin-top: 5px; color: var(--muted); font-size: .72em; line-height: 1.4; }
		.species-photo a { color: inherit; }

		.text-size-controls {
			display: flex;
			align-items: center;
			justify-content: flex-end;
			gap: 8px;
			margin: 14px 0 0;
			color: var(--muted);
			font-size: 13px;
		}

		.text-size-controls button {
			min-width: 36px;
			min-height: 34px;
			padding: 0 9px;
			border: 1px solid var(--line);
			color: var(--green-dark);
			background: var(--white);
			font-size: 13px;
		}

		.text-size-controls button:not(:disabled):hover { color: white; background: var(--green-dark); }
		.text-size-controls output { min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
		.question-navigator .text-size-controls {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			grid-template-areas: "label label label" "decrease value increase" "reset reset reset";
			gap: 6px;
			justify-content: stretch;
			margin-top: 12px;
			padding-top: 12px;
			border-top: 1px solid var(--line);
			font-size: 11px;
		}
		.question-navigator .text-size-controls > span { grid-area: label; }
		.question-navigator #decrease-text { grid-area: decrease; min-width: 0; padding: 0; }
		.question-navigator #text-size-value { grid-area: value; min-width: 0; }
		.question-navigator #increase-text { grid-area: increase; min-width: 0; padding: 0; }
		.question-navigator #reset-text { grid-area: reset; width: 100%; min-width: 0; min-height: 32px; padding: 0 6px; }

		.progress-track {
			height: 4px;
			overflow: hidden;
			border-radius: 5px;
			background: #dfe7da;
		}

		.progress-value {
			width: 100%;
			height: 100%;
			border-radius: inherit;
			background: var(--green);
		}

		h2 {
			margin: 30px 0 25px;
			font-size: 1.65em;
			font-weight: 650;
			line-height: 1.4;
		}

		fieldset { margin: 0; padding: 0; border: 0; }
		.answer-options { display: grid; gap: 10px; }
		.answer-options[hidden] { display: none; }
		legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }

		.answer {
			position: relative;
			display: flex;
			align-items: center;
			gap: 15px;
			min-height: 62px;
			padding: 11px 16px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: rgba(255, 254, 250, .82);
			cursor: pointer;
			transition: border-color 150ms ease, background-color 150ms ease, transform 150ms ease;
		}

		.answer:hover { border-color: #8da99a; transform: translateY(-1px); }

		.answer:has(input:checked) {
			border-color: var(--green);
			background: #edf4e9;
			box-shadow: 0 0 0 1px var(--green);
		}

		.answer input {
			position: absolute;
			width: 1px;
			height: 1px;
			opacity: 0;
		}

		.answer:has(input:focus-visible) { outline: 3px solid #91a944; outline-offset: 3px; }

		.letter {
			display: grid;
			flex: 0 0 32px;
			width: 32px;
			height: 32px;
			place-items: center;
			border-radius: 7px;
			color: var(--green-dark);
			background: #e9eee1;
			font-size: .8125em;
			font-weight: 800;
		}

		.answer-text { font-size: .9375em; font-weight: 600; }

		.actions {
			display: flex;
			align-items: center;
			flex-wrap: wrap;
			gap: 16px;
			margin-top: 20px;
		}

		button {
			min-height: 46px;
			padding: 0 21px;
			border: 0;
			border-radius: 7px;
			color: white;
			background: var(--green);
			font: inherit;
			font-size: .875em;
			font-weight: 750;
			cursor: pointer;
			transition: background-color 150ms ease, transform 150ms ease;
		}

		button:not(:disabled):hover { background: var(--green-dark); transform: translateY(-1px); }
		button:focus-visible { outline: 3px solid #91a944; outline-offset: 3px; }
		button:disabled { color: #8c9a90; background: #e0e6dd; cursor: not-allowed; }

		.hint { color: var(--muted); font-size: .75em; }

		.feedback {
			display: none;
			margin-top: 18px;
			padding: 18px;
			border-radius: 7px;
			font-size: .875em;
			line-height: 1.55;
		}

		.feedback.visible { display: block; animation: appear 180ms ease-out; }
		.feedback.correct { color: #24563c; background: var(--green-pale); }
		.feedback.incorrect { color: #873a34; background: var(--red-pale); }
		.feedback-title { display: block; margin-bottom: 8px; font-size: 1.14em; }
		.feedback p { margin: 0 0 12px; }
		.feedback .definition { color: var(--ink); }
		.feedback h3 { margin: 17px 0 8px; color: var(--ink); font-size: .93em; }
		.option-explanations { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
		.option-explanations li { padding: 7px 0; border-top: 1px solid rgba(25, 59, 52, .12); color: var(--ink); }
		.option-explanations strong { display: inline; }
		.exam-tip { margin: 15px 0 0 !important; padding-top: 12px; border-top: 1px solid rgba(25, 59, 52, .18); color: var(--ink); }
		.relationship { margin-top: 8px !important; font-weight: 800; }

		@keyframes appear {
			from { opacity: 0; transform: translateY(5px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (max-width: 680px) {
			.page { width: min(100% - 20px, 760px); padding-top: 20px; }
			.topbar { flex-wrap: wrap; gap: 12px; }
			.teacher-badge { right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); gap: 8px; padding: 8px 13px; font-size: 16px; }
			.teacher-badge-dot { width: 16px; height: 16px; flex-basis: 16px; }
			.question-navigator .text-size-controls {
				grid-template-columns: auto 36px 42px 36px auto;
				grid-template-areas: "label decrease value increase reset";
				align-items: center;
			}
			.question-navigator #reset-text { width: auto; }
			.topbar { padding-bottom: 17px; }
			.topic { max-width: 130px; text-align: right; line-height: 1.4; }
			main { padding-top: 36px; }
			.quiz-layout { grid-template-columns: 1fr; grid-template-areas: "navigator" "quiz"; gap: 22px; }
			.species-photo-grid { grid-template-columns: 1fr; }
			.species-photo img { aspect-ratio: 16 / 9; }
			.question-navigator { position: static; padding: 0 0 14px; border-left: 0; border-bottom: 1px solid var(--line); }
			.question-nav-list { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }

								<ellipse cx="500" cy="85" rx="48" ry="34" fill="#d9827b"/><ellipse cx="500" cy="85" rx="23" ry="13" fill="#efb5ac" stroke="none"/>
								<path d="M700 42 C689 63 667 84 667 102 A33 33 0 0 0 733 102 C733 84 711 63 700 42Z" fill="#e8d7a5"/>
							</g>
							<g text-anchor="middle" font-size="16">
								<text x="100" y="155" font-weight="700">A · Neutrophil</text><text x="100" y="178">Phagocytosis</text>
								<text x="300" y="155" font-weight="700">B · Lymphocyte</text><text x="300" y="178">Antibodies</text>
								<text x="500" y="155" font-weight="700">C · Red blood cell</text><text x="500" y="178">Oxygen transport</text>
								<text x="700" y="155" font-weight="700">D · Plasma</text><text x="700" y="178">Dissolved substances</text>
							</g>
						</svg>
						<figcaption>The multilobed nucleus is characteristic of a neutrophil, a type of phagocyte.</figcaption>
					</figure>
					<table class="comparison-table">
						<caption>Blood components and their roles</caption>
						<thead><tr><th scope="col">Label</th><th scope="col">Component</th><th scope="col">Function</th></tr></thead>
						<tbody>
							<tr><th scope="row">A</th><td>Phagocyte (neutrophil)</td><td>Engulfs and digests pathogens by phagocytosis.</td></tr>
							<tr><th scope="row">B</th><td>Lymphocyte</td><td>Produces antibodies as part of the immune response.</td></tr>
							<tr><th scope="row">C</th><td>Red blood cell</td><td>Transports oxygen using haemoglobin.</td></tr>
							<tr><th scope="row">D</th><td>Plasma</td><td>Transports dissolved substances, including nutrients, hormones and urea.</td></tr>
						</tbody>
					</table>
					<h3>Stages of phagocytosis</h3>
					<figure class="phagocytosis-figure">
						<svg viewBox="0 0 760 230" role="img" aria-labelledby="phagocytosis-title phagocytosis-desc" xmlns="http://www.w3.org/2000/svg">
							<title id="phagocytosis-title">Three stages of phagocytosis</title>
							<desc id="phagocytosis-desc">A phagocyte recognizes a pathogen, engulfs it, and digests it with enzymes.</desc>
							<defs><marker id="phagocytosis-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#1e654f"/></marker></defs>
							<g class="blood-cell-outline">
								<circle cx="105" cy="88" r="50" fill="#eaf2e7"/><circle cx="143" cy="54" r="13" fill="#a63d38"/>
								<circle cx="380" cy="88" r="50" fill="#eaf2e7"/><circle cx="380" cy="75" r="16" fill="#a63d38"/>
								<circle cx="655" cy="88" r="50" fill="#eaf2e7"/><circle cx="655" cy="88" r="12" fill="#a63d38"/><circle cx="639" cy="103" r="4" fill="#a63d38"/><circle cx="668" cy="104" r="4" fill="#a63d38"/>
							</g>
							<path d="M190 88 H280 M465 88 H555" fill="none" stroke="#1e654f" stroke-width="3" marker-end="url(#phagocytosis-arrow)"/>
							<g text-anchor="middle" fill="#193b34" font-family="Avenir Next, Avenir, Segoe UI, sans-serif" font-size="16" font-weight="700">
								<text x="120" y="175">1. Recognize pathogen</text><text x="380" y="175">2. Engulf pathogen</text><text x="640" y="175">3. Digest with enzymes</text>
							</g>
						</svg>
						<figcaption>Engulf → digest → destroy the pathogen.</figcaption>
					</figure>
					<p class="exam-tip"><strong>IGCSE exam tip:</strong> Phagocytes often have a lobed nucleus and carry out a non-specific defence. Lymphocytes have a large, round nucleus and produce specific antibodies.</p>
				`
			},
			{
				title: "The diagrams show four different stages in one heartbeat. What is the correct order for the stages after stage P?",
				legend: "Choose the correct order of the heart-cycle stages after P",
				context: `
					<figure class="circulation-diagram">
						<img src="question-21.png" alt="Four heart diagrams labelled P, Q, R and S showing blood-flow directions during one heartbeat" loading="lazy" decoding="async">
					</figure>
				`,
				options: ["Q → R → S", "R → Q → S", "R → S → Q", "S → R → Q"],
				correct: "B",
				answer: "B. R → Q → S",
				explanation: `
					<p class="definition">The cardiac cycle is the sequence of events during one heartbeat.</p>
					<table class="comparison-table">
						<caption>Identify each stage</caption>
						<thead><tr><th scope="col">Stage</th><th scope="col">What happens?</th></tr></thead>
						<tbody>
							<tr><th scope="row">P</th><td>Blood returns through the veins and enters the atria.</td></tr>
							<tr><th scope="row">R</th><td>The atria contract and push blood into the ventricles (atrial systole).</td></tr>
							<tr><th scope="row">Q</th><td>The ventricles contract and pump blood into the pulmonary artery and aorta (ventricular systole).</td></tr>
							<tr><th scope="row">S</th><td>Blood continues through the arteries while the atria receive blood from the veins.</td></tr>
						</tbody>
					</table>
					<div class="translocation-flow" role="img" aria-label="After P, the atria contract at R, then ventricles contract at Q, then blood continues flowing at S">
						<div class="flow-step"><strong>R · Atrial systole</strong><span>Atria push blood into ventricles</span></div>
						<span class="flow-arrow" aria-hidden="true">→</span>
						<div class="flow-step"><strong>Q · Ventricular systole</strong><span>Ventricles pump blood into arteries</span></div>
						<span class="flow-arrow" aria-hidden="true">→</span>
						<div class="flow-step"><strong>S · Continuing flow</strong><span>Blood moves through arteries as atria refill</span></div>
					</div>
					<h3>Check the options</h3>
					<ul class="option-explanations">
						<li><strong>A. Q → R → S:</strong> Places ventricular contraction before atrial contraction.</li>
						<li><strong>B. R → Q → S:</strong> Correct. The atria contract first, then the ventricles, followed by continuing blood flow.</li>
						<li><strong>C. R → S → Q:</strong> Places continuing flow before ventricular contraction.</li>
						<li><strong>D. S → R → Q:</strong> Starts with continuing flow instead of the atria contracting after P.</li>
					</ul>
					<h3>IGCSE exam tip</h3>
					<p><strong>Systole</strong> means contraction, which raises pressure and pushes blood out of a chamber. The atria contract before the ventricles, so the ventricles fill before pumping blood away from the heart.</p>
				`
			}
		];
		const questionStates = questions.map(() => ({ selected: null, checked: false }));

		function renderQuestionNavigator() {
			questionNavList.innerHTML = questions.map((question, index) => {
				const state = questionStates[index];
				const status = state.checked
					? state.selected === question.correct ? "Correct" : "Wrong"
					: state.selected ? "Selected" : "Not started";
				const resultClass = state.checked ? state.selected === question.correct ? " is-correct" : " is-wrong" : "";
				return `<button class="question-nav-item${resultClass}" type="button" data-question-index="${index}" aria-label="Question ${index + 1}: ${status}" title="Question ${index + 1}: ${status}"${index === currentQuestionIndex ? ' aria-current="step"' : ""}>
					<span class="question-nav-number" aria-hidden="true">${index + 1}</span>
				</button>`;
			}).join("");
		}

		function showQuestionFeedback(question, state) {
			const isCorrect = state.selected === question.correct;
			feedback.className = `feedback visible ${isCorrect ? "correct" : "incorrect"}`;
			feedback.innerHTML = `<strong class="feedback-title">${isCorrect ? `Correct: ${question.answer}` : `Not quite. The correct answer is ${question.answer}.`}</strong>${question.explanation}`;
		}

		function syncAnswerTableSelection() {
			const selected = questionStates[currentQuestionIndex].selected;
			questionContext.querySelectorAll("tr[data-answer-choice]").forEach((row) => {
				const isSelected = row.dataset.answerChoice === selected;
				row.classList.toggle("is-selected", isSelected);
				row.querySelector("button[data-answer-choice]")?.setAttribute("aria-pressed", String(isSelected));
			});
		}

		function renderQuestion() {
			const question = questions[currentQuestionIndex];
			const state = questionStates[currentQuestionIndex];
			questionCount.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
			progressTrack.setAttribute("aria-valuemax", questions.length);
			progressTrack.setAttribute("aria-valuenow", currentQuestionIndex + 1);
			progressValue.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
			questionTitle.innerHTML = question.title;
			questionContext.innerHTML = question.context || "";
			syncAnswerTableSelection();
			questionLegend.textContent = question.legend;
			answerOptions.hidden = Boolean(question.hideAnswerOptions);
			answerOptions.innerHTML = question.options.map((option, index) => {
				const letter = String.fromCharCode(65 + index);
				return `<label class="answer">
					<input type="radio" name="answer" value="${letter}"${state.selected === letter ? " checked" : ""}>
					<span class="letter" aria-hidden="true">${letter}</span>
					<span class="answer-text${question.letterOnlyOptions ? " visually-hidden" : ""}">${option}</span>
				</label>`;
			}).join("");
			checkButton.disabled = !state.selected || state.checked;
			selectionHint.textContent = state.checked ? "Answer checked" : state.selected ? "Ready to check" : "Select an option to continue";
			if (state.checked) {
				showQuestionFeedback(question, state);
			} else {
				feedback.className = "feedback";
				feedback.textContent = "";
			}
			nextQuestionButton.hidden = !state.checked;
			nextQuestionButton.textContent = currentQuestionIndex === questions.length - 1
				? (questionStates.every((item) => item.checked) ? "Restart quiz" : "Review unanswered")
				: "Next question";
			renderQuestionNavigator();
		}

		function updateTextSize() {
			quiz.style.setProperty("--quiz-scale", textScale);
			textSizeValue.value = `${Math.round(textScale * 100)}%`;
			decreaseTextButton.disabled = textScale <= 0.8;
			increaseTextButton.disabled = textScale >= 2;
		}

		decreaseTextButton.addEventListener("click", () => {
			textScale = Math.max(0.8, Math.round((textScale - 0.1) * 10) / 10);
			updateTextSize();
		});

		increaseTextButton.addEventListener("click", () => {
			textScale = Math.min(2, Math.round((textScale + 0.1) * 10) / 10);
			updateTextSize();
		});

		resetTextButton.addEventListener("click", () => {
			textScale = defaultTextScale;
			updateTextSize();
		});

		updateTextSize();
		renderQuestion();

		navigatorToggle.addEventListener("click", () => {
			const isExpanded = navigatorToggle.getAttribute("aria-expanded") === "true";
			quizLayout.classList.toggle("navigator-hidden", isExpanded);
			navigatorToggle.setAttribute("aria-expanded", String(!isExpanded));
			navigatorToggle.setAttribute("aria-label", isExpanded ? "Show questions" : "Hide questions");
			navigatorToggle.title = isExpanded ? "Show questions" : "Hide questions";
		});

		questionNavList.addEventListener("click", (event) => {
			const button = event.target.closest("[data-question-index]");
			if (!button) return;
			currentQuestionIndex = Number(button.dataset.questionIndex);
			renderQuestion();
			questionTitle.focus();
		});

		questionContext.addEventListener("click", (event) => {
			const row = event.target.closest("tr[data-answer-choice]");
			if (!row) return;
			const radio = form.querySelector(`input[name="answer"][value="${row.dataset.answerChoice}"]`);
			if (!radio) return;
			radio.checked = true;
			radio.dispatchEvent(new Event("change", { bubbles: true }));
		});

		form.addEventListener("change", (event) => {
			if (!event.target.matches('input[name="answer"]')) return;
			questionStates[currentQuestionIndex].selected = new FormData(form).get("answer");
			questionStates[currentQuestionIndex].checked = false;
			checkButton.disabled = false;
			selectionHint.textContent = "Ready to check";
			feedback.className = "feedback";
			feedback.textContent = "";
			nextQuestionButton.hidden = true;
			syncAnswerTableSelection();
			renderQuestionNavigator();
		});

		form.addEventListener("submit", (event) => {
			event.preventDefault();
			const selected = new FormData(form).get("answer");
			if (!selected) return;

			const question = questions[currentQuestionIndex];
			const state = questionStates[currentQuestionIndex];
			state.selected = selected;
			state.checked = true;
			showQuestionFeedback(question, state);
			selectionHint.textContent = questionStates.every((item) => item.checked) ? "Quiz complete" : "Answer checked";
			checkButton.disabled = true;
			nextQuestionButton.hidden = false;
			nextQuestionButton.textContent = currentQuestionIndex === questions.length - 1
				? (questionStates.every((item) => item.checked) ? "Restart quiz" : "Review unanswered")
				: "Next question";
			renderQuestionNavigator();
		});

		feedback.addEventListener("input", (event) => {
			if (event.target.id !== "light-intensity-slider") return;
			const measurement = graphMeasurements[Number(event.target.value)];
			const activeLine = feedback.querySelector("#graph-active-line");
			const activePoint = feedback.querySelector("#graph-active-point");
			const graphOutput = feedback.querySelector("#graph-output");
			if (!activeLine || !activePoint || !graphOutput) return;

			activeLine.setAttribute("x1", measurement.x);
			activeLine.setAttribute("x2", measurement.x);
			activePoint.setAttribute("cx", measurement.x);
			activePoint.setAttribute("cy", measurement.y);
			graphOutput.textContent = `${measurement.intensity.toFixed(1)} units · ${measurement.oxygen.toFixed(1)} mm³/hour`;
			event.target.setAttribute("aria-valuetext", `${measurement.intensity.toFixed(1)} arbitrary units; oxygen production ${measurement.oxygen.toFixed(1)} cubic millimetres per hour`);
		});

		nextQuestionButton.addEventListener("click", () => {
			if (questionStates.every((state) => state.checked)) {
				questionStates.forEach((state) => {
					state.selected = null;
					state.checked = false;
				});
				currentQuestionIndex = 0;
			} else if (currentQuestionIndex === questions.length - 1) {
				currentQuestionIndex = questionStates.findIndex((state) => !state.checked);
			} else {
				currentQuestionIndex += 1;
			}
			renderQuestion();
			questionTitle.focus();
		});
	</script>
</body>
