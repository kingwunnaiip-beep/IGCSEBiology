<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Cells form tissues, and tissues form a root organ</title><desc id="desc">A single outer root cell P belongs to a tissue. Tissue Q is a group of cells, and root R is a complete organ containing several tissues. The diagram shows increasing levels of organisation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#397653"/></marker></defs><rect width="960" height="560" rx="20" fill="#faf8ed"/><g font-family="Arial, sans-serif"><text x="36" y="48" font-size="28" text-anchor="start" fill="#173f31" font-weight="bold">Cells form tissues, and tissues form a root organ</text><rect x="35" y="96" width="262" height="340" rx="14" fill="#e0eedc" stroke="#397653" stroke-width="2"/><rect x="349" y="96" width="262" height="340" rx="14" fill="#e0eedc" stroke="#397653" stroke-width="2"/><rect x="663" y="96" width="262" height="340" rx="14" fill="#e0eedc" stroke="#397653" stroke-width="2"/><text x="166" y="137" font-size="25" text-anchor="middle" fill="#173f31" font-weight="bold">P: one cell</text><rect x="109" y="195" width="113" height="110" rx="14" fill="#e0eedc" stroke="#397653" stroke-width="2"/><circle cx="166" cy="247" r="17" fill="#638969" stroke="#397653" stroke-width="3"/><text x="166" y="391" font-size="21" text-anchor="middle" fill="#173f31" font-weight="normal">Basic living unit</text><text x="480" y="137" font-size="25" text-anchor="middle" fill="#173f31" font-weight="bold">Q: tissue</text><rect x="397" y="197" width="50" height="55" rx="7" fill="#d3e5c8" stroke="#397653" stroke-width="2"/><circle cx="422" cy="224" r="7" fill="#638969" stroke="#397653" stroke-width="1"/><rect x="397" y="257" width="50" height="55" rx="7" fill="#d3e5c8" stroke="#397653" stroke-width="2"/><circle cx="422" cy="284" r="7" fill="#638969" stroke="#397653" stroke-width="1"/><rect x="451" y="197" width="50" height="55" rx="7" fill="#d3e5c8" stroke="#397653" stroke-width="2"/><circle cx="476" cy="224" r="7" fill="#638969" stroke="#397653" stroke-width="1"/><rect x="451" y="257" width="50" height="55" rx="7" fill="#d3e5c8" stroke="#397653" stroke-width="2"/><circle cx="476" cy="284" r="7" fill="#638969" stroke="#397653" stroke-width="1"/><rect x="505" y="197" width="50" height="55" rx="7" fill="#d3e5c8" stroke="#397653" stroke-width="2"/><circle cx="530" cy="224" r="7" fill="#638969" stroke="#397653" stroke-width="1"/><rect x="505" y="257" width="50" height="55" rx="7" fill="#d3e5c8" stroke="#397653" stroke-width="2"/><circle cx="530" cy="284" r="7" fill="#638969" stroke="#397653" stroke-width="1"/><text x="480" y="364" font-size="21" text-anchor="middle" fill="#173f31" font-weight="normal">Cells working</text><text x="480" y="392" font-size="21" text-anchor="middle" fill="#173f31" font-weight="normal">together</text><text x="794" y="137" font-size="25" text-anchor="middle" fill="#173f31" font-weight="bold">R: root organ</text><circle cx="794" cy="251" r="84" fill="#d3e5c8" stroke="#397653" stroke-width="3"/><circle cx="794" cy="251" r="64" fill="#f5f3df" stroke="#397653" stroke-width="3"/><path d="M794 209L805 238L835 251L805 263L794 293L783 263L753 251L783 238Z" fill="#6c9672" stroke="#397653" stroke-width="2"/><text x="794" y="365" font-size="21" text-anchor="middle" fill="#173f31" font-weight="normal">Several tissues</text><text x="794" y="393" font-size="21" text-anchor="middle" fill="#173f31" font-weight="normal">working together</text><path d="M303 261L340 261" fill="none" stroke="#397653" stroke-width="3"/><polygon points="340,261 328.0,256.0 328.0,266.0" fill="#397653"/><path d="M617 261L654 261" fill="none" stroke="#397653" stroke-width="3"/><polygon points="654,261 642.0,256.0 642.0,266.0" fill="#397653"/><text x="480" y="502" font-size="27" text-anchor="middle" fill="#173f31" font-weight="bold">cell → tissue → organ</text></g></svg>