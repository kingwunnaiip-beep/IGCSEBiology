<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">A membrane pulls away from the cell wall</title><desc id="desc">The rigid wall stays rectangular while the cell contents and membrane shrink away from it. Arrows show water moving out across the partially permeable membrane. The space between membrane and wall grows as the cell plasmolyses.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#32745a" stroke-width="1.5"/></marker></defs><rect width="1000" height="620" rx="22" fill="#faf8e9"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="54" font-size="30" text-anchor="start" fill="#183f35" font-weight="bold">A membrane pulls away from the cell wall</text><rect x="80" y="140" width="470" height="320" rx="30" fill="#eef3d8" stroke="#4c6e43" stroke-width="12"/><path d="M110 170 Q300 280 520 170 Q410 295 520 430 Q300 320 110 430 Q220 300 110 170 Z" stroke="#24765b" stroke-width="4" fill="#c3dfc3" /><circle cx="295" cy="300" r="29" fill="#50775e"/><path d="M380 226 L380 100" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><path d="M405 375 L610 430" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><text x="405" y="100" font-size="23" text-anchor="start" fill="#183f35" font-weight="normal">Water out</text><text x="650" y="177" font-size="23" text-anchor="start" fill="#183f35" font-weight="normal">Rigid cell wall</text><text x="650" y="209" font-size="23" text-anchor="start" fill="#183f35" font-weight="normal">keeps its outline</text><path d="M640 190 L550 185" stroke="#32745a" stroke-width="2" fill="none" /><text x="650" y="310" font-size="23" text-anchor="start" fill="#183f35" font-weight="normal">Cell membrane</text><text x="650" y="342" font-size="23" text-anchor="start" fill="#183f35" font-weight="normal">moves with the</text><text x="650" y="374" font-size="23" text-anchor="start" fill="#183f35" font-weight="normal">shrinking contents</text><path d="M640 325 L470 300" stroke="#32745a" stroke-width="2" fill="none" /><text x="650" y="465" font-size="23" text-anchor="start" fill="#183f35" font-weight="normal">Space opens</text><text x="650" y="497" font-size="23" text-anchor="start" fill="#183f35" font-weight="normal">inside the wall</text><path d="M640 460 L500 448" stroke="#32745a" stroke-width="2" fill="none" /><text x="500" y="570" font-size="26" text-anchor="middle" fill="#183f35" font-weight="normal">Plasmolysis follows water loss by osmosis.</text></g></svg>