 y2="335" stroke="#25614b" stroke-width="4"/><polygon points="768,335 754.6950761583107,341.92668763312224 754.6950761583107,328.07331236687776" fill="#25614b"/><line x1="855" y1="405" x2="855" y2="325.0" stroke="#25614b" stroke-width="3.84"/><ellipse cx="835.8" cy="366.6" rx="23.04" ry="9.6" fill="#a8ca8e" stroke="#25614b" stroke-width="2"/><ellipse cx="874.2" cy="344.84" rx="23.04" ry="9.6" fill="#a8ca8e" stroke="#25614b" stroke-width="2"/><line x1="807.0" y1="411.4" x2="903.0" y2="411.4" stroke="#936f32" stroke-width="3"/><path d="M 855 411.4 L 835.8 436.36 M 855 411.4 L 877.4 439.56" fill="none" stroke="#936f32" stroke-width="3"/><text x="500" y="545" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >The introduced gene is expressed.</text><text x="500" y="583" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >The crop’s nutritional qualities can be improved.</text><text x="500" y="666" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Distinguish the other agricultural methods</text><rect x="48" y="719" width="904" height="113" rx="12" fill="#edf5f8" stroke="none" stroke-width="2"/><circle cx="92" cy="763" r="25" fill="#fffdf7" stroke="#357ca2" stroke-width="2"/><text x="92" y="772" font-size="27" fill="#357ca2" font-weight="700" text-anchor="middle" >A</text><text x="141" y="761" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >Selective breeding of cattle</text><text x="141" y="803" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >Choose high-milk-yield parents to pass on their alleles.</text><rect x="48" y="855" width="904" height="113" rx="12" fill="#edf5f8" stroke="none" stroke-width="2"/><circle cx="92" cy="899" r="25" fill="#fffdf7" stroke="#357ca2" stroke-width="2"/><text x="92" y="908" font-size="27" fill="#357ca2" font-weight="700" text-anchor="middle" >B</text><text x="141" y="897" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >Crop management</text><text x="141" y="939" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >Use insecticides to reduce damage and improve yield.</text><rect x="48" y="991" width="904" height="113" rx="12" fill="#edf5f8" stroke="none" stroke-width="2"/><circle cx="92" cy="1035" r="25" fill="#fffdf7" stroke="#357ca2" stroke-width="2"/><text x="92" y="1044" font-size="27" fill="#357ca2" font-weight="700" text-anchor="middle" >D</text><text x="141" y="1033" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >Selective breeding of crop plants</text><text x="141" y="1075" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >Cross selected parents with desirable characteristics.</text><text x="500" y="1170" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >A gene-transfer step identifies genetic modification.</text><rect x="24" y="1214" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1248" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · Insert genes into crop plants to improve nutrition</text>
