<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250" role="img" aria-labelledby="q190-title q190-desc">
<title id="q190-title">190 · A mean needs all five yearly values</title>
<desc id="q190-desc">Answer C. The source reports new forest planted in square kilometres: 6500 in 2017, 9000 in 2018, 13500 in 2019, 13700 in 2020 and 13300 in 2021. The sum is 56000 square kilometres over five yearly values, giving a mean of 11200 square kilometres each year. The maximum is in 2020 and the value falls in 2021. The percentage increase between 2017 and 2021 is 6800 divided by the initial 6500 times 100, approximately 104.6 percent. Values are source data; no graph or invented measurements are added.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1250" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >190 · A mean needs all five yearly values</text><text x="500" y="110" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Annual new planting area, not total forest cover.</text><rect x="105" y="156" width="790" height="400" rx="12" fill="#edf5f8" stroke="none" stroke-width="2"/><text x="308" y="204" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Year</text><text x="650" y="204" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >New forest / km²</text><text x="308" y="269" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >2017</text><text x="650" y="269" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >6500</text><text x="308" y="327" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >2018</text><text x="650" y="327" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >9000</text><text x="308" y="385" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >2019</text><text x="650" y="385" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >13 500</text><text x="308" y="443" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >2020</text><text x="650" y="443" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >13 700</text><text x="308" y="501" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >2021</text><text x="650" y="501" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >13 300</text><rect x="65" y="600" width="870" height="139" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="642" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Total = 56 000 km²</text><text x="500.0" y="686" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Mean = 56 000 ÷ 5 = 11 200 km²</text><rect x="65" y="781" width="870" height="139" rx="12" fill="#f4efdf" stroke="#daa958" stroke-width="2"/><text x="500.0" y="823" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Maximum: 2020 · Then a decrease in 2021</text><text x="500.0" y="867" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The annual area did not increase every year.</text><rect x="65" y="962" width="870" height="139" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="1004" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Percentage increase uses the starting value</text><text x="500.0" y="1048" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >(13 300 − 6500) ÷ 6500 × 100 ≈ 104.6%</text><rect x="24" y="1174" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1208" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · Mean annual new forest area = 11 200 km²</text>
</g></svg>