<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1220" viewBox="0 0 1000 1220" role="img" aria-labelledby="q125-title q125-desc">
<title id="q125-title">125 · Dietary fibre helps prevent constipation</title>
<desc id="q125-desc">Answer B: dietary fibre helps prevent constipation. Fibre passes through the small intestine without being digested by human digestive enzymes. In the colon, fibre helps retain water and adds bulk to the contents, making faeces easier to move along by peristalsis. The arrows show movement of contents through a simplified section of colon; they do not represent measured speed. Fruits, vegetables and wholegrain foods are useful sources of fibre. Fibre has a different role from energy-supplying nutrients, mineral ions and vitamins.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
