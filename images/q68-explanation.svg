idth="2.5"/><text x="420" y="402" font-size="24" fill="#173d31" font-weight="700" text-anchor="middle" >II-1</text><text x="420" y="434" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >ll</text><circle cx="580" cy="340" r="34" fill="none" stroke="#25614b" stroke-width="4"/><circle cx="580" cy="340" r="24" fill="#fffdf7" stroke="#173d31" stroke-width="2.5"/><text x="580" y="402" font-size="24" fill="#173d31" font-weight="700" text-anchor="middle" >II-2</text><text x="580" y="434" font-size="24" fill="#25614b" font-weight="700" text-anchor="middle" >Ll</text><rect x="106" y="516" width="48" height="48" rx="0" fill="#fffdf7" stroke="#173d31" stroke-width="2.5"/><text x="130" y="602" font-size="24" fill="#173d31" font-weight="700" text-anchor="middle" >III-1</text><text x="130" y="634" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >LL or Ll</text><circle cx="270" cy="540" r="24" fill="#aab5b1" stroke="#173d31" stroke-width="2.5"/><text x="270" y="602" font-size="24" fill="#173d31" font-weight="700" text-anchor="middle" >III-2</text><text x="270" y="634" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >ll</text><rect x="476" y="506" width="68" height="68" rx="3" fill="none" stroke="#25614b" stroke-width="4"/><rect x="486" y="516" width="48" height="48" rx="0" fill="#fffdf7" stroke="#173d31" stroke-width="2.5"/><text x="510" y="602" font-size="24" fill="#173d31" font-weight="700" text-anchor="middle" >III-3</text><text x="510" y="634" font-size="24" fill="#25614b" font-weight="700" text-anchor="middle" >Ll</text><circle cx="710" cy="540" r="34" fill="none" stroke="#25614b" stroke-width="4"/><circle cx="710" cy="540" r="24" fill="#fffdf7" stroke="#173d31" stroke-width="2.5"/><text x="710" y="602" font-size="24" fill="#173d31" font-weight="700" text-anchor="middle" >III-4</text><text x="710" y="634" font-size="24" fill="#25614b" font-weight="700" text-anchor="middle" >Ll</text><rect x="816" y="506" width="68"