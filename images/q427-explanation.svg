<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Cholera toxin causes secretion into the small intestine</title><desc id="desc">Cholera toxin makes small-intestinal cells secrete chloride into the lumen. Lower lumen water potential draws water from tissue fluid by osmosis, causing diarrhoea.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#39725b"/></marker></defs><rect width="1100" height="560" rx="22" fill="#fbf8e9"/><g font-family="Arial, sans-serif"><text x="40" y="55" font-size="30" text-anchor="start" fill="#173d31">Cholera toxin causes secretion into the small intestine</text><rect x="45" y="145" width="270" height="290" rx="15" fill="#e4edcf" stroke="#39725b" stroke-width="3"/><text x="180" y="190" font-size="23" text-anchor="middle" fill="#173d31">Blood / tissue fluid</text><text x="180" y="255" font-size="25" text-anchor="middle" fill="#173d31">Higher water</text><text x="180" y="290" font-size="25" text-anchor="middle" fill="#173d31">potential</text><rect x="385" y="145" width="240" height="290" rx="15" fill="#c5dcad" stroke="#39725b" stroke-width="3"/><text x="505" y="190" font-size="23" text-anchor="middle" fill="#173d31">Intestinal cells</text><text x="505" y="255" font-size="24" text-anchor="middle" fill="#173d31">Toxin triggers</text><text x="505" y="290" font-size="24" text-anchor="middle" fill="#173d31">Cl⁻ secretion</text><rect x="695" y="145" width="360" height="290" rx="15" fill="#e4edcf" stroke="#39725b" stroke-width="3"/><text x="875" y="190" font-size="24" text-anchor="middle" fill="#173d31">Small-intestinal lumen</text><text x="875" y="255" font-size="24" text-anchor="middle" fill="#173d31">More dissolved ions</text><text x="875" y="290" font-size="24" text-anchor="middle" fill="#173d31">Lower water potential</text><text x="875" y="385" font-size="24" text-anchor="middle" fill="#173d31">Water → diarrhoea</text><path d="M580 315 L760 315" fill="none" stroke="#39725b" stroke-width="5" marker-end="url(#arrow)"/><text x="670" y="355" font-size="25" text-anchor="middle" fill="#173d31">Cl⁻</text><path d="M255 390 L750 390" fill="none" stroke="#39725b" stroke-width="5" marker-end="url(#arrow)"/><text x="485" y="475" font-size="24" text-anchor="middle" fill="#173d31">Water follows by osmosis across the epithelium</text><text x="40" y="530" font-size="17" text-anchor="start" fill="#536b57">Original teaching schematic • qualitative, not to scale</text></g></svg>