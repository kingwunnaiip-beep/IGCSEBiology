<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" role="img" aria-labelledby="title495 desc495"><title id="title495">Amphibian eggs and reptile eggs</title><desc id="desc495">Amphibian eggs in water contrasted with a reptile egg with a protective covering, usually on land. Both are schematic examples.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#185744"/></marker></defs><rect width="800" height="530" rx="20" fill="#fbf8ed"/><g font-family="Arial, sans-serif"><text x="400" y="55" font-size="28" text-anchor="middle" fill="#185744" font-weight="bold">Amphibian eggs and reptile eggs</text><rect x="40" y="100" width="340" height="300" rx="12" fill="#e1eee2" stroke="#185744" stroke-width="2"/><rect x="420" y="100" width="340" height="300" rx="12" fill="#e1eee2" stroke="#185744" stroke-width="2"/><text x="210" y="140" font-size="26" text-anchor="middle" fill="#185744" font-weight="bold">Amphibian eggs</text><text x="590" y="140" font-size="26" text-anchor="middle" fill="#185744" font-weight="bold">Reptile egg</text><path d="M60 205 Q95 185 130 205 T200 205 T270 205 T360 205" stroke="#397a61" stroke-width="3" fill="none"/><circle cx="130" cy="245" r="27" fill="#d3e9df" stroke="#185744" stroke-width="2"/><circle cx="130" cy="245" r="9" fill="#185744" stroke="#185744" stroke-width="2"/><circle cx="180" cy="220" r="27" fill="#d3e9df" stroke="#185744" stroke-width="2"/><circle cx="180" cy="220" r="9" fill="#185744" stroke="#185744" stroke-width="2"/><circle cx="220" cy="266" r="27" fill="#d3e9df" stroke="#185744" stroke-width="2"/><circle cx="220" cy="266" r="9" fill="#185744" stroke="#185744" stroke-width="2"/><circle cx="270" cy="230" r="27" fill="#d3e9df" stroke="#185744" stroke-width="2"/><circle cx="270" cy="230" r="9" fill="#185744" stroke="#185744" stroke-width="2"/><circle cx="165" cy="286" r="27" fill="#d3e9df" stroke="#185744" stroke-width="2"/><circle cx="165" cy="286" r="9" fill="#185744" stroke="#185744" stroke-width="2"/><ellipse cx="590" cy="245" rx="75" ry="60" fill="#ede4c9" stroke="#185744" stroke-width="4"/><circle cx="590" cy="245" r="24" fill="#d7b44e" stroke="#185744" stroke-width="2"/><text x="210" y="340" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">Jelly-coated eggs</text><text x="210" y="372" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">typically laid in water</text><text x="590" y="340" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">Protective egg covering</text><text x="590" y="372" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">usually laid on land</text><text x="400" y="452" font-size="21" text-anchor="middle" fill="#185744" font-weight="normal">Compare the reproductive feature, not shared limbs or lungs.</text></g></svg>