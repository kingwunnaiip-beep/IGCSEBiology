<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Bacterial insulin avoids animal pancreas extraction</title><desc id="desc">The left drawing shows a pig and the position of the pancreas as an animal insulin source. The right drawing shows a bacterium containing a plasmid with a human insulin gene, producing insulin for a vial. The two sources are alternatives; no arrow connects the animal to the bacterium.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="1.8"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#b85c50" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="38" y="54" font-size="30" fill="#173f32" font-weight="bold">Bacterial insulin avoids animal pancreas extraction</text><ellipse cx="238" cy="303" rx="133" ry="79" fill="#f0c6b7" stroke="#b85c50" stroke-width="4" /><ellipse cx="360" cy="285" rx="52" ry="49" fill="#f0c6b7" stroke="#b85c50" stroke-width="4" /><ellipse cx="396" cy="292" rx="28" ry="23" fill="#f0c6b7" stroke="#b85c50" stroke-width="3" /><path d="M333 251 L328 210 L362 244 M358 248 L368 217 L383 252" fill="#f0c6b7" stroke="#b85c50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="151" y="355" width="23" height="72" rx="5" fill="#f0c6b7" stroke="#b85c50" stroke-width="3" /><rect x="196" y="355" width="23" height="72" rx="5" fill="#f0c6b7" stroke="#b85c50" stroke-width="3" /><rect x="291" y="355" width="23" height="72" rx="5" fill="#f0c6b7" stroke="#b85c50" stroke-width="3" /><rect x="329" y="355" width="23" height="72" rx="5" fill="#f0c6b7" stroke="#b85c50" stroke-width="3" /><circle cx="371" cy="272" r="4" fill="#173f32" stroke="#173f32" stroke-width="1" /><circle cx="393" cy="291" r="3" fill="#b85c50" stroke="#b85c50" stroke-width="1" /><circle cx="405" cy="291" r="3" fill="#b85c50" stroke="#b85c50" stroke-width="1" /><path d="M106 298 q-35 -25 -29 4 q6 25 28 7" fill="none" stroke="#b85c50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M209 321 q16 -21 36 -6 t37 -7" fill="none" stroke="#d1a350" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" /><text x="242" y="157" font-size="28" text-anchor="middle" fill="#173f32" font-weight="bold">Animal source</text><text x="234" y="478" font-size="23" text-anchor="middle" fill="#173f32" font-weight="normal">Animal pancreas</text><text x="234" y="507" font-size="23" text-anchor="middle" fill="#173f32" font-weight="normal">provides extracted insulin</text><rect x="549" y="220" width="267" height="157" rx="73" fill="#e4f0df" stroke="#24644b" stroke-width="4" /><ellipse cx="677" cy="293" rx="58" ry="35" fill="none" stroke="#24644b" stroke-width="5" /><path d="M707 267 Q744 296 705 323" fill="none" stroke="#b85c50" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><path d="M573 282 q28 -32 47 4 t28 0" fill="none" stroke="#82b36b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="683" y="150" font-size="28" text-anchor="middle" fill="#173f32" font-weight="bold">GM bacterium</text><text x="674" y="437" font-size="23" text-anchor="middle" fill="#173f32" font-weight="normal">Human insulin gene</text><text x="674" y="466" font-size="23" text-anchor="middle" fill="#173f32" font-weight="normal">on a plasmid</text><line x1="714" y1="400" x2="722" y2="322" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><rect x="873" y="296" width="79" height="126" rx="10" fill="#dcebf2" stroke="#537c9a" stroke-width="3" /><rect x="889" y="275" width="46" height="26" rx="4" fill="#8b948b" stroke="#24644b" stroke-width="2" /><rect x="879" y="340" width="67" height="43" rx="0" fill="#fff" stroke="#537c9a" stroke-width="1" /><text x="913" y="367" font-size="18" text-anchor="middle" fill="#173f32" font-weight="normal">Insulin</text><line x1="826" y1="314" x2="861" y2="337" stroke="#24644b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="500" y="558" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">B · Avoiding animal extraction can meet vegetarian ethical preferences.</text></g></svg>
