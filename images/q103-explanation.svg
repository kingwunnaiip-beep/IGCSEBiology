<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1220" viewBox="0 0 1000 1220" role="img" aria-labelledby="q103-title q103-desc">
<title id="q103-title">103 · Cholera causes water loss into the intestine</title>
<desc id="q103-desc">Answer A. Cholera bacteria produce a toxin which stimulates intestinal cells to secrete chloride ions into the lumen of the small intestine. More dissolved ions lower the water potential in the lumen. Water then moves through partially permeable membranes into the lumen by osmosis. Excess water in the intestine causes watery diarrhoea and can cause dehydration. The diagram is a qualitative model of ion and water movement; it is not to scale and does not show measured concentrations. Both chloride and water arrows point into the lumen. Water moves down a water potential gradient, not against it.</desc>
