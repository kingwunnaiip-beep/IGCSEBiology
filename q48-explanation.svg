<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="q48-title q48-desc"><title id="q48-title">Day 4 best fits menstruation</title><desc id="q48-desc">The existing schematic lining-thickness curve falls early in the cycle, reaches its minimum around day 6, then rises and levels off. Day 4 is highlighted on the decreasing section, not forced to the minimum.</desc><defs><marker id="q48-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#244d3d"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;font-size:28px;fill:#244d3d}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}.heading{font-size:32px;font-weight:700}.small{font-size:28px}.bold{font-weight:700}.red{fill:#b65350}.blue{fill:#447c9a}.muted{fill:#698476}.arrow{stroke:#244d3d;stroke-width:4;fill:none;marker-end:url(#q48-arrow)}</style><rect x="1" y="1" width="638" height="418" rx="24" fill="#f5f8f2" stroke="#dbe9d7" stroke-width="2"/><text x="30" y="45" class="heading">Day 4 best fits menstruation</text><text x="32" y="93" >Thickness</text><g transform="translate(0 45)"><path d="M60 75 C90 75 98 225 140 235 C190 252 202 170 250 105 C300 42 345 58 600 55 L600 260 H60 Z" fill="#dbe9d7"/><path d="M60 28 V260 H608" fill="none" stroke="#698476" stroke-width="3"/><path d="M60 75 C90 75 98 225 140 235 C190 252 202 170 250 105 C300 42 345 58 600 55" fill="none" stroke="#659b78" stroke-width="6"/><line x1="120" y1="217.198" x2="120" y2="260" stroke="#b65350" stroke-width="3" stroke-dasharray="6 6"/><circle cx="120" cy="217.198" r="10" fill="#b65350" stroke="#ffffff" stroke-width="3"/></g><line x1="60" y1="305" x2="60" y2="313" stroke="#698476" stroke-width="3"/><text x="60" y="346" text-anchor="middle">1</text><line x1="180" y1="305" x2="180" y2="313" stroke="#698476" stroke-width="3"/><text x="180" y="346" text-anchor="middle">7</text><line x1="320" y1="305" x2="320" y2="313" stroke="#698476" stroke-width="3"/><text x="320" y="346" text-anchor="middle">14</text><line x1="460" y1="305" x2="460" y2="313" stroke="#698476" stroke-width="3"/><text x="460" y="346" text-anchor="middle">21</text><line x1="600" y1="305" x2="600" y2="313" stroke="#698476" stroke-width="3"/><text x="600" y="346" text-anchor="middle">28</text><path d="M104 367 L118 282" class="arrow"/><text x="35" y="399" class="bold red">Day 4</text><text x="397" y="399" >Cycle day</text></svg>
