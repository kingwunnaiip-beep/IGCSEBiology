<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Sustainable harvesting keeps the forest growing</title><desc id="desc">Selective cutting leaves some trees. Replanting and regrowth replace harvested trees, allowing repeated use if harvesting is controlled. Education supports forest management. Clearing forest for crop plants removes the forest resource instead of regenerating it.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L8 3 Z" fill="#245c43"/></marker></defs>
<rect width="1000" height="600" rx="24" fill="#fbf8ec"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="42" y="58" font-size="32" text-anchor="start" fill="#173f31" font-weight="bold">Sustainable harvesting keeps the forest growing</text><rect x="55" y="110" width="300" height="110" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="205" y="150" font-size="25" text-anchor="middle" fill="#173f31" font-weight="normal">1. Selective cutting</text><text x="205" y="186" font-size="25" text-anchor="middle" fill="#173f31" font-weight="normal">Some trees remain</text><rect x="645" y="110" width="300" height="110" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="795" y="150" font-size="25" text-anchor="middle" fill="#173f31" font-weight="normal">3. Replanting</text><text x="795" y="186" font-size="25" text-anchor="middle" fill="#173f31" font-weight="normal">New trees establish</text><rect x="345" y="365" width="310" height="100" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="500" y="403" font-size="25" text-anchor="middle" fill="#173f31" font-weight="normal">Regrowth</text><text x="500" y="437" font-size="25" text-anchor="middle" fill="#173f31" font-weight="normal">Forest resource replaced</text><path d="M355 166 L630 166" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><path d="M795 220 L650 380" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><path d="M345 380 L205 220" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><rect x="365" y="260" width="270" height="60" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="500" y="299" font-size="26" text-anchor="middle" fill="#173f31" font-weight="bold">2. Education</text><text x="500" y="525" font-size="27" text-anchor="middle" fill="#173f31" font-weight="bold">Control harvesting so regeneration can keep pace.</text><text x="500" y="566" font-size="24" text-anchor="middle" fill="#173f31" font-weight="normal">Converting forest to cropland removes the forest resource.</text></g></svg>