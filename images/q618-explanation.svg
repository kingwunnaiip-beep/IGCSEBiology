<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Photosynthesis lowers CO₂: orange becomes purple</title><desc id="desc">An illuminated aquatic plant is shown in hydrogencarbonate indicator before and after three hours. Indicator changes from orange to purple when photosynthetic carbon-dioxide uptake exceeds respiration.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="53" font-size="31" text-anchor="start" font-weight="bold" fill="#173f32">Photosynthesis lowers CO₂: orange becomes purple</text><path d="M165 150 V430 A95 65 0 0 0 355 430 V150 Z" fill="#f6f8ed" stroke="#537c9a" stroke-width="4"/><path d="M170 225 H350 V430 A90 60 0 0 1 170 430 Z" fill="#e8b671" stroke="none" stroke-width="3"/><rect x="155" y="135" width="210" height="25" rx="0" fill="#c4b28e" stroke="#8f805d" stroke-width="3"/><path d="M260 465 Q250 370.0 265 275" fill="none" stroke="#24644b" stroke-width="7"/><g transform="translate(260.6125 398.5) rotate(20)"><path d="M0 0 Q-33.75 -30 -75 0 Q-33.75 30 0 0" fill="#91b68b" stroke="#24644b" stroke-width="3"/><path d="M0 0 H-75" stroke="#24644b" stroke-width="2"/></g><g transform="translate(261.5125 360.5) rotate(-20)"><path d="M0 0 Q33.75 -30 75 0 Q33.75 30 0 0" fill="#91b68b" stroke="#24644b" stroke-width="3"/><path d="M0 0 H75" stroke="#24644b" stroke-width="2"/></g><g transform="translate(262.8125 322.5) rotate(20)"><path d="M0 0 Q-33.75 -30 -75 0 Q-33.75 30 0 0" fill="#91b68b" stroke="#24644b" stroke-width="3"/><path d="M0 0 H-75" stroke="#24644b" stroke-width="2"/></g><path d="M645 150 V430 A95 65 0 0 0 835 430 V150 Z" fill="#f6f8ed" stroke="#537c9a" stroke-width="4"/><path d="M650 225 H830 V430 A90 60 0 0 1 650 430 Z" fill="#b09ac3" stroke="none" stroke-width="3"/><rect x="635" y="135" width="210" height="25" rx="0" fill="#c4b28e" stroke="#8f805d" stroke-width="3"/><path d="M740 465 Q730 370.0 745 275" fill="none" stroke="#24644b" stroke-width="7"/><g transform="translate(740.6125 398.5) rotate(20)"><path d="M0 0 Q-33.75 -30 -75 0 Q-33.75 30 0 0" fill="#91b68b" stroke="#24644b" stroke-width="3"/><path d="M0 0 H-75" stroke="#24644b" stroke-width="2"/></g><g transform="translate(741.5125 360.5) rotate(-20)"><path d="M0 0 Q33.75 -30 75 0 Q33.75 30 0 0" fill="#91b68b" stroke="#24644b" stroke-width="3"/><path d="M0 0 H75" stroke="#24644b" stroke-width="2"/></g><g transform="translate(742.8125 322.5) rotate(20)"><path d="M0 0 Q-33.75 -30 -75 0 Q-33.75 30 0 0" fill="#91b68b" stroke="#24644b" stroke-width="3"/><path d="M0 0 H-75" stroke="#24644b" stroke-width="2"/></g><text x="260" y="120" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">Start: orange</text><text x="740" y="120" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">3 hours: purple</text><circle cx="200" cy="265" r="8" fill="#6d7471" stroke="none" stroke-width="0"/><circle cx="310" cy="280" r="8" fill="#6d7471" stroke="none" stroke-width="0"/><circle cx="205" cy="355" r="8" fill="#6d7471" stroke="none" stroke-width="0"/><circle cx="310" cy="390" r="8" fill="#6d7471" stroke="none" stroke-width="0"/><circle cx="795" cy="290" r="8" fill="#6d7471" stroke="none" stroke-width="0"/><path d="M405 330 L590 330" fill="none" stroke="#24644b" stroke-width="5" marker-end="url(#arrow)"/><text x="500" y="285" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">CO₂ falls</text><path d="M945 220 L850 220" fill="none" stroke