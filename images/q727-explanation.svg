<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Kinetic energy follows temperature, not the rate peak</title><desc id="desc">An enzyme-rate curve rises to a peak B then falls to D at the highest plotted temperature. Fast particle arrows at the hot end show greater molecular kinetic energy even though the enzyme reaction has slowed.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">Kinetic energy follows temperature, not the rate peak</text><path d="M130 450 V160" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M130 450 H810" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="60" y="140" font-size="23" fill="#173f32" text-anchor="start" font-weight="400">Rate</text><text x="470" y="485" font-size="23" fill="#173f32" text-anchor="middle" font-weight="400">Temperature</text><path d="M160 435 C260 425 390 190 465 190 C500 190 545 235 565 285 C585 335 610 420 635 450" fill="none" stroke="#24644b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="160" cy="435" r="6" fill="#24644b" stroke="#24644b" stroke-width="1"/><text x="172" y="422" font-size="25" fill="#173f32" text-anchor="start" font-weight="700">A</text><circle cx="465" cy="190" r="6" fill="#24644b" stroke="#24644b" stroke-width="1"/><text x="477" y="177" font-size="25" fill="#173f32" text-anchor="start" font-weight="700">B</text><circle cx="565" cy="285" r="6" fill="#24644b" stroke="#24644b" stroke-width="1"/><text x="577" y="272" font-size="25" fill="#173f32" text-anchor="start" font-weight="700">C</text><circle cx="635" cy="450" r="6" fill="#24644b" stroke="#24644b" stroke-width="1"/><text x="647" y="437" font-size="25" fill="#173f32" text-anchor="start" font-weight="700">D</text><text x="495" y="525" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">Average kinetic energy increases with temperature</text><circle cx="800" cy="205" r="12" fill="#c5824b" stroke="#c5824b" stroke-width="3"/><path d="M815 205 l48 -18" fill="none" stroke="#c5824b" stroke-width="3" marker-end="url(#arrow)"/><circle cx="865" cy="265" r="12" fill="#c5824b" stroke="#c5824b" stroke-width="3"/><path d="M880 265 l48 -18" fill="none" stroke="#c5824b" stroke-width="3" marker-end="url(#arrow)"/><circle cx="820" cy="330" r="12" fill="#c5824b" stroke="#c5824b" stroke-width="3"/><path d="M835 330 l48 -18" fill="none" stroke="#c5824b" stroke-width="3" marker-end="url(#arrow)"/><text x="790" y="135" font-size="23" fill="#173f32" text-anchor="middle" font-weight="700">Fast particles</text><text x="790" y="166" font-size="23" fill="#173f32" text-anchor="middle" font-weight="700">at high temperature</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">D: the highest temperature gives the greatest average kinetic energy</text></g></svg>