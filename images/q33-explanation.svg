<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="q33-title q33-desc">
<title id="q33-title">Osmosis through potato cells</title>
<desc id="q33-desc">Before and after a living potato cup stands in concentrated sugar solution. Water leaves its cavity through the partially permeable membranes of potato cells. Cavity water volume decreases and external solution volume increases. Liquid levels are schematic, without measurements.</desc>
