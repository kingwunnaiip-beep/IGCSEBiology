<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="q25-title q25-desc"><title id="q25-title">Potato catalase: measured rates</title><desc id="q25-desc">A bar chart beginning at zero plots oxygen bubbles per minute at 15, 25, 35, 45 and 55 degrees Celsius: 96, 98, 82, 36 and 1. Twenty-five degrees has the highest measured rate. The options suggest a 15 to 35 degree range; the exact optimum is unknown.</desc><defs><marker id="q25-green-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#397359"/></marker><marker id="q25-blue-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3d79a0"/></marker><marker id="q25-red-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85c5e"/></marker><marker id="q25-gold-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b88838"/></marker></defs><rect width="640" height="420" rx="20" fill="#f8faf6"/><g font-family="Arial, Helvetica, sans-serif"><text x="320" y="42" font-size="32" text-anchor="middle" fill="#223c35" font-weight="bold">Potato catalase: measured rates</text><text x="65" y="81" font-size="28" text-anchor="start" fill="#223c35" font-weight="normal">Bubbles/min</text><rect x="83" y="106" width="268" height="194" rx="0" fill="#e8eed9" stroke="none" stroke-width="3"/><path d="M 68 300 H 595" stroke="#b8cbbd" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="309" font-size="28" text-anchor="end" fill="#223c35" font-weight="normal">0</text><path d="M 68 205 H 595" stroke="#b8cbbd" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="214" font-size="28" text-anchor="end" fill="#223c35" font-weight="normal">50</text><path d="M 68 110 H 595" stroke="#b8cbbd" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="119" font-size="28" text-anchor="end" fill="#223c35" font-weight="normal">100</text><path d="M 68 107 V 300 H 596" stroke="#223c35" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="112" y="117.60000000000002" width="55" height="182.39999999999998" rx="0" fill="#87aa91" stroke="none" stroke-width="3"/><text x="139.5" y="107.60000000000002" font-size="28" text-anchor="middle" fill="#223c35" font-weight="normal">96</text><text x="139.5" y="333" font-size="28" text-anchor="middle" fill="#223c35" font-weight="normal">15</text><rect x="207" y="113.80000000000001" width="55" height="186.2" rx="0" fill="#397359" stroke="none" stroke-width="3"/><text x="234.5" y="103.80000000000001" font-size="28" text-anchor="middle" fill="#223c35" font-weight="bold">98</text><text x="234.5" y="333" font-size="28" text-anchor="middle" fill="#223c35" font-weight="normal">25</text><rect x="302" y="144.20000000000002" width="55" height="155.79999999999998" rx="0" fill="#87aa91" stroke="none" stroke-width="3"/><text x="329.5" y="134.20000000000002" font-size="28" text-anchor="middle" fill="#223c35" font-weight="normal">82</text><text x="329.5" y="333" font-size="28" text-anchor="middle" fill="#223c35" font-weight="normal">35</text><rect x="397" y="231.60000000000002" width="55" height="68.39999999999999" rx="0" fill="#87aa91" stroke="none" stroke-width="3"/><text x="424.5" y="221.60000000000002" font-size="28" text-anchor="middle" fill="#223c35" font-weight="normal">36</text><text x="424.5" y="333" font-size="28" text-anchor="middle" fill="#223c35" font-weight="normal">45</text><rect x="492" y="298.1" width="55" height="1.9" rx="0" fill="#87aa91" stroke="none" stroke-width="3"/><text x="519.5" y="288.1"