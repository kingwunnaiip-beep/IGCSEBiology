<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="t390 d390"><title id="t390">Three skin structures, three functions</title><desc id="d390">Receptors detect stimuli, hair erector muscles attach to hair follicles and raise hairs when contracting, and coiled sweat glands secrete sweat for evaporative cooling.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#286346"/></marker></defs><rect width="960" height="440" rx="24" fill="#f7f5e9"/><style>text{font-family:Arial,sans-serif;fill:#183b2b;font-size:22px}.title{font-size:29px;font-weight:700}.small{font-size:19px}.strong{font-weight:700}.box{fill:#e0eddc;stroke:#60876b;stroke-width:2}.arrow{fill:none;stroke:#286346;stroke-width:4;marker-end:url(#arrow)}</style><text class="title" x="38" y="50">Three skin structures, three functions</text><rect class="box" x="40" y="93" width="272" height="290" rx="15"/><text class="strong" x="63" y="131">X  Receptor</text><path d="M176 252 V197 M176 206 L143 184 M176 206 L209 184 M143 184 L134 168 M143 184 L122 182 M209 184 L222 166 M209 184 L232 184" fill="none" stroke="#286346" stroke-width="5"/><text x="63" y="303">Detects stimuli</text><text class="small" x="63" y="344">Sensory information</text><rect class="box" x="344" y="93" width="272" height="290" rx="15"/><text class="strong" x="367" y="131">Y  Hair erector</text><text class="strong" x="367" y="159">muscle</text><path d="M425 178 L466 266" stroke="#286346" stroke-width="9"/><path d="M459 252 L553 190" stroke="#8ca56c" stroke-width="14"/><text x="367" y="303">Raises the hair</text><text class="small" x="367" y="344">Attached to follicle</text><rect class="box" x="648" y="93" width="272" height="290" rx="15"/><text class="strong" x="671" y="131">Z  Sweat gland</text><path d="M785 168 V209 C743 193 739 247 780 230 C824 207 823 263 783 249 C750 236 748 276 790 272" fill="none" stroke="#286346" stroke-width="7"/><text x="671" y="303">Secretes sweat</text><text class="small" x="671" y="344">Evaporation cools skin</text></svg>