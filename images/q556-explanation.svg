<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Warmer particles diffuse faster</title><desc id="desc">A rising diffusion-rate versus temperature graph D is accompanied by particle-motion arrows that lengthen at higher temperature.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="bluearrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="45" font-size="28" fill="#173f32" text-anchor="start" font-weight="bold">Warmer particles diffuse faster</text><text x="500" y="555" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">Higher temperature → faster random motion → a higher diffusion rate: graph D.</text><path d="M145 460 L900 460" fill="none" stroke="#173f32" stroke-width="3" marker-end="url(#arrow)" /><path d="M145 460 L145 135" fill="none" stroke="#173f32" stroke-width="3" marker-end="url(#arrow)" /><text x="140" y="117" font-size="23" fill="#173f32" text-anchor="start" font-weight="normal">Diffusion rate</text><text x="500" y="505" font-size="23" fill="#173f32" text-anchor="middle" font-weight="normal">Temperature</text><path d="M180 425 L835 170" fill="none" stroke="#24644b" stroke-width="7" /><ellipse cx="858" cy="160" rx="27" ry="27" fill="#e4f0df" stroke="#24644b" stroke-width="3" /><text x="858" y="170" font-size="28" fill="#173f32" text-anchor="middle" font-weight="bold">D</text><ellipse cx="290" cy="390" rx="8" ry="8" fill="#537c9a" stroke="#537c9a" stroke-width="3" /><path d="M302 390 L320 380" fill="none" stroke="#537c9a" stroke-width="2" marker-end="url(#bluearrow)" /><ellipse cx="330" cy="350" rx="8" ry="8" fill="#537c9a" stroke="#537c9a" stroke-width="3" /><path d="M342 350 L308 337" fill="none" stroke="#537c9a" stroke-width="2" marker-end="url(#bluearrow)" /><ellipse cx="270" cy="330" rx="8" ry="8" fill="#537c9a" stroke="#537c9a" stroke-width="3" /><path d="M282 330 L285 349" fill="none" stroke="#537c9a" stroke-width="2" marker-end="url(#bluearrow)" /><ellipse cx="650" cy="270" rx="8" ry="8" fill="#537c9a" stroke="#537c9a" stroke-width="3" /><path d="M662 270 L708 240" fill="none" stroke="#537c9a" stroke-width="2" marker-end="url(#bluearrow)" /><ellipse cx="700" cy="220" rx="8" ry="8" fill="#537c9a" stroke="#537c9a" stroke-width="3" /><path d="M712 220 L648 196" fill="none" stroke="#537c9a" stroke-width="2" marker-end="url(#bluearrow)" /><ellipse cx="730" cy="300" rx="8" ry="8" fill="#537c9a" stroke="#537c9a" stroke-width="3" /><path d="M742 300 L775 326" fill="none" stroke="#537c9a" stroke-width="2" marker-end="url(#bluearrow)" /><text x="340" y="215" font-size="21" fill="#173f32" text-anchor="middle" font-weight="normal">Less kinetic energy</text><text x="690" y="390" font-size="21" fill="#173f32" text-anchor="middle" font-weight="normal">More kinetic energy</text><text x="270" y="495" font-size="19" fill="#173f32" text-anchor="start" font-weight="normal">lower</text><text x="815" y="495" font-size="19" fill="#173f32" text-anchor="start" font-weight="normal">higher</text></g></svg>