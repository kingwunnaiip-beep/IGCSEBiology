<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">The entry point is before the oxygen minimum</title><desc id="d">A qualitative oxygen curve is high before sewage entry, falls downstream as decomposer respiration consumes oxygen, then recovers. The sewage-entry arrow is at the start of decline, before the minimum. This is an explanatory curve with no numerical scale.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#194f3b"/></marker></defs><rect width="1000" height="600" rx="22" fill="#fffdf2"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="31" text-anchor="start" fill="#213c30" font-weight="bold">The entry point is before the oxygen minimum</text><path d="M105,420 L910,420" fill="none" stroke="#194f3b" stroke-width="4" marker-end="url(#arrow)"/><path d="M105,420 L105,139" fill="none" stroke="#194f3b" stroke-width="4" marker-end="url(#arrow)"/><text x="502" y="474" font-size="27" text-anchor="middle" fill="#213c30" font-weight="normal">Distance downstream →</text><text x="545" y="143" font-size="25" text-anchor="start" fill="#213c30" font-weight="bold">Dissolved oxygen (qualitative)</text><path d="M115,185 L260,185 C315,185 340,378 465,378 C600,378 605,211 875,185" stroke="#194f3b" stroke-width="5" fill="none"/><path d="M260,120 L260,174" fill="none" stroke="#194f3b" stroke-width="4" marker-end="url(#arrow)"/><text x="260" y="98" font-size="25" text-anchor="middle" fill="#213c30" font-weight="bold">Sewage enters</text><text x="466" y="532" font-size="26" text-anchor="middle" fill="#213c30" font-weight="normal">Oxygen minimum occurs later</text><rect x="555" y="248" width="357" height="92" rx="16" fill="#d9ead7" stroke="#194f3b" stroke-width="2"/><text x="733.5" y="285.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">Decomposers respire</text><text x="733.5" y="319.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">and consume oxygen.</text><text x="40" y="566" font-size="21" text-anchor="start" fill="#213c30" font-weight="normal">Read the original mineral-ion curve too: it begins to rise near the sewage input.</text></g></svg>