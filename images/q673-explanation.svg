<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">What can be concluded about the inherited condition?</title><desc id="desc">Observed in the pedigree: Two affected parents have an unaffected child; Recessive model: aa × aa: All children would be affected: does not fit; Dominant model: Aa × Aa: Can produce an unaffected aa child: fits</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">What can be concluded about the inherited condition?</text><text x="38" y="106" font-size="18" font-weight="400">Compare alternative inheritance models using the same observed family.</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="50" y="190" font-size="23" font-weight="700">Observed in the</text><text x="50" y="219" font-size="23" font-weight="700">pedigree</text><text x="50" y="276" font-size="21" font-weight="400">Two affected parents have</text><text x="50" y="303" font-size="21" font-weight="400">an unaffected child</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="405" y="190" font-size="23" font-weight="700">Recessive model: aa ×</text><text x="405" y="219" font-size="23" font-weight="700">aa</text><text x="405" y="276" font-size="21" font-weight="400">All children would be</text><text x="405" y="303" font-size="21" font-weight="400">affected: does not fit</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="760" y="190" font-size="23" font-weight="700">Dominant model: Aa ×</text><text x="760" y="219" font-size="23" font-weight="700">Aa</text><text x="760" y="276" font-size="21" font-weight="400">Can produce an unaffected</text><text x="760" y="303" font-size="21" font-weight="400">aa child: fits</text><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>