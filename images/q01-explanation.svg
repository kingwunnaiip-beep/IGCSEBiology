<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="q01-title q01-desc">
<title id="q01-title">Sensitivity: detect and respond</title>
<desc id="q01-desc">Heavy rain changes soil conditions. An earthworm detects the environmental change and moves towards the surface. This response demonstrates sensitivity; the schematic does not establish a single cause of emergence.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
