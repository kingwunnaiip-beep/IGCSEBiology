<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="q283-title q283-desc">
<title id="q283-title">Sickle-cell heterozygotes and malaria</title>
<desc id="q283-desc">Three genotypes are compared without numerical risk estimates. HbA/HbA does not cause sickle-cell anaemia but lacks the HbS-associated malaria protection. HbA/HbS usually avoids severe sickle-cell anaemia and has increased resistance to malaria. HbS/HbS causes severe sickle-cell anaemia. In malaria regions the heterozygote combination can be beneficial.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="760" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Sickle-cell heterozygotes and malaria</text><rect x="45" y="145" width="290" height="260" rx="12" fill="#ffffff" stroke="#25614b" stroke-width="2"/><text x="190.0" y="185" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Hbᴬ / Hbᴬ</text><text x="190.0" y="227" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >No sickle-cell anaemia</text><text x="190.0" y="261" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >No Hbˢ-associated</text><text x="190.0" y="295" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >malaria protection</text><rect x="405" y="145" width="290" height="260" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="550.0" y="185" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Hbᴬ / Hbˢ</text><text x="550.0" y="227" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Usually no severe</text><text x="550.0" y="261" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >sickle-cell anaemia</text><text x="550.0" y="295" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Greater resistance</text><text x="550.0" y="329" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >to malaria</text><rect x="765" y="145" width="290" height="260" rx="12" fill="#fbefea" stroke="#25614b" stroke-width="2"/><text x="910.0" y="185" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Hbˢ / Hbˢ</text><text x="910.0" y="227" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Sickle-cell anaemia</text><text x="910.0" y="261" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >can cause severe illness</text><rect x="90" y="460" width="920" height="150" rx="12" fill="#ffffff" stroke="#b8c9c0" stroke-width="2"/><text x="550" y="505" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Why being heterozygous can help</text><text x="550" y="550" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >In regions where malaria occurs, increased resistance can</text><text x="550" y="586" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >improve survival compared with having no Hbˢ allele.</text><text x="550" y="662" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The advantage depends on the environment: exposure to malaria.</text><rect x="24" y="684" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="718" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Heterozygous individuals are more resistant to malaria.</text>
</g></svg>