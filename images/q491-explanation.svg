<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Gametes differ in number, size and movement</title><desc id="desc">Many small sperm swim using flagella. Fewer, larger egg cells are non-motile. The schematic compares the two groups qualitatively and does not give measured sizes or counts.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#24543e"/></marker></defs><rect width="900" height="540" fill="#fbf8ed"/><g font-family="Arial, sans-serif"><text x="450" y="45" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#203e30">Gametes differ in number, size and movement</text><rect x="42" y="90" width="395" height="340" rx="14" fill="#e6efdc" stroke="#24543e" stroke-width="2"/><rect x="463" y="90" width="395" height="340" rx="14" fill="#e6efdc" stroke="#24543e" stroke-width="2"/><text x="240" y="133" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#203e30">Male gametes: sperm</text><text x="660" y="133" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#203e30">Female gametes: eggs</text><ellipse cx="110" cy="205" rx="12" ry="8" fill="#b9d8ae" stroke="#24543e" stroke-width="2"/><path d="M122 205 q15 -16 29 0 t25 0" fill="none" stroke="#24543e" stroke-width="2"/><ellipse cx="210" cy="210" rx="12" ry="8" fill="#b9d8ae" stroke="#24543e" stroke-width="2"/><path d="M222 210 q15 -16 29 0 t25 0" fill="none" stroke="#24543e" stroke-width="2"/><ellipse cx="310" cy="205" rx="12" ry="8" fill="#b9d8ae" stroke="#24543e" stroke-width="2"/><path d="M322 205 q15 -16 29 0 t25 0" fill="none" stroke="#24543e" stroke-width="2"/><ellipse cx="110" cy="270" rx="12" ry="8" fill="#b9d8ae" stroke="#24543e" stroke-width="2"/><path d="M122 270 q15 -16 29 0 t25 0" fill="none" stroke="#24543e" stroke-width="2"/><ellipse cx="210" cy="275" rx="12" ry="8" fill="#b9d8ae" stroke="#24543e" stroke-width="2"/><path d="M222 275 q15 -16 29 0 t25 0" fill="none" stroke="#24543e" stroke-width="2"/><ellipse cx="310" cy="270" rx="12" ry="8" fill="#b9d8ae" stroke="#24543e" stroke-width="2"/><path d="M322 270 q15 -16 29 0 t25 0" fill="none" stroke="#24543e" stroke-width="2"/><circle cx="660" cy="245" r="65" fill="#b9d8ae" stroke="#24543e" stroke-width="2"/><circle cx="660" cy="245" r="22" fill="#fbf8ed" stroke="#24543e" stroke-width="2"/><text x="240" y="350" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#203e30">Many • small • swim</text><text x="660" y="350" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#203e30">Few • larger • do not swim</text><text x="450" y="474" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#203e30">“Fixed” means non-motile: an egg can still be moved by cilia.</text><text x="450" y="512" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#203e30">Relative size and numbers illustrated qualitatively; not to scale.</text></g></svg>