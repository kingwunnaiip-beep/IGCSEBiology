<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="770" viewBox="0 0 1100 770" role="img" aria-labelledby="q290-title q290-desc">
<title id="q290-title">Glucose is filtered, then reabsorbed early</title>
<desc id="q290-desc">Blood is filtered at the glomerulus. Glucose enters the filtrate at A, before glucose reabsorption. Glucose is returned to the blood in the proximal tubule, so later regions B, C and D normally contain little or no glucose. The route is schematic and gives no measured concentrations.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="770" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Glucose is filtered, then reabsorbed early</text><rect x="45" y="115" width="400" height="120" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="245.0" y="155" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >Glomerulus</text><text x="245.0" y="197" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Small glucose molecules</text><text x="245.0" y="232" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >can pass into the filtrate.</text><line x1="245" y1="245" x2="245" y2="285" stroke="#25614b" stroke-width="4"/><polygon points="245,285 238.07331236687776,271.6950761583107 251.92668763312224,271.6950761583107" fill="#25614b"/><rect x="45" y="295" width="400" height="135" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="245.0" y="335" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >A: start of the tubule</text><text x="245.0" y="377" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Glucose is present in filtrate</text><text x="245.0" y="412" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >before reabsorption.</text><line x1="460" y1="360" x2="615" y2="360" stroke="#357ca2" stroke-width="4"/><polygon points="615,360 601.6950761583107,366.92668763312224 601.6950761583107,353.07331236687776" fill="#357ca2"/><text x="535" y="295" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Filtrate</text><text x="535" y="329" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >flows on</text><rect x="630" y="295" width="425" height="135" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="842.5" y="335" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >Proximal tubule</text><text x="842.5" y="377" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Glucose is selectively</text><text x="842.5" y="412" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >reabsorbed into the blood.</text><line x1="842" y1="445" x2="842" y2="490" stroke="#25614b" stroke-width="4"/><polygon points="842,490 835.0733123668778,476.6950761583107 848.9266876331222,476.6950761583107" fill="#25614b"/><rect x="630" y="505" width="425" height="135" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="842.5" y="545" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >Later regions: B, C and D</text><text x="842.5" y="587" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Normally little or no glucose</text><text x="842.5" y="622" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >remains in the filtrate.</text><text x="290" y="535" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Glucose is a useful nutrient:</text><text x="290" y="569" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >healthy kidneys conserve it.</text><text x="290" y="603" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Schematic pathway;</text><text x="290" y="637" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >no concentration scale.</text><rect x="24" y="694" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="728" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >A: glucose concentration is highest before glucose reabsorption.</text>
</g></svg>