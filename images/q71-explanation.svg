="#173d31" font-weight="400" text-anchor="middle" >0</text><line x1="295" y1="600" x2="295" y2="609" stroke="#173d31" stroke-width="2"/><text x="295" y="640" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >6</text><line x1="490" y1="600" x2="490" y2="609" stroke="#173d31" stroke-width="2"/><text x="490" y="640" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >12</text><line x1="685" y1="600" x2="685" y2="609" stroke="#173d31" stroke-width="2"/><text x="685" y="640" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >18</text><line x1="880" y1="600" x2="880" y2="609" stroke="#173d31" stroke-width="2"/><text x="880" y="640" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >24</text><text x="490" y="680" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Time of day / hours</text><path d="M 100 600 H 295 C 355 600 370 275 490 275 C 610 275 625 600 685 600 H 880" fill="none" stroke="#25614b" stroke-width="5"/><path d="M 100 512 C 220 505 270 512 360 488 C 465 462 555 468 640 489 C 740 511 810 514 880 506" fill="none" stroke="#357ca2" stroke-width="4" stroke-dasharray="10 8"/><text x="500" y="728" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Illustrative pattern: exact peaks depend on conditions.</text><text x="500" y="766" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Light enables photosynthesis; respiration also continues in darkness.</text><rect x="24" y="794" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="828" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >A — Photosynthesis in light; respiration throughout 24 hours</text>
