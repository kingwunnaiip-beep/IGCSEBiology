<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which statements describe human gamete sex chromosomes?</title><desc id="desc">Egg cell: Carries one X chromosome; Sperm cell: Carries either one X or one Y; Fertilisation: X + X → XX; X + Y → XY</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Which statements describe human gamete sex chromosomes?</text><text x="38" y="106" font-size="18" font-weight="400">Statements 2 and 3 are correct.</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="50" y="190" font-size="23" font-weight="700">Egg cell</text><text x="50" y="276" font-size="21" font-weight="400">Carries one X chromosome</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="405" y="190" font-size="23" font-weight="700">Sperm cell</text><text x="405" y="276" font-size="21" font-weight="400">Carries either one X or one</text><text x="405" y="303" font-size="21" font-weight="400">Y</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="760" y="190" font-size="23" font-weight="700">Fertilisation</text><text x="760" y="276" font-size="21" font-weight="400">X + X → XX; X + Y → XY</text><text x="362.5" y="255" text-anchor="middle" font-size="34" font-weight="700">+</text><path d="M700 245 H731" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)"/><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>