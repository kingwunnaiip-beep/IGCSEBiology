<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="t d"><title id="t">All glucose respiration pathways use enzymes</title><desc id="d">Glucose branches into aerobic respiration yielding carbon dioxide and water, muscle anaerobic respiration yielding lactic acid, and yeast anaerobic respiration yielding ethanol and carbon dioxide. Enzymes are needed on all branches.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#286c50" stroke-width="1.5"/></marker></defs><rect width="960" height="560" rx="20" fill="#fbf9ed"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="28" text-anchor="start" fill="#173f32">All glucose respiration pathways use enzymes</text><rect x="40" y="230" width="195" height="85" rx="14" fill="#e0ecda" stroke="#286c50" stroke-width="3"/><text x="137.5" y="280.5" font-size="23" text-anchor="middle" fill="#173f32">Glucose</text><path d="M245 273 L525 145" stroke="#286c50" stroke-width="4" fill="none" marker-end="url(#arr)"/><rect x="540" y="110" width="345" height="70" rx="14" fill="#e0ecda" stroke="#286c50" stroke-width="3"/><text x="712.5" y="153.0" font-size="23" text-anchor="middle" fill="#173f32">CO₂ + water</text><text x="710" y="212" font-size="22" text-anchor="middle" fill="#173f32">Aerobic: oxygen used</text><path d="M245 273 L525 280" stroke="#286c50" stroke-width="4" fill="none" marker-end="url(#arr)"/><rect x="540" y="245" width="345" height="70" rx="14" fill="#e0ecda" stroke="#286c50" stroke-width="3"/><text x="712.5" y="288.0" font-size="23" text-anchor="middle" fill="#173f32">Lactic acid</text><text x="710" y="347" font-size="22" text-anchor="middle" fill="#173f32">Anaerobic: muscles</text><path d="M245 273 L525 415" stroke="#286c50" stroke-width="4" fill="none" marker-end="url(#arr)"/><rect x="540" y="380" width="345" height="70" rx="14" fill="#e0ecda" stroke="#286c50" stroke-width="3"/><text x="712.5" y="423.0" font-size="23" text-anchor="middle" fill="#173f32">Ethanol + CO₂</text><text x="710" y="482" font-size="22" text-anchor="middle" fill="#173f32">Anaerobic: yeast</text><text x="380" y="105" font-size="24" text-anchor="middle" fill="#173f32">Enzymes</text><text x="380" y="240" font-size="24" text-anchor="middle" fill="#173f32">Enzymes</text><text x="380" y="430" font-size="24" text-anchor="middle" fill="#173f32">Enzymes</text><text x="480" y="535" font-size="22" text-anchor="middle" fill="#173f32">All three pathways release energy through enzyme-catalysed reactions.</text></g></svg>