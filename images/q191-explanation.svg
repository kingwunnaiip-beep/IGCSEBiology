<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="q191-title q191-desc">
<title id="q191-title">191 · Amphibians have moist skin without scales</title>
<desc id="q191-desc">Answer C. A qualitative section through amphibian skin shows a moist surface above living tissue and a capillary. An oxygen arrow crosses the moist skin toward the tissue. Moisture supports diffusion of gases; the picture does not measure skin thickness or diffusion rate. Two identifying features are moist skin and absence of scales. Dry, scaly skin is characteristic of reptiles.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1000" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >191 · Amphibians have moist skin without scales</text><rect x="65" y="110" width="415" height="145" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="272.5" y="150" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Moist skin</text><text x="272.5" y="193" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Helps gases dissolve</text><text x="272.5" y="228" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >before diffusing across.</text><rect x="520" y="110" width="415" height="145" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="727.5" y="150" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >No scales</text><text x="727.5" y="193" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The expected amphibian</text><text x="727.5" y="228" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >classification feature.</text><rect x="85" y="310" width="830" height="340" rx="12" fill="#edf5f8" stroke="none" stroke-width="2"/><text x="500" y="356" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Qualitative skin section</text><rect x="140" y="401" width="720" height="25" rx="0" fill="#bedfe9" stroke="#357ca2" stroke-width="2"/><rect x="140" y="427" width="720" height="93" rx="0" fill="#ead6b8" stroke="#25614b" stroke-width="2"/><rect x="140" y="522" width="720" height="73" rx="0" fill="#f3e8d7" stroke="none" stroke-width="2"/><rect x="270" y="552" width="460" height="23" rx="10" fill="#dca6a1" stroke="#b94a43" stroke-width="2"/><line x1="500" y1="371" x2="500" y2="548" stroke="#357ca2" stroke-width="6"/><polygon points="500,548 493.07331236687776,534.6950761583107 506.92668763312224,534.6950761583107" fill="#357ca2"/><text x="685" y="390" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Moist surface</text><line x1="684" y1="395" x2="684" y2="411" stroke="#173d31" stroke-width="2"/><text x="277" y="470" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Skin</text><text x="793" y="560" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Capillary</text><text x="500" y="632" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Oxygen can diffuse across the moist surface.</text><rect x="85" y="700" width="830" height="143" rx="12" fill="#f7efdf" stroke="#daa958" stroke-width="2"/><text x="500.0" y="740" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Check both parts of the description</text><text x="500.0" y="783" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Moist + without scales → amphibian</text><text x="500.0" y="818" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Dry + with scales → reptile</text><text x="500" y="888" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Illustrative section; colours and thicknesses are not measurements.</text><rect x="24" y="924" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="958" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · Moist without scales</text>
</g></svg>