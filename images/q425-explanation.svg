<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Count walking legs separately from pedipalps</title><desc id="desc">An eight-legged body shows four pairs of walking legs. A separate note distinguishes the pincers, which are pedipalps, from walking legs.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#39725b"/></marker></defs><rect width="1100" height="560" rx="22" fill="#fbf8e9"/><g font-family="Arial, sans-serif"><text x="40" y="55" font-size="30" text-anchor="start" fill="#173d31">Count walking legs separately from pedipalps</text><rect x="90" y="125" width="390" height="330" rx="15" fill="#e4edcf" stroke="#39725b" stroke-width="3"/><ellipse cx="280" cy="285" rx="55" ry="100" fill="#87b37a" stroke="#39725b" stroke-width="3"/><path d="M245 210 L170 165 L130 195" fill="none" stroke="#39725b" stroke-width="7"/><path d="M315 210 L390 165 L430 195" fill="none" stroke="#39725b" stroke-width="7"/><path d="M245 255 L170 240 L130 270" fill="none" stroke="#39725b" stroke-width="7"/><path d="M315 255 L390 240 L430 270" fill="none" stroke="#39725b" stroke-width="7"/><path d="M245 300 L170 320 L130 350" fill="none" stroke="#39725b" stroke-width="7"/><path d="M315 300 L390 320 L430 350" fill="none" stroke="#39725b" stroke-width="7"/><path d="M245 345 L170 400 L130 430" fill="none" stroke="#39725b" stroke-width="7"/><path d="M315 345 L390 400 L430 430" fill="none" stroke="#39725b" stroke-width="7"/><text x="285" y="485" font-size="25" text-anchor="middle" fill="#173d31">4 pairs = 8 walking legs</text><rect x="555" y="150" width="480" height="100" rx="15" fill="#e4edcf" stroke="#39725b" stroke-width="3"/><text x="795.0" y="192" font-size="25" text-anchor="middle" fill="#173d31">Arachnid: four leg pairs</text><rect x="555" y="285" width="480" height="130" rx="15" fill="#e4edcf" stroke="#39725b" stroke-width="3"/><text x="795.0" y="327" font-size="25" text-anchor="middle" fill="#173d31">Pedipalps are separate appendages</text><text x="795.0" y="359" font-size="25" text-anchor="middle" fill="#173d31">Do not count pincers as walking legs</text><text x="40" y="530" font-size="17" text-anchor="start" fill="#536b57">Original teaching schematic • qualitative, not to scale</text></g></svg>