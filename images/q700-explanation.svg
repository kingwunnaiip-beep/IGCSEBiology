<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Pancreatic beta cells secrete insulin</title><desc id="desc">A pancreas beside the stomach is connected to a magnified islet of endocrine cells. Insulin molecules leave the islet into circulation.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">Pancreatic beta cells secrete insulin</text><g transform="translate(230 250) scale(0.9)"><path d="M-30 -110 L-20 -45 C-5 -80 65 -85 85 -25 C110 65 0 115 -65 65 C-105 35 -75 -5 -45 10 C-15 25 -12 -10 -30 -40 Z" fill="#e5bba5" stroke="#ac655c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M160 340 Q320 260 480 330 Q420 390 185 390 Z" fill="#d3b77e" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 390 Q120 450 210 475 Q310 470 250 400" fill="none" stroke="#537c9a" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><text x="310" y="145" font-size="28" text-anchor="middle" fill="#173f32" font-weight="bold">X: pancreas</text><path d="M480 340 L610 340" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><circle cx="765" cy="315" r="125" fill="#e6e8cf" stroke="#24644b" stroke-width="4"/><circle cx="700" cy="260" r="28" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><circle cx="700" cy="260" r="9" fill="#9fbd9b" stroke="#24644b" stroke-width="2"/><circle cx="760" cy="235" r="28" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><circle cx="760" cy="235" r="9" fill="#9fbd9b" stroke="#24644b" stroke-width="2"/><circle cx="820"