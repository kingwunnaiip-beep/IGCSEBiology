<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="t394 d394"><title id="t394">A fish stock needs breeding females</title><desc id="d394">Breeding females produce eggs. Eggs can develop into young fish that replenish the population. Removing only females reduces egg production and replacement of the stock.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#286346"/></marker></defs><rect width="960" height="440" rx="24" fill="#f7f5e9"/><style>text{font-family:Arial,sans-serif;fill:#183b2b;font-size:22px}.title{font-size:29px;font-weight:700}.small{font-size:19px}.strong{font-weight:700}.box{fill:#e0eddc;stroke:#60876b;stroke-width:2}.arrow{fill:none;stroke:#286346;stroke-width:4;marker-end:url(#arrow)}</style><text class="title" x="38" y="50">A fish stock needs breeding females</text><rect class="box" x="40" y="112" width="247" height="166" rx="15"/><text class="strong" x="63" y="154">Breeding females</text><path d="M87 218 Q140 172 195 218 Q140 264 87 218 L68 197 V240 Z" fill="#83ac75" stroke="#286346" stroke-width="3"/><circle cx="177" cy="211" r="4" fill="#183b2b"/><path class="arrow" d="M302 202 H372"/><rect class="box" x="388" y="112" width="183" height="166" rx="15"/><text class="strong" x="416" y="154">Eggs</text><g fill="#deb66f" stroke="#936d30" stroke-width="2"><circle cx="430" cy="204" r="11"/><circle cx="475" cy="204" r="11"/><circle cx="520" cy="204" r="11"/><circle cx="449" cy="241" r="11"/><circle cx="497" cy="241" r="11"/></g><path class="arrow" d="M588 202 H657"/><rect class="box" x="673" y="112" width="247" height="166" rx="15"/><text class="strong" x="696" y="154">Young fish</text><text x="696" y="202">Can grow and</text><text x="696" y="236">replace the stock</text><path d="M155 295 V330 H796 V294" fill="none" stroke="#60876b" stroke-width="3"/><rect x="40" y="354" width="880" height="60" rx="12" fill="#f2e4c9"/><text class="strong" x="69" y="392">Catching only females reduces the reproductive capacity of the population.</text></svg>