<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750" role="img" aria-labelledby="q339-title q339-desc">
<title id="q339-title">Look for both a low red-cell count and few platelets</title>
<desc id="q339-desc">Patient B has 2,275,000 red blood cells and 27,500 platelets per cubic millimetre. A also has relatively few red blood cells but many more platelets. D has few platelets but a high red-cell count. C has high counts of both.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="750" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Look for both a low red-cell count and few platelets</text><rect x="40" y="100" width="490" height="130" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="285.0" y="138" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Iron → haemoglobin</text><text x="285.0" y="176" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Iron is needed to make haemoglobin.</text><text x="285.0" y="207" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Iron deficiency can cause anaemia.</text><rect x="570" y="100" width="490" height="130" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="815.0" y="138" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Platelets → blood clotting</text><text x="815.0" y="176" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >A small platelet count makes</text><text x="815.0" y="207" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >blood-clot formation more difficult.</text><text x="90" y="290" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Patient</text><text x="350" y="290" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Red cells / mm³</text><text x="700" y="290" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Platelets / mm³</text><text x="965" y="290" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Both low?</text><text x="90" y="355" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >A</text><text x="350" y="355" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >2 525 000</text><text x="700" y="355" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >296 000</text><text x="965" y="355" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >No</text><rect x="40" y="384" width="1020" height="53" rx="12" fill="#dcebd2" stroke="#25614b" stroke-width="2"/><text x="90" y="420" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >B</text><text x="350" y="420" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >2 275 000</text><text x="700" y="420" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >27 500</text><text x="965" y="420" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Yes</text><text x="90" y="485" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >C</text><text x="350" y="485" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >7 250 000</text><text x="700" y="485" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >275 000</text><text x="965" y="485" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >No</text><text x="90" y="550" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >D</text><text x="350" y="550" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >7 325 000</text><text x="700" y="550" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >25 000</text><text x="965" y="550" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >No</text><text x="550" y="620" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Compare both relevant columns together.</text><text x="550" y="659" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >White blood cells do not identify this pair of problems.</text><rect x="24" y="674" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="708" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B has both relatively few red blood cells and few platelets.</text>
</g></svg>