<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Count both DNA strands before finding thymine</title><desc id="desc">A DNA ladder shows complementary A–T and G–C pairs. A proportional bar divides all 12 250 bases into 2345 G, 2345 C, 3780 A and 3780 T bases, so thymine is half of the remaining A plus T total.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="53" font-size="31" text-anchor="start" font-weight="bold" fill="#173f32">Count both DNA strands before finding thymine</text><path d="M170.0 150 L300.0 150" fill="none" stroke="#b4c2a0" stroke-width="4"/><text x="188.0" y="143" font-size="19" text-anchor="middle" font-weight="bold" fill="#173f32">A</text><text x="282.0" y="143" font-size="19" text-anchor="middle" font-weight="bold" fill="#173f32">T</text><path d="M181.6825502692595 180 L288.31744973074046 180" fill="none" stroke="#b4c2a0" stroke-width="4"/><text x="199.6825502692595" y="173" font-size="19" text-anchor="middle" font-weight="bold" fill="#173f32">G</text><text x="270.31744973074046" y="173" font-size="19" text-anchor="middle" font-weight="bold" fill="#173f32">C</text><path d="M191.52068272698568 210 L278.4793172730143 210" fill="none" stroke="#b4c2a0" stroke-width="4"/><text x="209.52068272698568" y="203" font-size="19" text-anchor="middle" font-weight="bold" fill="#173f32">A</text><text x="260.4793172730143" y="203" font-size="19" text-anchor="middle" font-weight="bold" fill="#173f32">T</text><path d="M197.9611725790168 240 L272.03882742098324 240" fill="none" stroke="#b4c2a0" stroke-width="4"/><text x="215.9611725790168" y="233" font-size="19" text-anchor="middle" font-weight="bold" fill="#173f32">G</text><text x="254.03882742098324" y="233" font-size="19" text-anchor="middle" font-weight="bold" fill="#173f32">C</text><path d="M199.98720809124515 270 L270.0127919087548 270" fill="none" stroke="#b4c2a0" stroke-width="4"/><text x="217.98720809124515" y="263" font-size="19" text-anchor="middle" font-weight="bold" fill="#173f32">A</text><text x="252.01279190875482" y="263" font-size="19" text-anchor="middle" font-weight="bold" fill="#173f32">T</text><path d="M197.27892280477045 300 L272.72107719522955 300" fill="none" stroke="#b4c2a0" stroke-width="4"/><text x="215.27892280477045" y="293" font-size="19" text-anchor="middle" font-weight="bold" fill="#173f32">G</text><text x="254.72107719522955" y="293" font-size="19" text-anchor="middle" font-weight="bold" fill="#173f32">C</text><path d="M190.26389541653452 330 L279.7361045834655 330" fill="none" stroke="#b4c2a0" stroke-width="4"/><text x="208.26389541653452" y="323" font-size="19" text-anchor="middle" font-weight="bold" fill="#173f32">A</text><text x="261.7361045834655" y="323" font-size="19" text-anchor="middle" font-weight="bold" fill="#173f32">T</text><path d="M180.04964450467716 360 L289.95035549532287 360" fill="none" stroke="#b4c2a0" stroke-width="4"/><text x="198.04964450467716" y="353" font-size="19" text-anchor="middle" font-weight="bold" fill="#173f32">G</text><text x="271.95035549532287" y="353" font-size="19" text-anchor="middle" font-weight="bold" fill="#173f32">C</text><path d="M168.2487756971726 390 L301.7512243028274 390" fill="none" stroke="#b4c2a0" stroke-width="4"/><text x="186.2487756971726" y="383" font-size="19" text-anchor="middle" font-weight="bold" fill="#173f32">A</text><text x="283.7512243028274" y="383" font-size="19" text-anchor="middle" font-weight="bold" fill="#173f32">T</text><path d="M156.72438670115443 420 L313.2756132988456 420" fill="none" stroke="#b4c2a0" stroke-width="4"/><text x="174.72438670115443" y="413" font-size="19" text-anchor="middle" font-weight="bold" fill="#173f32">G</text><text x="295.2756132988456" y="413" font-size="19" text-anchor="middle" font-weight="bold" fill="#173f32">C</text><path d="M147.29592514076217 450 L322.70407485923783 450" fill="none" stroke="#b4c2a0" stroke-width="4"/><text x="165.29592514076217" y="443" font-size="19" text-anchor="middle" font-weight="bold" fill="#173f32">A</text><text x="304.70407485923783" y="443" font-size="19" text-anchor="middle" font-weight="bold" fill="#173f32">T</text><path d="M170 145 C230 220 110 300 170 380 Q200 430 170 470" fill="none" stroke="#24644b" stroke-width="8"/><path d="M300 145 C240 220 360 300 300 380 Q270 430 300 470" fill="none" stroke="#537c9a" stroke-width="8"/><text x="235" y="510" font-size="25" text-anchor="middle" font-weight="bold" fill="#173f32">6125 base pairs</text><text x="695" y="155" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">12 250 individual bases</text><rect x="450" y="240" width="95.71428571428571" height="105" rx="0" fill="#b9cda8" stroke="#24644b" stroke-width="2"/><text x="497.85714285714283" y="285" font-size="29" text-anchor="middle" font-weight="bold" fill="#173f32">G</text><text x="497.85714285714283" y="322" font-size="21" text-anchor="middle" font-weight="bold" fill="#173f32">2345</text><rect x="545.7142857142857" y="240" width="95.71428571428571" height="105" rx="0" fill="#8fb69e" stroke="#24644b" stroke-width="2"/><text x="593.5714285714286" y="285" font-size="29" text-anchor="middle" font-weight="bold" fill="#173f32">C</text><text x="593.5714285714286" y="322" font-size="21" text-anchor="middle" font-weight="bold" fill="#173f32">2345</text><rect x="641.4285714285713" y="240" width="154.28571428571428" height="105" rx="0" fill="#d1bc7b" stroke="#24644b" stroke-width="2"/><text x="718.5714285714284" y="285" font-size="29" text-anchor="middle" font-weight="bold" fill="#173f32">A</text><text x="718.5714285714284" y="322" font-size="21" text-anchor="middle" font-weight="bold" fill="#173f32">3780</text><rect x="795.7142857142856" y="240" width="154.28571428571428" height="105" rx="0" fill="#87a9c1" stroke="#24644b" stroke-width="2"/><text x="872.8571428571427" y="285" font-size="29" text-anchor="middle" font-weight="bold" fill="#173f32">T</text><text x="872.8571428571427" y="322" font-size="21" text-anchor="middle" font-weight="bold" fill="#173f32">3780</text><text x="546" y="390" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">G + C = 4690</text><text x="795" y="425" font-size="24" text-anchor="middle" font-weight="normal" fill="#173f32">A + T = 7560</text><text x="700" y="485" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">T = 7560 ÷ 2</text><text x="500" y="553" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">B: 3780 thymine bases</text></g></svg>