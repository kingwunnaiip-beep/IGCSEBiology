<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1360" viewBox="0 0 1000 1360" role="img" aria-labelledby="q135-title q135-desc">
<title id="q135-title">135 · Both mesophyll layers contain chloroplasts</title>
<desc id="q135-desc">Answer C: statements 1 and 3 are correct. Mesophyll cells are close to stomata, allowing gases to diffuse between cells and the outside air. Palisade mesophyll cells are densely packed, while spongy mesophyll cells are loosely arranged with air spaces between them. Both palisade and spongy mesophyll cells contain chloroplasts, so statement 2 is false. A simplified leaf section labels the two mesophyll layers, their chloroplasts, air spaces and a stoma. A carbon dioxide arrow passes through the stoma into an internal air space. Shapes, cell counts, chloroplast counts and distances are qualitative illustrations rather than measured leaf anatomy.</desc>
