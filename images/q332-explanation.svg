<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="q332-title q332-desc">
<title id="q332-title">Self-pollination stays on the same plant</title>
<desc id="q332-desc">Pollen transferred from anther to stigma within the same flower or between flowers on the same plant is self-pollination. Transfer between different plants of the same species is cross-pollination.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="820" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Self-pollination stays on the same plant</text><rect x="65" y="165" width="470" height="390" rx="30" fill="#edf3e5" stroke="#25614b" stroke-width="3"/><rect x="650" y="165" width="360" height="390" rx="30" fill="#edf3e5" stroke="#25614b" stroke-width="3"/><text x="300" y="220" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Plant 1</text><text x="830" y="220" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Plant 2</text><circle cx="205" cy="340" r="58" fill="#e5c9e3" stroke="#90648d" stroke-width="3"/><circle cx="190" cy="348" r="10" fill="#daa958" stroke="#97712b" stroke-width="3"/><circle cx="220" cy="332" r="9" fill="#25614b" stroke="#25614b" stroke-width="3"/><line x1="205" y1="400" x2="205" y2="490" stroke="#25614b" stroke-width="4"/><circle cx="415" cy="340" r="58" fill="#e5c9e3" stroke="#90648d" stroke-width="3"/><circle cx="400" cy="348" r="10" fill="#daa958" stroke="#97712b" stroke-width="3"/><circle cx="430" cy="332" r="9" fill="#25614b" stroke="#25614b" stroke-width="3"/><line x1="415" y1="400" x2="415" y2="490" stroke="#25614b" stroke-width="4"/><circle cx="830" cy="340" r="58" fill="#e5c9e3" stroke="#90648d" stroke-width="3"/><circle cx="815" cy="348" r="10" fill="#daa958" stroke="#97712b" stroke-width="3"/><circle cx="845" cy="332" r="9" fill="#25614b" stroke="#25614b" stroke-width="3"/><line x1="830" y1="400" x2="830" y2="490" stroke="#25614b" stroke-width="4"/><path d="M 175 325 C 110 255 110 420 195 385" fill="none" stroke="#25614b" stroke-width="4"/><line x1="185" y1="390" x2="215" y2="350" stroke="#25614b" stroke-width="4"/><polygon points="215,350 212.55839580148424,364.79995165322475 201.47569558848863,356.4879264934781" fill="#25614b"/><text x="180" y="610" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Same flower: yes</text><line x1="230" y1="270" x2="390" y2="270" stroke="#25614b" stroke-width="5"/><polygon points="390,270 376.6950761583107,276.92668763312224 376.6950761583107,263.07331236687776" fill="#25614b"/><text x="330" y="675" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Different flowers on</text><text x="330" y="715" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >the same plant: yes</text><line x1="480" y1="340" x2="760" y2="340" stroke="#b94a43" stroke-width="5"/><polygon points="760,340 746.6950761583107,346.92668763312224 746.6950761583107,333.07331236687776" fill="#b94a43"/><text x="770" y="625" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Different plant of</text><text x="770" y="665" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >the same species: no</text><text x="770" y="705" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >This is cross-pollination.</text><text x="300" y="510" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Pollen moves from anther to stigma</text><text x="830" y="510" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Anther → stigma</text><rect x="24" y="744" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="778" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B: same plant ✓    different plant ✗    same flower ✓</text>
</g></svg>