<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Large sperm numbers increase the chance of fertilisation</title><desc id="desc">A schematic route shows many sperm released, only a few reaching the egg, and one sperm normally fertilising it. Numbers are illustrative, not measured proportions.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#39725b"/></marker></defs><rect width="1100" height="560" rx="22" fill="#fbf8e9"/><g font-family="Arial, sans-serif"><text x="40" y="55" font-size="30" text-anchor="start" fill="#173d31">Large sperm numbers increase the chance of fertilisation</text><rect x="55" y="125" width="290" height="95" rx="15" fill="#e4edcf" stroke="#39725b" stroke-width="3"/><text x="200.0" y="167" font-size="25" text-anchor="middle" fill="#173d31">Many sperm released</text><path d="M360 170 L425 170" fill="none" stroke="#39725b" stroke-width="5" marker-end="url(#arrow)"/><rect x="440" y="125" width="290" height="95" rx="15" fill="#e4edcf" stroke="#39725b" stroke-width="3"/><text x="585.0" y="167" font-size="25" text-anchor="middle" fill="#173d31">Few reach the egg</text><path d="M745 170 L805 170" fill="none" stroke="#39725b" stroke-width="5" marker-end="url(#arrow)"/><rect x="820" y="125" width="230" height="95" rx="15" fill="#e4edcf" stroke="#39725b" stroke-width="3"/><text x="935.0" y="167" font-size="25" text-anchor="middle" fill="#173d31">One fertilises</text><circle cx="90" cy="285" r="5" fill="#87b37a" stroke="#39725b" stroke-width="3"/><path d="M85 285 q-10 14 -22 5" fill="none" stroke="#39725b" stroke-width="2"/><circle cx="128" cy="285" r="5" fill="#87b37a" stroke="#39725b" stroke-width="3"/><path d="M123 285 q-10 14 -22 5" fill="none" stroke="#39725b" stroke-width="2"/><circle cx="166" cy="285" r="5" fill="#87b37a" stroke="#39725b" stroke-width="3"/><path d="M161 28