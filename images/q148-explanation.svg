<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1040" viewBox="0 0 1000 1040" role="img" aria-labelledby="q148-title q148-desc">
<title id="q148-title">148 · Floating leaves exchange gases with the air</title>
<desc id="q148-desc">Answer A. A qualitative cross-section of a floating leaf shows air above and water below. The upper epidermis contains a stoma opening to air. A carbon dioxide arrow enters through this opening toward photosynthetic cells. The lower surface contacts water. Carbon dioxide is used and oxygen is released in photosynthesis. Cell counts, shapes, dimensions and water level are schematic rather than measured.</desc>
