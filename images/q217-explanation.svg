idth="2"/><text x="102.5" y="409" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Iᴮ</text><rect x="175" y="358" width="145" height="84" rx="0" fill="#f9ebcb" stroke="#526c62" stroke-width="2"/><text x="247.5" y="391" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >IᴮIᴮ</text><text x="247.5" y="424" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >group B</text><rect x="320" y="358" width="145" height="84" rx="0" fill="#f9ebcb" stroke="#526c62" stroke-width="2"/><text x="392.5" y="391" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >IᴮIᴮ</text><text x="392.5" y="424" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >group B</text><text x="247" y="488" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >½ AB : ½ B</text><text x="744" y="111" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Cross 4</text><text x="744" y="150" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >IᴬIᴼ × IᴮIᴮ</text><rect x="527" y="190" width="145" height="84" rx="0" fill="#eff5e8" stroke="#526c62" stroke-width="2"/><text x="599.5" y="242" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >gametes</text><rect x="672" y="190" width="145" height="84" rx="0" fill="#e1eaf0" stroke="#526c62" stroke-width="2"/><text x="744.5" y="242" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Iᴮ</text><rect x="817" y="190" width="145" height="84" rx="0" fill="#e1eaf0" stroke="#526c62" stroke-width="2"/><text x="889.5" y="242" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Iᴮ</text><rect x="527" y="274" width="145" height="84" rx="0" fill="#e1eaf0" stroke="#526c62" stroke-width="2"/><text x="599.5" y="325" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Iᴬ</text><rect x="672" y="274" width="145" height="84" rx="0" fill="#e6f0d8" stroke="#526c62" stroke-width="2"