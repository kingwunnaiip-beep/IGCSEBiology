<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Veins return low-pressure blood and prevent backflow</title><desc id="desc">A vein cross-section has a large lumen and relatively thin wall. A longitudinal view shows paired valve flaps and an allowed direction of blood flow.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">Veins return low-pressure blood and prevent backflow</text><circle cx="260" cy="310" r="160" fill="#cfb395" stroke="#c5824b" stroke-width="4"/><circle cx="260" cy="310" r="135" fill="#dce8ec" stroke="#537c9a" stroke-width="4"/><text x="260" y="124" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">Thin wall; large lumen</text><path d="M590 165 V465 M870 165 V465" fill="none" stroke="#537c9a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M590 360 Q660 350 690 290 Q630 310 590 300 Z M870 360 Q800 350 770 290 Q830 310 870 300 Z" fill="#e4f0df" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M730 450 V185" fill="none" stroke="#24644b" stroke-width="5" marker-end="url(#arrow)"/><text x="730" y="132" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">Valve allows return flow</text><text x="730" y="495" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">Closes if blood tries</text><text x="730" y="526" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">to flow backwards.</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">D: large lumen; thin wall; valves</text></g></svg>