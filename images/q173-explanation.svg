-anchor="middle" >Prevent a route of HIV transmission</text><text x="500.0" y="763" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Fewer recipients are exposed to infected blood.</text><text x="500" y="867" font-size="26" fill="#526c62" font-weight="400" text-anchor="middle" >The question asks what could explain the decline.</text><text x="500" y="906" font-size="26" fill="#526c62" font-weight="400" text-anchor="middle" >These two totals alone do not establish causation.</text><rect x="24" y="964" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="998" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · Testing donated blood was introduced in 1990</text>
