<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which pyramid of numbers fits the tree food chain?</title><desc id="desc">Pyramid of numbers A: a very narrow tree base supports a wide insect level, with fewer small birds and still fewer birds of prey above. Bar width shows number of organisms, not biomass.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700" text-anchor="start" fill="#193e34">Which pyramid of numbers fits the tree food chain?</text><rect x="30" y="120" width="1020" height="255" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><rect x="307.5" y="150" width="65" height="48" rx="2" fill="#dceadd" stroke="#9fbaab" stroke-width="2"/><text x="610" y="181" font-size="23" font-weight="700" text-anchor="start" fill="#193e34">Birds of prey: very few</text><rect x="240.0" y="198" width="200" height="48" rx="2" fill="#dceadd" stroke="#9fbaab" stroke-width="2"/><text x="610" y="229" font-size="23" font-weight="700" text-anchor="start" fill="#193e34">Small birds: fewer than insects</text><rect x="105.0" y="246" width="470" height="48" rx="2" fill="#dceadd" stroke="#9fbaab" stroke-width="2"/><text x="610" y="277" font-size="23" font-weight="700" text-anchor="start" fill="#193e34">Small insects: many</text><rect x="325.0" y="294" width="30" height="48" rx="2" fill="#dceadd" stroke="#9fbaab" stroke-width="2"/><text x="610" y="325" font-size="23" font-weight="700" text-anchor="start" fill="#193e34">Tree: one or few</text><text x="540" y="360" font-size="22" font-weight="700" text-anchor="middle" fill="#193e34">Bar width represents number of organisms → pyramid A</text><text x="38" y="406" font-size="17" font-weight="400" text-anchor="start" fill="#193e34">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>