" fill="#173d31" font-weight="400" text-anchor="start" >Large hollow spaces in the bundle</text><text x="565" y="255" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >Transport water and mineral ions</text><rect x="640" y="340" width="180" height="180" rx="4" fill="#e4f0f5" stroke="#357ca2" stroke-width="5"/><line x1="685" y1="490" x2="685" y2="370" stroke="#357ca2" stroke-width="5"/><polygon points="685,370 691.9266876331222,383.3049238416893 678.0733123668778,383.3049238416893" fill="#357ca2"/><line x1="730" y1="490" x2="730" y2="370" stroke="#357ca2" stroke-width="5"/><polygon points="730,370 736.9266876331222,383.3049238416893 723.0733123668778,383.3049238416893" fill="#357ca2"/><line x1="775" y1="490" x2="775" y2="370" stroke="#357ca2" stroke-width="5"/><polygon points="775,370 781.9266876331222,383.3049238416893 768.0733123668778,383.3049238416893" fill="#357ca2"/><text x="730" y="565" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Water + mineral ions</text><text x="550" y="625" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Phloem is the separate tissue that transports sugars.</text><rect x="24" y="684" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="718" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >D: xylem — transports water and minerals</text>
