<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1190" viewBox="0 0 1000 1190" role="img" aria-labelledby="q179-title q179-desc">
<title id="q179-title">179 · Prepare, join, insert, then replicate</title>
<desc id="q179-desc">The correct printed-stage sequence is 2, 1, 4, 3, 5. Stage 2 extracts the insulin gene with restriction enzymes; stage 1 cuts plasmid DNA with restriction enzymes; stage 4 uses DNA ligase to join human DNA into a recombinant plasmid; stage 3 inserts the recombinant plasmid into bacteria; stage 5 replicates the bacteria. Extraction and plasmid cutting can be prepared independently, but both must precede joining. Original stage identities remain unchanged. This is a qualitative process flow with no molecular scale or production-yield claims. AnswerA.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1190" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >179 · Prepare, join, insert, then replicate</text><text x="500" y="111" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Keep each printed stage number with its action.</text><rect x="75" y="160" width="850" height="129" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><circle cx="130" cy="222" r="31" fill="#25614b" stroke="none" stroke-width="3"/><text x="130" y="232" font-size="30" fill="#fffdf7" font-weight="700" text-anchor="middle" >2</text><text x="542" y="207" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Extract the human insulin gene</text><text x="542" y="253" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Restriction enzymes cut the human DNA.</text><line x1="500" y1="298" x2="500" y2="318" stroke="#25614b" stroke-width="4"/><polygon points="500,318 493.07331236687776,304.6950761583107 506.92668763312224,304.6950761583107" fill="#25614b"/><rect x="75" y="327" width="850" height="129" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><circle cx="130" cy="389" r="31" fill="#25614b" stroke="none" stroke-width="3"/><text x="130" y="399" font-size="30" fill="#fffdf7" font-weight="700" text-anchor="middle" >1</text><text x="542" y="374" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Cut bacterial plasmid DNA</text><text x="542" y="420" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Restriction enzymes open the plasmid.</text><line x1="500" y1="465" x2="500" y2="485" stroke="#25614b" stroke-width="4"/><polygon points="500,485 493.07331236687776,471.6950761583107 506.92668763312224,471.6950761583107" fill="#25614b"/><rect x="75" y="494" width="850" height="129" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><circle cx="130" cy="556" r="31" fill="#357ca2" stroke="none" stroke-width="3"/><text x="130" y="566" font-size="30" fill="#fffdf7" font-weight="700" text-anchor="middle" >4</text><text x="542" y="541" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Join gene and plasmid</text><text x="542" y="587" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >DNA ligase forms the recombinant plasmid.</text><line x1="500" y1="632" x2="500" y2="652" stroke="#25614b" stroke-width="4"/><polygon points="500,652 493.07331236687776,638.6950761583107 506.92668763312224,638.6950761583107" fill="#25614b"/><rect x="75" y="661" width="850" height="129" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><circle cx="130" cy="723" r="31" fill="#25614b" stroke="none" stroke-width="3"/><text x="130" y="733" font-size="30" fill="#fffdf7" font-weight="700" text-anchor="middle" >3</text><text x="542" y="708" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Insert recombinant plasmids</text><text x="542" y="754" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Put the completed plasmids into bacteria.</text><line x1="500" y1="799" x2="500" y2="819" stroke="#25614b" stroke-width="4"/><polygon points="500,819 493.07331236687776,805.6950761583107 506.92668763312224,805.6950761583107" fill="#25614b"/><rect x="75" y="828" width="850" height="129" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><circle cx="130" cy="890" r="31" fill="#25614b" stroke="none" stroke-width="3"/><text x="130" y="900" font-size="30" fill="#fffdf7" font-weight="700" text-anchor="middle" >5</text><text x="542" y="875" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Replicate the bacteria</text><text x="542" y="921" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Grow bacteria containing recombinant plasmids.</text><text x="500" y="1045" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Both DNA preparations must occur before joining.</text><text x="500" y="1079" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >They do not have to occur in a fixed order in every laboratory.</text><rect x="24" y="1114" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1148" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer A · 2 → 1 → 4 → 3 → 5</text>
</g></svg>