<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">Cone-cell concentration across the retina</title><desc id="desc">Schematic cone distribution along part of the retina. Closely packed cones in the fovea give the greatest cone concentration and detailed colour vision. The drawing is qualitative.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#245744"/></marker></defs><rect width="1000" height="540" rx="22" fill="#fbf8ed"/><text x="42" y="49" font-family="Arial, sans-serif" font-size="30" text-anchor="start" fill="#183e32" font-weight="bold">Cone-cell concentration across the retina</text><rect x="65" y="110" width="870" height="230" rx="18" fill="#e4eddb" stroke="#548c69" stroke-width="2"/><text x="500" y="151" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#183e32" font-weight="bold">Retina: cone density is greatest at the fovea</text><path d="M105,205 L97,242 L113,242 Z" fill="#548c69"/><path d="M150,205 L142,242 L158,242 Z" fill="#548c69"/><path d="M195,205 L187,242 L203,242 Z" fill="#548c69"/><path d="M240,205 L232,242 L248,242 Z" fill="#548c69"/><path d="M285,205 L277,242 L293,242 Z" fill="#548c69"/><path d="M330,205 L322,242 L338,242 Z" fill="#548c69"/><path d="M375,205 L367,242 L383,242 Z" fill="#548c69"/><path d="M645,205 L637,242 L653,242 Z" fill="#548c69"/><path d="M690,205 L682,242 L698,242 Z" fill="#548c69"/><path d="M735,205 L727,242 L743,242 Z" fill="#548c69"/><path d="M780,205 L772,242 L788,242 Z" fill="#548c69"/><path d="M825,205 L817,242 L833,242 Z" fill="#548c69"/><path d="M870,205 L862,242 L878,242 Z" fill="#548c69"/><path d="M395,205 L388,242 L402,242 Z" fill="#245744"/><path d="M413,205 L406,242 L420,242 Z" fill="#245744"/><path d="M431,205 L424,242 L438,242 Z" fill="#245744"/><path d="M449,205 L442,242 L456,242 Z" fill="#245744"/><path d="M467,205 L460,242 L474,242 Z" fill="#245744"/><path d="M485,205 L478,242 L492,242 Z" fill="#245744"/><path d="M503,205 L496,242 L510,242 Z" fill="#245744"/><path d="M521,205 L514,242 L528,242 Z" fill="#245744"/><path d="M539,205 L532,242 L546,242 Z" fill="#245744"/><path d="M557,205 L550,242 L564,242 Z" fill="#245744"/><path d="M575,205 L568,242 L582,242 Z" fill="#245744"/><path d="M593,205 L586,242 L600,242 Z" fill="#245744"/><path d="M611,205 L604,242 L618,242 Z" fill="#245744"/><text x="230" y="300" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183e32" font-weight="normal">Away from fovea</text><text x="500" y="300" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#183e32" font-weight="bold">Fovea (C)</text><text x="780" y="300" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183e32" font-weight="normal">Away from fovea</text><path d="M500,395 L500,342" fill="none" stroke="#245744" stroke-width="4" marker-end="url(#arrow)"/><text x="500" y="434" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" fill="#183e32" font-weight="bold">Many closely packed cones</text><text x="500" y="474" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#183e32" font-weight="normal">Detailed colour vision in bright light</text><text x="42" y="518" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#52675b" font-weight="normal">Original teaching schematic • Biology quiz • not to scale</text></svg>