<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which label shows a lacteal in the villus?</title><desc id="desc">Label C: lacteal: Central lymphatic vessel in the villus; Fat absorption: Absorbed fats enter the lymphatic route; Blood capillaries: Carry absorbed glucose and amino acids</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Which label shows a lacteal in the villus?</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="50" y="190" font-size="23" font-weight="700">Label C: lacteal</text><text x="50" y="276" font-size="21" font-weight="400">Central lymphatic vessel in</text><text x="50" y="303" font-size="21" font-weight="400">the villus</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="405" y="190" font-size="23" font-weight="700">Fat absorption</text><text x="405" y="276" font-size="21" font-weight="400">Absorbed fats enter the</text><text x="405" y="303" font-size="21" font-weight="400">lymphatic route</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="760" y="190" font-size="23" font-weight="700">Blood capillaries</text><text x="760" y="276" font-size="21" font-weight="400">Carry absorbed glucose and</text><text x="760" y="303" font-size="21" font-weight="400">amino acids</text><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>