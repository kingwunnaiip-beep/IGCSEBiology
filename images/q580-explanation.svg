<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Injected antibodies give passive immunity</title><desc id="desc">A syringe transfers ready-made Y-shaped antibodies into a blood vessel. Specific antibodies attach to surface antigens on a pathogen. The transfer gives immediate temporary passive protection, without memory cells from the transfer.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="1.8"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#b85c50" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="38" y="54" font-size="30" fill="#173f32" font-weight="bold">Injected antibodies give passive immunity</text><rect x="55" y="235" width="130" height="65" rx="7" fill="#dcebf2" stroke="#537c9a" stroke-width="3" /><line x1="35" y1="268" x2="55" y2="268" stroke="#537c9a" stroke-width="7" stroke-linecap="round" /><line x1="35" y1="242" x2="35" y2="292" stroke="#537c9a" stroke-width="7" stroke-linecap="round" /><path d="M185 250 L218 262 L218 277 L185 287" fill="#dcebf2" stroke="#537c9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="218" y1="269" x2="275" y2="295" stroke="#8b948b" stroke-width="3" stroke-linecap="round" /><path d="M92 280.3 V267 M92 267 L83.26 257.5 M92 267 L100.74 257.5" fill="none" stroke="#537c9a" stroke-width="2.66" stroke-linecap="round" stroke-linejoin="round" /><path d="M140 280.3 V267 M140 267 L131.26 257.5 M140 267 L148.74 257.5" 