<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Artificial insemination introduces donor sperm</title><desc id="desc">A medical schematic draws the vagina, cervix, uterus, fallopian tubes and ovaries; a donor-sperm catheter ends at the vagina, and sperm swim inward.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="bluearrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="45" font-size="28" fill="#173f32" text-anchor="start" font-weight="bold">Artificial insemination introduces donor sperm</text><text x="500" y="555" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">AI introduces sperm; fertilisation can then occur inside the female reproductive</text><text x="500" y="583" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">system.</text><path d="M500 205 Q560 180 620 205 Q680 225 665 280 Q650 335 600 365 L600 425 L555 425 L555 365 Q505 335 488 280 Q470 225 500 205 Z" fill="#e9d9cb" stroke="#bc824b" stroke-width="4" /><path d="M520 225 Q578 210 638 225 Q645 280 579 340 Q515 280 520 225 Z" fill="#fbf8eb" stroke="#bc824b" stroke-width="3" /><path d="M500 220 Q405 145 355 210 M645 220 Q745 145 800 210" fill="none" stroke="#bc824b" stroke-width="12" /><ellipse cx="340" cy="235" rx="35" ry="23" fill="#f2ddbc" stroke="#bc824b" stroke-width="3" /><ellipse cx="815" cy="235" rx="35" ry="23" fill="#f2ddbc" stroke="#bc824b" stroke-width="3" /><path d="M555 422 L545 505 M600 422 L612 505" fill="none" stroke="#bc824b" stroke-width="5" /><path d="M567 368 L567 427 M590 368 L590 427" fill="none" stroke="#bc824b" stroke-width="3" /><path d="M245 465 L545 483" fill="none" stroke="#537c9a" stroke-width="7" /><rect x="180" y="445" width="85" height="35" rx="2" fill="#d9eaf1" stroke="#537c9a" stroke-width="2"/><path d="M178 460 L145 460" fill="none" stroke="#537c9a" stroke-width="4" /><path d="M145 443 L145 477" fill="none" stroke="#537c9a" stroke-width="4" /><ellipse cx="560" cy="480" rx="4" ry="7" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><path d="M560 487 q-12 10 0 20" fill="none" stroke="#537c9a" stroke-width="1" /><ellipse cx="580" cy="450" rx="4" ry="7" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><path d="M580 457 q-12 10 0 20" fill="none" stroke="#537c9a" stroke-width="1" /><ellipse cx="578" cy="395" rx="4" ry="7" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><path d="M578 402 q-12 10 0 20" fill="none" stroke="#537c9a" stroke-width="1" /><ellipse cx="590" cy="325" rx="4" ry="7" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><path d="M590 332 q-12 10 0 20" fill="none" stroke="#537c9a" stroke-width="1" /><ellipse cx="640" cy="245" rx="4" ry="7" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><path d="M640 252 q-12 10 0 20" fill="none" stroke="#537c9a" stroke-width="1" /><ellipse cx="720" cy="195" rx="4" ry="7" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><path d="M720 202 q-12 10 0 20" fill="none" stroke="#537c9a" stroke-width="1" /><text x="180" y="390" font-size="24" fill="#173f32" text-anchor="start" font-weight="bold">Donor sperm</text><path d="M270 401 L290 461" fill="none" stroke="#537c9a" stroke-width="2" /><text x="735" y="380" font-size="23" fill="#173f32" text-anchor="start" font-weight="normal">Uterus</text><path d="M725 370 L635 310" fill="none" stroke="#24644b" stroke-width="2" /><text x="725" y="465" font-size="23" fill="#173f32" text-anchor="start" font-weight="normal">Vagina</text><path d="M710 460 L610 466" fill="none" stroke="#24644b" stroke-width="2" /><text x="755" y