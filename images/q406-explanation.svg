<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Plants respire while they photosynthesise</title><desc id="desc">Photosynthesis uses carbon dioxide and water to make glucose and oxygen in light. Respiration uses glucose and oxygen and releases energy. Both occur in illuminated pondweed.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#185c44"/></marker></defs><rect width="1000" height="640" rx="24" fill="#faf8ec"/><g font-family="Arial, sans-serif"><text x="40" y="54" font-size="31" text-anchor="start" fill="#193e33" font-weight="bold">Plants respire while they photosynthesise</text><text x="500" y="112" font-size="27" text-anchor="middle" fill="#193e33" font-weight="bold">Illuminated pondweed carries out BOTH processes</text><rect x="55" y="160" width="395" height="150" rx="18" fill="#dcefdc" stroke="#185c44" stroke-width="3"/><rect x="550" y="160" width="395" height="150" rx="18" fill="#dcefdc" stroke="#185c44" stroke-width="3"/><text x="252" y="207" font-size="29" text-anchor="middle" fill="#193e33" font-weight="bold">Photosynthesis</text><text x="252" y="251" font-size="23" text-anchor="middle" fill="#193e33" font-weight="normal">carbon dioxide + water</text><text x="252" y="284" font-size="23" text-anchor="middle" fill="#193e33" font-weight="normal">→ glucose + oxygen</text><text x="748" y="207" font-size="29" text-anchor="middle" fill="#193e33" font-weight="bold">Respiration</text><text x="748" y="251" font-size="23" text-anchor="middle" fill="#193e33" font-weight="normal">glucose + oxygen</text><text x="748" y="284" font-size="23" text-anchor="middle" fill="#193e33" font-weight="normal">→ carbon dioxide + water</text><path d="M453 228 L545 228" stroke="#185c44" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="500" y="198" font-size="20" text-anchor="middle" fill="#193e33" font-weight="normal">fuel</text><path d="M740 314 L740 367" stroke="#185c44" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="740" y="404" font-size="26" text-anchor="middle" fill="#193e33" font-weight="normal">Energy released</text><path d="M230 455 Q140 350 250 350 Q350 400 230 455" fill="#4f9b58" stroke="#185c44" stroke-width="3"/><path d="M175 405 L265 375" stroke="#185c44" stroke-width="4" fill="none"/><text x="72" y="350" font-size="25" text-anchor="start" fill="#193e33" font-weight="normal">light</text><path d="M100 362 L177 390" stroke="#185c44" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="70" y="478" width="860" height="112" rx="18" fill="#dcefdc" stroke="#185c44" stroke-width="3"/><text x="500" y="520" font-size="26" text-anchor="middle" fill="#193e33" font-weight="normal">Light is needed for photosynthesis.</text><text x="500" y="556" font-size="26" text-anchor="middle" fill="#193e33" font-weight="normal">Respiration continues in both light and darkness.</text></g></svg>