<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800" role="img" aria-labelledby="q40-title q40-desc">
<title id="q40-title">Where is most water absorbed?</title>
<desc id="q40-desc">A coiled small intestine is followed by the large intestine. A thick blue arrow labelled most water leads from the small intestine to the blood. A thinner blue arrow labelled remaining water leads from the large intestine to the blood. This is a qualitative comparison with no numerical proportions. The large intestine absorbs much of the water remaining after the small intestine. Answer D: small intestine.</desc>
