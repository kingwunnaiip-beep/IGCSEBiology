<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1270" viewBox="0 0 1000 1270" role="img" aria-labelledby="q187-title q187-desc">
<title id="q187-title">187 · Contraction makes the lens more convex</title>
<desc id="q187-desc">Answer B. Ciliary-muscle contraction reduces the tension on the suspensory ligaments. The ligaments become slack and the elastic lens becomes thicker and more convex, increasing refractive power compared with a flatter lens. A four-step flow diagram explains this accommodation pathway. The two lens outlines compare flatter and more convex shapes qualitatively and are not measured anatomy or optical ray traces. Permanent contraction holds the eye in this near-vision pathway.</desc>
