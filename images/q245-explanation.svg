<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="q245-title q245-desc">
<title id="q245-title">Contracting muscle uses more oxygen</title>
<desc id="q245-desc">The original relaxed-muscle chart shows 90% oxygen on entry and 60% on leaving, relative to the amount carried on leaving the lungs. Contraction predicts a lower leaving value. Of the answer choices 40%, 60%, 90% and 100%, only A 40% is lower than 60%. The 40% is an answer choice, not a new measurement; no unchanged entering value is assumed.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="800" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Contracting muscle uses more oxygen</text><text x="500" y="101" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Original chart: relaxed muscle</text><rect x="60" y="130" width="395" height="142" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="257.5" y="168" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Entering: 90%</text><text x="257.5" y="208" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >given source value</text><rect x="545" y="130" width="395" height="142" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="742.5" y="168" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Leaving: 60%</text><text x="742.5" y="208" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >given source value</text><line x1="468" y1="200" x2="532" y2="200" stroke="#25614b" stroke-width="4"/><polygon points="532,200 518.6950761583107,206.92668763312224 518.6950761583107,193.07331236687776" fill="#25614b"/><text x="500" y="321" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >100% = amount carried on leaving the lungs</text><rect x="90" y="357" width="820" height="132" rx="12" fill="white" stroke="#357ca2" stroke-width="2"/><text x="500" y="397" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Muscle contracts → more oxygen used</text><text x="500" y="440" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Expected leaving value: below the relaxed 60%</text><text x="500" y="533" font-size="26" fill="#526c62" font-weight="400" text-anchor="middle" >Answer choices — not new measurements</text><rect x="40" y="560" width="185" height="126" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="132.5" y="598" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >A: 40%</text><text x="132.5" y="646" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >below 60%</text><rect x="285" y="560" width="185" height="126" rx="12" fill="white" stroke="#526c62" stroke-width="2"/><text x="377.5" y="598" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >B: 60%</text><text x="377.5" y="646" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >same as 60%</text><rect x="530" y="560" width="185" height="126" rx="12" fill="white" stroke="#526c62" stroke-width="2"/><text x="622.5" y="598" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >C: 90%</text><text x="622.5" y="646" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >above 60%</text><rect x="775" y="560" width="185" height="126" rx="12" fill="white" stroke="#526c62" stroke-width="2"/><text x="867.5" y="598" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >D: 100%</text><text x="867.5" y="646" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >above 60%</text><rect x="24" y="724" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="758" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >A — 40% is the only listed value below 60%</text>
</g></svg>