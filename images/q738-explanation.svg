<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Root hairs supply magnesium for chlorophyll</title><desc id="desc">A rooted plant has enlarged root hairs beside magnesium ions in soil water. Arrows show uptake and upward supply, while a green leaf represents chlorophyll-containing tissue.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">Root hairs supply magnesium for chlorophyll</text><g transform="translate(470 385) scale(1.2)"><path d="M0 0 V-195" fill="none" stroke="#24644b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(0 -65) scale(0.8)"><path d="M0 0 Q-65 -20 -5 -105 Q55 -45 0 0" fill="#e4f0df" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 0 L-5 -95 M-3 -30 L-27 -53 M-4 -53 L19 -75" fill="none" stroke="#24644b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(0 -100) scale(-.8 .8)"><g transform="translate(0 0) scale(1)"><path d="M0 0 Q-65 -20 -5 -105 Q55 -45 0 0" fill="#e4f0df" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 0 L-5 -95 M-3 -30 L-27 -53 M-4 -53 L19 -75" fill="none" stroke="#24644b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M0 0 L-45 75 M0 0 L25 80 M-20 30 L-65 55 M10 30 L55 65" fill="none" stroke="#c5824b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M90 390 H760" fill="none" stroke="#c5824b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M410 435 Q330 425 250 443 Q205 455 190 436" fill="none" stroke="#24644b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M410 475 Q330 465 250 483 Q205 495 190 476" fill="none" stroke="#24644b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="120" cy="455" r="20" fill="#dce8ef" stroke="#537c9a" stroke-width="2"/><text x="120" y="462" font-size="16" fill="#173f32" text-anchor="middle" font-weight="700">Mg²⁺</text><circle cx="170" cy="490" r="20" fill="#dce8ef" stroke="#537c9a" stroke-width="2"/><text x="170" y="497" font-size="16" fill="#173f32" text-anchor="middle" font-weight="700">Mg²⁺</text><circle cx="270" cy="455" r="20" fill="#dce8ef" stroke="#537c9a" stroke-width="2"/><text x="270" y="462" font-size="16" fill="#173f32" text-anchor="middle" font-weight="700">Mg²⁺</text><path d="M170 450 H350" fill="none" stroke="#537c9a" stroke-width="4" marker-end="url(#arrow)"/><path d="M465 370 V230" fill="none" stroke="#537c9a" stroke-width="5" marker-end="url(#arrow)"/><text x="795" y="170" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">Magnesium is</text><text x="795" y="210" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">needed for</text><text x="795" y="250" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">chlorophyll.</text><g transform="translate(800 405) scale(1.25)"><path d="M0 0 Q-65 -20 -5 -105 Q55 -45 0 0" fill="#e4f0df" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 0 L-5 -95 M-3 -30 L-27 -53 M-4 -53 L19 -75" fill="none" stroke="#24644b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="300" y="525" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">Root hairs absorb mineral ions from soil solution.</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">C: magnesium; root hairs</text></g></svg>