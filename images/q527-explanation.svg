<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="q527-title q527-desc"><title id="q527-title">Food-test colours depend on the molecule tested</title><desc id="q527-desc">Separate test tubes show a brick-red Benedict’s precipitate with heat when reducing sugar is present, and brown iodine when starch is absent. The two tests target different molecules.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#36785e"/></marker></defs><rect x="0" y="0" width="900" height="500" rx="22" fill="#fbf7e9"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="46" font-size="27" text-anchor="start" fill="#183e35"><tspan x="35" dy="0">Food-test colours depend on the molecule tested</tspan></text><rect x="35" y="85" width="395" height="340" rx="15" fill="#eff3df" stroke="#36785e" stroke-width="2"/><rect x="470" y="85" width="395" height="340" rx="15" fill="#eff3df" stroke="#36785e" stroke-width="2"/><text x="232" y="122" font-size="24" text-anchor="middle" fill="#183e35"><tspan x="232" dy="0">Reducing sugar test</tspan></text><text x="667" y="122" font-size="24" text-anchor="middle" fill="#183e35"><tspan x="667" dy="0">Starch test</tspan></text><path d="M115 152 L115 282 Q140 317 165 282 L165 152" stroke="#36785e" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M118 217 L118 279 Q140 307 162 279 L162 217 Z" stroke="#36785e" stroke-width="0" fill="#a84c35" stroke-linejoin="round" stroke-linecap="round"/><path d="M548 152 L548 282 Q573 317 598 282 L598 152" stroke="#36785e" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M551 217 L551 279 Q573 307 595 279 L595 217 Z" stroke="#36785e" stroke-width="0" fill="#ad7d36" stroke-linejoin="round" stroke-linecap="round"/><text x="207" y="192" font-size="22" text-anchor="start" fill="#183e35"><tspan x="207" dy="0">Benedict’s</tspan><tspan x="207" dy="29">+ heat</tspan></text><text x="642" y="192" font-size="22" text-anchor="start" fill="#183e35"><tspan x="642" dy="0">Iodine</tspan><tspan x="642" dy="29">solution</tspan></text><text x="232" y="349" font-size="23" text-anchor="middle" fill="#183e35"><tspan x="232" dy="0">Sugar present</tspan><tspan x="232" dy="29">→ brick-red precipitate</tspan></text><text x="667" y="349" font-size="23" text-anchor="middle" fill="#183e35"><tspan x="667" dy="0">No starch</tspan><tspan x="667" dy="29">→ remains brown</tspan></text><text x="450" y="468" font-size="22" text-anchor="middle" fill="#183e35"><tspan x="450" dy="0">One sample can be positive for one test and negative for another.</tspan></text></g></svg>