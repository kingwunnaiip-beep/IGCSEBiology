<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="q21-title q21-desc"><title id="q21-title">One heartbeat: P, R, Q, S</title><desc id="q21-desc">Four schematic hearts show blood entering atria at P, atrial contraction at R, ventricular contraction at Q, and continuing arterial flow while atria refill at S.</desc><defs><marker id="q21-green-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#397359"/></marker><marker id="q21-blue-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3d79a0"/></marker><marker id="q21-red-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85c5e"/></marker><marker id="q21-gold-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b88838"/></marker></defs><rect width="640" height="420" rx="20" fill="#f8faf6"/><g font-family="Arial, Helvetica, sans-serif"><text x="320" y="42" font-size="32" text-anchor="middle" fill="#223c35" font-weight="bold">One heartbeat: P, R, Q, S</text><text x="80" y="100" font-size="34" text-anchor="middle" fill="#223c35" font-weight="bold">P</text><path d="M 108 89 H 208" stroke="#397359" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#q21-green-arrow)"/><rect x="22" y="141" width="53" height="52" rx="12" fill="#dcecf4" stroke="#3d79a0" stroke-width="3"/><rect x="85" y="141" width="53" height="52" rx="12" fill="#f0dadd" stroke="#b85c5e" stroke-width="3"/><rect x="22" y="201" width="53" height="82" rx="12" fill="#dcecf4" stroke="#3d79a0" stroke-width="3"/><rect x="85" y="201" width="53" height="82" rx="12" fill="#f0dadd