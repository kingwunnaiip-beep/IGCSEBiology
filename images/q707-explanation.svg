<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">pH can change the enzyme’s active-site shape</title><desc id="desc">At optimum pH 7 an orange substrate fits the complementary notch in a green enzyme. At pH 9 the notch is distorted and the same substrate no longer fits.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">pH can change the enzyme’s active-site shape</text><g transform="translate(250 315) scale(1.5)"><path d="M0 -70 C75 -80 112 10 65 65 C25 105 -80 65 -78 -5 C-80 -45 -45 -70 -15 -68 L-15 -20 L20 -20 L20 -68 Z" fill="#e4f0df" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="226.0" y="155.0" width="51.0" height="63.0" rx="3" fill="#e7b479" stroke="#c5824b" stroke-width="3"/><path d="M250 220 V270" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(735 315) scale(1.5)"><path d="M0 -70 C75 -80 112 10 65 65 C25 105 -80 65 -78 -5 C-80 -45 -45 -70 -15 -68 L-35 -20 L8 -35 L25 -67 Z" fill="#e4f0df" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="711.0" y="155.0" width="51.0" height="63.0" rx="3" fill="#e7b479" stroke="#c5824b" stroke-width="3"/><path d="M710 260 L760 300 M760 260 L710 300" fill="none" stroke="#c5824b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="250" y="133" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">Near pH 7</text><text x="735" y="133" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">Towards pH 9</text><text x="250" y="475" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">Substrate fits the active site.</text><text x="250" y="506" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">Many successful complexes.</text><text x="735" y="475" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">Active-site shape changes.</text><text x="735" y="506" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">Fewer successful complexes.</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">C: changing pH changes active-site shape</text></g></svg>