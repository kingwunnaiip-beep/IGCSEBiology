<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">What happens at X during removal of the oxygen debt?</title><desc id="desc">Lactic acid from muscles: Carried in blood to the liver; Extra oxygen in recovery: Continued rapid breathing supplies oxygen; X: aerobic respiration: Lactic acid is broken down in the liver</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">What happens at X during removal of the oxygen debt?</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="50" y="190" font-size="23" font-weight="700">Lactic acid from</text><text x="50" y="219" font-size="23" font-weight="700">muscles</text><text x="50" y="276" font-size="21" font-weight="400">Carried in blood to the liver</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="405" y="190" font-size="23" font-weight="700">Extra oxygen in</text><text x="405" y="219" font-size="23" font-weight="700">recovery</text><text x="405" y="276" font-size="21" font-weight="400">Continued rapid breathing</text><text x="405" y="303" font-size="21" font-weight="400">supplies oxygen</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="760" y="190" font-size="23" font-weight="700">X: aerobic respiration</text><text x="760" y="276" font-size="21" font-weight="400">Lactic acid is broken down in</text><text x="760" y="303" font-size="21" font-weight="400">the liver</text><path d="M345 245 H376" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)"/><path d="M700 245 H731" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)"/><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>