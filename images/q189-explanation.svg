<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1210" viewBox="0 0 1000 1210" role="img" aria-labelledby="q189-title q189-desc">
<title id="q189-title">189 · Follow the mother’s blood through the placenta</title>
<desc id="q189-desc">Answer B. The maternal blood supplies oxygen across the placenta to fetal blood, so maternal dissolved oxygen concentration decreases. Fetal urea passes into maternal blood for transport to the mother’s kidneys, so maternal urea concentration increases. Maternal and fetal circulations normally remain separate. Opposite arrows for oxygen and urea show net transfer across a placental barrier in a qualitative exchange model; they are not arrows for blood mixing and show no measured concentrations.</desc>
