<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">White offspring reveal the hidden recessive allele</title><desc id="desc">A simplified pedigree draws brown mouse 2 with white partner 1 producing white mouse 7. White mouse 7 and brown mouse 8 produce white offspring. Brown 2 and 8 therefore each carry b.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">White offspring reveal the hidden recessive allele</text><g transform="translate(200 220) scale(1.1)"><ellipse cx="0" cy="0" rx="36" ry="23" fill="white" stroke="#c5824b" stroke-width="2"/><circle cx="27" cy="-7" r="18" fill="white" stroke="#c5824b" stroke-width="2"/><circle cx="21" cy="-22" r="11" fill="white" stroke="#c5824b" stroke-width="2"/><circle cx="33" cy="-23" r="10" fill="white" stroke="#c5824b" stroke-width="2"/><circle cx="35" cy="-9" r="2" fill="#173f32" stroke="#173f32" stroke-width="1"/><path d="M-35 0 Q-70 -15 -66 18" fill="none" stroke="#c5824b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(410 220) scale(1.1)"><ellipse cx="0" cy="0" rx="36" ry="23" fill="#bc956b" stroke="#c5824b" stroke-width="2"/><circle cx="27" cy="-7" r="18" fill="#bc956b" stroke="#c5824b" stroke-width="2"/><circle cx="21" cy="-22" r="11" fill="#bc956b" stroke="#c5824b" stroke-width="2"/><circle cx="33" cy="-23" r="10" fill="#bc956b" stroke="#c5824b" stroke-width="2"/><circle cx="35" cy="-9" r="2" fill="#173f32" stroke="#173f32" stroke-width="1"/><path d="M-35 0 Q-70 -15 -66 18" fill="none" stroke="#c5824b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M245 220 H365 M305 220 V325 H410" fill="none" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(410 355) scale(1.1)"><ellipse cx="0" cy="0" rx="36" ry="23" fill="white" stroke="#c5824b" stroke-width="2"/><circle cx="27" cy="-7" r="18" fill="white" stroke="#c5824b" stroke-width="2"/><circle cx="21" cy="-22" r="11" fill="white" stroke="#c5824b" stroke-width="2"/><circle cx="33" cy="-23" r="10" fill="white" stroke="#c5824b" stroke-width="2"/><circle cx="35" cy="-9" r="2" fill="#173f32" stroke="#173f32" stroke-width="1"/><path d="M-35 0 Q-70 -15 -66 18" fill="none" stroke="#c5824b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200" y="155" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">1: bb</text><text x="410" y="155" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">2: Bb</text><text x="410" y="418" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">7: bb</text><g transform="translate(730 355) scale(1.1)"><ellipse cx="0" cy="0" rx="36" ry="23" fill="#bc956b" stroke="#c5824b" stroke-width="2"/><circle cx="27" cy="-7" r="18" fill="#bc956b" stroke="#c5824b" stroke-width="2"/><circle cx="21" cy="-22" r="11" fill="#bc956b" stroke="#c5824b" stroke-width="2"/><circle cx="33" cy="-23" r="10" fill="#bc956b" stroke="#c5824b" stroke-width="2"/><circle cx="35" cy="-9" r="2" fill="#173f32" stroke="#173f32" stroke-width="1"/><path d="M-35 0 Q-70 -15 -66 18" fill="none" stroke="#c5824b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="730" y="290" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">8: Bb</text><path d="M455 355 H685 M570 355 V455" fill="none" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(570 478) scale(0.8)"><ellipse cx="0" cy="0" rx="36" ry="23" fill="white" stroke="#c5824b" stroke-width="2"/><circle cx="27" cy="-7" r="18" fill="white" stroke="#c5824b" stroke-width="2"/><circle cx="21" cy="-22" r="11" fill="white" stroke="#c5824b" stroke-width="2"/><circle cx="33" cy="-23" r="10" fill="white" stroke="#c5824b" stroke-width="2"/><circle cx="35" cy="-9" r="2" fill="#173f32" stroke="#173f32" stroke-width="1"/><path d="M-35 0 Q-70 -15 -66 18" fill="none" stroke="#c5824b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="730" y="485" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">White offspring: bb</text><text x="710" y="155" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">Brown parents of white</text><text x="710" y="186" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">offspring must carry b.</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">B: mice 2 and 8 are Bb (heterozygous)</text></g></svg>