<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1180" viewBox="0 0 1000 1180" role="img" aria-labelledby="q222-title q222-desc">
<title id="q222-title">222 · Compare changes in cumulative volume</title>
<desc id="q222-desc">The original cumulative carbon dioxide volumes are 6, 30, 37, 40 and 41 cubic centimetres at 0, 10, 20, 30 and 40 minutes. Successive ten-minute increases are 24, 7, 3 and 1 cubic centimetres. Dividing by ten minutes gives interval mean rates 2.4, 0.7, 0.3 and 0.1 cubic centimetres per minute. Bar lengths represent those calculated interval increases, not the cumulative totals. The fastest interval is 0–10 minutes, answer A.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1180" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >222 · Compare changes in cumulative volume</text><text x="500" y="111" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Rate = change in volume ÷ change in time</text><rect x="65" y="155" width="870" height="221" rx="12" fill="#edf5f8" stroke="none" stroke-width="2"/><text x="500" y="197" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Original cumulative readings</text><text x="104" y="250" font-size="26" fill="#173d31" font-weight="700" text-anchor="start" >Time / min</text><text x="104" y="325" font-size="26" fill="#173d31" font-weight="700" text-anchor="start" >Total / cm³</text><text x="356" y="250" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >0</text><text x="356" y="325" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >6</text><text x="478" y="250" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >10</text><text x="478" y="325" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >30</text><text x="600" y="250" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >20</text><text x="600" y="325" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >37</text><text x="722" y="250" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >30</text><text x="722" y="325" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >40</text><text x="844" y="250" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >40</text><text x="844" y="325" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >41</text><text x="500" y="433" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Volume newly produced in each ten-minute interval</text><text x="75" y="492" font-size="26" fill="#173d31" font-weight="700" text-anchor="start" >0–10 min</text><rect x="260" y="465" width="552" height="43" rx="3" fill="#25614b" stroke="none" stroke-width="2"/><text x="880" y="496" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >24 cm³</text><text x="274" y="545" font-size="25" fill="#526c62" font-weight="400" text-anchor="start" >30 − 6 = 24 cm³</text><text x="75" y="609" font-size="26" fill="#173d31" font-weight="700" text-anchor="start" >10–20 min</text><rect x="260" y="582" width="161" height="43" rx="3" fill="#357ca2" stroke="none" stroke-width="2"/><text x="880" y="613" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >7 cm³</text><text x="274" y="662" font-size="25" fill="#526c62" font-weight="400" text-anchor="start" >37 − 30 = 7 cm³</text><text x="75" y="726" font-size="26" fill="#173d31" font-weight="700" text-anchor="start" >20–30 min</text><rect x="260" y="699" width="69" height="43" rx="3" fill="#357ca2" stroke="none" stroke-width="2"/><text x="880" y="730" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >3 cm³</text><text x="274" y="779" font-size="25" fill="#526c62" font-weight="400" text-anchor="start" >40 − 37 = 3 cm³</text><text x="75" y="843" font-size="26" fill="#173d31" font-weight="700" text-anchor="start" >30–40 min</text><rect x="260" y="816" width="23" height="43" rx="3" fill="#357ca2" stroke="none" stroke-width="2"/><text x="880" y="847" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >1 cm³</text><text x="274" y="896" font-size="25" fill="#526c62" font-weight="400" text-anchor="start" >41 − 40 = 1 cm³</text><rect x="80" y="968" width="840" height="104" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="1009" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Largest increase: 24 cm³ in 10 min</text><text x="500.0" y="1052" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Mean rate = 24 ÷ 10 = 2.4 cm³ per minute</text><rect x="24" y="1104" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1138" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer A · 0–10 minutes · Subtract the starting 6 cm³</text>
</g></svg>