<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img" aria-labelledby="q347-title q347-desc">
<title id="q347-title">Pectinase increases the juice extracted</title>
<desc id="q347-desc">A qualitative cumulative juice-volume graph shows the pectinase-treated sample P above water-control Q. Both totals rise and then level off. Total volume already collected cannot decrease.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="800" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Pectinase increases the juice extracted</text><text x="70" y="108" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >P: crushed apple + pectinase</text><text x="70" y="148" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >Q: equal crushed apple + water</text><line x1="175" y1="595" x2="690" y2="595" stroke="#173d31" stroke-width="4"/><polygon points="690,595 676.6950761583107,601.9266876331222 676.6950761583107,588.0733123668778" fill="#173d31"/><line x1="175" y1="595" x2="175" y2="240" stroke="#173d31" stroke-width="4"/><polygon points="175,240 181.92668763312224,253.30492384168926 168.07331236687776,253.30492384168926" fill="#173d31"/><text x="73" y="266" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >Total</text><text x="73" y="304" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >volume</text><text x="73" y="342" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >of juice</text><text x="690" y="636" font-size="26" fill="#173d31" font-weight="400" text-anchor="end" >Time</text><text x="154" y="626" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >0</text><path d="M175 595 C245 365 430 300 650 295" fill="none" stroke="#25614b" stroke-width="6"/><path d="M175 595 C245 485 430 466 650 463" fill="none" stroke="#357ca2" stroke-width="6"/><text x="672" y="306" font-size="30" fill="#173d31" font-weight="700" text-anchor="start" >P</text><text x="672" y="474" font-size="30" fill="#173d31" font-weight="700" text-anchor="start" >Q</text><rect x="750" y="265" width="285" height="275" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="892.5" y="305" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Pectinase</text><text x="892.5" y="348" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Breaks down pectin</text><text x="892.5" y="388" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >in cell walls.</text><text x="892.5" y="428" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >More juice is</text><text x="892.5" y="468" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >released from P.</text><text x="550" y="668" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Both totals rise, then level off.</text><text x="550" y="708" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >A cumulative volume cannot decrease.</text><rect x="24" y="724" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="758" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Graph B: P above Q; both cumulative totals rise to a plateau</text>
</g></svg>