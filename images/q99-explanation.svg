<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1410" viewBox="0 0 1000 1410" role="img" aria-labelledby="q99-title q99-desc">
<title id="q99-title">99 · Protease removes a protein stain</title>
<desc id="q99-desc">Answer D. Protease in biological washing powder hydrolyses peptide bonds in a protein stain. A long protein chain on fabric is broken into smaller soluble pieces, which can wash away in water. The circles represent amino acid residues and the red links represent peptide bonds. Protease is shown acting at a peptide bond and is not consumed as a protein fragment. Very hot conditions can denature the enzyme, changing its active site. No numerical optimum temperature is implied. All molecular and fabric drawings are schematic.</desc>
