<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1070" viewBox="0 0 1000 1070" role="img" aria-labelledby="q144-title q144-desc">
<title id="q144-title">144 · Kidney cells also carry out respiration</title>
<desc id="q144-desc">Answer A. Blood enters the kidney through the renal artery and leaves through the renal vein. Living kidney cells use glucose and oxygen in aerobic respiration and produce carbon dioxide, which is added to blood leaving the kidney. Urea is removed from blood for excretion in urine. Two labelled arrows connect an illustrative kidney to the artery and vein cards. No numerical concentrations or flow rates are claimed.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1070" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >144 · Kidney cells also carry out respiration</text><text x="500" y="111" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Follow blood into and out of living kidney tissue.</text><rect x="55" y="171" width="290" height="173" rx="12" fill="#f8e9df" stroke="#b94a43" stroke-width="2"/><text x="200.0" y="211" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Renal artery</text><text x="200.0" y="254" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Blood enters</text><text x="200.0" y="289" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >the kidney.</text><rect x="655" y="171" width="290" height="173" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="800.0" y="211" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Renal vein</text><text x="800.0" y="254" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Blood leaves</text><text x="800.0" y="289" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >the kidney.</text><path d="M 516 168 C 402 149 377 230 402 329 C 424 415 542 423 572 352 C 592 309 540 286 527 257 C 506 214 563 185 516 168 Z" fill="#ce9a8e" stroke="#b94a43" stroke-width="4"/><line x1="349" y1="250" x2="401" y2="250" stroke="#b94a43" stroke-width="6"/><polygon points="401,250 387.6950761583107,256.92668763312224 387.6950761583107,243.07331236687776" fill="#b94a43"/><line x1="563" y1="290" x2="646" y2="290" stroke="#357ca2" stroke-width="6"/><polygon points="646,290 632.6950761583107,296.92668763312224 632.6950761583107,283.07331236687776" fill="#357ca2"/><text x="500" y="459" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Kidney cells respire</text><rect x="75" y="503" width="850" height="136" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="543" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Glucose + oxygen → carbon dioxide + water</text><text x="500.0" y="586" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Energy is released for cell activities.</text><rect x="75" y="686" width="850" height="125" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="726" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Carbon dioxide enters the blood</text><text x="500.0" y="769" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Its concentration is higher in the renal vein.</text><rect x="75" y="853" width="850" height="112" rx="12" fill="#f4efdf" stroke="#daa958" stroke-width="2"/><text x="500.0" y="893" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Urea is removed from the blood</text><text x="500.0" y="936" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Urea is excreted in urine.</text><rect x="24" y="994" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1028" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer A · Carbon dioxide</text>
