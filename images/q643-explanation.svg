<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which statement about inherited red-green colour blindness is correct?</title><desc id="desc">The red-green colour-blindness allele in this inheritance model is recessive and X-linked. In parallel, an XY male can express one recessive allele on X, while an XX female needs two recessive alleles. Answer A.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e" /></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8" /><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Which statement about inherited red-green colour blindness is</text><text x="38" y="73" font-size="24" font-weight="700">correct?</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="50" y="207" font-size="23" font-weight="700">Recessive allele on X</text><text x="50" y="285" font-size="21" font-weight="400">X-linked inheritance</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="405" y="207" font-size="23" font-weight="700">Male XY</text><text x="405" y="285" font-size="21" font-weight="400">One affected X can cause</text><text x="405" y="312" font-size="21" font-weight="400">trait</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="760" y="207" font-size="23" font-weight="700">Female XX</text><text x="760" y="285" font-size="21" font-weight="400">Two recessive alleles</text><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text><text x="760" y="312" font-size="21" font-weight="400">needed to express the trait</text></g></svg>