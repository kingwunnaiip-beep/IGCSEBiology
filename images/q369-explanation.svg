<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Light passes through cornea, pupil and lens</title><desc id="desc">A simplified front-of-eye schematic labels the transparent cornea as 6, the gap called the pupil as 5, the rounded lens as 2, and iris tissue surrounding the pupil as 4. This is a teaching schematic, not a tracing of the original octopus eye.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L8 3 Z" fill="#245c43"/></marker></defs>
<rect width="1000" height="600" rx="24" fill="#fbf8ec"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="42" y="58" font-size="32" text-anchor="start" fill="#173f31" font-weight="bold">Light passes through cornea, pupil and lens</text><text x="65" y="115" font-size="24" text-anchor="start" fill="#173f31" font-weight="normal">Outside eye</text><text x="600" y="115" font-size="24" text-anchor="start" fill="#173f31" font-weight="normal">Inside eye</text><path d="M300 140 Q205 310 300 480" fill="#eaf3ee" stroke="#245c43" stroke-width="5"/><path d="M330 170 L350 170 L350 260 L330 260 Z M330 360 L350 360 L350 450 L330 450 Z" fill="#245c43"/><ellipse cx="465" cy="310" rx="68" ry="88" fill="#d9e9d5" stroke="#245c43" stroke-width="4"/><path d="M70 310 L385 310" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><text x="80" y="288" font-size="25" text-anchor="start" fill="#173f31" font-weight="normal">Light</text><path d="M533 310 L700 310" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><text x="720" y="318" font-size="24" text-anchor="start" fill="#173f31" font-weight="normal">Towards retina</text><text x="90" y="180" font-size="25" text-anchor="start" fill="#173f31" font-weight="bold">6: cornea</text><path d="M218 183 L257 220" stroke="#245c43" stroke-width="2"/><text x="65" y="440" font-size="24" text-anchor="start" fill="#173f31" font-weight="bold">5: pupil (opening)</text><path d="M275 425 L340 310" stroke="#245c43" stroke-width="2"/><text x="430" y="165" font-size="25" text-anchor="start" fill="#173f31" font-weight="bold">2: lens</text><path d="M470 180 L467 218" stroke="#245c43" stroke-width="2"/><text x="575" y="430" font-size="25" text-anchor="start" fill="#173f31" font-weight="bold">4: iris (tissue)</text><path d="M567 416 L350 402" stroke="#245c43" stroke-width="2"/><rect x="60" y="510" width="880" height="58" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="500" y="549" font-size="27" text-anchor="middle" fill="#173f31" font-weight="bold">Light pathway: cornea → pupil → lens</text></g></svg>