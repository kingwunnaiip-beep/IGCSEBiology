<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Breathing muscles change the volume of the thorax</title><desc id="desc">Two rib cages contain lungs and a diaphragm. During inspiration the ribs move outward and the contracted diaphragm flattens downwards, increasing thoracic volume. Expiration has a domed diaphragm.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">Breathing muscles change the volume of the thorax</text><path d="M145 460 Q120 210 240 150 M405 460 Q430 210 310 150" fill="none" stroke="#c5824b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 243 Q275 145 400 243" fill="none" stroke="#c5824b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 286 Q275 188 400 286" fill="none" stroke="#c5824b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 329 Q275 231 400 329" fill="none" stroke="#c5824b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 372 Q275 274 400 372" fill="none" stroke="#c5824b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 415 Q275 317 400 415" fill="none" stroke="#c5824b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="221" cy="305" rx="48" ry="110" fill="#dbe7eb" stroke="#537c9a" stroke-width="3"/><ellipse cx="329" cy="305" rx="48" ry="110" fill="#dbe7eb" stroke="#537c9a" stroke-width="3"/><path d="M275 140 V245 M275 245 L225 300 M275 245 L325 300" fill="none" stroke="#537c9a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 460 Q275 435 405 460" fill="none" stroke="#24644b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M615 460 Q590 210 710 150 M875 460 Q900 210 780 150" fill="none" stroke="#c5824b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M620 243 Q745 145 870 243" fill="none" stroke="#c5824b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M620 286 Q745 188 870 286" fill="none" stroke="#c5824b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M620 329 Q745 231 870 329" fill="none" stroke="#c5824b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M620 372 Q745 274 870 372" fill="none" stroke="#c5824b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M620 415 Q745 317 870 415" fill="none" stroke="#c5824b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="691" cy="305" rx="48" ry="110" fill="#dbe7eb" stroke="#537c9a" stroke-width="3"/><ellipse cx="799" cy="305" rx="48" ry="110" fill="#dbe7eb" stroke="#537c9a" stroke-width="3"/><path d="M745 140 V245 M745 245 L695 300 M745 245 L795 300" fill="none" stroke="#537c9a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M615 460 Q745 325 875 460" fill="none" stroke="#24644b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="275" y="120" font-size="28" fill="#173f32" text-anchor="middle" font-weight="700">Inspiration</text><text x="745" y="120" font-size="28" fill="#173f32" text-anchor="middle" font-weight="700">Expiration</text><path d="M130 285 L95 260" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M420 285 L455 260" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M275 430 V485" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="275" y="521" font-size="23" fill="#173f32" text-anchor="middle" font-weight="400">Diaphragm contracts and flattens.</text><text x="745" y="521" font-size="23" fill="#173f32" text-anchor="middle" font-weight="400">Relaxed diaphragm is domed.</text><text x="500" y="178" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">Internal intercostals relax</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">A: internal intercostals relax; diaphragm contracts</text></g></svg>