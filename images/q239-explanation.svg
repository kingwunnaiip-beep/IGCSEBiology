<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="q239-title q239-desc">
<title id="q239-title">Ovule and filament are the plant-only terms</title>
<desc id="q239-desc">Qualitative flower-part models. A filament supports an anther, while an ovule lies inside the flower ovary and contains the female gamete. Terms male gamete, female gamete, ovary, fertilisation and haploid are shared with animal reproduction. The correct numbered pair is 3 and 5.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="760" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Ovule and filament are the plant-only terms</text><text x="500" y="100" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative flower-part models; not to scale</text><rect x="40" y="130" width="440" height="366" rx="12" fill="white" stroke="#25614b" stroke-width="2"/><text x="260" y="174" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >5 — filament</text><ellipse cx="190" cy="249" rx="60" ry="28" fill="#daa958" stroke="#173d31" stroke-width="3"/><path d="M190 280 Q195 357 210 443" fill="none" stroke="#25614b" stroke-width="7"/><line x1="251" y1="249" x2="288" y2="249" stroke="#173d31" stroke-width="2"/><text x="305" y="259" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >anther</text><line x1="200" y1="374" x2="271" y2="360" stroke="#173d31" stroke-width="2"/><text x="278" y="356" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >filament</text><text x="278" y="390" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >supports anther</text><rect x="520" y="130" width="440" height="366" rx="12" fill="white" stroke="#25614b" stroke-width="2"/><text x="740" y="174" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >3 — ovule</text><ellipse cx="690" cy="344" rx="95" ry="112" fill="#eff5e8" stroke="#25614b" stroke-width="3"/><path d="M675 236 L675 207 L705 207 L705 236" fill="none" stroke="#25614b" stroke-width="3"/><ellipse cx="690" cy="358" rx="27" ry="39" fill="#f8ead2" stroke="#daa958" stroke-width="3"/><circle cx="690" cy="367" r="6" fill="#173d31" stroke="#173d31" stroke-width="3"/><line x1="719" y1="352" x2="791" y2="323" stroke="#173d31" stroke-width="2"/><text x="806" y="328" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >ovule</text><line x1="780" y1="393" x2="791" y2="422" stroke="#173d31" stroke-width="2"/><text x="806" y="433" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >ovary</text><text x="500" y="550" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Shared with animals:</text><text x="500" y="586" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >1 male gamete  •  2 female gamete  •  4 ovary</text><text x="500" y="622" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >6 fertilisation  •  7 haploid</text><rect x="24" y="684" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="718" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >D — terms 3 and 5: ovule and filament</text>
</g></svg>