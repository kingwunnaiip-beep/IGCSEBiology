6893" fill="#357ca2"/><text x="260" y="652" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Height increases</text><text x="700" y="652" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Little or no increase</text><rect x="35" y="704" width="250" height="118" rx="12" fill="#e7f2f6" stroke="#357ca2" stroke-width="2"/><text x="160" y="745" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Shoot tip</text><text x="160" y="788" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >makes auxin</text><rect x="355" y="704" width="250" height="118" rx="12" fill="#e7f2f6" stroke="#357ca2" stroke-width="2"/><text x="480" y="745" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Auxin moves</text><text x="480" y="788" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >to elongation zone</text><rect x="675" y="704" width="250" height="118" rx="12" fill="#e7f2f6" stroke="#357ca2" stroke-width="2"/><text x="800" y="745" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Cells elongate</text><text x="800" y="788" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >shoot grows taller</text><line x1="292" y1="763" x2="347" y2="763" stroke="#357ca2" stroke-width="4"/><polygon points="347,763 333.6950761583107,769.9266876331222 333.6950761583107,756.0733123668778" fill="#357ca2"/><line x1="612" y1="763" x2="667" y2="763" stroke="#357ca2" stroke-width="4"/><polygon points="667,763 653.6950761583107,769.9266876331222 653.6950761583107,756.0733123668778" fill="#357ca2"/><text x="480" y="873" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >This result supports the auxin explanation.</text><text x="480" y="909" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >It does not rule out other growth substances.</text><rect x="24" y="924" width="912" height="52" rx="12" fill="#eff5e8" stroke="none" stro