<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="t d"><title id="t">Unequal shoot elongation causes curvature</title><desc id="d">With auxin supplied on the right side of a shoot, right-side cells elongate more. The right side becomes the outside of the curve and the shoot bends left. Qualitative model.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#286c50" stroke-width="1.5"/></marker></defs><rect width="960" height="560" rx="20" fill="#fbf9ed"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="28" text-anchor="start" fill="#173f32">Unequal shoot elongation causes curvature</text><text x="240" y="110" font-size="25" text-anchor="middle" fill="#173f32">Right-side auxin supply</text><rect x="205" y="230" width="60" height="230" rx="14" fill="#e0ecda" stroke="#286c50" stroke-width="3"/><rect x="250" y="180" width="32" height="65" rx="14" fill="#d49a39" stroke="#286c50" stroke-width="3"/><text x="340" y="220" font-size="23" text-anchor="start" fill="#173f32">Auxin agar</text><path d="M325 225 L285 225" stroke="#286c50" stroke-width="2" fill="none"/><path d="M235 280 L263 280" stroke="#286c50" stroke-width="2" fill="none"/><path d="M235 325 L263 325" stroke="#286c50" stroke-width="2" fill="none"/><path d="M235 370 L263 370" stroke="#286c50" stroke-width="2" fill="none"/><path d="M235 415 L263 415" stroke="#286c50" stroke-width="2" fill="none"/><path d="M305 430 L305 285" stroke="#286c50" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="360" y="320" font-size="22" text-anchor="start" fill="#173f32">More elongation</text><text x="360" y="355" font-size="22" text-anchor="start" fill="#173f32">on the right</text><path d="M530 315 L610 315" stroke="#286c50" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M745 460 C745 360 735 290 665 235 L700 205 C785 265 805 355 805 460Z" fill="#b4d396" stroke="#286c50" stroke-width="4"/><text x="760" y="140" font-size="27" text-anchor="middle" fill="#173f32">Bends left</text><text x="760" y="500" font-size="22" text-anchor="middle" fill="#173f32">Right side becomes longer</text><text x="480" y="545" font-size="23" text-anchor="middle" fill="#173f32">Shoot bends away from the faster-growing side.</text></g></svg>