<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1240" viewBox="0 0 1000 1240" role="img" aria-labelledby="q160-title q160-desc">
<title id="q160-title">160 · Monoculture can let a crop disease spread</title>
<desc id="q160-desc">Answer D. A large-scale monoculture grows one crop species over a large area. Many nearby suitable hosts allow a crop pathogen to spread. Plants of one variety may also share susceptibility because they are genetically similar. The field sketch contains repeated crop symbols and arrows from a diseased plant towards neighbouring hosts, illustrating possible spread. It is a qualitative model, not disease data or an infection probability. Monocultures do not necessarily fail, but widespread disease is a risk. Increasing biodiversity is not the usual result of growing a single crop over a large area.</desc>
