<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which crops were produced by sexual reproduction?</title><desc id="desc">Compare crop groups rather than a process sequence: banana shows zero measured genetic variation, consistent with clones. Pea and carrot show variation, matching sexual reproduction in this question. Answer D.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e" /></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8" /><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Which crops were produced by sexual reproduction?</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="50" y="207" font-size="23" font-weight="700">Banana: 0% variation</text><text x="50" y="285" font-size="21" font-weight="400">Consistent with clonal</text><text x="50" y="312" font-size="21" font-weight="400">production</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="405" y="207" font-size="23" font-weight="700">Pea: 65%; carrot: 54%</text><text x="405" y="285" font-size="21" font-weight="400">Both groups show variation</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="760" y="207" font-size="23" font-weight="700">Sexual reproduction</text><text x="760" y="285" font-size="21" font-weight="400">Pea and carrot</text><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>