<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="980" viewBox="0 0 1100 980" role="img" aria-labelledby="q66-title q66-desc">
<title id="q66-title">Urea: made in the liver, removed by kidneys</title>
<desc id="q66-desc">Two independent diagrams show within-organ directions in the simplified exam model. The liver produces urea from nitrogen in excess amino acids and adds it to blood. The kidneys remove urea from blood and excrete it in urine. These directions do not establish an absolute ranking of all four samples. B is the intended answer among the listed rows: highest entering kidneys, lowest entering liver.</desc>
