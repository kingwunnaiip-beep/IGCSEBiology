<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">The fastest reaction has the shortest completion time</title><desc id="desc">A digestion-time curve reaches its minimum at approximately 40 degrees Celsius. The highlighted minimum is contrasted with longer completion times at other temperatures.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">The fastest reaction has the shortest completion time</text><path d="M140 450 V160" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M140 450 H620" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="70" y="140" font-size="23" fill="#173f32" text-anchor="start" font-weight="400">Digestion time</text><text x="380" y="520" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">Temperature / °C</text><path d="M210 160 C280 170 325 210 350 320 C370 380 390 410 420 410 C450 410 475 370 490 330" fill="none" stroke="#24644b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 450 V458" fill="none" stroke="#24644b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="485" font-size="23" fill="#173f32" text-anchor="middle" font-weight="400">0</text><path d="M280 450 V458" fill="none" stroke="#24644b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="485" font-size="23" fill="#173f32" text-anchor="middle" font-weight="400">20</text><path d="M420 450 V458" fill="none" stroke="#24644b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="420" y="485" font-size="23" fill="#173f32" text-anchor="middle" font-weight="400">40</text><path d="M560 450 V458" fill="none" stroke="#24644b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="560" y="485" font-size="23" fill="#173f32" text-anchor="middle" font-weight="400">60</text><path d="M420 450 V410" fill="none" stroke="#537c9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="420" cy="410" r="9" fill="#c5824b" stroke="#c5824b" stroke-width="2"/><path d="M650 260 L420 410" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="760" y="180" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">Minimum time</text><text x="760" y="220" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">near 40°C</text><text x="760" y="260" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">means fastest</text><text x="760" y="300" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">digestion.</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">C: 40°C  •  rate is inversely related to time for the same starch quantity</text></g></svg>