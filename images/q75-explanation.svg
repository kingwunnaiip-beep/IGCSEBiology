<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" viewBox="0 0 800 680" role="img" aria-labelledby="q75-title q75-desc">
<title id="q75-title">Chemical transmission across a synapse</title>
<desc id="q75-desc">P is a vesicle, Q is neurotransmitter, R is the synaptic gap, and S is a receptor. An impulse triggers neurotransmitter release from neurone 1. It diffuses across the cleft and binds to receptors on neurone 2, which may generate a new impulse. This chemical synapse transmits one way.</desc>
