<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1220" viewBox="0 0 1000 1220" role="img" aria-labelledby="q133-title q133-desc">
<title id="q133-title">133 · Three features speed up oxygen diffusion</title>
<desc id="q133-desc">Answer A: the fastest diffusion occurs with a large surface area, a steep concentration gradient and a short diffusion distance. A simplified alveolar air-to-blood diagram illustrates net oxygen movement through a thin exchange barrier. More oxygen symbols in the air than the blood indicate a concentration difference qualitatively; symbol counts are not measurements. Ventilation and blood flow help maintain the concentration gradient. Numerous alveoli provide a large total gas-exchange surface area. Diffusion does not require energy from respiration.</desc>
