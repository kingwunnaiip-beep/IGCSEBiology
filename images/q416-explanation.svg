<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Osmosis makes a red blood cell swell</title><desc id="desc">Water moves from higher water potential pure water outside into lower water potential cytoplasm across the cell membrane. Solute dots remain inside. The cell can swell and burst because it has no cell wall.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#327153"/></marker></defs><rect width="960" height="540" rx="24" fill="#faf9ef"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="49" text-anchor="start" fill="#163d31" font-size="30" font-weight="bold">Osmosis makes a red blood cell swell</text><text x="36" y="89" text-anchor="start" fill="#163d31" font-size="23" font-weight="normal">Pure water outside → solute-containing cytoplasm inside</text><rect x="36" y="117" width="888" height="306" rx="18" fill="#e8f2ef" stroke="#327153" stroke-width="2"/><circle cx="675" cy="270" r="105" fill="#f4e6de" stroke="#a75c48" stroke-width="3"/><text x="209" y="163" text-anchor="middle" fill="#163d31" font-size="25" font-weight="bold">Outside: higher</text><text x="209" y="196" text-anchor="middle" fill="#163d31" font-size="25" font-weight="normal">water potential</text><text x="675" y="258" text-anchor="middle" fill="#163d31" font-size="25" font-weight="bold">Inside: lower</text><text x="675" y="291" text-anchor="middle" fill="#163d31" font-size="25" font-weight="normal">water potential</text><path d="M333 245 L549 245" fill="none" stroke="#327153" stroke-width="4"/><path d="M539 238 L549 245 L539 252" fill="none" stroke="#327153" stroke-width="4"/><path d="M333 296 L549 296" fill="none" stroke="#327153" stroke-width="4"/><path d="M539 289 L549 296 L539 303" fill="none" stroke="#327153" stroke-width="4"/><path d="M333 347 L549 347" fill="none" stroke="#327153" stroke-width="4"/><path d="M539 340 L549 347 L539 354" fill="none" stroke="#327153" stroke-width="4"/><circle cx="629" cy="327" r="6" fill="#a75c48" stroke="#a75c48" stroke-width="3"/><circle cx="705" cy="205" r="6" fill="#a75c48" stroke="#a75c48" stroke-width="3"/><circle cx="741" cy="319" r="6" fill="#a75c48" stroke="#a75c48" stroke-width="3"/><circle cx="654" cy="213" r="6" fill="#a75c48" stroke="#a75c48" stroke-width="3"/><text x="434" y="217" text-anchor="middle" fill="#163d31" font-size="23" font-weight="normal">water enters</text><text x="675" y="400" text-anchor="middle" fill="#163d31" font-size="22" font-weight="normal">cell membrane</text><text x="480" y="467" text-anchor="middle" fill="#163d31" font-size="29" font-weight="bold">Net osmosis: high → low water potential</text><text x="36" y="517" text-anchor="start" fill="#587064" font-size="17" font-weight="normal">Original teaching schematic • not to scale</text></g></svg>