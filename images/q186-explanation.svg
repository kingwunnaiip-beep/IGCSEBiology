<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1170" viewBox="0 0 1000 1170" role="img" aria-labelledby="q186-title q186-desc">
<title id="q186-title">186 · Compare carbon dioxide per glucose</title>
<desc id="q186-desc">Answer C. For one glucose molecule, aerobic respiration in yeast produces six carbon dioxide molecules and anaerobic respiration produces two. The balanced aerobic equation is glucose plus six oxygen molecules gives six carbon dioxide and six water molecules. The anaerobic equation is glucose gives two ethanol molecules and two carbon dioxide molecules. Six minus two is four more carbon dioxide molecules aerobically. The drawn CO2 symbols represent stoichiometric molecule counts, not measured gas volumes or rates.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1170" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >186 · Compare carbon dioxide per glucose</text><text x="500" y="110" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Keep the glucose amount the same: one molecule.</text><rect x="55" y="158" width="890" height="291" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="200" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Aerobic respiration</text><text x="500.0" y="244" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O</text><circle cx="180" cy="355" r="43" fill="#fffdf7" stroke="#357ca2" stroke-width="2"/><text x="180" y="364" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >CO₂</text><circle cx="308" cy="355" r="43" fill="#fffdf7" stroke="#357ca2" stroke-width="2"/><text x="308" y="364" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >CO₂</text><circle cx="436" cy="355" r="43" fill="#fffdf7" stroke="#357ca2" stroke-width="2"/><text x="436" y="364" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >CO₂</text><circle cx="564" cy="355" r="43" fill="#fffdf7" stroke="#357ca2" stroke-width="2"/><text x="564" y="364" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >CO₂</text><circle cx="692" cy="355" r="43" fill="#fffdf7" stroke="#357ca2" stroke-width="2"/><text x="692" y="364" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >CO₂</text><circle cx="820" cy="355" r="43" fill="#fffdf7" stroke="#357ca2" stroke-width="2"/><text x="820" y="364" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >CO₂</text><text x="500" y="425" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >6 CO₂ molecules per glucose</text><rect x="55" y="493" width="890" height="291" rx="12" fill="#f4efdf" stroke="#daa958" stroke-width="2"/><text x="500.0" y="535" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Anaerobic respiration in yeast</text><text x="500.0" y="579" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂</text><circle cx="436" cy="690" r="43" fill="#fffdf7" stroke="#daa958" stroke-width="2"/><text x="436" y="699" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >CO₂</text><circle cx="564" cy="690" r="43" fill="#fffdf7" stroke="#daa958" stroke-width="2"/><text x="564" y="699" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >CO₂</text><text x="500" y="759" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >2 CO₂ molecules per glucose</text><rect x="110" y="839" width="780" height="150" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="881" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >How many more? 6 − 2 = 4</text><text x="500.0" y="925" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Subtract the anaerobic yield from the aerobic yield.</text><text x="500" y="1038" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Symbols count products in balanced equations, not measured gas data.</text><rect x="24" y="1094" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1128" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · 4 more CO₂ molecules per glucose molecule</text>
</g></svg>