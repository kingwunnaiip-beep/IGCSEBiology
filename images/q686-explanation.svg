<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which row correctly describes active transport?</title><desc id="desc">Against the gradient: Lower → higher concentration; Cell membrane required: Selective transport proteins provide the route; Energy is required: Supplied by respiration</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Which row correctly describes active transport?</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="50" y="190" font-size="23" font-weight="700">Against the gradient</text><text x="50" y="276" font-size="21" font-weight="400">Lower → higher</text><text x="50" y="303" font-size="21" font-weight="400">concentration</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="405" y="190" font-size="23" font-weight="700">Cell membrane required</text><text x="405" y="276" font-size="21" font-weight="400">Selective transport proteins</text><text x="405" y="303" font-size="21" font-weight="400">provide the route</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="760" y="190" font-size="23" font-weight="700">Energy is required</text><text x="760" y="276" font-size="21" font-weight="400">Supplied by respiration</text><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>