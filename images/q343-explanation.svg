<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="840" viewBox="0 0 1100 840" role="img" aria-labelledby="q343-title q343-desc">
<title id="q343-title">Mitosis preserves chromosome number and genotype</title>
<desc id="q343-desc">A diploid parent cell carries the alleles R and r on a homologous chromosome pair. Mitosis produces two diploid daughters, each Rr and therefore heterozygous. Only the labelled pair is shown.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="840" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Mitosis preserves chromosome number and genotype</text><ellipse cx="550" cy="210" rx="150" ry="100" fill="#eff5e8" stroke="#25614b" stroke-width="3"/><ellipse cx="550" cy="210" rx="102" ry="70" fill="white" stroke="#526c62" stroke-width="2"/><line x1="487" y1="188" x2="613" y2="188" stroke="#25614b" stroke-width="8"/><line x1="487" y1="238" x2="613" y2="238" stroke="#25614b" stroke-width="8"/><text x="632" y="198" font-size="29" fill="#173d31" font-weight="700" text-anchor="start" >R</text><text x="632" y="248" font-size="29" fill="#173d31" font-weight="700" text-anchor="start" >r</text><text x="550" y="100" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Parent: diploid, Rr</text><line x1="455" y1="315" x2="320" y2="415" stroke="#25614b" stroke-width="4"/><polygon points="320,415 326.5683119460805,401.5145530968019 334.81422257370633,412.6465324440968" fill="#25614b"/><line x1="645" y1="315" x2="780" y2="415" stroke="#25614b" stroke-width="4"/><polygon points="780,415 765.1857774262936,412.6465324440968 773.4316880539195,401.5145530968019" fill="#25614b"/><text x="550" y="365" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Mitosis</text><ellipse cx="285" cy="525" rx="150" ry="100" fill="#eff5e8" stroke="#25614b" stroke-width="3"/><ellipse cx="285" cy="525" rx="102" ry="70" fill="white" stroke="#526c62" stroke-width="2"/><line x1="222" y1="503" x2="348" y2="503" stroke="#25614b" stroke-width="8"/><line x1="222" y1="553" x2="348" y2="553" stroke="#25614b" stroke-width="8"/><text x="367" y="513" font-size="29" fill="#173d31" font-weight="700" text-anchor="start" >R</text><text x="367" y="563" font-size="29" fill="#173d31" font-weight="700" text-anchor="start" >r</text><ellipse cx="815" cy="525" rx="150" ry="100" fill="#eff5e8" stroke="#25614b" stroke-width="3"/><ellipse cx="815" cy="525" rx="102" ry="70" fill="white" stroke="#526c62" stroke-width="2"/><line x1="752" y1="503" x2="878" y2="503" stroke="#25614b" stroke-width="8"/><line x1="752" y1="553" x2="878" y2="553" stroke="#25614b" stroke-width="8"/><text x="897" y="513" font-size="29" fill="#173d31" font-weight="700" text-anchor="start" >R</text><text x="897" y="563" font-size="29" fill="#173d31" font-weight="700" text-anchor="start" >r</text><text x="285" y="660" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Diploid, Rr: heterozygous</text><text x="815" y="660" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Diploid, Rr: heterozygous</text><text x="550" y="710" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Only the labelled homologous pair is shown; neither allele is lost.</text><rect x="24" y="764" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="798" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >A: diploid and heterozygous</text>
