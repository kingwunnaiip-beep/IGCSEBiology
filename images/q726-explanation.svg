<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Osmosis continues even when there is no net change</title><desc id="desc">Equal-sized arrows point into and out of a potato cell. At the concentration where cylinder length stays unchanged, inward and outward water movement balance.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">Osmosis continues even when there is no net change</text><rect x="350" y="185" width="300" height="260" rx="12" fill="#dcebd7" stroke="#24644b" stroke-width="7"/><rect x="368" y="203" width="264" height="224" rx="10" fill="#f7f5de" stroke="#537c9a" stroke-width="3"/><ellipse cx="500" cy="310" rx="100" ry="83" fill="#dfedf1" stroke="#537c9a" stroke-width="3"/><circle cx="420" cy="240" r="8" fill="#c5824b" stroke="#c5824b" stroke-width="3"/><circle cx="580" cy="250" r="8" fill="#c5824b" stroke="#c5824b" stroke-width="3"/><circle cx="410" cy="390" r="8" fill="#c5824b" stroke="#c5824b" stroke-width="3"/><circle cx="590" cy="380" r="8" fill="#c5824b" stroke="#c5824b" stroke-width="3"/><g transform="translate(160 210) scale(0.9)"><circle cx="0" cy="0" r="13" fill="#cfe5ec" stroke="#537c9a" stroke-width="3"/><circle cx="-15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/><circle cx="15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/></g><g transform="translate(240 350) scale(0.9)"><circle cx="0" cy="0" r="13" fill="#cfe5ec" stroke="#537c9a" stroke-width="3"/><circle cx="-15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/><circle cx="15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/></g><g transform="translate(780 240) scale(0.9)"><circle cx="0" cy="0" r="13" fill="#cfe5ec" stroke="#537c9a" stroke-width="3"/><circle cx="-15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/><circle cx="15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/></g><g transform="translate(835 380) scale(0.9)"><circle cx="0" cy="0" r="13" fill="#cfe5ec" stroke="#537c9a" stroke-width="3"/><circle cx="-15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/><circle cx="15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/></g><path d="M145 290 H340" fill="none" stroke="#537c9a" stroke-width="5" marker-end="url(#arrow)"/><path d="M340 340 H145" fill="none" stroke="#537c9a" stroke-width="5" marker-end="url(#arrow)"/><path d="M665 290 H860" fill="none" stroke="#537c9a" stroke-width="5" marker-end="url(#arrow)"/><path d="M860 340 H665" fill="none" stroke="#537c9a" stroke-width="5" marker-end="url(#arrow)"/><text x="500" y="142" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">0.2 mol dm⁻³ sucrose: equal water potential</text><text x="500" y="490" font-size="26" fill="#173f32" text-anchor="middle" font-weight="400">Water continues to move in both directions.</text><text x="500" y="521" font-size="26" fill="#173f32" text-anchor="middle" font-weight="400">Equal opposing rates → no net change in length.</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">C: water movement into and out of cells is balanced</text></g></svg>