a possible new allele</text><text x="500" y="664" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Invented single-strand example; no 5′ or 3′ direction is assigned.</text><rect x="65" y="710" width="870" height="128" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="750" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Mutation</text><text x="500.0" y="793" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Changes genetic material; can generate a new allele.</text><rect x="65" y="872" width="870" height="128" rx="12" fill="#f4efdf" stroke="#daa958" stroke-width="2"/><text x="500.0" y="912" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Selection and sexual reproduction</text><text x="500.0" y="955" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Change allele frequencies or combine parental alleles.</text><text x="500" y="1051" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >A new allele need not cause a visible change in the organism.</text><text x="500" y="1090" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >New allele is different from a new combination of old alleles.</text><rect x="24" y="1134" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1168" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer B · Mutation</text>
