<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="q272-title q272-desc">
<title id="q272-title">Isolation can limit sexual reproduction</title>
<desc id="q272-desc">In mate-dependent sexual reproduction, a suitable mate is needed before gametes can fuse. An isolated individual may fail to reproduce. Sexual reproduction usually increases genetic diversity rather than reducing it.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="700" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Isolation can limit sexual reproduction</text><rect x="50" y="110" width="440" height="155" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="270.0" y="152" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Individuals can meet</text><text x="270.0" y="193" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >A suitable mate is available.</text><text x="270.0" y="228" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Gametes can meet.</text><rect x="630" y="110" width="440" height="155" rx="12" fill="#fff0e8" stroke="#daa958" stroke-width="2"/><text x="850.0" y="152" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Individuals are isolated</text><text x="850.0" y="193" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >A suitable mate may be absent.</text><text x="850.0" y="228" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Reproduction can be reduced.</text><line x1="270" y1="280" x2="270" y2="355" stroke="#25614b" stroke-width="5"/><polygon points="270,355 263.07331236687776,341.6950761583107 276.92668763312224,341.6950761583107" fill="#25614b"/><line x1="850" y1="280" x2="850" y2="355" stroke="#daa958" stroke-width="5"/><polygon points="850,355 843.0733123668778,341.6950761583107 856.9266876331222,341.6950761583107" fill="#daa958"/><rect x="50" y="380" width="440" height="140" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="270.0" y="422" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Fertilisation is possible</text><text x="270.0" y="463" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Fusion of male and</text><text x="270.0" y="498" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >female gametes</text><rect x="630" y="380" width="440" height="140" rx="12" fill="#fff0e8" stroke="#daa958" stroke-width="2"/><text x="850.0" y="422" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Fertilisation less likely</text><text x="850.0" y="463" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >No offspring from that pairing</text><text x="560" y="573" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Mixing alleles normally increases diversity and adaptive potential.</text><rect x="24" y="624" width="1072" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="560.0" y="658" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C — a reduction in reproduction if individuals are isolated</text>
</g></svg>