<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-labelledby="q18-title q18-desc"><title id="q18-title">Hepatic portal vein S and hepatic vein T</title><desc id="q18-desc">Blood flows from the intestine to the liver through S, the hepatic portal vein. It leaves the liver through T, the hepatic vein, and enters the vena cava on its way to the heart.</desc><defs><marker id="a-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#25614b"/></marker><marker id="a-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#357ca2"/></marker><marker id="a-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b94a43"/></marker><marker id="a-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d5a545"/></marker></defs><rect width="640" height="460" rx="20" fill="#fffdf7"/><g font-family="Arial, Helvetica, sans-serif"><text x="320" y="43" font-size="32" fill="#173d31" text-anchor="middle" font-weight="700">Intestine → liver → heart</text><text x="100" y="94" font-size="28" fill="#173d31" text-anchor="middle" font-weight="700">Intestine</text><text x="511" y="94" font-size="28" fill="#173d31" text-anchor="middle" font-weight="700">Liver</text><rect x="46" y="119" width="113" height="111" rx="27" fill="#f2dfc5" stroke="#25614b" stroke-width="4"/><path d="M67 140 H133 V160 H67 V183 H133 V207 H73" fill="none" stroke="#ab8462" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M448 136 Q499 100 569 134 L590 188 Q537 229 455 210 Q426 188 448 136 Z" fill="#b77e68" stroke="#25614b" stroke-width="4"/><path d="M173 169 L419 169" fill="none" stroke="#357ca2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-b)"/><text x="296" y="133" font-size="32" fill="#357ca2" text-anchor="middle" font-weight="700">S</text><text x="296" y="213" font-size="28" fill="#173d31" text-anchor="middle" font-weight="500">Hepatic</text><text x="296" y="246" font-size="28" fill="#173d31" text-anchor="middle" font-weight="500">portal vein</text><path d="M513 239 V335 H418" fill="none" stroke="#357ca2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-b)"/><text x="556" y="282" font-size="32" fill="#357ca2" text-anchor="middle" font-weight="700">T</text><text x="492" y="394" font-size="28" fill="#173d31" text-anchor="middle" font-weight="500">Hepatic vein</text><path d="M404 320 H281 V350 H404" fill="#bad7e8" stroke="#357ca2" stroke-width="3"/><path d="M389 335 H274" fill="none" stroke="#357ca2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-b)"/><text x="335" y="300" font-size="28" fill="#173d31" text-anchor="middle" font-weight="500">Vena cava</text><path d="M268 335 H188" fill="none" stroke="#357ca2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-b)"/><path d="M116 365 C78 340 54 309 78 289 C94 276 110 284 117 297 C126 280 143 277 158 289 C180 311 155 341 116 365 Z" fill="#b94a43" stroke="#173d31" stroke-width="3"/><text x="116" y="409" font-size="28" fill="#173d31" text-anchor="middle" font-weight="700">Heart</text></g></svg>