<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1340" viewBox="0 0 1000 1340" role="img" aria-labelledby="q94-title q94-desc">
<title id="q94-title">94 · Low temperature delays seed germination</title>
<desc id="q94-desc">Answer D: low temperature. Most seeds need water, oxygen and a suitable temperature to germinate. Water activates metabolism, oxygen supports aerobic respiration, and a suitable temperature allows enzyme-controlled reactions to proceed. The seed-to-seedling drawing is a qualitative sequence and is not an experimental result. A seed bank uses low temperature to slow enzyme-controlled reactions, respiration and other metabolic activity, delaying germination. Seeds are also commonly stored dry. Low light is not a universal way to prevent germination because many seeds can germinate in darkness. No measured storage temperatures are claimed, and the diagram does not claim that cold kills every seed.</desc>
