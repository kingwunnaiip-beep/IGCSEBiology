rect x="520" y="656" width="415" height="139" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="727.5" y="696" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Lactase</text><text x="727.5" y="738" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Enzyme for lactose digestion</text><text x="500" y="855" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >A hormone travels to target tissues and changes their activity.</text><text x="500" y="894" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Illustrative pathway; no concentrations or times are implied.</text><rect x="24" y="964" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="998" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · Testosterone</text>
