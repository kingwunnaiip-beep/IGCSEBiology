<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="q274-title q274-desc">
<title id="q274-title">Three sources of different allele combinations</title>
<desc id="q274-desc">Meiosis generates genetically different gametes. Random mating brings together different parental genotypes. Random fertilisation combines gametes unpredictably. All three increase genetic variation in populations.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="770" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Three sources of different allele combinations</text><rect x="40" y="120" width="320" height="245" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="200.0" y="162" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >1  Meiosis</text><text x="200.0" y="203" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Alleles are reshuffled</text><text x="200.0" y="238" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >as gametes form.</text><text x="200.0" y="273" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Gametes can differ</text><text x="200.0" y="308" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >genetically.</text><rect x="400" y="120" width="320" height="245" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="560.0" y="162" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >2  Random mating</text><text x="560.0" y="203" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Different parental</text><text x="560.0" y="238" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >genotypes can pair.</text><text x="560.0" y="273" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Different alleles can</text><text x="560.0" y="308" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >enter the same cross.</text><rect x="760" y="120" width="320" height="245" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="920.0" y="162" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >3  Fertilisation</text><text x="920.0" y="203" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >One random sperm</text><text x="920.0" y="238" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >can fuse with an egg.</text><text x="920.0" y="273" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Gametes combine</text><text x="920.0" y="308" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >unpredictably.</text><line x1="200" y1="380" x2="560" y2="485" stroke="#357ca2" stroke-width="4"/><polygon points="560,485 545.2878005747041,487.92424145212436 549.1667456492526,474.62500119652964" fill="#357ca2"/><line x1="560" y1="380" x2="560" y2="485" stroke="#357ca2" stroke-width="4"/><polygon points="560,485 553.0733123668778,471.6950761583107 566.9266876331222,471.6950761583107" fill="#357ca2"/><line x1="920" y1="380" x2="560" y2="485" stroke="#357ca2" stroke-width="4"/><polygon points="560,485 570.8332543507474,474.62500119652964 574.7121994252959,487.92424145212436" fill="#357ca2"/><rect x="180" y="510" width="760" height="120" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="560.0" y="552" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Genetic variation in the population</text><text x="560.0" y="593" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Offspring inherit different combinations of alleles.</text><text x="560" y="672" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Mutation can create new alleles; these processes reshuffle alleles.</text><rect x="24" y="694" width="1072" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="560.0" y="728" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >A — 1, 2 and 3</text>
</g></svg>