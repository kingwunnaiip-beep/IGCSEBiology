<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Muscle thickness matches pumping pressure</title><desc id="desc">Three chamber schematics compare wall thickness: thin atria, thicker right ventricle and thickest left ventricle. Increasing wall thickness reflects increasing pumping pressure. In the source graph the right ventricle is B, below A but above the thin atria.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#32745a" stroke-width="1.5"/></marker></defs><rect width="1000" height="620" rx="22" fill="#faf8e9"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="54" font-size="30" text-anchor="start" fill="#183f35" font-weight="bold">Muscle thickness matches pumping pressure</text><ellipse cx="175" cy="265" rx="100" ry="115" fill="#f9f6e6" stroke="#4a7d5a" stroke-width="10"/><text x="175" y="125" font-size="25" text-anchor="middle" fill="#183f35" font-weight="normal">Atria</text><text x="175" y="450" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">Short-distance transfer</text><text x="175" y="482" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">into ventricles</text><ellipse cx="500" cy="265" rx="100" ry="115" fill="#f9f6e6" stroke="#4a7d5a" stroke-width="24"/><text x="500" y="125" font-size="25" text-anchor="middle" fill="#183f35" font-weight="normal">Right ventricle</text><text x="500" y="450" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">Pumps to lungs</text><text x="500" y="482" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">Lower pressure</text><ellipse cx="825" cy="265" rx="100" ry="115" fill="#f9f6e6" stroke="#4a7d5a" stroke-width="45"/><text x="825" y="125" font-size="25" text-anchor="middle" fill="#183f35" font-weight="normal">Left ventricle</text><text x="825" y="450" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">Pumps to body</text><text x="825" y="482" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">Highest pressure</text><text x="500" y="555" font-size="24" text-anchor="middle" fill="#183f35" font-weight="normal">Greater pumping pressure requires a thicker muscular wall.</text><text x="500" y="590" font-size="19" text-anchor="middle" fill="#183f35" font-weight="normal">Schematic comparison; chamber sizes are not to scale.</text></g></svg>