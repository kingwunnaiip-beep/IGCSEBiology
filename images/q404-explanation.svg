<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="q404-title q404-desc"><title id="q404-title">More secondary consumers increase predation on primary consumers</title><desc id="q404-desc">The feeding chain runs from seaweed through whelks and crabs to seagulls. Crabs are secondary consumers. A rise in crabs increases predation on whelks, reducing their number.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#245943"/></marker></defs><rect width="1000" height="600" rx="24" fill="#fbf9ee"/><g font-family="Arial, sans-serif"><text x="40" y="55" font-size="27" fill="#173e31" text-anchor="start" font-weight="bold">More secondary consumers increase predation on primary consumers</text><rect x="30" y="150" width="205" height="190" rx="16" fill="#e5f0df" stroke="#245943" stroke-width="2"/><text x="132" y="205" font-size="27" fill="#173e31" text-anchor="middle" font-weight="bold">Seaweed</text><text x="132" y="250" font-size="19" fill="#173e31" text-anchor="middle" font-weight="normal">producer</text><path d="M240 235 L270 235" fill="none" stroke="#245943" stroke-width="4" marker-end="url(#arrow)"/><rect x="275" y="150" width="205" height="190" rx="16" fill="#e5f0df" stroke="#245943" stroke-width="2"/><text x="377" y="205" font-size="27" fill="#173e31" text-anchor="middle" font-weight="bold">Whelks</text><text x="377" y="250" font-size="19" fill="#173e31" text-anchor="middle" font-weight="normal">primary consumer</text><path d="M485 235 L515 235" fill="none" stroke="#245943" stroke-width="4" marker-end="url(#arrow)"/><rect x="520" y="150" width="205" height="190" rx="16" fill="#d1e5bc" stroke="#245943" stroke-width="2"/><text x="622" y="205" font-size="27" fill="#173e31" text-anchor="middle" font-weight="bold">Crabs</text><text x="622" y="250" font-size="19" fill="#173e31" text-anchor="middle" font-weight="normal">secondary consumer</text><path d="M730 235 L760 235" fill="none" stroke="#245943" stroke-width="4" marker-end="url(#arrow)"/><rect x="765" y="150" width="205" height="190" rx="16" fill="#e5f0df" stroke="#245943" stroke-width="2"/><text x="867" y="205" font-size="27" fill="#173e31" text-anchor="middle" font-weight="bold">Seagulls</text><text x="867" y="250" font-size="19" fill="#173e31" text-anchor="middle" font-weight="normal">tertiary consumer</text><text x="622" y="302" font-size="20" fill="#173e31" text-anchor="middle" font-weight="bold">number increases ↑</text><text x="377" y="302" font-size="20" fill="#173e31" text-anchor="middle" font-weight="bold">number decreases ↓</text><path d="M620 365 L385 365" fill="none" stroke="#a54f48" stroke-width="4" marker-end="url(#arrow)"/><text x="500" y="408" font-size="27" fill="#173e31" text-anchor="middle" font-weight="bold">More crabs eat more whelks.</text><rect x="100" y="470" width="800" height="80" rx="16" fill="#e5f0df" stroke="#245943" stroke-width="2"/><text x="500" y="516" font-size="25" fill="#173e31" text-anchor="middle" font-weight="normal">Trace the feeding link from predator to its prey.</text></g></svg>