<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="730" viewBox="0 0 1100 730" role="img" aria-labelledby="q292-title q292-desc">
<title id="q292-title">HIV reduces lymphocytes and active immunity</title>
<desc id="q292-desc">HIV damages helper T lymphocytes. Lymphocyte numbers decrease and immune responses that produce antibodies and memory cells are weakened. This reduces active immunity. Passive immunity involves receiving antibodies from another source and is not the process of making them.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="730" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >HIV reduces lymphocytes and active immunity</text><rect x="300" y="100" width="500" height="110" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="550.0" y="140" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >HIV infection</text><text x="550.0" y="182" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Damages helper T lymphocytes</text><line x1="550" y1="222" x2="550" y2="260" stroke="#25614b" stroke-width="4"/><polygon points="550,260 543.0733123668778,246.69507615831074 556.9266876331222,246.69507615831074" fill="#25614b"/><rect x="230" y="270" width="640" height="110" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="550.0" y="310" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >1: fewer lymphocytes</text><text x="550.0" y="352" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Immune responses become less effective.</text><line x1="550" y1="392" x2="550" y2="430" stroke="#25614b" stroke-width="4"/><polygon points="550,430 543.0733123668778,416.6950761583107 556.9266876331222,416.6950761583107" fill="#25614b"/><rect x="230" y="440" width="640" height="120" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="550.0" y="480" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >2: reduced active immunity</text><text x="550.0" y="522" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Antibody and memory-cell responses weaken.</text><text x="550" y="602" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >3 describes passive immunity: antibodies received from elsewhere.</text><rect x="24" y="654" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="688" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B: statements 1 and 2 only.</text>
</g></svg>