<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">More auxin below makes the shoot bend up</title><desc id="desc">A sideways maize seedling has more auxin on the lower side of the shoot. Longer lower cells bend the growing shoot upwards towards overhead light.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="53" font-size="30" text-anchor="start" font-weight="bold" fill="#173f32">More auxin below makes the shoot bend up</text><circle cx="175" cy="338" r="35" fill="#ddc6a1" stroke="#24644b" stroke-width="3"/><path d="M180 325 C300 320 390 330 490 315 C590 300 640 220 650 145" fill="none" stroke="#24644b" stroke-width="14" /><circle cx="235" cy="332" r="5" fill="#d49750" stroke="#d49750" stroke-width="0"/><circle cx="275" cy="334" r="5" fill="#d49750" stroke="#d49750" stroke-width="0"/><circle cx="320" cy="334" r="5" fill="#d49750" stroke="#d49750" stroke-width="0"/><circle cx="365" cy="334" r="5" fill="#d49750" stroke="#d49750" stroke-width="0"/><circle cx="410" cy="332" r="5" fill="#d49750" stroke="#d49750" stroke-width="0"/><circle cx="455" cy="324" r="5" fill="#d49750" stroke="#d49750" stroke-width="0"/><circle cx="500" cy="311" r="5" fill="#d49750" stroke="#d49750" stroke-width="0"/><circle cx="540" cy="288" r="5" fill="#d49750" stroke="#d49750" stroke-width="0"/><path d="M150 350 C100 380 80 400 70 445" fill="none" stroke="#24644b" stroke-width="3" /><path d="M150 350 C140 380 120 400 110 445" fill="none" stroke="#24644b" stroke-width="3" /><path d="M150 350 C180 380 160 400 150 445" fill="none" stroke="#24644b" stroke-width="3" /><path d="M565 275 Q685 340 710 245 Q625 215 565 275" fill="#e4f0df" stroke="#24644b" stroke-width="3" /><path d="M625 192 Q550 130 590 115 Q650 115 650 160" fill="#e4f0df" stroke="#24644b" stroke-width="3" /><path d="M590 90 L590 135" fill="none" stroke="#d49750" stroke-width="4" marker-end="url(#arrow)"/><path d="M650 90 L650 135" fill="none" stroke="#d49750" stroke-width="4" marker-end="url(#arrow)"/><path d="M710 90 L710 135" fill="none" stroke="#d49750" stroke-width="4" marker-end="url(#arrow)"/><text x="750" y="120" font-size="25" text-anchor="start" font-weight="normal" fill="#173f32">Light</text><path d="M680 390 L540 292" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="710" y="385" font-size="24" text-anchor="start" font-weight="bold" fill="#173f32">Lower side:</text><text x="710" y="418" font-size="24" text-anchor="start" font-weight="normal" fill="#173f32">more auxin</text><path d="M390 210 L435 314" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="190" y="184" font-size="23" text-anchor="start" font-weight="normal" fill="#173f32">Unequal elongation</text><text x="500" y="548" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">Lower cells elongate faster → shoot curves upwards.</text><text x="500" y="581" font-size="21" text-anchor="middle" font-weight="normal" fill="#173f32">In this setup, upwards is towards the light.</text></g></svg>