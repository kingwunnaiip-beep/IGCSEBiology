<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="q247-title q247-desc">
<title id="q247-title">Some solar energy is stored in fossil fuels</title>
<desc id="q247-desc">Qualitative pathway from sunlight through plant photosynthesis to chemical energy in biomass, then to fossil fuels formed from some ancient buried organic matter over millions of years. Energy quantities and fossilisation rates are not supplied. Water uptake by osmosis is passive in the intended answer.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="850" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Some solar energy is stored in fossil fuels</text><text x="500" y="101" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative pathway; no energy quantities shown</text><rect x="170" y="135" width="660" height="100" rx="12" fill="#f9edcf" stroke="#daa958" stroke-width="2"/><text x="500.0" y="173" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Sunlight</text><text x="500.0" y="213" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >light energy from the Sun</text><rect x="170" y="290" width="660" height="100" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="328" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Photosynthesis</text><text x="500.0" y="368" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >plants capture light energy</text><rect x="170" y="445" width="660" height="100" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="483" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Plant biomass</text><text x="500.0" y="523" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >chemical energy in organic substances</text><rect x="170" y="600" width="660" height="100" rx="12" fill="white" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="638" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Fossil fuels</text><text x="500.0" y="678" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >from some ancient buried organic matter</text><line x1="500" y1="248" x2="500" y2="278" stroke="#25614b" stroke-width="4"/><polygon points="500,278 493.07331236687776,264.6950761583107 506.92668763312224,264.6950761583107" fill="#25614b"/><line x1="500" y1="403" x2="500" y2="433" stroke="#25614b" stroke-width="4"/><polygon points="500,433 493.07331236687776,419.6950761583107 506.92668763312224,419.6950761583107" fill="#25614b"/><line x1="500" y1="558" x2="500" y2="588" stroke="#25614b" stroke-width="4"/><polygon points="500,588 493.07331236687776,574.6950761583107 506.92668763312224,574.6950761583107" fill="#25614b"/><text x="500" y="743" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Formation takes millions of years under suitable conditions.</text><rect x="24" y="774" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="808" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C — stored in fossil fuels as chemical energy</text>
