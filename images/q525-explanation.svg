<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-labelledby="q525-title q525-desc"><title id="q525-title">Sundew: stimulus → response</title><desc id="q525-desc">A sundew leaf before contact has upright sticky hairs. After an insect touches it, hairs bend inward. Their changing position is movement; responding to touch is sensitivity. Illustrative, not to scale.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#36785e"/></marker></defs><rect x="0" y="0" width="900" height="510" rx="22" fill="#fbf7e9"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="46" font-size="27" text-anchor="start" fill="#183e35"><tspan x="35" dy="0">Sundew: stimulus → response</tspan></text><text x="220" y="95" font-size="23" text-anchor="middle" fill="#183e35"><tspan x="220" dy="0">Before contact</tspan></text><text x="650" y="95" font-size="23" text-anchor="middle" fill="#183e35"><tspan x="650" dy="0">After contact</tspan></text><path d="M85 315 Q220 375 355 315" stroke="#36785e" stroke-width="9" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M220 346 L220 390" stroke="#36785e" stroke-width="10" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M515 315 Q650 375 785 315" stroke="#36785e" stroke-width="9" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M650 346 L650 390" stroke="#36785e" stroke-width="10" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M105 329 Q95 245 93 211" stroke="#36785e" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="93" cy="211" r="8" fill="#cc9e4b" stroke="#36785e" stroke-width="2"/><path d="M160 329 Q150 245 148 211" stroke="#36785e" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="148" cy="211" r="8" fill="#cc9e4b" stroke="#36785e" stroke-width="2"/>