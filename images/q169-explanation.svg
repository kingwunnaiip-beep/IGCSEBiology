weight="700" text-anchor="middle" >DAUGHTER 2</text><text x="725.0" y="621" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >26 chromosomes</text><text x="725.0" y="657" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >25 arbitrary units of DNA</text><text x="500" y="799" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >DNA mass per daughter = 50 ÷ 2 = 25 arbitrary units</text><rect x="75" y="849" width="850" height="150" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="891" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Mitosis preserves chromosome number</text><text x="500.0" y="933" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Each daughter receives a complete matching set.</text><text x="500.0" y="969" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Chromosome number and DNA mass are different quantities.</text><text x="500" y="1060" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Both daughters together: 25 + 25 = 50 arbitrary DNA units.</text><rect x="24" y="1084" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1118" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · 26 chromosomes · 25 arbitrary DNA units</text>
