<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img" aria-labelledby="q284-title q284-desc">
<title id="q284-title">The same genetic code across kingdoms</title>
<desc id="q284-desc">The RNA codon UUU codes for the amino acid phenylalanine in the standard genetic code. Bacteria and the animal, plant, fungus and protoctist kingdoms use this same codon-to-amino-acid relationship. Shared genetic code does not mean identical DNA sequences.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="800" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >The same genetic code across kingdoms</text><rect x="305" y="100" width="490" height="150" rx="12" fill="#e5f2f9" stroke="#357ca2" stroke-width="2"/><text x="550.0" y="140" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Example from the genetic code</text><text x="550.0" y="182" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >mRNA codon UUU</text><text x="550.0" y="216" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >→ amino acid phenylalanine</text><line x1="550" y1="260" x2="145" y2="355" stroke="#357ca2" stroke-width="3"/><polygon points="145,355 156.37149239760373,345.217916344089 159.53517861283402,358.7052102090182" fill="#357ca2"/><rect x="55" y="365" width="180" height="170" rx="12" fill="#ffffff" stroke="#25614b" stroke-width="2"/><text x="145" y="405" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Bacterium</text><text x="145" y="451" font-size="28" fill="#357ca2" font-weight="700" text-anchor="middle" >UUU</text><text x="145" y="486" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >means</text><text x="145" y="518" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >phenylalanine</text><line x1="550" y1="260" x2="350" y2="355" stroke="#357ca2" stroke-width="3"/><polygon points="350,355 359.04609587196796,343.0347106397228 364.9899809347219,355.54815287709954" fill="#357ca2"/><rect x="260" y="365" width="180" height="170" rx="12" fill="#ffffff" stroke="#25614b" stroke-width="2"/><text x="350" y="405" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Animal</text><text x="350" y="451" font-size="28" fill="#357ca2" font-weight="700" text-anchor="middle" >UUU</text><text x="350" y="486" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >means</text><text x="350" y="518" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >phenylalanine</text><line x1="550" y1="260" x2="550" y2="355" stroke="#357ca2" stroke-width="3"/><polygon points="550,355 543.0733123668778,341.6950761583107 556.9266876331222,341.6950761583107" fill="#357ca2"/><rect x="460" y="365" width="180" height="170" rx="12" fill="#ffffff" stroke="#25614b" stroke-width="2"/><text x="550" y="405" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Plant</text><text x="550" y="451" font-size="28" fill="#357ca2" font-weight="700" text-anchor="middle" >UUU</text><text x="550" y="486" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >means</text><text x="550" y="518" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >phenylalanine</text><line x1="550" y1="260" x2="750" y2="355" stroke="#357ca2" stroke-width="3"/><polygon points="750,355 735.010019065278,355.54815287709954 740.953904128032,343.03471063972273" fill="#357ca2"/><rect x="660" y="365" width="180" height="170" rx="12" fill="#ffffff" stroke="#25614b" stroke-width="2"/><text x="750" y="405" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Fungus</text><text x="750" y="451" font-size="28" fill="#357ca2" font-weight="700" text-anchor="middle" >UUU</text><text x="750" y="486" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >means</text><text x="750" y="518" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >phenylalanine</text><line x1="550" y1="260" x2="955" y2="355" stroke="#357ca2" stroke-width="3"/><polygon points="955,355 940.464821387166,358.70521020901816 943.6285076023963,345.217916344089" fill="#357ca2"/><rect x="865" y="365" width="180" height="170" rx="12" fill="#ffffff" stroke="#25614b" stroke-width="2"/><text x="955" y="405" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Protoctist</text><text x="955" y="451" font-size="28" fill="#357ca2" font-weight="700" text-anchor="middle" >UUU</text><text x="955" y="486" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >means</text><text x="955" y="518" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >phenylalanine</text><text x="550" y="605" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Same genetic code = the same codons specify the same amino acids.</text><text x="550" y="642" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The organisms still have different DNA sequences and different genes.</text><text x="550" y="679" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Bacteria share the code with all four kingdoms listed in the question.</text><rect x="24" y="724" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="758" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Animal, plant, fungus and protoctist are all included.</text>
</g></svg>