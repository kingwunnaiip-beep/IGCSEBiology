<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Percentage increase uses the starting affected area</title><desc id="desc">A scaled bar chart shows 1200 hectares in 1976 and 3000 hectares in 1999. The 1800-hectare gain is marked and divided by the starting 1200 hectares.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">Percentage increase uses the starting affected area</text><path d="M130 450 V150" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M130 450 H590" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="360.0" y="502" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">Year</text><text x="60" y="130" font-size="23" fill="#173f32" text-anchor="start" font-weight="400">Affected area / ha</text><path d="M122 450.0 H585" fill="none" stroke="#bcc8bd" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="457.0" font-size="20" fill="#173f32" text-anchor="end" font-weight="400">0</text><path d="M122 350.0 H585" fill="none" stroke="#bcc8bd" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="357.0" font-size="20" fill="#173f32" text-anchor="end" font-weight="400">1000</text><path d="M122 250.0 H585" fill="none" stroke="#bcc8bd" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="257.0" font-size="20" fill="#173f32" text-anchor="end" font-weight="400">2000</text><path d="M122 150.0 H585" fill="none" stroke="#bcc8bd" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="157.0" font-size="20" fill="#173f32" text-anchor="end" font-weight="400">3000</text><rect x="200" y="330" width="110" height="120" rx="0" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><rect x="420" y="150" width="110" height="300" rx="0" fill="#9dbb9b" stroke="#24644b" stroke-width="3"/><text x="255" y="490" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">1976</text><text x="475" y="490" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">1999</text><text x="255" y="315" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">1200</text><text x="475" y="135" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">3000</text><path d="M620 330 V150" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="650" y="255" font-size="26" fill="#173f32" text-anchor="start" font-weight="700">+1800 ha</text><text x="660" y="355" font-size="25" fill="#173f32" text-anchor="start" font-weight="400">Increase ÷ starting area</text><text x="660" y="395" font-size="25" fill="#173f32" text-anchor="start" font-weight="400">1800 ÷ 1200 × 100</text><text x="660" y="435" font-size="25" fill="#173f32" text-anchor="start" font-weight="400">= 150%</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">C: (3000 − 1200) ÷ 1200 × 100 = 150%</text></g></svg>