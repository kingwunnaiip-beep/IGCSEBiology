<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1220" viewBox="0 0 1000 1220" role="img" aria-labelledby="q153-title q153-desc">
<title id="q153-title">153 · Two heart passages restore blood pressure</title>
<desc id="q153-desc">Answer D. Double circulation follows right heart to lungs to left heart to body to right heart. Oxygenated blood returns to the heart from the lungs and is pumped again, restoring pressure for delivery to body cells. Pulmonary pressure is lower to protect the lung exchange surfaces. The blue pathway goes from the body through the right heart to the lungs; the red pathway goes from the lungs through the left heart to the body. This is a qualitative flow diagram without measured pressures or anatomical proportions.</desc>
