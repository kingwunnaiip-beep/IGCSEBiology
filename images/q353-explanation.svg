<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" role="img" aria-labelledby="q353-title q353-desc">
<title id="q353-title">Mutation can disrupt insulin production</title>
<desc id="q353-desc">A bacterial culture carrying a human insulin gene can produce insulin. A mutation in a relevant gene can change the protein or reduce production. Shared genetic code and plasmids are useful features, not disadvantages.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="740" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Mutation can disrupt insulin production</text><rect x="70" y="120" width="415" height="165" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="277.5" y="160" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Engineered bacteria</text><text x="277.5" y="203" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Human insulin gene</text><text x="277.5" y="243" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Functional production</text><line x1="500" y1="202" x2="598" y2="202" stroke="#25614b" stroke-width="4"/><polygon points="598,202 584.6950761583107,208.92668763312224 584.6950761583107,195.07331236687776" fill="#25614b"/><rect x="615" y="120" width="415" height="165" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="822.5" y="160" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Insulin collected</text><text x="822.5" y="203" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Same genetic code</text><text x="822.5" y="243" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >enables gene expression</text><line x1="276" y1="298" x2="276" y2="348" stroke="#b94a43" stroke-width="4"/><polygon points="276,348 269.07331236687776,334.6950761583107 282.92668763312224,334.6950761583107" fill="#b94a43"/><rect x="70" y="365" width="415" height="165" rx="12" fill="#f8e7df" stroke="#25614b" stroke-width="2"/><text x="277.5" y="405" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >A mutation may occur</text><text x="277.5" y="448" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >DNA base sequence changes</text><text x="277.5" y="488" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >in a relevant gene</text><line x1="500" y1="448" x2="598" y2="448" stroke="#b94a43" stroke-width="4"/><polygon points="598,448 584.6950761583107,454.92668763312224 584.6950761583107,441.07331236687776" fill="#b94a43"/><rect x="615" y="365" width="415" height="165" rx="12" fill="#f8e7df" stroke="#25614b" stroke-width="2"/><text x="822.5" y="405" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Possible consequence</text><text x="822.5" y="448" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Altered protein or</text><text x="822.5" y="488" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >reduced insulin yield</text><text x="550" y="585" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Not every mutation has an effect.</text><text x="550" y="625" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >The possibility of harmful change is the disadvantage.</text><rect x="24" y="664" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="698" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Frequent mutation is the disadvantage listed: D</text>
</g></svg>