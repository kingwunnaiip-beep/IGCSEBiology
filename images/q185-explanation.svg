<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1120" viewBox="0 0 1000 1120" role="img" aria-labelledby="q185-title q185-desc">
<title id="q185-title">185 · Broad crowns grind food</title>
<desc id="q185-desc">Answer D, teeth 3 and 4. Premolars and molars have broad crowns suited to crushing and grinding food. Incisors cut food and canines grip and tear it. Simplified teaching tooth outlines preserve the source numbering but are original qualitative shapes, not measured dental anatomy. Chewing breaks food into smaller pieces without changing the food molecules; its increased total surface area helps enzyme action.</desc>
