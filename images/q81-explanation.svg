<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="q81-title q81-desc">
<title id="q81-title">81 · Osmosis: when does the tissue gain water?</title>
<desc id="q81-desc">A line graph has concentration from 0.1 to 0.5 mol per cubic decimetre and a final-length-to-initial-length ratio axis from 0.8 to 1.2. Approximate ratios are 1.20, 1.05, 1.00, 0.95 and 0.925. The first two concentrations cause a net water gain and increased length. A ratio of one means no net water movement, although water molecules continue moving in both directions.</desc>
