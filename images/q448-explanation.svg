<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Increase the gradient into root hair cells</title><desc id="desc">Soil water with higher water potential is separated from a lower-water-potential root hair cell by a partially permeable membrane. A labelled arrow shows net water entry. Lowering root-cell water potential further increases the inward gradient.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="40" y="54" font-size="31" fill="#173f32" text-anchor="start" font-weight="bold">Increase the gradient into root hair cells</text><rect x="42" y="118" width="414" height="330" rx="18" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><rect x="544" y="118" width="414" height="330" rx="18" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><text x="249" y="167" font-size="29" fill="#173f32" text-anchor="middle" font-weight="bold">Soil water</text><text x="751" y="167" font-size="29" fill="#173f32" text-anchor="middle" font-weight="bold">Root hair cell</text><text x="249" y="217" font-size="24" fill="#173f32" text-anchor="middle" font-weight="normal">Higher water potential</text><text x="751" y="217" font-size="24" fill="#173f32" text-anchor="middle" font-weight="normal">Lower water potential</text><path d="M544,246 L544,418" fill="none" stroke="#24644b" stroke-width="8" /><path d="M285,306 L712,306" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="500" y="277" font-size="23" fill="#173f32" text-anchor="middle" font-weight="normal">net water movement</text><text x="249" y="400" font-size="24" fill="#173f32" text-anchor="middle" font-weight="normal">Water enters by osmosis</text><text x="751" y="400" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">Partially permeable membrane</text><rect x="45" y="480" width="910" height="83" rx="18" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><text x="500" y="516" font-size="26" fill="#173f32" text-anchor="middle" font-weight="bold">Lower the root-cell water potential further</text><text x="500" y="548" font-size="24" fill="#173f32" text-anchor="middle" font-weight="normal">→ increase the inward water-potential difference</text></g></svg>