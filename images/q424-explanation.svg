<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">The upstream site has not received this sewage</title><desc id="desc">A straight river schematic flows left to right. A is before the raw sewage input; B, C and D are downstream and receive the discharge. Since bloodworms tolerate heavily polluted water, the clean upstream site A is expected to have the fewest. Shading is qualitative and does not give measured concentrations.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#327153"/></marker></defs><rect width="960" height="540" rx="24" fill="#faf9ef"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="49" text-anchor="start" fill="#163d31" font-size="30" font-weight="bold">The upstream site has not received this sewage</text><text x="36" y="87" text-anchor="start" fill="#163d31" font-size="23" font-weight="normal">Use the flow direction before applying pollution tolerance.</text><rect x="39" y="213" width="882" height="154" rx="25" fill="#deece6" stroke="#7ba591" stroke-width="2"/><path d="M74 287 L883 287" fill="none" stroke="#327153" stroke-width="5"/><path d="M873 280 L883 287 L873 294" fill="none" stroke="#327153" stroke-width="5"/><text x="479" y="401" text-anchor="middle" fill="#163d31" font-size="25" font-weight="bold">Flow: upstream → downstream</text><text x="311" y="147" text-anchor="middle" fill="#163d31" font-size="24" font-weight="normal">raw sewage input</text><path d="M312 164 L312 207" fill="none" stroke="#327153" stroke-width="4" marker-end="url(#arr)"/><circle cx="157" cy="286" r="31" fill="#faf9ef" stroke="#327153" stroke-width="3"/><text x="157" y="295" text-anchor="middle" fill="#163d31" font-size="27" font-weight="bold">A</text><circle cx="399" cy="286" r="31" fill="#d8cdb1" stroke="#327153" stroke-width="3"/><text x="399" y="295" text-anchor="middle" fill="#163d31" font-size="27" font-weight="bold">B</text><circle cx="603" cy="286" r="31" fill="#d8cdb1" stroke="#327153" stroke-width="3"/><text x="603" y="295" text-anchor="middle" fill="#163d31" font-size="27" font-weight="bold">C</text><circle cx="807" cy="286" r="31" fill="#d8cdb1" stroke="#327153" stroke-width="3"/><text x="807" y="295" text-anchor="middle" fill="#163d31" font-size="27" font-weight="bold">D</text><path d="M319 214 L319 367" fill="none" stroke="#a75c48" stroke-width="3"/><text x="157" y="192" text-anchor="middle" fill="#163d31" font-size="21" font-weight="normal">before discharge</text><text x="611" y="192" text-anchor="middle" fill="#163d31" font-size="21" font-weight="normal">receives the discharge</text><rect x="90" y="434" width="780" height="45" rx="18" fill="#e1eddf" stroke="#327153" stroke-width="2"/><text x="480" y="465" text-anchor="middle" fill="#163d31" font-size="25" font-weight="bold">Cleaner A → fewest pollution-tolerant bloodworms</text><text x="36" y="517" text-anchor="start" fill="#587064" font-size="17" font-weight="normal">Original teaching schematic • not to scale</text></g></svg>