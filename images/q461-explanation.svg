<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="q461-t q461-d"><title id="q461-t">One glucose gives two ethanol molecules</title><desc id="q461-d">Six glucose carbon atoms are divided into two ethanol molecules with two carbon atoms each and two carbon dioxide molecules with one carbon each. This conserves six carbons.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#1d513d"/></marker></defs><rect width="1000" height="620" rx="24" fill="#fffdf3"/><g font-family="Arial, sans-serif"><text x="45" y="58" font-size="30" text-anchor="start" fill="#173e32" font-weight="bold">One glucose gives two ethanol molecules</text><rect x="40" y="100" width="260" height="95" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="170.0" y="142" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">1 glucose molecule</text><text x="170.0" y="177" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">6 carbon atoms</text><path d="M320 150 L385 150" stroke="#1d513d" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="410" y="100" width="550" height="95" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="685.0" y="142" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">2 ethanol molecules + 2 carbon dioxide molecules</text><circle cx="105" cy="265" r="19" fill="#e6c776" stroke="#1d513d" stroke-width="2"/><circle cx="160" cy="265" r="19" fill="#e6c776" stroke="#1d513d" stroke-width="2"/><circle cx="215" cy="265" r="19" fill="#e6c776" stroke="#1d513d" stroke-width="2"/><circle cx="105" cy="325" r="19" fill="#e6c776" stroke="#1d513d" stroke-width="2"/><circle cx="160" cy="325" r="19" fill="#e6c776" stroke="#1d513d" stroke-width="2"/><circle cx="215" cy="325" r="19" fill="#e6c776" stroke="#1d513d" stroke-width="2"/><text x="160" y="370" font-size="25" text-anchor="middle" fill="#173e32" font-weight="normal">Glucose: 6 C</text><path d="M290 295 L390 295" stroke="#1d513d" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="410" y="225" width="145" height="145" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><circle cx="455" cy="270" r="19" fill="#e6c776" stroke="#1d513d" stroke-width="2"/><circle cx="505" cy="270" r="19" fill="#e6c776" stroke="#1d513d" stroke-width="2"/><text x="482" y="323" font-size="22" text-anchor="middle" fill="#173e32" font-weight="normal">ethanol</text><text x="482" y="353" font-size="22" text-anchor="middle" fill="#173e32" font-weight="normal">2 C</text><rect x="590" y="225" width="145" height="145" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><circle cx="635" cy="270" r="19" fill="#e6c776" stroke="#1d513d" stroke-width="2"/><circle cx="685" cy="270" r="19" fill="#e6c776" stroke="#1d513d" stroke-width="2"/><text x="662" y="323" font-size="22" text-anchor="middle" fill="#173e32" font-weight="normal">ethanol</text><text x="662" y="353" font-size="22" text-anchor="middle" fill="#173e32" font-weight="normal">2 C</text><circle cx="850" cy="260" r="19" fill="#e6c776" stroke="#1d513d" stroke-width="2"/><text x="885" y="267" font-size="24" text-anchor="start" fill="#173e32" font-weight="normal">CO₂</text><circle cx="850" cy="335" r="19" fill="#e6c776" stroke="#1d513d" stroke-width="2"/><text x="885" y="342" font-size="24" text-anchor="start" fill="#173e32" font-weight="normal">CO₂</text><text x="500" y="439" font-size="28" text-anchor="middle" fill="#173e32" font-weight="normal">Carbon check: 6 = (2 × 2) + (2 × 1)</text><text x="500" y="486" font-size="28" text-anchor="middle" fill="#173e32" font-weight="normal">Molecule count: 2 ethanol, not 4 or 6</text><text x="500" y="545" font-size="28" text-anchor="middle" fill="#173e32" font-weight="bold">C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂</text><text x="45" y="589" font-size="18" text-anchor="start" fill="#546d5e" font-weight="normal">Original teaching schematic • qualitative unless values are stated</text></g></svg>