<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Sequence and shape give molecules specificity</title><desc id="desc">Three visual models: a Y-shaped antibody binds an antigen at a complementary binding site; a DNA ladder stores information in base order; an enzyme binds a matching substrate at its active site.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2e7656"/></marker></defs><rect width="1000" height="620" rx="24" fill="#fbf9ec"/><g font-family="sans-serif" fill="#173e32"><text x="42" y="55" font-size="31" text-anchor="start" fill="#173e32">Sequence and shape give molecules specificity</text><rect x="35" y="100" width="290" height="430" rx="18" fill="#e4efdf" stroke="#548269" stroke-width="2"/><rect x="355" y="100" width="290" height="430" rx="18" fill="#e4efdf" stroke="#548269" stroke-width="2"/><rect x="675" y="100" width="290" height="430" rx="18" fill="#e4efdf" stroke="#548269" stroke-width="2"/><text x="180" y="145" font-size="26" text-anchor="middle" fill="#173e32">Antibody</text><text x="500" y="145" font-size="26" text-anchor="middle" fill="#173e32">DNA</text><text x="820" y="145" font-size="26" text-anchor="middle" fill="#173e32">Enzyme</text><path d="M180 350V270L130 220 M180 270L230 220" stroke="#2e7656" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M112 195L130 177L148 195L130 213Z" fill="#c8a454" stroke="#795f27" stroke-width="2"/><path d="M130 157 L130 173" fill="none" stroke="#2e7656" stroke-width="5" marker-end="url(#arrow)"/><text x="180" y="420" font-size="22" text-anchor="middle" fill="#173e32">Complementary</text><text x="180" y="453" font-size="22" text-anchor="middle" fill="#173e32">binding site</text><text x="180" y="498" font-size="20" text-anchor="middle" fill="#173e32">Recognises antigen</text><path d="M440 205H560" stroke="#8baa79" stroke-width="4"/><text x="500" y="212" font-size="24" text-anchor="middle" fill="#173e32">A—T</text><path d="M440 250H560" stroke="#8baa79" stroke-width="4"/><text x="500" y="257" font-size="24" text-anchor="middle" fill="#173e32">G—C</text><path d="M440 295H560" stroke="#8baa79" stroke-width="4"/><text x="500" y="302" font-size="24" text-anchor="middle" fill="#173e32">T—A</text><path d="M440 340H560" stroke="#8baa79" stroke-width="4"/><text x="500" y="347" font-size="24" text-anchor="middle" fill="#173e32">C—G</text><path d="M430 185V370 M570 185V370" stroke="#2e7656" stroke-width="7"/><text x="500" y="420" font-size="22" text-anchor="middle" fill="#173e32">Order of bases</text><text x="500" y="453" font-size="22" text-anchor="middle" fill="#173e32">stores information</text><text x="500" y="498" font-size="20" text-anchor="middle" fill="#173e32">Specifies a sequence</text><path d="M725 270 C710 370 740 390 820 390 C900 390 930 370 915 270 L860 270 L860 320 L780 320 L780 270Z" fill="#8dbd75" stroke="#2e7656" stroke-width="4"/><rect x="780" y="195" width="80" height="55" rx="4" fill="#c8a454" stroke="#795f27" stroke-width="3"/><path d="M820 255 L820 306" fill="none" stroke="#2e7656" stroke-width="5" marker-end="url(#arrow)"/><text x="820" y="420" font-size="22" text-anchor="middle" fill="#173e32">Complementary</text><text x="820" y="453" font-size="22" text-anchor="middle" fill="#173e32">active site</text><text x="820" y="498" font-size="20" text-anchor="middle" fill="#173e32">Binds substrate</text><text x="500" y="586" font-size="21" text-anchor="middle" fill="#173e32">Models of specific recognition and genetic information; not molecular scale.</text></g></svg>