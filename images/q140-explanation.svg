or="start" >feeding relationships between organisms</text><text x="500" y="1269" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Named reef organisms are examples; no species counts are implied.</text><rect x="24" y="1314" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1348" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer B · Ecosystem</text>
