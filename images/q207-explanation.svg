 stroke="#25614b" stroke-width="2"/><text x="267.5" y="741" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Reproduction</text><text x="267.5" y="784" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Traits can be inherited.</text><rect x="520" y="164" width="425" height="682" rx="12" fill="#edf5f8" stroke="none" stroke-width="2"/><text x="732" y="215" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >NATURAL SELECTION</text><rect x="545" y="252" width="375" height="127" rx="12" fill="#fffdf7" stroke="#357ca2" stroke-width="2"/><text x="732.5" y="292" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Inherited variation</text><text x="732.5" y="335" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Individuals have</text><text x="732.5" y="371" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >different traits.</text><line x1="732" y1="399" x2="732" y2="442" stroke="#357ca2" stroke-width="5"/><polygon points="732,442 725.0733123668778,428.6950761583107 738.9266876331222,428.6950761583107" fill="#357ca2"/><rect x="545" y="461" width="375" height="158" rx="12" fill="#fffdf7" stroke="#357ca2" stroke-width="2"/><text x="732.5" y="501" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Environment selects</text><text x="732.5" y="544" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Pressures include</text><text x="732.5" y="580" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >resource competition.</text><line x1="732" y1="639" x2="732" y2="682" stroke="#357ca2" stroke-width="5"/><polygon points="732,682 725.0733123668778,668.6950761583107 738.9266876331222,668.6950761583107" fill="#357ca2"/><rect x="545" y="701" width="375" height="117" rx="12" fill="#fffdf7" stroke="#357ca2" stroke-width="2"/><text x="732.5" y="741" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Reproduction</text><text x="732.5" y="784" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Traits can be inherited.</text><rect x="65" y="891" width="870" height="143" rx="12" fill="#f4efdf" stroke="#daa958" stroke-width="2"/><text x="500.0" y="931" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >A, B and D are shared properties</text><text x="500.0" y="974" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Both can change characteristics, use genetic variation</text><text x="500.0" y="1010" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >and operate over many generations.</text><text x="500" y="1088" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >C describes human choice as the selecting mechanism.</text><text x="500" y="1128" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Farm organisms can still compete; that is not the selection rule.</text><text x="500" y="1174" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative comparison; no rate of evolutionary change is implied.</text><rect x="24" y="1184" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1218" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · Artificial selection does not rely on resource competition</text>
</g></svg>