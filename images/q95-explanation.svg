<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400" role="img" aria-labelledby="q95-title q95-desc">
<title id="q95-title">95 · A pollen tube grows through the style</title>
<desc id="q95-desc">Answer D: style. This schematic longitudinal section of a flower’s carpel shows a pollen grain on the stigma, a pollen tube growing through the style, and an ovule inside the ovary. The pollen tube carries a male nucleus towards the egg cell in the ovule. Fertilisation is fusion of the male nucleus and egg-cell nucleus inside the ovule. The style is the narrow part between stigma and ovary; it is not the ovary. The ovule contains the egg cell; it is not itself an egg cell. After fertilisation, the ovule develops into a seed and the ovary develops into a fruit. The drawing is schematic and not to scale.</desc>
