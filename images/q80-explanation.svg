<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1040" viewBox="0 0 960 1040" role="img" aria-labelledby="q80-title q80-desc">
<title id="q80-title">Which cells make antibodies?</title>
<desc id="q80-desc">Answer D. Most body cells share essentially the same genes but express different sets of genes. Gene expression involves transcription of DNA into mRNA and translation of mRNA into protein. In this question the antibody gene is expressed in B lymphocytes. Activated B cells develop into plasma cells, which secrete antibodies. The diagram does not suggest that T lymphocytes secrete antibodies. Antibody gene DNA rearrangement is beyond the required IGCSE explanation.</desc>
