 fill="#173d31" font-weight="700" text-anchor="middle" >Breathing rate increases</text><text x="290.0" y="433" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Signals to breathing muscles</text><line x1="290" y1="490" x2="290" y2="560" stroke="#357ca2" stroke-width="5"/><polygon points="290,560 283.07331236687776,546.6950761583107 296.92668763312224,546.6950761583107" fill="#357ca2"/><rect x="70" y="580" width="980" height="95" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="560.0" y="622" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >More CO₂ is removed through the lungs.</text><rect x="24" y="724" width="1072" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="560.0" y="758" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >A — carbon dioxide increases; brain</text>
