<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">P marks the exponential (log) phase</title><desc id="desc">A population-time graph rises slowly for most of two thousand years then steeply; P points to the accelerating increase.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="bluearrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="45" font-size="28" fill="#173f32" text-anchor="start" font-weight="bold">P marks the exponential (log) phase</text><text x="500" y="555" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">A steep, accelerating increase is the exponential or log phase.</text><path d="M145 470 L890 470" fill="none" stroke="#173f32" stroke-width="3" marker-end="url(#arrow)" /><path d="M145 470 L145 125" fill="none" stroke="#173f32" stroke-width="3" marker-end="url(#arrow)" /><text x="55" y="112" font-size="22" fill="#173f32" text-anchor="start" font-weight="normal">Population / million</text><text x="750" y="513" font-size="23" fill="#173f32" text-anchor="start" font-weight="normal">Year</text><path d="M137 470.0 L145 470.0" fill="none" stroke="#173f32" stroke-width="2" /><text x="122" y="477.0" font-size="20" fill="#173f32" text-anchor="end" font-weight="normal">0</text><path d="M137 370.0 L145 370.0" fill="none" stroke="#173f32" stroke-width="2" /><text x="122" y="377.0" font-size="20" fill="#173f32" text-anchor="end" font-weight="normal">2000</text><path d="M137 270.0 L145 270.0" fill="none" stroke="#173f32" stroke-width="2" /><text x="122" y="277.0" font-size="20" fill="#173f32" text-anchor="end" font-weight="normal">4000</text><path d="M137 170.0 L145 170.0" fill="none" stroke="#173f32" stroke-width="2" /><text x="122" y="177.0" font-size="20" fill="#173f32" text-anchor="end" font-weight="normal">6000</text><path d="M145.0 470 L145.0 478" fill="none" stroke="#173f32" stroke-width="2" /><text x="145.0" y="505" font-size="20" fill="#173f32" text-anchor="middle" font-weight="normal">0</text><path d="M490.0 470 L490.0 478" fill="none" stroke="#173f32" stroke-width="2" /><text x="490.0" y="505" font-size="20" fill="#173f32" text-anchor="middle" font-weight="normal">1000</text><path d="M835.0 470 L835.0 478" fill="none" stroke="#173f32" stroke-width="2" /><text x="835.0" y="505" font-size="20" fill="#173f32" text-anchor="middle" font-weight="normal">2000</text><path d="M145 457 C300 465 450 460 555 447 S700 438 750 390 S810 280 835 150" fill="none" stroke="#24644b" stroke-width="6" /><text x="590" y="190" font-size="28" fill="#173f32" text-anchor="start" font-weight="bold">Exponential / log</text><text x="890" y="320" font-size="30" fill="#173f32" text-anchor="start" font-weight="bold">P</text><path d="M875 307 L811 307" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)" /></g></svg>