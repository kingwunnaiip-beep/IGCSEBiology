<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-labelledby="q324-title q324-desc">
<title id="q324-title">One organism feeds at more than one trophic level</title>
<desc id="q324-desc">Two pathways in the given web share pondweed and mayfly nymph. Pondweed to mayfly nymph to brown trout makes trout a secondary consumer. Adding dragonfly nymph before brown trout makes trout a tertiary consumer. All other consumers feed at just one level, so only the brown trout qualifies.</desc>
