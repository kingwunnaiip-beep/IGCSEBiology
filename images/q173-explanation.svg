<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1040" viewBox="0 0 1000 1040" role="img" aria-labelledby="q173-title q173-desc">
<title id="q173-title">173 · Blood screening can reduce HIV transmission</title>
<desc id="q173-desc">The source table records 8800 new HIV infections in 1990 and 830 in 2021 in one country. Screening donated blood for pathogens can prevent infected donations from being used in transfusions, so its introduction could contribute to the decline. Two source totals do not prove that screening caused the change. Bars represent the original counts and do not depict an intermediate trend. AnswerC.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
