<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Yeast respiration produces gas</title><desc id="desc">Yeast uses sugar in respiration, releasing energy and carbon dioxide gas that forms bubbles. In anaerobic conditions glucose becomes ethanol and carbon dioxide.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#24543e"/></marker></defs><rect width="900" height="540" fill="#fbf8ed"/><g font-family="Arial, sans-serif"><text x="450" y="45" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#203e30">Yeast respiration produces gas</text><rect x="55" y="95" width="220" height="190" rx="14" fill="#e6efdc" stroke="#24543e" stroke-width="2"/><text x="165" y="135" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#203e30">Sugar + yeast</text><circle cx="135" cy="200" r="20" fill="#b9d8ae" stroke="#24543e" stroke-width="2"/><circle cx="190" cy="225" r="25" fill="#b9d8ae" stroke="#24543e" stroke-width="2"/><text x="165" y="265" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#203e30">respiring cells</text><line x1="290" y1="190" x2="391.0" y2="190.0" stroke="#24543e" stroke-width="3"/><polygon points="405,190 391.0,196.0 391.0,184.0" fill="#24543e"/><rect x="425" y="95" width="415" height="190" rx="14" fill="#e6efdc" stroke="#24543e" stroke-width="2"/><text x="632" y="138" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#203e30">Energy released</text><text x="632" y="177" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#203e30">Carbon dioxide gas produced</text><circle cx="500" cy="220" r="10" fill="#a6d8df" stroke="#24543e" stroke-width="2"/><circle cx="540" cy="245" r="14" fill="#a6d8df" stroke="#24543e" stroke-width="2"/><circle cx="580" cy="216" r="9" fill="#a6d8df" stroke="#24543e" stroke-width="2"/><circle cx="625" cy="240" r="18" fill="#a6d8df" stroke="#24543e" stroke-width="2"/><circle cx="680" cy="219" r="12" fill="#a6d8df" stroke="#24543e" stroke-width="2"/><circle cx="740" cy="245" r="15" fill="#a6d8df" stroke="#24543e" stroke-width="2"/><circle cx="790" cy="215" r="9" fill="#a6d8df" stroke="#24543e" stroke-width="2"/><text x="450" y="345" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#203e30">Anaerobic respiration in yeast</text><text x="450" y="390" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#203e30">glucose → ethanol + carbon dioxide</text><text x="450" y="448" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#203e30">Bubbles reveal gas production;</text><text x="450" y="480" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#203e30">they do not count cells or measure growth.</text></g></svg>