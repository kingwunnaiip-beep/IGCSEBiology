<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="q281-title q281-desc">
<title id="q281-title">Conserving plants can preserve medicines</title>
<desc id="q281-desc">A conservation pathway connects protecting plant species and habitats to preserving plant chemical diversity, researching useful compounds, and obtaining medicines. A separate comparison states that photosynthesis uses carbon dioxide and releases oxygen, while respiration uses oxygen and releases carbon dioxide, explaining why the gas-exchange distractors are incorrect.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="760" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Conserving plants can preserve medicines</text><rect x="50" y="125" width="290" height="170" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="195.0" y="165" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Conserve species</text><text x="195.0" y="207" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Protect plants</text><text x="195.0" y="241" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >and their habitats.</text><rect x="405" y="125" width="290" height="170" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="550.0" y="165" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Retain compounds</text><text x="550.0" y="207" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Different plants make</text><text x="550.0" y="241" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >different chemicals.</text><rect x="760" y="125" width="290" height="170" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="905.0" y="165" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Medicine research</text><text x="905.0" y="207" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Some compounds can</text><text x="905.0" y="241" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >provide useful drugs.</text><line x1="348" y1="210" x2="397" y2="210" stroke="#25614b" stroke-width="4"/><polygon points="397,210 383.6950761583107,216.92668763312224 383.6950761583107,203.07331236687776" fill="#25614b"/><line x1="703" y1="210" x2="752" y2="210" stroke="#25614b" stroke-width="4"/><polygon points="752,210 738.6950761583107,216.92668763312224 738.6950761583107,203.07331236687776" fill="#25614b"/><rect x="95" y="375" width="910" height="210" rx="12" fill="#ffffff" stroke="#b8c9c0" stroke-width="2"/><text x="550" y="421" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Check the gas-exchange distractors</text><text x="550" y="470" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Photosynthesis uses carbon dioxide and releases oxygen.</text><text x="550" y="515" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Plant respiration uses oxygen and releases carbon dioxide.</text><text x="550" y="560" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >These gas directions do not explain the medicinal value.</text><text x="550" y="655" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Protecting species retains biological resources for present and future use.</text><rect x="24" y="684" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="718" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >One reason for plant conservation is obtaining medicinal drugs.</text>
</g></svg>