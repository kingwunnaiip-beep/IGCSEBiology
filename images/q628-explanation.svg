<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Why can a gap in the ventricular septum cause earlier breathlessness?</title><desc id="desc">In the examination model, a gap in the septum permits mixing between oxygenated left-ventricular blood and deoxygenated right-ventricular blood. The two blood sources both connect to the gap; oxygenated blood is not converted into normal right-ventricular blood.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e" /></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8" /><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Why can a gap in the ventricular septum cause earlier</text><text x="38" y="73" font-size="24" font-weight="700">breathlessness?</text><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><circle cx="60" cy="160" r="16" fill="#285d4c" /><text x="60" y="166" font-size="18" font-weight="400" fill="white" text-anchor="middle">1</text><text x="50" y="207" font-size="23" font-weight="700">Normal left ventricle</text><text x="50" y="285" font-size="21" font-weight="400">Oxygenated blood</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><circle cx="415" cy="160" r="16" fill="#285d4c" /><text x="415" y="166" font-size="18" font-weight="400" fill="white" text-anchor="middle">2</text><text x="405" y="207" font-size="23" font-weight="700">Gap in ventricular</text><text x="405" y="234" font-size="23" font-weight="700">septum</text><text x="405" y="285" font-size="21" font-weight="400">Permits blood to mix</text><text x="405" y="312" font-size="21" font-weight="400">between ventricles</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><circle cx="770" cy="160" r="16" fill="#285d4c" /><text x="770" y="166" font-size="18" font-weight="400" fill="white" text-anchor="middle">3</text><text x="760" y="207" font-size="23" font-weight="700">Normal right ventricle</text><text x="760" y="285" font-size="21" font-weight="400">Deoxygenated blood</text><path d="M345 245 H376" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)" /><path d="M735 245 H704" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)" /></g></svg>