<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Count both blood groups that match a parent</title><desc id="desc">A Punnett square for A/O and B/O parents gives AB, B, A and O with equal probability. A and B each match one parent, so the combined probability is two out of four, or one half.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#397857"/></marker></defs><rect width="900" height="520" rx="22" fill="#fbfaee"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="28" text-anchor="start" fill="#183e31" font-weight="bold">Count both blood groups that match a parent</text><text x="450" y="99" font-size="24" text-anchor="middle" fill="#183e31" font-weight="bold">Father: A/O × Mother: B/O</text><rect x="255" y="139" width="130" height="70" rx="18" fill="#e5f0dd" stroke="#4c7957" stroke-width="2"/><rect x="385" y="139" width="180" height="70" rx="18" fill="#e5f0dd" stroke="#4c7957" stroke-width="2"/><rect x="565" y="139" width="180" height="70" rx="18" fill="#e5f0dd" stroke="#4c7957" stroke-width="2"/><rect x="255" y="209" width="130" height="105" rx="18" fill="#e5f0dd" stroke="#4c7957" stroke-width="2"/><rect x="255" y="314" width="130" height="105" rx="18" fill="#e5f0dd" stroke="#4c7957" stroke-width="2"/><text x="475" y="184" font-size="26" text-anchor="middle" fill="#183e31" font-weight="bold">A</text><text x="655" y="184" font-size="26" text-anchor="middle" fill="#183e31" font-weight="bold">O</text><text x="320" y="271" font-size="26" text-anchor="middle" fill="#183e31" font-weight="bold">B</text><text x="320" y="376" font-size="26" text-anchor="middle" fill="#183e31" font-weight="bold">O</text><rect x="385" y="209" width="180" height="105" rx="18" fill="#f4e6c6" stroke="#4c7957" stroke-width="2"/><text x="475" y="271" font-size="30" text-anchor="middle" fill="#183e31" font-weight="bold">AB</text><rect x="565" y="209" width="180" height="105" rx="18" fill="#cce3b8" stroke="#4c7957" stroke-width="2"/><text x="655" y="271" font-size="30" text-anchor="middle" fill="#183e31" font-weight="bold">B ✓</text><rect x="385" y="314" width="180" height="105" rx="18" fill="#cce3b8" stroke="#4c7957" stroke-width="2"/><text x="475" y="376" font-size="30" text-anchor="middle" fill="#183e31" font-weight="bold">A ✓</text><rect x="565" y="314" width="180" height="105" rx="18" fill="#f4e6c6" stroke="#4c7957" stroke-width="2"/><text x="655" y="376" font-size="30" text-anchor="middle" fill="#183e31" font-weight="bold">O</text><text x="450" y="469" font-size="25" text-anchor="middle" fill="#183e31" font-weight="bold">A or B matches a parent: 2 of 4 = 1 in 2</text><text x="70" y="185" font-size="20" text-anchor="start" fill="#183e31" font-weight="normal">Mother’s</text><text x="70" y="215" font-size="20" text-anchor="start" fill="#183e31" font-weight="normal">gametes</text></g></svg>