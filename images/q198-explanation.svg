<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1160" viewBox="0 0 1000 1160" role="img" aria-labelledby="q198-title q198-desc">
<title id="q198-title">198 · The diaphragm moves air; cilia move mucus</title>
<desc id="q198-desc">Answer A. A qualitative breathing panel shows a domed resting diaphragm as a dashed line and a flatter contracted diaphragm as a solid line, with an arrow down. Contraction increases thorax volume, lowers pressure and draws air in. A separate airway panel shows cilia projecting from the cell surface into mucus, with a horizontal arrow indicating movement toward the throat. Mucus traps particles and goblet cells make mucus; cilia sweep it. Shapes and movements are schematic, with no scale or speed.</desc>
