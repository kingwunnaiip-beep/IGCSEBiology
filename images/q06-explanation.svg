<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="q06-title q06-desc">
<title id="q06-title">Magnification: use the same units</title>
<desc id="q06-desc">A drawing measures 7 centimetres at magnification times 500. Seven centimetres equals 70000 micrometres. Actual size equals image size divided by magnification: 70000 divided by 500 equals 140 micrometres. The two cell drawings are schematic, not to scale.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="800" height="600" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="400.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Magnification: use the same units</text><rect x="60" y="125" width="270" height="175" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="5"/><ellipse cx="195" cy="210" rx="95" ry="52" fill="#dceef4" stroke="#357ca2" stroke-width="3"/><circle cx="95" cy="180" r="15" fill="#25614b" stroke="#25614b" stroke-width="3"/><line x1="60" y1="330" x2="330" y2="330" stroke="#25614b" stroke-width="2"/><line x1="60" y1="316" x2="60" y2="344" stroke="#25614b" stroke-width="2"/><line x1="330" y1="316" x2="330" y2="344" stroke="#25614b" stroke-width="2"/><text x="195" y="381" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Drawing: 7 cm</text><line x1="370" y1="215" x2="475" y2="215" stroke="#25614b" stroke-width="4"/><polygon points="475,215 461.6950761583107,221.92668763312224 461.6950761583107,208.07331236687776" fill="#25614b"/><text x="420" y="178" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >÷ 500</text><rect x="520" y="165" width="185" height="110" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="4"/><circle cx="550" cy="193" r="10" fill="#25614b" stroke="#25614b" stroke-width="3"/><text x="612" y="332" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Actual size</text><text x="612" y="371" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >140 µm</text><text x="400" y="447" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >7 cm = 70,000 µm</text><text x="400" y="490" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Actual size = 70,000 ÷ 500</text><rect x="24" y="524" width="752" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="400.0" y="558" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >A — 140 µm (drawings not to scale)</text>
</g></svg>