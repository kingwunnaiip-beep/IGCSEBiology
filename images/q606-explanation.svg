<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Lizard and parrot share the closer branch</title><desc id="desc">A classification tree splits animals into arthropods and vertebrates. Lizard and parrot share the vertebrate branch, unlike all the other listed arthropod–vertebrate pairs.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="53" font-size="31" text-anchor="start" font-weight="bold" fill="#173f32">Lizard and parrot share the closer branch</text><text x="500" y="110" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">Animals</text><path d="M500 125 V175 H250 V220" fill="none" stroke="#24644b" stroke-width="3"/><path d="M500 175 H750 V220" fill="none" stroke="#24644b" stroke-width="3"/><text x="250" y="252" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">Arthropods</text><text x="750" y="252" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">Vertebrates</text><path d="M750 270 V300 H655 V320" fill="none" stroke="#24644b" stroke-width="3"/><path d="M750 300 H850 V320" fill="none" stroke="#24644b" stroke-width="3"/><circle cx="130" cy="350" r="15" fill="#b3bd91" stroke="#24644b" stroke-width="2"/><path d="M130 340 L120 320" fill="none" stroke="#24644b" stroke-width="2"/><path d="M130 360 L120 385" fill="none" stroke="#24644b" stroke-width="2"/><circle cx="150" cy="350" r="15" fill="#b3bd91" stroke="#24644b" stroke-