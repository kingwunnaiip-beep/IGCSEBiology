<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="q459-t q459-d"><title id="q459-t">The heart separates the two circuits</title><desc id="q459-d">A circulation loop follows body tissues to right heart, then lungs, then left heart, then back to body tissues. The heart is encountered between the two exchange sites.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#1d513d"/></marker></defs><rect width="1000" height="620" rx="24" fill="#fffdf3"/><g font-family="Arial, sans-serif"><text x="45" y="58" font-size="30" text-anchor="start" fill="#173e32" font-weight="bold">The heart separates the two circuits</text><rect x="355" y="115" width="290" height="85" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="500.0" y="157" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">LUNGS</text><rect x="70" y="280" width="260" height="100" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="200.0" y="322" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">RIGHT HEART</text><rect x="670" y="280" width="260" height="100" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="800.0" y="322" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">LEFT HEART</text><rect x="355" y="460" width="290" height="85" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="500.0" y="502" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">BODY TISSUES</text><path d="M330 305 L410 205" stroke="#1d513d" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M645 180 L715 275" stroke="#1d513d" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M790 390 L650 480" stroke="#1d513d" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M350 500 L210 390" stroke="#1d513d" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="90" y="200" font-size="22" text-anchor="start" fill="#173e32" font-weight="normal">To lungs:</text><text x="90" y="230" font-size="22" text-anchor="start" fill="#173e32" font-weight="normal">less oxygen</text><text x="745" y="200" font-size="22" text-anchor="start" fill="#173e32" font-weight="normal">From lungs:</text><text x="745" y="230" font-size="22" text-anchor="start" fill="#173e32" font-weight="normal">more oxygen</text><text x="500" y="330" font-size="22" text-anchor="middle" fill="#173e32" font-weight="normal">Body → heart → lungs → heart</text><text x="500" y="364" font-size="22" text-anchor="middle" fill="#173e32" font-weight="normal">Then heart → body again</text><text x="45" y="589" font-size="18" text-anchor="start" fill="#546d5e" font-weight="normal">Original teaching schematic • qualitative unless values are stated</text></g></svg>