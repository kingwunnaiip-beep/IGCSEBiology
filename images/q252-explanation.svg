 y="120" width="620" height="100" rx="14" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="352" y="154" font-size="25" fill="#173d31" font-weight="700" text-anchor="start" >Upstream of the outlet</text><text x="352" y="189" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >mayfly nymph • stonefly nymph</text><line x1="247" y1="170.0" x2="320" y2="170.0" stroke="#25614b" stroke-width="3"/><polygon points="320,170.0 306.6950761583107,176.92668763312224 306.6950761583107,163.07331236687776" fill="#25614b"/><rect x="330" y="295" width="620" height="130" rx="14" fill="#fff0e9" stroke="#b94a43" stroke-width="3"/><text x="352" y="329" font-size="25" fill="#b94a43" font-weight="700" text-anchor="start" >Immediately downstream: most polluted</text><text x="352" y="364" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >rat-tailed maggot • sludge worm</text><text x="352" y="394" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >blood worm — option A</text><line x1="247" y1="360.0" x2="320" y2="360.0" stroke="#b94a43" stroke-width="3"/><polygon points="320,360.0 306.6950761583107,366.92668763312224 306.6950761583107,353.07331236687776" fill="#b94a43"/><rect x="330" y="465" width="620" height="130" rx="14" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="352" y="499" font-size="25" fill="#173d31" font-weight="700" text-anchor="start" >Farther downstream</text><text x="352" y="534" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >blood worm • leech</text><text x="352" y="564" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >water louse • snail</text><line x1="247" y1="530.0" x2="320" y2="530.0" stroke="#25614b" stroke-width="3"/><polygon points="320,530.0 306.6950761583107,536.9266876331222 306.6950761583107,523.0733123668778" fill="#25614b"/><rect x="330" y="635" width="620" height="100" rx="14" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="352" y="66