<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">For a known daughter, only the mother’s X varies</title><desc id="desc">Two daughter nuclei each receive the affected father’s Xn. The carrier mother supplies either XN, giving an unaffected carrier, or Xn, giving an affected daughter, with equal probability.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">For a known daughter, only the mother’s X varies</text><text x="500" y="130" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">Father supplies Xⁿ to every daughter.</text><text x="500" y="180" font-size="25" fill="#173f32" text-anchor="middle" font-weight="400">Carrier mother supplies Xᴺ or Xⁿ with equal probability.</text><circle cx="270" cy="340" r="110" fill="#f3f6eb" stroke="#24644b" stroke-width="4"/><path d="M235 285 L255 395 M255 285 L235 395" fill="none" stroke="#24644b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M285 285 L305 395 M305 285 L285 395" fill="none" stroke="#537c9a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="243" y="260" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">Xⁿ</text><text x="297" y="260" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">Xᴺ</text><text x="270" y="490" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">Unaffected carrier</text><text x="270" y="530" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">½</text><circle cx="735" cy="340" r="110" fill="#f3f6eb" stroke="#24644b" stroke-width="4"/><path d="M700 285 L720 395 M720 285 L700 395" fill="none" stroke="#24644b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M750 285 L770 395 M770 285 L750 395" fill="none" stroke="#537c9a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="708" y="260" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">Xⁿ</text><text x="762" y="260" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">Xⁿ</text><text x="735" y="490" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">Affected daughter</text><text x="735" y="530" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">½</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">C: ½ of daughters = 50%</text></g></svg>