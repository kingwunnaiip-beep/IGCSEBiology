<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="t389 d389"><title id="t389">Nitrogen transformations follow the arrows</title><desc id="d389">Four separate process arrows: denitrification converts nitrate ions to nitrogen gas; absorption takes nitrate into plants; nitrification converts ammonium through nitrite to nitrate; fixation converts nitrogen gas into compounds through bacteria.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#286346"/></marker></defs><rect width="960" height="490" rx="24" fill="#f7f5e9"/><style>text{font-family:Arial,sans-serif;fill:#183b2b;font-size:22px}.title{font-size:29px;font-weight:700}.small{font-size:19px}.strong{font-weight:700}.box{fill:#e0eddc;stroke:#60876b;stroke-width:2}.arrow{fill:none;stroke:#286346;stroke-width:4;marker-end:url(#arrow)}</style><text class="title" x="38" y="50">Nitrogen transformations follow the arrows</text><text class="strong" x="40" y="129">1  Denitrification</text><rect class="box" x="300" y="91" width="240" height="63" rx="12"/><text x="321" y="131">Nitrate ions</text><path class="arrow" d="M552 122 H632"/><rect class="box" x="650" y="91" width="270" height="63" rx="12"/><text x="675" y="131">Nitrogen gas</text><text class="strong" x="40" y="219">2  Absorption</text><rect class="box" x="300" y="181" width="240" height="63" rx="12"/><text x="321" y="221">Nitrate ions</text><path class="arrow" d="M552 212 H632"/><rect class="box" x="650" y="181" width="270" height="63" rx="12"/><text x="675" y="221">Plant compounds</text><text class="strong" x="40" y="309">3  Nitrification</text><rect class="box" x="300" y="271" width="165" height="63" rx="12"/><text class="small" x="310" y="311">Ammonium ions</text><path class="arrow" d="M478 302 H511"/><rect class="box" x="525" y="271" width="140" height="63" rx="12"/><text class="small" x="544" y="311">Nitrite ions</text><path class="arrow" d="M678 302 H731"/><rect class="box" x="745" y="271" width="175" height="63" rx="12"/><text class="small" x="765" y="311">Nitrate ions</text><text class="strong" x="40" y="399">6  Nitrogen fixation</text><rect class="box" x="300" y="361" width="240" height="63" rx="12"/><text x="321" y="401">Nitrogen gas</text><path class="arrow" d="M552 392 H632"/><rect class="box" x="650" y="361" width="270" height="63" rx="12"/><text x="669" y="401">Bacterial compounds</text><text class="small" x="179" y="461">Arrow numbers match the source diagram. Other cycle steps are omitted.</text></svg>