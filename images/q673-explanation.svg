<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Affected parents can have an unaffected child</title><desc id="desc">A pedigree shows two affected parents and one unaffected daughter. A dominant Aa by Aa Punnett square includes aa, whereas recessive aa parents could not produce an unaffected child.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">Affected parents can have an unaffected child</text><rect x="125" y="165" width="55" height="55" rx="0" fill="#24644b" stroke="#24644b" stroke-width="3"/><circle cx="320" cy="192" r="30" fill="#24644b" stroke="#24644b" stroke-width="3"/><path d="M180 192 L290 192" fill="none" stroke="#24644b" stroke-width="3"/><path d="M235 192 L235 290" fill="none" stroke="#24644b" stroke-width="3"/><path d="M175 290 L295 290" fill="none" stroke="#24644b" stroke-width="3"/><path d="M175 290 L175 335" fill="none" stroke="#24644b" stroke-width="3"/><path d="M295 290 L295 335" fill="none" stroke="#24644b" stroke-width="3"/><circle cx="175" cy="365" r="30" fill="#fbf8eb" stroke="#24644b" stroke-width="3"/><rect x="268" y="338" width="55" height="55" rx="0" fill="#24644b" stroke="#24644b" stroke-width="3"/><text x="235" y="125" font-size="26" text-anchor="middle" fill="#173f32" font-weight="bold">Affected parents</text><text x="175" y="445" font-size="23" text-anchor="middle" fill="#173f32">Unaffected</text><text x="295" y="480" font-size="23" text-anchor="middle" fill="#173f32">Affected</text><text x="235" y="520" font-size="22" text-anchor="middle" fill="#173f32">Recessive aa × aa cannot do this.</text><text x="730" y="125" font-size="27" text-anchor="middle" fill="#173f32" font-weight="bold">Dominant Aa × Aa</text><path d="M590 200 L590 460" fill="none" stroke="#24644b" stroke-width="3"/><path d="M590 200 L850 200" fill="none" stroke="#24644b" stroke-width="3"/><path d="M720 200 L720 460" fill="none" stroke="#24644b" stroke-width="3"/><path d="M590 330 L850 330" fill="none" stroke="#24644b" stroke-width="3"/><path d="M850 200 L850 460" fill="none" stroke="#24644b" stroke-width="3"/><path d="M590 460 L850 460" fill="none" stroke="#24644b" stroke-width="3"/><text x="655" y="180" font-size="30" text-anchor="middle" fill="#173f32" font-weight="bold">A</text><text x="785" y="180" font-size="30" text-anchor="middle" fill="#173f32" font-weight="bold">a</text><text x="560" y="280" font-size="30" text-anchor="middle" fill="#173f32" font-weight="bold">A</text><text x="560" y="410" font-size="30" text-anchor="middle" fill="#173f32" font-weight="bold">a</text><text x="655" y="280" font-size="32" text-anchor="middle" fill="#173f32" font-weight="bold">AA</text><text x="785" y="280" font-size="32" text-anchor="middle" fill="#173f32" font-weight="bold">Aa</text><text x="655" y="410" font-size="32" text-anchor="middle" fill="#173f32" font-weight="bold">Aa</text><text x="785" y="410" font-size="32" text-anchor="middle" fill="#173f32" font-weight="bold">aa</text><rect x="723" y="333" width="124" height="124" rx="0" fill="none" stroke="#c49549" stroke-width="5"/><text x="730" y="505" font-size="23" text-anchor="middle" fill="#173f32">aa child can be unaffected</text><text x="500" y="565" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">B: the condition is caused by a dominant allele.</text></g></svg>