<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="q350-title q350-desc">
<title id="q350-title">Why plants take up nitrate ions</title>
<desc id="q350-desc">Nitrate ions supply nitrogen for synthesis of amino acids and hence proteins. Glucose, starch and fatty acids contain carbon, hydrogen and oxygen but no nitrogen.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="700" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Why plants take up nitrate ions</text><rect x="70" y="125" width="300" height="145" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="220.0" y="165" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Nitrate ions</text><text x="220.0" y="208" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Nitrogen taken up</text><text x="220.0" y="248" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >from the soil</text><line x1="382" y1="198" x2="478" y2="198" stroke="#25614b" stroke-width="4"/><polygon points="478,198 464.6950761583107,204.92668763312224 464.6950761583107,191.07331236687776" fill="#25614b"/><rect x="495" y="125" width="515" height="145" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="752.5" y="165" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Amino acids</text><text x="752.5" y="208" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Contain nitrogen</text><text x="752.5" y="248" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Used to build proteins</text><line x1="754" y1="282" x2="754" y2="328" stroke="#25614b" stroke-width="4"/><polygon points="754,328 747.0733123668778,314.6950761583107 760.9266876331222,314.6950761583107" fill="#25614b"/><rect x="495" y="345" width="515" height="115" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="752.5" y="385" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Proteins</text><text x="752.5" y="428" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Growth and enzyme synthesis</text><rect x="70" y="345" width="340" height="215" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="240.0" y="385" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Other choices</text><text x="240.0" y="428" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Fatty acids</text><text x="240.0" y="468" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Glucose</text><text x="240.0" y="508" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Starch</text><text x="715" y="520" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >These three alternatives contain C, H and O.</text><text x="715" y="560" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Their molecules do not require nitrogen.</text><rect x="24" y="624" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="658" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Nitrate ions supply nitrogen for making amino acids: A</text>
</g></svg>