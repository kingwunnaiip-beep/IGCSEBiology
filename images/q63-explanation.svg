<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1000" viewBox="0 0 1100 1000" role="img" aria-labelledby="q63-title q63-desc">
<title id="q63-title">How could the drug reduce protein production?</title>
<desc id="q63-desc">Protein produced after one day falls from 25 to 5 micrograms per million cells, an 80 percent reduction. DNA is transcribed to messenger RNA, then translated at ribosomes into protein. Statement 2 could block transcription and statement 1 could block translation. DNA replication in statement 3 is for cell division. The results do not establish the drug target. Answer B: statements 1 and 2 only.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="1000" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >How could the drug reduce protein production?</text><text x="550" y="107" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Protein made in one day / µg per million cells</text><text x="250" y="183" font-size="25" fill="#173d31" font-weight="400" text-anchor="end" >No drug</text><rect x="285" y="155" width="600" height="42" rx="0" fill="#eff5e8" stroke="none" stroke-width="2"/><rect x="285" y="155" width="600" height="42" rx="0" fill="#25614b" stroke="none" stroke-width="2"/><text x="903" y="184" font-size="26" fill="#173d31" font-weight="700" text-anchor="start" >25</text><text x="250" y="253" font-size="25" fill="#173d31" font-weight="400" text-anchor="end" >With drug</text><rect x="285" y="225" width="600" height="42" rx="0" fill="#eff5e8" stroke="none" stroke-width="2"/><rect x="285" y="225" width="120" height="42" rx="0" fill="#357ca2" stroke="none" stroke-width="2"/><text x="423" y="254" font-size="26" fill="#173d31" font-weight="700" text-anchor="start" >5</text><line x1="285" y1="147" x2="285" y2="277" stroke="#173d31" stroke-width="2"/><text x="285" y="309" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >0</text><text x="600" y="309" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >(25 − 5) ÷ 25 × 100 = 80% reduction</text><rect x="70" y="365" width="280" height="112" rx="16" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><rect x="70" y="545" width="280" height="112" rx="16" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><rect x="70" y="725" width="280" height="112" rx="16" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="210" y="398" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >DNA</text><path d="M 116 424 C 146 398 174 452 204 426 S 262 399 298 426" fill="none" stroke="#25614b" stroke-width="4"/><path d="M 116 441 C 146 467 174 413 204 439 S 262 466 298 439" fill="none" stroke="#357ca2" stroke-width="4"/><line x1="128" y1="424" x2="132" y2="441" stroke="#526c62" stroke-width="2"/><line x1="158" y1="424" x2="162" y2="441" stroke="#526c62" stroke-width="2"/><line x1="188" y1="424" x2="192" y2="441" stroke="#526c62" stroke-width="2"/><line x1="218" y1="424" x2="222" y2="441" stroke="#526c62" stroke-width="2"/><line x1="248" y1="424" x2="252" y2="441" stroke="#526c62" stroke-width="2"/><line x1="278" y1="424" x2="282" y2="441" stroke="#526c62" stroke-width="2"/><text x="210" y="580" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Messenger RNA</text><path d="M 112 615 Q 135 589 158 615 T 204 615 T 250 615 T 296 615" fill="none" stroke="#357ca2" stroke-width="4"/><text x="210" y="762" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Protein</text><circle cx="117" cy="802" r="10" fill="#25614b" stroke="none" stroke-width="3"/><circle cx="147" cy="809" r="10" fill="#357ca2" stroke="none" stroke-width="3"/><circle cx="177" cy="802" r="10" fill="#25614b" stroke="none" stroke-width="3"/><circle cx="207" cy="809" r="10" fill="#357ca2" stroke="none" stroke-width="3"/><circle cx="237" cy="802" r="10" fill="#25614b" stroke="none" stroke-width="3"/><circle cx="267" cy="809" r="10" fill="#357ca2" stroke="none" stroke-width="3"/><circle cx="297" cy="802" r="10" fill="#25614b" stroke="none" stroke-width="3"/><line x1="210" y1="483" x2="210" y2="535" stroke="#357ca2" stroke-width="4"/><polygon points="210,535 203.07331236687776,521.6950761583107 216.92668763312224,521.6950761583107" fill="#357ca2"/><line x1="210" y1="657" x2="210" y2="715" stroke="#357ca2" stroke-width="4"/><polygon points="210,715 203.07331236687776,701.6950761583107 216.92668763312224,701.6950761583107" fill="#357ca2"/><text x="410" y="490" font-size="28" fill="#357ca2" font-weight="700" text-anchor="start" >Transcription</text><text x="410" y="526" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >DNA provides the template for mRNA.</text><text x="410" y="558" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >Statement 2 could block mRNA production.</text><text x="410" y="674" font-size="28" fill="#357ca2" font-weight="700" text-anchor="start" >Translation at ribosomes</text><text x="410" y="710" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >Ribosomes read mRNA to build protein.</text><text x="410" y="742" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >Statement 1 could block this step.</text><rect x="405" y="363" width="625" height="81" rx="12" fill="#f5f1e4" stroke="none" stroke-width="2"/><text x="425" y="396" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >Statement 3: DNA replication copies DNA</text><text x="425" y="428" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >before division; it is not this direct pathway.</text><rect x="70" y="858" width="960" height="58" rx="12" fill="#e9f1f5" stroke="none" stroke-width="2"/><text x="550" y="894" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >These are possible explanations; the drug target is not proven.</text><rect x="24" y="924" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="958" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B — statements 1 and 2 only</text>
</g></svg>