<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Net water movement is from left to right</title><desc id="desc">A partially permeable membrane separates dilute water on the left from a more concentrated solution on the right. Small water molecules can cross; large solute particles are excluded. The net water arrow points right, down the water-potential gradient.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="53" font-size="31" text-anchor="start" font-weight="bold" fill="#173f32">Net water movement is from left to right</text><rect x="80" y="165" width="840" height="320" rx="12" fill="#f5f8ef" stroke="#537c9a" stroke-width="3"/><rect x="480" y="165" width="40" height="45" rx="0" fill="#b5c9b7" stroke="#24644b" stroke-width="2"/><rect x="480" y="230" width="40" height="45" rx="0" fill="#b5c9b7" stroke="#24644b" stroke-width="2"/><rect x="480" y="295" width="40" height="45" rx="0" fill="#b5c9b7" stroke="#24644b" stroke-width="2"/><rect x="480" y="360" width="40" height="45" rx="0" fill="#b5c9b7" stroke="#24644b" stroke-width="2"/><rect x="480" y="425" width="40" height="45" rx="0" fill="#b5c9b7" stroke="#24644b" stroke-width="2"/><circle cx="125" cy="220" r="9" fill="#dcecf4" stroke="#537c9a" stroke-width="2"/><circle cx="180" cy="270" r="9" fill="#dcecf4" stroke="#537c9a" stroke-width="2"/><circle cx="240" cy="210" r="9" fill="#dcecf4" stroke="#537c9a" stroke-width="2"/><circle cx="305" cy="280" r="9" fill="#dcecf4" stroke="#537c9a" stroke-width="2"/><circle cx="370" cy="210" r="9" fill="#dcecf4" stroke="#537c9a" stroke-width="2"/><circle cx="420" cy="255" r="9" fill="#dcecf4" stroke="#537c9a" stroke-width="2"/><circle cx="140" cy="390" r="9" fill="#dcecf4" stroke="#537c9a" stroke-width="2"/><circle cx="220" cy="440" r="9" fill="#dcecf4" stroke="#537c9a" stroke-width="2"/><circle cx="295" cy="390" r="9" fill="#dcecf4" stroke="#537c9a" stroke-width="2"/><circle cx="385" cy="440" r="9" fill="#dcecf4" stroke="#537c9a" stroke-width="2"/><circle cx="140" cy="310" r="9" fill="#dcecf4" stroke="#537c9a" stroke-width="2"/><circle cx="345" cy="345" r="9" fill="#dcecf4" stroke="#537c9a" stroke-width="2"/><circle cx="590" cy="220" r="9" fill="#dcecf4" stroke="#537c9a" stroke-width="2"/><circle cx="700" cy="245" r="9" fill="#dcecf4" stroke="#537c9a" stroke-width="2"/><circle cx="845" cy="215" r="9" fill="#dcecf4" stroke="#537c9a" stroke-width="2"/><circle cx="620" cy="420" r="9" fill="#dcecf4" stroke="#537c9a" stroke-width="2"/><circle cx="780" cy="440" r="9" fill="#dcecf4" stroke="#537c9a" stroke-width="2"/><circle cx="875" cy="390" r="9" fill="#dcecf4" stroke="#537c9a" stroke-width="2"/><circle cx="630" cy="285" r="24" fill="#e8d19a" stroke="#a88745" stroke-width="3"/><circle cx="800" cy="300" r="24" fill="#e8d19a" stroke="#a88745" stroke-width="3"/><circle cx="690" cy="390" r="24" fill="#e8d19a" stroke="#a88745" stroke-width="3"/><circle cx="870" cy="455" r="24" fill="#e8d19a" stroke="#a88745" stroke-width="3"/><text x="265" y="132" font-size="25" text-anchor="middle" font-weight="bold" fill="#173f32">Higher water potential</text><text x="735" y="132" font-size="25" text-anchor="middle" font-weight="bold" fill="#173f32">Lower water potential</text><path d="M350 350 L650 350" fill="none" stroke="#537c9a" stroke-width="7" marker-end="url(#blueArrow)"/><text x="500" y="520" font-size="24" text-anchor="middle" font-weight="normal" fill="#173f32">Partially permeable membrane</text><text x="500" y="553" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">C: overall water moves left → right</text></g></svg>