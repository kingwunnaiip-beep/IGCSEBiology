<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img" aria-labelledby="q282-title q282-desc">
<title id="q282-title">How the combined pill prevents egg release</title>
<desc id="q282-desc">Progesterone and oestrogen provide negative feedback that inhibits FSH and LH production. Reduced FSH prevents follicle development; reduced LH prevents the LH surge and ovulation. Uterus-wall thickening is not the development or release of an egg cell.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="800" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >How the combined pill prevents egg release</text><rect x="300" y="105" width="500" height="110" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="550.0" y="145" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Progesterone + oestrogen</text><text x="550.0" y="187" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Hormones in the combined pill</text><line x1="550" y1="222" x2="550" y2="267" stroke="#25614b" stroke-width="4"/><polygon points="550,267 543.0733123668778,253.69507615831074 556.9266876331222,253.69507615831074" fill="#25614b"/><text x="765" y="255" font-size="25" fill="#25614b" font-weight="400" text-anchor="start" >Negative feedback</text><rect x="300" y="275" width="500" height="110" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="550.0" y="315" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Pituitary gland</text><text x="550.0" y="357" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >FSH and LH production are inhibited.</text><line x1="405" y1="392" x2="265" y2="455" stroke="#25614b" stroke-width="4"/><polygon points="265,455 274.29057824042985,443.22353380854634 279.975514111477,455.8567246330956" fill="#25614b"/><line x1="695" y1="392" x2="835" y2="455" stroke="#25614b" stroke-width="4"/><polygon points="835,455 820.024485888523,455.8567246330956 825.7094217595702,443.22353380854634" fill="#25614b"/><rect x="60" y="465" width="410" height="160" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="265.0" y="505" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Less FSH — statement 1</text><text x="265.0" y="547" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Follicle development</text><text x="265.0" y="581" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >is inhibited.</text><rect x="630" y="465" width="410" height="160" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="835.0" y="505" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Less LH — statement 2</text><text x="835.0" y="547" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >The LH surge and</text><text x="835.0" y="581" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >ovulation are inhibited.</text><text x="550" y="679" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The uterus lining is a separate target.</text><text x="550" y="714" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Statement 3 does not explain egg development or egg release.</text><rect x="24" y="724" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="758" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Statements 1 and 2 prevent development and release of an egg.</text>
</g></svg>