<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">The population curve never levels off or declines</title><desc id="desc">An actual population-versus-year plot rises slowly from 1650 and accelerates towards 2000. It has neither a stationary plateau nor a death-phase decline.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">The population curve never levels off or declines</text><path d="M110 470 L920 470" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><path d="M110 470 L110 120" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><path d="M100 470 L110 470" fill="none" stroke="#24644b" stroke-width="2"/><text x="85" y="477" font-size="21" text-anchor="end" fill="#173f32">0</text><path d="M100 390 L110 390" fill="none" stroke="#24644b" stroke-width="2"/><text x="85" y="397" font-size="21" text-anchor="end" fill="#173f32">2</text><path d="M100 310 L110 310" fill="none" stroke="#24644b" stroke-width="2"/><text x="85" y="317" font-size="21" text-anchor="end" fill="#173f32">4</text><path d="M100 230 L110 230" fill="none" stroke="#24644b" stroke-width="2"/><text x="85" y="237" font-size="21" text-anchor="end" fill="#173f32">6</text><path d="M100 150 L110 150" fill="none" stroke="#24644b" stroke-width="2"/><text x="85" y="157" font-size="21" text-anchor="end" fill="#173f32">8</text><path d="M140 470 L140 480" fill="none" stroke="#24644b" stroke-width="2"/><text x="140" y="515" font-size="22" text-anchor="middle" fill="#173f32">1650</text><path d="M345 470 L345 480" fill="none" stroke="#24644b" stroke-width="2"/><text x="345" y="515" font-size="22" text-anchor="middle" fill="#173f32">1750</text><path d="M550 470 L550 480" fill="none" stroke="#24644b" stroke-width="2"/><text x="550" y="515" font-size="22" text-anchor="middle" fill="#173f32">1850</text><path d="M755 470 L755 480" fill="none" stroke="#24644b" stroke-width="2"/><text x="755" y="515" font-size="22" text-anchor="middle" fill="#173f32">1950</text><path d="M880 470 L880 480" fill="none" stroke="#24644b" stroke-width="2"/><text x="880" y="515" font-size="22" text-anchor="middle" fill="#173f32">2000</text><path d="M140 450 C360 448 535 435 665 395 C775 355 845 270 890 190" fill="none" stroke="#537c9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="260" y="155" font-size="25" text-anchor="start" fill="#173f32">World population / billions</text><text x="310" y="370" font-size="24" text-anchor="middle" fill="#173f32">Slow early increase</text><text x="760" y="300" font-size="24" text-anchor="middle" fill="#173f32">Rapid increase</text><text x="540" y="550" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">No horizontal plateau and no falling section</text></g></svg>