<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="q400-title q400-desc"><title id="q400-title">Active transport links carrier proteins to respiration</title><desc id="q400-desc">A low glucose concentration in the intestine is linked through a membrane carrier to higher blood glucose. Mitochondria and oxygen support respiration, supplying energy for transport against the gradient.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#245943"/></marker></defs><rect width="1000" height="600" rx="24" fill="#fbf9ee"/><g font-family="Arial, sans-serif"><text x="40" y="55" font-size="27" fill="#173e31" text-anchor="start" font-weight="bold">Active transport links carrier proteins to respiration</text><rect x="30" y="105" width="370" height="270" rx="16" fill="#e5f0df" stroke="#245943" stroke-width="2"/><rect x="600" y="105" width="370" height="270" rx="16" fill="#e5f0df" stroke="#245943" stroke-width="2"/><text x="215" y="146" font-size="26" fill="#173e31" text-anchor="middle" font-weight="bold">Intestine</text><text x="785" y="146" font-size="26" fill="#173e31" text-anchor="middle" font-weight="bold">Blood</text><circle cx="140" cy="245" r="13" fill="#5c95ad"/><circle cx="280" cy="270" r="13" fill="#5c95ad"/><circle cx="665" cy="210" r="13" fill="#5c95ad"/><circle cx="730" cy="210" r="13" fill="#5c95ad"/><circle cx="795" cy="210" r="13" fill="#5c95ad"/><circle cx="860" cy="210" r="13" fill="#5c95ad"/><circle cx="690" cy="280" r="13" fill="#5c95ad"/><circle cx="755" cy="280" r="13" fill="#5c95ad"/><circle cx="820" cy="280" r="13" fill="#5c95ad"/><circle cx="885" cy="280" r="13" fill="#5c95ad"/><text x="215" y="329" font-size="22" fill="#173e31" text-anchor="middle" font-weight="normal">lower glucose concentration</text><text x="215" y="361" font-size="22" fill="#173e31" text-anchor="middle" font-weight="normal">less than 5 mmol / dm³</text><text x="785" y="329" font-size="22" fill="#173e31" text-anchor="middle" font-weight="normal">higher glucose concentration</text><text x="785" y="361" font-size="22" fill="#173e31" text-anchor="middle" font-weight="normal">5–7 mmol / dm³</text><rect x="460" y="175" width="80" height="175" rx="25" fill="#245943" stroke="#245943" stroke-width="2"/><text x="500" y="156" font-size="22" fill="#173e31" text-anchor="middle" font-weight="bold">carrier</text><path d="M310 245 L675 245" fill="none" stroke="#c68f32" stroke-width="5" marker-end="url(#arrow)"/><text x="500" y="405" font-size="24" fill="#173e31" text-anchor="middle" font-weight="bold">Glucose moves against its concentration gradient</text><rect x="75" y="445" width="850" height="110" rx="16" fill="#e5f0df" stroke="#245943" stroke-width="2"/><text x="500" y="482" font-size="24" fill="#173e31" text-anchor="middle" font-weight="normal">Mitochondria + oxygen → aerobic respiration</text><text x="500" y="523" font-size="24" fill="#173e31" text-anchor="middle" font-weight="bold">Energy supply + membrane proteins → active transport</text></g></svg>