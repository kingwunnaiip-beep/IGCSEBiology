<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1220" viewBox="0 0 1000 1220" role="img" aria-labelledby="q112-title q112-desc">
<title id="q112-title">112 · Yeast can respire without oxygen</title>
<desc id="q112-desc">Answer C: the equation C6H12O6 → 2C2H5OH + 2CO2 represents anaerobic respiration in yeast. Glucose is broken down to ethanol and carbon dioxide, releasing energy. Oxygen is not a reactant. A budding yeast cell is shown schematically, with a glucose input arrow and product arrows for ethanol and carbon dioxide. In contrast, anaerobic respiration in human muscle produces lactic acid; aerobic respiration uses oxygen and produces carbon dioxide and water. Anaerobic respiration releases less energy per glucose molecule than aerobic respiration.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
