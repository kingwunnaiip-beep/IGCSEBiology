or="middle" >FSH</text><text x="200.0" y="798" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Develops ovarian</text><text x="200.0" y="835" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >follicles</text><rect x="365" y="714" width="270" height="166" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="755" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >LH</text><text x="500.0" y="798" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Triggers</text><text x="500.0" y="835" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >ovulation</text><rect x="665" y="714" width="270" height="166" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="800.0" y="755" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Oestrogen</text><text x="800.0" y="798" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Repairs and thickens</text><text x="800.0" y="835" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >the lining in the cycle</text><text x="500" y="938" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The question asks about maintaining the lining during pregnancy.</text><text x="500" y="975" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Separate this role from follicle development and ovulation.</text><rect x="24" y="1034" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1068" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · Progesterone</text>
