<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1070" viewBox="0 0 1000 1070" role="img" aria-labelledby="q197-title q197-desc">
<title id="q197-title">197 · The septum separates the two sides of the heart</title>
<desc id="q197-desc">Answer C. A front-view qualitative four-chamber schematic shows the heart’s right side on the viewer’s left and left side on the viewer’s right. A thick central green partition is the septum, separating deoxygenated blood on the right from oxygenated blood on the left. A leader ends on this partition. Atrioventricular valves are within each side, between an atrium and ventricle; they prevent backflow rather than separate the two blood supplies. Chamber shape, colour and proportions are illustrative.</desc>
