ht="400" text-anchor="middle" >25</text><text x="73" y="208" font-size="25" fill="#173d31" font-weight="700" text-anchor="start" >O₂ inspired</text><rect x="270" y="183" width="525" height="32" rx="0" fill="#357ca2" stroke="none" stroke-width="2"/><text x="809" y="208" font-size="25" fill="#357ca2" font-weight="700" text-anchor="start" >21%</text><text x="73" y="278" font-size="25" fill="#173d31" font-weight="700" text-anchor="start" >O₂ expired</text><rect x="270" y="253" width="400" height="32" rx="0" fill="#25614b" stroke="none" stroke-width="2"/><text x="684" y="278" font-size="25" fill="#25614b" font-weight="700" text-anchor="start" >16%</text><text x="73" y="383" font-size="25" fill="#173d31" font-weight="700" text-anchor="start" >CO₂ inspired</text><rect x="270" y="358" width="1.0" height="32" rx="0" fill="#357ca2" stroke="none" stroke-width="2"/><text x="285.0" y="383" font-size="25" fill="#357ca2" font-weight="700" text-anchor="start" >0.04%</text><text x="73" y="453" font-size="25" fill="#173d31" font-weight="700" text-anchor="start" >CO₂ expired</text><rect x="270" y="428" width="100" height="32" rx="0" fill="#25614b" stroke="none" stroke-width="2"/><text x="384" y="453" font-size="25" fill="#25614b" font-weight="700" text-anchor="start" >4%</text><line x1="270" y1="495" x2="895" y2="495" stroke="#173d31" stroke-width="3"/><text x="500" y="600" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >One common 0–25% scale: the tiny 0.04% bar is to scale.</text><text x="500" y="643" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >O₂: 21 − 16 = 5 percentage points lower</text><text x="500" y="681" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >CO₂: 4.00 − 0.04 = 3.96 percentage points higher</text><rect x="48" y="719" width="904" height="425" rx="12" fill="#edf5f8" stroke="none" stroke-width="2"/><text x="500" y="763" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Gas exchange at the alveoli</text><ellipse cx="255" cy="947" rx="153" ry="126" fill="#fffdf7" stroke="#25614b" stroke-width="5"/><text x="255" y="930" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Alveolar</text><text x="255" y="968" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >air</text><rect x="623" y="843" width="278" height="193" rx="55" fill="#f9e4df" stroke="#b94a43" stroke-width="3"/><text x="762" y="816" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Capillary blood</text><ellipse cx="678" cy="895" rx="29" ry="18" fill="#db9a8b" stroke="#b94a43" stroke-width="2"/><ellipse cx="678" cy="895" rx="13" ry="8" fill="#f3c3b7" stroke="none" stroke-width="3"/><ellipse cx="828" cy="898" rx="29" ry="18" fill="#db9a8b" stroke="#b94a43" stroke-width="2"/><ellipse cx="828" cy="898" rx="13" ry="8" fill="#f3c3b7" stroke="none" stroke-width="3"/><ellipse cx="754" cy="979" rx="29" ry="18" fill="#db9a8b" stroke="#b94a43" stroke-width="2"/><ellipse cx="754" cy="979" rx="13" ry="8" fill="#f3c3b7" stroke="none" stroke-width="3"/><line x1="423" y1="897" x2="602" y2="897" stroke="#357ca2" stroke-width="5"/><polygon points="602,897 588.6950761583107,903.9266876331222 588.6950761583107,890.0733123668778" fill="#357ca2"/><text x="513" y="867" font-size="28" fill="#357ca2" font-weight="700" text-anchor="middle" >O₂</text><line x1="602" y1="999" x2="423" y2="999" stroke="#b94a43" stroke-width="5"/><polygon points="423,999 436.3049238416893,992.0733123668778 436.3049238416893,1005.9266876331222" fill="#b94a43"/><text x="513" y="1041" font-size="28" fill="#b94a43" font-weight="700" text-anchor="middle" >CO₂</text><text x="513" y="955" font-size="23" fill="#526c62" font-weight="400" text-anchor="middle" >Diffusion</text><text x="500" y="1111" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Cells use oxygen for respiration; carbon dioxide returns in blood.</text><rect x="63" y="1183" width="874" height="125" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500" y="1226" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >These are approximate mixed expired-air values.</text><text x="500" y="1264" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >They can vary with breathing and activity.</text><text x="500" y="1342" font-size="23" fill="#526c62" font-weight="400" text-anchor="middle" >Expired air is a mixture; it is not identical to pure alveolar air.</text><rect x="24" y="1344" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1378" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · About 16% oxygen and 4% carbon dioxide</text>
