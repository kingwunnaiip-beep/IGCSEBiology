<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1190" viewBox="0 0 1000 1190" role="img" aria-labelledby="q122-title q122-desc">
<title id="q122-title">122 · Goblet cells secrete mucus</title>
<desc id="q122-desc">Answer B: goblet cells secrete mucus. In the airways, sticky mucus traps dust and pathogens. Ciliated cells have cilia that beat to move the mucus towards the throat, where it can be swallowed. The goblet cell is shown between ciliated epithelial cells, secreting mucus onto the airway surface. The cell shapes, cilia, dust symbols and pathogen symbols are illustrative rather than measured anatomy. Lymphocytes and memory cells have immune roles; they are not the airway cells that secrete mucus.</desc>
