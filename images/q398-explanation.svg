<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="q398-title q398-desc"><title id="q398-title">Two adaptations reduce water loss in salty, windy habitats</title><desc id="q398-desc">Two panels show a solute-rich root cell lowering water potential and a small leaf reducing evaporative surface area in windy conditions. This is a qualitative schematic.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#245943"/></marker></defs><rect width="1000" height="600" rx="24" fill="#fbf9ee"/><g font-family="Arial, sans-serif"><text x="40" y="55" font-size="27" fill="#173e31" text-anchor="start" font-weight="bold">Two adaptations reduce water loss in salty, windy habitats</text><rect x="35" y="100" width="450" height="390" rx="16" fill="#e5f0df" stroke="#245943" stroke-width="2"/><rect x="515" y="100" width="450" height="390" rx="16" fill="#e5f0df" stroke="#245943" stroke-width="2"/><text x="260" y="140" font-size="25" fill="#173e31" text-anchor="middle" font-weight="bold">Root cells in salty soil</text><text x="740" y="140" font-size="25" fill="#173e31" text-anchor="middle" font-weight="bold">Leaves in strong winds</text><rect x="160" y="185" width="200" height="145" rx="25" fill="#ffffff" stroke="#245943" stroke-width="2"/><circle cx="190" cy="215" r="8" fill="#c68f32"/><circle cx="236" cy="235" r="8" fill="#c68f32"/><circle cx="290" cy="214" r="8" fill="#c68f32"/><circle cx="328" cy="257" r="8" fill="#c68f32"/><circle cx="215" cy="294" r="8" fill="#c68f32"/><circle cx="279" cy="289" r="8" fill="#c68f32"/><text x="260" y="359" font-size="24" fill="#173e31" text-anchor="middle" font-weight="bold">High root-cell salt</text><text x="260" y="395" font-size="21" fill="#173e31" text-anchor="middle" font-weight="normal">lowers cell water potential</text><text x="260" y="426" font-size="21" fill="#173e31" text-anchor="middle" font-weight="normal">and reduces outward water loss</text><path d="M700 330 Q595 205 750 180 Q845 265 700 330 Z" fill="#245943"/><path d="M700 330 L750 180" stroke="#fbf9ee" stroke-width="3"/><path d="M820 210 L920 210" fill="none" stroke="#5c95ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M820 245 L920 245" fill="none" stroke="#5c95ad" stroke-width="3" marker-end="url(#arrow)"/><text x="740" y="359" font-size="24" fill="#173e31" text-anchor="middle" font-weight="bold">Low leaf surface area</text><text x="740" y="395" font-size="21" fill="#173e31" text-anchor="middle" font-weight="normal">less surface available</text><text x="740" y="426" font-size="21" fill="#173e31" text-anchor="middle" font-weight="normal">for evaporation</text><text x="500" y="546" font-size="24" fill="#173e31" text-anchor="middle" font-weight="normal">Two different mechanisms work together to conserve water.</text></g></svg>