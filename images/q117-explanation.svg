 y="975" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >No fusion of gamete nuclei</text><rect x="522" y="795" width="430" height="220" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="737" y="839" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Useful result</text><text x="737" y="895" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Desired inherited trait retained</text><text x="737" y="935" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Many plants can be produced</text><text x="737" y="975" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >No pollination required</text><text x="500" y="1070" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Low genetic variation can increase shared vulnerability.</text><text x="500" y="1106" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Growing conditions can still affect the crop’s appearance and yield.</text><rect x="24" y="1154" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1188" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer A · All offspring inherit the desired characteristic</text>
