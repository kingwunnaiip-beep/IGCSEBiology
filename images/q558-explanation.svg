<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">At pH 8, both Y and Z are active</title><desc id="desc">Three enzyme-activity curves X, Y and Z are drawn over pH 1 to 12; a vertical pH-8 guide intersects Y and Z above zero.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="bluearrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="45" font-size="28" fill="#173f32" text-anchor="start" font-weight="bold">At pH 8, both Y and Z are active</text><text x="500" y="555" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">A curve above the baseline means activity: Y and Z are both active at pH 8.</text><path d="M130 460 L920 460" fill="none" stroke="#173f32" stroke-width="3" marker-end="url(#arrow)" /><path d="M130 460 L130 125" fill="none" stroke="#173f32" stroke-width="3" marker-end="url(#arrow)" /><text x="45" y="115" font-size="23" fill="#173f32" text-anchor="start" font-weight="normal">Activity</text><text x="875" y="507" font-size="24" fill="#173f32" text-anchor="start" font-weight="normal">pH</text><path d="M130 460 L130 470" fill="none" stroke="#173f32" stroke-width="2" /><text x="130" y="495" font-size="20" fill="#173f32" text-anchor="middle" font-weight="normal">1</text><path d="M196 460 L196 470" fill="none" stroke="#173f32" stroke-width="2" /><text x="196" y="495" font-size="20" fill="#173f32" text-anchor="middle" font-weight="normal">2</text><path d="M262 460 L262 470" fill="none" stroke="#173f32" stroke-width="2" /><text x="262" y="495" font-size="20" fill="#173