<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Kidney regions and the urine pathway</title><desc id="desc">A schematic kidney shows an outer cortex, inner medulla and a ureter leaving for the bladder. R is cortex, Q is medulla and P is ureter. The urethra runs from the bladder to outside the body.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#397857"/></marker></defs><rect width="900" height="520" rx="22" fill="#fbfaee"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="28" text-anchor="start" fill="#183e31" font-weight="bold">Kidney regions and the urine pathway</text><path d="M260 115 C80 95 95 420 255 405 C335 400 355 340 310 300 C265 330 235 300 248 260 C230 220 270 195 310 218 C365 165 320 120 260 115 Z" fill="#bbd49c" stroke="#4c7957" stroke-width="4"/><path d="M250 150 C135 140 142 365 255 370 L280 330 L223 308 L231 276 L212 240 L247 200 L281 198 Z" fill="#f5f0cf" stroke="#4c7957" stroke-width="2"/><path d="M277 275 Q340 270 348 345 L355 430" fill="none" stroke="#819b60" stroke-width="15"/><text x="460" y="145" font-size="25" text-anchor="start" fill="#183e31" font-weight="bold">R = cortex</text><text x="460" y="177" font-size="21" text-anchor="start" fill="#183e31" font-weight="normal">Outer kidney region</text><path d="M450 155 L278 132" fill="none" stroke="#397857" stroke-width="4"/><text x="460" y="250" font-size="25" text-anchor="start" fill="#183e31" font-weight="bold">Q = medulla</text><text x="460" y="282" font-size="21" text-anchor="start" fill="#183e31" font-weight="normal">Inner kidney region</text><path d="M450 255 L210 290" fill="none" stroke="#397857" stroke-width="4"/><text x="460" y="357" font-size="25" text-anchor="start" fill="#183e31" font-weight="bold">P = ureter</text><text x="460" y="389" font-size="21" text-anchor="start" fill="#183e31" font-weight="normal">Carries urine to the bladder</text><path d="M450 365 L352 387" fill="none" stroke="#397857" stroke-width="4"/><text x="450" y="477" font-size="22" text-anchor="middle" fill="#183e31" font-weight="bold">Kidney → ureter → bladder → urethra → outside</text></g></svg>