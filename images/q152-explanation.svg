e x1="656" y1="480" x2="666" y2="488" stroke="#977038" stroke-width="3"/><line x1="687" y1="489" x2="697" y2="483" stroke="#977038" stroke-width="3"/><text x="674" y="551" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Amino acids built into</text><text x="674" y="587" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >a cell protein</text><text x="500" y="656" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Building a protein from absorbed amino acids is assimilation.</text><text x="500" y="718" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative cell model; molecular symbol counts are illustrative.</text><rect x="65" y="742" width="870" height="117" rx="12" fill="#f4efdf" stroke="#daa958" stroke-width="2"/><text x="500.0" y="782" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Ingestion</text><text x="500.0" y="825" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Food and drink enter through the mouth.</text><rect x="65" y="886" width="870" height="117" rx="12" fill="#f4efdf" stroke="#daa958" stroke-width="2"/><text x="500.0" y="926" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Absorption</text><text x="500.0" y="969" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Digested molecules cross the intestinal wall.</text><rect x="65" y="1030" width="870" height="117" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="1070" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Assimilation</text><text x="500.0" y="1113" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Body cells take up and use the nutrients.</text><rect x="24" y="1154" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1188" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer B · Assimilation</text>
