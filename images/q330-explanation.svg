173d31" font-weight="400" text-anchor="start" >Arriving from body tissues</text><text x="90" y="700" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >Higher carbon dioxide</text><text x="665" y="620" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >To pulmonary vein</text><text x="665" y="660" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >Leaving for the heart</text><text x="665" y="700" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >Lower carbon dioxide</text><rect x="24" y="724" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="758" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B: blood arriving from the pulmonary artery</text>
