<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" role="img" aria-labelledby="title503 desc503"><title id="title503">Factors that limit population growth</title><desc id="desc503">A qualitative population curve shows growth slowing under limiting factors. An arrow identifies predation and disease as factors that can raise mortality and regulate growth. There are no numerical axes.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#185744"/></marker></defs><rect width="800" height="530" rx="20" fill="#fbf8ed"/><g font-family="Arial, sans-serif"><text x="400" y="55" font-size="28" text-anchor="middle" fill="#185744" font-weight="bold">Factors that limit population growth</text><path d="M100 385 L100 130" stroke="#185744" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M100 385 L690 385" stroke="#185744" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M100 370 C260 365 325 290 395 230 S550 210 675 210" stroke="#397a61" stroke-width="5" fill="none"/><text x="130" y="110" font-size="22" text-anchor="start" fill="#185744" font-weight="normal">Population size</text><text x="680" y="425" font-size="22" text-anchor="end" fill="#185744" font-weight="normal">Time</text><text x="600" y="170" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">Growth limited</text><text x="400" y="475" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">Predation and disease can increase deaths and slow growth.</text><path d="M500 310 L500 225" stroke="#9a4141" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="620" y="335" font-size="21" text-anchor="middle" fill="#9a4141" font-weight="normal">Limiting factors</text></g></svg>