y="554" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Nitrate ions in soil</text><line x1="500" y1="600" x2="500" y2="711" stroke="#25614b" stroke-width="5"/><polygon points="500,711 493.07331236687776,697.6950761583107 506.92668763312224,697.6950761583107" fill="#25614b"/><rect x="594" y="615" width="354" height="175" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="617" y="655" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >Y · Denitrification</text><text x="617" y="696" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >Denitrifying bacteria</text><text x="617" y="731" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >Favoured by low oxygen</text><text x="617" y="766" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >e.g. waterlogged soil</text><rect x="70" y="717" width="500" height="100" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="320" y="759" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Nitrogen gas (N₂)</text><text x="320" y="795" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >in the atmosphere</text><rect x="48" y="861" width="904" height="158" rx="12" fill="#f3f0df" stroke="none" stroke-width="2"/><text x="74" y="901" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >Do not confuse these processes</text><text x="74" y="942" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >Nitrogen fixation: N₂ → nitrogen-containing compounds</text><text x="74" y="982" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >Ammonification: organic nitrogen → ammonia / ammonium</text><rect x="24" y="1054" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1088" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · X = nitrification · Y = denitrification</text>
</g></svg>