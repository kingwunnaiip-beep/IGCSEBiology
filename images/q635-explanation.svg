<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">X shows nutrition; Y shows excretion</title><desc id="desc">A plant obtains carbon dioxide and feeds a chicken through X arrows. Y arrows carry metabolic waste away from the organisms; a chicken also releases carbon dioxide.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="53" font-size="30" text-anchor="start" font-weight="bold" fill="#173f32">X shows nutrition; Y shows excretion</text><path d="M230 410 V250" fill="none" stroke="#24644b" stroke-width="7" /><path d="M230 354.0 Q300 289.0 312 334.0 Q260 374.0 230 354.0" fill="#e4f0df" stroke="#24644b" stroke-width="2" /><path d="M230 306.0 Q160 241.0 148 286.0 Q200 326.0 230 306.0" fill="#e4f0df" stroke="#24644b" stroke-width="2" /><path d="M230 274.0 Q300 209.0 312 254.0 Q260 294.0 230 274.0" fill="#e4f0df" stroke="#24644b" stroke-width="2" /><path d="M230 410 Q195 430 184.5 455" fill="none" stroke="#24644b" stroke-width="2" /><path d="M230 410 Q230 430 230.0 455" fill="none" stroke="#24644b" stroke-width="2" /><path d="M230 410 Q265 430 275.5 455" fill="none" stroke="#24644b" stroke-width="2" /><text x="230" y="475" font-size="25" text-anchor="middle" font-weight="bold" fill="#173f32">Green plant</text><ellipse cx="745" cy="330" rx="72" ry="55" fill="#f1e6cd" stroke="#24644b" stroke-width="3"/><ellipse cx="730" cy="335" rx="35" ry="30" fill="#d49750" stroke="#24644b" stroke-width="2"/><circle cx="800" cy="267" r="35" fill="#f1e6cd" stroke="#24644b" stroke-width="3"/><polygon points="830,263 860,274 831,283" fill="#d49750" stroke="#24644b" stroke-width="2"/><circle cx="807" cy="261" r="4" fill="#173f32" stroke="#173f32" stroke-width="0"/><circle cx="785" cy="235" r="9" fill="#b15f52" stroke="#b15f52" stroke-width="1"/><circle cx="800" cy="235" r="9" fill="#b15f52" stroke="#b15f52" stroke-width="1"/><circle cx="815" cy="235" r="9" fill="#b15f52" stroke="#b15f52" stroke-width="1"/><line x1="720" y1="380" x2="720" y2="420" stroke="#24644b" stroke-width="4"/><line x1="720" y1="420" x2="700" y2="432" stroke="#24644b" stroke-width="3"/><line x1="720" y1="420" x2="735" y2="432" stroke="#24644b" stroke-width="3"/><line x1="760" y1="380" x2="760" y2="420" stroke="#24644b" stroke-width="4"/><line x1="760" y1="420" x2="740" y2="432" stroke="#24644b" stroke-width="3"/><line x1="760" y1="420" x2="775" y2="432" stroke="#24644b" stroke-width="3"/><text x="745" y="475" font-size="25" text-anchor="middle" font-weight="bold" fill="#173f32">Chicken</text><text x="500" y="132" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">Atmospheric CO₂</text><path d="M420 151 L270 245" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="197" font-size="28" text-anchor="middle" font-weight="bold" fill="#173f32">X</text><path d="M355 329 L645 329" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="304" font-size="28" text-anchor="middle" font-weight="bold" fill="#173f32">X</text><path d="M815 215 L610 146" fill="none" stroke="#537c9a" stroke-width="3" marker-end="url(#arrow)"/><text x="745" y="178" font-size="28" text-anchor="middle" font-weight="bold" fill="#173f32">Y</text><path d="M170 430 L110 490" fill="none" stroke="#537c9a" stroke-width="3" marker-end="url(#arrow)"/><path d="M800 420 L875 490" fill="none" stroke="#537c9a" stroke-width="3" marker-end="url(#arrow)"/><text x="100" y="520" font-size="22" text-anchor="middle" font-weight="normal" fill="#173f32">Waste</text><text x="885" y="520" font-size="22" text-anchor="middle" font-weight="normal" fill="#173f32">Waste</text><text x="500" y="548" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">X: obtaining materials for food.  Y: removing metabolic waste.</text></g></svg>