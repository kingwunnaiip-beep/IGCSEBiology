 font-weight="400" text-anchor="middle" >Upper side elongates more</text><rect x="65" y="687" width="415" height="180" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="272.5" y="727" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Higher auxin in shoot</text><text x="272.5" y="769" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Stimulates elongation</text><text x="272.5" y="805" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Lower side grows faster</text><text x="272.5" y="841" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Shoot bends upwards</text><rect x="520" y="687" width="415" height="180" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="727.5" y="727" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Higher auxin in root</text><text x="727.5" y="769" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Inhibits elongation</text><text x="727.5" y="805" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Lower side grows less</text><text x="727.5" y="841" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Root bends downwards</text><text x="500" y="911" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Kept in a dark box: directional light is excluded.</text><text x="500" y="947" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative bending model; no measured growth rates.</text><rect x="24" y="1004" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1038" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer B · High auxin stimulates lower-shoot elongation</text>
