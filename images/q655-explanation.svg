<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which statements about active transport of ions are correct?</title><desc id="desc">Against the gradient: Lower → higher ion concentration; Energy is required: Supplied by respiration; Living cells only: Working membranes and transport proteins</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Which statements about active transport of ions are correct?</text><text x="38" y="106" font-size="18" font-weight="400">Correct statements: 1, 3 and 4. Statement 2 gives the opposite direction.</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><circle cx="60" cy="160" r="16" fill="#285d4c"/><text x="60" y="166" text-anchor="middle" font-size="18" fill="white">1</text><text x="50" y="207" font-size="23" font-weight="700">Against the gradient</text><text x="50" y="285" font-size="21" font-weight="400">Lower → higher ion</text><text x="50" y="312" font-size="21" font-weight="400">concentration</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><circle cx="415" cy="160" r="16" fill="#285d4c"/><text x="415" y="166" text-anchor="middle" font-size="18" fill="white">3</text><text x="405" y="207" font-size="23" font-weight="700">Energy is required</text><text x="405" y="285" font-size="21" font-weight="400">Supplied by respiration</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><circle cx="770" cy="160" r="16" fill="#285d4c"/><text x="770" y="166" text-anchor="middle" font-size="18" fill="white">4</text><text x="760" y="207" font-size="23" font-weight="700">Living cells only</text><text x="760" y="285" font-size="21" font-weight="400">Working membranes and</text><text x="760" y="312" font-size="21" font-weight="400">transport proteins</text><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>