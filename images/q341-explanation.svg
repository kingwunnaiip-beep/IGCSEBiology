<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="q341-title q341-desc">
<title id="q341-title">Locate the break in the dye pathway</title>
<desc id="q341-desc">Both kidneys contain dye. On one side dye stops part-way down a ureter, leaving the lower part unshaded. The other ureter carries dye to the bladder and urethra. The blockage is therefore in a ureter.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
