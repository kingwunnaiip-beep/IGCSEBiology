<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" role="img" aria-labelledby="q70-title q70-desc">
<title id="q70-title">Genes and environment influence phenotype</title>
<desc id="q70-desc">A directed flow diagram shows that genetic factors and environmental factors can both influence phenotypic variation. Mutation changes DNA and can create new alleles; only some mutations alter phenotype. The arrows describe biological influences, not a numerical equation.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="880" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Genes and environment influence phenotype</text><rect x="45" y="113" width="435" height="132" rx="12" fill="#e7f1f5" stroke="#357ca2" stroke-width="2"/><text x="262" y="153" font-size="28" fill="#357ca2" font-weight="700" text-anchor="middle" >Mutation</text><text x="262" y="191" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >DNA change; can create</text><text x="262" y="222" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >new alleles</text><text x="740" y="163" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Some mutations have no</text><text x="740" y="197" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >detectable effect on phenotype.</text><line x1="262" y1="245" x2="262" y2="296" stroke="#357ca2" stroke-width="4"/><polygon points="262,296 255.07331236687776,282.6950761583107 268.92668763312224,282.6950761583107" fill="#357ca2"/><rect x="45" y="302" width="435" height="158" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="262" y="343" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Genetic factors</text><text x="262" y="384" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Different alleles and</text><text x="262" y="418" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >combinations of alleles</text><rect x="520" y="302" width="435" height="158" rx="12" fill="#e7f1f5" stroke="#357ca2" stroke-width="2"/><text x="737" y="343" font-size="28" fill="#357ca2" font-weight="700" text-anchor="middle" >Environmental factors</text><text x="737" y="384" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Nutrition, light, temperature</text><text x="737" y="418" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >and other conditions</text><line x1="262" y1="460" x2="405" y2="531" stroke="#25614b" stroke-width="4"/><polygon points="405,531 390.0027513412871,531.2872849956623 396.1634367119839,518.87914403778" fill="#25614b"/><line x1="737" y1="460" x2="595" y2="531" stroke="#357ca2" stroke-width="4"/><polygon points="595,531 603.8025767768762,518.8544394082777 609.9979945395037,531.2452749335324" fill="#357ca2"/><rect x="205" y="540" width="590" height="126" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="3"/><text x="500" y="582" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Phenotypic variation</text><text x="500" y="622" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Differences in observable characteristics</text><text x="500" y="715" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Inherited ABO alleles → blood group</text><text x="500" y="753" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Genes and nutrition → variation in height</text><rect x="24" y="804" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="838" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C — Genetic variation can cause phenotypic variation</text>
</g></svg>