<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img" aria-labelledby="q352-title q352-desc">
<title id="q352-title">Find the heterozygotes in the cross</title>
<desc id="q352-desc">Parent 1 is HbA HbS and parent 2 is HbA HbA. Offspring 3 and 4 are HbA HbS; offspring 5 and 6 are HbA HbA. The heterozygotes 1, 3 and 4 have increased resistance to malaria.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="800" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Find the heterozygotes in the cross</text><text x="550" y="115" font-size="31" fill="#173d31" font-weight="700" text-anchor="middle" >Parent 1: HbᴬHbˢ  ×  Parent 2: HbᴬHbᴬ</text><rect x="70" y="155" width="440" height="110" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="290.0" y="195" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Parent 1 is heterozygous</text><text x="290.0" y="238" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Makes Hbˢ and Hbᴬ gametes</text><rect x="580" y="155" width="440" height="110" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="800.0" y="195" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Parent 2 is homozygous</text><text x="800.0" y="238" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Makes only Hbᴬ gametes</text><line x1="185" y1="310" x2="975" y2="310" stroke="#526c62" stroke-width="2"/><line x1="185" y1="380" x2="975" y2="380" stroke="#526c62" stroke-width="2"/><line x1="185" y1="485" x2="975" y2="485" stroke="#526c62" stroke-width="2"/><line x1="185" y1="590" x2="975" y2="590" stroke="#526c62" stroke-width="2"/><line x1="185" y1="310" x2="185" y2="590" stroke="#526c62" stroke-width="2"/><line x1="415" y1="310" x2="415" y2="590" stroke="#526c62" stroke-width="2"/><line x1="695" y1="310" x2="695" y2="590" stroke="#526c62" stroke-width="2"/><line x1="975" y1="310" x2="975" y2="590" stroke="#526c62" stroke-width="2"/><text x="300" y="356" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Gametes</text><text x="555" y="356" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Hbᴬ</text><text x="835" y="356" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Hbᴬ</text><text x="300" y="441" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Hbˢ</text><text x="555" y="426" font-size="30" fill="#25614b" font-weight="700" text-anchor="middle" >HbᴬHbˢ</text><text x="555" y="464" font-size="25" fill="#25614b" font-weight="400" text-anchor="middle" >Offspring 3</text><text x="835" y="426" font-size="30" fill="#25614b" font-weight="700" text-anchor="middle" >HbᴬHbˢ</text><text x="835" y="464" font-size="25" fill="#25614b" font-weight="400" text-anchor="middle" >Offspring 4</text><text x="300" y="547" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Hbᴬ</text><text x="555" y="532" font-size="30" fill="#526c62" font-weight="700" text-anchor="middle" >HbᴬHbᴬ</text><text x="555" y="570" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Offspring 5</text><text x="835" y="532" font-size="30" fill="#526c62" font-weight="700" text-anchor="middle" >HbᴬHbᴬ</text><text x="835" y="570" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Offspring 6</text><text x="550" y="648" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >One Hbᴬ plus one Hbˢ gives increased malaria resistance.</text><text x="550" y="688" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >This is an advantage in regions where malaria occurs.</text><rect x="24" y="724" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="758" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Heterozygotes: parent 1 and offspring 3 and 4 → A</text>
</g></svg>