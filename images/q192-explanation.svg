<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1040" viewBox="0 0 1000 1040" role="img" aria-labelledby="q192-title q192-desc">
<title id="q192-title">192 · Count the structures shared by all living cells</title>
<desc id="q192-desc">Answer B, two structures. The source list is cytoplasm, cell membrane, cell wall, chloroplast. A generic living cell schematic has cytoplasm inside a cell membrane, with leaders ending in those structures. Cell walls are absent from animal cells; chloroplasts are absent from animals, fungi and bacteria. The answer is the count two, not the identities of statements numbered two. Shape and proportions are illustrative.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1040" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >192 · Count the structures shared by all living cells</text><text x="500" y="110" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Source list: cytoplasm · cell membrane · cell wall · chloroplast</text><ellipse cx="320" cy="329" rx="205" ry="145" fill="#d7e9c9" stroke="#25614b" stroke-width="8"/><text x="320" y="338" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Cytoplasm</text><text x="717" y="245" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Cell membrane</text><line x1="610" y1="258" x2="492" y2="258" stroke="#173d31" stroke-width="3"/><circle cx="493" cy="258" r="5" fill="#173d31" stroke="none" stroke-width="3"/><text x="717" y="324" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Both are present in</text><text x="717" y="360" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >all living cells.</text><text x="500" y="514" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Generic cell model; no specialised structures are implied.</text><rect x="75" y="560" width="850" height="136" rx="12" fill="#f7efdf" stroke="#daa958" stroke-width="2"/><text x="500.0" y="600" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Cell wall: not universal</text><text x="500.0" y="643" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Animal cells have no cell wall.</text><rect x="75" y="733" width="850" height="136" rx="12" fill="#f7efdf" stroke="#daa958" stroke-width="2"/><text x="500.0" y="773" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Chloroplast: not universal</text><text x="500.0" y="816" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Animals, fungi and bacteria have no chloroplasts.</text><text x="500" y="932" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Count: cytoplasm (1) + cell membrane (1) = 2 structures.</text><rect x="24" y="964" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="998" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer B · 2</text>
</g></svg>