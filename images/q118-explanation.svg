<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1270" viewBox="0 0 1000 1270" role="img" aria-labelledby="q118-title q118-desc">
<title id="q118-title">118 · Let young fish grow and breed before harvesting</title>
<desc id="q118-desc">Answer D: smaller fish are too young to breed. In the simplified fishery model used by the source question, leaving smaller fish allows juveniles to grow to reproductive maturity. Breeding can replace fish removed from the stock, helping sustain future populations and catches. A minimum capture size is one management tool: sustainable fishing also needs protection of enough breeding adults and appropriate limits on catches. The fish silhouettes show stages qualitatively; they do not represent measured fish lengths or a real legal size limit.</desc>
