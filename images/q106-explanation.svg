" r="5" fill="#fffdf7" stroke="#b94a43" stroke-width="2"/><line x1="355" y1="296.0" x2="355" y2="344.0" stroke="#94682c" stroke-width="12"/><circle cx="355" cy="320" r="5" fill="#fffdf7" stroke="#94682c" stroke-width="2"/><line x1="355" y1="421.0" x2="355" y2="469.0" stroke="#94682c" stroke-width="12"/><circle cx="355" cy="445" r="5" fill="#fffdf7" stroke="#94682c" stroke-width="2"/><line x1="855" y1="351.0" x2="855" y2="399.0" stroke="#94682c" stroke-width="12"/><circle cx="855" cy="375" r="5" fill="#fffdf7" stroke="#94682c" stroke-width="2"/><text x="265" y="620" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Diploid nucleus</text><text x="265" y="669" font-size="34" fill="#25614b" font-weight="700" text-anchor="middle" >2n = 8</text><text x="265" y="710" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Four homologous pairs</text><text x="765" y="620" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Haploid nucleus</text><text x="765" y="669" font-size="34" fill="#357ca2" font-weight="700" text-anchor="middle" >n = 4</text><text x="765" y="710" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >One from each pair</text><line x1="483" y1="375" x2="560" y2="375" stroke="#357ca2" stroke-width="5"/><polygon points="560,375 546.6950761583107,381.92668763312224 546.6950761583107,368.07331236687776" fill="#357ca2"/><text x="521" y="331" font-size="24" fill="#173d31" font-weight="700" text-anchor="middle" >Meiosis</text><rect x="65" y="763" width="870" height="130" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500" y="810" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Haploid chromosome number = diploid number ÷ 2</text><text x="500" y="854" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >8 ÷ 2 = 4</text><text x="500" y="951" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Schematic chromosome shapes; count chromosomes per nucleus.</text><rect x="24" y="1004" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1038" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · 4 chromosomes in each haploid nucleus</text>
