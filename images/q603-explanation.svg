<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Ovulation Q; possible fertilisation at R</title><desc id="desc">A 28-day timeline positions P near day 5, Q near day 14, R about one day later and S much later. An ovary releases an egg at Q; a sperm can fertilise it around R. The unfertilised egg has about a 24-hour viable period, so the faded egg at S is too late.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="1.8"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#b85c50" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="38" y="54" font-size="30" fill="#173f32" font-weight="bold">Ovulation Q; possible fertilisation at R</text><line x1="65" y1="399" x2="943" y2="399" stroke="#24644b" stroke-width="4" stroke-linecap="round" /><line x1="65.0" y1="399" x2="65.0" y2="419" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><text x="65.0" y="449" font-size="22" text-anchor="middle" fill="#173f32" font-weight="normal">0</text><line x1="96.1" y1="399" x2="96.1" y2="409" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><line x1="127.2" y1="399" x2="127.2" y2="409" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><line x1="158.3" y1="399" x2="158.3" y2="409" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><line x1="189.4" y1="399" x2="189.4" y2="409" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><line x1="220.5" y1="399" x2="220.5" y2="