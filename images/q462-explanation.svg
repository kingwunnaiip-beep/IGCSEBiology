<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="q462-t q462-d"><title id="q462-t">From gene to mRNA to protein</title><desc id="q462-d">The nucleus contains stage3 gene copying and stage2 mRNA export. In the cytoplasm stage1 ribosome reading precedes stage4 amino acid assembly, with translation reading and assembly coupled.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#1d513d"/></marker></defs><rect width="1000" height="620" rx="24" fill="#fffdf3"/><g font-family="Arial, sans-serif"><text x="45" y="58" font-size="30" text-anchor="start" fill="#173e32" font-weight="bold">From gene to mRNA to protein</text><rect x="45" y="105" width="330" height="425" rx="18" fill="#f8efd4" stroke="#649768" stroke-width="2"/><text x="210" y="145" font-size="27" text-anchor="middle" fill="#173e32" font-weight="bold">NUCLEUS</text><rect x="70" y="180" width="280" height="105" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="210.0" y="222" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">3  Gene copied</text><text x="210.0" y="257" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">DNA → mRNA</text><path d="M210 300 L210 370" stroke="#1d513d" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="70" y="385" width="280" height="95" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="210.0" y="427" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">2  mRNA carries</text><text x="210.0" y="462" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">copy to cytoplasm</text><path d="M385 430 L450 430 L450 230 L480 230" stroke="#1d513d" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="490" y="105" width="465" height="425" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="722" y="145" font-size="27" text-anchor="middle" fill="#173e32" font-weight="bold">CYTOPLASM</text><rect x="530" y="180" width="385" height="105" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="722.5" y="222" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">1  Ribosome reads mRNA</text><path d="M722 300 L722 370" stroke="#1d513d" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="530" y="385" width="385" height="95" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="722.5" y="427" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">4  Amino acids joined</text><text x="722.5" y="462" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">into a protein</text><text x="500" y="559" font-size="28" text-anchor="middle" fill="#173e32" font-weight="bold">Order: 3 → 2 → 1 → 4</text><text x="45" y="589" font-size="18" text-anchor="start" fill="#546d5e" font-weight="normal">Original teaching schematic • qualitative unless values are stated</text></g></svg>