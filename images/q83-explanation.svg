or="middle" >Capillary tube</text><line x1="675" y1="230" x2="675" y2="326" stroke="#357ca2" stroke-width="2"/><rect x="48" y="650" width="904" height="238" rx="12" fill="#eff5e8" stroke="#d1ddce" stroke-width="2"/><text x="500" y="691" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Darkness stops photosynthesis; respiration continues.</text><text x="500" y="738" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >O₂ is consumed + CO₂ is absorbed</text><line x1="500" y1="754" x2="500" y2="782" stroke="#25614b" stroke-width="4"/><polygon points="500,782 493.07331236687776,768.6950761583107 506.92668763312224,768.6950761583107" fill="#25614b"/><text x="500" y="819" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Less gas → lower pressure inside</text><text x="500" y="865" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Assume an airtight apparatus and constant temperature.</text><rect x="24" y="924" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="958" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer B · Ink moves towards the leaf as it respires</text>
