<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">On which cell surface are microvilli found?</title><desc id="desc">Magnified intestinal epithelial surface: microvilli project from the surface facing the gut lumen. This is surface D in the source villus diagram, increasing area for absorption.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700" text-anchor="start" fill="#193e34">On which cell surface are microvilli found?</text><rect x="30" y="125" width="1020" height="245" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="280" y="165" font-size="24" font-weight="700" text-anchor="middle" fill="#193e34">Gut lumen</text><text x="780" y="165" font-size="24" font-weight="700" text-anchor="middle" fill="#193e34">D: exposed cell surface</text><rect x="150" y="240" width="450" height="105" rx="3" fill="#dceadd" stroke="#9fbaab" stroke-width="2"/><path d="M160 240 V202 Q166 190 172 202 V240" fill="#dceadd" stroke="#35735e" stroke-width="2"/><path d="M182 240 V202 Q188 190 194 202 V240" fill="#dceadd" stroke="#35735e" stroke-width="2"/><path d="M204 240 V202 Q210 190 216 202 V240" fill="#dceadd" stroke="#35735e" stroke-width="2"/><path d="M226 240 V202 Q232 190 238 202 V240" fill="#dceadd" stroke="#35735e" stroke-width="2"/><path d="M248 240 V202 Q254 190 260 202 V240" fill="#dceadd" stroke="#35735e" stroke-width="2"/><path d="M270 240 V202 Q276 190 282 202 V240" fill="#dceadd" stroke="#35735e" stroke-width="2"/><path d="M292 240 V202 Q298 190 304 202 V240" fill="#dceadd" stroke="#35735e" stroke-width="2"/><path d="M314 240 V202 Q320 190 326 202 V240" fill="#dceadd" stroke="#35735e" stroke-width="2"/><p