<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="q216-title q216-desc">
<title id="q216-title">Placenta → progesterone and oestrogen</title>
<desc id="q216-desc">Qualitative hormone flow: the placenta releases progesterone and oestrogen, which help maintain the uterine lining in pregnancy. FSH and LH are pituitary hormones. High progesterone and oestrogen inhibit further FSH and LH release.</desc>
