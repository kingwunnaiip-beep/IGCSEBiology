"555" y2="511" stroke="#173d31" stroke-width="2"/><text x="500" y="661" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Illustrative cell features; this is not a species identification.</text><rect x="55" y="738" width="280" height="187" rx="12" fill="#f4efdf" stroke="#daa958" stroke-width="2"/><text x="195.0" y="779" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Prokaryotes</text><text x="195.0" y="822" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >No nucleus</text><rect x="360" y="738" width="280" height="187" rx="12" fill="#f4efdf" stroke="#daa958" stroke-width="2"/><text x="500.0" y="779" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Fungi</text><text x="500.0" y="822" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >No chloroplasts</text><rect x="665" y="738" width="280" height="187" rx="12" fill="#f4efdf" stroke="#daa958" stroke-width="2"/><text x="805.0" y="779" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Plants</text><text x="805.0" y="822" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Multicellular in</text><text x="805.0" y="859" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >the IGCSE scheme</text><rect x="85" y="971" width="830" height="145" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="1012" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Some protoctists are photosynthetic and unicellular</text><text x="500.0" y="1055" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >A cell wall and chloroplasts alone do not make a plant.</text><rect x="24" y="1164" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1198" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · Protoctist</text>
</g></svg>