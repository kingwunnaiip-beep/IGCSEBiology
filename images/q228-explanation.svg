<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1170" viewBox="0 0 1000 1170" role="img" aria-labelledby="q228-title q228-desc">
<title id="q228-title">228 · Two genotypes give blood group B</title>
<desc id="q228-desc">The group-AB mother has genotype IAIB and gametes IA or IB. The heterozygous group-B father has genotype IBIO and gametes IB or IO, with IO the recessive O allele. The top columns show paternal IB and IO; maternal IA and IB form the rows. Cells are IAIB group AB, IAIO group A, IBIB group B and IBIO group B. Two of four equally likely outcomes give blood group B, 50 percent. These are independent-child probabilities, not guaranteed proportions in a family. Answer C.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1170" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >228 · Two genotypes give blood group B</text><text x="500" y="112" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Mother: IᴬIᴮ · Father: IᴮIᴼ</text><text x="500" y="151" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Iᴼ = recessive O allele; Iᴬ and Iᴮ are codominant.</text><text x="590" y="229" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Father’s possible gametes</text><rect x="345" y="490" width="540" height="178" rx="0" fill="#d5e8bc" stroke="none" stroke-width="2"/><line x1="150" y1="264" x2="150" y2="668" stroke="#25614b" stroke-width="2"/><line x1="345" y1="264" x2="345" y2="668" stroke="#25614b" stroke-width="2"/><line x1="615" y1="264" x2="615" y2="668" stroke="#25614b" stroke-width="2"/><line x1="885" y1="264" x2="885" y2="668" stroke="#25614b" stroke-width="2"/><line x1="150" y1="264" x2="885" y2="264" stroke="#25614b" stroke-width="2"/><line x1="150" y1="364" x2="885" y2="364" stroke="#25614b" stroke-width="2"/><line x1="150" y1="490" x2="885" y2="490" stroke="#25614b" stroke-width="2"/><line x1="150" y1="668" x2="885" y2="668" stroke="#25614b" stroke-width="2"/><text x="480" y="330" font-size="32" fill="#173d31" font-weight="700" text-anchor="middle" >Iᴮ</text><text x="750" y="330" font-size="32" fill="#173d31" font-weight="700" text-anchor="middle" >Iᴼ</text><text x="245" y="440" font-size="32" fill="#173d31" font-weight="700" text-anchor="middle" >Iᴬ</text><text x="245" y="585" font-size="32" fill="#173d31" font-weight="700" text-anchor="middle" >Iᴮ</text><text x="480" y="414" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >IᴬIᴮ</text><text x="480" y="458" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Group AB</text><text x="750" y="414" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >IᴬIᴼ</text><text x="750" y="458" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Group A</text><text x="480" y="553" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >IᴮIᴮ</text><text x="480" y="597" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Group B</text><text x="750" y="553" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >IᴮIᴼ</text><text x="750" y="597" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Group B</text><text x="245" y="711" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Mother’s eggs</text><text x="615" y="711" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Both shaded cells have group B.</text><rect x="100" y="764" width="800" height="139" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="805" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >2 group-B outcomes out of 4</text><text x="500.0" y="848" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >2 ÷ 4 × 100 = 50%</text><text x="500" y="967" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >IᴮIᴮ and IᴮIᴼ give the same blood-group phenotype.</text><text x="500" y="1007" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Expected probabilities; not a promised family composition.</text><rect x="24" y="1094" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1128" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · 50% chance of blood group B for each child</text>
</g></svg>