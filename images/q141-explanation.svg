<title id="q141-title">141 · Build the complementary DNA strand</title>
<desc id="q141-desc">Answer D. The given strand is A C T T C A G T C. At the same displayed positions the complementary strand is T G A A G T C A G. A pairs with T and C pairs with G. Nine vertical paired columns align the original and complementary sequences. The diagram retains the source display order; it does not add 5-prime or 3-prime labels not provided by the source. Molecular spacing and colours are illustrative.</desc>
