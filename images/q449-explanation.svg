<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Compare the route to fertilisation</title><desc id="desc">Two parallel process diagrams compare AI, where sperm is introduced and fertilisation occurs inside the body, with IVF, where eggs are harvested, fertilised outside the body, and an embryo is placed in the uterus.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="40" y="54" font-size="31" fill="#173f32" text-anchor="start" font-weight="bold">Compare the route to fertilisation</text><rect x="38" y="109" width="440" height="404" rx="18" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><rect x="522" y="109" width="440" height="404" rx="18" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><text x="258" y="153" font-size="27" fill="#173f32" text-anchor="middle" font-weight="bold">Artificial insemination (AI)</text><text x="742" y="153" font-size="27" fill="#173f32" text-anchor="middle" font-weight="bold">In vitro fertilisation (IVF)</text><rect x="78" y="184" width="360" height="79" rx="12" fill="#fdfbf3" stroke="#24644b" stroke-width="3"/><text x="258" y="215" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">Sperm introduced into</text><text x="258" y="244" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">female reproductive tract</text><path d="M258,266 L258,286" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><rect x="78" y="289" width="360" height="79" rx="12" fill="#fdfbf3" stroke="#24644b" stroke-width="3"/><text x="258" y="320" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">Egg remains inside body</text><path d="M258,371 L258,391" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><rect x="78" y="394" width="360" height="79" rx="12" fill="#fdfbf3" stroke="#24644b" stroke-width="3"/><text x="258" y="425" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">Fertilisation inside body</text><rect x="562" y="184" width="360" height="79" rx="12" fill="#fdfbf3" stroke="#24644b" stroke-width="3"/><text x="742" y="215" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">Egg cells collected</text><text x="742" y="244" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">from ovaries</text><path d="M742,266 L742,286" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><rect x="562" y="289" width="360" height="79" rx="12" fill="#fdfbf3" stroke="#24644b" stroke-width="3"/><text x="742" y="320" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">Fertilisation outside body</text><path d="M742,371 L742,391" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><rect x="562" y="394" width="360" height="79" rx="12" fill="#fdfbf3" stroke="#24644b" stroke-width="3"/><text x="742" y="425" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">Embryo placed in uterus</text><text x="500" y="559" font-size="27" fill="#173f32" text-anchor="middle" font-weight="bold">Egg harvesting distinguishes IVF from AI.</text></g></svg>