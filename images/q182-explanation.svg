<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1120" viewBox="0 0 1000 1120" role="img" aria-labelledby="q182-title q182-desc">
<title id="q182-title">182 · Count complementary DNA bases</title>
<desc id="q182-desc">Answer A. The chromosome section has 4500 total bases and 1450 G bases. In double-stranded DNA G pairs with C, so C is also 1450. G plus C is 2900 bases, leaving 1600 bases for A and T together. A equals T, giving 800 A bases and 800 T bases. The four boxes show exact source-derived counts, not measured molecule sizes.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1120" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >182 · Count complementary DNA bases</text><text x="500" y="112" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >4500 bases in total · G = 1450</text><rect x="65" y="162" width="395" height="173" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="262.5" y="204" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >G = 1450</text><text x="262.5" y="248" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >G pairs with C</text><rect x="540" y="162" width="395" height="173" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="737.5" y="204" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >C = 1450</text><text x="737.5" y="248" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Equal number of C bases</text><line x1="469" y1="249" x2="531" y2="249" stroke="#357ca2" stroke-width="5"/><rect x="95" y="382" width="810" height="140" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="424" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >G + C = 1450 + 1450 = 2900</text><text x="500.0" y="468" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Count both members of every G–C pair.</text><line x1="500" y1="538" x2="500" y2="580" stroke="#25614b" stroke-width="4"/><polygon points="500,580 493.07331236687776,566.6950761583107 506.92668763312224,566.6950761583107" fill="#25614b"/><rect x="95" y="598" width="810" height="140" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="640" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >A + T = 4500 − 2900 = 1600</text><text x="500.0" y="684" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The remainder contains two base types.</text><line x1="500" y1="752" x2="500" y2="792" stroke="#25614b" stroke-width="4"/><polygon points="500,792 493.07331236687776,778.6950761583107 506.92668763312224,778.6950761583107" fill="#25614b"/><rect x="65" y="813" width="395" height="156" rx="12" fill="#f4efdf" stroke="#daa958" stroke-width="2"/><text x="262.5" y="855" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >A = 800</text><text x="262.5" y="899" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >1600 ÷ 2</text><rect x="540" y="813" width="395" height="156" rx="12" fill="#f4efdf" stroke="#daa958" stroke-width="2"/><text x="737.5" y="855" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >T = 800</text><text x="737.5" y="899" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >A pairs with T</text><rect x="24" y="1044" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1078" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer A · 800 A bases · Check: 800 + 800 + 1450 + 1450 = 4500</text>
</g></svg>