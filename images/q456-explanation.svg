<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="q456-t q456-d"><title id="q456-t">Convert units before calculating magnification</title><desc id="q456-d">The actual thickness of 2000 micrometres converts to2 millimetres. A50millimetre image spans25 two-millimetre units. Their ratio is25.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#1d513d"/></marker></defs><rect width="1000" height="620" rx="24" fill="#fffdf3"/><g font-family="Arial, sans-serif"><text x="45" y="58" font-size="30" text-anchor="start" fill="#173e32" font-weight="bold">Convert units before calculating magnification</text><rect x="45" y="100" width="430" height="128" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="260.0" y="142" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">Actual leaf thickness</text><text x="260.0" y="177" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">2000 µm ÷ 1000 = 2 mm</text><rect x="525" y="100" width="430" height="128" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="740.0" y="142" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">Image thickness</text><text x="740.0" y="177" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">50 mm</text><text x="70" y="283" font-size="25" text-anchor="start" fill="#173e32" font-weight="normal">Actual: one 2 mm unit</text><rect x="70" y="300" width="32" height="42" rx="18" fill="#649768" stroke="#649768" stroke-width="2"/><text x="70" y="395" font-size="25" text-anchor="start" fill="#173e32" font-weight="normal">Image: 25 of the same 2 mm units</text><rect x="70" y="415" width="32" height="42" fill="#649768" stroke="#1d513d"/><rect x="102" y="415" width="32" height="42" fill="#e4efde" stroke="#1d513d"/><rect x="134" y="415" width="32" height="42" fill="#649768" stroke="#1d513d"/><rect x="166" y="415" width="32" height="42" fill="#e4efde" stroke="#1d513d"/><rect x="198" y="415" width="32" height="42" fill="#649768" stroke="#1d513d"/><rect x="230" y="415" width="32" height="42" fill="#e4efde" stroke="#1d513d"/><rect x="262" y="415" width="32" height="42" fill="#649768" stroke="#1d513d"/><rect x="294" y="415" width="32" height="42" fill="#e4efde" stroke="#1d513d"/><rect x="326" y="415" width="32" height="42" fill="#649768" stroke="#1d513d"/><rect x="358" y="415" width="32" height="42" fill="#e4efde" stroke="#1d513d"/><rect x="390" y="415" width="32" height="42" fill="#649768" stroke="#1d513d"/><rect x="422" y="415" width="32" height="42" fill="#e4efde" stroke="#1d513d"/><rect x="454" y="415" width="32" height="42" fill="#649768" stroke="#1d513d"/><rect x="486" y="415" width="32" height="42" fill="#e4efde" stroke="#1d513d"/><rect x="518" y="415" width="32" height="42" fill="#649768" stroke="#1d513d"/><rect x="550" y="415" width="32" height="42" fill="#e4efde" stroke="#1d513d"/><rect x="582" y="415" width="32" height="42" fill="#649768" stroke="#1d513d"/><rect x="614" y="415" width="32" height="42" fill="#e4efde" stroke="#1d513d"/><rect x="646" y="415" width="32" height="42" fill="#649768" stroke="#1d513d"/><rect x="678" y="415" width="32" height="42" fill="#e4efde" stroke="#1d513d"/><rect x="710" y="415" width="32" height="42" fill="#649768" stroke="#1d513d"/><rect x="742" y="415" width="32" height="42" fill="#e4efde" stroke="#1d513d"/><rect x="774" y="415" width="32" height="42" fill="#649768" stroke="#1d513d"/><rect x="806" y="415" width="32" height="42" fill="#e4efde" stroke="#1d513d"/><rect x="838" y="415" width="32" height="42" fill="#649768" stroke="#1d513d"/><rect x="130" y="485" width="740" height="67" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="500" y="529" font-size="30" text-anchor="middle" fill="#173e32" font-weight="bold">Magnification = 50 mm ÷ 2 mm = ×25</text><text x="45" y="589" font-size="18" text-anchor="start" fill="#546d5e" font-weight="normal">Original teaching schematic • qualitative unless values are stated</text></g></svg>