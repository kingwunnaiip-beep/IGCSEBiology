<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="q67-title q67-desc">
<title id="q67-title">Three parallel rounds produce eight cells</title>
<desc id="q67-desc">One mitotic cell cycle lasts 3 hours 24 minutes, or 204 minutes. Four countable stages show one cell at 0 minutes, two cells at 204 minutes, four cells at 408 minutes and eight cells at 612 minutes. All cells divide in parallel in each round, assuming identical intervals and no cell loss. The original cell divides and is not an additional ninth cell. Answer B: 612 minutes.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="850" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Three parallel rounds produce eight cells</text><text x="550" y="109" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >One interval = (3 × 60) + 24 = 204 minutes</text><rect x="33" y="178" width="224" height="382" rx="18" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="145" y="224" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Start</text><text x="145" y="268" font-size="26" fill="#357ca2" font-weight="400" text-anchor="middle" >0 min</text><circle cx="145" cy="397" r="23" fill="#dcebd7" stroke="#25614b" stroke-width="3"/><circle cx="145" cy="397" r="7" fill="#357ca2" stroke="none" stroke-width="3"/><text x="145" y="605" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >1 cell</text><line x1="261" y1="390" x2="295" y2="390" stroke="#357ca2" stroke-width="4"/><polygon points="295,390 281.6950761583107,396.92668763312224 281.6950761583107,383.07331236687776" fill="#357ca2"/><rect x="303" y="178" width="224" height="382" rx="18" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="415" y="224" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Round 1</text><text x="415" y="268" font-size="26" fill="#357ca2" font-weight="400" text-anchor="middle" >204 min</text><circle cx="373" cy="397" r="23" fill="#dcebd7" stroke="#25614b" stroke-width="3"/><circle cx="373" cy="397" r="7" fill="#357ca2" stroke="none" stroke-width="3"/><circle cx="457" cy="397" r="23" fill="#dcebd7" stroke="#25614b" stroke-width="3"/><circle cx="457" cy="397" r="7" fill="#357ca2" stroke="none" stroke-width="3"/><text x="415" y="605" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >2 cells</text><line x1="531" y1="390" x2="565" y2="390" stroke="#357ca2" stroke-width="4"/><polygon points="565,390 551.6950761583107,396.92668763312224 551.6950761583107,383.07331236687776" fill="#357ca2"/><rect x="573" y="178" width="224" height="382" rx="18" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="685" y="224" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Round 2</text><text x="685" y="268" font-size="26" fill="#357ca2" font-weight="400" text-anchor="middle" >408 min</text><circle cx="643" cy="355" r="23" fill="#dcebd7" stroke="#25614b" stroke-width="3"/><circle cx="643" cy="355" r="7" fill="#357ca2" stroke="none" stroke-width="3"/><circle cx="727" cy="355" r="23" fill="#dcebd7" stroke="#25614b" stroke-width="3"/><circle cx="727" cy="355" r="7" fill="#357ca2" stroke="none" stroke-width="3"/><circle cx="643" cy="435" r="23" fill="#dcebd7" stroke="#25614b" stroke-width="3"/><circle cx="643" cy="435" r="7" fill="#357ca2" stroke="none" stroke-width="3"/><circle cx="727" cy="435" r="23" fill="#dcebd7" stroke="#25614b" stroke-width="3"/><circle cx="727" cy="435" r="7" fill="#357ca2" stroke="none" stroke-width="3"/><text x="685" y="605" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >4 cells</text><line x1="801" y1="390" x2="835" y2="390" stroke="#357ca2" stroke-width="4"/><polygon points="835,390 821.6950761583107,396.92668763312224 821.6950761583107,383.07331236687776" fill="#357ca2"/><rect x="843" y="178" width="224" height="382" rx="18" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="955" y="224" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Round 3</text><text x="955" y="268" font-size="26" fill="#357ca2" font-weight="400" text-anchor="middle" >612 min</text><circle cx="912" cy="326" r="23" fill="#dcebd7" stroke="#25614b" stroke-width="3"/><circle cx="912" cy="326" r="7" fill="#357ca2" stroke="none" stroke-width="3"/><circle cx="998" cy="326" r="23" fill="#dcebd7" stroke="#25614b" stroke-width="3"/><circle cx="998" cy="326" r="7" fill="#357ca2" stroke="none" stroke-width="3"/><circle cx="912" cy="382" r="23" fill="#dcebd7" stroke="#25614b" stroke-width="3"/><circle cx="912" cy="382" r="7" fill="#357ca2" stroke="none" stroke-width="3"/><circle cx="998" cy="382" r="23" fill="#dcebd7" stroke="#25614b" stroke-width="3"/><circle cx="998" cy="382" r="7" fill="#357ca2" stroke="none" stroke-width="3"/><circle cx="912" cy="438" r="23" fill="#dcebd7" stroke="#25614b" stroke-width="3"/><circle cx="912" cy="438" r="7" fill="#357ca2" stroke="none" stroke-width="3"/><circle cx="998" cy="438" r="23" fill="#dcebd7" stroke="#25614b" stroke-width="3"/><circle cx="998" cy="438" r="7" fill="#357ca2" stroke="none" stroke-width="3"/><circle cx="912" cy="494" r="23" fill="#dcebd7" stroke="#25614b" stroke-width="3"/><circle cx="912" cy="494" r="7" fill="#357ca2" stroke="none" stroke-width="3"/><circle cx="998" cy="494" r="23" fill="#dcebd7" stroke="#25614b" stroke-width="3"/><circle cx="998" cy="494" r="7" fill="#357ca2" stroke="none" stroke-width="3"/><text x="955" y="605" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >8 cells</text><text x="550" y="657" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Each round: all cells divide in the same 204-minute interval.</text><text x="550" y="704" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >3 rounds × 204 minutes = 612 minutes</text><text x="550" y="748" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Eight is the final population; the original is not an extra ninth cell.</text><rect x="24" y="774" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="808" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B — 612 minutes (10 hours 12 minutes)</text>
