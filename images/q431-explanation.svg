<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Two blue heterozygotes produce a 1:2:1 ratio</title><desc id="desc">Punnett square for two heterozygous blue birds. Each produces FB and FW gametes. Four equally likely combinations give one black, two blue and one white offspring genotype.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#39725b"/></marker></defs><rect width="1100" height="560" rx="22" fill="#fbf8e9"/><g font-family="Arial, sans-serif"><text x="40" y="55" font-size="30" text-anchor="start" fill="#173d31">Two blue heterozygotes produce a 1:2:1 ratio</text><text x="550" y="110" font-size="29" text-anchor="middle" fill="#173d31">Blue FᴮFᵂ × blue FᴮFᵂ</text><rect x="330" y="170" width="500" height="270" rx="0" fill="#fffdf4" stroke="#39725b" stroke-width="3"/><line x1="330" y1="260" x2="830" y2="260" stroke="#39725b" stroke-width="4"/><line x1="330" y1="350" x2="830" y2="350" stroke="#39725b" stroke-width="4"/><line x1="495" y1="170" x2="495" y2="440" stroke="#39725b" stroke-width="4"/><line x1="660" y1="170" x2="660" y2="440" stroke="#39725b" stroke-width="4"/><text x="577" y="225" font-size="27" text-anchor="middle" fill="#173d31">Fᴮ</text><text x="745" y="225" font-size="27" text-anchor="middle" fill="#173d31">Fᵂ</text><text x="410" y="315" font-size="27" text-anchor="middle" fill="#173d31">Fᴮ</text><text x="410" y="405" font-size="27" text-anchor="middle" fill="#173d31">Fᵂ</text><text x="577" y="305" font-size="27" text-anchor="middle" fill="#173d31">FᴮFᴮ</text><text x="745" y="305" font-size="27" text-anchor="middle" fill="#173d31">FᴮFᵂ</text><text x="577" y="395" font-size="27" text-anchor="middle" fill="#173d31">FᴮFᵂ</text><text x="745" y="395" font-size="27" text-anchor="middle" fill="#173d31">FᵂFᵂ</text><text x="577" y="335" font-size="21" text-anchor="middle" fill="#173d31">black</text><text x="745" y="335" font-size="21" text-anchor="middle" fill="#173d31">blue</text><text x="577" y="425" font-size="21" text-anchor="middle" fill="#173d31">blue</text><text x="745" y="425" font-size="21" text-anchor="middle" fill="#173d31">white</text><text x="550" y="490" font-size="28" text-anchor="middle" fill="#173d31">25% black : 50% blue : 25% white</text><text x="40" y="530" font-size="17" text-anchor="start" fill="#536b57">Original teaching schematic • qualitative, not to scale</text></g></svg>