<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="730" viewBox="0 0 1120 730" role="img" aria-labelledby="q266-title q266-desc">
<title id="q266-title">Match each large molecule to its building blocks</title>
<desc id="q266-desc">Cellulose and glycogen are built from glucose. Oils are formed from fatty acids and glycerol. Proteins are built from amino acids. Thus source rows one and three are correct.</desc>
