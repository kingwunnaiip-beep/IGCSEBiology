<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1140" viewBox="0 0 1000 1140" role="img" aria-labelledby="q176-title q176-desc">
<title id="q176-title">176 · An affected mother passes Xᵇ to every son</title>
<desc id="q176-desc">For red–green colour blindness, the affected mother isXᵇXᵇ and the unaffected father isXᴮY. Maternal gametes shown as the two rows are bothXᵇ; the two paternal gamete columns areXᴮ andY. The daughters areXᴮXᵇ unaffected carriers; the sons areXᵇY and affected. Since the child is already known to be male, only theY paternal column is relevant; all possible sons are affected, 100%, answerD. The square shows expected probabilities, not a guaranteed family composition.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1140" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >176 · An affected mother passes Xᵇ to every son</text><text x="500" y="111" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Mother: XᵇXᵇ · Father: XᴮY</text><text x="500" y="151" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Xᵇ = colour-blindness allele · Xᴮ = unaffected allele</text><text x="568" y="223" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Father’s possible gametes</text><rect x="612" y="260" width="275" height="416" rx="0" fill="#f8e6da" stroke="none" stroke-width="2"/><line x1="200" y1="260" x2="200" y2="676" stroke="#25614b" stroke-width="2"/><line x1="337" y1="260" x2="337" y2="676" stroke="#25614b" stroke-width="2"/><line x1="612" y1="260" x2="612" y2="676" stroke="#25614b" stroke-width="2"/><line x1="887" y1="260" x2="887" y2="676" stroke="#25614b" stroke-width="2"/><line x1="200" y1="260" x2="887" y2="260" stroke="#25614b" stroke-width="2"/><line x1="200" y1="358" x2="887" y2="358" stroke="#25614b" stroke-width="2"/><line x1="200" y1="517" x2="887" y2="517" stroke="#25614b" stroke-width="2"/><line x1="200" y1="676" x2="887" y2="676" stroke="#25614b" stroke-width="2"/><text x="475" y="326" font-size="32" fill="#173d31" font-weight="700" text-anchor="middle" >Xᴮ</text><text x="749" y="326" font-size="32" fill="#173d31" font-weight="700" text-anchor="middle" >Y</text><text x="267" y="445" font-size="32" fill="#173d31" font-weight="700" text-anchor="middle" >Xᵇ</text><text x="267" y="604" font-size="32" fill="#173d31" font-weight="700" text-anchor="middle" >Xᵇ</text><text x="475" y="414" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >XᴮXᵇ</text><text x="475" y="456" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Daughter: carrier</text><text x="749" y="414" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >XᵇY</text><text x="749" y="456" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Son: affected</text><text x="475" y="573" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >XᴮXᵇ</text><text x="475" y="615" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Daughter: carrier</text><text x="749" y="573" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >XᵇY</text><text x="749" y="615" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Son: affected</text><text x="267" y="726" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Mother’s eggs</text><text x="749" y="726" font-size="24" fill="#b94a43" font-weight="700" text-anchor="middle" >Known male: use this column</text><rect x="95" y="778" width="810" height="141" rx="12" fill="#f8e6da" stroke="#b94a43" stroke-width="2"/><text x="500.0" y="818" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Every possible son is XᵇY</text><text x="500.0" y="860" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Probability among sons = 100%</text><text x="500" y="963" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Do not multiply by the chance of being male.</text><text x="500" y="999" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Expected probabilities; not a promised family ratio.</text><rect x="24" y="1064" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1098" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · 100% of sons are affected</text>
</g></svg>