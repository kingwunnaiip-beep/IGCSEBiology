<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Different routes supply carbon</title><desc id="desc">Plants use carbon dioxide to make glucose in photosynthesis. Animals consume organic food and absorb nutrients after digestion. Both need water and mineral ions.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#24543e"/></marker></defs><rect width="900" height="540" fill="#fbf8ed"/><g font-family="Arial, sans-serif"><text x="450" y="45" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#203e30">Different routes supply carbon</text><rect x="45" y="85" width="385" height="320" rx="14" fill="#e6efdc" stroke="#24543e" stroke-width="2"/><rect x="470" y="85" width="385" height="320" rx="14" fill="#e6efdc" stroke="#24543e" stroke-width="2"/><text x="238" y="125" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#203e30">Plant nutrition</text><text x="663" y="125" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#203e30">Animal nutrition</text><text x="238" y="180" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#203e30">CO₂ + water</text><line x1="238" y1="200" x2="238.0" y2="243.0" stroke="#24543e" stroke-width="3"/><polygon points="238,257 232.0,243.0 244.0,243.0" fill="#24543e"/><text x="238" y="295" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#203e30">Glucose</text><text x="238" y="340" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#203e30">photosynthesis uses light</text><text x="663" y="180" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#203e30">Organic food</text><line x1="663" y1="200" x2="663.0" y2="243.0" stroke="#24543e" stroke-width="3"/><polygon points="663,257 657.0,243.0 669.0,243.0" fill="#24543e"/><text x="663" y="295" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#203e30">Absorbed nutrients</text><text x="663" y="340" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#203e30">digestion breaks up large food</text><text x="450" y="460" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#203e30">Both also absorb water and mineral ions.</text><text x="450" y="495" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#203e30">Carbon source: inorganic CO₂ → plant; organic food → animal.</text></g></svg>