="400" text-anchor="middle" >is required for active transport.</text><text x="500" y="866" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Example: mineral ion uptake by root hair cells.</text><text x="500" y="902" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Symbols show the principle; no measured concentrations are claimed.</text><rect x="24" y="944" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="978" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · Carrier protein: yes · Energy: yes · Low → high: yes</text>
