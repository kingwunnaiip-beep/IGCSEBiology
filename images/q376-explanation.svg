<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">Adding light reveals the limiting factor</title><desc id="desc">Comparison of two heated glasshouses with excess carbon dioxide. Adding artificial light increases tomato yield, identifying light as a limiting factor in condition four. Bars are qualitative.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#245744"/></marker></defs><rect width="1000" height="540" rx="22" fill="#fbf8ed"/><text x="42" y="49" font-family="Arial, sans-serif" font-size="30" text-anchor="start" fill="#183e32" font-weight="bold">Adding light reveals the limiting factor</text><text x="70" y="100" font-family="Arial, sans-serif" font-size="25" text-anchor="start" fill="#183e32" font-weight="bold">Compare conditions 4 and 5</text><rect x="70" y="125" width="375" height="270" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><rect x="555" y="125" width="375" height="270" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><text x="257" y="165" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#183e32" font-weight="bold">4: heated glasshouse</text><text x="257" y="202" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183e32" font-weight="normal">Carbon dioxide in excess</text><text x="742" y="165" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#183e32" font-weight="bold">5: heated glasshouse</text><text x="742" y="202" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183e32" font-weight="normal">Carbon dioxide in excess</text><text x="742" y="239" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#183e32" font-weight="bold">+ artificial light</text><rect x="180" y="290" width="150" height="55" fill="#548c69"/><rect x="665" y="265" width="150" height="80" fill="#245744"/><text x="257" y="377" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183e32" font-weight="normal">Lower fruit production</text><text x="742" y="377" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183e32" font-weight="normal">Higher fruit production</text><path d="M455,270 L542,270" fill="none" stroke="#245744" stroke-width="4" marker-end="url(#arrow)"/><rect x="120" y="420" width="760" height="65" rx="18" fill="#cde1cd" stroke="#548c69" stroke-width="2"/><text x="500" y="460" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#183e32" font-weight="bold">Added light increases yield → light was limiting in 4</text><text x="42" y="518" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#52675b" font-weight="normal">Original teaching schematic • Biology quiz • not to scale</text></svg>