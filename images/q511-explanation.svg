<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="t d"><title id="t">Maltase uses up maltose while glucose forms</title><desc id="d">Starch is converted by amylase to maltose, then maltase converts maltose to glucose. A qualitative falling maltose curve illustrates substrate consumption.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#286c50" stroke-width="1.5"/></marker></defs><rect width="960" height="560" rx="20" fill="#fbf9ed"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="28" text-anchor="start" fill="#173f32">Maltase uses up maltose while glucose forms</text><rect x="45" y="120" width="210" height="75" rx="14" fill="#e0ecda" stroke="#286c50" stroke-width="3"/><text x="150.0" y="165.5" font-size="23" text-anchor="middle" fill="#173f32">Starch</text><path d="M265 158 L350 158" stroke="#286c50" stroke-width="4" fill="none" marker-end="url(#arr)"/><rect x="360" y="120" width="220" height="75" rx="14" fill="#e0ecda" stroke="#286c50" stroke-width="3"/><text x="470.0" y="165.5" font-size="23" text-anchor="middle" fill="#173f32">Maltose</text><path d="M590 158 L675 158" stroke="#286c50" stroke-width="4" fill="none" marker-end="url(#arr)"/><rect x="685" y="120" width="230" height="75" rx="14" fill="#e0ecda" stroke="#286c50" stroke-width="3"/><text x="800.0" y="165.5" font-size="23" text-anchor="middle" fill="#173f32">Glucose</text><text x="306" y="235" font-size="22" text-anchor="middle" fill="#173f32">amylase</text><text x="630" y="235" font-size="22" text-anchor="middle" fill="#173f32">maltase</text><text x="250" y="310" font-size="24" text-anchor="middle" fill="#173f32">Maltose concentration</text><path d="M110 470 L435 470" stroke="#286c50" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M110 470 L110 330" stroke="#286c50" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M135 355 Q250 370 400 450" fill="none" stroke="#286c50" stroke-width="5"/><text x="610" y="370" font-size="26" text-anchor="start" fill="#173f32">Maltose is used up</text><text x="610" y="415" font-size="26" text-anchor="start" fill="#173f32">as glucose forms.</text><text x="480" y="530" font-size="23" text-anchor="middle" fill="#173f32">Falling substrate concentration reveals a reaction consuming it.</text></g></svg>