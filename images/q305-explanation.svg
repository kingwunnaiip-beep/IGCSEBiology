<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="q305-title q305-desc">
<title id="q305-title">Compare diameters in the same unit</title>
<desc id="q305-desc">Frog egg diameter 2.5 millimetres equals 2500 micrometres. Divide 2500 by the human egg diameter of 120 micrometres to obtain about 20.8, which rounds to 21.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="700" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Compare diameters in the same unit</text><rect x="60" y="100" width="450" height="150" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="285.0" y="143" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Frog egg</text><text x="285.0" y="191" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >2.5 mm</text><rect x="610" y="100" width="450" height="150" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="835.0" y="143" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Human egg</text><text x="835.0" y="191" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >120 µm</text><line x1="285" y1="260" x2="285" y2="310" stroke="#25614b" stroke-width="4"/><polygon points="285,310 278.07331236687776,296.6950761583107 291.92668763312224,296.6950761583107" fill="#25614b"/><rect x="60" y="325" width="450" height="150" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="285.0" y="368" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Convert millimetres to µm</text><text x="285.0" y="416" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >2.5 × 1000 = 2500 µm</text><rect x="610" y="325" width="450" height="150" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="835.0" y="368" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Ratio of diameters</text><text x="835.0" y="416" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >2500 ÷ 120 = 20.83…</text><line x1="520" y1="400" x2="600" y2="400" stroke="#25614b" stroke-width="4"/><polygon points="600,400 586.6950761583107,406.92668763312224 586.6950761583107,393.07331236687776" fill="#25614b"/><text x="560" y="545" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >larger diameter ÷ smaller diameter</text><text x="560" y="590" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >The units cancel because both values are in µm.</text><rect x="24" y="624" width="1072" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="560.0" y="658" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Approximately ×21 → option B</text>
</g></svg>