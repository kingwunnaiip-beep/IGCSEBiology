<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Excretion removes a metabolic waste</title><desc id="desc">The liver produces urea while processing excess amino acids. Blood carries urea to the kidneys, and it is excreted in urine. Useful hormones and saliva are secretions, while undigested food leaves by egestion.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#24543e"/></marker></defs><rect width="900" height="540" fill="#fbf8ed"/><g font-family="Arial, sans-serif"><text x="450" y="45" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#203e30">Excretion removes a metabolic waste</text><rect x="50" y="100" width="235" height="195" rx="14" fill="#e6efdc" stroke="#24543e" stroke-width="2"/><rect x="333" y="100" width="235" height="195" rx="14" fill="#e6efdc" stroke="#24543e" stroke-width="2"/><rect x="616" y="100" width="235" height="195" rx="14" fill="#e6efdc" stroke="#24543e" stroke-width="2"/><text x="167" y="143" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" fill="#203e30">Liver</text><text x="167" y="190" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#203e30">Excess amino acids</text><text x="167" y="239" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#203e30">Urea produced</text><line x1="292" y1="204" x2="309.0" y2="204.0" stroke="#24543e" stroke-width="3"/><polygon points="323,204 309.0,210.0 309.0,198.0" fill="#24543e"/><text x="450" y="143" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" fill="#203e30">Blood</text><text x="450" y="197" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#203e30">Carries urea</text><text x="450" y="239" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#203e30">to the kidneys</text><line x1="575" y1="204" x2="591.0" y2="204.0" stroke="#24543e" stroke-width="3"/><polygon points="605,204 591.0,210.0 591.0,198.0" fill="#24543e"/><text x="734" y="143" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" fill="#203e30">Kidneys</text><text x="734" y="197" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#203e30">Urea removed</text><text x="734" y="239" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#203e30">in urine</text><rect x="85" y="340" width="730" height="90" rx="14" fill="#b9d8ae" stroke="#24543e" stroke-width="2"/><text x="450" y="377" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#203e30">Excretion removes metabolic wastes.</text><text x="450" y="411" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#203e30">Urea is a product of metabolism; undigested food is not.</text><text x="450" y="482" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#203e30">Hormones and saliva: useful secretions</text><text x="450" y="516" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#203e30">Undigested food through the anus: egestion</text></g></svg>