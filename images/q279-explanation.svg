<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="q279-title q279-desc">
<title id="q279-title">Water moves from the root surface to xylem</title>
<desc id="q279-desc">A schematic root cross-section marks region 1 at the epidermis, region 2 in the cortex, and region 3 at phloem between xylem arms. A radial arrow leads from soil through epidermis and cortex to xylem, without a required passage through phloem.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="760" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Water moves from the root surface to xylem</text><circle cx="270" cy="330" r="175" fill="#e7f0db" stroke="#25614b" stroke-width="3"/><circle cx="270" cy="330" r="162" fill="#f9fcf3" stroke="#25614b" stroke-width="3"/><circle cx="270" cy="330" r="68" fill="#f1eadf" stroke="#25614b" stroke-width="3"/><path d="M270 265 Q277 315 335 330 Q279 341 270 395 Q261 344 205 330 Q258 319 270 265 Z" fill="#cce4f4" stroke="#357ca2" stroke-width="3"/><circle cx="239" cy="299" r="10" fill="#daa958" stroke="#25614b" stroke-width="1"/><circle cx="301" cy="299" r="10" fill="#daa958" stroke="#25614b" stroke-width="1"/><circle cx="239" cy="361" r="10" fill="#daa958" stroke="#25614b" stroke-width="1"/><circle cx="301" cy="361" r="10" fill="#daa958" stroke="#25614b" stroke-width="1"/><line x1="50" y1="330" x2="248" y2="330" stroke="#357ca2" stroke-width="6"/><polygon points="248,330 234.69507615831074,336.92668763312224 234.69507615831074,323.07331236687776" fill="#357ca2"/><text x="55" y="295" font-size="27" fill="#357ca2" font-weight="700" text-anchor="start" >Water</text><line x1="365" y1="178" x2="420" y2="140" stroke="#25614b" stroke-width="3"/><text x="431" y="147" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >1  Epidermis</text><line x1="385" y1="255" x2="440" y2="230" stroke="#25614b" stroke-width="3"/><text x="450" y="236" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >2  Cortex</text><line x1="301" y1="361" x2="445" y2="425" stroke="#25614b" stroke-width="3"/><text x="456" y="432" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >3  Phloem</text><text x="270" y="552" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Root cross-section</text><rect x="650" y="125" width="370" height="110" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="835.0" y="165" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Region 1</text><text x="835.0" y="207" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Epidermis / root hair cells</text><line x1="835" y1="242" x2="835" y2="280" stroke="#357ca2" stroke-width="4"/><polygon points="835,280 828.0733123668778,266.6950761583107 841.9266876331222,266.6950761583107" fill="#357ca2"/><rect x="650" y="287" width="370" height="110" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="835.0" y="327" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Region 2</text><text x="835.0" y="369" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Cortex cells</text><line x1="835" y1="404" x2="835" y2="442" stroke="#357ca2" stroke-width="4"/><polygon points="835,442 828.0733123668778,428.6950761583107 841.9266876331222,428.6950761583107" fill="#357ca2"/><rect x="650" y="449" width="370" height="110" rx="12" fill="#e5f2f9" stroke="#357ca2" stroke-width="2"/><text x="835.0" y="489" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Xylem</text><text x="835.0" y="531" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Water enters vessels</text><text x="550" y="612" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Phloem transports sugars; it is not a required step on this water route.</text><text x="550" y="646" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >The schematic shows the labelled regions, not their relative sizes.</text><rect x="24" y="684" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="718" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Water must cross regions 1 and 2 to reach the xylem.</text>
</g></svg>