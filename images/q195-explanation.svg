t="700" text-anchor="middle" >Greater total surface area</text><text x="500.0" y="694" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >More exposed food is available for enzyme action.</text><rect x="75" y="793" width="850" height="112" rx="12" fill="#f7efdf" stroke="#daa958" stroke-width="2"/><text x="500.0" y="833" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Food molecules are unchanged by chewing</text><text x="500.0" y="876" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Enzymes carry out chemical digestion.</text><text x="500" y="939" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative food-piece model; sizes and dot counts are illustrative.</text><rect x="24" y="984" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1018" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · The surface area of the food is increased</text>
