<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1260" viewBox="0 0 1000 1260" role="img" aria-labelledby="q124-title q124-desc">
<title id="q124-title">124 · Aerobic respiration occurs in mitochondria</title>
<desc id="q124-desc">Answer A: a mitochondrion is a site of aerobic respiration, which releases energy from glucose using oxygen. The simplified equation is glucose plus oxygen produces carbon dioxide and water, with energy released. A mitochondrion is drawn with an outer membrane and a folded inner membrane; the folds provide a large surface area for reactions involved in aerobic respiration. The diagram is qualitative and not to molecular scale. The nucleus contains genetic instructions, ribosomes make proteins, and a plant cell vacuole contains cell sap.</desc>
