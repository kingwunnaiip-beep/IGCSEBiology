<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="q299-title q299-desc">
<title id="q299-title">Sources export; sinks receive assimilates</title>
<desc id="q299-desc">Palisade mesophyll cells in photosynthesising leaves are sources. Root cortex cells may be sinks when storing assimilates and sources when mobilising stored reserves. Phloem carries sucrose and amino acids. Mature xylem vessels carry water and mineral ions and are neither a source nor a sink for these assimilates.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1200" height="950" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="600.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Sources export; sinks receive assimilates</text><rect x="50" y="110" width="505" height="180" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="302.5" y="150" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Palisade mesophyll cells</text><text x="302.5" y="192" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Photosynthesis supplies sugars</text><text x="302.5" y="228" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Export sucrose: SOURCE</text><rect x="645" y="110" width="505" height="180" rx="12" fill="#eaf4f7" stroke="#357ca2" stroke-width="2"/><text x="897.5" y="150" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Root cortex cells</text><text x="897.5" y="192" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Store incoming assimilates</text><text x="897.5" y="228" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Receiving: SINK</text><line x1="575" y1="194" x2="625" y2="194" stroke="#25614b" stroke-width="4"/><polygon points="625,194 611.6950761583107,200.92668763312224 611.6950761583107,187.07331236687776" fill="#25614b"/><text x="600" y="338" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Phloem translocates sucrose and amino acids.</text><rect x="50" y="405" width="505" height="180" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="302.5" y="445" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Root storage reserves</text><text x="302.5" y="487" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Can be mobilised and exported</text><text x="302.5" y="523" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Supplying: SOURCE</text><rect x="645" y="405" width="505" height="180" rx="12" fill="#eaf4f7" stroke="#357ca2" stroke-width="2"/><text x="897.5" y="445" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Growing tissues</text><text x="897.5" y="487" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Use incoming assimilates</text><text x="897.5" y="523" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Receiving: SINK</text><line x1="575" y1="490" x2="625" y2="490" stroke="#25614b" stroke-width="4"/><polygon points="625,490 611.6950761583107,496.92668763312224 611.6950761583107,483.07331236687776" fill="#25614b"/><rect x="125" y="645" width="950" height="145" rx="12" fill="#f4eedb" stroke="#daa958" stroke-width="2"/><text x="600" y="692" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Xylem vessels: water and mineral-ion transport</text><text x="600" y="740" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Neither a source nor a sink for sucrose and amino acids</text><text x="600" y="836" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >The role of storage tissue can change with the plant’s needs.</text><rect x="24" y="874" width="1152" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="600.0" y="908" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >A — roots: source and sink; xylem: neither; palisade: source</text>
</g></svg>