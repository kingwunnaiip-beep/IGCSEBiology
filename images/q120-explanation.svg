<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400" role="img" aria-labelledby="q120-title q120-desc">
<title id="q120-title">120 · Match sperm abnormalities to their effects</title>
<desc id="q120-desc">Answer B. In the source table, percentages of sperm with no acrosome are normal fertility 2, person P 25 and person Q 2. Percentages with a deformed flagellum are normal 11, P 11 and Q 35. Percentages with few mitochondria are normal 4, P 4 and Q 30. Person P has an excess of sperm without acrosomes, so too many cannot digest the egg’s jelly coat. Person Q has an excess of sperm with deformed flagella and few mitochondria, so too many cannot move to the oviduct. Acrosome enzymes digest the coat; mitochondria release energy by respiration; the flagellum enables movement. The schematic is not to scale, and the table percentages must not be added because the groups may overlap.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1400" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >120 · Match sperm abnormalities to their effects</text><text x="500" y="111" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Compare each person with the normal-fertility reference.</text><rect x="48" y="157" width="904" height="340" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="80" y="207" font-size="26" fill="#173d31" font-weight="700" text-anchor="start" >Sperm abnormality</text><text x="565" y="196" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Normal</text><text x="565" y="230" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >fertility</text><text x="710" y="215" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >P</text><text x="860" y="215" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Q</text><line x1="68" y1="249" x2="932" y2="249" stroke="#526c62" stroke-width="2"/><text x="80" y="301" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >No acrosome</text><text x="565" y="301" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >2%</text><rect x="662" y="268" width="96" height="47" rx="5" fill="#f3d9bb" stroke="none" stroke-width="2"/><text x="710" y="301" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >25%</text><text x="860" y="301" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >2%</text><text x="80" y="378" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >Deformed flagellum</text><text x="565" y="378" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >11%</text><text x="710" y="378" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >11%</text><rect x="812" y="345" width="96" height="47" rx="5" fill="#f3d9bb" stroke="none" stroke-width="2"/><text x="860" y="378" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >35%</text><text x="80" y="455" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >Few mitochondria</text><text x="565" y="455" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >4%</text><text x="710" y="455" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >4%</text><rect x="812" y="422" width="96" height="47" rx="5" fill="#f3d9bb" stroke="none" stroke-width="2"/><text x="860" y="455" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >30%</text><text x="500" y="550" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Highlighted values exceed the normal-fertility reference.</text><rect x="48" y="575" width="904" height="341" rx="12" fill="#edf5f8" stroke="none" stroke-width="2"/><ellipse cx="268" cy="742" rx="70" ry="42" fill="#c9e0eb" stroke="#357ca2" stroke-width="3"/><path d="M 215 714 Q 186 742 215 770 L 234 761 Q 217 742 234 723 Z" fill="#daa958" stroke="#94682c" stroke-width="2"/><rect x="338" y="727" width="112" height="30" rx="7" fill="#d9c3df" stroke="#82618c" stroke-width="2"/><ellipse cx="356" cy="742" rx="6" ry="10" fill="#82618c" stroke="none" stroke-width="3"/><ellipse cx="380" cy="742" rx="6" ry="10" fill="#82618c" stroke="none" stroke-width="3"/><ellipse cx="404" cy="742" rx="6" ry="10" fill="#82618c" stroke="none" stroke-width="3"/><ellipse cx="428" cy="742" rx="6" ry="10" fill="#82618c" stroke="none" stroke-width="3"/><path d="M 451 742 Q 510 695 583 741 Q 659 788 730 742 Q 790 710 841 748" fill="none" stroke="#357ca2" stroke-width="6"/><line x1="225" y1="775" x2="225" y2="794" stroke="#526c62" stroke-width="2"/><text x="225" y="828" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Acrosome</text><text x="225" y="864" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Digests jelly coat</text><line x1="396" y1="775" x2="490" y2="794" stroke="#526c62" stroke-width="2"/><text x="490" y="828" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Mitochondria</text><text x="490" y="864" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Energy released</text><text x="490" y="896" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >by respiration</text><line x1="694" y1="775" x2="790" y2="794" stroke="#526c62" stroke-width="2"/><text x="790" y="828" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Flagellum</text><text x="790" y="864" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Moves sperm</text><rect x="48" y="946" width="430" height="236" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="263" y="992" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >Person P</text><text x="263" y="1050" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >More sperm lack acrosomes.</text><text x="263" y="1092" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Too many cannot digest</text><text x="263" y="1134" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >the jelly coat of the egg.</text><rect x="522" y="946" width="430" height="236" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="737" y="992" font-size="28" fill="#357ca2" font-weight="700" text-anchor="middle" >Person Q</text><text x="737" y="1050" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >More have movement defects.</text><text x="737" y="1092" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Too many cannot move</text><text x="737" y="1134" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >to the oviduct.</text><text x="500" y="1242" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Do not add these percentages: categories may overlap.</text><text x="500" y="1279" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >A higher proportion is affected; this does not mean every sperm is affected.</text><rect x="24" y="1324" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1358" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer B · P: jelly-coat digestion; Q: movement to the oviduct</text>
</g></svg>