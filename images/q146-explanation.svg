<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" role="img" aria-labelledby="q146-title q146-desc">
<title id="q146-title">146 · Variation can be continuous or discontinuous</title>
<desc id="q146-desc">Answer C. Continuous variation is illustrated by a qualitative line from shorter to taller stature, representing a range with intermediates; it is usually influenced by genes and environment. Discontinuous variation is illustrated by four separate cards for ABO blood groups A, B, AB and O, representing distinct categories with no intermediates; it is usually caused by genes only. No frequencies, measurements or distribution curve are shown.</desc>
