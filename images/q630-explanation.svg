<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Sodium: calculate the concentration decrease</title><desc id="desc">A bar graph shows blood plasma and glomerular filtrate at 141 units, and urine at 127. A bracket identifies the 14-unit difference; the decrease relative to 141 is 9.9%. Concentrations alone do not give the total amount reabsorbed.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="53" font-size="30" text-anchor="start" font-weight="bold" fill="#173f32">Sodium: calculate the concentration decrease</text><path d="M110 420 L110 112" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M110 420 L910 420" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="120" y="105" font-size="22" text-anchor="start" font-weight="normal" fill="#173f32">Concentration / arbitrary units</text><line x1="104" y1="420.0" x2="110" y2="420.0" stroke="#24644b" stroke-width="3"/><text x="90" y="427.0" font-size="20" text-anchor="end" font-weight="normal" fill="#173f32">0</text><line x1="112" y1="420.0" x2="880" y2="420.0" stroke="#d5ddd3" stroke-width="1"/><line x1="104" y1="330.0" x2="110" y2="330.0" stroke="#24644b" stroke-width="3"/><text x="90" y="337.0" font-size="20" text-anchor="end" font-weight="normal" fill="#173f32">50</text><line x1="112" y1="330.0" x2="880" y2="330.0" stroke="#d5ddd3" stroke-width="1"/><line x1="104" y1="240.0" x2="110" y2="240.0" stroke="#24644b" stroke-width="3"/><text x="90" y="247.0" font-size="20" text-anchor="end" font-weight="normal" fill="#173f32">100</text><line x1="112" y1="240.0" x2="880" y2="240.0" stroke="#d5ddd3" stroke-width="1"/><line x1="104" y1="150.0" x2="110" y2="150.0" stroke="#24644b" stroke-width="3"/><text x="90" y="157.0" font-size="20" text-anchor="end" font-weight="normal" fill="#173f32">150</text><line x1="112" y1="150.0" x2="880" y2="150.0" stroke="#d5ddd3" stroke-width="1"/><rect x="150" y="166.2" width="120" height="253.8" rx="0" fill="#24644b" stroke="#24644b" stroke-width="3"/><text x="210" y="154.2" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">141</text><text x="210" y="457" font-size="24" text-anchor="middle" font-weight="normal" fill="#173f32">Blood plasma</text><rect x="390" y="166.2" width="120" height="253.8" rx="0" fill="#24644b" stroke="#24644b" stroke-width="3"/><text x="450" y="154.2" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">141</text><text x="450" y="457" font-size="24" text-anchor="middle" font-weight="normal" fill="#173f32">Filtrate</text><rect x="630" y="191.4" width="120" height="228.6" rx="0" fill="#537c9a" stroke="#537c9a" stroke-width="3"/><text x="690" y="179.4" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">127</text><text x="690" y="457" font-size="24" text-anchor="middle" font-weight="normal" fill="#173f32">Urine</text><line x1="770" y1="166.2" x2="790" y2="166.2" stroke="#24644b" stroke-width="3"/><line x1="790" y1="166.2" x2="790" y2="191.4" stroke="#24644b" stroke-width="3"/><line x1="770" y1="191.4" x2="790" y2="191.4" stroke="#24644b" stroke-width="3"/><text x="815" y="195" font-size="22" text-anchor="start" font-weight="normal" fill="#173f32">14 units</text><text x="500" y="548" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">(141 − 127) ÷ 141 × 100 = 9.9%</text><text x="500" y="581" font-size="21" text-anchor="middle" font-weight="normal" fill="#173f32">Total sodium reabsorbed also requires fluid volumes.</text></g></svg>