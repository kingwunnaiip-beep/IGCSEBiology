<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790" role="img" aria-labelledby="q294-title q294-desc">
<title id="q294-title">Why bacteria are useful in genetic engineering</title>
<desc id="q294-desc">A circular plasmid is a small DNA molecule that can act as a gene vector. A shared genetic code lets a transferred gene specify the same amino acid sequence. Statements two, three and four are useful reasons: plasmids, shared code and relatively few ethical concerns. Statement one is false because some bacteria cause disease.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="790" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Why bacteria are useful in genetic engineering</text><circle cx="220" cy="240" r="80" fill="none" stroke="#357ca2" stroke-width="13"/><path d="M 165 183 A 80 80 0 0 1 272 180" fill="none" stroke="#daa958" stroke-width="13"/><text x="220" y="360" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Plasmid: small DNA loop</text><text x="220" y="402" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Can carry a transferred gene</text><line x1="345" y1="245" x2="485" y2="245" stroke="#357ca2" stroke-width="4"/><polygon points="485,245 471.6950761583107,251.92668763312224 471.6950761583107,238.07331236687776" fill="#357ca2"/><rect x="510" y="130" width="535" height="145" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="777.5" y="170" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >Shared genetic code</text><text x="777.5" y="212" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Transferred DNA → amino acid sequence</text><text x="777.5" y="247" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >A gene can specify a human protein.</text><rect x="510" y="315" width="535" height="130" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="777.5" y="355" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >Statement 4</text><text x="777.5" y="397" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Using bacteria raises relatively few</text><text x="777.5" y="432" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >ethical concerns.</text><rect x="70" y="490" width="975" height="140" rx="12" fill="#f8e6de" stroke="#b94a43" stroke-width="2"/><text x="557.5" y="530" font-size="28" fill="#b94a43" font-weight="700" text-anchor="middle" >Statement 1 is false</text><text x="557.5" y="572" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Some bacteria are pathogens; not all bacteria are harmless.</text><text x="557.5" y="607" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Useful reasons: 2 (plasmids), 3 (shared code), 4 (ethical concerns).</text><rect x="24" y="714" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="748" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B: statements 2, 3 and 4.</text>
</g></svg>