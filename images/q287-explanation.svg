<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750" role="img" aria-labelledby="q287-title q287-desc">
<title id="q287-title">Put the changed variable on the x-axis</title>
<desc id="q287-desc">A qualitative bell-shaped graph has pH on the horizontal axis and rate of reaction on the vertical axis. A peak marks the optimum pH. Cards explain that pH is changed and reaction rate is measured; no numerical values are implied.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="750" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Put the changed variable on the x-axis</text><line x1="145" y1="480" x2="650" y2="480" stroke="#173d31" stroke-width="4"/><polygon points="650,480 636.6950761583107,486.92668763312224 636.6950761583107,473.07331236687776" fill="#173d31"/><line x1="145" y1="480" x2="145" y2="145" stroke="#173d31" stroke-width="4"/><polygon points="145,145 151.92668763312224,158.30492384168926 138.07331236687776,158.30492384168926" fill="#173d31"/><path d="M 155 468 C 230 458 265 420 310 280 C 340 170 377 150 402 165 C 450 185 456 305 505 385 C 550 450 590 464 630 470" fill="none" stroke="#357ca2" stroke-width="6"/><text x="400" y="538" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >pH</text><text x="90" y="252" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Rate of</text><text x="90" y="286" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >reaction</text><line x1="430" y1="124" x2="386" y2="166" stroke="#daa958" stroke-width="4"/><polygon points="386,166 390.8414806097774,151.80281487388612 400.40690024081044,161.8237306778255" fill="#daa958"/><text x="445" y="123" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >Optimum pH</text><rect x="710" y="180" width="335" height="145" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="877.5" y="220" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >x-axis: pH</text><text x="877.5" y="262" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The variable changed</text><text x="877.5" y="297" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >by the investigator.</text><rect x="710" y="365" width="335" height="145" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="877.5" y="405" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >y-axis: reaction rate</text><text x="877.5" y="447" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The response measured</text><text x="877.5" y="482" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >in the experiment.</text><text x="550" y="600" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >The curve is qualitative: the source gives no numerical scale.</text><rect x="24" y="674" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="708" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >A: x-axis = pH; y-axis = rate of reaction.</text>
</g></svg>