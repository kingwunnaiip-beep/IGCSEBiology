<svg xmlns="http://www.w3.org/2000/svg" width="800" height="730" viewBox="0 0 800 730" role="img" aria-labelledby="q34-title q34-desc">
<title id="q34-title">Photosynthesis attracts bacteria</title>
<desc id="q34-desc">An illuminated algal cell contains a spiral-shaped chloroplast. Photosynthesis releases oxygen, which diffuses into the surrounding water. Aerobic bacteria gather outside the cell near the chloroplast where oxygen concentration is high.</desc>
