<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which bell jar has the most oxygen and which has the least?</title><desc id="desc">Compare three separate bell jars: P has the most oxygen after net photosynthesis in sunlight, Q is the atmospheric reference, and exhaled air gives R the least oxygen. Answer B.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e" /></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8" /><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Which bell jar has the most oxygen and which has the least?</text><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><circle cx="60" cy="160" r="16" fill="#285d4c" /><text x="60" y="166" font-size="18" font-weight="400" fill="white" text-anchor="middle">P</text><text x="50" y="207" font-size="23" font-weight="700">P: most oxygen</text><text x="50" y="285" font-size="21" font-weight="400">Plant in sunlight:</text><text x="50" y="312" font-size="21" font-weight="400">net O₂ production</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><circle cx="415" cy="160" r="16" fill="#285d4c" /><text x="415" y="166" font-size="18" font-weight="400" fill="white" text-anchor="middle">Q</text><text x="405" y="207" font-size="23" font-weight="700">Q: atmospheric air</text><text x="405" y="285" font-size="21" font-weight="400">Reference oxygen level</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><circle cx="770" cy="160" r="16" fill="#285d4c" /><text x="770" y="166" font-size="18" font-weight="400" fill="white" text-anchor="middle">R</text><text x="760" y="207" font-size="23" font-weight="700">R: least oxygen</text><text x="760" y="285" font-size="21" font-weight="400">Exhaled air has</text><text x="760" y="312" font-size="21" font-weight="400">less oxygen</text></g></svg>