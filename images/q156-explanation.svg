<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1260" viewBox="0 0 1000 1260" role="img" aria-labelledby="q156-title q156-desc">
<title id="q156-title">156 · Leaf features that conserve water</title>
<desc id="q156-desc">Answer C. A leaf suited to a hot dry habitat has few stomata, a thick waxy cuticle and a small surface area. Fewer stomata provide fewer pores for water vapour to leave, the cuticle reduces evaporation through the surface, and a small area limits the surface exposed for water loss. The leaf section is qualitative and the number of pores, cell sizes and cuticle thickness are not measurements. Row A has many stomata; B combines many stomata with a thin cuticle and large surface; D has a thin cuticle and large surface.</desc>
