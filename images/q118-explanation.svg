.9266876331222 652.6950761583107,680.0733123668778" fill="#25614b"/><rect x="672" y="603" width="280" height="165" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="812" y="666" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Offspring support</text><text x="812" y="708" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >future fish stocks</text><rect x="48" y="833" width="904" height="224" rx="12" fill="#f7ead9" stroke="none" stroke-width="2"/><text x="500" y="881" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Sustainability also requires enough breeding adults.</text><text x="500" y="939" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Catch limits • closed breeding seasons • protected areas</text><text x="500" y="982" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Minimum capture size is one part of managing a fishery.</text><text x="500" y="1132" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative stages; no numerical fish length or capture limit is implied.</text><rect x="24" y="1194" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1228" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · Smaller fish are too young to breed</text>
