<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="q211-title q211-desc">
<title id="q211-title">A ratio must be converted back to a length</title>
<desc id="q211-desc">At 0.1 moles per cubic decimetre the source ratio is 1.2. Multiplying the initial 4 cm by 1.2 gives 4.8 cm, option B. Bars show the source initial length and calculated final length.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="680" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >A ratio must be converted back to a length</text><rect x="40" y="90" width="435" height="142" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="257.5" y="130" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Read the source graph</text><text x="257.5" y="172" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >At 0.1 moles per dm³</text><text x="257.5" y="208" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >final ÷ initial = 1.2</text><rect x="525" y="90" width="435" height="142" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="742.5" y="130" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Rearrange the ratio</text><text x="742.5" y="172" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >final = ratio × initial</text><text x="742.5" y="208" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >1.2 × 4 cm = 4.8 cm</text><text x="60" y="292" font-size="26" fill="#173d31" font-weight="700" text-anchor="start" >Initial length</text><rect x="260" y="263" width="400" height="50" rx="6" fill="#dce9f1" stroke="#357ca2" stroke-width="2"/><text x="690" y="296" font-size="28" fill="#357ca2" font-weight="700" text-anchor="start" >4 cm</text><text x="60" y="394" font-size="26" fill="#173d31" font-weight="700" text-anchor="start" >Final length</text><rect x="260" y="365" width="480" height="50" rx="6" fill="#dcebd6" stroke="#25614b" stroke-width="2"/><text x="768" y="399" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >4.8 cm</text><line x1="660" y1="326" x2="660" y2="426" stroke="#526c62" stroke-width="3" stroke-dasharray="5 7"/><line x1="740" y1="326" x2="740" y2="426" stroke="#526c62" stroke-width="3" stroke-dasharray="5 7"/><text x="700" y="459" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >+0.8 cm</text><text x="500" y="515" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >The ratio 1.2 has no unit.</text><text x="500" y="552" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >The final length is 1.2 times the initial length.</text><rect x="24" y="604" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="638" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B — 4.8 cm</text>
</g></svg>