<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="q395-title q395-desc"><title id="q395-title">Enzymes convert substrates into products and are reused</title><desc id="q395-desc">Three stages show substrate binding, a bound substrate, and products leaving. The same green enzyme remains after the reaction and can be reused.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#245943"/></marker></defs><rect width="1000" height="600" rx="24" fill="#fbf9ee"/><g font-family="Arial, sans-serif"><text x="40" y="55" font-size="27" fill="#173e31" text-anchor="start" font-weight="bold">Enzymes convert substrates into products and are reused</text><rect x="35" y="100" width="280" height="340" rx="16" fill="#e5f0df" stroke="#245943" stroke-width="2"/><text x="175" y="140" font-size="23" fill="#173e31" text-anchor="middle" font-weight="bold">Substrate binds</text><path d="M95 325 Q65 225 145 215 L145 260 L205 260 L205 215 Q285 225 255 325 Z" fill="#245943"/><text x="175" y="390" font-size="22" fill="#173e31" text-anchor="middle" font-weight="normal">enzyme</text><rect x="360" y="100" width="280" height="340" rx="16" fill="#e5f0df" stroke="#245943" stroke-width="2"/><text x="500" y="140" font-size="23" fill="#173e31" text-anchor="middle" font-weight="bold">Reaction occurs</text><path d="M420 325 Q390 225 470 215 L470 260 L530 260 L530 215 Q610 225 580 325 Z" fill="#245943"/><text x="500" y="390" font-size="22" fill="#173e31" text-anchor="middle" font-weight="normal">enzyme</text><rect x="685" y="100" width="280" height="340" rx="16" fill="#e5f0df" stroke="#245943" stroke-width="2"/><text x="825" y="140" font-size="23" fill="#173e31" text-anchor="middle" font-weight="bold">Products leave</text><path d="M745 325 Q715 225 795 215 L795 260 L855 260 L855 215 Q935 225 905 325 Z" fill="#245943"/><text x="825" y="390" font-size="22" fill="#173e31" text-anchor="middle" font-weight="normal">enzyme</text><rect x="145" y="168" width="60" height="42" rx="3" fill="#5c95ad" stroke="#5c95ad" stroke-width="2"/><text x="175" y="165" font-size="19" fill="#173e31" text-anchor="middle" font-weight="normal">substrate</text><rect x="470" y="217" width="60" height="42" rx="3" fill="#5c95ad" stroke="#5c95ad" stroke-width="2"/><text x="500" y="190" font-size="19" fill="#173e31" text-anchor="middle" font-weight="normal">bound substrate</text><rect x="780" y="165" width="25" height="38" rx="3" fill="#5c95ad" stroke="#5c95ad" stroke-width="2"/><rect x="822" y="165" width="25" height="38" rx="3" fill="#c68f32" stroke="#c68f32" stroke-width="2"/><path d="M320 285 L352 285" fill="none" stroke="#245943" stroke-width="4" marker-end="url(#arrow)"/><path d="M645 285 L677 285" fill="none" stroke="#245943" stroke-width="4" marker-end="url(#arrow)"/><rect x="95" y="478" width="810" height="77" rx="16" fill="#e5f0df" stroke="#245943" stroke-width="2"/><text x="500" y="511" font-size="26" fill="#173e31" text-anchor="middle" font-weight="bold">Substrate changes → product is formed</text><text x="500" y="543" font-size="23" fill="#173e31" text-anchor="middle" font-weight="normal">The enzyme is unchanged and can catalyse another reaction.</text></g></svg>