<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1260" viewBox="0 0 1000 1260" role="img" aria-labelledby="q207-title q207-desc">
<title id="q207-title">207 · Human choice distinguishes artificial selection</title>
<desc id="q207-desc">Answer C. Artificial selection uses human choice of parents with desired inherited traits. Natural selection involves environmental pressures, including competition for limited resources, contributing to differences in survival and reproduction. Both act on genetic variation, can change population characteristics and can occur over many generations. The correct option describes the selecting mechanism; it does not imply that farm organisms never compete for resources. The two parallel conceptual flows show inherited variation leading to different selection mechanisms and then reproduction. No numerical rate or trait advantage is invented.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
