<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Match the optimum pH to the organ</title><desc id="desc">A qualitative enzyme-activity curve peaks near pH 2 and is labelled as an acidic optimum matching the stomach. The horizontal scale covers pH 1 to 11; no enzyme activity values are invented.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="40" y="54" font-size="31" fill="#173f32" text-anchor="start" font-weight="bold">Match the optimum pH to the organ</text><path d="M150,438 L893,438" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><path d="M150,438 L150,134" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="153" y="112" font-size="24" fill="#173f32" text-anchor="start" font-weight="normal">Enzyme activity</text><text x="530" y="488" font-size="25" fill="#173f32" text-anchor="middle" font-weight="normal">pH</text><path d="M180,438 L180,447" fill="none" stroke="#24644b" stroke-width="2" /><text x="180" y="475" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">1</text><path d="M245,438 L245,447" fill="none" stroke="#24644b" stroke-width="2" /><text x="245" y="475" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">2</text><path d="M310,438 L310,447" fill="none" stroke="#24644b" stroke-width="2" /><text x="310" y="475" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">3</text><path d="M375,438 L375,447" fill="none" stroke="#24644b" stroke-width="2" /><text x="375" y="475" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">4</text><path d="M440,438 L440,447" fill="none" stroke="#24644b" stroke-width="2" /><text x="440" y="475" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">5</text><path d="M505,438 L505,447" fill="none" stroke="#24644b" stroke-width="2" /><text x="505" y="475" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">6</text><path d="M570,438 L570,447" fill="none" stroke="#24644b" stroke-width="2" /><text x="570" y="475" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">7</text><path d="M635,438 L635,447" fill="none" stroke="#24644b" stroke-width="2" /><text x="635" y="475" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">8</text><path d="M700,438 L700,447" fill="none" stroke="#24644b" stroke-width="2" /><text x="700" y="475" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">9</text><path d="M765,438 L765,447" fill="none" stroke="#24644b" stroke-width="2" /><text x="765" y="475" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">10</text><path d="M830,438 L830,447" fill="none" stroke="#24644b" stroke-width="2" /><text x="830" y="475" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">11</text><path d="M180,395 C193,212 207,154 230,173 C259,191 290,349 350,425 C410,438 560,438 830,438" fill="none" stroke="#24644b" stroke-width="7" /><path d="M245,195 L245,438" fill="none" stroke="#537c9a" stroke-width="2" stroke-dasharray="7 6"/><text x="345" y="174" font-size="25" fill="#173f32" text-anchor="start" font-weight="normal">Strongly acidic optimum</text><text x="345" y="211" font-size="25" fill="#173f32" text-anchor="start" font-weight="bold">matches the stomach</text><path d="M336,203 L258,201" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="500" y="550" font-size="23" fill="#173f32" text-anchor="middle" font-weight="normal">Qualitative teaching curve; no numerical activity scale.</text></g></svg>