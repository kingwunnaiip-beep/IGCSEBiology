<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1160" viewBox="0 0 1000 1160" role="img" aria-labelledby="q205-title q205-desc">
<title id="q205-title">205 · Pancreas produces glucagon; liver responds</title>
<desc id="q205-desc">Answer D, pancreas. The conceptual hormone pathway begins with low blood glucose. Alpha cells in the pancreatic islets release glucagon into the bloodstream. Glucagon acts on the liver, where glycogen is converted into glucose and glucose is released into blood, helping blood glucose rise. The producing gland and responding target are different stages. Adrenal glands produce adrenaline, and ovaries produce hormones such as oestrogen and progesterone. Boxes show a qualitative causal sequence, not measured blood-glucose changes or anatomical positions.</desc>
