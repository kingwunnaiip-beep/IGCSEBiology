<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="t392 d392"><title id="t392">From DNA instructions to protein</title><desc id="d392">DNA remains in the nucleus, mRNA carries a copy of a gene to a ribosome, and amino acids are joined to form a protein in the cytoplasm.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#286346"/></marker></defs><rect width="960" height="440" rx="24" fill="#f7f5e9"/><style>text{font-family:Arial,sans-serif;fill:#183b2b;font-size:22px}.title{font-size:29px;font-weight:700}.small{font-size:19px}.strong{font-weight:700}.box{fill:#e0eddc;stroke:#60876b;stroke-width:2}.arrow{fill:none;stroke:#286346;stroke-width:4;marker-end:url(#arrow)}</style><text class="title" x="38" y="50">From DNA instructions to protein</text><rect x="40" y="90" width="276" height="272" rx="27" fill="#e0eddc" stroke="#60876b" stroke-width="3"/><text class="strong" x="66" y="128">NUCLEUS</text><path d="M97 165 C190 175 100 251 193 263 M193 165 C100 175 190 251 97 263" fill="none" stroke="#286346" stroke-width="5"/><path d="M108 180 H180 M126 205 H162 M126 232 H162 M108 251 H180" stroke="#83ac75" stroke-width="3"/><text x="207" y="213">1 DNA</text><path class="arrow" d="M328 222 H453"/><text class="small" x="328" y="189">copy gene</text><text class="strong" x="481" y="129">CYTOPLASM</text><path d="M480 229 Q510 198 540 229 T600 229 T660 229" fill="none" stroke="#60876b" stroke-width="5"/><text x="479" y="181">2 mRNA</text><ellipse cx="631" cy="238" rx="56" ry="40" fill="#a8c99e" stroke="#286346" stroke-width="3"/><text class="small" x="591" y="310">ribosome</text><path class="arrow" d="M756 179 L683 219"/><circle cx="787" cy="155" r="15" fill="#deb66f"/><text x="724" y="115">3 amino acid</text><path d="M663 270 L698 302 L734 334" stroke="#936d30" stroke-width="7"/><g fill="#deb66f" stroke="#936d30" stroke-width="2"><circle cx="663" cy="270" r="13"/><circle cx="698" cy="302" r="13"/><circle cx="734" cy="334" r="13"/></g><text class="small" x="771" y="336">protein chain</text><text x="164" y="408">Instructions are copied; amino acids are assembled in the specified order.</text></svg>