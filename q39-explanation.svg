<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="q39-title q39-desc"><title id="q39-title">Calculate the actual cell diameter</title><desc id="q39-desc">The drawing has a measured diameter of 21 millimetres and a magnification of 3000. Divide image size by magnification to get an actual diameter of 0.007 millimetres, or 7 micrometres. The two cell drawings are schematic and not to scale.</desc><defs><marker id="q39-green-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#397359"/></marker><marker id="q39-blue-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3d79a0"/></marker><marker id="q39-red-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85c5e"/></marker><marker id="q39-gold-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b88838"/></marker></defs><rect width="640" height="420" rx="20" fill="#f8faf6"/><g font-family="Arial, Helvetica, sans-serif"><text x="320" y="42" font-size="32" text-anchor="middle" fill="#223c35" font-weight="bold">Calculate the actual cell diameter</text><text x="171" y="100" font-size="30" text-anchor="middle" fill="#223c35" font-weight="bold">Image</text><text x="483" y="100" font-size="30" text-anchor="middle" fill="#223c35" font-weight="bold">Actual cell</text><ellipse cx="170" cy="207" rx="108" ry="94" fill="#e8efe7" stroke="#397359" stroke-width="3" /><path d="M 127 172 C 106 178 119 207 139 205 C 127 226 148 243 166 225 C 182 249 211 232 198 210 C 227 198 210 175 187 183 C 179 156 151 154 145 176 Z" stroke="#8b7292" stroke-width="3" fill="#c7b7ce" stroke-linecap="round" stroke-linejoin="round" /><circle cx="483" cy="207" r="13" fill="#e8efe7" stroke="#397359" stroke-width="3"/><circle cx="484" cy="208" r="4" fill="#b4a1bd" stroke="none" stroke-width="3"/><path d="M 299 207 H 444" stroke="#397359" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#q39-green-arrow)"/><text x="371" y="166" font-size="30" text-anchor="middle" fill="#223c35" font-weight="bold">÷ 3000</text><path d="M 62 308 H 278" stroke="#223c35" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#q39-green-arrow)" marker-end="url(#q39-green-arrow)"/><path d="M 62 286 V 320 M 278 286 V 320" stroke="#223c35" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="170" y="348" font-size="30" text-anchor="middle" fill="#223c35" font-weight="bold">21 mm</text><text x="483" y="273" font-size="30" text-anchor="middle" fill="#223c35" font-weight="bold">7 µm</text><rect x="26" y="369" width="588" height="42" rx="12" fill="#dcebdd" stroke="none" stroke-width="3"/><text x="320" y="400" font-size="28" text-anchor="middle" fill="#223c35" font-weight="bold">21 mm / 3000 = 0.007 mm = 7 µm</text></g></svg>