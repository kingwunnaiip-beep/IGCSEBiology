ed mother</text><text x="690" y="386" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Aa</text><text x="500" y="476" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Unaffected daughter · aa</text><rect x="48" y="540" width="904" height="126" rx="12" fill="#f6eae4" stroke="none" stroke-width="2"/><text x="75" y="581" font-size="27" fill="#b94a43" font-weight="700" text-anchor="start" >If the disorder were recessive:</text><text x="75" y="624" font-size="27" fill="#173d31" font-weight="400" text-anchor="start" >aa × aa → all aa (affected) · no unaffected child</text><text x="500" y="718" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Dominant model: A = disorder allele · a = normal allele</text><text x="500" y="759" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >An aa child receives a from each parent, so both parents are Aa.</text><text x="582" y="808" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Father’s gametes</text><text x="94" y="1085" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" transform="rotate(-90 94 1085)">Mother’s gametes</text><rect x="169" y="831" width="114" height="76" rx="0" fill="#fffdf7" stroke="#25614b" stroke-width="2"/><rect x="283" y="831" width="286" height="76" rx="0" fill="#dfead5" stroke="#25614b" stroke-width="2"/><text x="426.0" y="882" font-size="33" fill="#173d31" font-weight="700" text-anchor="middle" >A</text><rect x="569" y="831" width="286" height="76" rx="0" fill="#dfead5" stroke="#25614b" stroke-width="2"/><text x="712.0" y="882" font-size="33" fill="#173d31" font-weight="700" text-anchor="middle" >a</text><rect x="169" y="907" width="114" height="180" rx="0" fill="#dfead5" stroke="#25614b" stroke-width="2"/><text x="226.0" y="1008" font-size="33" fill="#173d31" font-weight="700" text-anchor="middle" >A</text><rect x="283" y="907" width="286" height="180" rx="0" fill="#edf3f6" stroke="#25614b" s