<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which labels identify xylem in the leaf, root and stem?</title><desc id="desc">Leaf xylem: 1: Upper part of the leaf vein; Root xylem: 4: Central star-shaped tissue; Stem xylem: 6: Inner side of each vascular bundle</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Which labels identify xylem in the leaf, root and stem?</text><text x="38" y="106" font-size="18" font-weight="400">Identify xylem separately in each cross-section.</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="50" y="190" font-size="23" font-weight="700">Leaf xylem: 1</text><text x="50" y="276" font-size="21" font-weight="400">Upper part of the leaf vein</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="405" y="190" font-size="23" font-weight="700">Root xylem: 4</text><text x="405" y="276" font-size="21" font-weight="400">Central star-shaped tissue</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="760" y="190" font-size="23" font-weight="700">Stem xylem: 6</text><text x="760" y="276" font-size="21" font-weight="400">Inner side of each vascular</text><text x="760" y="303" font-size="21" font-weight="400">bundle</text><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>