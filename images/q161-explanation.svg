nchor="middle" >Qualitative cell sketch · not to scale</text><rect x="75" y="666" width="850" height="150" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="708" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Long extension → larger surface area</text><text x="500.0" y="750" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >More membrane is available for absorption from soil.</text><rect x="75" y="863" width="850" height="150" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="905" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Mineral ions: active transport can be needed</text><text x="500.0" y="947" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Against the gradient → energy from respiration.</text><text x="500" y="1061" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Cilia on cell Q move material; they are not a root hair.</text><rect x="24" y="1104" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1138" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · Cell membrane · Cell R</text>
