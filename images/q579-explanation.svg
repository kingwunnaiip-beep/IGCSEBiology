<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">P is blood capillary; Q is the lacteal</title><desc id="desc">A villus contains blue blood capillary loops P and a gold central lacteal Q; separate incoming arrows associate glucose with blood and fatty-acid digestion products with lymph.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="bluearrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="45" font-size="28" fill="#173f32" text-anchor="start" font-weight="bold">P is blood capillary; Q is the lacteal</text><text x="500" y="555" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">P absorbs glucose into blood; Q is associated with fatty-acid products and the lymph</text><text x="500" y="583" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">route.</text><g transform="translate(500 135) scale(1.05)"><path d="M-130 355 Q-102 285 -96 155 Q-96 5 0 0 Q96 5 96 155 Q102 285 130 355" fill="#f4ead1" stroke="#bc824b" stroke-width="4" /><path d="M-106 355 Q-80 260 -78 150 Q-75 28 0 22 Q75 28 78 150 Q80 260 106 355" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M-12 355 L-12 125 Q-12 80 0 80 Q12 80 12 125 L12 355" fill="#ecd983" stroke="#bc824b" stroke-width="3" /><path d="M-65 355 C-86 260 -58 220 -62 153 C-70 40 70 40 62 153 C58 220 86 260 65 355" fill="none" stroke="#537c9a" stroke-width="7" /><path d="M-62 110 Q0 70 62 110 Q0 150 -62 110" fill="none" stroke="#537c9a" stroke-width="3" /><path d="M-62 155 Q0 115 62 155 Q0 195 -62 155" fill="none" stroke="#537c9a" stroke-width="3" /><path d="M-62 200 Q0 160 62 200 Q0 240 -62 200" fill="none" stroke="#537c9a" stroke-width="3" /><path d="M-62 245 Q0 205 62 245 Q0 285 -62 245" fill="none" stroke="#537c9a" stroke-width="3" /><path d="M-62 290 Q0 250 62 290 Q0 330 -62 290" fill="none" stroke="#537c9a" stroke-width="3" /><path d="M-99 80 L-79 80" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M79 80 L99 80" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M-99 120 L-79 120" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M79 120 L99 120" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M-99 160 L-79 160" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M79 160 L99 160" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M-99 200 L-79 200" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M79 200 L99 200" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M-99 240 L-79 240" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M79 240 L99 240" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M-99 280 L-79 280" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M79 280 L99 280" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M-99 320 L-79 320" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M79 320 L99 320" fill="none" stroke="#bc824b" stroke-width="2" /></g><text x="120" y="160" font-size="26" fill="#537c9a" text-anchor="start" font-weight="bold">Glucose</text><polygon points="140,230 160,218 180,230 180,253 160,265 140,253" fill="#d9eaf1" stroke="#537c9a" stroke-width="3"/><path d="M190 242 L420 280" fill="none" stroke="#537c9a" stroke-width="5" marker-end="url(#bluearrow)" /><text x="130" y="380" font-size="25" fill="#537c9a" text-anchor="start" font-weight="bold">P: blood capillaries</text><path d="M330 374 L424 355" fill="none" stroke="#537c9a" stroke-width="2" /><text x="725" y="160" font-size="25" fill="#bc824b" text-anchor="start" font-weight="bold">Fatty-acid products</text><path d="M740 215 l12 14 l-12 14 l12 14" fill="none" stroke="#bc824b" stroke-width="4" /><path d="M780 215 l12 14 l-12 14 l12 14" fill="none" stroke="#bc824b" stroke-width="4" /><path d="M820 215 l12 14 l-12 14 l12 14" fill="none" stroke="#bc824b" stroke-width="4" /><path d="M730 265 Q635 230 518 282" fill="none" stroke="#bc824b" stroke-width="5" marker-end="url(#arrow)" /><text x="710" y="400" font-size="25" fill="#bc824b" text-anchor="start" font-weight="bold">Q: central lacteal</text><path d="M700 386 L516 374" fill="none" stroke="#bc824b" stroke-width="2" /><text x="780" y="485" font-size="21" fill="#173f32" text-anchor="middle" font-weight="normal">Separate blood</text><text x="780" y="512" font-size="21" fill="#173f32" text-anchor="middle" font-weight="normal">and lymph routes</text></g></svg>