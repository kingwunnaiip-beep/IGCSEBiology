<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Diploid means two complete chromosome sets</title><desc id="desc">A diploid nucleus contains three illustrative matching chromosome pairs, one green set and one blue set. A haploid nucleus contains one of each chromosome type. The three-pair count is an explicit teaching example, not a universal species count.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="40" y="54" font-size="31" fill="#173f32" text-anchor="start" font-weight="bold">Diploid means two complete chromosome sets</text><rect x="40" y="112" width="440" height="389" rx="18" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><rect x="520" y="112" width="440" height="389" rx="18" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><text x="260" y="156" font-size="27" fill="#173f32" text-anchor="middle" font-weight="bold">Diploid: two sets (2n)</text><text x="740" y="156" font-size="27" fill="#173f32" text-anchor="middle" font-weight="bold">Haploid: one set (n)</text><circle cx="260" cy="318" r="129" fill="#f6f8ed" stroke="#24644b" stroke-width="3"/><circle cx="740" cy="318" r="129" fill="#f6f8ed" stroke="#24644b" stroke-width="3"/><path d="M205,248 L205,388" fill="none" stroke="#24644b" stroke-width="8" /><path d="M222,248 L222,388" fill="none" stroke="#537c9a" stroke-width="8" /><path d="M686,248 L686,388" fill="none" stroke="#24644b" stroke-width="8" /><path d="M259,266 L259,370" fill="none" stroke="#24644b" stroke-width="8" /><path d="M276,266 L276,370" fill="none" stroke="#537c9a" stroke-width="8" /><path d="M740,266 L740,370" fill="none" stroke="#24644b" stroke-width="8" /><path d="M313,283 L313,353" fill="none" stroke="#24644b" stroke-width="8" /><path d="M330,283 L330,353" fill="none" stroke="#537c9a" stroke-width="8" /><path d="M794,283 L794,353" fill="none" stroke="#24644b" stroke-width="8" /><text x="260" y="476" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">3 matching pairs in this example</text><text x="740" y="476" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">1 chromosome from each pair</text><text x="500" y="550" font-size="24" fill="#173f32" text-anchor="middle" font-weight="normal">Illustrative species: n = 3; the definition counts sets, not genes.</text></g></svg>