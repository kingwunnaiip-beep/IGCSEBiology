<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Bright light constricts the pupil</title><desc id="desc">Two front-view iris schematics compare a wide pupil in dim light with a smaller pupil in bright light. Contraction of circular muscles and relaxation of radial muscles constrict the pupil, limiting light entering the eye.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#397857"/></marker></defs><rect width="900" height="520" rx="22" fill="#fbfaee"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="28" text-anchor="start" fill="#183e31" font-weight="bold">Bright light constricts the pupil</text><circle cx="235" cy="250" r="120" fill="#a6c58b" stroke="#4c7957" stroke-width="3"/><circle cx="235" cy="250" r="70" fill="#183e31" stroke="none" stroke-width="3"/><circle cx="235" cy="250" r="95" fill="none" stroke="#4c7957" stroke-width="12"/><text x="235" y="105" font-size="25" text-anchor="middle" fill="#183e31" font-weight="bold">Dim light</text><text x="235" y="419" font-size="24" text-anchor="middle" fill="#183e31" font-weight="bold">Wide pupil</text><circle cx="665" cy="250" r="120" fill="#a6c58b" stroke="#4c7957" stroke-width="3"/><circle cx="665" cy="250" r="32" fill="#183e31" stroke="none" stroke-width="3"/><circle cx="665" cy="250" r="95" fill="none" stroke="#4c7957" stroke-width="12"/><text x="665" y="105" font-size="25" text-anchor="middle" fill="#183e31" font-weight="bold">Bright light</text><text x="665" y="419" font-size="24" text-anchor="middle" fill="#183e31" font-weight="bold">Small pupil</text><path d="M390 250 L510 250" fill="none" stroke="#397857" stroke-width="4" marker-end="url(#arrow)"/><text x="450" y="199" font-size="20" text-anchor="middle" fill="#183e31" font-weight="normal">More light</text><text x="450" y="469" font-size="25" text-anchor="middle" fill="#183e31" font-weight="bold">Bright light: circular contract + radial relax</text></g></svg>