19.6950761583107 908.9266876331222,319.6950761583107" fill="#357ca2"/><text x="421" y="368" font-size="24" fill="#357ca2" font-weight="400" text-anchor="middle" >gravity</text><text x="902" y="368" font-size="24" fill="#357ca2" font-weight="400" text-anchor="middle" >gravity</text><text x="260" y="468" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Bends upwards after growth</text><text x="740" y="468" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Continues growing upright</text><line x1="118" y1="540" x2="180" y2="540" stroke="#526c62" stroke-width="5" stroke-dasharray="8 8"/><text x="196" y="549" font-size="24" fill="#526c62" font-weight="400" text-anchor="start" >initial direction</text><line x1="548" y1="540" x2="610" y2="540" stroke="#25614b" stroke-width="7"/><text x="626" y="549" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >after growth</text><text x="500" y="600" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Qualitative model: darkness removes directional light as a confound.</text><text x="500" y="635" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The control is experiment 3; the matched pair is 1 and 3.</text><rect x="24" y="664" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="698" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B — experiments 1 and 3</text>
