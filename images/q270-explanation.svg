<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="q270-title q270-desc">
<title id="q270-title">Antibody and antigen have different roles</title>
<desc id="q270-desc">Lymphocytes produce antibodies. X is an antibody with a binding site complementary to antigen Y on the pathogen surface. Antigens are not antibodies.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="740" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Antibody and antigen have different roles</text><rect x="45" y="110" width="350" height="125" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="220.0" y="152" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Lymphocyte</text><text x="220.0" y="193" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Produces antibodies</text><line x1="395" y1="172" x2="535" y2="172" stroke="#357ca2" stroke-width="4"/><polygon points="535,172 521.6950761583107,178.92668763312224 521.6950761583107,165.07331236687776" fill="#357ca2"/><path d="M565 142 L605 210 L605 280 M605 210 L645 142" fill="none" stroke="#357ca2" stroke-width="20"/><text x="630" y="335" font-size="29" fill="#357ca2" font-weight="700" text-anchor="middle" >X: antibody</text><circle cx="850" cy="410" r="110" fill="#fff0e8" stroke="#b94a43" stroke-width="5"/><rect x="765" y="314" width="35" height="35" rx="0" fill="#fff0e8" stroke="#b94a43" stroke-width="4"/><line x1="780" y1="325" x2="688" y2="390" stroke="#b94a43" stroke-width="3"/><text x="445" y="430" font-size="26" fill="#b94a43" font-weight="400" text-anchor="start" >Y: antigen on</text><text x="445" y="467" font-size="26" fill="#b94a43" font-weight="400" text-anchor="start" >the pathogen surface</text><text x="850" y="420" font-size="28" fill="#b94a43" font-weight="400" text-anchor="middle" >Pathogen</text><line x1="645" y1="142" x2="770" y2="313" stroke="#357ca2" stroke-width="5"/><polygon points="770,313 756.5563525318105,306.34655406942835 767.7402462977518,298.17119312941276" fill="#357ca2"/><text x="840" y="240" font-size="26" fill="#357ca2" font-weight="400" text-anchor="middle" >Specific binding</text><rect x="100" y="550" width="920" height="85" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="560.0" y="592" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Complementary shapes allow antibody–antigen binding.</text><rect x="24" y="664" width="1072" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="560.0" y="698" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C — antibody; lymphocytes; antigen</text>
