584 Q 659 607 750 611 Z" fill="#e3bf72" stroke="#af8a42" stroke-width="2"/><line x1="147" y1="548" x2="836" y2="548" stroke="#b94a43" stroke-width="5"/><polygon points="836,548 822.6950761583107,554.9266876331222 822.6950761583107,541.0733123668778" fill="#b94a43"/><text x="500" y="690" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Narrower lumen → less blood and oxygen reach heart muscle.</text><rect x="75" y="768" width="850" height="125" rx="12" fill="#f8e9df" stroke="#b94a43" stroke-width="2"/><text x="500.0" y="809" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >A clot may block the artery</text><text x="500.0" y="852" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Heart muscle needs oxygen for aerobic respiration.</text><rect x="75" y="939" width="850" height="145" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="980" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >2 · Regular physical activity lowers risk</text><text x="500.0" y="1023" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >A risk factor changes probability; it is not a certainty.</text><text x="500" y="1140" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Artery sketch is qualitative; no measured narrowing is implied.</text><rect x="24" y="1184" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1218" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · Statements 1, 3 and 4 · Age, smoking, stress</text>
