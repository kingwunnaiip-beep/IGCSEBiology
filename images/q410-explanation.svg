<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Reflex control is automatic</title><desc id="desc">A painful stimulus activates a receptor, the central nervous system and a skeletal muscle, which withdraws the hand. The response is automatic even though skeletal muscles can also be used voluntarily. Simplified pathway; neurones are not individually drawn.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#185c44"/></marker></defs><rect width="1000" height="640" rx="24" fill="#faf8ec"/><g font-family="Arial, sans-serif"><text x="40" y="54" font-size="31" text-anchor="start" fill="#193e33" font-weight="bold">Reflex control is automatic</text><text x="500" y="113" font-size="26" text-anchor="middle" fill="#193e33" font-weight="normal">Example: withdrawing a hand from a painful stimulus</text><rect x="45" y="166" width="280" height="120" rx="18" fill="#dcefdc" stroke="#185c44" stroke-width="3"/><text x="185" y="211" font-size="28" text-anchor="middle" fill="#193e33" font-weight="bold">Stimulus</text><text x="185" y="254" font-size="23" text-anchor="middle" fill="#193e33" font-weight="normal">painful contact</text><rect x="360" y="166" width="280" height="120" rx="18" fill="#dcefdc" stroke="#185c44" stroke-width="3"/><text x="500" y="211" font-size="28" text-anchor="middle" fill="#193e33" font-weight="bold">Receptor</text><text x="500" y="254" font-size="23" text-anchor="middle" fill="#193e33" font-weight="normal">detects change</text><rect x="675" y="166" width="280" height="120" rx="18" fill="#dcefdc" stroke="#185c44" stroke-width="3"/><text x="815" y="211" font-size="28" text-anchor="middle" fill="#193e33" font-weight="bold">CNS</text><text x="815" y="254" font-size="23" text-anchor="middle" fill="#193e33" font-weight="normal">coordinates</text><path d="M328 225 L354 225" stroke="#185c44" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M643 225 L669 225" stroke="#185c44" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M815 290 L815 342" stroke="#185c44" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="675" y="350" width="280" height="120" rx="18" fill="#dcefdc" stroke="#185c44" stroke-width="3"/><text x="815" y="397" font-size="27" text-anchor="middle" fill="#193e33" font-weight="bold">Skeletal muscle</text><text x="815" y="440" font-size="24" text-anchor="middle" fill="#193e33" font-weight="normal">contracts</text><path d="M670 411 L555 411" stroke="#185c44" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="85" y="350" width="465" height="120" rx="18" fill="#dcefdc" stroke="#185c44" stroke-width="3"/><text x="317" y="398" font-size="25" text-anchor="middle" fill="#193e33" font-weight="normal">Hand is withdrawn</text><text x="317" y="434" font-size="25" text-anchor="middle" fill="#193e33" font-weight="normal">without a conscious decision</text><rect x="90" y="520" width="820" height="70" rx="18" fill="#dcefdc" stroke="#185c44" stroke-width="3"/><text x="500" y="565" font-size="26" text-anchor="middle" fill="#193e33" font-weight="bold">An automatic response can use a “voluntary” muscle.</text></g></svg>