<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Moderate warming increases enzyme-controlled respiration</title><desc id="desc">A qualitative upward curve from ten to twenty degrees Celsius shows increasing respiration in germinating seeds. The diagram does not specify a doubling or predict rates beyond this interval.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#39725b"/></marker></defs><rect width="1100" height="560" rx="22" fill="#fbf8e9"/><g font-family="Arial, sans-serif"><text x="40" y="55" font-size="30" text-anchor="start" fill="#173d31">Moderate warming increases enzyme-controlled respiration</text><line x1="150" y1="430" x2="950" y2="430" stroke="#39725b" stroke-width="4"/><line x1="150" y1="430" x2="150" y2="130" stroke="#39725b" stroke-width="4"/><text x="550" y="485" font-size="26" text-anchor="middle" fill="#173d31">Temperature / °C</text><text x="155" y="110" font-size="24" text-anchor="start" fill="#173d31">Relative respiration rate</text><path d="M230 390 Q460 355 710 205" fill="none" stroke="#39725b" stroke-width="7"/><line x1="290" y1="378" x2="290" y2="430" stroke="#87b37a" stroke-width="3"/><line x1="710" y1="205" x2="710" y2="430" stroke="#87b37a" stroke-width="3"/><circle cx="290" cy="378" r="9" fill="#87b37a" stroke="#39725b" stroke-width="3"/><circle cx="710" cy="205" r="9" fill="#87b37a" stroke="#39725b" stroke-width="3"/><text x="290" y="463" font-size="24" text-anchor="middle" fill="#173d31">10</text><text x="710" y="463" font-size="24" text-anchor="middle" fill="#173d31">20</text><rect x="565" y="90" width="470" height="95" rx="15" fill="#e4edcf" stroke="#39725b" stroke-width="3"/><text x="800.0" y="132" font-size="25" text-anchor="middle" fill="#173d31">More successful collisions</text><text x="800.0" y="164" font-size="25" text-anchor="middle" fill="#173d31">Faster enzyme-controlled respiration</text><text x="40" y="530" font-size="17" text-anchor="start" fill="#536b57">Original teaching schematic • qualitative, not to scale</text></g></svg>