<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which dish has a higher water potential than the potato tissue?</title><desc id="desc">All sticks start: 10 grid squares long; Higher external water potential: Water enters potato cells; D becomes longer: Net gain by osmosis</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Which dish has a higher water potential than the potato</text><text x="38" y="73" font-size="24" font-weight="700">tissue?</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><circle cx="60" cy="160" r="16" fill="#285d4c"/><text x="60" y="166" text-anchor="middle" font-size="18" fill="white">1</text><text x="50" y="207" font-size="23" font-weight="700">All sticks start</text><text x="50" y="285" font-size="21" font-weight="400">10 grid squares long</text><path d="M345 245 H376" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)"/><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><circle cx="415" cy="160" r="16" fill="#285d4c"/><text x="415" y="166" text-anchor="middle" font-size="18" fill="white">2</text><text x="405" y="207" font-size="23" font-weight="700">Higher external water</text><text x="405" y="236" font-size="23" font-weight="700">potential</text><text x="405" y="285" font-size="21" font-weight="400">Water enters potato cells</text><path d="M700 245 H731" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)"/><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><circle cx="770" cy="160" r="16