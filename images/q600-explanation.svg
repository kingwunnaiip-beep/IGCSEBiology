 stroke="#24644b" stroke-width="2" stroke-linecap="round" /><text x="568" y="478" font-size="25" text-anchor="start" fill="#173f32" font-weight="bold">4 · Male + egg nuclei fuse</text><line x1="548" y1="466" x2="436" y2="450" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><text x="123" y="325" font-size="24" text-anchor="start" fill="#173f32" font-weight="bold">Style</text><line x1="187" y1="317" x2="353" y2="290" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><text x="120" y="462" font-size="24" text-anchor="start" fill="#173f32" font-weight="bold">Ovary</text><line x1="202" y1="453" x2="290" y2="442" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><text x="500" y="558" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">B · Form tube → down style → into ovule → nuclear fusion.</text></g></svg>
