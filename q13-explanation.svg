<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" role="img" aria-labelledby="q13-title q13-desc">
<title id="q13-title">Immediate osmosis between cells P, Q and R</title><desc id="q13-desc">Cell P has water potential minus 360 kPa, Q minus 400 kPa and R minus 340 kPa. Water arrows run from R to P, R to Q and P to Q.</desc>
<defs><marker id="q13-25614b" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L16 8 L0 16 Z" fill="#25614b"/></marker><marker id="q13-357ca2" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L16 8 L0 16 Z" fill="#357ca2"/></marker><marker id="q13-b94a43" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L16 8 L0 16 Z" fill="#b94a43"/></marker><marker id="q13-daa958" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L16 8 L0 16 Z" fill="#daa958"/></marker></defs><rect width="640" height="450" rx="20" fill="#fffdf7"/>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="320" y="39" font-size="30" fill="#173d31" text-anchor="middle" font-weight="600">Water moves to lower potential</text><rect x="36" y="71" width="205" height="111" rx="22" fill="#e9f1e8" stroke="#25614b" stroke-width="3"/><text x="138" y="111" font-size="31" fill="#173d31" text-anchor="middle" font-weight="600">P</text><text x="138" y="155" font-size="28" fill="#173d31" text-anchor="middle" font-weight="600">−360 kPa</text><rect x="399" y="71" width="205" height="111" rx="22" fill="#e9f1e8" stroke="#25614b" stroke-width="3"/><text x="501" y="111" font-size="31" fill="#173d31" text-anchor="middle" font-weight="600">Q</text><text x="501" y="155" font-size="28" fill="#173d31" text-anchor="middle" font-weight="600">−400 kPa</text><rect x="218" y="271" width="205" height="111" rx="22" fill="#e9f1e8" stroke="#25614b" stroke-width="3"/><text x="320" y="311" font-size="31" fill="#173d31" text-anchor="middle" font-weight="600">R</text><text x="320" y="355" font-size="28" fill="#173d31" text-anchor="middle" font-weight="600">−340 kPa</text><path d="M256 125 L381 125" fill="none" stroke="#357ca2" stroke-width="6" marker-end="url(#q13-357ca2)"/><path d="M257 254 L174 199" fill="none" stroke="#357ca2" stroke-width="6" marker-end="url(#q13-357ca2)"/><path d="M388 254 L471 199" fill="none" stroke="#357ca2" stroke-width="6" marker-end="url(#q13-357ca2)"/><text x="135" y="422" font-size="28" fill="#357ca2" text-anchor="middle" font-weight="600">R → P</text><text x="320" y="422" font-size="28" fill="#357ca2" text-anchor="middle" font-weight="600">R → Q</text><text x="505" y="422" font-size="28" fill="#357ca2" text-anchor="middle" font-weight="600">P → Q</text></g></svg>