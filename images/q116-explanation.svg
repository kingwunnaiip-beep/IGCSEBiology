<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1270" viewBox="0 0 1000 1270" role="img" aria-labelledby="q116-title q116-desc">
<title id="q116-title">116 · Artificial insemination places sperm in the uterus</title>
<desc id="q116-desc">Answer B: artificial insemination; uterus. In this original simplified reproductive-tract schematic, sperm are placed in the uterus. Sperm can then travel along an oviduct, where fertilisation can occur inside the body. In vitro fertilisation is different: sperm and eggs are brought together outside the body, and an embryo is then transferred to the uterus. The drawing shows anatomical relationships and processes, not measured anatomy or a clinical procedure.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
