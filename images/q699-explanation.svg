<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">What is the correct sequence of events at the synapse?</title><desc id="desc">Release transmitter: Impulse triggers release from vesicles; Diffuse across gap: Neurotransmitter crosses the synapse; Bind to receptors: On the next neurone’s membrane; Start next impulse: Next neurone is stimulated</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">What is the correct sequence of events at the synapse?</text><rect x="30" y="130" width="225" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><circle cx="60" cy="160" r="16" fill="#285d4c"/><text x="60" y="166" text-anchor="middle" font-size="18" fill="white">2</text><text x="50" y="207" font-size="21" font-weight="700">Release</text><text x="50" y="234" font-size="21" font-weight="700">transmitter</text><text x="50" y="285" font-size="19" font-weight="400">Impulse triggers</text><text x="50" y="310" font-size="19" font-weight="400">release from vesicles</text><rect x="295" y="130" width="225" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><circle cx="325" cy="160" r="16" fill="#285d4c"/><text x="325" y="166" text-anchor="middle" font-size="18" fill="white">4</text><text x="315" y="207" font-size="21" font-weight="700">Diffuse across</text><text x="315" y="234" font-size="21" font-weight="700">gap</text><text x="315" y="285" font-size="19" font-weight="400">Neurotransmitter</text><text x="315" y="310" font-size="19" font-weight="400">crosses the synapse</text><rect x="560" y="130" width="225" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><circle cx="590" cy="160" r="16" fill="#285d4c"/><text x="590" y="166" text-anchor="middle" font-size="18" fill="white">3</text><text x="580" y="207" font-size="21" font-weight="700">Bind to receptors</text><text x="580" y="285" font-size="19" font-weight="400">On the next</text><text x="580" y="310" font-size="19" font-weight="400">neurone’s membrane</text><rect x="825" y="130" width="225" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><circle cx="855" cy="160" r="16" fill="#285d4c"/><text x="855" y="166" text-anchor="middle" font-size="18" fill="white">1</text><text x="845" y="207" font-size="21" font-weight="700">Start next impulse</text><text x="845" y="285" font-size="19" font-weight="400">Next neurone is</text><text x="845" y="310" font-size="19" font-weight="400">stimulated</text><path d="M260 245 H286" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)"/><path d="M525 245 H551" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)"/><path d="M790 245 H816" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)"/><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>