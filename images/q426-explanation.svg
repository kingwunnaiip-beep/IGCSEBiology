<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Amino acids contain carbon, hydrogen, oxygen and nitrogen</title><desc id="desc">General amino acid: a central carbon bonds to hydrogen, an R group, an amino group containing nitrogen and a carboxyl group containing oxygen. Amino acids form proteins.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#39725b"/></marker></defs><rect width="1100" height="560" rx="22" fill="#fbf8e9"/><g font-family="Arial, sans-serif"><text x="40" y="55" font-size="30" text-anchor="start" fill="#173d31">Amino acids contain carbon, hydrogen, oxygen and nitrogen</text><text x="550" y="125" font-size="25" text-anchor="middle" fill="#173d31">General amino-acid structure</text><text x="235" y="290" font-size="42" text-anchor="middle" fill="#173d31">H₂N</text><text x="550" y="290" font-size="46" text-anchor="middle" fill="#173d31">C</text><text x="850" y="290" font-size="42" text-anchor="middle" fill="#173d31">COOH</text><line x1="290" y1="276" x2="505" y2="276" stroke="#39725b" stroke-width="4"/><line x1="590" y1="276" x2="765" y2="276" stroke="#39725b" stroke-width="4"/><line x1="550" y1="240" x2="550" y2="195" stroke="#39725b" stroke-width="4"/><line x1="550" y1="310" x2="550" y2="350" stroke="#39725b" stroke-width="4"/><text x="550" y="175" font-size="35" text-anchor="middle" fill="#173d31">H</text><text x="550" y="390" font-size="29" text-anchor="middle" fill="#173d31">R group</text><text x="235" y="345" font-size="23" text-anchor="middle" fill="#173d31">amino group: nitrogen</text><text x="850" y="345" font-size="23" text-anchor="middle" fill="#173d31">carboxyl group: oxygen</text><rect x="185" y="425" width="730" height="65" rx="15" fill="#e4edcf" stroke="#39725b" stroke-width="3"/><text x="550.0" y="467" font-size="25" text-anchor="middle" fill="#173d31">Proteins contain C, H, O and N</text><text x="40" y="530" font-size="17" text-anchor="start" fill="#536b57">Original teaching schematic • qualitative, not to scale</text></g></svg>