<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1020" viewBox="0 0 1000 1020" role="img" aria-labelledby="q101-title q101-desc">
<title id="q101-title">101 · Active transport moves against a gradient</title>
<desc id="q101-desc">Answer D: active transport requires a protein carrier in the cell membrane and energy from respiration. The carrier moves a substance from a lower concentration to a higher concentration, against its concentration gradient. Two solute particles on the left and eight on the right are illustrative symbols rather than experimental concentrations. A blue arrow shows movement through the membrane carrier from the dilute side into the concentrated side. Respiration supplies the energy. Diffusion instead produces net movement down a concentration gradient without an energy input from respiration. Root hair cells can actively take up mineral ions from dilute soil solution.</desc>
