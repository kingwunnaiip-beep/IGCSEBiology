<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1040" viewBox="0 0 1000 1040" role="img" aria-labelledby="q194-title q194-desc">
<title id="q194-title">194 · Shorter digestion time means a faster reaction</title>
<desc id="q194-desc">Answer D. The original graph plots time taken to digest starch, not reaction rate. Between X and Y the time falls, so the rate rises for a fixed quantity of starch. At Y the time is shortest and the rate is greatest, so Y is the optimum temperature. This diagram explains the inverse relationship without adding temperatures, times or a replacement measured curve.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1040" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >194 · Shorter digestion time means a faster reaction</text><rect x="70" y="115" width="860" height="150" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="155" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >First read the vertical axis</text><text x="500.0" y="198" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The source plots time taken to digest starch.</text><text x="500.0" y="233" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >It does not plot reaction rate.</text><rect x="70" y="318" width="390" height="185" rx="12" fill="#f7efdf" stroke="#daa958" stroke-width="2"/><text x="265.0" y="358" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >At X</text><text x="265.0" y="401" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Longer time</text><text x="265.0" y="436" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Lower reaction rate</text><rect x="540" y="318" width="390" height="185" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="735.0" y="358" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >At Y</text><text x="735.0" y="401" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Shortest time</text><text x="735.0" y="436" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Greatest reaction rate</text><line x1="470" y1="411" x2="530" y2="411" stroke="#25614b" stroke-width="5"/><polygon points="530,411 516.6950761583107,417.92668763312224 516.6950761583107,404.07331236687776" fill="#25614b"/><text x="500" y="572" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Between X and Y: time falls → rate rises</text><rect x="70" y="625" width="860" height="145" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="665" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Same quantity of starch, same endpoint</text><text x="500.0" y="708" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Reaction rate is proportional to 1 ÷ time.</text><text x="500" y="829" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >The optimum temperature gives the fastest digestion.</text><text x="500" y="883" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Therefore the optimum is at Y, the minimum of the time graph.</text><text x="500" y="932" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Interpretation guide; no numerical values or measured curves are added.</text><rect x="24" y="964" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="998" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · Optimum at Y; rate increases from X to Y</text>
</g></svg>