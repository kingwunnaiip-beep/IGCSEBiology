<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Fish stocks recover only after the total ban</title><desc id="desc">The fish-stock line declines before year 11, remains roughly level between the quota and total ban, then rises after year 16. The dashed catch line falls to zero at the ban.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="53" font-size="30" text-anchor="start" font-weight="bold" fill="#173f32">Fish stocks recover only after the total ban</text><path d="M110 440 L110 120" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M110 440 L925 440" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="120" y="105" font-size="24" text-anchor="start" font-weight="normal" fill="#173f32">Mass of fish</text><line x1="110" y1="440" x2="110" y2="448" stroke="#24644b" stroke-width="3"/><text x="110" y="480" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">1</text><line x1="310" y1="440" x2="310" y2="448" stroke="#24644b" stroke-width="3"/><text x="310" y="480" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">6</text><line x1="510" y1="440" x2="510" y2="448" stroke="#24644b" stroke-width="3"/><text x="510" y="480" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">11</text><line x1="710" y1="440" x2="710" y2="448" stroke="#24644b" stroke-width="3"/><text x="710" y="480" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">16</text><line x1="870" y1="440" x2="870" y2="448" stroke="#24644b" stroke-width="3"/><text x="870" y="480" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">20</text><line x1="510" y1="145" x2="510" y2="440" stroke="#d49750" stroke-width="2" stroke-dasharray="6 6"/><line x1="710" y1="145" x2="710" y2="440" stroke="#d49750" stroke-width="2" stroke-dasharray="6 6"/><text x="510" y="130" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">Quota</text><text x="710" y="130" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">Total ban</text><path d="M110 150 L210 245 L310 305 L410 380 L510 405 L700 405 Q785 390 870 305" fill="none" stroke="#24644b" stroke-width="5" /><path d="M110 300 L210 340 L310 365 L410 410 L510 425 L700 425 L710 440 H870" fill="none" stroke="#537c9a" stroke-width="4" stroke-dasharray="10 7"/><line x1="640" y1="181" x2="690" y2="181" stroke="#24644b" stroke-width="5"/><text x="705" y="189" font-size="23" text-anchor="start" font-weight="normal" fill="#173f32">Fish stocks</text><line x1="640" y1="220" x2="690" y2="220" stroke="#537c9a" stroke-width="4" stroke-dasharray="10 7"/><text x="705" y="228" font-size="23" text-anchor="start" font-weight="normal" fill="#173f32">Fish caught</text><ellipse cx="805" cy="330" rx="22.8" ry="10.799999999999999" fill="#e4f0df" stroke="#537c9a" stroke-width="2"/><polygon points="823.0,330 839.8,316.2 839.8,343.8" fill="#e4f0df" stroke="#537c9a" stroke-width="2"/><circle cx="792.4" cy="328.2" r="1.7999999999999998" fill="#173f32" stroke="#173f32" stroke-width="0"/><text x="500" y="512" font-size="22" text-anchor="middle" font-weight="normal" fill="#173f32">Year</text><text x="500" y="548" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">No recovery under the quota; stock increases after year 16.</text></g></svg>