olism slow down.</text><text x="390" y="1049" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >Germination is delayed during storage.</text><text x="390" y="1090" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >Seeds are also commonly stored dry.</text><text x="500" y="1210" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Light is not a universal requirement for germination.</text><rect x="24" y="1264" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1298" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · Low temperature slows germination reactions</text>
