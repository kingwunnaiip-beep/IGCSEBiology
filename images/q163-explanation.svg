<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1160" viewBox="0 0 1000 1160" role="img" aria-labelledby="q163-title q163-desc">
<title id="q163-title">163 · Antigen → lymphocyte → antibody</title>
<desc id="q163-desc">Answer D: antigens on an influenza virus stimulate a response by lymphocytes, which produce antibodies. The source blanks are 1 antigens, 2 lymphocytes and 3 antibodies. An original qualitative schematic depicts a virus with surface antigen symbols, a lymphocyte and antibody symbols. Activated B lymphocytes can become antibody-secreting plasma cells. Shapes and counts are illustrative, not a structural model of influenza or measured immune data.</desc>
