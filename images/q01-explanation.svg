62" stroke="#9b7944" stroke-width="5"/><path d="M 475 248 C 520 210 550 272 593 241 S 680 207 730 239" fill="none" stroke="#9b7944" stroke-width="15"/><text x="607" y="329" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Earthworm moves</text><text x="607" y="363" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >towards the surface</text><line x1="365" y1="245" x2="435" y2="245" stroke="#25614b" stroke-width="4"/><polygon points="435,245 421.6950761583107,251.92668763312224 421.6950761583107,238.07331236687776" fill="#25614b"/><text x="400" y="449" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Stimulus → detection → response</text><rect x="24" y="524" width="752" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="400.0" y="558" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B — Sensitivity</text>
