<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860" role="img" aria-labelledby="q273-title q273-desc">
<title id="q273-title">Read pollen-tube length and growth rate separately</title>
<desc id="q273-desc">The style is two millimetres long, equal to two thousand micrometres. In this experiment pollen from the same plant does not grow through the style. Pollen from another plant does. The source graph is steepest from one point five to two hours, so statement three is false.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="860" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Read pollen-tube length and growth rate separately</text><rect x="60" y="110" width="1000" height="90" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="560.0" y="152" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Style length: 2 mm = 2000 µm</text><rect x="60" y="240" width="470" height="200" rx="12" fill="#fff0e8" stroke="#daa958" stroke-width="2"/><text x="295.0" y="282" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Pollen from the same plant</text><text x="295.0" y="323" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Tube remains far below 2000 µm.</text><text x="295.0" y="358" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >It cannot reach the ovule.</text><text x="295.0" y="393" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >No fertilisation in this experiment.</text><rect x="590" y="240" width="470" height="200" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="825.0" y="282" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Pollen from a different plant</text><text x="825.0" y="323" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Tube exceeds the style length.</text><text x="825.0" y="358" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Male gametes can reach the ovule.</text><text x="825.0" y="393" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >This favours genetic variation.</text><line x1="295" y1="455" x2="295" y2="525" stroke="#daa958" stroke-width="4"/><polygon points="295,525 288.07331236687776,511.6950761583107 301.92668763312224,511.6950761583107" fill="#daa958"/><line x1="825" y1="455" x2="825" y2="525" stroke="#25614b" stroke-width="4"/><polygon points="825,525 818.0733123668778,511.6950761583107 831.9266876331222,511.6950761583107" fill="#25614b"/><rect x="60" y="550" width="1000" height="155" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="560.0" y="592" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Growth rate = gradient, not final length</text><text x="560.0" y="633" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The source curve is steepest between 1.5 and 2.0 hours.</text><text x="560.0" y="668" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Between 2.0 and 4.0 hours it grows more slowly.</text><text x="560" y="752" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Statements 1 and 2 are supported; statement 3 is false.</text><rect x="24" y="784" width="1072" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="560.0" y="818" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B — 1 and 2 only</text>
</g></svg>