<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" role="img" aria-labelledby="q195-title q195-desc">
<title id="q195-title">195 · Chewing exposes more food surface to enzymes</title>
<desc id="q195-desc">Answer C. A qualitative model compares a large piece of food with several smaller pieces after chewing. Coloured dots represent enzymes reaching exposed surfaces. Physical breakdown increases the total surface area without changing food molecules, so enzymes can act at more places. The cube shapes, numbers of pieces and enzyme dots are illustrative, not measured food or reaction data.</desc>
