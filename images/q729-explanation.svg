<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Wilting follows loss of cell turgor</title><desc id="desc">A rooted plant has drooping leaves. Large outward water-loss arrows exceed the smaller uptake arrow. A plant-cell inset shows a smaller vacuole and reduced turgor, with the membrane still at the wall.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">Wilting follows loss of cell turgor</text><path d="M390 415 Q405 325 390 250 M390 275 Q450 245 470 280 M395 305 Q345 270 320 300" fill="none" stroke="#24644b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M390 415 L345 490 M390 415 L415 495 M370 450 L325 470 M403 450 L450 480" fill="none" stroke="#c5824b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M190 420 H590" fill="none" stroke="#c5824b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(470 280) rotate(160) scale(.85)"><g transform="translate(0 0) scale(1)"><path d="M0 0 Q-65 -20 -5 -105 Q55 -45 0 0" fill="#e4f0df" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 0 L-5 -95 M-3 -30 L-27 -53 M-4 -53 L19 -75" fill="none" stroke="#24644b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(320 300) rotate(210) scale(.85)"><g transform="translate(0 0) scale(1)"><path d="M0 0 Q-65 -20 -5 -105 Q55 -45 0 0" fill="#e4f0df" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 0 L-5 -95 M-3 -30 L-27 -53 M-4 -53 L19 -75" fill="none" stroke="#24644b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M390 475 V365" fill="none" stroke="#537c9a" stroke-width="4" marker-end="url(#arrow)"/><text x="195" y="500" font-size="24" fill="#173f32" text-anchor="start" font-weight="700">Lower water uptake</text><path d="M440 230 Q555 180 590 105" fill="none" stroke="#537c9a" stroke-width="8" marker-end="url(#arrow)"/><path d="M390 215 Q315 160 300 110" fill="none" stroke="#537c9a" stroke-width="8" marker-end="url(#arrow)"/><text x="750" y="205" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">Water loss exceeds uptake.</text><text x="750" y="260" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">Cell vacuoles lose water.</text><text x="750" y="315" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">Cells become flaccid.</text><rect x="650" y="375" width="225" height="110" rx="7" fill="#edf0e0" stroke="#24644b" stroke-width="5"/><rect x="658" y="383" width="209" height="94" rx="5" fill="none" stroke="#537c9a" stroke-width="2"/><rect x="685" y="400" width="150" height="62" rx="14" fill="#c7dce5" stroke="#537c9a" stroke-width="3"/><text x="760" y="525" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">Less turgor support</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">C: water loss high; uptake low; cells flaccid</text></g></svg>