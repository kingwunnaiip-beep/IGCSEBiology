<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750" role="img" aria-labelledby="q220-title q220-desc">
<title id="q220-title">Energy is represented by the width of each bar</title>
<desc id="q220-desc">Qualitative pyramid of energy: equal-height bars become narrower from producers through primary, secondary and tertiary consumers. Width, not bar height, represents energy. No measured energy values or transfer efficiencies are supplied. The answer is B.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="750" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Energy is represented by the width of each bar</text><text x="500" y="99" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative model — no measured values or fixed transfer percentage</text><rect x="445" y="159" width="110" height="62" rx="0" fill="#cae2b4" stroke="#25614b" stroke-width="3"/><line x1="563" y1="190" x2="666" y2="190" stroke="#25614b" stroke-width="2"/><text x="682" y="199" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >Tertiary consumers</text><rect x="390" y="244" width="220" height="62" rx="0" fill="#cae2b4" stroke="#25614b" stroke-width="3"/><line x1="618" y1="275" x2="666" y2="275" stroke="#25614b" stroke-width="2"/><text x="682" y="284" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >Secondary consumers</text><rect x="295" y="329" width="410" height="62" rx="0" fill="#cae2b4" stroke="#25614b" stroke-width="3"/><text x="500" y="369" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Primary consumers</text><rect x="170" y="414" width="660" height="62" rx="0" fill="#cae2b4" stroke="#25614b" stroke-width="3"/><text x="500" y="454" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Producers</text><line x1="108" y1="462" x2="108" y2="174" stroke="#357ca2" stroke-width="4"/><polygon points="108,174 114.92668763312224,187.30492384168926 101.07331236687776,187.30492384168926" fill="#357ca2"/><text x="63" y="351" font-size="25" fill="#357ca2" font-weight="400" text-anchor="middle" transform="rotate(-90 63 351)">Higher trophic level</text><line x1="170" y1="500" x2="830" y2="500" stroke="#25614b" stroke-width="3"/><line x1="500" y1="500" x2="170" y2="500" stroke="#25614b" stroke-width="3"/><polygon points="170,500 183.30492384168926,493.07331236687776 183.30492384168926,506.92668763312224" fill="#25614b"/><line x1="500" y1="500" x2="830" y2="500" stroke="#25614b" stroke-width="3"/><polygon points="830,500 816.6950761583107,506.92668763312224 816.6950761583107,493.07331236687776" fill="#25614b"/><text x="500" y="540" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Bar width represents available energy</text><text x="500" y="592" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Less energy is available at each successive trophic level.</text><text x="500" y="628" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Energy is lost from the food chain, including as heat in respiration.</text><rect x="24" y="674" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="708" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B — energy in each trophic level</text>
</g></svg>