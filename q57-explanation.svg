<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="q57-title q57-desc"><title id="q57-title">A competing toxin occupies receptors on the motor neurone</title><desc id="q57-desc">The left diagram shows neurotransmitter binding to a receptor on the postsynaptic motor neurone and allowing an impulse. On the right, a toxin with a matching binding shape occupies the receptor without activating it. The transmitter cannot bind, so the muscle activation signal is blocked. This is a neurone-to-motor-neurone synapse.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#537b61"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#b85b4f"/></marker><marker id="ay" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#e4bd55"/></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#668d9c"/></marker></defs><rect width="640" height="420" rx="20" fill="#f3f6ed"/><g font-family="Arial, Helvetica, sans-serif"><text x="320" y="40" fill="#243d32" text-anchor="middle" font-size="30" font-weight="700">Neurone → motor neurone synapse</text><text x="160" y="88" fill="#243d32" text-anchor="middle" font-size="30" font-weight="700">Normal</text><text x="480" y="88" fill="#b85b4f" text-anchor="middle" font-size="30" font-weight="700">Toxin blocks</text><path d="M130 112 V142 Q71 152 74 193 H246 Q249 152 190 142 V112" fill="#b4ceb1" stroke="#345c46" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="42" y="266" width="236" height="73" rx="16" fill="#d5e1cf" stroke="#345c46" stroke-width="3"/><text x="160" y="315" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">Motor neurone</text><path d="M141 266 V245 H148 V260 H172 V245 H179 V266" fill="#b4ceb1" stroke="#345c46" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="122" cy="173" r="7" fill="#537b61" stroke="none" stroke-width="3"/><circle cx="177" cy="176" r="7" fill="#537b61" stroke="none" stroke-width="3"/><circle cx="199" cy="159" r="7" fill="#537b61" stroke="none" stroke-width="3"/><path d="M450 112 V142 Q391 152 394 193 H566 Q569 152 510 142 V112" fill="#b4ceb1" stroke="#345c46" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="362" y="266" width="236" height="73" rx="16" fill="#d5e1cf" stroke="#345c46" stroke-width="3"/><text x="480" y="315" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">Motor neurone</text><path d="M461 266 V245 H468 V260 H492 V245 H499 V266" fill="#b4ceb1" stroke="#345c46" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="442" cy="173" r="7" fill="#537b61" stroke="none" stroke-width="3"/><circle cx="497" cy="176" r="7" fill="#537b61" stroke="none" stroke-width="3"/><circle cx="519" cy="159" r="7" fill="#537b61" stroke="none" stroke-width="3"/><circle cx="160" cy="249" r="10" fill="#537b61" stroke="#345c46" stroke-width="2"/><line x1="160" y1="205" x2="160" y2="231" stroke="#537b61" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><line x1="96" y1="355" x2="218" y2="355" stroke="#537b61" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><text x="160" y="389" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">Impulse passes</text><circle cx="480" cy="249" r="10" fill="#b85b4f" stroke="#b85b4f" stroke-width="2"/><circle cx="513" cy="218" r="10" fill="#537b61" stroke="#345c46" stroke-width="2"/><line x1="511" y1="203" x2="511" y2="234" stroke="#b85b4f" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><path d="M504 231 L518 245 M518 231 L504 245" fill="none" stroke="#b85b4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="480" y="389" fill="#b85b4f" text-anchor="middle" font-size="28" font-weight="500">Impulse blocked</text></g></svg>