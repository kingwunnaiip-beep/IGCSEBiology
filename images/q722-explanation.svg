<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Adrenaline releases glucose from liver glycogen</title><desc id="desc">A liver contains a branched glycogen chain. Its glucose units are released and move into a blood vessel after adrenaline stimulates glycogen breakdown.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">Adrenaline releases glucose from liver glycogen</text><path d="M85 250 C125 160 360 140 420 235 C450 310 325 347 230 330 C155 345 80 320 85 250 Z" fill="#dcb293" stroke="#c5824b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="140" font-size="29" fill="#173f32" text-anchor="middle" font-weight="700">Liver</text><circle cx="170" cy="230" r="14" fill="#e6c276" stroke="#c5824b" stroke-width="2"/><circle cx="210" cy="230" r="14" fill="#e6c276" stroke="#c5824b" stroke-width="2"/><circle cx="250" cy="230" r="14" fill="#e6c276" stroke="#c5824b" stroke-width="2"/><circle cx="290" cy="230" r="14" fill="#e6c276" stroke="#c5824b" stroke-width="2"/><circle cx="210" cy="270" r="14" fill="#e6c276" stroke="#c5824b" stroke-width="2"/><circle cx="250" cy="270" r="14" fill="#e6c276" stroke="#c5824b" stroke-width="2"/><path d="M170 230 H290 M210 230 V270 H250 V230" fill="none" stroke="#c5824b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="308" font-size="23" fill="#173f32" text-anchor="middle" font-weight="700">Stored glycogen</text><path d="M400 270 H550" fill="none" stroke="#24644b" stroke-width="5" marker-end="url(#arrow)"/><text x="480" y="225" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">Adrenaline</text><text x="480" y="250" font-size="21" fill="#173f32" text-anchor="middle" font-weight="400">stimulates breakdown</text><rect x="575" y="365" width="360" height="95" rx="45" fill="#dbe8ec" stroke="#537c9a" stroke-width="4"/><path d="M620 410 H900" fill="none" stroke="#24644b" stroke-width="5" marker-end="url(#arrow)"/><polygon points="630.0,245.0 620.0,262.3205080756888 600.0,262.3205080756888 590.0,245.0 600.0,227.67949192431124 620.0,227.67949192431124" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><polygon points="740.0,275.0 730.0,292.3205080756888 710.0,292.3205080756888 700.0,275.0 710.0,257.6794919243112 730.0,257.6794919243112" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><polygon points="850.0,240.0 840.0,257.3205080756888 820.0,257.3205080756888 810.0,240.0 820.0,222.67949192431124 840.0,222.67949192431124" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><polygon points="710.0,410.0 700.0,427.3205080756888 680.0,427.3205080756888 670.0,410.0 680.0,392.6794919243112 700.0,392.6794919243112" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><polygon points="810.0,405.0 800.0,422.3205080756888 780.0,422.3205080756888 770.0,405.0 780.0,387.6794919243112 800.0,387.6794919243112" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><polygon points="900.0,415.0 890.0,432.3205080756888 870.0,432.3205080756888 860.0,415.0 870.0,397.6794919243112 890.0,397.6794919243112" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><path d="M720 305 V350" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="760" y="505" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">Blood glucose concentration rises.</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">D: more glycogen is converted to glucose</text></g></svg>