<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="q231-title q231-desc">
<title id="q231-title">Two pairs of antennae identify crustaceans</title>
<desc id="q231-desc">Qualitative antenna-pair comparison: arachnids none, crustaceans two pairs, insects one pair and myriapods one pair. A symbolic head illustrates four antennae as two pairs, not four pairs.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="720" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Two pairs of antennae identify crustaceans</text><text x="500" y="97" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Use the antenna feature, rather than the total leg count.</text><rect x="40" y="126" width="440" height="414" rx="12" fill="white" stroke="#25614b" stroke-width="2"/><text x="260" y="170" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Symbolic crustacean head</text><ellipse cx="260" cy="360" rx="76" ry="83" fill="#eff5e8" stroke="#25614b" stroke-width="3"/><path d="M235 305 Q190 240 110 222" fill="none" stroke="#25614b" stroke-width="5"/><path d="M285 305 Q330 240 410 222" fill="none" stroke="#25614b" stroke-width="5"/><path d="M240 292 Q220 218 208 197" fill="none" stroke="#357ca2" stroke-width="5"/><path d="M280 292 Q300 218 312 197" fill="none" stroke="#357ca2" stroke-width="5"/><circle cx="232" cy="335" r="5" fill="#173d31" stroke="#173d31" stroke-width="3"/><circle cx="288" cy="335" r="5" fill="#173d31" stroke="#173d31" stroke-width="3"/><text x="260" y="483" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >4 antennae = 2 pairs</text><rect x="520" y="135" width="440" height="84" rx="12" fill="white" stroke="#526c62" stroke-width="2"/><text x="544" y="186" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >Arachnids</text><text x="932" y="186" font-size="26" fill="#173d31" font-weight="400" text-anchor="end" >0 pairs</text><rect x="520" y="235" width="440" height="84" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="544" y="286" font-size="26" fill="#173d31" font-weight="700" text-anchor="start" >Crustaceans</text><text x="932" y="286" font-size="26" fill="#173d31" font-weight="700" text-anchor="end" >2 pairs</text><rect x="520" y="335" width="440" height="84" rx="12" fill="white" stroke="#526c62" stroke-width="2"/><text x="544" y="386" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >Insects</text><text x="932" y="386" font-size="26" fill="#173d31" font-weight="400" text-anchor="end" >1 pair</text><rect x="520" y="435" width="440" height="84" rx="12" fill="white" stroke="#526c62" stroke-width="2"/><text x="544" y="486" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >Myriapods</text><text x="932" y="486" font-size="26" fill="#173d31" font-weight="400" text-anchor="end" >1 pair</text><text x="500" y="586" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Two pairs means four antennae, not four pairs.</text><text x="500" y="620" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Antennae arise from the head; legs are different appendages.</text><rect x="24" y="644" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="678" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B — crustaceans</text>
</g></svg>