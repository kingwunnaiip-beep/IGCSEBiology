<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="q301-title q301-desc">
<title id="q301-title">Balance anaerobic respiration in yeast</title>
<desc id="q301-desc">Glucose C6H12O6 forms two ethanol molecules C2H5OH and two carbon dioxide molecules CO2. Each ethanol has five hydrogens attached to the carbon part and one in its OH group, so the source subscript Z is five, although the molecule contains six hydrogens in total.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1200" height="900" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="600.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Balance anaerobic respiration in yeast</text><rect x="70" y="110" width="1060" height="120" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="600" y="161" font-size="45" fill="#173d31" font-weight="700" text-anchor="middle" >C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂</text><text x="350" y="207" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >glucose</text><text x="640" y="207" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >ethanol</text><text x="920" y="207" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >carbon dioxide</text><rect x="80" y="285" width="440" height="200" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="300.0" y="325" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >One ethanol: C₂H₅OH</text><text x="300.0" y="367" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >5 H in the C₂H₅ part</text><text x="300.0" y="403" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >+ 1 H in the OH group</text><text x="300.0" y="439" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >= 6 H in the molecule</text><rect x="640" y="285" width="480" height="200" rx="12" fill="#eaf4f7" stroke="#357ca2" stroke-width="2"/><text x="880.0" y="325" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Match the source symbols</text><text x="880.0" y="367" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >W = 6     X = 12</text><text x="880.0" y="403" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Y = 2     Z = 5</text><text x="600" y="551" font-size="31" fill="#173d31" font-weight="700" text-anchor="middle" >Check totals on each side</text><rect x="70" y="590" width="310" height="160" rx="12" fill="#f9f4e7" stroke="#daa958" stroke-width="2"/><text x="225.0" y="630" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Carbon</text><text x="225.0" y="672" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Left: 6</text><text x="225.0" y="708" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Right: 2×2 + 2×1 = 6</text><rect x="445" y="590" width="310" height="160" rx="12" fill="#f9f4e7" stroke="#daa958" stroke-width="2"/><text x="600.0" y="630" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Hydrogen</text><text x="600.0" y="672" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Left: 12</text><text x="600.0" y="708" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Right: 2×(5+1) = 12</text><rect x="820" y="590" width="310" height="160" rx="12" fill="#f9f4e7" stroke="#daa958" stroke-width="2"/><text x="975.0" y="630" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Oxygen</text><text x="975.0" y="672" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Left: 6</text><text x="975.0" y="708" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Right: 2×1 + 2×2 = 6</text><text x="600" y="797" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Do not forget the H written in the OH group.</text><rect x="24" y="824" width="1152" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="600.0" y="858" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B — Z = 5</text>
</g></svg>