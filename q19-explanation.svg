<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-labelledby="q19-title q19-desc"><title id="q19-title">Oxygenated blood in fish and mammal circulation</title><desc id="q19-desc">Red arrows show oxygenated blood. In fish, S carries blood from the gills to the body. In mammals, Y carries blood from the lungs to the heart. Blue arrows show deoxygenated routes R, T, X and Z.</desc><defs><marker id="a-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#25614b"/></marker><marker id="a-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#357ca2"/></marker><marker id="a-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b94a43"/></marker><marker id="a-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d5a545"/></marker></defs><rect width="640" height="460" rx="20" fill="#fffdf7"/><g font-family="Arial, Helvetica, sans-serif"><text x="320" y="41" font-size="30" fill="#173d31" text-anchor="middle" font-weight="700">S and Y carry oxygenated blood</text><text x="152" y="87" font-size="30" fill="#173d31" text-anchor="middle" font-weight="700">Fish</text><text x="478" y="87" font-size="30" fill="#173d31" text-anchor="middle" font-weight="700">Mammal</text><path d="M320 100 L320 409" fill="none" stroke="#dce3d7" stroke-width="2"/><rect x="33" y="155" width="108" height="58" rx="15" fill="#e8f1e5" stroke="#25614b" stroke-width="3"/><text x="87" y="193" font-size="28" fill="#173d31" text-anchor="middle" font-weight="500">Gills</text><rect x="188" y="155" width="108" height="58" rx="15" fill="#e8f1e5" stroke="#25614b" stroke-width="3"/><text x="242" y="193" font-size="28" fill="#173d31" text-anchor="middle" font-weight="500">Body</text><rect x="102" y="322" width="108" height="58" rx="15" fill="#e8f1e5" stroke="#25614b" stroke-width="3"/><text x="156" y="360" font-size="28" fill="#173d31" text-anchor="middle" font-weight="500">Heart</text><path d="M146 184 H181" fill="none" stroke="#b94a43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-r)"/><text x="163" y="145" font-size="30" fill="#b94a43" text-anchor="middle" font-weight="700">S</text><path d="M121 322 C64 300 53 269 65 226" fill="none" stroke="#357ca2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-b)"/><text x="53" y="291" font-size="28" fill="#357ca2" text-anchor="middle" font-weight="500">R</text><path d="M261 226 C276 273 252 312 218 336" fill="none" stroke="#357ca2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-b)"/><text x="270" y="291" font-size="28" fill="#357ca2" text-anchor="middle" font-weight="500">T</text><rect x="428" y="117" width="106" height="54" rx="15" fill="#e8f1e5" stroke="#25614b" stroke-width="3"/><text x="481.0" y="153" font-size="28" fill="#173d31" text-anchor="middle" font-weight="500">Lungs</text><rect x="428" y="246" width="106" height="54" rx="15" fill="#e8f1e5" stroke="#25614b" stroke-width="3"/><text x="481.0" y="282" font-size="28" fill="#173d31" text-anchor="middle" font-weight="500">Heart</text><rect x="428" y="353" width="106" height="54" rx="15" fill="#e8f1e5" stroke="#25614b" stroke-width="3"/><text x="481.0" y="389" font-size="28" fill="#173d31" text-anchor="middle" font-weight="500">Body</text><path d="M441 239 C385 225 384 173 421 149" fill="none" stroke="#357ca2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-b)"/><text x="380" y="213" font-size="28" fill="#357ca2" text-anchor="middle" font-weight="500">X</text><path d="M541 149 C580 177 579 224 543 258" fill="none" stroke="#b94a43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-r)"/><text x="583" y="213" font-size="30" fill="#b94a43" text-anchor="middle" font-weight="700">Y</text><path d="M539 286 C575 310 570 334 541 361" fill="none" stroke="#b94a43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-r)"/><path d="M421 375 C386 351 385 325 421 294" fill="none" stroke="#357ca2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-b)"/><text x="378" y="337" font-size="28" fill="#357ca2" text-anchor="middle" font-weight="500">Z</text><text x="160" y="439" font-size="28" fill="#b94a43" text-anchor="middle" font-weight="500">Red = oxygenated</text><text x="481" y="439" font-size="28" fill="#357ca2" text-anchor="middle" font-weight="500">Blue = deoxygenated</text></g></svg>