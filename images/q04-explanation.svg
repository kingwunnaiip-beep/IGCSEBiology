<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="q04-title q04-desc">
<title id="q04-title">Osmosis is the net movement of water</title>
<desc id="q04-desc">Water diffuses from higher water potential to lower water potential through a partially permeable membrane. The more concentrated side has more solute. The schematic shows net movement, not movement in only one direction. Osmosis requires no energy from respiration.</desc>
