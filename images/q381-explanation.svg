<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">IVF: fertilisation, transfer and possible donor gametes</title><desc id="desc">IVF combines an egg and sperm outside the body, develops an early embryo, and transfers it into a uterus. Gametes may be donated, access and cost vary, and pregnancy is not guaranteed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#245744"/></marker></defs><rect width="1000" height="540" rx="22" fill="#fbf8ed"/><text x="42" y="49" font-family="Arial, sans-serif" font-size="30" text-anchor="start" fill="#183e32" font-weight="bold">IVF: fertilisation, transfer and possible donor gametes</text><rect x="50" y="110" width="265" height="120" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><text x="182" y="155" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" fill="#183e32" font-weight="bold">Egg + sperm</text><text x="182" y="199" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183e32" font-weight="normal">May include donation</text><path d="M325,170 L360,170" fill="none" stroke="#245744" stroke-width="4" marker-end="url(#arrow)"/><rect x="375" y="110" width="270" height="120" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><text x="510" y="154" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" fill="#183e32" font-weight="bold">Fertilisation</text><text x="510" y="198" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183e32" font-weight="normal">Outside the body</text><path d="M655,170 L690,170" fill="none" stroke="#245744" stroke-width="4" marker-end="url(#arrow)"/><rect x="705" y="110" width="245" height="120" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><text x="827" y="154" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" fill="#183e32" font-weight="bold">Early embryo</text><text x="827" y="198" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183e32" font-weight="normal">Develops in culture</text><path d="M827,244 L827,286" fill="none" stroke="#245744" stroke-width="4" marker-end="url(#arrow)"/><rect x="540" y="300" width="410" height="115" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><text x="745" y="345" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#183e32" font-weight="bold">Transfer into uterus</text><text x="745" y="386" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183e32" font-weight="normal">Pregnancy is not guaranteed</text><rect x="50" y="300" width="435" height="115" rx="18" fill="#f0e6c8" stroke="#548c69" stroke-width="2"/><text x="267" y="344" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#183e32" font-weight="bold">Access and cost vary</text><text x="267" y="386" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#183e32" font-weight="normal">Donors need not be intended parents</text><text x="500" y="470" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#183e32" font-weight="bold">IVF can provide an opportunity for single parents.</text><text x="42" y="518" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#52675b" font-weight="normal">Original teaching schematic • Biology quiz • not to scale</text></svg>