<title id="q107-title">107 · Limiting factors restrict population growth</title>
<desc id="q107-desc">Answer D: stationary and death phases. In the source growth curve, the population first grows slowly, then rapidly, then levels off and finally declines. This original curve is qualitative, with no invented counts or time measurements. As resources become limiting, food shortage, disease and predation can restrict growth. In the stationary phase, births and deaths are approximately balanced; in the death phase, deaths exceed births. These factors can also act during other phases; the question asks for the phases associated with levelling off and decline.</desc>
