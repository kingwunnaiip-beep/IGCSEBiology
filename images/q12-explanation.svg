<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="q12-title q12-desc">
<title id="q12-title">Root hairs increase absorbing surface area</title>
<desc id="q12-desc">A root-hair cell has a long extension, a nucleus and a large vacuole. Water enters by osmosis down a water-potential gradient. Mineral ions can enter by active transport using energy from respiration. Statements 2 and 3 are correct.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
