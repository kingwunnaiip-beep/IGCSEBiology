<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="t d"><title id="t">Different tissues cooperate within the root organ</title><desc id="d">A plant organism encloses a root organ. Inside the root are separate epidermis and xylem tissues, containing root-hair cells and xylem vessels respectively.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#286c50" stroke-width="1.5"/></marker></defs><rect width="960" height="560" rx="20" fill="#fbf9ed"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="28" text-anchor="start" fill="#173f32">Different tissues cooperate within the root organ</text><rect x="60" y="100" width="840" height="390" rx="14" fill="#f0f4df" stroke="#286c50" stroke-width="3"/><text x="90" y="140" font-size="26" text-anchor="start" fill="#173f32">Plant = organism</text><rect x="110" y="165" width="740" height="285" rx="14" fill="#e0ecda" stroke="#286c50" stroke-width="3"/><text x="140" y="205" font-size="26" text-anchor="start" fill="#173f32">Root = organ</text><rect x="155" y="245" width="295" height="130" rx="14" fill="#e0ecda" stroke="#286c50" stroke-width="3"/><text x="302.5" y="318.0" font-size="23" text-anchor="middle" fill="#173f32">Epidermis tissue</text><rect x="510" y="245" width="295" height="130" rx="14" fill="#e0ecda" stroke="#286c50" stroke-width="3"/><text x="657.5" y="318.0" font-size="23" text-anchor="middle" fill="#173f32">Xylem tissue</text><text x="302" y="410" font-size="21" text-anchor="middle" fill="#173f32">includes root-hair cells</text><text x="657" y="410" font-size="21" text-anchor="middle" fill="#173f32">includes xylem vessels</text><text x="480" y="525" font-size="23" text-anchor="middle" fill="#173f32">Different cells and tissues can belong to one organ and one organism.</text></g></svg>