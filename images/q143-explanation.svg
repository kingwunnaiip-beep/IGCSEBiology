<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1110" viewBox="0 0 1000 1110" role="img" aria-labelledby="q143-title q143-desc">
<title id="q143-title">143 · Exercise increases breathing through feedback</title>
<desc id="q143-desc">Answer D: statement order 2, 4, 3, 1. First the rate of respiration increases in active muscles, producing more carbon dioxide. Then receptors in the brain detect increased carbon dioxide in blood. Next nerve impulses are sent from the brain to intercostal muscles and diaphragm. Finally breathing rate increases. A vertical causal flow preserves each original statement number. This is a qualitative control model, not a timing graph or measurement.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1110" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >143 · Exercise increases breathing through feedback</text><text x="500" y="110" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Keep the original statement numbers.</text><rect x="100" y="156" width="800" height="163" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="196" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >2 · Respiration increases</text><text x="500.0" y="239" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Active muscles release more energy.</text><text x="500.0" y="274" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >More carbon dioxide is produced.</text><line x1="500" y1="327" x2="500" y2="355" stroke="#357ca2" stroke-width="5"/><polygon points="500,355 493.07331236687776,341.6950761583107 506.92668763312224,341.6950761583107" fill="#357ca2"/><rect x="100" y="363" width="800" height="163" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="403" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >4 · Receptors detect the change</text><text x="500.0" y="446" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Receptors in the brain detect increased</text><text x="500.0" y="481" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >carbon dioxide concentration in the blood.</text><line x1="500" y1="534" x2="500" y2="562" stroke="#357ca2" stroke-width="5"/><polygon points="500,562 493.07331236687776,548.6950761583107 506.92668763312224,548.6950761583107" fill="#357ca2"/><rect x="100" y="570" width="800" height="163" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="610" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >3 · Nerve impulses are sent</text><text x="500.0" y="653" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The brain signals the intercostal muscles</text><text x="500.0" y="688" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >and the diaphragm.</text><line x1="500" y1="741" x2="500" y2="769" stroke="#357ca2" stroke-width="5"/><polygon points="500,769 493.07331236687776,755.6950761583107 506.92668763312224,755.6950761583107" fill="#357ca2"/><rect x="100" y="777" width="800" height="163" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="817" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >1 · Breathing rate increases</text><text x="500.0" y="860" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Ventilation supplies oxygen and</text><text x="500.0" y="895" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >helps remove carbon dioxide.</text><text x="500" y="1010" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative cause-and-response sequence; no response times are given.</text><rect x="24" y="1034" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1068" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · 2 → 4 → 3 → 1</text>
</g></svg>