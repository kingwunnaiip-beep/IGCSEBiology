1222,527.6950761583107" fill="#fffdf7"/><text x="737" y="433" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Surface capillaries</text><text x="737" y="603" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Wider supply arteriole</text><text x="737" y="640" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Vasodilation</text><text x="737" y="701" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >More blood flows</text><text x="737" y="736" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >near the skin surface.</text><rect x="63" y="847" width="874" height="119" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500" y="889" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Arteriole smooth muscle relaxes → lumen widens</text><text x="500" y="929" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >→ more blood flows through the surface capillaries.</text><text x="500" y="1020" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The capillaries stay in place; they do not move towards the skin.</text><text x="500" y="1060" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Heat transfer increases when the surroundings allow heat loss.</text><text x="500" y="1133" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Sweat evaporation is a separate cooling response.</text><rect x="24" y="1184" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1218" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · Vasodilation → increased blood flow near the skin</text>
