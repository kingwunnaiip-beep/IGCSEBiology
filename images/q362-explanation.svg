<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" role="img" aria-labelledby="title desc"><title id="title">Pollen-tube growth follows nested flower structures</title><desc id="desc">A cutaway shows stigma, long style, enclosing ovary and an ovule inside the ovary. A pollen tube starts at a grain on the stigma, grows down the style and reaches the egg cell inside the ovule.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#276b46"/></marker></defs><rect width="1000" height="590" rx="20" fill="#fbfaf0"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="53" fill="#203e33" font-size="30" font-weight="bold" text-anchor="start">Pollen-tube growth follows nested flower structures</text><text x="40" y="95" fill="#203e33" font-size="22" font-weight="normal" text-anchor="start">The ovary contains ovules; the egg cell is inside an ovule.</text><rect x="118" y="150" width="140" height="30" rx="15" fill="#d7a542" stroke="#276b46" stroke-width="2"/><rect x="167" y="180" width="42" height="160" rx="5" fill="#e4eedc" stroke="#276b46" stroke-width="2"/><ellipse cx="188" cy="399" rx="126" ry="98" fill="#dcebd8" stroke="#276b46" stroke-width="3"/><ellipse cx="211" cy="422" rx="44" ry="53" fill="#fbfaf0" stroke="#276b46" stroke-width="3"/><circle cx="220" cy="442" r="10" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="145" cy="139" r="10" fill="#d7a542" stroke="#276b46" stroke-width="2"/><path d="M145 143 Q170 160 188 166 L188 330 Q175 369 185 390 Q191 407 217 430" fill="none" stroke="#ae604c" stroke-width="5"/><text x="360" y="171" fill="#203e33" font-size="25" font-weight="bold" text-anchor="start">1  Stigma</text><text x="360" y="204" fill="#203e33" font-size="21" font-weight="normal" text-anchor="start">Pollen grain germinates here.</text><path d="M260 166 L335 166" fill="none" stroke="#276b46" stroke-width="3"/><text x="360" y="258" fill="#203e33" font-size="25" font-weight="bold" text-anchor="start">2  Style</text><text x="360" y="291" fill="#203e33" font-size="21" font-weight="normal" text-anchor="start">Tube grows down through it.</text><path d="M212 253 L335 253" fill="none" stroke="#276b46" stroke-width="3"/><text x="360" y="345" fill="#203e33" font-size="25" font-weight="bold" text-anchor="start">3  Ovary</text><text x="360" y="378" fill="#203e33" font-size="21" font-weight="normal" text-anchor="start">Contains one or more ovules.</text><path d="M286 346 L335 346" fill="none" stroke="#276b46" stroke-width="3"/><text x="360" y="432" fill="#203e33" font-size="25" font-weight="bold" text-anchor="start">4  Ovule</text><text x="360" y="465" fill="#203e33" font-size="21" font-weight="normal" text-anchor="start">Tube delivers male nucleus to egg cell.</text><path d="M258 425 L335 425" fill="none" stroke="#276b46" stroke-width="3"/><text x="40" y="530" fill="#203e33" font-size="28" font-weight="bold" text-anchor="start">Stigma → style → ovary → ovule</text><text x="40" y="568" fill="#65776d" font-size="16" font-weight="normal" text-anchor="start">Original teaching schematic • diagrams are not to scale</text></g></svg>