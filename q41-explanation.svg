<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="q41-title q41-desc"><title id="q41-title">Photosynthesis is nutrition</title><desc id="q41-desc">Light and carbon dioxide enter a leaf. Water arrives through the stem. The green leaf produces glucose and oxygen by photosynthesis.</desc><defs><marker id="q41-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#244d3d"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;font-size:28px;fill:#244d3d}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}.heading{font-size:32px;font-weight:700}.small{font-size:28px}.bold{font-weight:700}.red{fill:#b65350}.blue{fill:#447c9a}.muted{fill:#698476}.arrow{stroke:#244d3d;stroke-width:4;fill:none;marker-end:url(#q41-arrow)}</style><rect x="1" y="1" width="638" height="418" rx="24" fill="#f5f8f2" stroke="#dbe9d7" stroke-width="2"/><text x="30" y="45" class="heading">Photosynthesis is nutrition</text><circle cx="95" cy="112" r="28" fill="#efe4c8" stroke="#bd9550" stroke-width="4"/><line x1="132" y1="112" x2="144" y2="112" stroke="#bd9550" stroke-width="4"/><line x1="121.16295090390226" y1="138.16295090390224" x2="129.64823227814082" y2="146.64823227814082" stroke="#bd9550" stroke-width="4"/><line x1="95" y1="149" x2="95" y2="161" stroke="#bd9550" stroke-width="4"/><line x1="68.83704909609774" y1="138.16295090390227" x2="60.351767721859176" y2="146.64823227814082" stroke="#bd9550" stroke-width="4"/><line x1="58" y1="112" x2="46" y2="112" stroke="#bd9550" stroke-width="4"/><line x1="68.83704909609773" y1="85.83704909609774" x2="60.35176772185916" y2="77.35176772185918" stroke="#bd9550" stroke-width="4"/><line x1="95" y1="75" x2="94.99999999999999" y2="63" stroke="#bd9550" stroke-width="4"/><line x1="121.16295090390226" y1="85.83704909609773" x2="129.64823227814082" y2="77.35176772185916" stroke="#bd9550" strok