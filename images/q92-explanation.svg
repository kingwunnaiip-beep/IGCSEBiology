<title id="q92-title">92 · The pancreas and liver control blood glucose</title>
<desc id="q92-desc">Answer D. A fall in blood glucose stimulates the pancreas to release more glucagon. Glucagon travels in the blood to the liver, where stored glycogen is broken down to glucose. Glucose is released into the blood and blood glucose rises towards normal. The comparison pathway shows high blood glucose stimulating insulin release from the pancreas, promoting glucose uptake and storage as glycogen in the liver. Both responses oppose the original change: negative feedback. Glucagon is a hormone; glycogen is a storage carbohydrate. The pathways are qualitative and show no numerical glucose measurements.</desc>
