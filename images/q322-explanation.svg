<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="q322-title q322-desc">
<title id="q322-title">Seven single chromosomes form one haploid set</title>
<desc id="q322-desc">The Tasmanian devil has seven homologous pairs, fourteen chromosomes, in a body cell. The source drawing contains seven chromosomes, one of each type, so it is haploid with no homologous pairs. Two side-by-side sets illustrate the body-cell comparison.</desc>
