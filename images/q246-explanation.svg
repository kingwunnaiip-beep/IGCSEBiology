<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img" aria-labelledby="q246-title q246-desc">
<title id="q246-title">Three living groups return carbon dioxide</title>
<desc id="q246-desc">Plants, animals and bacteria are the three living groups in the original carbon cycle. Each can release carbon dioxide by respiration. Plants also photosynthesise. Fossil fuel combustion releases carbon dioxide but fossil fuels are not a living group, so the correct count is three, C.</desc>
