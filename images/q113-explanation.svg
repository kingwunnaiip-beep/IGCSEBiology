<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1130" viewBox="0 0 1000 1130" role="img" aria-labelledby="q113-title q113-desc">
<title id="q113-title">113 · DNA strands have complementary bases</title>
<desc id="q113-desc">Answer D: thymine, T, pairs with adenine, A. In double-stranded DNA, adenine pairs with thymine and cytosine pairs with guanine. Hydrogen bonds between complementary bases hold the two strands together. The qualitative ladder diagram shows four example base pairs between two sugar-phosphate backbones; the T–A pair is highlighted. The backbones run along the sides of the DNA molecule. The illustration is not to molecular scale and does not represent a complete DNA sequence.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
