<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">Water loss changes the balance position</title><desc id="d">Two schematic balance beams tilt down on the right. Leaf 2 loses less water than uncovered leaf 1 because both surfaces are greased. Leaf 4 loses less water than leaf 3 because the lower surface, with most stomata, is greased.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#194f3b"/></marker></defs><rect width="1000" height="600" rx="22" fill="#fffdf2"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="31" text-anchor="start" fill="#213c30" font-weight="bold">Water loss changes the balance position</text><path d="M160,170 L820,215" fill="none" stroke="#194f3b" stroke-width="4"/><path d="M490,200 L518,200 L504,168 Z" fill="#6a8c63"/><rect x="55" y="88" width="290" height="68" rx="16" fill="#ffffff" stroke="#194f3b" stroke-width="2"/><text x="200.0" y="130.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">Leaf 1: uncovered</text><rect x="655" y="88" width="290" height="68" rx="16" fill="#d9ead7" stroke="#194f3b" stroke-width="2"/><text x="800.0" y="130.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">Leaf 2: both covered</text><text x="205" y="250" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">more water lost</text><text x="798" y="250" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">less water lost</text><text x="580" y="283" font-size="23" text-anchor="middle" fill="#213c30" font-weight="normal">heavier end goes lower</text><path d="M160,380 L820,425" fill="none" stroke="#194f3b" stroke-width="4"/><path d="M490,410 L518,410 L504,378 Z" fill="#6a8c63"/><rect x="55" y="298" width="290" height="68" rx="16" fill="#ffffff" stroke="#194f3b" stroke-width="2"/><text x="200.0" y="340.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">Leaf 3: upper covered</text><rect x="655" y="298" width="290" height="68" rx="16" fill="#d9ead7" stroke="#194f3b" stroke-width="2"/><text x="800.0" y="340.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">Leaf 4: lower covered</text><text x="205" y="460" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">more water lost</text><text x="798" y="460" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">less water lost</text><text x="580" y="493" font-size="23" text-anchor="middle" fill="#213c30" font-weight="normal">heavier end goes lower</text><text x="40" y="566" font-size="21" text-anchor="start" fill="#213c30" font-weight="normal">Typical leaf model: most stomata are on the lower surface. No mass scale is implied.</text></g></svg>