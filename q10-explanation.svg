<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" role="img" aria-labelledby="q10-title q10-desc">
<title id="q10-title">Two stages of starch digestion</title><desc id="q10-desc">In stage one, amylase in the mouth breaks a starch chain into maltose. In stage two, maltase in the small-intestine lining breaks maltose into glucose.</desc>
