<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="q256-title q256-desc">
<title id="q256-title">Magnification = image size ÷ actual size</title>
<desc id="q256-desc">The source drawing has a diameter of 20 millimetres and the red blood cell has an actual diameter of 0.008 millimetres. Dividing the image diameter by the actual diameter gives 2500. The millimetre units cancel, so magnification has no unit.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="650" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Magnification = image size ÷ actual size</text><rect x="60" y="120" width="450" height="150" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="285.0" y="160" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Drawing diameter</text><text x="285.0" y="202" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >20 mm</text><rect x="610" y="120" width="450" height="150" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="835.0" y="160" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Actual cell diameter</text><text x="835.0" y="202" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >0.008 mm</text><line x1="285" y1="285" x2="440" y2="345" stroke="#25614b" stroke-width="4"/><polygon points="440,345 425.0917590894577,346.6566088715301 430.0927458610908,333.7373930448112" fill="#25614b"/><line x1="835" y1="285" x2="680" y2="345" stroke="#25614b" stroke-width="4"/><polygon points="680,345 689.9072541389091,333.7373930448112 694.9082409105423,346.6566088715301" fill="#25614b"/><text x="560" y="350" font-size="40" fill="#173d31" font-weight="700" text-anchor="middle" >20 mm</text><line x1="410" y1="370" x2="710" y2="370" stroke="#25614b" stroke-width="4"/><text x="560" y="418" font-size="40" fill="#173d31" font-weight="700" text-anchor="middle" >0.008 mm</text><text x="560" y="490" font-size="40" fill="#173d31" font-weight="700" text-anchor="middle" >= 2500</text><text x="560" y="540" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Both measurements are already in mm, so the units cancel.</text><rect x="24" y="574" width="1072" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="560.0" y="608" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >The drawing is ×2500 the actual diameter.</text>
</g></svg>