<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1390" viewBox="0 0 1000 1390" role="img" aria-labelledby="q136-title q136-desc">
<title id="q136-title">136 · Roan cattle express both coat-colour alleles</title>
<desc id="q136-desc">Answer B: codominance. White cattle crossed with red cattle produce roan offspring. Use C superscript R for the red allele and C superscript W for the white allele. Red cattle are C R C R, white cattle are C W C W, and roan cattle are C R C W. In roan heterozygotes, both alleles are expressed together: the coat has both red hairs and white hairs, rather than a blended intermediate hair colour. A Punnett square for roan crossed with roan has four equally likely outcomes: one red homozygote, two roan heterozygotes and one white homozygote. The expected ratio is one red to two roan to one white; these are probabilities, not a guaranteed ratio in a small family.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
