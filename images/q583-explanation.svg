50" y="135" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">amino acids</text><line x1="850" y1="150" x2="812" y2="221" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><text x="500" y="558" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">C · Transcription → mRNA movement → ribosome attachment → protein.</text></g></svg>
