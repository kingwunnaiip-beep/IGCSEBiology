<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Hormone response after a starch-rich meal</title><desc id="desc">Starch digestion and glucose absorption raise blood glucose. The pancreas increases insulin release and decreases glucagon release, promoting uptake and storage and reducing glucose release from glycogen. This negative feedback helps blood glucose return towards normal.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L8 3 Z" fill="#245c43"/></marker></defs>
<rect width="1000" height="600" rx="24" fill="#fbf8ec"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="42" y="58" font-size="32" text-anchor="start" fill="#173f31" font-weight="bold">Hormone response after a starch-rich meal</text><rect x="60" y="115" width="300" height="95" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="210" y="153" font-size="25" text-anchor="middle" fill="#173f31" font-weight="normal">Starch in rice</text><text x="210" y="187" font-size="25" text-anchor="middle" fill="#173f31" font-weight="normal">Digested to glucose</text><path d="M360 163 L465 163" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><rect x="475" y="115" width="460" height="95" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="705" y="153" font-size="25" text-anchor="middle" fill="#173f31" font-weight="normal">Glucose absorbed into blood</text><text x="705" y="187" font-size="25" text-anchor="middle" fill="#173f31" font-weight="normal">Blood glucose rises</text><path d="M705 210 L705 255" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><rect x="545" y="265" width="330" height="65" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="710" y="307" font-size="27" text-anchor="middle" fill="#173f31" font-weight="bold">Pancreas responds</text><path d="M620 330 L300 385" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><path d="M775 330 L775 385" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><rect x="60" y="395" width="420" height="95" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="270" y="433" font-size="24" text-anchor="middle" fill="#173f31" font-weight="normal">Insulin increases ↑</text><text x="270" y="467" font-size="24" text-anchor="middle" fill="#173f31" font-weight="normal">More glucose uptake and storage</text><rect x="520" y="395" width="420" height="95" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="730" y="433" font-size="24" text-anchor="middle" fill="#173f31" font-weight="normal">Glucagon decreases ↓</text><text x="730" y="467" font-size="24" text-anchor="middle" fill="#173f31" font-weight="normal">Less glycogen breakdown</text><path d="M270 490 L395 538" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><path d="M730 490 L605 538" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><text x="500" y="574" font-size="26" text-anchor="middle" fill="#173f31" font-weight="bold">Blood glucose returns towards its normal level</text></g></svg>