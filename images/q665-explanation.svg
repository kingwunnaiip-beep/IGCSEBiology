<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Three listed processes are universal life characteristics</title><desc id="desc">A drawn margay grows, excretes waste and respires in mitochondria. A plant illustrates why digestion is not universal to all organisms.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">Three listed processes are universal life characteristics</text><g transform="translate(480 335) scale(1.5)"><ellipse cx="0" cy="0" rx="80" ry="40" fill="#c6ad7b" stroke="#24644b" stroke-width="3"/><circle cx="75" cy="-35" r="33" fill="#c6ad7b" stroke="#24644b" stroke-width="3"/><path d="M52 -57 L53 -90 L73 -67 M82 -66 L104 -84 L103 -45" fill="#c6ad7b" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-65 -15 Q-130 -80 -130 -5" fill="none" stroke="#24644b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M-45 25 L-50 90" fill="none" stroke="#24644b" stroke-width="12"/><path d="M35 25 L40 90" fill="none" stroke="#24644b" stroke-width="12"/><circle cx="65" cy="-40" r="3" fill="#173f32" stroke="#173f32" stroke-width="1"/><circle cx="87" cy="-40" r="3" fill="#173f32" stroke="#173f32" stroke-width="1"/><circle cx="-40" cy="-10" r="5" fill="#927e56" stroke="none" stroke-width="0"/><circle cx="0" cy="12" r="5" fill="#927e56" stroke="none" stroke-width="0"/><circle cx="25" cy="-15" r="5" fill="#927e56" stroke="none" stroke-width="0"/><circle cx="-15" cy="-20" r="5" fill="#927e56" stroke="none" stroke-width="0"/></g><g transform="translate(150 430) scale(0.45)"><ellipse cx="0" cy="0" rx="80" ry="40" fill="#c6ad7b" stroke="#24644b" stroke-width="3"/><circle cx="75" cy="-35" r="33" fill="#c6ad7b" stroke="#24644b" stroke-width="3"/><path d="M52 -57 L53 -90 L73 -67 M82 -66 L104 -84 L103 -45" fill="#c6ad7b" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-65 -15 Q-130 -80 -130 -5" fill="none" stroke="#24644b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M-45 25 L-50 90" fill="none" stroke="#24644b" stroke-width="12"/><path d="M35 25 L40 90" fill="none" stroke="#24644b" stroke-width="12"/><circle cx="65" cy="-40" r="3" fill="#173f32" stroke="#173f32" stroke-width="1"/><circle cx="87" cy="-40" r="3" fill="#173f32" stroke="#173f32" stroke-width="1"/><circle cx="-40" cy="-10" r="5" fill="#927e56" stroke="none" stroke-width="0"/><circle cx="0" cy="12" r="5" fill="#927e56" stroke="none" stroke-width="0"/><circle cx="25" cy="-15" r="5" fill="#927e56" stroke="none" stroke-width="0"/><circle cx="-15" cy="-20" r="5" fill="#927e56" stroke="none" stroke-width="0"/></g><path d="M215 420 L320 400" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="150" y="510" font-size="25" text-anchor="middle" fill="#173f32" font-weight="bold">Growth</text><path d="M710 415 Q680 465 710 475 Q740 465 710 415" fill="#537c9a" stroke="#537c9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M620 410 L690 450" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="790" y="485" font-size="25" text-anchor="middle" fill="#173f32" font-weight="bold">Excretion</text><ellipse cx="470" cy="160" rx="110" ry="45" fill="#e9c8b6" stroke="#ac655c" stroke-width="3"/><path d="M385 155 Q410 120 435 165 Q460 200 485 150 Q510 120 550 160" fill="none" stroke="#ac655c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="470" y="105" font-size="25" text-anchor="middle" fill="#173f32" font-weight="bold">Respiration in living cells</text><text x="470" y="225" font-size="23" text-anchor="middle" fill="#173f32">Energy released</text><g transform="translate(850 300) rotate(0) scale(0.65)"><path d="M0 0 Q-80 -110 0 -160 Q90 -80 0 0" fill="#e4f0df" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 0 Q5 -75 0 -145" fill="none" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -35 L-30 -60" fill="none" stroke="#24644b" stroke-width="2"/><path d="M0 -60 L-30 -85" fill="none" stroke="#24644b" stroke-width="2"/><path d="M0 -85 L-30 -110" fill="none" stroke="#24644b" stroke-width="2"/><path d="M0 -110 L-30 -135" fill="none" stroke="#24644b" stroke-width="2"/></g><text x="850" y="345" font-size="22" text-anchor="middle" fill="#173f32">Plants also live</text><text x="825" y="380" font-size="22" text-anchor="middle" fill="#173f32">without digestion</text><text x="500" y="565" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">C: 3 — excretion, growth and respiration</text></g></svg>