<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1510" viewBox="0 0 1000 1510" role="img" aria-labelledby="q87-title q87-desc">
<title id="q87-title">87 · Two affected parents, one unaffected child</title>
<desc id="q87-desc">Pedigree D proves dominant inheritance under the question’s simple autosomal, single-gene model with complete dominance and no new mutations. A selected parent-child branch shows an affected father and an affected mother with an unaffected daughter. Squares denote males, circles females, shaded symbols affected and unshaded symbols unaffected. Recessive affected parents would both be aa; aa crossed with aa produces only affected aa offspring. With a dominant disorder, A causes the disorder and a is the normal allele. The unaffected daughter is aa, so both affected parents must be Aa. The Aa by Aa Punnett square gives AA, Aa, Aa and aa, each allele combination with probability 25 percent. AA and Aa are affected; aa is unaffected. Each child is an independent event and the expected ratio is not a guaranteed family outcome.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
