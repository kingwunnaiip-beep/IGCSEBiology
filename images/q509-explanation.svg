<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="t d"><title id="t">A large pH change reduces an acid-adapted protease’s activity</title><desc id="d">A qualitative activity curve for an acid-adapted digestive protease peaks at low pH near1.5 and is very low at7.5. No measured rate scale is implied.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#286c50" stroke-width="1.5"/></marker></defs><rect width="960" height="560" rx="20" fill="#fbf9ed"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="28" text-anchor="start" fill="#173f32">A large pH change reduces an acid-adapted protease’s activity</text><path d="M130 410 L840 410" stroke="#286c50" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M130 410 L130 110" stroke="#286c50" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M150 390 C170 270 200 145 240 150 C300 150 330 275 420 375 C480 403 650 405 820 405" fill="none" stroke="#286c50" stroke-width="6"/><text x="80" y="95" font-size="24" text-anchor="start" fill="#173f32">Rate</text><text x="850" y="453" font-size="24" text-anchor="start" fill="#173f32">pH</text><path d="M240 410 L240 145" stroke="#286c50" stroke-width="2" fill="none"/><path d="M700 410 L700 405" stroke="#286c50" stroke-width="2" fill="none"/><text x="240" y="448" font-size="24" text-anchor="middle" fill="#173f32">1.5</text><text x="700" y="448" font-size="24" text-anchor="middle" fill="#173f32">7.5</text><text x="325" y="126" font-size="23" text-anchor="start" fill="#173f32">Acid-adapted enzyme</text><text x="480" y="505" font-size="23" text-anchor="middle" fill="#173f32">Qualitative model: a large pH change alters active-site function.</text></g></svg>