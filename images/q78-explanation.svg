<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1000" viewBox="0 0 960 1000" role="img" aria-labelledby="q78-title q78-desc">
<title id="q78-title">The shoot tip supports growth</title>
<desc id="q78-desc">Answer B. After two days in even light, wheat shoot X with its tip intact increases in height, while shoot Y with its tip removed shows little or no height increase in this experiment. This schematic comparison shows the shoots on a shared baseline and marks the cut-tip reference level for Y, with no numerical heights or directional bending. The result supports the explanation that auxin is made in the shoot tip, moves to the elongation zone, and stimulates cell elongation. It does not prove that no other substances can influence growth.</desc>
