<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Work backwards from a hybrid zygote</title><desc id="desc">Species 1 has 70 chromosomes in a diploid cell and supplies 35 in a gamete. The hybrid has 64 chromosomes, so species 2 supplies 29. Doubling 29 gives species 2’s diploid chromosome number, 58.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L8 3 Z" fill="#245c43"/></marker></defs>
<rect width="1000" height="600" rx="24" fill="#fbf8ec"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="42" y="58" font-size="32" text-anchor="start" fill="#173f31" font-weight="bold">Work backwards from a hybrid zygote</text><rect x="55" y="110" width="390" height="92" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="250" y="148" font-size="26" text-anchor="middle" fill="#173f31" font-weight="normal">Species 1 parent</text><text x="250" y="183" font-size="26" text-anchor="middle" fill="#173f31" font-weight="normal">Diploid: 70</text><rect x="555" y="110" width="390" height="92" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="750" y="148" font-size="26" text-anchor="middle" fill="#173f31" font-weight="normal">Species 2 parent</text><text x="750" y="183" font-size="26" text-anchor="middle" fill="#173f31" font-weight="normal">Diploid: X</text><path d="M250 202 L250 254" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><text x="320" y="240" font-size="23" text-anchor="start" fill="#173f31" font-weight="normal">meiosis ÷ 2</text><path d="M750 202 L750 254" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><text x="810" y="240" font-size="23" text-anchor="start" fill="#173f31" font-weight="normal">meiosis ÷ 2</text><rect x="110" y="265" width="280" height="75" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="250" y="313" font-size="28" text-anchor="middle" fill="#173f31" font-weight="bold">Gamete: 35</text><rect x="610" y="265" width="280" height="75" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="750" y="313" font-size="28" text-anchor="middle" fill="#173f31" font-weight="bold">Gamete: X ÷ 2</text><path d="M250 340 L425 393" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><path d="M750 340 L575 393" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><rect x="310" y="400" width="380" height="62" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="500" y="440" font-size="27" text-anchor="middle" fill="#173f31" font-weight="bold">Hybrid zygote: 64</text><text x="500" y="510" font-size="28" text-anchor="middle" fill="#173f31" font-weight="normal">Species 2 gamete = 64 − 35 = 29</text><text x="500" y="561" font-size="29" text-anchor="middle" fill="#173f31" font-weight="bold">Species 2 diploid number = 29 × 2 = 58</text></g></svg>