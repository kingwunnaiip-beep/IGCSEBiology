57ca2"/><text x="736" y="505" font-size="26" fill="#357ca2" font-weight="700" text-anchor="middle" >Sperm placed</text><text x="736" y="540" font-size="26" fill="#357ca2" font-weight="700" text-anchor="middle" >in the uterus</text><text x="232" y="218" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >Oviduct</text><line x1="282" y1="231" x2="290" y2="276" stroke="#526c62" stroke-width="2"/><text x="90" y="398" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >Ovary</text><line x1="172" y1="386" x2="194" y2="349" stroke="#526c62" stroke-width="2"/><text x="245" y="488" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >Uterus</text><line x1="334" y1="477" x2="409" y2="446" stroke="#526c62" stroke-width="2"/><text x="500" y="649" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Simplified anatomy; shapes and distances are not to scale.</text><rect x="48" y="750" width="430" height="230" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="263" y="799" font-size="27" fill="#25614b" font-weight="700" text-anchor="middle" >Artificial insemination</text><text x="263" y="858" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Sperm placed in the uterus.</text><text x="263" y="898" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Fertilisation inside the body,</text><text x="263" y="938" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >usually in an oviduct.</text><rect x="522" y="750" width="430" height="230" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="737" y="799" font-size="27" fill="#357ca2" font-weight="700" text-anchor="middle" >In vitro fertilisation (IVF)</text><text x="737" y="858" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Fertilisation outside the body.</text><text x="737" y="898" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >An embryo is then transferred</text><text x="737" y="938" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >to the uterus.</text><text x="500" y="1052" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Read the whole row: method + insertion site.</text><text x="500" y="1095" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Sperm insertion is different from embryo transfer.</text><rect x="24" y="1194" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1228" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer B · Artificial insemination; uterus</text>
