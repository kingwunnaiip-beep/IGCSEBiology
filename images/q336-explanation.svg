<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" role="img" aria-labelledby="q336-title q336-desc">
<title id="q336-title">Compare energy-bearing nutrients in equal masses</title>
<desc id="q336-desc">All foods have mass 100 grams. Water supplies no energy. Food B has the largest carbohydrate portion and little water; C and D are mostly water. Fat supplies more energy per gram, but B has the greatest total energy.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="740" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Compare energy-bearing nutrients in equal masses</text><rect x="40" y="100" width="490" height="145" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="285.0" y="138" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Water</text><text x="285.0" y="176" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Supplies no dietary energy.</text><text x="285.0" y="207" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >A large water sector leaves less mass</text><text x="285.0" y="238" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >for carbohydrate, fat and protein.</text><rect x="570" y="100" width="490" height="145" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="815.0" y="138" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Energy-bearing nutrients</text><text x="815.0" y="176" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Carbohydrate and protein supply energy.</text><text x="815.0" y="207" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Fat supplies more energy per gram.</text><text x="815.0" y="238" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Compare the whole composition.</text><rect x="40" y="285" width="490" height="150" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="285.0" y="323" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >A</text><text x="285.0" y="361" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Less carbohydrate and more water</text><text x="285.0" y="392" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >than B; its extra fat does not</text><text x="285.0" y="423" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >outweigh B’s larger nutrient total.</text><rect x="570" y="285" width="490" height="150" rx="12" fill="#dcebd2" stroke="#25614b" stroke-width="2"/><text x="815.0" y="323" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B</text><text x="815.0" y="361" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Largest carbohydrate sector.</text><text x="815.0" y="392" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Relatively little water.</text><text x="815.0" y="423" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Greatest total energy in 100 g.</text><rect x="40" y="485" width="490" height="150" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="285.0" y="523" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C</text><text x="285.0" y="561" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Mostly water.</text><text x="285.0" y="592" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Small energy-bearing portions.</text><rect x="570" y="485" width="490" height="150" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="815.0" y="523" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >D</text><text x="815.0" y="561" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Mostly water.</text><text x="815.0" y="592" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Much less carbohydrate than B.</text><rect x="24" y="664" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="698" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B provides the most energy.</text>
</g></svg>