<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" role="img" aria-labelledby="q178-title q178-desc">
<title id="q178-title">178 · Denitrification returns nitrogen to the air</title>
<desc id="q178-desc">The source states that acidic soil encourages anaerobic bacteria that cause denitrification. More denitrification converts more soil nitrate ions into nitrogen gas, releasing it to the atmosphere. This reduces nitrate availability for plant uptake and protein synthesis. The diagram is a qualitative process model, not a measured rate or a universal quantitative soil-pH relationship. AnswerB.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1060" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >178 · Denitrification returns nitrogen to the air</text><text x="500" y="111" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Source condition: acidic soil encourages</text><text x="500" y="150" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >the anaerobic bacteria that cause denitrification.</text><rect x="90" y="223" width="820" height="128" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="263" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Nitrate ions in soil</text><text x="500.0" y="305" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >A nitrogen source for plant amino acids and proteins.</text><line x1="500" y1="370" x2="500" y2="474" stroke="#357ca2" stroke-width="6"/><polygon points="500,474 493.07331236687776,460.6950761583107 506.92668763312224,460.6950761583107" fill="#357ca2"/><text x="680" y="433" font-size="28" fill="#357ca2" font-weight="700" text-anchor="middle" >Denitrification</text><rect x="90" y="500" width="820" height="128" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="540" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Nitrogen gas in the atmosphere</text><text x="500.0" y="582" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >More nitrogen is released from the soil.</text><rect x="90" y="691" width="820" height="143" rx="12" fill="#f8e6da" stroke="#b94a43" stroke-width="2"/><text x="500.0" y="731" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Less nitrate remains available to plants</text><text x="500.0" y="773" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Denitrification removes nitrate ions.</text><text x="500.0" y="809" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >It does not increase plant protein production.</text><text x="500" y="892" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Direction matters: nitrate ions → nitrogen gas.</text><text x="500" y="931" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative pathway; no measured bacterial rates are claimed.</text><rect x="24" y="984" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1018" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer B · More nitrogen gas is released from the soil</text>
</g></svg>