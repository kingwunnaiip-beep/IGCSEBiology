<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="q47-title q47-desc"><title id="q47-title">Humidity reduces water loss</title><desc id="q47-desc">Two identical plants stand in oil-covered water tubes. Tube X is exposed; the leaves of Y are enclosed in a plastic bag. The exact five-day water losses are 5.7 grams for X and 1.6 grams for Y.</desc><defs><marker id="q47-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#244d3d"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;font-size:28px;fill:#244d3d}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}.heading{font-size:32px;font-weight:700}.small{font-size:28px}.bold{font-weight:700}.red{fill:#b65350}.blue{fill:#447c9a}.muted{fill:#698476}.arrow{stroke:#244d3d;stroke-width:4;fill:none;marker-end:url(#q47-arrow)}</style><rect x="1" y="1" width="638" height="418" rx="24" fill="#f5f8f2" stroke="#dbe9d7" stroke-width="2"/><text x="30" y="45" class="heading">Humidity reduces water loss</text><text x="45" y="106" >X · exposed</text><text x="359" y="106" >Y · bagged</text><g transform="translate(0 25)"><path d="M176 247 V142" fill="none" stroke="#659b78" stroke-width="6"/><path d="M176 191 C111 121 96 101 71 121 C86 171 131 186 176 191" fill="#659b78" stroke="#244d3d" stroke-width="3"/><path d="M176 168 C241 98 256 78 281 98 C266 148 221 163 176 168" fill="#659b78" stroke="#244d3d" stroke-width="3"/><path d="M151 210 V270 Q176 301 201 270 V210" fill="#dbeaf0" stroke="#447c9a" stroke-width="4"/><line x1="152" y1="224" x2="200" y2="224" stroke="#bd9550" stroke-width="8"/><path d="M479 247 V142" fill="none" stroke="#659b78" stroke-width="6"/><path d="M479 191 C414 121 399 101 374 121 C389 171 434 186 479 191" fill="#659b78" stroke="#244d3d" stroke-width="3"/><path d="M479 168 C544 98 559 78 584 98 C569 148 524 163 479 168" fill="#659b78" stroke="#244d3d" stroke-width="3"/><path d="M454 210 V270 Q479 301 504 270 V210" fill="#dbeaf0" stroke="#447c9a" stroke-width="4"/><line x1="455" y1="224" x2="503" y2="224" stroke="#bd9550" stroke-width="8"/></g><rect x="361" y="114" width="240" height="165" rx="24" fill="#dbeaf0" fill-opacity=".48" stroke="#447c9a" stroke-width="3" stroke-dasharray="8 6"/><path d="M420 152 Q412 162 420 166 Q428 162 420 152" fill="#447c9a" opacity=".55"/><path d="M540 182 Q532 192 540 196 Q548 192 540 182" fill="#447c9a" opacity=".55"/><path d="M430 217 Q422 227 430 231 Q438 227 430 217" fill="#447c9a" opacity=".55"/><text x="42" y="344" >X</text><rect x="81" y="316" width="399" height="34" rx="8" fill="#659b78"/><text x="494" y="344" class="bold">5.7 g</text><text x="42" y="395" >Y</text><rect x="81" y="367" width="112" height="34" rx="8" fill="#447c9a"/><text x="210" y="395" class="bold">1.6 g</text></svg>
