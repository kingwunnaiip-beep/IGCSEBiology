<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="q233-title q233-desc">
<title id="q233-title">Carbohydrates contain carbon, hydrogen and oxygen</title>
<desc id="q233-desc">Glucose formula C6H12O6 illustrates the three elements in carbohydrates: carbon, hydrogen and oxygen. Nitrogen is absent. Row C includes the correct yes, yes, no, yes sequence in the original carbon, hydrogen, nitrogen, oxygen order.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="650" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Carbohydrates contain carbon, hydrogen and oxygen</text><text x="500" y="110" font-size="26" fill="#526c62" font-weight="400" text-anchor="middle" >Glucose is one carbohydrate example.</text><rect x="230" y="144" width="540" height="105" rx="12" fill="white" stroke="#25614b" stroke-width="2"/><text x="500" y="213" font-size="46" fill="#173d31" font-weight="700" text-anchor="middle" >C₆H₁₂O₆</text><circle cx="175" cy="335" r="45" fill="#eff5e8" stroke="#25614b" stroke-width="3"/><text x="175" y="349" font-size="36" fill="#173d31" font-weight="700" text-anchor="middle" >C</text><text x="175" y="413" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >carbon</text><circle cx="500" cy="335" r="45" fill="#eff5e8" stroke="#25614b" stroke-width="3"/><text x="500" y="349" font-size="36" fill="#173d31" font-weight="700" text-anchor="middle" >H</text><text x="500" y="413" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >hydrogen</text><circle cx="825" cy="335" r="45" fill="#eff5e8" stroke="#25614b" stroke-width="3"/><text x="825" y="349" font-size="36" fill="#173d31" font-weight="700" text-anchor="middle" >O</text><text x="825" y="413" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >oxygen</text><rect x="80" y="455" width="840" height="78" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500" y="486" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Original column order: C, H, N, O</text><text x="500" y="520" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >yes  •  yes  •  no  •  yes</text><rect x="24" y="574" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="608" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C — C, H and O present; nitrogen absent</text>
</g></svg>