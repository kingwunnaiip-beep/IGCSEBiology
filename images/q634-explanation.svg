<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Hydrophyte leaves contain large air spaces</title><desc id="desc">A water lily has floating leaves. A magnified leaf section contains conspicuous connected air spaces; these lower density and permit gas movement.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="53" font-size="30" text-anchor="start" font-weight="bold" fill="#173f32">Hydrophyte leaves contain large air spaces</text><rect x="45" y="275" width="445" height="205" rx="0" fill="#e5eef5" stroke="none" stroke-width="0"/><path d="M45 275 Q80 265 110 275 T180 275 T250 275 T320 275 T390 275 T490 275" fill="none" stroke="#537c9a" stroke-width="3" /><path d="M260 470 Q160 370 160 270" fill="none" stroke="#24644b" stroke-width="5" /><ellipse cx="160" cy="263" rx="68" ry="17" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><path d="M260 470 Q260 370 260 270" fill="none" stroke="#24644b" stroke-width="5" /><ellipse cx="260" cy="263" rx="68" ry="17" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><path d="M260 470 Q370 370 370 270" fill="none" stroke="#24644b" stroke-width="5" /><ellipse cx="370" cy="263" rx="68" ry="17" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><path d="M260 465 Q200 480 200 500" fill="none" stroke="#24644b" stroke-width="2" /><path d="M260 465 Q235 480 235 500" fill="none" stroke="#24644b" stroke-width="2" /><path d="M260 465 Q270 480 270 500" fill="none" stroke="#24644b" stroke-width="2" /><path d="M260 465 Q305 480 305 500" fill="none" stroke="#24644b" stroke-width="2" /><path d="M260 465 Q340 480 340 500" fill="none" stroke="#24644b" stroke-width="2" /><text x="80" y="165" font-size="26" text-anchor="start" font-weight="bold" fill="#173f32">Floating leaves</text><path d="M250 185 L260 245" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><line x1="385" y1="250" x2="555" y2="190" stroke="#537c9a" stroke-width="2" stroke-dasharray="6 6"/><line x1="385" y1="270" x2="555" y2="400" stroke="#537c9a" stroke-width="2" stroke-dasharray="6 6"/><rect x="560" y="165" width="385" height="260" rx="55" fill="#e4f0df" stroke="#24644b" stroke-width="4"/><ellipse cx="620" cy="225" rx="37" ry="35" fill="#fbf8eb" stroke="#24644b" stroke-width="2"/><ellipse cx="715" cy="220" rx="45" ry="35" fill="#fbf8eb" stroke="#24644b" stroke-width="2"/><ellipse cx="835" cy="230" rx="58" ry="44" fill="#fbf8eb" stroke="#24644b" stroke-width="2"/><ellipse cx="650" cy="330" rx="55" ry="48" fill="#fbf8eb" stroke="#24644b" stroke-width="2"/><ellipse cx="770" cy="345" rx="48" ry="46" fill="#fbf8eb" stroke="#24644b" stroke-width="2"/><ellipse cx="875" cy="345" rx="42" ry="40" fill="#fbf8eb" stroke="#24644b" stroke-width="2"/><text x="750" y="125" font-size="25" text-anchor="middle" font-weight="bold" fill="#173f32">Leaf section</text><text x="750" y="465" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">Large air spaces</text><text x="500" y="548" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">Air spaces provide buoyancy and internal gas pathways.</text></g></svg>