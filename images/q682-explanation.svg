<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which individuals are heterozygous for the sex-linked disease?</title><desc id="desc">Unaffected female 2: Affected son inherited her recessive X; she is a carrier; Unaffected female 3: Affected son inherited her recessive X; she is a carrier; Males: one X chromosome: At this X-linked locus they cannot be heterozygous</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Which individuals are heterozygous for the sex-linked disease?</text><text x="38" y="106" font-size="18" font-weight="400">Heterozygotes have one normal and one recessive disease allele: individuals 2 and 3.</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="50" y="190" font-size="23" font-weight="700">Unaffected female 2</text><text x="50" y="276" font-size="21" font-weight="400">Affected son inherited her</text><text x="50" y="303" font-size="21" font-weight="400">recessive X; she is a carrier</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="405" y="190" font-size="23" font-weight="700">Unaffected female 3</text><text x="405" y="276" font-size="21" font-weight="400">Affected son inherited her</text><text x="405" y="303" font-size="21" font-weight="400">recessive X; she is a carrier</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="760" y="190" font-size="23" font-weight="700">Males: one X</text><text x="760" y="219" font-size="23" font-weight="700">chromosome</text><text x="760" y="276" font-size="21" font-weight="400">At this X-linked locus they</text><text x="760" y="303" font-size="21" font-weight="400">cannot be heterozygous</text><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>