<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Check both the flower part and its function</title><desc id="desc">Three flower-part functions are listed: stigma receives pollen, anther produces pollen, and ovule is the site of fertilisation. A schematic spiky pollen grain shows an insect-pollination adaptation, contrasted with smooth light wind-pollinated pollen.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="40" y="54" font-size="31" fill="#173f32" text-anchor="start" font-weight="bold">Check both the flower part and its function</text><rect x="40" y="110" width="432" height="418" rx="18" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><text x="256" y="153" font-size="27" fill="#173f32" text-anchor="middle" font-weight="bold">Flower functions</text><circle cx="95" cy="205" r="24" fill="#c8ddc5" stroke="#24644b" stroke-width="3"/><text x="140" y="202" font-size="26" fill="#173f32" text-anchor="start" font-weight="bold">Stigma</text><text x="140" y="236" font-size="23" fill="#173f32" text-anchor="start" font-weight="normal">receives pollen</text><circle cx="95" cy="314" r="24" fill="#c8ddc5" stroke="#24644b" stroke-width="3"/><text x="140" y="311" font-size="26" fill="#173f32" text-anchor="start" font-weight="bold">Anther</text><text x="140" y="345" font-size="23" fill="#173f32" text-anchor="start" font-weight="normal">produces pollen</text><circle cx="95" cy="423" r="24" fill="#c8ddc5" stroke="#24644b" stroke-width="3"/><text x="140" y="420" font-size="26" fill="#173f32" text-anchor="start" font-weight="bold">Ovule</text><text x="140" y="454" font-size="23" fill="#173f32" text-anchor="start" font-weight="normal">site of fertilisation</text><rect x="510" y="110" width="450" height="418" rx="18" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><text x="735" y="153" font-size="26" fill="#173f32" text-anchor="middle" font-weight="bold">Insect-pollinated pollen</text><circle cx="735" cy="286" r="63" fill="#e6c271" stroke="#24644b" stroke-width="3"/><path d="M799.0,286.0 L820.0,286.0" fill="none" stroke="#24644b" stroke-width="5" /><path d="M790.4256258422041,318.0 L808.6121593216773,328.5" fill="none" stroke="#24644b" stroke-width="5" /><path d="M767.0,341.42562584220406 L777.5,359.61215932167727" fill="none" stroke="#24644b" stroke-width="5" /><path d="M735.0,350.0 L735.0,371.0" fill="none" stroke="#24644b" stroke-width="5" /><path d="M703.0,341.42562584220406 L692.5,359.61215932167727" fill="none" stroke="#24644b" stroke-width="5" /><path d="M679.5743741577959,318.0 L661.3878406783227,328.5" fill="none" stroke="#24644b" stroke-width="5" /><path d="M671.0,286.0 L650.0,286.0" fill="none" stroke="#24644b" stroke-width="5" /><path d="M679.5743741577959,254.0 L661.3878406783227,243.5" fill="none" stroke="#24644b" stroke-width="5" /><path d="M703.0,230.57437415779594 L692.5,212.38784067832273" fill="none" stroke="#24644b" stroke-width="5" /><path d="M735.0,222.0 L735.0,201.0" fill="none" stroke="#24644b" stroke-width="5" /><path d="M767.0,230.57437415779594 L777.5,212.38784067832273" fill="none" stroke="#24644b" stroke-width="5" /><path d="M790.425625842204,253.99999999999997 L808.6121593216773,243.49999999999997" fill="none" stroke="#24644b" stroke-width="5" /><text x="735" y="429" font-size="24" fill="#173f32" text-anchor="middle" font-weight="normal">Sticky or spiky surface</text><text x="735" y="463" font-size="24" fill="#173f32" text-anchor="middle" font-weight="normal">helps attachment to insects.</text><text x="500" y="568" font-size="25" fill="#173f32" text-anchor="middle" font-weight="normal">Smooth, light pollen is typical of wind pollination.</text></g></svg>