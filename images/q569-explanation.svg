<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">D drains blood from the villus toward the liver</title><desc id="desc">A villus drawing distinguishes its capillary network from the central lacteal, with outgoing blood D routed through the hepatic portal vein to a drawn liver.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="bluearrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="45" font-size="28" fill="#173f32" text-anchor="start" font-weight="bold">D drains blood from the villus toward the liver</text><text x="500" y="555" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">Follow blood leaving the villus capillaries: D connects to the hepatic portal route.</text><g transform="translate(320 135) scale(0.9)"><path d="M-130 355 Q-102 285 -96 155 Q-96 5 0 0 Q96 5 96 155 Q102 285 130 355" fill="#f4ead1" stroke="#bc824b" stroke-width="4" /><path d="M-106 355 Q-80 260 -78 150 Q-75 28 0 22 Q75 28 78 150 Q80 260 106 355" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M-12 355 L-12 125 Q-12 80 0 80 Q12 80 12 125 L12 355" fill="#ecd983" stroke="#bc824b" stroke-width="3" /><path d="M-65 355 C-86 260 -58 220 -62 153 C-70 40 70 40 62 153 C58 220 86 260 65 355" fill="none" stroke="#537c9a" stroke-width="7" /><path d="M-62 110 Q0 70 62 110 Q0 150 -62 110" fill="none" stroke="#537c9a" stroke-width="3" /><path d="M-62 155 Q0 115 62 155 Q0 195 -62 155" fill="none" stroke="#537c9a" stroke-width="3" /><path d="M-62 200 Q0 160 62 200 Q0 240 -62 200" fill="none" stroke="#537c9a" stroke-width="3" /><path d="M-62 245 Q0 205 62 245 Q0 285 -62 245" fill="none" stroke="#537c9a" stroke-width="3" /><path d="M-62 290 Q0 250 62 290 Q0 330 -62 290" fill="none" stroke="#537c9a" stroke-width="3" /><path d="M-99 80 L-79 80" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M79 80 L99 80" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M-99 120 L-79 120" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M79 120 L99 120" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M-99 160 L-79 160" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M79 160 L99 160" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M-99 200 L-79 200" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M79 200 L99 200" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M-99 240 L-79 240" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M79 240 L99 240" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M-99 280 L-79 280" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M79 280 L99 280" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M-99 320 L-79 320" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M79 320 L99 320" fill="none" stroke="#bc824b" stroke-width="2" /></g><path d="M255 455 L255 400" fill="none" stroke="#537c9a" stroke-width="4" marker-end="url(#bluearrow)" /><path d="M380 400 L380 465" fill="none" stroke="#537c9a" stroke-width="4" marker-end="url(#bluearrow)" /><text x="185" y="490" font-size="22" fill="#173f32" text-anchor="start" font-weight="normal">A: blood in</text><text x="375" y="500" font-size="24" fill="#173f32" text-anchor="start" font-weight="bold">D: blood out</text><path d="M395 462 Q555 490 660 360" fill="none" stroke="#537c9a" stroke-width="7" marker-end="url(#bluearrow)" /><path d="M650 280 Q750 200 910 260 L930 360 Q810 420 655 355 Z" fill="#bb8c65" stroke="#bc824b" stroke-width="4" /><path d="M790 238 Q800 330 770 384" fill="none" stroke="#bc824b" stroke-width="3" /><text x="805" y="320" font-size="30" fill="#173f32" text-anchor="middle" font-weight="bold">Liver</text><text x="690" y="465" font-size="24" fill="#537c9a" text-anchor="middle" font-weight="normal">Hepatic portal vein</text><text x="60" y="170" font-size="24" fill="#173f32" text-anchor="start" font-weight="bold">Villus</text><text x="50" y="230" font-size="22" fill="#537c9a" text-anchor="start" font-weight="normal">Blood capillaries</text><path d="M200 235 L265 250" fill="none" stroke="#537c9a" stroke-width="2" /><text x="500" y="135" font-size="21" fill="#bc824b" text-anchor="start" font-weight="normal">Central lacteal</text><path d="M530 145 L326 260" fill="none" stroke="#bc824b" stroke-width="2" /></g></svg>