<svg xmlns="http://www.w3.org/2000/svg" width="900" height="850" viewBox="0 0 900 850" role="img" aria-labelledby="q62-title q62-desc">
<title id="q62-title">ABO blood-group inheritance</title>
<desc id="q62-desc">The cross is I superscript A I superscript lowercase o with I superscript B I superscript lowercase o. Either the father or mother can be the group A parent. The two-by-two Punnett square gives I superscript A I superscript B, group AB; I superscript A I superscript o, group A; I superscript B I superscript o, group B; and I superscript o I superscript o, group O. Each has a 25 percent chance for each child. A and B alleles are codominant. An AB child requires A and B alleles, while an O child requires the o allele from both parents. Answer D.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
