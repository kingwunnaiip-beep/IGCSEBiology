<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Malaria can favour heterozygous carriers</title><desc id="desc">A mosquito symbol represents malaria exposure. Two human silhouettes carry AA and AS genotypes. A protective shield beside the AS carrier illustrates greater malaria resistance and therefore a survival and reproductive advantage where malaria is common. The drawing is conceptual and has no invented numerical data.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="1.8"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#b85c50" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="38" y="54" font-size="30" fill="#173f32" font-weight="bold">Malaria can favour heterozygous carriers</text><ellipse cx="495" cy="155" rx="15" ry="38" fill="#b85c50" stroke="#b85c50" stroke-width="2" /><circle cx="495" cy="114" r="13" fill="#b85c50" stroke="#b85c50" stroke-width="2" /><ellipse cx="460" cy="143" rx="32" ry="12" fill="#dcebf2" stroke="#537c9a" stroke-width="2" transform="rotate(-25 460 143)"/><ellipse cx="529" cy="143" rx="32" ry="12" fill="#dcebf2" stroke="#537c9a" stroke-width="2" transform="rotate(25 529 143)"/><path d="M483 142 l-45 20 M508 142 l45 20" fill="none" stroke="#b85c50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M483 160 l-45 20 M508 160 l45 20" fill="none" stroke="#b85c50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M483 177 l-45 20 M508 177 l45 20" fill="none" stroke="#b85c50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="495" y1="101" x2="500" y2="84" stroke="#b85c50" stroke-width="2" stroke-linecap="round" /><text x="637" y="137" font-size="25" text-anchor="start" fill="#173f32" font-weight="bold">Malaria exposure</text><line x1="620" y1="143" x2="547" y2="153" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><circle cx="274" cy="279" r="37" fill="#f0c6b7" stroke="#b85c50" stroke-width="3" /><path d="M249 322 Q198 328 207 397 L238 397 L238 469 H271 V398 H288 V469 H321 V397 H346 Q346 327 299 322 Z" fill="#e4f0df" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="274" cy="363" r="40" fill="#dcebf2" stroke="#537c9a" stroke-width="2" /><text x="274" y="371" font-size="30" text-anchor="middle" fill="#173f32" font-weight="bold">AA</text><ellipse cx="173" cy="343" rx="31" ry="22" fill="#f0c6b7" stroke="#b85c50" stroke-width="2" /><ellipse cx="173" cy="343" rx="14" ry="8" fill="#f0c6b7" stroke="#b85c50" stroke-width="2" /><circle cx="704" cy="279" r="37" fill="#f0c6b7" stroke="#b85c50" stroke-width="3" /><path d="M679 322 Q628 328 637 397 L668 397 L668 469 H701 V398 H718 V469 H751 V397 H776 Q776 327 729 322 Z" fill="#e4f0df" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="704" cy="363" r="40" fill="#dcebf2" stroke="#537c9a" stroke-width="2" /><text x="704" y="371" font-size="30" text-anchor="middle" fill="#173f32" font-weight="bold">AS</text><ellipse cx="603" cy="343" rx="31" ry="22" fill="#f0c6b7" stroke="#b85c50" stroke-width="2" /><ellipse cx="603" cy="343" rx="14" ry="8" fill="#f0c6b7" stroke="#b85c50" stroke-width="2" /><path d="M788 304 L851 280 L914 304 V357 Q900 409 851 438 Q802 409 788 357 Z" fill="#e4f0df" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M822 353 l22 23 43 -56" fill="none" stroke="#24644b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><text x="268" y="514" font-size="24" text-anchor="middle" fill="#173f32" font-weight="normal">Two normal alleles</text><text x="718" y="514" font-size="24" text-anchor="middle" fill="#173f32" font-weight="normal">Heterozygous carrier</text><text x="69" y="180" font-size="22" text-anchor="start" fill="#173f32" font-weight="normal">No special malaria</text><text x="69" y="208" font-size="22" text-anchor="start" fill="#173f32" font-weight="normal">protection</text><text x="690" y="205" font-size="23" text-anchor="start" fill="#173f32" font-weight="normal">Greater malaria resistance</text><text x="690" y="234" font-size="23" text-anchor="start" fill="#173f32" font-weight="normal">can improve survival</text><text x="500" y="558" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">B · In malaria regions, carriers can leave more offspring and pass on S.</text></g></svg>
