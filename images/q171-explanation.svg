<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050" role="img" aria-labelledby="q171-title q171-desc">
<title id="q171-title">171 · Find the loss prevented by upper-surface grease</title>
<desc id="q171-desc">Original seven-day water losses are 12.0 g without grease, 8.7 g with upper surfaces greased, and 0.0 g with both surfaces greased. The upper-surface contribution is the difference 12.0−8.7=3.3 g over seven days. Dividing by seven gives 0.4714…g/day, rounded to 0.47 g/day, answerA. Bar lengths represent the published seven-day masses; the daily rate is a calculation, not an additional measurement.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
