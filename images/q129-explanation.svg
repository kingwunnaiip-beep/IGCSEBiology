<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1270" viewBox="0 0 1000 1270" role="img" aria-labelledby="q129-title q129-desc">
<title id="q129-title">129 · Separate threats from conservation responses</title>
<desc id="q129-desc">Answer A: statements 1 and 4, habitat destruction and pollution. Habitat destruction removes food, shelter and breeding sites, reducing survival or reproduction. Pollution can kill organisms or reduce their ability to reproduce. These are reasons a species can become endangered. Monitoring, education and captive breeding are conservation responses intended to understand or reduce the risk. This qualitative teaching diagram explains mechanisms and does not claim measured population losses.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1270" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >129 · Separate threats from conservation responses</text><text x="500" y="111" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >A reason for becoming endangered must increase the risk of extinction.</text><rect x="48" y="181" width="430" height="330" rx="12" fill="#f7ead9" stroke="#b94a43" stroke-width="2"/><circle cx="263" cy="242" r="32" fill="#fffdf7" stroke="#b94a43" stroke-width="3"/><text x="263" y="252" font-size="28" fill="#b94a43" font-weight="700" text-anchor="middle" >1</text><text x="263" y="316" font-size="28" fill="#b94a43" font-weight="700" text-anchor="middle" >Habitat destruction</text><text x="263" y="378" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Food sources are lost.</text><text x="263" y="421" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Shelter is removed.</text><text x="263" y="464" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Breeding sites disappear.</text><rect x="522" y="181" width="430" height="330" rx="12" fill="#f7ead9" stroke="#b94a43" stroke-width="2"/><circle cx="737" cy="242" r="32" fill="#fffdf7" stroke="#b94a43" stroke-width="3"/><text x="737" y="252" font-size="28" fill="#b94a43" font-weight="700" text-anchor="middle" >4</text><text x="737" y="316" font-size="28" fill="#b94a43" font-weight="700" text-anchor="middle" >Pollution</text><text x="737" y="378" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Pollutants enter habitats.</text><text x="737" y="421" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Organisms may be killed.</text><text x="737" y="464" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Reproduction may be reduced.</text><line x1="263" y1="529" x2="395" y2="598" stroke="#b94a43" stroke-width="4"/><polygon points="395,598 380.00002075866774,597.975044848189 386.41765516437323,585.6978312024916" fill="#b94a43"/><line x1="737" y1="529" x2="605" y2="598" stroke="#b94a43" stroke-width="4"/><polygon points="605,598 613.5823448356267,585.6978312024916 619.9999792413322,597.975044848189" fill="#b94a43"/><rect x="213" y="614" width="574" height="110" rx="12" fill="#f7ead9" stroke="#b94a43" stroke-width="2"/><text x="500" y="658" font-size="27" fill="#b94a43" font-weight="700" text-anchor="middle" >Lower survival or reproduction</text><text x="500" y="697" font-size="27" fill="#b94a43" font-weight="700" text-anchor="middle" >can make a species endangered.</text><text x="500" y="793" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >Conservation responses aim to reduce the risk</text><rect x="48" y="841" width="278" height="225" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="187" y="889" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >2 · Monitoring</text><text x="187" y="954" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Track populations</text><text x="187" y="995" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >and identify threats.</text><rect x="361" y="841" width="278" height="225" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500" y="889" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >3 · Education</text><text x="500" y="954" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Help people protect</text><text x="500" y="995" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >species and habitats.</text><rect x="674" y="841" width="278" height="225" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="813" y="882" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >5 · Captive</text><text x="813" y="916" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >breeding</text><text x="813" y="974" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Breed threatened</text><text x="813" y="1012" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >animals under care.</text><text x="500" y="1159" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Identify the threats that increase the risk of extinction.</text><rect x="24" y="1194" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1228" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer A · 1 and 4: habitat destruction and pollution</text>
