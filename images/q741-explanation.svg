<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Read the atom counts in the molecular formulae</title><desc id="desc">A glucose hexagon, oxygen pair, linear carbon dioxide symbol and bent water symbol illustrate the balanced aerobic-respiration equation. Subscript numbers give the atom counts asked for.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">Read the atom counts in the molecular formulae</text><text x="145" y="155" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">Glucose</text><text x="400" y="155" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">Oxygen</text><text x="650" y="155" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">Carbon dioxide</text><text x="870" y="155" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">Water</text><polygon points="210.0,295.0 177.5,351.29165124598853 112.50000000000001,351.29165124598853 80.0,295.0 112.49999999999997,238.7083487540115 177.5,238.7083487540115" fill="#e4f0df" stroke="#24644b" stroke-width="5"/><text x="145" y="303" font-size="23" fill="#173f32" text-anchor="middle" font-weight="700">C₆H₁₂O₆</text><circle cx="375" cy="295" r="27" fill="#e5b89f" stroke="#c5824b" stroke-width="3"/><circle cx="425" cy="295" r="27" fill="#e5b89f" stroke="#c5824b" stroke-width="3"/><path d="M375 295 H425" fill="none" stroke="#c5824b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="600" cy="295" r="25" fill="#e5b89f" stroke="#24644b" stroke-width="3"/><circle cx="650" cy="295" r="25" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><circle cx="700" cy="295" r="25" fill="#e5b89f" stroke="#24644b" stroke-width="3"/><path d="M600 295 H700" fill="none" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(870 282) scale(2)"><circle cx="0" cy="0" r="13" fill="#cfe5ec" stroke="#537c9a" stroke-width="3"/><circle cx="-15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/><circle cx="15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/></g><path d="M475 390 H540" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="500" y="445" font-size="31" fill="#173f32" text-anchor="middle" font-weight="700">C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O</text><text x="500" y="495" font-size="26" fill="#173f32" text-anchor="middle" font-weight="400">x = 12 and y = 6 in glucose; z = 2 in carbon dioxide</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">D: x = 12; y = 6; z = 2</text></g></svg>