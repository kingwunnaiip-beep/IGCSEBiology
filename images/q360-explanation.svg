<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">Vesicles release neurotransmitter at a synapse</title><desc id="desc">Presynaptic vesicles contain small neurotransmitter molecules. A vesicle fuses with the presynaptic membrane, molecules are released into the synaptic gap and diffuse to receptor sites on the postsynaptic membrane.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#276b46"/></marker></defs><rect width="1000" height="600" rx="20" fill="#fbfaf0"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="53" fill="#203e33" font-size="30" font-weight="bold" text-anchor="start">Vesicles release neurotransmitter at a synapse</text><text x="40" y="95" fill="#203e33" font-size="22" font-weight="normal" text-anchor="start">Storage, release and receptor binding are different steps.</text><rect x="65" y="140" width="870" height="175" rx="14" fill="#e4eedc" stroke="#276b46" stroke-width="2"/><rect x="65" y="390" width="870" height="110" rx="14" fill="#e4eedc" stroke="#276b46" stroke-width="2"/><text x="90" y="175" fill="#203e33" font-size="23" font-weight="bold" text-anchor="start">Presynaptic neurone terminal</text><text x="90" y="425" fill="#203e33" font-size="23" font-weight="bold" text-anchor="start">Postsynaptic membrane</text><circle cx="205" cy="245" r="33" fill="#fbfaf0" stroke="#276b46" stroke-width="2"/><circle cx="193" cy="238" r="5" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="214" cy="233" r="5" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="218" cy="255" r="5" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="197" cy="257" r="5" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="355" cy="245" r="33" fill="#fbfaf0" stroke="#276b46" stroke-width="2"/><circle cx="343" cy="238" r="5" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="364" cy="233" r="5" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="368" cy="255" r="5" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="347" cy="257" r="5" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="520" cy="250" r="33" fill="#fbfaf0" stroke="#276b46" stroke-width="2"/><circle cx="508" cy="243" r="5" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="529" cy="238" r="5" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="533" cy="260" r="5" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="512" cy="262" r="5" fill="#d7a542" stroke="#276b46" stroke-width="2"/><text x="140" y="304" fill="#203e33" font-size="20" font-weight="normal" text-anchor="start">vesicles store transmitter</text><path d="M685 315 Q650 270 685 250 Q720 270 685 315" fill="#fbfaf0" stroke="#276b46" stroke-width="3"/><path d="M685 280 L685 350" fill="none" stroke="#276b46" stroke-width="3" marker-end="url(#arrow)"/><circle cx="674" cy="331" r="5" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="700" cy="347" r="5" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="662" cy="360" r="5" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="691" cy="372" r="5" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="740" cy="348" r="5" fill="#d7a542" stroke="#276b46" stroke-width="2"/><path d="M638 389 L638 405 L662 405 L662 389" fill="none" stroke="#276b46" stroke-width="5"/><path d="M688 389 L688 405 L712 405 L712 389" fill="none" stroke="#276b46" stroke-width="5"/><path d="M738 389 L738 405 L762 405 L762 389" fill="none" stroke="#276b46" stroke-width="5"/><text x="90" y="358" fill="#203e33" font-size="22" font-weight="normal" text-anchor="start">Synaptic gap</text><text x="775" y="360" fill="#203e33" font-size="18" font-weight="normal" text-anchor="start">diffusion</text><text x="90" y="468" fill="#203e33" font-size="21" font-weight="normal" text-anchor="start">Receptors bind the released chemical.</text><text x="40" y="536" fill="#203e33" font-size="21" font-weight="bold" text-anchor="start">Vesicle = membrane-bound store; mitochondrion = energy supply.</text><text x="40" y="578" fill="#65776d" font-size="16" font-weight="normal" text-anchor="start">Original teaching schematic • diagrams are not to scale</text></g></svg>