<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img" aria-labelledby="q330-title q330-desc">
<title id="q330-title">Incoming lung blood has the most carbon dioxide</title>
<desc id="q330-desc">At B the blood arrives from the pulmonary artery after collecting carbon dioxide from respiring tissues. Carbon dioxide diffuses into the alveolar air and is exhaled, so blood leaving in the pulmonary vein contains less.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
