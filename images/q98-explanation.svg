<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1360" viewBox="0 0 1000 1360" role="img" aria-labelledby="q98-title q98-desc">
<title id="q98-title">98 · DNA ligase joins DNA fragments</title>
<desc id="q98-desc">Answer A. A restriction enzyme cuts DNA: a human gene is isolated and a bacterial plasmid is cut open. The gene can be placed between the cut ends of the plasmid. DNA ligase joins the inserted gene to the plasmid backbone, sealing the DNA at both junctions and producing a recombinant plasmid. Restriction enzyme cutting is explicitly distinguished from DNA ligase joining. Red represents the human gene, green the plasmid backbone and amber the joined sites. All DNA drawings are schematic.</desc>
