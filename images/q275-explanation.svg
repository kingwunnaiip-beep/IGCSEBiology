<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="q275-title q275-desc">
<title id="q275-title">Recognising a monocotyledon flower</title>
<desc id="q275-desc">A six-petalled schematic illustrates floral parts in multiples of three in monocotyledons. A five-petalled schematic illustrates the usual four or five pattern in dicotyledons. Original source choices A and B have five petals, C four, and D six.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="700" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Recognising a monocotyledon flower</text><rect x="60" y="95" width="470" height="360" rx="12" fill="#ffffff" stroke="#c4d2c2" stroke-width="2"/><ellipse cx="295" cy="210" rx="32" ry="65" transform="rotate(0.0 295 270)" fill="#d7e8c6" stroke="#25614b" stroke-width="3"/><ellipse cx="295" cy="210" rx="32" ry="65" transform="rotate(60.0 295 270)" fill="#d7e8c6" stroke="#25614b" stroke-width="3"/><ellipse cx="295" cy="210" rx="32" ry="65" transform="rotate(120.0 295 270)" fill="#d7e8c6" stroke="#25614b" stroke-width="3"/><ellipse cx="295" cy="210" rx="32" ry="65" transform="rotate(180.0 295 270)" fill="#d7e8c6" stroke="#25614b" stroke-width="3"/><ellipse cx="295" cy="210" rx="32" ry="65" transform="rotate(240.0 295 270)" fill="#d7e8c6" stroke="#25614b" stroke-width="3"/><ellipse cx="295" cy="210" rx="32" ry="65" transform="rotate(300.0 295 270)" fill="#d7e8c6" stroke="#25614b" stroke-width="3"/><circle cx="295" cy="270" r="28" fill="#daa958" stroke="#25614b" stroke-width="3"/><text x="295" y="425" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Monocotyledon: six petals</text><rect x="570" y="95" width="470" height="360" rx="12" fill="#ffffff" stroke="#c4d2c2" stroke-width="2"/><ellipse cx="805" cy="210" rx="32" ry="65" transform="rotate(0.0 805 270)" fill="#f3dbc5" stroke="#25614b" stroke-width="3"/><ellipse cx="805" cy="210" rx="32" ry="65" transform="rotate(72.0 805 270)" fill="#f3dbc5" stroke="#25614b" stroke-width="3"/><ellipse cx="805" cy="210" rx="32" ry="65" transform="rotate(144.0 805 270)" fill="#f3dbc5" stroke="#25614b" stroke-width="3"/><ellipse cx="805" cy="210" rx="32" ry="65" transform="rotate(216.0 805 270)" fill="#f3dbc5" stroke="#25614b" stroke-width="3"/><ellipse cx="805" cy="210" rx="32" ry="65" transform="rotate(288.0 805 270)" fill="#f3dbc5" stroke="#25614b" stroke-width="3"/><circle cx="805" cy="270" r="28" fill="#daa958" stroke="#25614b" stroke-width="3"/><text x="805" y="425" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Dicotyledon: five petals</text><text x="65" y="505" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >Monocotyledon floral parts usually occur in threes or multiples of three.</text><text x="65" y="542" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >Dicotyledon floral parts usually occur in fours or fives.</text><text x="550" y="595" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Source counts:  A = 5    B = 5    C = 4    D = 6</text><rect x="24" y="624" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="658" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >D has six petals: two groups of three.</text>
</g></svg>