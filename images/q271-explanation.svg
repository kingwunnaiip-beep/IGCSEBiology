<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="q271-title q271-desc">
<title id="q271-title">Exercise increases the need to remove CO₂</title>
<desc id="q271-desc">During exercise, faster respiration produces more carbon dioxide. Receptors in the brain detect the resulting blood change. Signals increase breathing rate, increasing carbon dioxide removal.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
