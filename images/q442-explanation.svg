<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Sperm structures have different functions</title><desc id="desc">A schematic sperm has an enzyme-containing acrosome at the front of the head, a haploid nucleus, mitochondria in the midpiece, and a flagellum for movement. Only the acrosome supplies the enzymes that digest the egg coat.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#397857"/></marker></defs><rect width="900" height="520" rx="22" fill="#fbfaee"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="28" text-anchor="start" fill="#183e31" font-weight="bold">Sperm structures have different functions</text><ellipse cx="205" cy="270" rx="90" ry="58" fill="#dcebbf" stroke="#4c7957" stroke-width="4"/><path d="M150 225 Q100 270 150 315 L170 306 Q138 270 170 234 Z" fill="#73a15d"/><ellipse cx="220" cy="270" rx="50" ry="34" fill="#e5d69d" stroke="#4c7957" stroke-width="2"/><rect x="291" y="246" width="103" height="48" rx="16" fill="#b8cf8f" stroke="#4c7957" stroke-width="3"/><path d="M395 270 Q480 210 560 270 T760 270" fill="none" stroke="#397857" stroke-width="8"/><ellipse cx="310" cy="269" rx="9" ry="15" fill="#d68b66"/><ellipse cx="336" cy="269" rx="9" ry="15" fill="#d68b66"/><ellipse cx="362" cy="269" rx="9" ry="15" fill="#d68b66"/><text x="90" y="117" font-size="25" text-anchor="start" fill="#183e31" font-weight="bold">Acrosome</text><text x="90" y="151" font-size="20" text-anchor="start" fill="#183e31" font-weight="normal">Enzymes digest the egg coat</text><path d="M150 163 L143 235" fill="none" stroke="#397857" stroke-width="4"/><text x="292" y="380" font-size="23" text-anchor="middle" fill="#183e31" font-weight="bold">Mitochondria</text><text x="292" y="410" font-size="20" text-anchor="middle" fill="#183e31" font-weight="normal">Release energy</text><path d="M320 354 L338 294" fill="none" stroke="#397857" stroke-width="4"/><text x="620" y="128" font-size="25" text-anchor="start" fill="#183e31" font-weight="bold">Flagellum</text><text x="620" y="162" font-size="20" text-anchor="start" fill="#183e31" font-weight="normal">Movement</text><path d="M670 175 L650 247" fill="none" stroke="#397857" stroke-width="4"/><text x="90" y="445" font-size="22" text-anchor="start" fill="#183e31" font-weight="normal">Nucleus: haploid genetic information</text><path d="M140 424 L208 310" fill="none" stroke="#397857" stroke-width="4"/><text x="450" y="490" font-size="17" text-anchor="middle" fill="#183e31" font-weight="normal">Schematic: structures are not drawn to scale.</text></g></svg>