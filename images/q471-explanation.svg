<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Root and stem vascular tissues have different patterns</title><desc id="desc">A root cross-section has central star-shaped xylem W and phloem V between its arms. A stem bundle has phloem Y towards the outside and xylem Z towards the centre. Colours distinguish the tissue types consistently.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#397653"/></marker></defs><rect width="960" height="560" rx="20" fill="#faf8ed"/><g font-family="Arial, sans-serif"><text x="36" y="48" font-size="28" text-anchor="start" fill="#173f31" font-weight="bold">Root and stem vascular tissues have different patterns</text><rect x="35" y="93" width="424" height="385" rx="14" fill="#e0eedc" stroke="#397653" stroke-width="2"/><rect x="493" y="93" width="432" height="385" rx="14" fill="#e0eedc" stroke="#397653" stroke-width="2"/><text x="247" y="132" font-size="26" text-anchor="middle" fill="#173f31" font-weight="bold">Root</text><circle cx="247" cy="272" r="112" fill="#e6edda" stroke="#397653" stroke-width="3"/><path d="M247 187L267 245L332 272L267 292L247 357L226 292L162 272L226 245Z" fill="#66977b" stroke="#397653" stroke-width="3"/><circle cx="205" cy="230" r="14" fill="#d3ba78" stroke="#88723a" stroke-width="2"/><circle cx="289" cy="230" r="14" fill="#d3ba78" stroke="#88723a" stroke-width="2"/><circle cx="205" cy="314" r="14" fill="#d3ba78" stroke="#88723a" stroke-width="2"/><circle cx="289" cy="314" r="14" fill="#d3ba78" stroke="#88723a" stroke-width="2"/><text x="247" y="424" font-size="22" text-anchor="middle" fill="#173f31" font-weight="normal">W: central xylem</text><text x="247" y="457" font-size="21" text-anchor="middle" fill="#173f31" font-weight="normal">V: phloem between arms</text><text x="709" y="132" font-size="25" text-anchor="middle" fill="#173f31" font-weight="bold">Stem vascular bundle</text><text x="709" y="182" font-size="21" text-anchor="middle" fill="#173f31" font-weight="normal">Outside of stem</text><path d="M606 227Q709 162 812 227L760 286L658 286Z" fill="#d3ba78" stroke="#88723a" stroke-width="3"/><path d="M658 292L760 292L709 367Z" fill="#66977b" stroke="#397653" stroke-width="3"/><text x="709" y="250" font-size="23" text-anchor="middle" fill="#173f31" font-weight="normal">Y: phloem</text><text x="792" y="352" font-size="21" text-anchor="start" fill="#173f31" font-weight="normal">Z: xylem</text><path d="M735 326L790 326" fill="none" stroke="#397653" stroke-width="3"/><polygon points="790,326 778.0,321.0 778.0,331.0" fill="#397653"/><text x="709" y="421" font-size="21" text-anchor="middle" fill="#173f31" font-weight="normal">Towards stem centre</text><path d="M709 374L709 394" fill="none" stroke="#397653" stroke-width="3"/><polygon points="709,394 714.0,382.0 704.0,382.0" fill="#397653"/><text x="480" y="525" font-size="23" text-anchor="middle" fill="#173f31" font-weight="normal">Locate the tissue by its position in the correct organ.</text></g></svg>