<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Seed banks conserve plants, rather than animal species</title><desc id="desc">A rhinoceros and calf illustrate animal breeding conservation. A separate seed-storage jar and sprouting leaf identify seed banks as a plant method.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">Seed banks conserve plants, rather than animal species</text><g transform="translate(230 300) scale(1.2)"><ellipse cx="0" cy="0" rx="85" ry="45" fill="#bdc7bd" stroke="#24644b" stroke-width="3"/><path d="M50 -25 L115 -20 L145 15 L80 35 Z" fill="#bdc7bd" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M115 -20 L130 -60 L140 -5 Z" fill="#e6d6af" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-50 30 L-50 85" fill="none" stroke="#24644b" stroke-width="14"/><path d="M45 30 L45 85" fill="none" stroke="#24644b" stroke-width="14"/><circle cx="102" cy="-5" r="4" fill="#173f32" stroke="#173f32" stroke-width="1"/></g><g transform="translate(430 375) scale(0.55)"><ellipse cx="0" cy="0" rx="85" ry="45" fill="#bdc7bd" stroke="#24644b" stroke-width="3"/><path d="M50 -25 L115 -20 L145 15 L80 35 Z" fill="#bdc7bd" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M115 -20 L130 -60 L140 -5 Z" fill="#e6d6af" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-50 30 L-50 85" fill="none" stroke="#24644b" stroke-width="14"/><path d="M45 30 L45 85" fill="none