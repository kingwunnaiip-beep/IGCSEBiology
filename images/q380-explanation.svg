<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">Vasoconstriction reduces warm blood flow to skin</title><desc id="desc">A narrower skin arteriole carries less warm blood to surface capillaries. Skin temperature falls while reduced heat transfer helps conserve heat in the core. The dots represent blood, not a measured cell count.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#245744"/></marker></defs><rect width="1000" height="540" rx="22" fill="#fbf8ed"/><text x="42" y="49" font-family="Arial, sans-serif" font-size="30" text-anchor="start" fill="#183e32" font-weight="bold">Vasoconstriction reduces warm blood flow to skin</text><text x="55" y="105" font-family="Arial, sans-serif" font-size="25" text-anchor="start" fill="#183e32" font-weight="bold">Arterioles supplying the skin</text><rect x="60" y="138" width="390" height="230" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><rect x="550" y="138" width="390" height="230" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><text x="255" y="178" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#183e32" font-weight="bold">Before constriction</text><text x="745" y="178" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#183e32" font-weight="bold">After constriction</text><rect x="115" y="220" width="280" height="80" rx="25" fill="#dfc898" stroke="#245744" stroke-width="5"/><rect x="605" y="245" width="280" height="30" rx="12" fill="#dfc898" stroke="#245744" stroke-width="5"/><circle cx="150" cy="259" r="13" fill="#a65d49"/><circle cx="210" cy="259" r="13" fill="#a65d49"/><circle cx="270" cy="259" r="13" fill="#a65d49"/><circle cx="330" cy="259" r="13" fill="#a65d49"/><circle cx="680" cy="259" r="9" fill="#a65d49"/><circle cx="810" cy="259" r="9" fill="#a65d49"/><text x="255" y="342" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183e32" font-weight="normal">Wider lumen</text><text x="745" y="342" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183e32" font-weight="normal">Narrower lumen</text><path d="M465,253 L535,253" fill="none" stroke="#245744" stroke-width="4" marker-end="url(#arrow)"/><text x="500" y="416" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#183e32" font-weight="bold">Less warm blood near the skin → skin temperature falls</text><text x="500" y="465" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#183e32" font-weight="normal">Less heat lost at the surface helps conserve core heat.</text><text x="42" y="518" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#52675b" font-weight="normal">Original teaching schematic • Biology quiz • not to scale</text></svg>