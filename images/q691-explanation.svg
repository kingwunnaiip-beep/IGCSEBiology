<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Eggs carry X; sperm carry X or Y</title><desc id="desc">A large egg carrying X combines with an X-bearing or Y-bearing sperm to make XX or XY zygotes. Neither gamete is shown transforming into the other.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">Eggs carry X; sperm carry X or Y</text><circle cx="175" cy="295" r="80" fill="#e6dec8" stroke="#24644b" stroke-width="4"/><circle cx="175" cy="295" r="35" fill="#fbf8eb" stroke="#24644b" stroke-width="2"/><text x="175" y="305" font-size="34" text-anchor="middle" fill="#173f32" font-weight="bold">X</text><text x="175" y="160" font-size="27" text-anchor="middle" fill="#173f32" font-weight="bold">Egg cell</text><ellipse cx="465" cy="205" rx="30" ry="20" fill="#d6e3eb" stroke="#537c9a" stroke-width="3"/><path d="M435 205 Q390 160 335 205" fill="none" stroke="#537c9a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="465" y="213" font-size="25" text-anchor="middle" fill="#173f32" font-weight="bold">X</text><text x="465" y="270" font-size="22" text-anchor="middle" fill="#173f32">Sperm</text><ellipse cx="465" cy="415" rx="30" ry="20" fill="#d6e3eb" stroke="#537c9a" stroke-width="3"/><path d="M435 415 Q390 370 335 415" fill="none" stroke="#537c9a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="465" y="423" font-size="25" text-anchor="middle" fill="#173f32" font-weight="bold">Y</text><text x="465" y="480" font-size="22" text-anchor="middle" fill="#173f32">Sperm</text><path d="M270 275 L660 205" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><path d="M270 315 L660 415" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><path d="M505 205 L660 205" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><path d="M505 415 L660 415" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><circle cx="790" cy="205" r="70" fill="#e4f0df" stroke="#24644b" stroke-width="4"/><text x="790" y="217" font-size="34" text-anchor="middle" fill="#173f32" font-weight="bold">XX</text><circle cx="790" cy="415" r="70" fill="#e4f0df" stroke="#24644b" stroke-width="4"/><text x="790" y="427" font-size="34" text-anchor="middle" fill="#173f32" font-weight="bold">XY</text><text x="790" y="115" font-size="27" text-anchor="middle" fill="#173f32" font-weight="bold">Possible zygotes</text><text x="500" y="565" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">C: egg cells contain X; sperm contain X or Y.</text></g></svg>