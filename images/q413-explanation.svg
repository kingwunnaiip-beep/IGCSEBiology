<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Self-pollination helps isolated plants reproduce</title><desc id="desc">A simplified flower shows pollen moving from an anther to its own stigma. A self-compatible isolated plant does not need a second plant as a pollen donor. Pollination is followed by fertilisation involving gametes.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#185c44"/></marker></defs><rect width="1000" height="640" rx="24" fill="#faf8ec"/><g font-family="Arial, sans-serif"><text x="40" y="54" font-size="31" text-anchor="start" fill="#193e33" font-weight="bold">Self-pollination helps isolated plants reproduce</text><text x="500" y="115" font-size="28" text-anchor="middle" fill="#193e33" font-weight="bold">An isolated, self-compatible plant</text><path d="M500 445 L500 270" stroke="#185c44" stroke-width="4" fill="none"/><path d="M500 390 Q355 300 350 405 Q410 450 500 430" fill="#80b96a" stroke="#185c44" stroke-width="3"/><ellipse cx="585.0" cy="258.0" rx="62" ry="43" fill="#f0deb4" stroke="#bd8d35" stroke-width="3"/><ellipse cx="526.2664445218705" cy="324.57395614066075" rx="62" ry="43" fill="#f0deb4" stroke="#bd8d35" stroke-width="3"/><ellipse cx="431.23355547812946" cy="299.1449676604731" rx="62" ry="43" fill="#f0deb4" stroke="#bd8d35" stroke-width="3"/><ellipse cx="431.23355547812946" cy="216.85503233952687" rx="62" ry="43" fill="#f0deb4" stroke="#bd8d35" stroke-width="3"/><ellipse cx="526.2664445218705" cy="191.42604385933925" rx="62" ry="43" fill="#f0deb4" stroke="#bd8d35" stroke-width="3"/><circle cx="500" cy="260" r="40" fill="#c4dcb1"/><path d="M460 300 L442 222" stroke="#185c44" stroke-width="4" fill="none"/><circle cx="440" cy="218" r="12" fill="#bd8d35"/><path d="M520 300 L525 230" stroke="#185c44" stroke-width="4" fill="none"/><rect x="507" y="217" width="36" height="16" rx="7" fill="#185c44" stroke="#185c44" stroke-width="3"/><text x="320" y="194" font-size="25" text-anchor="middle" fill="#193e33" font-weight="normal">anther</text><path d="M353 201 L424 215" stroke="#185c44" stroke-width="4" fill="none"/><text x="675" y="205" font-size="25" text-anchor="middle" fill="#193e33" font-weight="normal">stigma</text><path d="M632 211 L550 226" stroke="#185c44" stroke-width="4" fill="none"/><path d="M440 192 Q480 140 532 199" fill="none" stroke="#185c44" stroke-width="4" marker-end="url(#arrow)"/><text x="550" y="156" font-size="23" text-anchor="start" fill="#193e33" font-weight="normal">pollen</text><rect x="120" y="475" width="760" height="112" rx="18" fill="#dcefdc" stroke="#185c44" stroke-width="3"/><text x="500" y="517" font-size="26" text-anchor="middle" fill="#193e33" font-weight="normal">No second plant is needed as a pollen donor.</text><text x="500" y="554" font-size="26" text-anchor="middle" fill="#193e33" font-weight="normal">Gametes still fuse if fertilisation follows.</text></g></svg>