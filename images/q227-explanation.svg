<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1090" viewBox="0 0 1000 1090" role="img" aria-labelledby="q227-title q227-desc">
<title id="q227-title">227 · Produce more heat and lose less heat</title>
<desc id="q227-desc">The cold responses are shivering, which increases muscle respiration and heat production, and vasoconstriction, which narrows arterioles supplying surface capillaries and reduces heat loss. Two qualitative panels show muscle contractions and a narrowed arteriole leading towards the skin. Capillaries do not move. Sweating and vasodilation promote cooling instead. Vessel widths and arrows are illustrative, not measured blood-flow or heat-transfer data. Answer A.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1090" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >227 · Produce more heat and lose less heat</text><text x="500" y="111" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Two responses help prevent the body cooling.</text><rect x="65" y="167" width="415" height="510" rx="12" fill="#edf5f8" stroke="none" stroke-width="2"/><rect x="520" y="167" width="415" height="510" rx="12" fill="#edf5f8" stroke="none" stroke-width="2"/><text x="272" y="214" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Shivering</text><path d="M135 288 L165 263 L195 288 L225 263 L255 288 L285 263 L315 288 L345 263 L375 288" fill="none" stroke="#25614b" stroke-width="10"/><text x="272" y="355" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Rapid muscle contractions</text><text x="272" y="394" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >More respiration</text><line x1="272" y1="414" x2="272" y2="466" stroke="#b94a43" stroke-width="4"/><polygon points="272,466 265.07331236687776,452.6950761583107 278.92668763312224,452.6950761583107" fill="#b94a43"/><text x="272" y="517" font-size="28" fill="#b94a43" font-weight="700" text-anchor="middle" >More heat</text><text x="272" y="558" font-size="28" fill="#b94a43" font-weight="700" text-anchor="middle" >is produced</text><text x="728" y="214" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Vasoconstriction</text><text x="728" y="260" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Arteriole narrows</text><rect x="608" y="292" width="240" height="82" rx="2" fill="#e6b9a9" stroke="#b94a43" stroke-width="2"/><rect x="608" y="320" width="240" height="26" rx="0" fill="#fffdf7" stroke="#b94a43" stroke-width="2"/><line x1="655" y1="333" x2="802" y2="333" stroke="#b94a43" stroke-width="3"/><polygon points="802,333 788.6950761583107,339.92668763312224 788.6950761583107,326.07331236687776" fill="#b94a43"/><text x="728" y="427" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Less blood reaches</text><text x="728" y="466" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >skin-surface capillaries</text><line x1="728" y1="491" x2="728" y2="535" stroke="#357ca2" stroke-width="4"/><polygon points="728,535 721.0733123668778,521.6950761583107 734.9266876331222,521.6950761583107" fill="#357ca2"/><text x="728" y="585" font-size="28" fill="#357ca2" font-weight="700" text-anchor="middle" >Less heat is lost</text><rect x="85" y="723" width="830" height="139" rx="12" fill="#f8e6da" stroke="#b94a43" stroke-width="2"/><text x="500.0" y="764" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Sweating + vasodilation promote cooling</text><text x="500.0" y="807" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >They do not form the correct cold-response pair.</text><text x="500" y="919" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative mechanisms; widths and arrows are not measurements.</text><text x="500" y="956" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Arterioles change diameter; capillaries do not move.</text><rect x="24" y="1014" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1048" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer A · Shivering and vasoconstriction</text>
</g></svg>