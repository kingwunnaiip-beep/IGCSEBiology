="#537c9a" stroke-width="5" marker-end="url(#arrow)"/><text x="255" y="120" font-size="28" fill="#173f32" text-anchor="middle" font-weight="700">Forest retained</text><text x="745" y="120" font-size="28" fill="#173f32" text-anchor="middle" font-weight="700">Trees removed</text><text x="255" y="493" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">Roots bind soil.</text><text x="255" y="524" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">Leaves transpire.</text><text x="745" y="493" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">Runoff and soil loss increase.</text><text x="745" y="524" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">Total transpiration decreases.</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">D: flooding ↑; soil loss ↑; transpiration ↓</text></g></svg>