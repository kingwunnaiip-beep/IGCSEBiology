<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-labelledby="q278-title q278-desc">
<title id="q278-title">Three leaf adaptations for photosynthesis</title>
<desc id="q278-desc">A schematic leaf shows air spaces between mesophyll cells carrying carbon dioxide, chloroplasts within the cells capturing light, and nearby xylem supplying water. These correspond to source features 1, 2 and 4. A natural insecticide is a defence rather than one of these direct photosynthetic adaptations.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
