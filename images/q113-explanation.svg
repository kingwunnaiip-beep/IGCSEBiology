" y="380" width="106" height="64" rx="9" fill="#f4d893" stroke="#173d31" stroke-width="2"/><text x="395" y="422" font-size="31" fill="#173d31" font-weight="700" text-anchor="middle" >T</text><text x="605" y="422" font-size="31" fill="#173d31" font-weight="700" text-anchor="middle" >A</text><line x1="462" y1="412" x2="538" y2="412" stroke="#357ca2" stroke-width="4" stroke-dasharray="7 8"/><line x1="294" y1="514" x2="342" y2="514" stroke="#25614b" stroke-width="4"/><line x1="658" y1="514" x2="706" y2="514" stroke="#25614b" stroke-width="4"/><rect x="342" y="482" width="106" height="64" rx="9" fill="#fffdf7" stroke="#173d31" stroke-width="2"/><rect x="552" y="482" width="106" height="64" rx="9" fill="#fffdf7" stroke="#173d31" stroke-width="2"/><text x="395" y="524" font-size="31" fill="#173d31" font-weight="700" text-anchor="middle" >C</text><text x="605" y="524" font-size="31" fill="#173d31" font-weight="700" text-anchor="middle" >G</text><line x1="462" y1="514" x2="538" y2="514" stroke="#357ca2" stroke-width="4" stroke-dasharray="7 8"/><line x1="294" y1="616" x2="342" y2="616" stroke="#25614b" stroke-width="4"/><line x1="658" y1="616" x2="706" y2="616" stroke="#25614b" stroke-width="4"/><rect x="342" y="584" width="106" height="64" rx="9" fill="#fffdf7" stroke="#173d31" stroke-width="2"/><rect x="552" y="584" width="106" height="64" rx="9" fill="#fffdf7" stroke="#173d31" stroke-width="2"/><text x="395" y="626" font-size="31" fill="#173d31" font-weight="700" text-anchor="middle" >G</text><text x="605" y="626" font-size="31" fill="#173d31" font-weight="700" text-anchor="middle" >C</text><line x1="462" y1="616" x2="538" y2="616" stroke="#357ca2" stroke-width="4" stroke-dasharray="7 8"/><text x="500" y="767" font-size="26" fill="#357ca2" font-weight="700" text-anchor="middle" >Dashed links represent hydrogen bonds.</text><rect x="114" y="816" width="772" height="158" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="857" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >The complementary pairs</text><text x="500.0" y="900" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Adenine (A) pairs with thymine (T).</text><text x="500.0" y="937" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Cytosine (C) pairs with guanine (G).</text><text x="500" y="1020" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >This ladder is schematic; DNA normally forms a double helix.</text><rect x="24" y="1054" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1088" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · T and A form a complementary base pair</text>
