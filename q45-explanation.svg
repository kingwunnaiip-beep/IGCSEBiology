<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="q45-title q45-desc"><title id="q45-title">Photosynthesis: four points</title><desc id="q45-desc">Three qualitative graphs show photosynthesis against carbon dioxide, temperature, and light. Point 1 is on the rising carbon dioxide curve. Point 2 is at the temperature optimum. Point 3 is on the falling hot side. Point 4 is on the light plateau.</desc><defs><marker id="q45-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#244d3d"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;font-size:28px;fill:#244d3d}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}.heading{font-size:32px;font-weight:700}.small{font-size:28px}.bold{font-weight:700}.red{fill:#b65350}.blue{fill:#447c9a}.muted{fill:#698476}.arrow{stroke:#244d3d;stroke-width:4;fill:none;marker-end:url(#q45-arrow)}</style><rect x="1" y="1" width="638" height="418" rx="24" fill="#f5f8f2" stroke="#dbe9d7" stroke-width="2"/><text x="30" y="45" class="heading">Photosynthesis: four points</text><text x="30" y="96" >Rate</text><path d="M38 130 V329 H196" fill="none" stroke="#698476" stroke-width="3"/><path d="M243 130 V329 H401" fill="none" stroke="#698476" stroke-width="3"/><path d="M448 130 V329 H606" fill="none" stroke="#698476" stroke-width="3"/><path d="M43 316 C80 245 98 178 149 165 C164 161 181 161 194 161" fill="none" stroke="#659b78" stroke-width="6"/><path d="M248 315 C275 285 284 187 315 151" fill="none" stroke="#659b78" stroke-width="6"/><path d="M315 151 C336 126 356 207 394 310" fill="none" stroke="#b65350" stroke-width="6"/><path d="M453 316 C480 228 500 175 536 166 C553 163 580 163 602 163" fill="none" stroke="#659b78" stroke-width="6"/><circle cx="85" cy="245" r="20" fill="#f5f8f2" stroke="#244d3d" stroke-width="4"/><text x="85" y="255" text-anchor="middle" class="bold" fill="#244d3d">1</text><circle cx="316" cy="151" r="20" fill="#f5f8f2" stroke="#244d3d" stroke-width="4"/><text x="316" y="161" text-anchor="middle" class="bold" fill="#244d3d">2</text><circle cx="376" cy="262" r="20" fill="#f5f8f2" stroke="#b65350" stroke-width="4"/><text x="376" y="272" text-anchor="middle" class="bold" fill="#b65350">3</text><circle cx="567" cy="163" r="20" fill="#f5f8f2" stroke="#244d3d" stroke-width="4"/><text x="567" y="173" text-anchor="middle" class="bold" fill="#244d3d">4</text><text x="116" y="384" text-anchor="middle">CO₂</text><text x="321" y="384" text-anchor="middle">Temperature</text><text x="526" y="384" text-anchor="middle">Light</text></svg>
