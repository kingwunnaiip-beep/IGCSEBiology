<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">At X, adding carbon dioxide raises the rate</title><desc id="desc">The low-carbon-dioxide photosynthesis curve is flat at X, so increasing light cannot increase the rate. At the same light intensity, a higher-carbon-dioxide curve has a higher rate, identifying carbon dioxide as limiting.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="53" font-size="31" text-anchor="start" font-weight="bold" fill="#173f32">At X, adding carbon dioxide raises the rate</text><path d="M145 465 L815 465" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M145 465 L145 135" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M145 465 C250 375 350 330 455 330 H795" fill="none" stroke="#8f9c8c" stroke-width="4"/><text x="815" y="337" font-size="22" text-anchor="start" font-weight="normal" fill="#173f32">0.02% CO₂</text><path d="M145 465 C250 375 350 270 455 270 H795" fill="none" stroke="#24644b" stroke-width="4"/><text x="815" y="277" font-size="22" text-anchor="start" font-weight="normal" fill="#173f32">0.04% CO₂</text><path d="M145 465 C250 375 350 175 455 175 H795" fill="none" stroke="#537c9a" stroke-width="4"/><text x="815" y="182" font-size="22" text-anchor="start" font-weight="normal" fill="#173f32">0.10% CO₂</text><circle cx="610" cy="270" r="7" fill="#173f32" stroke="#173f32" stroke-width="1"/><text x="600" y="247" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">X</text><path d="M610 260 L610 187" fill="none" stroke="#537c9a" stroke-width="4" marker-end="url(#blueArrow)"/><text x="635" y="220" font-size="24" text-anchor="start" font-weight="normal" fill="#173f32">+ CO₂</text><path d="M640 290 L760 290" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="512" font-size="25" text-anchor="middle" font-weight="normal" fill="#173f32">Light intensity</text><text x="53" y="290" font-size="25" text-anchor="middle" font-weight="normal" fill="#173f32" transform="rotate(-90 53 290)">Photosynthesis rate</text><text x="500" y="553" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">A: carbon dioxide concentration is limiting</text></g></svg>