<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1100" viewBox="0 0 1000 1100" role="img" aria-labelledby="q168-title q168-desc">
<title id="q168-title">168 · Count the qualifying arthropods</title>
<desc id="q168-desc">Answer A: more than three pairs of jointed legs excludes insects, which have exactly three pairs. Arachnids have four pairs; crustaceans and myriapods have more than three pairs. The source counts are 10 arachnids, 12 crustaceans, 16 insects and 5 myriapods. The included numbers of organisms add to 10 plus 12 plus 5 equals 27. This original classification-and-calculation diagram uses the actual source bar-chart values and does not count total legs.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1100" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >168 · Count the qualifying arthropods</text><text x="500" y="110" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >More than three pairs = more than six legs</text><rect x="65" y="151" width="870" height="111" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="91" y="194" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >Arachnids</text><text x="91" y="235" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >4 pairs</text><text x="578" y="216" font-size="35" fill="#173d31" font-weight="700" text-anchor="middle" >10</text><text x="790" y="216" font-size="27" fill="#25614b" font-weight="700" text-anchor="middle" >INCLUDE</text><rect x="65" y="288" width="870" height="111" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="91" y="331" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >Crustaceans</text><text x="91" y="372" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >More than 3 pairs</text><text x="578" y="353" font-size="35" fill="#173d31" font-weight="700" text-anchor="middle" >12</text><text x="790" y="353" font-size="27" fill="#25614b" font-weight="700" text-anchor="middle" >INCLUDE</text><rect x="65" y="425" width="870" height="111" rx="12" fill="#f8e9df" stroke="#b94a43" stroke-width="2"/><text x="91" y="468" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >Insects</text><text x="91" y="509" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >Exactly 3 pairs</text><text x="578" y="490" font-size="35" fill="#173d31" font-weight="700" text-anchor="middle" >16</text><text x="790" y="490" font-size="27" fill="#b94a43" font-weight="700" text-anchor="middle" >EXCLUDE</text><rect x="65" y="562" width="870" height="111" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="91" y="605" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >Myriapods</text><text x="91" y="646" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >More than 3 pairs</text><text x="578" y="627" font-size="35" fill="#173d31" font-weight="700" text-anchor="middle" >5</text><text x="790" y="627" font-size="27" fill="#25614b" font-weight="700" text-anchor="middle" >INCLUDE</text><text x="500" y="758" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Add organisms, not their legs</text><rect x="95" y="803" width="810" height="127" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500" y="880" font-size="43" fill="#173d31" font-weight="700" text-anchor="middle" >10 + 12 + 5 = 27</text><text x="500" y="985" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Values are read from the published field-sample bar chart.</text><rect x="24" y="1024" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1058" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer A · 27 arthropods</text>
</g></svg>