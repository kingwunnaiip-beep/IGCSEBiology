<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">A shunt joins an arteriole directly to a venule</title><desc id="desc">An arteriole and venule are connected by both a surface capillary bed and a direct shunt vessel. The highlighted shunt route bypasses the capillaries.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="53" font-size="30" text-anchor="start" font-weight="bold" fill="#173f32">A shunt joins an arteriole directly to a venule</text><path d="M80 135 Q200 125 320 135 T560 135 T800 135 T930 135" fill="none" stroke="#24644b" stroke-width="3" /><text x="80" y="112" font-size="24" text-anchor="start" font-weight="normal" fill="#173f32">Skin surface</text><path d="M210 470 V310 Q210 215 350 205" fill="none" stroke="#b15f52" stroke-width="23" /><path d="M650 205 Q790 215 790 310 V470" fill="none" stroke="#537c9a" stroke-width="23" /><path d="M350 200 Q500 145 650 200" fill="none" stroke="#b15f52" stroke-width="7" /><path d="M350 225 Q500 170 650 225" fill="none" stroke="#b15f52" stroke-width="7" /><path d="M350 250 Q500 195 650 250" fill="none" stroke="#b15f52" stroke-width="7" /><path d="M350 275 Q500 220 650 275" fill="none" stroke="#b15f52" stroke-width="7" /><path d="M210 375 Q500 310 790 375" fill="none" stroke="#806a92" stroke-width="25" /><path d="M320 352 L670 352" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="500" y="410" font-size="28" text-anchor="middle" font-weight="bold" fill="#173f32">Shunt vessel</text><text x="500" y="449" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">Bypasses surface capillaries</text><text x="210" y="508" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">Arteriole</text><text x="790" y="508" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">Venule</text><text x="500" y="300" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">Surface capillary bed</text><text x="500" y="548" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">Arteriole → shunt → venule: answer B.</text></g></svg>