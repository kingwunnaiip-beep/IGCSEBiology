<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which characteristics do arrows X and Y represent?</title><desc id="desc">Identify X and Y independently: X shows obtaining materials for nutrition, and Y shows removal of metabolic waste by excretion. Together they give answer B, nutrition and excretion.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e" /></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8" /><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Which characteristics do arrows X and Y represent?</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><circle cx="60" cy="160" r="16" fill="#285d4c" /><text x="60" y="166" text-anchor="middle" font-size="18" fill="white">X</text><text x="50" y="207" font-size="23" font-weight="700">X: materials for food</text><text x="50" y="285" font-size="21" font-weight="400">Plant and animal nutrition</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><circle cx="415" cy="160" r="16" fill="#285d4c" /><text x="415" y="166" text-anchor="middle" font-size="18" fill="white">Y</text><text x="405" y="207" font-size="23" font-weight="700">Y: waste leaves</text><text x="405" y="236" font-size="23" font-weight="700">organisms</text><text x="405" y="285" font-size="21" font-weight="400">Metabolic products removed</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><circle cx="770" cy="160" r="16" fill="#285d4c" /><text x="770" y="166" text-anchor="middle" font-size="18" fill="white">B</text><text x="760" y="207" font-size="23" font-weight="700">Characteristics</text><text x="760" y="285" font-size="21" font-weight="400">Nutrition and excretion</text><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text><text x="361" y="256" font-size="34" font-weight="700" text-anchor="middle">+</text><text x="716" y="256" font-size="34" font-weight="700" text-anchor="middle">=</text></g></svg>