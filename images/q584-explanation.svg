<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Water cycle: S evaporation, T precipitation</title><desc id="desc">Liquid water in a lake evaporates upward at S. Water vapour condenses to form cloud droplets. Rain descends from the cloud to land at T and water drains back toward the lake.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="1.8"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#b85c50" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="38" y="54" font-size="30" fill="#173f32" font-weight="bold">Water cycle: S evaporation, T precipitation</text><path d="M30 420 Q180 390 345 427 Q590 325 970 420 L970 505 H30 Z" fill="#e4f0df" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M30 427 Q190 397 350 429 L390 505 H30 Z" fill="#dcebf2" stroke="#537c9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M50 450 q35 -10 65 0 t65 0 t65 0 t65 0" fill="none" stroke="#537c9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M50 472 q35 -10 65 0 t65 0 t65 0 t65 0" fill="none" stroke="#537c9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M50 493 q35 -10 65 0 t65 0 t65 0 t65 0" fill="none" stroke="#537c9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M440 200 C395 150 460 105 497 138 C515 70 602 87 608 145 C676 130 687 205 631 207 Z" fill="#dcebf2" stroke="#537c9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M215 370 Q210 230 398 195" fill="none" stroke="#537c9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><text x="55" y="170" font-size="25" text-anchor="start" fill="#173f32" font-weight="bold">S · Evaporation</text><text x="55" y="201" font-size="25" text-anchor="start" fill="#173f32" font-weight="bold">liquid → vapour</text><text x="538" y="85" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">Condensation</text><path d="M651 211 Q785 260 796 384" fill="none" stroke="#537c9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M660 270 l-8 17" fill="none" stroke="#537c9a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M698 295 l-8 17" fill="none" stroke="#537c9a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M734 321 l-8 17" fill="none" stroke="#537c9a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M686 344 l-8 17" fill="none" stroke="#537c9a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M760 365 l-8 17" fill="none" stroke="#537c9a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="791" y="224" font-size="25" text-anchor="start" fill="#173f32" font-weight="bold">T · Precipitation</text><text x="791" y="255" font-size="25" text-anchor="start" fill="#173f32" font-weight="bold">cloud → land</text><path d="M584 420 C587.65 368.9 578.89 347.0 589.11 303.2" fill="none" stroke="#24644b" stroke-width="3.65" stroke-linecap="round" stroke-linejoin="round" /><path d="M584 398.1 Q536.55 367.44 546.04 394.45000000000005 Q563.56 406.86 584 398.1" fill="#82b36b" stroke="#24644b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M584 374.74 Q631.45 344.08 621.96 371.09000000000003 Q604.44 383.5 584 374.74" fill="#82b36b" stroke="#24644b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M584 351.38 Q536.55 320.71999999999997 546.04 347.73 Q563.56 360.14 584 351.38" fill="#82b36b" stroke="#24644b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M584 328.02 Q631.45 297.35999999999996 621.96 324.37 Q604.44 336.78 584 328.02" fill="#82b36b" stroke="#24644b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M775 457 Q620 510 413 465" fill="none" stroke="#537c9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><text x="500" y="558" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">C · S moves water into the air; T returns water from clouds to land.</text></g></svg>
