<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="q316-title q316-desc">
<title id="q316-title">Two pairs of legs on each body segment</title>
<desc id="q316-desc">An enlarged schematic of one repeated body unit shows two legs on the left and two legs on the right: four legs in total, or two pairs. A long segmented body with this feature identifies a millipede-type myriapod.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="700" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Two pairs of legs on each body segment</text><text x="550" y="110" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Enlarged body unit from the question</text><rect x="415" y="185" width="270" height="270" rx="60" fill="#dce9dc" stroke="#25614b" stroke-width="4"/><path d="M415 250 L350 215 L295 265" fill="none" stroke="#25614b" stroke-width="9"/><path d="M685 250 L750 215 L805 265" fill="none" stroke="#25614b" stroke-width="9"/><path d="M415 375 L350 340 L295 390" fill="none" stroke="#25614b" stroke-width="9"/><path d="M685 375 L750 340 L805 390" fill="none" stroke="#25614b" stroke-width="9"/><text x="120" y="185" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >Two legs</text><text x="120" y="225" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >on this side</text><line x1="250" y1="240" x2="350" y2="215" stroke="#357ca2" stroke-width="2"/><line x1="250" y1="250" x2="350" y2="340" stroke="#357ca2" stroke-width="2"/><text x="980" y="185" font-size="28" fill="#173d31" font-weight="700" text-anchor="end" >Two legs</text><text x="980" y="225" font-size="26" fill="#173d31" font-weight="400" text-anchor="end" >on this side</text><line x1="850" y1="240" x2="750" y2="215" stroke="#357ca2" stroke-width="2"/><line x1="850" y1="250" x2="750" y2="340" stroke="#357ca2" stroke-width="2"/><text x="550" y="505" font-size="32" fill="#173d31" font-weight="700" text-anchor="middle" >4 legs = 2 pairs</text><text x="550" y="552" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Many repeated segments + many pairs of jointed legs</text><text x="550" y="592" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >→ myriapods (the millipede pattern described)</text><rect x="24" y="624" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="658" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >D — myriapods</text>
</g></svg>