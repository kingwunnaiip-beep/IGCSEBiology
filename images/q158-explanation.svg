<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1240" viewBox="0 0 1000 1240" role="img" aria-labelledby="q158-title q158-desc">
<title id="q158-title">158 · Early embryonic stem cells divide by mitosis</title>
<desc id="q158-desc">Answer C. In an early mammalian embryo, unspecialised embryonic stem cells divide by mitosis. Mitosis produces genetically identical nuclei with the same chromosome number, apart from mutation, and increases cell number. Stem cells can later differentiate into specialised cells. The drawing shows one stem cell dividing into two cells, followed by a separate note about later differentiation. X symbols represent copied chromosomes before separation; bars represent daughter chromosomes after the copies separate. Shapes and symbol counts are illustrative and do not claim a particular species or chromosome count. Meiosis is associated with gamete formation; a zygote is the single cell formed at fertilisation.</desc>
