<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1100" viewBox="0 0 1000 1100" role="img" aria-labelledby="q180-title q180-desc">
<title id="q180-title">180 · Pectinase helps release more fruit juice</title>
<desc id="q180-desc">Qualitative fruit-tissue model. Pectinase breaks down pectin in plant cell-wall material and between adjacent cells, helping tissue separate and release more juice. The before and after cell symbols do not represent cell counts, measured distances or a juice-yield experiment. Pectinase does not digest protein or starch; proteases and amylases act on those substrates respectively. AnswerB.</desc>
