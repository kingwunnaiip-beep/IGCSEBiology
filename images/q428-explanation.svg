<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Escaping water vapour reduces the measured mass</title><desc id="desc">An uncovered plant loses water vapour to the room and shows a larger measured mass decrease. The bag retains water within the weighed system and builds humidity, so measured mass decreases less.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#39725b"/></marker></defs><rect width="1100" height="560" rx="22" fill="#fbf8e9"/><g font-family="Arial, sans-serif"><text x="40" y="55" font-size="30" text-anchor="start" fill="#173d31">Escaping water vapour reduces the measured mass</text><rect x="55" y="130" width="435" height="120" rx="15" fill="#e4edcf" stroke="#39725b" stroke-width="3"/><text x="272.5" y="172" font-size="25" text-anchor="middle" fill="#173d31">Plant 1: uncovered</text><text x="272.5" y="204" font-size="25" text-anchor="middle" fill="#173d31">Water vapour escapes to room</text><rect x="610" y="130" width="435" height="120" rx="15" fill="#e4edcf" stroke="#39725b" stroke-width="3"/><text x="827.5" y="172" font-size="25" text-anchor="middle" fill="#173d31">Plant 2: bag encloses pot</text><text x="827.5" y="204" font-size="25" text-anchor="middle" fill="#173d31">Water stays within the setup</text><path d="M260 270 L260 345" fill="none" stroke="#39725b" stroke-width="5" marker-end="url(#arrow)"/><path d="M825 270 L825 345" fill="none" stroke="#39725b" stroke-width="5" marker-end="url(#arrow)"/><rect x="55" y="360" width="435" height="100" rx="15" fill="#e4edcf" stroke="#39725b" stroke-width="3"/><text x="272.5" y="402" font-size="25" text-anchor="middle" fill="#173d31">Larger measured mass decrease</text><rect x="610" y="360" width="435" height="100" rx="15" fill="#e4edcf" stroke="#39725b" stroke-width="3"/><text x="827.5" y="402" font-size="25" text-anchor="middle" fill="#173d31">Smaller measured mass decrease</text><text x="550" y="505" font-size="24" text-anchor="middle" fill="#173d31">Enclosure also increases humidity, slowing further transpiration.</text><text x="40" y="530" font-size="17" text-anchor="start" fill="#536b57">Original teaching schematic • qualitative, not to scale</text></g></svg>