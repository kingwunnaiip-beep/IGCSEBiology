ont-weight="400" text-anchor="end" >All cells = 100%</text><rect x="85" y="915" width="830" height="123" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="957" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >31.3% &gt; 13.6%</text><text x="500.0" y="1001" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >X has the higher mitotic index.</text><rect x="24" y="1094" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1128" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer A · Tissue X · Mitotic index 31.3%</text>
