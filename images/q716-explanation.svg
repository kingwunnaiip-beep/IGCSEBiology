<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which molecular structure is an amino acid?</title><desc id="desc">Structure B is glycine, H2N–CH2–COOH. Its amino and carboxyl groups occur on the same molecule, identifying an amino acid.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700" text-anchor="start" fill="#193e34">Which molecular structure is an amino acid?</text><rect x="30" y="125" width="1020" height="245" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="540" y="166" font-size="25" font-weight="700" text-anchor="middle" fill="#193e34">Structure B: glycine (an amino acid)</text><rect x="165" y="202" width="160" height="72" rx="18" fill="#dceadd" stroke="#9fbaab" stroke-width="2"/><rect x="710" y="202" width="220" height="72" rx="18" fill="#e4eddc" stroke="#9fbaab" stroke-width="2"/><text x="245" y="250" font-size="38" font-weight="700" text-anchor="middle" fill="#193e34">H₂N</text><text x="520" y="250" font-size="38" font-weight="700" text-anchor="middle" fill="#193e34">CH₂</text><text x="820" y="250" font-size="38" font-weight="700" text-anchor="middle" fill="#193e34">COOH</text><path d="M325 237 H450" fill="none" stroke="#35735e" stroke-width="3"/><path d="M590 237 H710" fill="none" stroke="#35735e" stroke-width="3"/><text x="245" y="318" font-size="23" font-weight="700" text-anchor="middle" fill="#193e34">Amino group</text><text x="820" y="318" font-size="23" font-weight="700" text-anchor="middle" fill="#193e34">Carboxyl group</text><text x="540" y="355" font-size="22" font-weight="700" text-anchor="middle" fill="#193e34">Both groups are present on the same molecule → answer B</text><text x="38" y="406" font-size="17" font-weight="400" text-anchor="start" fill="#193e34">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>