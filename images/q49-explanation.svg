<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="q49-title q49-desc"><title id="q49-title">Alkaline pH denatures pepsin</title><desc id="q49-desc">At acidic pH, triangular substrate 1 fits a stomach enzyme and is converted into products 2. Under alkaline conditions, process R changes the active site, so the substrate no longer fits.</desc><defs><marker id="q49-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#244d3d"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;font-size:28px;fill:#244d3d}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}.heading{font-size:32px;font-weight:700}.small{font-size:28px}.bold{font-weight:700}.red{fill:#b65350}.blue{fill:#447c9a}.muted{fill:#698476}.arrow{stroke:#244d3d;stroke-width:4;fill:none;marker-end:url(#q49-arrow)}</style><rect x="1" y="1" width="638" height="418" rx="24" fill="#f5f8f2" stroke="#dbe9d7" stroke-width="2"/><text x="30" y="45" class="heading">Alkaline pH denatures pepsin</text><text x="44" y="102" >Acidic</text><text x="356" y="102" >Alkaline · R</text><g transform="translate(120 235) scale(0.98)"><path d="M56 -64 C8 -91 -61 -61 -66 -10 C-73 43 -28 80 25 68 C58 60 78 40 71 13 L34 -10 L71 -34 C68 -49 65 -57 56 -64 Z" fill="#659b78" stroke="#244d3d" stroke-width="4"/></g><path d="M259.5 186.6 L259.5 245.4 L208.05 216 Z" fill="#bd9550" stroke="#244d3d" stroke-width="3"/><text x="237" y="165" text-anchor="middle" class="bold">1</text><path d="M213 216 H197" class="arrow"/><path d="M257 284.4 L257 315.6 L229.7 300 Z" fill="#bd9550" stroke="#244d3d" stroke-width="3"/><path d="M290 304.4 L290 335.6 L262.7 320 Z" fill="#efe4c8" stroke="#244d3d" stroke-width="3"/><text x="281" y="367" text-anchor="middle" class="bold">2</text><path d="M201 263 L230 286" class="arrow"/><line x1="323" y1="116" x2="323" y2="351" stroke="#dbe9d7" stroke-width="3"/><g transform="translate(442 235) scale(0.98)"><path d="M52 -60 C5 -91 -62 -62 -65 -8 C-72 45 -26 80 24 67 C66 56 73 22 49 4 Q10 3 43 -25 C59 -35 61 -50 52 -60 Z" fill="#f1ded8" stroke="#244d3d" stroke-width="4"/></g><path d="M581.5 186.6 L581.5 245.4 L530.05 216 Z" fill="#bd9550" stroke="#244d3d" stroke-width="3"/><text x="558" y="165" text-anchor="middle" class="bold">1</text><line x1="510" y1="243" x2="538" y2="273" stroke="#b65350" stroke-width="5"/><line x1="538" y1="243" x2="510" y2="273" stroke="#b65350" stroke-width="5"/><text x="35" y="402" class="bold">Substrate fits</text><text x="355" y="402" class="bold">Shape changed</text></svg>
