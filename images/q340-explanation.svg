<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="730" viewBox="0 0 1100 730" role="img" aria-labelledby="q340-title q340-desc">
<title id="q340-title">Trace oxygen from an airway into the blood</title>
<desc id="q340-desc">Of the listed structures, inhaled oxygen passes through 4 larynx, then 1 bronchiole, crosses 3 alveolus wall and reaches 2 capillary. Other airway sections between larynx and bronchiole are omitted from the numbered choices.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="730" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Trace oxygen from an airway into the blood</text><rect x="50" y="115" width="460" height="160" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><circle cx="98" cy="162" r="28" fill="white" stroke="#25614b" stroke-width="3"/><text x="98" y="171" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >4</text><text x="155" y="170" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >Larynx</text><text x="280" y="227" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Air passes through the larynx.</text><rect x="590" y="115" width="460" height="160" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><circle cx="638" cy="162" r="28" fill="white" stroke="#25614b" stroke-width="3"/><text x="638" y="171" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >1</text><text x="695" y="170" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >Bronchiole</text><text x="820" y="227" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >A small airway leads to alveoli.</text><rect x="590" y="390" width="460" height="160" rx="12" fill="#edf5f9" stroke="#357ca2" stroke-width="2"/><circle cx="638" cy="437" r="28" fill="white" stroke="#25614b" stroke-width="3"/><text x="638" y="446" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >3</text><text x="695" y="445" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >Alveolus wall</text><text x="820" y="502" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Oxygen diffuses across</text><text x="820" y="541" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >the thin alveolus wall.</text><rect x="50" y="390" width="460" height="160" rx="12" fill="#edf5f9" stroke="#357ca2" stroke-width="2"/><circle cx="98" cy="437" r="28" fill="white" stroke="#25614b" stroke-width="3"/><text x="98" y="446" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >2</text><text x="155" y="445" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >Capillary</text><text x="280" y="502" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Oxygen enters the blood.</text><line x1="525" y1="195" x2="575" y2="195" stroke="#25614b" stroke-width="4"/><polygon points="575,195 561.6950761583107,201.92668763312224 561.6950761583107,188.07331236687776" fill="#25614b"/><line x1="820" y1="295" x2="820" y2="370" stroke="#25614b" stroke-width="4"/><polygon points="820,370 813.0733123668778,356.6950761583107 826.9266876331222,356.6950761583107" fill="#25614b"/><line x1="575" y1="470" x2="525" y2="470" stroke="#357ca2" stroke-width="4"/><polygon points="525,470 538.3049238416893,463.07331236687776 538.3049238416893,476.92668763312224" fill="#357ca2"/><text x="550" y="605" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Only the four listed structures are numbered.</text><text x="550" y="644" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Airway passage comes before diffusion into blood.</text><rect x="24" y="654" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="688" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C: 4 → 1 → 3 → 2</text>
</g></svg>