<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="t385 d385"><title id="t385">Active and passive movement</title><desc id="d385">Glucose and nitrate uptake use respiration energy. Water evaporation and diffusion are passive. Arrows show movement against a concentration gradient for active transport.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#286346"/></marker></defs><rect width="960" height="440" rx="24" fill="#f7f5e9"/><style>text{font-family:Arial,sans-serif;fill:#183b2b;font-size:22px}.title{font-size:29px;font-weight:700}.small{font-size:19px}.strong{font-weight:700}.box{fill:#e0eddc;stroke:#60876b;stroke-width:2}.arrow{fill:none;stroke:#286346;stroke-width:4;marker-end:url(#arrow)}</style><text class="title" x="38" y="50">Active and passive movement</text><rect class="box" x="38" y="85" width="555" height="245" rx="14"/><text class="strong" x="62" y="124">ACTIVE TRANSPORT</text><text x="62" y="164">Glucose uptake • nitrate uptake</text><circle cx="107" cy="230" r="9" fill="#578c5b"/><circle cx="151" cy="250" r="9" fill="#578c5b"/><path class="arrow" d="M195 230 H325"/><g fill="#578c5b"><circle cx="376" cy="205" r="9"/><circle cx="420" cy="205" r="9"/><circle cx="464" cy="205" r="9"/><circle cx="376" cy="245" r="9"/><circle cx="420" cy="245" r="9"/><circle cx="464" cy="245" r="9"/></g><text class="small" x="65" y="302">Lower concentration → higher concentration</text><rect class="box" x="625" y="85" width="297" height="245" rx="14"/><text class="strong" x="650" y="124">PASSIVE MOVEMENT</text><text x="650" y="168">Water evaporates</text><text x="650" y="199">from mesophyll;</text><text x="650" y="242">vapour diffuses</text><text x="650" y="273">into air spaces.</text><path class="arrow" d="M302 386 V336"/><text class="strong" x="57" y="417">Energy from respiration</text><text class="small" x="650" y="392">No respiration energy</text><text class="small" x="650" y="419">needed for movement</text></svg>