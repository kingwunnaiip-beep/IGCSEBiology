<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1230" viewBox="0 0 1000 1230" role="img" aria-labelledby="q117-title q117-desc">
<title id="q117-title">117 · Asexual reproduction keeps desired crop traits</title>
<desc id="q117-desc">Answer A: all offspring inherit the desired characteristic. Asexual reproduction uses one parent without the fusion of gametes. Mitosis produces genetically identical offspring, so a desirable inherited characteristic of the selected parent is retained in its clones, apart from mutation. This qualitative drawing uses identical stylised plants to represent the same inherited trait, not guaranteed growth under every environmental condition. Low genetic variation can make a whole crop vulnerable to the same disease or environmental change.</desc>
