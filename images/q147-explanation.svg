h="3"/><polygon points="740,390 737.7528575449442,375.16927679488674 750.8604222919083,379.653443682006" fill="#25614b"/><circle cx="732" cy="433" r="35" fill="#d7c7e2" stroke="#815c94" stroke-width="3"/><text x="732" y="543" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Male nucleus + egg nucleus</text><text x="732" y="580" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >fuse inside an ovule.</text><text x="267" y="643" font-size="25" fill="#25614b" font-weight="700" text-anchor="middle" >OCCURRED in the source</text><text x="732" y="643" font-size="25" fill="#b94a43" font-weight="700" text-anchor="middle" >NOT YET in the source</text><rect x="75" y="727" width="850" height="152" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="767" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Use the evidence in the original flower diagram</text><text x="500.0" y="810" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Pollen is on the stigma.</text><text x="500.0" y="845" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Fertilisation is a later event involving nuclei.</text><text x="500" y="952" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Separate qualitative process models; not a copy of the source figure.</text><rect x="24" y="994" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1028" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · Pollination: yes · Fertilisation: no</text>
