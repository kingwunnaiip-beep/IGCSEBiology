<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Kidney labels: cortex, ureter and medulla</title><desc id="desc">A kidney section shows an outer cortex, inner medullary pyramids, a central collecting pelvis and the ureter leaving towards the bladder. X labels cortex, Y ureter and Z medulla.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="53" font-size="30" text-anchor="start" font-weight="bold" fill="#173f32">Kidney labels: cortex, ureter and medulla</text><path d="M470 125 C245 70 190 230 225 370 C250 505 400 510 505 455 C595 410 560 345 505 310 C465 280 465 255 520 220 C580 175 550 135 470 125 Z" fill="#d9e3c7" stroke="#24644b" stroke-width="4" /><path d="M450 160 C290 135 255 255 285 370 C310 455 410 465 475 420 C520 385 510 350 465 320 C410 280 440 230 490 200 Z" fill="#b8cda4" stroke="#24644b" stroke-width="3" /><polygon points="320,185 385,170 425,270" fill="#537c9a" stroke="#24644b" stroke-width="2"/><polygon points="277,265 292,340 410,305" fill="#537c9a" stroke="#24644b" stroke-width="2"/><polygon points="310,385 370,440 435,340" fill="#537c9a" stroke="#24644b" stroke-width="2"/><polygon points="415,440 480,405 455,335" fill="#537c9a" stroke="#24644b" stroke-width="2"/><path d="M455 250 Q410 280 440 315 Q460 335 490 330 L535 350 V495 H570 V335 Q540 305 495 300 Q475 290 490 260 Z" fill="#f2e4c8" stroke="#24644b" stroke-width="3" /><path d="M510 255 H720" fill="none" stroke="#b15f52" stroke-width="17" /><path d="M520 282 H720" fill="none" stroke="#537c9a" stroke-width="17" /><text x="95" y="145" font-size="28" text-anchor="start" font-weight="bold" fill="#173f32">X: cortex</text><line x1="230" y1="152" x2="306" y2="169" stroke="#24644b" stroke-width="2"/><text x="75" y="460" font-size="28" text-anchor="start" font-weight="bold" fill="#173f32">Z: medulla</text><line x1="250" y1="450" x2="348" y2="400" stroke="#24644b" stroke-width="2"/><text x="755" y="460" font-size="28" text-anchor="start" font-weight="bold" fill="#173f32">Y: ureter</text><line x1="730" y1="450" x2="573" y2="427" stroke="#24644b" stroke-width="2"/><text x="755" y="270" font-size="23" text-anchor="start" font-weight="normal" fill="#173f32">Renal vessels</text><text x="500" y="548" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">X outer cortex • Y tube to the bladder • Z inner medulla (B).</text></g></svg>