<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1300" viewBox="0 0 1000 1300" role="img" aria-labelledby="q115-title q115-desc">
<title id="q115-title">115 · Ribosomes assemble amino acids into a chain</title>
<desc id="q115-desc">Answer A: during protein synthesis, a ribosome assembles amino acids in a chain. A gene is a sequence of DNA bases. A messenger RNA copy of the gene carries the code from the nucleus to a ribosome in the cytoplasm. The ribosome reads the mRNA sequence and links amino acids in the coded order to form a polypeptide. Proteins are made of amino acids, not DNA or RNA bases. The pathway and ribosome are qualitative teaching schematics, not to molecular scale; amino acid colours and counts are illustrative.</desc>
