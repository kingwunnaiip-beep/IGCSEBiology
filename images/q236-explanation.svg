<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img" aria-labelledby="q236-title q236-desc">
<title id="q236-title">Link the septal defect to energy for growth</title>
<desc id="q236-desc">Qualitative cause-and-effect explanation for the published question: a hole in the ventricular septum permits mixing of blood, reducing oxygen available for aerobic respiration in body cells, and reducing energy available for growth. No blood pressures are inferred.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="670" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Link the septal defect to energy for growth</text><text x="500" y="104" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Follow the oxygen supply to body cells.</text><rect x="45" y="155" width="410" height="140" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="250.0" y="193" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Septal hole</text><text x="250.0" y="232" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >opening in the wall</text><text x="250.0" y="266" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >between the ventricles</text><rect x="545" y="155" width="410" height="140" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="750.0" y="193" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Mixing of blood</text><text x="750.0" y="232" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >oxygenated blood mixes</text><text x="750.0" y="266" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >with deoxygenated blood</text><line x1="465" y1="225" x2="535" y2="225" stroke="#b94a43" stroke-width="4"/><polygon points="535,225 521.6950761583107,231.92668763312224 521.6950761583107,218.07331236687776" fill="#b94a43"/><line x1="750" y1="311" x2="750" y2="349" stroke="#25614b" stroke-width="4"/><polygon points="750,349 743.0733123668778,335.6950761583107 756.9266876331222,335.6950761583107" fill="#25614b"/><rect x="545" y="362" width="410" height="144" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="750.0" y="400" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Less oxygen to body cells</text><text x="750.0" y="439" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >less aerobic respiration</text><text x="750.0" y="473" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >and energy release</text><rect x="45" y="362" width="410" height="144" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="250.0" y="400" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Poor growth</text><text x="250.0" y="439" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >less energy available</text><text x="250.0" y="473" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >for building cell material</text><line x1="535" y1="435" x2="465" y2="435" stroke="#25614b" stroke-width="4"/><polygon points="465,435 478.3049238416893,428.07331236687776 478.3049238416893,441.92668763312224" fill="#25614b"/><text x="500" y="564" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >The source drawing supplies no blood-pressure measurements.</text><rect x="24" y="594" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="628" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C — mixing leaves less oxygen available for respiration</text>
</g></svg>