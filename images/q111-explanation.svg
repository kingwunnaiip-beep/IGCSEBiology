 >More surface for lipase.</text><rect x="83" y="627" width="834" height="145" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="668" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Emulsification</text><text x="500.0" y="711" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Larger total surface area → faster action of lipase.</text><rect x="83" y="807" width="834" height="145" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="848" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Chemical digestion by lipase</text><text x="500.0" y="891" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Fat molecules → fatty acids + glycerol</text><text x="500" y="999" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Droplet drawings are qualitative and are not to scale.</text><rect x="24" y="1034" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1068" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · Bile emulsifies fat into smaller droplets</text>
