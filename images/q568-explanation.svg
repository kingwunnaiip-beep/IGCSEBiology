<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">W is substrate; X is enzyme; Y is product</title><desc id="desc">Lock-and-key geometry shows triangular substrate W binding to an enzyme, then splitting into smaller products Y while enzyme X remains unchanged.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="bluearrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="45" font-size="28" fill="#173f32" text-anchor="start" font-weight="bold">W is substrate; X is enzyme; Y is product</text><text x="500" y="555" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">Enzyme X is unchanged; substrate W is broken down into products Y.</text><g transform="translate(140 320) scale(1)"><path d="M52 -47 A70 70 0 1 0 52 47 L0 0 Z" fill="#e4f0df" stroke="#24644b" stroke-width="3" /></g><polygon points="270,250 270,390 195,320" fill="#f2ddbc" stroke="#bc824b" stroke-width="3"/><g transform="translate(490 320) scale(1)"><path d="M52 -47 A70 70 0 1 0 52 47 L0 0 Z" fill="#e4f0df" stroke="#24644b" stroke-width="3" /><polygon points="0,0 52,-47 52,47" fill="#f2ddbc" stroke="#bc824b" stroke-width="3"/></g><g transform="translate(790 320) scale(1)"><path d="M52 -47 A70 70 0 1 0 52 47 L0 0 Z" fill="#e4f0df" stroke="#24644b" stroke-width="3" /></g><polygon points="920,225 920,280 865,270" fill="#f2ddbc" stroke="#bc824b" stroke-width="3"/><polygon points="915,380 915,435 865,390" fill="#f2ddbc" stroke="#bc824b" stroke-width="3"/><path d="M330 320 L385 320" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)" /><path d="M610 320 L670 320" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)" /><text x="260" y="180" font-size="24" fill="#173f32" text-anchor="middle" font-weight="bold">W: substrate</text><text x="485" y="180" font-size="23" fill="#173f32" text-anchor="middle" font-weight="normal">Binding and breakdown</text><text x="882" y="160" font-size="24" fill="#173f32" text-anchor="middle" font-weight="bold">Y: products</text><text x="790" y="465" font-size="24" fill="#173f32" text-anchor="middle" font-weight="bold">X: unchanged enzyme</text></g></svg>