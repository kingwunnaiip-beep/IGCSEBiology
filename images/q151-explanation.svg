<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1160" viewBox="0 0 1000 1160" role="img" aria-labelledby="q151-title q151-desc">
<title id="q151-title">151 · Low vitamin D and calcium raise rickets risk</title>
<desc id="q151-desc">Answer D, statement 2 only. The source nutrient data are compared with their individual recommended daily allowances, keeping units separate. Vitamin C intake is 54 mg versus 50 mg RDA, iron is 11 mg versus 11 mg, vitamin D is 5 micrograms versus 10 micrograms and calcium is 150 mg versus 260 mg. Vitamin D and calcium fall below their RDAs. A long-term diet like this increases the risk of rickets. Iron deficiency can cause anaemia, and vitamin C deficiency can cause scurvy, but these two intakes meet the RDAs given. This is a comparison of source values, not a diagnosis.</desc>
