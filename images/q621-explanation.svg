<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">A synapse passes a chemical signal</title><desc id="desc">The drawn presynaptic ending contains vesicles W holding neurotransmitter. Released neurotransmitter X crosses the synaptic cleft Y and binds to receptors Z on the postsynaptic membrane.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="53" font-size="31" text-anchor="start" font-weight="bold" fill="#173f32">A synapse passes a chemical signal</text><path d="M370 115 V205 C205 230 220 350 330 370 H670 C780 350 795 230 630 205 V115" fill="#e4f0df" stroke="#24644b" stroke-width="4"/><path d="M215 445 Q500 405 785 445 V515 H215 Z" fill="#dcecf4" stroke="#537c9a" stroke-width="4"/><circle cx="365" cy="270" r="32" fill="#f6f8ed" stroke="#24644b" stroke-width="3"/><circle cx="355" cy="263" r="4" fill="#24644b" stroke="#24644b" stroke-width="1"/><circle cx="375" cy="262" r="4" fill="#24644b" stroke="#24644b" stroke-width="1"/><circle cx="365" cy="282" r="4" fill="#24644b" stroke="#24644b" stroke-width="1"/><circle cx="480" cy="220" r="32" fill="#f6f8ed" stroke="#24644b" stroke-width="3"/><circle cx="470" cy="213" r="4" fill="#24644b" stroke="#24644b" stroke-width="1"/><circle cx="490" cy="212" r="4" fill="#24644b" stroke="#24644b" stroke-width="1"/><circle cx="480" cy="232" r="4" fill="#24644b" stroke="#24644b" stroke-width="1"/><circle cx="585" cy="285" r="32" fill="#f6f8ed" stroke