<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Human chromosome counts: 46, 46, 0, 23</title><desc id="desc">Goblet cell and motor neurone each retain a diploid nucleus with forty-six chromosomes. Mature red blood cell has no nucleus and zero chromosomes. Sperm is a haploid gamete with twenty-three chromosomes. Cell icons are schematic.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#327153"/></marker></defs><rect width="960" height="540" rx="24" fill="#faf9ef"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="49" text-anchor="start" fill="#163d31" font-size="30" font-weight="bold">Human chromosome counts: 46, 46, 0, 23</text><text x="36" y="87" text-anchor="start" fill="#163d31" font-size="23" font-weight="normal">Count chromosomes according to the cell’s nucleus and role.</text><rect x="36" y="116" width="204" height="345" rx="18" fill="#e1eddf" stroke="#327153" stroke-width="2"/><text x="138" y="158" text-anchor="middle" fill="#163d31" font-size="23" font-weight="bold">Goblet cell</text><circle cx="138" cy="234" r="55" fill="#e1eddf" stroke="#327153" stroke-width="3"/><circle cx="138" cy="234" r="23" fill="#84ae86" stroke="#327153" stroke-width="3"/><text x="138" y="243" text-anchor="middle" fill="#163d31" font-size="22" font-weight="normal">2n</text><text x="138" y="343" text-anchor="middle" fill="#163d31" font-size="48" font-weight="bold">46</text><text x="138" y="387" text-anchor="middle" fill="#163d31" font-size="21" font-weight="normal">chromosomes</text><text x="138" y="428" text-anchor="middle" fill="#163d31" font-size="20" font-weight="normal">diploid body cell</text><rect x="264" y="116" width="204" height="345" rx="18" fill="#e1eddf" stroke="#327153" stroke-width="2"/><text x="366" y="158" text-anchor="middle" fill="#163d31" font-size="23" font-weight="bold">Motor neurone</text><circle cx="366" cy="234" r="55" fill="#e1eddf" stroke="#327153" stroke-width="3"/><circle cx="366" cy="234" r="23" fill="#84ae86" stroke="#327153" stroke-width="3"/><text x="366" y="243" text-anchor="middle" fill="#163d31" font-size="22" font-weight="normal">2n</text><text x="366" y="343" text-anchor="middle" fill="#163d31" font-size="48" font-weight="bold">46</text><text x="366" y="387" text-anchor="middle" fill="#163d31" font-size="21" font-weight="normal">chromosomes</text><text x="366" y="428" text-anchor="middle" fill="#163d31" font-size="20" font-weight="normal">diploid body cell</text><rect x="492" y="116" width="204" height="345" rx="18" fill="#e1eddf" stroke="#327153" stroke-width="2"/><text x="594" y="158" text-anchor="middle" fill="#163d31" font-size="23" font-weight="bold">Mature red cell</text><ellipse cx="594" cy="234" rx="62" ry="36" fill="#ead6c5" stroke="#a75c48" stroke-width="3"/><ellipse cx="594" cy="234" rx="30" ry="13" fill="#faf9ef"/><text x="594" y="343" text-anchor="middle" fill="#163d31" font-size="48" font-weight="bold">0</text><text x="594" y="387" text-anchor="middle" fill="#163d31" font-size="21" font-weight="normal">chromosomes</text><text x="594" y="428" text-anchor="middle" fill="#163d31" font-size="20" font-weight="normal">no nucleus</text><rect x="720" y="116" width="204" height="345" rx="18" fill="#e1eddf" stroke="#327153" stroke-width="2"/><text x="822" y="158" text-anchor="middle" fill="#163d31" font-size="23" font-weight="bold">Sperm</text><ellipse cx="783" cy="230" rx="25" ry="17" fill="#e1eddf" stroke="#327153" stroke-width="3"/><path d="M808 230 Q847 197 888 242" fill="none" stroke="#327153" stroke-width="3"/><circle cx="783" cy="230" r="8" fill="#e1eddf" stroke="#327153" stroke-width="3"/><text x="822" y="343" text-anchor="middle" fill="#163d31" font-size="48" font-weight="bold">23</text><text x="822" y="387" text-anchor="middle" fill="#163d31" font-size="21" font-weight="normal">chromosomes</text><text x="822" y="428" text-anchor="middle" fill="#163d31" font-size="20" font-weight="normal">haploid gamete</text><text x="36" y="517" text-anchor="start" fill="#587064" font-size="17" font-weight="normal">Original teaching schematic • not to scale</text></g></svg>