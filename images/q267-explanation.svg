<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="q267-title q267-desc">
<title id="q267-title">Amylase breaks down the starch-like coating</title>
<desc id="q267-desc">Amylase hydrolyses the starch-like coating into simple reducing sugars. Lipase acts on fats, producing fatty acids and glycerol, so it does not digest this coating.</desc>
