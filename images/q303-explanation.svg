<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990" role="img" aria-labelledby="q303-title q303-desc">
<title id="q303-title">Use family relationships to prove heterozygosity</title>
<desc id="q303-desc">Let A be the unaffected dominant allele and a the recessive albinism allele. Unaffected individuals 5 and 6 have affected child 8, so both must be Aa. Affected father 3 is aa; unaffected son 7 receives a from him and must be Aa. Individuals 1, 2 and 4 are unaffected but their individual heterozygosity is not forced.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1200" height="990" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="600.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Use family relationships to prove heterozygosity</text><text x="600" y="116" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >A = unaffected allele; a = recessive albinism allele</text><rect x="105" y="235" width="70" height="70" rx="0" fill="#8f9993" stroke="#173d31" stroke-width="2"/><text x="140" y="347" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >3: aa</text><circle cx="400" cy="270" r="35" fill="#fffdf7" stroke="#173d31" stroke-width="2"/><text x="400" y="347" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >4: AA or Aa</text><line x1="175" y1="270" x2="365" y2="270" stroke="#25614b" stroke-width="3"/><line x1="270" y1="270" x2="270" y2="430" stroke="#25614b" stroke-width="3"/><rect x="235" y="430" width="70" height="70" rx="0" fill="#deeed3" stroke="#25614b" stroke-width="4"/><text x="270" y="542" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >7: Aa</text><text x="270" y="595" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >Father gives a.</text><text x="270" y="633" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Unaffected child also has A.</text><text x="270" y="673" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Therefore 7 must be Aa.</text><rect x="715" y="235" width="70" height="70" rx="0" fill="#deeed3" stroke="#25614b" stroke-width="4"/><text x="750" y="347" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >5: Aa</text><circle cx="1010" cy="270" r="35" fill="#deeed3" stroke="#25614b" stroke-width="4"/><text x="1010" y="347" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >6: Aa</text><line x1="785" y1="270" x2="975" y2="270" stroke="#25614b" stroke-width="3"/><line x1="880" y1="270" x2="880" y2="430" stroke="#25614b" stroke-width="3"/><circle cx="880" cy="465" r="35" fill="#8f9993" stroke="#173d31" stroke-width="2"/><text x="880" y="542" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >8: aa</text><text x="880" y="595" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Child 8 receives a from each parent.</text><text x="880" y="633" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Parents 5 and 6 are unaffected.</text><text x="880" y="673" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Therefore both must be Aa.</text><rect x="100" y="733" width="1000" height="120" rx="12" fill="#f4eedb" stroke="#daa958" stroke-width="2"/><text x="600" y="778" font-size="29" fill="#173d31" font-weight="400" text-anchor="middle" >Individuals 1, 2 and 4 are not each proved to be Aa.</text><text x="600" y="820" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >The unaffected phenotype alone allows AA or Aa.</text><rect x="24" y="914" width="1152" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="600.0" y="948" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C — 5, 6 and 7 must be heterozygous.</text>
</g></svg>