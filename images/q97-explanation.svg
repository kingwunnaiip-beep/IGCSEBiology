<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1280" viewBox="0 0 1000 1280" role="img" aria-labelledby="q97-title q97-desc">
<title id="q97-title">97 · Antibiotic resistance increases by natural selection</title>
<desc id="q97-desc">Answer B. A countable schematic illustration, not numerical graph data, shows six susceptible and two resistant bacteria before treatment, susceptible bacteria killed by an antibiotic while resistant bacteria survive, and resistant survivors dividing to produce descendants. The resistant proportion rises. Genetic variation can exist before exposure; mutations arise randomly and are not directed by the antibiotic. Antibiotic treatment selects among bacteria, and resistant survivors can pass resistance to descendants. S means susceptible and R means resistant.</desc>
