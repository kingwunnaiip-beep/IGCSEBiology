<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Arrow B enters the sugar solution by osmosis</title><desc id="desc">A partially permeable membrane encloses water and sugar molecules; a large B arrow points inward from pure water of higher water potential.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="bluearrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="45" font-size="28" fill="#173f32" text-anchor="start" font-weight="bold">Arrow B enters the sugar solution by osmosis</text><text x="500" y="555" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">Net water movement is into the sugar solution across the membrane: arrow B.</text><ellipse cx="660" cy="310" rx="160" ry="160" fill="#f0eed3" stroke="#24644b" stroke-width="5" /><ellipse cx="165" cy="215" rx="9" ry="9" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><ellipse cx="240" cy="190" rx="9" ry="9" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><ellipse cx="315" cy="250" rx="9" ry="9" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><ellipse cx="170" cy="340" rx="9" ry="9" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><ellipse cx="280" cy="375" rx="9" ry="9" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><ellipse cx="345" cy="440" rx="9" ry="9" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><ellipse cx="370" cy="180" rx="9" ry="9" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><ellipse cx="415" cy="340" rx="9" ry="9" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><ellipse cx="595" cy="230" rx="9" ry="9" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><ellipse cx="700" cy="210" rx="9" ry="9" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><ellipse cx="740" cy="280" rx="9" ry="9" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><ellipse cx="580" cy="375" rx="9" ry="9" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><ellipse cx="665" cy="400" rx="9" ry="9" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><ellipse cx="735" cy="390" rx="9" ry="9" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><ellipse cx="625" cy="300" rx="9" ry="9" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><polygon points="638.0,250.0 629.0,265.5884572681199 611.0,265.5884572681199 602.0,250.0 611.0,234.4115427318801 629.0,234.4115427318801" fill="#f2ddbc" stroke="#bc824b" stroke-width="2"/><polygon points="728.0,340.0 719.0,355.5884572681199 701.0,355.5884572681199 692.0,340.0 701.0,324.4115427318801 719.0,324.4115427318801" fill="#f2ddbc" stroke="#bc824b" stroke-width="2"/><polygon points="688.0,365.0 679.0,380.5884572681199 661.0,380.5884572681199 652.0,365.0 661.0,349.4115427318801 679.0,349.4115427318801" fill="#f2ddbc" stroke="#bc824b" stroke-width="2"/><polygon points="758.0,240.0 749.0,255.5884572681199 731.0,255.5884572681199 722.0,240.0 731.0,224.4115427318801 749.0,224.4115427318801" fill="#f2ddbc" stroke="#bc824b" stroke-width="2"/><path d="M315 310 L555 310" fill="none" stroke="#537c9a" stroke-width="7" marker-end="url(#bluearrow)" /><ellipse cx="418" cy="275" rx="22" ry="22" fill="#d9eaf1" stroke="#537c9a" stroke-width="2" /><text x="418" y="283" font-size="25" fill="#173f32" text-anchor="middle" font-weight="bold">B</text><text x="205" y="130" font-size="26" fill="#173f32" text-anchor="middle" font-weight="bold">Water</text><text x="205" y="162" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">Higher water potential</text><text x="660" y="112" font-size="26" fill="#173f32" text-anchor="middle" font-weight="bold">