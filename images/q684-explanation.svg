<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Only 10 of 1000 energy units reach secondary consumers</title><desc id="desc">An illustrated food chain has the source values 1000, 100, 10 and 1. A linear bar shows 990 units lost and a narrow 10-unit remainder.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">Only 10 of 1000 energy units reach secondary consumers</text><g transform="translate(140 330) rotate(0) scale(0.95)"><path d="M0 0 Q-80 -110 0 -160 Q90 -80 0 0" fill="#e4f0df" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 0 Q5 -75 0 -145" fill="none" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -35 L-30 -60" fill="none" stroke="#24644b" stroke-width="2"/><path d="M0 -60 L-30 -85" fill="none" stroke="#24644b" stroke-width="2"/><path d="M0 -85 L-30 -110" fill="none" stroke="#24644b" stroke-width="2"/><path d="M0 -110 L-30 -135" fill="none" stroke="#24644b" stroke-width="2"/></g><g transform="translate(390 280) scale(0.55)"><path d="M-65 0 Q0 -55 65 0 Q0 55 -65 0 L-100 -35 L-100 35 Z" fill="#537c9a" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="42" cy="-5" r="4" fill="#fbf8eb" stroke="#24644b" stroke-width="1"/></g><g transform="translate(650 280) scale(0.8)"><path d="M-65 0 Q0 -55 65 0 Q0 55 -65 0 L-100 -35 L-100 35 Z" fill="#24644b" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="42" cy="-5" r="4" fill="#fbf8eb" stroke="#24644b" stroke-width="1"/></g><g transform="translate(870 280) scale(1.1)"><path d="M-65 0 Q0 -55 65 0 Q0 55 -65 0 L-100 -35 L-100 35 Z" fill="#24644b" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="42" cy="-5" r="4" fill="#fbf8eb" stroke="#24644b" stroke-width="1"/></g><text x="140" y="380" font-size="23" text-anchor="middle" fill="#173f32">Producers</text><text x="390" y="380" font-size="23" text-anchor="middle" fill="#173f32">Primary</text><text x="650" y="380" font-size="23" text-anchor="middle" fill="#173f32">Secondary</text><text x="870" y="380" font-size="23" text-anchor="middle" fill="#173f32">Tertiary</text><path d="M215 280 L315 280" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><path d="M455 280 L540 280" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><path d="M740 280 L785 280" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="140" y="175" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">1000 units</text><text x="390" y="175" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">100 units</text><text x="650" y="175" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">10 units</text><text x="870" y="175" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">1 unit</text><rect x="100" y="445" width="800" height="45" rx="0" fill="#d9c0aa" stroke="#24644b" stroke-width="2"/><rect x="892" y="445" width="8" height="45" rx="0" fill="#537c9a" stroke="#537c9a" stroke-width="1"/><text x="450" y="430" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">Lost: 990 of the initial 1000 units</text><text x="820" y="530" font-size="22" text-anchor="middle" fill="#173f32">10 remain</text><path d="M855 510 L895 470" fill="none" stroke="#537c9a" stroke-width="2"/><text x="500" y="565" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">D: (1000 − 10) ÷ 1000 × 100 = 99%</text></g></svg>