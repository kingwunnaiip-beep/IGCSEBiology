<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="q335-title q335-desc">
<title id="q335-title">Choose suitable pH, then compare temperature</title>
<desc id="q335-desc">The source compares stomach protease at pH 2 or 7 and 20 or 35 degrees Celsius. B combines acidic pH 2 with the higher temperature, 35 degrees Celsius.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="680" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Choose suitable pH, then compare temperature</text><rect x="45" y="100" width="475" height="130" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="282.5" y="138" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >1. Stomach protease</text><text x="282.5" y="176" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Works best in acidic conditions.</text><text x="282.5" y="207" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Choose pH 2 rather than pH 7.</text><rect x="580" y="100" width="475" height="130" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="817.5" y="138" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >2. Compare A with B</text><text x="817.5" y="176" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Both have pH 2. At 35 °C, particles</text><text x="817.5" y="207" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >move faster than at 20 °C.</text><text x="95" y="295" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Tube</text><text x="275" y="295" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >pH</text><text x="530" y="295" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Temperature / °C</text><text x="860" y="295" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Decision</text><text x="95" y="350" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >A</text><text x="275" y="350" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >2</text><text x="530" y="350" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >20</text><text x="860" y="350" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Acidic, but cooler</text><rect x="48" y="373" width="1004" height="48" rx="12" fill="#dcebd2" stroke="#25614b" stroke-width="2"/><text x="95" y="407" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B</text><text x="275" y="407" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >2</text><text x="530" y="407" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >35</text><text x="860" y="407" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Acidic and warmer</text><text x="95" y="464" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >C</text><text x="275" y="464" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >7</text><text x="530" y="464" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >20</text><text x="860" y="464" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Unsuitable pH</text><text x="95" y="521" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >D</text><text x="275" y="521" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >7</text><text x="530" y="521" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >35</text><text x="860" y="521" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Unsuitable pH</text><text x="550" y="590" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >More successful enzyme–substrate collisions at the suitable pH.</text><rect x="24" y="604" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="638" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B: pH 2 and 35 °C</text>
</g></svg>