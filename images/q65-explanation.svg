<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1070" viewBox="0 0 1100 1070" role="img" aria-labelledby="q65-title q65-desc">
<title id="q65-title">Breathing muscles change thorax volume</title>
<desc id="q65-desc">Q to R is deep inspiration, from 2500 to 6000 cubic centimetres: external intercostals contract, ribs move up and out, and the diaphragm contracts and flattens. Lung pressure falls below atmosphere and air enters. R to S is forced expiration, from 6000 to 1200 cubic centimetres: internal intercostals contract, ribs move down and in, and the diaphragm relaxes toward a dome. Lung pressure rises above atmosphere and air leaves. Quiet expiration P to Q is mainly passive. S to T is also inspiration. Answer C.</desc>
