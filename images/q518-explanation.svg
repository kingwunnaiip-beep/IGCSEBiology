<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">Cholera: follow cause before consequence</title><desc id="d">Bacterial toxin causes chloride secretion into the gut, followed by osmotic water entry and body dehydration. A lower diagram shows water moving from body fluids into the ion-rich gut lumen.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#194f3b"/></marker></defs><rect width="1000" height="600" rx="22" fill="#fffdf2"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="31" text-anchor="start" fill="#213c30" font-weight="bold">Cholera: follow cause before consequence</text><rect x="40" y="115" width="185" height="105" rx="16" fill="#d9ead7" stroke="#194f3b" stroke-width="2"/><text x="132.5" y="158.5" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">4: bacterial</text><text x="132.5" y="192.5" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">toxin</text><rect x="285" y="115" width="185" height="105" rx="16" fill="#d9ead7" stroke="#194f3b" stroke-width="2"/><text x="377.5" y="158.5" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">1: chloride</text><text x="377.5" y="192.5" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">secretion</text><rect x="530" y="115" width="185" height="105" rx="16" fill="#d9ead7" stroke="#194f3b" stroke-width="2"/><text x="622.5" y="158.5" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">2: water enters</text><text x="622.5" y="192.5" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">gut by osmosis</text><rect x="775" y="115" width="185" height="105" rx="16" fill="#d9ead7" stroke="#194f3b" stroke-width="2"/><text x="867.5" y="158.5" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">3: body loses</text><text x="867.5" y="192.5" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">water</text><path d="M232,167 L274,167" fill="none" stroke="#194f3b" stroke-width="4" marker-end="url(#arrow)"/><path d="M477,167 L519,167" fill="none" stroke="#194f3b" stroke-width="4" marker-end="url(#arrow)"/><path d="M722,167 L764,167" fill="none" stroke="#194f3b" stroke-width="4" marker-end="url(#arrow)"/><rect x="105" y="318" width="310" height="148" rx="16" fill="#ffffff" stroke="#194f3b" stroke-width="2"/><text x="260.0" y="383.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">Body fluids</text><text x="260.0" y="417.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">lose water</text><rect x="585" y="318" width="310" height="148" rx="16" fill="#d9ead7" stroke="#194f3b" stroke-width="2"/><text x="740.0" y="383.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">Gut lumen</text><text x="740.0" y="417.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">more dissolved ions</text><path d="M438,391 L559,391" fill="none" stroke="#194f3b" stroke-width="4" marker-end="url(#arrow)"/><text x="499" y="360" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">water</text><text x="499" y="508" font-size="26" text-anchor="middle" fill="#213c30" font-weight="normal">Lower water potential in the gut draws water in.</text><text x="40" y="566" font-size="21" text-anchor="start" fill="#213c30" font-weight="normal">Dehydration follows water loss; it does not cause the initial osmotic movement.</text></g></svg>