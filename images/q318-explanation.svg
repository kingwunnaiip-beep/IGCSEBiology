<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-labelledby="q318-title q318-desc">
<title id="q318-title">Iodine reveals starch in the original green stripe</title>
<desc id="q318-desc">Two rows trace the same leaf regions. The originally green stripe contains chlorophyll, photosynthesises and forms starch, so iodine turns it blue-black. The white stripe lacks chlorophyll, forms no starch in this test and stays yellow-brown. Chlorophyll has already been removed.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="690" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Iodine reveals starch in the original green stripe</text><text x="60" y="125" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >Original stripe</text><text x="360" y="125" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >After light exposure</text><text x="710" y="125" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >After iodine</text><rect x="60" y="170" width="230" height="110" rx="30" fill="#fffdf7" stroke="#25614b" stroke-width="2"/><rect x="60" y="330" width="230" height="110" rx="30" fill="#4d8a54" stroke="#25614b" stroke-width="2"/><text x="175" y="235" font-size="29" fill="#173d31" font-weight="400" text-anchor="middle" >white</text><text x="175" y="395" font-size="29" fill="white" font-weight="400" text-anchor="middle" >green</text><line x1="300" y1="225" x2="345" y2="225" stroke="#25614b" stroke-width="4"/><polygon points="345,225 331.6950761583107,231.92668763312224 331.6950761583107,218.07331236687776" fill="#25614b"/><line x1="300" y1="385" x2="345" y2="385" stroke="#25614b" stroke-width="4"/><polygon points="345,385 331.6950761583107,391.92668763312224 331.6950761583107,378.07331236687776" fill="#25614b"/><text x="360" y="211" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >No chlorophyll</text><text x="360" y="251" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >No starch made</text><text x="360" y="371" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >Chlorophyll present</text><text x="360" y="411" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >Starch made</text><line x1="650" y1="225" x2="695" y2="225" stroke="#25614b" stroke-width="4"/><polygon points="695,225 681.6950761583107,231.92668763312224 681.6950761583107,218.07331236687776" fill="#25614b"/><line x1="650" y1="385" x2="695" y2="385" stroke="#25614b" stroke-width="4"/><polygon points="695,385 681.6950761583107,391.92668763312224 681.6950761583107,378.07331236687776" fill="#25614b"/><rect x="710" y="170" width="330" height="110" rx="12" fill="#d4a847" stroke="#8c641e" stroke-width="2"/><text x="875" y="235" font-size="29" fill="#173d31" font-weight="400" text-anchor="middle" >yellow-brown</text><rect x="710" y="330" width="330" height="110" rx="12" fill="#20283f" stroke="#20283f" stroke-width="2"/><text x="875" y="395" font-size="29" fill="white" font-weight="400" text-anchor="middle" >blue-black</text><text x="550" y="510" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Chlorophyll is removed before adding iodine.</text><text x="550" y="552" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >A green colour remaining is not the starch-test result.</text><rect x="24" y="614" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="648" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >A — white stripe stays yellow-brown; green stripe turns blue-black</text>
</g></svg>