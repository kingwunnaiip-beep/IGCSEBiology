<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1260" viewBox="0 0 1000 1260" role="img" aria-labelledby="q91-title q91-desc">
<title id="q91-title">91 · Vasodilation increases blood flow near the skin</title>
<desc id="q91-desc">Answer D. During running on a hot day, smooth muscle in the walls of the arterioles supplying the skin relaxes. Their lumen widens: vasodilation. More blood flows through the capillaries near the skin surface, increasing heat transfer to the surroundings when conditions allow. The two schematic skin panels keep the capillaries in the same positions and at the same diameter; it is the supply arterioles that actively change diameter. The cool-response comparison has a narrow arteriole and less surface blood flow. Heat arrows are qualitative and do not represent measurements. Sweating is a separate cooling response.</desc>
