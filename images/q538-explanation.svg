<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Foreign graft antigens trigger an immune response</title><desc id="desc">A donor graft cell carries foreign surface antigens. Recipient antibodies recognise these antigens and can contribute to damage and rejection. Real graft rejection also involves other immune mechanisms; this is a conceptual model.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2e7656"/></marker></defs><rect width="1000" height="620" rx="24" fill="#fbf9ec"/><g font-family="sans-serif" fill="#173e32"><text x="42" y="55" font-size="31" text-anchor="start" fill="#173e32">Foreign graft antigens trigger an immune response</text><rect x="35" y="110" width="300" height="390" rx="18" fill="#e4efdf" stroke="#548269" stroke-width="2"/><rect x="365" y="110" width="275" height="390" rx="18" fill="#e4efdf" stroke="#548269" stroke-width="2"/><rect x="670" y="110" width="295" height="390" rx="18" fill="#e4efdf" stroke="#548269" stroke-width="2"/><text x="185" y="156" font-size="25" text-anchor="middle" fill="#173e32">Donor graft cell</text><circle cx="185" cy="300" r="85" fill="#d3e7bc" stroke="#2e7656" stroke-width="4"/><path d="M169 217L185 188L201 217Z" fill="#c8a454" stroke="#795f27" stroke-width="3"/><path d="M254 312L270 283L286 312Z" fill="#c8a454" stroke="#795f27" stroke-width="3"/><path d="M169 407L185 378L201 407Z" fill="#c8a454" stroke="#795f27" stroke-width="3"/><path d="M74 312L90 283L106 312Z" fill="#c8a454" stroke="#795f27" stroke-width="3"/><text x="185" y="462" font-size="20" text-anchor="middle" fill="#173e32">Foreign surface antigens</text><text x="503" y="156" font-size="24" text-anchor="middle" fill="#173e32">Recipient immunity</text><path d="M503 373V283L453 233 M503 283L553 233" stroke="#2e7656" stroke-width="19" fill="none" stroke-linecap="round"/><text x="503" y="425" font-size="21" text-anchor="middle" fill="#173e32">Antibodies recognise</text><text x="503" y="459" font-size="21" text-anchor="middle" fill="#173e32">specific antigens</text><text x="818" y="156" font-size="25" text-anchor="middle" fill="#173e32">Graft damage</text><circle cx="818" cy="300" r="84" fill="#efddd0" stroke="#9b6047" stroke-width="4"/><path d="M755 245L798 282L775 326L820 356L849 315L883 346" stroke="#9b6047" stroke-width="7" fill="none"/><text x="818" y="425" font-size="21" text-anchor="middle" fill="#173e32">Immune responses</text><text x="818" y="459" font-size="21" text-anchor="middle" fill="#173e32">can cause rejection</text><path d="M337 305 L361 305" fill="none" stroke="#2e7656" stroke-width="5" marker-end="url(#arrow)"/><path d="M642 305 L666 305" fill="none" stroke="#2e7656" stroke-width="5" marker-end="url(#arrow)"/><text x="500" y="558" font-size="23" text-anchor="middle" fill="#173e32">The key issue is recognition of non-self tissue antigens.</text><text x="500" y="595" font-size="20" text-anchor="middle" fill="#173e32">Antibodies contribute; graft rejection also involves other immune mechanisms.</text></g></svg>