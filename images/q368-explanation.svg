<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Liquid water becomes vapour in the leaf</title><desc id="desc">Liquid water enters a root hair, moves up xylem, and reaches moist mesophyll cell surfaces. Evaporation produces water vapour in air spaces. Vapour diffuses out through a stoma, corresponding to arrow B in the source.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L8 3 Z" fill="#245c43"/></marker></defs>
<rect width="1000" height="600" rx="24" fill="#fbf8ec"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="42" y="58" font-size="32" text-anchor="start" fill="#173f31" font-weight="bold">Liquid water becomes vapour in the leaf</text><rect x="45" y="120" width="265" height="130" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="177" y="157" font-size="23" text-anchor="middle" fill="#173f31" font-weight="normal">Root hair</text><text x="177" y="191" font-size="23" text-anchor="middle" fill="#173f31" font-weight="normal">Water enters by osmosis</text><text x="177" y="225" font-size="23" text-anchor="middle" fill="#173f31" font-weight="normal">LIQUID</text><rect x="365" y="120" width="265" height="130" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="497" y="157" font-size="23" text-anchor="middle" fill="#173f31" font-weight="normal">Xylem</text><text x="497" y="191" font-size="23" text-anchor="middle" fill="#173f31" font-weight="normal">Water travels up stem</text><text x="497" y="225" font-size="23" text-anchor="middle" fill="#173f31" font-weight="normal">LIQUID</text><rect x="685" y="120" width="270" height="130" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="820" y="157" font-size="23" text-anchor="middle" fill="#173f31" font-weight="normal">Mesophyll surfaces</text><text x="820" y="191" font-size="23" text-anchor="middle" fill="#173f31" font-weight="normal">Water reaches the leaf</text><text x="820" y="225" font-size="23" text-anchor="middle" fill="#173f31" font-weight="normal">LIQUID</text><path d="M310 185 L355 185" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><path d="M630 185 L675 185" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><path d="M820 250 L820 315" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><text x="650" y="290" font-size="23" text-anchor="start" fill="#173f31" font-weight="normal">evaporation</text><rect x="590" y="325" width="365" height="100" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="772" y="365" font-size="25" text-anchor="middle" fill="#173f31" font-weight="normal">Leaf air spaces</text><text x="772" y="401" font-size="25" text-anchor="middle" fill="#173f31" font-weight="normal">WATER VAPOUR</text><path d="M590 375 L385 375" fill="none" stroke="#245c43" stroke-width="4" stroke-dasharray="8 7" marker-end="url(#arr)"/><text x="488" y="350" font-size="24" text-anchor="middle" fill="#173f31" font-weight="normal">diffusion</text><rect x="45" y="325" width="330" height="100" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="210" y="365" font-size="25" text-anchor="middle" fill="#173f31" font-weight="normal">Stoma → outside air</text><text x="210" y="401" font-size="25" text-anchor="middle" fill="#173f31" font-weight="normal">Arrow B</text><rect x="70" y="487" width="860" height="75" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="500" y="518" font-size="25" text-anchor="middle" fill="#173f31" font-weight="normal">Evaporation changes state; diffusion moves the vapour.</text></g></svg>