<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Magnesium helps leaves stay green</title><desc id="desc">Magnesium ions taken up by roots are needed to produce chlorophyll. Magnesium deficiency reduces chlorophyll and can cause yellowing of leaves.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#185c44"/></marker></defs><rect width="1000" height="640" rx="24" fill="#faf8ec"/><g font-family="Arial, sans-serif"><text x="40" y="54" font-size="31" text-anchor="start" fill="#193e33" font-weight="bold">Magnesium helps leaves stay green</text><rect x="50" y="137" width="250" height="126" rx="18" fill="#dcefdc" stroke="#185c44" stroke-width="3"/><text x="175" y="185" font-size="25" text-anchor="middle" fill="#193e33" font-weight="normal">Magnesium ions</text><text x="175" y="220" font-size="25" text-anchor="middle" fill="#193e33" font-weight="normal">absorbed by roots</text><path d="M305 200 L380 200" stroke="#185c44" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="390" y="137" width="250" height="126" rx="18" fill="#dcefdc" stroke="#185c44" stroke-width="3"/><text x="515" y="185" font-size="25" text-anchor="middle" fill="#193e33" font-weight="normal">Chlorophyll</text><text x="515" y="220" font-size="25" text-anchor="middle" fill="#193e33" font-weight="normal">can be produced</text><path d="M645 200 L720 200" stroke="#185c44" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M762 278 Q680 110 850 120 Q930 214 762 278" fill="#418b4b" stroke="#185c44" stroke-width="4"/><path d="M766 269 L840 155" stroke="#185c44" stroke-width="4" fill="none"/><text x="820" y="321" font-size="25" text-anchor="middle" fill="#193e33" font-weight="normal">green leaf</text><rect x="70" y="373" width="860" height="180" rx="18" fill="#f4ebc8" stroke="#185c44" stroke-width="3"/><text x="500" y="417" font-size="28" text-anchor="middle" fill="#193e33" font-weight="bold">When magnesium is deficient</text><text x="500" y="464" font-size="26" text-anchor="middle" fill="#193e33" font-weight="normal">Less chlorophyll forms → leaves can turn yellow</text><text x="500" y="509" font-size="25" text-anchor="middle" fill="#193e33" font-weight="normal">Adding magnesium helps prevent this deficiency.</text></g></svg>