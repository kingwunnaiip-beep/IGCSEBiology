<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">How excess tissue fluid returns to the bloodstream</title><desc id="desc">Fluid leaves blood capillaries to bathe tissue cells. Excess tissue fluid enters lymphatic vessels as lymph and returns to venous blood.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#245744"/></marker></defs><rect width="1000" height="540" rx="22" fill="#fbf8ed"/><text x="42" y="49" font-family="Arial, sans-serif" font-size="30" text-anchor="start" fill="#183e32" font-weight="bold">How excess tissue fluid returns to the bloodstream</text><rect x="50" y="115" width="270" height="120" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><text x="185" y="159" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#183e32" font-weight="bold">Blood capillary</text><text x="185" y="201" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183e32" font-weight="normal">Plasma leaves</text><path d="M330,175 L390,175" fill="none" stroke="#245744" stroke-width="4" marker-end="url(#arrow)"/><rect x="405" y="115" width="540" height="120" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><text x="675" y="159" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#183e32" font-weight="bold">Tissue fluid around cells</text><text x="675" y="201" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183e32" font-weight="normal">Supplies cells with dissolved substances</text><path d="M675,246 L675,294" fill="none" stroke="#245744" stroke-width="4" marker-end="url(#arrow)"/><text x="720" y="275" font-family="Arial, sans-serif" font-size="21" text-anchor="start" fill="#183e32" font-weight="normal">Excess fluid</text><rect x="405" y="310" width="540" height="115" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><text x="675" y="352" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#183e32" font-weight="bold">Lymphatic vessels</text><text x="675" y="391" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183e32" font-weight="normal">Collect fluid as lymph</text><path d="M393,366 L330,366" fill="none" stroke="#245744" stroke-width="4" marker-end="url(#arrow)"/><rect x="50" y="310" width="270" height="115" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><text x="185" y="353" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#183e32" font-weight="bold">Venous blood</text><text x="185" y="392" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183e32" font-weight="normal">Fluid returns</text><text x="500" y="475" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#183e32" font-weight="bold">Lymphatic return helps prevent tissue-fluid accumulation.</text><text x="42" y="518" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#52675b" font-weight="normal">Original teaching schematic • Biology quiz • not to scale</text></svg>