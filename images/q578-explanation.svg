<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Both sexes inherit genes on an X chromosome</title><desc id="desc">Two nuclei show XX female and XY male sex chromosomes; gold bands mark example X-linked loci on every X and not on the Y.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="bluearrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="45" font-size="28" fill="#173f32" text-anchor="start" font-weight="bold">Both sexes inherit genes on an X chromosome</text><text x="500" y="555" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">Both XX females and XY males possess an X chromosome and can inherit X-linked traits.</text><ellipse cx="270" cy="310" rx="155" ry="155" fill="#e4f0df" stroke="#24644b" stroke-width="3" /><text x="270" y="135" font-size="28" fill="#173f32" text-anchor="middle" font-weight="bold">Female: XX</text><ellipse cx="735" cy="310" rx="155" ry="155" fill="#e4f0df" stroke="#24644b" stroke-width="3" /><text x="735" y="135" font-size="28" fill="#173f32" text-anchor="middle" font-weight="bold">Male: XY</text><path d="M192 245 L248 375" fill="none" stroke="#24644b" stroke-width="14" /><path d="M248 245 L192 375" fill="none" stroke="#24644b" stroke-width="14" /><path d="M197 265 L210 290" fill="none" stroke="#d5aa43" stroke-width="9" /><path d="M287 245 L343 375" fill="none" stroke="#537c9a" stroke-width="14" /><path d="M343 245 L287 375" fill="none" stroke="#537c9a" stroke-width="14" /><path d="M292 265 L305 290" fill="none" stroke="#d5aa43" stroke-width="9" /><path d="M657 245 L713 375" fill="none" stroke="#24644b" stroke-width="14" /><path d="M713 245 L657 375" fill="none" stroke="#24644b" stroke-width="14" /><path d="M662 265 L675 290" fill="none" stroke="#d5aa43" stroke-width="9" /><path d="M775 245 L800 300 L825 245 M800 300 L800 375" fill="none" stroke="#537c9a" stroke-width="14" /><text x="270" y="495" font-size="23" fill="#173f32" text-anchor="middle" font-weight="normal">Two X chromosomes</text><text x="735" y="495" font-size="23" fill="#173f32" text-anchor="middle" font-weight="normal">One X chromosome</text><path d="M455 185 L675 270" fill="none" stroke="#bc824b" stroke-width="2" /><text x="500" y="167" font-size="22" fill="#bc824b" text-anchor="middle" font-weight="normal">Gold band: X-linked gene</text><text x="500" y="523" font-size="19" fill="#173f32" text-anchor="middle" font-weight="normal">Sex chromosomes only; other chromosomes omitted</text></g></svg>