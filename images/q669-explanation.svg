<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which immunity statements are correct?</title><desc id="desc">1: antibody transfer: Breast milk gives passive immunity; 2 is false: no memory: Antibody transfer does not form memory cells; protection is temporary; 3: vaccination: Antigens stimulate active immunity and memory cells</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Which immunity statements are correct?</text><text x="38" y="106" font-size="18" font-weight="400">Statements 1 and 3 are correct; statement 2 is false.</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="50" y="190" font-size="23" font-weight="700">1: antibody transfer</text><text x="50" y="276" font-size="21" font-weight="400">Breast milk gives passive</text><text x="50" y="303" font-size="21" font-weight="400">immunity</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="405" y="190" font-size="23" font-weight="700">2 is false: no memory</text><text x="405" y="276" font-size="21" font-weight="400">Antibody transfer does not</text><text x="405" y="303" font-size="21" font-weight="400">form memory cells;</text><text x="405" y="330" font-size="21" font-weight="400">protection is temporary</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="760" y="190" font-size="23" font-weight="700">3: vaccination</text><text x="760" y="276" font-size="21" font-weight="400">Antigens stimulate active</text><text x="760" y="303" font-size="21" font-weight="400">immunity and memory cells</text><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>