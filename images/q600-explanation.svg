<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">In which order do the stages after pollen reaches a stigma occur?</title><desc id="desc">Use the original event numbers: 1, pollen tube forms; 3, grows down the style; 2, enters the ovule; 4, nuclei fuse. The correct sequence is 1 to 3 to 2 to 4.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e" /></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8" /><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">In which order do the stages after pollen reaches a stigma</text><text x="38" y="73" font-size="24" font-weight="700">occur?</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="50" y="207" font-size="23" font-weight="700">1: pollen tube forms</text><text x="50" y="285" font-size="21" font-weight="400">Germination on stigma</text><path d="M345 245 H376" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)" /><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="405" y="207" font-size="23" font-weight="700">3 then 2</text><text x="405" y="285" font-size="21" font-weight="400">Down style and into ovule</text><path d="M700 245 H731" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)" /><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="760" y="207" font-size="23" font-weight="700">4: nuclei fuse</text><text x="760" y="285" font-size="21" font-weight="400">Fertilisation</text><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>
