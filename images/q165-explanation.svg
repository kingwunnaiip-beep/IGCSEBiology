<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1170" viewBox="0 0 1000 1170" role="img" aria-labelledby="q165-title q165-desc">
<title id="q165-title">165 · Fovea: many cones · Blind spot: none</title>
<desc id="q165-desc">Answer D: solid source line X represents rods; dashed line Y represents cones; region Z is the fovea. Cones are densely concentrated at the fovea, where the source dashed curve peaks and rods are absent. At the blind spot both rods and cones are absent because the optic nerve exits the eye. Original teaching receptor symbols are qualitative and are not a redraw of measured density curves or retinal distances.</desc>
