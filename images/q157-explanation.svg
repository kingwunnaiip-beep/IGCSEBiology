x="732.5" y="549" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >After two weeks:</text><text x="732.5" y="585" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Nitrate ABSENT</text><text x="500" y="704" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >The conversion being tested is nitrification</text><rect x="55" y="747" width="270" height="126" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="190.0" y="787" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Ammonium ions</text><rect x="365" y="747" width="270" height="126" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="787" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Nitrite ions</text><rect x="675" y="747" width="270" height="126" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="810.0" y="787" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Nitrate ions</text><line x1="325" y1="811" x2="365" y2="811" stroke="#25614b" stroke-width="4"/><polygon points="365,811 351.6950761583107,817.9266876331222 351.6950761583107,804.0733123668778" fill="#25614b"/><line x1="635" y1="811" x2="675" y2="811" stroke="#25614b" stroke-width="4"/><polygon points="675,811 661.6950761583107,817.9266876331222 661.6950761583107,804.0733123668778" fill="#25614b"/><text x="500" y="916" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Nitrifying bacteria carry out the two conversions.</text><rect x="75" y="971" width="850" height="157" rx="12" fill="#f4efdf" stroke="#daa958" stroke-width="2"/><text x="500.0" y="1011" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Do not confuse the nitrogen-cycle processes</text><text x="500.0" y="1054" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Fixation starts with nitrogen gas.</text><text x="500.0" y="1090" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Denitrification converts nitrate to nitrogen gas.</text><text x="500" y="1181" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Pathway is qualitative; only the source temperature and time are used.</text><rect x="24" y="1224" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1258" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · Heating killed nitrifying bacteria</text>
</g></svg>