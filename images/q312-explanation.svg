<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="q312-title q312-desc">
<title id="q312-title">Variation compares individuals of the same species</title>
<desc id="q312-desc">An illustrative group of people shows different heights. Differences among individuals of the same species are variation. Variation can have genetic causes, environmental causes or both. No numerical heights or frequencies are measured.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="720" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Variation compares individuals of the same species</text><text x="560" y="112" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Example: people can differ in height</text><circle cx="155" cy="245" r="23" fill="#d7e7dd" stroke="#25614b" stroke-width="3"/><line x1="155" y1="270" x2="155" y2="450" stroke="#25614b" stroke-width="11"/><line x1="155" y1="312" x2="108" y2="368" stroke="#25614b" stroke-width="9"/><line x1="155" y1="312" x2="202" y2="368" stroke="#25614b" stroke-width="9"/><line x1="155" y1="450" x2="121" y2="510" stroke="#25614b" stroke-width="9"/><line x1="155" y1="450" x2="189" y2="510" stroke="#25614b" stroke-width="9"/><circle cx="355" cy="210" r="23" fill="#d7e7dd" stroke="#25614b" stroke-width="3"/><line x1="355" y1="235" x2="355" y2="450" stroke="#25614b" stroke-width="11"/><line x1="355" y1="277" x2="308" y2="333" stroke="#25614b" stroke-width="9"/><line x1="355" y1="277" x2="402" y2="333" stroke="#25614b" stroke-width="9"/><line x1="355" y1="450" x2="321" y2="510" stroke="#25614b" stroke-width="9"/><line x1="355" y1="450" x2="389" y2="510" stroke="#25614b" stroke-width="9"/><circle cx="555" cy="265" r="23" fill="#d7e7dd" stroke="#25614b" stroke-width="3"/><line x1="555" y1="290" x2="555" y2="450" stroke="#25614b" stroke-width="11"/><line x1="555" y1="332" x2="508" y2="388" stroke="#25614b" stroke-width="9"/><line x1="555" y1="332" x2="602" y2="388" stroke="#25614b" stroke-width="9"/><line x1="555" y1="450" x2="521" y2="510" stroke="#25614b" stroke-width="9"/><line x1="555" y1="450" x2="589" y2="510" stroke="#25614b" stroke-width="9"/><circle cx="755" cy="185" r="23" fill="#d7e7dd" stroke="#25614b" stroke-width="3"/><line x1="755" y1="210" x2="755" y2="450" stroke="#25614b" stroke-width="11"/><line x1="755" y1="252" x2="708" y2="308" stroke="#25614b" stroke-width="9"/><line x1="755" y1="252" x2="802" y2="308" stroke="#25614b" stroke-width="9"/><line x1="755" y1="450" x2="721" y2="510" stroke="#25614b" stroke-width="9"/><line x1="755" y1="450" x2="789" y2="510" stroke="#25614b" stroke-width="9"/><circle cx="955" cy="225" r="23" fill="#d7e7dd" stroke="#25614b" stroke-width="3"/><line x1="955" y1="250" x2="955" y2="450" stroke="#25614b" stroke-width="11"/><line x1="955" y1="292" x2="908" y2="348" stroke="#25614b" stroke-width="9"/><line x1="955" y1="292" x2="1002" y2="348" stroke="#25614b" stroke-width="9"/><line x1="955" y1="450" x2="921" y2="510" stroke="#25614b" stroke-width="9"/><line x1="955" y1="450" x2="989" y2="510" stroke="#25614b" stroke-width="9"/><line x1="70" y1="515" x2="1040" y2="515" stroke="#526c62" stroke-width="2"/><text x="560" y="565" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Same species, different characteristics</text><text x="560" y="610" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Causes may be genetic, environmental, or both.</text><rect x="24" y="644" width="1072" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="560.0" y="678" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Differences between individuals of the same species → C</text>
