<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="q74-title q74-desc">
<title id="q74-title">The glomerulus filters small molecules</title>
<desc id="q74-desc">High hydrostatic pressure in glomerular capillaries drives water, glucose, urea and mineral ions across the filtration barrier into Bowman’s capsule. Blood cells and most plasma proteins stay in the blood. The filtrate then flows into the kidney tubule; selective reabsorption is a different process.</desc>
