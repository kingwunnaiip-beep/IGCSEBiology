or="middle" >These weeds may survive the herbicide.</text><text x="500.0" y="718" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Controlling weeds becomes more difficult.</text><rect x="75" y="858" width="850" height="143" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="898" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >A possibility, not a certainty</text><text x="500.0" y="941" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Not every weed can cross with the crop.</text><text x="500.0" y="976" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >No frequency or inevitability is implied.</text><text x="500" y="1056" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative possible pathway; no measured gene-flow data are given.</text><rect x="24" y="1084" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1118" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer B · Some weeds might become herbicide-resistant</text>
