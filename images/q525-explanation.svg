stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="430" y="225" font-size="22" text-anchor="middle" fill="#183e35"><tspan x="430" dy="0">touch</tspan></text><text x="220" y="425" font-size="21" text-anchor="middle" fill="#183e35"><tspan x="220" dy="0">Movement: hairs change position</tspan></text><text x="650" y="425" font-size="21" text-anchor="middle" fill="#183e35"><tspan x="650" dy="0">Sensitivity: hairs respond to touch</tspan></text><text x="450" y="478" font-size="23" text-anchor="middle" fill="#183e35"><tspan x="450" dy="0">A response to a stimulus can include movement.</tspan></text></g></svg>