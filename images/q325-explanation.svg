<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="q325-title q325-desc">
<title id="q325-title">Dicotyledon leaves: broad, with branching veins</title>
<desc id="q325-desc">A broad leaf has a branching network of veins, unlike the long parallel veins of a typical monocot leaf. The source row is broad leaves yes and parallel veins no.</desc>
