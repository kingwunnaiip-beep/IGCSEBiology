<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Following the kingdom key</title><desc id="desc">The absence of a nucleus leads to prokaryotes, Z. For the nucleus-present and cell-wall-present branch, a cellulose wall leads to plants, X, and a non-cellulose wall leads to fungi, Y.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L8 3 Z" fill="#245c43"/></marker></defs>
<rect width="1000" height="600" rx="24" fill="#fbf8ec"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="42" y="58" font-size="32" text-anchor="start" fill="#173f31" font-weight="bold">Following the kingdom key</text><rect x="335" y="105" width="320" height="72" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="495" y="150" font-size="29" text-anchor="middle" fill="#173f31" font-weight="bold">Nucleus present?</text><path d="M655 142 L825 142" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><text x="735" y="127" font-size="23" text-anchor="middle" fill="#173f31" font-weight="normal">no</text><path d="M825 142 L825 232" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><rect x="700" y="240" width="250" height="100" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="825" y="278" font-size="25" text-anchor="middle" fill="#173f31" font-weight="normal">Z: prokaryote</text><text x="825" y="313" font-size="25" text-anchor="middle" fill="#173f31" font-weight="normal">No nucleus</text><path d="M495 177 L495 227" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><text x="430" y="211" font-size="23" text-anchor="start" fill="#173f31" font-weight="normal">yes</text><rect x="100" y="235" width="490" height="70" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="345" y="280" font-size="26" text-anchor="middle" fill="#173f31" font-weight="normal">Follow the cell-wall branch</text><path d="M345 305 L345 348" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><rect x="105" y="355" width="480" height="65" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="345" y="397" font-size="26" text-anchor="middle" fill="#173f31" font-weight="normal">Cell wall made of cellulose?</text><path d="M250 420 L190 474" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><text x="145" y="451" font-size="23" text-anchor="start" fill="#173f31" font-weight="normal">yes</text><path d="M435 420 L475 474" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><text x="478" y="451" font-size="23" text-anchor="start" fill="#173f31" font-weight="normal">no</text><rect x="55" y="480" width="270" height="85" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="190" y="515" font-size="24" text-anchor="middle" fill="#173f31" font-weight="normal">X: plant</text><text x="190" y="547" font-size="24" text-anchor="middle" fill="#173f31" font-weight="normal">Cellulose wall</text><rect x="350" y="480" width="270" height="85" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="485" y="515" font-size="24" text-anchor="middle" fill="#173f31" font-weight="normal">Y: fungi</text><text x="485" y="547" font-size="24" text-anchor="middle" fill="#173f31" font-weight="normal">Non-cellulose wall</text><text x="690" y="440" font-size="23" text-anchor="start" fill="#173f31" font-weight="normal">The key uses structural</text><text x="690" y="477" font-size="23" text-anchor="start" fill="#173f31" font-weight="normal">features in sequence.</text><text x="690" y="514" font-size="23" text-anchor="start" fill="#173f31" font-weight="normal">Trace each decision.</text></g></svg>