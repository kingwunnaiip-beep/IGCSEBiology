<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which combination identifies the proteins and the correct antibody shape?</title><desc id="desc">X is a bacterial surface antigen and Y is an antibody made by the immune system. These are distinct proteins. A concave antibody binding site complements the convex antigen, so names and shape match row A.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e" /></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8" /><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Which combination identifies the proteins and the correct</text><text x="38" y="73" font-size="24" font-weight="700">antibody shape?</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="50" y="207" font-size="23" font-weight="700">X: bacterial surface</text><text x="50" y="236" font-size="23" font-weight="700">protein</text><text x="50" y="285" font-size="21" font-weight="400">Antigen</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="405" y="207" font-size="23" font-weight="700">Y: immune-system</text><text x="405" y="236" font-size="23" font-weight="700">protein</text><text x="405" y="285" font-size="21" font-weight="400">Antibody</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text><text x="760" y="207" font-size="23" font-weight="700">Complementary binding</text><text x="760" y="236" font-size="23" font-weight="700">site</text><text x="760" y="285" font-size="21" font-weight="400">Concave site fits convex X</text><text x="760" y="312" font-size="21" font-weight="400">Names + shape match A</text></g></svg>
