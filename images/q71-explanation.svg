<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="870" viewBox="0 0 1000 870" role="img" aria-labelledby="q71-title q71-desc">
<title id="q71-title">Plants respire by day and night</title>
<desc id="q71-desc">An illustrative qualitative graph plots rate in arbitrary units over 0, 6, 12, 18 and 24 hours. The solid photosynthesis curve is zero during darkness and bell-shaped in daylight. The dashed respiration curve remains positive all 24 hours, with gentle variation. The curve and daylight hours illustrate the question; a real plant&#x27;s exact peak depends on conditions.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
