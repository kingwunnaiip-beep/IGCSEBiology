<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 555" role="img" aria-labelledby="q532-title q532-desc"><title id="q532-title">Four bacterial roles in the nitrogen cycle</title><desc id="q532-desc">Atmospheric nitrogen is fixed into usable nitrogen compounds, shown entering the nitrate pool at Z in the source diagram. Ammonium is nitrified to nitrate at X. Nitrate is denitrified to atmospheric nitrogen at W. Nitrogen passes through organisms by uptake and feeding; decomposers return organic nitrogen to ammonium at Y. This simplified teaching diagram preserves all four lettered source transformations.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#36785e"/></marker></defs><rect x="0" y="0" width="900" height="555" rx="22" fill="#fbf7e9"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="46" font-size="27" text-anchor="start" fill="#183e35"><tspan x="35" dy="0">Four bacterial roles in the nitrogen cycle</tspan></text><rect x="310" y="82" width="250" height="65" rx="15" fill="#d7e9d8" stroke="#36785e" stroke-width="2"/><text x="435" y="122" font-size="23" text-anchor="middle" fill="#183e35"><tspan x="435" dy="0">Atmospheric N₂</tspan></text><rect x="40" y="260" width="220" height="70" rx="15" fill="#d7e9d8" stroke="#36785e" stroke-width="2"/><text x="150" y="302" font-size="22" text-anchor="middle" fill="#183e35"><tspan x="150" dy="0">Ammonium ions</tspan></text><rect x="640" y="260" width="220" height="70" rx="15" fill="#d7e9d8" stroke="#36785e" stroke-width="2"/><text x="750" y="302" font-size="22" text-anchor="middle" fill="#183e35"><tspan x="750" dy="0">Nitrate ions</tspan></text><rect x="335" y="405" width="230" height="75" rx="15" fill="#d7e9d8" stroke="#36785e" stroke-width="2"/><text x="450" y="436" font-size="21" text-anchor="middle" fill="#183e35"><tspan x="450" dy="0">Plants, animals,</tspan><tspan x="450" dy="29">organic remains</tspan></text><path d="M570 105 Q865 102 865 244" stroke="#36785e" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M865 234 L851 253" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="744" y="91" font-size="20" text-anchor="middle" fill="#183e35"><tspan x="744" dy="0">Z: nitrogen fixation</tspan></text><path d="M727 246 L563 147" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="450" y="211" font-size="20" text-anchor="middle" fill="#183e35"><tspan x="450" dy="0">W: denitrification</tspan></text><path d="M270 295 L629 295" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="450" y="271" font-size="22" text-anchor="middle" fill="#183e35"><tspan x="450" dy="0">X: nitrification</tspan></text><path d="M642 350 L577 414" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="755" y="386" font-size="20" text-anchor="middle" fill="#183e35"><tspan x="755" dy="0">uptake and</tspan><tspan x="755" dy="29">feeding</tspan></text><path d="M325 442 L168 342" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="151" y="444" font-size="20" text-anchor="middle" fill="#183e35"><tspan x="151" dy="0">Y: decomposition</tspan><tspan x="151" dy="29">→ ammonium</tspan></text><text x="450" y="527" font-size="22" text-anchor="middle" fill="#183e35"><tspan x="450" dy="0">Read each arrow from its starting substance to its product.</tspan></text></g></svg>