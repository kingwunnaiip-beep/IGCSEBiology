<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Percentage increase uses the original 1300 cases</title><desc id="desc">Two bars to scale show 1300 cases in 2002 and 6200 in 2006. A bracket marks the increase of 4900 cases, which is divided by the original value.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">Percentage increase uses the original 1300 cases</text><path d="M120 450 L900 450" fill="none" stroke="#24644b" stroke-width="3"/><path d="M120 450 L120 135" fill="none" stroke="#24644b" stroke-width="3"/><path d="M110 450.0 L120 450.0" fill="none" stroke="#24644b" stroke-width="2"/><text x="98" y="458.0" font-size="20" text-anchor="end" fill="#173f32">0</text><path d="M110 350.0 L120 350.0" fill="none" stroke="#24644b" stroke-width="2"/><text x="98" y="358.0" font-size="20" text-anchor="end" fill="#173f32">2000</text><path d="M110 250.0 L120 250.0" fill="none" stroke="#24644b" stroke-width="2"/><text x="98" y="258.0" font-size="20" text-anchor="end" fill="#173f32">4000</text><path d="M110 150.0 L120 150.0" fill="none" stroke="#24644b" stroke-width="2"/><text x="98" y="158.0" font-size="20" text-anchor="end" fill="#173f32">6000</text><rect x="245" y="385" width="150" height="65" rx="0" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><rect x="600" y="140" width="150" height="310" rx="0" fill="#b8cfdd" stroke="#537c9a" stroke-width="3"/><text x="320" y="490" font-size="26" text-anchor="middle" fill="#173f32" font-weight="bold">2002</text><text x="675" y="490" font-size="26" text-anchor="middle" fill="#173f32" font-weight="bold">2006</text><text x="320" y="365" font-size="25" text-anchor="middle" fill="#173f32">1300</text><text x="675" y="120" font-size="25" text-anchor="middle" fill="#173f32">6200</text><path d="M815 140 L815 385" fill="none" stroke="#b28298" stroke-width="3"/><path d="M800 140 L830 140" fill="none" stroke="#b28298" stroke-width="3"/><path d="M800 385 L830 385" fill="none" stroke="#b28298" stroke-width="3"/><text x="880" y="270" font-size="23" text-anchor="middle" fill="#173f32">+4900</text><text x="500" y="565" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">D: (6200 − 1300) ÷ 1300 × 100 = 377%</text></g></svg>