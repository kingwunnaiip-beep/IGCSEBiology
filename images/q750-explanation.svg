<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Yeast fermentation produces ethanol</title><desc id="desc">A budding yeast cell is connected to a ball-and-stick ethanol molecule containing two carbon atoms, six hydrogens and one oxygen, with a hydroxyl end group.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">Yeast fermentation produces ethanol</text><ellipse cx="155" cy="300" rx="80" ry="105" fill="#e4f0df" stroke="#24644b" stroke-width="4"/><ellipse cx="205" cy="190" rx="43" ry="55" fill="#e4f0df" stroke="#24644b" stroke-width="4"/><ellipse cx="155" cy="300" rx="35" ry="50" fill="#d4e4eb" stroke="#537c9a" stroke-width="3"/><text x="155" y="475" font-size="28" fill="#173f32" text-anchor="middle" font-weight="700">Yeast</text><path d="M285 300 H350" fill="none" stroke="#24644b" stroke-width="5" marker-end="url(#arrow)"/><path d="M520 300 L670 300" fill="none" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M670 300 L820 300" fill="none" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M820 300 L920 300" fill="none" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M520 300 L520 190" fill="none" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M520 300 L520 410" fill="none" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M520 300 L410 300" fill="none" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M670 300 L670 190" fill="none" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M670 300 L670 410" fill="none" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="520" cy="300" r="29" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><text x="520" y="309" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">C</text><circle cx="670" cy="300" r="29" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><text x="670" y="309" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">C</text><circle cx="820" cy="300" r="29" fill="#e5bca2" stroke="#24644b" stroke-width="3"/><text x="820" y="309" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">O</text><circle cx="920" cy="300" r="29" fill="white" stroke="#24644b" stroke-width="3"/><text x="920" y="309" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">H</text><circle cx="520" cy="190" r="29" fill="white" stroke="#24644b" stroke-width="3"/><text x="520" y="199" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">H</text><circle cx="520" cy="410" r="29" fill="white" stroke="#24644b" stroke-width="3"/><text x="520" y="419" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">H</text><circle cx="410" cy="300" r="29" fill="white" stroke="#24644b" stroke-width="3"/><text x="410" y="309" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">H</text><circle cx="670" cy="190" r="29" fill="white" stroke="#24644b" stroke-width="3"/><text x="670" y="199" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">H</text><circle cx="670" cy="410" r="29" fill="white" stroke="#24644b" stroke-width="3"/><text x="670" y="419" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">H</text><text x="700" y="475" font-size="28" fill="#173f32" text-anchor="middle" font-weight="700">Ethanol: CH₃–CH₂–OH</text><text x="500" y="120" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">Glucose → ethanol + carbon dioxide (without oxygen)</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">A: C₂H₅OH</text></g></svg>