<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Divide image length by magnification</title><desc id="desc">An enlarged microscopic structure is measured against a 5 mm ruler. Dividing by magnification 250 gives the actual 20 micrometre structure.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">Divide image length by magnification</text><rect x="85" y="180" width="430" height="130" rx="12" fill="#edf3f4" stroke="#537c9a" stroke-width="3"/><path d="M100 235 Q280 160 500 245 Q300 320 100 235" fill="#e4f0df" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 350 L500 350" fill="none" stroke="#537c9a" stroke-width="3"/><path d="M100 340 L100 365" fill="none" stroke="#537c9a" stroke-width="2"/><text x="100" y="395" font-size="21" text-anchor="middle" fill="#173f32">0</text><path d="M180 340 L180 365" fill="none" stroke="#537c9a" stroke-width="2"/><text x="180" y="395" font-size="21" text-anchor="middle" fill="#173f32">1</text><path d="M260 340 L260 365" fill="none" stroke="#537c9a" stroke-width="2"/><text x="260" y="395" font-size="21" text-anchor="middle" fill="#173f32">2</text><path d="M340 340 L340 365" fill="none" stroke="#537c9a" stroke-width="2"/><text x="340" y="395" font-size="21" text-anchor="middle" fill="#173f32">3</text><path d="M420 340 L420 365" fill="none" stroke="#537c9a" stroke-width="2"/><text x="420" y="395" font-size="21" text-anchor="middle" fill="#173f32">4</text><path d="M500 340 L500 365" fill="none" stroke="#537c9a" stroke-width="2"/><text x="500" y="395" font-size="21" text-anchor="middle" fill="#173f32">5</text><text x="300" y="445" font-size="25" text-anchor="middle" fill="#173f32" font-weight="bold">Measured image = 5.00 mm</text><path d="M550 260 L680 260" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="610" y="215" font-size="26" text-anchor="middle" fill="#173f32" font-weight="bold">÷ 250</text><path d="M750 240 Q790 215 835 245 Q790 270 750 240" fill="#e4f0df" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M750 300 L835 300" fill="none" stroke="#537c9a" stroke-width="3"/><path d="M750 290 L750 310" fill="none" stroke="#537c9a" stroke-width="3"/><path d="M835 290 L835 310" fill="none" stroke="#537c9a" stroke-width="3"/><text x="795" y="350" font-size="25" text-anchor="middle" fill="#173f32" font-weight="bold">Actual: 20.0 µm</text><text x="795" y="395" font-size="23" text-anchor="middle" fill="#173f32">0.0200 mm</text><text x="500" y="565" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">C: 5.00 ÷ 250 × 1000 = 2.00 × 10¹ µm</text></g></svg>