<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">Receptor → nerve pathway → effector</title><desc id="d">A receptor detects a stimulus and starts a signal in a sensory neurone. A relay neurone in the central nervous system passes the signal to a motor neurone. The effector muscle then contracts. Synapses are junctions between neurones.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#194f3b"/></marker></defs><rect width="1000" height="600" rx="22" fill="#fffdf2"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="31" text-anchor="start" fill="#213c30" font-weight="bold">Receptor → nerve pathway → effector</text><rect x="50" y="126" width="220" height="110" rx="16" fill="#d9ead7" stroke="#194f3b" stroke-width="2"/><text x="160.0" y="172.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">Receptor</text><text x="160.0" y="206.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">detects stimulus</text><rect x="390" y="126" width="220" height="110" rx="16" fill="#ffffff" stroke="#194f3b" stroke-width="2"/><text x="500.0" y="189.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">Sensory neurone</text><rect x="730" y="126" width="220" height="110" rx="16" fill="#ffffff" stroke="#194f3b" stroke-width="2"/><text x="840.0" y="189.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">Relay neurone</text><path d="M286,182 L371,182" fill="none" stroke="#194f3b" stroke-width="4" marker-end="url(#arrow)"/><path d="M626,182 L711,182" fill="none" stroke="#194f3b" stroke-width="4" marker-end="url(#arrow)"/><path d="M840,254 L840,332" fill="none" stroke="#194f3b" stroke-width="4" marker-end="url(#arrow)"/><rect x="730" y="349" width="220" height="110" rx="16" fill="#ffffff" stroke="#194f3b" stroke-width="2"/><text x="840.0" y="412.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">Motor neurone</text><rect x="390" y="349" width="220" height="110" rx="16" fill="#d9ead7" stroke="#194f3b" stroke-width="2"/><text x="500.0" y="395.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">Effector</text><text x="500.0" y="429.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">muscle contracts</text><path d="M714,403 L629,403" fill="none" stroke="#194f3b" stroke-width="4" marker-end="url(#arrow)"/><text x="500" y="294" font-size="25" text-anchor="middle" fill="#213c30" font-weight="normal">Synapses connect neurones.</text><text x="160" y="280" font-size="24" text-anchor="middle" fill="#213c30" font-weight="bold">Start of pathway</text><text x="40" y="566" font-size="21" text-anchor="start" fill="#213c30" font-weight="normal">A receptor detects; an effector responds. Pathway schematic, not anatomical scale.</text></g></svg>