<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" role="img" aria-labelledby="title501 desc501"><title id="title501">Mitochondria power sperm movement</title><desc id="desc501">A sperm cell is drawn with a head, a midpiece containing many mitochondria and a flagellum. A flow links mitochondrial respiration to ATP and then energy for flagellum movement.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#185744"/></marker></defs><rect width="800" height="530" rx="20" fill="#fbf8ed"/><g font-family="Arial, sans-serif"><text x="400" y="55" font-size="28" text-anchor="middle" fill="#185744" font-weight="bold">Mitochondria power sperm movement</text><ellipse cx="155" cy="245" rx="65" ry="47" fill="#e1eee2" stroke="#185744" stroke-width="3"/><circle cx="157" cy="245" r="25" fill="#5f9778" stroke="#185744" stroke-width="2"/><rect x="218" y="225" width="145" height="40" rx="5" fill="#f0dfbc" stroke="#185744" stroke-width="2"/><ellipse cx="235" cy="245" rx="10" ry="15" fill="#c87939" stroke="#185744"/><ellipse cx="265" cy="245" rx="10" ry="15" fill="#c87939" stroke="#185744"/><ellipse cx="295" cy="245" rx="10" ry="15" fill="#c87939" stroke="#185744"/><ellipse cx="325" cy="245" rx="10" ry="15" fill="#c87939" stroke="#185744"/><path d="M363 245 C440 165 510 320 580 245 S690 190 740 245" stroke="#185744" stroke-width="7" fill="none"/><text x="155" y="150" font-size="24" text-anchor="middle" fill="#185744" font-weight="normal">Head</text><text x="290" y="150" font-size="24" text-anchor="middle" fill="#185744" font-weight="normal">Midpiece</text><text x="610" y="150" font-size="24" text-anchor="middle" fill="#185744" font-weight="normal">Flagellum</text><path d="M290 165 L290 220" stroke="#185744" stroke-width="3" fill="none"/><path d="M610 165 L610 218" stroke="#185744" stroke-width="3" fill="none"/><text x="290" y="315" font-size="23" text-anchor="middle" fill="#185744" font-weight="normal">Many mitochondria</text><path d="M290 330 L290 375" stroke="#185744" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="175" y="385" width="230" height="60" rx="12" fill="#e1eee2" stroke="#185744" stroke-width="2"/><text x="290.0" y="423.0" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">Respiration → ATP</text><path d="M405 415 L495 415" stroke="#185744" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="505" y="385" width="240" height="60" rx="12" fill="#e1eee2" stroke="#185744" stroke-width="2"/><text x="625.0" y="423.0" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">Energy for movement</text><text x="400" y="495" font-size="21" text-anchor="middle" fill="#185744" font-weight="normal">Schematic: the midpiece supplies energy to drive the tail.</text></g></svg>