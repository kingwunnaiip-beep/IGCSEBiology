<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Follow water around the cycle</title><desc id="desc">Water evaporates from the surface and transpires from plants. Vapour condenses into cloud droplets, precipitation returns water to the surface, and plants take water up. Fossilisation is outside this water-transfer cycle.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#24543e"/></marker></defs><rect width="900" height="540" fill="#fbf8ed"/><g font-family="Arial, sans-serif"><text x="450" y="45" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#203e30">Follow water around the cycle</text><rect x="320" y="90" width="260" height="80" rx="14" fill="#a6d8df" stroke="#24543e" stroke-width="2"/><text x="450" y="139" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#203e30">Cloud droplets</text><rect x="620" y="280" width="220" height="80" rx="14" fill="#a6d8df" stroke="#24543e" stroke-width="2"/><text x="730" y="330" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#203e30">Surface water</text><rect x="65" y="280" width="220" height="80" rx="14" fill="#b9d8ae" stroke="#24543e" stroke-width="2"/><text x="175" y="330" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#203e30">Plants</text><line x1="580" y1="155" x2="693.3158609321964" y2="250.95294675710184" stroke="#24543e" stroke-width="3"/><polygon points="704,260 689.4385523995257,255.5318635004462 697.1931694648671,246.37403001375748" fill="#24543e"/><text x="734" y="210" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#203e30">precipitation</text><line x1="620" y1="365" x2="309.0" y2="365.0" stroke="#24543e" stroke-width="3"/><polygon points="295,365 309.0,359.0 309.0,371.0" fill="#24543e"/><text x="450" y="396" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#203e30">water uptake</text><line x1="175" y1="260" x2="308.8463222073664" y2="158.46141073923926" stroke="#24543e" stroke-width="3"/><polygon points="320,150 312.47264109561183,163.24155836465363 305.220003319121,153.68126311382488" fill="#24543e"/><text x="154" y="195" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#203e30">transpiration</text><line x1="730" y1="280" x2="572.3126143057291" y2="194.6632971536887" stroke="#24543e" stroke-width="3"/><polygon points="560,188 575.1683130858813,189.38646245123337 569.4569155255768,199.940131856144" fill="#24543e"/><text x="619" y="252" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#203e30">evaporation</text><text x="450" y="218" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#203e30">water vapour</text><text x="450" y="251" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#203e30">condenses</text><rect x="180" y="440" width="540" height="65" rx="14" fill="#f0e4ce" stroke="#24543e" stroke-width="2"/><text x="450" y="481" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#203e30">Fossilisation preserves remains or traces.</text></g></svg>