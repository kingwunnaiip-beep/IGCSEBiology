<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Follow the key using the spider’s visible features</title><desc id="desc">An eight-legged spider has four pairs of jointed legs and no tail. These visible features lead to the Argyroneta endpoint in the supplied key.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">Follow the key using the spider’s visible features</text><ellipse cx="360" cy="280" rx="83" ry="112" fill="#e6d8bd" stroke="#c5824b" stroke-width="4"/><ellipse cx="360" cy="390" rx="61" ry="60" fill="#e4f0df" stroke="#24644b" stroke-width="4"/><path d="M320 345 L260 280 L160 360" fill="none" stroke="#24644b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M320 367 L252 314 L160 392" fill="none" stroke="#24644b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M320 389 L244 348 L160 424" fill="none" stroke="#24644b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M320 411 L236 382 L160 456" fill="none" stroke="#24644b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M400 345 L460 280 L560 360" fill="none" stroke="#24644b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M400 367 L468 314 L560 392" fill="none" stroke="#24644b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M400 389 L476 348 L560 424" fill="none" stroke="#24644b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M400 411 L484 382 L560 456" fill="none" stroke="#24644b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="344" cy="426" r="5" fill="#173f32" stroke="#173f32" stroke-width="1"/><circle cx="376" cy="426" r="5" fill="#173f32" stroke="#173f32" stroke-width="1"/><text x="650" y="200" font-size="28" fill="#173f32" text-anchor="start" font-weight="700">Jointed legs</text><text x="650" y="265" font-size="28" fill="#173f32" text-anchor="start" font-weight="700">4 pairs = 8 legs</text><text x="650" y="330" font-size="28" fill="#173f32" text-anchor="start" font-weight="700">No tail</text><text x="360" y="132" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">Aquatic spider</text><path d="M640 265 L520 375" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">C: Argyroneta  •  four pairs of jointed legs</text></g></svg>