<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">A phagocyte engulfs and digests pathogens</title><desc id="desc">A large white blood cell with a lobed nucleus extends its membrane around a bacterium; the final cell contains the bacterium inside a digestive vesicle.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">A phagocyte engulfs and digests pathogens</text><circle cx="190" cy="290" r="120" fill="#e6edf0" stroke="#537c9a" stroke-width="4"/><path d="M140 240 C105 205 115 295 160 280 C185 345 235 325 220 280 C270 250 235 205 205 240 C185 215 160 215 140 240" fill="#8f9caf" stroke="#537c9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="190" y="145" font-size="27" text-anchor="middle" fill="#173f32" font-weight="bold">X: phagocyte</text><text x="190" y="475" font-size="25" text-anchor="middle" fill="#173f32">Lobed nucleus</text><path d="M335 290 L440 290" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><path d="M555 175 C450 170 450 410 590 415 C685 420 730 330 695 275 L625 300 L655 235 C640 190 600 180 555 175" fill="#e6edf0" stroke="#537c9a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(665 285) scale(0.8)"><rect x="-28" y="-11" width="56" height="22" rx="11" fill="#edf3f4" stroke="#24644b" stroke-width="3"/><circle cx="-12" cy="0" r="3" fill="#24644b" stroke="#24644b" stroke-width="1"/><circle cx="6" cy="0" r="3" fill="#24644b" stroke="#24644b" stroke-width="1"/><circle cx="18" cy="0" r="3" fill="#24644b" stroke="#24644b" stroke-width="1"/><path d="M-28 -2 Q-50 -25 -58 0 M28 2 Q47 28 54 5" fill="none" stroke="#24644b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M510 250 Q480 290 530 310 Q565 350 590 300" fill="#8f9caf" stroke="#537c9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="580" y="475" font-size="25" text-anchor="middle" fill="#173f32">Engulfs a pathogen</text><path d="M740 290 L805 290" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><circle cx="885" cy="290" r="60" fill="#e6edf0" stroke="#537c9a" stroke-width="4"/><g transform="translate(885 290) scale(0.5)"><rect x="-28" y="-11" width="56" height="22" rx="11" fill="#edf3f4" stroke="#24644b" stroke-width="3"/><circle cx="-12" cy="0" r="3" fill="#24644b" stroke="#24644b" stroke-width="1"/><circle cx="6" cy="0" r="3" fill="#24644b" stroke="#24644b" stroke-width="1"/><circle cx="18" cy="0" r="3" fill="#24644b" stroke="#24644b" stroke-width="1"/><path d="M-28 -2 Q-50 -25 -58 0 M28 2 Q47 28 54 5" fill="none" stroke="#24644b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="885" cy="290" r="35" fill="none" stroke="#b28298" stroke-width="3"/><text x="875" y="400" font-size="24" text-anchor="middle" fill="#173f32">Digestion</text><text x="500" y="565" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">C: phagocyte; engulfs pathogens</text></g></svg>