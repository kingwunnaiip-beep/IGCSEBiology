#357ca2" stroke-width="7"/><line x1="780" y1="303" x2="801" y2="279" stroke="#357ca2" stroke-width="7"/><line x1="846" y1="372" x2="846" y2="406" stroke="#357ca2" stroke-width="7"/><line x1="846" y1="372" x2="825" y2="348" stroke="#357ca2" stroke-width="7"/><line x1="846" y1="372" x2="867" y2="348" stroke="#357ca2" stroke-width="7"/><line x1="780" y1="410" x2="780" y2="444" stroke="#357ca2" stroke-width="7"/><line x1="780" y1="410" x2="759" y2="386" stroke="#357ca2" stroke-width="7"/><line x1="780" y1="410" x2="801" y2="386" stroke="#357ca2" stroke-width="7"/><text x="810" y="484" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Specific proteins</text><line x1="326" y1="352" x2="392" y2="352" stroke="#357ca2" stroke-width="5"/><polygon points="392,352 378.6950761583107,358.92668763312224 378.6950761583107,345.07331236687776" fill="#357ca2"/><line x1="608" y1="352" x2="674" y2="352" stroke="#357ca2" stroke-width="5"/><polygon points="674,352 660.6950761583107,358.92668763312224 660.6950761583107,345.07331236687776" fill="#357ca2"/><rect x="75" y="571" width="850" height="150" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="613" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Antigens trigger the specific immune response</text><text x="500.0" y="655" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >They are recognised as foreign.</text><rect x="75" y="765" width="850" height="177" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="807" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >B lymphocytes can form plasma cells</text><text x="500.0" y="849" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Plasma cells secrete antibodies that bind</text><text x="500.0" y="885" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >to complementary antigens.</text><text x="500" y="1028" font-size="26" fil