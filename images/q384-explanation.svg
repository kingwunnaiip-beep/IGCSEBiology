<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">An inserted insulin gene gives bacteria a new product</title><desc id="desc">A human insulin gene is inserted into bacterial DNA. The genetically engineered bacterium expresses the gene and produces human insulin. The introduced gene gives it a new product.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#245744"/></marker></defs><rect width="1000" height="540" rx="22" fill="#fbf8ed"/><text x="42" y="49" font-family="Arial, sans-serif" font-size="30" text-anchor="start" fill="#183e32" font-weight="bold">An inserted insulin gene gives bacteria a new product</text><rect x="55" y="115" width="280" height="125" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><text x="195" y="157" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#183e32" font-weight="bold">Human insulin gene</text><path d="M110,198 h165" stroke="#d7ae57" stroke-width="11"/><path d="M349,178 L395,178" fill="none" stroke="#245744" stroke-width="4" marker-end="url(#arrow)"/><rect x="410" y="115" width="535" height="125" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><text x="677" y="156" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#183e32" font-weight="bold">Gene inserted into bacterial DNA</text><ellipse cx="676" cy="200" rx="80" ry="21" fill="none" stroke="#245744" stroke-width="7"/><path d="M643,181 q34,-11 65,0" fill="none" stroke="#d7ae57" stroke-width="8"/><path d="M677,255 L677,306" fill="none" stroke="#245744" stroke-width="4" marker-end="url(#arrow)"/><rect x="410" y="320" width="535" height="125" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><text x="677" y="360" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#183e32" font-weight="bold">Bacterium expresses the gene</text><text x="677" y="408" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#183e32" font-weight="normal">Human insulin protein is produced</text><rect x="55" y="320" width="280" height="125" rx="18" fill="#f0e6c8" stroke="#548c69" stroke-width="2"/><text x="195" y="361" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" fill="#183e32" font-weight="bold">New DNA</text><text x="195" y="407" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#183e32" font-weight="normal">→ new product</text><text x="500" y="485" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#183e32" font-weight="normal">Using natural enzymes or yeast alone does not prove engineering.</text><text x="42" y="518" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#52675b" font-weight="normal">Original teaching schematic • Biology quiz • not to scale</text></svg>