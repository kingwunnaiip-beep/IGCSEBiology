<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="q310-title q310-desc">
<title id="q310-title">Cones and rods have different roles</title>
<desc id="q310-desc">Cones are concentrated in the fovea, detect colour and need brighter light. Rods are more sensitive at low light intensity. Statements 1 and 2 are correct; statement 3 reverses the sensitivity comparison.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="740" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Cones and rods have different roles</text><rect x="50" y="110" width="480" height="300" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="290.0" y="153" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Cones</text><text x="290.0" y="201" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Concentrated in the fovea</text><text x="290.0" y="243" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Detect different colours</text><text x="290.0" y="285" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Work best in bright light</text><text x="290.0" y="327" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Less sensitive in dim light</text><rect x="590" y="110" width="480" height="300" rx="12" fill="#edf3fa" stroke="#25614b" stroke-width="2"/><text x="830.0" y="153" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Rods</text><text x="830.0" y="201" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Important away from the fovea</text><text x="830.0" y="243" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Do not distinguish colours</text><text x="830.0" y="285" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Support dim-light vision</text><text x="830.0" y="327" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >More sensitive in dim light</text><rect x="80" y="460" width="960" height="150" rx="12" fill="#f4f0e6" stroke="none" stroke-width="2"/><text x="560" y="505" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >Statement 1: fovea ✓     Statement 2: colour ✓</text><text x="560" y="553" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >Statement 3: cones more sensitive than rods ✗</text><rect x="24" y="664" width="1072" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="560.0" y="698" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Statements 1 and 2 only → option B</text>
</g></svg>