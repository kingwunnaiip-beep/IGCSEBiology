<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1040" viewBox="0 0 1000 1040" role="img" aria-labelledby="q68-title q68-desc">
<title id="q68-title">Six cats must be heterozygous</title>
<desc id="q68-desc">Complete 11-cat pedigree using the question&#x27;s dominant long-hair allele L and recessive short-hair allele l. Squares are males; circles are females; grey cats are short-haired ll. Green outlines mark the six certain Ll cats: I-2, II-2, III-3, III-4, III-5 and IV-1. III-1 can be LL or Ll and is excluded.</desc>
