<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-labelledby="q531-title q531-desc"><title id="q531-title">Copy DNA, then distribute equal chromosome sets</title><desc id="q531-desc">A schematic diploid nucleus has four unreplicated chromosomes. At X, DNA copying produces four duplicated chromosomes, each with two chromatids. At Y, mitosis produces two diploid daughter nuclei each with four unreplicated chromosomes. Chromosome number is retained.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#36785e"/></marker></defs><rect x="0" y="0" width="900" height="530" rx="22" fill="#fbf7e9"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="46" font-size="27" text-anchor="start" fill="#183e35"><tspan x="35" dy="0">Copy DNA, then distribute equal chromosome sets</tspan></text><circle cx="125" cy="250" r="67" fill="#eef2df" stroke="#36785e" stroke-width="2"/><path d="M93 218 L107 246" stroke="#36785e" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M140 218 L154 246" stroke="#36785e" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M93 260 L107 288" stroke="#36785e" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M140 260 L154 288" stroke="#36785e" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="425" cy="250" r="67" fill="#eef2df" stroke="#36785e" stroke-width="2"/><path d="M393 218 L407 246" stroke="#36785e" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M407 218 L393 246" stroke="#36785e" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M440 218 L454 246" stroke="#36785e" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M454 218 L440 246" stroke="#36785e" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M393 260 L407 288" stroke="#36785e" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M407 260 L393 288" stroke="#36785e" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M440 260 L454 288" stroke="#36785e" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M454 260 L440 288" stroke="#36785e" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="755" cy="155" r="67" fill="#eef2df" stroke="#36785e" stroke-width="2"/><path d="M723 123 L737 151" stroke="#36785e" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M770 123 L784 151" stroke="#36785e" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M723 165 L737 193" stroke="#36785e" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M770 165 L784 193" stroke="#36785e" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="755" cy="345" r="67" fill="#eef2df" stroke="#36785e" stroke-width="2"/><path d="M723 313 L737 341" stroke="#36785e" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M770 313 L784 341" stroke="#36785e" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M723 355 L737 383" stroke="#36785e" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M770 355 L784 383" stroke="#36785e" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M205 250 L338 250" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M500 225 L673 160" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M500 275 L673 340" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="270" y="205" font-size="21" text-anchor="middle" fill="#183e35"><tspan x="270" dy="0">X: duplication</tspan></text><text x="578" y="110" font-size="22" text-anchor="middle" fill="#183e35"><tspan x="578" dy="0">Y: mitosis</tspan></text><text x="125" y="415" font-size="21" text-anchor="middle" fill="#183e35"><tspan x="125" dy="0">Diploid cell</tspan><tspan x="125" dy="29">4 chromosomes</tspan></text><text x="425" y="415" font-size="21" text-anchor="middle" fill="#183e35"><tspan x="425" dy="0">DNA copied</tspan><tspan x="425" dy="29">4 duplicated chromosomes</tspan></text><text x="755" y="453" font-size="21" text-anchor="middle" fill="#183e35"><tspan x="755" dy="0">Two diploid cells</tspan><tspan x="755" dy="29">4 chromosomes each</tspan></text></g></svg>