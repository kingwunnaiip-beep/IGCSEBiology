<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" role="img" aria-labelledby="title desc"><title id="title">Gravity guides roots and shoots in opposite directions</title><desc id="desc">A seedling grows inside a dark box. Its shoot grows upwards, away from the downward gravity arrow, showing negative gravitropism. Its root grows downwards, with gravity, showing positive gravitropism. No light stimulus is drawn.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#276b46"/></marker></defs><rect width="1000" height="570" rx="20" fill="#fbfaf0"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="53" fill="#203e33" font-size="30" font-weight="bold" text-anchor="start">Gravity guides roots and shoots in opposite directions</text><text x="40" y="95" fill="#203e33" font-size="22" font-weight="normal" text-anchor="start">Darkness removes directional light; gravity remains.</text><rect x="300" y="135" width="380" height="335" rx="14" fill="#eef1e5" stroke="#276b46" stroke-width="2"/><text x="490" y="170" fill="#203e33" font-size="24" font-weight="bold" text-anchor="middle">Dark box</text><path d="M490 335 Q530 290 520 230" fill="none" stroke="#276b46" stroke-width="12"/><path d="M490 335 Q460 390 480 435" fill="none" stroke="#ae604c" stroke-width="9"/><path d="M520 258 Q563 229 560 205 Q525 207 520 258 Z" fill="#dcebd8" stroke="#276b46" stroke-width="3"/><circle cx="490" cy="335" r="16" fill="#d7a542" stroke="#276b46" stroke-width="2"/><path d="M805 185 L805 410" fill="none" stroke="#276b46" stroke-width="3" marker-end="url(#arrow)"/><text x="805" y="452" fill="#203e33" font-size="24" font-weight="bold" text-anchor="middle">Gravity</text><path d="M575 290 L575 215" fill="none" stroke="#276b46" stroke-width="3" marker-end="url(#arrow)"/><path d="M420 355 L420 430" fill="none" stroke="#276b46" stroke-width="3" marker-end="url(#arrow)"/><text x="43" y="225" fill="#203e33" font-size="23" font-weight="normal" text-anchor="start">Shoot grows away</text><text x="43" y="257" fill="#203e33" font-size="23" font-weight="normal" text-anchor="start">from gravity:</text><text x="43" y="289" fill="#203e33" font-size="23" font-weight="normal" text-anchor="start">negative gravitropism</text><text x="43" y="365" fill="#203e33" font-size="23" font-weight="normal" text-anchor="start">Root grows towards</text><text x="43" y="397" fill="#203e33" font-size="23" font-weight="normal" text-anchor="start">gravity:</text><text x="43" y="429" fill="#203e33" font-size="23" font-weight="normal" text-anchor="start">positive gravitropism</text><path d="M263 220 L488 244" fill="none" stroke="#276b46" stroke-width="2"/><path d="M264 370 L456 397" fill="none" stroke="#276b46" stroke-width="2"/><text x="40" y="517" fill="#203e33" font-size="25" font-weight="bold" text-anchor="start">Both are gravitropism: the stimulus is the same.</text><text x="40" y="548" fill="#65776d" font-size="16" font-weight="normal" text-anchor="start">Original teaching schematic • diagrams are not to scale</text></g></svg>