<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="t388 d388"><title id="t388">Atrial contraction fills ventricles</title><desc id="d388">Atrial muscles contract to push blood through open atrioventricular valves into relaxed ventricles. This is one side of the heart drawn schematically.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#286346"/></marker></defs><rect width="960" height="440" rx="24" fill="#f7f5e9"/><style>text{font-family:Arial,sans-serif;fill:#183b2b;font-size:22px}.title{font-size:29px;font-weight:700}.small{font-size:19px}.strong{font-weight:700}.box{fill:#e0eddc;stroke:#60876b;stroke-width:2}.arrow{fill:none;stroke:#286346;stroke-width:4;marker-end:url(#arrow)}</style><text class="title" x="38" y="50">Atrial contraction fills ventricles</text><rect x="66" y="104" width="292" height="105" rx="35" fill="#a8c99e" stroke="#286346" stroke-width="6"/><text class="strong" x="106" y="149">ATRIUM</text><text x="106" y="181">muscle contracts</text><rect x="66" y="253" width="292" height="133" rx="39" fill="#e0eddc" stroke="#286346" stroke-width="3"/><text class="strong" x="106" y="302">VENTRICLE</text><text x="106" y="340">muscle relaxes</text><path class="arrow" d="M211 183 V283"/><path d="M137 216 L160 242 M287 216 L264 242" stroke="#286346" stroke-width="7"/><path d="M306 229 H470" fill="none" stroke="#60876b" stroke-width="3"/><text class="strong" x="493" y="151">Blood moves down its</text><text class="strong" x="493" y="184">pressure gradient</text><text x="493" y="235">Atrioventricular valve OPEN</text><text x="493" y="281">Blood enters the ventricle</text><text class="small" x="493" y="348">Schematic: one atrium and ventricle</text><text class="small" x="493" y="379">shown to explain this stage</text></svg>