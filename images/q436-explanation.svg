<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">A growing seed needs more energy</title><desc id="desc">Germination requires energy for growth. The respiration rate increases to release energy. Active transport uses this energy for ion uptake against a concentration gradient.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#397857"/></marker></defs><rect width="900" height="520" rx="22" fill="#fbfaee"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="28" text-anchor="start" fill="#183e31" font-weight="bold">A growing seed needs more energy</text><path d="M95 340 C40 270 90 225 145 260 C205 295 175 350 125 365 Z" fill="#b5bf7b" stroke="#4c7957" stroke-width="3"/><path d="M130 305 Q165 230 170 180" fill="none" stroke="#397857" stroke-width="9"/><path d="M170 220 Q130 160 100 190 Q123 230 170 220 M170 200 Q205 145 230 175 Q220 210 170 200" fill="#84ad70"/><path d="M120 340 Q90 390 120 415" fill="none" stroke="#8c8055" stroke-width="5"/><text x="150" y="130" font-size="25" text-anchor="middle" fill="#183e31" font-weight="bold">Germination</text><text x="150" y="460" font-size="21" text-anchor="middle" fill="#183e31" font-weight="normal">New cells and growth</text><rect x="305" y="115" width="530" height="95" rx="18" fill="#e5f0dd" stroke="#4c7957" stroke-width="2"/><text x="570" y="153" font-size="25" text-anchor="middle" fill="#183e31" font-weight="bold">Energy demand increases</text><text x="570" y="185" font-size="20" text-anchor="middle" fill="#183e31" font-weight="normal">Growth and cell processes need energy</text><path d="M570 215 L570 253" fill="none" stroke="#397857" stroke-width="4" marker-end="url(#arrow)"/><rect x="305" y="260" width="530" height="85" rx="18" fill="#e5f0dd" stroke="#4c7957" stroke-width="2"/><text x="570" y="310" font-size="25" text-anchor="middle" fill="#183e31" font-weight="bold">Respiration rate increases</text><path d="M570 350 L570 390" fill="none" stroke="#397857" stroke-width="4" marker-end="url(#arrow)"/><rect x="305" y="397" width="530" height="80" rx="18" fill="#e5f0dd" stroke="#4c7957" stroke-width="2"/><text x="570" y="429" font-size="22" text-anchor="middle" fill="#183e31" font-weight="bold">Energy supports active transport</text><text x="570" y="459" font-size="18" text-anchor="middle" fill="#183e31" font-weight="normal">Ion uptake can oppose a concentration gradient</text></g></svg>