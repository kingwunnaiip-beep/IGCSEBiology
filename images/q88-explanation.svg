 stroke-width="3"/><path d="M 483 616 Q 463 666 489 725" fill="none" stroke="#854b3d" stroke-width="2"/><text x="474" y="775" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Liver</text><line x1="575" y1="665" x2="650" y2="665" stroke="#25614b" stroke-width="4"/><polygon points="650,665 636.6950761583107,671.9266876331222 636.6950761583107,658.0733123668778" fill="#25614b"/><text x="615" y="620" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >W</text><rect x="667" y="622" width="244" height="87" rx="12" fill="#fffdf7" stroke="#25614b" stroke-width="2"/><text x="789" y="675" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Y · Urea</text><line x1="789" y1="725" x2="789" y2="1008" stroke="#357ca2" stroke-width="5"/><polygon points="789,1008 782.0733123668778,994.6950761583107 795.9266876331222,994.6950761583107" fill="#357ca2"/><text x="847" y="863" font-size="24" fill="#357ca2" font-weight="400" text-anchor="middle" >Blood</text><text x="78" y="829" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >W · Deamination</text><text x="78" y="870" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >Nitrogen-containing amino group removed.</text><text x="78" y="907" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >Toxic ammonia forms.</text><text x="78" y="944" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >Then the liver converts ammonia into urea.</text><rect x="48" y="1025" width="904" height="394" rx="12" fill="#edf5f8" stroke="none" stroke-width="2"/><text x="789" y="1071" font-size="28" fill="#357ca2" font-weight="700" text-anchor="middle" >Z · Kidneys</text><rect x="77" y="1120" width="412" height="98" rx="12" fill="#fffdf7" stroke="#357ca2" stroke-width="2"/><text x="283" y="1159" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Excess mineral ions (salts)</text><text x="283" y="1193" font-size="25" fill="