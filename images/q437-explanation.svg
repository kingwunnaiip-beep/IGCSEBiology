<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Glucose is absorbed in the small intestine</title><desc id="desc">A schematic villus has a thin epithelium and a blood capillary. Glucose crosses the epithelium from the intestinal lumen and enters the blood. Many villi and microvilli provide a large surface area.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#397857"/></marker></defs><rect width="900" height="520" rx="22" fill="#fbfaee"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="28" text-anchor="start" fill="#183e31" font-weight="bold">Glucose is absorbed in the small intestine</text><path d="M120 430 L120 260 Q120 100 250 100 Q380 100 380 260 L380 430" fill="#dcebbf" stroke="#4c7957" stroke-width="12"/><path d="M210 430 L210 270 Q210 185 250 185 Q290 185 290 270 L290 430" fill="none" stroke="#b26b58" stroke-width="18"/><text x="250" y="477" font-size="22" text-anchor="middle" fill="#183e31" font-weight="bold">Villus: large surface area</text><text x="520" y="128" font-size="23" text-anchor="start" fill="#183e31" font-weight="bold">Small-intestine lumen</text><text x="520" y="164" font-size="21" text-anchor="start" fill="#183e31" font-weight="normal">Glucose after digestion</text><circle cx="440" cy="200" r="8" fill="#64924e" stroke="none" stroke-width="3"/><circle cx="466" cy="235" r="8" fill="#64924e" stroke="none" stroke-width="3"/><circle cx="427" cy="290" r="8" fill="#64924e" stroke="none" stroke-width="3"/><circle cx="470" cy="345" r="8" fill="#64924e" stroke="none" stroke-width="3"/><path d="M465 262 L310 262" fill="none" stroke="#397857" stroke-width="4" marker-end="url(#arrow)"/><text x="520" y="246" font-size="21" text-anchor="start" fill="#183e31" font-weight="normal">Across thin epithelium</text><text x="520" y="279" font-size="21" text-anchor="start" fill="#183e31" font-weight="normal">into blood capillaries</text><path d="M550 290 L290 320" fill="none" stroke="#397857" stroke-width="4"/><path d="M250 350 L250 412" fill="none" stroke="#397857" stroke-width="4" marker-end="url(#arrow)"/><text x="520" y="365" font-size="21" text-anchor="start" fill="#183e31" font-weight="normal">Blood carries glucose away</text><text x="520" y="410" font-size="21" text-anchor="start" fill="#183e31" font-weight="normal">Many villi + microvilli</text><text x="520" y="442" font-size="21" text-anchor="start" fill="#183e31" font-weight="normal">increase absorption area</text></g></svg>