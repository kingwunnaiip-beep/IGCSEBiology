<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1090" viewBox="0 0 1000 1090" role="img" aria-labelledby="q230-title q230-desc">
<title id="q230-title">230 · Lactase breaks down lactose in milk</title>
<desc id="q230-desc">Milk passes through inert alginate beads containing immobilised lactase, enzyme X. Lactase catalyses hydrolysis of lactose into glucose and galactose. The product milk can therefore contain glucose, Y. A qualitative reaction model shows one linked lactose pair becoming two separate product symbols after water is added. The enzyme stays in the beads. Symbols are not molecular structures, measured sizes or production yields. Answer C.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1090" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >230 · Lactase breaks down lactose in milk</text><text x="500" y="111" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Match the enzyme, substrate and products.</text><rect x="95" y="163" width="810" height="134" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="204" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >X = lactase in alginate beads</text><text x="500.0" y="247" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Beads hold the enzyme; they do not react.</text><text x="500" y="360" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Lactose + water</text><circle cx="459" cy="435" r="40" fill="#d5e8bc" stroke="#25614b" stroke-width="3"/><circle cx="541" cy="435" r="40" fill="#e4d4ac" stroke="#daa958" stroke-width="3"/><line x1="499" y1="435" x2="501" y2="435" stroke="#173d31" stroke-width="7"/><line x1="500" y1="492" x2="500" y2="563" stroke="#357ca2" stroke-width="5"/><polygon points="500,563 493.07331236687776,549.6950761583107 506.92668763312224,549.6950761583107" fill="#357ca2"/><text x="680" y="536" font-size="25" fill="#357ca2" font-weight="400" text-anchor="middle" >Lactase catalyses</text><circle cx="305" cy="644" r="45" fill="#d5e8bc" stroke="#25614b" stroke-width="3"/><circle cx="695" cy="644" r="45" fill="#e4d4ac" stroke="#daa958" stroke-width="3"/><text x="500" y="656" font-size="33" fill="#173d31" font-weight="700" text-anchor="middle" >+</text><text x="305" y="735" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Glucose</text><text x="695" y="735" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Galactose</text><rect x="170" y="772" width="270" height="63" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="305" y="813" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Y can be glucose</text><text x="500" y="903" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Amylase digests starch, not lactose.</text><text x="500" y="942" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative reaction symbols; no yield or molecular scale implied.</text><rect x="24" y="1014" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1048" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · X: lactase · Y: glucose</text>
