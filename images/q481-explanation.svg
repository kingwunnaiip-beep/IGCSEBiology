<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="q481-title q481-desc">
<title id="q481-title">Central and peripheral nervous systems</title>
<desc id="q481-desc">A classification diagram divides the nervous system into the central nervous system, containing brain and spinal cord, and the peripheral nervous system, containing nerves connecting the CNS to receptors and effectors.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="690" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Central and peripheral nervous systems</text><rect x="320" y="90" width="360" height="85" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="128" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Nervous system</text><line x1="500" y1="178" x2="500" y2="205" stroke="#25614b" stroke-width="3"/><line x1="255" y1="205" x2="745" y2="205" stroke="#25614b" stroke-width="3"/><line x1="255" y1="205" x2="255" y2="245" stroke="#25614b" stroke-width="4"/><polygon points="255,245 248.07331236687776,231.69507615831074 261.92668763312224,231.69507615831074" fill="#25614b"/><line x1="745" y1="205" x2="745" y2="245" stroke="#25614b" stroke-width="4"/><polygon points="745,245 738.0733123668778,231.69507615831074 751.9266876331222,231.69507615831074" fill="#25614b"/><rect x="35" y="255" width="440" height="245" rx="12" fill="#d8e9c6" stroke="#25614b" stroke-width="2"/><text x="255.0" y="293" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Central nervous system</text><text x="255.0" y="331" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >brain</text><text x="255.0" y="362" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >+</text><text x="255.0" y="393" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >spinal cord</text><rect x="525" y="255" width="440" height="245" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="745.0" y="293" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Peripheral nervous system</text><text x="745.0" y="331" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >nerves connecting the CNS</text><text x="745.0" y="362" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >to receptors and effectors</text><line x1="485" y1="355" x2="515" y2="355" stroke="#357ca2" stroke-width="3"/><polygon points="515,355 501.6950761583107,361.92668763312224 501.6950761583107,348.07331236687776" fill="#357ca2"/><line x1="515" y1="385" x2="485" y2="385" stroke="#357ca2" stroke-width="3"/><polygon points="485,385 498.3049238416893,378.07331236687776 498.3049238416893,391.92668763312224" fill="#357ca2"/><text x="500" y="540" font-size="23" fill="#526c62" font-weight="400" text-anchor="middle" >Information travels between the CNS and the rest of the body.</text><rect x="24" y="614" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="648" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >CNS = brain + spinal cord only → B.</text>
</g></svg>