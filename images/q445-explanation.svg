<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Locate chromosomes in the nucleus</title><desc id="desc">A simplified plant cell highlights its nucleus. A magnified view shows illustrative chromosome symbols and links chromosomes to DNA and genes. Chromosome symbols do not specify the species chromosome count.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="40" y="54" font-size="31" fill="#173f32" text-anchor="start" font-weight="bold">Locate chromosomes in the nucleus</text><rect x="48" y="103" width="406" height="405" rx="18" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><rect x="68" y="123" width="366" height="365" rx="18" fill="#f0f5e8" stroke="#24644b" stroke-width="3"/><circle cx="173" cy="255" r="64" fill="#c9ddc5" stroke="#24644b" stroke-width="3"/><text x="173" y="261" font-size="22" fill="#173f32" text-anchor="middle" font-weight="bold">nucleus</text><rect x="270" y="174" width="133" height="240" rx="45" fill="#fdfbf3" stroke="#24644b" stroke-width="3"/><text x="336" y="289" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">vacuole</text><text x="250" y="478" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">Plant cell (simplified)</text><path d="M244,255 L515,255" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><rect x="540" y="135" width="408" height="320" rx="18" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><text x="744" y="178" font-size="26" fill="#173f32" text-anchor="middle" font-weight="bold">Inside the nucleus</text><path d="M615,210 L645,290 M645,210 L615,290" fill="none" stroke="#24644b" stroke-width="10" /><path d="M717,225 L747,305 M747,225 L717,305" fill="none" stroke="#24644b" stroke-width="10" /><path d="M824,205 L854,285 M854,205 L824,285" fill="none" stroke="#24644b" stroke-width="10" /><text x="744" y="359" font-size="25" fill="#173f32" text-anchor="middle" font-weight="normal">Chromosomes carry DNA</text><text x="744" y="402" font-size="24" fill="#173f32" text-anchor="middle" font-weight="normal">DNA contains genes</text><text x="50" y="556" font-size="25" fill="#173f32" text-anchor="start" font-weight="normal">Examine the nucleus to investigate the nuclear chromosome set.</text></g></svg>