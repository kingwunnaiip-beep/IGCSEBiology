<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1280" viewBox="0 0 1000 1280" role="img" aria-labelledby="q132-title q132-desc">
<title id="q132-title">132 · Iodine solution tests for starch</title>
<desc id="q132-desc">Answer C: iodine solution gives a blue-black colour in the presence of starch. Without starch, the iodine solution remains yellow-brown. The two test tubes are colour illustrations rather than experimental photographs or measured results. The biuret test detects protein with a blue-to-purple colour change. Benedict’s test detects reducing sugars and requires heating in a water bath. DCPIP tests for vitamin C, which decolourises the blue dye. These tests detect different food components.</desc>
