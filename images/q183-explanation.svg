 778.6950761583107,618.0733123668778" fill="#357ca2"/><text x="500" y="592" font-size="28" fill="#357ca2" font-weight="700" text-anchor="middle" >Sucrose moves through phloem</text><rect x="85" y="713" width="830" height="164" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="755" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Source exports · Sink imports</text><text x="500.0" y="799" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Dodder uses assimilates for respiration and growth.</text><text x="500" y="957" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative pathway; organism shapes and distances are illustrative.</text><rect x="24" y="1024" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1058" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · Host leaves: source · Dodder: sink</text>
