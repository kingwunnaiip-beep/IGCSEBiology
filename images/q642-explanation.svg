<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which listed features are involved in meiosis?</title><desc id="desc">Meiosis produces haploid cells (2), genetically different cells (3), and variation (4). Statement 1 is false because chromosome number is halved, not maintained. Answer C.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e" /></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8" /><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Which listed features are involved in meiosis?</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="50" y="207" font-size="23" font-weight="700">2: haploid cells</text><text x="50" y="236" font-size="23" font-weight="700">produced</text><text x="50" y="285" font-size="21" font-weight="400">Chromosome number halved</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="405" y="207" font-size="23" font-weight="700">3: genetically</text><text x="405" y="236" font-size="23" font-weight="700">different</text><text x="405" y="285" font-size="21" font-weight="400">New allele combinations</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="760" y="207" font-size="23" font-weight="700">4: variation results</text><text x="760" y="285" font-size="21" font-weight="400">Meiosis contributes</text><text x="760" y="312" font-size="21" font-weight="400">diversity</text><text x="38" y="406" font-size="19" font-weight="400">1 is false: chromosome number is halved. Correct statements: 2, 3 and 4 (C).</text></g></svg>