<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Inspiration increases thorax volume</title><desc id="desc">A front view of the thorax shows air entering the trachea, raised ribs and expanded lungs. The diaphragm moves from a dashed dome to a flatter contracted position. X is diaphragm contraction, Y external-intercostal contraction, and R internal-intercostal relaxation.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="1.8"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#b85c50" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="38" y="54" font-size="30" fill="#173f32" font-weight="bold">Inspiration increases thorax volume</text><path d="M358 144 Q294 165 278 304 L294 467 Q499 530 706 467 L722 304 Q706 165 642 144" fill="none" stroke="#24644b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="481" y="112" width="38" height="115" rx="9" fill="#dcebf2" stroke="#537c9a" stroke-width="3" /><path d="M500 221 L423 275 M500 221 L577 275" fill="none" stroke="#537c9a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" /><path d="M463 227 C371 194 324 274 330 394 Q366 457 456 421 Z" fill="#dcebf2" stroke="#537c9a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M537 227 C629 194 676 274 670 394 Q634 457 544 421 Z" fill="#dcebf2" stroke="#537c9a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M304 221 Q350 189 412 205 M696 221 Q650 189 588 205" fill="none" stroke="#d1a350" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M304 267 Q350 235 412 251 M696 267 Q650 235 588 251" fill="none" stroke="#d1a350" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M304 313 Q350 281 412 297 M696 313 Q650 281 588 297" fill="none" stroke="#d1a350" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M304 359 Q350 327 412 343 M696 359 Q650 327 588 343" fill="none" stroke="#d1a350" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M304 405 Q350 373 412 389 M696 405 Q650 373 588 389" fill="none" stroke="#d1a350" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M307 458 Q500 336 693 458" fill="none" stroke="#8b948b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 9"/><path d="M307 476 Q500 447 693 476" fill="none" stroke="#24644b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><line x1="501" y1="122" x2="501" y2="190" stroke="#537c9a" stroke-width="4" stroke-linecap="round" marker-end="url(#blue)"/><line x1="278" y1="331" x2="235" y2="294" stroke="#24644b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="722" y1="331" x2="765" y2="294" stroke="#24644b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="500" y1="418" x2="500" y2="456" stroke="#24644b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="42" y="135" font-size="23" text-anchor="start" fill="#173f32" font-weight="bold">Y · External intercostals</text><text x="42" y="164" font-size="23" text-anchor="start" fill="#173f32" font-weight="bold">contract: ribs up and out</text><line x1="257" y1="166" x2="329" y2="211" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><text x="741" y="153" font-size="23" text-anchor="start" fill="#173f32" font-weight="bold">R · Internal</text><text x="741" y="182" font-size="23" text-anchor="start" fill="#173f32" font-weight="bold">intercostals relax</text><text x="47" y="445" font-size="23" text-anchor="start" fill="#173f32" font-weight="bold">X · Diaphragm</text><text x="47" y="474" font-size="23" text-anchor="start" fill="#173f32" font-weight="bold">contracts and flattens</text><line x1="259" y1="460" x2="319" y2="475" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><text x="744" y="423" font-size="24" text-anchor="start" fill="#173f32" font-weight="bold">Larger volume</text><text x="744" y="453" font-size="24" text-anchor="start" fill="#173f32" font-weight="bold">Lower pressure</text><text x="744" y="483" font-size="24" text-anchor="start" fill="#173f32" font-weight="bold">Air enters</text><text x="500" y="558" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">C · X + Y + R: the muscle changes act together during inspiration.</text></g></svg>
