<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="q337-title q337-desc">
<title id="q337-title">Digestion makes molecules small enough to diffuse</title>
<desc id="q337-desc">Inside the tubing protease digests large protein into small amino acids. Amino acids and pre-existing simple sugars diffuse through the membrane into the surrounding water. Starch and intact protein are too large.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="820" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Digestion makes molecules small enough to diffuse</text><rect x="45" y="105" width="460" height="525" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><rect x="595" y="105" width="460" height="525" rx="12" fill="#edf5f9" stroke="#357ca2" stroke-width="2"/><text x="275" y="150" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Inside the tubing</text><text x="825" y="150" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Surrounding water</text><line x1="550" y1="180" x2="550" y2="620" stroke="#526c62" stroke-width="5" stroke-dasharray="10 10"/><text x="550" y="685" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Membrane: permeable to small molecules only</text><text x="110" y="230" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >Protein (large)</text><line x1="275" y1="250" x2="275" y2="310" stroke="#25614b" stroke-width="4"/><polygon points="275,310 268.07331236687776,296.6950761583107 281.92668763312224,296.6950761583107" fill="#25614b"/><text x="300" y="290" font-size="25" fill="#173d31" font-weight="400" text-anchor="start" >protease</text><text x="110" y="355" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >Amino acids (small)</text><line x1="400" y1="375" x2="690" y2="375" stroke="#357ca2" stroke-width="4"/><polygon points="690,375 676.6950761583107,381.92668763312224 676.6950761583107,368.07331236687776" fill="#357ca2"/><text x="715" y="345" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >Amino acids</text><text x="715" y="384" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >diffuse out</text><text x="110" y="465" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >Simple sugars (small)</text><line x1="400" y1="485" x2="690" y2="485" stroke="#357ca2" stroke-width="4"/><polygon points="690,485 676.6950761583107,491.92668763312224 676.6950761583107,478.07331236687776" fill="#357ca2"/><text x="715" y="455" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >Simple sugars</text><text x="715" y="494" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >diffuse out</text><text x="105" y="540" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >Starch and intact protein</text><text x="105" y="578" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >stay inside: too large to cross</text><text x="105" y="616" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >this membrane.</text><rect x="24" y="744" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="778" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >A: amino acids and simple sugars</text>
</g></svg>