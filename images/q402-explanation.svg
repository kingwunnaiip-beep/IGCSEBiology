<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="q402-title q402-desc"><title id="q402-title">Two pedigree clues identify the two alleles in person 2</title><desc id="q402-desc">Two pedigree constraints are combined: person 3 needs a B allele from person 2, while person 4 must be A O to have O and A children with an O partner. Of the options, only person 2 B O fits both.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#245943"/></marker></defs><rect width="1000" height="600" rx="24" fill="#fbf9ee"/><g font-family="Arial, sans-serif"><text x="40" y="55" font-size="27" fill="#173e31" text-anchor="start" font-weight="bold">Two pedigree clues identify the two alleles in person 2</text><rect x="35" y="110" width="450" height="260" rx="16" fill="#e5f0df" stroke="#245943" stroke-width="2"/><rect x="515" y="110" width="450" height="260" rx="16" fill="#e5f0df" stroke="#245943" stroke-width="2"/><text x="260" y="150" font-size="23" fill="#173e31" text-anchor="middle" font-weight="bold">Clue 1: person 3 has group B</text><text x="260" y="196" font-size="23" fill="#173e31" text-anchor="middle" font-weight="normal">Person 1 is group A,</text><text x="260" y="229" font-size="23" fill="#173e31" text-anchor="middle" font-weight="normal">so cannot pass an Iᴮ allele.</text><path d="M260 244 L260 291" fill="none" stroke="#245943" stroke-width="4" marker-end="url(#arrow)"/><text x="260" y="328" font-size="25" fill="#173e31" text-anchor="middle" font-weight="bold">Person 2 must carry Iᴮ</text><text x="740" y="150" font-size="22" fill="#173e31" text-anchor="middle" font-weight="bold">Clue 2: person 4 has O and A children</text><text x="740" y="196" font-size="22" fill="#173e31" text-anchor="middle" font-weight="normal">With a group O partner, person 4</text><text x="740" y="228" font-size="22" fill="#173e31" text-anchor="middle" font-weight="normal">must be IᴬIᵒ to produce both.</text><path d="M740 244 L740 291" fill="none" stroke="#245943" stroke-width="4" marker-end="url(#arrow)"/><text x="740" y="328" font-size="24" fill="#173e31" text-anchor="middle" font-weight="bold">IᴮIᴮ for person 2 cannot fit</text><path d="M260 385 L420 445" fill="none" stroke="#245943" stroke-width="4" marker-end="url(#arrow)"/><path d="M740 385 L580 445" fill="none" stroke="#245943" stroke-width="4" marker-end="url(#arrow)"/><rect x="230" y="450" width="540" height="105" rx="16" fill="#e5f0df" stroke="#245943" stroke-width="2"/><text x="500" y="493" font-size="24" fill="#173e31" text-anchor="middle" font-weight="normal">Available genotype that fits both clues:</text><text x="500" y="532" font-size="29" fill="#173e31" text-anchor="middle" font-weight="bold">Person 2 = IᴮIᵒ</text></g></svg>