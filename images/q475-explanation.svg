<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="q475-title q475-desc">
<title id="q475-title">Two partners in a lichen</title>
<desc id="q475-desc">Schematic contrast: branching fungal hyphae have many nuclei and no chloroplasts. A single-celled photosynthetic protoctist has a nucleus and chloroplasts. Their different features identify kingdoms X and Y.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="570" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Two partners in a lichen</text><rect x="30" y="88" width="450" height="370" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="255.0" y="126" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >X: fungus</text><rect x="520" y="88" width="450" height="370" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="745.0" y="126" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Y: protoctist</text><path d="M95 240 L270 240 L375 180 M265 240 L375 300" fill="none" stroke="#25614b" stroke-width="36"/><path d="M95 240 L270 240 L375 180 M265 240 L375 300" fill="none" stroke="#dce8cb" stroke-width="28"/><ellipse cx="120" cy="240" rx="8" ry="6" fill="#173d31" stroke="none" stroke-width="3"/><ellipse cx="185" cy="240" rx="8" ry="6" fill="#173d31" stroke="none" stroke-width="3"/><ellipse cx="250" cy="240" rx="8" ry="6" fill="#173d31" stroke="none" stroke-width="3"/><ellipse cx="316" cy="214" rx="8" ry="6" fill="#173d31" stroke="none" stroke-width="3"/><ellipse cx="350" cy="194" rx="8" ry="6" fill="#173d31" stroke="none" stroke-width="3"/><ellipse cx="322" cy="273" rx="8" ry="6" fill="#173d31" stroke="none" stroke-width="3"/><ellipse cx="353" cy="290" rx="8" ry="6" fill="#173d31" stroke="none" stroke-width="3"/><text x="255" y="365" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >branching hyphae</text><text x="255" y="395" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >cell walls; many nuclei</text><text x="255" y="425" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >no chloroplasts</text><ellipse cx="745" cy="240" rx="120" ry="75" fill="#fffdf7" stroke="#25614b" stroke-width="4"/><circle cx="745" cy="240" r="16" fill="#173d31" stroke="none" stroke-width="3"/><ellipse cx="665" cy="220" rx="17" ry="9" fill="#6e9b50" stroke="#25614b" stroke-width="2"/><ellipse cx="690" cy="276" rx="17" ry="9" fill="#6e9b50" stroke="#25614b" stroke-width="2"/><ellipse cx="780" cy="285" rx="17" ry="9" fill="#6e9b50" stroke="#25614b" stroke-width="2"/><ellipse cx="827" cy="238" rx="17" ry="9" fill="#6e9b50" stroke="#25614b" stroke-width="2"/><ellipse cx="784" cy="191" rx="17" ry="9" fill="#6e9b50" stroke="#25614b" stroke-width="2"/><text x="745" y="365" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >one cell with a nucleus</text><text x="745" y="395" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >chloroplasts capture light</text><text x="745" y="425" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >for photosynthesis</text><rect x="24" y="494" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="528" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Use the complete feature set: X = Fungus; Y = Protoctist.</text>
</g></svg>