<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">At 0.02% carbon dioxide the curve is still rising</title><desc id="desc">A photosynthesis-rate graph rises before reaching a plateau. The point at 0.02 percent is on the rising section, and an arrow shows increasing carbon dioxide increasing the rate.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">At 0.02% carbon dioxide the curve is still rising</text><path d="M110 470 L900 470" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><path d="M110 470 L110 130" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><path d="M110 470 C250 340 350 210 520 175 Q650 160 885 160" fill="none" stroke="#24644b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M350 470 L350 251.1854" fill="none" stroke="#537c9a" stroke-width="2" stroke-dasharray="7 7"/><circle cx="350" cy="251.1854" r="8" fill="#537c9a" stroke="#537c9a" stroke-width="2"/><text x="350" y="515" font-size="26" text-anchor="middle" fill="#173f32" font-weight="bold">0.02%</text><text x="650" y="515" font-size="24" text-anchor="middle" fill="#173f32">CO₂ concentration</text><text x="210" y="115" font-size="24" text-anchor="start" fill="#173f32">Rate of photosynthesis</text><path d="M390 310 L490 220" fill="none" stroke="#537c9a" stroke-width="4" marker-end="url(#arrow)"/><text x="680" y="270" font-size="25" text-anchor="middle" fill="#173f32" font-weight="bold">More CO₂ still increases rate</text><g transform="translate(760 450) rotate(0) scale(0.75)"><path d="M0 0 Q-80 -110 0 -160 Q90 -80 0 0" fill="#e4f0df" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 0 Q5 -75 0 -145" fill="none" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -35 L-30 -60" fill="none" stroke="#24644b" stroke-width="2"/><path d="M0 -60 L-30 -85" fill="none" stroke="#24644b" stroke-width="2"/><path d="M0 -85 L-30 -110" fill="none" stroke="#24644b" stroke-width="2"/><path d="M0 -110 L-30 -135" fill="none" stroke="#24644b" stroke-width="2"/></g><text x="590" y="425" font-size="23" text-anchor="middle" fill="#173f32">Light is already abundant</text><text x="500" y="565" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">A: carbon dioxide concentration</text></g></svg>