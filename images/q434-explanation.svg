<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Maltase splits maltose into two glucose molecules</title><desc id="desc">Maltose consists of two joined glucose units. Maltase catalyses hydrolysis using water, breaking the bond and releasing two glucose molecules. The enzyme remains unchanged.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#39725b"/></marker></defs><rect width="1100" height="560" rx="22" fill="#fbf8e9"/><g font-family="Arial, sans-serif"><text x="40" y="55" font-size="30" text-anchor="start" fill="#173d31">Maltase splits maltose into two glucose molecules</text><polygon points="215.0,250.0 185.0,301.9615242270663 125.00000000000001,301.9615242270663 95.0,250.0 124.99999999999997,198.03847577293368 185.0,198.03847577293368" fill="#c5dcad" stroke="#39725b" stroke-width="3"/><text x="155" y="257" font-size="20" text-anchor="middle" fill="#173d31">glucose</text><polygon points="380.0,250.0 350.0,301.9615242270663 290.0,301.9615242270663 260.0,250.0 290.0,198.03847577293368 350.0,198.03847577293368" fill="#c5dcad" stroke="#39725b" stroke-width="3"/><text x="320" y="257" font-size="20" text-anchor="middle" fill="#173d31">glucose</text><line x1="215" y1="250" x2="260" y2="250" stroke="#39725b" stroke-width="4"/><text x="235" y="365" font-size="23" text-anchor="middle" fill="#173d31">Maltose: two joined units</text><path d="M425 250 L625 250" fill="none" stroke="#39725b" stroke-width="5" marker-end="url(#arrow)"/><text x="525" y="190" font-size="27" text-anchor="middle" fill="#173d31">maltase</text><text x="525" y="310" font-size="23" text-anchor="middle" fill="#173d31">+ water</text><polygon points="820.0,250.0 790.0,301.9615242270663 730.0,301.9615242270663 700.0,250.0 730.0,198.03847577293368 790.0,198.03847577293368" fill="#c5dcad" stroke="#39725b" stroke-width="3"/><text x="760" y="257" font-size="20" text-anchor="middle" fill="#173d31">glucose</text><polygon points="1025.0,250.0 995.0,301.9615242270663 935.0,301.9615242270663 905.0,250.0 935.0,198.03847577293368 995.0,198.03847577293368" fill="#c5dcad" stroke="#39725b" stroke-width="3"/><text x="965" y="257" font-size="20" text-anchor="middle" fill="#173d31">glucose</text><text x="864" y="260" font-size="32" text-anchor="middle" fill="#173d31">+</text><text x="860" y="365" font-size="24" text-anchor="middle" fill="#173d31">Two glucose molecules</text><rect x="250" y="420" width="600" height="65" rx="15" fill="#e4edcf" stroke="#39725b" stroke-width="3"/><text x="550.0" y="462" font-size="25" text-anchor="middle" fill="#173d31">Enzyme unchanged; bond broken by hydrolysis</text><text x="40" y="530" font-size="17" text-anchor="start" fill="#536b57">Original teaching schematic • qualitative, not to scale</text></g></svg>