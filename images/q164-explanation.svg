<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1160" viewBox="0 0 1000 1160" role="img" aria-labelledby="q164-title q164-desc">
<title id="q164-title">164 · Glucose travels in both blood vessels</title>
<desc id="q164-desc">Answer C: the renal artery and renal vein both carry glucose. In a healthy person, glucose enters the filtrate but is selectively reabsorbed into the blood, so normal urine in the ureter has no glucose. The original conceptual flow model separates the blood pathway from the filtrate-to-urine pathway. Arrows show directions, not measured flow rates or glucose concentrations. The kidney uses some glucose, but this does not remove all glucose from the leaving blood.</desc>
