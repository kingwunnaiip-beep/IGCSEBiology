<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1260" viewBox="0 0 1000 1260" role="img" aria-labelledby="q159-title q159-desc">
<title id="q159-title">159 · A range of values or distinct categories?</title>
<desc id="q159-desc">Answer B. Continuous variation has a range of intermediate values and is usually influenced by genes and the environment. Body mass is an example. Discontinuous variation has distinct categories with no intermediates, such as round and wrinkled seed shape in Mendel’s peas, and ABO blood groups. The left-to-right continuum is a qualitative memory aid without measured values or frequencies. The seed drawings are simple category symbols. The source option B correctly links continuous variation to genes and the environment and gives pea seed shape as discontinuous.</desc>
