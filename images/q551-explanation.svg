<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Near focus relaxes the ligaments</title><desc id="desc">A near-focus schematic shows a thick curved lens, slack wavy suspensory ligaments, and contracted ciliary muscle at either end. Contracting the ciliary muscle reduces ligament tension, so the elastic lens becomes thicker and refracts light more strongly.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#32745a" stroke-width="1.5"/></marker></defs><rect width="1000" height="620" rx="22" fill="#faf8e9"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="54" font-size="30" text-anchor="start" fill="#183f35" font-weight="bold">Near focus relaxes the ligaments</text><ellipse cx="460" cy="300" rx="60" ry="140" fill="#d8ead5" stroke="#32745a" stroke-width="4"/><path d="M335 155 Q350 185 370 170 Q390 155 405 180 L424 190 M335 445 Q350 415 370 430 Q390 445 405 420 L424 410" stroke="#4f8a65" stroke-width="5" fill="none" /><ellipse cx="310" cy="140" rx="40" ry="32" fill="#4e805e"/><ellipse cx="310" cy="460" rx="40" ry="32" fill="#4e805e"/><text x="55" y="280" font-size="23" text-anchor="start" fill="#183f35" font-weight="normal">Near object</text><text x="55" y="312" font-size="23" text-anchor="start" fill="#183f35" font-weight="normal">→ light</text><path d="M170 300 L390 300" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><text x="620" y="180" font-size="23" text-anchor="start" fill="#183f35" font-weight="normal">Ciliary muscle contracts</text><text x="620" y="212" font-size="23" text-anchor="start" fill="#183f35" font-weight="normal">Ring becomes narrower</text><path d="M610 175 L351 145" stroke="#32745a" stroke-width="2" fill="none" /><text x="620" y="320" font-size="23" text-anchor="start" fill="#183f35" font-weight="normal">Ligaments lose tension</text><text x="620" y="352" font-size="23" text-anchor="start" fill="#183f35" font-weight="normal">Lens becomes thicker</text><path d="M610 315 L390 170" stroke="#32745a" stroke-width="2" fill="none" /><text x="620" y="465" font-size="23" text-anchor="start" fill="#183f35" font-weight="normal">Greater refraction</text><text x="620" y="497" font-size="23" text-anchor="start" fill="#183f35" font-weight="normal">focuses nearby objects</text><text x="500" y="580" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">Muscle contracts → ligament tension falls → lens thickens</text></g></svg>