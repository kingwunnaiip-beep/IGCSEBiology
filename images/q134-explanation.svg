<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1260" viewBox="0 0 1000 1260" role="img" aria-labelledby="q134-title q134-desc">
<title id="q134-title">134 · Risk factors for coronary heart disease</title>
<desc id="q134-desc">Answer C: age, smoking and stress are the listed risk factors, corresponding to statements 1, 3 and 4. Regular physical activity lowers the risk. Coronary arteries supply the heart muscle with oxygenated blood. Fatty deposits can narrow a coronary artery, reducing blood flow and the oxygen supply to heart muscle. A blood clot may block an artery. The artery drawing illustrates narrowing qualitatively, with no measured dimensions or percentage blockage. Risk factors increase the probability of disease; they do not guarantee that disease will occur.</desc>
