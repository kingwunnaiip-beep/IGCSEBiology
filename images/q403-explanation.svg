<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="q403-title q403-desc"><title id="q403-title">A measured range indicates continuous variation</title><desc id="q403-desc">Tomatoes of gradually increasing sizes sit along a continuous measurement scale. Intermediate masses are possible, unlike separate categories such as blood groups. Schematic sizes are not measured graph data.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#245943"/></marker></defs><rect width="1000" height="600" rx="24" fill="#fbf9ee"/><g font-family="Arial, sans-serif"><text x="40" y="55" font-size="27" fill="#173e31" text-anchor="start" font-weight="bold">A measured range indicates continuous variation</text><rect x="35" y="110" width="930" height="370" rx="16" fill="#e5f0df" stroke="#245943" stroke-width="2"/><text x="500" y="152" font-size="27" fill="#173e31" text-anchor="middle" font-weight="bold">Mass is measured along a continuous scale</text><path d="M100 360 L905 360" fill="none" stroke="#245943" stroke-width="4"/><circle cx="160" cy="269" r="16" fill="#a54f48"/><path d="M160 350 L160 370" fill="none" stroke="#245943" stroke-width="4"/><path d="M160 245 l-9 -10 l11 4 l8 -7 l-2 12" fill="#245943"/><circle cx="290" cy="262" r="23" fill="#a54f48"/><path d="M290 350 L290 370" fill="none" stroke="#245943" stroke-width="4"/><path d="M290 231 l-9 -10 l11 4 l8 -7 l-2 12" fill="#245943"/><circle cx="420" cy="255" r="30" fill="#a54f48"/><path d="M420 350 L420 370" fill="none" stroke="#245943" stroke-width="4"/><path d="M420 217 l-9 -10 l11 4 l8 -7 l-2 12" fill="#245943"/><circle cx="550" cy="248" r="37" fill="#a54f48"/><path d="M550 350 L550 370" fill="none" stroke="#245943" stroke-width="4"/><path d="M550 203 l-9 -10 l11 4 l8 -7 l-2 12" fill="#245943"/><circle cx="680" cy="241" r="44" fill="#a54f48"/><path d="M680 350 L680 370" fill="none" stroke="#245943" stroke-width="4"/><path d="M680 189 l-9 -10 l11 4 l8 -7 l-2 12" fill="#245943"/><circle cx="810" cy="234" r="51" fill="#a54f48"/><path d="M810 350 L810 370" fill="none" stroke="#245943" stroke-width="4"/><path d="M810 175 l-9 -10 l11 4 l8 -7 l-2 12" fill="#245943"/><text x="105" y="407" font-size="23" fill="#173e31" text-anchor="start" font-weight="normal">lower mass</text><text x="900" y="407" font-size="23" fill="#173e31" text-anchor="end" font-weight="normal">higher mass</text><text x="500" y="447" font-size="23" fill="#173e31" text-anchor="middle" font-weight="normal">Intermediate masses are possible between any two values.</text><rect x="100" y="515" width="800" height="50" rx="16" fill="#e5f0df" stroke="#245943" stroke-width="2"/><text x="500" y="548" font-size="25" fill="#173e31" text-anchor="middle" font-weight="bold">A range within type 1 → continuous variation</text></g></svg>