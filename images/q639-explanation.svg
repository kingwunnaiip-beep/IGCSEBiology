<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Compare lumen size, wall thickness and direction</title><desc id="desc">Cross-sections compare the large lumen of a pulmonary vein, thick muscular wall of a pulmonary artery, and thin capillary wall. The vein returns blood towards the heart.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="53" font-size="30" text-anchor="start" font-weight="bold" fill="#173f32">Compare lumen size, wall thickness and direction</text><text x="205" y="125" font-size="25" text-anchor="middle" font-weight="bold" fill="#173f32">Pulmonary vein</text><text x="520" y="125" font-size="25" text-anchor="middle" font-weight="bold" fill="#173f32">Pulmonary artery</text><text x="825" y="125" font-size="25" text-anchor="middle" font-weight="bold" fill="#173f32">Capillary</text><circle cx="205" cy="290" r="130" fill="#e5eef5" stroke="#537c9a" stroke-width="3"/><circle cx="205" cy="290" r="107" fill="#fbf8eb" stroke="#537c9a" stroke-width="3"/><circle cx="520" cy="290" r="130" fill="#b15f52" stroke="#b15f52" stroke-width="3"/><circle cx="520" cy="290" r="73" fill="#fbf8eb" stroke="#b15f52" stroke-width="3"/><circle cx="825" cy="290" r="47" fill="#e5eef5" stroke="#537c9a" stroke-width="3"/><circle cx="825" cy="290" r="40" fill="#fbf8eb" stroke="#537c9a" stroke-width="2"/><text x="205" y="455" font-size="25" text-anchor="middle" font-weight="bold" fill="#173f32">Largest lumen</text><text x="520" y="455" font-size="25" text-anchor="middle" font-weight="bold" fill="#173f32">Thickest muscle</text><text x="825" y="390" font-size="24" text-anchor="middle" font-weight="normal" fill="#173f32">Thin wall</text><path d="M115 485 L295 485" fill="none" stroke="#537c9a" stroke-width="4" marker-end="url(#arrow)"/><text x="205" y="518" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">Towards heart</text><path d="M605 485 L425 485" fill="none" stroke="#b15f52" stroke-width="4" marker-end="url(#arrow)"/><text x="520" y="518" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">Away from heart</text><text x="500" y="548" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">D: pulmonary vein • pulmonary artery • pulmonary vein.</text></g></svg>