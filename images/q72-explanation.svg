<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080" role="img" aria-labelledby="q72-title q72-desc">
<title id="q72-title">DNA doubles, then is shared at D</title>
<desc id="q72-desc">A schematic graph of DNA mass per cell rises from A through B to the doubled plateau at C, then drops to the original per-cell level when two daughter cells form at D. No numerical graph times or DNA masses are assigned. A separate teaching model counts illustrative DNA units: one cell with 2 units, one cell with 4 units after S-phase copying, and two daughter cells containing 2 units each after mitosis and cytokinesis. Bars are DNA units, not chromosome counts. The daughters together retain 4 units, the same amount as the replicated parent.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1080" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >DNA doubles, then is shared at D</text><text x="500" y="95" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Read DNA mass per cell, rather than total DNA in both daughters.</text><line x1="100" y1="480" x2="100" y2="178" stroke="#173d31" stroke-width="2.5"/><polygon points="100,178 106.92668763312224,191.30492384168926 93.07331236687776,191.30492384168926" fill="#173d31"/><line x1="100" y1="480" x2="925" y2="480" stroke="#173d31" stroke-width="2.5"/><polygon points="925,480 911.6950761583107,486.92668763312224 911.6950761583107,473.07331236687776" fill="#173d31"/><text x="40" y="333" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" transform="rotate(-90 40 333)">DNA mass per cell</text><text x="510" y="527" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Time / hours (no numerical values supplied)</text><path d="M 100 430 H 240 L 500 270 H 760 V 430 H 900" fill="none" stroke="#25614b" stroke-width="5"/><text x="170" y="406" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Original</text><text x="630" y="250" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Doubled</text><text x="365" y="188" font-size="25" fill="#357ca2" font-weight="400" text-anchor="middle" >S phase: DNA copying</text><circle cx="240" cy="430" r="6" fill="#25614b" stroke="#25614b" stroke-width="1"/><text x="240" y="467" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >A</text><circle cx="370" cy="350" r="6" fill="#25614b" stroke="#25614b" stroke-width="1"/><text x="350" y="326" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >B</text><circle cx="500" cy="270" r="6" fill="#25614b" stroke="#25614b" stroke-width="1"/><text x="488" y="242" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >C</text><circle cx="760" cy="270" r="6" fill="#25614b" stroke="#25614b" stroke-width="1"/><text x="790" y="242" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >D</text><text x="160" y="595" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Before copying</text><text x="470" y="595" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >After S phase</text><text x="815" y="595" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Division at D</text><circle cx="160" cy="700" r="60" fill="#eff5e8" stroke="#25614b" stroke-width="3"/><rect x="136" y="675" width="14" height="50" rx="6" fill="#357ca2" stroke="none" stroke-width="2"/><rect x="170" y="675" width="14" height="50" rx="6" fill="#357ca2" stroke="none" stroke-width="2"/><circle cx="470" cy="700" r="60" fill="#eff5e8" stroke="#25614b" stroke-width="3"/><rect x="427" y="675" width="14" height="50" rx="6" fill="#357ca2" stroke="none" stroke-width="2"/><rect x="451" y="675" width="14" height="50" rx="6" fill="#357ca2" stroke="none" stroke-width="2"/><rect x="475" y="675" width="14" height="50" rx="6" fill="#357ca2" stroke="none" stroke-width="2"/><rect x="499" y="675" width="14" height="50" rx="6" fill="#357ca2" stroke="none" stroke-width="2"/><circle cx="745" cy="700" r="54" fill="#eff5e8" stroke="#25614b" stroke-width="3"/><rect x="721" y="675" width="14" height="50" rx="6" fill="#357ca2" stroke="none" stroke-width="2"/><rect x="755" y="675" width="14" height="50" rx="6" fill="#357ca2" stroke="none" stroke-width="2"/><circle cx="885" cy="700" r="54" fill="#eff5e8" stroke="#25614b" stroke-width="3"/><rect x="861" y="675" width="14" height="50" rx="6" fill="#357ca2" stroke="none" stroke-width="2"/><rect x="895" y="675" width="14" height="50" rx="6" fill="#357ca2" stroke="none" stroke-width="2"/><line x1="240" y1="700" x2="385" y2="700" stroke="#357ca2" stroke-width="4"/><polygon points="385,700 371.6950761583107,706.9266876331222 371.6950761583107,693.0733123668778" fill="#357ca2"/><line x1="550" y1="700" x2="665" y2="700" stroke="#25614b" stroke-width="4"/><polygon points="665,700 651.6950761583107,706.9266876331222 651.6950761583107,693.0733123668778" fill="#25614b"/><text x="160" y="804" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >1 cell: 2 units</text><text x="470" y="804" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >1 cell: 4 units</text><text x="815" y="794" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >2 daughter cells</text><text x="815" y="826" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >2 units in each</text><text x="500" y="880" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Mitosis separates copied DNA; cytokinesis forms two cells.</text><text x="500" y="920" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Total after division: 2 + 2 = 4 units. DNA is conserved.</text><text x="500" y="967" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Bars = illustrative DNA units, not chromosome counts.</text><rect x="24" y="1004" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1038" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >D — Two cells form, each with the original DNA mass</text>
</g></svg>