<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="q35-title q35-desc">
<title id="q35-title">Limiting factors at point P</title>
<desc id="q35-desc">Qualitative graph with the four conditions given in the question. The lowest plateau contains P at 20 degrees Celsius and 0.1 percent CO2. At the same high light intensity, increasing CO2 alone or temperature alone gives a higher rate. Increasing light alone at P gives no increase. The graph has no numerical rate or light-intensity scale.</desc>
