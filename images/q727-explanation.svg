<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Where do enzyme and substrate molecules have the most kinetic energy?</title><desc id="desc">At the highest temperature, D, molecules have the greatest average kinetic energy. High temperature can separately denature enzymes and lower reaction rate; the rate peak is not the kinetic-energy maximum.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700" text-anchor="start" fill="#193e34">Where do enzyme and substrate molecules have the most kinetic energy?</text><rect x="30" y="170" width="300" height="150" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="180" y="220" font-size="25" font-weight="700" text-anchor="middle" fill="#193e34">D: highest</text><text x="180" y="252" font-size="25" font-weight="700" text-anchor="middle" fill="#193e34">temperature</text><rect x="430" y="125" width="620" height="100" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="455" y="163" font-size="22" font-weight="700" text-anchor="start" fill="#193e34">Particles have the greatest average kinetic energy.</text><text x="455" y="198" font-size="22" font-weight="400" text-anchor="start" fill="#193e34">This determines the answer: D.</text><rect x="430" y="260" width="620" height="110" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="455" y="299" font-size="22" font-weight="700" text-anchor="start" fill="#193e34">Enzyme structure may be denatured.</text><text x="455" y="337" font-size="21" font-weight="400" text-anchor="start" fill="#193e34">So reaction rate can fall despite high kinetic energy.</text><path d="M330 245 H375 M375 175 V315" fill="none" stroke="#35735e" stroke-width="3"/><path d="M375 175 H420" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)"/><path d="M375 315 H420" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)"/><text x="38" y="406" font-size="17" font-weight="400" text-anchor="start" fill="#193e34">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>