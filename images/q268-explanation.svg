<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="q268-title q268-desc">
<title id="q268-title">Evaporation starts at moist mesophyll walls</title>
<desc id="q268-desc">Water supplied by xylem evaporates from moist spongy mesophyll cell walls into leaf air spaces. Water vapour then diffuses out through stomata. Guard cells regulate the pores.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
