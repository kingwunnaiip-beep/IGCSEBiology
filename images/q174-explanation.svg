<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" role="img" aria-labelledby="q174-title q174-desc">
<title id="q174-title">174 · Both intestinal regions absorb water</title>
<desc id="q174-desc">Qualitative absorption model. Water is absorbed in both the small intestine and the colon. Amino acids and glucose are absorbed in the small intestine. Maltose is digested to glucose before absorption. The arrows show regions of absorption, not relative quantities or measured rates. Source optionD has water with a tick in both columns.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
