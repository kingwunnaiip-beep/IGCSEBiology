<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which labels identify the components of active immunity?</title><desc id="desc">W: antigens: Detected on pathogens; activate specific lymphocytes; X: antibodies: Bind antigens; help Y phagocytes remove pathogens; Z: memory cells: Made during the response; faster response on re-exposure</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Which labels identify the components of active immunity?</text><text x="38" y="106" font-size="18" font-weight="400">Activated lymphocytes produce antibodies and memory cells.</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="50" y="190" font-size="23" font-weight="700">W: antigens</text><text x="50" y="276" font-size="21" font-weight="400">Detected on pathogens;</text><text x="50" y="303" font-size="21" font-weight="400">activate specific</text><text x="50" y="330" font-size="21" font-weight="400">lymphocytes</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="405" y="190" font-size="23" font-weight="700">X: antibodies</text><text x="405" y="276" font-size="21" font-weight="400">Bind antigens; help Y</text><text x="405" y="303" font-size="21" font-weight="400">phagocytes remove</text><text x="405" y="330" font-size="21" font-weight="400">pathogens</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="760" y="190" font-size="23" font-weight="700">Z: memory cells</text><text x="760" y="276" font-size="21" font-weight="400">Made during the response;</text><text x="760" y="303" font-size="21" font-weight="400">faster response on</text><text x="760" y="330" font-size="21" font-weight="400">re-exposure</text><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>