<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Prevention and treatment act at different stages</title><desc id="desc">Controlled exercise is a preventive lifestyle measure. Angioplasty and stents open narrowed arteries, while bypass surgery routes blood around an existing obstruction.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#24543e"/></marker></defs><rect width="900" height="540" fill="#fbf8ed"/><g font-family="Arial, sans-serif"><text x="450" y="45" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#203e30">Prevention and treatment act at different stages</text><rect x="45" y="95" width="390" height="315" rx="14" fill="#e6efdc" stroke="#24543e" stroke-width="2"/><rect x="465" y="95" width="390" height="315" rx="14" fill="#e6efdc" stroke="#24543e" stroke-width="2"/><text x="240" y="137" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#203e30">Before disease develops</text><text x="660" y="137" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#203e30">Treat an existing narrowing</text><text x="240" y="195" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#203e30">Controlled exercise</text><line x1="240" y1="220" x2="240.0" y2="261.0" stroke="#24543e" stroke-width="3"/><polygon points="240,275 234.0,261.0 246.0,261.0" fill="#24543e"/><text x="240" y="315" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#203e30">Lower risk</text><text x="240" y="360" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#203e30">a preventive behaviour</text><text x="660" y="195" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#203e30">Angioplasty or stent</text><text x="660" y="233" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#203e30">→ widen / hold open artery</text><text x="660" y="295" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#203e30">By-pass surgery</text><text x="660" y="333" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#203e30">→ route around obstruction</text><text x="450" y="470" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#203e30">Coronary arteries supply oxygenated blood to heart muscle.</text><text x="450" y="506" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#203e30">Prevention and treatment can both support cardiovascular health.</text></g></svg>