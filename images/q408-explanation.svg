<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Calculate fibre in a 45 g portion</title><desc id="desc">A bar splits 100 grams into a 45 gram portion and 55 grams remaining. Multiply 2.8 grams of fibre by 45 divided by 100 to obtain 1.26 grams, rounded to 1.3 grams.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#185c44"/></marker></defs><rect width="1000" height="640" rx="24" fill="#faf8ec"/><g font-family="Arial, sans-serif"><text x="40" y="54" font-size="31" text-anchor="start" fill="#193e33" font-weight="bold">Calculate fibre in a 45 g portion</text><text x="75" y="130" font-size="28" text-anchor="start" fill="#193e33" font-weight="bold">Nutrition label: 2.8 g fibre per 100 g cereal</text><rect x="75" y="164" width="850" height="77" rx="8" fill="#edf2e3" stroke="#185c44" stroke-width="3"/><rect x="75" y="164" width="382.5" height="77" rx="8" fill="#79b780" stroke="#185c44" stroke-width="3"/><text x="267" y="213" font-size="27" text-anchor="middle" fill="#193e33" font-weight="normal">45 g portion</text><text x="694" y="213" font-size="27" text-anchor="middle" fill="#193e33" font-weight="normal">55 g remaining</text><text x="75" y="295" font-size="25" text-anchor="start" fill="#193e33" font-weight="normal">The shaded portion is 45/100 of the packet basis.</text><rect x="95" y="345" width="810" height="125" rx="18" fill="#dcefdc" stroke="#185c44" stroke-width="3"/><text x="500" y="400" font-size="34" text-anchor="middle" fill="#193e33" font-weight="bold">2.8 g × 45 / 100 = 1.26 g fibre</text><text x="500" y="445" font-size="29" text-anchor="middle" fill="#193e33" font-weight="normal">Rounded to one decimal place: 1.3 g</text><text x="500" y="538" font-size="27" text-anchor="middle" fill="#193e33" font-weight="normal">Fibre adds bulk and helps prevent constipation.</text><text x="500" y="583" font-size="25" text-anchor="middle" fill="#526a5f" font-weight="normal">Select fibre first; then scale to the portion.</text></g></svg>