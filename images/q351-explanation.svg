<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="q351-title q351-desc">
<title id="q351-title">Meiosis reduces chromosome number</title>
<desc id="q351-desc">A diploid parent cell undergoes two divisions to form four haploid cells with different allele combinations. Statements 1, 3 and 4 describe meiosis; genetically identical cells do not.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="760" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Meiosis reduces chromosome number</text><circle cx="190" cy="177" r="62" fill="#eff5e8" stroke="#25614b" stroke-width="3"/><text x="190" y="187" font-size="38" fill="#173d31" font-weight="700" text-anchor="middle" >2n</text><text x="190" y="286" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Diploid parent</text><line x1="270" y1="178" x2="452" y2="178" stroke="#25614b" stroke-width="4"/><polygon points="452,178 438.6950761583107,184.92668763312224 438.6950761583107,171.07331236687776" fill="#25614b"/><text x="362" y="138" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Meiosis</text><circle cx="540" cy="177" r="46" fill="#dbeaf0" stroke="#357ca2" stroke-width="3"/><text x="540" y="187" font-size="34" fill="#173d31" font-weight="700" text-anchor="middle" >n</text><circle cx="675" cy="177" r="46" fill="#dbeaf0" stroke="#357ca2" stroke-width="3"/><text x="675" y="187" font-size="34" fill="#173d31" font-weight="700" text-anchor="middle" >n</text><circle cx="810" cy="177" r="46" fill="#dbeaf0" stroke="#357ca2" stroke-width="3"/><text x="810" y="187" font-size="34" fill="#173d31" font-weight="700" text-anchor="middle" >n</text><circle cx="945" cy="177" r="46" fill="#dbeaf0" stroke="#357ca2" stroke-width="3"/><text x="945" y="187" font-size="34" fill="#173d31" font-weight="700" text-anchor="middle" >n</text><text x="742" y="286" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Four haploid cells</text><rect x="70" y="329" width="945" height="54" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="95" y="365" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >1</text><text x="153" y="365" font-size="27" fill="#173d31" font-weight="400" text-anchor="start" >Haploid cells are produced</text><text x="970" y="365" font-size="29" fill="#25614b" font-weight="700" text-anchor="middle" >✓</text><rect x="70" y="395" width="945" height="54" rx="12" fill="#f8e7df" stroke="none" stroke-width="2"/><text x="95" y="431" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >2</text><text x="153" y="431" font-size="27" fill="#173d31" font-weight="400" text-anchor="start" >New cells are genetically identical</text><text x="970" y="431" font-size="29" fill="#b94a43" font-weight="700" text-anchor="middle" >✗</text><rect x="70" y="461" width="945" height="54" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="95" y="497" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >3</text><text x="153" y="497" font-size="27" fill="#173d31" font-weight="400" text-anchor="start" >Reduction division</text><text x="970" y="497" font-size="29" fill="#25614b" font-weight="700" text-anchor="middle" >✓</text><rect x="70" y="527" width="945" height="54" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="95" y="563" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >4</text><text x="153" y="563" font-size="27" fill="#173d31" font-weight="400" text-anchor="start" >Results in variation</text><text x="970" y="563" font-size="29" fill="#25614b" font-weight="700" text-anchor="middle" >✓</text><text x="550" y="638" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Different allele combinations produce genetic variation.</text><rect x="24" y="684" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="718" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Meiosis matches statements 1, 3 and 4 → C</text>
</g></svg>