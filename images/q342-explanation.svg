<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="880" viewBox="0 0 1100 880" role="img" aria-labelledby="q342-title q342-desc">
<title id="q342-title">Use the LH surge to identify ovulation</title>
<desc id="q342-desc">Recorded LH concentrations on days 7, 10, 13 and 16 are 10, 12, 120 and 20 arbitrary units. Oestrogen values are 30, 135, 130 and 25. The clear LH peak is on day 13, the published ovulation answer.</desc>
