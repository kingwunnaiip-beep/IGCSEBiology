<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="q05-title q05-desc">
<title id="q05-title">Follow the key to Gryllus</title>
<desc id="q05-desc">The animal has six jointed legs. The antennae are longer than the body. Follow step 1 to step 2, then choose Gryllus, the cricket. The insect drawing is schematic, not a scale drawing.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="800" height="600" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="400.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Follow the key to Gryllus</text><path d="M 170 235 L 113 245 L 88 290" fill="none" stroke="#25614b" stroke-width="5"/><path d="M 210 235 L 267 245 L 292 290" fill="none" stroke="#25614b" stroke-width="5"/><path d="M 170 245 L 105 267 L 80 325" fill="none" stroke="#25614b" stroke-width="5"/><path d="M 210 245 L 275 267 L 300 325" fill="none" stroke="#25614b" stroke-width="5"/><path d="M 170 255 L 97 289 L 72 360" fill="none" stroke="#25614b" stroke-width="5"/><path d="M 210 255 L 283 289 L 308 360" fill="none" stroke="#25614b" stroke-width="5"/><ellipse cx="190" cy="292" rx="34" ry="55" fill="#88b986" stroke="#25614b" stroke-width="3"/><circle cx="190" cy="245" r="26" fill="#88b986" stroke="#25614b" stroke-width="3"/><circle cx="190" cy="210" r="28" fill="#88b986" stroke="#25614b" stroke-width="3"/><path d="M 175 183 Q 90 45 25 95 M 205 183 Q 300 35 350 95" fill="none" stroke="#25614b" stroke-width="3"/><text x="190" y="416" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >3 pairs = 6 legs</text><rect x="385" y="125" width="380" height="105" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="575.0" y="163" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Step 1</text><text x="575.0" y="201" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Six jointed legs → step 2</text><line x1="575" y1="240" x2="575" y2="278" stroke="#25614b" stroke-width="4"/><polygon points="575,278 568.0733123668778,264.6950761583107 581.9266876331222,264.6950761583107" fill="#25614b"/><rect x="385" y="290" width="380" height="130" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="575.0" y="328" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Step 2</text><text x="575.0" y="366" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Antennae longer than body</text><text x="575.0" y="397" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >→ Gryllus</text><text x="400" y="485" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >One choice at each branching point</text><rect x="24" y="524" width="752" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="400.0" y="558" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >A — Gryllus (cricket)</text>
</g></svg>