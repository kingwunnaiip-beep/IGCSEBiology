<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1120" viewBox="0 0 1000 1120" role="img" aria-labelledby="q193-title q193-desc">
<title id="q193-title">193 · Lipase and bile speed up fat digestion</title>
<desc id="q193-desc">Answer A. The qualitative reasoning pathway needs milk as a source of fat, active lipase to form fatty acids and glycerol, and bile to emulsify fat and increase the surface area available to lipase. Tube A contains all three. Tubes B and C contain boiled lipase but no active lipase; tube D has active lipase but no milk. Boiling denatures lipase. No measured times, pH values or enzyme concentrations are invented.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1120" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >193 · Lipase and bile speed up fat digestion</text><text x="500" y="111" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Find the substrate, the active enzyme and the helper.</text><rect x="80" y="160" width="840" height="163" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="200" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Milk supplies fat</text><text x="500.0" y="243" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The substrate is present.</text><line x1="500" y1="331" x2="500" y2="359" stroke="#357ca2" stroke-width="5"/><polygon points="500,359 493.07331236687776,345.6950761583107 506.92668763312224,345.6950761583107" fill="#357ca2"/><rect x="80" y="367" width="840" height="163" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="407" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Bile emulsifies the fat</text><text x="500.0" y="450" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Smaller droplets provide a larger total surface area.</text><line x1="500" y1="538" x2="500" y2="566" stroke="#357ca2" stroke-width="5"/><polygon points="500,566 493.07331236687776,552.6950761583107 506.92668763312224,552.6950761583107" fill="#357ca2"/><rect x="80" y="574" width="840" height="163" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="614" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Active lipase breaks down fat</text><text x="500.0" y="657" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Fat → fatty acids + glycerol</text><text x="500.0" y="692" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Fatty acids lower the pH.</text><rect x="80" y="808" width="400" height="145" rx="12" fill="#f7efdf" stroke="#daa958" stroke-width="2"/><text x="280.0" y="848" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Tubes B and C</text><text x="280.0" y="891" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Boiled lipase is denatured.</text><text x="280.0" y="926" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >No active lipase is supplied.</text><rect x="520" y="808" width="400" height="145" rx="12" fill="#f7efdf" stroke="#daa958" stroke-width="2"/><text x="720.0" y="848" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Tube D</text><text x="720.0" y="891" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >No milk is supplied.</text><text x="720.0" y="926" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >The fat substrate is absent.</text><text x="500" y="1006" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative comparison; the source supplies no measured pH or times.</text><rect x="24" y="1044" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1078" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer A · Milk + bile + active lipase</text>
</g></svg>