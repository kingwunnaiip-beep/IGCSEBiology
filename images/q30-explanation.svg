roke="#9b7944" stroke-width="5"/><line x1="700" y1="240" x2="715" y2="245" stroke="#9b7944" stroke-width="5"/><line x1="605" y1="270" x2="620" y2="275" stroke="#9b7944" stroke-width="5"/><line x1="700" y1="270" x2="715" y2="275" stroke="#9b7944" stroke-width="5"/><line x1="605" y1="300" x2="620" y2="305" stroke="#9b7944" stroke-width="5"/><line x1="700" y1="300" x2="715" y2="305" stroke="#9b7944" stroke-width="5"/><line x1="605" y1="330" x2="620" y2="335" stroke="#9b7944" stroke-width="5"/><line x1="700" y1="330" x2="715" y2="335" stroke="#9b7944" stroke-width="5"/><line x1="660" y1="330" x2="660" y2="230" stroke="#357ca2" stroke-width="4"/><polygon points="660,230 666.9266876331222,243.30492384168926 653.0733123668778,243.30492384168926" fill="#357ca2"/><text x="660" y="386" font-size="25" fill="#b94a43" font-weight="700" text-anchor="middle" >No nucleus</text><text x="400" y="477" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >Living root-hair cells retain a nucleus.</text><rect x="24" y="524" width="752" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="400.0" y="558" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C — No · Yes · No</text>
