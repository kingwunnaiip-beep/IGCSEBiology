<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" role="img" aria-labelledby="q102-title q102-desc">
<title id="q102-title">102 · The biuret test detects protein</title>
<desc id="q102-desc">Answer C: the biuret test needs no heating. Biuret reagent is blue before a positive reaction; a sample containing protein gives a purple or violet colour. The diagram compares a negative sample which remains blue with a positive sample which becomes purple after biuret reagent is added. The drawings illustrate colours only and are not measured results. Benedict’s test is a different test: it detects reducing sugars and requires heating in a water bath.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1060" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >102 · The biuret test detects protein</text><text x="500" y="108" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Add biuret reagent to the food sample.</text><text x="500" y="150" font-size="28" fill="#357ca2" font-weight="700" text-anchor="middle" >No heating is required.</text><rect x="85" y="205" width="370" height="499" rx="12" fill="#edf5f8" stroke="none" stroke-width="2"/><text x="270" y="252" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >No protein detected</text><path d="M 204 302 L 204 550 A 66 66 0 0 0 336 550 L 336 302" fill="#fffdf7" stroke="#173d31" stroke-width="4"/><path d="M 210 429 L 210 550 A 60 60 0 0 0 330 550 L 330 429 Z" fill="#78b9dd" stroke="none" stroke-width="3"/><line x1="196" y1="300" x2="344" y2="300" stroke="#173d31" stroke-width="4"/><text x="270" y="660" font-size="28" fill="#357ca2" font-weight="700" text-anchor="middle" >Remains blue</text><rect x="545" y="205" width="370" height="499" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="730" y="252" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Protein present</text><path d="M 664 302 L 664 550 A 66 66 0 0 0 796 550 L 796 302" fill="#fffdf7" stroke="#173d31" stroke-width="4"/><path d="M 670 429 L 670 550 A 60 60 0 0 0 790 550 L 790 429 Z" fill="#9872b8" stroke="none" stroke-width="3"/><line x1="656" y1="300" x2="804" y2="300" stroke="#173d31" stroke-width="4"/><text x="730" y="660" font-size="28" fill="#765092" font-weight="700" text-anchor="middle" >Purple / violet</text><rect x="70" y="752" width="860" height="156" rx="12" fill="#f4efdf" stroke="none" stroke-width="2"/><text x="500" y="794" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Do not confuse the two food tests</text><text x="500" y="838" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Biuret → protein → blue to purple → no heat</text><text x="500" y="878" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Benedict’s → reducing sugar → heat in a water bath</text><text x="500" y="949" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Colour examples are schematic; they are not experiment photographs.</text><rect x="24" y="984" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1018" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · Biuret · No heating · Blue → purple</text>
</g></svg>