d="M546 202L658 202" fill="none" stroke="#397653" stroke-width="3"/><polygon points="658,202 646.0,197.0 646.0,207.0" fill="#397653"/><text x="514" y="154" font-size="20" text-anchor="start" fill="#173f31" font-weight="normal">Cell 1 membrane</text><path d="M847 305L697 305" fill="none" stroke="#397653" stroke-width="3"/><polygon points="697,305 709.0,310.0 709.0,300.0" fill="#397653"/><text x="727" y="337" font-size="20" text-anchor="start" fill="#173f31" font-weight="normal">Cell 2 membrane</text><text x="704" y="404" font-size="22" text-anchor="middle" fill="#173f31" font-weight="normal">Animal cells have no cell wall.</text><text x="480" y="511" font-size="23" text-anchor="middle" fill="#173f31" font-weight="normal">A single contact line in a drawing can hide two close membranes.</text></g></svg>