<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" role="img" aria-labelledby="title desc"><title id="title">pH control supports microbial enzyme activity</title><desc id="desc">A qualitative enzyme-activity curve peaks at an optimum pH, without a numerical pH scale because different enzymes have different optima. An arrow links suitable pH to a fermenter with a mixing paddle and pH probe. Maintaining suitable pH supports microbial enzymes and production.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#276b46"/></marker></defs><rect width="1000" height="570" rx="20" fill="#fbfaf0"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="53" fill="#203e33" font-size="30" font-weight="bold" text-anchor="start">pH control supports microbial enzyme activity</text><text x="40" y="95" fill="#203e33" font-size="22" font-weight="normal" text-anchor="start">Control the pH appropriate for the organism and process.</text><path d="M95 410 L510 410" fill="none" stroke="#276b46" stroke-width="3"/><path d="M95 410 L95 170" fill="none" stroke="#276b46" stroke-width="3"/><text x="300" y="452" fill="#203e33" font-size="23" font-weight="normal" text-anchor="middle">pH</text><text x="91" y="145" fill="#203e33" font-size="23" font-weight="normal" text-anchor="start">Enzyme activity</text><path d="M110 401 C185 400 204 213 300 196 C396 213 414 400 496 401" fill="none" stroke="#276b46" stroke-width="5"/><path d="M300 196 L300 410" fill="none" stroke="#65776d" stroke-width="2" stroke-dasharray="6 6"/><text x="300" y="180" fill="#203e33" font-size="21" font-weight="bold" text-anchor="middle">optimum</text><rect x="610" y="180" width="260" height="250" rx="30" fill="#e4eedc" stroke="#276b46" stroke-width="2"/><rect x="675" y="150" width="130" height="35" rx="4" fill="#f4edc8" stroke="#276b46" stroke-width="2"/><path d="M740 185 L740 365" fill="none" stroke="#276b46" stroke-width="5"/><path d="M695 350 L785 350" fill="none" stroke="#276b46" stroke-width="7"/><path d="M630 260 Q740 235 850 260 L850 408 Q740 425 630 408 Z" fill="#c7dfbd" stroke="#276b46" stroke-width="2"/><path d="M740 185 L740 365" fill="none" stroke="#276b46" stroke-width="5"/><path d="M695 350 L785 350" fill="none" stroke="#276b46" stroke-width="7"/><path d="M850 230 L901 230" fill="none" stroke="#276b46" stroke-width="2"/><text x="916" y="235" fill="#203e33" font-size="19" font-weight="normal" text-anchor="middle">pH</text><path d="M515 310 L598 310" fill="none" stroke="#276b46" stroke-width="3" marker-end="url(#arrow)"/><text x="740" y="470" fill="#203e33" font-size="24" font-weight="bold" text-anchor="middle">Fermenter</text><text x="40" y="520" fill="#203e33" font-size="23" font-weight="bold" text-anchor="start">Suitable pH → effective enzymes → growth and product formation</text><text x="40" y="548" fill="#65776d" font-size="16" font-weight="normal" text-anchor="start">Original teaching schematic • diagrams are not to scale</text></g></svg>