<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">X is oestrogen; Y is progesterone</title><desc id="desc">Two actual hormone curves run across a 28-day cycle. Oestrogen X has its main peak before day 14. Progesterone Y peaks after ovulation in the second half.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="53" font-size="30" text-anchor="start" font-weight="bold" fill="#173f32">X is oestrogen; Y is progesterone</text><path d="M110 430 L110 125" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M110 430 L915 430" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="120" y="112" font-size="22" text-anchor="start" font-weight="normal" fill="#173f32">Relative hormone concentration</text><line x1="110" y1="430" x2="110" y2="438" stroke="#24644b" stroke-width="3"/><text x="110" y="465" font-size="22" text-anchor="middle" font-weight="normal" fill="#173f32">0</text><line x1="299" y1="430" x2="299" y2="438" stroke="#24644b" stroke-width="3"/><text x="299" y="465" font-size="22" text-anchor="middle" font-weight="normal" fill="#173f32">7</text><line x1="488" y1="430" x2="488" y2="438" stroke="#24644b" stroke-width="3"/><text x="488" y="465" font-size="22" text-anchor="middle" font-weight="normal" fill="#173f32">14</text><line x1="677" y1="430" x2="677" y2="438" stroke="#24644b" stroke-width="3"/><text x="677" y="465" font-size="22" text-anchor="middle" font-weight="normal" fill="#173f32">21</text><line x1="866" y1="430" x2="866" y2="438" stroke="#24644b" stroke-width="3"/><text x="866" y="465" font-size="22" text-anchor="middle" font-weight="normal" fill="#173f32">28</text><line x1="488" y1="145" x2="488" y2="430" stroke="#a4ae9f" stroke-width="2" stroke-dasharray="7 7"/><text x="488" y="135" font-size="21" text-anchor="middle" font-weight="normal" fill="#173f32">Ovulation</text><path d="M110 418 C210 418 270 405 320 300 C350 235 365 155 405 166 C455 180 465 340 510 372 C560 405 620 335 685 343 C740 345 800 380 866 415" fill="none" stroke="#24644b" stroke-width="5" /><path d="M110 422 C280 422 450 425 510 407 C575 385 608 292 650 225 C690 160 720 158 747 222 C780 305 800 370 866 419" fill="none" stroke="#537c9a" stroke-width="5" /><line x1="585" y1="98" x2="625" y2="98" stroke="#24644b" stroke-width="5"/><text x="640" y="106" font-size="22" text-anchor="start" font-weight="normal" fill="#173f32">X: oestrogen</text><line x1="585" y1="132" x2="625" y2="132" stroke="#537c9a" stroke-width="5"/><text x="640" y="140" font-size="22" text-anchor="start" font-weight="normal" fill="#173f32">Y: progesterone</text><text x="510" y="500" font-size="22" text-anchor="middle" font-weight="normal" fill="#173f32">Time / days</text><text x="500" y="548" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">Use peak timing: X before ovulation; Y after ovulation.</text></g></svg>