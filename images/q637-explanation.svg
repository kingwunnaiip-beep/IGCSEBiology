<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Water enters both tubes, so both levels rise</title><desc id="desc">Two sucrose-filled osmometers are immersed in water. Water crosses each partially permeable bag into the lower-water-potential sucrose solutions, and both glass-tube levels rise.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="53" font-size="30" text-anchor="start" font-weight="bold" fill="#173f32">Water enters both tubes, so both levels rise</text><rect x="100" y="218" width="800" height="230" rx="0" fill="#e5eef5" stroke="none" stroke-width="0"/><path d="M100 175 V450 H900 V175" fill="none" stroke="#537c9a" stroke-width="4" /><line x1="100" y1="218" x2="900" y2="218" stroke="#537c9a" stroke-width="2"/><rect x="308" y="125" width="24" height="206" rx="0" fill="white" stroke="#537c9a" stroke-width="3"/><rect x="312" y="155" width="16" height="180" rx="0" fill="#c3c59e" stroke="none" stroke-width="0"/><rect x="265" y="305" width="110" height="110" rx="35" fill="#c3c59e" stroke="#24644b" stroke-width="4"/><line x1="295" y1="225" x2="345" y2="225" stroke="#b15f52" stroke-width="2" stroke-dasharray="6 5"/><path d="M365 220 L365 155" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><circle cx="290" cy="335" r="6" fill="#d49750" stroke="#d49750" stroke-width="0"/><circle cx="320" cy="335" r="6" fill="#d49750" stroke="#d49750" stroke-width="0"/><circle cx="350" cy="335" r="6" fill="#d49750" stroke="#d49750" stroke-width="0"/><circle cx="290" cy="363" r="6" fill="#d49750" stroke="#d49750" stroke-width="0"/><circle cx="320" cy="363" r="6" fill="#d49750" stroke="#d49750" stroke-width="0"/><circle cx="350" cy="363" r="6" fill="#d49750" stroke="#d49750" stroke-width="0"/><circle cx="290" cy="391" r="6" fill="#d49750" stroke="#d49750" stroke-width="0"/><path d="M190 355 L258 355" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 375 L382 375" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><rect x="668" y="125" width="24" height="206" rx="0" fill="white" stroke="#537c9a" stroke-width="3"/><rect x="672" y="175" width="16" height="180" rx="0" fill="#e2d0a6" stroke="none" stroke-width="0"/><rect x="625" y="305" width="110" height="110" rx="35" fill="#e2d0a6" stroke="#24644b" stroke-width="4"/><line x1="655" y1="225" x2="705" y2="225" stroke="#b15f52" stroke-width="2" stroke-dasharray="6 5"/><path d="M725 220 L725 175" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><circle cx="650" cy="335" r="6" fill="#d49750" stroke="#d49750" stroke-width="0"/><circle cx="680" cy="335" r="6" fill="#d49750" stroke="#d49750" stroke-width="0"/><circle cx="710" cy="335" r="6" fill="#d49750" stroke="#d49750" stroke-width="0"/><circle cx="650" cy="363" r="6" fill="#d49750" stroke="#d49750" stroke-width="0"/><path d="M550 355 L618 355" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M810 375 L742 375" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="108" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">Tube 1</text><text x="680" y="108" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">Tube 2</text><text x="320" y="490" font-size="22" text-anchor="middle" font-weight="normal" fill="#173f32">Very concentrated</text><text x="680" y="490" font-size="22" text-anchor="middle" font-weight="normal" fill="#173f32">Concentrated</text><text x="500" y="270" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">Water</text><text x="500" y="548" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">Both sucrose solutions have lower water potential than water.</text><text x="500" y="581" font-size="21" text-anchor="middle" font-weight="normal" fill="#173f32">The dashed marks show the starting levels.</text></g></svg>