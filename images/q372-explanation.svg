<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Nicotine can cross the placental barrier</title><desc id="desc">Nicotine in the mother’s blood can pass across the placental exchange surface into fetal blood and affect the fetus. Transfer across the placenta does not require maternal and fetal blood to mix directly.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L8 3 Z" fill="#245c43"/></marker></defs>
<rect width="1000" height="600" rx="24" fill="#fbf8ec"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="42" y="58" font-size="32" text-anchor="start" fill="#173f31" font-weight="bold">Nicotine can cross the placental barrier</text><rect x="55" y="140" width="300" height="255" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="205" y="185" font-size="27" text-anchor="middle" fill="#173f31" font-weight="normal">Mother’s blood</text><text x="205" y="227" font-size="27" text-anchor="middle" fill="#173f31" font-weight="normal">Nicotine present</text><rect x="645" y="140" width="300" height="255" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="795" y="185" font-size="27" text-anchor="middle" fill="#173f31" font-weight="normal">Fetal blood</text><text x="795" y="227" font-size="27" text-anchor="middle" fill="#173f31" font-weight="normal">Nicotine can enter</text><rect x="425" y="125" width="150" height="285" rx="18" fill="#d8e5cf" stroke="#245c43" stroke-width="3"/><text x="500" y="265" font-size="24" text-anchor="middle" fill="#173f31" font-weight="normal">Placental</text><text x="500" y="299" font-size="24" text-anchor="middle" fill="#173f31" font-weight="normal">exchange</text><text x="500" y="333" font-size="24" text-anchor="middle" fill="#173f31" font-weight="normal">surface</text><path d="M270 337 L720 337" fill="none" stroke="#245c43" stroke-width="4"  marker-end="url(#arr)"/><text x="500" y="462" font-size="26" text-anchor="middle" fill="#173f31" font-weight="bold">Some harmful substances cross this barrier</text><rect x="75" y="510" width="850" height="58" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="500" y="548" font-size="25" text-anchor="middle" fill="#173f31" font-weight="normal">Maternal and fetal blood do not normally mix directly.</text></g></svg>