<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">At 40°C the bubble moves faster towards the seeds</title><desc id="desc">A respirometer contains germinating seeds and soda lime in a sealed chamber. Oxygen uptake and carbon dioxide absorption reduce gas volume; a bubble in the attached capillary moves towards the chamber faster at 40°C than at 20°C.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="53" font-size="30" text-anchor="start" font-weight="bold" fill="#173f32">At 40°C the bubble moves faster towards the seeds</text><rect x="95" y="240" width="460" height="175" rx="38" fill="#e5eef5" stroke="#537c9a" stroke-width="4"/><rect x="540" y="245" width="35" height="165" rx="0" fill="#bdc8b5" stroke="#24644b" stroke-width="3"/><rect x="575" y="302" width="350" height="22" rx="0" fill="white" stroke="#537c9a" stroke-width="3"/><ellipse cx="145" cy="330" rx="17" ry="24" fill="#d8bc8b" stroke="#24644b" stroke-width="2"/><path d="M145 350 q20 20 30 0 t15 20" fill="none" stroke="#24644b" stroke-width="2" /><ellipse cx="185" cy="285" rx="17" ry="24" fill="#d8bc8b" stroke="#24644b" stroke-width="2"/><path d="M185 305 q20 20 30 0 t15 20" fill="none" stroke="#24644b" stroke-width="2" /><ellipse cx="185" cy="365" rx="17" ry="24" fill="#d8bc8b" stroke="#24644b" stroke-width="2"/><path d="M185 385 q20 20 30 0 t15 20" fill="none" stroke="#24644b" stroke-width="2" /><ellipse cx="225" cy="320" rx="17" ry="24" fill="#d8bc8b" stroke="#24644b" stroke-width="2"/><path d="M225 340 q20 20 30 0 t15 20" fill="none" stroke="#24644b" stroke-width="2" /><ellipse cx="260" cy="365" rx="17" ry="24" fill="#d8bc8b" stroke="#24644b" stroke-width="2"/><path d="M260 385 q20 20 30 0 t15 20" fill="none" stroke="#24644b" stroke-width="2" /><circle cx="415" cy="375" r="12" fill="white" stroke="#537c9a" stroke-width="2"/><circle cx="440" cy="360" r="12" fill="white" stroke="#537c9a" stroke-width="2"/><circle cx="465" cy="375" r="12" fill="white" stroke="#537c9a" stroke-width="2"/><circle cx="440" cy="390" r="12" fill="white" stroke="#537c9a" stroke-width="2"/><circle cx="490" cy="390" r="12" fill="white" stroke="#537c9a" stroke-width="2"/><ellipse cx="800" cy="313" rx="13" ry="9" fill="#537c9a" stroke="#537c9a" stroke-width="2"/><path d="M870 270 L655 270" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="755" y="245" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">Towards seeds</text><text x="245" y="162" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">O₂ used</text><path d="M245 175 L215 270" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="240" y="460" font-size="25" text-anchor="middle" font-weight="bold" fill="#173f32">Germinating seeds</text><text x="500" y="460" font-size="25" text-anchor="middle" font-weight="bold" fill="#173f32">Soda lime</text><line x1="490" y1="432" x2="455" y2="395" stroke="#24644b" stroke-width="2"/><text x="500" y="491" font-size="22" text-anchor="middle" font-weight="normal" fill="#173f32">absorbs CO₂</text><text x="850" y="160" font-size="30" text-anchor="middle" font-weight="bold" fill="#173f32">40°C</text><text x="835" y="365" font-size="24" text-anchor="middle" font-weight="normal" fill="#173f32">Bubble</text><line x1="820" y1="345" x2="806" y2="323" stroke="#24644b" stroke-width="2"/><text x="500" y="548" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">Faster respiration → faster O₂ uptake → faster inward bubble movement.</text><text x="500" y="581" font-size="21" text-anchor="middle" font-weight="normal" fill="#173f32">Compare rates after temperature equilibration.</text></g></svg>