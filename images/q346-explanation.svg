<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="q346-title q346-desc">
<title id="q346-title">Trace the red stain with water</title>
<desc id="q346-desc">Red-stained water enters a cut celery stalk and moves up xylem vessels. The comparison distinguishes xylem water transport from phloem sugar transport.</desc>
