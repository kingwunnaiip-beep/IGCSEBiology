<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">Shared structures in guard cells and animal cells</title><desc id="desc">Two schematic cells share a nucleus, cell membrane and cytoplasm. Only the guard cell has a cell wall and chloroplasts. W and X identify the shared nucleus and cell membrane.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#245744"/></marker></defs><rect width="1000" height="540" rx="22" fill="#fbf8ed"/><text x="42" y="49" font-family="Arial, sans-serif" font-size="30" text-anchor="start" fill="#183e32" font-weight="bold">Shared structures in guard cells and animal cells</text><rect x="50" y="90" width="400" height="300" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><rect x="550" y="90" width="400" height="300" rx="18" fill="#e1eddf" stroke="#548c69" stroke-width="2"/><text x="250" y="128" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#183e32" font-weight="bold">Guard cell</text><text x="750" y="128" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#183e32" font-weight="bold">Typical animal cell</text><rect x="118" y="155" width="260" height="190" rx="38" fill="#f0f4db" stroke="#245744" stroke-width="2"/><ellipse cx="750" cy="250" rx="135" ry="95" fill="#dce9dd" stroke="#245744" stroke-width="4"/><rect x="126" y="163" width="244" height="174" rx="32" fill="none" stroke="#548c69" stroke-width="2"/><circle cx="210" cy="240" r="33" fill="#245744"/><circle cx="735" cy="240" r="33" fill="#245744"/><text x="210" y="247" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="white" font-weight="normal">W</text><text x="410" y="250" font-family="Arial, sans-serif" font-size="24" text-anchor="start" fill="#183e32" font-weight="normal">X</text><path d="M398,243 L371,230" fill="none" stroke="#245744" stroke-width="2"/><ellipse cx="155" cy="190" rx="15" ry="8" fill="#548c69"/><ellipse cx="325" cy="191" rx="15" ry="8" fill="#548c69"/><ellipse cx="155" cy="305" rx="15" ry="8" fill="#548c69"/><ellipse cx="326" cy="304" rx="15" ry="8" fill="#548c69"/><text x="250" y="366" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183e32" font-weight="normal">Wall + chloroplasts present</text><text x="750" y="366" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#183e32" font-weight="normal">No wall or chloroplasts</text><rect x="115" y="416" width="770" height="64" rx="18" fill="#cde1cd" stroke="#548c69" stroke-width="2"/><text x="500" y="456" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#183e32" font-weight="bold">Shared: nucleus (W) + cell membrane (X) + cytoplasm</text><text x="42" y="518" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#52675b" font-weight="normal">Original teaching schematic • Biology quiz • not to scale</text></svg>