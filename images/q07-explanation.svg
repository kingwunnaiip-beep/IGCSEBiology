<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="q7-title q7-desc">
<title id="q7-title">Phloem translocation from a leaf to a potato tuber</title><desc id="q7-desc">A leaf labelled X is the source. Glucose is converted to sucrose and transported in phloem to potato tuber Y, the sink, where it can become starch.</desc>
<defs><marker id="q7-25614b" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L16 8 L0 16 Z" fill="#25614b"/></marker><marker id="q7-357ca2" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L16 8 L0 16 Z" fill="#357ca2"/></marker><marker id="q7-b94a43" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L16 8 L0 16 Z" fill="#b94a43"/></marker><marker id="q7-daa958" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L16 8 L0 16 Z" fill="#daa958"/></marker></defs><rect width="640" height="420" rx="20" fill="#fffdf7"/>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="320" y="44" font-size="30" fill="#173d31" text-anchor="middle" font-weight="600">From leaf source to tuber sink</text><path d="M146 252 C162 210 160 163 167 104" fill="none" stroke="#25614b" stroke-width="10"/><path d="M166 151 C112 156 79 122 85 80 C141 76 166 102 166 151Z" fill="#69a86a" stroke="#25614b" stroke-width="3"/><path d="M164 185 C209 190 241 154 236 117 C192 112 164 139 164 185Z" fill="#69a86a" stroke="#25614b" stroke-width="3"/><path d="M92 89 L159 145 M230 126 L169 178" stroke="#25614b" stroke-width="3" fill="none"/><text x="145" y="292" font-size="28" fill="#173d31" text-anchor="middle" font-weight="600">X: leaf source</text><text x="145" y="332" font-size="28" fill="#173d31" text-anchor="middle" font-weight="600">Glucose made</text><path d="M257 178 L414 178" fill="none" stroke="#25614b" stroke-width="5" marker-end="url(#q7-25614b)"/><text x="335" y="127" font-size="30" fill="#173d31" text-anchor="middle" font-weight="600">Sucrose</text><text x="335" y="228" font-size="28" fill="#173d31" text-anchor="middle" font-weight="600">in phloem</text><path d="M483 254 C482 228 487 208 483 184" fill="none" stroke="#25614b" stroke-width="7"/><path d="M483 252 C454 253 443 270 440 289 M483 252 C511 251 532 267 535 290" fill="none" stroke="#9b7944" stroke-width="4"/><ellipse cx="438" cy="286" rx="46" ry="31" fill="#d9bc87" stroke="#9b7944" stroke-width="3"/><ellipse cx="528" cy="284" rx="39" ry="29" fill="#d9bc87" stroke="#9b7944" stroke-width="3"/><circle cx="421" cy="280" r="3" fill="#9b7944"/><circle cx="450" cy="296" r="3" fill="#9b7944"/><circle cx="530" cy="276" r="3" fill="#9b7944"/><text x="492" y="337" font-size="28" fill="#173d31" text-anchor="middle" font-weight="600">Y: tuber sink</text><text x="320" y="391" font-size="28" fill="#173d31" text-anchor="middle" font-weight="600">Sucrose can become stored starch</text></g></svg>