<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710" role="img" aria-labelledby="q319-title q319-desc">
<title id="q319-title">A bulb can change from a source to a sink</title>
<desc id="q319-desc">During stage 1, stored reserves leave the bulb and support new shoot and leaf growth, so the bulb is a source. During stage 2, photosynthesising leaves export assimilates to replenish bulb reserves, so the bulb is a sink.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="710" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >A bulb can change from a source to a sink</text><text x="275" y="122" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Stage 1: early growth</text><text x="825" y="122" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Stage 2: later in the season</text><rect x="70" y="160" width="410" height="115" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="275" y="204" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Growing shoots</text><text x="275" y="244" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >and leaves</text><rect x="70" y="400" width="410" height="115" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="275.0" y="442" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Bulb: SOURCE</text><line x1="275" y1="385" x2="275" y2="290" stroke="#357ca2" stroke-width="7"/><polygon points="275,290 281.92668763312224,303.3049238416893 268.07331236687776,303.3049238416893" fill="#357ca2"/><text x="275" y="556" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Stored reserves exported</text><text x="275" y="596" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >to support new growth</text><rect x="620" y="160" width="410" height="115" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="825" y="204" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Photosynthesising</text><text x="825" y="244" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >leaves</text><rect x="620" y="400" width="410" height="115" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="825.0" y="442" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Bulb: SINK</text><line x1="825" y1="290" x2="825" y2="385" stroke="#357ca2" stroke-width="7"/><polygon points="825,385 818.0733123668778,371.6950761583107 831.9266876331222,371.6950761583107" fill="#357ca2"/><text x="825" y="556" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Assimilates imported</text><text x="825" y="596" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >to replace food reserves</text><text x="550" y="349" font-size="24" fill="#357ca2" font-weight="400" text-anchor="middle" >Net movement</text><rect x="24" y="634" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="668" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C — source in stage 1; sink in stage 2</text>
</g></svg>