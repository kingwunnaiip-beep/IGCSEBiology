<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="q264-title q264-desc">
<title id="q264-title">Two routes remove nitrate ions from soil</title>
<desc id="q264-desc">Plants take up nitrate ions and use nitrogen to make amino acids and proteins. Denitrifying bacteria convert nitrates to nitrogen gas, removing nitrate from soil. Nitrifying bacteria make nitrate from reduced nitrogen compounds. Nitrogen-fixing bacteria use atmospheric nitrogen, rather than removing soil nitrate.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="800" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Two routes remove nitrate ions from soil</text><rect x="350" y="105" width="420" height="120" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="560.0" y="145" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Nitrate ions in soil</text><text x="560.0" y="187" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >NO₃⁻</text><line x1="360" y1="240" x2="260" y2="320" stroke="#25614b" stroke-width="6"/><polygon points="260,320 266.06233257962214,306.279645642548 274.716467500358,317.0973142934679" fill="#25614b"/><line x1="760" y1="240" x2="860" y2="320" stroke="#357ca2" stroke-width="6"/><polygon points="860,320 845.283532499642,317.0973142934679 853.9376674203778,306.279645642548" fill="#357ca2"/><rect x="40" y="335" width="480" height="210" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="280.0" y="375" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Plants</text><text x="280.0" y="417" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Root uptake removes nitrate.</text><text x="280.0" y="450" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Nitrogen is used to make</text><text x="280.0" y="483" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >amino acids and proteins.</text><rect x="600" y="335" width="480" height="210" rx="12" fill="#e7f2f4" stroke="#25614b" stroke-width="2"/><text x="840.0" y="375" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Denitrifying bacteria</text><text x="840.0" y="417" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Denitrification removes nitrate.</text><text x="840.0" y="450" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Nitrogen gas is released</text><text x="840.0" y="483" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >to the atmosphere.</text><text x="560" y="605" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Nitrifying bacteria make nitrate ions during nitrification.</text><text x="560" y="647" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Nitrogen-fixing bacteria take nitrogen from the atmosphere.</text><rect x="24" y="724" width="1072" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="560.0" y="758" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Both denitrifying bacteria and plants remove soil nitrate ions.</text>
</g></svg>