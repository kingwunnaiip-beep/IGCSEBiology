<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="q304-title q304-desc">
<title id="q304-title">A fishing quota limits how many tuna are removed</title>
<desc id="q304-desc">A fishing quota limits permitted catch. Reducing overfishing leaves more tuna alive to reproduce and supports replenishment of wild stocks. Smaller net holes retain more young fish. Genetic modification and selective breeding do not directly limit removal from the wild stock.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1200" height="830" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="600.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >A fishing quota limits how many tuna are removed</text><rect x="260" y="110" width="680" height="125" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="600.0" y="150" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Introduce a quota</text><text x="600.0" y="192" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Limit the permitted catch</text><line x1="600" y1="243" x2="600" y2="272" stroke="#25614b" stroke-width="4"/><polygon points="600,272 593.0733123668778,258.6950761583107 606.9266876331222,258.6950761583107" fill="#25614b"/><rect x="260" y="280" width="680" height="125" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="600.0" y="320" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Reduce overfishing</text><text x="600.0" y="362" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Fewer tuna are removed</text><line x1="600" y1="413" x2="600" y2="442" stroke="#25614b" stroke-width="4"/><polygon points="600,442 593.0733123668778,428.6950761583107 606.9266876331222,428.6950761583107" fill="#25614b"/><rect x="260" y="450" width="680" height="125" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="600.0" y="490" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Retain breeding fish</text><text x="600.0" y="532" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >More can survive to reproduce</text><rect x="70" y="655" width="1060" height="80" rx="12" fill="#f4eedb" stroke="#daa958" stroke-width="2"/><text x="600" y="704" font-size="29" fill="#173d31" font-weight="400" text-anchor="middle" >Smaller net holes would retain more small and young fish.</text><rect x="24" y="754" width="1152" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="600.0" y="788" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C — introducing fishing quotas</text>
</g></svg>