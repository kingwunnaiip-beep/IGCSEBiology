<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Cooling triggers vasoconstriction in skin arterioles</title><desc id="desc">Two skin cutaways place capillaries at the same depth. In the cooler condition the supplying arteriole lumen is narrower, fewer blood cells reach superficial capillaries and smaller heat arrows leave the skin. The vessels do not move deeper.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="1.8"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#b85c50" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="38" y="54" font-size="30" fill="#173f32" font-weight="bold">Cooling triggers vasoconstriction in skin arterioles</text><text x="260" y="129" font-size="27" text-anchor="middle" fill="#173f32" font-weight="bold">Before cooling</text><rect x="69" y="235" width="382" height="249" rx="0" fill="#f0c6b7" stroke="#b85c50" stroke-width="2" /><rect x="69" y="226" width="382" height="28" rx="0" fill="#d1a350" stroke="#b85c50" stroke-width="2" /><path d="M175 473 V337 Q175 282 234 282 H332 Q373 282 373 326 V473" fill="none" stroke="#b85c50" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" /><path d="M175 465 V382" fill="none" stroke="#f0c6b7" stroke-width="23" stroke-linecap="round" stroke-linejoin="round" /><path d="M175 465 V382" fill="none" stroke="#b85c50" stroke-width="41" stroke-linecap="round" stroke-linejoin="round" /><path d="M175 465 V382" fill="none" stroke="#f0c6b7" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="235" cy="282" rx="8" ry="5" fill="#f0c6b7" stroke="#b85c50" stroke-width="1" /><ellipse cx="312" cy="282" rx="8" ry="5" fill="#f0c6b7" stroke="#b85c50" stroke-width="1" /><ellipse cx="175" cy="360" rx="8" ry="5" fill="#f0c6b7" stroke="#b85c50" stroke-width="1" /><line x1="175" y1="220" x2="175" y2="168" stroke="#b85c50" stroke-width="4" stroke-linecap="round" marker-end="url(#red)"/><line x1="260" y1="220" x2="260" y2="168" stroke="#b85c50" stroke-width="4" stroke-linecap="round" marker-end="url(#red)"/><line x1="345" y1="220" x2="345" y2="168" stroke="#b85c50" stroke-width="4" stroke-linecap="round" marker-end="url(#red)"/><text x="260" y="519" font-size="23" text-anchor="middle" fill="#173f32" font-weight="normal">More skin blood flow</text><text x="745" y="129" font-size="27" text-anchor="middle" fill="#173f32" font-weight="bold">Cooler surroundings</text><rect x="554" y="235" width="382" height="249" rx="0" fill="#f0c6b7" stroke="#b85c50" stroke-width="2" /><rect x="554" y="226" width="382" height="28" rx="0" fill="#d1a350" stroke="#b85c50" stroke-width="2" /><path d="M660 473 V337 Q660 282 719 282 H817 Q858 282 858 326 V473" fill="none" stroke="#b85c50" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" /><path d="M660 465 V382" fill="none" stroke="#f0c6b7" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" /><path d="M660 465 V382" fill="none" stroke="#b85c50" stroke-width="47" stroke-linecap="round" stroke-linejoin="round" /><path d="M660 465 V382" fill="none" stroke="#f0c6b7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="720" cy="282" rx="8" ry="5" fill="#f0c6b7" stroke="#b85c50" stroke-width="1" /><line x1="745" y1="220" x2="745" y2="168" stroke="#b85c50" stroke-width="2" stroke-linecap="round" marker-end="url(#red)"/><text x="745" y="519" font-size="23" text-anchor="middle" fill="#173f32" font-weight="normal">Narrower supply arteriole</text><text x="500" y="558" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">C · Vasoconstriction reduces blood flow to the skin and reduces heat loss.</text></g></svg>
