<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Trace each label to the correct digestive organ</title><desc id="desc">A simplified digestive anatomy drawing identifies the oesophagus as J, stomach as M, pancreas as K beneath the stomach and coiled small intestine as L.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">Trace each label to the correct digestive organ</text><path d="M405 140 V250 Q410 290 460 270" fill="none" stroke="#537c9a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M455 225 C475 195 550 210 565 265 C585 330 510 350 468 315 C440 290 450 255 455 225 Z" fill="#e6bcab" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M350 345 V465 H640 V335 Q640 310 610 310 H580" fill="none" stroke="#c5824b" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M350 345 Q335 315 375 315 H425" fill="none" stroke="#c5824b" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M495 465 V510" fill="none" stroke="#c5824b" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M405 360 C570 330 615 370 420 385 C360 390 420 417 570 408 C630 405 610 439 425 442" fill="none" stroke="#24644b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M460 332 Q520 312 582 341 Q535 367 460 348 Z" fill="#e5c87e" stroke="#c5824b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="167" font-size="26" fill="#173f32" text-anchor="start" font-weight="700">J: oesophagus</text><path d="M330 172 L400 205" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="710" y="258" font-size="26" fill="#173f32" text-anchor="start" font-weight="700">M: stomach</text><path d="M688 265 L565 278" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="710" y="346" font-size="26" fill="#173f32" text-anchor="start" font-weight="700">K: pancreas</text><path d="M685 350 L585 344" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="100" y="424" font-size="26" fill="#173f32" text-anchor="start" font-weight="700">L: small intestine</text><path d="M319 419 L405 408" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">A: J oesophagus; K pancreas; L small intestine; M stomach</text></g></svg>