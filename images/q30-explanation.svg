<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="q30-title q30-desc">
<title id="q30-title">Which structure has a nucleus?</title>
<desc id="q30-desc">Of the three structures, only the living root-hair cell has a nucleus. A mature human red blood cell has no nucleus. Mature xylem vessel elements are dead, hollow and have lost their nuclei. The centre of the red blood cell is a depression, not a nucleus.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
