<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="q58-title q58-desc"><title id="q58-title">Adrenaline increases pulse rate and blood glucose</title><desc id="q58-desc">Adrenaline causes the heart to beat faster, increasing pulse rate. It also stimulates liver glycogen breakdown to glucose, which is released into the blood and raises blood glucose concentration. Both changes point upwards; no numerical comparison or shared units are implied.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#537b61"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#b85b4f"/></marker><marker id="ay" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#e4bd55"/></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#668d9c"/></marker></defs><rect width="640" height="420" rx="20" fill="#f3f6ed"/><g font-family="Arial, Helvetica, sans-serif"><text x="320" y="42" fill="#243d32" text-anchor="middle" font-size="32" font-weight="700">Adrenaline raises both</text><rect x="218" y="65" width="204" height="52" rx="26" fill="#dbe6d1" stroke="none" stroke-width="3"/><text x="320" y="101" fill="#243d32" text-anchor="middle" font-size="30" font-weight="700">Adrenaline</text><path d="M288 120 L171 162 M352 120 L476 162" fill="none" stroke="#537b61" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><line x1="177" y1="160" x2="164" y2="170" stroke="#537b61" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><line x1="470" y1="160" x2="484" y2="170" stroke="#537b61" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><path d="M150 281 C116 260 86 228 96 201 C106 177 133 180 150 202 C167 179 194 177 205 201 C219 228 184 262 150 281Z" fill="#b85b4f" stroke="#b85b4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M148 191 V167 H162 V191 M175 190 L186 173" fill="none" stroke="#668d9c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><path d="M64 304 H101 L111 289 L123 322 L139 286 L154 304 H213" fill="none" stroke="#b85b4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><line x1="236" y1="277" x2="236" y2="206" stroke="#537b61" stroke-width="6" stroke-linecap="round" marker-end="url(#a)"/><text x="156" y="367" fill="#243d32" text-anchor="middle" font-size="30" font-weight="700">Pulse rate ↑</text><path d="M389 211 C420 177 516 171 560 190 Q584 207 555 240 Q501 260 462 249 Q421 253 389 232Z" fill="#bd8b66" stroke="#966746" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M473 188 Q457 215 462 249" fill="none" stroke="#966746" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="407" y="276" width="15" height="15" rx="2" fill="#e4bd55" stroke="#cc8d4d" stroke-width="2"/><rect x="431" y="276" width="15" height="15" rx="2" fill="#e4bd55" stroke="#cc8d4d" stroke-width="2"/><rect x="455" y="276" width="15" height="15" rx="2" fill="#e4bd55" stroke="#cc8d4d" stroke-width="2"/><line x1="422" y1="284" x2="431" y2="284" stroke="#cc8d4d" stroke-width="2" stroke-linecap="round" /><line x1="446" y1="284" x2="455" y2="284" stroke="#cc8d4d" stroke-width="2" stroke-linecap="round" /><line x1="482" y1="284" x2="510" y2="284" stroke="#537b61" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><circle cx="534" cy="284" r="8" fill="#e4bd55" stroke="#cc8d4d" stroke-width="2"/><circle cx="563" cy="284" r="8" fill="#e4bd55" stroke="#cc8d4d" stroke-width="2"/><text x="475" y="327" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">Glycogen → glucose</text><text x="475" y="380" fill="#243d32" text-anchor="middle" font-size="30" font-weight="700">Blood glucose ↑</text></g></svg>