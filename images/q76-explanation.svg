<svg xmlns="http://www.w3.org/2000/svg" width="800" height="660" viewBox="0 0 800 660" role="img" aria-labelledby="q76-title q76-desc">
<title id="q76-title">At X, the person is breathing out</title>
<desc id="q76-desc">X is on a falling lung-volume curve. During quiet expiration, the diaphragm and external intercostal muscles relax. The diaphragm returns towards its dome shape, ribs move down and in, thorax volume decreases, lung pressure rises above atmospheric pressure and air leaves. Internal intercostals are not required to contract during normal quiet expiration.</desc>
