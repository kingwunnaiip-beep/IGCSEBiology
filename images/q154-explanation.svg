<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1210" viewBox="0 0 1000 1210" role="img" aria-labelledby="q154-title q154-desc">
<title id="q154-title">154 · Separate breathing rate from breathing depth</title>
<desc id="q154-desc">Answer B. Volume per breath is total air volume per minute divided by breaths per minute. At 0 minutes the source values are 5000 cubic centimetres per minute and 12 breaths per minute, giving about 417 cubic centimetres per breath. At 10 minutes they are 15000 and 12, giving 1250 cubic centimetres per breath. Breathing rate is unchanged but depth triples. From 15 to 20 minutes depth rises slightly from 20000 divided by 18, about 1111, to 25000 divided by 22, about 1136 cubic centimetres per breath. These calculations preserve the units and use the source table; the cards are not a new experiment.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1210" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >154 · Separate breathing rate from breathing depth</text><text x="500" y="111" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >More air per minute can mean deeper breaths.</text><rect x="70" y="160" width="860" height="146" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="200" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Volume per breath = volume per minute ÷ rate</text><text x="500.0" y="243" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >cm³ per breath = (cm³ per minute) ÷ (breaths per minute)</text><rect x="55" y="357" width="425" height="252" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="267.5" y="397" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >At 0 minutes</text><text x="267.5" y="440" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >5000 cm³ per minute</text><text x="267.5" y="476" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >12 breaths per minute</text><text x="267.5" y="512" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >5000 ÷ 12 ≈ 417 cm³ / breath</text><rect x="520" y="357" width="425" height="252" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="732.5" y="397" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >At 10 minutes</text><text x="732.5" y="440" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >15 000 cm³ per minute</text><text x="732.5" y="476" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >12 breaths per minute</text><text x="732.5" y="512" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >15 000 ÷ 12 = 1250 cm³ / breath</text><line x1="268" y1="629" x2="268" y2="675" stroke="#25614b" stroke-width="4"/><line x1="732" y1="629" x2="732" y2="675" stroke="#25614b" stroke-width="4"/><line x1="268" y1="675" x2="732" y2="675" stroke="#25614b" stroke-width="4"/><line x1="500" y1="675" x2="500" y2="718" stroke="#25614b" stroke-width="4"/><polygon points="500,718 493.07331236687776,704.6950761583107 506.92668763312224,704.6950761583107" fill="#25614b"/><rect x="105" y="735" width="790" height="140" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="775" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Same rate · Three times the volume per breath</text><text x="500.0" y="818" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Depth increases between 0 and 10 minutes.</text><rect x="90" y="923" width="820" height="150" rx="12" fill="#f4efdf" stroke="#daa958" stroke-width="2"/><text x="500.0" y="963" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Check option D by dividing, rather than guessing</text><text x="500.0" y="1006" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >At 15 min: 20 000 ÷ 18 ≈ 1111 cm³ / breath</text><text x="500.0" y="1042" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >At 20 min: 25 000 ÷ 22 ≈ 1136 cm³ / breath</text><text x="500" y="1111" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Depth rises slightly here; option D says it decreases.</text><rect x="24" y="1134" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1168" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer B · From 0 to 10 minutes, breathing becomes deeper</text>
