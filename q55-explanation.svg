<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="q55-title q55-desc"><title id="q55-title">Recovery follows the sequence 1 → 3 → 4 → 2 → 5</title><desc id="q55-desc">During vigorous exercise, 1 anaerobic respiration in muscle converts 3 glucose to lactic acid; 4 lactic acid accumulates. After exercise, 2 faster and deeper breathing supplies extra oxygen for lactate processing and recovery, so 5 oxygen debt is repaid.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#537b61"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#b85b4f"/></marker><marker id="ay" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#e4bd55"/></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#668d9c"/></marker></defs><rect width="640" height="420" rx="20" fill="#f3f6ed"/><g font-family="Arial, Helvetica, sans-serif"><text x="320" y="41" fill="#243d32" text-anchor="middle" font-size="30" font-weight="700">Exercise → oxygen debt → recovery</text><circle cx="100" cy="87" r="19" fill="#345c46" stroke="none" stroke-width="3"/><text x="100" y="97" fill="white" text-anchor="middle" font-size="28" font-weight="700">1</text><circle cx="320" cy="87" r="19" fill="#345c46" stroke="none" stroke-width="3"/><text x="320" y="97" fill="white" text-anchor="middle" font-size="28" font-weight="700">3</text><circle cx="540" cy="87" r="19" fill="#345c46" stroke="none" stroke-width="3"/><text x="540" y="97" fill="white" text-anchor="middle" font-size="28" font-weight="700">4</text><line x1="159" y1="134" x2="248" y2="134" stroke="#537b61" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><line x1="389" y1="134" x2="465" y2="134" stroke="#537b61" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><line x1="546" y1="231" x2="546" y2="278" stroke="#537b61" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><line x1="352" y1="307" x2="269" y2="307" stroke="#537b61" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><path d="M60 136 Q75 115 100 119 Q127 115 141 136 Q127 158 100 154 Q74 158 60 136Z" fill="#e5b5a6" stroke="#b85b4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="77" y1="128" x2="125" y2="128" stroke="#b85b4f" stroke-width="2" stroke-linecap="round" /><line x1="77" y1="136" x2="125" y2="136" stroke="#b85b4f" stroke-width="2" stroke-linecap="round" /><line x1="77" y1="144" x2="125" y2="144" stroke="#b85b4f" stroke-width="2" stroke-linecap="round" /><text x="100" y="190" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">Anaerobic</text><text x="100" y="224" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">respiration</text><path d="M281 120 L294 127 V142 L281 150 L268 142 V127Z" fill="#e4bd55" stroke="#cc8d4d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="306" y1="135" x2="336" y2="135" stroke="#537b61" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"/><circle cx="357" cy="135" r="12" fill="#b85b4f" stroke="none" stroke-width="3"/><text x="320" y="190" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">Glucose →</text><text x="320" y="224" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">lactic acid</text><circle cx="520" cy="123" r="9" fill="#b85b4f" stroke="none" stroke-width="3"/><circle cx="549" cy="126" r="9" fill="#b85b4f" stroke="none" stroke-width="3"/><circle cx="536" cy="145" r="9" fill="#b85b4f" stroke="none" stroke-width="3"/><circle cx="565" cy="151" r="9" fill="#b85b4f" stroke="none" stroke-width="3"/><text x="540" y="190" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">Lactic acid</text><text x="540" y="224" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">builds up</text><circle cx="462" cy="284" r="19" fill="#345c46" stroke="none" stroke-width="3"/><text x="462" y="294" fill="white" text-anchor="middle" font-size="28" font-weight="700">2</text><path d="M462 298 V319 M462 308 C451 302 429 306 429 327 Q444 341 456 326 V309 M462 309 C473 301 494 307 494 327 Q481 341 468 326 V310" fill="#e5b5a6" stroke="#668d9c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="462" y="372" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">Faster, deeper</text><text x="462" y="407" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">breathing</text><circle cx="161" cy="284" r="19" fill="#345c46" stroke="none" stroke-width="3"/><text x="161" y="294" fill="white" text-anchor="middle" font-size="28" font-weight="700">5</text><circle cx="161" cy="323" r="24" fill="#b4ceb1" stroke="none" stroke-width="3"/><path d="M148 323 L158 333 L177 312" fill="none" stroke="#345c46" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="161" y="372" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">Oxygen debt</text><text x="161" y="407" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">repaid</text></g></svg>