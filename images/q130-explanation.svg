<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1340" viewBox="0 0 1000 1340" role="img" aria-labelledby="q130-title q130-desc">
<title id="q130-title">130 · Anthers produce pollen containing male gametes</title>
<desc id="q130-desc">Answer B: anther yes, filament no, stigma no. The simplified stamen has an anther supported by a filament. Anthers produce pollen grains containing male gamete nuclei. The stigma receives pollen; it does not produce gametes. In the female part of a flower, the egg gamete is formed inside an ovule in the ovary, which is not one of the three listed structures. Shapes and relative sizes in this original floral schematic are not to scale.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
