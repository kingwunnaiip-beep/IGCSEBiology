<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">A single tree can support many insect consumers</title><desc id="desc">A pyramid of numbers has a very narrow producer base, a broad insect level, and successively narrower bird levels. A tree, insects and bird drawings identify the levels.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">A single tree can support many insect consumers</text><rect x="205" y="385" width="600" height="65" rx="0" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><rect x="355" y="320" width="300" height="65" rx="0" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><rect x="420" y="255" width="170" height="65" rx="0" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><rect x="478" y="450" width="44" height="65" rx="0" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><text x="845" y="295" font-size="22" fill="#173f32" text-anchor="start" font-weight="400">Birds of prey</text><text x="845" y="357" font-size="22" fill="#173f32" text-anchor="start" font-weight="400">Small birds</text><text x="845" y="424" font-size="22" fill="#173f32" text-anchor="start" font-weight="400">Many insects</text><text x="555" y="497" font-size="24" fill="#173f32" text-anchor="start" font-weight="700">One tree</text><g transform="translate(170 515) scale(0.8)"><path d="M-10 0 V-90 H10 V0" fill="#d7ad78" stroke="#c5824b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-35" cy="-110" r="42" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><circle cx="25" cy="-120" r="49" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><circl