<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080" role="img" aria-labelledby="q150-title q150-desc">
<title id="q150-title">150 · Match each yeast product to its use</title>
<desc id="q150-desc">Answer D. Yeast anaerobically respires sugar, producing carbon dioxide and ethanol. A qualitative two-branch flow diagram connects carbon dioxide to bubbles that raise bread dough and ethanol to collection as biofuel. The teaching model does not show measured production rates or product quantities. Ethanol evaporates during bread baking and is not the gas that makes dough rise.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1080" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >150 · Match each yeast product to its use</text><text x="500" y="111" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Anaerobic respiration in yeast</text><rect x="225" y="165" width="550" height="164" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="205" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Sugar is fermented by yeast</text><text x="500.0" y="248" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Ethanol and carbon dioxide are produced.</text><text x="500.0" y="283" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Energy is released.</text><line x1="362" y1="341" x2="267" y2="412" stroke="#357ca2" stroke-width="5"/><polygon points="267,412 273.5107238202341,398.4866556568466 281.80404798016156,409.5833569975946" fill="#357ca2"/><line x1="638" y1="341" x2="732" y2="412" stroke="#25614b" stroke-width="5"/><polygon points="732,412 717.2084242963775,409.5081556621638 725.5580335795428,398.45374337177606" fill="#25614b"/><rect x="55" y="432" width="425" height="134" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="267.5" y="472" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Carbon dioxide</text><text x="267.5" y="515" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >A gas</text><rect x="520" y="432" width="425" height="134" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="732.5" y="472" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Ethanol</text><text x="732.5" y="515" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >A fuel</text><line x1="267" y1="576" x2="267" y2="637" stroke="#357ca2" stroke-width="5"/><polygon points="267,637 260.07331236687776,623.6950761583107 273.92668763312224,623.6950761583107" fill="#357ca2"/><line x1="732" y1="576" x2="732" y2="637" stroke="#25614b" stroke-width="5"/><polygon points="732,637 725.0733123668778,623.6950761583107 738.9266876331222,623.6950761583107" fill="#25614b"/><rect x="55" y="657" width="425" height="192" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="267.5" y="697" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Bread</text><text x="267.5" y="740" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Gas bubbles form in dough</text><text x="267.5" y="775" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >and make it rise.</text><rect x="520" y="657" width="425" height="192" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="732.5" y="697" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Biofuel</text><text x="732.5" y="740" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Ethanol can be collected</text><text x="732.5" y="775" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >and used as fuel.</text><text x="500" y="916" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Check both columns: carbon dioxide → bread; ethanol → biofuel.</text><text x="500" y="965" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative uses; no product quantities or reaction rates are implied.</text><rect x="24" y="1004" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1038" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · Carbon dioxide: bread · Ethanol: biofuel</text>
</g></svg>