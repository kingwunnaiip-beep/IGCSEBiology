<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Prokaryotic cytoplasm contains free DNA and ribosomes</title><desc id="desc">A prokaryotic cell has free looped DNA and ribosomes, without a nucleus or membrane-bound mitochondria and chloroplasts. The comparison shows these distinguishing structures.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#397653"/></marker></defs><rect width="960" height="560" rx="20" fill="#faf8ed"/><g font-family="Arial, sans-serif"><text x="36" y="48" font-size="28" text-anchor="start" fill="#173f31" font-weight="bold">Prokaryotic cytoplasm contains free DNA and ribosomes</text><rect x="38" y="87" width="446" height="384" rx="14" fill="#e0eedc" stroke="#397653" stroke-width="2"/><rect x="512" y="87" width="410" height="384" rx="14" fill="#e0eedc" stroke="#397653" stroke-width="2"/><text x="261" y="126" font-size="24" text-anchor="middle" fill="#173f31" font-weight="bold">Prokaryotic cytoplasm</text><rect x="85" y="159" width="350" height="197" rx="90" fill="#d5e7cf" stroke="#397653" stroke-width="4"/><path d="M196 237 C145 168 315 173 266 240 C225 295 140 214 219 205 C314 189 319 301 221 283 C172 277 294 177 304 255 C313 316 168 294 196 237Z" fill="none" stroke="#765c91" stroke-width="4"/><circle cx="116" cy="217" r="4" fill="#397653" stroke="#397653" stroke-width="1"/><circle cx="140" cy="285" r="4" fill="#397653" stroke="#397653" stroke-width="1"/><circle cx="171" cy="324" r="4" fill="#397653" stroke="#397653" stroke-width="1"/><circle cx="340" cy="205" r="4" fill="#397653" stroke="#397653" stroke-width="1"/><circle cx="380" cy="258" r="4" fill="#397653" stroke="#397653" stroke-width="1"/><circle cx="336" cy="327" r="4" fill="#397653" stroke="#397653" stroke-width="1"/><circle cx="288" cy="326" r="4" fill="#397653" stroke="#397653" stroke-width="1"/><circle cx="109" cy="252" r="4" fill="#397653" stroke="#397653" stroke-width="1"/><text x="262" y="390" font-size="21" text-anchor="middle" fill="#173f31" font-weight="normal">DNA lies free in cytoplasm</text><text x="262" y="427" font-size="21" text-anchor="middle" fill="#173f31" font-weight="normal">Small dots = ribosomes</text><text x="716" y="126" font-size="23" text-anchor="middle" fill="#173f31" font-weight="bold">Membrane-bound organelles</text><ellipse cx="627" cy="229" rx="57" ry="34" fill="#e6dac4" stroke="#8b785b" stroke-width="3"/><path d="M590 227L607 208L619 246L635 211L651 245L665 225" fill="none" stroke="#8b785b" stroke-width="3"/><ellipse cx="807" cy="229" rx="57" ry="34" fill="#c6dfbf" stroke="#397653" stroke-width="3"/><path d="M777 211v36m-7-29h14m-14 11h14m-14 11h14" stroke="#397653" stroke-width="3"/><path d="M800 211v36m-7-29h14m-14 11h14m-14 11h14" stroke="#397653" stroke-width="3"/><path d="M823 211v36m-7-29h14m-14 11h14m-14 11h14" stroke="#397653" stroke-width="3"/><text x="627" y="296" font-size="20" text-anchor="middle" fill="#173f31" font-weight="normal">Mitochondrion</text><text x="807" y="296" font-size="20" text-anchor="middle" fill="#173f31" font-weight="normal">Chloroplast</text><text x="716" y="361" font-size="23" text-anchor="middle" fill="#173f31" font-weight="bold">Absent in prokaryotes</text><text x="716" y="412" font-size="21" text-anchor="middle" fill="#173f31" font-weight="normal">Ribosomes are present.</text><text x="480" y="518" font-size="23" text-anchor="middle" fill="#173f31" font-weight="normal">Use DNA location and organelles together to identify the cell.</text></g></svg>