<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080" role="img" aria-labelledby="q172-title q172-desc">
<title id="q172-title">172 · Auxin has different effects in shoots and roots</title>
<desc id="q172-desc">Qualitative model of gravitropism: in a sideways seedling kept in darkness, auxin accumulates on the lower side of both the shoot and root. In the shoot, higher auxin stimulates cell elongation on the lower side, bending the shoot upwards. In the root, the higher concentration inhibits elongation on the lower side; the upper side elongates more and the root bends downwards. This model is not a redrawing or measurement of the source seedling. AnswerB identifies the lower shoot side.</desc>
