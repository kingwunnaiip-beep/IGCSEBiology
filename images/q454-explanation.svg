<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Build a community from populations</title><desc id="desc">A nested ecosystem diagram includes non-living surroundings and a living community. Inside the community are separate populations of fish, algae and snails. All three illustrative species populations together form the community.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="40" y="54" font-size="31" fill="#173f32" text-anchor="start" font-weight="bold">Build a community from populations</text><rect x="40" y="110" width="920" height="425" rx="18" fill="#eef2e2" stroke="#24644b" stroke-width="3"/><text x="65" y="151" font-size="26" fill="#173f32" text-anchor="start" font-weight="bold">ECOSYSTEM</text><text x="65" y="190" font-size="23" fill="#173f32" text-anchor="start" font-weight="normal">Non-living surroundings: water, light, minerals</text><rect x="84" y="222" width="832" height="255" rx="18" fill="#d7e7d1" stroke="#24644b" stroke-width="3"/><text x="500" y="264" font-size="27" fill="#173f32" text-anchor="middle" font-weight="bold">COMMUNITY: all the populations</text><rect x="115" y="293" width="230" height="146" rx="14" fill="#fdfbf3" stroke="#24644b" stroke-width="3"/><text x="230" y="327" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">Species A: fish</text><ellipse cx="166" cy="380" rx="20" ry="12" fill="#24644b"/><path d="M150,380 L134,366 L134,394 Z" fill="#24644b" stroke="#24644b" stroke-width="2" /><ellipse cx="230" cy="380" rx="20" ry="12" fill="#24644b"/><path d="M214,380 L198,366 L198,394 Z" fill="#24644b" stroke="#24644b" stroke-width="2" /><ellipse cx="294" cy="380" rx="20" ry="12" fill="#24644b"/><path d="M278,380 L262,366 L262,394 Z" fill="#24644b" stroke="#24644b" stroke-width="2" /><rect x="385" y="293" width="230" height="146" rx="14" fill="#fdfbf3" stroke="#24644b" stroke-width="3"/><text x="500" y="327" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">Species B: algae</text><path d="M436,404 C412,380 458,372 436,349 M436,385 L452,367" fill="none" stroke="#24644b" stroke-width="5" /><path d="M500,404 C476,380 522,372 500,349 M500,385 L516,367" fill="none" stroke="#24644b" stroke-width="5" /><path d="M564,404 C540,380 586,372 564,349 M564,385 L580,367" fill="none" stroke="#24644b" stroke-width="5" /><rect x="655" y="293" width="230" height="146" rx="14" fill="#fdfbf3" stroke="#24644b" stroke-width="3"/><text x="770" y="327" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">Species C: snails</text><circle cx="706" cy="378" r="15" fill="#d8b268" stroke="#24644b" stroke-width="3"/><path d="M684,397 L732,397 L736,385" fill="none" stroke="#24644b" stroke-width="4" /><circle cx="770" cy="378" r="15" fill="#d8b268" stroke="#24644b" stroke-width="3"/><path d="M748,397 L796,397 L800,385" fill="none" stroke="#24644b" stroke-width="4" /><circle cx="834" cy="378" r="15" fill="#d8b268" stroke="#24644b" stroke-width="3"/><path d="M812,397 L860,397 L864,385" fill="none" stroke="#24644b" stroke-width="4" /><text x="500" y="572" font-size="24" fill="#173f32" text-anchor="middle" font-weight="normal">A population contains one species; a community combines species.</text></g></svg>