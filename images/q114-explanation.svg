<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250" role="img" aria-labelledby="q114-title q114-desc">
<title id="q114-title">114 · Passive immunity transfers antibodies</title>
<desc id="q114-desc">Answer A: passive immunity is defence against a pathogen by antibodies acquired from another individual. The donor makes antibodies; ready-made antibodies are transferred to the recipient, providing immediate but temporary protection. This transfer does not form memory cells in the recipient. Examples include maternal antibodies transferred across the placenta, antibodies in breast milk, and injected antibody preparations. In active immunity, the recipient responds to an antigen and makes antibodies, with memory cells that can provide longer-term protection. Antibody shapes in the schematic are illustrative.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
