<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Oestrogen rebuilds the uterine lining</title><desc id="desc">Two anatomical frontal sections show the uterus with fallopian tubes, ovaries, a central cavity and the cervix. The first has a thin endometrial lining after menstruation; the second has a thicker lining by day sixteen. These are schematic, not measured thickness data.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">Oestrogen rebuilds the uterine lining</text><path d="M170 225 Q145 315 205 385 L225 470 H295 L315 385 Q375 315 350 225 Q260 165 170 225 Z" fill="#dfb3a5" stroke="#c5824b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M175 230 Q105 185 100 250 M345 230 Q415 185 420 250" fill="none" stroke="#c5824b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="97" cy="265" rx="24" ry="17" fill="#e5cf9d" stroke="#c5824b" stroke-width="3"/><ellipse cx="423" cy="265" rx="24" ry="17" fill="#e5cf9d" stroke="#c5824b" stroke-width="3"/><path d="M200 250 Q260 225 320 250 L278 390 L274 470 H246 L242 390 Z" fill="#fbf8eb" stroke="#b66c68" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M655 225 Q630 315 690 385 L710 470 H780 L800 385 Q860 315 835 225 Q745 165 655 225 Z" fill="#dfb3a5" stroke="#c5824b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M660 230 Q590 185 585 250 M830 230 Q900 185 905 250" fill="none" stroke="#c5824b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="582" cy="265" rx="24" ry="17" fill="#e5cf9d" stroke="#c5824b" stroke-width="3"/><ellipse cx="908" cy="265" rx="24" ry="17" fill="#e5cf9d" stroke="#c5824b" stroke-width="3"/><path d="M685 250 Q745 225 805 250 L763 390 L759 470 H731 L727 390 Z" fill="#b66c68" stroke="#b66c68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M713 270 Q745 253 777 270 L753 390 L753 470 H737 L737 390 Z" fill="#fbf8eb" stroke="#c5824b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="260" y="140" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">After menstruation: thin lining</text><text x="745" y="140" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">By day 16: thicker lining</text><path d="M405 350 H595" fill="none" stroke="#24644b" stroke-width="5" marker-end="url(#arrow)"/><text x="500" y="320" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">Oestrogen</text><text x="500" y="520" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">Oestrogen stimulates repair and growth of the endometrium.</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">C: oestrogen  •  anatomical schematic, not measured thicknesses</text></g></svg>