="395" r="52" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><path d="M875 365.0 Q885 395 875 425.0" fill="none" stroke="#537c9a" stroke-width="9" stroke-linecap="round"/><path d="M908 377.5 Q918 395 908 412.5" fill="none" stroke="#24644b" stroke-width="9" stroke-linecap="round"/><path d="M520 205 H610 V180 H690" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M610 205 V110 H890 V124" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M520 395 H690" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M610 395 V460 H890 V451" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="145" y="457" font-size="23" text-anchor="middle" font-weight="bold" fill="#173f32">Diploid parent: 2n = 4</text><text x="450" y="112" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">Two divisions</text><text x="805" y="490" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">Four haploid cells: n = 2</text><text x="500" y="548" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">2: haploid cells • 3: genetically different • 4: variation</text><text x="500" y="581" font-size="21" text-anchor="middle" font-weight="normal" fill="#173f32">1 is false: chromosome number is halved, not maintained.</text></g></svg>