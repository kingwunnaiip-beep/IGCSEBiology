x="325" cy="344" rx="40" ry="18" fill="#dcebd8" stroke="#276b46" stroke-width="2"/><ellipse cx="440" cy="363" rx="40" ry="18" fill="#dcebd8" stroke="#276b46" stroke-width="2"/><ellipse cx="146" cy="402" rx="40" ry="18" fill="#dcebd8" stroke="#276b46" stroke-width="2"/><ellipse cx="286" cy="405" rx="40" ry="18" fill="#dcebd8" stroke="#276b46" stroke-width="2"/><ellipse cx="406" cy="407" rx="40" ry="18" fill="#dcebd8" stroke="#276b46" stroke-width="2"/><text x="580" y="373" fill="#203e33" font-size="25" font-weight="bold" text-anchor="start">T — spongy mesophyll</text><text x="580" y="403" fill="#203e33" font-size="20" font-weight="normal" text-anchor="start">Air spaces allow gases to</text><text x="580" y="430" fill="#203e33" font-size="20" font-weight="normal" text-anchor="start">diffuse between cells.</text><path d="M530 158 L565 158" fill="none" stroke="#276b46" stroke-width="3"/><path d="M530 263 L565 276" fill="none" stroke="#276b46" stroke-width="3"/><path d="M530 370 L565 370" fill="none" stroke="#276b46" stroke-width="3"/><path d="M265 111 L265 140" fill="none" stroke="#276b46" stroke-width="3" marker-end="url(#arrow)"/><text x="290" y="132" fill="#203e33" font-size="18" font-weight="normal" text-anchor="start">light</text><path d="M537 416 L565 416" fill="none" stroke="#276b46" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="499" fill="#203e33" font-size="23" font-weight="bold" text-anchor="start">Identify layers by leader endpoints, cell shape and air spaces.</text><text x="40" y="548" fill="#65776d" font-size="16" font-weight="normal" text-anchor="start">Original teaching schematic • diagrams are not to scale</text></g></svg>