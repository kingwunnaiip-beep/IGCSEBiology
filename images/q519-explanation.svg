<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">Tooth shape supports a feeding role</title><desc id="d">Simplified incisors have a cutting edge; canines a pointed crown; premolars a smaller cusped crown; molars a broad cusped crown with divided roots for grinding. The source jaw position adds evidence for a molar.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#194f3b"/></marker></defs><rect width="1000" height="600" rx="22" fill="#fffdf2"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="31" text-anchor="start" fill="#213c30" font-weight="bold">Tooth shape supports a feeding role</text><rect x="37" y="117" width="200" height="337" rx="16" fill="#ffffff" stroke="#194f3b" stroke-width="2"/><text x="137" y="162" font-size="26" text-anchor="middle" fill="#213c30" font-weight="bold">Incisor</text><path d="M-38 -43 L38 -43 L30 6 L10 72 L-10 72 L-30 6 Z" transform="translate(137,280)" fill="#f8f5dc" stroke="#194f3b" stroke-width="3"/><text x="137" y="422" font-size="25" text-anchor="middle" fill="#213c30" font-weight="normal">cuts</text><rect x="277" y="117" width="200" height="337" rx="16" fill="#ffffff" stroke="#194f3b" stroke-width="2"/><text x="377" y="162" font-size="26" text-anchor="middle" fill="#213c30" font-weight="bold">Canine</text><path d="M-36 -12 L0 -65 L36 -12 L20 34 L8 82 L-8 82 L-20 34 Z" transform="translate(377,280)" fill="#f8f5dc" stroke="#194f3b" stroke-width="3"/><text x="377" y="422" font-size="25" text-anchor="middle" fill="#213c30" font-weight="normal">tears</text><rect x="517" y="117" width="200" height="337" rx="16" fill="#ffffff" stroke="#194f3b" stroke-width="2"/><text x="617" y="162" font-size="26" text-anchor="middle" fill="#213c30" font-weight="bold">Premolar</text><path d="M-44 -38 Q-28 -67 0 -40 Q28 -67 44 -38 L29 27 L12 75 L-12 75 L-29 27 Z" transform="translate(617,280)" fill="#f8f5dc" stroke="#194f3b" stroke-width="3"/><text x="617" y="422" font-size="25" text-anchor="middle" fill="#213c30" font-weight="normal">crushes</text><rect x="757" y="117" width="200" height="337" rx="16" fill="#d9ead7" stroke="#194f3b" stroke-width="2"/><text x="857" y="162" font-size="26" text-anchor="middle" fill="#213c30" font-weight="bold">Molar</text><path d="M-60 -35 Q-42 -66 -20 -40 Q0 -67 20 -40 Q42 -66 60 -35 L48 24 L30 80 L14 66 L5 17 L-5 17 L-14 66 L-30 80 L-48 24 Z" transform="translate(857,280)" fill="#f8f5dc" stroke="#194f3b" stroke-width="3"/><text x="857" y="422" font-size="25" text-anchor="middle" fill="#213c30" font-weight="normal">grinds</text><text x="500" y="504" font-size="28" text-anchor="middle" fill="#213c30" font-weight="bold">Broad, cusped crowns spread force across food.</text><text x="40" y="566" font-size="21" text-anchor="start" fill="#213c30" font-weight="normal">Schematic tooth shapes; compare the complete original jaw and tooth when answering.</text></g></svg>