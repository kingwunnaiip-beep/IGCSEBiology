<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Adaptive features are inherited and useful</title><desc id="desc">A duck’s drawn webbed foot pushes water to aid swimming. A smaller offspring and DNA indicate inheritance of the structural feature.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">Adaptive features are inherited and useful</text><rect x="50" y="355" width="900" height="130" rx="0" fill="#dcecf1" stroke="none" stroke-width="0"/><g transform="translate(330 315) scale(1.4)"><ellipse cx="0" cy="0" rx="65" ry="38" fill="#d5dabc" stroke="#24644b" stroke-width="3"/><path d="M35 -10 Q25 -80 70 -80 Q110 -75 95 -35 L60 10" fill="#d5dabc" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M92 -65 L135 -55 L95 -45 Z" fill="#c49549" stroke="#24644b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="80" cy="-65" r="4" fill="#173f32" stroke="#173f32" stroke-width="1"/><path d="M-25 30 L-20 65 L-50 80 L-10 78 L15 85 L5 60 L5 35" fill="#dec184" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(700 355) scale(0.7)"><ellipse cx="0" cy="0" rx="65" ry="38" fill="#d5dabc" stroke="#24644b" stroke-width="3"/><path d="M35 -10 Q25 -80 70 -80 Q110 -75 95 -35 L60 10" fill="#d5dabc" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M92 -65 L135 -55 L95 -45 Z" fill="#c49549" stroke="#24644b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="80" cy="-65" r="4" fill="#173f32" stroke="#173f32" stroke-width="1"/><path d="M-25 30 L-20 65 L-50 80 L-10 78 L15 85 L5 60 L5 35" fill="#dec184" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M60 390 Q130 370 200 390 T340 390 T480 390 T620 390 T760 390 T930 390" fill="none" stroke="#537c9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="290" y="135" font-size="27" text-anchor="middle" fill="#173f32" font-weight="bold">Webbed feet push against water</text><path d="M265 395 L150 395" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="150" y="455" font-size="24" text-anchor="middle" fill="#173f32">Swimming</text><path d="M495 275 L615 300" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="700" y="195" font-size="25" text-anchor="middle" fill="#173f32">Offspring inherit the feature</text><path d="M820.0 245 L865.0 245" fill="none" stroke="#537c9a" stroke-width="4"/><path d="M828.6082730907942 255 L856.3917269092058 255" fill="none" stroke="#24644b" stroke-width="4"/><path d="M831.994883236498 265 L853.005116763502 265" fill="none" stroke="#537c9a" stroke-width="4"/><path d="M828.1055581666138 275 L856.8944418333862 275" fill="none" stroke="#24644b" stroke-width="4"/><path d="M819.2995102788691 285 L865.7004897211309 285" fill="none" stroke="#537c9a" stroke-width="4"/><path d="M810.9183700563049 295 L874.0816299436951 295" fill="none" stroke="#24644b" stroke-width="4"/><path d="M808.0460246939699 305 L876.9539753060301 305" fill="none" stroke="#537c9a" stroke-width="4"/><path d="M812.4248003455322 315 L872.5751996544678 315" fill="none" stroke="#24644b" stroke-width="4"/><path d="M821.398590458206 325 L863.601409541794 325" fill="none" stroke="#537c9a" stroke-width="4"/><path d="M820 245 Q860 292.5 820 340" fill="none" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M865 245 Q825 292.5 865 340" fill="none" stroke="#537c9a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="500" y="525" font-size="25" text-anchor="middle" fill="#173f32">An inherited feature can improve survival and reproduction.</text><text x="500" y="565" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">C: statements 1 and 3; variation need not always be continuous.</text></g></svg>