<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-labelledby="q15-title q15-desc"><title id="q15-title">Substrate binding forms the enzyme–substrate complex</title><desc id="q15-desc">Three stages show a substrate above a matching active-site cavity, the substrate fitting exactly into the cavity to form complex X, and separate products leaving the unchanged enzyme.</desc><defs><marker id="a-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#25614b"/></marker><marker id="a-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#357ca2"/></marker><marker id="a-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b94a43"/></marker><marker id="a-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d5a545"/></marker></defs><rect width="640" height="460" rx="20" fill="#fffdf7"/><g font-family="Arial, Helvetica, sans-serif"><text x="320" y="43" font-size="30" fill="#173d31" text-anchor="middle" font-weight="700">X is the enzyme–substrate complex</text><path d="M15 220 Q15 190 45 190 H70 V230 H120 V190 H145 Q175 190 175 220 V265 Q175 301 95 301 Q15 301 15 265 Z" fill="#e8f1e5" stroke="#25614b" stroke-width="4"/><path d="M240 220 Q240 190 270 190 H295 V230 H345 V190 H370 Q400 190 400 220 V265 Q400 301 320 301 Q240 301 240 265 Z" fill="#e8f1e5" stroke="#25614b" stroke-width="4"/><path d="M465 220 Q465 190 495 190 H520 V230 H570 V190 H595 Q625 190 625 220 V265 Q625 301 545 301 Q465 301 465 265 Z" fill="#e8f1e5" stroke="#25614b" stroke-width="4"/><rect x="70" y="110" width="50" height="40" rx="2" fill="#d5a545" stroke="#173d31" stroke-width="3"/><path d="M95 158 L95 181" fill="none" stroke="#25614b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-g)"/><rect x="295" y="190" width="50" height="40" rx="2" fill="#d5a545" stroke="#173d31" stroke-width="3"/><rect x="505" y="110" width="25" height="40" rx="2" fill="#d5a545" stroke="#173d31" stroke-width="3"/><rect x="565" y="110" width="25" height="40" rx="2" fill="#d5a545" stroke="#173d31" stroke-width="3"/><path d="M545 181 L522 158" fill="none" stroke="#25614b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-g)"/><path d="M550 181 L576 158" fill="none" stroke="#25614b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-g)"/><path d="M183 250 L220 250" fill="none" stroke="#25614b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-g)"/><path d="M408 250 L445 250" fill="none" stroke="#25614b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-g)"/><text x="95" y="91" font-size="28" fill="#173d31" text-anchor="middle" font-weight="500">Substrate</text><text x="320" y="151" font-size="34" fill="#173d31" text-anchor="middle" font-weight="700">X</text><text x="545" y="91" font-size="28" fill="#173d31" text-anchor="middle" font-weight="500">Products</text><text x="95" y="348" font-size="28" fill="#173d31" text-anchor="middle" font-weight="500">1. Approach</text><text x="320" y="348" font-size="28" fill="#173d31" text-anchor="middle" font-weight="500">2. Bound</text><text x="545" y="348" font-size="28" fill="#173d31" text-anchor="middle" font-weight="500">3. Release</text><text x="320" y="408" font-size="28" fill="#173d31" text-anchor="middle" font-weight="500">The enzyme remains unchanged</text></g></svg>