<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">The green leaf region turns blue-black with iodine</title><desc id="desc">Two matching variegated leaf outlines compare chlorophyll distribution before testing with the iodine result. The green outside region becomes blue-black, and the white central region remains brown: diagram C.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="53" font-size="30" text-anchor="start" font-weight="bold" fill="#173f32">The green leaf region turns blue-black with iodine</text><text x="260" y="132" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">Before the starch test</text><text x="750" y="132" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">After iodine: C</text><path d="M260 165 C110 225 118 395 260 460 C402 395 410 225 260 165 Z" fill="#8eaf72" stroke="#24644b" stroke-width="4" /><path d="M260 218 C182 257 194 359 260 406 C326 359 338 257 260 218 Z" fill="white" stroke="#24644b" stroke-width="2" /><path d="M260 460 Q250 481 230 485" fill="none" stroke="#24644b" stroke-width="4" /><path d="M750 165 C600 225 608 395 750 460 C892 395 900 225 750 165 Z" fill="#253d48" stroke="#24644b" stroke-width="4" /><path d="M750 218 C672 257 684 359 750 406 C816 359 828 257 750 218 Z" fill="#c59452" stroke="#24644b" stroke-width="2" /><path d="M750 460 Q740 481 720 485" fill="none" stroke="#24644b" stroke-width="4" /><path d="M435 315 L565 315" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="500" y="280" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">Iodine</text><text x="260" y="500" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">Green: chlorophyll</text><text x="750" y="500" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">Blue-black: starch</text><text x="500" y="548" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">Only the originally green region produces starch in this test.</text></g></svg>