e response after a later exposure.</text><text x="500" y="1081" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Simplified airway lining; cell and particle sizes are illustrative.</text><rect x="24" y="1114" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1148" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer B · Goblet cells secrete mucus</text>
