<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1270" viewBox="0 0 1000 1270" role="img" aria-labelledby="q108-title q108-desc">
<title id="q108-title">108 · Deforestation can remove fertile topsoil</title>
<desc id="q108-desc">Answer C: deforestation can lead to loss of soil, so less fertile soil is available for crop growth. In this qualitative schematic, forest canopy intercepts rainfall and roots bind soil. After trees are removed, exposed soil is more easily eroded by rain, surface runoff and wind. Nutrient-rich topsoil is carried away and crop growth can be reduced. Arrows indicate processes, not measured rates. Deforestation also removes habitats and reduces carbon dioxide uptake by photosynthesis; it does not decrease atmospheric carbon dioxide.</desc>
