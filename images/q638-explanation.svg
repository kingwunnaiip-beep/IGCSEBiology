<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Heat changes the enzyme’s active site</title><desc id="desc">A square substrate fits the complementary active site of a normal enzyme. Heating changes the active-site shape, so the same substrate cannot bind successfully.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="53" font-size="30" text-anchor="start" font-weight="bold" fill="#173f32">Heat changes the enzyme’s active site</text><path d="M100 370 C60 275 105 210 230 230 L230 280 L290 280 L290 230 C400 210 430 285 395 375 C335 440 155 445 100 370 Z" fill="#e4f0df" stroke="#24644b" stroke-width="4" /><rect x="230" y="135" width="60" height="60" rx="0" fill="#d49750" stroke="#24644b" stroke-width="3"/><path d="M260 199 L260 265" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="260" y="115" font-size="25" text-anchor="middle" font-weight="bold" fill="#173f32">Substrate</text><path d="M610 380 C560 280 620 205 710 235 L730 285 L765 245 L790 230 C920 225 938 335 890 400 C820 455 655 440 610 380 Z" fill="#e5eef5" stroke="#537c9a" stroke-width="4" /><rect x="730" y="135" width="60" height="60" rx="0" fill="#d49750" stroke="#24644b" stroke-width="3"/><path d="M760 199 L760 238" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><line x1="810" y1="213" x2="842" y2="245" stroke="#b15f52" stroke-width="5"/><line x1="842" y1="213" x2="810" y2="245" stroke="#b15f52" stroke-width="5"/><path d="M465 250 Q480 235 495 250 T525 250" fill="none" stroke="#b15f52" stroke-width="4" /><path d="M465 290 Q480 275 495 290 T525 290" fill="none" stroke="#b15f52" stroke-width="4" /><path d="M465 330 Q480 315 495 330 T525 330" fill="none" stroke="#b15f52" stroke-width="4" /><text x="495" y="210" font-size="25" text-anchor="middle" font-weight="bold" fill="#173f32">Heat</text><text x="250" y="475" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">Complementary site</text><text x="755" y="475" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">Changed active site</text><text x="500" y="548" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">Fewer enzyme–substrate complexes form at 40–55°C.</text><text x="500" y="581" font-size="21" text-anchor="middle" font-weight="normal" fill="#173f32">The enzyme is denatured; it is not used up or killed.</text></g></svg>