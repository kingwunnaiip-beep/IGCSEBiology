<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1070" viewBox="0 0 1000 1070" role="img" aria-labelledby="q147-title q147-desc">
<title id="q147-title">147 · Pollination happens before fertilisation</title>
<desc id="q147-desc">Answer C. A qualitative flower sequence distinguishes pollination from fertilisation. The first schematic shows pollen grains on a stigma and is marked occurred in source. The second schematic shows separate male and egg nuclei with arrows converging to one fused nucleus inside an ovule and is marked not yet occurred in source. This second panel explains the later process and is not a claim that fusion is present in the source diagram. Shapes and sizes are illustrative.</desc>
