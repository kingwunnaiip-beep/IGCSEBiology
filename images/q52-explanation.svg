<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="q52-title q52-desc"><title id="q52-title">Energy flows through the food chain and leaves as heat</title><desc id="q52-desc">Light energy 1 enters producer 2, then passes to primary consumer 4, secondary consumer 6 and tertiary consumer 7. Red arrows show respiration 5 transferring energy as heat. Organic waste from excretion 3 and dead material transfer chemical energy to decomposers 8. Energy does not cycle back.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#537b61"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#b85b4f"/></marker><marker id="ay" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#e4bd55"/></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#668d9c"/></marker></defs><rect width="640" height="420" rx="20" fill="#f3f6ed"/><g font-family="Arial, Helvetica, sans-serif"><text x="320" y="38" fill="#b85b4f" text-anchor="middle" font-size="30" font-weight="700">5 Respiration → heat</text><line x1="145" y1="130" x2="145" y2="65" stroke="#b85b4f" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><line x1="290" y1="130" x2="290" y2="65" stroke="#b85b4f" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><line x1="435" y1="130" x2="435" y2="65" stroke="#b85b4f" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><line x1="570" y1="130" x2="570" y2="65" stroke="#b85b4f" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><circle cx="46" cy="136" r="23" fill="#e4bd55" stroke="none" stroke-width="3"/><line x1="77.0" y1="136.