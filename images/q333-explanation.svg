<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="q333-title q333-desc">
<title id="q333-title">Compare graph heights at pH 5 and pH 8.5</title>
<desc id="q333-desc">The original enzyme graph reaches its maximum near pH 7. A horizontal comparison line meets the curve at pH 5 and pH 8.5, showing equal rates at those two pH values. The rate axis has no numerical units.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="760" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Compare graph heights at pH 5 and pH 8.5</text><line x1="150" y1="510" x2="965" y2="510" stroke="#173d31" stroke-width="3"/><polygon points="965,510 951.6950761583107,516.9266876331222 951.6950761583107,503.07331236687776" fill="#173d31"/><line x1="150" y1="510" x2="150" y2="120" stroke="#173d31" stroke-width="3"/><polygon points="150,120 156.92668763312224,133.30492384168926 143.07331236687776,133.30492384168926" fill="#173d31"/><text x="555" y="585" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >pH</text><text x="95" y="270" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Rate of</text><text x="95" y="308" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >reaction</text><line x1="180" y1="510" x2="180" y2="520" stroke="#173d31" stroke-width="2"/><text x="180" y="550" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >3</text><line x1="300" y1="510" x2="300" y2="520" stroke="#173d31" stroke-width="2"/><text x="300" y="550" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >4</text><line x1="420" y1="510" x2="420" y2="520" stroke="#173d31" stroke-width="2"/><text x="420" y="550" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >5</text><line x1="540" y1="510" x2="540" y2="520" stroke="#173d31" stroke-width="2"/><text x="540" y="550" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >6</text><line x1="660" y1="510" x2="660" y2="520" stroke="#173d31" stroke-width="2"/><text x="660" y="550" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >7</text><line x1="780" y1="510" x2="780" y2="520" stroke="#173d31" stroke-width="2"/><text x="780" y="550" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >8</text><line x1="900" y1="510" x2="900" y2="520" stroke="#173d31" stroke-width="2"/><text x="900" y="550" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >9</text><path d="M 180 480 C 230 440 270 400 300 375 C 350 320 390 270 420 245 C 470 200 510 170 540 160 C 590 135 630 125 660 130 C 710 130 750 145 780 160 C 810 190 825 218 840 245 C 875 285 900 325 900 355" fill="none" stroke="#25614b" stroke-width="5"/><line x1="420" y1="245" x2="840" y2="245" stroke="#b94a43" stroke-width="3" stroke-dasharray="9 7"/><line x1="420" y1="245" x2="420" y2="510" stroke="#b94a43" stroke-width="3" stroke-dasharray="9 7"/><line x1="840" y1="245" x2="840" y2="510" stroke="#b94a43" stroke-width="3" stroke-dasharray="9 7"/><circle cx="420" cy="245" r="7" fill="#b94a43" stroke="#b94a43" stroke-width="3"/><circle cx="840" cy="245" r="7" fill="#b94a43" stroke="#b94a43" stroke-width="3"/><text x="840" y="595" font-size="26" fill="#b94a43" font-weight="700" text-anchor="middle" >8.5</text><text x="635" y="220" font-size="26" fill="#b94a43" font-weight="700" text-anchor="middle" >Same height = same rate</text><text x="550" y="645" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The maximum is near pH 7; no numerical rate scale is given.</text><rect x="24" y="684" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="718" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >D: the rates at pH 5 and pH 8.5 are the same</text>
</g></svg>