<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Near focus: ciliary muscle contracts, lens thickens</title><desc id="desc">A cross-section of the eye shows a thick lens R, contracted ciliary muscle Q and slack curved suspensory ligaments S. Light from a nearby fly is refracted to the retina.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">Near focus: ciliary muscle contracts, lens thickens</text><path d="M220 180 Q500 65 845 280 Q900 450 690 480 Q350 520 220 365 Q160 280 220 180" fill="#edf3f4" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M220 180 Q130 280 220 365" fill="none" stroke="#537c9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="315" cy="280" rx="60" ry="100" fill="#d2e2ea" stroke="#537c9a" stroke-width="4"/><ellipse cx="335" cy="150" rx="45" ry="18" fill="#b28298" stroke="#b28298" stroke-width="3"/><ellipse cx="335" cy="415" rx="45" ry="18" fill="#b28298" stroke="#b28298" stroke-width="3"/><path d="M325 170 Q300 182 320 190 M325 370 Q300 390 330 395" fill="none" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M70 280 L260 220" fill="none" stroke="#c49549" stroke-width="3"/><path d="M260 220 L365 238" fill="none" stroke="#c49549" stroke-width="3"/><path d="M365 238 L812 300" fill="none" stroke="#c49549" stroke-width="3"/><path d="M70 280 L260 340" fill="none" stroke="#c49549" stroke-width="3"/><path d="M260 340 L365 324" fill="none" stroke="#c49549" stroke-width="3"/><path d="M365 324 L812 300" fill="none" stroke="#c49549" stroke-width="3"/><path d="M800 250 Q825 300 800 350" fill="none" stroke="#ac655c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70" cy="280" r="10" fill="#24644b" stroke="#24644b" stroke-width="3"/><path d="M60 280 L30 250 M60 280 L25 310" fill="none" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="415" font-size="23" text-anchor="start" fill="#173f32">Near fly</text><text x="450" y="145" font-size="24" text-anchor="start" fill="#173f32">Q contracts</text><path d="M450 151 L350 155" fill="none" stroke="#537c9a" stroke-width="2"/><text x="470" y="230" font-size="24" text-anchor="start" fill="#173f32">R: thicker lens</text><path d="M470 236 L365 270" fill="none" stroke="#537c9a" stroke-width="2"/><text x="440" y="410" font-size="24" text-anchor="start" fill="#173f32">S: slack ligaments</text><path d="M440 416 L326 382" fill="none" stroke="#537c9a" stroke-width="2"/><text x="760" y="520" font-size="24" text-anchor="middle" fill="#173f32">Image focused on retina</text><text x="500" y="565" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">C: Q contracts · R becomes fatter · S becomes slacker</text></g></svg>