<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" role="img" aria-labelledby="title504 desc504"><title id="title504">Conservation protects habitats and species</title><desc id="desc504">Native forest habitat connects to conservation aims: reducing extinction, maintaining resources and protecting environments. Introducing species into new environments can disrupt existing ecological relationships.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#185744"/></marker></defs><rect width="800" height="530" rx="20" fill="#fbf8ed"/><g font-family="Arial, sans-serif"><text x="400" y="55" font-size="28" text-anchor="middle" fill="#185744" font-weight="bold">Conservation protects habitats and species</text><rect x="50" y="110" width="300" height="290" rx="12" fill="#e1eee2" stroke="#185744" stroke-width="2"/><text x="200" y="150" font-size="24" text-anchor="middle" fill="#185744" font-weight="bold">Protect native habitats</text><path d="M125 185 L95 250 L155 250 Z" stroke="#185744" stroke-width="2" fill="#70a177"/><path d="M125 250 L125 285" stroke="#185744" stroke-width="7" fill="none"/><path d="M200 150 L170 215 L230 215 Z" stroke="#185744" stroke-width="2" fill="#70a177"/><path d="M200 215 L200 250" stroke="#185744" stroke-width="7" fill="none"/><path d="M280 195 L250 260 L310 260 Z" stroke="#185744" stroke-width="2" fill="#70a177"/><path d="M280 260 L280 295" stroke="#185744" stroke-width="7" fill="none"/><text x="200" y="365" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">Preserve biodiversity</text><path d="M350 200 L425 170" stroke="#185744" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="440" y="125" width="300" height="75" rx="12" fill="#e1eee2" stroke="#185744" stroke-width="2"/><text x="590.0" y="170.5" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">Reduce extinction</text><path d="M350 250 L425 265" stroke="#185744" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="440" y="225" width="300" height="75" rx="12" fill="#e1eee2" stroke="#185744" stroke-width="2"/><text x="590.0" y="270.5" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">Maintain resources</text><path d="M350 310 L425 365" stroke="#185744" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="440" y="325" width="300" height="75" rx="12" fill="#e1eee2" stroke="#185744" stroke-width="2"/><text x="590.0" y="370.5" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">Protect environments</text><text x="400" y="470" font-size="21" text-anchor="middle" fill="#185744" font-weight="normal">Introducing species to new environments can disrupt this web.</text></g></svg>