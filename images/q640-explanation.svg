<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Vasodilation increases flow through Y and Z</title><desc id="desc">A dilated feeding arteriole X supplies a surface capillary network Y. The same increased blood supply drains through downstream vessel Z; heat is lost near the skin surface.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="53" font-size="30" text-anchor="start" font-weight="bold" fill="#173f32">Vasodilation increases flow through Y and Z</text><path d="M80 150 Q180 142 280 150 T480 150 T680 150 T920 150" fill="none" stroke="#24644b" stroke-width="3" /><text x="80" y="125" font-size="24" text-anchor="start" font-weight="normal" fill="#173f32">Skin surface</text><path d="M345 350 V220 Q500 160 655 220 V350" fill="none" stroke="#b15f52" stroke-width="10" /><path d="M345 350 V245 Q500 185 655 245 V350" fill="none" stroke="#b15f52" stroke-width="10" /><path d="M345 350 V270 Q500 210 655 270 V350" fill="none" stroke="#b15f52" stroke-width="10" /><path d="M345 350 V295 Q500 235 655 295 V350" fill="none" stroke="#b15f52" stroke-width="10" /><path d="M110 415 H235 Q300 415 345 350" fill="none" stroke="#b15f52" stroke-width="28" /><path d="M655 350 Q700 415 765 415 H900" fill="none" stroke="#537c9a" stroke-width="28" /><path d="M150 415 L275 415" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><path d="M720 415 L850 415" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 203 L550 205" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M420 182 L420 105" fill="none" stroke="#b15f52" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 182 L500 105" fill="none" stroke="#b15f52" stroke-width="3" marker-end="url(#arrow)"/><path d="M580 182 L580 105" fill="none" stroke="#b15f52" stroke-width="3" marker-end="url(#arrow)"/><text x="195" y="485" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">X dilates</text><text x="500" y="382" font-size="25" text-anchor="middle" font-weight="bold" fill="#173f32">Y: capillaries</text><text x="805" y="485" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">Z: outflow</text><text x="660" y="112" font-size="24" text-anchor="start" font-weight="normal" fill="#173f32">Heat loss</text><text x="500" y="548" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">Y increases and Z increases: blood enters and leaves the same path.</text></g></svg>