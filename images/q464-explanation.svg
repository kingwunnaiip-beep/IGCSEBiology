<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="q464-t q464-d"><title id="q464-t">Count trophic levels from the producer</title><desc id="q464-d">Grass is producer and trophic level1, mouse primary consumer and level2, owl secondary consumer and level3. Arrows transfer food energy along the chain.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#1d513d"/></marker></defs><rect width="1000" height="620" rx="24" fill="#fffdf3"/><g font-family="Arial, sans-serif"><text x="45" y="58" font-size="30" text-anchor="start" fill="#173e32" font-weight="bold">Count trophic levels from the producer</text><rect x="50" y="130" width="260" height="340" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="180" y="180" font-size="29" text-anchor="middle" fill="#173e32" font-weight="bold">GRASS</text><circle cx="180" cy="270" r="52" fill="#e6c776" stroke="#1d513d" stroke-width="2"/><text x="180" y="285" font-size="44" text-anchor="middle" fill="#173e32" font-weight="bold">1</text><text x="180" y="362" font-size="25" text-anchor="middle" fill="#173e32" font-weight="normal">Trophic level 1</text><text x="180" y="420" font-size="22" text-anchor="middle" fill="#173e32" font-weight="normal">Producer</text><rect x="370" y="130" width="260" height="340" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="500" y="180" font-size="29" text-anchor="middle" fill="#173e32" font-weight="bold">MOUSE</text><circle cx="500" cy="270" r="52" fill="#e6c776" stroke="#1d513d" stroke-width="2"/><text x="500" y="285" font-size="44" text-anchor="middle" fill="#173e32" font-weight="bold">2</text><text x="500" y="362" font-size="25" text-anchor="middle" fill="#173e32" font-weight="normal">Trophic level 2</text><text x="500" y="420" font-size="22" text-anchor="middle" fill="#173e32" font-weight="normal">Primary consumer</text><rect x="690" y="130" width="260" height="340" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="820" y="180" font-size="29" text-anchor="middle" fill="#173e32" font-weight="bold">OWL</text><circle cx="820" cy="270" r="52" fill="#e6c776" stroke="#1d513d" stroke-width="2"/><text x="820" y="285" font-size="44" text-anchor="middle" fill="#173e32" font-weight="bold">3</text><text x="820" y="362" font-size="25" text-anchor="middle" fill="#173e32" font-weight="normal">Trophic level 3</text><text x="820" y="420" font-size="22" text-anchor="middle" fill="#173e32" font-weight="normal">Secondary consumer</text><path d="M320 270 L360 270" stroke="#1d513d" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M640 270 L680 270" stroke="#1d513d" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="500" y="535" font-size="25" text-anchor="middle" fill="#173e32" font-weight="normal">Producer counts as level 1, but is not a consumer.</text><text x="45" y="589" font-size="18" text-anchor="start" fill="#546d5e" font-weight="normal">Original teaching schematic • qualitative unless values are stated</text></g></svg>