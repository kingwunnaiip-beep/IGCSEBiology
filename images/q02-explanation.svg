<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="q02-title q02-desc">
<title id="q02-title">Both words identify the species</title>
<desc id="q02-desc">The reference species is Prunella vulgaris. Prunella modularis has a different species epithet; Vespula vulgaris has a different genus. Neither candidate is the same species as the reference. Under the exam species concept, neither can produce fertile offspring with it.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="800" height="600" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="400.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Both words identify the species</text><rect x="135" y="95" width="530" height="110" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="400" y="139" font-size="34" fill="#173d31" font-weight="700" text-anchor="middle" font-style="italic">Prunella vulgaris</text><text x="400" y="179" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >genus + species epithet</text><line x1="400" y1="215" x2="202" y2="258" stroke="#25614b" stroke-width="3"/><polygon points="202,258 213.5318350009712,248.40746219656262 216.47186393633137,261.945269852407" fill="#25614b"/><rect x="30" y="270" width="345" height="163" rx="12" fill="#f9eee8" stroke="#b94a43" stroke-width="2"/><text x="202" y="315" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" font-style="italic">Prunella modularis</text><text x="202" y="359" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Different species epithet</text><text x="202" y="403" font-size="25" fill="#b94a43" font-weight="400" text-anchor="middle" >Not the same species</text><line x1="400" y1="215" x2="597" y2="258" stroke="#25614b" stroke-width="3"/><polygon points="597,258 582.5239916742692,261.93003599899197 585.4782675531485,248.39533022831242" fill="#25614b"/><rect x="425" y="270" width="345" height="163" rx="12" fill="#f9eee8" stroke="#b94a43" stroke-width="2"/><text x="597" y="315" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" font-style="italic">Vespula vulgaris</text><text x="597" y="359" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Different genus</text><text x="597" y="403" font-size="25" fill="#b94a43" font-weight="400" text-anchor="middle" >Not the same species</text><text x="400" y="480" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Fertile offspring: neither candidate</text><rect x="24" y="524" width="752" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="400.0" y="558" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >D — No, no</text>
