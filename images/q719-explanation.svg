<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Lignified xylem gives the root structural support</title><desc id="desc">The root has central star-shaped xylem. A magnified xylem vessel has a thick lignified wall around an open lumen.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">Lignified xylem gives the root structural support</text><circle cx="355" cy="310" r="175" fill="#e4f0df" stroke="#24644b" stroke-width="4"/><circle cx="355" cy="310" r="151" fill="#f4f6e8" stroke="#24644b" stroke-width="2"/><path d="M355 165 L383 275 L500 310 L383 339 L355 455 L327 339 L210 310 L327 275 Z" fill="#c2dbe3" stroke="#537c9a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="290" cy="240" r="23" fill="#d9c7a5" stroke="#c5824b" stroke-width="3"/><circle cx="420" cy="240" r="23" fill="#d9c7a5" stroke="#c5824b" stroke-width="3"/><circle cx="290" cy="380" r="23" fill="#d9c7a5" stroke="#c5824b" stroke-width="3"/><circle cx="420" cy="380" r="23" fill="#d9c7a5" stroke="#c5824b" stroke-width="3"/><text x="355" y="120" font-size="28" fill="#173f32" text-anchor="middle" font-weight="700">Root cross-section</text><text x="355" y="510" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">Q: central xylem</text><path d="M445 309 H620" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><circle cx="770" cy="310" r="90" fill="#b99867" stroke="#c5824b" stroke-width="3"/><circle cx="770" cy="310" r="57" fill="#fbf8eb" stroke="#c5824b" stroke-width="3"/><text x="770" y="447" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">Lignified wall</text><text x="770" y="485" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">resists collapse</text><text x="770" y="147" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">Xylem vessel</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">B: structural support</text></g></svg>