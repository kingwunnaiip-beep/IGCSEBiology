<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Xylem supplies water for photosynthesis</title><desc id="desc">A rooted plant absorbs soil water. Blue arrows run from roots up the stem xylem and into the leaf, where water is used in photosynthesis.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">Xylem supplies water for photosynthesis</text><g transform="translate(340 420) scale(1.4)"><path d="M0 0 V-195" fill="none" stroke="#24644b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(0 -65) scale(0.8)"><path d="M0 0 Q-65 -20 -5 -105 Q55 -45 0 0" fill="#e4f0df" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 0 L-5 -95 M-3 -30 L-27 -53 M-4 -53 L19 -75" fill="none" stroke="#24644b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(0 -100) scale(-.8 .8)"><g transform="translate(0 0) scale(1)"><path d="M0 0 Q-65 -20 -5 -105 Q55 -45 0 0" fill="#e4f0df" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 0 L-5 -95 M-3 -30 L-27 -53 M-4 -53 L19 -75" fill="none" stroke="#24644b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M0 0 L-45 75 M0 0 L25 80 M-20 30 L-65 55 M10 30 L55 65" fill="none" stroke="#c5824b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M80 430 H580" fill="none" stroke="#c5824b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="87" y="465" font-size="23" fill="#173f32" text-anchor="start" font-weight="400">Soil</text><path d="M270 480 L325 425 V260" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M355 330 Q470 310 425 225" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(180 460) scale(0.8)"><circle cx="0" cy="0" r="13" fill="#cfe5ec" stroke="#537c9a" stroke-width="3"/><circle cx="-15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/><circle cx="15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/></g><g transform="translate(250 480) scale(0.8)"><circle cx="0" cy="0" r="13" fill="#cfe5ec" stroke="#537c9a" stroke-width="3"/><circle cx="-15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/><circle cx="15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/></g><g transform="translate(400 480) scale(0.8)"><circle cx="0" cy="0" r="13" fill="#cfe5ec" stroke="#537c9a" stroke-width="3"/><circle cx="-15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/><circle cx="15" cy="15" r="8" fill="white" stroke="#537c9a" stroke-width="2"/></g><text x="625" y="190" font-size="25" fill="#173f32" text-anchor="start" font-weight="400">Xylem in a vascular bundle</text><text x="625" y="221" font-size="25" fill="#173f32" text-anchor="start" font-weight="400">carries water upwards.</text><path d="M610 225 L370 315" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="625" y="330" font-size="25" fill="#173f32" text-anchor="start" font-weight="700">Leaf photosynthesis:</text><text x="625" y="375" font-size="24" fill="#173f32" text-anchor="start" font-weight="400">carbon dioxide + water</text><text x="625" y="406" font-size="24" fill="#173f32" text-anchor="start" font-weight="400">→ glucose + oxygen</text><text x="340" y="145" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">Leaf receives water</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">D: vascular bundles transport water to the leaf</text></g></svg>