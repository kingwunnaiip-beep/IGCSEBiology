<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="t387 d387"><title id="t387">Protein sequence determines shape</title><desc id="d387">Different amino-acid sequences fold differently. Each enzyme then has a different active site and binds different substrates.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#286346"/></marker></defs><rect width="960" height="440" rx="24" fill="#f7f5e9"/><style>text{font-family:Arial,sans-serif;fill:#183b2b;font-size:22px}.title{font-size:29px;font-weight:700}.small{font-size:19px}.strong{font-weight:700}.box{fill:#e0eddc;stroke:#60876b;stroke-width:2}.arrow{fill:none;stroke:#286346;stroke-width:4;marker-end:url(#arrow)}</style><text class="title" x="38" y="50">Protein sequence determines shape</text><rect class="box" x="40" y="96" width="260" height="235" rx="14"/><text class="strong" x="65" y="137">1  Sequence</text><g fill="#83ac75"><circle cx="88" cy="202" r="19"/><circle cx="137" cy="202" r="19"/><circle cx="186" cy="202" r="19"/><circle cx="235" cy="202" r="19"/></g><text class="small" x="77" y="209">A</text><text class="small" x="126" y="209">B</text><text class="small" x="175" y="209">C</text><text class="small" x="224" y="209">D</text><text class="small" x="64" y="286">Order of amino acids</text><path class="arrow" d="M312 209 H355"/><rect class="box" x="369" y="96" width="222" height="235" rx="14"/><text class="strong" x="392" y="137">2  Folding</text><path d="M408 215 C404 162 535 156 538 204 S435 262 444 211 S518 184 520 258" fill="none" stroke="#51845a" stroke-width="13"/><text class="small" x="393" y="286">Three-dimensional</text><text class="small" x="393" y="313">protein structure</text><path class="arrow" d="M605 209 H649"/><rect class="box" x="663" y="96" width="257" height="235" rx="14"/><text class="strong" x="687" y="137">3  Active site</text><path d="M700 254 V201 H756 L781 228 L806 201 H886 V281 H700 Z" fill="#83ac75" stroke="#286346" stroke-width="3"/><path d="M758 165 H805 L781 192 Z" fill="#deb66f" stroke="#936d30" stroke-width="2"/><text class="small" x="687" y="313">Complementary fit</text><text x="121" y="397">Different sequence → different folding → different active-site shape</text></svg>