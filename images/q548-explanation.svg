<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Peak activity and zero activity are different readings</title><desc id="desc">An enzyme activity curve rises to a maximum at50 degrees Celsius and falls to zero at60. Vertical guides distinguish the maximum at50 from the zero intercept at60. Activity at zero degrees remains low but above zero.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#32745a" stroke-width="1.5"/></marker></defs><rect width="1000" height="620" rx="22" fill="#faf8e9"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="54" font-size="30" text-anchor="start" fill="#183f35" font-weight="bold">Peak activity and zero activity are different readings</text><path d="M120 470 L900 470" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><path d="M120 470 L120 110" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><path d="M120 455 C300 445 490 160 650 160 C710 160 735 300 756 470" stroke="#32745a" stroke-width="5" fill="none" /><path d="M650 160 V470" stroke="#84a18a" stroke-width="2" fill="none" stroke-dasharray="8 8"/><path d="M756 470 V510" stroke="#84a18a" stroke-width="2" fill="none" /><text x="120.0" y="505" font-size="20" text-anchor="middle" fill="#183f35" font-weight="normal">0</text><text x="226.0" y="505" font-size="20" text-anchor="middle" fill="#183f35" font-weight="normal">10</text><text x="332.0" y="505" font-size="20" text-anchor="middle" fill="#183f35" font-weight="normal">20</text><text x="438.0" y="505" font-size="20" text-anchor="middle" fill="#183f35" font-weight="normal">30</text><text x="544.0" y="505" font-size="20" text-anchor="middle" fill="#183f35" font-weight="normal">40</text><text x="650.0" y="505" font-size="20" text-anchor="middle" fill="#183f35" font-weight="normal">50</text><text x="756.0" y="505" font-size="20" text-anchor="middle" fill="#183f35" font-weight="normal">60</text><text x="830" y="505" font-size="23" text-anchor="start" fill="#183f35" font-weight="normal">°C</text><text x="500" y="555" font-size="25" text-anchor="middle" fill="#183f35" font-weight="normal">Temperature</text><text x="40" y="290" font-size="24" text-anchor="middle" transform="rotate(-90 40 290)">Activity</text><rect x="310" y="80" width="300" height="78" rx="18" fill="#e4f0dc" stroke="#32745a" stroke-width="2"/><text x="460.0" y="116" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">Highest point: 50 °C</text><path d="M610 121 L645 158" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><rect x="730" y="325" width="225" height="104" rx="18" fill="#e4f0dc" stroke="#32745a" stroke-width="2"/><text x="842.5" y="361" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">Zero activity</text><text x="842.5" y="393" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">at 60 °C</text><path d="M790 430 L760 466" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/></g></svg>