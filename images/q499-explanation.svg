<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" role="img" aria-labelledby="title499 desc499"><title id="title499">From amino nitrogen to urea</title><desc id="desc499">Excess amino acids split into a carbon skeleton and removed amino nitrogen. Liver processing produces ammonia and converts this into urea, which the kidneys excrete. Production and excretion are shown as separate stages.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#185744"/></marker></defs><rect width="800" height="530" rx="20" fill="#fbf8ed"/><g font-family="Arial, sans-serif"><text x="400" y="55" font-size="28" text-anchor="middle" fill="#185744" font-weight="bold">From amino nitrogen to urea</text><rect x="40" y="110" width="240" height="75" rx="12" fill="#e1eee2" stroke="#185744" stroke-width="2"/><text x="160.0" y="155.5" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">Excess amino acid</text><path d="M280 147 L365 147" stroke="#185744" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="390" y="110" width="360" height="75" rx="12" fill="#e1eee2" stroke="#185744" stroke-width="2"/><text x="570.0" y="155.5" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">Carbon skeleton remains</text><path d="M160 185 L160 250" stroke="#185744" stroke-width="3" fill="none"/><path d="M160 220 L160 270" stroke="#185744" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="55" y="275" width="210" height="65" rx="12" fill="#e1eee2" stroke="#185744" stroke-width="2"/><text x="160.0" y="315.5" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">Amino nitrogen</text><path d="M265 307 L335 307" stroke="#185744" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="345" y="275" width="170" height="65" rx="12" fill="#e1eee2" stroke="#185744" stroke-width="2"/><text x="430.0" y="315.5" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">Ammonia</text><path d="M515 307 L565 307" stroke="#185744" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="575" y="275" width="170" height="65" rx="12" fill="#e1eee2" stroke="#185744" stroke-width="2"/><text x="660.0" y="315.5" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">Urea</text><rect x="320" y="240" width="440" height="130" rx="12" fill="none" stroke="#397a61" stroke-width="2"/><text x="540" y="220" font-size="24" text-anchor="middle" fill="#185744" font-weight="bold">Liver processing</text><path d="M660 340 L660 400" stroke="#185744" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="500" y="410" width="250" height="55" rx="12" fill="#e1eee2" stroke="#185744" stroke-width="2"/><text x="625.0" y="445.5" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">Kidneys excrete urea</text><text x="220" y="430" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">Deamination removes</text><text x="220" y="463" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">the amino group.</text></g></svg>