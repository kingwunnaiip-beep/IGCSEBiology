<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Why is bacterial insulin regarded as a better ethical choice than animal-extracted insulin?</title><desc id="desc">Compare two production methods: pancreas extraction uses animal tissue, whereas genetically modified bacteria make human insulin without animal extraction. Avoiding animal extraction is the ethical reason for vegetarian acceptance.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e" /></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8" /><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Why is bacterial insulin regarded as a better ethical choice</text><text x="38" y="73" font-size="24" font-weight="700">than animal-extracted insulin?</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="50" y="207" font-size="23" font-weight="700">Animal pancreas</text><text x="50" y="236" font-size="23" font-weight="700">extraction</text><text x="50" y="285" font-size="21" font-weight="400">Uses animal tissues</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="405" y="207" font-size="23" font-weight="700">GM bacteria make human</text><text x="405" y="236" font-size="23" font-weight="700">insulin</text><text x="405" y="285" font-size="21" font-weight="400">No animal extraction</text><text x="405" y="312" font-size="21" font-weight="400">needed</text><path d="M700 245 H731" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)" /><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="760" y="207" font-size="23" font-weight="700">Ethical preference</text><text x="760" y="285" font-size="21" font-weight="400">Accepted by vegetarians</text><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>
