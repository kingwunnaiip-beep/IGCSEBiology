<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img" aria-labelledby="q253-title q253-desc">
<title id="q253-title">D shows water moving from cell to cell by osmosis</title>
<desc id="q253-desc">Qualitative example of water moving between adjacent leaf cells. Net movement is from higher to lower water potential across partially permeable cell membranes. The cell wall is freely permeable. The example explains source arrow D rather than reproducing the whole leaf anatomy; no measured water potentials are supplied. Water vapour leaving a stoma is diffusion, not osmosis.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
