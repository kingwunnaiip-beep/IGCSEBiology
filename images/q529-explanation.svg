<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="q529-title q529-desc"><title id="q529-title">A barrier tests the route taken by auxin</title><desc id="q529-desc">Two shoot diagrams have light from the right and their shaded side on the left. Auxin travels down the shaded side in the open shoot. A glass barrier on the shaded side blocks this route, preventing unequal elongation and phototropic bending. Drawings simplify the original experiment.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#36785e"/></marker></defs><rect x="0" y="0" width="900" height="500" rx="22" fill="#fbf7e9"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="46" font-size="27" text-anchor="start" fill="#183e35"><tspan x="35" dy="0">A barrier tests the route taken by auxin</tspan></text><text x="225" y="99" font-size="24" text-anchor="middle" fill="#183e35"><tspan x="225" dy="0">Shaded route open</tspan></text><text x="675" y="99" font-size="24" text-anchor="middle" fill="#183e35"><tspan x="675" dy="0">Shaded route blocked</tspan></text><path d="M140 350 L140 188 Q175 127 210 188 L210 350 Z" stroke="#36785e" stroke-width="3" fill="#deebca" stroke-linejoin="round" stroke-linecap="round"/><path d="M140 220 L210 220" stroke="#36785e" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M140 254 L210 254" stroke="#36785e" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M140 288 L210 288" stroke="#36785e" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M140 322 L210 322" stroke="#36785e" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M285 170 L230 170" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="285" y="149" font-size="21" text-anchor="middle" fill="#183e35"><tspan x="285" dy="0">light</tspan></text><path d="M590 350 L590 188 Q625 127 660 188 L660 350 Z" stroke="#36785e" stroke-width="3" fill="#deebca" stroke-linejoin="round" stroke-linecap="round"/><path d="M590 220 L660 220" stroke="#36785e" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M590 254 L660 254" stroke="#36785e" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M590 288 L660 288" stroke="#36785e" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M590 322 L660 322" stroke="#36785e" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M735 170 L680 170" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="735" y="149" font-size="21" text-anchor="middle" fill="#183e35"><tspan x="735" dy="0">light</tspan></text><circle cx="151" cy="197" r="4" fill="#cc9e4b" stroke="#36785e" stroke-width="2"/><circle cx="151" cy="220" r="4" fill="#cc9e4b" stroke="#36785e" stroke-width="2"/><circle cx="151" cy="243" r="4" fill="#cc9e4b" stroke="#36785e" stroke-width="2"/><circle cx="151" cy="266" r="4" fill="#cc9e4b" stroke="#36785e" stroke-width="2"/><circle cx="151" cy="289" r="4" fill="#cc9e4b" stroke="#36785e" stroke-width="2"/><circle cx="151" cy="312" r="4" fill="#cc9e4b" stroke="#36785e" stroke-width="2"/><path d="M157 205 L157 321" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="66" y="240" font-size="19" text-anchor="middle" fill="#183e35"><tspan x="66" dy="0">auxin</tspan><tspan x="66" dy="29">down</tspan></text><circle cx="602" cy="195" r="4" fill="#cc9e4b" stroke="#36785e" stroke-width="2"/><circle cx="602" cy="212" r="4" fill="#cc9e4b" stroke="#36785e" stroke-width="2"/><path d="M576 234 L627 234" stroke="#447fa0" stroke-width="9" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="681" y="260" font-size="21" text-anchor="start" fill="#183e35"><tspan x="681" dy="0">glass blocks</tspan><tspan x="681" dy="29">the route</tspan></text><path d="M675 281 L622 239" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="225" y="398" font-size="21" text-anchor="middle" fill="#183e35"><tspan x="225" dy="0">More shaded-side elongation</tspan><tspan x="225" dy="29">→ shoot curves towards light</tspan></text><text x="675" y="398" font-size="21" text-anchor="middle" fill="#183e35"><tspan x="675" dy="0">Shaded-side elongation reduced</tspan><tspan x="675" dy="29">→ no curvature</tspan></text><text x="450" y="477" font-size="23" text-anchor="middle" fill="#183e35"><tspan x="450" dy="0">In shoots, auxin promotes cell elongation.</tspan></text></g></svg>