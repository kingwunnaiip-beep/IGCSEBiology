<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="q54-title q54-desc"><title id="q54-title">Light treatment determines the auxin carried by agar blocks</title><desc id="q54-desc">Stage 1: light comes from the right of the original shoot tip, so shaded left block X receives more auxin than right block Y. Stage 2: each block is transferred to the left side of a cut shoot. X makes the left side elongate faster and the shoot bends right; Y remains straight.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#537b61"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#b85b4f"/></marker><marker id="ay" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#e4bd55"/></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#668d9c"/></marker></defs><rect width="640" height="420" rx="20" fill="#f3f6ed"/><g font-family="Arial, Helvetica, sans-serif"><text x="165" y="42" fill="#243d32" text-anchor="middle" font-size="30" font-weight="700">1. Light treatment</text><text x="480" y="42" fill="#243d32" text-anchor="middle" font-size="30" font-weight="700">2. Transfer blocks</text><line x1="323" y1="64" x2="323" y2="396" stroke="#b4ceb1" stroke-width="2" stroke-linecap="round" /><path d="M111 231 C111 185 119 130 139 122 C159 130 168 185 168 231Z" fill="#b4ceb1" stroke="#345c46" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="90" y="231" width="50" height="43" rx="1" fill="#d5b882" stroke="#243d32" stroke-width="2"/><rect x="140" y="231" width="50" height="43" rx="1" fill="#ead9b2" stroke="#243d32" stroke-width="2"/><text x="115" y="263" fill="#243d32" text-anchor="middle" font-size="28" font-weight="700">X</text><text x="165" y="263" fill="#243d32" text-anchor="middle" font-size="28" font-weight="700">Y</text><circle cx="123" cy="166" r="4" fill="#345c46" stroke="none" stroke-width="3"/><circle cx="120" cy="187" r="4" fill="#345c46" stroke="none" stroke-width="3"/><circle cx="124" cy="210" r="4" fill="#345c46" stroke="none" stroke-width="3"/><circle cx="100" cy="242" r="4" fill="#345c46" stroke="none" stroke-width="3"/><circle cx="131" cy="242" r="4" fill="#345c46" stroke="none" stroke-width="3"/><circle cx="155" cy="209" r="4" fill="#345c46" stroke="none" stroke-width="3"/><line x1="291" y1="169" x2="194" y2="169" stroke="#e4bd55" stroke-width="5" stroke-linecap="round" marker-end="url(#ay)"/><text x="246" y="130" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">Light</text><text x="150" y="317" fill="#243d32" text-anchor="middle" font-size="28" font-weight="700">X: more auxin</text><text x="150" y="357" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">Shaded left side</text><path d="M368 300 C366 260 379 216 407 190 L424 205 C399 228 392 265 393 300Z" fill="#b4ceb1" stroke="#345c46" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(413 197) rotate(28)"><rect x="-43" y="-36" width="46" height="36" rx="1" fill="#d5b882" stroke="#243d32" stroke-width="2"/><text x="-20" y="-8" fill="#243d32" text-anchor="middle" font-size="28" font-weight="700">X</text></g><path d="M360 288 C355 248 368 214 390 193" fill="none" stroke="#cc8d4d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ay)"/><text x="403" y="97" fill="#243d32" text-anchor="middle" font-size="30" font-weight="700">X</text><text x="403" y="343" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">Bends</text><text x="403" y="377" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">right</text><rect x="545" y="195" width="25" height="105" rx="1" fill="#b4ceb1" stroke="#345c46" stroke-width="3"/><rect x="519" y="159" width="45" height="36" rx="1" fill="#ead9b2" stroke="#243d32" stroke-width="2"/><text x="541" y="187" fill="#243d32" text-anchor="middle" font-size="28" font-weight="700">Y</text><text x="556" y="97" fill="#243d32" text-anchor="middle" font-size="30" font-weight="700">Y</text><text x="556" y="343" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">Stays</text><text x="556" y="377" fill="#243d32" text-anchor="middle" font-size="28" font-weight="500">straight</text></g></svg>