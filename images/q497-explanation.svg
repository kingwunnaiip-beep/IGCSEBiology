<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" role="img" aria-labelledby="title497 desc497"><title id="title497">Follow the circulatory flow</title><desc id="desc497">Body tissues return blood via the vena cava, represented by Q, to the heart. Blood leaves towards the lungs via the pulmonary artery, represented by P. A return arrow shows the pulmonary vein back to the heart.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#185744"/></marker></defs><rect width="800" height="530" rx="20" fill="#fbf8ed"/><g font-family="Arial, sans-serif"><text x="400" y="55" font-size="28" text-anchor="middle" fill="#185744" font-weight="bold">Follow the circulatory flow</text><rect x="50" y="140" width="200" height="90" rx="12" fill="#e1eee2" stroke="#185744" stroke-width="2"/><text x="150.0" y="193.0" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">Body tissues</text><rect x="300" y="140" width="190" height="90" rx="12" fill="#e1eee2" stroke="#185744" stroke-width="2"/><text x="395.0" y="193.0" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">Heart</text><rect x="550" y="140" width="200" height="90" rx="12" fill="#e1eee2" stroke="#185744" stroke-width="2"/><text x="650.0" y="193.0" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">Lungs</text><path d="M250 185 L300 185" stroke="#185744" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M490 185 L550 185" stroke="#185744" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="275" y="115" font-size="26" text-anchor="middle" fill="#185744" font-weight="bold">Q</text><text x="275" y="272" font-size="21" text-anchor="middle" fill="#185744" font-weight="normal">vena cava</text><text x="520" y="115" font-size="26" text-anchor="middle" fill="#185744" font-weight="bold">P</text><text x="540" y="272" font-size="21" text-anchor="middle" fill="#185744" font-weight="normal">pulmonary artery</text><path d="M650 230 L650 330 L395 330 L395 230" stroke="#397a61" stroke-width="3" fill="none"/><path d="M395 300 L395 232" stroke="#397a61" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="640" y="365" font-size="20" text-anchor="end" fill="#185744" font-weight="normal">pulmonary vein</text><text x="400" y="420" font-size="24" text-anchor="middle" fill="#185744" font-weight="normal">P leaves the pump towards oxygenation.</text><text x="400" y="460" font-size="24" text-anchor="middle" fill="#185744" font-weight="normal">Q returns water from the pond to the pump.</text></g></svg>