<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1300" viewBox="0 0 1000 1300" role="img" aria-labelledby="q157-title q157-desc">
<title id="q157-title">157 · Heating kills the bacteria that make nitrate</title>
<desc id="q157-desc">Answer C. The experimental sequence is heat one of two soil samples to 100 degrees Celsius, remove nitrate ions from both, add ammonium ions to both, and test after two weeks. Nitrate ions are present in the unheated sample and absent from the heated sample. Living nitrifying bacteria normally convert ammonium to nitrite and then nitrate. Heating kills them. Nitrogen fixation starts with nitrogen gas, while denitrification removes nitrate by forming nitrogen gas. The pathway sketch is qualitative; no amounts or conversion rates are invented.</desc>
