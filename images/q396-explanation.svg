<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="q396-title q396-desc"><title id="q396-title">Different diseases have different causes</title><desc id="q396-desc">Four disease-to-cause links distinguish AIDS caused by HIV, a virus, from protein deficiency and two bacterial diseases.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#245943"/></marker></defs><rect width="1000" height="600" rx="24" fill="#fbf9ee"/><g font-family="Arial, sans-serif"><text x="40" y="55" font-size="27" fill="#173e31" text-anchor="start" font-weight="bold">Different diseases have different causes</text><text x="500" y="103" font-size="25" fill="#173e31" text-anchor="middle" font-weight="normal">Classify the cause before choosing the disease</text><rect x="50" y="145" width="315" height="75" rx="16" fill="#e5f0df" stroke="#245943" stroke-width="2"/><text x="207" y="192" font-size="26" fill="#173e31" text-anchor="middle" font-weight="bold">AIDS</text><path d="M380 182 L435 182" fill="none" stroke="#245943" stroke-width="4" marker-end="url(#arrow)"/><rect x="450" y="145" width="500" height="75" rx="16" fill="#ffffff" stroke="#245943" stroke-width="2"/><text x="700" y="192" font-size="24" fill="#173e31" text-anchor="middle" font-weight="normal">HIV: a virus</text><rect x="50" y="245" width="315" height="75" rx="16" fill="#f2efdf" stroke="#c68f32" stroke-width="2"/><text x="207" y="292" font-size="26" fill="#173e31" text-anchor="middle" font-weight="bold">Kwashiorkor</text><path d="M380 282 L435 282" fill="none" stroke="#245943" stroke-width="4" marker-end="url(#arrow)"/><rect x="450" y="245" width="500" height="75" rx="16" fill="#ffffff" stroke="#c68f32" stroke-width="2"/><text x="700" y="292" font-size="24" fill="#173e31" text-anchor="middle" font-weight="normal">Severe protein deficiency</text><rect x="50" y="345" width="315" height="75" rx="16" fill="#f2efdf" stroke="#5c95ad" stroke-width="2"/><text x="207" y="392" font-size="26" fill="#173e31" text-anchor="middle" font-weight="bold">Cholera</text><path d="M380 382 L435 382" fill="none" stroke="#245943" stroke-width="4" marker-end="url(#arrow)"/><rect x="450" y="345" width="500" height="75" rx="16" fill="#ffffff" stroke="#5c95ad" stroke-width="2"/><text x="700" y="392" font-size="24" fill="#173e31" text-anchor="middle" font-weight="normal">Vibrio cholerae: a bacterium</text><rect x="50" y="445" width="315" height="75" rx="16" fill="#f2efdf" stroke="#5c95ad" stroke-width="2"/><text x="207" y="492" font-size="26" fill="#173e31" text-anchor="middle" font-weight="bold">MRSA infection</text><path d="M380 482 L435 482" fill="none" stroke="#245943" stroke-width="4" marker-end="url(#arrow)"/><rect x="450" y="445" width="500" height="75" rx="16" fill="#ffffff" stroke="#5c95ad" stroke-width="2"/><text x="700" y="492" font-size="24" fill="#173e31" text-anchor="middle" font-weight="normal">Resistant Staphylococcus bacteria</text></g></svg>