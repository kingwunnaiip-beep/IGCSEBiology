<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="q289-title q289-desc">
<title id="q289-title">Amino acids move by translocation in phloem</title>
<desc id="q289-desc">A source supplies amino acids to phloem. Translocation carries dissolved amino acids through living phloem tissue to a sink where they are used for growth or stored. A separate comparison states that xylem carries water and mineral ions in the transpiration stream.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="700" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Amino acids move by translocation in phloem</text><rect x="40" y="150" width="285" height="180" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="182.5" y="190" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >Source</text><text x="182.5" y="232" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Amino acids supplied</text><text x="182.5" y="267" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >to the phloem</text><text x="182.5" y="302" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >(e.g. a mature leaf)</text><rect x="408" y="150" width="285" height="180" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="550.5" y="190" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >Phloem tissue</text><text x="550.5" y="232" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Dissolved amino acids</text><text x="550.5" y="267" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >and sucrose move by</text><text x="550.5" y="302" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >TRANSLOCATION</text><rect x="775" y="150" width="285" height="180" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="917.5" y="190" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >Sink</text><text x="917.5" y="232" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Amino acids used</text><text x="917.5" y="267" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >to make proteins</text><text x="917.5" y="302" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >(e.g. a growing bud)</text><line x1="335" y1="245" x2="397" y2="245" stroke="#357ca2" stroke-width="4"/><polygon points="397,245 383.6950761583107,251.92668763312224 383.6950761583107,238.07331236687776" fill="#357ca2"/><line x1="703" y1="245" x2="765" y2="245" stroke="#357ca2" stroke-width="4"/><polygon points="765,245 751.6950761583107,251.92668763312224 751.6950761583107,238.07331236687776" fill="#357ca2"/><rect x="140" y="420" width="820" height="135" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="550.0" y="460" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >Keep the transport pathways distinct</text><text x="550.0" y="502" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Phloem: translocation of sucrose and amino acids.</text><text x="550.0" y="537" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Xylem: water and mineral ions in the transpiration stream.</text><rect x="24" y="624" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="658" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C: by translocation through phloem tissues.</text>
</g></svg>