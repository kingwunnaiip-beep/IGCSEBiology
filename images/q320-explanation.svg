<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="q320-title q320-desc">
<title id="q320-title">Three different processes share an energy requirement</title>
<desc id="q320-desc">Respiration releases energy for muscle contraction, protein synthesis and maintaining constant body temperature. Branches link this common supply to movement, assembling amino acids, and temperature responses such as shivering and heat production.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="720" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Three different processes share an energy requirement</text><rect x="300" y="110" width="500" height="130" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="550.0" y="152" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Respiration</text><text x="550.0" y="200" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Releases energy for cellular work</text><line x1="550" y1="260" x2="205" y2="345" stroke="#357ca2" stroke-width="4"/><polygon points="205,345 216.26158607200912,335.0915854374814 219.57563435201848,348.54272257399003" fill="#357ca2"/><line x1="550" y1="260" x2="550" y2="345" stroke="#357ca2" stroke-width="4"/><polygon points="550,345 543.0733123668778,331.6950761583107 556.9266876331222,331.6950761583107" fill="#357ca2"/><line x1="550" y1="260" x2="895" y2="345" stroke="#357ca2" stroke-width="4"/><polygon points="895,345 880.4243656479815,348.54272257399003 883.7384139279909,335.0915854374814" fill="#357ca2"/><rect x="45" y="360" width="320" height="230" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="205" y="405" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Muscle contraction</text><text x="205" y="460" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Moves muscle fibres</text><rect x="390" y="360" width="320" height="230" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="550" y="405" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Protein synthesis</text><text x="550" y="460" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Assembles amino acids</text><text x="550" y="500" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >into proteins</text><rect x="735" y="360" width="320" height="230" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="895" y="405" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Temperature control</text><text x="895" y="460" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Supports shivering</text><text x="895" y="500" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >and metabolic</text><text x="895" y="540" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >heat production</text><text x="550" y="635" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >All three require energy, even though their purposes differ.</text><rect x="24" y="644" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="678" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C — they require energy</text>
</g></svg>