<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Potassium uptake draws water into guard cells</title><desc id="desc">A guard cell actively accumulates potassium against its gradient. Lower water potential draws water in by osmosis; two turgid guard cells curve apart around an open pore. Shapes and ion counts are schematic.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2e7656"/></marker></defs><rect width="1000" height="620" rx="24" fill="#fbf9ec"/><g font-family="sans-serif" fill="#173e32"><text x="42" y="55" font-size="31" text-anchor="start" fill="#173e32">Potassium uptake draws water into guard cells</text><rect x="35" y="90" width="435" height="455" rx="18" fill="#e4efdf" stroke="#548269" stroke-width="2"/><rect x="530" y="90" width="435" height="455" rx="18" fill="#e4efdf" stroke="#548269" stroke-width="2"/><text x="252" y="132" font-size="27" text-anchor="middle" fill="#173e32">1. Potassium enters</text><text x="748" y="132" font-size="27" text-anchor="middle" fill="#173e32">2. Water follows</text><ellipse cx="260" cy="305" rx="110" ry="130" fill="#d3e7bc" stroke="#2e7656" stroke-width="5"/><circle cx="235" cy="235" r="16" fill="#2e7656"/><text x="235" y="242" font-size="17" text-anchor="middle" fill="#ffffff">K⁺</text><circle cx="285" cy="285" r="16" fill="#2e7656"/><text x="285" y="292" font-size="17" text-anchor="middle" fill="#ffffff">K⁺</text><circle cx="235" cy="345" r="16" fill="#2e7656"/><text x="235" y="352" font-size="17" text-anchor="middle" fill="#ffffff">K⁺</text><circle cx="280" cy="390" r="16" fill="#2e7656"/><text x="280" y="397" font-size="17" text-anchor="middle" fill="#ffffff">K⁺</text><path d="M70 290 L142 290" fill="none" stroke="#2e7656" stroke-width="5" marker-end="url(#arrow)"/><text x="80" y="253" font-size="25" text-anchor="start" fill="#173e32">K⁺</text><text x="250" y="476" font-size="23" text-anchor="middle" fill="#173e32">Against ion gradient</text><text x="250" y="511" font-size="23" text-anchor="middle" fill="#173e32">Energy needed</text><path d="M710 190 C620 210 620 400 710 430 C680 350 680 270 710 190Z M790 190 C880 210 880 400 790 430 C820 350 820 270 790 190Z" fill="#8dbd75" stroke="#2e7656" stroke-width="5"/><path d="M565 295 L652 295" fill="none" stroke="#2e7656" stroke-width="5" marker-end="url(#arrow)"/><path d="M935 295 L849 295" fill="none" stroke="#2e7656" stroke-width="5" marker-end="url(#arrow)"/><text x="573" y="261" font-size="20" text-anchor="start" fill="#173e32">water</text><text x="868" y="261" font-size="20" text-anchor="start" fill="#173e32">water</text><text x="750" y="331" font-size="22" text-anchor="middle" fill="#173e32">pore</text><text x="750" y="475" font-size="23" text-anchor="middle" fill="#173e32">Lower water potential</text><text x="750" y="511" font-size="23" text-anchor="middle" fill="#173e32">Osmosis → turgid cells</text><text x="500" y="590" font-size="22" text-anchor="middle" fill="#173e32">Schematic: ion accumulation leads to water entry and stomatal opening.</text></g></svg>