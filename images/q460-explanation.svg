<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="q460-t q460-d"><title id="q460-t">Active immunity makes antibodies and memory cells</title><desc id="q460-d">Active immunity follows infection or vaccination: lymphocytes produce antibodies and memory cells. Breast milk supplies maternal antibodies ready-made, giving passive immunity.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#1d513d"/></marker></defs><rect width="1000" height="620" rx="24" fill="#fffdf3"/><g font-family="Arial, sans-serif"><text x="45" y="58" font-size="30" text-anchor="start" fill="#173e32" font-weight="bold">Active immunity makes antibodies and memory cells</text><rect x="45" y="105" width="910" height="225" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="70" y="145" font-size="28" text-anchor="start" fill="#173e32" font-weight="bold">ACTIVE: recipient makes antibodies</text><rect x="70" y="177" width="235" height="108" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="187.5" y="219" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">Infection OR</text><text x="187.5" y="254" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">vaccination</text><path d="M320 230 L385 230" stroke="#1d513d" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="405" y="177" width="235" height="108" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="522.5" y="219" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">Lymphocytes</text><text x="522.5" y="254" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">respond</text><path d="M655 230 L710 230" stroke="#1d513d" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="730" y="177" width="200" height="108" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="830.0" y="219" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">Antibodies +</text><text x="830.0" y="254" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">memory cells</text><rect x="45" y="355" width="910" height="180" rx="18" fill="#f8efd4" stroke="#649768" stroke-width="2"/><text x="70" y="398" font-size="27" text-anchor="start" fill="#173e32" font-weight="bold">PASSIVE: antibodies transferred ready-made</text><rect x="70" y="422" width="275" height="82" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="207.5" y="464" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">Mother’s breast milk</text><path d="M365 463 L430 463" stroke="#1d513d" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="450" y="422" width="470" height="82" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="685.0" y="464" font-size="24" text-anchor="middle" fill="#173e32" font-weight="normal">Antibodies received by infant</text><text x="45" y="589" font-size="18" text-anchor="start" fill="#546d5e" font-weight="normal">Original teaching schematic • qualitative unless values are stated</text></g></svg>