00.0" y="688" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Glycogen is converted to glucose.</text><text x="500.0" y="724" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Glucose is released into the blood.</text><line x1="500" y1="782" x2="500" y2="825" stroke="#25614b" stroke-width="5"/><polygon points="500,825 493.07331236687776,811.6950761583107 506.92668763312224,811.6950761583107" fill="#25614b"/><rect x="200" y="842" width="600" height="118" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="882" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Blood glucose rises</text><text x="500.0" y="925" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Helps restore the regulated level</text><text x="500" y="1013" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Adrenal gland → adrenaline · Ovary → oestrogen / progesterone</text><text x="500" y="1054" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative pathway; no glucose measurements are shown.</text><rect x="24" y="1084" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1118" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · Pancreas</text>
