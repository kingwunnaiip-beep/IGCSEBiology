<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" role="img" aria-labelledby="q221-title q221-desc">
<title id="q221-title">221 · Convert millimetres to micrometres</title>
<desc id="q221-desc">The given adult-tick length is 2.3 millimetres. One millimetre equals 1000 micrometres, so 2.3 times 1000 equals 2300 micrometres. A unit-conversion bar partitions the same length into 2.0 millimetres plus 0.3 millimetres, equivalent to 2000 plus 300 micrometres. This is a mathematical representation of the given length, not a tick drawing or a new measurement. Answer D.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1010" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >221 · Convert millimetres to micrometres</text><text x="500" y="112" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Same length · smaller unit · larger number</text><rect x="85" y="163" width="830" height="137" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="204" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >1 mm = 1000 µm</text><text x="500.0" y="247" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >For mm → µm, multiply by 1000.</text><text x="500" y="367" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >2.3 mm = 2.0 mm + 0.3 mm</text><rect x="100" y="407" width="695.6521739130435" height="88" rx="0" fill="#cfe3ba" stroke="#25614b" stroke-width="2"/><rect x="795.6521739130435" y="407" width="104.3478260869565" height="88" rx="0" fill="#e4d4ac" stroke="#25614b" stroke-width="2"/><text x="447.82608695652175" y="462" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >2.0 mm</text><text x="847.8260869565217" y="462" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >0.3</text><text x="500" y="550" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >2000 µm + 300 µm = 2300 µm</text><line x1="500" y1="584" x2="500" y2="631" stroke="#357ca2" stroke-width="4"/><polygon points="500,631 493.07331236687776,617.6950761583107 506.92668763312224,617.6950761583107" fill="#357ca2"/><rect x="85" y="656" width="830" height="141" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="697" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >2.3 × 1000 = 2300</text><text x="500.0" y="740" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The original length has not changed.</text><text x="500" y="852" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Conversion model; not a photograph scale or a new measurement.</text><text x="500" y="888" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Use the stated length, not the display size of the tick.</text><rect x="24" y="934" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="968" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · 2300 µm</text>
