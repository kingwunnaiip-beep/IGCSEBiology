<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Match nutrients to the functions they support</title><desc id="desc">A bone is supported by vitamin D, a water-filled blood vessel carries dissolved substances, and a body cross-section shows an insulating fat layer. These match the three functions in row B.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="53" font-size="31" text-anchor="start" font-weight="bold" fill="#173f32">Match nutrients to the functions they support</text><path d="M115 210 C80 180 80 135 120 135 Q150 140 170 165 Q190 140 220 135 C260 135 260 185 225 210 L215 375 C250 400 250 450 210 450 Q180 445 170 425 Q150 450 120 450 C80 450 85 400 120 375 Z" fill="#e8dfbe" stroke="#9d8f63" stroke-width="4"/><path d="M145 220 L145 370 Q170 390 190 370 L195 220 Z" fill="#d5bc85" stroke="#9d8f63" stroke-width="2"/><circle cx="80" cy="300" r="32" fill="#f2d48c" stroke="#d7a34b" stroke-width="3"/><text x="80" y="310" font-size="28" text-anchor="middle" font-weight="bold" fill="#173f32">D</text><path d="M116 300 L145 300" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="160" y="105" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">Vitamin D</text><text x="170" y="500" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">Bone growth</text><rect x="355" y="200" width="260" height="210" rx="70" fill="#dcecf4" stroke="#537c9a" stroke-width="4"/><ellipse cx="415" cy="260" rx="24" ry="15" fill="#cc8585" stroke="#bb6066" stroke-width="2" transform="rotate(-15 415 260)"/><ellipse cx="550" cy="355" rx="24" ry="15" fill="#cc8585" stroke="#bb6066" stroke-width="2" transform="rotate(-15 550 355)"/><ellipse cx="485" cy="305" rx="24" ry="15" fill="#cc8585" stroke="#bb6066" stroke-width="2" transform="rotate(-15 485 305)"/><circle cx="390" cy="350" r="6" fill="#d7a34b" stroke="#d7a34b" stroke-width="1"/><circle cx="550" cy="260" r="6" fill="#d7a34b" stroke="#d7a34b" stroke-width="1"/><circle cx="490" cy="380" r="6" fill="#d7a34b" stroke="#d7a34b" stroke-width="1"/><circle cx="575" cy="300" r="6" fill="#d7a34b" stroke="#d7a34b" stroke-width="1"/><path d="M380 170 L590 170" fill="none" stroke="#537c9a" stroke-width="4" marker-end="url(#blueArrow)"/><text x="485" y="105" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">Water</text><text x="485" y="455" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">Dissolved solutes</text><text x="485" y="500" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">Transport medium</text><circle cx="825" cy="300" r="116" fill="#ceb18c" stroke="#9a7f62" stroke-width="3"/><circle cx="825" cy="300" r="101" fill="#efd58c" stroke="#ba9d53" stroke-width="3"/><circle cx="825" cy="300" r="68" fill="#d59686" stroke="#bb6066" stroke-width="3"/><text x="825" y="105" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">Fat</text><text x="825" y="310" font-size="24" text-anchor="middle" font-weight="normal" fill="#173f32">core</text><text x="825" y="460" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">Insulating layer</text><text x="825" y="500" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">Slower heat loss</text><path d="M915 432 L894 380" fill="none" stroke="#24644b" stroke-width="2"/><text x="500" y="553" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">B: bone growth; transport; insulation</text></g></svg>