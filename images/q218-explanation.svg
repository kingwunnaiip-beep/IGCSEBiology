<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-labelledby="q218-title q218-desc">
<title id="q218-title">Keep light out of the gravity comparison</title>
<desc id="q218-desc">Experiments 1 and 3 compare a horizontal shoot with an upright control, both grown in darkness. The horizontal shoot bends upwards while the upright control continues upright. Qualitative growth drawings are not measured results. The answer is B.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
