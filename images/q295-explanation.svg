<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="q295-title q295-desc">
<title id="q295-title">Read the two parts of a scientific name</title>
<desc id="q295-desc">Aquila chrysaetos is the complete species name. Aquila is the first word and the genus. chrysaetos is the specific epithet. Golden eagle is a common name.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1200" height="680" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="600.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Read the two parts of a scientific name</text><text x="600" y="125" font-size="48" fill="#173d31" font-weight="700" text-anchor="middle" font-style="italic">Aquila chrysaetos</text><line x1="355" y1="151" x2="845" y2="151" stroke="#526c62" stroke-width="2"/><text x="600" y="193" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >The two words together name the species</text><line x1="432" y1="220" x2="320" y2="283" stroke="#25614b" stroke-width="4"/><polygon points="320,283 328.2003596781595,270.43998004982416 334.99213260928354,282.5142430384891" fill="#25614b"/><line x1="770" y1="220" x2="880" y2="283" stroke="#357ca2" stroke-width="4"/><polygon points="880,283 865.0120732489843,282.3982926739795 871.8970380265633,270.37692560201594" fill="#357ca2"/><rect x="70" y="300" width="500" height="180" rx="12" fill="#e6f2dd" stroke="#25614b" stroke-width="2"/><text x="320.0" y="340" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Aquila</text><text x="320.0" y="382" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >First word · capital initial</text><text x="320.0" y="418" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Genus</text><rect x="630" y="300" width="500" height="180" rx="12" fill="#eaf4f7" stroke="#357ca2" stroke-width="2"/><text x="880.0" y="340" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >chrysaetos</text><text x="880.0" y="382" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Second word · lower-case initial</text><text x="880.0" y="418" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Specific epithet</text><text x="600" y="540" font-size="30" fill="#173d31" font-weight="400" text-anchor="middle" >“golden eagle” is the common name.</text><text x="600" y="582" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >It does not supply the genus in binomial nomenclature.</text><rect x="24" y="604" width="1152" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="600.0" y="638" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >A — Aquila is the genus.</text>
</g></svg>