<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="q32-title q32-desc">
<title id="q32-title">Enzymes can build up and break down</title>
<desc id="q32-desc">Enzyme 1 catalyses joining amino acids into proteins. Enzyme 2 catalyses protein breakdown into amino acids. Enzymes speed reactions without being used up and do not supply the energy for synthesis. The simple units represent amino acids, not atoms.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="800" height="600" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="400.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Enzymes can build up and break down</text><text x="180" y="130" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Amino acids</text><text x="625" y="130" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Protein</text><circle cx="100" cy="200" r="19" fill="#eff5e8" stroke="#25614b" stroke-width="3"/><circle cx="185" cy="220" r="19" fill="#eff5e8" stroke="#25614b" stroke-width="3"/><circle cx="270" cy="185" r="19" fill="#eff5e8" stroke="#25614b" stroke-width="3"/><circle cx="120" cy="305" r="19" fill="#eff5e8" stroke="#25614b" stroke-width="3"/><circle cx="230" cy="320" r="19" fill="#eff5e8" stroke="#25614b" stroke-width="3"/><line x1="490" y1="255" x2="550" y2="220" stroke="#357ca2" stroke-width="4"/><line x1="550" y1="220" x2="610" y2="260" stroke="#357ca2" stroke-width="4"/><line x1="610" y1="260" x2="670" y2="220" stroke="#357ca2" stroke-width="4"/><line x1="670" y1="220" x2="730" y2="250" stroke="#357ca2" stroke-width="4"/><circle cx="490" cy="255" r="17" fill="#eff5e8" stroke="#357ca2" stroke-width="3"/><circle cx="550" cy="220" r="17" fill="#eff5e8" stroke="#357ca2" stroke-width="3"/><circle cx="610" cy="260" r="17" fill="#eff5e8" stroke="#357ca2" stroke-width="3"/><circle cx="670" cy="220" r="17" fill="#eff5e8" stroke="#357ca2" stroke-width="3"/><circle cx="730" cy="250" r="17" fill="#eff5e8" stroke="#357ca2" stroke-width="3"/><line x1="340" y1="205" x2="460" y2="205" stroke="#25614b" stroke-width="4"/><polygon points="460,205 446.6950761583107,211.92668763312224 446.6950761583107,198.07331236687776" fill="#25614b"/><text x="400" y="168" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Enzyme 1</text><text x="400" y="248" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Builds up</text><line x1="460" y1="340" x2="340" y2="340" stroke="#357ca2" stroke-width="4"/><polygon points="340,340 353.3049238416893,333.07331236687776 353.3049238416893,346.92668763312224" fill="#357ca2"/><text x="400" y="383" font-size="25" fill="#357ca2" font-weight="400" text-anchor="middle" >Enzyme 2: breaks down</text><text x="400" y="450" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Enzymes are reusable biological catalysts.</text><text x="400" y="484" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >They do not supply energy for synthesis.</text><rect x="24" y="524" width="752" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="400.0" y="558" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C — Enzymes can build up large molecules</text>
