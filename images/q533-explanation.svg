<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="q533-title q533-desc"><title id="q533-title">The stationary phase is a balance of rates</title><desc id="q533-desc">A bacterial growth graph shows lag, log, stationary and death phases. The stationary phase C is horizontal because additions by division equal losses by death; zero net population change does not mean zero cell division. Diagram is schematic.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#36785e"/></marker></defs><rect x="0" y="0" width="900" height="500" rx="22" fill="#fbf7e9"/><g font-family="Arial, Helvetica, sans-serif"><text x="35" y="46" font-size="27" text-anchor="start" fill="#183e35"><tspan x="35" dy="0">The stationary phase is a balance of rates</tspan></text><path d="M85 375 L85 112" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M85 375 L610 375" stroke="#36785e" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="30" y="245" font-size="21" text-anchor="middle" transform="rotate(-90 30 245)" fill="#183e35">Number of bacteria</text><text x="355" y="413" font-size="23" text-anchor="middle" fill="#183e35"><tspan x="355" dy="0">Time</tspan></text><path d="M95 365 C145 365 175 361 195 330 C215 300 210 205 256 167 C291 144 340 151 381 151 L475 151 C521 151 543 205 565 300" stroke="#36785e" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M192 122 L192 375" stroke="#a6b6a2" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M292 122 L292 375" stroke="#a6b6a2" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M488 122 L488 375" stroke="#a6b6a2" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="140" y="92" font-size="19" text-anchor="middle" fill="#183e35"><tspan x="140" dy="0">A: lag</tspan></text><text x="239" y="92" font-size="19" text-anchor="middle" fill="#183e35"><tspan x="239" dy="0">B: log</tspan></text><text x="390" y="92" font-size="19" text-anchor="middle" fill="#183e35"><tspan x="390" dy="0">C: stationary</tspan></text><text x="552" y="92" font-size="19" text-anchor="middle" fill="#183e35"><tspan x="552" dy="0">D: death</tspan></text><rect x="650" y="147" width="214" height="198" rx="15" fill="#d7e9d8" stroke="#36785e" stroke-width="2"/><text x="757" y="184" font-size="22" text-anchor="middle" fill="#183e35"><tspan x="757" dy="0">At the plateau</tspan></text><text x="757" y="229" font-size="21" text-anchor="middle" fill="#183e35"><tspan x="757" dy="0">division = death</tspan><tspan x="757" dy="29">net change = 0</tspan></text><text x="450" y="469" font-size="22" text-anchor="middle" fill="#183e35"><tspan x="450" dy="0">Cells can still divide while total population size remains constant.</tspan></text></g></svg>