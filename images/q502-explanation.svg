<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" role="img" aria-labelledby="title502 desc502"><title id="title502">Account for energy before the bird</title><desc id="desc502">A proportionally scaled 240-joule bar is split into 120 joules egested, 70 joules lost in respiration, and 50 joules transferred to the bird. The bird’s later losses are excluded from this calculation.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#185744"/></marker></defs><rect width="800" height="530" rx="20" fill="#fbf8ed"/><g font-family="Arial, sans-serif"><text x="400" y="55" font-size="28" text-anchor="middle" fill="#185744" font-weight="bold">Account for energy before the bird</text><text x="400" y="115" font-size="26" text-anchor="middle" fill="#185744" font-weight="bold">240 J enters the caterpillar</text><rect x="70" y="155" width="330" height="95" rx="0" fill="#c4d9cb" stroke="#185744" stroke-width="2"/><rect x="400" y="155" width="192.5" height="95" rx="0" fill="#e8c298" stroke="#185744" stroke-width="2"/><rect x="592.5" y="155" width="137.5" height="95" rx="0" fill="#397a61" stroke="#185744" stroke-width="2"/><text x="235" y="211" font-size="28" text-anchor="middle" fill="#185744" font-weight="normal">120 J</text><text x="496" y="211" font-size="28" text-anchor="middle" fill="#185744" font-weight="normal">70 J</text><text x="661" y="211" font-size="28" text-anchor="middle" fill="#fbf8ed" font-weight="normal">50 J</text><text x="235" y="292" font-size="23" text-anchor="middle" fill="#185744" font-weight="normal">Egested</text><text x="496" y="292" font-size="23" text-anchor="middle" fill="#185744" font-weight="normal">Respiration</text><text x="661" y="292" font-size="23" text-anchor="middle" fill="#185744" font-weight="normal">To bird</text><rect x="100" y="345" width="600" height="60" rx="12" fill="#e1eee2" stroke="#185744" stroke-width="2"/><text x="400.0" y="383.0" font-size="22" text-anchor="middle" fill="#185744" font-weight="normal">240 − 120 − 70 = 50 J transferred to the bird</text><text x="400" y="459" font-size="23" text-anchor="middle" fill="#185744" font-weight="normal">The bird’s own losses occur after this transfer.</text></g></svg>