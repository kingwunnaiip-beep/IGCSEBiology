<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1180" viewBox="0 0 1000 1180" role="img" aria-labelledby="q203-title q203-desc">
<title id="q203-title">203 · Mature xylem vessels have no mitochondria</title>
<desc id="q203-desc">Answer B: thick vessel walls and no mitochondria. A qualitative longitudinal cutaway of a mature xylem vessel has thick lignified side walls, shown as amber strips, surrounding a clear hollow lumen. The thick-wall leader ends on the left wall, and the lumen leader ends in the central conducting space. Water and mineral ions move through this hollow route. Mature conducting vessel cells are dead and have lost living contents, including mitochondria. Living cells elsewhere in xylem tissue should not be confused with mature vessel elements. The drawing is a conceptual cutaway, with no measured wall thickness or flow rate.</desc>
