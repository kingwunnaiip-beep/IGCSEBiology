<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">Find the interval where digestion stops</title><desc id="d">Four observed results show complete digestion at 25, 35 and 45 degrees but none at 55 degrees. The interval 45 to 55 degrees is highlighted. 50 degrees is an offered inference within this interval, not a measured experimental temperature.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#194f3b"/></marker></defs><rect width="1000" height="600" rx="22" fill="#fffdf2"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="31" text-anchor="start" fill="#213c30" font-weight="bold">Find the interval where digestion stops</text><text x="42" y="105" font-size="26" text-anchor="start" fill="#213c30" font-weight="bold">Observed protein digestion</text><rect x="45" y="132" width="202" height="130" rx="16" fill="#d9ead7" stroke="#194f3b" stroke-width="2"/><text x="146.0" y="171.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">25 °C</text><text x="146.0" y="205.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">complete</text><text x="146.0" y="239.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">in 4 hours</text><rect x="281" y="132" width="202" height="130" rx="16" fill="#d9ead7" stroke="#194f3b" stroke-width="2"/><text x="382.0" y="171.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">35 °C</text><text x="382.0" y="205.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">complete</text><text x="382.0" y="239.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">in 2 hours</text><rect x="517" y="132" width="202" height="130" rx="16" fill="#d9ead7" stroke="#194f3b" stroke-width="2"/><text x="618.0" y="171.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">45 °C</text><text x="618.0" y="205.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">complete</text><text x="618.0" y="239.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">in 3 hours</text><rect x="753" y="132" width="202" height="130" rx="16" fill="#ffffff" stroke="#194f3b" stroke-width="2"/><text x="854.0" y="171.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">55 °C</text><text x="854.0" y="205.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">no digestion</text><text x="854.0" y="239.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">observed</text><path d="M91,374 L900,374" fill="none" stroke="#194f3b" stroke-width="4"/><path d="M555,337 L765,337" fill="none" stroke="#194f3b" stroke-width="4"/><path d="M555,321 L555,353" fill="none" stroke="#194f3b" stroke-width="4"/><path d="M765,321 L765,353" fill="none" stroke="#194f3b" stroke-width="4"/><path d="M135,365 L135,385" fill="none" stroke="#194f3b" stroke-width="4"/><text x="135" y="421" font-size="25" text-anchor="middle" fill="#213c30" font-weight="normal">25 °C</text><path d="M345,365 L345,385" fill="none" stroke="#194f3b" stroke-width="4"/><text x="345" y="421" font-size="25" text-anchor="middle" fill="#213c30" font-weight="normal">35 °C</text><path d="M555,365 L555,385" fill="none" stroke="#194f3b" stroke-width="4"/><text x="555" y="421" font-size="25" text-anchor="middle" fill="#213c30" font-weight="normal">45 °C</text><path d="M765,365 L765,385" fill="none" stroke="#194f3b" stroke-width="4"/><text x="765" y="421" font-size="25" text-anchor="middle" fill="#213c30" font-weight="normal">55 °C</text><text x="660" y="302" font-size="23" text-anchor="middle" fill="#213c30" font-weight="normal">Activity lost in this interval</text><text x="660" y="473" font-size="26" text-anchor="middle" fill="#213c30" font-weight="bold">50 °C is the only offered value</text><text x="660" y="509" font-size="25" text-anchor="middle" fill="#213c30" font-weight="normal">between 45 °C and 55 °C.</text><text x="40" y="566" font-size="21" text-anchor="start" fill="#213c30" font-weight="normal">Loss of active-site shape causes denaturation. The precise threshold was not measured.</text></g></svg>