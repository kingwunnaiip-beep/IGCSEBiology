 text-anchor="middle" >Each particle moves randomly; the overall spread follows the gradient.</text><text x="550" y="524" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >These chemical molecules spread through air: no membrane is involved.</text><text x="550" y="563" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Schematic particle positions, not measured concentrations.</text><rect x="24" y="624" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="658" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Diffusion spreads the chemicals through the air.</text>
