<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" role="img" aria-labelledby="title desc"><title id="title">Leaf structure explains each layer’s function</title><desc id="desc">A layered leaf section shows a thin surface cuticle above the epidermal cells, tall palisade cells and loosely arranged spongy cells with air spaces. R is cuticle, S palisade mesophyll and T spongy mesophyll. Light enters from above.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#276b46"/></marker></defs><rect width="1000" height="570" rx="20" fill="#fbfaf0"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="53" fill="#203e33" font-size="30" font-weight="bold" text-anchor="start">Leaf structure explains each layer’s function</text><text x="40" y="96" fill="#203e33" font-size="21" font-weight="normal" text-anchor="start">Different layers support water conservation, light capture and gas exchange.</text><rect x="62" y="145" width="475" height="290" rx="14" fill="#f0f4e8" stroke="#276b46" stroke-width="2"/><rect x="75" y="153" width="450" height="12" rx="2" fill="#d7a542" stroke="#276b46" stroke-width="2"/><text x="580" y="165" fill="#203e33" font-size="25" font-weight="bold" text-anchor="start">R — cuticle</text><text x="580" y="194" fill="#203e33" font-size="20" font-weight="normal" text-anchor="start">Waxy barrier limits water loss.</text><rect x="80" y="169" width="66" height="30" rx="8" fill="#f9f8e9" stroke="#276b46" stroke-width="2"/><rect x="153" y="169" width="66" height="30" rx="8" fill="#f9f8e9" stroke="#276b46" stroke-width="2"/><rect x="226" y="169" width="66" height="30" rx="8" fill="#f9f8e9" stroke="#276b46" stroke-width="2"/><rect x="299" y="169" width="66" height="30" rx="8" fill="#f9f8e9" stroke="#276b46" stroke-width="2"/><rect x="372" y="169" width="66" height="30" rx="8" fill="#f9f8e9" stroke="#276b46" stroke-