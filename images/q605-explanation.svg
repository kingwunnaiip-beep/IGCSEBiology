<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Germination shows growth and sensitivity</title><desc id="desc">The seedling grows larger and develops roots and a shoot. Root growth downwards and shoot growth upwards are directional responses to stimuli, showing sensitivity.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="53" font-size="31" text-anchor="start" font-weight="bold" fill="#173f32">Germination shows growth and sensitivity</text><path d="M60 330 L940 330" fill="none" stroke="#a99672" stroke-width="3"/><text x="65" y="365" font-size="22" text-anchor="start" font-weight="normal" fill="#173f32">soil</text><g transform="translate(170 330) scale(0.8)"><path d="M-20 -30 C-75 -40 -70 45 -20 40 C15 35 30 10 5 -10 C-10 5 -18 -10 -20 -30" fill="#b99b74" stroke="#6f6952" stroke-width="3"/></g><g transform="translate(450 330) scale(0.8)"><path d="M-20 -30 C-75 -40 -70 45 -20 40 C15 35 30 10 5 -10 C-10 5 -18 -10 -20 -30" fill="#b99b74" stroke="#6f6952" stroke-width="3"/></g><g transform="translate(760 330) scale(0.8)"><path d="M-20 -30 C-75 -40 -70 45 -20 40 C15 35 30 10 5 -10 C-10 5 -18 -10 -20 -30" fill="#b99b74" stroke="#6f6952" stroke-width="3"/></g><path d="M435 337 Q400 370 435 420" fill="none" stroke="#8f805d" stroke-width="6"/><path d="M750 325 Q720 210 760 155" fill="none" stroke="#24644b" stroke-width="7"/><g transform="translate(755 205) rotate(-20)"><path d="M0 0 Q39.6 -30 88 0 Q39.6 30 0 0" fill="#91b68b" stroke="#24644b" stroke-width="3"/><path d="M0 0 H88" stroke="#24644b" stroke-width="2"/></g><g transform="translate(745 240) rotate(20)"><path d="M0 0 Q-31.5 -27 -70 0 Q-31.5 27 0 0" fill="#91b68b" stroke="#24644b" stroke-width="3"/><path d="M0 0 H-70" stroke="#24644b" stroke-width="2"/></g><path d="M755 350 Q741.0 379.25 709.5 424.75" fill="none" stroke="#8f805d" stroke-width="4"/><path d="M725.425 398.5875 l-18 22" fill="none" stroke="#8f805d" stroke-width="2"/><path d="M755 350 Q749.0 379.25 735.5 444.25" fill="none" stroke="#8f805d" stroke-width="4"/><path d="M742.325 411.2625 l-18 22" fill="none" stroke="#8f805d" stroke-width="2"/><path d="M755 350 Q755.0 379.25 755.0 467.0" fill="none" stroke="#8f805d" stroke-width="4"/><path d="M755.0 426.05 l18 22" fill="none" stroke="#8f805d" stroke-width="2"/><path d="M755 350 Q762.0 379.25 777.75 437.75" fill="none" stroke="#8f805d" stroke-width="4"/><path d="M769.7875 407.0375 l18 22" fill="none" stroke="#8f805d" stroke-width="2"/><path d="M755 350 Q769.0 379.25 800.5 421.5" fill="none" stroke="#8f805d" stroke-width="4"/><path d="M784.575 396.475 l18 22" fill="none" stroke="#8f805d" stroke-width="2"/><path d="M250 270 L355 270" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M540 270 L640 270" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="170" y="448" font-size="25" text-anchor="middle" font-weight="normal" fill="#173f32">Seed</text><text x="445" y="475" font-size="25" text-anchor="middle" font-weight="normal" fill="#173f32">Root emerges</text><text x="760" y="485" font-size="25" text-anchor="middle" font-weight="normal" fill="#173f32">Larger seedling</text><path d="M875 255 L875 160" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="900" y="205" font-size="23" text-anchor="start" font-weight="normal" fill="#173f32">shoot</text><path d="M875 370 L875 450" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="900" y="420" font-size="23" text-anchor="start" font-weight="normal" fill="#173f32">root</text><text x="500" y="553" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">Growth + directional response (sensitivity) = B</text></g></svg>