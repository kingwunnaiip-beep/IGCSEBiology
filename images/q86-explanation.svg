<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1130" viewBox="0 0 1000 1130" role="img" aria-labelledby="q86-title q86-desc">
<title id="q86-title">86 · A recessive offspring from two heterozygotes</title>
<desc id="q86-desc">Answer B, probability 0.25 or 25 percent. Polydactyly is dominant in this question: P means extra toes and p means the recessive normal-toe allele. The two heterozygous parents are Pp and Pp. Each produces P and p gametes with equal probability. The Punnett square has PP, Pp, Pp and pp, each with probability 25 percent. Only pp has no extra toes. The expected genotype ratio is 1 PP to 2 Pp to 1 pp and the expected phenotype ratio is 3 extra toes to 1 no extra toes. Each offspring is independent; four kittens are not guaranteed to show that ratio.</desc>
