<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Why are chemical fertilisers used in food production?</title><desc id="desc">Fertiliser adds mineral ions: Relieves a nutrient limitation; Improved crop growth: Can increase crop yield; Weed control is separate: Fertiliser does not reduce herbicide use or weed competition</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Why are chemical fertilisers used in food production?</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="50" y="190" font-size="23" font-weight="700">Fertiliser adds mineral</text><text x="50" y="219" font-size="23" font-weight="700">ions</text><text x="50" y="276" font-size="21" font-weight="400">Relieves a nutrient limitation</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="405" y="190" font-size="23" font-weight="700">Improved crop growth</text><text x="405" y="276" font-size="21" font-weight="400">Can increase crop yield</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="760" y="190" font-size="23" font-weight="700">Weed control is</text><text x="760" y="219" font-size="23" font-weight="700">separate</text><text x="760" y="276" font-size="21" font-weight="400">Fertiliser does not reduce</text><text x="760" y="303" font-size="21" font-weight="400">herbicide use or weed</text><text x="760" y="330" font-size="21" font-weight="400">competition</text><path d="M345 245 H376" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)"/><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>