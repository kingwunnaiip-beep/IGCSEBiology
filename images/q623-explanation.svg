<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Meiosis halves chromosome number: 4 → 2</title><desc id="desc">Parent cell B contains four chromosomes in two matching pairs. Arrows lead to four daughter cells, each with two chromosomes, one long and one short, demonstrating the haploid number n = 2.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="53" font-size="31" text-anchor="start" font-weight="bold" fill="#173f32">Meiosis halves chromosome number: 4 → 2</text><circle cx="200" cy="315" r="125" fill="#f2f5e7" stroke="#24644b" stroke-width="4"/><path d="M138 247.5 Q154 305 145 382.5" fill="none" stroke="#24644b" stroke-width="9"/><path d="M173 247.5 Q189 305 180 382.5" fill="none" stroke="#537c9a" stroke-width="9"/><path d="M223 275.0 Q239 305 230 355.0" fill="none" stroke="#24644b" stroke-width="9"/><path d="M258 275.0 Q274 305 265 355.0" fill="none" stroke="#537c9a" stroke-width="9"/><circle cx="600" cy="210" r="72" fill="#f2f5e7" stroke="#24644b" stroke-width="3"/><path d="M573 165.0 Q589 200 580 255.0" fill="none" stroke="#537c9a" stroke-width="9"/><path d="M618 182.5 Q634 200 625 237.5" fill="none" stroke="#24644b" stroke-width="9"/><circle cx="835" cy="210" r="72" fill="#f2f5e7" stroke="#24644b" stroke-width="3"/><path d="M808 165.0 Q824 200 815 255.0" fill="none" stroke="#24644b" stroke-width="9"/><path d="M853 182.5 Q869 200 860 237.5" fill="none" stroke="#537c9a" stroke-width="9"/><circle cx="600" cy="430" r="72" fill="#f2f5e7" stroke="#24644b" stroke-width="3"/><path d="M573 385.0 Q589 420 580 475.0" fill="none" stroke="#537c9a" stroke-width="9"/><path d="M618 402.5 Q634 420 625 457.5" fill="none" stroke="#24644b" stroke-width="9"/><circle cx="835" cy="430" r="72" fill="#f2f5e7" stroke="#24644b" stroke-width="3"/><path d="M808 385.0 Q824 420 815 475.0" fill="none" stroke="#24644b" stroke-width="9"/><path d="M853 402.5 Q869 420 860 457.5" fill="none" stroke="#537c9a" stroke-width="9"/><path d="M335 315 H420 V210 H520" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M420 315 V430 H520" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M420 210 V110 H835 V133" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M420 430 V520 H835 V507" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="200" y="150" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">Parent B: 2n = 4</text><text x="720" y="105" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">Four daughters: n = 2 each</text><text x="500" y="553" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">B has two homologous pairs; each daughter has one of each</text></g></svg>