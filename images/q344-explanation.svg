t-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">A</text><text x="560" y="302" font-size="32" fill="#173d31" font-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">A</text><line x1="589" y1="140" x2="589" y2="320" stroke="#d5dfd9" stroke-width="2"/><text x="618" y="177" font-size="32" fill="#173d31" font-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">C</text><text x="618" y="302" font-size="32" fill="#173d31" font-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">C</text><rect x="652" y="125" width="48" height="210" rx="12" fill="#f8e8c7" stroke="#daa958" stroke-width="2"/><text x="676" y="177" font-size="32" fill="#173d31" font-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">T</text><text x="676" y="302" font-size="32" fill="#173d31" font-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">A</text><text x="734" y="177" font-size="32" fill="#173d31" font-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">C</text><text x="734" y="302" font-size="32" fill="#173d31" font-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">C</text><line x1="763" y1="140" x2="763" y2="320" stroke="#d5dfd9" stroke-width="2"/><text x="792" y="177" font-size="32" fill="#173d31" font-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">C</text><text x="792" y="302" font-size="32" fill="#173d31" font-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">C</text><text x="850" y="177" font-size="32" fill="#173d31" font-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">T</text><text x="850" y="302" font-size="32" fill="#173d31" font-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">T</text><text x="908" y="177" font-size="32" fill="#173d31" font-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">C</text><text x="908" y="302" font-size="32" fill="#173d31" font-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">C</text><line x1="676" y1="355" x2="676" y2="405" stroke="#daa958" stroke-width="4"/><polygon points="676,405 669.0733123668778,391.6950761583107 682.9266876331222,391.6950761583107" fill="#daa958"/><rect x="430" y="425" width="490" height="100" rx="12" fill="#f8e8c7" stroke="#daa958" stroke-width="2"/><text x="675.0" y="463" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >T → A at one position</text><text x="675.0" y="501" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >The number of bases stays the same.</text><text x="550" y="580" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Addition: sequence would gain a base.</text><text x="550" y="620" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Deletion: sequence would lose a base.</text><text x="550" y="660" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Substitution: one base is replaced by another.</text><rect x="24" y="714" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="748" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C: the change of one base for another</text>
</g></svg>