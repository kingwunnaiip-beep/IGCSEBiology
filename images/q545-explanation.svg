<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Follow the wing-feature key</title><desc id="desc">Decision path: wings present leads to step 2; two pairs leads to step 3; wings without circular markings leads to D. Alternative exits A, B and C correspond to different wing features.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#32745a" stroke-width="1.5"/></marker></defs><rect width="1000" height="620" rx="22" fill="#faf8e9"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="54" font-size="30" text-anchor="start" fill="#183f35" font-weight="bold">Follow the wing-feature key</text><rect x="250" y="95" width="500" height="76" rx="18" fill="#e4f0dc" stroke="#32745a" stroke-width="2"/><text x="500.0" y="131" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">1. Are wings present?</text><path d="M500 171 L500 231" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><text x="520" y="210" font-size="23" text-anchor="start" fill="#183f35" font-weight="normal">Yes</text><rect x="250" y="231" width="500" height="76" rx="18" fill="#e4f0dc" stroke="#32745a" stroke-width="2"/><text x="500.0" y="267" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">2. How many pairs?</text><path d="M500 307 L500 367" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><text x="520" y="346" font-size="23" text-anchor="start" fill="#183f35" font-weight="normal">Two pairs</text><rect x="250" y="367" width="500" height="76" rx="18" fill="#e4f0dc" stroke="#32745a" stroke-width="2"/><text x="500.0" y="403" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">3. Circular wing markings?</text><path d="M500 443 L500 503" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><text x="520" y="482" font-size="23" text-anchor="start" fill="#183f35" font-weight="normal">No</text><rect x="370" y="503" width="260" height="70" rx="18" fill="#e4f0dc" stroke="#32745a" stroke-width="2"/><text x="500.0" y="539" font-size="23" text-anchor="middle" fill="#183f35" font-weight="normal">Identity D</text><path d="M250 132 L80 132" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><text x="75" y="170" font-size="21" text-anchor="start" fill="#183f35" font-weight="normal">No → A</text><path d="M750 268 L920 268" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><text x="770" y="306" font-size="21" text-anchor="start" fill="#183f35" font-weight="normal">One pair → B</text><path d="M750 404 L920 404" fill="none" stroke="#32745a" stroke-width="3" marker-end="url(#arr)"/><text x="770" y="442" font-size="21" text-anchor="start" fill="#183f35" font-weight="normal">Yes → C</text></g></svg>