<title id="q479-title">Read breathing rate and depth separately</title>
<desc id="q479-desc">Matched qualitative lung-volume traces compare rest and after exercise. After exercise there are more cycles in an equal time and a larger peak-to-trough volume. More cycles mean faster breathing; taller waves mean deeper breaths.</desc>
