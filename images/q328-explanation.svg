<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="q328-title q328-desc">
<title id="q328-title">Xylem carries water and mineral ions</title>
<desc id="q328-desc">A stem vascular bundle has phloem towards the outside and larger xylem vessels towards the centre. The X leader ends on a xylem vessel. Xylem transports water and mineral ions from roots upwards.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
