<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="q345-title q345-desc">
<title id="q345-title">Follow both branches of the plant key</title>
<desc id="q345-desc">A five-petalled flower and a jagged-edged leaf lead through the five-petal and jagged-edge branches to D. Four-petal and smooth-edge routes are rejected.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="720" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Follow both branches of the plant key</text><ellipse cx="180.0" cy="124.0" rx="25" ry="39" transform="rotate(0 180.0 124.0)" fill="#f5dfa5" stroke="#25614b" stroke-width="3"/><ellipse cx="225.65071278216737" cy="157.1671842700025" rx="25" ry="39" transform="rotate(72 225.65071278216737 157.1671842700025)" fill="#f5dfa5" stroke="#25614b" stroke-width="3"/><ellipse cx="208.21369211003872" cy="210.83281572999746" rx="25" ry="39" transform="rotate(144 208.21369211003872 210.83281572999746)" fill="#f5dfa5" stroke="#25614b" stroke-width="3"/><ellipse cx="151.78630788996128" cy="210.8328157299975" rx="25" ry="39" transform="rotate(216 151.78630788996128 210.8328157299975)" fill="#f5dfa5" stroke="#25614b" stroke-width="3"/><ellipse cx="134.34928721783263" cy="157.16718427000254" rx="25" ry="39" transform="rotate(288 134.34928721783263 157.16718427000254)" fill="#f5dfa5" stroke="#25614b" stroke-width="3"/><circle cx="180" cy="172" r="19" fill="#daa958" stroke="#25614b" stroke-width="3"/><line x1="180" y1="232" x2="180" y2="309" stroke="#25614b" stroke-width="3"/><text x="180" y="355" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Count 5 petals</text><path d="M110 465 L135 445 L130 425 L156 432 L173 408 L187 431 L216 421 L212 447 L241 449 L222 469 L241 486 L213 493 L211 514 L187 501 L174 523 L157 500 L133 509 L136 486 Z" fill="#bccea0" stroke="#25614b" stroke-width="3"/><line x1="174" y1="515" x2="177" y2="438" stroke="#25614b" stroke-width="3"/><text x="180" y="563" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Jagged leaf edges</text><rect x="380" y="115" width="630" height="115" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="695.0" y="155" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Flower has five petals</text><text x="695.0" y="198" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Reject the four-petal branch.</text><line x1="695" y1="242" x2="695" y2="291" stroke="#25614b" stroke-width="4"/><polygon points="695,291 688.0733123668778,277.6950761583107 701.9266876331222,277.6950761583107" fill="#25614b"/><rect x="380" y="305" width="630" height="115" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="695.0" y="345" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Leaves have jagged edges</text><text x="695.0" y="388" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Reject the smooth-edge branch.</text><line x1="695" y1="432" x2="695" y2="481" stroke="#25614b" stroke-width="4"/><polygon points="695,481 688.0733123668778,467.6950761583107 701.9266876331222,467.6950761583107" fill="#25614b"/><rect x="380" y="495" width="630" height="100" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="695.0" y="535" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Both features identify plant D</text><rect x="24" y="644" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="678" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Use the complete path: five petals → jagged edges → D</text>
</g></svg>