400" rx="10" ry="10" fill="#d9eaf1" stroke="#537c9a" stroke-width="2" /><rect x="849" y="320" width="51" height="115" rx="10" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><ellipse cx="874" cy="400" rx="10" ry="10" fill="#d9eaf1" stroke="#537c9a" stroke-width="2" /><rect x="170" y="225" width="35" height="13" rx="7" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><polygon points="190,255 178,273 202,273" fill="#826b98" stroke="#826b98" stroke-width="1"/><rect x="250" y="260" width="35" height="13" rx="7" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><polygon points="270,290 258,308 282,308" fill="#826b98" stroke="#826b98" stroke-width="1"/><rect x="330" y="220" width="35" height="13" rx="7" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><polygon points="350,250 338,268 362,268" fill="#826b98" stroke="#826b98" stroke-width="1"/><path d="M430 355 L430 255" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)" /><text x="430" y="240" font-size="23" fill="#24644b" text-anchor="middle" font-weight="normal">Cl⁻</text><path d="M510 355 L510 255" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)" /><text x="510" y="240" font-size="23" fill="#24644b" text-anchor="middle" font-weight="normal">Cl⁻</text><path d="M590 355 L590 255" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)" /><text x="590" y="240" font-size="23" fill="#24644b" text-anchor="middle" font-weight="normal">Cl⁻</text><path d="M470 365 L470 283" fill="none" stroke="#537c9a" stroke-width="4" marker-end="url(#bluearrow)" /><ellipse cx="470" cy="275" rx="7" ry="7" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><path d="M550 365 L550 283" fill="none" stroke="#537c9a" stroke-width="4" marker-end="url(#bluearrow)" /><ellipse cx="550" cy="275" rx="7" ry="7" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><path d="M630 365 L630 283" fill="none" stroke="#537c9a" stroke-width="4" marker-end="url(#bluearrow)" /><ellipse cx="630" cy="275" rx="7" ry="7" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><path d="M700 260 L885 260" fill="none" stroke="#537c9a" stroke-width="9" marker-end="url(#bluearrow)" /><text x="765" y="155" font-size="24" fill="#173f32" text-anchor="middle" font-weight="bold">Watery diarrhoea</text><text x="200" y="145" font-size="23" fill="#173f32" text-anchor="middle" font-weight="normal">Cholera bacteria + toxin</text><text x="230" y="487" font-size="22" fill="#173f32" text-anchor="start" font-weight="normal">Intestinal cells</text><text x="690" y="487" font-size="23" fill="#537c9a" text-anchor="start" font-weight="normal">Water follows by osmosis</text><path d="M710 472 L600 300" fill="none" stroke="#537c9a" stroke-width="2" /></g></svg>