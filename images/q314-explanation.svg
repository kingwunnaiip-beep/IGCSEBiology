<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="q314-title q314-desc">
<title id="q314-title">Forest biomass is greatest in the producers</title>
<desc id="q314-desc">A qualitative upright biomass pyramid has a broad producer base, then smaller herbivore, secondary-consumer and tertiary-consumer levels. Trees contain large biomass even if there are fewer trees than insects. No measured biomass or transfer efficiency is shown.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="790" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Forest biomass is greatest in the producers</text><rect x="370" y="140" width="380" height="75" rx="0" fill="#edf3fa" stroke="#25614b" stroke-width="2"/><text x="560" y="186.5" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Tertiary consumers</text><rect x="300" y="230" width="520" height="75" rx="0" fill="#edf3fa" stroke="#25614b" stroke-width="2"/><text x="560" y="276.5" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Secondary consumers</text><rect x="220" y="320" width="680" height="75" rx="0" fill="#edf3fa" stroke="#25614b" stroke-width="2"/><text x="560" y="366.5" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Primary consumers</text><rect x="100" y="410" width="920" height="95" rx="0" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="560" y="466.5" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Producers: trees and other plants</text><text x="560" y="565" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Width represents total dry mass at each trophic level.</text><text x="560" y="612" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >A few large trees can have more biomass than many small insects.</text><text x="560" y="654" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative model: no biomass measurements are supplied.</text><rect x="24" y="714" width="1072" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="560.0" y="748" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Upright pyramid with the broadest producer base → A</text>
</g></svg>