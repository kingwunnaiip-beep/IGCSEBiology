<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="q73-title q73-desc">
<title id="q73-title">Hydra budding: asexual reproduction</title>
<desc id="q73-desc">A Hydra forms a bud by mitotic cell division. The bud grows and detaches as offspring. Only one parent is involved, with no gamete fusion. Parent and offspring are genetically identical clones except for mutations.</desc>
