<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1190" viewBox="0 0 1000 1190" role="img" aria-labelledby="q104-title q104-desc">
<title id="q104-title">104 · A simple reflex arc carries impulses in order</title>
<desc id="q104-desc">Answer D: P is the sensory neurone, Q is the relay neurone and R is the motor neurone. A receptor detects a stimulus. The sensory neurone carries an electrical impulse towards the central nervous system; the relay neurone connects pathways within the central nervous system; the motor neurone carries an impulse to an effector, such as a muscle which contracts. A reflex is rapid and automatic. At chemical synapses neurotransmitter carries the signal between neurones in one direction. The diagram is a logical schematic, not a drawing of the original anatomical proportions. The reflex response need not wait for conscious decision-making, although information can also travel to the brain.</desc>
