<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1310" viewBox="0 0 1000 1310" role="img" aria-labelledby="q127-title q127-desc">
<title id="q127-title">127 · Follow the penicillin concentration curve</title>
<desc id="q127-desc">Answer D: at 5.0 days. Penicillium fungus is grown in a fermenter to produce penicillin. The source graph has separate curves for living fungal mass and penicillin concentration. Read the product curve: the highest penicillin concentration among the listed collection times is at 5.0 days, even though fungal mass peaks earlier. This original schematic explains the production process and does not redraw or invent values for the source graph. Fungal biomass and antibiotic concentration are different quantities.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1310" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >127 · Follow the penicillin concentration curve</text><text x="500" y="111" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >The required product is penicillin, an antibiotic.</text><text x="500" y="151" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Follow the product-concentration curve in the source graph.</text><rect x="48" y="195" width="904" height="460" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><rect x="191" y="300" width="218" height="280" rx="32" fill="#edf5f8" stroke="#357ca2" stroke-width="4"/><rect x="195" y="431" width="210" height="144" rx="27" fill="#d4e6d3" stroke="none" stroke-width="2"/><rect x="188" y="282" width="224" height="35" rx="5" fill="#d9e3de" stroke="#357ca2" stroke-width="2"/><line x1="300" y1="246" x2="300" y2="517" stroke="#526c62" stroke-width="5"/><line x1="244" y1="464" x2="356" y2="464" stroke="#526c62" stroke-width="7"/><line x1="244" y1="516" x2="356" y2="516" stroke="#526c62" stroke-width="7"/><path d="M 216 486 Q 238 455 262 480 M 238 470 L 242 450" fill="none" stroke="#25614b" stroke-width="3"/><path d="M 323 533 Q 345 502 369 527 M 345 517 L 349 497" fill="none" stroke="#25614b" stroke-width="3"/><path d="M 253 551 Q 275 520 299 545 M 275 535 L 279 515" fill="none" stroke="#25614b" stroke-width="3"/><text x="300" y="621" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Fermenter</text><text x="693" y="280" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Penicillium fungus</text><text x="693" y="323" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >grows using nutrients.</text><line x1="693" y1="355" x2="693" y2="407" stroke="#25614b" stroke-width="4"/><polygon points="693,407 686.0733123668778,393.6950761583107 699.9266876331222,393.6950761583107" fill="#25614b"/><text x="693" y="454" font-size="28" fill="#357ca2" font-weight="700" text-anchor="middle" >Penicillin accumulates</text><text x="693" y="497" font-size="28" fill="#357ca2" font-weight="700" text-anchor="middle" >in the culture medium.</text><line x1="693" y1="518" x2="693" y2="565" stroke="#357ca2" stroke-width="4"/><polygon points="693,565 686.0733123668778,551.6950761583107 699.9266876331222,551.6950761583107" fill="#357ca2"/><text x="693" y="607" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Collect the product.</text><rect x="48" y="727" width="430" height="238" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="263" y="773" font-size="27" fill="#25614b" font-weight="700" text-anchor="middle" >Fungal biomass</text><text x="263" y="833" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Mass of living fungus</text><text x="263" y="876" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Shows growth of the organism</text><text x="263" y="919" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Can peak before product does</text><rect x="522" y="727" width="430" height="238" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="737" y="773" font-size="27" fill="#357ca2" font-weight="700" text-anchor="middle" >Penicillin concentration</text><text x="737" y="833" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Amount of antibiotic per volume</text><text x="737" y="876" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Shows the desired product</text><text x="737" y="919" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Use this curve to choose a time</text><rect x="48" y="1025" width="904" height="130" rx="12" fill="#f7ead9" stroke="none" stroke-width="2"/><text x="500" y="1073" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Source graph: highest penicillin concentration</text><text x="500" y="1116" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >among the four listed times → 5.0 days.</text><text x="500" y="1207" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >This process guide contains no invented concentration or biomass values.</text><rect x="24" y="1234" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1268" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · Collect at 5.0 days</text>
</g></svg>