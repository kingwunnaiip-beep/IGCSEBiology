<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">A protoplast has no wall to resist water entry</title><desc id="desc">Three actual membrane-only cell drawings show an initial protoplast, osmotic swelling and a ruptured membrane in distilled water.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="bluearrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="45" font-size="28" fill="#173f32" text-anchor="start" font-weight="bold">A protoplast has no wall to resist water entry</text><text x="500" y="555" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">Distilled water enters by osmosis; the unsupported protoplast enlarges and may burst.</text><ellipse cx="180" cy="310" rx="65" ry="65" fill="#edf3df" stroke="#24644b" stroke-width="4" /><ellipse cx="165" cy="310" rx="22" ry="22" fill="#d9eaf1" stroke="#537c9a" stroke-width="2" /><ellipse cx="160" cy="280" rx="5" ry="5" fill="#826b98" stroke="#826b98" stroke-width="1" /><ellipse cx="210" cy="345" rx="5" ry="5" fill="#826b98" stroke="#826b98" stroke-width="1" /><ellipse cx="190" cy="270" rx="5" ry="5" fill="#826b98" stroke="#826b98" stroke-width="1" /><ellipse cx="500" cy="310" rx="105" ry="105" fill="#edf3df" stroke="#24644b" stroke-width="4" /><ellipse cx="485" cy="310" rx="22" ry="22" fill="#d9eaf1" stroke="#537c9a" stroke-width="2" /><ellipse cx="480" cy="280" rx="5" ry="5" fill="#826b98" stroke="#826b98" stroke-width="1" /><ellipse cx="530" cy="345" rx="5" ry="5" fill="#826b98" stroke="#826b98" stroke-width="1" /><ellipse cx="510" cy="270" rx="5" ry="5" fill="#826b98" stroke="#826b98" stroke-width="1" /><ellipse cx="500" cy="310" rx="65" ry="65" fill="none" stroke="#24644b" stroke-width="2" stroke-dasharray="7 7" /><path d="M875 236 A105 105 0 1 0 875 384" fill="#e4f0df" stroke="#24644b" stroke-width="4" /><path d="M895 228 L880 252 M882 390 L899 407" fill="none" stroke="#24644b" stroke-width="4" /><ellipse cx="795" cy="310" rx="22" ry="22" fill="#d9eaf1" stroke="#537c9a" stroke-width="2" /><ellipse cx="100" cy="200" rx="6" ry="6" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><ellipse cx="220" cy="190" rx="6" ry="6" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><ellipse cx="380" cy="220" rx="6" ry="6" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><ellipse cx="620" cy="215" rx="6" ry="6" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><ellipse cx="400" cy="440" rx="6" ry="6" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><ellipse cx="610" cy="430" rx="6" ry="6" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><ellipse cx="930" cy="280" rx="6" ry="6" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><ellipse cx="935" cy="335" rx="6" ry="6" fill="#537c9a" stroke="#537c9a" stroke-width="1" /><path d="M325 310 L375 310" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)" /><path d="M638 310 L680 310" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)" /><path d="M385 210 L430 250" fill="none" stroke="#537c9a" stroke-width="3" marker-end="url(#bluearrow)" /><path d="M612 425 L570 390" fill="none" stroke="#537c9a" stroke-width="3" marker-end="url(#bluearrow)" /><text x="180" y="150" font-size="24" fill="#173f32" text-anchor="middle" font-weight="bold">No cell wall</text><text x="180" y="465" font-size="23" fill="#173f32" text-anchor="middle" font-weight="normal">Protoplast</text><text x="500" y="465" font-size="23" fill="#173f32" text-anchor="middle" font-weight="normal">Water enters; cell swells</text><text x="820" y="465" font-size="23" fill="#173f32" text-anchor="middle" font-weight="normal">Membrane ruptures</text><text x="500" y="122" font-size="23" fill="#537c9a" text-anchor="middle" font-weight="normal">Distilled water</text></g></svg>