<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which row matches enzyme, substrate and site of action?</title><desc id="desc">Maltase at the ileum epithelium hydrolyses maltose to two glucose molecules. The enzyme, substrate and site together match row C.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700" text-anchor="start" fill="#193e34">Which row matches enzyme, substrate and site of action?</text><rect x="30" y="125" width="1020" height="245" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="540" y="166" font-size="24" font-weight="700" text-anchor="middle" fill="#193e34">Site of action: ileum epithelium (small intestine)</text><rect x="80" y="210" width="230" height="85" rx="18" fill="#dceadd" stroke="#9fbaab" stroke-width="2"/><text x="195" y="261" font-size="30" font-weight="700" text-anchor="middle" fill="#193e34">Maltose</text><rect x="750" y="210" width="250" height="85" rx="18" fill="#dceadd" stroke="#9fbaab" stroke-width="2"/><text x="875" y="261" font-size="30" font-weight="700" text-anchor="middle" fill="#193e34">2 glucose</text><path d="M330 254 H730" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="231" font-size="24" font-weight="700" text-anchor="middle" fill="#193e34">Maltase</text><text x="530" y="290" font-size="21" font-weight="400" text-anchor="middle" fill="#193e34">Digestion</text><text x="540" y="345" font-size="23" font-weight="700" text-anchor="middle" fill="#193e34">Enzyme + correct substrate + correct site → row C</text><text x="38" y="406" font-size="17" font-weight="400" text-anchor="start" fill="#193e34">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>