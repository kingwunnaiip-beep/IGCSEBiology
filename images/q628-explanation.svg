<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">A septal gap allows ventricular blood to mix</title><desc id="desc">A heart cross-section places deoxygenated blood in the right ventricle and oxygenated blood in the left ventricle. A visible gap in their separating septum permits mixing in the simplified examination model.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="53" font-size="31" text-anchor="start" font-weight="bold" fill="#173f32">A septal gap allows ventricular blood to mix</text><g transform="translate(500 320) scale(1.35)"><path d="M0 140 C-160 65 -190 -85 -100 -130 C-35 -160 -5 -100 0 -65 C10 -110 65 -165 125 -105 C190 -40 125 100 0 140" fill="#e8c5bb" stroke="#8c685c" stroke-width="5"/><path d="M-15 100 C-115 30 -140 -55 -92 -86 C-47 -115 -18 -45 -15 100" fill="#dcecf4" stroke="#537c9a" stroke-width="3"/><path d="M18 100 C115 38 135 -40 95 -78 C58 -112 25 -75 18 100" fill="#efd2cc" stroke="#bb6066" stroke-width="3"/><path d="M0 -65 L0 140" fill="none" stroke="#f9f3df" stroke-width="18"/><rect x="-20" y="-3" width="40" height="37" rx="0" fill="#d6c3d5" stroke="none" stroke-width="0"/></g><path d="M420 325 L490 325" fill="none" stroke="#537c9a" stroke-width="5" marker-end="url(#blueArrow)"/><path d="M590 340 L505 340" fill="none" stroke="#bb6066" stroke-width="5" marker-end="url(#arrow)"/><text x="185" y="230" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">Right ventricle</text><text x="185" y="265" font-size="24" text-anchor="middle" font-weight="normal" fill="#537c9a">Deoxygenated</text><path d="M315 250 L380 310" fill="none" stroke="#537c9a" stroke-width="2" marker-end="url(#blueArrow)"/><text x="805" y="230" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">Left ventricle</text><text x="805" y="265" font-size="24" text-anchor="middle" font-weight="normal" fill="#bb6066">Oxygenated</text><path d="M690 250 L620 310" fill="none" stroke="#bb6066" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="120" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">Gap in the ventricular septum</text><path d="M500 140 L500 315" fill="none" stroke="#24644b" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="553" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">C: oxygenated left-ventricle blood mixes with right-ventricle blood</text><text x="500" y="586" font-size="20" text-anchor="middle" font-weight="normal" fill="#173f32">Simplified examination model; the defect is between the ventricles.</text></g></svg>