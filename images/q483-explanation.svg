<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710" role="img" aria-labelledby="q483-title q483-desc">
<title id="q483-title">Stirring distributes heat through a fermenter</title>
<desc id="q483-desc">A schematic vessel shows paddles rotating on a central shaft. Circulation moves culture medium between warmer and cooler regions, preventing local hot spots. Separate equipment supplies oxygen, measures pH and sterilises the medium.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
