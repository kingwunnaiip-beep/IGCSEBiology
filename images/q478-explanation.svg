<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="q478-title q478-desc">
<title id="q478-title">Source and sink change with the season</title>
<desc id="q478-desc">Two schematic plants contrast spring and summer. In spring, stored root reserves are exported through phloem to young leaves, making roots a source and shoots sinks. In summer, mature leaves export sugars to storage roots, making the leaves a source and roots a sink.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="700" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Source and sink change with the season</text><rect x="30" y="90" width="450" height="390" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="255.0" y="128" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Spring: reserves mobilised</text><rect x="520" y="90" width="450" height="390" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="745.0" y="128" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Summer: reserves stored</text><line x1="255" y1="365" x2="255" y2="235" stroke="#25614b" stroke-width="8"/><ellipse cx="199" cy="240" rx="42" ry="18" fill="#b9d39b" stroke="#25614b" stroke-width="3"/><ellipse cx="311" cy="240" rx="42" ry="18" fill="#b9d39b" stroke="#25614b" stroke-width="3"/><path d="M255 365 Q190 395 155 425 M255 365 Q320 395 355 425 M255 365 L255 438" fill="none" stroke="#25614b" stroke-width="7"/><ellipse cx="255" cy="395" rx="36" ry="25" fill="#d5bc8b" stroke="#25614b" stroke-width="2"/><line x1="385" y1="395" x2="385" y2="245" stroke="#357ca2" stroke-width="7"/><polygon points="385,245 391.92668763312224,258.3049238416893 378.07331236687776,258.3049238416893" fill="#357ca2"/><text x="75" y="169" font-size="21" fill="#173d31" font-weight="400" text-anchor="start" >young leaves = sinks</text><text x="75" y="199" font-size="21" fill="#173d31" font-weight="400" text-anchor="start" >roots export stored reserves</text><text x="255" y="465" font-size="21" fill="#526c62" font-weight="400" text-anchor="middle" >phloem carries assimilates</text><line x1="745" y1="365" x2="745" y2="235" stroke="#25614b" stroke-width="8"/><ellipse cx="689" cy="240" rx="61" ry="28" fill="#b9d39b" stroke="#25614b" stroke-width="3"/><ellipse cx="801" cy="240" rx="61" ry="28" fill="#b9d39b" stroke="#25614b" stroke-width="3"/><path d="M745 365 Q680 395 645 425 M745 365 Q810 395 845 425 M745 365 L745 438" fill="none" stroke="#25614b" stroke-width="7"/><ellipse cx="745" cy="395" rx="36" ry="25" fill="#d5bc8b" stroke="#25614b" stroke-width="2"/><line x1="875" y1="245" x2="875" y2="395" stroke="#357ca2" stroke-width="7"/><polygon points="875,395 868.0733123668778,381.6950761583107 881.9266876331222,381.6950761583107" fill="#357ca2"/><text x="565" y="169" font-size="21" fill="#173d31" font-weight="400" text-anchor="start" >mature leaves = sources</text><text x="565" y="199" font-size="21" fill="#173d31" font-weight="400" text-anchor="start" >roots receive for storage</text><text x="745" y="465" font-size="21" fill="#526c62" font-weight="400" text-anchor="middle" >phloem carries assimilates</text><text x="500" y="518" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Source exports; sink receives.</text><text x="500" y="548" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Growing spring shoots depend on reserves from roots.</text><rect x="24" y="624" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="658" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Roots are most active as a source in spring: A.</text>
</g></svg>