xt-anchor="middle" >Energy is transferred as consumers eat their food.</text><rect x="50" y="692" width="900" height="126" rx="12" fill="#edf5f8" stroke="none" stroke-width="2"/><text x="500" y="735" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Heavy harvesting: prawns ↓</text><text x="500" y="780" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Zooplankton ↑ because fewer prawns eat them.</text><text x="500" y="866" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Predicted population changes</text><rect x="50" y="892" width="900" height="347" rx="12" fill="#fffdf7" stroke="#b9cdbd" stroke-width="2"/><rect x="51" y="893" width="898" height="65" rx="10" fill="#eff5e8" stroke="none" stroke-width="2"/><line x1="50" y1="958" x2="950" y2="958" stroke="#b9cdbd" stroke-width="1.5"/><line x1="50" y1="1052" x2="950" y2="1052" stroke="#b9cdbd" stroke-width="1.5"/><line x1="50" y1="1146" x2="950" y2="1146" stroke="#b9cdbd" stroke-width="1.5"/><line x1="292" y1="892" x2="292" y2="1239" stroke="#b9cdbd" stroke-width="1.5"/><line x1="509" y1="892" x2="509" y2="1239" stroke="#b9cdbd" stroke-width="1.5"/><text x="170" y="935" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Population</text><text x="400" y="935" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Change</text><text x="729" y="935" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Reason</text><text x="170" y="1015" font-size="24" fill="#173d31" font-weight="700" text-anchor="middle" >Fish</text><text x="400" y="1015" font-size="25" fill="#b94a43" font-weight="700" text-anchor="middle" >↓ decrease</text><text x="729" y="1015" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Less food: fewer prawns</text><text x="170" y="1109" font-size="24" fill="#173d31" font-weight="700" text-anchor="middle" >Mussels</text><text x="400" y="1109" font-size="25" fill="#25614b" font-weig