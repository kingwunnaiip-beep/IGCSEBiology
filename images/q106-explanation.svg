<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080" role="img" aria-labelledby="q106-title q106-desc">
<title id="q106-title">106 · Haploid nuclei contain one chromosome set</title>
<desc id="q106-desc">Answer C: four chromosomes. The original diploid nucleus has eight chromosomes arranged as four homologous pairs. A haploid nucleus has one chromosome from each pair, so its number is eight divided by two, or four. This original schematic shows a diploid nucleus with four colour-coded pairs of simple chromosomes and a haploid nucleus with one of each type. Colours identify pairs, not measured properties. The source question asks for chromosomes, not chromatids. Meiosis halves the number of chromosome sets.</desc>
