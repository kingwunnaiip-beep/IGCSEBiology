<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="q22-title q22-desc"><title id="q22-title">Right ventricle pumps to lungs</title><desc id="q22-desc">Blood flows from the right ventricle into the pulmonary artery. The pulmonary semilunar valve is open, and the tricuspid valve between right atrium and ventricle is closed.</desc><defs><marker id="q22-green-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#397359"/></marker><marker id="q22-blue-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3d79a0"/></marker><marker id="q22-red-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85c5e"/></marker><marker id="q22-gold-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b88838"/></marker></defs><rect width="640" height="420" rx="20" fill="#f8faf6"/><g font-family="Arial, Helvetica, sans-serif"><text x="320" y="42" font-size="32" text-anchor="middle" fill="#223c35" font-weight="bold">Right ventricle pumps to lungs</text><rect x="70" y="105" width="185" height="105" rx="23" fill="#dcecf4" stroke="#3d79a0" stroke-width="3"/><rect x="70" y="245" width="185" height="125" rx="23" fill="#dcecf4" stroke="#3d79a0" stroke-width="3"/><text x="162" y="150" font-size="30" text-anchor="middle" fill="#223c35" font-weight="normal">Right</text><text x="162" y="185" font-size="30" text-anchor="middle" fill="#223c35" font-weight="normal">atrium</text><text x="162" y="295" font-size="30" text-anchor="middle" fill="#223c35" font-weight="normal">Right</text><text x="162" y="332" font-size="30" text-anchor="middle" fill="#223c35" font-weight="normal">ventricle</text><path d="M 255 310 H 340 V 120 H 500" stroke="#3d79a0" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 258 310 H 340 V 120 H 500" stroke="#3d79a0" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#q22-blue-arrow)"/><path d="M 78 220 L 162 232 L 247 220" stroke="#223c35" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 78 236 L 162 232 L 247 236" stroke="#223c35" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 328 226 L 328 198 M 352 226 L 352 198" stroke="#223c35" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 470 113 L 484 120 L 470 127 Z" stroke="none" stroke-width="0" fill="#f8faf6" stroke-linecap="round" stroke-linejoin="round" /><path d="M 333 171 L 340 157 L 347 171 Z" stroke="none" stroke-width="0" fill="#f8faf6" stroke-linecap="round" stroke-linejoin="round" /><text x="493" y="88" font-size="28" text-anchor="middle" fill="#223c35" font-weight="normal">To lungs</text><text x="471" y="195" font-size="28" text-anchor="middle" fill="#223c35" font-weight="bold">Pulmonary</text><text x="471" y="229" font-size="28" text-anchor="middle" fill="#223c35" font-weight="normal">semilunar</text><text x="471" y="263" font-size="28" text-anchor="middle" fill="#223c35" font-weight="normal">valve open</text><path d="M 375 235 H 357" stroke="#b8cbbd" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="474" y="328" font-size="28" text-anchor="middle" fill="#223c35" font-weight="bold">Tricuspid</text><text x="474" y="362" font-size="28" text-anchor="middle" fill="#223c35" font-weight="normal">valve closed</text><path d="M 375 337 L 279 232 H 249" stroke="#b8cbbd" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g></svg>