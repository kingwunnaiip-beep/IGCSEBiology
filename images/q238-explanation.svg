<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="q238-title q238-desc">
<title id="q238-title">Nervous control: fast action, short effect</title>
<desc id="q238-desc">General IGCSE comparison of nervous and hormonal control. Nervous control uses impulses along neurones and is generally fast with short-lived effects. Hormones travel in the blood and generally act more slowly with longer-lasting effects. This is qualitative, with no measured timings.</desc>
