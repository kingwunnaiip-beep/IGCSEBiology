614b" stroke-width="2"/><text x="712.0" y="383" font-size="35" fill="#173d31" font-weight="700" text-anchor="middle" >Pp</text><text x="712.0" y="433" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Extra toes</text><text x="712.0" y="483" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >25%</text><rect x="169" y="526" width="114" height="200" rx="0" fill="#dfead5" stroke="#25614b" stroke-width="2"/><text x="226.0" y="637" font-size="33" fill="#173d31" font-weight="700" text-anchor="middle" >p</text><rect x="283" y="526" width="286" height="200" rx="0" fill="#edf3f6" stroke="#25614b" stroke-width="2"/><text x="426.0" y="583" font-size="35" fill="#173d31" font-weight="700" text-anchor="middle" >Pp</text><text x="426.0" y="633" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Extra toes</text><text x="426.0" y="683" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >25%</text><rect x="569" y="526" width="286" height="200" rx="0" fill="#d9ebcd" stroke="#25614b" stroke-width="3"/><text x="712.0" y="583" font-size="35" fill="#25614b" font-weight="700" text-anchor="middle" >pp</text><text x="712.0" y="633" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >No extra toes</text><text x="712.0" y="683" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >25%</text><rect x="61" y="773" width="878" height="107" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500" y="814" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Only pp gives no extra toes.</text><text x="500" y="858" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Probability = 1 ÷ 4 = 0.25 = 25%</text><text x="500" y="930" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Expected genotypes: 1 PP : 2 Pp : 1 pp</text><text x="500" y="973" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Expected phenotypes: 3 extra toes : 1 normal</text><text x="500" y="1020" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Each kitten is independent; a litter need not match these ratios.</text><rect x="24" y="1054" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1088" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer B · 0.25 probability of no extra toes</text>
