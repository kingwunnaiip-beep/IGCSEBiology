<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Aquatic leaves contain large internal air spaces</title><desc id="desc">Schematic section of a floating hydrophyte leaf above water shows large air spaces within spongy mesophyll. The spaces aid buoyancy and allow internal gas movement. The diagram is not a measurement or a source exam figure.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#327153"/></marker></defs><rect width="960" height="540" rx="24" fill="#faf9ef"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="49" text-anchor="start" fill="#163d31" font-size="30" font-weight="bold">Aquatic leaves contain large internal air spaces</text><text x="36" y="87" text-anchor="start" fill="#163d31" font-size="23" font-weight="normal">Large internal air spaces help a leaf remain buoyant.</text><rect x="55" y="299" width="849" height="131" rx="12" fill="#dceceb" stroke="#a4bcb3" stroke-width="2"/><text x="788" y="406" text-anchor="middle" fill="#163d31" font-size="24" font-weight="normal">water</text><path d="M91 206 Q480 159 865 206 L865 306 Q480 347 91 306Z" fill="#b9d6a6" stroke="#327153" stroke-width="4"/><ellipse cx="179" cy="257" rx="48" ry="37" fill="#faf9ef" stroke="#327153" stroke-width="2"/><ellipse cx="322" cy="269" rx="65" ry="41" fill="#faf9ef" stroke="#327153" stroke-width="2"/><ellipse cx="492" cy="259" rx="65" ry="40" fill="#faf9ef" stroke="#327153" stroke-width="2"/><ellipse cx="652" cy="264" rx="59" ry="39" fill="#faf9ef" stroke="#327153" stroke-width="2"/><ellipse cx="793" cy="255" rx="43" ry="35" fill="#faf9ef" stroke="#327153" stroke-width="2"/><path d="M497 219 L555 144" fill="none" stroke="#327153" stroke-width="3"/><text x="566" y="142" text-anchor="start" fill="#163d31" font-size="24" font-weight="normal">large air space</text><text x="190" y="385" text-anchor="middle" fill="#163d31" font-size="23" font-weight="normal">leaf section</text><rect x="161" y="451" width="640" height="38" rx="18" fill="#e1eddf" stroke="#327153" stroke-width="2"/><text x="481" y="477" text-anchor="middle" fill="#163d31" font-size="23" font-weight="normal">Air spaces also permit internal gas movement.</text><text x="36" y="517" text-anchor="start" fill="#587064" font-size="17" font-weight="normal">Original teaching schematic • not to scale</text></g></svg>