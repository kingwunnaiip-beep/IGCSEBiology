<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="q257-title q257-desc">
<title id="q257-title">Water potential determines the state of each cell</title>
<desc id="q257-desc">Distilled water and the dilute sucrose solution have higher water potential than the plant cytoplasm. Net water entry makes the cells turgid. The concentrated solution has lower water potential; net water loss causes the membrane and cytoplasm to pull away from the cell wall, producing plasmolysis.</desc>
