<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="q317-title q317-desc">
<title id="q317-title">Why amylase stops working in the stomach</title>
<desc id="q317-desc">In the mouth, salivary amylase catalyses starch breakdown. The acidic stomach has a pH unsuitable for this amylase, so the enzyme loses activity. Both regions are at approximately body temperature; other enzymes such as stomach protease can work in the stomach.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="650" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Why amylase stops working in the stomach</text><rect x="50" y="125" width="450" height="240" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="275.0" y="167" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Mouth</text><text x="275.0" y="215" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Salivary amylase is active.</text><text x="275.0" y="255" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Starch is broken down</text><text x="275.0" y="295" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >into smaller sugars.</text><rect x="600" y="125" width="450" height="240" rx="12" fill="#fbece7" stroke="#b94a43" stroke-width="2"/><text x="825.0" y="167" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Stomach</text><text x="825.0" y="215" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Acidic conditions</text><text x="825.0" y="255" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >are unsuitable for</text><text x="825.0" y="295" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >salivary amylase.</text><line x1="510" y1="245" x2="590" y2="245" stroke="#357ca2" stroke-width="4"/><polygon points="590,245 576.6950761583107,251.92668763312224 576.6950761583107,238.07331236687776" fill="#357ca2"/><text x="550" y="422" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >pH affects the enzyme’s active site and activity</text><text x="550" y="477" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Starch digestion is not all completed in the mouth.</text><text x="550" y="519" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >A stomach protease can work in these acidic conditions.</text><rect x="24" y="574" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="608" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B — stomach pH is unsuitable for amylase</text>
</g></svg>