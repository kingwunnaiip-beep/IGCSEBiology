<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="q262-title q262-desc">
<title id="q262-title">Progesterone rises after ovulation</title>
<desc id="q262-desc">The source line B is low before day 14, rises after ovulation, peaks in the second half of the cycle and falls near day 28. This pattern identifies progesterone, released mainly by the corpus luteum after ovulation to maintain the uterus lining. The graph is schematic and has no numerical concentration scale.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="800" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Progesterone rises after ovulation</text><text x="95" y="130" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >Relative concentration</text><line x1="130" y1="150" x2="130" y2="470" stroke="#25614b" stroke-width="3"/><line x1="130" y1="470" x2="1020" y2="470" stroke="#25614b" stroke-width="3"/><path d="M130 462 C280 458 430 465 500 448 C590 420 630 300 745 245 C865 205 950 288 1020 460" fill="none" stroke="#25614b" stroke-width="7"/><line x1="575" y1="150" x2="575" y2="470" stroke="#526c62" stroke-width="2" stroke-dasharray="8 8"/><line x1="130" y1="470" x2="130" y2="481" stroke="#25614b" stroke-width="3"/><text x="130" y="515" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >0</text><line x1="575" y1="470" x2="575" y2="481" stroke="#25614b" stroke-width="3"/><text x="575" y="515" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >14</text><line x1="1020" y1="470" x2="1020" y2="481" stroke="#25614b" stroke-width="3"/><text x="1020" y="515" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >28</text><text x="575" y="555" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Ovulation</text><text x="880" y="190" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >B — progesterone</text><line x1="880" y1="205" x2="845" y2="240" stroke="#25614b" stroke-width="3"/><text x="575" y="600" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Day of the cycle (as in the source)</text><rect x="65" y="635" width="990" height="105" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="560.0" y="675" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >After ovulation: corpus luteum releases progesterone</text><text x="560.0" y="717" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Progesterone helps maintain the lining of the uterus.</text><text x="560" y="775" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Schematic only: no numerical concentration scale or exact peak day is given.</text>
