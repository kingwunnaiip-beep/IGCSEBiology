<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">The cell wall supports; the membrane controls active transport</title><desc id="desc">A plant cell has a thick outer cell wall and a thinner membrane inside it. An enlarged membrane transport protein moves particles using respiratory energy; the wall provides mechanical support.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">The cell wall supports; the membrane controls active</text><text x="35" y="84" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">transport</text><rect x="95" y="185" width="435" height="290" rx="22" fill="#d8e6c7" stroke="#24644b" stroke-width="10"/><rect x="110" y="200" width="405" height="260" rx="17" fill="#f7f3da" stroke="#537c9a" stroke-width="3"/><rect x="145" y="235" width="315" height="195" rx="35" fill="#d8e8ed" stroke="#537c9a" stroke-width="3"/><ellipse cx="475" cy="250" rx="22" ry="31" fill="#24644b" stroke="#24644b" stroke-width="2"/><text x="135" y="142" font-size="26" fill="#173f32" text-anchor="start" font-weight="700">Rigid cellulose cell wall</text><path d="M365 150 L170 185" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="740" y="180" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">Cell membrane</text><path d="M620 190 L515 215" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><rect x="650" y="270" width="240" height="120" rx="10" fill="#dce9ed" stroke="#537c9a" stroke-width="3"/><ellipse cx="770" cy="330" rx="27" ry="62" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><circle cx="680" cy="300" r="7" fill="#c5824b" stroke="#c5824b" stroke-width="3"/><circle cx="710" cy="355" r="7" fill="#c5824b" stroke="#c5824b" stroke-width="3"/><circle cx="840" cy="300" r="7" fill="#c5824b" stroke="#c5824b" stroke-width="3"/><circle cx="855" cy="340" r="7" fill="#c5824b" stroke="#c5824b" stroke-width="3"/><circle cx="875" cy="365" r="7" fill="#c5824b" stroke="#c5824b" stroke-width="3"/><path d="M700 330 H840" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M770 225 V263" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="770" y="220" font-size="23" fill="#173f32" text-anchor="middle" font-weight="700">Respiratory energy</text><text x="770" y="450" font-size="22" fill="#173f32" text-anchor="middle" font-weight="400">Transport proteins move substances.</text><text x="310" y="513" font-size="28" fill="#173f32" text-anchor="middle" font-weight="700">Wall: support</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">B: membrane — active transport; wall — support</text></g></svg>