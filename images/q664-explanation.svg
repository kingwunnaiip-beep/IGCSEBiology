<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">One species can feed at two trophic levels</title><desc id="desc">An ocean web connects producers to four herbivores, then otter, seal, sea lion and orca. Orca also eats the other predators and is the sole tertiary consumer.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">One species can feed at two trophic levels</text><text x="120" y="120" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">Producers</text><text x="385" y="120" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">Primary consumers</text><text x="665" y="120" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">Secondary: 4</text><text x="875" y="120" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">Tertiary: 1</text><g transform="translate(120 450) rotate(0) scale(0.9)"><path d="M0 0 Q-80 -110 0 -160 Q90 -80 0 0" fill="#e4f0df" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 0 Q5 -75 0 -145" fill="none" stroke="#24644b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -35 L-30 -60" fill="none" stroke="#24644b" stroke-width="2"/><path d="M0 -60 L-30 -85" fill="none" stroke="#24644b" stroke-width="2"/><path d="M0 -85 L-30 -110" fill="none" stroke="#24644b" stroke-width="2"/><path d="M0 -110 L-30 -135" fill="none" stroke="#24644b" stroke-width="2"/></g><text x="120" y="495" font-size="20" text-anchor="middle" fill="#173f32">Algae / plants</text><circle cx="385" 