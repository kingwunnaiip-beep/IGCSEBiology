<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="q308-title q308-desc">
<title id="q308-title">Starch requires both chlorophyll and light</title>
<desc id="q308-desc">A destarched variegated leaf is tested after light exposure. Green uncovered region C has chlorophyll and receives light, so it produces starch. Covered regions and the white region do not.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="760" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Starch requires both chlorophyll and light</text><text x="560" y="108" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >After 48 h in darkness, previous starch has been removed.</text><text x="480" y="170" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Receives light</text><text x="875" y="170" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Covered by black paper</text><text x="45" y="285" font-size="26" fill="#173d31" font-weight="700" text-anchor="start" >Green tissue</text><text x="45" y="327" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >Chlorophyll present</text><text x="45" y="465" font-size="26" fill="#173d31" font-weight="700" text-anchor="start" >White tissue</text><text x="45" y="507" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >Chlorophyll absent</text><rect x="285" y="205" width="385" height="145" rx="12" fill="#d9ead3" stroke="#25614b" stroke-width="2"/><text x="477.5" y="248" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Starch made</text><text x="477.5" y="296" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Region C</text><rect x="700" y="205" width="385" height="145" rx="12" fill="#f1f0eb" stroke="#25614b" stroke-width="2"/><text x="892.5" y="248" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >No starch made</text><text x="892.5" y="296" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Light excluded</text><rect x="285" y="385" width="385" height="145" rx="12" fill="#f1f0eb" stroke="#25614b" stroke-width="2"/><text x="477.5" y="428" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >No starch made</text><text x="477.5" y="476" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >No chlorophyll</text><rect x="700" y="385" width="385" height="145" rx="12" fill="#f1f0eb" stroke="#25614b" stroke-width="2"/><text x="892.5" y="428" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >No starch made</text><text x="892.5" y="476" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Neither requirement met</text><text x="560" y="600" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Only the green, uncovered tissue can photosynthesise.</text><text x="560" y="642" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >This region would turn blue-black with iodine.</text><rect x="24" y="684" width="1072" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="560.0" y="718" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Green region exposed to light = C</text>
</g></svg>