<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">An enzyme is a reusable protein catalyst</title><desc id="desc">A substrate fits a complementary active-site notch in a folded protein. After catalysis, two products leave while the drawn enzyme has the same outline as before.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">An enzyme is a reusable protein catalyst</text><g transform="translate(240 325) scale(1.6)"><path d="M0 -70 C75 -80 112 10 65 65 C25 105 -80 65 -78 -5 C-80 -45 -45 -70 -15 -68 L-15 -20 L20 -20 L20 -68 Z" fill="#e4f0df" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="216.0" y="140.0" width="51.0" height="63.0" rx="3" fill="#e7b479" stroke="#c5824b" stroke-width="3"/><path d="M240 215 V265" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(740 325) scale(1.6)"><path d="M0 -70 C75 -80 112 10 65 65 C25 105 -80 65 -78 -5 C-80 -45 -45 -70 -15 -68 L-15 -20 L20 -20 L20 -68 Z" fill="#e4f0df" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M440 325 H555" fill="none" stroke="#24644b" stroke-width="5" marker-end="url(#arrow)"/><rect x="705" y="178" width="25" height="26" rx="3" fill="#e2b780" stroke="#c5824b" stroke-width="2"/><rect x="753" y="178" width="25" height="26" rx="3" fill="#e2b780" stroke="#c5824b" stroke-width="2"/><path d="M735 245 V215" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="240" y="125" font-size="28" fill="#173f32" text-anchor="middle" font-weight="700">Complementary fit</text><text x="740" y="125" font-size="27" fill="#173f32" text-anchor="middle" font-weight="700">Enzyme remains unchanged</text><text x="235" y="485" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">Folded protein enzyme</text><text x="740" y="485" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">Products leave; enzyme reused</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">A: same shape — no; used up — no; protein — yes</text></g></svg>