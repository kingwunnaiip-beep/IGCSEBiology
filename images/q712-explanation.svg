<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">The umbilical vein carries oxygen towards the fetus</title><desc id="desc">A placenta connects to a curled fetus by an umbilical cord. The green vein arrow runs from placenta to fetus; blue return arteries run towards the placenta.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">The umbilical vein carries oxygen towards the fetus</text><ellipse cx="200" cy="310" rx="105" ry="165" fill="#e6bcab" stroke="#c5824b" stroke-width="5"/><path d="M145 180 Q240 200 160 220" fill="none" stroke="#c5824b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 210 Q240 230 160 250" fill="none" stroke="#c5824b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 240 Q240 260 160 280" fill="none" stroke="#c5824b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 270 Q240 290 160 310" fill="none" stroke="#c5824b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 300 Q240 320 160 340" fill="none" stroke="#c5824b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 330 Q240 350 160 370" fill="none" stroke="#c5824b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 360 Q240 380 160 400" fill="none" stroke="#c5824b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 390 Q240 410 160 430" fill="none" stroke="#c5824b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 420 Q240 440 160 460" fill="none" stroke="#c5824b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M285 285 C430 230 490 325 620 325" fill="none" stroke="#c5824b" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M285 278 C430 223 490 318 620 318" fill="none" stroke="#24644b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M285 299 C430 244 490 339 620 339" fill="none" stroke="#537c9a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M365 268 Q425 260 470 290" fill="none" stroke="#24644b" stroke-width="5" marker-end="url(#arrow)"/><path d="M490 336 Q425 295 370 307" fill="none" stroke="#537c9a" stroke-width="3" marker-end="url(#arrow)"/><circle cx="740" cy="225" r="62" fill="#f2dcc0" stroke="#c5824b" stroke-width="4"/><path d="M720 285 C650 300 630 380 683 430 C740 480 830 432 812 365 Q800 320 765 300 M680 400 Q725 380 768 420 M711 302 Q665 320 675 355" fill="#f2dcc0" stroke="#c5824b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M785 220 L800 230 L783 236" fill="none" stroke="#c5824b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="762" cy="210" r="4" fill="#c5824b" stroke="#c5824b" stroke-width="3"/><text x="200" y="125" font-size="28" fill="#173f32" text-anchor="middle" font-weight="700">Placenta</text><text x="754" y="125" font-size="28" fill="#173f32" text-anchor="middle" font-weight="700">Fetus</text><text x="370" y="420" font-size="25" fill="#173f32" text-anchor="start" font-weight="700">Umbilical vein carries</text><text x="370" y="451" font-size="25" fill="#173f32" text-anchor="start" font-weight="700">oxygenated blood to fetus.</text><text x="500" y="505" font-size="24" fill="#173f32" text-anchor="middle" font-weight="400">Oxygen diffuses from maternal to fetal blood.</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">D: carry oxygen to the fetus</text></g></svg>