<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1160" viewBox="0 0 1000 1160" role="img" aria-labelledby="q200-title q200-desc">
<title id="q200-title">200 · Resistant weeds can make herbicides less useful</title>
<desc id="q200-desc">Answer B. A qualitative possible gene-flow pathway shows an herbicide-resistant crop flowering, then cross-pollination with a compatible related weed, then resistant weed offspring. This is possible only where the plants can cross and is not inevitable. Resistant weeds may survive spraying and become harder to control. The source asks about a possible disadvantage; reduced competition and increased crop yield are benefits, while inheritance of the crop gene is intended.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
