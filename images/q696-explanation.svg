<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which oil-drop and enzyme combination digests the oil fastest?</title><desc id="desc">Correct enzyme: lipase: Digests oil; trypsin digests protein; Smaller drops; same mass: Greater total surface area for lipase action; Combination C: Lipase and smaller drops give the fastest digestion</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Which oil-drop and enzyme combination digests the oil fastest?</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="50" y="190" font-size="23" font-weight="700">Correct enzyme: lipase</text><text x="50" y="276" font-size="21" font-weight="400">Digests oil; trypsin digests</text><text x="50" y="303" font-size="21" font-weight="400">protein</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="405" y="190" font-size="23" font-weight="700">Smaller drops; same</text><text x="405" y="219" font-size="23" font-weight="700">mass</text><text x="405" y="276" font-size="21" font-weight="400">Greater total surface area for</text><text x="405" y="303" font-size="21" font-weight="400">lipase action</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="760" y="190" font-size="23" font-weight="700">Combination C</text><text x="760" y="276" font-size="21" font-weight="400">Lipase and smaller drops</text><text x="760" y="303" font-size="21" font-weight="400">give the fastest digestion</text><text x="362.5" y="255" text-anchor="middle" font-size="34" font-weight="700">+</text><path d="M700 245 H731" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)"/><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>