<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1130" viewBox="0 0 1000 1130" role="img" aria-labelledby="q162-title q162-desc">
<title id="q162-title">162 · Starch is an energy store</title>
<desc id="q162-desc">Answer A: plants store energy in starch. This original conceptual flow diagram begins with glucose from photosynthesis and separates four carbohydrate roles: starch for storage, cellulose for cell walls, sucrose for phloem transport, and glucose as a respiration substrate. Stored starch can be broken down to provide sugars later. The arrows represent biochemical uses rather than measured carbon transfers or reaction rates.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1130" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >162 · Starch is an energy store</text><rect x="250" y="143" width="500" height="140" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="185" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Photosynthesis makes glucose</text><text x="500.0" y="227" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Plants use it in several ways.</text><line x1="500" y1="286" x2="500" y2="355" stroke="#357ca2" stroke-width="4"/><polygon points="500,355 493.07331236687776,341.6950761583107 506.92668763312224,341.6950761583107" fill="#357ca2"/><rect x="75" y="375" width="850" height="150" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="417" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Starch → energy storage</text><text x="500.0" y="459" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Large, insoluble carbohydrate kept in cells.</text><line x1="500" y1="529" x2="500" y2="598" stroke="#25614b" stroke-width="4"/><polygon points="500,598 493.07331236687776,584.6950761583107 506.92668763312224,584.6950761583107" fill="#25614b"/><rect x="175" y="618" width="650" height="125" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="660" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Later: starch is broken down to sugars</text><text x="500.0" y="702" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Glucose can then be used in respiration.</text><text x="500" y="800" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Separate the other carbohydrate roles</text><rect x="50" y="837" width="280" height="151" rx="12" fill="#f5efdf" stroke="#daa958" stroke-width="2"/><text x="190.0" y="879" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Cellulose</text><text x="190.0" y="921" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Builds cell walls</text><rect x="360" y="837" width="280" height="151" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="879" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Sucrose</text><text x="500.0" y="921" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Travels in phloem</text><rect x="670" y="837" width="280" height="151" rx="12" fill="#f5efdf" stroke="#daa958" stroke-width="2"/><text x="810.0" y="879" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Glucose</text><text x="810.0" y="921" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Respiration substrate</text><text x="500" y="1034" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Conceptual pathways; no measured quantities are implied.</text><rect x="24" y="1054" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1088" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer A · Energy storage</text>
</g></svg>