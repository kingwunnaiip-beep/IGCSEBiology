<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="q326-title q326-desc">
<title id="q326-title">The plant-cell clues are Q and S</title>
<desc id="q326-desc">Schematic plant cell. Q points exactly to the thick outer cell wall. S points to a chloroplast. Both distinguish this photosynthetic plant cell from a typical animal cell; nucleus and cytoplasm are shared.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
