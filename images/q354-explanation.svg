<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" role="img" aria-labelledby="q354-title q354-desc">
<title id="q354-title">Less coal burning means less sulfur dioxide</title>
<desc id="q354-desc">Sulfur impurities in coal react with oxygen when coal is burned, releasing sulfur dioxide. Fewer coal-powered power stations burn less coal, reducing a major sulfur dioxide source. No measured contribution of each policy is invented.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="740" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Less coal burning means less sulfur dioxide</text><rect x="70" y="115" width="415" height="155" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="277.5" y="155" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Coal contains sulfur</text><text x="277.5" y="198" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Fuel is burned in air</text><text x="277.5" y="238" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >at a power station</text><line x1="500" y1="193" x2="598" y2="193" stroke="#25614b" stroke-width="4"/><polygon points="598,193 584.6950761583107,199.92668763312224 584.6950761583107,186.07331236687776" fill="#25614b"/><rect x="615" y="115" width="415" height="155" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="822.5" y="155" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Sulfur dioxide released</text><text x="822.5" y="198" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Sulfur + oxygen → SO₂</text><text x="822.5" y="238" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Can cause acid rain</text><rect x="70" y="360" width="415" height="155" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="277.5" y="400" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Fewer coal stations</text><text x="277.5" y="443" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Less coal is burned</text><text x="277.5" y="483" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Less sulfur is oxidised</text><line x1="500" y1="438" x2="598" y2="438" stroke="#25614b" stroke-width="4"/><polygon points="598,438 584.6950761583107,444.92668763312224 584.6950761583107,431.07331236687776" fill="#25614b"/><rect x="615" y="360" width="415" height="155" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="822.5" y="400" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Lower SO₂ emissions</text><text x="822.5" y="443" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >A major source is reduced</text><text x="822.5" y="483" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Matches option A</text><text x="550" y="583" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Wind generation can help replace fossil fuels.</text><text x="550" y="623" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >The direct source named here is coal combustion.</text><rect x="24" y="664" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="698" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Fewer coal-powered power stations → A</text>
</g></svg>