<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Numbers depend on organism size and parasitism</title><desc id="desc">Two labelled four-level bar pyramids compare the same tree, insect, bird and flea chain. Biomass narrows upward. Numbers have a narrow tree base, wide insect level, narrow bird level and wider flea level. Widths are qualitative, not measured values.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2e7656"/></marker></defs><rect width="1000" height="620" rx="24" fill="#fbf9ec"/><g font-family="sans-serif" fill="#173e32"><text x="42" y="55" font-size="31" text-anchor="start" fill="#173e32">Numbers depend on organism size and parasitism</text><text x="250" y="112" font-size="25" text-anchor="middle" fill="#173e32">Biomass: total dry mass</text><text x="750" y="112" font-size="25" text-anchor="middle" fill="#173e32">Numbers: individuals</text><rect x="236.0" y="160" width="28" height="55" fill="#8dbd75" stroke="#2e7656" stroke-width="2"/><text x="250" y="196" font-size="21" text-anchor="middle" fill="#173e32">fleas</text><rect x="675.0" y="160" width="150" height="55" fill="#8dbd75" stroke="#2e7656" stroke-width="2"/><text x="978" y="196" font-size="20" text-anchor="end" fill="#173e32">fleas</text><rect x="215.0" y="243" width="70" height="55" fill="#8dbd75" stroke="#2e7656" stroke-width="2"/><text x="250" y="279" font-size="21" text-anchor="middle" fill="#173e32">birds</text><rect x="735.0" y="243" width="30" height="55" fill="#8dbd75" stroke="#2e7656" stroke-width="2"/><text x="978" y="279" font-size="20" text-anchor="end" fill="#173e32">birds</text><rect x="150.0" y="326" width="200" height="55" fill="#8dbd75" stroke="#2e7656" stroke-width="2"/><text x="250" y="362" font-size="21" text-anchor="middle" fill="#173e32">insects</text><rect x="550.0" y="326" width="400" height="55" fill="#8dbd75" stroke="#2e7656" stroke-width="2"/><text x="978" y="362" font-size="20" text-anchor="end" fill="#173e32">insects</text><rect x="50.0" y="409" width="400" height="55" fill="#8dbd75" stroke="#2e7656" stroke-width="2"/><text x="250" y="445" font-size="21" text-anchor="middle" fill="#173e32">trees</text><rect x="727.5" y="409" width="45" height="55" fill="#8dbd75" stroke="#2e7656" stroke-width="2"/><text x="978" y="445" font-size="20" text-anchor="end" fill="#173e32">trees</text><text x="250" y="535" font-size="22" text-anchor="middle" fill="#173e32">Few large trees can have</text><text x="250" y="568" font-size="22" text-anchor="middle" fill="#173e32">a large total biomass.</text><text x="750" y="535" font-size="22" text-anchor="middle" fill="#173e32">Many insects; fewer birds;</text><text x="750" y="568" font-size="22" text-anchor="middle" fill="#173e32">several fleas per bird.</text><text x="500" y="606" font-size="20" text-anchor="middle" fill="#173e32">Bar widths are qualitative comparisons, not supplied measurements.</text></g></svg>