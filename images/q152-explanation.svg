<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1230" viewBox="0 0 1000 1230" role="img" aria-labelledby="q152-title q152-desc">
<title id="q152-title">152 · Assimilation is nutrient uptake and use by cells</title>
<desc id="q152-desc">Answer B, assimilation. Ingestion takes food into the mouth, digestion breaks down large food molecules, absorption moves soluble molecules through the intestine into blood or lymph, and assimilation involves uptake and use of nutrients by body cells. The main cell sketch shows small amino acid symbols entering and being built into a cell protein, an example of assimilation. Glucose use in respiration is another example. The model is qualitative: molecular shapes, counts and positions are illustrative.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
