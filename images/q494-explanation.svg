<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Root nodules bring nitrogen into living systems</title><desc id="desc">Nitrogen-fixing bacteria in legume root nodules convert atmospheric nitrogen gas into ammonia/ammonium compounds. The nitrogen is incorporated into amino acids and proteins; the plant supplies organic nutrients to the bacteria.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#24543e"/></marker></defs><rect width="900" height="540" fill="#fbf8ed"/><g font-family="Arial, sans-serif"><text x="450" y="45" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#203e30">Root nodules bring nitrogen into living systems</text><rect x="65" y="90" width="300" height="100" rx="14" fill="#a6d8df" stroke="#24543e" stroke-width="2"/><text x="215" y="131" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#203e30">Atmospheric nitrogen</text><text x="215" y="168" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#203e30">N₂ gas</text><line x1="215" y1="207" x2="215.0" y2="261.0" stroke="#24543e" stroke-width="3"/><polygon points="215,275 209.0,261.0 221.0,261.0" fill="#24543e"/><rect x="65" y="290" width="300" height="125" rx="14" fill="#b9d8ae" stroke="#24543e" stroke-width="2"/><text x="215" y="332" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#203e30">Nodule bacteria</text><text x="215" y="374" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#203e30">fix nitrogen</text><line x1="385" y1="350" x2="486.0" y2="350.0" stroke="#24543e" stroke-width="3"/><polygon points="500,350 486.0,356.0 486.0,344.0" fill="#24543e"/><rect x="520" y="290" width="315" height="125" rx="14" fill="#e6efdc" stroke="#24543e" stroke-width="2"/><text x="678" y="331" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#203e30">Ammonia / ammonium</text><text x="678" y="374" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#203e30">→ amino acids → proteins</text><text x="620" y="145" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#203e30">Plant supplies sugars</text><line x1="620" y1="170" x2="358.12617808667017" y2="267.13138121876233" stroke="#24543e" stroke-width="3"/><polygon points="345,272 356.03962718042544,261.50587632447514 360.2127289929149,272.7568861130495" fill="#24543e"/><text x="450" y="482" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#203e30">Fixation starts with nitrogen gas, not nitrate.</text><text x="450" y="517" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#203e30">Nitrification and denitrification are different processes.</text></g></svg>