<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="q277-title q277-desc">
<title id="q277-title">Moth chemicals spread by diffusion</title>
<desc id="q277-desc">Many chemical particles near the female moth and fewer farther away illustrate a concentration gradient. Particles move randomly in both directions; net diffusion is from higher to lower concentration. No membrane or cellular energy supply is needed for diffusion through air.</desc>
