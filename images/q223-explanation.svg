<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050" role="img" aria-labelledby="q223-title q223-desc">
<title id="q223-title">223 · Bile helps raise duodenal pH</title>
<desc id="q223-desc">The original graph marks X at the pH rise between the stomach and duodenum. Acidic contents leave the stomach and mix with alkaline bile in the duodenum; bile helps neutralise the acid and raise pH. The illustration is a qualitative explanation, not a redrawing of the measured curve. Gastric juice explains acidification, glucagon controls blood glucose, and trypsin digests protein. Answer A.</desc>
