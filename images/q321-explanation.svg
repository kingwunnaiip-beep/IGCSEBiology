<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="q321-title q321-desc">
<title id="q321-title">Test each smoking-graph conclusion against the data</title>
<desc id="q321-desc">Statement 1 is contradicted: in the 40–49 years category, the more-than-20-cigarettes bar is lower than the less-than-20 bar. Both series rise with increasing years smoking, supporting statement 2. The tallest bar is more than 20 cigarettes per day for more than 50 years, supporting statement 3.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="760" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Test each smoking-graph conclusion against the data</text><rect x="45" y="120" width="1010" height="155" rx="12" fill="#fbece7" stroke="#b94a43" stroke-width="2"/><text x="80" y="163" font-size="36" fill="#173d31" font-weight="700" text-anchor="start" >1</text><text x="145" y="157" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >“Always” higher with more cigarettes?</text><text x="145" y="201" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >No: in the 40–49 years group, the light bar</text><text x="145" y="241" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >is lower than the dark bar.</text><text x="1005" y="163" font-size="38" fill="#b94a43" font-weight="400" text-anchor="middle" >×</text><rect x="45" y="300" width="1010" height="155" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="80" y="343" font-size="36" fill="#173d31" font-weight="700" text-anchor="start" >2</text><text x="145" y="337" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >More years smoking → greater risk?</text><text x="145" y="381" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >Yes: follow either shading across the graph;</text><text x="145" y="421" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >risk rises as the years-smoking category rises.</text><text x="1005" y="343" font-size="38" fill="#25614b" font-weight="400" text-anchor="middle" >✓</text><rect x="45" y="480" width="1010" height="155" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="80" y="523" font-size="36" fill="#173d31" font-weight="700" text-anchor="start" >3</text><text x="145" y="517" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >Highest risk after &gt;50 years and &gt;20/day?</text><text x="145" y="561" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >Yes: that combination has the tallest bar.</text><text x="1005" y="523" font-size="38" fill="#25614b" font-weight="400" text-anchor="middle" >✓</text><rect x="24" y="684" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="718" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >D — statements 2 and 3 only</text>
</g></svg>