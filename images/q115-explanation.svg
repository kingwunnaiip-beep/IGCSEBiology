"567" r="14" fill="#e6b06a" stroke="#25614b" stroke-width="2"/><circle cx="532" cy="556" r="14" fill="#91b5cf" stroke="#25614b" stroke-width="2"/><circle cx="564" cy="568" r="14" fill="#b7c497" stroke="#25614b" stroke-width="2"/><circle cx="596" cy="556" r="14" fill="#e6b06a" stroke="#25614b" stroke-width="2"/><circle cx="628" cy="566" r="14" fill="#91b5cf" stroke="#25614b" stroke-width="2"/><text x="760" y="584" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Amino-acid chain</text><line x1="670" y1="580" x2="649" y2="569" stroke="#173d31" stroke-width="2"/><text x="500" y="837" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Amino acids are joined in the order coded by mRNA.</text><line x1="500" y1="902" x2="500" y2="946" stroke="#25614b" stroke-width="5"/><polygon points="500,946 493.07331236687776,932.6950761583107 506.92668763312224,932.6950761583107" fill="#25614b"/><rect x="80" y="967" width="840" height="163" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="1008" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >3 · The chain forms a protein</text><text x="500.0" y="1051" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Proteins contain amino acids.</text><text x="500.0" y="1088" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >DNA and mRNA contain bases.</text><text x="500" y="1177" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Simplified pathway; molecular sizes and colours are illustrative.</text><rect x="24" y="1224" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1258" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer A · The ribosome assembles amino acids in a chain</text>
