<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Mutation provides variation; antibiotics select resistant bacteria</title><desc id="desc">Mutation creates genetic variation. Following antibiotic treatment, resistant variants survive and reproduce. A later population contains a higher proportion of resistant bacteria. This is natural selection.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#39725b"/></marker></defs><rect width="1100" height="560" rx="22" fill="#fbf8e9"/><g font-family="Arial, sans-serif"><text x="40" y="55" font-size="30" text-anchor="start" fill="#173d31">Mutation provides variation; antibiotics select resistant bacteria</text><rect x="35" y="125" width="310" height="100" rx="15" fill="#e4edcf" stroke="#39725b" stroke-width="3"/><text x="190.0" y="167" font-size="25" text-anchor="middle" fill="#173d31">Random mutation</text><text x="190.0" y="199" font-size="25" text-anchor="middle" fill="#173d31">creates resistant variants</text><path d="M355 175 L415 175" fill="none" stroke="#39725b" stroke-width="5" marker-end="url(#arrow)"/><rect x="430" y="125" width="300" height="100" rx="15" fill="#e4edcf" stroke="#39725b" stroke-width="3"/><text x="580.0" y="167" font-size="25" text-anchor="middle" fill="#173d31">Genetic variation</text><text x="580.0" y="199" font-size="25" text-anchor="middle" fill="#173d31">in the population</text><path d="M740 175 L800 175" fill="none" stroke="#39725b" stroke-width="5" marker-end="url(#arrow)"/><rect x="815" y="125" width="250" height="100" rx="15" fill="#e4edcf" stroke="#39725b" stroke-width="3"/><text x="940.0" y="167" font-size="25" text-anchor="middle" fill="#173d31">Antibiotic</text><text x="940.0" y="199" font-size="25" text-anchor="middle" fill="#173d31">selection pressure</text><circle cx="85" cy="325" r="12" fill="#ddbd90" stroke="#39725b" stroke-width="3"/><circle cx="122" cy="325" r="12" fill="#ddbd90" stroke="#39725b" stroke-width="3"/><circle cx="159" cy="325" r="12" fill="#87b37a" stroke="#39725b" stroke-width="3"/><circle cx="196" cy="325" r="12" fill="#ddbd90" stroke="#39725b" stroke-width="3"/><circle cx="233" cy="325" r="12" fill="#ddbd90" stroke="#39725b" stroke-width="3"/><circle cx="270" cy="325" r="12" fill="#ddbd90" stroke="#39725b" stroke-width="3"/><circle cx="307" cy="325" r="12" fill="#87b37a" stroke="#39725b" stroke-width="3"/><circle cx="344" cy="325" r="12" fill="#ddbd90" stroke="#39725b" stroke-width="3"/><text x="185" y="385" font-size="23" text-anchor="middle" fill="#173d31">Before treatment</text><path d="M365 325 L480 325" fill="none" stroke="#39725b" stroke-width="5" marker-end="url(#arrow)"/><circle cx="535" cy="325" r="12" fill="#87b37a" stroke="#39725b" stroke-width="3"/><circle cx="580" cy="325" r="12" fill="#87b37a" stroke="#39725b" stroke-width="3"/><text x="550" y="385" font-size="23" text-anchor="middle" fill="#173d31">Resistant survivors</text><path d="M650 325 L740 325" fill="none" stroke="#39725b" stroke-width="5" marker-end="url(#arrow)"/><circle cx="790" cy="325" r="12" fill="#87b37a" stroke="#39725b" stroke-width="3"/><circle cx="826" cy="325" r="12" fill="#87b37a" stroke="#39725b" stroke-width="3"/><circle cx="862" cy="325" r="12" fill="#87b37a" stroke="#39725b" stroke-width="3"/><circle cx="898" cy="325" r="12" fill="#87b37a" stroke="#39725b" stroke-width="3"/><circle cx="934" cy="325" r="12" fill="#87b37a" stroke="#39725b" stroke-width="3"/><circle cx="970" cy="325" r="12" fill="#87b37a" stroke="#39725b" stroke-width="3"/><circle cx="1006" cy="325" r="12" fill="#87b37a" stroke="#39725b" stroke-width="3"/><text x="900" y="385" font-size="23" text-anchor="middle" fill="#173d31">Survive and reproduce</text><text x="550" y="465" font-size="27" text-anchor="middle" fill="#173d31">Natural selection increases the frequency of resistance.</text><text x="40" y="530" font-size="17" text-anchor="start" fill="#536b57">Original teaching schematic • qualitative, not to scale</text></g></svg>