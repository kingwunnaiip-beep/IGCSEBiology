<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1100" viewBox="0 0 1000 1100" role="img" aria-labelledby="q183-title q183-desc">
<title id="q183-title">183 · Dodder receives assimilates from its host</title>
<desc id="q183-desc">Answer C. The host leaves are the source and the dodder plant is the sink. Photosynthesis in green host leaves produces assimilates that can be exported as sucrose through phloem. The dodder described has no green leaves or roots and connects to the host vascular bundles, receiving assimilates for respiration and growth. The source-to-sink pathway is a qualitative teaching model, not measured plant anatomy or transport data.</desc>
