nt-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Xylem</text><text x="825.0" y="243" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Water + mineral ions</text><text x="825.0" y="283" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Mainly upwards</text><rect x="640" y="375" width="370" height="155" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="825.0" y="415" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Phloem</text><text x="825.0" y="458" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Sucrose + amino acids</text><text x="825.0" y="498" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Between sources and sinks</text><rect x="24" y="624" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="658" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >The red-stained water marks the xylem: D</text>
