<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">During inspiration, lung pressure dips below atmospheric</title><desc id="desc">A pressure-time graph shows graph B: starting at atmospheric pressure, lung pressure falls below it while air enters, then returns to atmospheric at the end of inspiration.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="53" font-size="30" text-anchor="start" font-weight="bold" fill="#173f32">During inspiration, lung pressure dips below atmospheric</text><path d="M120 465 L120 115" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M120 465 L790 465" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="135" y="110" font-size="25" text-anchor="start" font-weight="normal" fill="#173f32">Pressure</text><line x1="120" y1="245" x2="770" y2="245" stroke="#537c9a" stroke-width="3" stroke-dasharray="8 6"/><text x="805" y="240" font-size="22" text-anchor="start" font-weight="normal" fill="#173f32">Atmospheric</text><text x="805" y="270" font-size="22" text-anchor="start" font-weight="normal" fill="#173f32">pressure</text><path d="M130 245 C210 245 250 330 330 380 C420 440 520 410 585 340 C650 260 705 245 770 245" fill="none" stroke="#24644b" stroke-width="6" /><text x="470" y="330" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">Air flows in</text><path d="M470 344 L470 390" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><circle cx="850" cy="145" r="38" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><text x="850" y="157" font-size="34" text-anchor="middle" font-weight="bold" fill="#173f32">B</text><text x="135" y="500" font-size="22" text-anchor="middle" font-weight="normal" fill="#173f32">Start</text><text x="765" y="500" font-size="22" text-anchor="middle" font-weight="normal" fill="#173f32">End</text><text x="470" y="500" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">Time</text><text x="500" y="548" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">Lower lung pressure draws air in; airflow stops when pressure equalises.</text></g></svg>