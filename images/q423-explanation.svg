<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Nitrate ions become nitrogen in plant proteins</title><desc id="desc">Nitrate ions labelled NO3 minus in soil water move into plant cells. Their nitrogen is incorporated into amino acids, which are joined into protein chains. This distinguishes an inorganic mineral ion from organic amino acids and proteins.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#327153"/></marker></defs><rect width="960" height="540" rx="24" fill="#faf9ef"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="49" text-anchor="start" fill="#163d31" font-size="30" font-weight="bold">Nitrate ions become nitrogen in plant proteins</text><text x="36" y="87" text-anchor="start" fill="#163d31" font-size="23" font-weight="normal">A mineral ion supplies nitrogen for organic molecules.</text><rect x="36" y="133" width="243" height="258" rx="18" fill="#e1eddf" stroke="#327153" stroke-width="2"/><text x="157" y="181" text-anchor="middle" fill="#163d31" font-size="24" font-weight="bold">SOIL WATER</text><circle cx="92" cy="234" r="32" fill="#e1eddf" stroke="#327153" stroke-width="3"/><text x="92" y="242" text-anchor="middle" fill="#163d31" font-size="22" font-weight="normal">NO₃⁻</text><circle cx="197" cy="234" r="32" fill="#e1eddf" stroke="#327153" stroke-width="3"/><text x="197" y="242" text-anchor="middle" fill="#163d31" font-size="22" font-weight="normal">NO₃⁻</text><circle cx="144" cy="310" r="32" fill="#e1eddf" stroke="#327153" stroke-width="3"/><text x="144" y="318" text-anchor="middle" fill="#163d31" font-size="22" font-weight="normal">NO₃⁻</text><path d="M294 262 L374 262" fill="none" stroke="#327153" stroke-width="4"/><path d="M364 255 L374 262 L364 269" fill="none" stroke="#327153" stroke-width="4"/><text x="334" y="226" text-anchor="middle" fill="#163d31" font-size="20" font-weight="normal">uptake</text><rect x="395" y="133" width="246" height="258" rx="18" fill="#e1eddf" stroke="#327153" stroke-width="2"/><text x="518" y="181" text-anchor="middle" fill="#163d31" font-size="24" font-weight="bold">PLANT CELLS</text><text x="518" y="257" text-anchor="middle" fill="#163d31" font-size="28" font-weight="normal">amino acids</text><text x="518" y="312" text-anchor="middle" fill="#163d31" font-size="22" font-weight="normal">contain nitrogen</text><path d="M656 262 L719 262" fill="none" stroke="#327153" stroke-width="4"/><path d="M709 255 L719 262 L709 269" fill="none" stroke="#327153" stroke-width="4"/><rect x="735" y="133" width="189" height="258" rx="18" fill="#e1eddf" stroke="#327153" stroke-width="2"/><text x="829" y="181" text-anchor="middle" fill="#163d31" font-size="24" font-weight="bold">PROTEINS</text><circle cx="777" cy="250" r="13" fill="#e1eddf" stroke="#327153" stroke-width="3"/><circle cx="809" cy="239" r="13" fill="#e1eddf" stroke="#327153" stroke-width="3"/><circle cx="841" cy="253" r="13" fill="#e1eddf" stroke="#327153" stroke-width="3"/><circle cx="873" cy="240" r="13" fill="#e1eddf" stroke="#327153" stroke-width="3"/><text x="480" y="457" text-anchor="middle" fill="#163d31" font-size="26" font-weight="bold">Nitrate is the ion; amino acids and proteins are organic.</text><text x="36" y="517" text-anchor="start" fill="#587064" font-size="17" font-weight="normal">Original teaching schematic • not to scale</text></g></svg>