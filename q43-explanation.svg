<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="q43-title q43-desc"><title id="q43-title">A protein catalyst is reused</title><desc id="q43-desc">A substrate fits a protein enzyme’s active site. Products leave after the reaction. An identical enzyme remains available to catalyse another reaction.</desc><defs><marker id="q43-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#244d3d"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;font-size:28px;fill:#244d3d}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}.heading{font-size:32px;font-weight:700}.small{font-size:28px}.bold{font-weight:700}.red{fill:#b65350}.blue{fill:#447c9a}.muted{fill:#698476}.arrow{stroke:#244d3d;stroke-width:4;fill:none;marker-end:url(#q43-arrow)}</style><rect x="1" y="1" width="638" height="418" rx="24" fill="#f5f8f2" stroke="#dbe9d7" stroke-width="2"/><text x="30" y="45" class="heading">A protein catalyst is reused</text><text x="36" y="104" >Protein enzyme</text><g transform="translate(120 239) scale(0.93)"><path d="M56 -64 C8 -91 -61 -61 -66 -10 C-73 43 -28 80 25 68 C58 60 78 40 71 13 L34 -10 L71 -34 C68 -49 65 -57 56 -64 Z" fill="#659b78" stroke="#244d3d" stroke-width="4"/></g><path d="M248 188.8 L248 251.2 L193.4 220 Z" fill="#bd9550" stroke="#244d3d" stroke-width="3"/><text x="200" y="154" >Substrate</text><path d="M218 178 L206 199" class="arrow"/><path d="M286 236 H338" class="arrow"/><g transform="translate(444 239) scale(0.93)"><path d="M56 -64 C8 -91 -61 -61 -66 -10 C-73 43 -28 80 25 68 C58 60 78 40 71 13 L34 -10 L71 -34 C68 -49 65 -57 56 -64 Z" fill="#659b78" stroke="#244d3d" stroke-width="4"/></g><path d="M560 134.8 L560 173.2 L526.4 154 Z" fill="#bd9550" stroke="#244d3d" stroke-width="3"/><path d="M580 194 L580 230 L548.5 212 Z" fill="#efe4c8" stroke="#244d3d" stroke-width="3"/><text x="426" y="104" >Products</text><path d="M504 227 L534 183" class="arrow"/><text x="35" y="369" >Active site</text><path d="M172 355 L159 244" class="arrow"/><text x="350" y="369" class="bold">Enzyme reused</text></svg>
