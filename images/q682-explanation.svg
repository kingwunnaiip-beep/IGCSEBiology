<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">An unaffected mother with an affected son is a carrier</title><desc id="desc">Two separate X-linked recessive deductions show unaffected females 2 and 3 carrying X normal and X disease, and each passing the recessive X to an affected son.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">An unaffected mother with an affected son is a carrier</text><circle cx="260" cy="210" r="55" fill="#fbf8eb" stroke="#24644b" stroke-width="4"/><path d="M260 155 A55 55 0 0 1 260 265 Z" fill="#b9ccde" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="260" cy="210" r="55" fill="none" stroke="#24644b" stroke-width="4"/><text x="260" y="135" font-size="26" text-anchor="middle" fill="#173f32" font-weight="bold">Unaffected female 2</text><text x="260" y="220" font-size="25" text-anchor="middle" fill="#173f32" font-weight="bold">XᴺXⁿ</text><path d="M260 265 L260 350" fill="none" stroke="#24644b" stroke-width="3"/><rect x="215" y="350" width="90" height="90" rx="0" fill="#537c9a" stroke="#24644b" stroke-width="4"/><text x="260" y="405" font-size="25" text-anchor="middle" fill="white" font-weight="bold">XⁿY</text><text x="260" y="495" font-size="25" text-anchor="middle" fill="#173f32">Affected son</text><text x="260" y="535" font-size="22" text-anchor="middle" fill="#173f32">Xⁿ came from his mother</text><circle cx="730" cy="210" r="55" fill="#fbf8eb" stroke="#24644b" stroke-width="4"/><path d="M730 155 A55 55 0 0 1 730 265 Z" fill="#b9ccde" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="730" cy="210" r="55" fill="none" stroke="#24644b" stroke-width="4"/><text x="730" y="135" font-size="26" text-anchor="middle" fill="#173f32" font-weight="bold">Unaffected female 3</text><text x="730" y="220" font-size="25" text-anchor="middle" fill="#173f32" font-weight="bold">XᴺXⁿ</text><path d="M730 265 L730 350" fill="none" stroke="#24644b" stroke-width="3"/><rect x="685" y="350" width="90" height="90" rx="0" fill="#537c9a" stroke="#24644b" stroke-width="4"/><text x="730" y="405" font-size="25" text-anchor="middle" fill="white" font-weight="bold">XⁿY</text><text x="730" y="495" font-size="25" text-anchor="middle" fill="#173f32">Affected son</text><text x="730" y="535" font-size="22" text-anchor="middle" fill="#173f32">Xⁿ came from his mother</text><path d="M495 120 L495 520" fill="none" stroke="#537c9a" stroke-width="2"/><text x="500" y="565" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">C: heterozygotes are females 2 and 3.</text></g></svg>