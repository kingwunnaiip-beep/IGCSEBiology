<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="730" viewBox="0 0 1100 730" role="img" aria-labelledby="q293-title q293-desc">
<title id="q293-title">Turgor pressure pushes outwards on the cell wall</title>
<desc id="q293-desc">A schematic turgid plant cell has a large water-filled vacuole. Arrows point from inside the cell outwards towards the cell wall. The strong wall resists expansion, making the cell firm and helping support the plant. Water outside the cell is not the source of this internal turgor pressure.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="730" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Turgor pressure pushes outwards on the cell wall</text><rect x="110" y="150" width="450" height="380" rx="35" fill="#dfd2ad" stroke="#25614b" stroke-width="9"/><rect x="129" y="169" width="412" height="342" rx="26" fill="#bdd5c6" stroke="#357ca2" stroke-width="3"/><rect x="175" y="215" width="320" height="250" rx="50" fill="#dceff5" stroke="#357ca2" stroke-width="3"/><text x="335" y="320" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >Large vacuole</text><text x="335" y="360" font-size="28" fill="#173d31" font-weight="400" text-anchor="middle" >containing water</text><line x1="335" y1="215" x2="335" y2="167" stroke="#b94a43" stroke-width="6"/><polygon points="335,167 341.92668763312224,180.30492384168926 328.07331236687776,180.30492384168926" fill="#b94a43"/><line x1="335" y1="465" x2="335" y2="514" stroke="#b94a43" stroke-width="6"/><polygon points="335,514 328.07331236687776,500.6950761583107 341.92668763312224,500.6950761583107" fill="#b94a43"/><line x1="175" y1="340" x2="127" y2="340" stroke="#b94a43" stroke-width="6"/><polygon points="127,340 140.30492384168926,333.07331236687776 140.30492384168926,346.92668763312224" fill="#b94a43"/><line x1="495" y1="340" x2="543" y2="340" stroke="#b94a43" stroke-width="6"/><polygon points="543,340 529.6950761583107,346.92668763312224 529.6950761583107,333.07331236687776" fill="#b94a43"/><text x="790" y="210" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >Water inside the cell</text><text x="790" y="252" font-size="29" fill="#173d31" font-weight="700" text-anchor="middle" >presses OUTWARDS.</text><text x="790" y="350" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >The strong cell wall</text><text x="790" y="386" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >resists expansion.</text><text x="790" y="422" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" ></text><text x="790" y="458" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Turgid cells help</text><text x="790" y="494" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >support the plant.</text><text x="335" y="585" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Schematic turgid plant cell; not to scale</text><rect x="24" y="654" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="688" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >C: water inside cells presses outwards on the cell wall.</text>
