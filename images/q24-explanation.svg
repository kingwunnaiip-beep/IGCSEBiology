<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="q24-title q24-desc"><title id="q24-title">Agave conserves water</title><desc id="q24-desc">In Agave americana, stomata are mainly open at night to take in carbon dioxide and mainly closed by day to reduce water loss. This is a qualitative diagram of CAM behaviour, not measured data.</desc><defs><marker id="q24-green-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#397359"/></marker><marker id="q24-blue-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3d79a0"/></marker><marker id="q24-red-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85c5e"/></marker><marker id="q24-gold-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b88838"/></marker></defs><rect width="640" height="420" rx="20" fill="#f8faf6"/><g font-family="Arial, Helvetica, sans-serif"><text x="320" y="42" font-size="32" text-anchor="middle" fill="#223c35" font-weight="bold">Agave conserves water</text><rect x="20" y="72" width="290" height="307" rx="20" fill="#e9eef2" stroke="none" stroke-width="3"/><rect x="330" y="72" width="290" height="307" rx="20" fill="#f4efdb" stroke="none" stroke-width="3"/><circle cx="67" cy="113" r="21" fill="#8094a5" stroke="none" stroke-width="3"/><circle cx="77" cy="104" r="19" fill="#e9eef2" stroke="none" stroke-width="3"/><circle cx="581" cy="111" r="18" fill="#d5af55" stroke="none" stroke-width="3"/><text x="165" y="118" font-size="30" text-anchor="middle" fill="#223c35" font-weight="bold">Night</text><text x="475" y="118" font-size="30" text-anchor="middle" fill="#223c35" font-weight="bold">Day</text><path d="M 144 155 C 82 155 75 255 139 263 C 113 228 113 186 144 155 Z" stroke="#397359" stroke-width="4" fill="#dcebdd" stroke-linecap="round" stroke-linejoin="round" /><path d="M 186 155 C 248 155 255 255 191 263 C 217 228 217 186 186 155 Z" stroke="#397359" stroke-width="4" fill="#dcebdd" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="165" cy="210" rx="14" ry="40" fill="#f8faf6" stroke="none" stroke-width="3" /><path d="M 165 142 V 186" stroke="#397359" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#q24-green-arrow)"/><path d="M 474 154 C 411 154 399 256 473 265 C 453 225 453 188 474 154 Z" stroke="#397359" stroke-width="4" fill="#dcebdd" stroke-linecap="round" stroke-linejoin="round" /><path d="M 477 154 C 540 154 552 256 478 265 C 498 225 498 188 477 154 Z" stroke="#397359" stroke-width="4" fill="#dcebdd" stroke-linecap="round" stroke-linejoin="round" /><path d="M 475 170 V 248" stroke="#397359" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="165" y="307" font-size="28" text-anchor="middle" fill="#223c35" font-weight="bold">Mainly open</text><text x="475" y="307" font-size="28" text-anchor="middle" fill="#223c35" font-weight="bold">Mainly closed</text><text x="165" y="347" font-size="28" text-anchor="middle" fill="#223c35" font-weight="normal">CO2 enters</text><text x="475" y="347" font-size="28" text-anchor="middle" fill="#223c35" font-weight="normal">Less water lost</text><text x="320" y="408" font-size="28" text-anchor="middle" fill="#223c35" font-weight="normal">Agave americana is a CAM plant</text></g></svg>