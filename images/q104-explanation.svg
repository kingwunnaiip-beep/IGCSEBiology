"25" fill="#173d31" font-weight="700" text-anchor="middle" >R · Motor</text><text x="800.0" y="536" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Carries an impulse</text><text x="800.0" y="567" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >to the effector.</text><rect x="90" y="786" width="820" height="131" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="824" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Effector</text><text x="500.0" y="862" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >A muscle contracts or a gland responds.</text><line x1="200" y1="319" x2="200" y2="441" stroke="#25614b" stroke-width="5"/><polygon points="200,441 193.07331236687776,427.6950761583107 206.92668763312224,427.6950761583107" fill="#25614b"/><line x1="324" y1="548" x2="369" y2="548" stroke="#357ca2" stroke-width="5"/><polygon points="369,548 355.6950761583107,554.9266876331222 355.6950761583107,541.0733123668778" fill="#357ca2"/><line x1="628" y1="548" x2="674" y2="548" stroke="#357ca2" stroke-width="5"/><polygon points="674,548 660.6950761583107,554.9266876331222 660.6950761583107,541.0733123668778" fill="#357ca2"/><line x1="800" y1="650" x2="800" y2="768" stroke="#25614b" stroke-width="5"/><polygon points="800,768 793.0733123668778,754.6950761583107 806.9266876331222,754.6950761583107" fill="#25614b"/><text x="500" y="681" font-size="24" fill="#357ca2" font-weight="400" text-anchor="middle" >Relay neurone lies inside the CNS.</text><rect x="90" y="958" width="820" height="117" rx="12" fill="#f4efdf" stroke="none" stroke-width="2"/><text x="500" y="1002" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Receptor → sensory → relay → motor → effector</text><text x="500" y="1042" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >A reflex does not wait for a conscious decision.</text><rect x="24" y="1114" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1148" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · P sensory · Q relay · R motor</text>
