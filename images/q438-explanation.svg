<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Water vapour gradients control transpiration</title><desc id="desc">Two schematic panels compare moist leaf air with outside air. High humidity means a small difference in water vapour concentration. Wind removes moist air at the leaf surface, maintaining a steeper outward gradient.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3 L0 6 Z" fill="#397857"/></marker></defs><rect width="900" height="520" rx="22" fill="#fbfaee"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="28" text-anchor="start" fill="#183e31" font-weight="bold">Water vapour gradients control transpiration</text><rect x="40" y="92" width="395" height="325" rx="18" fill="#e5f0dd" stroke="#4c7957" stroke-width="2"/><rect x="465" y="92" width="395" height="325" rx="18" fill="#e5f0dd" stroke="#4c7957" stroke-width="2"/><text x="237" y="131" font-size="24" text-anchor="middle" fill="#183e31" font-weight="bold">High humidity</text><rect x="65" y="165" width="110" height="160" rx="18" fill="#c9dfa8" stroke="#4c7957" stroke-width="2"/><text x="120" y="352" font-size="18" text-anchor="middle" fill="#183e31" font-weight="normal">Leaf air</text><text x="315" y="352" font-size="18" text-anchor="middle" fill="#183e31" font-weight="normal">Outside air</text><circle cx="90" cy="190" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="90" cy="230" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="90" cy="270" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="120" cy="190" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="120" cy="230" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="120" cy="270" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="150" cy="190" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="150" cy="230" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="150" cy="270" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="285" cy="190" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="285" cy="270" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="315" cy="190" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="315" cy="270" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="345" cy="190" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="345" cy="270" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><path d="M185 245 L250 245" fill="none" stroke="#397857" stroke-width="3" marker-end="url(#arrow)"/><text x="237" y="391" font-size="19" text-anchor="middle" fill="#183e31" font-weight="normal">Small concentration difference</text><text x="662" y="131" font-size="24" text-anchor="middle" fill="#183e31" font-weight="bold">High wind speed</text><rect x="490" y="165" width="110" height="160" rx="18" fill="#c9dfa8" stroke="#4c7957" stroke-width="2"/><text x="545" y="352" font-size="18" text-anchor="middle" fill="#183e31" font-weight="normal">Leaf air</text><text x="740" y="352" font-size="18" text-anchor="middle" fill="#183e31" font-weight="normal">Outside air</text><circle cx="515" cy="190" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="515" cy="230" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="515" cy="270" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="545" cy="190" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="545" cy="230" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="545" cy="270" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="575" cy="190" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="575" cy="230" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="575" cy="270" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="710" cy="230" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="740" cy="230" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><circle cx="770" cy="230" r="5" fill="#5b9664" stroke="none" stroke-width="3"/><path d="M610 245 L675 245" fill="none" stroke="#397857" stroke-width="7" marker-end="url(#arrow)"/><text x="662" y="391" font-size="19" text-anchor="middle" fill="#183e31" font-weight="normal">Moist air swept away</text><path d="M775 169 L830 169" fill="none" stroke="#397857" stroke-width="4" marker-end="url(#arrow)"/><path d="M775 205 L830 205" fill="none" stroke="#397857" stroke-width="4" marker-end="url(#arrow)"/><text x="450" y="465" font-size="25" text-anchor="middle" fill="#183e31" font-weight="bold">Humidity lowers the gradient; wind raises it.</text></g></svg>