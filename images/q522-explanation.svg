<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">Homozygous red × homozygous white</title><desc id="d">Red RR produces only R gametes and white WW produces only W gametes. A two-by-two grid repeats these gametes and all four cells are RW pink. Thus all offspring are heterozygous and pink.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#194f3b"/></marker></defs><rect width="1000" height="600" rx="22" fill="#fffdf2"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="31" text-anchor="start" fill="#213c30" font-weight="bold">Homozygous red × homozygous white</text><rect x="45" y="110" width="330" height="95" rx="16" fill="#d9ead7" stroke="#194f3b" stroke-width="2"/><text x="210.0" y="148.5" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">Red parent RR</text><text x="210.0" y="182.5" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">gametes: R only</text><rect x="625" y="110" width="330" height="95" rx="16" fill="#ffffff" stroke="#194f3b" stroke-width="2"/><text x="790.0" y="148.5" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">White parent WW</text><text x="790.0" y="182.5" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">gametes: W only</text><text x="500" y="170" font-size="47" text-anchor="middle" fill="#213c30" font-weight="normal">×</text><text x="500" y="256" font-size="27" text-anchor="middle" fill="#213c30" font-weight="bold">Every fertilisation combines R + W</text><text x="400" y="305" font-size="29" text-anchor="middle" fill="#213c30" font-weight="bold">R</text><text x="680" y="305" font-size="29" text-anchor="middle" fill="#213c30" font-weight="bold">R</text><text x="215" y="375" font-size="29" text-anchor="middle" fill="#213c30" font-weight="bold">W</text><rect x="300" y="326" width="200" height="72" rx="16" fill="#f0d5d0" stroke="#194f3b" stroke-width="2"/><text x="400.0" y="370.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">RW: pink</text><rect x="580" y="326" width="200" height="72" rx="16" fill="#f0d5d0" stroke="#194f3b" stroke-width="2"/><text x="680.0" y="370.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">RW: pink</text><text x="215" y="461" font-size="29" text-anchor="middle" fill="#213c30" font-weight="bold">W</text><rect x="300" y="412" width="200" height="72" rx="16" fill="#f0d5d0" stroke="#194f3b" stroke-width="2"/><text x="400.0" y="456.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">RW: pink</text><rect x="580" y="412" width="200" height="72" rx="16" fill="#f0d5d0" stroke="#194f3b" stroke-width="2"/><text x="680.0" y="456.0" font-size="24" text-anchor="middle" fill="#213c30" font-weight="normal">RW: pink</text><text x="500" y="529" font-size="28" text-anchor="middle" fill="#213c30" font-weight="bold">4 of 4 combinations are RW → 100% pink</text><text x="40" y="566" font-size="21" text-anchor="start" fill="#213c30" font-weight="normal">R and W are explanatory allele symbols; phenotype rules are supplied in the question.</text></g></svg>