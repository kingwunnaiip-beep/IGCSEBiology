er gain</text><text x="673" y="211" font-size="24" fill="#173d31" font-weight="700" text-anchor="start" >0.1 → about 1.20</text><text x="673" y="245" font-size="24" fill="#173d31" font-weight="700" text-anchor="start" >0.2 → about 1.05</text><text x="673" y="320" font-size="24" fill="#173d31" font-weight="700" text-anchor="start" >Ratio = 1</text><text x="673" y="354" font-size="24" fill="#173d31" font-weight="700" text-anchor="start" >No net water gain</text><text x="673" y="420" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >Ratio &lt; 1</text><text x="673" y="454" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >Net water loss</text><rect x="48" y="629" width="904" height="205" rx="12" fill="#f1f6eb" stroke="#d1ddce" stroke-width="2"/><text x="75" y="668" font-size="26" fill="#173d31" font-weight="700" text-anchor="start" >Osmosis across a partially permeable membrane</text><text x="255" y="710" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Higher water potential</text><text x="744" y="710" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Lower water potential</text><line x1="500" y1="727" x2="500" y2="808" stroke="#25614b" stroke-width="6" stroke-dasharray="12 12"/><circle cx="138" cy="748" r="9" fill="#357ca2" stroke="none" stroke-width="3"/><circle cx="194" cy="788" r="9" fill="#357ca2" stroke="none" stroke-width="3"/><circle cx="260" cy="747" r="9" fill="#357ca2" stroke="none" stroke-width="3"/><circle cx="322" cy="793" r="9" fill="#357ca2" stroke="none" stroke-width="3"/><circle cx="384" cy="748" r="9" fill="#357ca2" stroke="none" stroke-width="3"/><circle cx="647" cy="748" r="9" fill="#357ca2" stroke="none" stroke-width="3"/><circle cx="740" cy="790" r="9" fill="#357ca2" stroke="none" stroke-width="3"/><circle cx="844" cy="748" r="9" fill="#357ca2" stroke="none" stroke-width="3"/><line x1="401" y1="768" x2="599" y2="768" stroke="#357ca2" stroke-width="5"/><polygon points=