<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="q64-title q64-desc">
<title id="q64-title">Compare the initial reaction rates</title>
<desc id="q64-desc">Horizontal bars share a zero baseline and a scale from zero to 1.00 grams per second. P is 1.00, S is 0.75, Q is approximately 0.73, and R is 0.375 grams per second. P is fastest, then S, Q and R. Q is an approximate reading from the graph. Answer B.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="820" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Compare the initial reaction rates</text><text x="550" y="106" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Rate = change in product mass ÷ change in time</text><line x1="180" y1="180" x2="180" y2="570" stroke="#d5e0d5" stroke-width="2"/><text x="180" y="609" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >0</text><line x1="342.5" y1="180" x2="342.5" y2="570" stroke="#d5e0d5" stroke-width="2"/><text x="342.5" y="609" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >0.25</text><line x1="505.0" y1="180" x2="505.0" y2="570" stroke="#d5e0d5" stroke-width="2"/><text x="505.0" y="609" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >0.50</text><line x1="667.5" y1="180" x2="667.5" y2="570" stroke="#d5e0d5" stroke-width="2"/><text x="667.5" y="609" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >0.75</text><line x1="830" y1="180" x2="830" y2="570" stroke="#d5e0d5" stroke-width="2"/><text x="830" y="609" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >1.00</text><line x1="180" y1="170" x2="180" y2="570" stroke="#173d31" stroke-width="3"/><text x="135" y="234" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >P</text><rect x="180" y="200" width="650.0" height="51" rx="0" fill="#25614b" stroke="none" stroke-width="2"/><text x="848.0" y="234" font-size="26" fill="#173d31" font-weight="700" text-anchor="start" >1.00</text><text x="135" y="324" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >S</text><rect x="180" y="290" width="487.5" height="51" rx="0" fill="#357ca2" stroke="none" stroke-width="2"/><text x="685.5" y="324" font-size="26" fill="#173d31" font-weight="700" text-anchor="start" >0.75</text><text x="135" y="414" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Q</text><rect x="180" y="380" width="474.5" height="51" rx="0" fill="#6b9db3" stroke="none" stroke-width="2"/><text x="672.5" y="414" font-size="26" fill="#173d31" font-weight="700" text-anchor="start" >≈0.73</text><text x="135" y="504" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >R</text><rect x="180" y="470" width="243.75" height="51" rx="0" fill="#7e9d73" stroke="none" stroke-width="2"/><text x="441.75" y="504" font-size="26" fill="#173d31" font-weight="700" text-anchor="start" >0.375</text><text x="505" y="652" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Initial rate / g s⁻¹</text><rect x="70" y="679" width="960" height="48" rx="12" fill="#e9f1f5" stroke="none" stroke-width="2"/><text x="550" y="711" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Q ≈ 22 ÷ 30 ≈ 0.73 g/s; S = 0.75 g/s is given.</text><rect x="24" y="744" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="778" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B — P → S → Q → R (fastest to slowest)</text>
</g></svg>