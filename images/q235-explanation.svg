<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-labelledby="q235-title q235-desc">
<title id="q235-title">The cuticle lies outside the epidermis</title>
<desc id="q235-desc">Qualitative leaf-layer model. A leader reaches the waxy cuticle above upper epidermal cells. Palisade and spongy mesophyll lie inside, and lower epidermal cells form the bottom surface. The cuticle reduces evaporation; this model is not a measured section.</desc>
