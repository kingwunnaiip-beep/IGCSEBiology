<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1120" viewBox="0 0 1000 1120" role="img" aria-labelledby="q155-title q155-desc">
<title id="q155-title">155 · Rods detect dim light; cones detect colour</title>
<desc id="q155-desc">Answer B. Rod cells in the retina support vision in dim light but do not distinguish colours. Cone cells provide colour vision and work best in brighter light. The side-by-side sketches use a rod-shaped outer segment and a tapered cone-shaped segment to help remember the names. The cell shapes, sizes and colours are qualitative memory aids, not measured anatomy. Both receptor types convert light into signals that lead to nerve impulses.</desc>
