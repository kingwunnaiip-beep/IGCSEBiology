<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1110" viewBox="0 0 1000 1110" role="img" aria-labelledby="q111-title q111-desc">
<title id="q111-title">111 · Bile emulsifies fat into smaller droplets</title>
<desc id="q111-desc">Answer D: bile emulsifies fat into smaller droplets. This is physical breakdown: the fat molecules themselves are not split by emulsification. The smaller droplets provide a larger total surface area for lipase to act. Lipase, rather than bile, catalyses chemical digestion of fat to fatty acids and glycerol. The two panels compare a large droplet with smaller droplets qualitatively; their sizes and counts are illustrative rather than measured amounts. Bile is made in the liver, stored in the gall bladder and released into the duodenum.</desc>
