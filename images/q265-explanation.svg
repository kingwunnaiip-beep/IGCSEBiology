<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="q265-title q265-desc">
<title id="q265-title">Distinguish a virus from cellular structures</title>
<desc id="q265-desc">Compare all four choices: a virus has a protein coat but not a cell wall, mitochondria or a nucleus. A protein capsid is different from both a cell wall and a nuclear membrane.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="690" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Distinguish a virus from cellular structures</text><rect x="45" y="115" width="1030" height="90" rx="12" fill="#f0f2f1" stroke="#526c62" stroke-width="2"/><text x="75" y="169" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >A  Cell wall</text><text x="410" y="169" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >Absent: viruses have no cellular wall.</text><rect x="45" y="225" width="1030" height="90" rx="12" fill="#f0f2f1" stroke="#526c62" stroke-width="2"/><text x="75" y="279" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >B  Mitochondria</text><text x="410" y="279" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >Absent: viruses have no cell organelles.</text><rect x="45" y="335" width="1030" height="90" rx="12" fill="#f0f2f1" stroke="#526c62" stroke-width="2"/><text x="75" y="389" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >C  Nucleus</text><text x="410" y="389" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >Absent: genetic material is not in a nucleus.</text><rect x="45" y="445" width="1030" height="90" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="75" y="499" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >D  Protein coat</text><text x="410" y="499" font-size="26" fill="#173d31" font-weight="400" text-anchor="start" >Present: the capsid surrounds genetic material.</text><text x="560" y="582" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >A protein capsid is different from a cell wall or nuclear membrane.</text><rect x="24" y="614" width="1072" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="560.0" y="648" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >D — protein coat</text>
</g></svg>