<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="q306-title q306-desc">
<title id="q306-title">Glucose uptake: interpret the oxygen comparison</title>
<desc id="q306-desc">Glucose uptake without oxygen shows diffusion can occur. Additional uptake with oxygen supports energy-requiring active transport as well. Osmosis moves water, not glucose.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="760" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Glucose uptake: interpret the oxygen comparison</text><rect x="50" y="105" width="480" height="220" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="290.0" y="148" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >No oxygen</text><text x="290.0" y="196" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Some glucose still enters.</text><text x="290.0" y="238" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Diffusion does not require</text><text x="290.0" y="280" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >energy from respiration.</text><rect x="590" y="105" width="480" height="220" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="830.0" y="148" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >With oxygen</text><text x="830.0" y="196" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >More glucose enters.</text><text x="830.0" y="238" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Aerobic respiration supplies</text><text x="830.0" y="280" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >energy for active transport.</text><line x1="290" y1="340" x2="290" y2="405" stroke="#357ca2" stroke-width="4"/><polygon points="290,405 283.07331236687776,391.6950761583107 296.92668763312224,391.6950761583107" fill="#357ca2"/><line x1="830" y1="340" x2="830" y2="405" stroke="#25614b" stroke-width="4"/><polygon points="830,405 823.0733123668778,391.6950761583107 836.9266876331222,391.6950761583107" fill="#25614b"/><rect x="65" y="420" width="450" height="160" rx="12" fill="#edf3fa" stroke="#357ca2" stroke-width="2"/><text x="290" y="465" font-size="30" fill="#357ca2" font-weight="700" text-anchor="middle" >Diffusion</text><text x="290" y="510" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Down a concentration gradient</text><text x="290" y="552" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >No metabolic energy required</text><rect x="605" y="420" width="450" height="160" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="830" y="465" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Active transport</text><text x="830" y="510" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Against a concentration gradient</text><text x="830" y="552" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Requires metabolic energy</text><text x="560" y="640" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >The two processes can contribute to uptake in the same cells.</text><rect x="24" y="684" width="1072" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="560.0" y="718" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Glucose enters by both processes → option C</text>
</g></svg>