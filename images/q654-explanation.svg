<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">For the known son M, haemophilia risk is 0.50</title><desc id="desc">A carrier mother XH Xh and unaffected father XH Y have a son M. The father supplies Y. The two equally likely maternal X alleles give an unaffected XH Y son or affected Xh Y son, so the known-son risk is one half.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="53" font-size="30" text-anchor="start" font-weight="bold" fill="#173f32">For the known son M, haemophilia risk is 0.50</text><text x="250" y="116" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">Carrier mother</text><text x="750" y="116" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">Unaffected father</text><circle cx="250" cy="195" r="55" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><rect x="695" y="140" width="110" height="110" rx="0" fill="#e5eef5" stroke="#537c9a" stroke-width="3"/><text x="250" y="204" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">XᴴXʰ</text><text x="750" y="204" font-size="27" text-anchor="middle" font-weight="bold" fill="#173f32">XᴴY</text><line x1="305" y1="195" x2="695" y2="195" stroke="#24644b" stroke-width="3"/><line x1="500" y1="195" x2="500" y2="300" stroke="#24644b" stroke-width="3"/><rect x="460" y="300" width="80" height="80" rx="0" fill="white" stroke="#24644b" stroke-width="3"/><text x="500" y="351" font-size="30" text-anchor="middle" font-weight="bold" fill="#173f32">M</text><text x="750" y="292" font-size="24" text-anchor="middle" font-weight="normal" fill="#173f32">Father gives Y</text><text x="250" y="292" font-size="24" text-anchor="middle" font-weight="normal" fill="#173f32">Mother gives either X</text><path d="M500 380 V395 H340 V438" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 395 H660 V438" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="428" font-size="22" text-anchor="middle" font-weight="normal" fill="#173f32">Possible genotypes for M</text><rect x="300" y="440" width="80" height="80" rx="0" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><rect x="620" y="440" width="80" height="80" rx="0" fill="#537c9a" stroke="#537c9a" stroke-width="3"/><text x="340" y="489" font-size="26" text-anchor="middle" font-weight="bold" fill="#173f32">XᴴY</text><text x="660" y="489" font-size="26" text-anchor="middle" font-weight="bold" fill="white">XʰY</text><text x="340" y="552" font-size="24" text-anchor="middle" font-weight="normal" fill="#173f32">Unaffected: ½</text><text x="660" y="552" font-size="24" text-anchor="middle" font-weight="normal" fill="#173f32">Haemophilia: ½</text><text x="500" y="589" font-size="23" text-anchor="middle" font-weight="bold" fill="#173f32">M is already male: 1 affected outcome out of 2 = 0.50.</text></g></svg>