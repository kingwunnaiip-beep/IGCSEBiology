<title id="q123-title">123 · Veins return blood towards the heart</title>
<desc id="q123-desc">Answer D: compared with an artery, a vein has a relatively thin wall and a large lumen, and veins have valves that prevent backflow. Blood in veins is at lower pressure than blood in arteries. Cross-section sketches compare the relatively thin venous wall with a thicker arterial wall qualitatively. A longitudinal vein sketch shows valve flaps and net blood flow towards the heart. Capillaries have walls only one cell thick, giving a short diffusion distance for exchange. No dimensions or measured wall-to-lumen ratios are implied by these drawings.</desc>
