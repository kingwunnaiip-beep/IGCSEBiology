<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-labelledby="q214-title q214-desc">
<title id="q214-title">Rotation prevents a persistent lower side</title>
<desc id="q214-desc">Qualitative comparison: a stationary horizontal shoot can bend upward away from gravity. On the rotating disc, which side faces down continually changes and the shoot remains straight, source option A. Gravity continues to act.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="740" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Rotation prevents a persistent lower side</text><text x="500" y="99" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative comparison of a stationary and rotating shoot</text><rect x="35" y="126" width="450" height="381" rx="12" fill="#f7f2e4" stroke="#daa958" stroke-width="2"/><rect x="515" y="126" width="450" height="381" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="260" y="173" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Stationary shoot</text><text x="740" y="173" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Constantly rotating disc</text><circle cx="100" cy="358" r="21" fill="#d7bc8e" stroke="#daa958" stroke-width="3"/><path d="M 123 358 L 236 358 Q 309 358 309 273" fill="none" stroke="#25614b" stroke-width="10"/><path d="M 309 273 Q 281 251 281 267 Q 288 282 309 273 Q 337 251 337 267 Q 330 282 309 273" fill="#b6d7a8" stroke="#25614b" stroke-width="2"/><line x1="405" y1="229" x2="405" y2="332" stroke="#357ca2" stroke-width="4"/><polygon points="405,332 398.07331236687776,318.6950761583107 411.92668763312224,318.6950761583107" fill="#357ca2"/><text x="404" y="372" font-size="25" fill="#357ca2" font-weight="400" text-anchor="middle" >gravity</text><text x="260" y="437" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >One side stays lower.</text><text x="260" y="472" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Unequal growth bends the shoot.</text><rect x="555" y="280" width="105" height="115" rx="0" fill="#e2e8e4" stroke="#526c62" stroke-width="2"/><ellipse cx="555" cy="337" rx="20" ry="57" fill="#e2e8e4" stroke="#526c62" stroke-width="3"/><ellipse cx="660" cy="337" rx="20" ry="57" fill="#e2e8e4" stroke="#526c62" stroke-width="3"/><circle cx="675" cy="337" r="12" fill="#d7bc8e" stroke="#daa958" stroke-width="2"/><line x1="689" y1="337" x2="829" y2="337" stroke="#25614b" stroke-width="10"/><path d="M 829 337 Q 848 311 853 326 Q 851 337 829 337 Q 848 363 853 348 Q 851 337 829 337" fill="#b6d7a8" stroke="#25614b" stroke-width="2"/><path d="M 589 254 C 555 215 523 266 551 292" fill="none" stroke="#357ca2" stroke-width="4"/><line x1="541" y1="281" x2="551" y2="292" stroke="#357ca2" stroke-width="4"/><polygon points="551,292 536.9248059498594,286.81454799936506 547.175473461146,277.49575935274095" fill="#357ca2"/><line x1="906" y1="228" x2="906" y2="329" stroke="#357ca2" stroke-width="4"/><polygon points="906,329 899.0733123668778,315.6950761583107 912.9266876331222,315.6950761583107" fill="#357ca2"/><text x="905" y="372" font-size="25" fill="#357ca2" font-weight="400" text-anchor="middle" >gravity</text><text x="740" y="437" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The lower side keeps changing.</text><text x="740" y="472" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The shoot grows straight.</text><text x="500" y="565" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Rotation averages the direction of the stimulus over time.</text><text x="500" y="603" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >It does not remove gravity.</text><rect x="24" y="664" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="698" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >A — straight shoot after seven days</text>
</g></svg>