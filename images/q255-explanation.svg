<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="q255-title q255-desc">
<title id="q255-title">Why bacteria are used as plasmid hosts</title>
<desc id="q255-desc">A bacterium contains a main chromosome and a separate plasmid ring. A plasmid can be isolated, cut and joined to a chosen gene, then introduced into bacteria. Many bacteria, rather than all organisms, possess plasmids.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1120" height="740" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="560.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Why bacteria are used as plasmid hosts</text><rect x="55" y="115" width="430" height="340" rx="150" fill="#e7f2f4" stroke="#357ca2" stroke-width="4"/><path d="M100 215 C130 150 250 155 275 245 C300 330 180 365 120 310 C70 260 175 210 225 260 C230 215 125 175 100 215 Z" fill="none" stroke="#357ca2" stroke-width="7"/><text x="270" y="425" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Bacterial cell</text><circle cx="405" cy="190" r="38" fill="none" stroke="#25614b" stroke-width="6"/><line x1="405" y1="230" x2="405" y2="275" stroke="#25614b" stroke-width="3"/><text x="392" y="310" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Plasmid: small,</text><text x="392" y="340" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >circular DNA</text><line x1="492" y1="190" x2="590" y2="190" stroke="#25614b" stroke-width="4"/><polygon points="590,190 576.6950761583107,196.92668763312224 576.6950761583107,183.07331236687776" fill="#25614b"/><circle cx="665" cy="190" r="55" fill="none" stroke="#25614b" stroke-width="7"/><path d="M652 136 A55 55 0 0 1 718 178" fill="none" stroke="#b94a43" stroke-width="11"/><text x="900" y="135" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Chosen gene</text><text x="900" y="169" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >inserted into</text><text x="900" y="203" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >the plasmid.</text><line x1="720" y1="178" x2="785" y2="166" stroke="#b94a43" stroke-width="3"/><rect x="565" y="330" width="500" height="155" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="815.0" y="370" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >A useful vector</text><text x="815.0" y="412" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >The plasmid carries the gene</text><text x="815.0" y="445" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >into a bacterial host.</text><line x1="815" y1="495" x2="815" y2="535" stroke="#25614b" stroke-width="4"/><polygon points="815,535 808.0733123668778,521.6950761583107 821.9266876331222,521.6950761583107" fill="#25614b"/><rect x="160" y="540" width="800" height="115" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="560.0" y="580" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Bacteria can copy the plasmid</text><text x="560.0" y="622" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >The introduced gene can be expressed by the host.</text><text x="560" y="700" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Schematic: bacteria may contain plasmids; the main chromosome is separate.</text>
</g></svg>