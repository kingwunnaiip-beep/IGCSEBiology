<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1480" viewBox="0 0 1000 1480" role="img" aria-labelledby="q89-title q89-desc">
<title id="q89-title">89 · Vaccination builds immune memory</title>
<desc id="q89-desc">Answer A. Antigens introduced by vaccination activate specific lymphocytes, which multiply. Activated B lymphocytes can develop into antibody-secreting plasma cells and memory B cells. Specific antibodies help protect against the pathogen. On later exposure to the same antigen, memory lymphocytes allow a faster and stronger immune response. Vaccination produces active immunity, often lasting a long time; injected antibodies provide passive, usually temporary protection without creating the recipient’s immune memory. Drawings are schematic and do not imply lifelong protection from every vaccine.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1480" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >89 · Vaccination builds immune memory</text><text x="500" y="103" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Antigens stimulate the body’s own immune response.</text><rect x="63" y="137" width="874" height="153" rx="12" fill="#f4efdf" stroke="none" stroke-width="2"/><path d="M 137 184 L 146.1 200.9 L 163 203.5 L 150.0 215.2 L 152.6 236 L 137 224.3 L 121.4 236 L 124.0 215.2 L 111 203.5 L 127.9 200.9 Z" fill="#efd8a1" stroke="#a47c22" stroke-width="2"/><text x="227" y="188" font-size="28" fill="#173d31" font-weight="700" text-anchor="start" >1 · Antigen introduced by vaccination</text><text x="227" y="232" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >The antigen is recognised as foreign.</text><text x="227" y="265" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >It is not an injection of memory cells.</text><line x1="500" y1="299" x2="500" y2="337" stroke="#25614b" stroke-width="4"/><polygon points="500,337 493.07331236687776,323.6950761583107 506.92668763312224,323.6950761583107" fill="#25614b"/><rect x="63" y="347" width="874" height="208" rx="12" fill="#edf5f8" stroke="none" stroke-width="2"/><text x="500" y="391" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >2 · Specific lymphocytes are activated and multiply</text><circle cx="219" cy="466" r="27" fill="#e0edf5" stroke="#357ca2" stroke-width="3"/><circle cx="216" cy="468" r="13.5" fill="#8aa9c3" stroke="none" stroke-width="3"/><path d="M 243 453 L 254 446 L 263 451" fill="none" stroke="#357ca2" stroke-width="3"/><line x1="279" y1="466" x2="354" y2="466" stroke="#357ca2" stroke-width="4"/><polygon points="354,466 340.6950761583107,472.92668763312224 340.6950761583107,459.07331236687776" fill="#357ca2"/><circle cx="420" cy="446" r="23" fill="#e0edf5" stroke="#357ca2" stroke-width="3"/><circle cx="417" cy="448" r="11.5" fill="#8aa9c3" stroke="none" stroke-width="3"/><path d="M 440 433 L 451 426 L 460 431" fill="none" stroke="#357ca2" stroke-width="3"/><circle cx="469" cy="491" r="23" fill="#e0edf5" stroke="#357ca2" stroke-width="3"/><circle cx="466" cy="493" r="11.5" fill="#8aa9c3" stroke="none" stroke-width="3"/><path d="M 489 478 L 500 471 L 509 476" fill="none" stroke="#357ca2" stroke-width="3"/><circle cx="535" cy="446" r="23" fill="#e0edf5" stroke="#357ca2" stroke-width="3"/><circle cx="532" cy="448" r="11.5" fill="#8aa9c3" stroke="none" stroke-width="3"/><path d="M 555 433 L 566 426 L 575 431" fill="none" stroke="#357ca2" stroke-width="3"/><circle cx="587" cy="491" r="23" fill="#e0edf5" stroke="#357ca2" stroke-width="3"/><circle cx="584" cy="493" r="11.5" fill="#8aa9c3" stroke="none" stroke-width="3"/><path d="M 607 478 L 618 471 L 627 476" fill="none" stroke="#357ca2" stroke-width="3"/><text x="738" y="454" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >More cells recognise</text><text x="738" y="488" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >the same antigen.</text><line x1="420" y1="563" x2="263" y2="610" stroke="#357ca2" stroke-width="4"/><polygon points="263,610 273.75954693821706,599.5485814510994 277.7325291621962,612.8200327099233" fill="#357ca2"/><line x1="580" y1="563" x2="737" y2="610" stroke="#25614b" stroke-width="4"/><polygon points="737,610 722.2674708378038,612.8200327099233 726.2404530617829,599.5485814510994" fill="#25614b"/><rect x="48" y="623" width="442" height="315" rx="12" fill="#edf5f8" stroke="none" stroke-width="2"/><rect x="510" y="623" width="442" height="315" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="269" y="665" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Antibody-producing branch</text><text x="731" y="665" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Memory-cell branch</text><ellipse cx="168" cy="745" rx="48" ry="39" fill="#d6e6f1" stroke="#357ca2" stroke-width="3"/><circle cx="145" cy="745" r="18" fill="#8aa9c3" stroke="none" stroke-width="3"/><line x1="258" y1="747" x2="258" y2="726" stroke="#357ca2" stroke-width="4"/><line x1="258" y1="726" x2="244.35" y2="712.35" stroke="#357ca2" stroke-width="4"/><line x1="258" y1="726" x2="271.65" y2="712.35" stroke="#357ca2" stroke-width="4"/><line x1="321" y1="722" x2="321" y2="701" stroke="#357ca2" stroke-width="4"/><line x1="321" y1="701" x2="307.35" y2="687.35" stroke="#357ca2" stroke-width="4"/><line x1="321" y1="701" x2="334.65" y2="687.35" stroke="#357ca2" stroke-width="4"/><line x1="383" y1="760" x2="383" y2="739" stroke="#357ca2" stroke-width="4"/><line x1="383" y1="739" x2="369.35" y2="725.35" stroke="#357ca2" stroke-width="4"/><line x1="383" y1="739" x2="396.65" y2="725.35" stroke="#357ca2" stroke-width="4"/><text x="269" y="821" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >B cells become plasma cells.</text><text x="269" y="852" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >They produce specific antibodies</text><text x="269" y="883" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >that help protect against</text><text x="269" y="914" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >the pathogen.</text><circle cx="654" cy="737" r="26" fill="#e2edcf" stroke="#25614b" stroke-width="3"/><circle cx="651" cy="739" r="13.0" fill="#a9c293" stroke="none" stroke-width="3"/><path d="M 677 724 L 688 717 L 697 722" fill="none" stroke="#25614b" stroke-width="3"/><circle cx="730" cy="761" r="26" fill="#e2edcf" stroke="#25614b" stroke-width="3"/><circle cx="727" cy="763" r="13.0" fill="#a9c293" stroke="none" stroke-width="3"/><path d="M 753 748 L 764 741 L 773 746" fill="none" stroke="#25614b" stroke-width="3"/><circle cx="806" cy="737" r="26" fill="#e2edcf" stroke="#25614b" stroke-width="3"/><circle cx="803" cy="739" r="13.0" fill="#a9c293" stroke="none" stroke-width="3"/><path d="M 829 724 L 840 717 L 849 722" fill="none" stroke="#25614b" stroke-width="3"/><text x="731" y="821" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Memory lymphocytes form.</text><text x="731" y="852" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Some can remain for a long time.</text><text x="731" y="883" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >They recognise the same antigen</text><text x="731" y="914" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >if it is encountered again.</text><line x1="731" y1="948" x2="731" y2="982" stroke="#25614b" stroke-width="4"/><polygon points="731,982 724.0733123668778,968.6950761583107 737.9266876331222,968.6950761583107" fill="#25614b"/><rect x="63" y="997" width="874" height="145" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><path d="M 133 1041 L 141.05 1055.95 L 156 1058.25 L 144.5 1068.6 L 146.8 1087 L 133 1076.65 L 119.2 1087 L 121.5 1068.6 L 110 1058.25 L 124.95 1055.95 Z" fill="#efd8a1" stroke="#a47c22" stroke-width="2"/><text x="230" y="1040" font-size="27" fill="#173d31" font-weight="700" text-anchor="start" >3 · Later exposure to the same antigen</text><text x="230" y="1082" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >Memory cells enable a faster, stronger response.</text><text x="230" y="1116" font-size="24" fill="#173d31" font-weight="400" text-anchor="start" >This is the basis of long-term immune protection.</text><rect x="63" y="1180" width="423" height="172" rx="12" fill="#edf5f8" stroke="none" stroke-width="2"/><rect x="514" y="1180" width="423" height="172" rx="12" fill="#f4efdf" stroke="none" stroke-width="2"/><text x="274" y="1221" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Active immunity</text><text x="274" y="1263" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Own immune response</text><text x="274" y="1296" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Memory cells formed</text><text x="274" y="1329" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Example: vaccination</text><text x="726" y="1221" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Passive immunity</text><text x="726" y="1263" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Antibodies received</text><text x="726" y="1296" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >No new memory from antibodies</text><text x="726" y="1329" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >Usually temporary protection</text><text x="500" y="1390" font-size="23" fill="#526c62" font-weight="400" text-anchor="middle" >Long-term protection does not mean every vaccine lasts for life.</text><rect x="24" y="1404" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1438" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer A · Antigen → lymphocytes → antibodies and memory cells</text>
</g></svg>