<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Size follows the level of organisation</title><desc id="desc">A chromosome fits inside a nucleus in a white blood cell. A liver is an organ much larger than any individual cell. Nested boxes illustrate relative size and are not anatomical placement of the white blood cell.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#24543e"/></marker></defs><rect width="900" height="540" fill="#fbf8ed"/><g font-family="Arial, sans-serif"><text x="450" y="45" font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#203e30">Size follows the level of organisation</text><rect x="42" y="98" width="816" height="345" rx="14" fill="#e6efdc" stroke="#24543e" stroke-width="2"/><text x="450" y="135" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#203e30">Liver: a whole organ</text><rect x="170" y="164" width="575" height="240" rx="14" fill="#b9d8ae" stroke="#24543e" stroke-width="2"/><text x="455" y="201" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#203e30">White blood cell: one cell</text><circle cx="450" cy="300" r="78" fill="#fbf8ed" stroke="#24543e" stroke-width="2"/><text x="450" y="280" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#203e30">nucleus</text><line x1="435" y1="310" x2="465" y2="350" stroke="#24543e" stroke-width="7"/><line x1="465" y1="310" x2="435" y2="350" stroke="#24543e" stroke-width="7"/><line x1="300" y1="363" x2="419.26007980284345" y2="339.6859994370381" stroke="#24543e" stroke-width="3"/><polygon points="433,337 420.41122241871693,345.5745366643909 418.10893718696997,333.7974622096853" fill="#24543e"/><text x="266" y="391" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#203e30">chromosome</text><text x="450" y="485" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#203e30">Smallest: chromosome → white blood cell → liver :largest</text><text x="450" y="518" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#203e30">Nested size model; different cell types shown schematically, not to scale.</text></g></svg>