<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" role="img" aria-labelledby="title desc"><title id="title">Track catalyst and reacting molecules separately</title><desc id="desc">Three stages show an unchanged enzyme, substrate fitting its active site, then released products. The enzyme is the same shape before and after the reaction and can be reused.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#276b46"/></marker></defs><rect width="1000" height="570" rx="20" fill="#fbfaf0"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="53" fill="#203e33" font-size="30" font-weight="bold" text-anchor="start">Track catalyst and reacting molecules separately</text><text x="40" y="95" fill="#203e33" font-size="22" font-weight="normal" text-anchor="start">Substrate changes into products; the enzyme is not consumed.</text><rect x="45" y="125" width="280" height="315" rx="14" fill="#f2f5e8" stroke="#276b46" stroke-width="2"/><text x="185" y="166" fill="#203e33" font-size="26" font-weight="bold" text-anchor="middle">Before</text><rect x="360" y="125" width="280" height="315" rx="14" fill="#f2f5e8" stroke="#276b46" stroke-width="2"/><text x="500" y="166" fill="#203e33" font-size="26" font-weight="bold" text-anchor="middle">During</text><rect x="675" y="125" width="280" height="315" rx="14" fill="#f2f5e8" stroke="#276b46" stroke-width="2"/><text x="815" y="166" fill="#203e33" font-size="26" font-weight="bold" text-anchor="middle">After</text><path d="M185 225 A75 75 0 1 0 185 335 L138 280 Z" fill="#dcebd8" stroke="#276b46" stroke-width="4"/><path d="M235 280 L280 235 L280 325 Z" fill="#d7a542" stroke="#276b46" stroke-width="3"/><text x="185" y="395" fill="#203e33" font-size="20" font-weight="normal" text-anchor="middle">enzyme + substrate</text><path d="M500 225 A75 75 0 1 0 500 335 L453 280 Z" fill="#dcebd8" stroke="#276b46" stroke-width="4"/><path d="M453 280 L500 225 L500 335 Z" fill="#d7a542" stroke="#276b46" stroke-width="3"/><text x="500" y="395" fill="#203e33" font-size="20" font-weight="normal" text-anchor="middle">temporary complex</text><path d="M815 225 A75 75 0 1 0 815 335 L768 280 Z" fill="#dcebd8" stroke="#276b46" stroke-width="4"/><path d="M865 258 L910 218 L910 280 Z" fill="#d7a542" stroke="#276b46" stroke-width="3"/><path d="M865 315 L910 293 L910 355 Z" fill="#d7a542" stroke="#276b46" stroke-width="3"/><text x="815" y="395" fill="#203e33" font-size="20" font-weight="normal" text-anchor="middle">enzyme + products</text><path d="M329 280 L353 280" fill="none" stroke="#276b46" stroke-width="3" marker-end="url(#arrow)"/><path d="M644 280 L668 280" fill="none" stroke="#276b46" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="487" fill="#203e33" font-size="24" font-weight="bold" text-anchor="start">Add more substrate → the same enzyme can catalyse again.</text><text x="40" y="548" fill="#65776d" font-size="16" font-weight="normal" text-anchor="start">Original teaching schematic • diagrams are not to scale</text></g></svg>