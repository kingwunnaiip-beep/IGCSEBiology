<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050" role="img" aria-labelledby="q82-title q82-desc">
<title id="q82-title">82 · Xylem carries water to the leaf</title>
<desc id="q82-desc">A leaf cross section shows an upper epidermis, palisade cells labelled A, spongy mesophyll with air spaces, and a vein within the mesophyll. The upper part of the vein is xylem, labelled B, and the lower part is phloem, labelled C. D labels the lower epidermis. Xylem transports water and mineral ions from roots to leaves through lignified dead mature elements. Phloem carries sucrose and amino acids from source to sink, in either direction in different sieve tubes.</desc>
