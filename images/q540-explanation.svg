<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">The optic-nerve exit has no photoreceptors</title><desc id="desc">A schematic strip of retina has rod and cone receptors except at a gap where nerve fibres leave as the optic nerve. The gap is the blind spot. Its identifying graph feature is zero density for both receptor types.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2e7656"/></marker></defs><rect width="1000" height="620" rx="24" fill="#fbf9ec"/><g font-family="sans-serif" fill="#173e32"><text x="42" y="55" font-size="31" text-anchor="start" fill="#173e32">The optic-nerve exit has no photoreceptors</text><text x="500" y="111" font-size="24" text-anchor="middle" fill="#173e32">Photoreceptors along a simplified retina</text><rect x="90" y="170" width="15" height="120" rx="7" fill="#72a068"/><path d="M115 290L124 175L133 290Z" fill="#c8a454"/><rect x="150" y="170" width="15" height="120" rx="7" fill="#72a068"/><path d="M175 290L184 175L193 290Z" fill="#c8a454"/><rect x="210" y="170" width="15" height="120" rx="7" fill="#72a068"/><path d="M235 290L244 175L253 290Z" fill="#c8a454"/><rect x="270" y="170" width="15" height="120" rx="7" fill="#72a068"/><path d="M295 290L304 175L313 290Z" fill="#c8a454"/><rect x="330" y="170" width="15" height="120" rx="7" fill="#72a068"/><path d="M355 290L364 175L373 290Z" fill="#c8a454"/><rect x="390" y="170" width="15" height="120" rx="7" fill="#72a068"/><path d="M415 290L424 175L433 290Z" fill="#c8a454"/><rect x="450" y="170" width="15" height="120" rx="7" fill="#72a068"/><path d="M475 290L484 175L493 290Z" fill="#c8a454"/><rect x="510" y="170" width="15" height="120" rx="7" fill="#72a068"/><path d="M535 290L544 175L553 290Z" fill="#c8a454"/><rect x="690" y="170" width="15" height="120" rx="7" fill="#72a068"/><path d="M715 290L724 175L733 290Z" fill="#c8a454"/><rect x="750" y="170" width="15" height="120" rx="7" fill="#72a068"/><path d="M775 290L784 175L793 290Z" fill="#c8a454"/><rect x="810" y="170" width="15" height="120" rx="7" fill="#72a068"/><path d="M835 290L844 175L853 290Z" fill="#c8a454"/><rect x="870" y="170" width="15" height="120" rx="7" fill="#72a068"/><path d="M895 290L904 175L913 290Z" fill="#c8a454"/><path d="M70 305H575 M700 305H930 M580 305C580 360 615 380 640 408 M695 305C695 360 665 380 640 408" stroke="#2e7656" stroke-width="10" fill="none"/><text x="637" y="157" font-size="22" text-anchor="middle" fill="#173e32">No rods</text><text x="637" y="187" font-size="22" text-anchor="middle" fill="#173e32">or cones</text><text x="640" y="447" font-size="25" text-anchor="middle" fill="#173e32">Optic nerve exits</text><text x="640" y="482" font-size="28" text-anchor="middle" fill="#173e32">Blind spot</text><text x="230" y="375" font-size="22" text-anchor="start" fill="#173e32">Rods</text><text x="355" y="375" font-size="22" text-anchor="start" fill="#173e32">Cones</text><rect x="205" y="350" width="15" height="30" rx="7" fill="#72a068"/><path d="M326 380L335 350L344 380Z" fill="#c8a454"/><text x="500" y="560" font-size="24" text-anchor="middle" fill="#173e32">On a receptor-density graph, find where BOTH curves reach zero.</text><text x="500" y="596" font-size="20" text-anchor="middle" fill="#173e32">Schematic strip: positions and receptor counts are illustrative, not measured.</text></g></svg>