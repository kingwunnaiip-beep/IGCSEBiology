<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-labelledby="q288-title q288-desc">
<title id="q288-title">Indicator colour follows the carbon dioxide balance</title>
<desc id="q288-desc">In light, a green leaf respires and photosynthesises. When photosynthesis exceeds respiration, carbon dioxide falls and hydrogencarbonate indicator becomes purple. In darkness, respiration releases carbon dioxide and the indicator becomes yellow. Both tubes begin orange.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="780" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Indicator colour follows the carbon dioxide balance</text><rect x="55" y="100" width="455" height="110" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="282.5" y="140" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >Light</text><text x="282.5" y="182" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Photosynthesis + respiration</text><rect x="590" y="100" width="455" height="110" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="817.5" y="140" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >Dark</text><text x="817.5" y="182" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Respiration; no photosynthesis</text><line x1="282" y1="225" x2="282" y2="280" stroke="#25614b" stroke-width="4"/><polygon points="282,280 275.07331236687776,266.6950761583107 288.92668763312224,266.6950761583107" fill="#25614b"/><line x1="817" y1="225" x2="817" y2="280" stroke="#25614b" stroke-width="4"/><polygon points="817,280 810.0733123668778,266.6950761583107 823.9266876331222,266.6950761583107" fill="#25614b"/><rect x="55" y="290" width="455" height="125" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="282.5" y="330" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >Net CO₂ removal</text><text x="282.5" y="372" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Photosynthesis uses more CO₂</text><text x="282.5" y="407" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >than respiration releases.</text><rect x="590" y="290" width="455" height="125" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="817.5" y="330" font-size="28" fill="#25614b" font-weight="700" text-anchor="middle" >Net CO₂ release</text><text x="817.5" y="372" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Respiration adds CO₂</text><text x="817.5" y="407" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >to the air around the leaf.</text><line x1="282" y1="430" x2="282" y2="478" stroke="#25614b" stroke-width="4"/><polygon points="282,478 275.07331236687776,464.6950761583107 288.92668763312224,464.6950761583107" fill="#25614b"/><line x1="817" y1="430" x2="817" y2="478" stroke="#25614b" stroke-width="4"/><polygon points="817,478 810.0733123668778,464.6950761583107 823.9266876331222,464.6950761583107" fill="#25614b"/><rect x="55" y="490" width="455" height="110" rx="12" fill="#eadcf5" stroke="#753b95" stroke-width="2"/><text x="282.5" y="530" font-size="28" fill="#753b95" font-weight="700" text-anchor="middle" >PURPLE</text><text x="282.5" y="572" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >CO₂ below the starting level</text><rect x="590" y="490" width="455" height="110" rx="12" fill="#fff0ad" stroke="#80651b" stroke-width="2"/><text x="817.5" y="530" font-size="28" fill="#80651b" font-weight="700" text-anchor="middle" >YELLOW</text><text x="817.5" y="572" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >CO₂ above the starting level</text><text x="550" y="655" font-size="26" fill="#173d31" font-weight="400" text-anchor="middle" >Starting colour: orange. Respiration continues in both leaves.</text><rect x="24" y="704" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="738" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B: light = purple; dark = yellow.</text>
</g></svg>