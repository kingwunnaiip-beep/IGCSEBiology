<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="q484-title q484-desc">
<title id="q484-title">Dead producers feed decomposer bacteria</title>
<desc id="q484-desc">The eutrophication pathway runs from extra nitrates to algal growth, producer death, extra dead organic matter and an increase in decomposer bacteria. Bacterial aerobic respiration then reduces dissolved oxygen. The direct food supply for bacteria is the dead organic matter.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="650" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >Dead producers feed decomposer bacteria</text><rect x="25" y="95" width="285" height="110" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="167.5" y="133" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Extra nitrates</text><text x="167.5" y="171" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >algal growth increases</text><line x1="320" y1="150" x2="355" y2="150" stroke="#25614b" stroke-width="4"/><polygon points="355,150 341.6950761583107,156.92668763312224 341.6950761583107,143.07331236687776" fill="#25614b"/><rect x="370" y="95" width="285" height="110" rx="12" fill="#e5e5cd" stroke="#25614b" stroke-width="2"/><text x="512.5" y="133" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Producer death</text><text x="512.5" y="171" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >dead organic matter</text><line x1="665" y1="150" x2="700" y2="150" stroke="#25614b" stroke-width="4"/><polygon points="700,150 686.6950761583107,156.92668763312224 686.6950761583107,143.07331236687776" fill="#25614b"/><rect x="715" y="95" width="260" height="110" rx="12" fill="#cee3b5" stroke="#25614b" stroke-width="2"/><text x="845.0" y="133" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Bacteria increase</text><text x="845.0" y="171" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >more food available</text><line x1="850" y1="218" x2="850" y2="285" stroke="#357ca2" stroke-width="5"/><polygon points="850,285 843.0733123668778,271.6950761583107 856.9266876331222,271.6950761583107" fill="#357ca2"/><rect x="675" y="300" width="300" height="145" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="825.0" y="338" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Aerobic respiration</text><text x="825.0" y="376" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >uses dissolved oxygen</text><line x1="665" y1="370" x2="605" y2="370" stroke="#357ca2" stroke-width="5"/><polygon points="605,370 618.3049238416893,363.07331236687776 618.3049238416893,376.92668763312224" fill="#357ca2"/><rect x="270" y="300" width="320" height="145" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="430.0" y="338" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Oxygen decreases</text><text x="430.0" y="376" font-size="23" fill="#173d31" font-weight="400" text-anchor="middle" >aquatic animals may die</text><rect x="45" y="495" width="910" height="65" rx="12" fill="#d8e9c6" stroke="none" stroke-width="2"/><text x="500" y="535" font-size="24" fill="#173d31" font-weight="700" text-anchor="middle" >Direct cause of bacterial growth = more dead producers as food</text><rect x="24" y="574" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="608" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Increased producer death directly supports bacterial increase: D.</text>
</g></svg>