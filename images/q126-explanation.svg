<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1290" viewBox="0 0 1000 1290" role="img" aria-labelledby="q126-title q126-desc">
<title id="q126-title">126 · Genetic modification adds a gene to a crop</title>
<desc id="q126-desc">Answer C: inserting genes into crop plants to improve their nutritional qualities. Genetic modification changes an organism’s genetic material by introducing a desired gene. Here a simplified DNA segment is shown entering a crop cell; expression of the introduced gene can improve nutritional qualities of the crop. Choosing cattle with high milk yield as parents and crossing crop plants with desirable traits are examples of selective breeding, which selects and combines existing alleles through reproduction. Applying insecticides is crop management. The schematic does not show a specific gene, molecule, or measured nutrient increase.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
