<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="q23-title q23-desc"><title id="q23-title">Labelled sugars travel in phloem</title><desc id="q23-desc">A mature photosynthesising leaf takes in carbon-14 labelled carbon dioxide and produces labelled sugars. Sucrose travels in phloem upwards to growing shoots and flowers, and downwards to roots. The leaf is a source; growing regions are sinks.</desc><defs><marker id="q23-green-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#397359"/></marker><marker id="q23-blue-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3d79a0"/></marker><marker id="q23-red-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85c5e"/></marker><marker id="q23-gold-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b88838"/></marker></defs><rect width="640" height="420" rx="20" fill="#f8faf6"/><g font-family="Arial, Helvetica, sans-serif"><text x="320" y="42" font-size="32" text-anchor="middle" fill="#223c35" font-weight="bold">Labelled sugars travel in phloem</text><path d="M 330 107 V 345" stroke="#397359" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="245" cy="205" rx="88" ry="35" fill="#dcebdd" stroke="#397359" stroke-width="3" transform="rotate(-23 245 205)"/><path d="M 171 236 L 324 178" stroke="#397359" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="384" cy="266" rx="56" ry="23" fill="#dcebdd" stroke="#397359" stroke-width="3" transform="rotate(25 384 266)"/><circle cx="330" cy="74" r="17" fill="#e7d7a2" stroke="#b88838" stroke-width="2"/><circle cx="352" cy="90" r="17" fill="#e7d7a2" stroke="#b88838" stroke-width="2"/><circle cx="344" cy="115" r="17" fill="#e7d7a2" stroke="#b88838" stroke-width="2"/><circle cx="316" cy="115" r="17" fill="#e7d7a2" stroke="#b88838" stroke-width="2"/><circle cx="308" cy="90" r="17" fill="#e7d7a2" stroke="#b88838" stroke-width="2"/><circle cx="330" cy="98" r="12" fill="#b88838" stroke="none" stroke-width="3"/><path d="M 330 344 L 276 385" stroke="#397359" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 330 344 L 310 382" stroke="#397359" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 330 344 L 353 384" stroke="#397359" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 330 344 L 389 379" stroke="#397359" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 265 211 H 348 V 130" stroke="#b88838" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#q23-gold-arrow)"/><path d="M 348 212 V 335" stroke="#b88838" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#q23-gold-arrow)"/><text x="128" y="106" font-size="28" text-anchor="middle" fill="#223c35" font-weight="normal">Carbon-14 CO2</text><path d="M 156 123 L 205 169" stroke="#397359" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#q23-green-arrow)"/><text x="111" y="286" font-size="28" text-anchor="middle" fill="#223c35" font-weight="bold">Source leaf</text><text x="119" y="322" font-size="28" text-anchor="middle" fill="#223c35" font-weight="normal">Photosynthesis</text><text x="483" y="99" font-size="28" text-anchor="middle" fill="#223c35" font-weight="bold">Shoot + flower</text><text x="483" y="134" font-size="28" text-anchor="middle" fill="#223c35" font-weight="normal">Sinks</text><text x="475" y="235" font-size="28" text-anchor="middle" fill="#223c35" font-weight="normal">Phloem</text><path d="M 416 243 H 359" stroke="#b8cbbd" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="475" y="340" font-size="28" text-anchor="middle" fill="#223c35" font-weight="bold">Roots</text><text x="475" y="375" font-size="28" text-anchor="middle" fill="#223c35" font-weight="normal">Sink</text><text x="320" y="409" font-size="28" text-anchor="middle" fill="#223c35" font-weight="normal">Labelled sucrose moves up and down</text></g></svg>