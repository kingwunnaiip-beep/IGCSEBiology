<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="890" viewBox="0 0 1000 890" role="img" aria-labelledby="q244-title q244-desc">
<title id="q244-title">Genetic information: human cell to insulin</title>
<desc id="q244-desc">Qualitative genetic-engineering and gene-expression model, not to scale. Source numbers identify 3 human cell, 2 plasmid, 1 bacterial cell and 4 ribosome. An insulin gene from human DNA is inserted into a plasmid and transferred into a bacterial cell. In the bacterial cell, transcription makes mRNA, which a ribosome translates to insulin. The information route 3 to 2 to 1 to 4 does not mean DNA enters a ribosome.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
