fill="none" stroke="#bc824b" stroke-width="3" /><text x="577" y="323" font-size="23" fill="#bc824b" text-anchor="middle" font-weight="normal">O</text><path d="M590 315 L608 315" fill="none" stroke="#bc824b" stroke-width="3" /><text x="622" y="323" font-size="23" fill="#bc824b" text-anchor="middle" font-weight="normal">C</text><path d="M618 300 L618 285" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M625 300 L625 285" fill="none" stroke="#bc824b" stroke-width="2" /><text x="622" y="277" font-size="22" fill="#bc824b" text-anchor="middle" font-weight="normal">O</text><path d="M637 315 L660 297 L690 325 L720 297 L750 325 L780 297 L810 325 L845 315" fill="none" stroke="#bc824b" stroke-width="5" /><ellipse cx="530" cy="395" rx="23" ry="23" fill="#e4f0df" stroke="#24644b" stroke-width="3" /><text x="530" y="403" font-size="24" fill="#173f32" text-anchor="middle" font-weight="normal">C</text><path d="M553 395 L565 395" fill="none" stroke="#bc824b" stroke-width="3" /><text x="577" y="403" font-size="23" fill="#bc824b" text-anchor="middle" font-weight="normal">O</text><path d="M590 395 L608 395" fill="none" stroke="#bc824b" stroke-width="3" /><text x="622" y="403" font-size="23" fill="#bc824b" text-anchor="middle" font-weight="normal">C</text><path d="M618 380 L618 365" fill="none" stroke="#bc824b" stroke-width="2" /><path d="M625 380 L625 365" fill="none" stroke="#bc824b" stroke-width="2" /><text x="622" y="357" font-size="22" fill="#bc824b" text-anchor="middle" font-weight="normal">O</text><path d="M637 395 L660 377 L690 405 L720 377 L750 405 L780 377 L810 405 L845 395" fill="none" stroke="#bc824b" stroke-width="5" /><path d="M530 258 L530 292" fill="none" stroke="#24644b" stroke-width="4" /><path d="M530 338 L530 372" fill="none" stroke="#24644b" stroke-width="4" /><text x="530" y="470" font-size="22" fill="#24644b" text-anchor="middle" font-weight="normal">Glycerol backbone</text><text x="795" y="470" font-size="22" fill="#bc824b" text-anchor="middle" font-weig