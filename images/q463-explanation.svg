<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="q463-t q463-d"><title id="q463-t">Sickling shows that an S allele is present</title><desc id="q463-d">Three genotype cards show normal AA without an S allele, AS trait with sickling possible under sufficiently low oxygen, and SS disease. The two genotypes with S are compatible with the observed sickled cell.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#1d513d"/></marker></defs><rect width="1000" height="620" rx="24" fill="#fffdf3"/><g font-family="Arial, sans-serif"><text x="45" y="58" font-size="30" text-anchor="start" fill="#173e32" font-weight="bold">Sickling shows that an S allele is present</text><text x="55" y="110" font-size="26" text-anchor="start" fill="#173e32" font-weight="normal">At least one S allele is needed for sickling.</text><rect x="45" y="145" width="290" height="365" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="190" y="195" font-size="34" text-anchor="middle" fill="#173e32" font-weight="bold">HbᴬHbᴬ</text><ellipse cx="190" cy="285" rx="63" ry="34" fill="#e6c776" stroke="#1d513d" stroke-width="3"/><ellipse cx="190" cy="285" rx="25" ry="13" fill="#fffdf3" stroke="#1d513d" stroke-width="3"/><text x="190" y="390" font-size="23" text-anchor="middle" fill="#173e32" font-weight="normal">No S allele</text><text x="190" y="427" font-size="23" text-anchor="middle" fill="#173e32" font-weight="normal">Sickling unexplained</text><rect x="355" y="145" width="290" height="365" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="500" y="195" font-size="34" text-anchor="middle" fill="#173e32" font-weight="bold">HbˢHbᴬ</text><path d="M445 245 Q590 280 445 330 Q530 286 445 245" fill="#e6c776" stroke="#1d513d" stroke-width="3"/><text x="500" y="390" font-size="23" text-anchor="middle" fill="#173e32" font-weight="normal">Sickle-cell trait</text><text x="500" y="427" font-size="23" text-anchor="middle" fill="#173e32" font-weight="normal">Can sickle at low O₂</text><rect x="665" y="145" width="290" height="365" rx="18" fill="#e4efde" stroke="#649768" stroke-width="2"/><text x="810" y="195" font-size="34" text-anchor="middle" fill="#173e32" font-weight="bold">HbˢHbˢ</text><path d="M755 245 Q900 280 755 330 Q840 286 755 245" fill="#e6c776" stroke="#1d513d" stroke-width="3"/><text x="810" y="390" font-size="23" text-anchor="middle" fill="#173e32" font-weight="normal">Sickle-cell disease</text><text x="810" y="427" font-size="23" text-anchor="middle" fill="#173e32" font-weight="normal">Sickling possible</text><text x="500" y="551" font-size="25" text-anchor="middle" fill="#173e32" font-weight="normal">The image cannot distinguish trait from disease on its own.</text><text x="45" y="589" font-size="18" text-anchor="start" fill="#546d5e" font-weight="normal">Original teaching schematic • qualitative unless values are stated</text></g></svg>