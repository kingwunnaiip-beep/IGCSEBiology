<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="q37-title q37-desc">
<title id="q37-title">Plasmolysis in a plant cell</title>
<desc id="q37-desc">A plant cell in concentrated salt solution loses water by osmosis. Initially the solution outside has a lower water potential than the cell contents. The rigid cell wall retains its shape while the vacuole and cytoplasm shrink and the cell membrane withdraws from the wall.</desc>
