<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="q44-title q44-desc"><title id="q44-title">More A–T → lower melting</title><desc id="q44-desc">DNA molecule 1 has 40 percent AT and 60 percent GC; molecule 2 has 60 percent AT and 40 percent GC. AT pairs have two hydrogen bonds and CG pairs have three. DNA 2 separates at the lower temperature under the same conditions.</desc><defs><marker id="q44-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#244d3d"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;font-size:28px;fill:#244d3d}path,line,polyline{stroke-linecap:round;stroke-linejoin:round}.heading{font-size:32px;font-weight:700}.small{font-size:28px}.bold{font-weight:700}.red{fill:#b65350}.blue{fill:#447c9a}.muted{fill:#698476}.arrow{stroke:#244d3d;stroke-width:4;fill:none;marker-end:url(#q44-arrow)}</style><rect x="1" y="1" width="638" height="418" rx="24" fill="#f5f8f2" stroke="#dbe9d7" stroke-width="2"/><text x="30" y="45" class="heading">More A–T → lower melting</text><text x="25" y="145" >DNA 1</text><text x="25" y="245" >DNA 2</text><rect x="158" y="111" width="177.6" height="60" fill="#efe4c8" stroke="#f5f8f2" stroke-width="2"/><rect x="335.6" y="111" width="266.4" height="60" fill="#659b78" stroke="#f5f8f2" stroke-width="2"/><text x="246.8" y="150" text-anchor="middle" class="bold">AT 40%</text><text x="468.8" y="150" text-anchor="middle" class="bold">GC 60%</text><rect x="158" y="211" width="266.4" height="60" fill="#efe4c8" stroke="#f5f8f2" stroke-width="2"/><rect x="424.4" y="211" width="177.60000000000002" height="60" fill="#659b78" stroke="#f5f8f2" stroke-width="2"/><text x="291.2" y="250" text-anchor="middle" class="bold">AT 60%</text><text x="513.2" y="250" text-anchor="middle" class="bold">GC 40%</text><rect x="45" y="307" width="42" height="50" rx="7" fill="#efe4c8"/><rect x="164" y="307" width="42" height="50" rx="7" fill="#efe4c8"/><text x="66" y="342" text-anchor="middle">A</text><text x="185" y="342" text-anchor="middle">T</text><line x1="90" y1="322" x2="160" y2="322" stroke="#bd9550" stroke-width="4" stroke-dasharray="5 7"/><line x1="90" y1="342" x2="160" y2="342" stroke="#bd9550" stroke-width="4" stroke-dasharray="5 7"/><text x="125" y="399" text-anchor="middle">2 bonds</text><rect x="260" y="307" width="42" height="50" rx="7" fill="#dbe9d7"/><rect x="379" y="307" width="42" height="50" rx="7" fill="#dbe9d7"/><text x="281" y="342" text-anchor="middle">C</text><text x="400" y="342" text-anchor="middle">G</text><line x1="305" y1="315" x2="375" y2="315" stroke="#659b78" stroke-width="4" stroke-dasharray="5 7"/><line x1="305" y1="332" x2="375" y2="332" stroke="#659b78" stroke-width="4" stroke-dasharray="5 7"/><line x1="305" y1="349" x2="375" y2="349" stroke="#659b78" stroke-width="4" stroke-dasharray="5 7"/><text x="340" y="399" text-anchor="middle">3 bonds</text><text x="520" y="322" text-anchor="middle" class="bold">DNA 2</text><text x="520" y="358" text-anchor="middle">melts</text><text x="520" y="394" text-anchor="middle" class="bold">lower</text></svg>
