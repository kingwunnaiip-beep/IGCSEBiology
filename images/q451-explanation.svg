<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Follow the secretion route</title><desc id="desc">An endocrine gland releases hormone into a blood capillary, which carries it to a target. An exocrine gland releases secretion through a duct to a body surface or cavity. Adrenal glands, pancreas and testes all have endocrine tissue.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="40" y="54" font-size="31" fill="#173f32" text-anchor="start" font-weight="bold">Follow the secretion route</text><rect x="42" y="116" width="916" height="190" rx="18" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><text x="75" y="158" font-size="27" fill="#173f32" text-anchor="start" font-weight="bold">Endocrine route</text><circle cx="136" cy="235" r="42" fill="#c7dec8" stroke="#24644b" stroke-width="3"/><text x="136" y="242" font-size="20" fill="#173f32" text-anchor="middle" font-weight="normal">gland</text><path d="M184,235 L361,235" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><rect x="380" y="201" width="258" height="67" rx="12" fill="#e0eef1" stroke="#537c9a" stroke-width="3"/><text x="509" y="243" font-size="24" fill="#173f32" text-anchor="middle" font-weight="normal">blood capillary</text><path d="M648,235 L784,235" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><circle cx="862" cy="235" r="44" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><text x="862" y="242" font-size="20" fill="#173f32" text-anchor="middle" font-weight="normal">target</text><text x="275" y="208" font-size="21" fill="#173f32" text-anchor="middle" font-weight="normal">hormone</text><rect x="42" y="332" width="916" height="190" rx="18" fill="#e4f0df" stroke="#24644b" stroke-width="3"/><text x="75" y="373" font-size="27" fill="#173f32" text-anchor="start" font-weight="bold">Exocrine route</text><circle cx="136" cy="446" r="42" fill="#c7dec8" stroke="#24644b" stroke-width="3"/><text x="136" y="453" font-size="20" fill="#173f32" text-anchor="middle" font-weight="normal">gland</text><rect x="216" y="425" width="410" height="40" rx="8" fill="#fdfbf3" stroke="#24644b" stroke-width="3"/><path d="M232,445 L603,445" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="420" y="412" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">duct</text><text x="675" y="453" font-size="23" fill="#173f32" text-anchor="start" font-weight="normal">body surface / cavity</text><text x="500" y="564" font-size="24" fill="#173f32" text-anchor="middle" font-weight="normal">Adrenal glands, pancreas and testes all have endocrine tissue.</text></g></svg>