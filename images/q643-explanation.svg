<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Red–green colour blindness is X-linked recessive</title><desc id="desc">Stylized sex chromosomes locate the recessive colour-blindness allele on X. An XY male has one X copy; an XX female needs recessive alleles on both X chromosomes in this model.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="53" font-size="30" text-anchor="start" font-weight="bold" fill="#173f32">Red–green colour blindness is X-linked recessive</text><text x="255" y="130" font-size="28" text-anchor="middle" font-weight="bold" fill="#173f32">Male XY</text><text x="745" y="130" font-size="28" text-anchor="middle" font-weight="bold" fill="#173f32">Female XX</text><path d="M188 175.0 Q212 290 188 405.0" fill="none" stroke="#24644b" stroke-width="9" stroke-linecap="round"/><path d="M212 175.0 Q188 290 212 405.0" fill="none" stroke="#24644b" stroke-width="9" stroke-linecap="round"/><circle cx="192" cy="245" r="10" fill="#b15f52" stroke="#b15f52" stroke-width="0"/><path d="M313 250.0 Q337 315 313 380.0" fill="none" stroke="#537c9a" stroke-width="9" stroke-linecap="round"/><path d="M337 250.0 Q313 315 337 380.0" fill="none" stroke="#537c9a" stroke-width="9" stroke-linecap="round"/><path d="M673 175.0 Q697 290 673 405.0" fill="none" stroke="#24644b" stroke-width="9" stroke-linecap="round"/><path d="M697 175.0 Q673 290 697 405.0" fill="none" stroke="#24644b" stroke-width="9" stroke-linecap="round"/><path d="M793 175.0 Q817 290 793 405.0" fill="none" stroke="#24644b" stroke-width="9" stroke-linecap="round"/><path d="M817 175.0 Q793 290 817 405.0" fill="none" stroke="#24644b" stroke-width="9" stroke-linecap="round"/><circle cx="677" cy="245" r="10" fill="#b15f52" stroke="#b15f52" stroke-width="0"/><circle cx="797" cy="245" r="10" fill="#b15f52" stroke="#b15f52" stroke-width="0"/><text x="200" y="448" font-size="28" text-anchor="middle" font-weight="bold" fill="#173f32">X</text><text x="325" y="448" font-size="28" text-anchor="middle" font-weight="bold" fill="#173f32">Y</text><text x="685" y="448" font-size="28" text-anchor="middle" font-weight="bold" fill="#173f32">X</text><text x="805" y="448" font-size="28" text-anchor="middle" font-weight="bold" fill="#173f32">X</text><text x="255" y="492" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">One recessive X allele</text><text x="745" y="492" font-size="23" text-anchor="middle" font-weight="normal" fill="#173f32">Two recessive X alleles</text><text x="495" y="198" font-size="23" text-anchor="middle" font-weight="bold" fill="#173f32">Recessive allele</text><path d="M423 211 L210 243" fill="none" stroke="#b15f52" stroke-width="2" marker-end="url(#arrow)"/><path d="M570 211 L665 243" fill="none" stroke="#b15f52" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="548" font-size="24" text-anchor="middle" font-weight="bold" fill="#173f32">The gene is on X, so answer A is correct.</text><text x="500" y="581" font-size="21" text-anchor="middle" font-weight="normal" fill="#173f32">This model explains why males are more often affected.</text></g></svg>