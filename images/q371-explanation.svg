<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Compare treatments within each exercise group</title><desc id="desc">In both the no-exercise and exercise groups, the increase in arm muscle surface area with testosterone is greater than with placebo. Compare treatments while keeping exercise condition fixed. The diagram is a qualitative comparison, not replacement measured data.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L8 3 Z" fill="#245c43"/></marker></defs>
<rect width="1000" height="600" rx="24" fill="#fbf8ec"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="42" y="58" font-size="32" text-anchor="start" fill="#173f31" font-weight="bold">Compare treatments within each exercise group</text><rect x="55" y="120" width="425" height="320" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="267" y="165" font-size="29" text-anchor="middle" fill="#173f31" font-weight="bold">No exercise</text><rect x="520" y="120" width="425" height="320" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="732" y="165" font-size="29" text-anchor="middle" fill="#173f31" font-weight="bold">Exercise</text><text x="87" y="235" font-size="26" text-anchor="start" fill="#173f31" font-weight="bold">Testosterone</text><text x="267" y="295" font-size="49" text-anchor="middle" fill="#173f31" font-weight="bold">&gt;</text><text x="87" y="354" font-size="26" text-anchor="start" fill="#173f31" font-weight="normal">Placebo</text><text x="265" y="405" font-size="22" text-anchor="middle" fill="#4b6657" font-weight="normal">Compare within this group</text><text x="552" y="235" font-size="26" text-anchor="start" fill="#173f31" font-weight="bold">Testosterone</text><text x="732" y="295" font-size="49" text-anchor="middle" fill="#173f31" font-weight="bold">&gt;</text><text x="552" y="354" font-size="26" text-anchor="start" fill="#173f31" font-weight="normal">Placebo</text><text x="730" y="405" font-size="22" text-anchor="middle" fill="#4b6657" font-weight="normal">Compare within this group</text><rect x="90" y="485" width="820" height="75" rx="18" fill="#e5efdf" stroke="#245c43" stroke-width="2"/><text x="500" y="517" font-size="25" text-anchor="middle" fill="#173f31" font-weight="normal">Both comparisons support a greater muscle-area increase</text><text x="500" y="549" font-size="25" text-anchor="middle" fill="#173f31" font-weight="normal">with testosterone in this study.</text></g></svg>