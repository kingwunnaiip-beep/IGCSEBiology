<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">What is the magnification of the onion cell?</title><desc id="desc">Image length: 60 mm = 60 000 µm; Actual length: 150 µm; Magnification = 60 000 ÷ 150: ×400</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">What is the magnification of the onion cell?</text><rect x="30" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><circle cx="60" cy="160" r="16" fill="#285d4c"/><text x="60" y="166" text-anchor="middle" font-size="18" fill="white">1</text><text x="50" y="207" font-size="23" font-weight="700">Image length</text><text x="50" y="285" font-size="21" font-weight="400">60 mm = 60 000 µm</text><text x="361" y="255" font-size="30" font-weight="700" text-anchor="middle" fill="#193e34">÷</text><rect x="385" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><circle cx="415" cy="160" r="16" fill="#285d4c"/><text x="415" y="166" text-anchor="middle" font-size="18" fill="white">2</text><text x="405" y="207" font-size="23" font-weight="700">Actual length</text><text x="405" y="285" font-size="21" font-weight="400">150 µm</text><text x="716" y="255" font-size="30" font-weight="700" text-anchor="middle" fill="#193e34">=</text><rect x="740" y="130" width="310" height="235" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><circle cx="770" cy="160" r="16" fill="#285d4c"/><text x="770" y="166" text-anchor="middle" font-size="18" fill="white">3</text><text x="760" y="207" font-size="23" font-weight="700">Magnification = 60 000</text><text x="760" y="236" font-size="23" font-weight="700">÷ 150</