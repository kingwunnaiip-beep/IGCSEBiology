<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Neurotransmitters carry the signal across a synapse</title><desc id="desc">A presynaptic ending contains transmitter-filled vesicles. Molecules release, diffuse across the synaptic gap, bind receptors on the next neurone and trigger a new impulse.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="54" font-size="30" text-anchor="start" fill="#173f32" font-weight="bold">Neurotransmitters carry the signal across a synapse</text><path d="M70 130 L430 130 L430 190 Q550 260 470 350 Q250 400 120 350 Q40 300 140 220 L140 130" fill="#e4edf1" stroke="#537c9a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="90" y="445" width="820" height="90" rx="15" fill="#e8ecda" stroke="#24644b" stroke-width="4"/><path d="M90 445 L910 445" fill="none" stroke="#24644b" stroke-width="5"/><circle cx="210" cy="250" r="28" fill="white" stroke="#537c9a" stroke-width="3"/><circle cx="202" cy="250" r="5" fill="#b28298" stroke="#b28298" stroke-width="1"/><circle cx="216" cy="243" r="5" fill="#b28298" stroke="#b28298" stroke-width="1"/><circle cx="217" cy="258" r="5" fill="#b28298" stroke="#b28298" stroke-width="1"/><circle cx="310" cy="275" r="28" fill="white" stroke="#537c9a" stroke-width="3"/><circle cx="302" cy="275" r="5" fill="#b28298" stroke="#b28298" stroke-width="1"/><circle cx="316" cy="268" r="5" fill="#b28298" stroke="#b28298" stroke-width="1"/><circle cx="317" cy="283" r="5" fill="#b28298" stroke="#b28298" stroke-width="1"/><circle cx="400" cy="245" r="28" fill="white" stroke="#537c9a" stroke-width="3"/><circle cx="392" cy="245" r="5" fill="#b28298" stroke="#b28298" stroke-width="1"/><circle cx="406" cy="238" r="5" fill="#b28298" stroke="#b28298" stroke-width="1"/><circle cx="407" cy="253" r="5" fill="#b28298" stroke="#b28298" stroke-width="1"/><circle cx="430" cy="340" r="7" fill="#b28298" stroke="#b28298" stroke-width="1"/><circle cx="490" cy="380" r="7" fill="#b28298" stroke="#b28298" stroke-width="1"/><circle cx="540" cy="410" r="7" fill="#b28298" stroke="#b28298" stroke-width="1"/><circle cx="600" cy="420" r="7" fill="#b28298" stroke="#b28298" stroke-width="1"/><path d="M440 345 L525 410" fill="none" stroke="#b28298" stroke-width="3" marker-end="url(#arrow)"/><path d="M535 445 L535 425 L550 440 L565 425 L565 445" fill="none" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M625 445 L625 425 L640 440 L655 425 L655 445" fill="none" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M715 445 L715 425 L730 440 L745 425 L745 445" fill="none" stroke="#24644b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M755 490 L875 490" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><circle cx="190" cy="195" r="19" fill="#24644b" stroke="#24644b" stroke-width="3"/><text x="190" y="202" font-size="22" text-anchor="middle" fill="white" font-weight="bold">2</text><text x="240" y="190" font-size="24" text-anchor="start" fill="#173f32">Release</text><circle cx="600" cy="350" r="19" fill="#24644b" stroke="#24644b" stroke-width="3"/><text x="600" y="357" font-size="22" text-anchor="middle" fill="white" font-weight="bold">4</text><text x="650" y="355" font-size="24" text-anchor="start" fill="#173f32">Diffuse across gap</text><circle cx="665" cy="410" r="19" fill="#24644b" stroke="#24644b" stroke-width="3"/><text x="665" y="417" font-size="22" text-anchor="middle" fill="white" font-weight="bold">3</text><text x="750" y="410" font-size="23" text-anchor="start" fill="#173f32">Bind receptors</text><circle cx="680" cy="495" r="19" fill="#24644b" stroke="#24644b" stroke-width="3"/><text x="680" y="502" font-size="22" text-anchor="middle" fill="white" font-weight="bold">1</text><text x="480" y="580" font-size="26" text-anchor="middle" fill="#173f32" font-weight="bold">B: 2 → 4 → 3 → 1</text><text x="130" y="110" font-size="25" text-anchor="start" fill="#173f32">Presynaptic ending</text><text x="220" y="500" font-size="24" text-anchor="start" fill="#173f32">Next neurone</text></g></svg>