<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="q28-title q28-desc"><title id="q28-title">Light distance and photosynthesis</title><desc id="q28-desc">An aquatic plant at 20 centimetres from a lamp produces 12 oxygen bubbles per minute. A plant 10 centimetres from the same light is predicted to produce 48. Halving distance gives four times the intensity by the inverse square law, assuming a point source and light-limited photosynthesis.</desc><defs><marker id="q28-green-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#397359"/></marker><marker id="q28-blue-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3d79a0"/></marker><marker id="q28-red-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85c5e"/></marker><marker id="q28-gold-arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b88838"/></marker></defs><rect width="640" height="420" rx="20" fill="#f8faf6"/><g font-family="Arial, Helvetica, sans-serif"><text x="320" y="42" font-size="32" text-anchor="middle" fill="#223c35" font-weight="bold">Light distance and photosynthesis</text><path d="M 90 137 L 480 100 L 480 193 L 90 165 Z" stroke="none" stroke-width="0" fill="#f1e8c5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="70" cy="151" r="23" fill="#e9cf7e" stroke="#b88838" stroke-width="3"/><rect x="55" y="174" width="30" height="13" rx="3" fill="#b88838" stroke="none" stroke-width="3"/><path d="M 59 194 H 81" stroke="#b88838" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 484 108 V 185 Q 510 216 536 185 V 108" stroke="#3d79a0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="489" y="144" width="42" height="48" rx="4" fill="#dcecf4" stroke="none" stroke-width="3"/><path d="M 510 190 V 150" stroke="#397359" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 510 155 l -14 -12" stroke="#397359" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 510 165 l 14 -12" stroke="#397359" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 510 175 l -14 -12" stroke="#397359" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="515" cy="133" r="5" fill="#f8faf6" stroke="#3d79a0" stroke-width="2"/><circle cx="515" cy="117" r="4" fill="#f8faf6" stroke="#3d79a0" stroke-width="2"/><circle cx="515" cy="102" r="3" fill="#f8faf6" stroke="#3d79a0" stroke-width="2"/><path d="M 90 288 L 260 251 L 260 344 L 90 316 Z" stroke="none" stroke-width="0" fill="#f1e8c5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="70" cy="302" r="23" fill="#e9cf7e" stroke="#b88838" stroke-width="3"/><rect x="55" y="325" width="30" height="13" rx="3" fill="#b88838" stroke="none" stroke-width="3"/><path d="M 59 345 H 81" stroke="#b88838" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 264 259 V 336 Q 290 367 316 336 V 259" stroke="#3d79a0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="269" y="295" width="42" height="48" rx="4" fill="#dcecf4" stroke="none" stroke-width="3"/><path d="M 290 341 V 301" stroke="#397359" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 290 306 l -14 -12" stroke="#397359" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 290 316 l 14 -12" stroke="#397359" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 290 326 l -14 -12" stroke="#397359" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="295" cy="284" r="5" fill="#f8faf6" stroke="#3d79a0" stroke-width="2"/><circle cx="295" cy="268" r="4" fill="#f8faf6" stroke="#3d79a0" stroke-width="2"/><circle cx="295" cy="253" r="3" fill="#f8faf6" stroke="#3d79a0" stroke-width="2"/><text x="323" y="117" font-size="28" text-anchor="middle" fill="#223c35" font-weight="bold">12 bubbles/min</text><path d="M 101 218 H 488" stroke="#b88838" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#q28-gold-arrow)"/><text x="295" y="205" font-size="28" text-anchor="middle" fill="#223c35" font-weight="normal">20 cm</text><text x="471" y="302" font-size="28" text-anchor="middle" fill="#223c35" font-weight="bold">48 bubbles/min</text><path d="M 101 366 H 268" stroke="#b88838" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#q28-gold-arrow)"/><text x="188" y="353" font-size="28" text-anchor="middle" fill="#223c35" font-weight="normal">10 cm</text><text x="320" y="410" font-size="28" text-anchor="middle" fill="#223c35" font-weight="normal">(20 / 10)² = 4; 12 × 4 = 48</text></g></svg>