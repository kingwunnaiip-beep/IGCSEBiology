<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Use all diabetes cases as the denominator</title><desc id="desc">An age-17 stacked bar contains about 220 type-1 and 100 type-2 cases per 100000 children; a pie highlights the 100 out of 320 type-2 fraction.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker><marker id="bluearrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#537c9a" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="40" y="45" font-size="28" fill="#173f32" text-anchor="start" font-weight="bold">Use all diabetes cases as the denominator</text><text x="500" y="555" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">100 ÷ (220 + 100) × 100 = 31.25%, which rounds to 31.3%.</text><path d="M145 470 L440 470" fill="none" stroke="#173f32" stroke-width="3" /><path d="M145 470 L145 125" fill="none" stroke="#173f32" stroke-width="3" /><text x="50" y="112" font-size="22" fill="#173f32" text-anchor="start" font-weight="normal">Cases per 100 000</text><path d="M138 470 L145 470" fill="none" stroke="#173f32" stroke-width="2" /><text x="125" y="477" font-size="20" fill="#173f32" text-anchor="end" font-weight="normal">0</text><path d="M138 370 L145 370" fill="none" stroke="#173f32" stroke-width="2" /><text x="125" y="377" font-size="20" fill="#173f32" text-anchor="end" font-weight="normal">100</text><path d="M138 270 L145 270" fill="none" stroke="#173f32" stroke-width="2" /><text x="125" y="277" font-size="20" fill="#173f32" text-anchor="end" font-weight="normal">200</text><path d="M138 170 L145 170" fill="none" stroke="#173f32" stroke-width="2" /><text x="125" y="177" font-size="20" fill="#173f32" text-anchor="end" font-weight="normal">300</text><rect x="230" y="250" width="150" height="220" rx="0" fill="#e4f0df" stroke="#24644b" stroke-width="2"/><rect x="230" y="150" width="150" height="100" rx="0" fill="#537c9a" stroke="#537c9a" stroke-width="2"/><text x="305" y="207" font-size="27" fill="white" text-anchor="middle" font-weight="bold">100</text><text x="305" y="369" font-size="27" fill="#173f32" text-anchor="middle" font-weight="bold">220</text><text x="305" y="510" font-size="24" fill="#173f32" text-anchor="middle" font-weight="normal">Age 17</text><ellipse cx="720" cy="300" rx="145" ry="145" fill="#e4f0df" stroke="#24644b" stroke-width="3" /><path d="M720 300 L720 155 A145 145 0 0 1 853.9625322141366 355.489097692938 Z" fill="#537c9a" stroke="#537c9a" stroke-width="2" /><text x="720" y="120" font-size="24" fill="#173f32" text-anchor="middle" font-weight="bold">Of children with diabetes</text><text x="778" y="248" font-size="22" fill="white" text-anchor="middle" font-weight="normal">Type 2</text><text x="674" y="365" font-size="22" fill="#173f32" text-anchor="middle" font-weight="normal">Type 1</text><text x="720" y="493" font-size="24" fill="#173f32" text-anchor="middle" font-weight="normal">Type 2: 100 of 320 cases</text></g></svg>