<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1170" viewBox="0 0 1000 1170" role="img" aria-labelledby="q184-title q184-desc">
<title id="q184-title">184 · Mitotic index uses the whole sample</title>
<desc id="q184-desc">Answer A. Mitotic index is the number of cells dividing by mitosis divided by all cells in the sample, multiplied by 100. Sample X has 25 dividing and 55 non-dividing cells, 80 total, so its index is 31.25 percent, rounded to 31.3 percent. Sample Y has 15 dividing and 95 non-dividing cells, 110 total, so its index is approximately 13.6 percent. Source-derived proportional bars compare these fractions. X has the higher mitotic index and is the faster-growing tissue in the question comparison.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
