<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="810" viewBox="0 0 1000 810" role="img" aria-labelledby="q243-title q243-desc">
<title id="q243-title">At pH 5.0, survival does not mean reproduction</title>
<desc id="q243-desc">Interpretation of the source table at pH 5.0, not new experimental data. Trout survive; sea bass do not survive; perch survive; fish eggs do not survive. The surviving trout and perch produce no offspring because the eggs do not survive. Original answer C.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
