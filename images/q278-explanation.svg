" stroke="#25614b" stroke-width="1"/><ellipse cx="315" cy="388" rx="10" ry="6" fill="#25614b" stroke="#25614b" stroke-width="1"/><ellipse cx="350" cy="370" rx="10" ry="6" fill="#25614b" stroke="#25614b" stroke-width="1"/><ellipse cx="615" cy="375" rx="78" ry="40" fill="#ffffff" stroke="#25614b" stroke-width="2"/><ellipse cx="580" cy="368" rx="10" ry="6" fill="#25614b" stroke="#25614b" stroke-width="1"/><ellipse cx="615" cy="388" rx="10" ry="6" fill="#25614b" stroke="#25614b" stroke-width="1"/><ellipse cx="650" cy="370" rx="10" ry="6" fill="#25614b" stroke="#25614b" stroke-width="1"/><line x1="90" y1="485" x2="90" y2="340" stroke="#357ca2" stroke-width="5"/><polygon points="90,340 96.92668763312224,353.3049238416893 83.07331236687776,353.3049238416893" fill="#357ca2"/><line x1="90" y1="340" x2="310" y2="340" stroke="#357ca2" stroke-width="5"/><polygon points="310,340 296.6950761583107,346.92668763312224 296.6950761583107,333.07331236687776" fill="#357ca2"/><text x="116" y="474" font-size="25" fill="#357ca2" font-weight="400" text-anchor="start" >CO₂ through air spaces (1)</text><circle cx="900" cy="315" r="57" fill="#d9ebf6" stroke="#357ca2" stroke-width="3"/><text x="900" y="324" font-size="24" fill="#357ca2" font-weight="700" text-anchor="middle" >Xylem</text><line x1="836" y1="315" x2="745" y2="315" stroke="#357ca2" stroke-width="5"/><polygon points="745,315 758.3049238416893,308.07331236687776 758.3049238416893,321.92668763312224" fill="#357ca2"/><text x="755" y="397" font-size="25" fill="#357ca2" font-weight="400" text-anchor="start" >Water (4)</text><path d="M 630 258 L 600 230 L 630 205" fill="none" stroke="#25614b" stroke-width="3"/><text x="640" y="211" font-size="25" fill="#25614b" font-weight="400" text-anchor="start" >Chloroplasts (2)</text><text x="100" y="545" font-size="27" fill="#173d31" font-weight="400" text-anchor="start" >1  Air spaces allow carbon dioxide to reach mesophyll cells.</text><text x="100" y="585" font-size="27" fill="#173d31" font-weight="400" text-anchor="start" >2  Chloroplasts absorb light energy.</text><text x="100" y="625" font-size="27" fill="#173d31" font-weight="400" text-anchor="start" >4  Nearby xylem supplies water for photosynthesis.</text><text x="550" y="686" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Feature 3 helps defend the plant against insects.</text><rect x="24" y="704" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="738" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Features 1, 2 and 4 provide the photosynthetic adaptations.</text>
</g></svg>