<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">An antibody binding site complements an antigen</title><desc id="desc">A bacterium carries convex surface antigens labelled X. A magnified membrane projection is shown fitting into a concave antibody binding site. The antibody is labelled Y and remains a distinct immune-system protein. Names and matching shape identify row A.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#24644b" stroke-width="1.8"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#537c9a" stroke-width="1.8"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#b85c50" stroke-width="1.8"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="38" y="54" font-size="30" fill="#173f32" font-weight="bold">An antibody binding site complements an antigen</text><rect x="88" y="224" width="327" height="188" rx="82" fill="#e4f0df" stroke="#24644b" stroke-width="4" /><path d="M148 224 Q163 175 178 224" fill="#d1a350" stroke="#b85c50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M148 412 Q163 461 178 412" fill="#d1a350" stroke="#b85c50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M243 224 Q258 175 273 224" fill="#d1a350" stroke="#b85c50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M243 412 Q258 461 273 412" fill="#d1a350" stroke="#b85c50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M333 224 Q348 175 363 224" fill="#d1a350" stroke="#b85c50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M333 412 Q348 461 363 412" fill="#d1a350" stroke="#b85c50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M88 287 Q43 308 88 329 M415 287 Q460 308 415 329" fill="#d1a350" stroke="#b85c50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M165 311 q31 -41 57 0 t57 0 t57 0" fill="none" stroke="#24644b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="115" y="143" font-size="25" text-anchor="start" fill="#173f32" font-weight="bold">X · Surface antigen</text><line x1="258" y1="155" x2="258" y2="194" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><path d="M598 167 H620 Q650 228 680 167 H878" fill="none" stroke="#24644b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M620 167 Q650 228 680 167" fill="#d1a350" stroke="#b85c50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M621 213 Q650 255 679 213 M651 244 L715 331 L779 244 M715 331 V447" fill="none" stroke="#537c9a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" /><path d="M749 212 Q779 253 809 212" fill="none" stroke="#537c9a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" /><line x1="448" y1="265" x2="579" y2="204" stroke="#8b948b" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><line x1="448" y1="349" x2="580" y2="252" stroke="#8b948b" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><text x="714" y="124" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">Magnified matching surfaces</text><text x="789" y="362" font-size="25" text-anchor="start" fill="#173f32" font-weight="bold">Y · Antibody</text><line x1="798" y1="376" x2="735" y2="401" stroke="#24644b" stroke-width="2" stroke-linecap="round" /><text x="715" y="478" font-size="23" text-anchor="middle" fill="#173f32" font-weight="normal">Concave binding site fits</text><text x="715" y="507" font-size="23" text-anchor="middle" fill="#173f32" font-weight="normal">the convex antigen.</text><text x="500" y="558" font-size="24" text-anchor="middle" fill="#173f32" font-weight="bold">A · X is antigen; Y is antibody; their binding surfaces are complementary.</text></g></svg>
