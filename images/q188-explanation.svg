<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1240" viewBox="0 0 1000 1240" role="img" aria-labelledby="q188-title q188-desc">
<title id="q188-title">188 · Put IVF events in chronological order</title>
<desc id="q188-desc">Answer B, sequence 2 then 4 then 1 then 3. The source statement numbers remain attached to their original events: statement 1 is egg fertilisation, 2 is egg removal from an ovary, 3 is the embryo being implanted into the uterus and 4 is sperm addition. In chronological order an egg is collected, sperm added, fertilisation occurs outside the body and the embryo is transferred to the uterus where it can implant. The diagram is a process model with no measured timings.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1000" height="1240" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="500.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >188 · Put IVF events in chronological order</text><text x="500" y="112" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Use the source numbers; do not renumber the statements.</text><rect x="65" y="170" width="870" height="164" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="212" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >2 · Collect the egg</text><text x="500.0" y="256" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The egg cell is removed from an ovary.</text><line x1="500" y1="345" x2="500" y2="381" stroke="#25614b" stroke-width="4"/><polygon points="500,381 493.07331236687776,367.6950761583107 506.92668763312224,367.6950761583107" fill="#25614b"/><rect x="65" y="395" width="870" height="164" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="437" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >4 · Add sperm</text><text x="500.0" y="481" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >Sperm cells are added to the collected egg.</text><line x1="500" y1="570" x2="500" y2="606" stroke="#25614b" stroke-width="4"/><polygon points="500,606 493.07331236687776,592.6950761583107 506.92668763312224,592.6950761583107" fill="#25614b"/><rect x="65" y="620" width="870" height="164" rx="12" fill="#edf5f8" stroke="#357ca2" stroke-width="2"/><text x="500.0" y="662" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >1 · Fertilisation occurs</text><text x="500.0" y="706" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >The sperm and egg nuclei fuse outside the body.</text><line x1="500" y1="795" x2="500" y2="831" stroke="#25614b" stroke-width="4"/><polygon points="500,831 493.07331236687776,817.6950761583107 506.92668763312224,817.6950761583107" fill="#25614b"/><rect x="65" y="845" width="870" height="164" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="887" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >3 · Transfer the embryo</text><text x="500.0" y="931" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >It is placed in the uterus, where it can implant.</text><text x="500" y="1113" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Fertilisation comes before embryo transfer and implantation.</text><rect x="24" y="1164" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1198" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer B · 2 → 4 → 1 → 3</text>
</g></svg>