<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1180" viewBox="0 0 1000 1180" role="img" aria-labelledby="q161-title q161-desc">
<title id="q161-title">161 · Root hairs absorb mineral ions</title>
<desc id="q161-desc">Answer D: structure P is the cell membrane, and cell R is a root hair cell adapted for mineral ion uptake. An original qualitative root hair schematic shows an outer cell wall and a thinner membrane just inside it, with leaders ending on the correct boundaries. The long extension increases surface area. Mineral ions may enter against their concentration gradient by active transport, using energy from respiration. The other source cell has cilia, which move material along a surface. The schematic is not to scale and does not depict measured ion concentrations.</desc>
