<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="q03-title q03-desc">
<title id="q03-title">Order the groups by leg number</title>
<desc id="q03-desc">Textbook comparison: myriapods have many pairs of legs, typical decapod crustaceans have five pairs including claws, arachnids have four pairs and insects have three pairs. Counts shown are group examples, not a claim that every crustacean has exactly ten legs.</desc>
