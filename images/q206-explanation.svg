<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1210" viewBox="0 0 1000 1210" role="img" aria-labelledby="q206-title q206-desc">
<title id="q206-title">206 · Mutation can form a new allele</title>
<desc id="q206-desc">Answer B, mutation. An allele is an alternative form of a gene. An illustrative single DNA-strand segment A C G T A C changes to A C C T A C at one position; G is replaced by C. This invented example illustrates a DNA sequence change that can form a new allele. It is not a sequence from the source question and no strand direction is assigned. Selection changes allele frequencies; sexual reproduction combines parental alleles. A new allele does not necessarily cause a visible trait change. The base symbols and model are qualitative.</desc>
