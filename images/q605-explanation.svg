<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">Which characteristics are demonstrated by the germinating seed?</title><desc id="desc">Germination demonstrates growth as size increases, and sensitivity as root and shoot growth respond to environmental stimuli. These are parallel characteristics.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#35735e" /></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8" /><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700">Which characteristics are demonstrated by the germinating</text><text x="38" y="73" font-size="24" font-weight="700">seed?</text><text x="38" y="406" font-size="17" font-weight="400">IGCSE Biology 0610 • Explanation diagram • Not to scale</text><rect x="300" y="110" width="480" height="90" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="540" y="145" font-size="23" font-weight="700" text-anchor="middle">Germinating seedling</text><text x="540" y="178" font-size="21" font-weight="400" text-anchor="middle">Two characteristics are demonstrated</text><path d="M540 200 V220 H280 V243" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)" /><path d="M540 220 H800 V243" fill="none" stroke="#35735e" stroke-width="3" marker-end="url(#arrow)" /><rect x="40" y="245" width="480" height="115" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="280" y="282" font-size="24" font-weight="700" text-anchor="middle">Growth</text><text x="280" y="318" font-size="21" font-weight="400" text-anchor="middle">Roots and shoot develop; size increases</text><rect x="560" y="245" width="480" height="115" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2" /><text x="800" y="282" font-size="24" font-weight="700" text-anchor="middle">Sensitivity</text><text x="800" y="318" font-size="21" font-weight="400" text-anchor="middle">Root down; shoot up in response</text><text x="800" y="345" font-size="21" font-weight="400" text-anchor="middle">to environmental stimuli</text></g></svg>