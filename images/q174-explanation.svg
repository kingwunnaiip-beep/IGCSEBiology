"2"/><line x1="360" y1="605" x2="360" y2="818" stroke="#25614b" stroke-width="2"/><line x1="630" y1="605" x2="630" y2="818" stroke="#25614b" stroke-width="2"/><line x1="900" y1="605" x2="900" y2="818" stroke="#25614b" stroke-width="2"/><line x1="100" y1="702" x2="900" y2="702" stroke="#25614b" stroke-width="2"/><text x="230" y="666" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Molecule</text><text x="495" y="646" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Small</text><text x="495" y="680" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >intestine</text><text x="765" y="666" font-size="26" fill="#173d31" font-weight="700" text-anchor="middle" >Colon</text><text x="230" y="773" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Water</text><text x="495" y="773" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Absorbed</text><text x="765" y="773" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Absorbed</text><text x="500" y="865" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative route; arrows do not measure absorption rates.</text><rect x="24" y="934" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="968" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer D · Water · Absorbed in small intestine and colon</text>
