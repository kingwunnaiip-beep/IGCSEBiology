<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1320" viewBox="0 0 1000 1320" role="img" aria-labelledby="q85-title q85-desc">
<title id="q85-title">85 · Pollution begins before oxygen reaches its minimum</title>
<desc id="q85-desc">Answer A. A qualitative graph against distance downstream shows solid dissolved oxygen initially high, beginning to fall around A, reaching its minimum near C and recovering farther downstream. Dashed bacterial abundance is initially low, rises to a peak around C and later falls. B lies where depletion is already underway; D lies in the recovery region. No numerical distance, time or concentration is implied. Fertiliser supplies nutrients that promote algae, leading to reduced light, plant and algal death, decomposition and increased oxygen consumption by aerobic respiration. The graph identifies A as the intended pollution-entry location, rather than the point of greatest oxygen depletion.</desc>
