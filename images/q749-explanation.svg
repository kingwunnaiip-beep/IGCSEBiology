<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Semilunar valves guard the two ventricular outlets</title><desc id="desc">A simplified heart drawing has two ventricular outflow arteries. W and X identify the crescent-like valve cusps at their bases, with arrows showing allowed outflow.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24644b" stroke-width="2"/></marker></defs><rect width="1000" height="600" fill="#fbf8eb"/><g font-family="Arial, sans-serif"><text x="35" y="49" font-size="30" fill="#173f32" text-anchor="start" font-weight="700">Semilunar valves guard the two ventricular outlets</text><path d="M220 230 C130 120 65 250 165 375 L400 500 L635 375 C735 250 670 120 580 230 Q400 390 220 230 Z" fill="#e4b7a9" stroke="#c5824b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M400 325 V490" fill="none" stroke="#c5824b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 320 V130 H315 V345 M490 345 V130 H565 V320" fill="#e4edf0" stroke="#537c9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M241 290 Q262 275 277 315 Q292 275 313 290" fill="#e4f0df" stroke="#24644b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M277 250 V165" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><path d="M491 290 Q512 275 527 315 Q542 275 563 290" fill="#e4f0df" stroke="#24644b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M527 250 V165" fill="none" stroke="#24644b" stroke-width="4" marker-end="url(#arrow)"/><text x="245" y="410" font-size="21" fill="#173f32" text-anchor="middle" font-weight="700">Right ventricle</text><text x="545" y="410" font-size="21" fill="#173f32" text-anchor="middle" font-weight="700">Left ventricle</text><text x="278" y="95" font-size="25" fill="#173f32" text-anchor="middle" font-weight="700">Pulmonary artery</text><text x="528" y="95" font-size="26" fill="#173f32" text-anchor="middle" font-weight="700">Aorta</text><text x="80" y="300" font-size="33" fill="#173f32" text-anchor="middle" font-weight="700">W</text><path d="M110 295 L238 294" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="720" y="300" font-size="33" fill="#173f32" text-anchor="middle" font-weight="700">X</text><path d="M690 295 L566 294" fill="none" stroke="#24644b" stroke-width="3" marker-end="url(#arrow)"/><text x="400" y="535" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">Semilunar valves prevent blood flowing back into the ventricles.</text><text x="500" y="565" font-size="24" fill="#173f32" text-anchor="middle" font-weight="700">A: W and X  •  simplified arrangement, not to scale</text></g></svg>