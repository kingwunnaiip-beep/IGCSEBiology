"middle" >1 · True: close to stomata for gas exchange</text><text x="500.0" y="949" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >CO₂ and oxygen diffuse through internal air spaces.</text><rect x="75" y="1021" width="850" height="125" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="1062" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >2 · False: both layers contain chloroplasts</text><text x="500.0" y="1105" font-size="25" fill="#173d31" font-weight="400" text-anchor="middle" >3 · True: palisade is more densely packed.</text><text x="500" y="1213" font-size="24" fill="#526c62" font-weight="400" text-anchor="middle" >Simplified leaf section; no measured cell sizes or counts are implied.</text><rect x="24" y="1284" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1318" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · Statements 1 and 3</text>
