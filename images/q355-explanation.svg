<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" role="img" aria-labelledby="title desc"><title id="title">Carrier number sets transport capacity</title><desc id="desc">Two root-hair-cell membranes at equal high ion concentration. Plant X has five drawn carriers and five uptake arrows; plant Y has two. The numbers are illustrative, not measurements. Fewer carriers give lower maximum uptake.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#276b46"/></marker></defs><rect width="1000" height="570" rx="20" fill="#fbfaf0"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="53" fill="#203e33" font-size="30" font-weight="bold" text-anchor="start">Carrier number sets transport capacity</text><text x="40" y="95" fill="#203e33" font-size="22" font-weight="normal" text-anchor="start">At high ion concentration, carrier availability can limit uptake.</text><rect x="40" y="125" width="435" height="330" rx="14" fill="#f2f5e8" stroke="#276b46" stroke-width="2"/><text x="257" y="162" fill="#203e33" font-size="25" font-weight="bold" text-anchor="middle">Plant X: more carriers</text><text x="60" y="200" fill="#65776d" font-size="18" font-weight="normal" text-anchor="start">Outside root hair cell</text><path d="M58 270 L457 270" fill="none" stroke="#276b46" stroke-width="12"/><path d="M58 292 L457 292" fill="none" stroke="#276b46" stroke-width="12"/><circle cx="80" cy="225" r="7" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="129" cy="225" r="7" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="178" cy="225" r="7" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="227" cy="225" r="7" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="276" cy="225" r="7" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="325" cy="225" r="7" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="374" cy="225" r="7" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="423" cy="225" r="7" fill="#d7a542" stroke="#276b46" stroke-width="2"/><rect x="82.0" y="255" width="26" height="54" rx="4" fill="#f5f0cc" stroke="#276b46" stroke-width="2"/><path d="M95.0 310 L95.0 355" fill="none" stroke="#276b46" stroke-width="3" marker-end="url(#arrow)"/><rect x="163.25" y="255" width="26" height="54" rx="4" fill="#f5f0cc" stroke="#276b46" stroke-width="2"/><path d="M176.25 310 L176.25 355" fill="none" stroke="#276b46" stroke-width="3" marker-end="url(#arrow)"/><rect x="244.5" y="255" width="26" height="54" rx="4" fill="#f5f0cc" stroke="#276b46" stroke-width="2"/><path d="M257.5 310 L257.5 355" fill="none" stroke="#276b46" stroke-width="3" marker-end="url(#arrow)"/><rect x="325.75" y="255" width="26" height="54" rx="4" fill="#f5f0cc" stroke="#276b46" stroke-width="2"/><path d="M338.75 310 L338.75 355" fill="none" stroke="#276b46" stroke-width="3" marker-end="url(#arrow)"/><rect x="407.0" y="255" width="26" height="54" rx="4" fill="#f5f0cc" stroke="#276b46" stroke-width="2"/><path d="M420.0 310 L420.0 355" fill="none" stroke="#276b46" stroke-width="3" marker-end="url(#arrow)"/><text x="257" y="393" fill="#203e33" font-size="18" font-weight="normal" text-anchor="middle">Ion movement into the cell</text><text x="257" y="430" fill="#203e33" font-size="25" font-weight="bold" text-anchor="middle">Higher capacity</text><rect x="525" y="125" width="435" height="330" rx="14" fill="#f2f5e8" stroke="#276b46" stroke-width="2"/><text x="742" y="162" fill="#203e33" font-size="25" font-weight="bold" text-anchor="middle">Plant Y: fewer carriers</text><text x="545" y="200" fill="#65776d" font-size="18" font-weight="normal" text-anchor="start">Outside root hair cell</text><path d="M543 270 L942 270" fill="none" stroke="#276b46" stroke-width="12"/><path d="M543 292 L942 292" fill="none" stroke="#276b46" stroke-width="12"/><circle cx="565" cy="225" r="7" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="614" cy="225" r="7" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="663" cy="225" r="7" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="712" cy="225" r="7" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="761" cy="225" r="7" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="810" cy="225" r="7" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="859" cy="225" r="7" fill="#d7a542" stroke="#276b46" stroke-width="2"/><circle cx="908" cy="225" r="7" fill="#d7a542" stroke="#276b46" stroke-width="2"/><rect x="567.0" y="255" width="26" height="54" rx="4" fill="#f5f0cc" stroke="#276b46" stroke-width="2"/><path d="M580.0 310 L580.0 355" fill="none" stroke="#276b46" stroke-width="3" marker-end="url(#arrow)"/><rect x="892.0" y="255" width="26" height="54" rx="4" fill="#f5f0cc" stroke="#276b46" stroke-width="2"/><path d="M905.0 310 L905.0 355" fill="none" stroke="#276b46" stroke-width="3" marker-end="url(#arrow)"/><text x="742" y="393" fill="#203e33" font-size="18" font-weight="normal" text-anchor="middle">Ion movement into the cell</text><text x="742" y="430" fill="#203e33" font-size="25" font-weight="bold" text-anchor="middle">Lower capacity</text><text x="40" y="502" fill="#203e33" font-size="24" font-weight="bold" text-anchor="start">More carriers can transport more ions per unit time.</text><text x="40" y="548" fill="#65776d" font-size="16" font-weight="normal" text-anchor="start">Original teaching schematic • diagrams are not to scale</text></g></svg>