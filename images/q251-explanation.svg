<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750" role="img" aria-labelledby="q251-title q251-desc">
<title id="q251-title">X is the lungs; Y is the body cells</title>
<desc id="q251-desc">Oxygen from inspired air passes through the lungs X into the blood and then into body cells Y, where aerobic respiration uses it. Carbon dioxide produced by respiration moves from body cells into the blood, then through the lungs to expired air. Arrows show gas transfer, not an anatomical blood-circulation map.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="750" rx="24" fill="#fffdf7" stroke="none" stroke-width="2"/><text x="550.0" y="52" font-size="30" fill="#173d31" font-weight="700" text-anchor="middle" >X is the lungs; Y is the body cells</text><text x="550" y="103" font-size="26" fill="#526c62" font-weight="400" text-anchor="middle" >Gas-transfer pathways; simplified, not to scale</text><rect x="45" y="245" width="225" height="215" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="157.5" y="286" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Air</text><rect x="280" y="245" width="225" height="215" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="392.5" y="286" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >X: lungs</text><rect x="545" y="245" width="225" height="215" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="657.5" y="286" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Blood</text><rect x="810" y="245" width="225" height="215" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="922.5" y="286" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Y: body cells</text><text x="550" y="177" font-size="28" fill="#357ca2" font-weight="700" text-anchor="middle" >Oxygen → to cells for aerobic respiration</text><line x1="180" y1="333" x2="360" y2="333" stroke="#357ca2" stroke-width="4"/><polygon points="360,333 346.6950761583107,339.92668763312224 346.6950761583107,326.07331236687776" fill="#357ca2"/><line x1="445" y1="333" x2="625" y2="333" stroke="#357ca2" stroke-width="4"/><polygon points="625,333 611.6950761583107,339.92668763312224 611.6950761583107,326.07331236687776" fill="#357ca2"/><line x1="710" y1="333" x2="890" y2="333" stroke="#357ca2" stroke-width="4"/><polygon points="890,333 876.6950761583107,339.92668763312224 876.6950761583107,326.07331236687776" fill="#357ca2"/><text x="550" y="537" font-size="28" fill="#173d31" font-weight="700" text-anchor="middle" >Carbon dioxide ← from respiration in cells</text><line x1="890" y1="406" x2="710" y2="406" stroke="#25614b" stroke-width="4"/><polygon points="710,406 723.3049238416893,399.07331236687776 723.3049238416893,412.92668763312224" fill="#25614b"/><line x1="625" y1="406" x2="445" y2="406" stroke="#25614b" stroke-width="4"/><polygon points="445,406 458.3049238416893,399.07331236687776 458.3049238416893,412.92668763312224" fill="#25614b"/><line x1="360" y1="406" x2="180" y2="406" stroke="#25614b" stroke-width="4"/><polygon points="180,406 193.30492384168926,399.07331236687776 193.30492384168926,412.92668763312224" fill="#25614b"/><text x="550" y="598" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Lungs exchange gases with the blood.</text><text x="550" y="638" font-size="27" fill="#173d31" font-weight="400" text-anchor="middle" >Body cells use oxygen and produce carbon dioxide.</text><rect x="24" y="674" width="1052" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="550.0" y="708" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >B — X: lungs; Y: body cells</text>
</g></svg>