<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">What values complete x, y and z in the respiration equation?</title><desc id="desc">Glucose is C6H12O6, giving x=12 and y=6. Carbon dioxide is CO2, giving z=2. The complete balanced aerobic-respiration equation is C6H12O6 + 6O2 → 6CO2 + 6H2O. Answer D.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#35735e"/></marker></defs><rect width="1080" height="430" rx="24" fill="#f3f5e8"/><g font-family="Arial, sans-serif" fill="#193e34"><text x="38" y="45" font-size="24" font-weight="700" text-anchor="start" fill="#193e34">What values complete x, y and z in the respiration equation?</text><rect x="30" y="125" width="495" height="125" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><rect x="555" y="125" width="495" height="125" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="277" y="163" font-size="27" font-weight="700" text-anchor="middle" fill="#193e34">Glucose: C₆H₁₂O₆</text><text x="277" y="214" font-size="25" font-weight="400" text-anchor="middle" fill="#193e34">x = 12 and y = 6</text><text x="802" y="163" font-size="27" font-weight="700" text-anchor="middle" fill="#193e34">Carbon dioxide: CO₂</text><text x="802" y="214" font-size="25" font-weight="400" text-anchor="middle" fill="#193e34">z = 2</text><rect x="30" y="280" width="1020" height="90" rx="18" fill="#fff" stroke="#9fbaab" stroke-width="2"/><text x="540" y="318" font-size="22" font-weight="700" text-anchor="middle" fill="#193e34">Balanced aerobic-respiration equation</text><text x="540" y="352" font-size="28" font-weight="400" text-anchor="middle" fill="#193e34">C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O</text><text x="38" y="406" font-size="17" font-weight="400" text-anchor="start" fill="#193e34">IGCSE Biology 0610 • Explanation diagram • Not to scale</text></g></svg>