<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-labelledby="q17-title q17-desc"><title id="q17-title">Glucose leaves a villus in blood; fats leave in lymph</title><desc id="q17-desc">In a villus, glucose enters the surrounding blood capillaries and leaves in blood vessel 4. Fatty acids enter the central lacteal, labelled 3, and travel through lymph.</desc><defs><marker id="a-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#25614b"/></marker><marker id="a-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#357ca2"/></marker><marker id="a-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b94a43"/></marker><marker id="a-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d5a545"/></marker></defs><rect width="640" height="460" rx="20" fill="#fffdf7"/><g font-family="Arial, Helvetica, sans-serif"><text x="320" y="43" font-size="32" fill="#173d31" text-anchor="middle" font-weight="700">Two routes out of a villus</text><path d="M229 366 V190 C229 78 405 78 405 190 V366" fill="#e8f1e5" stroke="#25614b" stroke-width="5"/><path d="M265 374 V206 C265 130 370 130 370 206 V374" fill="none" stroke="#b94a43" stroke-width="13"/><path d="M318 374 V200 Q318 174 333 174 Q348 174 348 200 V374" fill="#d6d58b" stroke="#25614b" stroke-width="5"/><text x="95" y="158" font-size="29" fill="#b94a43" text-anchor="middle" font-weight="700">Glucose</text><path d="M76 184 L245 217" fill="none" stroke="#b94a43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-r)"/><text x="526" y="236" font-size="28" fill="#25614b" text-anchor="middle" font-weight="700">Fatty acids</text><path d="M549 262 L357 284" fill="none" stroke="#d5a545" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-y)"/><path d="M265 282 L265 352" fill="none" stroke="#b94a43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-r)"/><path d="M333 292 L333 351" fill="none" stroke="#25614b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-g)"/><path d="M166 384 L263 350" fill="none" stroke="#b94a43" stroke-width="3"/><path d="M479 384 L337 355" fill="none" stroke="#25614b" stroke-width="3"/><text x="158" y="420" font-size="28" fill="#b94a43" text-anchor="middle" font-weight="700">4: Blood vessel</text><text x="486" y="420" font-size="28" fill="#25614b" text-anchor="middle" font-weight="700">3: Lacteal</text></g></svg>