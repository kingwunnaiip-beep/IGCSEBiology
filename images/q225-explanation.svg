8" stroke="#25614b" stroke-width="2"/><text x="200.0" y="731" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Hormone</text><text x="200.0" y="774" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Made in the body;</text><text x="200.0" y="811" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >acts on target tissues</text><rect x="365" y="690" width="270" height="169" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="500.0" y="731" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Enzyme</text><text x="500.0" y="774" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Catalyses chemical</text><text x="500.0" y="811" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >reactions</text><rect x="665" y="690" width="270" height="169" rx="12" fill="#eff5e8" stroke="#25614b" stroke-width="2"/><text x="800.0" y="731" font-size="27" fill="#173d31" font-weight="700" text-anchor="middle" >Homeostasis</text><text x="800.0" y="774" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >Maintains a stable</text><text x="800.0" y="811" font-size="24" fill="#173d31" font-weight="400" text-anchor="middle" >internal environment</text><text x="500" y="913" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >Qualitative definition model; no dose or measured effect.</text><text x="500" y="951" font-size="25" fill="#526c62" font-weight="400" text-anchor="middle" >“Drug” is broader than “medicine”.</text><rect x="24" y="1004" width="952" height="52" rx="12" fill="#eff5e8" stroke="none" stroke-width="2"/><text x="500.0" y="1038" font-size="25" fill="#173d31" font-weight="700" text-anchor="middle" >Answer C · Taken into the body; affects chemical reactions</text>
