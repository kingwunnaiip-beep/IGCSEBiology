<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1420" viewBox="0 0 1000 1420" role="img" aria-labelledby="q90-title q90-desc">
<title id="q90-title">90 · Expired air has less oxygen and more carbon dioxide</title>
<desc id="q90-desc">Answer C: expired air contains approximately 16 percent oxygen and 4 percent carbon dioxide. A common 0 to 25 percent by-volume axis is used for all four bars. Inspired oxygen is 21 percent and expired oxygen 16 percent; inspired carbon dioxide is 0.04 percent and expired carbon dioxide 4 percent. The 0.04 percent bar is intentionally tiny and to scale. Oxygen decreases by 5 percentage points; carbon dioxide increases by 3.96 percentage points. A schematic alveolus and capillary show oxygen diffusing from alveolar air to blood and carbon dioxide diffusing from blood to alveolar air. These are approximate mixed expired-air values, which vary with breathing and activity, rather than a claim about pure alveolar air.</desc>
